# Instrument, not a test: generated programs and their reference outputs, read once into
# the stage-fault reading beside it. It belongs to no layer.
id = "cc-eval-prelim.C-gen-prefix"
order = 996
tier = "fast"
tags = ["probe"]
desc = "A generated program output under each pipeline prefix, against the reference output the model computes: the archive differential test, first half, on this tip."

[defaults]
kind = "behavior"
expect_exit = 0
timeout_ms = 20000
normalizers = ["strip_ansi", "normalize_newlines", "normalize_origins", "normalize_paths"]

