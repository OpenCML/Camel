# One platform leg of CI: toolchain, dependencies, Release build, the fast test layer.
#
# It is a reusable workflow so that the three legs every run needs and the macOS leg (opt-in, see
# ci.yml) share one definition instead of one copy of twenty steps each. A job-level `if` cannot
# see the matrix, so the choice of legs has to live in the caller.
name: CI leg

on:
  workflow_call:
    inputs:
      runner:
        description: "The runner label, e.g. ubuntu-24.04"
        type: string
        required: true
      slug:
        description: "Short name used in cache keys and artifact names, e.g. linux-x64"
        type: string
        required: true
      arch:
        description: "CAMEL_TARGET_ARCH, e.g. x86-64-v3"
        type: string
        required: true
      nojit:
        description: "Build with the JIT switched off and run the whole set under mark-sweep"
        type: boolean
        default: false
      experimental:
        description: "A leg whose failure does not decide the run"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CC: clang
  CXX: clang++
  HUSKY: "0"
  # The build goes on after a file fails to compile (scripts/common.js), so that one run shows
  # every error of a platform nobody builds on locally. The step still fails.
  CAMEL_BUILD_KEEP_GOING: "1"
  # Reference-side packages of the ONNX export tests (skip_unless in test/plans/feat/modules/onnx.plan.toml);
  # without them those tests are skipped, not failed.
  TEST_PIP_PACKAGES: numpy onnx onnxruntime psutil

jobs:
  build-test:
    name: Build and test (${{ inputs.slug }})
    runs-on: ${{ inputs.runner }}
    continue-on-error: ${{ inputs.experimental }}
    timeout-minutes: 120
    env:
      # Same value as build-pypi.yml on x86-64 (pending the owner's decision there).
      CAMEL_TARGET_ARCH: ${{ inputs.arch }}
      # Only Release is built here; the Debug and RelWithDebInfo dependencies that
      # scripts/install.js installs by default cost about a minute on Windows and nothing reads them.
      CAMEL_CONAN_BUILD_TYPES: Release
      # scripts/common.js adds ccache as the compiler launcher; the step below provides it.
      CAMEL_USE_CCACHE: "1"

    defaults:
      run:
        shell: bash

    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ubuntu 24.04's unversioned `clang` package is Clang 18; the project needs >= 19.
      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 ninja-build cmake
          mkdir -p "$RUNNER_TEMP/clang-bin"
          ln -sf /usr/bin/clang-19 "$RUNNER_TEMP/clang-bin/clang"
          ln -sf /usr/bin/clang++-19 "$RUNNER_TEMP/clang-bin/clang++"
          echo "$RUNNER_TEMP/clang-bin" >> "$GITHUB_PATH"

      - name: Install toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade llvm ninja -y --no-progress
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Apple Clang is rejected by CMakeLists.txt (compiler id must be Clang), so use Homebrew LLVM.
      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          # Pinned to the major version of the Linux job: fmt 11.2 does not compile with the
          # libc++ of the newest Homebrew LLVM.
          brew install llvm@19 ninja
          echo "$(brew --prefix llvm@19)/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          clang --version
          clang++ --version
          cmake --version
          ninja --version
          node --version
          python --version
          major=$(clang -dumpversion | cut -d. -f1)
          if [ "$major" -lt 19 ]; then
            echo "::error::Clang >= 19 is required (docs/setup.en.md); found $(clang -dumpversion)"
            exit 1
          fi
          echo "CLANG_MAJOR=$major" >> "$GITHUB_ENV"

      # Compiling is ~13 of the ~15 minutes of this job, and a run usually changes a handful of
      # files: ccache keys an object by the preprocessed source and the compiler, so only those
      # compile again. scripts/common.js passes it to CMake as the compiler launcher when
      # CAMEL_USE_CCACHE=1 (the build still succeeds without it, with a warning).
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ inputs.slug }}-clang${{ env.CLANG_MAJOR }}
          max-size: 500M

      - name: Install Conan and test-side Python packages
        run: |
          python -m pip install --upgrade pip "conan>=2.10,<3" $TEST_PIP_PACKAGES
          # CPU-only wheels: the default Linux wheel on PyPI pulls in the CUDA runtime.
          # The wheel host is occasionally unreachable from a runner; try a few times.
          for attempt in 1 2 3 4; do
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu && break
            [ "$attempt" = 4 ] && exit 1
            sleep $((attempt * 20))
          done

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ inputs.slug }}-clang${{ env.CLANG_MAJOR }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ inputs.slug }}-clang${{ env.CLANG_MAJOR }}-

      # The detected profile is adjusted to the one in docs/setup.en.md: C++23 and Ninja Multi-Config.
      - name: Conan profile
        run: |
          conan profile detect --force
          profile="$(conan profile path default)"
          # Not `sed -i`: on the Windows runner its rename crosses devices and fails.
          python - "$profile" <<'EOF'
          import re, sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          text = re.sub(r"(?m)^compiler\.cppstd=.*$", "compiler.cppstd=23", text)
          # The image has the 14.4x toolset; v143 makes Conan ask vcvars for 14.3, which is absent.
          text = re.sub(r"(?m)^compiler\.runtime_version=v143$", "compiler.runtime_version=v144", text)
          text += "\n[conf]\ntools.cmake.cmaketoolchain:generator=Ninja Multi-Config\n"
          open(path, "w", encoding="utf-8", newline="\n").write(text)
          EOF
          cat "$profile"

      - name: Install npm dependencies (skip husky / prepare)
        run: npm ci --ignore-scripts

      - name: Conan install (Release; see CAMEL_CONAN_BUILD_TYPES)
        run: node scripts/install.js

      # scripts/cmake-opts.js reads the build options from .camel-opts.json.
      - name: Switch the JIT off (no-JIT build)
        if: inputs.nojit
        run: |
          echo '{ "ENABLE_FASTVM_JIT": "OFF" }' > .camel-opts.json

      - name: Build (Release)
        run: npm run build

      # The precondition of the tests that need compiled code must say "no JIT" here: otherwise
      # this job would test the ordinary build a second time.
      - name: Check that the build has no JIT (no-JIT build)
        if: inputs.nojit
        run: |
          if node test/tools/have-native-jit.mjs; then
            echo "::error::the no-JIT build reports a JIT"
            exit 1
          fi

      # The default collector is generational; the no-JIT job runs the whole set under the
      # other one, so that mark-sweep stays tested on every push.
      - name: Test (smoke + feat)
        run: node scripts/test.js
        env:
          CAMEL_GC: ${{ inputs.nojit && 'mark-sweep' || '' }}

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ inputs.slug }}
          path: |
            test/results/log/*/fail/
            test/results/log/*/summary.json
          if-no-files-found: ignore
          retention-days: 14