# Multi-arch native build + camel-lang wheel (one wheel per matrix cell; PEP 425 tags from job Python).
#
# Runners (edit matrix.cfg if labels change): https://github.com/actions/runner-images
#
# --- Trusted Publishing (OIDC, no long-lived PyPI tokens in GitHub) ---
# 1) GitHub: Settings → Environments → create "pypi" and "testpypi" (optional: required reviewers).
# 2) PyPI: Project → Manage → Publishing → add pending trusted publisher:
#    - PyPI:   owner/repo = this repository, workflow = build-pypi.yml, environment = pypi
#    - Test:   same on https://test.pypi.org with environment = testpypi
#    Docs: https://docs.pypi.org/trusted-publishers/adding-a-publisher/
# 3) Actions → Run workflow → publish_to = pypi | testpypi (builds matrix, then OIDC upload).
#    "none" = build only; artifacts on the run.
# 4) Pushing v* / V* tags builds and publishes to PyPI after the full matrix succeeds.
#    workflow_dispatch keeps the explicit none / pypi / testpypi selection above.
#
# Matrix: (OS/arch cfg × python-version). Each job runs `npm run pypi:rollup` with that interpreter only
# (no modules/python/sdks on CI — rollup uses sys.base_prefix / sysconfig). Wheel tags from packaging.tags.

name: Build and package (PyPI wheel)

on:
  push:
    tags:
      - "v*"
      - "V*"
  workflow_dispatch:
    inputs:
      publish_to:
        description: "none = build only; pypi / testpypi = trusted publishing upload (OIDC)"
        type: choice
        options:
          - none
          - pypi
          - testpypi
        default: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # upload-artifact in build-wheel needs write; publish jobs set their own permissions block.
  actions: write

env:
  # Instruction-set baseline of the published libcamel (cmake/Options.cmake, docs/build-options.en.md).
  # Never `native` here: the wheel must run on CPUs other than the runner's.
  # The owner's decision (2026-10-21, docs/design-principles 9.10): x86-64-v3, i.e. AVX2 and FMA.
  # A wheel built for v3 refuses to start on a machine without AVX2 -- that is the accepted cost of
  # the performance, and ci.yml builds and tests at the same level so CI tests what is shipped.
  # The value is an x86-64 level: an arm64 matrix cell, once enabled, must override it (`baseline`).
  CAMEL_TARGET_ARCH: x86-64-v3

jobs:
  build-wheel:
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - runner: ubuntu-latest
            slug: linux-x64
          # - runner: ubuntu-24.04-arm
          #   slug: linux-arm64
          - runner: windows-latest
            slug: win-x64
          # - runner: windows-11-arm
          #   slug: win-arm64
          # - runner: macos-latest
          #   slug: macos-arm64
          # - runner: macos-15-intel
          #   slug: macos-x64
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.cfg.runner }}
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Ubuntu 24.04's unversioned `clang` package is Clang 18; docs/setup.en.md requires >= 19.
      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-19 cmake ninja-build
          mkdir -p "$RUNNER_TEMP/clang-bin"
          ln -sf /usr/bin/clang-19 "$RUNNER_TEMP/clang-bin/clang"
          ln -sf /usr/bin/clang++-19 "$RUNNER_TEMP/clang-bin/clang++"
          echo "$RUNNER_TEMP/clang-bin" >> "$GITHUB_PATH"

      - name: Select Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Verify Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          clang --version
          clang++ --version
          ninja --version
          cmake --version
          major=$(clang -dumpversion | cut -d. -f1)
          if [ "$major" -lt 19 ]; then
            echo "::error::Clang >= 19 is required (docs/setup.en.md); found $(clang -dumpversion)"
            exit 1
          fi

      - name: Install LLVM, Ninja, CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm ninja cmake -y --no-progress
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Select Clang (Windows)
        # Without this, `conan profile detect` sees the image's MSVC and writes compiler=msvc, and
        # Conan's toolchain then sets CMAKE_GENERATOR_PLATFORM=x64 -- which CMake rejects outright
        # for the Ninja generator ("does not support platform specification"). ci-leg.yml exports
        # CC/CXX for the same reason; the profile must say clang, because libcamel is built with it.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CC=clang" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=clang++" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Clang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          clang --version
          ninja --version
          cmake --version

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          brew install ninja cmake

      - name: Verify toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          cc --version
          ninja --version
          cmake --version

      - name: Install Conan
        run: python -m pip install --upgrade pip "conan>=2.10"

      - name: Conan default profile
        # Adjusted the way ci.yml adjusts it: the detected cppstd is 14, and taskflow 3.10.0
        # requires 17, so `conan install` otherwise ends with "Current cppstd (14) is lower than
        # the required C++ standard (17)" and no wheel is ever built.
        run: |
          conan profile detect --force
          profile="$(conan profile path default)"
          # Not `sed -i`: on the Windows runner its rename crosses devices and fails.
          python - "$profile" <<'EOF'
          import re, sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          text = re.sub(r"(?m)^compiler\.cppstd=.*$", "compiler.cppstd=23", text)
          # The image has the 14.4x toolset; v143 makes Conan ask vcvars for 14.3, which is absent.
          text = re.sub(r"(?m)^compiler\.runtime_version=v143$", "compiler.runtime_version=v144", text)
          open(path, "w", encoding="utf-8", newline="\n").write(text)
          EOF
          cat "$profile"

      - name: Install npm dependencies (skip husky / postinstall conan wipe)
        run: npm ci --ignore-scripts
        env:
          HUSKY: "0"

      - name: Native Release build + wheel
        # Use the exact matrix interpreter; Windows shell lookup can break Python's -c probe.
        env:
          CAMEL_PYPI_PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm run pypi:rollup

      - name: Smoke-install wheel (same interpreter as build)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall dist/pypi/*.whl
          python -c "import camel; import pathlib; print('ok', pathlib.Path(camel.__file__).resolve())"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: camel-lang-wheel-${{ matrix.cfg.slug }}-py${{ matrix.python-version }}
          path: dist/pypi/*.whl
          if-no-files-found: error

  # One publish job per index (gh-action-pypi-publish: multiple invocations per job are unsupported).
  publish-pypi:
    name: Publish to PyPI (trusted publishing)
    needs: build-wheel
    runs-on: ubuntu-latest
    if: >-
      success() &&
      ((github.event_name == 'push' &&
        (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V'))) ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to == 'pypi'))
    environment:
      name: pypi
      url: https://pypi.org/p/camel-lang
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheels-merged
          pattern: camel-lang-wheel-*
          merge-multiple: true

      - name: Flatten wheels for upload
        run: |
          mkdir -p upload
          find wheels-merged -name '*.whl' -print0 | xargs -0 -I{} cp -f {} upload/
          ls -la upload/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/

  publish-testpypi:
    name: Publish to TestPyPI (trusted publishing)
    needs: build-wheel
    runs-on: ubuntu-latest
    if: success() && github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to == 'testpypi'
    environment:
      name: testpypi
      url: https://test.pypi.org/project/camel-lang/
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheels-merged
          pattern: camel-lang-wheel-*
          merge-multiple: true

      - name: Flatten wheels for upload
        run: |
          mkdir -p upload
          find wheels-merged -name '*.whl' -print0 | xargs -0 -I{} cp -f {} upload/
          ls -la upload/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: upload/
