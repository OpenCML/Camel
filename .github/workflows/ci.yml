# Everything that has to stay green, on the release branch, on every tag and on demand.
#
# The work of one platform lives in ci-leg.yml. Compiling is the larger half of a leg, so the
# three platform legs every run needs -- linux-x64, win-x64 and macos-arm64 -- are what the run is
# made of. A leg that measures a *build* rather than a platform (the JIT switched off) is a manual
# dispatch: it finishes before the longest platform leg does, so it costs a runner without making
# the run any shorter.
#
# `release` is the branch a version is assembled on, and it is pushed *before* the tag is made
# (agents/branching.md): a red run there costs a push, where a red run on the tag costs a
# published version. `develop` is not a trigger -- it takes a merge every few minutes, so a leg
# that started on it would spend 40 minutes measuring a tree nobody releases.
name: CI

on:
  push:
    branches:
      - release
    tags:
      - "v*"
      - "V*"
  workflow_dispatch:
    inputs:
      sanitizers:
        description: "Also run the ASan/UBSan Debug build (Linux, smoke plan)"
        type: boolean
        default: false
      nojit:
        description: "Also run the no-JIT leg (linux-x64; the JIT switched off, the whole set on the default collector)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (${{ matrix.cfg.slug }})
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - runner: ubuntu-24.04
            slug: linux-x64
            arch: x86-64-v3
          # Pinned: the leg needs Visual Studio 17, and the newer images carry only VS 2026 (VS 18).
          # windows-2022 has VS 17 with the 14.4x toolset, so its Conan runtime version is v144;
          # ci-leg.yml pins whatever value the cell declares.
          - runner: windows-2022
            slug: win-x64
            arch: x86-64-v3
            msvc_runtime_version: v144
          # Apple Silicon, and the only leg that builds for arm64. The JIT has a code generator for
          # x86-64 only (cmake/Options.cmake turns ENABLE_FASTVM_JIT off on every other processor),
          # so this leg is JIT-less by platform rather than by an option: std::jit runs the
          # bytecode interpreter there and says so. build-pypi.yml builds no macOS wheel yet (5.37
          # item 6), so this leg is the only macOS signal there is.
          - runner: macos-latest
            slug: macos-arm64
            arch: baseline # the x86-64 levels do not apply to arm64
    uses: ./.github/workflows/ci-leg.yml
    with:
      runner: ${{ matrix.cfg.runner }}
      slug: ${{ matrix.cfg.slug }}
      arch: ${{ matrix.cfg.arch }}
      nojit: ${{ matrix.cfg.nojit || false }}
      msvc_runtime_version: ${{ matrix.cfg.msvc_runtime_version || '' }}

  # Manual: Run workflow -> nojit. The same leg with ENABLE_FASTVM_JIT=OFF, which no published
  # artifact is built with: what it protects is the build option, not a platform. It runs the
  # whole set, and ci-leg.yml refuses to let it measure the ordinary build by mistake.
  build-test-nojit:
    name: Build and test (linux-x64-nojit)
    if: github.event_name == 'workflow_dispatch' && inputs.nojit
    uses: ./.github/workflows/ci-leg.yml
    with:
      runner: ubuntu-24.04
      slug: linux-x64-nojit
      arch: x86-64-v3
      nojit: true

  # Manual: Run workflow -> sanitizers. Debug build of everything with ASan + UBSan, then the smoke plan.
  # The flags reach CMake through CFLAGS/CXXFLAGS/LDFLAGS on the first configure of a fresh build tree.
  sanitizers:
    name: ASan + UBSan (linux-x64, Debug, smoke)
    if: github.event_name == 'workflow_dispatch' && inputs.sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CAMEL_TARGET_ARCH: x86-64-v3
      # This job builds Debug, so it asks for every configuration: Ninja Multi-Config wants one
      # conan_toolchain.cmake per tree that covers the configurations the tree is built with.
      CAMEL_CONAN_BUILD_TYPES: Release,Debug,RelWithDebInfo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # clang-19 does not depend on the sanitizer runtimes (libclang-rt-19-dev); llvm-19 provides
      # llvm-symbolizer-19 for readable reports.
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 libclang-rt-19-dev llvm-19 ninja-build cmake
          mkdir -p "$RUNNER_TEMP/clang-bin"
          ln -sf /usr/bin/clang-19 "$RUNNER_TEMP/clang-bin/clang"
          ln -sf /usr/bin/clang++-19 "$RUNNER_TEMP/clang-bin/clang++"
          echo "$RUNNER_TEMP/clang-bin" >> "$GITHUB_PATH"

      - name: Install Conan
        run: python -m pip install --upgrade pip "conan>=2.10,<3"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-linux-x64-clang19-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-linux-x64-clang19-

      - name: Conan profile
        run: |
          conan profile detect --force
          profile="$(conan profile path default)"
          # Not `sed -i`: on the Windows runner its rename crosses devices and fails.
          python - "$profile" <<'EOF'
          import re, sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          text = re.sub(r"(?m)^compiler\.cppstd=.*$", "compiler.cppstd=23", text)
          text += "\n[conf]\ntools.cmake.cmaketoolchain:generator=Ninja Multi-Config\n"
          open(path, "w", encoding="utf-8", newline="\n").write(text)
          EOF
          cat "$profile"

      - name: Install npm dependencies (skip husky / prepare)
        run: npm ci --ignore-scripts

      - name: Conan install (Release, Debug, RelWithDebInfo)
        run: node scripts/install.js

      - name: Build (Debug, ASan + UBSan)
        env:
          CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: npm run debug

      # The author's 2026-11-02 06:10 ruling: both memory defects of that day sat in
      # `stream` and `transforms`, and a leg that only runs `smoke` reports them on one
      # platform instead of on every platform. Widening the plans is the cheapest way to
      # make "crashes only on Windows" become "crashes everywhere, nightly".
      #
      # `CAMEL_TEST_BUILD: debug` is not optional here. The runner addresses a Release install
      # (`out/latest`) unless it is told otherwise, and this leg builds only the sanitizer
      # Debug tree -- on 2026-11-02 18:05 the widened step failed in its first second with
      # "no Release binary at out/latest/bin/camel", which is the harness pointing at a build
      # this job never made. The same variable keeps a future Release build from being tested
      # by accident here: what must be exercised is the binary carrying the sanitizer flags.
      - name: Test (smoke, stream, transforms)
        env:
          ASAN_OPTIONS: detect_leaks=0:symbolize=1
          ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-19
          UBSAN_OPTIONS: print_stacktrace=1
          CAMEL_TEST_BUILD: debug
        run: |
          node scripts/test.js smoke
          node scripts/test.js test/plans/feat/compile/stream.plan.toml
          node scripts/test.js test/plans/feat/compile/transforms.plan.toml

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-sanitizers
          path: test/results/log/