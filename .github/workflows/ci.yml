# Everything that has to stay green, on every tag and on demand.
#
# The work of one platform lives in ci-leg.yml: compiling is ~13 of the ~15 minutes of a leg, and
# a leg that only Release needs (macOS) is opt-in rather than a fourth runner on every tag.
name: CI

on:
  push:
    tags:
      - "v*"
      - "V*"
  workflow_dispatch:
    inputs:
      sanitizers:
        description: "Also run the ASan/UBSan Debug build (Linux, smoke plan)"
        type: boolean
        default: false
      macos:
        description: "Also run the macOS arm64 leg (Apple toolchain signal; the wheel workflow does not build macOS wheels yet)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (${{ matrix.cfg.slug }})
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - runner: ubuntu-24.04
            slug: linux-x64
            arch: x86-64-v3
          - runner: ubuntu-24.04
            slug: linux-x64-nojit
            arch: x86-64-v3
            nojit: true
          # Pinned: the leg needs Visual Studio 17, and the newer images carry only VS 2026 (VS 18).
          # windows-2022 has VS 17 with the 14.4x toolset, so its Conan runtime version is v144;
          # ci-leg.yml pins whatever value the cell declares.
          - runner: windows-2022
            slug: win-x64
            arch: x86-64-v3
            msvc_runtime_version: v144
    uses: ./.github/workflows/ci-leg.yml
    with:
      runner: ${{ matrix.cfg.runner }}
      slug: ${{ matrix.cfg.slug }}
      arch: ${{ matrix.cfg.arch }}
      nojit: ${{ matrix.cfg.nojit || false }}
      msvc_runtime_version: ${{ matrix.cfg.msvc_runtime_version || '' }}

  # Opt-in: `experimental` means it never decides the run, and it is the most expensive runner.
  # build-pypi.yml does **not** build macOS wheels yet (5.37 item 6: the bundling step, where
  # `delocate` has to copy the libraries in and re-sign what it rewrote, is still to be written;
  # see the note in that workflow's matrix), so this leg is the only macOS signal there is.
  build-test-macos:
    name: Build and test (macos-arm64)
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    uses: ./.github/workflows/ci-leg.yml
    with:
      runner: macos-latest
      slug: macos-arm64
      arch: baseline # the x86-64 levels do not apply to arm64
      experimental: true

  # Manual: Run workflow -> sanitizers. Debug build of everything with ASan + UBSan, then the smoke plan.
  # The flags reach CMake through CFLAGS/CXXFLAGS/LDFLAGS on the first configure of a fresh build tree.
  sanitizers:
    name: ASan + UBSan (linux-x64, Debug, smoke)
    if: github.event_name == 'workflow_dispatch' && inputs.sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CAMEL_TARGET_ARCH: x86-64-v3
      # This job builds Debug, so it asks for every configuration: Ninja Multi-Config wants one
      # conan_toolchain.cmake per tree that covers the configurations the tree is built with.
      CAMEL_CONAN_BUILD_TYPES: Release,Debug,RelWithDebInfo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # clang-19 does not depend on the sanitizer runtimes (libclang-rt-19-dev); llvm-19 provides
      # llvm-symbolizer-19 for readable reports.
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 libclang-rt-19-dev llvm-19 ninja-build cmake
          mkdir -p "$RUNNER_TEMP/clang-bin"
          ln -sf /usr/bin/clang-19 "$RUNNER_TEMP/clang-bin/clang"
          ln -sf /usr/bin/clang++-19 "$RUNNER_TEMP/clang-bin/clang++"
          echo "$RUNNER_TEMP/clang-bin" >> "$GITHUB_PATH"

      - name: Install Conan
        run: python -m pip install --upgrade pip "conan>=2.10,<3"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-linux-x64-clang19-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-linux-x64-clang19-

      - name: Conan profile
        run: |
          conan profile detect --force
          profile="$(conan profile path default)"
          # Not `sed -i`: on the Windows runner its rename crosses devices and fails.
          python - "$profile" <<'EOF'
          import re, sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          text = re.sub(r"(?m)^compiler\.cppstd=.*$", "compiler.cppstd=23", text)
          text += "\n[conf]\ntools.cmake.cmaketoolchain:generator=Ninja Multi-Config\n"
          open(path, "w", encoding="utf-8", newline="\n").write(text)
          EOF
          cat "$profile"

      - name: Install npm dependencies (skip husky / prepare)
        run: npm ci --ignore-scripts

      - name: Conan install (Release, Debug, RelWithDebInfo)
        run: node scripts/install.js

      - name: Build (Debug, ASan + UBSan)
        env:
          CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: npm run debug

      - name: Test (smoke)
        env:
          ASAN_OPTIONS: detect_leaks=0:symbolize=1
          ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-19
          UBSAN_OPTIONS: print_stacktrace=1
        run: node scripts/test.js smoke

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-sanitizers
          path: test/results/log/