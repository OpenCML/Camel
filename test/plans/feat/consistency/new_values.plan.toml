[[tests]]
name = "new_values.sort_rebinding"
desc = "`xs = xs->sort` binds the variable to a sorted array and leaves every other holder of the old one as it was (design principles 11.3): a local, `sort(xs)`, merge_sort, a var parameter, a captured variable, floats. Alike on the four back ends."
kind = "behavior"
case = "../../../cases/consistency/new_values/sort_rebinding.cml"
