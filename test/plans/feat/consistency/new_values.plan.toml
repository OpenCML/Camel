[[tests]]
name = "new_values.peek_loop"
desc = "`out = out->append<i>; total += len(out)` over 20000 elements: the length read is `:var/peek`, the appends stay in place, and the loop runs in linear time on the four back ends (a quadratic loop takes seconds here)."
kind = "behavior"
case = "../../../cases/consistency/new_values/peek_loop.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "200010000\n"
timeout_ms = 3000

[[tests]]
name = "new_values.peek_loop.graph"
desc = "The graph of the loop reads `out` with `:var/peek`, and the rebinding appends through the in-place form of `append`."
kind = "behavior"
case = "../../../cases/consistency/new_values/peek_loop.cml"
args = ["${case}", "std::rgir"]
expect_exit = 0
expect_stdout_contains = [":var/peek", ":struct/append_arr_in_place", ":op/assn_owned"]

