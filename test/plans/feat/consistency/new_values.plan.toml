[[tests]]
name = "new_values.peek_loop"
desc = "`out = out->append<i>; total += len(out)` over 20000 elements: the length read is `:var/peek`, the appends stay in place, and the loop runs in linear time on the four back ends (about 1.4 s of CPU on one core; a quadratic loop takes far longer, and the bound is 4x the measured CPU time)."
kind = "behavior"
case = "../../../cases/consistency/new_values/peek_loop.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "200010000\n"
# 45 s, not 30: the CI runner measured 8360-9360 ms of CPU per back end for this loop, which 30 s
# was 3.2-3.6x -- under the 4x the margin rule asks for. 45 s is 4.8-5.4x those figures.
timeout_ms = 45000

# Removed with the capture ruling (design principles 3.5, 197): `new_values.peek_loop.graph` pinned
# the `:var/*` vocabulary of a rebound `var` cell (`:var/peek`, `:op/assn_owned`,
# `:struct/append_arr_in_place`). A closure may not assign the name it captured, so the rebinding
# lives in a loop body now and the name is the loop's carried state, which the graph renders another
# way; measured on 3773eed5c, none of the three names appears in the migrated program (the loop is
# still linear, which is the reading `new_values.peek_loop` keeps). The entry had no object left and
# was removed rather than re-aimed at a shape nobody asked for.

