[[tests]]
name = "new_values.rebinding_loop.cpp"
desc = "std::cpp writes the rebinding as rt::append on the variable, which gives its array up for the call (grown in place when nothing else holds it): a captured variable through its cell, a var parameter likewise. That the compiled program prints what std::fvm prints is checked by feat/trans/cpp.agree_with_fvm (test/tools/cppexec/expect.txt)."
kind = "behavior"
case = "../../../cases/consistency/new_values/rebinding_loop.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
expect_stdout_contains = [".set(rt::append(", ".take(), "]

