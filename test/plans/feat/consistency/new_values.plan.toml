[[tests]]
name = "new_values.unused_var"
desc = "`xs->append<5>` as a statement on a variable: a compile-time error whose message gives the rebinding `xs = xs->append<5>`."
kind = "negative"
case = "../../../cases/consistency/new_values/unused_var.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::UnusedPureResult"
expect_diagnostic_line = 9
expect_diagnostic_column = 5
expect_output_contains = ["bind it to the result: 'xs = xs->append<5>'"]

[[tests]]
name = "new_values.unused_in_lambda"
desc = "The old way of filling a captured variable in a foreach is the same error, with the rebinding as the fix."
kind = "negative"
case = "../../../cases/consistency/new_values/unused_in_lambda.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::UnusedPureResult"
expect_diagnostic_line = 10
expect_diagnostic_column = 9
expect_output_contains = ["'out = out->append<i>'"]

[[tests]]
name = "new_values.unused_operator"
desc = "Any operator declared pure as a statement is the same error (here `+`); the message says to use the result or drop it with `let _`."
kind = "negative"
case = "../../../cases/consistency/new_values/unused_operator.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::UnusedPureResult"
expect_diagnostic_line = 8
expect_diagnostic_column = 5
expect_output_contains = ["The result of '+' is not used", "'let _ = ...'"]

[[tests]]
name = "new_values.peek"
desc = "Reads of an array variable between appends: a read whose value only goes to an operation that cannot keep the array (`len`, an int element, `==`, `format`) leaves the sole-reference mark set; a read that can keep it (bound to a name, an array element, a call argument) clears it, and what it gave stays as it was. Alike on the four back ends."
kind = "behavior"
case = "../../../cases/consistency/new_values/peek.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "1 2 [1, 2] [1, 2, 3] 2\n1 [1, 2, 3, 4] 4 true\n[1] [[1], [2], [3]]\n[5, 6] 2 [5, 6, 7]\n"

[[tests]]
name = "new_values.peek.passes"
desc = "The same program through std::opt::inline, std::opt, std::jit: the passes keep `:var/peek` a read."
kind = "behavior"
case = "../../../cases/consistency/new_values/peek.cml"
args = ["${case}", "std::opt::inline", "std::opt", "std::jit"]
expect_exit = 0
expect_stdout = "1 2 [1, 2] [1, 2, 3] 2\n1 [1, 2, 3, 4] 4 true\n[1] [[1], [2], [3]]\n[5, 6] 2 [5, 6, 7]\n"

[[tests]]
name = "new_values.peek.gc_mark_sweep"
desc = "The reads between appends on std::fvm with the mark-sweep collector, a collection of both kinds every third allocation and the heap verified around each."
kind = "behavior"
case = "../../../cases/consistency/new_values/peek.cml"
args = ["--gc", "mark-sweep", "${case}", "std::gc::verify", "${run_fvm}"]
envs = ["CAMEL_GC_VERIFY=both", "CAMEL_GC_STRESS_ALLOC=3", "CAMEL_GC_STRESS_SAFEPOINT=1", "CAMEL_GC_STRESS_MODE=both"]
expect_exit = 0
expect_stdout_contains = ["{\"ok\":true,\"kind\":\"gc.verify\"}", "1 2 [1, 2] [1, 2, 3] 2\n1 [1, 2, 3, 4] 4 true\n[1] [[1], [2], [3]]\n[5, 6] 2 [5, 6, 7]"]
timeout_ms = 60000

[[tests]]
name = "new_values.peek.gc_generational"
desc = "The reads between appends on std::fvm with the generational collector, a collection of both kinds every third allocation and the heap verified around each."
