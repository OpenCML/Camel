id = "consistency.narrowing"
order = 363
tier = "feat"
tags = ["feat", "consistency", "compile", "branches", "nullable"]
desc = "A `T?` compared with `null` gives a bool, and the arm of an `if` that excludes null sees a `T` (design principles 2.11, 2.12): the same branch as a `match` on the nullable."

[defaults]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error"]
timeout_ms = 20000

[[tests]]
name = "narrowing.behaviour"
desc = "`x != null`, `null != x`, `x == null`, several tests and a test among other operands joined by `&&`, the right side of `&&` / `||`, an `if` without `else`, nested `if`s, a lambda capturing the narrowed name, the comparison as an expression, a nullable function value compared with null. Alike on the four back ends."
kind = "behavior"
case = "../../../cases/consistency/narrowing/narrow.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
verify_script = """
const out = input.normalized.stdout.trim()
const want = ['3 0', '3 -1', '3 -1 -1', '2 0 0', 'true false false', 'true true false', '42', 'some 41 none',
              '12 3 0', '[11, 12] [1, 2]', '[4, 5] [0]', '101 -1', 'true false true true true', '[false, true]',
              'true false', '42'].join('\n')
assert(out === want, `unexpected output: ${out}`)
assert(input.stderr === '', 'no diagnostic: ' + input.stderr)
"""

[[tests]]
name = "narrowing.behaviour.passes"
desc = "The same program through std::inline, std::opt, std::fvm."
kind = "behavior"
case = "../../../cases/consistency/narrowing/narrow.cml"
args = ["${case}", "std::inline", "std::opt", "std::fvm"]
expect_exit = 0
expect_stdout_starts_with = "3 0\n3 -1\n3 -1 -1\n2 0 0\ntrue false false\n"

[[tests]]
name = "narrowing.behaviour.simplify"
desc = "The same program through std::opt::simplify, std::jit."
kind = "behavior"
case = "../../../cases/consistency/narrowing/narrow.cml"
args = ["${case}", "std::opt::simplify", "std::jit"]
expect_exit = 0
expect_stdout_starts_with = "3 0\n3 -1\n3 -1 -1\n2 0 0\ntrue false false\n"

[[tests]]
name = "narrowing.graph"
desc = "`if s != null then len(s) else 0` on the graph: tag_is_null selects the arm, arm 0 is the null arm, arm 1 starts with tag_null_value."
kind = "snapshot"
case = "../../../cases/consistency/narrowing/graph.cml"
args = ["${case}", "std::rgir"]
expect_exit = 0
snapshot_stream = "stdout"
snapshot_compare = "gir_dot_isomorphic"
golden = "golden/narrowing_graph.dot"

[[tests]]
name = "narrowing.graph_is_match"
desc = "`match s { case null => 0  case v => len(v) }` gives the same graph (the same golden)."
kind = "snapshot"
case = "../../../cases/consistency/narrowing/graph_match.cml"
args = ["${case}", "std::rgir"]
expect_exit = 0
snapshot_stream = "stdout"
snapshot_compare = "gir_dot_isomorphic"
golden = "golden/narrowing_graph.dot"

[[tests]]
name = "narrowing.var"
desc = "A `var` is not narrowed; the error says why at the test."
kind = "negative"
case = "../../../cases/consistency/narrowing/var_not_narrowed.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "'x' still has the type 'int?' in this arm", "a 'var' may be rewritten between the test and the use"]

[[tests]]
name = "narrowing.under_or"
desc = "A test under `||` does not narrow the arms of the `if`; the error says why."
kind = "negative"
case = "../../../cases/consistency/narrowing/indirect_not_narrowed.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "'x' still has the type 'int?' in this arm", "not one under '||' or '!'"]

[[tests]]
name = "narrowing.negated"
desc = "A negated test does not narrow; the error says why."
kind = "negative"
case = "../../../cases/consistency/narrowing/negated_not_narrowed.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "not one under '||' or '!'"]

[[tests]]
name = "narrowing.else_of_conjunction"
desc = "The else arm of a conjunction learns nothing; the error says why."
kind = "negative"
case = "../../../cases/consistency/narrowing/else_of_conjunction.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "where the operands of '&&' do not all hold"]

[[tests]]
name = "narrowing.outside_arm"
desc = "After the `if` the name is a `T?` again."
kind = "negative"
case = "../../../cases/consistency/narrowing/outside_arm.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", ".cml:4:"]

[[tests]]
name = "narrowing.two_nullables"
desc = "Two `T?` values are not compared with each other."
kind = "negative"
case = "../../../cases/consistency/narrowing/compare_two_nullables.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", ".cml:5:"]

[[tests]]
name = "narrowing.plain_with_null"
desc = "A value that cannot be null is not compared with `null`."
kind = "negative"
case = "../../../cases/consistency/narrowing/compare_plain_with_null.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", ".cml:4:"]

[[tests]]
name = "narrowing.functions"
desc = "Two function values cannot be compared."
kind = "negative"
case = "../../../cases/consistency/narrowing/compare_functions.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", ".cml:8:"]
