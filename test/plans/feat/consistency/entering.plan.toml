[[tests]]
name = "entering.graph_implicit"
desc = "An argument that enters a T? parameter is, on the graph, the CAST node `v as T?` gives: this program and the one that writes the conversion (next test) match one golden graph."
kind = "snapshot"
case = "../../../cases/consistency/entering/graph_implicit.cml"
args = ["${case}", "std::rgir"]
backends = ["nvm"]
backends_agree = []
snapshot_compare = "gir_dot_isomorphic"
golden = "golden/entering_graph.dot"

[[tests]]
name = "entering.graph_explicit"
desc = "The program that writes `v as int?` itself, against the same golden graph."
kind = "snapshot"
case = "../../../cases/consistency/entering/graph_explicit.cml"
args = ["${case}", "std::rgir"]
backends = ["nvm"]
backends_agree = []
snapshot_compare = "gir_dot_isomorphic"
golden = "golden/entering_graph.dot"

[[tests]]
name = "entering.err_arg_reverse"
desc = "Never the other way: an int? is not passed where an int is expected."
kind = "negative"
case = "../../../cases/consistency/entering/err_arg_reverse.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error"]
expect_output_contains = ["name=SemanticDiag::NoMatchingFunction", "err_arg_reverse.cml:4:14:"]

[[tests]]
name = "entering.err_other_payload"
desc = "An int? is not put into a float?: a tagged value of the same form does not enter again."
kind = "negative"
case = "../../../cases/consistency/entering/err_other_payload.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error"]
expect_output_contains = ["name=SemanticDiag::NoMatchingFunction", "err_other_payload.cml:4:14:"]

