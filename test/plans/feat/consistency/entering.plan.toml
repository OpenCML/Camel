id = "consistency.entering"
order = 357
tier = "feat"
tags = ["feat", "consistency", "compile", "nullable", "fallible"]
desc = "A value enters a T? / T! position by itself where the target type is known, never the other way; [] takes its element type from its position; a nullable right side of ?? (design principles 2.10)"

# docs/technical/29_nullable_and_fallible_values.md section 4.2. Every behaviour test runs on
# the four back ends, which must agree, and through the optimisation and inlining pipelines.

[defaults]
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["[Error]", "error[", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

[[tests]]
name = "entering.positions"
desc = "Arguments (a function, overloads with the exact one winning, a function value, a generic function), annotated let, array elements with and without a written type, branch arms of if and match, return over two levels; null in each."
case = "../../../cases/consistency/entering/positions.cml"
golden = "golden/entering_positions.txt"

[[tests]]
name = "entering.empty_array"
desc = "[] takes its element type from a declared type, a parameter, a declared return type, the other arm of a branch (also of a sync arm), the left side of ?? and !!, and as."
case = "../../../cases/consistency/entering/empty_array.cml"
golden = "golden/entering_empty_array.txt"

[[tests]]
name = "entering.fallback_chain"
desc = "a ?? b with b a T? gives a T?, with b a T gives a T; a ?? b ?? 9 grouped either way; a right side is evaluated only when needed; !! likewise."
case = "../../../cases/consistency/entering/fallback_chain.cml"
golden = "golden/entering_fallback_chain.txt"

[[tests]]
name = "entering.positions.opt"
desc = "The same program through std::opt, std::nvm."
case = "../../../cases/consistency/entering/positions.cml"
