id = "consistency.values"
order = 352
tier = "fast"
tags = ["feat", "consistency", "runtime"]
desc = "Programs without faults on the four back ends: the same output, checked against a golden file"

# Places where back ends are easily different: integer wrap-around and division, floating
# point, strings, closures over var, wait, deep tail recursion, function values, with
# parameters. Each case runs on std::nvm, std::fvm, std::jit and std::prl; the four agree on
# exit code and standard output, and the output is the golden file's.

[defaults]
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["[Error]", "Floating point exception", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

[[tests]]
name = "value.closure_var"
desc = "Nested closures capture a var by reference."
case = "../../../cases/consistency/values/closure_var.cml"
golden = "golden/closure_var.txt"

[[tests]]
name = "value.content_equality"
desc = "== and != on arrays, tuples and structs compare by content, recursively, with strings, T?, T!, maps and sets as parts and float elements as floats (an array holding a NaN does not equal itself); contains on arrays uses the same equality; contains on strings. ([1, 2] == [1, 2] had no overload, and != compared references.)"
case = "../../../cases/consistency/values/content_equality.cml"
golden = "golden/content_equality.txt"

[[tests]]
name = "value.content_equality_trees"
desc = "Arrays, tuples and structs that hold maps and sets of some hundred entries, built in opposite orders and by removal: a part that is a collection is compared by the collection's own equality, so the shape of the tree does not matter."
case = "../../../cases/consistency/values/content_equality_trees.cml"
golden = "golden/content_equality_trees.txt"

[[tests]]
name = "value.content_equality_trees.small_nodes"
desc = "The same with leaves of two entries and a fan-out of four (CAMEL_COLL_LEAF_CAPACITY=2 CAMEL_COLL_FANOUT=4, every tree validated), where the three ways of building give trees of different shapes."
case = "../../../cases/consistency/values/content_equality_trees.cml"
envs = ["CAMEL_COLL_VALIDATE=1", "CAMEL_COLL_LEAF_CAPACITY=2", "CAMEL_COLL_FANOUT=4"]
golden = "golden/content_equality_trees.txt"

[[tests]]
name = "value.counter_closure"
desc = "Closures returned by a function share the var of their own call."
case = "../../../cases/consistency/values/counter_closure.cml"
golden = "golden/counter_closure.txt"

[[tests]]
name = "value.effect_not_used"
desc = "An effect whose result nothing uses, outside a sync block, does not run (design principles 3.1, 3.2)."
case = "../../../cases/consistency/values/effect_not_used.cml"
golden = "golden/effect_not_used.txt"

[[tests]]
name = "value.float_compare"
desc = "IEEE comparisons: NaN equals nothing, itself included; the two zeros are equal. (std::nvm and std::tf compared the bit patterns.)"
case = "../../../cases/consistency/values/float_compare.cml"
golden = "golden/float_compare.txt"

[[tests]]
name = "value.float_to_int"
desc = "A float inside the range of int converts by truncation toward zero."
case = "../../../cases/consistency/values/float_to_int.cml"
golden = "golden/float_to_int.txt"

[[tests]]
name = "value.slice_take_drop"
desc = "slice within the array and at its edges; take and drop cut to the array by definition; a slice out of range inside attempt is an error value."
case = "../../../cases/consistency/values/slice_take_drop.cml"
golden = "golden/slice_take_drop.txt"

[[tests]]
name = "value.function_values"
desc = "Functions that return functions, composition, a function value as the element function of a map."
case = "../../../cases/consistency/values/function_values.cml"
golden = "golden/function_values.txt"

[[tests]]
name = "value.higher_order"
desc = "map, filter, reduce and foreach: results in element order; reduce and foreach run in element order."
case = "../../../cases/consistency/values/higher_order.cml"
golden = "golden/higher_order.txt"

[[tests]]
name = "value.int_div_mod_sign"
desc = "Integer division truncates toward zero; the remainder has the sign of the dividend."
case = "../../../cases/consistency/values/int_div_mod_sign.cml"
golden = "golden/int_div_mod_sign.txt"

[[tests]]
name = "value.int_literal_max"
desc = "The largest int written as a literal (it was read back as the smallest: the literal went through a double)."
case = "../../../cases/consistency/values/int_literal_max.cml"
golden = "golden/int_literal_max.txt"

[[tests]]
name = "value.int_min_div"
desc = "The smallest int divided by -1, and its remainder: no hardware trap; the quotient wraps like the other integer arithmetic. (It was SIGFPE on all four back ends.)"
case = "../../../cases/consistency/values/int_min_div.cml"
golden = "golden/int_min_div.txt"

[[tests]]
name = "value.int_compound_wrap"
desc = "Compound assignment wraps like the plain operators (design principles 5.1): += -= *= past the ends of int and i32, and /= and %= of the smallest value by -1 without a hardware trap."
case = "../../../cases/consistency/values/int_compound_wrap.cml"
golden = "golden/int_compound_wrap.txt"

[[tests]]
name = "value.int_wrap"
desc = "64-bit integer arithmetic wraps around at the ends of the range."
case = "../../../cases/consistency/values/int_wrap.cml"
golden = "golden/int_wrap.txt"

[[tests]]
name = "value.match_values"
desc = "match on ints and strings, with alternatives and a default."
case = "../../../cases/consistency/values/match_values.cml"
golden = "golden/match_values.txt"

[[tests]]
name = "value.non_tail_deep"
desc = "Non-tail recursion inside the default limit: direct, through a function value, in a map."
case = "../../../cases/consistency/values/non_tail_deep.cml"
golden = "golden/non_tail_deep.txt"

[[tests]]
name = "value.strings"
desc = "String concatenation, equality and byte-wise ordering."
case = "../../../cases/consistency/values/strings.cml"
golden = "golden/strings.txt"

[[tests]]
name = "value.structs_tuples"
desc = "Struct fields and tuple elements through functions and a map."
case = "../../../cases/consistency/values/structs_tuples.cml"
golden = "golden/structs_tuples.txt"

[[tests]]
name = "value.sync_order"
desc = "Effects in sync blocks happen in the order written, across calls, branches and recursion."
case = "../../../cases/consistency/values/sync_order.cml"
golden = "golden/sync_order.txt"

[[tests]]
name = "value.tagged_values"
desc = "Nullable and fallible values: ??, !!, ?-> and match; an error value is a value, not a fault."
case = "../../../cases/consistency/values/tagged_values.cml"
golden = "golden/tagged_values.txt"

[[tests]]
name = "value.tail_deep"
desc = "Tail recursion of 100000 and of 1000000 rounds."
case = "../../../cases/consistency/values/tail_deep.cml"
golden = "golden/tail_deep.txt"

[[tests]]
name = "value.tail_mutual"
desc = "Mutual recursion in tail position, 200000 rounds."
case = "../../../cases/consistency/values/tail_mutual.cml"
golden = "golden/tail_mutual.txt"

[[tests]]
name = "value.wait_order"
desc = "wait orders a call that writes its var parameter between the uses of the variable."
case = "../../../cases/consistency/values/wait_order.cml"
golden = "golden/wait_order.txt"

[[tests]]
name = "value.with_params"
desc = "with parameters, in call and in chain form."
case = "../../../cases/consistency/values/with_params.cml"
golden = "golden/with_params.txt"

# --- special values and number text ---------------------------------------------------------

[[tests]]
name = "value.float_special"
desc = "Infinities, NaN and negative zero, printed and compared, against the golden text. A NaN has one text (`nan`, never `-nan`, language reference 2.5.2) on every back end and in every form: without a specification, under a precision, under a width, and with the `+` sign flag. (The NaN text used to depend on the C library: with glibc `printf` a computed negative NaN printed as `-nan` under a specification, so this case was compared between back ends only.)"
case = "../../../cases/consistency/values/float_special.cml"
golden = "golden/float_special.txt"

[[tests]]
name = "value.max_min_special"
desc = "math::max and math::min are IEEE 754-2019 maximum and minimum (design principles 7.7): a NaN on either side gives NaN, -0 is below +0 on either side (max(-0, 0) was -0: the first argument won a tie)."
case = "../../../cases/consistency/values/max_min_special.cml"
golden = "golden/max_min_special.txt"

[[tests]]
name = "value.number_text"
desc = "Text to number: the whole string must be one number. int(), i32() and float() fault on blanks, a trailing part, another base, a separator (seen through attempt); parse_int and parse_float give an error value by the same rule. (int('12abc') was 12, int(' 7') was 7, int('1e3') was 1.)"
case = "../../../cases/consistency/values/number_text.cml"
golden = "golden/number_text.txt"

[[tests]]
name = "value.number_fit"
desc = "Number to number: a float inside the range truncates toward zero; NaN, an infinity, a float beyond the integer's range and an int beyond i32 are ConversionOutOfRange (seen through attempt); a float beyond f32 becomes an infinity."
case = "../../../cases/consistency/values/number_fit.cml"
golden = "golden/number_fit.txt"

[[tests]]
name = "value.enums"
desc = "An enum value is constructed by its qualified variant, matched, printed as `Shape::Circle(1.0)` / `Shape::Rect { w: 2.0, h: 3.0 }` / `Shape::Empty`, compared by tag and payload, and one enum holds another."
case = "../../../cases/consistency/values/enums.cml"
golden = "golden/enums.txt"

[[tests]]
name = "value.deep_enum_chain"
desc = "A million-node recursive enum (`Chain::Cons(i, rest)`) built by a loop, printed and compared. Both walks are explicit stacks (src/core/rtdata/print.cpp, equality.cpp); the C++ backend boxes the recursive field and does the same (camel/standalone/recursive.h)."
case = "../../../cases/consistency/values/deep_enum_chain.cml"
golden = "golden/deep_enum_chain.txt"
# Out of the poison sweep (docs/technical/24): poisoning moves the young generation at every
# safepoint, and a million nodes built one per safepoint turn that into quadratic copying
# (measured: over the 200 s timeout, H10 baseline). The program still runs in this plan.
sweep = false

[[tests]]
name = "value.deep_nested_enum"
desc = "A hundred thousand levels of `Nest::More([...])`: a recursive enum through an array, printed and compared on explicit stacks. 100000 levels overflowed the native stack before (exit 0xC00000FD)."
case = "../../../cases/consistency/values/deep_nested_enum.cml"
golden = "golden/deep_nested_enum.txt"
# Out of the poison sweep for the reason above: the deep array nests are copied at every
# safepoint of the build loop.
sweep = false

[[tests]]
name = "value.deep_json_depth"
desc = "JSON has no depth of its own, but every walk of a document in the json module is native recursion: a text deeper than CAMEL_JSON_MAX_DEPTH (10000) is the error value JsonTooDeep with the line and column of the bracket that goes too deep, and a text at the limit decodes (jsonMaxDepth in modules/json/operators.cpp)."
case = "../../../cases/consistency/values/deep_json_depth.cml"
golden = "golden/deep_json_depth.txt"
