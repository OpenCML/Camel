id = "consistency.comprehension"
order = 361
tier = "fast"
tags = ["feat", "consistency", "compile", "comprehension"]
desc = "[e for x in xs if c] is filter then map: the same graph as the two calls written out (design principles 4.2)"

[defaults]
kind = "snapshot"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["[Error]", "error[", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

[[tests]]
name = "comprehension.values"
desc = "With and without a condition, nested, over strings, tuples and the result of a call, inside a generic function, as an operand, with an effectful element expression; x has the element type of the source."
case = "../../../cases/consistency/comprehension/values.cml"
golden = "golden/comprehension_values.txt"

[[tests]]
name = "comprehension.values.opt"
desc = "The same program through std::opt, std::nvm."
case = "../../../cases/consistency/comprehension/values.cml"
args = ["${case}", "std::opt", "std::nvm"]
backends = ["nvm"]
golden = "golden/comprehension_values.txt"

[[tests]]
name = "comprehension.values.inline"
desc = "The same program through std::cxx::inline, std::fvm."
case = "../../../cases/consistency/comprehension/values.cml"
args = ["${case}", "std::cxx::inline", "std::fvm"]
backends = ["nvm"]
golden = "golden/comprehension_values.txt"

[[tests]]
name = "comprehension.values.simplify"
desc = "The same program through std::opt, std::nvm."
case = "../../../cases/consistency/comprehension/values.cml"
args = ["${case}", "std::opt", "std::nvm"]
backends = ["nvm"]
golden = "golden/comprehension_values.txt"

[[tests]]
name = "comprehension.values.inline_opt"
desc = "The same program through std::cxx::inline, std::opt, std::jit."
case = "../../../cases/consistency/comprehension/values.cml"
args = ["${case}", "std::cxx::inline", "std::opt", "std::jit"]
backends = ["nvm"]
golden = "golden/comprehension_values.txt"

[[tests]]
name = "comprehension.values.macro_opt"
desc = "The same program through std::macro, std::opt, std::prl."
case = "../../../cases/consistency/comprehension/values.cml"
args = ["${case}", "std::macro", "std::opt", "std::prl"]
backends = ["nvm"]
golden = "golden/comprehension_values.txt"

[[tests]]
name = "comprehension.graph_comprehension"
desc = "The graph of `[x * x for x in xs if x % 2 == 0]`, against the golden graph of the next test."
case = "../../../cases/consistency/comprehension/graph_comprehension.cml"
args = ["${case}", "std::gir", "std::nop"]
backends = ["nvm"]
snapshot_compare = "gir_dot_isomorphic"
golden = "golden/comprehension_graph.dot"

[[tests]]
name = "comprehension.graph_written_out"
desc = "The graph of `xs->filter<(x: int) => x % 2 == 0>->map<(x: int) => x * x>`: the same golden graph."
case = "../../../cases/consistency/comprehension/graph_written_out.cml"
args = ["${case}", "std::gir", "std::nop"]
backends = ["nvm"]
snapshot_compare = "gir_dot_isomorphic"
golden = "golden/comprehension_graph.dot"

[[tests]]
name = "comprehension.err_not_an_array"
desc = "A source without elements."
kind = "negative"
case = "../../../cases/consistency/comprehension/err_not_an_array.cml"
args = ["--diag-format", "short", "${case}"]
backends = ["nvm"]
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "live DREF"]
expect_output_contains = ["name=SemanticDiag::ComprehensionSourceRefused", "has type 'int'"]

[[tests]]
name = "comprehension.err_condition_type"
desc = "A condition that is not a bool is refused: the element function the filter is given returns int where the declaration of filter wants bool."
kind = "negative"
case = "../../../cases/consistency/comprehension/err_condition_type.cml"
args = ["--diag-format", "short", "${case}"]
backends = ["nvm"]
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "live DREF"]
expect_output_contains = ["name=SemanticDiag::GenericFunctionAsValue", "it returns 'int', and the function expected here is '(item: int) => bool'"]

[[tests]]
name = "comprehension.err_element_type"
desc = "An error in the element expression is reported in it, with the element type."
kind = "negative"
case = "../../../cases/consistency/comprehension/err_element_type.cml"
args = ["--diag-format", "short", "${case}"]
backends = ["nvm"]
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "live DREF"]
expect_output_contains = ["name=SemanticDiag::NoMatchingFunction", "err_element_type.cml:2:18", "in a list comprehension whose elements have type 'string'"]

[[tests]]
name = "comprehension.shadowed"
desc = "A module that defines its own `map` and `filter`: a call written with one of the names reaches the module's own function, and the built-in operator of the same spelling is not a candidate beside it -- they are two layers and the first layer that has the name answers (design principles 10.2) -- so `xs->map<...>` prints `my map` and `xs->filter<...>` prints `my filter`. A comprehension still means the built-in operators, whose lowering names the built-in group rather than the written name, so the two comprehensions print their arrays. This entry used to expect the opposite: exit 1 and an AmbiguousCall naming the module's `map` beside `:mark/map_arr`, which was the merged-layers defect in its observable shape."
kind = "behavior"
case = "../../../cases/consistency/comprehension/shadowed.cml"
# The four back ends print the same two lines; `backends_agree` is the second claim -- that they
# agree -- carrying the exit code, the normalised stdout and every diagnostic, in order.
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized", "diagnostics"]
expect_exit = 0
expect_stdout_exact = "[4, 16] [2, 3, 4, 5]\nmy map my filter\n"
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "live DREF"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000
