id = "consistency.comprehension"
order = 361
tier = "feat"
tags = ["feat", "consistency", "compile", "comprehension"]
desc = "[e for x in xs if c] is filter then map: the same graph as the two calls written out (design principles 2.10)"

[defaults]
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["[Error]", "error[", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

[[tests]]
name = "comprehension.values"
desc = "With and without a condition, nested, over strings, tuples and the result of a call, inside a generic function, as an operand, with an effectful element expression; x has the element type of the source."
case = "../../../cases/consistency/comprehension/values.cml"
golden = "golden/comprehension_values.txt"

[[tests]]
name = "comprehension.values.opt"
desc = "The same program through std::opt, std::nvm."
case = "../../../cases/consistency/comprehension/values.cml"
args = ["${case}", "std::opt", "std::nvm"]
backends = ["nvm"]
backends_agree = []
golden = "golden/comprehension_values.txt"

[[tests]]
name = "comprehension.values.inline"
desc = "The same program through std::inline, std::fvm."
case = "../../../cases/consistency/comprehension/values.cml"
args = ["${case}", "std::inline", "std::fvm"]
backends = ["nvm"]
backends_agree = []
golden = "golden/comprehension_values.txt"

[[tests]]
name = "comprehension.values.simplify"
desc = "The same program through std::opt::simplify, std::nvm."
case = "../../../cases/consistency/comprehension/values.cml"
args = ["${case}", "std::opt::simplify", "std::nvm"]
backends = ["nvm"]
backends_agree = []
golden = "golden/comprehension_values.txt"

[[tests]]
name = "comprehension.values.inline_opt"
desc = "The same program through std::inline, std::opt, std::jit."
case = "../../../cases/consistency/comprehension/values.cml"
args = ["${case}", "std::inline", "std::opt", "std::jit"]
backends = ["nvm"]
backends_agree = []
golden = "golden/comprehension_values.txt"

[[tests]]
name = "comprehension.values.macro_opt"
desc = "The same program through std::macro, std::opt, std::prl."
case = "../../../cases/consistency/comprehension/values.cml"
args = ["${case}", "std::macro", "std::opt", "std::prl"]
backends = ["nvm"]
backends_agree = []
golden = "golden/comprehension_values.txt"

[[tests]]
name = "comprehension.graph_comprehension"
desc = "The graph of `[x * x for x in xs if x % 2 == 0]`, against the golden graph of the next test."
case = "../../../cases/consistency/comprehension/graph_comprehension.cml"
args = ["${case}", "std::rgir"]
backends = ["nvm"]
backends_agree = []
snapshot_compare = "gir_dot_isomorphic"
golden = "golden/comprehension_graph.dot"

[[tests]]
name = "comprehension.graph_written_out"
desc = "The graph of `xs->filter<(x: int) => x % 2 == 0>->map<(x: int) => x * x>`: the same golden graph."
case = "../../../cases/consistency/comprehension/graph_written_out.cml"
args = ["${case}", "std::rgir"]
backends = ["nvm"]
backends_agree = []
snapshot_compare = "gir_dot_isomorphic"
golden = "golden/comprehension_graph.dot"

[[tests]]
name = "comprehension.err_not_an_array"
desc = "A source without elements."
kind = "negative"
case = "../../../cases/consistency/comprehension/err_not_an_array.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "live DREF"]
expect_output_contains = ["name=SemanticDiag::ComprehensionSourceRefused", "has type 'int'"]

[[tests]]
name = "comprehension.err_condition_type"
desc = "A condition that is not a bool is refused by filter."
kind = "negative"
case = "../../../cases/consistency/comprehension/err_condition_type.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "live DREF"]
expect_output_contains = ["name=SemanticDiag::NoMatchingFunction", "<(x: int) => int> (int[])"]

[[tests]]
name = "comprehension.err_element_type"
desc = "An error in the element expression is reported in it, with the element type."
kind = "negative"
case = "../../../cases/consistency/comprehension/err_element_type.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "live DREF"]
expect_output_contains = ["name=SemanticDiag::NoMatchingFunction", "err_element_type.cml:2:18", "in a list comprehension whose elements have type 'string'"]
