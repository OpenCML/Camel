[[tests]]
name = "limit.raised.native.stack_full"
desc = "Limit 1000000, a native recursion of 900000 levels: the 8 MiB stack of the main thread does not hold it, and the diagnostic says so, at the recursive call."
args = ["--max-recursion-depth", "1000000", "${case}", "${backend}"]
backends = ["inline_jit"]
# Only compiled code recurses on the native stack; a build without the JIT interprets this
# recursion in heap frames and finishes it.
skip_unless = ["node", "test/tools/have-native-jit.mjs"]
envs = ["N=900000"]
timeout_ms = 120000
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::MaxRecursionDepthExceeded"
expect_diagnostic_line = 12
expect_diagnostic_column = 43
expect_output_contains = ["open calls: the native stack of the thread"]
expect_output_not_contains = ["done", "Segmentation fault", "dumped core"]

[[tests]]
name = "limit.raised.isolated"
desc = "The deep recursion inside `attempt`, twice, under a limit of 1000000: whether it finishes or is refused, it ends at the boundary, the stack is back where it was and the function runs again, on every back end and in native code."
case = "../../../cases/consistency/limits/depth_isolated.cml"
args = ["--max-recursion-depth", "1000000", "${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl", "inline_jit"]
backends_agree = []
envs = ["N=900000"]
timeout_ms = 120000
verify_script = """
assert(input.signal === null, `ended by signal ${input.signal}`)
assert(input.exit_code === 0, `exit ${input.exit_code}`)
const lines = input.normalized.stdout.trimEnd().split('\n')
assert(lines.length === 6, JSON.stringify(lines))
assert(lines[0] === 'start' && lines[1] === '200' && lines[4] === '200' && lines[5] === 'done', JSON.stringify(lines))
for (const line of [lines[2], lines[3]]) {
    assert(line === '900000' || line === 'MaxRecursionDepthExceeded', JSON.stringify(lines))
}
assert(lines[2] === lines[3], JSON.stringify(lines))
"""
