# --- waiting for the JIT line ------------------------------------------------------------------

[[tests]]
name = "limit.direct.exceeds.native"
desc = "The same limit under std::inline std::jit, where depth is compiled to native code: the compiled recursion counts its depth and leaves through the fault exit with the interpreter's diagnostic."
backends = ["inline_jit"]
envs = ["N=100"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::MaxRecursionDepthExceeded"
expect_diagnostic_line = 12
expect_diagnostic_column = 43

# --- native code under a raised limit --------------------------------------------------------
#
# Compiled code counts its native calls and, before each of them, compares its stack pointer
# with the reserve of the stack of the thread (JitContext::stackLimit). So under any limit the
# option accepts a native recursion either finishes or stops with MaxRecursionDepthExceeded.
# Where the count is reached first, all back ends give the diagnostic of the count; where the
# stack fills first, the back ends that nest on the native stack (std::nvm, std::prl, and
# std::jit for the code it compiled) stop there and the others may finish.

[[tests]]
name = "limit.10000.fits"
desc = "Limit 10000: depth(9999) is under the count on every back end and under std::inline std::jit. It finishes wherever the native stack holds 9999 levels; where it does not (the back ends that nest on the native stack, on Windows, which keeps 15/16 of the stack as the reserve for SEH unwinding: stackReserve in src/execute/limits.cpp), it stops at the recursive call with the diagnostic of a full native stack, never with the count's."
args = ["--max-recursion-depth", "10000", "${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl", "inline_jit"]
backends_agree = []
envs = ["N=9999"]
timeout_ms = 60000
verify_script = """
assert(input.signal === null, `ended by signal ${input.signal}`)
const fault = input.diagnostics.find((d) => d.name === 'RuntimeDiag::MaxRecursionDepthExceeded')
const text = input.normalized.stdout + input.normalized.stderr
const finished = input.exit_code === 0 && /^start\n9999\ndone\n/.test(input.normalized.stdout)
const stackFull = input.exit_code === 1 && fault !== undefined && /native stack of the thread/.test(text)
assert(finished || stackFull, `exit ${input.exit_code}: ${text.slice(0, 300)}`)
"""

[[tests]]
name = "limit.10000.exceeds"
desc = "Limit 10000: depth(10000) stops at the recursive call on every back end: at the count, or first at a full native stack where that holds fewer levels (see limit.10000.fits)."
args = ["--max-recursion-depth", "10000", "${case}", "${backend}"]
backends_agree = []
envs = ["N=10000"]
timeout_ms = 60000
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::MaxRecursionDepthExceeded"
expect_diagnostic_line = 12
expect_diagnostic_column = 43
verify_script = """
const text = input.normalized.stdout + input.normalized.stderr
assert(/Maximum recursion depth \(10000\) exceeded/.test(text) || /native stack of the thread/.test(text), text.slice(0, 300))
"""

[[tests]]
name = "limit.10000.exceeds.native"
desc = "The same in native code (std::inline std::jit), at the same call."
args = ["--max-recursion-depth", "10000", "${case}", "${backend}"]
backends = ["inline_jit"]
envs = ["N=100000"]
timeout_ms = 60000
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::MaxRecursionDepthExceeded"
expect_diagnostic_line = 12
expect_diagnostic_column = 43
expect_output_contains = ["Maximum recursion depth (10000) exceeded"]

[[tests]]
name = "limit.raised.native.no_crash.100000.50000"
desc = "Limits of 100000 and 1000000 with recursions of 50000, 100000 and 900000 levels in native code and under std::jit: each ends with the result or with MaxRecursionDepthExceeded at the recursive call, never by a signal. (A native recursion of 100000 levels under a limit of 1000000 was a segmentation fault: issue 21 of docs/issues/2026-10-12-language-surface-findings.md.)"
backends = ["jit", "inline_jit"]
backends_agree = []
timeout_ms = 120000
args = ["--max-recursion-depth", "100000", "${case}", "${backend}"]
envs = ["N=50000"]
verify_script = """
assert(input.signal === null, `ended by signal ${input.signal}`)
const fault = input.diagnostics.find((d) => d.name === 'RuntimeDiag::MaxRecursionDepthExceeded')
const stopped = input.exit_code === 1 && fault !== undefined
const finished = input.exit_code === 0 && /^start\n\d+\ndone\n/.test(input.normalized.stdout)
assert(stopped || finished, `exit ${input.exit_code}: ${input.normalized.stdout.slice(0, 300)}`)
"""

