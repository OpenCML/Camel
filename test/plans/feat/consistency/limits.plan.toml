id = "consistency.limits"
order = 354
tier = "feat"
tags = ["feat", "consistency", "runtime", "limits"]
desc = "The configurable limit on non-tail recursion (--max-recursion-depth) and on the macro evaluator (--max-macro-depth)"

# The limit counts the calls open at once that are not tail calls. With the same limit the same
# program gives the same result on std::nvm, std::fvm, std::jit and std::prl: the deepest
# recursion that runs is the same, and past it the diagnostic is the same, at the call.
#
# The cases under test/cases/consistency/limits recurse to the depth N of the environment:
# directly (depth_direct), through a function value (depth_value) and inside a map element
# (depth_map). With a limit of L, depth(L - 1) called from main is the deepest that runs: L
# calls of depth are open at the bottom (the entry's call of main is not counted). Through a
# function value every level is two calls (step and via), and a map element adds one call.

[defaults]
kind = "behavior"
case = "../../../cases/consistency/limits/depth_direct.cml"
args = ["--max-recursion-depth", "100", "${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized", "diagnostics"]
expect_output_not_contains = ["Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

# --- the same boundary on every back end ----------------------------------------------------

[[tests]]
name = "limit.direct.fits"
desc = "Limit 100: depth(99) runs."
envs = ["N=99"]
expect_exit = 0
expect_stdout_starts_with = "start\n99\ndone\n"

[[tests]]
name = "limit.direct.exceeds"
desc = "Limit 100: depth(100) stops with MaxRecursionDepthExceeded at the recursive call, naming the limit and how to raise it."
envs = ["N=100"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::MaxRecursionDepthExceeded"
expect_diagnostic_line = 12
expect_diagnostic_column = 43
expect_stdout_starts_with = "start\n"
expect_output_contains = ["Maximum recursion depth (100) exceeded", "--max-recursion-depth", "CAMEL_MAX_RECURSION_DEPTH"]
expect_output_not_contains = ["done", "Segmentation fault", "dumped core"]

[[tests]]
name = "limit.value.fits"
desc = "Limit 100, recursion through a function value (two calls a level): step(49) runs."
case = "../../../cases/consistency/limits/depth_value.cml"
envs = ["N=49"]
expect_exit = 0
expect_stdout_starts_with = "start\n49\ndone\n"

[[tests]]
name = "limit.value.exceeds"
desc = "Limit 100, recursion through a function value: step(50) stops with the same diagnostic, at the call through the value. (std::fvm did not count these calls and ran into a segmentation fault.)"
case = "../../../cases/consistency/limits/depth_value.cml"
envs = ["N=50"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::MaxRecursionDepthExceeded"
expect_diagnostic_line = 10
expect_diagnostic_column = 39
expect_stdout_starts_with = "start\n"
expect_output_contains = ["Maximum recursion depth (100) exceeded"]
expect_output_not_contains = ["done", "Segmentation fault", "dumped core"]

[[tests]]
name = "limit.map.fits"
desc = "Limit 100, recursion inside a map element (one more call open): depth(98) runs."
case = "../../../cases/consistency/limits/depth_map.cml"
envs = ["N=98"]
expect_exit = 0
expect_stdout_starts_with = "start\n[98, 3, 1]\ndone\n"

[[tests]]
name = "limit.map.exceeds"
desc = "Limit 100, recursion inside a map element: depth(99) stops with the same diagnostic. The count follows the element onto the thread that runs it under std::prl."
case = "../../../cases/consistency/limits/depth_map.cml"
envs = ["N=99"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::MaxRecursionDepthExceeded"
expect_diagnostic_line = 10
expect_diagnostic_column = 43
expect_stdout_starts_with = "start\n"
expect_output_contains = ["Maximum recursion depth (100) exceeded"]
expect_output_not_contains = ["done", "Segmentation fault", "dumped core"]

# --- raising the limit ---------------------------------------------------------------------
# These successful runs measure the configurable call count independently of the native-stack
# guard. Its platform-specific unwinding reserve can stop a Windows run before count 4000;
# the separate native-stack cases keep checking that protection with the guard enabled.

[[tests]]
name = "limit.raised.option"
desc = "depth(4000) does not run with the default limit (1000) and runs on all four with --max-recursion-depth 5000."
args = ["--max-recursion-depth", "5000", "${case}", "${backend}"]
envs = ["N=4000", "CAMEL_NATIVE_STACK_GUARD=0"]
expect_exit = 0
expect_stdout_starts_with = "start\n4000\ndone\n"

[[tests]]
name = "limit.raised.environment"
desc = "The same with CAMEL_MAX_RECURSION_DEPTH=5000."
args = ["${case}", "${backend}"]
envs = ["N=4000", "CAMEL_MAX_RECURSION_DEPTH=5000", "CAMEL_NATIVE_STACK_GUARD=0"]
expect_exit = 0
expect_stdout_starts_with = "start\n4000\ndone\n"

[[tests]]
name = "limit.option_over_environment"
desc = "The option wins over the environment variable: limit 100 although the environment says 5000."
envs = ["N=4000", "CAMEL_MAX_RECURSION_DEPTH=5000"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::MaxRecursionDepthExceeded"
expect_output_contains = ["Maximum recursion depth (100) exceeded"]

[[tests]]
name = "limit.default"
desc = "Without option and variable every scheduler stops at 1000 open calls (design principles 2.10): depth(999) runs and depth(1000) does not, on all four alike. std::prl counts like the others (it had no count by default)."
