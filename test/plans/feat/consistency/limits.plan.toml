# --- no settable limit ends in a crash -------------------------------------------------------

[[tests]]
name = "limit.largest.no_crash"
desc = "The largest limit the option accepts (1000000) with a recursion of 900000: a back end that nests on the native stack (std::nvm, std::tf) stops with MaxRecursionDepthExceeded when the stack is nearly full, std::fvm keeps its calls off the native stack and may finish. Either way the process ends by itself with exit code 0 or 1, never by a signal."
args = ["--max-recursion-depth", "1000000", "${case}", "${backend}"]
backends = ["nvm", "fvm", "prl"]
backends_agree = []
envs = ["N=900000"]
timeout_ms = 120000
verify_script = """
assert(input.signal === null, `ended by signal ${input.signal}`)
const stopped = input.exit_code === 1
    && input.diagnostics.some((d) => d.name === 'RuntimeDiag::MaxRecursionDepthExceeded')
const finished = input.exit_code === 0 && input.normalized.stdout === 'start\n900000\ndone\n'
assert(stopped || finished, `exit ${input.exit_code}: ${input.normalized.stdout.slice(0, 300)}`)
"""

[[tests]]
name = "limit.largest.value.no_crash"
desc = "The same through a function value, where std::fvm nests on the native stack too."
args = ["--max-recursion-depth", "1000000", "${case}", "${backend}"]
backends = ["nvm", "fvm", "prl"]
backends_agree = []
case = "../../../cases/consistency/limits/depth_value.cml"
envs = ["N=400000"]
timeout_ms = 120000
verify_script = """
assert(input.signal === null, `ended by signal ${input.signal}`)
assert(input.exit_code === 1, `exit ${input.exit_code}`)
assert(input.diagnostics.some((d) => d.name === 'RuntimeDiag::MaxRecursionDepthExceeded'), 'no MaxRecursionDepthExceeded')
"""

