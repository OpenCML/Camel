id = "consistency.if_without_else"
order = 356
tier = "feat"
tags = ["feat", "consistency", "compile", "branches"]
desc = "An if without else has no value: its arm may be of any type, what the arm gives is dropped, and using the if as a value is a compile-time error (design principles 2.10)"

[defaults]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error"]
timeout_ms = 20000

[[tests]]
name = "if_without_else.statement"
desc = "Arms of type string, int and void under an if without else, as a statement, as the last statement of a body, with an empty else, inside a lambda: alike on the four back ends, without a diagnostic."
kind = "behavior"
case = "../../../cases/consistency/if_without_else/statement.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
verify_script = """
const out = input.normalized.stdout.trim()
const want = ['checking', 'big', '4', '2', 'tail', 'then', 'older', '1 1', '5', '9'].join('\n')
assert(out === want, `unexpected output: ${out}`)
assert(input.stderr === '', 'no diagnostic: ' + input.stderr)
"""

[[tests]]
name = "if_without_else.statement.opt"
desc = "The same program through std::opt, std::nvm."
kind = "behavior"
case = "../../../cases/consistency/if_without_else/statement.cml"
args = ["${case}", "std::opt", "std::nvm"]
expect_exit = 0
expect_stdout_starts_with = "checking\nbig\n4\n2\ntail\nthen\nolder\n1 1\n5\n9\n"

[[tests]]
name = "if_without_else.statement.inline"
desc = "The same program through std::inline, std::fvm."
kind = "behavior"
case = "../../../cases/consistency/if_without_else/statement.cml"
args = ["${case}", "std::inline", "std::fvm"]
expect_exit = 0
expect_stdout_starts_with = "checking\nbig\n4\n2\ntail\nthen\nolder\n1 1\n5\n9\n"

