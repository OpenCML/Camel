id = "consistency.logical_branch"
order = 362
tier = "feat"
tags = ["feat", "consistency", "compile", "branches"]
desc = "`&&` and `||` are branches (design principles 2.11): the right side is an arm, evaluated only when the left side does not decide; `&`, `|`, `&=`, `|=` evaluate both sides; both sides of `&&` / `||` are bool."

[defaults]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error"]
timeout_ms = 20000

[[tests]]
name = "logical_branch.short_circuit"
desc = "Effects on the right side happen only when it is evaluated; chains stop at the side that decides; a fault on the right side is not reached; `&`, `|`, `&=`, `|=` evaluate both sides. Alike on the four back ends."
kind = "behavior"
case = "../../../cases/consistency/logical/short_circuit.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
verify_script = """
const out = input.normalized.stdout.trim().split('\n').join(' ')
const want = 'a1 false b1 b2 false c1 true d1 d2 true e1 e2 false f1 f2 true g1 g2 false h1 h2 true i1 true k1 k2 k3 true false true j1 j2 j3 true [2, 3, 4] m1 m2 both'
assert(out === want, `unexpected output: ${out}`)
assert(input.stderr === '', 'no diagnostic: ' + input.stderr)
"""

[[tests]]
name = "logical_branch.short_circuit.passes"
desc = "The same program through std::inline, std::opt, std::jit: the passes keep the right side an arm."
kind = "behavior"
case = "../../../cases/consistency/logical/short_circuit.cml"
args = ["${case}", "std::inline", "std::opt", "std::jit"]
expect_exit = 0
expect_stdout_starts_with = "a1\nfalse\nb1\nb2\nfalse\nc1\ntrue\nd1\nd2\ntrue\ne1\ne2\nfalse\n"

[[tests]]
name = "logical_branch.short_circuit.simplify"
desc = "The same program through std::opt::simplify, std::fvm."
kind = "behavior"
case = "../../../cases/consistency/logical/short_circuit.cml"
args = ["${case}", "std::opt::simplify", "std::fvm"]
expect_exit = 0
expect_stdout_starts_with = "a1\nfalse\nb1\nb2\nfalse\nc1\ntrue\nd1\nd2\ntrue\ne1\ne2\nfalse\n"

[[tests]]
name = "logical_branch.values"
desc = "The values of `&&`, `||`, `&`, `|` over all four pairs, in pure functions, conditions and lambdas. Alike on the four back ends."
kind = "behavior"
case = "../../../cases/consistency/logical/pure.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["[even digit, odd digit or far, other, odd digit or far, other]", "true false false true\ntrue false false false\ntrue true true false\ntrue false false false\ntrue true true false\ntrue"]

[[tests]]
name = "logical_branch.values.inline"
desc = "The same program through std::inline, std::fvm."
kind = "behavior"
case = "../../../cases/consistency/logical/pure.cml"
args = ["${case}", "std::inline", "std::fvm"]
expect_exit = 0
expect_stdout_contains = ["[even digit, odd digit or far, other, odd digit or far, other]", "true false false true\ntrue false false false\ntrue true true false\ntrue false false false\ntrue true true false\ntrue"]

[[tests]]
name = "logical_branch.graph"
desc = "`a && b > 1` on the graph: a branch on `a` whose arm 0 is the right side and whose arm 1 is `false`."
kind = "snapshot"
case = "../../../cases/consistency/logical/graph.cml"
args = ["${case}", "std::rgir"]
expect_exit = 0
snapshot_stream = "stdout"
snapshot_compare = "gir_dot_isomorphic"
golden = "golden/logical_and_graph.dot"

[[tests]]
name = "logical_branch.graph_is_if"
desc = "`if a then b > 1 else false` gives the same graph as `a && b > 1` (the same golden)."
kind = "snapshot"
case = "../../../cases/consistency/logical/graph_if.cml"
args = ["${case}", "std::rgir"]
expect_exit = 0
snapshot_stream = "stdout"
snapshot_compare = "gir_dot_isomorphic"
golden = "golden/logical_and_graph.dot"

[[tests]]
name = "logical_branch.left_not_bool"
desc = "An operand of `&&` that is not a bool is a located compile-time error."
kind = "negative"
case = "../../../cases/consistency/logical/left_not_bool.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::LogicalOperandNotBool"
expect_diagnostic_line = 3
expect_output_contains = ["The left side of '&&' has type 'int', not 'bool'."]

[[tests]]
name = "logical_branch.right_not_bool"
desc = "The right side of `||` too."
kind = "negative"
case = "../../../cases/consistency/logical/right_not_bool.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::LogicalOperandNotBool"
expect_diagnostic_line = 3
expect_output_contains = ["The right side of '||' has type 'int', not 'bool'."]
