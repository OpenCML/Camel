id = "consistency.runner"
order = 350
tier = "fast"
tags = ["feat", "consistency", "tools"]
desc = "The plan runner's back-end matrix (backends, backends_agree, known_fail, [defaults])"

[[tests]]
name = "runner.backend_matrix"
desc = "Runs the runner on a fixture plan whose tests pass, fail and are known to fail on purpose, and checks the status of each."
kind = "behavior"
tool = "node"
case = "../../../tools/selftest/run.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["runner self-test ok"]
# The reading that decides is this self-test's own CPU time, not the wall clock: the runner's
# timeout rule reads the CPU of every test's process tree. Six runs of this case inside the fast
# layer at -Jobs 8 on 2026-10-24 read 12.41-12.69 s of CPU -- a 0.28 s spread, 2.3% -- against
# 22.0-23.5 s of wall, 6.5% in the same six runs. The same fixture read 7.22-7.39 s of CPU when its
# nested tests ran unwrapped; the wrapper that makes the reading is now under every test, its own
# nested runs included, and that cost is this test's own work.
#
# The bound is stated as the work's upper bound plus a written jitter band, and not as a multiple of
# the work (author ruling 2026-11-02 16:50: a judgement that moves with the load can be red in one
# of two adjacent runs, and such a test is neither a red nor a green). The upper bound is 13.0 s --
# the highest of those six readings, rounded up -- and the band is 0.5 s, twice the 0.28 s spread
# they showed, so the work would have to reach 13.5 s to be believed, 0.8 s past anything measured
# here. A multiple of the figure moves with the figure; a bound and a band do not.
#
# 180 s is the liveness bound, a different thing: a nested run that hangs must not hold the gate,
# and the wall this test takes on this host (15.8-23.5 s measured inside gates) is the host's.
timeout_ms = 180000
# `parallel = false` (the same ruling): the figure this test is judged by is a sum over its process
# tree, so it follows how many cores the host hands the neighbours. Alone it is its own work plus
# the band above. The old reason for keeping it parallel is gone and was never about the reading:
# the inner run used to clear tmp/test and delete the outer run's scratch, and every run now owns
# tmp/test/run-<pid> and removes only that root.
parallel = false
