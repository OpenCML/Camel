id = "consistency.runner"
order = 350
tier = "fast"
tags = ["feat", "consistency", "tools"]
desc = "The plan runner's back-end matrix (backends, backends_agree, known_fail, [defaults])"

[[tests]]
name = "runner.backend_matrix"
desc = "Runs the runner on a fixture plan whose tests pass, fail and are known to fail on purpose, and checks the status of each."
kind = "behavior"
tool = "node"
case = "../../../tools/selftest/run.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["runner self-test ok"]
# The deciding reading is this self-test's own CPU time, not the wall clock: the runner's margin
# rule reads the CPU of every test's process tree. Six runs of this case inside the fast layer at
# -Jobs 8 on 2026-10-24 read 12.41-12.69 s of CPU against 22.0-23.5 s of wall -- a 2.3% spread in
# the figure that decides, where the wall clock spread 6.5% in the same six runs. The same fixture
# read 7.22-7.39 s of CPU when its nested tests ran unwrapped; the wrapper that makes the reading
# is now under every test, its own nested runs included, and that cost is this test's own work. The
# margin is 45 s, so the bound has more than three times the work in it. 180 s is the liveness
# bound: a nested run that hangs must not hold the gate, and the wall this test takes on this host
# (15.8-23.5 s measured inside gates) is the host's.
timeout_ms = 180000
# No `parallel = false`: this test starts the runner itself, and it used to be serial because
# the inner run cleared tmp/test, deleting the outer run's scratch. Every run now owns
# tmp/test/run-<pid> and removes only that root, so the inner run cannot touch this one.
