id = "consistency.surface"
order = 355
tier = "fast"
tags = ["feat", "consistency", "runtime", "surface"]
desc = "The surface of the language on the four back ends: signs and numbers, chained member access, calls of function-valued expressions"

# Ways of writing ordinary programs that used to be read as something else, to fail in the
# parser, or to end in an internal error.
# Each case runs on std::nvm, std::fvm, std::jit and std::prl; the four agree on exit code and
# standard output, and the output is the golden file's.

[defaults]
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["[Error]", "bad any_cast", "Internal", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

[[tests]]
name = "surface.minus"
desc = "`a-1`, `a -1`, `fib(n-1)` are subtractions (the lexer took the sign into the number: `let b = a-1` bound b to a, silently); a sign directly before a number where an operand is expected is the sign of the literal, the smallest integer included."
case = "../../../cases/consistency/surface/minus.cml"
golden = "golden/surface_minus.txt"

[[tests]]
name = "surface.member_chain"
desc = "`t.0.1`, `p.pair.1.0`, `f(x).0.1`, `ts[1].0.1`: a chain of tuple indices, whose `0.1` the lexer reads as one real number."
case = "../../../cases/consistency/surface/member_chain.cml"
golden = "golden/surface_member_chain.txt"

[[tests]]
name = "surface.lambda_call"
desc = "A lambda called where it is written: `((x: int): int => x + 1)(3)`, `3->(x: int): int => x + 1`, `v -> (x: int): int => x * 2`. Each ended in the bare text `bad any_cast`."
case = "../../../cases/consistency/surface/lambda_call.cml"
golden = "golden/surface_lambda_call.txt"

[[tests]]
name = "surface.operator_values"
desc = "A library operator with one signature is a function value (`xs->map<trim>`, in a let, an array, a return); a name with several signatures (an operator group, user overloads) is one where the parameter type of the callee selects a signature."
case = "../../../cases/consistency/surface/operator_values.cml"
golden = "golden/surface_operator_values.txt"

[[tests]]
name = "surface.zip_many"
desc = "`zip` of three or four arrays gives tuples of three or four elements (it built pairs under a type of triples and dropped the third array)."
case = "../../../cases/consistency/surface/zip_many.cml"
golden = "golden/surface_zip_many.txt"
