id = "consistency.operator_overloads"
order = 363
tier = "feat"
tags = ["feat", "consistency", "compile", "operators"]
desc = "Operator overloads written in Camel, `func operator +(a: V, b: V): V` (design principles 2.12; the notation is provisional): which operators can be overloaded, the overloads of every layer as one set (this module, imported modules, built-in and C++ module operators), generic overloads, entering `T?`, export and import, and the diagnostics for refused declarations, conflicts and ambiguous calls."

[defaults]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error"]
timeout_ms = 20000

# ---- Behaviour, alike on the four back ends and through the passes ----

[[tests]]
name = "operator_overloads.basic"
desc = "Binary and unary operators, indexing, `<`, `&`, `|`, `!` on types of the program next to the built-in overloads; `+=`, `&=`, `|=` on such a type rebind through the plain operator."
kind = "behavior"
case = "../../../cases/consistency/operator_overloads/basic.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "0 1 1\n4.0 7.0 2.0 -2.0 4.0 2.0 true false\n3 ab 2 -4 false 5.0\n4.0 7.0 3\n"

[[tests]]
name = "operator_overloads.basic.inline"
desc = "The same program through std::inline, std::fvm: an overload is a function like any other."
kind = "behavior"
case = "../../../cases/consistency/operator_overloads/basic.cml"
args = ["${case}", "std::inline", "std::fvm"]
expect_exit = 0
expect_stdout = "0 1 1\n4.0 7.0 2.0 -2.0 4.0 2.0 true false\n3 ab 2 -4 false 5.0\n4.0 7.0 3\n"

[[tests]]
name = "operator_overloads.basic.simplify"
desc = "The same program through std::opt::simplify, std::jit."
kind = "behavior"
case = "../../../cases/consistency/operator_overloads/basic.cml"
args = ["${case}", "std::opt::simplify", "std::jit"]
expect_exit = 0
expect_stdout = "0 1 1\n4.0 7.0 2.0 -2.0 4.0 2.0 true false\n3 ab 2 -4 false 5.0\n4.0 7.0 3\n"

[[tests]]
name = "operator_overloads.generic"
desc = "Generic overloads (`typeas` in a parameter's type) next to a plain one: each call takes the one overload that accepts its operands, and two generic overloads of one operator have instances of their own."
kind = "behavior"
case = "../../../cases/consistency/operator_overloads/generic.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "[1, 2, 3] [x, y] (2, 9) (q, r) [1, 2, 3]\n"

[[tests]]
name = "operator_overloads.generic.inline"
desc = "The same program through std::inline, std::opt::simplify, std::fvm."
kind = "behavior"
case = "../../../cases/consistency/operator_overloads/generic.cml"
args = ["${case}", "std::inline", "std::opt::simplify", "std::fvm"]
expect_exit = 0
expect_stdout = "[1, 2, 3] [x, y] (2, 9) (q, r) [1, 2, 3]\n"

[[tests]]
name = "operator_overloads.entering"
desc = "An operand enters the `T?` parameter of an overload of the program, as an argument of a function does; the exact overload is taken first."
kind = "behavior"
case = "../../../cases/consistency/operator_overloads/entering.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "2 101 2\n"

[[tests]]
name = "operator_overloads.named_operator"
desc = "`operator` is not a keyword: a function may still be called `operator`."
kind = "behavior"
case = "../../../cases/consistency/operator_overloads/named_operator.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout = "2\n"

[[tests]]
name = "operator_overloads.import_by_name"
desc = "An import by name of another name of a module brings the module's operator overloads, a generic one included (its instance is built in the importing module); the built-in `==` still applies to ints."
kind = "behavior"
case = "../../../cases/consistency/operator_overloads/mods/use_named.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "11 -11 11 true false true\n"

[[tests]]
name = "operator_overloads.import_namespace"
desc = "`import m` (the namespace only) brings the operator overloads of m as well."
kind = "behavior"
case = "../../../cases/consistency/operator_overloads/mods/use_namespace.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout = "5\n"

# ---- Diagnostics ----

[[tests]]
name = "operator_overloads.not_overloadable_logical"
desc = "`&&` is a branch and cannot be overloaded; the diagnostic says why."
kind = "negative"
case = "../../../cases/consistency/operator_overloads/not_overloadable_logical.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::OperatorNotOverloadable"
expect_diagnostic_line = 8
expect_diagnostic_column = 1
expect_output_contains = ["'&&' cannot be overloaded: it is a branch"]

[[tests]]
name = "operator_overloads.not_overloadable_branch"
desc = "`??` is a branch on a null mark and cannot be overloaded."
kind = "negative"
case = "../../../cases/consistency/operator_overloads/not_overloadable_branch.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::OperatorNotOverloadable"
expect_diagnostic_line = 8
expect_diagnostic_column = 1
expect_output_contains = ["'??' cannot be overloaded"]

[[tests]]
name = "operator_overloads.not_overloadable_pipe"
desc = "`->` passes a value to a function and cannot be overloaded."
kind = "negative"
case = "../../../cases/consistency/operator_overloads/not_overloadable_pipe.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::OperatorNotOverloadable"
expect_diagnostic_line = 8
expect_diagnostic_column = 1
expect_output_contains = ["'->' cannot be overloaded"]

[[tests]]
name = "operator_overloads.compound_assignment"
desc = "A compound assignment has no overload of its own: `a += b` is `a = a + b`."
kind = "negative"
case = "../../../cases/consistency/operator_overloads/compound_assignment.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::OperatorNotOverloadable"
expect_diagnostic_line = 8
expect_diagnostic_column = 1
expect_output_contains = ["'+=' cannot be overloaded", "overload of '+'"]

[[tests]]
name = "operator_overloads.conflict_builtin"
desc = "An overload whose parameters a built-in overload takes is an error, not a replacement of the built-in operator."
kind = "negative"
case = "../../../cases/consistency/operator_overloads/conflict_builtin.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::OperatorOverloadConflict"
expect_diagnostic_line = 8
expect_diagnostic_column = 1
expect_output_contains = ["already defined for (int, int)"]

[[tests]]
name = "operator_overloads.arity"
desc = "A binary operator declared with one parameter."
kind = "negative"
case = "../../../cases/consistency/operator_overloads/arity.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::OperatorOverloadInvalid"
expect_diagnostic_line = 8
expect_diagnostic_column = 1
expect_output_contains = ["it takes two parameters, and this declaration has 1"]

[[tests]]
name = "operator_overloads.arity_unary"
desc = "A unary operator declared with two parameters."
kind = "negative"
case = "../../../cases/consistency/operator_overloads/arity_unary.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::OperatorOverloadInvalid"
expect_diagnostic_line = 8
expect_diagnostic_column = 1
expect_output_contains = ["it takes one parameter, and this declaration has 2"]

[[tests]]
name = "operator_overloads.with_param"
desc = "An operator has no with-parameters (a type variable is written with typeas)."
kind = "negative"
case = "../../../cases/consistency/operator_overloads/with_param.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::OperatorOverloadInvalid"
expect_diagnostic_line = 9
expect_diagnostic_column = 1
expect_output_contains = ["no with-parameters"]

[[tests]]
name = "operator_overloads.var_param"
desc = "An operator has no var parameters."
kind = "negative"
case = "../../../cases/consistency/operator_overloads/var_param.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::OperatorOverloadInvalid"
expect_diagnostic_line = 8
expect_diagnostic_column = 17
expect_output_contains = ["no var parameters"]

[[tests]]
name = "operator_overloads.ambiguous_generic"
desc = "A generic and a plain overload both accept the operands: the call is ambiguous and both are listed."
kind = "negative"
case = "../../../cases/consistency/operator_overloads/ambiguous_generic.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::AmbiguousOperatorCall"
expect_diagnostic_line = 11
expect_diagnostic_column = 19
expect_output_contains = ["(a: string[], b: string) => string[] (this module)", "(a: typeas T[], b: T) => T[] (this module)"]

[[tests]]
name = "operator_overloads.ambiguous_modules"
desc = "Two imported modules overload `+` for the same operands: the call is ambiguous and names both modules."
kind = "negative"
case = "../../../cases/consistency/operator_overloads/mods/ambiguous_modules.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::AmbiguousOperatorCall"
expect_diagnostic_line = 9
expect_diagnostic_column = 20
expect_output_contains = ["(module 'plus_a')", "(module 'plus_b')"]

[[tests]]
name = "operator_overloads.conflict_import"
desc = "A module declares an overload whose parameters an overload it imports already takes."
kind = "negative"
case = "../../../cases/consistency/operator_overloads/mods/conflict_import.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::OperatorOverloadConflict"
expect_diagnostic_line = 5
expect_diagnostic_column = 1
expect_output_contains = ["by module 'plus_a'"]
