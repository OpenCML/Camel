id = "consistency.generic_values"
order = 360
tier = "feat"
tags = ["feat", "consistency", "compile", "generics", "function-values"]
desc = "A generic function may stand wherever a function is expected; it is instantiated at compile time once the position fixes its type variables (design principles 2.10)"

# docs/technical/28_generic_functions_and_type_functions.md section 6. The graph only ever
# holds the instances.

[defaults]
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["[Error]", "error[", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

[[tests]]
name = "generic_values.values"
desc = "Passed to another generic function (also two at once, one waiting for the other), to an ordinary function, to map / filter / reduce (also an imported generic function), handed on to an operator by a generic function, under a declared type and a declared return type; a type variable that its typeas position leaves open (null) takes its type elsewhere."
case = "../../../cases/consistency/generic_values/values.cml"
golden = "golden/generic_values.txt"

[[tests]]
name = "generic_values.values.opt"
desc = "The same program through std::opt, std::nvm."
case = "../../../cases/consistency/generic_values/values.cml"
args = ["${case}", "std::opt", "std::nvm"]
backends = ["nvm"]
backends_agree = []
golden = "golden/generic_values.txt"

[[tests]]
name = "generic_values.values.inline"
desc = "The same program through std::inline, std::fvm."
case = "../../../cases/consistency/generic_values/values.cml"
args = ["${case}", "std::inline", "std::fvm"]
backends = ["nvm"]
backends_agree = []
golden = "golden/generic_values.txt"

[[tests]]
name = "generic_values.values.simplify"
desc = "The same program through std::opt::simplify, std::nvm."
case = "../../../cases/consistency/generic_values/values.cml"
args = ["${case}", "std::opt::simplify", "std::nvm"]
backends = ["nvm"]
backends_agree = []
golden = "golden/generic_values.txt"

[[tests]]
name = "generic_values.values.inline_opt"
desc = "The same program through std::inline, std::opt, std::jit."
case = "../../../cases/consistency/generic_values/values.cml"
args = ["${case}", "std::inline", "std::opt", "std::jit"]
backends = ["nvm"]
backends_agree = []
golden = "golden/generic_values.txt"

[[tests]]
name = "generic_values.values.macro_opt"
desc = "The same program through std::macro, std::opt, std::prl."
case = "../../../cases/consistency/generic_values/values.cml"
args = ["${case}", "std::macro", "std::opt", "std::prl"]
backends = ["nvm"]
backends_agree = []
golden = "golden/generic_values.txt"

[[tests]]
name = "generic_values.graph"
desc = "The graph of `apply(id, 3)` and `xs->map<pair>` holds the instances apply<int, int>, id<int>, pair<int> and no template, no type variable and no unresolved name."
case = "../../../cases/consistency/generic_values/graph.cml"
args = ["${case}", "std::rgir"]
backends = ["nvm"]
backends_agree = []
snapshot_compare = "gir_dot_isomorphic"
golden = "golden/generic_values_graph.dot"

[[tests]]
name = "generic_values.err_no_context"
desc = "`let g = id`: nothing fixes the type variable; the diagnostic names it and says to write the type."
kind = "negative"
case = "../../../cases/consistency/generic_values/err_no_context.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "live DREF"]
expect_output_contains = ["name=SemanticDiag::GenericFunctionAsValue", "err_no_context.cml:3:", "its type variable(s) A cannot be determined", "let f: (x: int) => int = id"]

[[tests]]
name = "generic_values.err_each_waits"
desc = "`apply(id, id)`: each waits for the other; the diagnostic names the variables that stay undetermined."
kind = "negative"
case = "../../../cases/consistency/generic_values/err_each_waits.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "live DREF"]
expect_output_contains = ["name=SemanticDiag::GenericArgumentsMismatch", "err_each_waits.cml:4:", "the type variable(s) T, U of 'apply' are not determined by the other arguments"]

[[tests]]
name = "generic_values.err_wrong_result"
desc = "The instance the arguments ask for does not return what the parameter needs."
kind = "negative"
case = "../../../cases/consistency/generic_values/err_wrong_result.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "live DREF"]
expect_output_contains = ["name=SemanticDiag::GenericArgumentsMismatch", "with A = int it returns 'int', and the function expected here is '(x: int) => bool'"]

[[tests]]
name = "generic_values.err_operator_no_hint"
desc = "`println(id)`: an operator that does not take a function gives no instance to try."
kind = "negative"
case = "../../../cases/consistency/generic_values/err_operator_no_hint.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "live DREF"]
expect_output_contains = ["name=SemanticDiag::GenericFunctionAsValue", "the operator 'println' does not say which function it expects", "its type variable(s) A stay undetermined"]

[[tests]]
name = "generic_values.err_declared_type"
desc = "A declared type the generic function cannot have."
kind = "negative"
case = "../../../cases/consistency/generic_values/err_declared_type.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "live DREF"]
expect_output_contains = ["name=SemanticDiag::GenericFunctionAsValue", "does not have the form of 'int' in the function expected here, '(x: int) => int'"]

[[tests]]
name = "generic_values.err_null_only"
desc = "Only nulls: no argument says anything about the variable."
kind = "negative"
case = "../../../cases/consistency/generic_values/err_null_only.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "live DREF"]
expect_output_contains = ["name=SemanticDiag::GenericArgumentsMismatch", "the type variable(s) T cannot be determined from the arguments"]
