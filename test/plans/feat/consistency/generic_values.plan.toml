id = "consistency.generic_values"
order = 360
tier = "fast"
tags = ["feat", "consistency", "compile", "generics", "function-values"]
desc = "A generic function may stand wherever a function is expected; it is instantiated at compile time once the position fixes its type variables (design principles 5.5)"

# docs/technical/28_generic_functions_and_type_functions.md section 6. The graph only ever
# holds the instances.

[defaults]
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["[Error]", "error[", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

[[tests]]
name = "generic_values.values"
desc = "Passed to another generic function (also two at once, one waiting for the other), to an ordinary function, to map / filter / reduce (also an imported generic function), handed on to an operator by a generic function, under a declared type and a declared return type; a type variable that its first binding position leaves open (null) takes its type elsewhere."
case = "../../../cases/consistency/generic_values/values.cml"
golden = "golden/generic_values.txt"

[[tests]]
name = "generic_values.values.opt"
desc = "The same program through std::opt, std::nvm."
case = "../../../cases/consistency/generic_values/values.cml"
args = ["${case}", "std::opt", "std::nvm"]
backends = ["nvm"]
backends_agree = []
golden = "golden/generic_values.txt"

[[tests]]
name = "generic_values.values.inline"
desc = "The same program through std::opt::inline, std::fvm."
case = "../../../cases/consistency/generic_values/values.cml"
args = ["${case}", "std::opt::inline", "std::fvm"]
backends = ["nvm"]
backends_agree = []
golden = "golden/generic_values.txt"

[[tests]]
name = "generic_values.values.simplify"
desc = "The same program through std::opt, std::nvm."
case = "../../../cases/consistency/generic_values/values.cml"
args = ["${case}", "std::opt", "std::nvm"]
backends = ["nvm"]
backends_agree = []
golden = "golden/generic_values.txt"

[[tests]]
name = "generic_values.values.inline_opt"
desc = "The same program through std::opt::inline, std::opt, std::jit."
case = "../../../cases/consistency/generic_values/values.cml"
args = ["${case}", "std::opt::inline", "std::opt", "std::jit"]
backends = ["nvm"]
backends_agree = []
golden = "golden/generic_values.txt"

[[tests]]
name = "generic_values.values.macro_opt"
desc = "The same program through std::macro, std::opt, std::prl."
case = "../../../cases/consistency/generic_values/values.cml"
args = ["${case}", "std::macro", "std::opt", "std::prl"]
backends = ["nvm"]
backends_agree = []
golden = "golden/generic_values.txt"

[[tests]]
name = "generic_values.graph"
desc = "The graph of `apply(id, 3)` and `xs->map<pair>` holds the instances apply<int, int>, id<int>, pair<int> and no template, no type variable and no unresolved name."
case = "../../../cases/consistency/generic_values/graph.cml"
args = ["${case}", "std::gir"]
backends = ["nvm"]
backends_agree = []
snapshot_compare = "gir_dot_isomorphic"
golden = "golden/generic_values_graph.dot"

[[tests]]
name = "generic_values.err_no_context"
desc = "`let g = id`: nothing fixes the type variable; the diagnostic names it and says to write the type."
kind = "negative"
case = "../../../cases/consistency/generic_values/err_no_context.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "live DREF"]
expect_output_contains = ["name=SemanticDiag::GenericFunctionAsValue", "err_no_context.cml:3:", "its type variable(s) A cannot be determined", "let f: (x: int) => int = id"]

[[tests]]
name = "generic_values.err_each_waits"
desc = "`apply(id, id)`: each waits for the other; the diagnostic names the variables that stay undetermined."
kind = "negative"
case = "../../../cases/consistency/generic_values/err_each_waits.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "live DREF"]
expect_output_contains = ["name=SemanticDiag::GenericArgumentsMismatch", "err_each_waits.cml:4:", "the type variable(s) T, U of 'apply' are not determined by the other arguments"]

[[tests]]
name = "generic_values.err_wrong_result"
desc = "The instance the arguments ask for does not return what the parameter needs."
kind = "negative"
case = "../../../cases/consistency/generic_values/err_wrong_result.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "live DREF"]
expect_output_contains = ["name=SemanticDiag::GenericArgumentsMismatch", "with A = int it returns 'int', and the function expected here is '(x: int) => bool'"]

[[tests]]
name = "generic_values.err_operator_no_hint"
desc = "`println(id)`: an operator that does not take a function gives no instance to try."
kind = "negative"
case = "../../../cases/consistency/generic_values/err_operator_no_hint.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "live DREF"]
expect_output_contains = ["name=SemanticDiag::GenericFunctionAsValue", "Signature: id: (x: A) => A"]

[[tests]]
name = "generic_values.err_declared_type"
desc = "A declared type the generic function cannot have."
kind = "negative"
case = "../../../cases/consistency/generic_values/err_declared_type.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "live DREF"]
expect_output_contains = ["name=SemanticDiag::GenericFunctionAsValue", "does not have the form of 'int' in the function expected here, '(x: int) => int'"]

[[tests]]
name = "generic_values.err_null_only"
desc = "Only nulls: no argument says anything about the variable."
kind = "negative"
case = "../../../cases/consistency/generic_values/err_null_only.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "live DREF"]
expect_output_contains = ["name=SemanticDiag::GenericArgumentsMismatch", "the type variable(s) T cannot be determined from the arguments"]

[[tests]]
name = "generic_values.overloads_to_operators"
desc = "A name with several ordinary functions handed to a built-in higher-order operator: the operator is asked about each, and the one it accepts is taken (`map<abs>` over ints and over floats, `reduce<max, 0>`, `filter<is_even>` with two user overloads)."
kind = "behavior"
case = "../../../cases/consistency/generic_values/overloads_to_operators.cml"
expect_stdout_starts_with = "[1, 2, 3] [1.5, 2.5]\n9 [2, 4] [bb]\n"

[[tests]]
name = "generic_values.err_no_overload_fits"
desc = "None of the functions of the name is one the operator accepts: the diagnostic lists them."
kind = "negative"
case = "../../../cases/consistency/generic_values/err_no_overload_fits.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "live DREF"]
expect_output_contains = ["name=SemanticDiag::FunctionNameAsValue", "2 functions of that name [(x: int) => int pure; (x: float) => float pure]"]

[[tests]]
name = "generic_values.candidate_body_fails"
desc = "Two generic overloads of one name and a position that fixes the types of both: the first one's body does not compile for them and the second one's does, so the name is the second (it returns its `y`: 2 + 4). The same name at the same types is bound twice: the instance that failed is remembered as failed and is not built again."
kind = "behavior"
case = "../../../cases/consistency/generic_values/candidate_body_fails.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_starts_with = "6\n"

[[tests]]
name = "generic_values.err_no_candidate_compiles"
desc = "Not one of the two generic overloads compiles for the types the position fixes: the name cannot be given its types, and the errors the attempts made are reported with it, because there is no candidate left to try."
kind = "negative"
case = "../../../cases/consistency/generic_values/err_no_candidate_compiles.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "live DREF"]
expect_output_contains = ["name=SemanticDiag::GenericFunctionAsValue", "its body does not compile for these types", "name=SemanticDiag::WhenConditionUnmet"]
