id = "consistency.match"
order = 354
tier = "feat"
tags = ["feat", "consistency", "compile", "match"]
desc = "A match must have a default case: without `case _` it is a compile-time error, and the compiler adds no arm"

# Design principles 3.7: a `match` must have `case _`; a match over a bool that lists both
# literals and the fixed patterns over `T?` / `T!` are complete without it. The compiler adds
# no arm the program does not show (an earlier version added one that faulted at run time,
# RuntimeDiag::MatchNotExhaustive, and only warned).

[defaults]
kind = "negative"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized", "diagnostics"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::MatchWithoutDefault"
expect_output_not_contains = ["Floating point exception", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 20000

[[tests]]
name = "match.no_default_string"
desc = "A match over a string without `case _`: an error at the match that names the type; nothing runs."
case = "../../../cases/consistency/match/no_case_matches_string.cml"
expect_diagnostic_line = 8
expect_diagnostic_column = 12
expect_diagnostic_code = "0x030000B0"
expect_output_contains = ["This 'match' on a value of type 'string' has no 'case _'"]

[[tests]]
name = "match.no_default_int"
desc = "The same over an int, in a match written as a statement of a sync body with block arms and a case of two patterns."
case = "../../../cases/consistency/match/no_case_matches_int.cml"
expect_diagnostic_line = 9
expect_diagnostic_column = 5

[[tests]]
name = "match.one_bool_case"
desc = "A match over a bool that lists only true is not complete."
case = "../../../cases/consistency/match/one_bool_case.cml"
expect_diagnostic_line = 7
expect_diagnostic_column = 12

[[tests]]
name = "match.complete"
desc = "A match with `case _`, one over a bool with both literals, and the fixed patterns over T? and T! compile without a diagnostic; their results are unchanged."
kind = "behavior"
case = "../../../cases/consistency/match/complete_matches.cml"
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_diagnostic_name = ""
verify_script = """
const out = input.normalized.stdout.trim()
const want = ['1 0', 'yes no any any', '0 5', 'ok 12 ParseError'].join('\n')
assert(out === want, `unexpected output: ${out}`)
assert(input.stderr === '', 'no diagnostic: ' + input.stderr)
"""

[[tests]]
name = "match.no_added_arm"
desc = "The graph of a complete match has exactly the arms the program wrote: no operator of the compiler's own in it."
kind = "behavior"
case = "../../../cases/consistency/match/complete_matches.cml"
args = ["${case}", "std::rgir"]
backends = ["nvm"]
backends_agree = []
expect_exit = 0
expect_diagnostic_name = ""
expect_output_not_contains = ["match_fail"]
