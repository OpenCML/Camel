name = "partial_application.values.macro_opt"
desc = "The same program through std::macro, std::opt, std::prl."
case = "../../../cases/consistency/partial_application/values.cml"
args = ["${case}", "std::macro", "std::opt", "std::prl"]
backends = ["nvm"]
backends_agree = []
golden = "golden/partial_application_values.txt"

[[tests]]
name = "partial_application.graph"
desc = "The graph of `let g = inc<1>`: a subgraph of its own that calls inc, with the bound argument entering through a closure port, held by a function value with one captured slot. No node of another graph is referred to."
case = "../../../cases/consistency/partial_application/graph.cml"
args = ["${case}", "std::gir"]
backends = ["nvm"]
backends_agree = []
snapshot_compare = "gir_dot_isomorphic"
golden = "golden/partial_application_graph.dot"

[[tests]]
name = "partial_application.err_argument_type"
desc = "A context argument of the wrong type: the binding is refused where it is written (it used to be dropped, and the call of the result failed with a message about the wrong thing)."
kind = "negative"
case = "../../../cases/consistency/partial_application/err_argument_type.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error"]
expect_output_contains = ["name=SemanticDiag::PartialApplicationRefused", "err_argument_type.cml:4:"]

[[tests]]
name = "partial_application.err_configured_twice"
desc = "`g<2>` with a `g` that already has its context arguments."
kind = "negative"
case = "../../../cases/consistency/partial_application/err_configured_twice.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error"]
expect_output_contains = ["name=SemanticDiag::PartialApplicationRefused", "err_configured_twice.cml:5:"]

[[tests]]
name = "partial_application.var_parameter"
desc = "A function with a `var` context parameter can be partially applied (graph model Q9, `partial-application-var`): `add<t>` is a function value that captured the cell of `t`, and each call writes it through the capture, so the calls accumulate. `sync` stands on the value's type because calling it writes the captured variable, and the function the value makes writes the capture the way the forwarder does."
kind = "behavior"
case = "../../../cases/consistency/partial_application/var_parameter.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["[Error]", "error[", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
assert(out === "1 3 6 6\n16 16", `unexpected output: ${out}`)
}
"""
timeout_ms = 30000

[[tests]]
name = "partial_application.var_parameter_effect"
desc = "The value `add<t>` makes writes the cell it captured: `g(1)` is recorded as a write of `t`, so inside a sync block the call runs and a read of `t` written after it sees the write (design principles 3.5, F3); outside one the call is taken by nothing and does not run, so the read still sees the value `t` had."
kind = "behavior"
case = "../../../cases/consistency/partial_application/var_parameter_effect.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["[Error]", "error[", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
assert(out === "1 0", `unexpected output: ${out}`)
}
"""
timeout_ms = 30000

[[tests]]
name = "partial_application.err_ambiguous"
desc = "Two functions of one name take the context argument exactly: a parameter of function type says which is meant; a let without a type cannot, and reports the same ambiguity an ordinary call reports, listing both candidates (SemanticDiag::AmbiguousCall)."
kind = "negative"
case = "../../../cases/consistency/partial_application/err_ambiguous.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error"]
expect_output_contains = ["name=SemanticDiag::AmbiguousCall", "err_ambiguous.cml:12:13:", "<k: int> (x: int) => int", "<k: int> (x: float) => float", "annotate the literal with its type"]

[[tests]]
name = "partial_application.err_entering_ambiguous"
desc = "A context literal that enters two parameter types does not choose either: `scale<2>` with `with <k: f32>` and `with <k: float>` is refused with the same ambiguity diagnostic and candidate list as an ordinary call (design principles 5.1, H27e)."
kind = "negative"
case = "../../../cases/consistency/partial_application/err_entering_ambiguous.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error"]
expect_output_contains = ["name=SemanticDiag::AmbiguousCall", "err_entering_ambiguous.cml:10:13:", "<k: f32> (x: f32) => f32", "<k: float> (x: float) => float", "annotate the literal with its type"]

[[tests]]
name = "partial_application.context_arguments"
desc = "The context arguments are positions with an expected type, as ordinary arguments are (design principles 4.4, 5.1): `scale<2>` binds an int literal to `with <k: f32>`, `at<[7.0, 8.0]>` an array literal to `with <xs: f32[]>`, `offset<{ x: 1, y: 2 }>` a struct literal to a struct-typed parameter. The four back ends agree."
kind = "behavior"
case = "../../../cases/consistency/partial_application/context_arguments.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["[Error]", "error[", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
assert(out === "6.0 8.0 1.5", `unexpected output: ${out}`)
}
"""
timeout_ms = 30000

[[tests]]
name = "partial_application.overload_choice"
desc = "A context argument chooses its overload as an ordinary call does (design principles 4.4, 5.1): exact match first, and only when there is none does the literal enter a parameter type. `scale<2>` with `with <k: int>` and `with <k: f32>` is the int one, `at<[7.0, 8.0]>` with `with <xs: float[]>` and `with <xs: f32[]>` is the float[] one, and `half<3>` with only `with <k: f32>` still takes the literal as an f32. The four back ends agree."
kind = "behavior"
case = "../../../cases/consistency/partial_application/overload_choice.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["[Error]", "error[", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
assert(out === "6\n16.0\n4.5", `unexpected output: ${out}`)
}
"""
timeout_ms = 30000

[[tests]]
name = "partial_application.err_overload_choice_name"
desc = "Exact match first never means a name is converted: `n` is an int and neither `with <k: f32>` nor `with <k: float>` takes an int exactly, so `scale<n>` is refused (design principles 5.1)."
kind = "negative"
case = "../../../cases/consistency/partial_application/err_overload_choice_name.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error"]
expect_output_contains = ["name=SemanticDiag::PartialApplicationRefused", "err_overload_choice_name.cml:18:13:", "<k: f32> (x: f32) => f32", "<k: float> (x: float) => float"]

[[tests]]
name = "partial_application.err_context_argument_name"
desc = "A name bound as a context argument is a value of its own type and does not convert: `scale<n>` with `n: int` and `with <k: f32>` is still a refused partial application (design principles 5.1)."
kind = "negative"
case = "../../../cases/consistency/partial_application/err_context_argument_name.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error"]
expect_output_contains = ["name=SemanticDiag::PartialApplicationRefused", "err_context_argument_name.cml:13:"]

[[tests]]
name = "partial_application.err_context_argument_out_of_range"
desc = "An element of a composite literal bound as a context argument is reported at the element, quoting it as written (`1e40`): `at<[1.0, 1e40]>` with `with <xs: f32[]>` is `LiteralNotRepresentable`, not `NoMatchingFunction` and not the whole literal."
kind = "negative"
case = "../../../cases/consistency/partial_application/err_context_argument_out_of_range.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::LiteralNotRepresentable"
expect_diagnostic_line = 12
expect_diagnostic_column = 22
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error"]
expect_output_contains = ["'1e40'", "type 'f32'", "out of range (at most about 3.4e38 in magnitude)"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
