id = "consistency.partial_application"
order = 358
tier = "fast"
tags = ["feat", "consistency", "compile", "with", "closures"]
desc = "f<w> used as a value is a partial application: a function that already has its context arguments (design principles 4.4)"

# On the graph it is a function value carrying the captured arguments, the shape a closure
# has. The four back ends must agree, and the pipelines must not change the result.
#
# One row of back ends, no `backends_agree`. Fifteen entries below run on `nvm` alone -- one pass
# pipeline each, or a refusal that precedes every pass -- and every one of them used to write
# `backends_agree = []` beside `backends = ["nvm"]`. The runner reads that field only for a back end
# after the first (`run-tests.mjs#expandBackends` leaves `__backendReference` null at index 0), so on
# a one-row entry it is never read: the `[]` and the `["exit_code", "stdout_normalized"]` that
# `[defaults]` carries assert exactly as much, which is nothing. The lines are gone because
# `test/tools/check-plan-fields.mjs` counts such a write as `empty-value` -- an entry that looks like
# it compares and compares nothing -- and because a ratchet only asks about growth: thirteen of them
# sat in the accepted baseline as findings nobody had to answer for, which is how a count comes to
# overstate what the tree really carries.

[defaults]
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["[Error]", "error[", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

[[tests]]
name = "partial_application.values"
desc = "Bound to a name, with a computed argument, with only the first context parameters (the rest stay), passed, returned, configured through a function-typed parameter, handed to map, chosen among overloads by the context argument or by the parameter, and with an effectful function."
case = "../../../cases/consistency/partial_application/values.cml"
golden = "golden/partial_application_values.txt"

[[tests]]
name = "partial_application.values.opt"
desc = "The same program through std::opt, std::nvm."
case = "../../../cases/consistency/partial_application/values.cml"
args = ["${case}", "std::opt", "std::nvm"]
backends = ["nvm"]
golden = "golden/partial_application_values.txt"

[[tests]]
name = "partial_application.values.inline"
desc = "The same program through std::cxx::inline, std::fvm."
case = "../../../cases/consistency/partial_application/values.cml"
args = ["${case}", "std::cxx::inline", "std::fvm"]
backends = ["nvm"]
golden = "golden/partial_application_values.txt"

[[tests]]
name = "partial_application.values.simplify"
desc = "The same program through std::opt, std::nvm."
case = "../../../cases/consistency/partial_application/values.cml"
