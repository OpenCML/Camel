id = "consistency.partial_application"
order = 358
tier = "feat"
tags = ["feat", "consistency", "compile", "with", "closures"]
desc = "f<w> used as a value is a partial application: a function that already has its context arguments (design principles 2.10)"

# On the graph it is a function value carrying the captured arguments, the shape a closure
# has. The four back ends must agree, and the pipelines must not change the result.

[defaults]
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["[Error]", "error[", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

[[tests]]
name = "partial_application.values"
desc = "Bound to a name, with a computed argument, with only the first context parameters (the rest stay), passed, returned, configured through a function-typed parameter, handed to map, chosen among overloads by the context argument or by the parameter, and with an effectful function."
case = "../../../cases/consistency/partial_application/values.cml"
golden = "golden/partial_application_values.txt"

[[tests]]
name = "partial_application.values.opt"
desc = "The same program through std::opt, std::nvm."
case = "../../../cases/consistency/partial_application/values.cml"
args = ["${case}", "std::opt", "std::nvm"]
backends = ["nvm"]
backends_agree = []
golden = "golden/partial_application_values.txt"

[[tests]]
name = "partial_application.values.inline"
desc = "The same program through std::opt::inline, std::fvm."
case = "../../../cases/consistency/partial_application/values.cml"
args = ["${case}", "std::opt::inline", "std::fvm"]
backends = ["nvm"]
backends_agree = []
golden = "golden/partial_application_values.txt"

[[tests]]
name = "partial_application.values.simplify"
desc = "The same program through std::opt, std::nvm."
case = "../../../cases/consistency/partial_application/values.cml"
args = ["${case}", "std::opt", "std::nvm"]
backends = ["nvm"]
backends_agree = []
golden = "golden/partial_application_values.txt"

[[tests]]
name = "partial_application.values.inline_opt"
desc = "The same program through std::opt::inline, std::opt, std::jit."
case = "../../../cases/consistency/partial_application/values.cml"
args = ["${case}", "std::opt::inline", "std::opt", "std::jit"]
backends = ["nvm"]
backends_agree = []
golden = "golden/partial_application_values.txt"

[[tests]]
name = "partial_application.values.macro_opt"
desc = "The same program through std::macro, std::opt, std::prl."
case = "../../../cases/consistency/partial_application/values.cml"
args = ["${case}", "std::macro", "std::opt", "std::prl"]
backends = ["nvm"]
backends_agree = []
golden = "golden/partial_application_values.txt"

[[tests]]
name = "partial_application.graph"
desc = "The graph of `let g = inc<1>`: a subgraph of its own that calls inc, with the bound argument entering through a closure port, held by a function value with one captured slot. No node of another graph is referred to."
case = "../../../cases/consistency/partial_application/graph.cml"
args = ["${case}", "std::gir"]
backends = ["nvm"]
backends_agree = []
snapshot_compare = "gir_dot_isomorphic"
golden = "golden/partial_application_graph.dot"

[[tests]]
name = "partial_application.err_argument_type"
desc = "A context argument of the wrong type: the binding is refused where it is written (it used to be dropped, and the call of the result failed with a message about the wrong thing)."
kind = "negative"
case = "../../../cases/consistency/partial_application/err_argument_type.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error"]
expect_output_contains = ["name=SemanticDiag::PartialApplicationRefused", "err_argument_type.cml:4:"]

[[tests]]
name = "partial_application.err_configured_twice"
desc = "`g<2>` with a `g` that already has its context arguments."
kind = "negative"
case = "../../../cases/consistency/partial_application/err_configured_twice.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error"]
expect_output_contains = ["name=SemanticDiag::PartialApplicationRefused", "err_configured_twice.cml:5:"]

[[tests]]
name = "partial_application.err_var_parameter"
desc = "A function with a `var` context parameter: refused, not guessed (DESIGN-QUESTION(partial-application-var))."
kind = "negative"
case = "../../../cases/consistency/partial_application/err_var_parameter.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error"]
expect_output_contains = ["name=SemanticDiag::ConstructNotSupported", "err_var_parameter.cml:5:5:"]

[[tests]]
name = "partial_application.err_ambiguous"
desc = "Two functions of one name take the context argument: a parameter of function type says which is meant; a let without a type cannot."
kind = "negative"
case = "../../../cases/consistency/partial_application/err_ambiguous.cml"
args = ["-E", "short", "${case}"]
backends = ["nvm"]
backends_agree = []
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error"]
expect_output_contains = ["name=SemanticDiag::PartialApplicationRefused", "err_ambiguous.cml:12:"]
