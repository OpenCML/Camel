[[tests]]
name = "format.use_tabs_option"
desc = "Applies tab indentation when --use-tabs is passed."
kind = "behavior"
tool = "camel-format"
case = "../../../cases/format/options.cml"
args = ["--use-tabs", "${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
    assert(input.exit_code === 0, `camel-format exited ${input.exit_code}`)
    assert(/\tlet msg = 'hello'/.test(input.stdout), "expected a tab-indented let statement")
    assert(!input.stdout.includes("    let msg = 'hello'"), "did not expect four-space indentation")
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

