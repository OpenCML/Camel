[[tests]]
name = "format.syntax_error"
desc = "Reports parser diagnostics instead of crashing on malformed input."
kind = "negative"
tool = "camel-format"
case = "../../../cases/format/syntax_error.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SyntaxDiag::UnexpectedToken"
expect_diagnostic_code = "0x0200000A"
expect_diagnostic_line = 1
expect_diagnostic_column = 11
expect_output_contains = ["Unexpected ':'; expected ',', ')', 'var', 'constas' or a name."]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

