[[tests]]
name = "format.when_clause_snapshot"
desc = "A declaration's applicability condition follows the result type: `when is_ordered::<T>()` is one space after it, whatever spacing the source used, and it is not dropped. A condition written on its own line in the source is joined to the signature when the head fits the wrap width. A rule's condition is written between its parameters and its body, never after the body (design principles 4.4; the rulings of 2026-10-24 and 2026-10-25)."
kind = "snapshot"
tool = "camel-format"
case = "../../../cases/format/when_clause.cml"
args = ["${case}"]
expect_exit = 0
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
golden = "./golden/when_clause.cml"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

