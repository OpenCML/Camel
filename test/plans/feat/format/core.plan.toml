id = "format.core"
order = 320
tier = "feat"
tags = ["feat", "format", "formatter"]

[[tests]]
name = "format.namespace_snapshot"
desc = "Formats namespace, using namespace, and type-qualified calls through camel-format."
kind = "snapshot"
tool = "camel-format"
case = "../../../cases/format/namespace_messy.cml"
args = ["${case}"]
expect_exit = 0
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
golden = "./golden/namespace.cml"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

