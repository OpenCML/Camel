id = "docs.ai_reference"
order = 926
tier = "fast"
tags = ["feat", "docs"]
desc = "docs/reference/camel-for-ai.md is what its normative sources produce: the four generated regions (keywords, precedence, diagnostics, standard-library signatures) match what scripts/camel-for-ai.mjs reads from the token table, the parser's productions, the diagnostic registry and the generated standard-library page; every diagnostic the prose names is declared by the registry; and the file stays within the character budget it states"

# The page for AI readers is one file that must stay true to the tree without being read by hand
# every time. Four regions of it are generated, and the check regenerates them: a diagnostic that
# changes its message, a keyword that is added, an expression level that is inserted or a library
# signature that changes is reported here instead of shipping in the page.
#
# The check also holds the prose to the two rules the page states for itself: a diagnostic is named
# with its section (`SemanticDiag::UnresolvedReference`) and must be one the registry declares, so a
# renamed or deleted diagnostic cannot stay in an error entry; and a `target` note names where its
# subject is designed, as a `docs/...` path, so "not implemented yet" always points somewhere.
#
# The proof cases run the same guard over test/plans/feat/docs_ai_reference/fixture, whose sources
# are reduced copies of the four real ones, so each red condition is pinned without depending on the
# language: a region that is not what its source produces, a missing region marker, a diagnostic
# name the registry does not declare, and a task number in a public document.

[[tests]]
name = "docs.ai_reference.current"
desc = "The four generated regions of docs/reference/camel-for-ai.md are what their sources produce, every diagnostic the prose names exists, and the file is within its budget."
kind = "behavior"
tool = "node"
case = "../../../scripts/camel-for-ai.mjs"
args = ["${case}", "--check"]
expect_exit = 0
expect_stdout_contains = ["docs/reference/camel-for-ai.md is what its sources produce", "generated region(s)", "diagnostic name(s) cited by the prose", "characters (budget 112000)"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000

[[tests]]
name = "docs.ai_reference.errors_verified"
desc = "Every counter-example in the page is compiled, and the diagnostic its entry names is the one the compiler reports: the errors section is checked against the compiler, not only against the registry."
kind = "behavior"
tool = "node"
case = "../../../scripts/camel-for-ai.mjs"
args = ["${case}", "--verify-errors"]
expect_exit = 0
expect_stdout_contains = ["promises what the compiler answers", "counter-example(s) compiled"]
normalizers = ["normalize_newlines"]
timeout_ms = 180000

[[tests]]
name = "docs.ai_reference.fixture_consistent"
desc = "The reduced document of the proof case is consistent with the reduced sources beside it: the guard is green on a small root, so the red cases below are red for their own reason."
kind = "behavior"
tool = "node"
case = "../../../scripts/camel-for-ai.mjs"
args = ["${case}", "--check", "--root", "test/plans/feat/docs_ai_reference/fixture"]
expect_exit = 0
expect_stdout_contains = ["is what its sources produce", "4 diagnostic"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000

[[tests]]
name = "docs.ai_reference.stale_region"
desc = "A generated region that no longer matches its source fails, naming the region and the command that rewrites it."
kind = "behavior"
tool = "node"
case = "../../../scripts/camel-for-ai.mjs"
args = ["${case}", "--check", "--root", "test/plans/feat/docs_ai_reference/fixture", "--document", "docs/reference/cases/stale.md"]
expect_exit = 1
expect_stdout_contains = ["the 'diagnostics' region is not what its source produces", "run `node scripts/camel-for-ai.mjs --write`", "1 problem(s) in docs/reference/cases/stale.md"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000

[[tests]]
name = "docs.ai_reference.missing_marker"
desc = "A region whose begin marker is gone is a defect, not an empty region; the check counts the markers and fails."
kind = "behavior"
tool = "node"
case = "../../../scripts/camel-for-ai.mjs"
args = ["${case}", "--check", "--root", "test/plans/feat/docs_ai_reference/fixture", "--document", "docs/reference/cases/no-marker.md"]
expect_exit = 1
expect_stdout_contains = ["the region 'precedence' has 1 marker(s); expected a begin and an end"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000

[[tests]]
name = "docs.ai_reference.unknown_diagnostic"
desc = "A diagnostic the prose names but the registry does not declare fails, naming the diagnostic: a renamed or deleted diagnostic cannot stay in the page."
kind = "behavior"
tool = "node"
case = "../../../scripts/camel-for-ai.mjs"
args = ["${case}", "--check", "--root", "test/plans/feat/docs_ai_reference/fixture", "--document", "docs/reference/cases/unknown-diagnostic.md"]
expect_exit = 1
expect_stdout_contains = ["the document names SemanticDiag::EnumMatchNotExhaustive, which diagnostics/registry.tsv does not declare"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000

[[tests]]
name = "docs.ai_reference.task_number"
desc = "A public page that names a task number fails: the documents describe the language, not the work that produced it."
kind = "behavior"
tool = "node"
case = "../../../scripts/camel-for-ai.mjs"
args = ["${case}", "--check", "--root", "test/plans/feat/docs_ai_reference/fixture", "--document", "docs/reference/cases/task-number.md"]
expect_exit = 1
expect_stdout_contains = ["docs/reference/cases/task-number.md:111", "the document names the task 'H123'"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000