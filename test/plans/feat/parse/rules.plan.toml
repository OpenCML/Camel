id = "parse.rules"
order = 303
tier = "fast"
tags = ["feat", "parse", "rules"]
desc = "Rule declarations (rewrite design 2): `rule name(params) when condition { left => right }`, `<=>`, `const` parameters. The condition is part of the signature, so it is written before the body it guards (design principles 4.4; the ruling of 2026-10-24). The grammar reads them and the formatter writes them; the compiler makes the pair of functions and the value of type Rule (module rewrite)."

[[tests]]
name = "rules.ast"
desc = "The AST of a rule is the pair of functions name__lhs and name__rhs, the declaration `let name = __rule(...)` whose initializer makes the Rule value, and for a rule with a condition the function name__when."
kind = "behavior"
case = "../../../cases/parse/rules/values.cml"
args = ["${inspect_ast}", "${case}"]
expect_exit = 0
expect_stdout_contains = ["FuncDecl: mul_one__lhs", "FuncDecl: mul_one__rhs", "DataDecl: mul_one", "FuncDecl: swap__lhs", "FuncDecl: swap__rhs", "FuncDecl: guarded__lhs", "FuncDecl: guarded__rhs", "FuncDecl: guarded__when"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "rules.generic_head"
desc = "A rule declares its type parameters after its name, like a function: `rule keep::<T>(x: T, y: T)` parses into the same pair of functions, `keep__lhs` and `keep__rhs`. The type parameters are visible at the head, and the head changes the maker: the pair is not passed as two function values -- a generic function has no value (design principles 5.5) -- but named to `__rule_generic`, which registers their templates and gives the rule value the id it keeps. The `Rule` a generic head makes is a value the rewrite engine instantiates where it matches (the ruling of 2026-10-23 on `generic-rule-instantiation`)."
kind = "behavior"
case = "../../../cases/parse/rules/generic_head.cml"
args = ["${inspect_ast}", "${case}"]
expect_exit = 0
expect_stdout_contains = ["FuncDecl: keep__lhs", "FuncDecl: keep__rhs", "DataDecl: keep", "RefData: __rule_generic", "RefData: keep__lhs", "RefData: keep__rhs"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "rules.pending_parts"
desc = "A condition is compiled since H38; the context of a rule (`rule fuse<f, g>`) is read but not compiled yet: a located ConstructNotSupported."
kind = "behavior"
case = "../../../cases/parse/rules/declared.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ConstructNotSupported"
expect_diagnostic_line = 7
expect_diagnostic_column = 10
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "rules.values"
desc = "A rule is a value of the type Rule: the module rewrite reads its name, direction and const parameters back, and the two functions can be called."
kind = "behavior"
case = "../../../cases/parse/rules/values.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
expect_exit = 0
expect_stdout_contains = ["mul_one false 0", "swap true 2", "guarded false 0", "7 7"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "rules.names_stay_names"
desc = "A variable may be called `rule` or `when`."
kind = "behavior"
case = "../../../cases/parse/rules/names.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["7"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "rules.needs_an_arrow"
desc = "A rule body without `=>` or `<=>` is a located syntax error that names both."
kind = "behavior"
case = "../../../cases/parse/rules/no_arrow.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SyntaxDiag::UnexpectedToken"
expect_diagnostic_line = 3
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "rules.when_after_the_body"
desc = "A `when` written after the body of a rule is refused by name: the condition of a declaration is written before the body it guards (design principles 4.4; the ruling of 2026-10-24 on the `when` placement), and the diagnostic says where it belongs instead of only that a token did not fit."
kind = "behavior"
case = "../../../cases/parse/rules/when_after_body.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SyntaxDiag::WhenAfterBody"
expect_diagnostic_line = 4
expect_diagnostic_column = 37
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "rules.format_snapshot"
desc = "camel-format writes the rule declarations on one line each, the condition between the parameters and the body (design principles 4.4; the ruling of 2026-10-24)."
kind = "snapshot"
tool = "camel-format"
case = "../../../cases/parse/rules/declared.cml"
args = ["${case}"]
expect_exit = 0
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
golden = "golden/rules_format.cml"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000
