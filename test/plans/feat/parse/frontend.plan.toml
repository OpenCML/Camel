id = "parse.frontend"
order = 305
tier = "fast"
tags = ["feat", "parse", "grammar", "format"]
desc = "The hand-written front end as a whole: the grammar in the language reference is the one the parser implements, every case of the parse corpus is read as recorded, the formatter keeps the meaning of what it formats, and the parser returns a lossless tree for wrong programs."

[[tests]]
name = "grammar.reference_in_step"
desc = "The productions written above the parser's functions, the grammar blocks of the language reference (both languages), the token table and the node kinds agree (scripts/check-grammar.mjs --check)."
kind = "behavior"
tool = "node"
case = "../../../../scripts/check-grammar.mjs"
args = ["${case}", "--check"]
expect_exit = 0
expect_stdout_contains = ["in step with the parser"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000

[[tests]]
name = "frontend.ast_snapshot"
desc = "Every case of the parse corpus (test/cases/parse) and every probe of the grammar's decisions (test/tools/parsecheck/probes.py) gives the AST, node for node with token ranges and origins, that was recorded when the parser was compared with the ANTLR parser it replaced. The snapshot is of the parser's tests, not of the repository: a .cml file under examples/, stdlib/, benchmarks/ or another plan's cases is checked by the plan that owns it (H188)."
kind = "behavior"
tool = "python"
case = "../../../tools/parsecheck/check.py"
args = ["${case}", "snapshot"]
expect_exit = 0
expect_stdout_contains = ["files read as recorded"]
normalizers = ["normalize_newlines"]
timeout_ms = 120000

[[tests]]
name = "frontend.format_keeps_ast"
desc = "Formatting an accepted file gives a text that parses to the same AST (the order of imports aside): where the formatter breaks a line or removes a space, the two layout rules must not change the meaning. Every comment of the input is in that text as many times as it stood there (a comment is no node of the AST, so the tree comparison cannot see one the formatter dropped, and a search for its text finds another comment that reads the same), nothing the input did not write is written (a duplicate is invisible to the tree comparison too), and none of them had to be written at the end of the file instead of where it stood. Formatting the result again changes nothing (comments after match cases and after imports used to be written twice)."
kind = "behavior"
tool = "python"
case = "../../../tools/parsecheck/check.py"
args = ["${case}", "format"]
expect_exit = 0
expect_stdout_contains = ["changed=0", "unstable=0", "dropped=0", "duplicated=0", "unplaced=0"]
normalizers = ["normalize_newlines"]
timeout_ms = 120000


[[tests]]
name = "frontend.fuzz_lossless_tree"
# Slow layer: measured 9.7 s in the full serial run.
tier = "slow"
desc = "3000 mutated programs (tokens deleted, duplicated, swapped, inserted, files cut and spliced, white space changed): the parser returns for each a tree whose leaves are exactly the tokens of the text, and the AST builder accepts every tree without errors."
kind = "behavior"
tool = "python"
case = "../../../tools/parsecheck/check.py"
args = ["${case}", "fuzz", "3000", "1"]
expect_exit = 0
expect_stdout_contains = ["failures=0"]
normalizers = ["normalize_newlines"]
timeout_ms = 300000

[[tests]]
name = "syntax.resource_group_open"
desc = "`resource a =` with the text ending right after the `=`. The group of a resource is written in brackets and the bracket is asked for: it is reported where the text ends instead of the token that stands there being read as it. Read as it, the terminal token stood in the tree twice - once as the `[` and once as the end of the Program - and `camel-parsecheck fuzz` reported \"the leaves of the tree are not the tokens of the text\" (H417). This is that input, written down instead of drawn from a seed."
kind = "negative"
case = "../../../cases/parse/syntax/resource_group_open.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SyntaxDiag::MissingToken"
expect_diagnostic_code = "0x02000009"
expect_diagnostic_line = 11
expect_diagnostic_column = 13
expect_output_contains = ["Expected '[' before the end of the file."]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "syntax.tag_group_open"
desc = "`tag finite =` with the text ending right after the `=`: the group of a tag is written in brackets like the group of a resource, and the bracket is reported rather than the token that stands there being read as it (H417)."
kind = "negative"
case = "../../../cases/parse/syntax/tag_group_open.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SyntaxDiag::MissingToken"
expect_diagnostic_code = "0x02000009"
expect_diagnostic_line = 8
expect_diagnostic_column = 13
expect_output_contains = ["Expected '[' before the end of the file."]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "syntax.ident_list_open"
desc = "`resource a = [b,` with the text ending after the comma: the name that the comma promises is asked for and reported, the list closes without one, and the `]` that is missing is named by the diagnostic that says which `[` it belongs to. The terminal token is left to the Program node, so the tree is lossless (H417)."
kind = "negative"
case = "../../../cases/parse/syntax/ident_list_open.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SyntaxDiag::MissingClosingDelimiter"
expect_diagnostic_code = "0x02000001"
expect_diagnostic_line = 9
expect_diagnostic_column = 17
expect_output_contains = ["Expected ']' before the end of the file, to close the '['."]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "syntax.type_params_open"
desc = "`func f::<` with the text ending right after the `<`: the first type parameter's name is required and reported, and the declaration closes without one. Reading the token that stands there put the terminal token in the tree twice and made `camel-parsecheck fuzz` report \"the leaves of the tree are not the tokens of the text\" (H417)."
kind = "negative"
case = "../../../cases/parse/syntax/type_params_open.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SyntaxDiag::UnexpectedEndOfFile"
expect_diagnostic_code = "0x0200000B"
expect_diagnostic_line = 9
expect_diagnostic_column = 10
expect_output_contains = ["The file ends in the middle of a construct; expected a name."]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000
