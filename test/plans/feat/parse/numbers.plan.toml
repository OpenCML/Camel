id = "parse.numbers"
order = 302
tier = "feat"
tags = ["feat", "parse", "lexer", "numbers"]
desc = "Numbers carry no sign in the token stream; the formatter writes binary operators spaced and literal signs tight"

[[tests]]
name = "numbers.tok_snapshot"
desc = "`a-1` is three tokens, `-1` two, the sign of an exponent stays in the number, `t.0.1` is `t`, `.`, `0.1`."
kind = "snapshot"
case = "../../../cases/parse/numbers/tokens.cml"
args = ["${inspect_tok}", "${case}"]
expect_exit = 0
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
golden = "golden/numbers_tok.txt"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 4000

[[tests]]
name = "numbers.ast_snapshot"
desc = "The AST of the same file: subtractions, signed literals, and the two accesses `t.0.1` stands for."
kind = "snapshot"
case = "../../../cases/parse/numbers/tokens.cml"
args = ["${inspect_ast}", "${case}"]
expect_exit = 0
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
golden = "golden/numbers_ast.txt"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 4000

[[tests]]
name = "numbers.member_index_exponent"
desc = "`t.0.1e2` is not a chain of indices: a located InvalidLiteral."
kind = "behavior"
case = "../../../cases/parse/numbers/member_index_exponent.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::InvalidLiteral"
expect_diagnostic_line = 3
expect_diagnostic_column = 15
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 4000

[[tests]]
name = "numbers.format_snapshot"
desc = "camel-format writes `a-1` as `a - 1` and keeps `-1` and `t.0.1`."
kind = "snapshot"
tool = "camel-format"
case = "../../../cases/format/minus.cml"
args = ["${case}"]
expect_exit = 0
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
golden = "golden/numbers_format.cml"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

[[tests]]
name = "numbers.entry_arg_negative"
desc = "`--arg n=-1 --arg rate=-0.5`: the values of `main`'s parameters are read by the command line, not by the lexer, and negative ones are accepted as before."
kind = "behavior"
case = "../../../cases/compile/entry_args/scalars.cml"
args = ["${case}", "--arg", "n=-1", "--arg", "rate=-0.5", "--arg", "name=x", "--arg", "loud=false"]
expect_exit = 0
expect_stdout_contains = ["x -1 -0.5 false"]
expect_output_not_contains = ["Error"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000
