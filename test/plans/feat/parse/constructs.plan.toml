id = "parse.constructs"
order = 310
tier = "fast"
tags = ["feat", "parse", "constructs"]
desc = "The parser's construct corpus: one small case for each construct the grammar supports that the older parse cases did not exercise on their own. The AST snapshot (frontend.ast_snapshot) reads the rest of the repository as well, so a construct that appears only in stdlib or an example is hashed there too; this corpus is what gives each construct a file that is one construct, compiled and run, and a construct no case here writes is one whose own reading and value nothing pins."

# Every case is also a program that compiles and runs, so the construct it is about is exercised
# from the parse tree through GCT to the value, not only hashed by the AST snapshot. A `fact`
# declares alone: a fact is knowledge for rules and a pass module, not a function that ordinary
# code calls.

[defaults]
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "Internal"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 12000

[[tests]]
name = "constructs.enum"
desc = "`type C = enum { ... }` with a bare variant, a tuple variant and a struct variant, and a match on each pattern form (`Shape::Empty`, `Shape::Circle(r)`, `Shape::Rect { w, h }`)."
kind = "behavior"
case = "../../../cases/parse/constructs/enum.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["g", "3.14159", "6.0", "0.0"]

[[tests]]
name = "constructs.tags"
desc = "`tag` declarations with positions (`on nodes`, `on func`), a `read_by` pass, a grouped tag (`= [a, b]`), a tagged type, a tagged field, and `#name`, `#[a, b]` and `#name(value)` uses."
kind = "behavior"
case = "../../../cases/parse/constructs/tags.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["3"]

[[tests]]
name = "constructs.static_loop"
desc = "`static loop` over the fields of a generic `T`, of a struct type, of a tuple type and of the empty struct, with one state and with two states."
kind = "behavior"
case = "../../../cases/parse/constructs/static_loop.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["6", "16 9", "9", "7"]

[[tests]]
name = "constructs.rest_signature"
desc = "`...ts`, the last parameter of a signature, and `...e`, the last argument of a call: written out, expanded from a tuple literal, and forwarded as `...ts`."
kind = "behavior"
case = "../../../cases/parse/constructs/rest_signature.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["6", "9", "13"]

[[tests]]
name = "constructs.constas_param"
desc = "`constas n: int`, a compile-time value parameter written before the ordinary parameters and read as an extent of another parameter's type."
kind = "behavior"
case = "../../../cases/parse/constructs/constas_param.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["3.0", "5.0"]

[[tests]]
name = "constructs.comprehensions"
desc = "A `static for` written where a value is needed: the struct comprehension `{ ... }`, the tuple comprehension `( ... )`, a round whose body is a block, and the empty struct."
kind = "behavior"
case = "../../../cases/parse/constructs/comprehensions.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["2 4", "4 5", "11 21"]

[[tests]]
name = "constructs.fact"
desc = "`fact name: type match v { ... } join f`: the cases that say what the fact is (a `const` case and a pattern case) and the clause that says how two facts are merged."
kind = "behavior"
case = "../../../cases/parse/constructs/fact.cml"
args = ["${case}"]
expect_exit = 0

[[tests]]
name = "constructs.operator_name"
desc = "`func operator +(...)` and `func operator [](...)`: an operator overload declared with the `operator` name, and the same operator written at the call."
kind = "behavior"
case = "../../../cases/parse/constructs/operator_name.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["4 6", "20"]

[[tests]]
name = "constructs.type_arguments"
desc = "Type arguments at a call: by position (`f::<int>`), by name in either order (`f::<A = int, B = string>`), and alone as a function value (`f::<T = float>`)."
kind = "behavior"
case = "../../../cases/parse/constructs/type_arguments.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["(1, s)", "2.5", "1"]

[[tests]]
name = "constructs.constas"
desc = "`constas n` in a type argument (`f32[constas n]`) with a linear form over the same name (`[n + 1]`), and the named field index `t.[n]` it enables."
kind = "behavior"
case = "../../../cases/parse/constructs/constas.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["5.0"]

[[tests]]
name = "constructs.literals"
desc = "The string tokens: `'...'` and `\"...\"` with escapes (`\\t`, `\\x`, `\\x1B`, `\\0`, `\\u{...}`), a plain string that spans a line, and the multi-line `'''...'''` and `\"\"\"...\"\"\"` forms."
kind = "behavior"
case = "../../../cases/parse/constructs/literals.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["it's a string", "a \"quoted\" word", "19 9"]

[[tests]]
name = "constructs.fstring"
desc = "The `FSTRING` token: interpolation, a format specification, an expression, a nested format string, literal braces, the `\\${`, `\\`` and `\\u{...}` escapes, and a format string that spans lines."
kind = "behavior"
case = "../../../cases/parse/constructs/fstring.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["hello, Camel!", "pi = 3.50", "nested: <inner 42>", "braces { } are literal"]

[[tests]]
name = "constructs.match_guard"
desc = "The guard of a match case (`case p when c => body`) in every pattern form: a literal and several alternatives, the wildcard, an enum's tuple and struct variants (the guard reads the names they bind), and the `T?` / `T!` patterns. The guard is a child of the case, after the arm, and the value a guard refuses goes to the cases written after it."
kind = "behavior"
case = "../../../cases/parse/constructs/match_guard.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["30", "20", "6.0", "0.0", "4.0", "-0.5", "-1.0", "2", "3", "4", "7"]

[[tests]]
name = "constructs.resource_modifiers"
desc = "The modifier a resource declaration carries after its name: `readonly` (`resource graph readonly`, design principles 9.12: it is only ever read) beside the `unordered` the grammar already had. `camel inspect --ast` prints `ResourceDecl: graph readonly` for it, so the word the parser read is in the tree and in what the tree prints."
kind = "behavior"
case = "../../../cases/parse/constructs/resource_modifiers.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["42"]

[[tests]]
name = "constructs.resource_modifier_absent"
desc = "The control of `constructs.resource_modifiers`: the same program with no modifier on its declarations still parses, runs and prints the same value, and `camel inspect --ast` prints `ResourceDecl: graph` -- the same name, no modifier. The two cases differ in those words alone, so this is the reading that says the modifier is seen rather than dropped."
kind = "behavior"
case = "../../../cases/parse/constructs/resource_modifier_absent.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["42"]

[[tests]]
name = "constructs.resource_modifier_in_ast"
desc = "What the two declarations above say, read in one place: `camel inspect --ast` of `resource_modifiers.cml` prints `ResourceDecl: graph readonly` and `ResourceDecl: spelling readonly`, and the AST of `resource_modifier_absent.cml` prints `ResourceDecl: graph` and `ResourceDecl: spelling` and no `readonly` anywhere. A reading that could not tell one file's declaration from the other's would have added a word nothing keeps."
kind = "behavior"
case = "../../../cases/parse/constructs/resource_modifiers.cml"
args = ["${inspect_ast}", "${case}"]
expect_exit = 0
expect_stdout_contains = ["ResourceDecl: graph readonly", "ResourceDecl: spelling readonly", "ResourceDecl: log_sink unordered"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]

[[tests]]
name = "constructs.resource_modifier_absent_in_ast"
desc = "The other half of `constructs.resource_modifier_in_ast`: `camel inspect --ast` of the control prints `ResourceDecl: graph` and `ResourceDecl: spelling`, and no `readonly` at all. The pair is the positive control the modifier needs: with the word and without it are two different readings, so the difference is in the tree and not in the case file's name."
kind = "behavior"
case = "../../../cases/parse/constructs/resource_modifier_absent.cml"
args = ["${inspect_ast}", "${case}"]
expect_exit = 0
expect_stdout_contains = ["ResourceDecl: graph", "ResourceDecl: spelling"]
expect_stdout_not_contains = ["readonly"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]

[[tests]]
name = "constructs.resource_modifier_not_in_the_graph"
desc = "Where the modifier is *not* seen, recorded so nobody reads its absence as a regression: `std::gir` prints the graph, and a resource declaration is not a node of it -- the dump names operators, ports, regions and exits, and says nothing about a resource or its modifier. So a `graph readonly` declaration reaches `std::gir` as the same graph as `graph` with no modifier, and the declaration's own reading is `camel inspect --ast` (`constructs.resource_modifier_in_ast`). This entry fails if the graph dump ever starts carrying declarations, which is the point: then the two readings have to agree on purpose."
kind = "behavior"
case = "../../../cases/parse/constructs/resource_modifiers.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
expect_stdout_contains = ["digraph GraphIR"]
expect_stdout_not_contains = ["readonly", "ResourceDecl"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]