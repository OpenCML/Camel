id = "parse.core"
order = 300
tier = "feat"
tags = ["feat", "parse", "inspect"]

[[tests]]
name = "inspect.tok_snapshot"
desc = "Pins the token stream for the canonical fib10 smoke program."
kind = "snapshot"
case = "../../../cases/smoke/core/fib10_pipeline.cml"
args = ["${inspect_tok}", "${case}"]
expect_exit = 0
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
golden = "../../smoke/golden/tok.txt"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 4000

[[tests]]
name = "inspect.cst_snapshot"
desc = "Pins the concrete syntax tree for the canonical fib10 smoke program."
kind = "snapshot"
case = "../../../cases/smoke/core/fib10_pipeline.cml"
args = ["${inspect_cst}", "${case}"]
expect_exit = 0
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
golden = "../../smoke/golden/cst.txt"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 4000

[[tests]]
name = "inspect.ast_snapshot"
desc = "Pins the normalized AST shape for the canonical fib10 smoke program."
kind = "snapshot"
case = "../../../cases/smoke/core/fib10_pipeline.cml"
args = ["${inspect_ast}", "${case}"]
expect_exit = 0
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
golden = "../../smoke/golden/ast.txt"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths", "normalize_addresses"]
timeout_ms = 4000

[[tests]]
name = "syntax.missing_then"
desc = "Checks parser diagnostics for a missing then keyword in an if-expression."
kind = "negative"
case = "../../../cases/parse/syntax/missing_then.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SyntaxDiag::UnknownSyntaxError"
expect_diagnostic_code = "0x02000000"
expect_diagnostic_line = 8
expect_diagnostic_column = 21
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 4000
