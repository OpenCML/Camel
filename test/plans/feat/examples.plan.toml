id = "examples"
order = 910
tier = "fast"
tags = ["feat", "examples"]
desc = "Every program under examples/ that can run on its own runs as its header says and prints the recorded output, on the four back ends"

# One entry per program under examples/, except the three that no entry here can run:
# examples/perf/fibs.cml prints timings, examples/tty/snake.cml is interactive, and
# examples/models/naive-in-expert-out/accuracy.cml is the showcase's measurement harness (the plan
# that runs that example, test/plans/feat/modules/naive_in_expert_out.plan.toml, runs its training
# step). Each entry runs on std::nvm, std::fvm, std::jit and std::prl; the four agree on exit code
# and standard output, and the output is the golden file's. The entries at the end run the other
# command lines the headers give, and examples.python.rules_basket runs the Python project of
# examples/python/rules, which needs `camel-lang` installed in the interpreter and skips without it.
#
# The programs under examples/files and examples/ml, and examples/text/log_filter.cml, write
# their files into CAMEL_TEST_TMPDIR (the test's own scratch directory) when the runner sets it,
# and into tmp/examples (not tracked) on a direct run. They used to write the fixed tmp/examples
# path, which is why their tests were marked `parallel = false`; the per-test directory made
# that mark unnecessary.
# After an intended change of an example's output:
#   node test/tools/run-tests.mjs --update-golden test/plans/feat/examples.plan.toml

[defaults]
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["[Error]", "error[", "warning[", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 60000

