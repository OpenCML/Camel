# Other command lines given in the headers.

[[tests]]
name = "examples.cli.exit_status_ok"
desc = "Usage under the limit: exit code 0."
case = "../../../examples/cli/exit_status.cml"
golden = "golden/examples/cli_exit_status_ok.txt"
args = ["${case}", "--arg", "used=40", "--arg", "limit=80", "${backend}"]

[[tests]]
name = "examples.cli.exit_status_bad_limit"
desc = "A limit that is not positive: exit(2) ends the program after one line."
case = "../../../examples/cli/exit_status.cml"
golden = "golden/examples/cli_exit_status_bad_limit.txt"
args = ["${case}", "--arg", "used=40", "--arg", "limit=0", "${backend}"]
expect_exit = 2

[[tests]]
name = "examples.cli.temperature_unknown_unit"
desc = "An unknown unit is reported through the float! result; the program still ends with 0."
case = "../../../examples/cli/temperature.cml"
golden = "golden/examples/cli_temperature_unknown_unit.txt"
args = ["${case}", "--arg", "value=21.5", "--arg", "unit=K", "--arg", "steps=1", "${backend}"]

[[tests]]
name = "examples.cli.temperature_default_pipeline"
desc = "The command of the header as written, with no pass named."
case = "../../../examples/cli/temperature.cml"
golden = "golden/examples/cli_temperature.txt"
backends = false
args = ["${case}", "--arg", "value=21.5", "--arg", "unit=C", "--arg", "steps=3"]

[[tests]]
name = "examples.cli.temperature_missing_args"
desc = "Without --arg the program is not run: the diagnostic names the parameters of main."
kind = "behavior"
case = "../../../examples/cli/temperature.cml"
backends = false
args = ["${case}"]
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core"]
expect_diagnostic_name = "RuntimeDiag::EntryArgumentMissing"
expect_output_contains = ["'value', 'unit' and 'steps'", "--arg name=value"]

[[tests]]
name = "examples.ml.export_onnx_translate"
desc = "The second command of the header: the program is translated without being run, and onnx::export writes the model."
case = "../../../examples/ml/export_onnx.cml"
golden = "golden/examples/ml_export_onnx_translate.txt"
backends = false
args = ["${case}", "std::macro", "std::opt::simplify", "onnx::export"]
