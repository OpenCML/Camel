id = "examples"
order = 910
tier = "feat"
tags = ["feat", "examples"]
desc = "Every program of examples/ runs as its header says and prints the recorded output, on the four back ends"

# One entry per program under examples/ (examples/perf prints timings and examples/tty is
# interactive: neither is run here). Each entry runs on std::nvm, std::fvm, std::jit and
# std::prl; the four agree on exit code and standard output, and the output is the golden
# file's. The entries at the end run the other command lines the headers give.
#
# The programs under examples/files and examples/ml write to tmp/examples (not tracked).
# After an intended change of an example's output:
#   node test/tools/run-tests.mjs --update-golden test/plans/feat/examples.plan.toml

[defaults]
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["[Error]", "error[", "warning[", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 60000

[[tests]]
name = "examples.algorithms.binary_search"
desc = "Binary search by tail recursion with an int? result."
case = "../../../examples/algorithms/binary_search.cml"
golden = "golden/examples/algorithms_binary_search.txt"

[[tests]]
name = "examples.algorithms.merge_sort"
desc = "Merge sort by recursion, compared with algo.sorted."
case = "../../../examples/algorithms/merge_sort.cml"
golden = "golden/examples/algorithms_merge_sort.txt"

[[tests]]
name = "examples.cli.exit_status"
desc = "main's int result is the exit code: usage over the limit exits with 1."
case = "../../../examples/cli/exit_status.cml"
golden = "golden/examples/cli_exit_status.txt"
args = ["${case}", "--arg", "used=91", "--arg", "limit=80", "${backend}"]
expect_exit = 1

