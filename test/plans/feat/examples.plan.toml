# Other command lines given in the headers.

[[tests]]
name = "examples.cli.exit_status_ok"
desc = "Usage under the limit: exit code 0."
case = "../../../examples/cli/exit_status.cml"
golden = "golden/examples/cli_exit_status_ok.txt"
args = ["${case}", "--arg", "used=40", "--arg", "limit=80", "${backend}"]

[[tests]]
name = "examples.cli.exit_status_bad_limit"
desc = "A limit that is not positive: exit(2) ends the program after one line."
case = "../../../examples/cli/exit_status.cml"
golden = "golden/examples/cli_exit_status_bad_limit.txt"
args = ["${case}", "--arg", "used=40", "--arg", "limit=0", "${backend}"]
expect_exit = 2

[[tests]]
name = "examples.cli.temperature_unknown_unit"
desc = "An unknown unit is reported through the float! result; the program still ends with 0."
case = "../../../examples/cli/temperature.cml"
golden = "golden/examples/cli_temperature_unknown_unit.txt"
args = ["${case}", "--arg", "value=21.5", "--arg", "unit=K", "--arg", "steps=1", "${backend}"]

[[tests]]
name = "examples.cli.temperature_lower_case_unit"
desc = "The unit in lower case with spaces around it is read as F."
case = "../../../examples/cli/temperature.cml"
golden = "golden/examples/cli_temperature_lower_case_unit.txt"
args = ["${case}", "--arg", "value=70.7", "--arg", "unit= f ", "--arg", "steps=2", "${backend}"]

[[tests]]
name = "examples.cli.temperature_default_pipeline"
desc = "The command of the header as written, with no pass named."
case = "../../../examples/cli/temperature.cml"
golden = "golden/examples/cli_temperature.txt"
backends = false
args = ["${case}", "--arg", "value=21.5", "--arg", "unit=C", "--arg", "steps=3"]

[[tests]]
name = "examples.cli.temperature_missing_args"
desc = "Without --arg the program is not run: the diagnostic names the parameters of main."
kind = "behavior"
case = "../../../examples/cli/temperature.cml"
backends = false
args = ["${case}"]
expect_exit = 1
expect_output_not_contains = ["Segmentation fault", "dumped core"]
expect_diagnostic_name = "RuntimeDiag::EntryArgumentMissing"
expect_output_contains = ["'value', 'unit' and 'steps'", "--arg name=value"]

[[tests]]
name = "examples.ml.export_onnx_translate"
desc = "The second command of the header: the program is translated without being run, and onnx::export writes the model. The pass's out parameter names the model in this test's scratch directory (the program's own path is computed at run time and the translator does not run it)."
kind = "behavior"
case = "../../../examples/ml/export_onnx.cml"
backends = false
args = ["${case}", "std::macro", "std::opt", 'onnx::export out="${test_tmp}/tiny_model.onnx"']
expect_stdout_contains = ["onnx::export: wrote ${test_tmp}/tiny_model.onnx"]
expect_output_not_contains = ["model file written"]

[[tests]]
name = "examples.python.rules_basket"
desc = "The command the header of examples/python/rules/rules.cml gives: the pricing rules are a Camel module, and basket.py prices a million baskets with them through the binding and checks the answer against the same rules in Python and in NumPy. The report's table and its agreement figure are pinned; its three timing lines are a measurement and are not. The entry skips unless the interpreter can import camel and numpy, which is what `pip install camel-lang` leaves behind; it is the only test here that needs a package from outside the tree."
kind = "behavior"
tool = "python"
case = "../../../examples/python/rules/basket.py"
args = ["${case}"]
backends = false
skip_unless = ["${python}", "-c", "import camel, numpy"]
expect_exit = 0
expect_stdout_contains = ["rules module: rules from <ROOT>/examples/python/rules/rules.cml", "     80.00     0.00%      9.90       89.90          89.90", "   2500.00    20.00%      0.00     2000.00        2000.00", "1,000,000 baskets, one NumPy array of f32 (4 MiB)", "agreement:    Camel against Python 0.00e+00, against NumPy 0.00e+00 (largest net total here is 239999)"]
expect_output_not_contains = ["do not agree", "Traceback"]
# The example prices a million baskets through the node VM, which is seconds of work where every
# other entry here is a fraction of a second: 5.4 s measured on the shared Linux host, and skipped
# wherever the package is not installed. The bound is its own because the CPU the run may use is a
# quarter of it.
timeout_ms = 60000
