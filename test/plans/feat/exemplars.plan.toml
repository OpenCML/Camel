id = "exemplars"
order = 900
tier = "feat"
tags = ["feat", "exemplars"]

[[tests]]
name = "01_scalar_boundary"
desc = "Exemplar: Scalar boundary. exemplars/check.mjs re-runs it and checks its outputs, diagnostics and exported models."
kind = "behavior"
tool = "node"
case = "../../../exemplars/check.mjs"
args = ["${case}", "01_scalar_boundary"]
expect_exit = 0
expect_stdout_contains = ["exemplars: all checks passed"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000

