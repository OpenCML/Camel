id = "exemplars"
order = 900
tier = "fast"
tags = ["feat", "exemplars"]

[[tests]]
name = "01_scalar_boundary"
desc = "Exemplar: Scalar boundary. internal/exemplars/check.mjs re-runs it and checks its outputs, diagnostics and exported models."
kind = "behavior"
tool = "node"
case = "../../../internal/exemplars/check.mjs"
args = ["${case}", "01_scalar_boundary"]
expect_exit = 0
expect_stdout_contains = ["exemplars: all checks passed"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000
# Slow layer: over the 2 s the fast layer allows -- 2.05 s of
# child wall clock in the 2026-11-12 record (appendix B of
# internal/reports/2026-11-24-test-suite-inventory.cn.md).
tier = "slow"

