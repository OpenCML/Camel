[[tests]]
name = "indices_graph_matches_unrolled"
desc = "The graph of `static loop acc = 0 for j in indices t do acc + t.[j]` is the graph of the hand-written `((0 + t.0) + t.1) + t.2`: the same nodes and links, and no SFOR, SLOOP, SACC or LOOP node left."
kind = "behavior"
case = "../../../cases/compile/static_expansion/indices_graph.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const lines = input.stdout.split(String.fromCharCode(10))
const attribute = (text, key) => {
  const at = text.indexOf(key + '="')
  if (at < 0) return null
  const from = at + key.length + 2
  return text.slice(from, text.indexOf('"', from))
}
const shapeOf = (name) => {
  const at = lines.findIndex((line) => line.includes(`label="${name}"`))
  assert(at > 0, `the graph of ${name} is missing`)
  const indent = lines[at - 1].slice(0, lines[at - 1].indexOf(lines[at - 1].trim()))
  const end = lines.findIndex((line, i) => i > at && line === indent + "}")
  assert(end > at, `the graph of ${name} has no end`)
  const shape = []
  for (const line of lines.slice(at, end)) {
    const label = attribute(line, 'label')
    const type = attribute(line, 'type')
    if (label === null || type === null) continue
    shape.push(`${line.includes('->') ? 'edge' : 'node'} ${label.replace(name, 'expansion')} ${type}`)
  }
  return shape
}
const loop = shapeOf("loopSum")
const unrolled = shapeOf("unrolled")
assert(loop.length > 0, "the static loop graph has no nodes")
assert(loop.join(String.fromCharCode(10)) === unrolled.join(String.fromCharCode(10)),
  `the static loop is not the hand-written expansion: ${loop.join(String.fromCharCode(10))} --- ${unrolled.join(String.fromCharCode(10))}`)
const left = lines.filter((line) => /type="(SLOOP|LOOP|SFOR|SACC|BRCH|CASE)"/.test(line))
assert(left.length === 0, `a static or branch node was left in the graph: ${left[0]}`)
}
"""
timeout_ms = 8000

