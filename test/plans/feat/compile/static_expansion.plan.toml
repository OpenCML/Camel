[[tests]]
name = "comprehension_graph"
desc = "The graph of a comprehension is straight-line: `t.[n].[m]` reads its parent once (one `.p` ACCS, then `.0` and `.1`), one FILL per struct or tuple, and no SFOR, SACC, LOOP, BRCH or CASE node."
kind = "behavior"
case = "../../../cases/compile/static_expansion/comprehensions_graph.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const lines = input.stdout.split(String.fromCharCode(10))
const at = lines.findIndex((line) => line.includes('label="pairUp"'))
assert(at > 0, "the graph of pairUp is missing")
const indent = lines[at - 1].match(/^\s*/)[0]
const end = lines.findIndex((line, i) => i > at && line === indent + "}")
assert(end > at, "the graph of pairUp has no end")
const nodes = lines.slice(at, end).filter((line) => /\[label=".*", type=/.test(line))
const labels = nodes
  .filter((line) => line.includes('type="ACCS"'))
  .map((line) => line.match(/\[label="([^"]*)"/)[1])
assert(labels.join(",") === ".p,.0,.1", `field accesses changed: ${labels.join(",")}`)
const fills = nodes.filter((line) => line.includes('type="FILL"')).length
assert(fills === 2, `expected one FILL per struct/tuple, got ${fills}`)
const left = nodes.filter((line) => /type="(SFOR|SACC|LOOP|BRCH|CASE)"/.test(line))
assert(left.length === 0, `a static node was left in the graph: ${left[0]}`)
}
"""
timeout_ms = 8000

