id = "compile.static_expansion"
order = 339
tier = "fast"
tags = ["feat", "compile", "generics", "static"]
desc = "`match type` selects a case by the shape of an instantiated type (design principles 5.5, R3), and generic return-type inference gives every instance a concrete result type."

[[tests]]
name = "match_type_shapes"
desc = "struct, tuple and #leaf select the R3 shapes; `struct | tuple` and `_` work; only the selected case is type-checked (the tuple case calls `len(1)` and must not be reported)."
kind = "behavior"
case = "../../../cases/compile/static_expansion/match_type_shapes.cml"
args = ["${case}", "std::fvm"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const want = [
  "struct",
  "tuple",
  "leaf",
  "leaf",
  "leaf",
  "true",
  "true",
  "false",
  "1",
  "0",
  "1",
  "3",
].join(String.fromCharCode(10))
assert(input.normalized.stdout.trim() === want, `shape selection changed: ${input.normalized.stdout}`)
}
"""
timeout_ms = 8000

