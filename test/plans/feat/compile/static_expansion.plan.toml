[[tests]]
name = "static_tuple_indices"
desc = "A rest parameter's build-time tuple is walked by `indices` and `static for`: the trip count is the number of arguments left over (zero included), `ts.[j]` reads the element, and an `indices` operand that is a tuple comprehension keeps its elements separate."
kind = "behavior"
case = "../../../cases/compile/static_expansion/static_tuple_indices.cml"
args = ["${case}", "std::fvm"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const want = ["6", "0", "17", "0 1", "9 10", "2"].join(String.fromCharCode(10))
assert(input.normalized.stdout.trim() === want, `build-time tuples changed: ${input.normalized.stdout}`)
}
"""
timeout_ms = 8000

[[tests]]
name = "static_tuple_builds_no_value_node"
desc = "`indices ts` and `ts.[j]` over a rest parameter build the argument nodes only: the graph of `main` has no FILL for `ts` and no ACCS for its elements, and the expansion is the hand-written sum."
kind = "behavior"
case = "../../../cases/compile/static_expansion/static_tuple_graph.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const lines = input.stdout.split(String.fromCharCode(10))
const at = lines.findIndex((line) => line.includes('label="main"'))
assert(at > 0, "the graph of main is missing")
const indent = lines[at - 1].slice(0, lines[at - 1].indexOf(lines[at - 1].trim()))
const end = lines.findIndex((line, i) => i > at && line === indent + "}")
assert(end > at, "the graph of main has no end")
const body = lines.slice(at, end)
const fills = body.filter((line) => line.includes('type="FILL"'))
assert(fills.length === 0, `a FILL was built for the build-time tuple: ${fills[0]}`)
const accesses = body.filter((line) => line.includes('type="ACCS"'))
assert(accesses.length === 0, `an ACCS was built for a build-time tuple element: ${accesses[0]}`)
const calls = body.filter((line) => line.includes('type="CALL"') && line.includes('sum'))
assert(calls.length === 0, `the rest call was not expanded: ${calls[0]}`)
const adds = body.filter((line) => line.includes('label=":op/add_l"'))
assert(adds.length === 3, `the expansion lost an addition: ${adds.length}`)
}
"""
timeout_ms = 8000

