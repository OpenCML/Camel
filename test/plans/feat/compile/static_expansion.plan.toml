[[tests]]
name = "static_loop_sequence_forms"
desc = "The sequence of a `static loop` is decided by one rule, not a list of spellings (the ruling of 2026-10-25, H475): an expression built only from compile-time constants through pure operations that cannot fail is worked out and unrolled. `range(a, b, step)` with constant arguments walks `a, a + step, ...` (a negative step walks downwards), an array literal and a `let` bound once to an array walk by element, and an element that is not an integer is still a compile-time constant of the array's element type -- a string element is a `t.[s]` key by its own text."
kind = "behavior"
case = "../../../cases/compile/static_expansion/static_loop_sequence_forms.cml"
args = ["${case}", "std::fvm"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const want = [
  "18",
  "9",
  "6",
  "15",
  "30",
].join(String.fromCharCode(10))
assert(input.normalized.stdout.trim() === want, `static loop over a computed sequence changed: ${input.normalized.stdout}`)
}
"""
timeout_ms = 8000

