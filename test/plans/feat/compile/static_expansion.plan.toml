[[tests]]
name = "static_tuple_function_materializes"
desc = "A tuple comprehension returned by a function is a value: one FILL materializes it at the `return`, and the caller sees an ordinary tuple through the function value (FUNC then ACCS), not a build-time tuple."
kind = "behavior"
case = "../../../cases/compile/static_expansion/static_tuple_function.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const lines = input.stdout.split(String.fromCharCode(10))
const graphBody = (name) => {
  const at = lines.findIndex((line) => line.includes(`label="${name}"`))
  assert(at > 0, `the graph of ${name} is missing`)
  const indent = lines[at - 1].slice(0, lines[at - 1].indexOf(lines[at - 1].trim()))
  const end = lines.findIndex((line, i) => i > at && line === indent + "}")
  assert(end > at, `the graph of ${name} has no end`)
  return lines.slice(at, end)
}
const positions = graphBody("positions")
const fills = positions.filter((line) => line.includes('type="FILL"'))
assert(fills.length === 1, `the returned tuple was not materialized by one FILL: ${fills.length}`)
const caller = graphBody("firstPosition")
const functions = caller.filter((line) => line.includes('type="FUNC"') && line.includes('positions'))
assert(functions.length === 1, `the caller does not read the function value: ${functions.length}`)
const accesses = caller.filter((line) => line.includes('type="ACCS"'))
assert(accesses.length === 1, `the caller does not project the returned tuple: ${accesses.length}`)
}
"""
timeout_ms = 8000

