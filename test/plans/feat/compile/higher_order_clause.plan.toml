id = "compile.higher_order_clause"
order = 344
tier = "fast"
# `higher_order` is the spelling the GC poison sweep's `risk_tags` reads
# (`test/plans/feat/mm/gc_poison_sweep.plan.toml`): a source plan whose tags name one of them keeps
# three sampled copies in the fast layer, every other plan keeps one. This plan said `hof` alone --
# the same subject in another word, matching none of those tags -- so it was sampled at one copy, and
# a plan sampled at one copy loses the copy it had the moment the file grows a test above it: the
# sample takes the eligible tests in declaration order. Both words stay, because `hof` is what people
# call the subject and `higher_order` is what the sweep counts.
tags = ["feat", "compile", "effects", "hof", "higher_order"]

# The two sources of a node's effect, and the union they make (design principles 3.3; author
# 2026-11-19): what a higher-order operator touches is what the function the program hands it
# touches, read off the value's type at the operand the declaration names
# (`sem::ResourceSpec::functionOperand`), *plus* whatever the operator declares for itself.
# `checkResources` allows the two beside each other -- it refuses only an access bound to the
# operand that carries the function -- and every reader states the union: the builder's ordering
# (`Builder::reachOfOper`, `Builder::isEffectNode`), the effect summary (`EffectWalk::ofNodes`) and
# the runtime's resource footprint (`Resolver::oper`). The node-role registry does not state it a
# fourth time: it reads the footprint fact for the node (`core.resources`,
# `fact::nodeResourcesOf`), so the role a dump prints is that one answer.
#   * `map` over a function that writes no clause has no `effect` role; over one that writes
#     `stdout` it keeps both, and the runtime footprint carries the write. Before the fix the
#     declaration said "external, itemizes nothing" and every `map` was an effect, whatever the
#     callback.
#   * `state:update` declares both halves: the box it writes (a handle) and the function it runs
#     (ordinary operand 1). The function its parameter type admits is `pure`, so the union is the
#     box alone -- and the reading says exactly that, with no external effect.
[[tests]]
name = "state.update_union"
desc = "`state:update` declares both halves of its node's effect -- the box it writes and the function it runs (`functionOperand`, ordinary operand 1) -- and the runtime footprint reads the union: the handle, with no external effect and nothing unplaceable, because the function it can be handed is declared `pure`."
case = "../../../cases/compile/ref/ref_float.cml"
kind = "behavior"
args = ["${case}", "test::resources"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
verify_script = """
({ input, assert }) => {
    assert(input.exit_code === 0, `camel exited ${input.exit_code}`)
    const lines = input.normalized.stdout.split('\n')
    const updates = lines.filter((l) => /^RESOURCES node main \d+ state:update: /.test(l))
    assert(updates.length === 1,
        `expected one state:update node to touch something, got ${updates.length}: ${updates.join(' | ')}`)
    const line = updates[0]
    assert(/^RESOURCES node main \d+ state:update: rmw handle \S*Ref \(node \d+\); result unknown$/.test(line),
        `the update node's reading is not its declared handle and its result: ${line}`)
    assert(!line.includes('external') && !line.includes('(any)') && !line.includes('conservative'),
        `the union of a handle write and a pure callback is not external: ${line}`)
}
"""

[[tests]]
name = "map.runtime_footprint"
desc = "The runtime's resource footprint reads the same clause: the `map` over a callback that writes `stdout` carries that write, the one over a callback that writes nothing carries nothing, and neither is read as touching nothing."
case = "../../../cases/effects/hof_callback_effect_footprint.cml"
kind = "behavior"
args = ["${case}", "test::resources"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
verify_script = """
({ input, assert }) => {
    const out = input.normalized.stdout
    const nodes = out.split('\n').filter((l) => l.includes(':mark/map_arr:'))
    assert(nodes.length === 1,
        `expected one map node to touch something, got ${nodes.length}: ${nodes.join(' | ')}`)
    assert(/^RESOURCES node main \d+ :mark\/map_arr: rmw ambient console; external$/.test(nodes[0]),
        `the map over a printing callback does not carry its write: ${nodes[0]}`)
    const footprint = out.split('\n').filter((l) => l.startsWith('RESOURCES footprint main '))
    assert(footprint.length === 1, `expected one footprint line for main, got: ${footprint.join(' | ')}`)
    assert(/rmw ambient console/.test(footprint[0]) && /result fresh/.test(footprint[0]),
        `main's footprint does not carry the callback's write, or claims the callback's result: ${footprint[0]}`)
}
"""

[[tests]]
name = "map.pure_callback"
desc = "`map` over a function that writes no clause is not an effect: the node carries no `effect` role and the dump lists no such role at all."
case = "../../../cases/effects/hof_map_pure.cml"
kind = "behavior"
args = ["${case}", "std::agir", "std::nop"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
verify_script = """
({ input, assert }) => {
    assert(input.exit_code === 0, `camel exited ${input.exit_code}`)
    const lines = input.normalized.output.split('\n')
    const map = lines.find((line) => line.includes('label=":mark/map_arr"'))
    assert(map !== undefined, 'no :mark/map_arr node in the dump')
    assert(!map.includes('role="'), `the map node carries a role: ${map}`)
    assert(!lines.some((line) => line.includes('legend_effect')),
        'the dump lists an effect role, so the map was counted as one')
}
"""

[[tests]]
name = "map.effectful_callback"
desc = "`map` over a function that writes `stdout` stays an effect: the node carries the `effect` role and the dump has a legend for it."
case = "../../../cases/effects/hof_map_effect.cml"
kind = "behavior"
args = ["${case}", "std::agir", "std::nop"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
verify_script = """
({ input, assert }) => {
    assert(input.exit_code === 0, `camel exited ${input.exit_code}`)
    const lines = input.normalized.output.split('\n')
    const map = lines.find((line) => line.includes('label=":mark/map_arr"'))
    assert(map !== undefined, 'no :mark/map_arr node in the dump')
    assert(map.includes('role="effect"'), `the map node lost its effect role: ${map}`)
    assert(lines.some((line) => line.includes('legend_effect')),
        'no effect legend, so nothing was counted as an effect')
}
"""

[[tests]]
name = "node_role_reads_the_fact"
desc = "Both directions of the union, read at the node: `state:update` carries the `effect` role because it writes the reference, even though the function its parameter admits is `pure`, and `map` over a function that writes nothing carries no role, because the operator declares nothing for itself either. The role registry reads the fact layer's answer for the node (`core.resources`) rather than a predicate of its own, so a reader that spelled the union out a fourth time would have to disagree with this case to be noticed."
case = "../../../cases/trans/annotated/effect_union.cml"
kind = "behavior"
args = ["${case}", "std::agir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
verify_script = """
({ input, assert }) => {
    assert(input.exit_code === 0, `camel exited ${input.exit_code}`)
    const lines = input.normalized.output.split('\n')
    const update = lines.find((line) => line.includes('label="state:update"'))
    assert(update !== undefined, 'no state:update node in the dump')
    assert(update.includes('role="effect"'),
        `the update node lost its effect role, though it writes the reference: ${update}`)
    const map = lines.find((line) => line.includes('label=":mark/map_arr"'))
    assert(map !== undefined, 'no :mark/map_arr node in the dump')
    assert(!map.includes('role="'),
        `the map over a function that writes nothing carries a role: ${map}`)
}
"""