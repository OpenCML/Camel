[[tests]]
name = "placement.graph"
desc = "`#gpu` and `#cpu` write the same fact, `tiles.placement`, as a Symbol: std::gir shows it as `body_attrs` of the body region of a tagged function, as a flat `region #N` line for a tagged block (the compact view keeps its layout), and as `attrs` of the nodes written in either scope, with the inner scope winning where blocks nest."
kind = "behavior"
case = "../../../cases/compile/tags/placement.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const lines = out.split('\n')
const at = (name) => {
  const i = lines.findIndex((l) => l.includes(`label="${name}"`))
  assert(i >= 0, `no graph ${name}`)
  return i
}
const label = (name) => lines[at(name)]
const body = (name) => {
  const i = at(name)
  const found = lines.slice(i, i + 6).find((l) => l.includes('body_attrs='))
  return found || ''
}
assert(body('on_device').includes('tiles.placement=\\"gpu\\"'), body('on_device'))
assert(body('on_host').includes('tiles.placement=\\"cpu\\"'), body('on_host'))
assert(!body('plain').includes('body_attrs'), body('plain'))
// 0-based lines: 9 on_device, 14 on_host, 23 the gpu block, 25 the cpu block inside it.
const attrs = (l) => { const m = l.match(/attrs="(.*)"/); return m ? m[1].replace(/\\/g, '') : '' }
const oper = (line) => lines.filter((l) => l.includes('type="OPER"') && l.includes(`span="${line}:`))
const value = (line, expected) => {
  const found = oper(line)
  assert(found.length > 0, `no OPER at line ${line}`)
  for (const l of found) assert(attrs(l) === expected, `line ${line}: ${attrs(l)}`)
}
value(9, 'tiles.placement="gpu"')
value(14, 'tiles.placement="cpu"')
value(23, 'tiles.placement="gpu"')
value(25, 'tiles.placement="cpu"')
// The compact view prints a tagged region's fact without drawing a cluster. The number in
// `region #N` is the region's index in the graph's region table, and the builder hands those out
// in allocation order: an unrelated construct written earlier in this function that allocates a
// region of its own (an arm, a loop part) moves it while the facts and the nest stay what they
// were. Compare the identity each line carries, not the counter beside it: which region has which
// fact, and that the inner block's parent is the outer block's id, whatever that id is.
const regionLines = lines.filter((l) => l.includes('region #') && l.includes('attrs='))
assert(regionLines.length === 2, regionLines.join('\n'))
const withFact = (fact) => {
  const found = regionLines.filter((l) => l.includes(`attrs="tiles.placement=\\"${fact}\\""`))
  assert(found.length === 1, `no single ${fact} region in: ${regionLines.join('\n')}`)
  return found[0]
}
const idOf = (line) => {
  const found = line.match(/region #(\d+) /)
  assert(found, `no region id in: ${line}`)
  return found[1]
}
const outer = withFact('gpu')
const inner = withFact('cpu')
assert(outer.includes('block'), outer)
assert(inner.includes('block'), inner)
assert(outer.includes('parent=0'), `the outer block is not written in the body: ${outer}`)
assert(inner.includes(`parent=${idOf(outer)}`), `the inner block's parent is not the outer block: ${inner}`)
assert(label('main') && !lines[at('main') + 1].includes('body_attrs'), 'main has no body tag')
}
"""

[[tests]]
name = "placement.regions"
desc = "std::gir_regions draws a tagged block as a Block region with `region_attrs`, and the nested block inside the outer one; the inner scope says `cpu`, the outer says `gpu`."
kind = "behavior"
case = "../../../cases/compile/tags/placement.cml"
args = ["${case}", "std::gir_regions"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const lines = out.split('\n')
// A cluster's name is a dot identifier whose job is to merge the nodes of one region, and its
// `_rN` is that region's index in the region table -- the same allocation-order number the
// compact view prints, so it moves for the same reason and is not what the fact says. Compare
// the two clusters as identities: two Block regions, the inner one's cluster written inside the
// outer one's.
const clusterOf = (fact) => {
  const at = lines.findIndex((l) => l.includes(`region_attrs="tiles.placement=\\"${fact}\\""`))
  assert(at >= 0, `no ${fact} block region`)
  // A node in a region is drawn inside one cluster per region it is in, outermost first, each
  // opened by a line of its own: the line above a region's own fact is that region's cluster.
  const chain = []
  for (let i = at - 1; i >= 0; i--) {
    const line = lines[i].trim()
    if (line.startsWith('subgraph cluster_')) {
      const found = line.match(/^subgraph cluster_([^\s{]+)/)
      assert(found, line)
      chain.unshift({ name: found[1], line })
      continue
    }
    if (line.startsWith('region_attrs=')) continue
    break
  }
  assert(chain.length > 0, `the ${fact} region is drawn in no cluster: ${lines[at]}`)
  const own = chain[chain.length - 1]
  assert(own.line.includes('label="block";'), `the ${fact} cluster is not a block: ${own.line}`)
  return { at, name: own.name, chain: chain.map((entry) => entry.name) }
}
const outer = clusterOf('gpu')
const inner = clusterOf('cpu')
assert(outer.at < inner.at, 'the cpu block region is not written after the gpu block region')
assert(outer.name !== inner.name, `both blocks are drawn in one cluster: ${outer.name}`)
assert(outer.chain.every((name, i) => inner.chain[i] === name) && inner.chain.length > outer.chain.length,
  `the cpu block is not drawn inside the gpu block: ${inner.chain.join(' < ')} vs ${outer.chain.join(' < ')}`)
}
"""

[[tests]]
name = "placement.facts"
desc = "std::jgir shows the fact where each scope puts it: `body` regions of the tagged functions, Block regions of the tagged blocks (nested, with the parent chain), and `attrs` on the nodes written in a block; a function without a tag has no region fact."
kind = "behavior"
case = "../../../cases/compile/tags/placement.cml"
args = ["${case}", "std::jgir"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const dump = JSON.parse(input.normalized.stdout)
const graph = (name) => {
  const g = dump.graphs.find((x) => x.name === name)
  assert(g, `no graph ${name}`)
  return g
}
const bodyAttrs = (name) => {
  const regions = graph(name).regions || []
  const body = regions.find((r) => r.kind === 'body')
  assert(body, `${name} has no body region fact`)
  return body.attrs
}
assert(bodyAttrs('on_device')['tiles.placement'] === 'gpu', JSON.stringify(bodyAttrs('on_device')))
assert(bodyAttrs('on_host')['tiles.placement'] === 'cpu', JSON.stringify(bodyAttrs('on_host')))
assert(!('regions' in graph('plain')) || !graph('plain').regions, 'plain has a region fact')
const main = graph('main')
const regions = main.regions || []
const outer = regions.find((r) => r.attrs && r.attrs['tiles.placement'] === 'gpu')
const inner = regions.find((r) => r.attrs && r.attrs['tiles.placement'] === 'cpu')
assert(outer && outer.kind === 'block', JSON.stringify(regions))
assert(inner && inner.kind === 'block' && inner.parent === outer.id, JSON.stringify(regions))
const nodeAt = (line) => {
  const nodes = main.nodes.filter((n) => n.source && n.source.start.line === line && n.attrs)
  assert(nodes.length > 0, `no attributed node at line ${line}`)
  return nodes
}
for (const n of nodeAt(23)) {
  assert(n.region === outer.id, `line 23 node ${n.id} in ${n.region}`)
  assert(n.attrs['tiles.placement'] === 'gpu', JSON.stringify(n.attrs))
}
for (const n of nodeAt(25)) {
  assert(n.region === inner.id, `line 25 node ${n.id} in ${n.region}`)
  assert(n.attrs['tiles.placement'] === 'cpu', JSON.stringify(n.attrs))
}
}
"""

