id = "compile.tags"
order = 226
tier = "fast"
tags = ["feat", "compile", "tags", "attributes", "semantics"]
desc = "The tag mechanism of design principles 6.2: `tag name<params> on positions` declares a name of the module's entity namespace, `tag group = [a, b]` a group of tags, and `#name`, `#name<args>` and `#[a, b<v>]` write a tag before a function, a type declaration, a struct field or a block. Tags of `on nodes` become node attributes of the region they precede (an inner same-name tag with a parameter wins); tags of `on func`, `on type` and `on field` belong to the declaration and are printed by `camel inspect --tags` (the C++ query is tag::ofDeclaration / tag::ofField). A tag says through `read_by` which passes read it, and the pipeline warns when none of them is in it. Writing a tag where its declaration does not list it, an undeclared tag, a wrong number of arguments, a non-constant argument, an argument that is not of the kind its parameter declares, and a parameter of a kind a tag cannot carry yet are located errors at the tag."

[defaults]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "decl.run"
desc = "A program that declares tags of every position and writes them before functions, types, fields and blocks runs to the same result in the four back ends."
kind = "behavior"
case = "../../../cases/compile/tags/decl.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 7
expect_stdout_exact = ""

[[tests]]
name = "decl.tags"
desc = "`camel inspect --tags` prints the declaration of every tag (its positions, parameters and readers), and, for each declaration a tag was written on, the facts it carries: a function, a type and a field (`Bits.0`); a tag of `on nodes` is not on the declaration of its function."
kind = "behavior"
case = "../../../cases/compile/tags/decl.cml"
args = ["inspect", "--tags", "${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
for (const line of [
  'main::kernel on nodes',
  'main::fast on func, nodes',
  'main::readable on func read_by std::opt',
  'main::shape on type, field',
  'main::width on type, field<w: int>',
  'main::pure on  = [fast, readable]',
  'main::finite on  = [kernel, fast]',
  'Bits : main::width=32',
  'Bits.0 : main::width=8',
  'Square : main::shape',
  'both : main::fast',
  'grouped : main::fast, main::readable',
  'stacked : main::fast',
]) {
  assert(out.includes(line), `missing '${line}' in:\\n${out}`)
}
// `kernel` is declared `on nodes` only: it belongs to the body, not to the declaration.
assert(!out.includes('marked :'), `marked carries no declaration tag:\\n${out}`)
}
"""

[[tests]]
name = "graph.attrs"
desc = "std::gir shows the facts of `on nodes` as `attrs` (spans are 0-based lines): a tag written before a function holds for the nodes of its body, a tag of `nodes` on a function that also allows it, a tag before a block for the nodes written in it, accumulating with the enclosing ones; an inner same-name tag with a parameter wins over the outer value."
kind = "behavior"
case = "../../../cases/compile/tags/tags_nodes.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const nodes = input.normalized.stdout.split('\n').filter((l) => l.includes('type="OPER"'))
const attrs = (l) => { const m = l.match(/attrs="([^"]*)"/); return m ? m[1] : '' }
const at = (line) => nodes.filter((l) => l.includes(`span="${line}:`))
const only = (line, value) => {
  const found = at(line)
  assert(found.length > 0, `no OPER at line ${line}`)
  for (const l of found) assert(attrs(l) === value, `line ${line}: attrs="${attrs(l)}", expected "${value}": ${l}`)
}
only(10, 'main::scale=2')           // doubled: the tag before the function
only(15, 'main::heavy')             // weighed: the nodes half of `on func, nodes`
only(20, 'main::scale=3')           // main: the tag before the function
only(23, 'main::plain, main::scale=3') // the block adds plain to the enclosing scale
only(27, 'main::scale=5')           // the inner same-name tag wins
assert(at(27).every((l) => !attrs(l).includes('main::plain')), 'the inner block does not carry the outer block')
}
"""

[[tests]]
name = "graph.run"
desc = "The tagged program runs to the same result through `std::nvm`, `std::fvm` and `std::opt::inline std::nvm`."
kind = "behavior"
case = "../../../cases/compile/tags/tags_nodes.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 121
expect_stdout_exact = ""

[[tests]]
name = "read_by.absent"
desc = "A tag whose `read_by` names a pass that is not in the pipeline is reported where it is written: at the use, and the message names the tag and the pass."
kind = "behavior"
case = "../../../cases/compile/tags/decl.cml"
args = ["${case}"]
expect_exit = 7
expect_output_contains = ["SemanticDiag::TagHasNoReader", "The tag 'main::readable' is written, but none of the passes it names (std::opt) is in the pipeline."]

[[tests]]
name = "read_by.present"
desc = "With the pass `std::opt` named by `read_by` in the pipeline the warning is gone."
kind = "behavior"
case = "../../../cases/compile/tags/decl.cml"
args = ["${case}", "std::opt"]
expect_exit = 7
expect_output_not_contains = ["TagHasNoReader", "none of the passes it names"]

[[tests]]
name = "position"
desc = "A tag declared `on type` written before a function: the error is at the tag and names the declaration's positions."
kind = "negative"
case = "../../../cases/compile/tags/err_position.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::TagNotAtPosition"
expect_diagnostic_line = 6
expect_diagnostic_column = 2
expect_output_contains = ["The tag 'shape' may not be written at a func: it is declared for type."]

[[tests]]
name = "undeclared"
desc = "A tag that is not declared is reported at its name, with the namespace a tag lives in."
kind = "negative"
case = "../../../cases/compile/tags/err_undeclared.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::TagUndeclared"
expect_diagnostic_line = 4
expect_diagnostic_column = 2
expect_output_contains = ["No tag 'nope' is declared."]

[[tests]]
name = "arity"
desc = "A tag written without the arguments its declaration gives it."
kind = "negative"
case = "../../../cases/compile/tags/err_arity.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::TagArgumentCount"
expect_diagnostic_line = 6
expect_diagnostic_column = 2
expect_output_contains = ["The tag 'width' takes 1 parameter(s), but 0 argument(s) are written."]

[[tests]]
name = "not_constant"
desc = "A tag argument that is not a compile-time value is refused at the use: a tag is read before the program runs."
kind = "negative"
case = "../../../cases/compile/tags/err_const.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::TagArgumentNotConstant"
expect_diagnostic_line = 7
expect_diagnostic_column = 6
expect_output_contains = ["The argument 'n' of the tag 'width' is not a compile-time value."]

[[tests]]
name = "float_argument"
desc = "A parameter declared `float` takes a real, carried as a real attribute: `#ratio<1.5>` is printed as written, and so is a second use with another value."
kind = "behavior"
case = "../../../cases/compile/tags/float.cml"
args = ["inspect", "--tags", "${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
for (const line of [
  'main::ratio on type, field<r: float>',
  'T : main::ratio=1.5',
  'U : main::ratio=0.25',
]) {
  assert(out.includes(line), `missing '${line}' in:\\n${out}`)
}
}
"""

[[tests]]
name = "argument_type"
desc = "A real argument for an `int` parameter is a located kind mismatch (the declared kind is what an argument must be, design principles 6.2)."
kind = "negative"
case = "../../../cases/compile/tags/err_float.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::TagArgumentType"
expect_diagnostic_line = 6
expect_diagnostic_column = 2
expect_output_contains = ["The parameter 'w' of the tag 'width' is declared 'int', but the argument is '1.5' (float)."]

[[tests]]
name = "argument_type_bool_for_int"
desc = "The kind check is two-way: a boolean where the parameter declares an integer is the same located diagnostic."
kind = "negative"
case = "../../../cases/compile/tags/err_type.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::TagArgumentType"
expect_diagnostic_line = 6
expect_diagnostic_column = 2
expect_output_contains = ["The parameter 'w' of the tag 'width' is declared 'int', but the argument is 'true' (bool)."]

[[tests]]
name = "parameter_type"
desc = "A parameter of a kind a tag cannot carry (here a function signature) is a located diagnostic at the use, not a value silently carried as something else."
kind = "negative"
case = "../../../cases/compile/tags/err_param_type.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::TagParameterType"
expect_diagnostic_line = 6
expect_diagnostic_column = 2
expect_output_contains = ["The parameter 'f' of the tag 'callback' is declared '(x: int) => int': a tag parameter is an int, a float, a bool, a string or a func."]

[[tests]]
name = "old_annotation_form"
desc = "The old `@name(...)` form of a tag gets a located diagnostic that points at `#name` / `#[...]`, not a syntax error."
kind = "negative"
case = "../../../cases/compile/tags/err_old_annotation.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::InvalidAnnotation"
expect_diagnostic_line = 4
expect_diagnostic_column = 1
expect_output_contains = ["an annotation takes '<...>' arguments, not '(...)'", "'#name', '#name<args>' or '#[a, b<v>]'"]
[[tests]]
name = "reads"
desc = "`#reads<...>` names the tags a pass reads: the arguments are tag names, not values, any number of them are accepted, and the fact is the declaration's tuple, printed by `camel inspect --tags`."
kind = "behavior"
case = "../../../cases/compile/tags/reads.cml"
args = ["inspect", "--tags", "${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
for (const line of [
  'main::cost on func',
  'first : reads=("reassociate", "contract")',
  'second : reads=("cost")',
]) {
  assert(out.includes(line), `missing '${line}' in:\n${out}`)
}
}
"""

[[tests]]
name = "reads_empty"
desc = "`#reads<>` names no tag: the form takes at least one, and the diagnostic says how many are written."
kind = "negative"
case = "../../../cases/compile/tags/err_reads_empty.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::TagArgumentCount"
expect_diagnostic_line = 7
expect_diagnostic_column = 2
expect_output_contains = ["The tag 'reads' takes 1 or more parameter(s), but 0 argument(s) are written."]

[[tests]]
name = "reads_undeclared"
desc = "A name written in `#reads<...>` must be a declared tag: a typo is reported where it is written, not silently carried."
kind = "negative"
case = "../../../cases/compile/tags/err_reads_undeclared.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::TagUndeclared"
expect_diagnostic_line = 7
expect_diagnostic_column = 2
expect_output_contains = ["No tag 'nowhere' is declared."]

[[tests]]
name = "reads_camel_pass_is_a_reader"
desc = "A Camel pass that writes `#reads<marked>` is recorded as a reader of `marked`: a program whose tag names that pass reads the tag, so no `TagHasNoReader` warning is emitted."
kind = "behavior"
case = "../../../cases/modules/rules/reads_target.cml"
args = ["${case}", "reads_pass::apply", "std::nvm"]
expect_exit = 0
expect_output_not_contains = ["TagHasNoReader"]

[[tests]]
name = "shadows_permission"
desc = "A program may not declare a tag with the name of a core permission (log 2026-10-21): the declaration would never be read, so it is refused where it is written."
kind = "negative"
case = "../../../cases/compile/tags/err_tag_shadows_permission.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::TagShadowsPermission"
expect_diagnostic_line = 8
expect_diagnostic_column = 1
expect_output_contains = ["The tag 'reassociate' is declared with the name of a tag of the language."]


[[tests]]
name = "independent.node"
desc = "`#independent` on a user function declaration reaches the runtime graph: std::jgir shows it as an attribute of the function graph's exit node, and a function declared without the tag has none. The tag is on the declaration, not on every node of the body: the exit node is the one that stands for what the function gives."
kind = "behavior"
case = "../../../cases/compile/tags/independent.cml"
args = ["${case}", "std::jgir"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const dump = JSON.parse(input.normalized.stdout)
const byName = new Map(dump.graphs.map((g) => [g.name, g]))
const exitAttrs = (name) => {
  const g = byName.get(name)
  assert(g, `graph ${name} is not in the dump`)
  const n = g.nodes.find((node) => node.id === g.exit)
  assert(n, `graph ${name} has no exit node`)
  return n.attrs || {}
}
assert(exitAttrs('twice').independent === true, `twice: ${JSON.stringify(exitAttrs('twice'))}`)
assert(!('independent' in exitAttrs('plain')), `plain: ${JSON.stringify(exitAttrs('plain'))}`)
}
"""

[[tests]]
name = "independent.query"
desc = "The runtime query tag::declaresIndependentElements reads the fact from the encoded graph, without the module that declared the function: test::tags prints yes for the tagged function and no for the other one."
kind = "behavior"
case = "../../../cases/compile/tags/independent.cml"
args = ["${case}", "test::tags"]
expect_exit = 11
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
for (const line of [
  'TAGS independent twice yes',
  'TAGS independent plain no',
  'TAGS independent main no',
]) assert(out.includes(line), `missing: ${line}`)
}
"""

[[tests]]
name = "independent.run"
desc = "A tagged function runs to the same result on the four back ends: the declaration is a fact, not a change of semantics."
kind = "behavior"
case = "../../../cases/compile/tags/independent.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 11
expect_stdout_exact = ""