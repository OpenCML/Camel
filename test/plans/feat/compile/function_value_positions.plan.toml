id = "compile.function_value_positions"
order = 326
tier = "fast"
tags = ["feat", "compile", "closures", "functions"]
desc = "A function is a value in every position a value can stand in, alike on the four back ends."

# The matrix: argument, return value, let, array / tuple / struct element, branch arm, match
# arm, capture, with argument, var; each with a module-level function, a nested function that
# captures a local, and a lambda. A generic function as a value stays an error
# (GenericFunctionAsValue, plan compile.generics): undecided.

[[tests]]
name = "value_positions"
desc = "Every position of the matrix prints the same line on std::nvm, std::fvm, std::jit and std::prl."
kind = "behavior"
case = "../../../cases/compile/function_values/value_positions.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "arg 2 11 2",
  "return 2 2 0 11",
  "let 2 11",
  "array 2 0 11 -9 8",
  "array map [11, 9]",
  "tuple 2 11",
  "struct 2 11 2",
  "nested 2 12 4 -5",
  "arm block",
  "if arm 2 11 8 2 6",
  "if arm as argument 2 [11, 12]",
  "match arm 2 -9",
  "capture 13 2 13",
  "with 2 11 2 [2, 3] [11, 12]",
  "var 2",
  "var 0",
  "var 11",
  "var 2",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 20000

[[tests]]
name = "literal_unknown_name"
desc = "An unknown name in an array literal is an unresolved reference located at the literal, not at the enclosing function."
kind = "negative"
case = "../../../cases/compile/function_values/literal_unknown_name.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::UnresolvedReference"
expect_diagnostic_line = 9
expect_diagnostic_column = 14
expect_output_contains = ["Unresolved reference: 'nosuch'"]
expect_output_not_contains = ["never printed"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "literal_operator_name"
desc = "An operator name or an overloaded name as a literal element or as the value of an arm is FunctionNameAsValue, each at its place; all three are reported."
kind = "negative"
case = "../../../cases/compile/function_values/literal_operator_name.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::FunctionNameAsValue"
expect_diagnostic_line = 12
expect_diagnostic_column = 14
expect_output_contains = ["'println' is used as a value here, but it names an operator with 3 signatures", "'over' is used as a value here, but it names 2 functions of that name", "literal_operator_name.cml:13:13", "literal_operator_name.cml:14:23"]
expect_output_not_contains = ["never printed", "cannot be called"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "map_callback_not_same_type"
desc = "A written callback type leaves only the resources open: `map` takes a callback of the element type whatever it touches, and still refuses one whose parameter is another type or whose parameter list is another shape, each at its own line."
kind = "negative"
case = "../../../cases/compile/function_values/map_callback_not_same_type.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::NoMatchingFunction"
expect_output_contains = ["map_callback_not_same_type.cml:14:", "map_callback_not_same_type.cml:15:", "map", "(s: string) => int", "(a: int, b: int) => int"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "partial_application_span"
desc = "A partial application is a function value located at the expression itself: in `let g = inc<1>` both the FUNC node the value calls and the value node cover `inc<1>` (9:12-9:18), not the whole `let` statement."
kind = "behavior"
case = "../../../cases/compile/function_values/partial_application_span.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const lines = input.normalized.stdout.split('\n')
const func = lines.find((l) => l.includes('label="inc", type="FUNC"'))
assert(func !== undefined, `no FUNC node for inc: ${input.normalized.stdout}`)
assert(func.includes('span="7:12-7:18"'), `the function value made by inc<1> covers inc<1>: ${func}`)
const fill = lines.find((l) => l.includes('type="FILL"') && l.includes('span="7:12-7:18"'))
assert(fill !== undefined, `the partial application value covers inc<1>: ${input.normalized.stdout}`)
}
"""
timeout_ms = 8000
