# Diagnostic plan (lane S1-6, 2026-11-20). Not a contract: it repeats one existing case 20 times so a
# reading of it counts how often the Windows build refuses it, and which back ends refuse it.
# `stream.generators_shapes_consumed` is the case; the expectations are that entry's, unchanged.
# Remove this file before the case's fix is merged: its tests are not part of any lane's contract.
id = "compile.s16probe"
order = 999
tier = "fast"
tags = ["feat", "compile", "stream", "probe"]
desc = "Twenty runs of `stream.generators_shapes_consumed`, so a refusal rate is counted per back end rather than guessed from one run."

[[tests]]
name = "stream.s16probe_r01"
desc = "Run 1 of 20 of `stream.generators_shapes_consumed`: counts how often the Windows build refuses the case, per back end."
kind = "behavior"
case = "../../../cases/compile/stream/generators_shapes_consumed.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "1384\n102101112202122\n88\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]

