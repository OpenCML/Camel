[[tests]]
name = "macro_constants.graph"
desc = "After std::macro the collections are DATA nodes of the graph (constants), not calls."
kind = "behavior"
case = "../../../cases/compile/collections/macro_constants.cml"
args = ["${case}", "std::macro", "std::gir"]
