[[tests]]
name = "graph_shape"
desc = "On the graph the conversion is a CAST node and every operation one OPER node: `m[k]` is `:coll/map_idx`, an array subscript stays `:op/idx_arr`."
kind = "behavior"
case = "../../../cases/compile/collections/graph_shape.cml"
args = ["${case}", "std::rgir"]
expect_exit = 0
expect_stdout_contains = ["type=\"CAST\"", "label=\":coll/map_idx\", type=\"OPER\"", "label=\":coll/map_put\", type=\"OPER\"", "label=\":coll/set_contains\", type=\"OPER\"", "label=\":op/idx_arr\", type=\"OPER\"", "label=\":op/tag_is_null\", type=\"OPER\"", "type=\"BRCH\""]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 12000

[[tests]]
name = "err_key_float"
desc = "A floating-point key type is rejected at the type expression, with the reason."
kind = "negative"
case = "../../../cases/compile/collections/err_key_float.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::CollectionKeyNotAllowed"
expect_diagnostic_code = "0x030000A0"
expect_diagnostic_line = 6
expect_diagnostic_column = 27
expect_output_contains = ["The type 'f64' cannot be a key of 'Map'", "NaN is not equal to itself"]
expect_output_not_contains = ["never printed", "UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

