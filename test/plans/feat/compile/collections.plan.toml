# ---- The persistent representation (docs/technical/31_map_and_set.md, sections 5.2 to 5.7) ----
#
# A collection of more than a leaf's worth of entries is a persistent B+ tree. The shape of the
# tree is a matter of the implementation and may not show: the cases below print the same under
# the flat table, the default tree and trees of tiny tables, in which a few dozen entries make
# a tree several levels high. CAMEL_COLL_VALIDATE=1 checks the invariants of every table an
# operation returns and stops the process at the first violation.

[[tests]]
name = "tree_paths"
desc = "Collections of several hundred entries built and taken apart entry by entry, scattered and in ascending order, so that every structural step of the tree happens (a leaf and a branch split, the root grows; leaves and branches are merged with or share entries with a neighbour, the root shrinks back to a leaf), with `merge` and the set operations between trees and between a tree and a small collection. The earlier values are read again after the later ones were derived from them. On the four back ends, the default tree."
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
case = "../../../cases/compile/collections/tree_paths.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
envs = ["CAMEL_COLL_VALIDATE=1"]
golden = "golden/collections/tree_paths.txt"
expect_exit = 0
expect_output_not_contains = ["[Error]", "Segmentation fault", "dumped core", "invalid"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 60000

