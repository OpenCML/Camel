id = "compile.collections"
order = 330
tier = "feat"
tags = ["feat", "compile", "collections", "map", "set", "types"]
desc = "The built-in collection types `Map<K, V>` and `Set<T>`: construction with `as`, the operators, generics, the four back ends, the optimisation pipelines, and every diagnostic with its position (design principles 2.9; docs/technical/31_map_and_set.md)."

# The positive cases are snapshots. Each runs on std::nvm, std::fvm, std::jit and std::prl,
# which must agree on exit code and standard output, and the output is the golden file's. The
# same golden file is then held against the optimisation pipelines: a pass may not change what
# a program over maps and sets prints.

[[tests]]
name = "map_basic"
desc = "`Map<K, V>`: `as` from an array literal, `m[k]` as a `V?` opened with `??`, `put`/`remove`/`merge` returning new values and leaving their argument alone, `has`, `len`, `keys`/`values`/`items` in key order, `get`, `get_or`, `==`, `string()`, `format`; both call forms (`put<k, v>(m)`, `put(m, k, v)`)."
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
case = "../../../cases/compile/collections/map_basic.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
golden = "golden/collections/map_basic.txt"
expect_exit = 0
expect_output_not_contains = ["[Error]", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

[[tests]]
name = "set_basic"
desc = "`Set<T>`: `as` drops duplicates, `contains`/`has`, `add`/`remove`, `union`/`intersect`/`difference`, `is_subset`, `items` in order, `==`, sets of strings and booleans."
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
case = "../../../cases/compile/collections/set_basic.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
golden = "golden/collections/set_basic.txt"
expect_exit = 0
expect_output_not_contains = ["[Error]", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

[[tests]]
name = "generics"
desc = "`Map<typeas K, typeas V>` and `Set<typeas T>` bind their variables from the argument's type and instantiate per set of types; `map_values` and `filter_keys` written as compositions of `items`, `map`/`filter` and `as`; `[] as Map<K, V>` inside an instance; a word count by `reduce` over `put`."
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
case = "../../../cases/compile/collections/generics.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
golden = "golden/collections/generics.txt"
expect_exit = 0
expect_output_not_contains = ["[Error]", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

[[tests]]
name = "edges"
desc = "Empty and one-entry collections under every operation, a map whose values may be null (`m[k]` stays a `V?`, `has` tells absent from null), duplicate keys in an array computed at run time (the later entry wins), maps of maps and of arrays, float values under `==`, tuple keys, and the key order of every key type."
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
case = "../../../cases/compile/collections/edges.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
golden = "golden/collections/edges.txt"
expect_exit = 0
expect_output_not_contains = ["[Error]", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

