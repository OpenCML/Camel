# --- An enum as a map key and as a set element (design principles 11.3) ---------------------

[[tests]]
name = "enum_keys"
desc = "An enum without a payload and one with a comparable payload as a map key and as a set element: construction, the key order (variants in declaration order, then field by field), lookup, equality, printing, and duplicates dropped by equality. Alike on the four back ends."
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
case = "../../../cases/compile/collections/enum_keys.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
golden = "golden/collections/enum_keys.txt"
expect_exit = 0
expect_output_not_contains = ["[Error]", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

[[tests]]
name = "err_key_enum_field"
desc = "An enum whose payload cannot be a key is refused: the message names the field of the variant, and the position of the field's type in the declaration is a second location."
