# --- one calling form (design principles 11.4) ---------------------------------------------
# The value worked on is the ordinary argument, the rest are with-arguments: put<k, v>(m) or
# m->put<k, v>. The spelling with everything in the parentheses is no longer accepted, and a
# call written that way (of these operators or of any library function) gets a hint that names
# the misplaced arguments and gives the call as it should be written.

[[tests]]
name = "callform_kept"
