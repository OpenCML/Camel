case = "../../../cases/compile/collections/err_key_enum_field.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::CollectionKeyNotAllowed"
expect_diagnostic_line = 10
expect_diagnostic_column = 36
expect_output_contains = ["The type 'Boxed' cannot be a key of 'Map': its field 0 of variant 'Weight' of type 'float' cannot be a key", "[field 0 of variant 'Weight' is declared here at 7:35]", "tuples of those, and an enum every field of which is one of those"]
expect_output_not_contains = ["never printed"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]

[[tests]]
name = "err_key_enum_element"
desc = "The element of a set is checked like the key of a map: an enum with a struct field is refused, and the diagnostic names the field of the variant (here `field 0`: a tuple variant's fields have no names) and points at the field's type in the declaration."
kind = "negative"
case = "../../../cases/compile/collections/err_key_enum_element.cml"
args = ["${case}"]
expect_exit = 1
