id = "compile.fold_arms"
order = 944
tier = "fast"
tags = ["feat", "compile", "opt", "fold", "branches"]
desc = """
A branch whose condition the folding knows is replaced by the taken arm, and the place the branch
held in its block's chain is handed to the last statement of that arm. The arm's code is its own
region only as far as it is not nested: the condition and the body of a loop written in the arm,
and the arms of a branch written in it that is still there, are regions of their own, and a node of
one of them runs when that region runs, not whenever the arm runs (docs/technical/
17_graph_rewrite_api_contracts.md, 4.1). Handing the place to a node of a nested region made the
statements written after the branch read a value only that region computes, and the commit refused
the graph -- after `std::opt::inline`, whose copies gave the pruning that shape; `std::opt::fold`
alone and `std::opt::inline` alone were both green. `pruneBranch` now takes the tail from the arm's
own region (`GraphDraft::armRegionOf`), so the place is handed to a node that runs with the arm.
"""
# The case is the minimal program of a progen finding (seed 8, reduced 157 -> 30 -> 21 -> 16 lines),
# with the value it computes printed: the assertion is that the graph is accepted *and* that the
# number is the one the program means, so a fix that keeps the structure by dropping the arm's code
# would still be red.

[[tests]]
name = "fold_arms.after_inline_gate"
desc = "The reported pipeline: `std::opt::inline` then `std::opt::fold` on the minimal program. Before, the fold's pruning handed the place of the outer branch to a GATE of the loop's condition region, which lies in the taken arm but is not of it, and the commit refused the graph: `Runtime graph 'main' breaks the branch-arm invariant: GATE 30 reads GATE 35 ... arm of BRCH 25 that may not be taken when GATE 30 runs`. The folded program is accepted here and prints the value it computed, so a graph that keeps the shape by not running the arm's code is red too."
kind = "behavior"
case = "../../../cases/compile/fold_arms/after_inline_arm_gate.cml"
args = ["${case}", "std::opt::inline", "std::opt::fold", "${run_nvm}"]
expect_exit = 0
expect_output_not_contains = ["branch-arm invariant", "PassInternalError", "internal error", "defect of the compiler"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
assert(out === 'pair 1.0', `unexpected output: ${out}`)
}
"""
timeout_ms = 20000

# `rc05_seed104` of the reduced programs of result `adb67e081` (CC2027 eval, `test/cases/opt/
# adb67e081/`): the same arm-tail choice, reached without `inline` -- the loop is written in the arm
# and its body is a lambda call, so `std::opt::fold` alone refused the graph with `GATE 28 reads
# OPER 21 (:mark/filter_arr), which lies in an arm of BRCH 24`. The program prints nothing, so the
# output of a run with the folding must be the output of a run without it: the three entries below
# are that comparison, the first one being the reference the other two must equal.

[[tests]]
name = "fold_arms.adb67e081_reference"
desc = "`rc05_seed104` without any optimization pass: the reference the folded runs must reproduce. Exit 0 and no output."
kind = "behavior"
case = "../../../cases/opt/adb67e081/rc05_seed104.cml"
args = ["${case}", "${run_nvm}"]
envs = ["PROGEN_I0=7"]
expect_exit = 0
expect_output_not_contains = ["branch-arm invariant", "PassInternalError", "internal error", "defect of the compiler"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
assert(out === '', `unexpected output: ${out}`)
}
"""
timeout_ms = 20000

[[tests]]
name = "fold_arms.adb67e081_fold"
desc = "`std::opt::fold`, the pipeline the defect was found with: the folding must not change what the program does. Before, the graph was refused (`GATE 28 reads OPER 21 ... arm of BRCH 24 that may not be taken when GATE 28 runs`)."
kind = "behavior"
case = "../../../cases/opt/adb67e081/rc05_seed104.cml"
args = ["${case}", "std::opt::fold", "${run_nvm}"]
envs = ["PROGEN_I0=7"]
expect_exit = 0
expect_output_not_contains = ["branch-arm invariant", "PassInternalError", "internal error", "defect of the compiler"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
assert(out === '', `unexpected output: ${out}`)
}
"""
timeout_ms = 20000

[[tests]]
name = "fold_arms.adb67e081_std_opt"
desc = "The same program through `std::opt`: accepted, and the same output as the reference (before, `GATE 30 reads OPER 23 ... arm of BRCH 26`)."
kind = "behavior"
case = "../../../cases/opt/adb67e081/rc05_seed104.cml"
args = ["${case}", "std::opt", "${run_nvm}"]
envs = ["PROGEN_I0=7"]
expect_exit = 0
expect_output_not_contains = ["branch-arm invariant", "PassInternalError", "internal error", "defect of the compiler"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
assert(out === '', `unexpected output: ${out}`)
}
"""
timeout_ms = 20000

[[tests]]
name = "fold_arms.std_opt_fvm"
desc = "The same program through the pipeline the finding was reported with, `std::opt`, on the bytecode back end: accepted, and the same number."
kind = "behavior"
case = "../../../cases/compile/fold_arms/after_inline_arm_gate.cml"
args = ["${case}", "std::opt", "${run_fvm}"]
expect_exit = 0
expect_output_not_contains = ["branch-arm invariant", "PassInternalError", "internal error", "defect of the compiler"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
assert(out === 'pair 1.0', `unexpected output: ${out}`)
}
"""
timeout_ms = 20000