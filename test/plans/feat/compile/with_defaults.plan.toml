id = "compile.with_defaults"
order = 329
tier = "fast"
tags = ["feat", "compile", "with", "defaults"]
desc = "Defaults of `with` parameters and `with` arguments given by name (design principles 4.4): a default is a compile-time constant evaluated where the declaration is and filled into each call that leaves the parameter out; a call gives the parameters by position, or by name after the positional ones. A callee that is several declarations names the parameter at each position the same way in all of them, and a name then means one position there; a call of such a callee fills no default, since a default is written by one declaration."

# A default belongs to the declaration, not to the call site: it is evaluated once, where the
# declaration is (so `2 + 3` is 5, and a value it cannot compute is a declaration error), and a
# call that leaves the parameter out gets that value. A function value made from the
# declaration carries no default, and a partial application keeps exactly what it was given.

[[tests]]
name = "with_defaults.applied"
desc = "A call may leave a defaulted `with` parameter out (both defaults, then one by position), override it by position, or give it by name after the positional ones (`f<strict: true>` skips `rounds`). A default is the declaration's constant (`2 + 3`), a generic declaration's default reaches its instances, and a function value made from the declaration carries no default while a partial application keeps what it was given."
kind = "behavior"
case = "../../../cases/compile/with_defaults/defaults.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "18\n20\n80\n26\n10\n12\n12\n4\n3\n3\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "with_defaults.not_constant"
desc = "A default that reads another `with` parameter of the same declaration is not a compile-time constant: the declaration is reported as WithDefaultNotConstant, at the default expression, not at a call."
kind = "negative"
case = "../../../cases/compile/with_defaults/default_not_constant.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::WithDefaultNotConstant"
expect_diagnostic_line = 7
expect_output_contains = ["default of the 'with' parameter 'b' is not a compile-time constant"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "with_defaults.wrong_type"
desc = "A default is a value of its parameter's type: a string default of an `int` parameter is WithDefaultWrongType, at the default expression."
kind = "negative"
case = "../../../cases/compile/with_defaults/default_wrong_type.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::WithDefaultWrongType"
