[[tests]]
name = "with_defaults.named_across_overloads"
desc = "A named `with` argument binds across an overload set when every declaration names each `with` position the same way: `rounds` is the first `with` parameter of both declarations of `show`, so `show<rounds: 2>(3)` and `show<rounds: 2>('a')` each reach the declaration their ordinary argument's type selects, and the binding gives the same value as the positional `show<2>(3)`. A named `with` argument at a call of several declarations used to be refused whatever the names were."
kind = "behavior"
case = "../../../cases/compile/with_defaults/named_across_overloads.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "with named_across_overloads number=6 positional=6 text=a2\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "with_defaults.overload_names_differ"
desc = "The rule that the overloads of a name name each position the same way holds for the `with` parameters as for the ordinary ones: the first `with` parameter of `show` is `rounds` in one declaration and `iters` in the other, so `rounds` names no one parameter and the binding is OverloadParameterNames, at that `with` argument."
kind = "negative"
case = "../../../cases/compile/with_defaults/overload_names.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::OverloadParameterNames"
expect_diagnostic_line = 19
expect_output_contains = ["The argument 'rounds' is given by name, and the overloads of 'show' do not name the parameter at that position the same way."]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "with_defaults.overload_fills_no_default"
desc = "A call of several declarations fills no default, on the `with` list too: `rounds` has a default in both declarations of `show`, but a default is written by one declaration and `show<label: 'p'>` does not say which one it means, so the binding is WithArgumentCallee."
kind = "negative"
case = "../../../cases/compile/with_defaults/overload_default_hole.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::WithArgumentCallee"
expect_diagnostic_line = 19
