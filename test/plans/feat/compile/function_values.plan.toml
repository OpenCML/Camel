[[tests]]
name = "return_operator_name"
desc = "Returning the name of an operator with several signatures is rejected at the return; it used to be an internal error without a position"
kind = "negative"
case = "../../../cases/compile/function_values/return_operator_name.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::FunctionNameAsValue"
expect_diagnostic_code = "0x03000060"
expect_diagnostic_line = 8
expect_diagnostic_column = 5
expect_output_contains = ["'println' is used as a value here, but it names an operator whose signature depends on its arguments"]
expect_output_not_contains = ["never printed", "UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "capture_operator_name"
desc = "A lambda cannot capture a name bound to an operator; rejected at the use in the lambda"
kind = "negative"
case = "../../../cases/compile/function_values/capture_operator_name.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::FunctionNameAsValue"
expect_diagnostic_code = "0x03000060"
expect_diagnostic_line = 10
expect_diagnostic_column = 44
expect_output_contains = ["'p' is used as a value here, but it names an operator with 4 signatures"]
expect_output_not_contains = ["never printed", "UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000
