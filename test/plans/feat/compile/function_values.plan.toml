id = "compile.function_values"
order = 325
tier = "fast"
tags = ["feat", "compile", "closures", "functions"]
desc = "Functions named as values: bound with let, returned, captured, and the value of a function that captures names."

[[tests]]
name = "nested_function_value.nvm"
desc = "A function that captures a name, called directly and also used as a value; the value used to lack the captures and the run crashed (progen F25) (nvm)"
kind = "behavior"
case = "../../../cases/compile/function_values/nested_function_value.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "[1]",
  "2 [2, 3]",
  "[11, 12]",
  "13",
  "[201]",
  "6",
  "[8, 9]",
  "42",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

