[[tests]]
name = "return_named_function.nvm"
desc = "A function named after return is returned as its function value; it used to be an internal error without a position (progen F31) (nvm)"
kind = "behavior"
case = "../../../cases/compile/function_values/return_named_function.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "true false",
  "6",
  "[6, 7, 8]",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

