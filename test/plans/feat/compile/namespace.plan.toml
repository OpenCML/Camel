id = "compile.namespace"
order = 318
tier = "feat"
tags = ["feat", "compile", "namespace"]

[[tests]]
name = "type_namespace_constructor"
desc = "Checks namespace-declared user constructors resolve through Type::function references."
kind = "behavior"
case = "../../../cases/compile/namespace/type_namespace_constructor.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
verify_script = """
({ input, assert, match }) => {
    assert(input.exit_code === 0, `camel exited ${input.exit_code}`)
    const found = match(/type_namespace_constructor x=([0-9]+)/, input.normalized.stdout)
    assert(Number(found[1]) === 7, `expected x=7, got ${found[1]}`)
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

