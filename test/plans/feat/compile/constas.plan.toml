[[tests]]
name = "constas_string_graph"
desc = "The string value is part of the instance key: two calls that differ only in the string make two graphs, `label<\"w\">` and `label<\"h\">`, each with the one port `n` and no port for the value."
kind = "behavior"
case = "../../../cases/compile/constas/constas_string.cml"
args = ["${case}", "std::jgir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const doc = JSON.parse(input.normalized.stdout)
const at = (value) => doc.graphs.find((g) => g.name.includes(`label<"${value}">`))
const w = at('w'), h = at('h')
assert(w && h, `expected the instances label<"w"> and label<"h">, got ${doc.graphs.map((g) => g.name).join(', ')}`)
assert(w !== h, 'the two string values must make two instances')
for (const graph of [w, h]) {
  assert(graph.normalPorts.length === 1, `${graph.name} has ${graph.normalPorts.length} normal ports`)
  const port = graph.nodes.find((n) => n.id === graph.normalPorts[0])
  assert(port && port.parameter && port.parameter.name === 'n', `${graph.name} must take n, got ${JSON.stringify(port && port.parameter)}`)
}
const main = doc.graphs.find((g) => g.name.endsWith('main'))
assert(main, 'the graph of main is missing')
const callsOfW = main.nodes.filter((n) => n.kind === 'FUNC' && n.callee === w.id)
assert(callsOfW.length === 2, `expected two calls of label<"w">, got ${callsOfW.length}`)
for (const call of callsOfW) {
  const inputs = main.edges.filter((e) => e.target === call.id && e.kind === 'normal')
  assert(inputs.length === 1, `the call of label<"w"> passes ${inputs.length} argument(s)`)
}
}
"""
timeout_ms = 8000

