id = "compile.constas"
order = 341
tier = "fast"
tags = ["feat", "compile", "generics", "constas"]
desc = "'constas' value parameters (design principles 5.4, H51 ruling 2026-10-22): a value of any compile-time type, any number of them in any position; the value is part of the instance key, is read by the body as a static value (extents, `t.[n]`, conditions), may be handed on to another such parameter, and is not a runtime parameter. Refusals cover only the value being absent or not a constant, a body-less declaration, and a declaration used as a value."

[[tests]]
name = "constas_instances"
desc = "`total(3, ...)` and `total(5, ...)` are two instances, each with its parameter's extent fixed by the value; the same value reuses the instance."
kind = "behavior"
case = "../../../cases/compile/constas/constas_param.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const want = ["3.0", "5.0", "3.0"].join(String.fromCharCode(10))
assert(input.normalized.stdout.trim() === want, `constas instances changed: ${input.normalized.stdout}`)
}
"""
timeout_ms = 8000

[[tests]]
name = "constas_graph"
desc = "The instance has no port for the `constas` value (`total<3>` takes only `x`), and the call passes no argument for it: the CALL node has one normal input, the tensor."
kind = "behavior"
case = "../../../cases/compile/constas/constas_param.cml"
args = ["${case}", "std::jgir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const doc = JSON.parse(input.normalized.stdout)
const instance = (value) => doc.graphs.find((g) => g.name.endsWith(`total<${value}>`))
const at3 = instance(3), at5 = instance(5)
assert(at3 && at5, `expected the instances total<3> and total<5>, got ${doc.graphs.map((g) => g.name).join(', ')}`)
for (const graph of [at3, at5]) {
  assert(graph.normalPorts.length === 1, `${graph.name} has ${graph.normalPorts.length} normal ports`)
  const port = graph.nodes.find((n) => n.id === graph.normalPorts[0])
  assert(port && port.parameter && port.parameter.name === 'x', `${graph.name} must take x, got ${JSON.stringify(port && port.parameter)}`)
  assert(graph.normalPorts.every((id) => { const n = graph.nodes.find((x) => x.id === id); return !n.parameter || n.parameter.name !== 'n' }), `${graph.name} still has a port for n`)
}
const main = doc.graphs.find((g) => g.name.endsWith('main'))
assert(main, 'the graph of main is missing')
const calls = main.nodes.filter((n) => n.kind === 'FUNC' && n.callee === at3.id)
assert(calls.length === 2, `expected two calls of total<3>, got ${calls.length}`)
for (const call of calls) {
  const inputs = main.edges.filter((e) => e.target === call.id && e.kind === 'normal')
  assert(inputs.length === 1, `the call of total<3> passes ${inputs.length} argument(s)`)
}
}
"""
timeout_ms = 8000

