[[tests]]
name = "param_defaults.one_constant"
desc = "The claim that the default is evaluated once is visible in the graph: two calls that leave `label` out make two call nodes, and both read the one constant node holding \"once\", printed by `std::gir` (design principles 4.4)."
kind = "behavior"
case = "../../../cases/compile/param_defaults/one_constant.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const calls = out.split('label="tag", type="FUNC"').length - 1
assert(calls === 2, `two call nodes, got ${calls}; ${out}`)
const marker = 'label="once"'
const nodes = out.split(marker).length - 1
assert(nodes === 1, `the default is one constant node, got ${nodes}; ${out}`)
const line = out.split('\n').find((l) => l.includes(marker)) || ''
const id = line.trim().split(' ')[0]
const readers = out.split(id + ' ->').length - 1
assert(readers === 2, `both calls read that one node, got ${readers} edges; ${out.split('\n').filter((l) => l.includes(' ->') && l.includes(id)).join(' | ')}`)
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "param_defaults.function_value"
desc = "A function value made from a declaration carries no default (the default belongs to the declaration, not to the value), so calling the value with one argument is a call that leaves a parameter without a value."
kind = "negative"
case = "../../../cases/compile/param_defaults/function_value.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ArgumentsMismatch"
expect_diagnostic_line = 14
expect_output_contains = ["'(a: int, b: int) => int' cannot be called with argument types"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "param_defaults.struct_not_constant"
desc = "A struct literal is not a compile-time constant in Camel: a struct default would be constructed at the call, so it is refused as ParamDefaultNotConstant, at the default expression."
kind = "negative"
case = "../../../cases/compile/param_defaults/default_struct_not_constant.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ParamDefaultNotConstant"
expect_diagnostic_line = 10
expect_output_contains = ["default of the parameter 'p' is not a compile-time constant"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000