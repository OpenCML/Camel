desc = "The overloads of one name have to name the parameter at a position the same way: the second parameter of `f` is `b` in one declaration and `c` in the other, so the call's `b` names no one parameter of `f` and is OverloadParameterNames, at that argument."
kind = "negative"
case = "../../../cases/compile/param_defaults/overload_names.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::OverloadParameterNames"
expect_diagnostic_line = 17
