[[tests]]
name = "param_defaults.overload_fills_no_default"
desc = "A call of several declarations fills no default: `b` has a default in both declarations of `f`, but a default is written by one declaration and `f(a: 1, c: 3)` does not say which one it means, so the call is ParamArgumentCallee. The parameters it does name are named the same way in both, which is why the report is not about the names."
kind = "negative"
