id = "compile.param_defaults"
order = 344
tier = "fast"
tags = ["feat", "compile", "params", "defaults", "named"]
desc = "Defaults of ordinary parameters and ordinary arguments given by name (design principles 4.4, handover H276): one rule with the `with` parameters — a default is a compile-time constant evaluated where the declaration is, and a call gives the parameters by position, or by name after the positional ones, in the declaration's order."

# The rule the `with` parameters got in H235 is the rule for every parameter. A default is the
# declaration's node, not something the call evaluates, so `2 + 3` is one constant, two calls
# that leave the parameter out read the one node, and a function value carries no default. A name
# selects its parameter by the declaration's order, so a call can skip the parameter in between.

[[tests]]
name = "param_defaults.applied"
desc = "A call may leave a defaulted parameter out, override it by position, or give it by name after the positional ones, in any written order (`add(y: 7, x: 1)`). A name selects a non-adjacent parameter (`three(1, c: 3)` skips `b`), a middle parameter may be given by name with the later one by name too, and a default is the declaration's constant (`2 + 3`)."
kind = "behavior"
case = "../../../cases/compile/param_defaults/defaults.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "3\n6\n8\n14\n6\n103\n10\nhello you\nhi you\n14\n3\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "param_defaults.positional_after_name"
desc = "A positional argument may not follow a named one: `f(a: 1, 2)` is ParamArgumentPositionalAfterNamed, at the argument out of place, and the report names the call."
kind = "negative"
case = "../../../cases/compile/param_defaults/positional_after_name.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ParamArgumentPositionalAfterNamed"
expect_diagnostic_line = 12
expect_output_contains = ["A positional argument follows a named one in the call of 'f'"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "param_defaults.duplicate"
