desc = "A `T?` parameter takes `null` as its default: `null` is a compile-time constant of the nullable type it stands in (design principles 4.4, 5.1, the ruling of 2026-10-24 on `check-program-parameter`), so the declaration is accepted and a call that leaves the parameter out reads the declaration's one null, while a call that gives a value overrides it -- including a parameter after the defaulted one, given by name."
kind = "behavior"
case = "../../../cases/compile/param_defaults/default_nullable.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "7\n3\n9\nnone\nsome 5\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 12000

