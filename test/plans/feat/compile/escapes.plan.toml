[[tests]]
name = "escapes.valid_only"
desc = "The escapes that remain valid warn about nothing: `\\0` (but not `\\01`), `\\x41`, `\\u{...}`, `\\n` and `\\0x` in all three forms give the same lengths and no diagnostic."
kind = "behavior"
case = "../../../cases/compile/escapes/valid.cml"
args = ["${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const want = [
    'plain 1 1 1 1 2',
    'formatted 1 1 1 1 2',
    'triple 1 1 1 1 2',
    'A ' + String.fromCharCode(0x4E2D),
].join('\n')
assert(input.normalized.stdout.trim() === want, 'stdout: ' + input.normalized.stdout)
assert(input.normalized.stderr.trim() === '', 'no warning: ' + input.normalized.stderr)
}
"""

[[tests]]
name = "escapes.unknown_forms"
desc = "`\\q` and `\\101` sit in the same catalogue entry, with the same message shape: eight warnings and the text kept as written (`\\q`, `\\101`, `\\8`, `\\01`). `\\0` alone stays the null byte."
kind = "behavior"
case = "../../../cases/compile/escapes/unknown.cml"
args = ["${case}"]
expect_exit = 0
expect_stderr_contains = ["name=LexicalDiag::InvalidEscapeSequence, code=0x01100000", "Invalid escape sequence in string: \\q", "Invalid escape sequence in string: \\101", "Invalid escape sequence in string: \\8", "Invalid escape sequence in string: \\01"]
verify_script = """
({ input, assert }) => {
const bs = String.fromCharCode(92)
const want = [
    'q 2 ' + bs + 'q',
    '101 4 ' + bs + '101',
    '8 2 ' + bs + '8',
    '01 3 ' + bs + '01',
    '0 1',
].join('\n')
assert(input.normalized.stdout.trim() === want, 'stdout: ' + input.normalized.stdout)
const warnings = (input.normalized.stderr.match(/LexicalDiag::InvalidEscapeSequence/g) || []).length
assert(warnings === 8, 'eight warnings, got ' + warnings + ': ' + input.normalized.stderr)
}
"""