id = "compile.escapes"
order = 923
tier = "fast"
tags = ["feat", "compile", "literals", "escapes"]
desc = "The one escape table of the three string forms after H89: `\\0`, `\\xHH`, `\\u{...}` and the named escapes decode; an octal-looking form (`\\101`, `\\01`, `\\012`, `\\033`) and any other unknown pair (`\\q`, `\\8`) are unknown escapes -- kept as written, warned as LexicalDiag::InvalidEscapeSequence, one code and one message shape for all of them."

[defaults]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "escapes.plain"
desc = "A plain string: the seven probes of the ruling and the three octal-looking forms. `\\101`, `\\8`, `\\01`, `\\012` and `\\033` are unknown (six warnings, the text kept); `\\0` is the null byte, `\\x41` is `A`, `\\u{1F600}` is one code point, `\\n` is the line feed, and `\\0x` is the null byte and an `x`."
kind = "behavior"
case = "../../../cases/compile/escapes/plain.cml"
args = ["${case}"]
expect_exit = 0
expect_stderr_contains = ["[Warn]:", "name=LexicalDiag::InvalidEscapeSequence, code=0x01100000", "Invalid escape sequence in string: \\101", "Invalid escape sequence in string: \\8", "Invalid escape sequence in string: \\01", "Invalid escape sequence in string: \\012", "Invalid escape sequence in string: \\033"]
verify_script = """
({ input, assert }) => {
const bs = String.fromCharCode(92)
const want = [
    '101 4', '0 1', 'x41 1 A', 'u 1', 'n 1', '8 2 ' + bs + '8', '0x 2',
    '01 3', '012 4', '033 4',
].join('\n')
assert(input.normalized.stdout.trim() === want, 'stdout: ' + input.normalized.stdout)
const warnings = (input.normalized.stderr.match(/Invalid escape sequence in string:/g) || []).length
assert(warnings === 6, 'six warnings, got ' + warnings + ': ' + input.normalized.stderr)
}
"""

[[tests]]
name = "escapes.formatted"
desc = "A formatted string: the same probes and the same six unknown escapes; the pattern text reaches the same table."
kind = "behavior"
case = "../../../cases/compile/escapes/formatted.cml"
args = ["${case}"]
expect_exit = 0
expect_stderr_contains = ["[Warn]:", "name=LexicalDiag::InvalidEscapeSequence, code=0x01100000", "Invalid escape sequence in string: \\101", "Invalid escape sequence in string: \\8"]
verify_script = """
({ input, assert }) => {
const bs = String.fromCharCode(92)
const want = [
    '101 4', '0 1', 'x41 1 A', 'u 1', 'n 1', '8 2 ' + bs + '8', '0x 2',
    '01 3', '012 4', '033 4',
].join('\n')
assert(input.normalized.stdout.trim() === want, 'stdout: ' + input.normalized.stdout)
const warnings = (input.normalized.stderr.match(/Invalid escape sequence in string:/g) || []).length
assert(warnings === 6, 'six warnings, got ' + warnings + ': ' + input.normalized.stderr)
}
"""

