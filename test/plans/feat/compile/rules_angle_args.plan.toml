# The angle-bracket arguments of a rule's two sides (lane-rulesargs)
#
# `reshape<shape>(x)` and `softmax<axis>(x)` state the parameter that decides which function they
# are in `<>` (design principles 4.4), and `mean<axis, keepdims>(xs)` -- the operator's other
# spelling -- states the same kind of value in parentheses. A rule names its data in parentheses
# only, so the two operators that state it in `<>` cannot be written as rules that carry it:
#
#   * the builder asks a `with` argument to be a compile-time value
#     (`src/compile/gir/builder_generics.cpp#Builder::ruleWithArgumentValue`), and a value position's
#     `<...>` is a context argument and nothing else (design principles 5.6) -- so the shape and the
#     axis can only be *stated* by a rule, never bound from the node it matches;
#   * a rule's right side that names `reshape<[2, 2]>(dx)` used to be refused outright
#     (`modules/transforms/rule_expand.cpp#findRuleRightSide`, "passes a context argument of its
#     own"); it is copied now, with its angle argument carried like an operand (4fb738332);
#   * the transposed walk used to refuse an operator with more than two operands before it looked at
#     what each position was (`skip=arity uri=tensor:mean_axis operands=3`). That count is gone
#     (2026-11-03): a law names its operator's ports and says which of them answer a cotangent, and
#     `mean_axis_t`'s second and third names are positions no cotangent is asked of because `int` and
#     `bool` have no tangent space.
#
# Three readings, three case files, one `main` each (`rules_angle_args_reshape.cml`,
# `rules_angle_args_softmax.cml`, `rules_angle_args_mean_transpose.cml`). They shared one program
# until this split, and a program stops at its first failure: `reshape` and `softmax` answered
# correctly (`value=30.0 tangent=5.0`, `value=1.5 tangent=-0.25`) while the third line's transposed
# walk ended the run, so the two correct answers could only be reported as part of a red one. A case
# that asserts three things fails once, and that one failure hides which part was right.
#
# The reshape reading is now two files too, for a reason of its own: `[2, 2]` is the shape the law
# itself used to write, so the first one cannot tell a law that bound the operator's second port from
# a law that stated it. `rules_angle_args.reshape_shape` reshapes to `[8, 2, 8]` -- a shape no law's
# text could have stated -- and is the reading that separates them (measured 2026-11-20: the law as
# written answered `reshape<[2, 2]>(dx)` and the program stopped at
# `TensorDimensionMismatch: [128] -> [2, 2]`).
#
# Every number below is derived by hand in its case's own header, not read off any run.
#
# The mean reading is now two files, and the pair is the rule (author, 2026-11-03 16:15): the
# parameter's shape is either in the type -- `x: float[2, 3]`, and the pullback is built and answers
# its cotangent -- or it is not -- `x: float[...]`, and the program is refused with the sentence that
# says to write it, which is what `transpose_needs_parameter_shape` pins. The adjoint of a linear map
# needs the shape of its domain; that is the language's rule, not the transform's progress.

[[tests]]
name = "rules_angle_args.reshape"
desc = "`jvp` of `f(x) = sum(reshape<[2, 2]>(x) * [[1, 2], [3, 4]])` at x = [1, 2, 3, 4] along dx = [0.5, 0.5, 0.5, 0.5]: f = 30.0 and f' = 5.0, both by hand. `jvp_reshape`'s right side names `reshape<[2, 2]>(dx)`, which is the context-argument refusal the expansion no longer makes."
kind = "behavior"
case = "../../../cases/modules/autodiff/rules_angle_args_reshape.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["rules_angle_args reshape value=30.0 tangent=5.0"]
timeout_ms = 30000

[[tests]]
name = "rules_angle_args.reshape_shape"
desc = "The reading `rules_angle_args.reshape` cannot take: `jvp` of `f(x) = sum(reshape<[8, 2, 8]>(x))` on x = [1.0 ... 128.0] along dx = [0.5] * 128, with the number derived by hand in the case's own header -- f = 128 * 129 / 2 = 8256.0, and a reshape moves no element, so f' = 128 * 0.5 = 64.0. `[2, 2]` is the one shape a law's text could have stated, so `reshape<[2, 2]>` answered `rules_angle_args.reshape` whether the pattern bound the operator's second port or wrote a constant there; `[8, 2, 8]` is a shape only a law that names the port can answer, and the law that stated it handed back `reshape<[2, 2]>(dx)` and stopped the program at `TensorDimensionMismatch: [128] -> [2, 2]`."
kind = "behavior"
# The case sits under `test/cases/compile/transforms/` and not beside its three siblings: the
# autodiff migration ledger counts every case in `test/cases/modules/autodiff/` as a row of its
# ratchet (`scripts/autodiff-migration-ledger.mjs#LEDGER_RECORDED`), and a new case there moves
# `total`, `library` and `array` -- the two denominators are recorded as a decision and `array` may
# only fall. Recording them is a change to an expectation outside `test/plans/`, which this lane may
# not make, so the reading lives where it costs no record a line. Reading the same number is the
# point; the directory is not.
#
# What that costs is `--changed`, and only in the harmless direction (author's ruling, 2026-11-20
# 04:2x): a change to this case selects `feat/compile/transforms.plan.toml` by the directory rule,
# not this plan -- and the explicit `case` below is what guarantees the reading is reached whenever
# `feat/compile` runs at all. A selection that is too wide runs a few extra cases; only one that is
# too narrow can lose a reading, and this is not that. Do not read the directory as a misfiling.
case = "../../../cases/compile/transforms/rules_angle_args_reshape_shape.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["rules_angle_args reshape-shape value=8256.0 tangent=64.0"]
timeout_ms = 30000

[[tests]]
name = "rules_angle_args.softmax"
desc = "`jvp` of `f(x) = sum(softmax<1>(x) * [1, 2])` at x = [[1, 1]] along dx = [[1, 0]]: y = [0.5, 0.5], so f = 1.5 and the tangent `y * (dx - y.dx)` dotted with [1, 2] is -0.25, both by hand."
kind = "behavior"
case = "../../../cases/modules/autodiff/rules_angle_args_softmax.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["rules_angle_args softmax value=1.5 tangent=-0.25"]
timeout_ms = 30000

[[tests]]
name = "rules_angle_args.softmax_without_its_axis"
desc = "`softmax(t, axis?: int)` defaults the axis to `-1`, so `softmax(x)` carries one port where `softmax<2>(x)` carries two, and a law's parameters are the operator's ports. This program writes the spelling with the axis omitted and is refused before the first number: the reading is WHICH refusal, because a law that answered the default would be answering a configuration the graph does not state (design principles 9.9). Measured on both sides of the change that named the axis (2026-11-20): the law that wrote `softmax<1>` refused this program at the value it had written (`writes 1 `<>` value(s) of its own`), and the law that names the axis refuses it at the port count. Neither answered it, so naming the axis cost this spelling nothing; the negative on the first sentence is what says so."
kind = "negative"
case = "../../../cases/compile/transforms/softmax_without_its_axis.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 1
expect_output_contains = ["jvp has no forward rule for `tensor:softmax`", "the rule takes (float[...], int), and the operator has (float[...])"]
expect_output_not_contains = ["writes 1 `<>` value(s) of its own"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "rules_angle_args.softmax_axes"
desc = "`jvp` of `f(x) = sum(softmax<axis>(x) * W)` on `x = float[2, 2, 2]` of zeros along `dx = W = [[[1, 2], [3, 4]], [[5, 6], [7, 8]]]`, once for each of the three axes: `value=18.0 axis0=16.0 axis1=4.0 axis2=1.0`, derived by hand in the case's own header as `(1/4) * sum over pairs of (dx_e - dx_p)^2`. `jvp_softmax` wrote `<1>` in its own left side, so it answered the middle axis of this operand and refused the other two by name; the law names the axis as its last parameter now, which is `jvp_reshape`'s and `jvp_permute`'s shape. Three axes, one law: an implementation that writes a constant answers one of the three and a correct one answers all."
kind = "behavior"
case = "../../../cases/compile/transforms/softmax_axis_jvp.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["rules_angle_args softmax-axes value=18.0 axis0=16.0 axis1=4.0 axis2=1.0"]
timeout_ms = 30000

[[tests]]
name = "rules_angle_args.log_softmax_axes"
desc = "The same three axes for `log_softmax`: `axis0=32.0 axis1=8.0 axis2=2.0`, each twice the softmax's, derived by hand in the case's own header (`(1/2) * sum over pairs of (dx_e - dx_p)^2`, since the log softmax tangent scales by `exp(y) = 1/2` and not by `y`). `jvp_log_softmax` wrote `<0>`, so it answered the first axis of a rank-1 input and refused the rest by name; it names the axis now. The value is not pinned -- it is `-log(2) * 36` and not a binary fraction -- so the three tangents are the whole reading."
kind = "behavior"
case = "../../../cases/compile/transforms/log_softmax_axis_jvp.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["rules_angle_args log-softmax-axes axis0=32.0 axis1=8.0 axis2=2.0"]
timeout_ms = 30000

[[tests]]
name = "rules_angle_args.softmax_after_layout"
desc = "The `attention` block's chain differentiated end to end: `reshape<[8, 2, 8]>` then `permute<[1, 0, 2]>` then `softmax<2>`, on `x = float[8, 16]` of zeros along `dx = [0..127]` with the weight `w = [1..128]` of shape `float[2, 8, 8]`. Values `1032.0` and `84.0`, both derived by hand in the case's own header. This is the reading the tree could not take: the two laws in front of the softmax bound the call's own angle (`float[2, 8, 8]` is the shape only that reshape and that permutation produce), and `jvp_softmax` wrote `<1>`, so the lift refused the third node -- `REINTERP jvp function=mix skip=rule uri=tensor:softmax`. Pinned as the numbers and as the absence of a refusal, so the day the lift is refused again this entry goes red and prints the sentence."
kind = "behavior"
case = "../../../cases/compile/transforms/softmax_axis_after_layout.cml"
args = ["--trace", "transforms", "${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
