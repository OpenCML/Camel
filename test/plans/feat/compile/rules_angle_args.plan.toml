# The angle-bracket arguments of a rule's two sides (lane-rulesargs)
#
# `reshape<shape>(x)` and `softmax<axis>(x)` state the parameter that decides which function they
# are in `<>` (design principles 4.4), and `mean_axis(xs, axis, keepdims)` -- the operator's other
# spelling -- states the same kind of value in parentheses. A rule names its data in parentheses
# only, so the two operators that state it in `<>` cannot be written as rules that carry it:
#
#   * the builder asks a `with` argument to be a compile-time value
#     (`src/compile/gir/builder_generics.cpp#Builder::ruleWithArgumentValue`), and a value position's
#     `<...>` is a context argument and nothing else (design principles 5.6) -- so the shape and the
#     axis can only be *stated* by a rule, never bound from the node it matches;
#   * a rule's right side that names `reshape<[2, 2]>(dx)` used to be refused outright
#     (`modules/transforms/rule_expand.cpp#findRuleRightSide`, "passes a context argument of its
#     own"); it is copied now, with its angle argument carried like an operand (4fb738332);
#   * the transposed walk used to refuse an operator with more than two operands before it looked at
#     what each position was (`skip=arity uri=tensor:mean_axis operands=3`). That count is gone
#     (2026-11-03): a law names its operator's ports and says which of them answer a cotangent, and
#     `mean_axis_t`'s second and third names are positions no cotangent is asked of because `int` and
#     `bool` have no tangent space.
#
# Three readings, three case files, one `main` each (`rules_angle_args_reshape.cml`,
# `rules_angle_args_softmax.cml`, `rules_angle_args_mean_transpose.cml`). They shared one program
# until this split, and a program stops at its first failure: `reshape` and `softmax` answered
# correctly (`value=30.0 tangent=5.0`, `value=1.5 tangent=-0.25`) while the third line's transposed
# walk ended the run, so the two correct answers could only be reported as part of a red one. A case
# that asserts three things fails once, and that one failure hides which part was right.
#
# Every number below is derived by hand in its case's own header, not read off any run.
#
# The mean reading is now two files, and the pair is the rule (author, 2026-11-03 16:15): the
# parameter's shape is either in the type -- `x: float[2, 3]`, and the pullback is built and answers
# its cotangent -- or it is not -- `x: float[...]`, and the program is refused with the sentence that
# says to write it, which is what `transpose_needs_parameter_shape` pins. The adjoint of a linear map
# needs the shape of its domain; that is the language's rule, not the transform's progress.

[[tests]]
name = "rules_angle_args.reshape"
desc = "`jvp` of `f(x) = sum(reshape<[2, 2]>(x) * [[1, 2], [3, 4]])` at x = [1, 2, 3, 4] along dx = [0.5, 0.5, 0.5, 0.5]: f = 30.0 and f' = 5.0, both by hand. `jvp_reshape`'s right side names `reshape<[2, 2]>(dx)`, which is the context-argument refusal the expansion no longer makes."
kind = "behavior"
case = "../../../cases/modules/autodiff/rules_angle_args_reshape.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["rules_angle_args reshape value=30.0 tangent=5.0"]
timeout_ms = 30000

[[tests]]
name = "rules_angle_args.softmax"
desc = "`jvp` of `f(x) = sum(softmax<1>(x) * [1, 2])` at x = [[1, 1]] along dx = [[1, 0]]: y = [0.5, 0.5], so f = 1.5 and the tangent `y * (dx - y.dx)` dotted with [1, 2] is -0.25, both by hand."
kind = "behavior"
case = "../../../cases/modules/autodiff/rules_angle_args_softmax.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["rules_angle_args softmax value=1.5 tangent=-0.25"]
timeout_ms = 30000

[[tests]]
name = "rules_angle_args.mean_axis_transpose"
desc = "`transpose` of `f(x) = sum(mean_axis(x, 0, false) * [1, 2, 3])` at ct = 1.0, with `x: float[2, 3]`: every position of `xs` that fed lane k gets w[k] / 2, so the answer is read element by element as `[[0.5, 1.0, 1.5], [0.5, 1.0, 1.5]]` -- not as its sum, which is 6.0 and which the wrong law `(ct) => ct` also reaches with `[1.0, 2.0, 3.0]` (author, 2026-11-03 15:15). The parameter's shape is in the type because the transposed function is handed the cotangent and nothing else, and the lane length the law reads comes from there: 6 positions over 3 lanes is 2 (author, 2026-11-03 16:15)."
kind = "behavior"
case = "../../../cases/modules/autodiff/rules_angle_args_mean_transpose.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["rules_angle_args mean transpose=[[0.5, 1.0, 1.5], [0.5, 1.0, 1.5]]"]
timeout_ms = 30000
known_fail = ["nvm", "fvm"]
known_fail_owner = "lane-fwdclosure"
known_fail_reason = "the case is past `tensor:mean_axis` now and stops at the array product: the multiply law (`uri=tensor:multiply`, `rule=mul_tensor_t`, operands of rank (1, 1)) has no instance of its body for `(float[3][...], float[])`, the same wall `test/plans/feat/compile/transpose_array_product.plan.toml` pins for the broadcast product. Entrance: the multiply law, not the walk's parameter check (`modules/transforms/transpose_operator.cpp#explainRejection`)."
known_fail_msg = "the law `mul_tensor_t` has no cotangent for `tensor:multiply` at operands of rank (1, 1), and no instance of its body applies"
known_fail_note = "Measured again 2026-11-04 after the extents widening landed: the `tensor:mean_axis` half is green now (the walk reaches `mean_axis`'s key and its law answers), and what stops the program is the step after it -- `mul_tensor_t` refused because the broadcast product's operand types do not fit (`(float[3][...], float[])`). The law the value path needs exists now -- `rulesets/transpose.cml#sum_from_type_t` names one port more than `tensor:sum` has, and the walk hands it the extents `extent_of`'s rule reads off the operand's type -- so this program no longer stops at `skip=rule uri=tensor:sum reason=unbound`. What stops it is the type of the *intermediate*: measured 2026-11-04 with `std::gir` on this case, `tensor:mean_axis` answers `float[...]` and `tensor:multiply` answers `float[...]` even though `x` is `float[2, 3]`, so the operand `sum` reduces has no extents in its type either, and no law can be handed them. The law is not the gap and neither is the walk: the operator that drops the extents is (`modules/tensor`), and stating a result's shape there is a different lane's decision. The other half is green and pinned by `transpose_needs_parameter_shape` (the same function with `x: float[...]` is refused by name) and by `test/plans/feat/compile/transforms.plan.toml`'s `transpose_of_a_sum_over_a_parameter` (a reduction over a parameter whose type states its extents answers)."

[[tests]]
name = "transpose_needs_parameter_shape"
desc = "The negative of the reading above: the same function declared `x: float[...]`. The type states no shape, the transposed function is handed the cotangent alone, and no value in the program carries the shape the law reads `xs` for -- so `transpose(loss_mean)` is refused with `RuntimeDiag::TransposeNeedsParameterShape`, whose sentence names the parameter and says to write the shape in the type (author, 2026-11-03 16:15). A transposition is the adjoint of a linear map, and the adjoint needs the shape of its domain; the program must not run, and the repair is the declaration."
kind = "behavior"
case = "../../../cases/modules/autodiff/transpose_needs_parameter_shape.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::TransposeNeedsParameterShape"
expect_stdout_contains = ["[Error]: The transpose of 'loss_mean' needs the shape of the parameter 'x', and the type 'float[...]' does not state it.", "Write the extents the parameter's value has in its declaration"]
expect_stderr_contains = ["TRANSPOSE function=loss_mean skip=parameter-shape uri=tensor:sum node=6 param=0 param-type=float[...]"]
expect_stdout_not_contains = ["transpose should have been refused, and it answered"]
timeout_ms = 30000
