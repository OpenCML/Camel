expect_stdout_contains = ["rules_angle_args softmax-after-layout value=1032.0 tangent=84.0"]
expect_stderr_contains = ["REINTERP jvp function=mix"]
expect_output_not_contains = ["skip=rule", "READING_REFUSAL"]
timeout_ms = 30000

[[tests]]
name = "rules_angle_args.mean_axis_transpose"
desc = "`transpose` of `f(x) = sum(mean<0, false>(x) * [1, 2, 3])` at ct = 1.0, with `x: float[2, 3]`: every position of `xs` that fed lane k gets w[k] / 2, so the answer is read element by element as `[[0.5, 1.0, 1.5], [0.5, 1.0, 1.5]]` -- not as its sum, which is 6.0 and which the wrong law `(ct) => ct` also reaches with `[1.0, 2.0, 3.0]` (author, 2026-11-03 15:15). The parameter's shape is in the type because the transposed function is handed the cotangent and nothing else, and the lane length the law reads comes from there: 6 positions over 3 lanes is 2 (author, 2026-11-03 16:15)."
kind = "behavior"
case = "../../../cases/modules/autodiff/rules_angle_args_mean_transpose.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["rules_angle_args mean transpose=[[0.5, 1.0, 1.5], [0.5, 1.0, 1.5]]"]
timeout_ms = 30000

[[tests]]
name = "transpose_needs_parameter_shape"
desc = "The negative of the reading above: the same function declared `x: float[...]`. The type states no shape, the transposed function is handed the cotangent alone, and no value in the program carries the shape the law reads `xs` for -- so `transpose(loss_mean)` is refused with `RuntimeDiag::TransposeNeedsParameterShape`, whose sentence names the parameter and says to write the shape in the type (author, 2026-11-03 16:15). A transposition is the adjoint of a linear map, and the adjoint needs the shape of its domain; the program must not run, and the repair is the declaration."
kind = "behavior"
case = "../../../cases/modules/autodiff/transpose_needs_parameter_shape.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::TransposeNeedsParameterShape"
expect_stdout_contains = ["[Error]: The transpose of 'loss_mean' needs the shape of the parameter 'x', and the type 'float[...]' does not state it.", "Write the extents the parameter's value has in its declaration"]
expect_stdout_not_contains = ["transpose should have been refused, and it answered"]
# The reading names the step it stopped at by position (`node=`), so the position is `<>` and the
# rest of the line stays exact: the function, the skip's own word, the operator URI, the parameter's
# index and the type that states no shape. Nothing else in either stream names that node -- the
# sentence belongs to the *function* (`RuntimeDiag::TransposeNeedsParameterShape`, asserted above)
# and prints no node at all -- so this line can only be pinned by position, and `<>` says so
# honestly: what identifies the step here is what it is (`uri=tensor:sum`) and what it owes
# (`param=0`, a `float[...]`), not where it sits.
verify_script = """
({ input, assert }) => {
const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/<>/g, '\\d+')
const reading = 'TRANSPOSE function=loss_mean skip=parameter-shape uri=tensor:sum node=<> param=0 param-type=float[...]'
const hits = input.normalized.stderr.split('\n').filter((l) => new RegExp('^' + esc(reading) + '$').test(l))
assert(hits.length === 1, `expected exactly one line like '${reading}', found ${hits.length}`)
}
"""
timeout_ms = 30000
