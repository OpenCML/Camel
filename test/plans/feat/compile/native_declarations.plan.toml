kind = "negative"
case = "../../../cases/compile/native/random_arity.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "random_arity.cml:10:20", "(int)", "<rand:randint>: (low: int, high: int) => int"]

[[tests]]
name = "native.random_wrong_type"
desc = "An `int` where the declaration says `Key`: refused at the declaration's type, and the signature in the message has the declaration's own parameter names (`key`, `n`; the type printer shows the exported `Key` as its struct) — `stdlib/random.cml`, not the C++, is the source."
