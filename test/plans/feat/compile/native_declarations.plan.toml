args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "time_type.cml:11:21", "argument types: <> (int, string)", "<time:strptime>: (text: string, format: string) => float"]

# ---- Retired names are unknown names, not aliases (handover H122; design principles 1) ----
#
# `str::bytes` and `str::from_bytes` were deleted, not renamed: `bytes::encode`/`bytes::decode` are
# the one conversion. An old form is deleted outright, with no alias and no diagnostic pointing at
# the new form, so a program that still imports the old name is diagnosed where it uses it: the
# import layer knows which module the name was asked of and that the module does not export it.

[[tests]]
name = "native.retired_str_bytes"
desc = "`str::bytes` is retired: the name is not exported by `str`, and the use is a located ImportNameNotExported — an ordinary name the module does not export, not an alias of `bytes::encode` and not a diagnostic pointing at it."
kind = "negative"
case = "../../../cases/compile/native/retired_str_bytes.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ImportNameNotExported"
expect_diagnostic_code = "0x03000015"
expect_diagnostic_line = 10
expect_output_contains = ["retired_str_bytes.cml:10:13", "Reference 'bytes'", "not exported by its module"]

[[tests]]
name = "native.retired_str_from_bytes"
desc = "`str::from_bytes` is retired the same way: `bytes::decode` is where UTF-8 bytes become a string, and the old name is an ordinary unexported name diagnosed at its use."
kind = "negative"
case = "../../../cases/compile/native/retired_str_from_bytes.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ImportNameNotExported"
expect_diagnostic_code = "0x03000015"
expect_diagnostic_line = 10
expect_output_contains = ["retired_str_from_bytes.cml:10:13", "Reference 'from_bytes'", "not exported by its module"]

# ---- The declarations of `fs`: effects and error values (handover H131) ----
#
# `fs` is the first module of this batch whose operators all have effects. The declarations carry
# the signatures only; the purity, the resources and the effects stay in `modules/fs` and are
# checked by the module's own plans (`fs.basic`, `fs.remove`, `resources`). What these cases prove
# is that an importer reads the declared argument order and result types (including `void!` and
# `string!`) and that a call checks against the declaration, not against a C++ resolver.

[[tests]]
name = "native.fs_declaration_import"
desc = "`fs`'s declarations are the module's signature: an importer writes text and bytes (`write_text`/`write_bytes`/`replace`), reads `string!` from `try_read_text`, `Bytes` from `read_chunk`/`read_bytes`, `bool` and `int` from the queries, and the `void!` kind of `remove`/`remove_dir`; every call reaches the C++ operator."
kind = "behavior"
case = "../../../cases/compile/native/fs_declaration_import.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "true\nfalse\ntrue\ntrue\n26\nhello from the declaration\nhello\nhello from the declaration\nok\nNotFound\nok\nok\nfalse\n"

[[tests]]
name = "native.fs_wrong_arity"
desc = "`fs:exists` is declared with one ordinary argument: a second one is refused at the call, and the overload the message lists is the declaration's, parameter name included."
kind = "negative"
case = "../../../cases/compile/native/fs_arity.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "fs_arity.cml:10:19", "(string, string)", "<fs:exists>: (path: string) => bool"]

[[tests]]
name = "native.fs_wrong_type"
desc = "An `int` where the declaration says `string`: refused at the call, and the signature in the message has the parameter name the declaration gave it — `stdlib/fs.cml`, not the C++, is the source."
kind = "negative"
case = "../../../cases/compile/native/fs_type.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "fs_type.cml:11:19", "argument types: <> (int)", "<fs:exists>: (path: string) => bool"]

