case = "../../../cases/compile/native/math_sqrt_arity.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "math_sqrt_arity.cml:10:17", "argument types: <> (float, int)", "<math:sqrt>: (x: i32) => f32"]

[[tests]]
name = "native.math_sqrt_wrong_type"
desc = "A string where the declarations of `math:sqrt` take a number: refused at the declarations' type, and the signature in the message has their own parameter name (`x`) — `stdlib/math.cml`, not the C++, is the source."
kind = "negative"
case = "../../../cases/compile/native/math_sqrt_type.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "math_sqrt_type.cml:11:17", "argument types: <> (string)", "<math:sqrt>: (x: i32) => f32"]

