# ---- A declaration the module does not export is private (handover H94, ruling 3) ----

[[tests]]
name = "native.private_declaration"
desc = "A body-less declaration without `export` is a private operator of the module: the module's own wrapper calls it and the program runs; an importer cannot see the name."
kind = "behavior"
case = "../../../cases/compile/native/private.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "5\n"

[[tests]]
name = "native.private_declaration_not_imported"
desc = "The private operator is no entity of the module: importing it by name is a diagnostic at the importer, not a way into a rule only the module's own code may mean."
kind = "negative"
case = "../../../cases/compile/native/private_import.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ImportNameNotExported"
expect_diagnostic_code = "0x03000015"
expect_output_contains = ["private_import.cml:8", "Reference 'at'"]

# ---- The entry module's declarations answer under its declared name (handover H94, ruling 4) ----

[[tests]]
name = "native.entry_uri_prefix"
desc = "A declaration in the entry module uses the `module` declaration's name as its URI prefix (`bytes:size`), not the runtime name `main`: the declaration is loaded, the call reaches the operator."
kind = "behavior"
case = "../../../cases/compile/native/entry_uri.cml"
args = ["${case}"]
expect_exit = 0
