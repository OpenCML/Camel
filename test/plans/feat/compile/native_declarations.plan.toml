[[tests]]
name = "native.env_declaration_import"
desc = "`env`'s declarations are what an importer sees: `get_env` takes the declared `string` name and `get_cwd` takes nothing, both answer the declared `string`, and an unset variable is the declared empty string. Both calls reach the C++ kernels and stay effectful: they run in a `sync` block."
kind = "behavior"
case = "../../../cases/compile/native/env_declaration_import.cml"
envs = ["H163_ENV_VALUE=declared"]
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "declared\n\ntrue\n"

[[tests]]
name = "native.env_wrong_arity"
desc = "`env:get_env` is declared with one ordinary argument: a second one is refused at the call, and the overload the message lists is the declaration's `(name: string) => string` — `stdlib/env.cml`, not the C++ module."
kind = "negative"
case = "../../../cases/compile/native/env_arity.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "env_arity.cml:9:20", "argument types: <> (string, string)", "<env:get_env>: (name: string) => string"]

[[tests]]
name = "native.env_wrong_type"
desc = "The parameter of `env:get_env` is the declaration's `string`: an `int` there is refused at the call, and the signature in the message has the parameter name the declaration gave it (`name`) — `stdlib/env.cml`, not the C++ module."
kind = "negative"
case = "../../../cases/compile/native/env_type.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "env_type.cml:10:20", "argument types: <> (int)", "<env:get_env>: (name: string) => string"]

[[tests]]
name = "native.process_declaration_import"
desc = "`process`'s declarations are what an importer sees: `sleep` takes the declared `float` (seconds) and answers nothing, `user_name` and `cpu_count` take nothing and answer the declared `string!` and `int`. Every call reaches the C++ kernels, and all three stay effectful (they run in a `sync` block)."
kind = "behavior"
case = "../../../cases/compile/native/process_declaration_import.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "true\ntrue\n"

[[tests]]
name = "native.process_wrong_arity"
desc = "`process:sleep` is declared with one ordinary argument: none is refused at the call. The message lists the declaration's `(seconds: float) => void` from `stdlib/process.cml`."
kind = "negative"
case = "../../../cases/compile/native/process_arity.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "process_arity.cml:9:5", "argument types: <> ()", "<process:sleep>: (seconds: float) => void"]

[[tests]]
name = "native.process_wrong_type"
desc = "The parameter of `process:sleep` is the declaration's `float`: a `string` there is refused at the call. The message lists the declaration's `(seconds: float) => void`, whose parameter name comes from `stdlib/process.cml`."
kind = "negative"
case = "../../../cases/compile/native/process_type.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "process_type.cml:10:5", "argument types: <> (string)", "<process:sleep>: (seconds: float) => void"]

[[tests]]
name = "native.hash_declaration_import"
desc = "`hash`'s declarations are what an importer sees: `sha256` accepts a `string` and a `Bytes` value (two functions written in Camel over the one kernel `hash:sha256_bytes`), and every call reaches the C++ kernel and prints the declared `string`."
kind = "behavior"
case = "../../../cases/compile/native/hash_declaration_import.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "true\ntrue\ntrue\ntrue\n"

[[tests]]
name = "native.hash_wrong_arity"
desc = "Both `sha256` functions take one ordinary argument: a second one is refused at the call, and the overloads the message lists are the two functions of `stdlib/hash.cml`, with the parameter names it gave."
kind = "negative"
case = "../../../cases/compile/native/hash_arity.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "hash_arity.cml:9:19", "argument types: <> (string, string)", "hash::sha256: (data: Bytes) => string", "hash::sha256: (text: string) => string"]

[[tests]]
name = "native.hash_wrong_type"
desc = "Neither `sha256` accepts an `int`: the call is refused against both, and the signatures in the message carry the parameter names `stdlib/hash.cml` gave (`data`, `text`)."
kind = "negative"
case = "../../../cases/compile/native/hash_type.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "hash_type.cml:10:19", "argument types: <> (int)", "hash::sha256: (data: Bytes) => string", "hash::sha256: (text: string) => string"]

#  ---- The declarations of `graph`: `constant` per sample type ----
#
# `constant` and `add_constant` take the type of their sample, which a declaration cannot compute
# from an argument; they are written out per sample type instead (six each). The four operators of
# a function value stay computed in C++ (`stdlib/signatures/graph.cml`).

[[tests]]
name = "native.graph_constant_import"
desc = "`graph:constant` is declared per sample type: an importer reads the first node of its root graph with an `i32`, an `int`, an `f32`, a `float`, a `bool` and a `string` sample, and every call is the C++ operator of that URI."
kind = "behavior"
case = "../../../cases/compile/native/graph_constant_import.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "true\ntrue\ntrue\ntrue\ntrue\ntrue\n"

[[tests]]
name = "native.graph_constant_wrong_arity"
desc = "`graph:constant` is declared with two ordinary arguments per sample type: a third one is refused at the call, and the overloads the message lists are the declarations', parameter names included."
kind = "negative"
case = "../../../cases/compile/native/graph_constant_arity.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "graph_constant_arity.cml:10:21", "argument types: <> (Node, int, int)", "<graph:constant>: (n: Node, sample: i32) => i32?"]

[[tests]]
name = "native.graph_constant_wrong_type"
desc = "A number where the declarations of `graph:constant` take a node: refused at the declarations' type, and the signature in the message has their own parameter name (`n`) — `stdlib/graph.cml`, not the C++, is the source."
kind = "negative"
case = "../../../cases/compile/native/graph_constant_type.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "graph_constant_type.cml:10:21", "argument types: <> (int, int)", "<graph:constant>: (n: Node, sample: i32) => i32?"]

# ---- The declarations of `graph` itself: the handles, their operators and `type_of` ----
#
# `graph_constant_*` above pins the per-sample-type declarations; these three pin what an importer
# of `graph` reads for the rest of the module: the entry, the program handle and its comparison
# declarations, the graph and node handles, `id`, and `type_of` with the type name of a node.
# The two negative cases are the arity and the type of `graph:root`'s one ordinary argument, so
# they also say that the message's overload is the declaration's own parameter name (`p`) rather
# than the C++ operator's.

[[tests]]
name = "native.graph_declaration_import"
desc = "The declarations of `graph` are what an importer sees: `Program`, `Graph` and `Node` come from the module's declaration file, the two comparisons are the operators of the handle types, and each call reaches the operator the C++ module runs. It locks the answers: an entry equals itself and differs from the other one, a graph's name is `__root__`, a graph has nodes, `id` is stable on a node, and `type_of` of a node of no type answers null so the type name printed is the function's signature `() => int uses stdout`."
kind = "behavior"
case = "../../../cases/compile/native/graph_declaration_import.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "true\nfalse\n__root__\ntrue\ntrue\n() => int uses stdout\n"

[[tests]]
name = "native.graph_wrong_arity"
desc = "The declaration of `graph:root` takes one ordinary argument: a call with none is refused at the call, and the overload the message lists is the declaration's, parameter name included (`<graph:root>: (p: Program) => Graph`)."
kind = "negative"
case = "../../../cases/compile/native/graph_arity.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "graph_arity.cml:9:17", "argument types: <> ()", "<graph:root>: (p: Program) => Graph"]

[[tests]]
name = "native.graph_wrong_type"
desc = "An integer where the declaration of `graph:root` says `Program`: the call is refused at the declaration's type, and the signature in the message carries the declaration's own parameter name (`p`) — the source is the declaration file, not the C++ module."
kind = "negative"
case = "../../../cases/compile/native/graph_type.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "graph_type.cml:10:17", "argument types: <> (int)", "<graph:root>: (p: Program) => Graph"]

# ---- The declaration itself is checked: its URI and its result type ----

[[tests]]
name = "native.operator_uri_invalid"
desc = "A `#op` argument without a protocol (`stdadd`) is not an operator URI: refused at the declaration, before any call, with the expected `protocol:path` form."
kind = "negative"
case = "../../../cases/compile/native/operator_uri_invalid.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::InvalidOperatorURI"
expect_diagnostic_code = "0x03000019"
expect_diagnostic_line = 3
expect_diagnostic_column = 1
expect_output_contains = ["Invalid operator URI format: 'stdadd'. Expected 'protocol:path'."]

[[tests]]
name = "native.incomplete_declaration"
desc = "A body-less declaration is the whole signature of a C++ operator, result included: without `: T` it is refused at the declaration, naming the function."
kind = "negative"
case = "../../../cases/compile/native/incomplete.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::NativeDeclarationIncomplete"
expect_diagnostic_code = "0x0300017B"
expect_diagnostic_line = 3
expect_diagnostic_column = 1
expect_output_contains = ["The body-less declaration 'foo' is incomplete: it has no result type."]

[[tests]]
name = "native.builtin_field_not_found"
desc = "A struct indexed by a field it does not have: the built-in '[]' reports the field at the call. The route is a declaration of the built-in `:op/idx_str` with the struct signature the type rules refuse for `s['y']`; the declaration is the signature, so the call reaches the operator and the runtime names the missing field. This pins the runtime half of the built-in index operator, not a syntax a program can write directly."
kind = "negative"
case = "../../../cases/compile/native/idx_field_missing.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::FieldNotFound"
expect_diagnostic_code = "0x04000033"
expect_diagnostic_line = 14
expect_diagnostic_column = 12
expect_output_contains = ["The struct has no field 'y'. A struct is indexed by the name of one of its fields."]
