expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "io_arity.cml:10:22", "(int, int)", "<io:get_chars>: (max: int) => string"]

[[tests]]
name = "native.io_wrong_type"
desc = "A `string` where the declaration says `int`: refused at the call, and the signature in the message has the parameter name the declaration gave it — `stdlib/io.cml`, not the C++, is the source."
kind = "negative"
case = "../../../cases/compile/native/io_type.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "io_type.cml:11:22", "argument types: <> (string)", "<io:get_chars>: (max: int) => string"]

# ---- The declarations of `json`: the accessors as one rule per tagged form (handover H115) ----

[[tests]]
name = "native.json_declaration_import"
desc = "`json`'s declarations are the module's signature: an importer reads `decode`'s `Json!`, calls `get<key>` and `get<index>` with their with-parameters and chains the nullable and two-layer `Json?`/`Json!?` results of the accessors, and every call reaches the C++ operator."
kind = "behavior"
case = "../../../cases/compile/native/json_declaration_import.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "object\n2\nhi\n2\n"

[[tests]]
name = "native.json_wrong_arity"
desc = "`json:decode` is declared with one ordinary argument: a second one is refused at the call, and the overload the message lists is the declaration's, parameter name included."
kind = "negative"
case = "../../../cases/compile/native/json_arity.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "json_arity.cml:10:19", "argument types: <> (string, int)", "<json:decode>: (text: string) => Json!"]

[[tests]]
name = "native.json_wrong_type"
desc = "An `int` where the declaration says `Json`: refused at the call, and the signature in the message has the parameter name the declaration gave it — `stdlib/json.cml`, not the C++, is the source."
kind = "negative"
case = "../../../cases/compile/native/json_type.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "json_type.cml:11:17", "argument types: <> (int)", "<json:kind>: (j: Json) => string"]
# ---- The declarations of `math`: per-type overloads and computed signatures (handover H113) ----

[[tests]]
name = "native.math_declaration_import"
desc = "`math`'s declarations are the module's signature: the per-type overloads (`abs`, `min`, `clamp`) and the computed-signature operator that stayed in C++ (`sqrt`) are read from `stdlib/math.cml`, every call reaches the C++ operator, and the C++ module's constant `pi` is visible through the same declaration module."
kind = "behavior"
case = "../../../cases/compile/native/math_declaration_import.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "3\n2.5\n3\n10\n3.0\n16\n3.141592653589793\n"

[[tests]]
name = "native.math_wrong_arity"
desc = "`math:abs` is declared with one ordinary argument: a second one is refused at the call, and the overloads the message lists are the declarations', parameter name included."
kind = "negative"
case = "../../../cases/compile/native/math_arity.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "math_arity.cml:10:16", "(int, int)", "<math:abs_l>: (x: int) => int"]

[[tests]]
name = "native.math_wrong_type"
desc = "A string where the declarations of `math:abs` take a number: refused at the declarations' type, and the signature in the message has their own parameter name (`x`) — `stdlib/math.cml`, not the C++, is the source."
kind = "negative"
case = "../../../cases/compile/native/math_type.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "math_type.cml:11:16", "argument types: <> (string)", "<math:abs_l>: (x: int) => int"]

[[tests]]
name = "native.math_on_the_graph"
desc = "A call of a per-type declaration of `math` is an OPER of the concrete URI (`math:abs_l`, `math:min_l`), not a CALL of the name and not a graph of the declaration; the computed-signature `sqrt` and `shl` are OPERs of their C++ groups too. This is the H19 trap-2 answer: the declarations are per-type overloads, not a generic family, so nothing is instantiated into a CALL."
kind = "behavior"
case = "../../../cases/compile/native/math_declaration_import.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
  const lines = input.normalized.stdout.split('\n')
  for (const uri of ['math:abs_l', 'math:abs_f', 'math:min_l', 'math:clamp_l', 'math:sqrt', 'math:shl']) {
    assert(lines.some((l) => l.includes(`label="${uri}"`) && l.includes('type="OPER"')), `expected an OPER of ${uri}`)
  }
  const calls = lines.filter((l) => l.includes('type="CALL"') && /label="(abs|min|clamp|sqrt|shl)"/.test(l))
  assert(calls.length === 0, `math calls became CALLs: ${calls.join('; ')}`)
}
"""

# ---- A declaration the module does not export is private (handover H94, ruling 3) ----

[[tests]]
name = "native.private_declaration"
desc = "A body-less declaration without `export` is a private operator of the module: the module's own wrapper calls it and the program runs; an importer cannot see the name."
kind = "behavior"
case = "../../../cases/compile/native/private.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "5\n"

[[tests]]
name = "native.private_declaration_not_imported"
desc = "The private operator is no entity of the module: importing it by name is a diagnostic at the importer, not a way into a rule only the module's own code may mean."
kind = "negative"
case = "../../../cases/compile/native/private_import.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ImportNameNotExported"
expect_diagnostic_code = "0x03000015"
expect_output_contains = ["private_import.cml:8", "Reference 'at'"]

# ---- The entry module's declarations answer under its declared name (handover H94, ruling 4) ----

[[tests]]
name = "native.entry_uri_prefix"
desc = "A declaration in the entry module uses the `module` declaration's name as its URI prefix (`bytes:size`), not the runtime name `main`: the declaration is loaded, the call reaches the operator."
kind = "behavior"
case = "../../../cases/compile/native/entry_uri.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "3\n"

# ---- A declaration may name only its own module's operator (handover H94, ruling 5) ----

[[tests]]
name = "native.foreign_operator_refused"
desc = "`#op<'bytes:size'>` in a module other than `bytes` names another module's operator: refused at the declaration, in the file that wrote it, before any call."
kind = "negative"
case = "../../../cases/compile/native/foreign_operator.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::NativeDeclarationForeignOperator"
expect_diagnostic_code = "0x03000181"
expect_output_contains = ["bytes_tag.cml:11", "'size'", "bytes:size"]

[[tests]]
name = "native.declaration_qualified"
desc = "A declaration is the module's own entity still: `generic_module::at` reaches the group the declaration made, as a C++ module's operator is reached."
kind = "behavior"
case = "../../../cases/compile/native/generic_qualified.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "9\n"

# ---- A `.cml` beside a `.cmo` is that module's declarations, and has no bodies ----

[[tests]]
name = "native.declaration_module_has_no_body"
desc = "A `bytes.cml` written beside a `bytes.cmo` declares that module's operators; a body in it is a diagnostic located at the function, not a function silently dropped."
kind = "behavior"
tool = "node"
case = "../../../cases/compile/native/declaration_module_body.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["PASS"]
timeout_ms = 120000

# ---- The `.cml` and the `.cmo` are one module (handover H94, ruling 1) ----

[[tests]]
name = "native.one_module"
desc = "The declaration module of a C++ module is that module, not a second one: the C++ module's types (`Json`) and constants (`pi`) are written in the `.cml` without an import, a type the `.cml` exports is read by an importer beside the C++ ones, and every C++ name still answers through the one module."
kind = "behavior"
tool = "node"
case = "../../../cases/compile/native/one_module.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["PASS"]
timeout_ms = 120000

# ---- Two generic declarations of a name: one call, one rule (handover H94, ruling 2) ----

[[tests]]
name = "native.generic_declaration_overlap"
desc = "Two generic declarations of one name that a single call could enter are a diagnostic at the second declaration, with the catalog code and both rules in the message: a call never means the declaration written first."
kind = "negative"
case = "../../../cases/compile/native/overlap.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::NativeDeclarationOverlap"
expect_diagnostic_code = "0x03000180"
expect_output_contains = ["overlap.cml:14", "Two declarations of 'pick'", "typeas T", "typeas U"]


# ---- A declaration cannot be parametric ----

# `from_bytes::<T>` and a per-leaf `ckpt_get::<L>` ask for one name whose result type the call
# names; the declaration mechanism has no such form (handover H103). The two cases below state
# what is missing, not how the module happens to be written today.

[[tests]]
name = "native.declaration_type_argument"
desc = "A declaration whose result type is a return-only type variable — the shape `from_bytes::<T>` and a per-leaf `load_tree` decoder need — is read (the message prints `typeas L`) but no call can bind the variable: the explicit type argument and the expected type never reach a declaration's resolver."
kind = "negative"
case = "../../../cases/compile/native/declaration_type_argument.cml"
args = ["${case}"]
expect_exit = 1
# The message spans two lines (it lists the declaration as the available overload), so the
# short format the runner parses as one diagnostic line does not apply; check the text.
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "declaration_type_argument.cml:17:45", "<tensor:from_bytes_f32>: (encoded: Bytes, shape: int[]) => typeas L"]

[[tests]]
name = "native.declaration_per_result_type"
desc = "Two rules of one name that differ only in the result type — the per-dtype rules `tensor:from_bytes` registers in C++ — are a redeclaration at the second: one name has one signature, and a declaration names one operator URI."
kind = "negative"
case = "../../../cases/compile/native/declaration_per_result_type.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::Redeclaration"
expect_diagnostic_code = "0x03000001"
expect_diagnostic_line = 14
expect_diagnostic_column = 1

# ---- Names in a `case` that is not selected ----

[[tests]]
name = "native.unselected_case_sees_declaration"
desc = "A `case` that is not selected for an instantiation resolves its names with the lookup the selected case uses: the body-less declaration of the same module is found, not reported as an unresolved reference."
kind = "behavior"
case = "../../../cases/compile/native/unselected_case_declaration.cml"
args = ["${case}", "std::fvm"]
expect_exit = 0
expect_stdout_exact = "0\n"