case = "../../../cases/compile/native/random_declaration_import.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "true\ntrue\n3\nsolo\n2\n[7]\nkey={ hi: 1350887118657991639, lo: -7139630017956984517 } a={ hi: -343134353990486859, lo: -1032652826686562345 } b={ hi: 7902514079619341531, lo: -7704411369378599526 }\n[1, 0, 2, 3]\n"

[[tests]]
name = "native.random_wrong_arity"
