# ---- The declarations of `tensor` (handover H151) ----
#
# `tensor` is the largest module of the batch: 64 public operators, of which only ten have a
# signature a declaration can state (an extent, an element count, the binary form, a NumPy file,
# the worker pool and the generator seed). The other 54 take their element type or their shape
# from an argument (`new`, `add`, `where`, `reshape`, `sum`'s axis form, `from_bytes`'s type
# argument, ...), or accept a tensor-or-number operand, or an optional parameter, none of which
# a body-less `export func` can write; they stay in C++ and are recorded in
# `stdlib/signatures/tensor.cml` as computed signatures. The cases below prove the declared
# half: an importer reads it, a call checks against it, and a type-qualified alias
# (`Tensor::numel`) is the same declaration, not a second signature.

[[tests]]
name = "native.tensor_declaration_import"
desc = "`tensor`'s declarations are the module's signature for the ten fixed operators: `shape`, `numel`, `dim` (both integer forms), the NumPy file pair and the module state reach the C++ operators, `from_bytes` still takes its element type as a type argument, and `reshape` (computed) is imported beside them."
kind = "behavior"
case = "../../../cases/compile/native/tensor_declaration_import.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "22\n4\n2\n2\n4\n1\n2\n4\n"

[[tests]]
name = "native.tensor_wrong_arity"
desc = "`tensor:numel` is declared with one ordinary argument: a second one is refused at the call, and the overload the message lists is the declaration's — `stdlib/tensor.cml`, not the C++ module."
kind = "negative"
case = "../../../cases/compile/native/tensor_arity.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "tensor_arity.cml:12:18", "argument types: <> (Tensor<float32, [?, ?]>, int)", "<tensor:numel>: (t: Tensor) => int"]

[[tests]]
name = "native.tensor_wrong_type"
desc = "A `string` where the declaration of `to_bytes` says `Tensor`: refused at the call against the declared parameter name, and the computed operators of the same module are untouched."
kind = "negative"
case = "../../../cases/compile/native/tensor_type.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "tensor_type.cml:11:21", "argument types: <> (string)", "<tensor:to_bytes>: (t: Tensor) => Bytes"]

# ---- The declaration of `nn` (handover H165) ----
#
# `nn` exports nineteen names. `save_params` is the one with a fixed signature — any value and a
# directory, returning nothing — so it is declared in `stdlib/nn.cml`; the fifteen tensor
# operators and the three optimizers take their result type from their arguments (a tensor's
# dtype and shape, the shape of each tensor of a result tuple, the parameter tree's own type, or
# `OptimizerState`), and stay in C++ with their reference entries in `stdlib/signatures/nn.cml`.
#
# The module needs no PyTorch, a GPU or a Python interpreter to load, so all three cases run.

[[tests]]
name = "native.nn_declaration_import"
desc = "`nn`'s declaration is what an importer sees: `save_params` takes a type-variable value and a `string` directory and returns `void`; the call reaches the C++ operator, which writes the value's tensor leaves as `.npy` files, and a non-tree value is accepted and ignored."
kind = "behavior"
case = "../../../cases/compile/native/nn_declaration_import.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "true\ntrue\n"

[[tests]]
name = "native.nn_wrong_arity"
desc = "`nn:save_params` is declared with two ordinary arguments: one is refused at the call, and the overload the message lists is the declaration's `(params: typeas P, dir: string) => void` — `stdlib/nn.cml`, not the C++ module."
kind = "negative"
case = "../../../cases/compile/native/nn_arity.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "nn_arity.cml:11:5", "argument types: <> (string)", "<nn:save_params>: (params: typeas P, dir: string) => void"]

[[tests]]
name = "native.nn_wrong_type"
desc = "The second parameter of `nn:save_params` is the declaration's `string`: an `int` there is refused at the call, and the listed overload is the declaration's; the first parameter's type variable accepts the `string` argument."
kind = "negative"
case = "../../../cases/compile/native/nn_type.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "nn_type.cml:11:5", "argument types: <> (string, int)", "<nn:save_params>: (params: typeas P, dir: string) => void"]