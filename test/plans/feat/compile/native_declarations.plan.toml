expect_output_contains = ["SemanticDiag::NoMatchingFunction", "code=0x0300000F", "time_arity.cml:10:21", "(float)", "<time:strftime>: (timestamp: float, format: string) => string"]

[[tests]]
name = "native.time_wrong_type"
desc = "An `int` where the declaration says `string`: refused at the declaration's type, and the signature in the message has the declaration's own parameter names (`text`, `format`) — `stdlib/time.cml`, not the C++, is the source."
