id = "compile.diag_catalog"
order = 317
tier = "fast"
tags = ["feat", "compile", "diagnostics"]

[[tests]]
name = "catalog.check"
desc = "diagnostics/registry.tsv is valid and the generated headers and message tables are what it produces: no value twice in a section, no name twice, every number inside its section's range, and every declaration says whether it carries a machine-applicable edit or why it carries none. A collision, or a new diagnostic that says neither, fails here before it can be published."
kind = "behavior"
tool = "node"
case = "../../../../scripts/diagnostics-catalog.mjs"
args = ["${case}", "--check"]
expect_exit = 0
expect_stdout_contains = ["every one with a name, a message and what it says about an edit", "no value used twice, and the emitted headers agree"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000

[[tests]]
name = "catalog.failure_paths"
desc = "The registry's failure paths on a scratch copy: a duplicate number, a number outside its section's range, a duplicate name, a generated header that disagrees with the registry, an empty registry, a declaration that does not say whether it carries a machine-applicable edit (or says it in a way the vocabulary does not know, or promises an edit without the help that says what it does), and a message or help whose braces are not the substitution's fields (a literal brace, a field with a format specifier, or one pattern mixing `{}` with `{1}`, while an escaped `{{` is accepted) all exit 1; one appended line takes the next free number and changes only the registry and that section's generated files."
kind = "behavior"
tool = "node"
case = "../../../../test/cases/diagnostics/registry_proof.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["diagnostics registry proof:", "checks passed"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000

[[tests]]
name = "catalog.doc_is_generated"
desc = "docs/diagnostics.md is what scripts/diagnostics-catalog.mjs --write produces from the registry and the tests: it is generated, not edited."
kind = "behavior"
tool = "node"
case = "../../../../scripts/diagnostics-catalog.mjs"
args = ["${case}", "--verify-doc"]
expect_exit = 0
expect_stdout_contains = ["docs/diagnostics.md is up to date"]
normalizers = ["normalize_newlines"]
# 120 s: --verify-doc regenerates the document and compares it, reading every plan and case to
# collect the mentions. Measured 6.9-8.8 s alone on the shared host at load 70-90, 11.4 s with
# three copies at once, and 16.6 s inside the parallel gate at -Jobs 8; the old 20 s was the
# loaded wall time, not a bound. (--coverage and --coverage-check read the same script and run
# in 0.15 s.)
timeout_ms = 120000

[[tests]]
name = "catalog.coverage_report"
desc = "Lists the diagnostic codes that no plan, golden file or scripted case mentions. A report: it never fails."
kind = "behavior"
tool = "node"
case = "../../../../scripts/diagnostics-catalog.mjs"
args = ["${case}", "--coverage"]
expect_exit = 0
expect_stdout_contains = ["diagnostic codes mentioned by no test:"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000

[[tests]]
name = "catalog.coverage_zero"
desc = "Every diagnostic code the registry declares is mentioned by a test, and every code a test cites is one the registry declares: a bijection, asserted in both directions."
kind = "behavior"
tool = "node"
case = "../../../../scripts/diagnostics-catalog.mjs"
args = ["${case}", "--coverage-check"]
expect_exit = 0
expect_stdout_contains = ["every diagnostic code the registry declares is mentioned by a test, and every code a test cites is one the registry declares"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000

[[tests]]
name = "catalog.pinned_coverage"
desc = "The gate that replaced the name counter (P2-19): the set is every entry in `diagnostics/registry.tsv`, enumerated the way `--check` and the generated document enumerate it, and a code counts only when a case asserts *it* -- `expect_diagnostic_name`, `expect_diagnostic_code`, or the same two read out of a `verify_script`. Free text is not read, because free text was what could be pressed: a needle containing a name does not require the run to produce it. A code no program can provoke is a named exception in the script, printed with its reason; the recorded floor is the count this tree stands at, and it may be lowered in the commit that adds a case, never raised."
kind = "behavior"
tool = "node"
case = "../../../../scripts/diagnostics-catalog.mjs"
args = ["${case}", "--pinned-coverage-check"]
expect_exit = 0
expect_stdout_contains = ["diagnostic codes a case asserts by code:"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000

[[tests]]
name = "catalog.pinned_coverage_report"
desc = "The same count as a report, with the codes that have no assertion listed so the next case can be picked without re-deriving the set."
kind = "behavior"
tool = "node"
case = "../../../../scripts/diagnostics-catalog.mjs"
args = ["${case}", "--pinned-coverage"]
expect_exit = 0
expect_stdout_contains = ["diagnostic codes a case asserts by code:", "named exception(s)"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000

[[tests]]
name = "catalog.name_coverage"
desc = "A measurement, not a target (P2-19, retired as a gate): the semantic codes no case asserts by name, counted the way this counter has always counted them -- free text included. It stays because the number is worth watching and because the two denominators are not the same thing (`5 of 239` of the semantic section, with prose read, against `279 of 307` of the registry, by code); it no longer decides whether a commit passes. The gate is `catalog.pinned_coverage`."
kind = "behavior"
tool = "node"
case = "../../../../scripts/diagnostics-catalog.mjs"
args = ["${case}", "--name-coverage"]
expect_exit = 0
expect_stdout_contains = ["semantic codes with no case that asserts them by name:"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000
