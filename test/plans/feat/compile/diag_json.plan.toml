assert(d.data.stage === 'pass:std::no_such_pass', 'stage ' + d.data.stage)
assert(d.message.includes("'std::no_such_pass'"), d.message)
assert(input.stderr.includes('available passes are'), 'the pass listing goes to stderr')
"""
