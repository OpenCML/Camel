[[tests]]
name = "warning_with_error_json"
desc = "When the module has an error, its warnings stay where they were: in the diagnostics array on stdout, with the error; stderr does not repeat them. A warning placed by the GCT builder now has its source position there too."
kind = "behavior"
case = "../../../cases/compile/diag_json/warning_with_error.cml"
args = ["--output-format", "json", "${case}"]
expect_exit = 1
verify_script = """
const diags = JSON.parse(input.stdout)
const got = diags.map(d => d.severity + ' ' + d.data.name + '@' + (d.range.start.line + 1) + ':' + (d.range.start.character + 1))
const want = ['Warn SemanticDiag::VarParamInAsyncFunction@8:10', 'Error SemanticDiag::UnresolvedReference@14:12']
assert(JSON.stringify(got) === JSON.stringify(want), 'diagnostics on stdout: ' + got.join(' | '))
assert(input.stderr === '', 'nothing on stderr: ' + JSON.stringify(input.stderr))
"""
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 6000

[[tests]]
name = "captured_write_without_sync"
desc = "A function or lambda that writes a captured variable, itself or through a function it calls directly, and is not declared with the `sync` modifier gets the warning CapturedWriteInAsyncFunction at its definition; declared ones and readers do not. The modifier is a declaration only: the program runs as before."
kind = "behavior"
case = "../../../cases/compile/diag_json/captured_write_without_sync.cml"
args = ["--output-format", "json", "${case}"]
expect_exit = 0
verify_script = """
assert(input.normalized.stdout === '3 1\n', 'program output: ' + JSON.stringify(input.normalized.stdout))
const diags = JSON.parse(input.stderr)
assert(diags.every(d => d.severity === 'Warn' && d.data.name === 'SemanticDiag::CapturedWriteInAsyncFunction'),
    'only CapturedWriteInAsyncFunction warnings: ' + diags.map(d => d.data.name).join(' '))
const got = diags.map(d => (d.range.start.line + 1) + ' ' + d.message).sort()
const want = [
    "18 Function 'bump' writes the captured variable 'total' but is not declared with the 'sync' modifier.",
    "32 Function 'via' writes the captured variable 'total' but is not declared with the 'sync' modifier.",
    "42 Function 'main' writes the captured variable 'total' but is not declared with the 'sync' modifier.",
    "44 The lambda writes the captured variable 'seen' but is not declared with the 'sync' modifier.",
]
assert(JSON.stringify(got) === JSON.stringify(want), 'warnings: ' + got.join(' | '))
"""
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 6000
