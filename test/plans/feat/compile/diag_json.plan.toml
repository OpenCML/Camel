[[tests]]
name = "unknown_pass_stage"
desc = "An unknown pass name is reported with stage pass:<name>; it has no source range because it is a command-line error."
kind = "behavior"
case = "../../../cases/compile/diag_json/div_zero.cml"
args = ["--output-format", "json", "${case}", "std::no_such_pass"]
expect_exit = 1
verify_script = """
const text = input.stdout
const start = text.lastIndexOf('[\n{')
assert(start >= 0, 'stdout ends with a JSON diagnostics array')
const diags = JSON.parse(text.slice(start))
assert(diags.length === 1, 'one diagnostic')
const d = diags[0]
assert(d.severity === 'Error', 'severity is a JSON string')
assert(start === 0, 'nothing but the diagnostics array on stdout')
assert(input.stderr.includes('available passes are'), 'the pass listing goes to stderr')
assert(d.data.stage === 'pass:std::no_such_pass', 'stage is pass:std::no_such_pass, got ' + d.data.stage)
assert(d.data.name === 'RuntimeDiag::UnrecognizedGraphPass', 'name is RuntimeDiag::UnrecognizedGraphPass, got ' + d.data.name)
assert(d.range.end.line === 0 && d.range.end.character === 0, 'no source range')
"""
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 6000

