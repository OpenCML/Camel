[[tests]]
name = "dropped_effects"
desc = "Which effects outside a sync block run is read from design principles 3.1, and a call is one of the nodes the rule names (`算子、调用、分支、循环一样`): a call to a callee that writes a resource outside the program is one of its region's writes, the region's `GATE` reads it, and it runs. So `noisy(1)` and `noisy(2)` -- whose callee prints -- run and print, as does the outer `println(noisy(4))`, and none of the three is reported. A call whose callee writes only a `var` cell is still not run: `modify(i)` at line 36 writes the Variable the caller handed in, which is not a resource outside the program (design principles 3.3), so nothing runs it -- and nothing is reported for it either, because the diagnostic that named a statement which does not run went with the region roots (the rule). The assignment at line 37 is a dropped *value*, reported as `UnusedAssignedValue`; the branch at line 39 is a statement of its region and runs with it (the rule), so the arm it takes prints `arm`; nothing in a sync block and no pure expression is reported."
kind = "behavior"
case = "../../../cases/compile/diag_json/dropped_effects.cml"
args = ["--diag-format", "json", "${case}"]
expect_exit = 0
verify_script = """
assert(input.normalized.stdout === 'operator\nnoisy\nnoisy\nnoisy\n4\narm\nkept 1\n0 5\n', 'program output: ' + JSON.stringify(input.normalized.stdout))
const diags = JSON.parse(input.stderr)
assert(diags.every(d => d.severity === 'Warn'), 'warnings only')
assert(!diags.some(d => d.message.includes('is never executed')), 'no statement is reported as one that does not run: ' + JSON.stringify(diags.map(d => d.data.name)))
// The assignment at 35 is not one of these any more: assigning to a `var` is not an effect (design
// principles 3.1 and 3.5), so what it drops is a value and it is reported
// as one -- the same family as a result nobody uses.
const assigned = diags.filter(d => d.data.name === 'SemanticDiag::UnusedAssignedValue')
const assignedAt = assigned.map(d => (d.range.start.line + 1) + ':' + (d.range.start.character + 1) + ' ' + d.message)
assert(JSON.stringify(assignedAt) === JSON.stringify(["37:7 The value this assignment stores is never read."]), 'the dropped value: ' + assignedAt.join(' | '))
"""
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 6000

