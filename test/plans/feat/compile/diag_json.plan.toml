id = "compile.diag_json"
order = 319
tier = "feat"
tags = ["feat", "compile", "diagnostics"]

[[tests]]
name = "parse_stage"
desc = "A syntax error is reported as valid JSON with stage parse and a source range."
kind = "behavior"
case = "../../../cases/parse/syntax/missing_then.cml"
args = ["--output-format", "json", "${case}"]
expect_exit = 1
verify_script = """
const text = input.stdout
const start = text.lastIndexOf('[\n{')
assert(start >= 0, 'stdout ends with a JSON diagnostics array')
const diags = JSON.parse(text.slice(start))
assert(diags.length === 1, 'one diagnostic')
const d = diags[0]
assert(d.severity === 'Error', 'severity is a JSON string')
assert(d.data.stage === 'parse', 'stage is parse, got ' + d.data.stage)
assert(d.data.name === 'SyntaxDiag::UnknownSyntaxError', 'name is SyntaxDiag::UnknownSyntaxError, got ' + d.data.name)
assert(d.range.end.line > 0 || d.range.end.character > 0, 'diagnostic has a source range')
assert(d.data.modulePath.length > 0, 'diagnostic names its file')
"""
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 6000

