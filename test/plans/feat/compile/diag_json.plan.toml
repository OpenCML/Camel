[[tests]]
name = "pass_internal_error_stage"
desc = "An exception that escapes a pass (here the test-only pass test::drop_call_argument, whose commit is rejected by graph validation with a std::runtime_error) is reported as the diagnostic RuntimeDiag::PassInternalError with stage pass:<name> in a valid JSON array, exit 1; it used to be a plain text line on stdout. It has no source range. (The test used std::cpp on a tensor program until that became a located refusal, see trans.cpp refuse_tensor.)"
kind = "behavior"
case = "../../../cases/opt/generic/broken_graph.cml"
args = ["--output-format", "json", "${case}", "test::drop_call_argument", "std::fvm"]

expect_exit = 1
verify_script = """
const text = input.normalized.stdout
const diags = JSON.parse(text)
assert(diags.length === 1, 'stdout is one JSON diagnostics array with one diagnostic')
const d = diags[0]
assert(d.severity === 'Error', 'severity is a JSON string')
assert(d.data.stage === 'pass:test::drop_call_argument', 'stage names the pass, got ' + d.data.stage)
assert(d.data.name === 'RuntimeDiag::PassInternalError', 'name is RuntimeDiag::PassInternalError, got ' + d.data.name)
assert(d.code === '0x0400000C', 'code is 0x0400000C, got ' + d.code)
assert(d.message.startsWith("Pass 'test::drop_call_argument' failed with an internal error: "), 'message names the pass, got ' + d.message)
assert(d.message.includes("passing 0 arguments and 0 'with' arguments to 'twice'"), 'message carries the exception text, got ' + d.message)
"""
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 6000

