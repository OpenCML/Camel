[[tests]]
name = "dropped_effects_forward"
desc = "The order of definitions does not decide which writes run: `later` and `earlier_dropped` are written after `caller` and both run, because a call written as a statement is one of its body's writes when its callee writes (design principles 3.1: `算子、调用、分支、循环一样`) and the body's `GATE` reads it. Two lines print, then the value `caller` hands on (2), and nothing is reported."
kind = "behavior"
case = "../../../cases/compile/diag_json/dropped_effects_forward.cml"
args = ["--diag-format", "json", "${case}"]
expect_exit = 0
verify_script = """
assert(input.normalized.stdout.trim() === 'later\nearlier_dropped\n2', 'program output: ' + JSON.stringify(input.normalized.stdout))
const diags = input.stderr.trim() ? JSON.parse(input.stderr) : []
assert(diags.length === 0, 'nothing is reported, got: ' + diags.map(d => d.data.name + '@' + (d.range.start.line + 1)).join(' '))
"""
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 6000

[[tests]]
name = "rewrite_does_not_settle"
desc = "The rewrite engine reports a rewrite that keeps changing the same graph instead of returning a program that is one rewrite away from being different: settle_runs=1 is the bound exposed so this report can be proved (the default is 32), and the diagnostic names the graph, the bound and the pass."
kind = "behavior"
case = "../../../cases/modules/onnx/export_loop.cml"
args = ["${case}", "std::opt settle_runs=1", "onnx::export_model", "std::nop"]
expect_exit = 1
expect_output_contains = ["Pass 'std::opt' failed with an internal error", "did not settle", "1 consecutive runs each changed the program", "name=RuntimeDiag::PassInternalError, code=0x0400000C"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 6000
[[tests]]
name = "pass_parameter_value_refused"
desc = "A parameter the declaration's type accepts and the pass cannot use is refused while the pipeline is read, with the position of the word: settle_runs=0 is not read as 'never report'. It used to commit a diagnostic where the pass is built, where nothing receives it, and the run ended with a terminate and exit 134."
kind = "behavior"
case = "../../../cases/modules/onnx/export_loop.cml"
args = ["${case}", "std::opt settle_runs=0", "onnx::export_model", "std::nop"]
expect_exit = 1
expect_output_contains = ["RuntimeDiag::InvalidPassParameter", "settle_runs must be at least 1, got 0", "std::opt settle_runs=0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 6000
