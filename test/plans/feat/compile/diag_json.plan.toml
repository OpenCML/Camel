[[tests]]
name = "captured_write_without_sync"
desc = "A function or lambda that writes a captured variable, itself or through a function it calls directly, and is not declared with the `sync` modifier gets the warning CapturedWriteInAsyncFunction at its definition; declared ones and readers do not. The modifier is a declaration only: the program runs as before."
kind = "behavior"
case = "../../../cases/compile/diag_json/captured_write_without_sync.cml"
args = ["--output-format", "json", "${case}"]
expect_exit = 0
verify_script = """
assert(input.normalized.stdout === '3 1\n', 'program output: ' + JSON.stringify(input.normalized.stdout))
const diags = JSON.parse(input.stderr)
assert(diags.every(d => d.severity === 'Warn' && d.data.name === 'SemanticDiag::CapturedWriteInAsyncFunction'),
    'only CapturedWriteInAsyncFunction warnings: ' + diags.map(d => d.data.name).join(' '))
const got = diags.map(d => (d.range.start.line + 1) + ' ' + d.message).sort()
const want = [
    "18 Function 'bump' writes the captured variable 'total' but is not declared with the 'sync' modifier.",
    "32 Function 'via' writes the captured variable 'total' but is not declared with the 'sync' modifier.",
    "42 Function 'main' writes the captured variable 'total' but is not declared with the 'sync' modifier.",
    "44 The lambda writes the captured variable 'seen' but is not declared with the 'sync' modifier.",
]
assert(JSON.stringify(got) === JSON.stringify(want), 'warnings: ' + got.join(' | '))
"""
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 6000

[[tests]]
name = "dropped_effects"
desc = "Outside a sync block an effectful expression nothing depends on is not executed; that is legal and each one gets the warning EffectNotExecuted at its position: an impure operator, a function whose body has effects, a call bound to an unused name, a write nothing reads, an assignment, a function declared `sync func`, a branch with an effectful arm; a chain of dropped effects gets one warning. Nothing in a sync block and no pure expression is reported, and the program runs as written."
kind = "behavior"
case = "../../../cases/compile/diag_json/dropped_effects.cml"
args = ["--output-format", "json", "${case}"]
expect_exit = 0
verify_script = """
assert(input.normalized.stdout === 'kept 1\n0 5\n', 'program output: ' + JSON.stringify(input.normalized.stdout))
const diags = JSON.parse(input.stderr)
assert(diags.every(d => d.severity === 'Warn'), 'warnings only')
const dropped = diags.filter(d => d.data.name === 'SemanticDiag::EffectNotExecuted')
const got = dropped.map(d => (d.range.start.line + 1) + ' ' + d.message.replace(/ has side effects.*/, ''))
const want = [
    "31 The call of 'println'",
    "32 The call of 'noisy'",
    "33 The call of 'noisy'",
    "34 The call of 'modify'",
    "35 The assignment",
    "36 The call of 'declared'",
    "37 The call of 'println'",
    "38 The branch",
]
assert(JSON.stringify(got) === JSON.stringify(want), 'dropped effects: ' + got.join(' | '))
assert(dropped.every(d => d.message.endsWith('has side effects but is never executed: nothing depends on it and it is not in a sync block.')), 'message text')
assert(dropped.every(d => d.code === '0x03100004'), 'code 0x03100004')
"""
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 6000

