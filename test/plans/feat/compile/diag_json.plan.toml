[[tests]]
name = "pass_internal_error_stage"
desc = "An exception that escapes a pass (here std::cpp giving up on a tensor program with a std::runtime_error) is reported as the diagnostic RuntimeDiag::PassInternalError with stage pass:<name> in a valid JSON array, exit 1; it used to be a plain text line on stdout. It has no source range."
kind = "behavior"
case = "../../../cases/opt/generic/arm_tail_gate.cml"
args = ["--output-format", "json", "${case}", "std::cpp"]
expect_exit = 1
verify_script = """
const text = input.stdout
const diags = JSON.parse(text)
assert(diags.length === 1, 'stdout is one JSON diagnostics array with one diagnostic')
const d = diags[0]
assert(d.severity === 'Error', 'severity is a JSON string')
assert(d.data.stage === 'pass:std::cpp', 'stage is pass:std::cpp, got ' + d.data.stage)
assert(d.data.name === 'RuntimeDiag::PassInternalError', 'name is RuntimeDiag::PassInternalError, got ' + d.data.name)
assert(d.code === '0x0400000C', 'code is 0x0400000C, got ' + d.code)
assert(d.message.startsWith("Pass 'std::cpp' failed with an internal error: "), 'message names the pass, got ' + d.message)
assert(d.message.includes('is not supported by the direct C++ path'), 'message carries the exception text, got ' + d.message)
"""
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 6000

