timeout_ms = 6000

[[tests]]
name = "unknown_pass_after_scheduler"
desc = "An unknown pass name written after a scheduling pass is rejected before anything runs: the program is not executed (stdout is nothing but the diagnostics array), exit 1, UnrecognizedGraphPass with stage pass:<name>."
kind = "behavior"
case = "../../../cases/linear/byref/order_direct_user.cml"
args = ["--diag-format", "json", "${case}", "std::nvm", "std::no_such_pass"]
expect_exit = 1
verify_script = """
const text = input.normalized.stdout
assert(text.indexOf('[\n{') === 0, 'nothing but the diagnostics array on stdout (the program printed nothing): ' + JSON.stringify(text.slice(0, 80)))
assert(!text.includes('2011'), 'the program must not run')
const diags = JSON.parse(text)
assert(diags.length === 1, 'one diagnostic')
const d = diags[0]
assert(d.data.name === 'RuntimeDiag::UnrecognizedGraphPass' && d.severity === 'Error', d.data.name)
assert(d.data.stage === 'pass:std::no_such_pass', 'stage ' + d.data.stage)
assert(d.message.includes("'std::no_such_pass'"), d.message)
assert(input.stderr.includes('available passes are'), 'the pass listing goes to stderr')
"""
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 6000

