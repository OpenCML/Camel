id = "compile.unused_values"
order = 413
tier = "fast"
tags = ["feat", "compile", "diagnostics", "negative", "unused"]
desc = "A statement whose value nobody uses gives exactly one diagnostic, whatever the body it is written in: a statement whose value is a `T!` is UnusedFallibleValue, in a `sync` body and outside one alike (the error it may hold is lost either way, and the warning takes precedence over the one for a statement that does not run); an effect outside a `sync` body is EffectNotExecuted; a pure statement is UnusedPureResult. The `T!` statement of a body that is not `sync` was silent, and the same statement in a `sync` body of an effect-shaped callee was reported as an effect that never runs."

[defaults]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 20000

[[tests]]
name = "unused_values.fallible_sync"
desc = "A `T!` statement in a `sync` body: it runs, the value nothing takes is lost, and the one diagnostic is UnusedFallibleValue."
kind = "negative"
case = "../../../cases/compile/unused_values/fallible_sync.cml"
args = ["-E", "short", "${case}"]
expect_exit = 0
expect_stdout_starts_with = "done\n"
verify_script = """
assert(input.diagnostics.length === 1, JSON.stringify(input.diagnostics))
assert(input.diagnostics[0].name === 'SemanticDiag::UnusedFallibleValue', input.diagnostics[0].name)
assert(input.diagnostics[0].line === 12 && input.diagnostics[0].column === 5, JSON.stringify(input.diagnostics[0]))
"""

[[tests]]
name = "unused_values.fallible_body"
desc = "The same `T!` statement in a body that is not `sync`: the call does not run, and its value is still a `T!` nothing takes. One diagnostic, UnusedFallibleValue -- not EffectNotExecuted as well."
kind = "negative"
case = "../../../cases/compile/unused_values/fallible_body.cml"
args = ["-E", "short", "${case}"]
expect_exit = 0
expect_stdout_starts_with = "3\n"
verify_script = """
assert(input.diagnostics.length === 1, JSON.stringify(input.diagnostics))
assert(input.diagnostics[0].name === 'SemanticDiag::UnusedFallibleValue', input.diagnostics[0].name)
assert(input.diagnostics[0].line === 13 && input.diagnostics[0].column === 5, JSON.stringify(input.diagnostics[0]))
"""

[[tests]]
name = "unused_values.effect_sync"
desc = "An effect statement of a `sync` body runs: it is on the chain, so neither the unused-value warning nor EffectNotExecuted is reported, and both lines are printed in the order they are written."
kind = "behavior"
case = "../../../cases/compile/unused_values/effect_sync.cml"
args = ["-E", "short", "${case}"]
expect_exit = 0
expect_stdout_starts_with = "first\nsecond\n"
verify_script = """
assert(input.diagnostics.length === 0, JSON.stringify(input.diagnostics))
"""

[[tests]]
name = "unused_values.effect_body"
desc = "An effect statement of a body that is not `sync` never runs: one diagnostic, EffectNotExecuted, and the call it names prints nothing."
kind = "negative"
case = "../../../cases/compile/unused_values/effect_body.cml"
args = ["-E", "short", "${case}"]
expect_exit = 0
expect_stdout_starts_with = "4\n"
verify_script = """
assert(input.diagnostics.length === 1, JSON.stringify(input.diagnostics))
assert(input.diagnostics[0].name === 'SemanticDiag::EffectNotExecuted', input.diagnostics[0].name)
assert(input.diagnostics[0].line === 13 && input.diagnostics[0].column === 5, JSON.stringify(input.diagnostics[0]))
assert(!input.normalized.stdout.includes('never printed'), input.stdout)
"""

[[tests]]
name = "unused_values.pure_sync"
desc = "A pure statement of a `sync` body whose value nobody uses: one diagnostic, the error UnusedPureResult."
kind = "negative"
case = "../../../cases/compile/unused_values/pure_sync.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
verify_script = """
assert(input.diagnostics.length === 1, JSON.stringify(input.diagnostics))
assert(input.diagnostics[0].name === 'SemanticDiag::UnusedPureResult', input.diagnostics[0].name)
assert(input.diagnostics[0].line === 9 && input.diagnostics[0].column === 5, JSON.stringify(input.diagnostics[0]))
"""

[[tests]]
name = "unused_values.pure_body"
desc = "The same pure statement in a body that is not `sync`: one diagnostic, the error UnusedPureResult."
kind = "negative"
case = "../../../cases/compile/unused_values/pure_body.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
verify_script = """
assert(input.diagnostics.length === 1, JSON.stringify(input.diagnostics))
assert(input.diagnostics[0].name === 'SemanticDiag::UnusedPureResult', input.diagnostics[0].name)
assert(input.diagnostics[0].line === 7 && input.diagnostics[0].column === 5, JSON.stringify(input.diagnostics[0]))
"""

[[tests]]
name = "unused_values.loop_statements_used"
desc = "What a loop takes from its own statements is used -- the condition it asks and the body's value that becomes the next state -- so neither is UnusedPureResult, and a body that drops what it gives (the empty arm of an `if` without `else`) is judged by its own last statement, not by a loop body at the same address: the loop's condition and body arms die when the loop is built, and a body map keyed by their addresses reported `s + b` here (exit 1, seed of the shape)."
kind = "behavior"
case = "../../../cases/compile/unused_values/loop_statements_used.cml"
args = ["-E", "short", "${case}"]
expect_exit = 0
expect_stdout_exact = "6\n"
verify_script = """
assert(input.diagnostics.length === 0, JSON.stringify(input.diagnostics))
"""

[[tests]]
name = "unused_values.one_input_one_answer"
desc = "The same program compiled forty times in forty processes gives forty answers: exit 0 and no diagnostic. The example is the one the address-keyed body map failed on about once in ten compiles, reporting a value nobody took at somebody else's line (`param_count`'s `n + count_block(b)` at 13:38, `>=` at 131:58, `+` at 169:30). This is the net for another map of that kind, not a repro: with the fix reverted it still passes forty times, because which body collides depends on the layout of the binary -- `unused_values.loop_statements_used` is the shape that reds every time."
kind = "behavior"
tool = "python"
case = "../../../cases/compile/unused_values/repeat_compile.py"
args = ["${case}", "${camel}"]
expect_exit = 0
expect_stdout_contains = ["one input, one answer: PASS (40 compiles"]
timeout_ms = 120000

[[tests]]
name = "unused_values.called_fallible"
desc = "A `T!` called as a function is an error, not an invariant violation and not a dropped statement: the call has nothing to run, the error the value may hold has nowhere to be read, and the `CalledFallibleValue` diagnostic points at the call. Before, the builder aborted in `visitLinkNode` (the target of a LINK is not a function); reporting it as a warning instead let the statement be dropped and the run end with exit code 0 as if the call had been made."
kind = "negative"
case = "../../../cases/compile/unused_values/called_fallible.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
verify_script = """
assert(input.diagnostics.length === 1, JSON.stringify(input.diagnostics))
assert(input.diagnostics[0].name === 'SemanticDiag::CalledFallibleValue', input.diagnostics[0].name)
assert(input.diagnostics[0].line === 16, JSON.stringify(input.diagnostics[0]))
"""

[[tests]]
name = "unused_values.called_fallible_pipeline"
desc = "The shape the report was written from: `let step = loss->cse->with_grad` then `println(step<2.0>(3.0))`. The call of the fallible value is `CalledFallibleValue` at the call, the run stops with exit 1, and the entry is not reported as missing a `main` -- the module has one, and `EntryModuleMissingMain` here would send the writer to a function that is written."
kind = "negative"
case = "../../../cases/compile/unused_values/called_fallible_pipeline.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
verify_script = """
assert(input.diagnostics.length === 1, JSON.stringify(input.diagnostics))
assert(input.diagnostics[0].name === 'SemanticDiag::CalledFallibleValue', input.diagnostics[0].name)
assert(input.diagnostics[0].line === 12 && input.diagnostics[0].column === 22, JSON.stringify(input.diagnostics[0]))
"""

# ---- The help of EffectNotExecuted, per position (author's ruling of 2026-11-05, `080778522`) ----
#
# The help used to give two remedies that are not writings: a `sync { ... }` block put in a function
# body (as a statement it is itself not needed, so it does not run) and a sync block bound to a name
# (`let u = sync { ... }` -- `sync` modifies a block, it is not an expression a `let` binds). In a
# `loop` body neither is a program that prints, and the one writing that works there, `do sync { ... }`
# (`docs/language/06_expressions.md` 6.8.6, design principles 3.2 and 3.4), was not named at all.
#
# The four entries below are the four writings the help now lists, one per line of the help, plus the
# three shapes the question page measured. Each entry writes the remedy where the effect is and reads
# its output, so a help that named a spelling the language does not have would be caught by the case
# that follows it rather than by a reader. The page is
# `docs/handover/reviews/2026-11-05-does-a-println-in-a-loop-body-need-do-sync.cn.md`.

[[tests]]
name = "unused_values.help_loop_body_names_do_sync"
desc = "An effect written as a statement of a `loop` body that is not a sync block does not run: the loop's value `3` is what prints, the call is reported as EffectNotExecuted, and the help names the writing that works at that position -- `do sync { ... }` -- instead of a sync block inside the body or a sync block bound to a name. The two writings the help used to give are not in it: one is measured not to run (`unused_values.help_sync_statement_in_a_loop_body_does_not_run`) and one does not parse (`unused_values.help_let_sync_is_not_a_program`)."
kind = "negative"
case = "../../../cases/compile/unused_values/effect_loop_body_dropped.cml"
args = ["--error-format", "text", "${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
assert(out === 'total=3', `unexpected output: ${JSON.stringify(input.normalized.stdout)}`)
const text = input.normalized.stderr.replace(/\\s+/g, ' ')
assert(text.includes('SemanticDiag::EffectNotExecuted'), `the dropped call is not reported: ${text}`)
assert(text.includes("'do sync { ... }'"), `the help does not name 'do sync': ${text}`)
assert(!text.includes('let u = sync'), `the help names a writing that does not parse: ${text}`)
}
"""

[[tests]]
name = "unused_values.help_loop_body_do_sync_runs"
desc = "The remedy the help gives for a loop body, written: `do sync { ... }` declares the body a sync block, so the three calls run and the loop's value is unchanged (`total=3`). The one word is the whole difference from `effect_loop_body_dropped.cml`, and nothing is reported."
kind = "behavior"
case = "../../../cases/compile/unused_values/effect_loop_body_do_sync.cml"
args = ["--error-format", "text", "${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const lines = input.normalized.stdout.trim().split(String.fromCharCode(10))
assert(lines.join('|') === '0|1|2|total=3', `unexpected output: ${JSON.stringify(input.normalized.stdout)}`)
assert(!input.normalized.stderr.includes('EffectNotExecuted'), input.normalized.stderr)
}
"""

[[tests]]
name = "unused_values.help_sync_statement_in_a_loop_body_does_not_run"
desc = "The writing the old help invited, measured where it was offered: a `sync { ... }` block written as a statement of a loop body is itself not needed, so it does not run and the call inside it is still reported as EffectNotExecuted. Only `total=3` prints, which is why the help names `do sync` for a loop body and not a sync block written inside it."
kind = "negative"
case = "../../../cases/compile/unused_values/effect_sync_statement_in_a_loop_body.cml"
args = ["--error-format", "text", "${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
assert(out === 'total=3', `unexpected output: ${JSON.stringify(input.normalized.stdout)}`)
const text = input.normalized.stderr.replace(/\\s+/g, ' ')
assert(text.includes('SemanticDiag::EffectNotExecuted'), `the block is not reported: ${text}`)
assert(text.includes("'do sync { ... }'"), `the help does not name 'do sync': ${text}`)
}
"""

[[tests]]
name = "unused_values.help_let_sync_is_not_a_program"
desc = "The second writing the old help invited is refused by the parser: a sync block cannot be bound to a name (`let u = sync { ... }`), because `sync` modifies a block and is not an expression. The help no longer offers it, and this case keeps the reason: the writing is not a worse remedy, it is not a program."
kind = "negative"
case = "../../../cases/compile/unused_values/effect_let_sync_is_not_a_program.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SyntaxDiag::UnexpectedToken"
expect_stdout_contains = ["Unexpected 'sync'", "expected an expression"]

[[tests]]
name = "unused_values.help_if_arm_then_sync_runs"
desc = "The remedy the help gives for an effect written in an `if`'s arm, written as `then sync { ... }`: both statements of the arm run although the `if` is a statement whose value nobody takes, and nothing is reported. A plain arm would run only its value (`println('then=2')`), which is the reading the help replaces."
kind = "behavior"
case = "../../../cases/compile/unused_values/effect_if_then_sync.cml"
args = ["--error-format", "text", "${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const lines = input.normalized.stdout.trim().split(String.fromCharCode(10))
assert(lines.join('|') === 'then=1|then=2', `unexpected output: ${JSON.stringify(input.normalized.stdout)}`)
assert(!input.normalized.stderr.includes('EffectNotExecuted'), input.normalized.stderr)
}
"""

[[tests]]
name = "unused_values.help_if_arm_else_sync_runs"
desc = "The other half of the same remedy: `else sync { ... }`. The same program with the condition the other way, so the arm that prints is the one the help names for it, and the arm not taken prints nothing."
kind = "behavior"
case = "../../../cases/compile/unused_values/effect_if_else_sync.cml"
args = ["--error-format", "text", "${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const lines = input.normalized.stdout.trim().split(String.fromCharCode(10))
assert(lines.join('|') === 'else=1', `unexpected output: ${JSON.stringify(input.normalized.stdout)}`)
assert(!input.normalized.stderr.includes('EffectNotExecuted'), input.normalized.stderr)
}
"""

[[tests]]
name = "unused_values.help_function_body_sync_runs"
desc = "The remedy the help gives for an effect written in a function body, written as `func f(): T sync { ... }`: the body is a sync block, so the call written there runs when the function runs, and nothing is reported. The declaration is the whole difference from a body that is not `sync`, where the same call does not run."
kind = "behavior"
case = "../../../cases/compile/unused_values/effect_function_body_sync.cml"
args = ["--error-format", "text", "${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const lines = input.normalized.stdout.trim().split(String.fromCharCode(10))
assert(lines.join('|') === 'hello from greet', `unexpected output: ${JSON.stringify(input.normalized.stdout)}`)
assert(!input.normalized.stderr.includes('EffectNotExecuted'), input.normalized.stderr)
}
"""