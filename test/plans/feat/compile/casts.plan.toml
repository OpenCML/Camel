id = "compile.casts"
order = 334
tier = "fast"
tags = ["feat", "compile", "casts"]
desc = "Conversions with `as` that the type system decides by itself."

[[tests]]
name = "same_type.nvm"
desc = "Converting a value to its own type is legal and does nothing, for a primitive, a text, a complex number, an array, a tuple or a struct, written directly or through an alias, of a variable or of a literal; it used to be DynamicCastForbidden unless both sides were one type object (nvm)"
kind = "behavior"
case = "../../../cases/compile/casts/same_type.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "[1, 2]",
  "(1, x)",
  "3 y",
  "[4]",
  "[5, 6]",
  "2",
  "x",
  "y",
  "3",
  "true",
  "1.5",
  "1+2i",
  "1-2i",
  "3",
  "1.5",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

