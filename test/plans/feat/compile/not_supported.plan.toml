id = "compile.not_supported"
order = 312
tier = "fast"
tags = ["feat", "compile", "semantic", "negative"]

[[tests]]
name = "not_supported.list_comprehension"
desc = "A list comprehension is implemented (filter then map; consistency/comprehension.plan.toml). It was rejected at the literal here, and before that compiled as the empty array, silently."
kind = "behavior"
case = "../../../cases/compile/not_supported/list_comprehension.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_starts_with = "reached\n[4, 6]\n"
expect_output_not_contains = ["UnknownInternalError", "[Error]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "not_supported.pattern_identifier"
desc = "An identifier pattern over a plain value is rejected at the case, instead of an internal error without a position. (Over a `T?` / `T!` it binds the value: tagged.plan.toml.)"
kind = "negative"
case = "../../../cases/compile/not_supported/pattern_identifier.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ConstructNotSupported"
expect_diagnostic_code = "0x0300001F"
expect_diagnostic_line = 9
expect_diagnostic_column = 9
expect_output_contains = ["'other' is not supported: an identifier pattern is implemented only for a value of type 'T?' or 'T!'; over 'int' only literal patterns and '_' are."]
expect_output_not_contains = ["never printed", "UnknownInternalError", "Warning"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "not_supported.pattern_tuple"
desc = "A tuple pattern in a `case` is rejected at the pattern, instead of an internal error without a position."
kind = "negative"
case = "../../../cases/compile/not_supported/pattern_tuple.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ConstructNotSupported"
expect_diagnostic_code = "0x0300001F"
expect_diagnostic_line = 10
expect_diagnostic_column = 14
expect_output_contains = ["'(1,2)' is not supported: a tuple pattern is not implemented"]
expect_output_not_contains = ["never printed", "UnknownInternalError", "Warning"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

