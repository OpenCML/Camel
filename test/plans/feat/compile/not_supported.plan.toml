[[tests]]
name = "not_supported.struct_unpacking"
desc = "FeatureNotSupported is an error: it used to be a warning, the function using the feature was dropped and the rest of the program ran."
kind = "negative"
case = "../../../cases/compile/not_supported/struct_unpacking.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::FeatureNotSupported"
expect_diagnostic_code = "0x03000040"
expect_diagnostic_line = 9
expect_diagnostic_column = 5
expect_output_contains = ["The feature 'Struct Unpacking' is not supported yet."]
expect_output_not_contains = ["never printed", "Warn"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "semantic.duplicate_struct_field"
desc = "A field written twice in a struct literal is an error at the second one; the later value used to be dropped, silently."
kind = "negative"
case = "../../../cases/compile/semantic/duplicate_struct_field.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::DuplicateDictKey"
expect_diagnostic_code = "0x03000006"
expect_diagnostic_line = 8
expect_diagnostic_column = 21
expect_output_contains = ["Duplicate key in dict: 'x'."]
expect_output_not_contains = ["never printed"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "bounds.array_member_access"
desc = "`.N` on an array is a compile-time error; it used to read the array as a tuple without a bounds check and print garbage on every back end."
kind = "negative"
case = "../../../cases/compile/bounds/array_member_access.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::TypeNotIndexable"
expect_diagnostic_code = "0x0300000E"
expect_diagnostic_line = 10
expect_diagnostic_column = 13
expect_output_contains = ["Type 'int[]' does not support index access."]
expect_output_not_contains = ["never printed", "42949672963"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000
