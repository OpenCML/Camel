"""

[[tests]]
name = "grad_library"
desc = "The gradient of a linear runs under the same 7.3 choice as its forward node: tensor::fuse writes tensor.kernel on linear and the VJP carries it to matmul_grad_lhs/rhs. Default mode lets the gradient use the library GEMM above the measured shape threshold; the largest element difference against the #strict canonical gradient stays inside K^2*eps*max|x|*max|ones|. A build without a CBLAS runs the canonical kernel for both and prints 0."
kind = "behavior"
case = "../../../cases/compile/numeric/grad_library.cml"
args = ["${case}", "tensor::fuse"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
  const line = input.normalized.stdout.trim().split('\n').find((l) => l.startsWith('grad_library '))
  assert(line, 'the program prints the gradient difference and the licence bound')
  const m = line.match(/diff=(\S+) bound=(\S+) sums=(\S+) (\S+)/)
  assert(m, `unexpected line: ${line}`)
  const [, diffText, boundText, left, right] = m
  const diff = Number(diffText), bound = Number(boundText)
  assert(Number.isFinite(diff) && Number.isFinite(bound), `non-finite difference or bound: ${line}`)
  assert(Number.isFinite(Number(left)) && Number.isFinite(Number(right)), `non-finite sum: ${line}`)
  assert(bound > 0, `the licence bound must be positive: ${line}`)
  assert(diff <= bound, `gradient difference ${diff} leaves the licence bound ${bound}`)
}
"""
timeout_ms = 30000

[[tests]]
name = "grad_library.safe"
desc = "tensor::fuse safe_fp=true withholds the library from the forward linear, so the VJP carries the canonical choice to matmul_grad_lhs/rhs too: the default and #strict gradients are bit-identical (7.4)."
kind = "behavior"
case = "../../../cases/compile/numeric/grad_library.cml"
args = ["${case}", "tensor::fuse safe_fp=true"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
