id = "compile.numeric_permissions"
order = 214
tier = "fast"
tags = ["feat", "compile", "numeric", "semantics"]
desc = "Permission tags on a function or a block grant numeric permissions to the code written in it, arms, loop bodies and lambdas included, never to a function it calls (design principles 7.2, 7.5; docs/design/op-semantics 6.3, 6.4). `#[reassociate]`, `#[contract]` and the other standard tags are written where the old `@numeric(...)` was; `#[finite_math]` is the group. The graph keeps the grants in a per-node column beside the source positions; std::gir shows them as a `numeric` attribute on the nodes that have any. CSE does not merge nodes granted different ones, rewrites keep them, and tensor::fuse reads them into node attributes (tensor.kernel) without changing an operator; the CPU back ends compute the canonical results with or without them."

[defaults]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "results.backends"
desc = "Permissions only allow other results: the four back ends print the canonical ones."
kind = "behavior"
case = "../../../cases/compile/numeric/permissions.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "4.0\n8.375\n-0.1428571428571429\n6.0\n"

[[tests]]
name = "graph"
desc = "The OPER nodes of an annotated function have its permissions; those of a lambda and of the arms written in it too; a block's grant joins the function's for the code in the block; a function it calls (plain) and main have none."
kind = "behavior"
case = "../../../cases/compile/numeric/permissions.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const lines = input.normalized.stdout.split('\n')
const opers = lines.filter((l) => l.includes('type="OPER"'))
const at = (line) => opers.filter((l) => l.includes(`span="${line}:`))
const numeric = (l) => { const m = l.match(/numeric="([^"]*)"/); return m ? m[1] : '' }
const all = (line, value) => {
  const nodes = at(line)
  assert(nodes.length > 0, `no OPER node at line ${line}`)
  for (const l of nodes) assert(numeric(l) === value, `line ${line}: numeric="${numeric(l)}", expected "${value}": ${l}`)
}
all(10, '')                          // plain: called from annotated code, keeps none
all(15, 'reassociate, contract')     // fused
all(20, 'reassociate')               // the lambda in nested
all(21, 'reassociate')               // the condition and the arms of the if in nested
all(24, 'reassociate, contract')     // the block of nested: its grant and the function's
all(32, 'finite_math')               // the annotated block of blocky
all(29, '')                          // blocky outside its block
}
"""

[[tests]]
name = "graph.inline"
desc = "std::opt::inline keeps each node's own permissions: the inlined body of plain has none in its annotated caller, the inlined lambda keeps reassociate."
kind = "behavior"
case = "../../../cases/compile/numeric/permissions.cml"
args = ["${case}", "std::opt::inline", "std::gir"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const opers = input.normalized.stdout.split('\n').filter((l) => l.includes('type="OPER"'))
const at = (line) => opers.filter((l) => l.includes(`span="${line}:`))
assert(at(10).length > 0 && at(10).every((l) => !l.includes('numeric=')), 'inlined plain must have no permissions')
assert(at(20).length > 0 && at(20).every((l) => l.includes('numeric="reassociate"')), 'the inlined lambda keeps reassociate')
assert(at(24).every((l) => l.includes('numeric="reassociate, contract"')), 'the block keeps its permissions')
}
"""

[[tests]]
name = "cse"
desc = "std::opt::cse merges `a * b` with `a * b` of the same permissions, and not across them: one product without permissions, one with contract."
kind = "behavior"
case = "../../../cases/compile/numeric/cse.cml"
args = ["${case}", "std::opt::cse", "std::gir"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const muls = input.normalized.stdout.split('\n').filter((l) => l.includes('label=":op/mul_d"'))
assert(muls.length === 2, `expected 2 products after cse, got ${muls.length}`)
assert(muls.filter((l) => l.includes('numeric="contract"')).length === 1, 'one product has contract')
assert(muls.filter((l) => !l.includes('numeric=')).length === 1, 'one product has none')
}
"""

[[tests]]
name = "cse.result"
desc = "The program after std::opt::cse prints the canonical result."
kind = "behavior"
case = "../../../cases/compile/numeric/cse.cml"
args = ["${case}", "std::opt::cse", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "18.0\n"

[[tests]]
name = "fuse"
desc = "tensor::fuse changes no operator: it writes tensor.kernel (the 7.3 decision) and tensor.fusion (the group) on the nodes. The default policy lets the plain product use the library GEMM while the `#strict` block's matmul runs the canonical algorithm (7.4); both matmul+add patterns are groups even though their permissions differ."
kind = "behavior"
case = "../../../cases/compile/numeric/fuse.cml"
args = ["${case}", "tensor::fuse", "std::gir"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const q = String.fromCharCode(92) + '"'
const count = (text) => out.split(text).length - 1
const kernel = (value) => count('tensor.kernel=' + q + value + q)
assert(count('label="tensor:matmul"') === 2, `expected two matmul operators, got ${count('label="tensor:matmul"')}`)
assert(kernel('library') === 1, 'the plain product may use the library GEMM')
assert(kernel('canonical') === 1, '#strict keeps the canonical algorithm')
assert(count('tensor.fusion=') === 4, 'both matmul+add patterns are groups')
assert(count('matmul_add') === 0 && count('matmul_blas') === 0, 'no fused operator may appear')
}
"""

[[tests]]
name = "fuse.safe"
desc = "tensor::fuse(safe_fp=true) records the canonical algorithm on every matmul (7.4) and still marks the groups: the safe mode's graph is the same graph."
kind = "behavior"
case = "../../../cases/compile/numeric/fuse.cml"
args = ["${case}", "tensor::fuse(safe_fp=true)", "std::gir"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const q = String.fromCharCode(92) + '"'
const count = (text) => out.split(text).length - 1
const kernel = (value) => count('tensor.kernel=' + q + value + q)
assert(count('label="tensor:matmul"') === 2, 'two matmul operators')
assert(kernel('canonical') === 2, 'safe mode runs the canonical algorithm everywhere')
assert(kernel('library') === 0, 'nothing uses the library GEMM')
assert(count('tensor.fusion=') === 4, 'the groups are still recorded')
}
"""

[[tests]]
name = "fuse.result"
desc = "Fused or not, the results are the canonical ones."
kind = "behavior"
case = "../../../cases/compile/numeric/fuse.cml"
args = ["${case}", "tensor::fuse"]
expect_exit = 0
expect_stdout_exact = "fuse split=-12.825000286102295 tight=-12.825000286102295\n"

[[tests]]
name = "invalid"
desc = "An annotation with names in parentheses, the removed `@numeric(...)` spelling included, is SemanticDiag::InvalidAnnotation at its line; the message names the tag form that replaced it."
kind = "negative"
case = "../../../cases/compile/numeric/invalid.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["The annotation '@kernelish' is not accepted", "invalid.cml:8:1", "The annotation '@numeric' is not accepted", "invalid.cml:11:1", "#[reassociate]"]

[[tests]]
name = "library_gemm"
desc = "Per 7.3 the CPU library GEMM is available by default, so in default mode every matmul records tensor.kernel=\"library\" while the operator stays tensor:matmul; the `#[reassociate, change_precision]` tag is no longer needed (an accumulation reorder is reassociate's business). The choice is the policy's, not the build's: without a CBLAS the library path runs the canonical kernel, and the attribute still says library."
kind = "behavior"
case = "../../../cases/compile/numeric/library_gemm.cml"
args = ["${case}", "tensor::fuse", "std::gir"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const q = String.fromCharCode(92) + '"'
const count = (text) => out.split(text).length - 1
const kernel = (value) => count('tensor.kernel=' + q + value + q)
assert(count('label="tensor:matmul"') === 3, 'three matmul operators')
assert(kernel('library') === 3, 'the default policy lets every matmul use the library GEMM')
assert(kernel('canonical') === 0, 'nothing is withheld in default mode')
}
"""

[[tests]]
name = "library_gemm.safe"
desc = "tensor::fuse(safe_fp=true) withholds the library GEMM from every matmul (7.4): the operator is unchanged, only the attribute differs."
kind = "behavior"
case = "../../../cases/compile/numeric/library_gemm.cml"
args = ["${case}", "tensor::fuse(safe_fp=true)", "std::gir"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const q = String.fromCharCode(92) + '"'
const count = (text) => out.split(text).length - 1
const kernel = (value) => count('tensor.kernel=' + q + value + q)
assert(count('label="tensor:matmul"') === 3, 'three matmul operators')
assert(kernel('canonical') === 3, 'safe mode runs the canonical algorithm')
assert(kernel('library') === 0, 'no library GEMM in safe mode')
}
"""

[[tests]]
name = "library_gemm.results"
desc = "The same program after tensor::fuse prints three results that agree within the licence's bound: with a BLAS the library GEMM may reorder the accumulation (7.3), without one it is the canonical kernel; this tiny product agrees to the last printed digit either way."
kind = "behavior"
case = "../../../cases/compile/numeric/library_gemm.cml"
args = ["${case}", "tensor::fuse"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
  const line = input.normalized.stdout.split('\n').find((l) => l.startsWith('gemm '))
  assert(line, 'the program prints its three results')
  const values = [...line.matchAll(/-?\d+(?:\.\d+)?(?:e[-+]?\d+)?/g)].map((m) => Number(m[0]))
  assert(values.length === 3, `expected three results, got ${values.length}: ${line}`)
  assert(values.every(Number.isFinite), `non-finite result: ${line}`)
  const spread = Math.max(...values) - Math.min(...values)
  assert(spread <= 1e-4, `the three results spread by ${spread}, beyond the licence's bound`)
}
"""

[[tests]]
name = "library_gemm.tolerance"
desc = "The library GEMM and the canonical GEMM are one operator (9.6). The program runs the same product both ways in one build (default policy: library; #strict: canonical), prints the largest per-element difference and the licence bound K^2*eps*max|a|*max|b|, and the test fails when the difference leaves that bound. A BLAS build exercises two implementations; a build without one runs the canonical kernel twice (diff 0)."
kind = "behavior"
case = "../../../cases/compile/numeric/gemm_library.cml"
args = ["${case}", "tensor::fuse"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
  const line = input.normalized.stdout.trim().split('\n').find((l) => l.startsWith('gemm_library '))
  assert(line, 'the program prints its sums, difference and bound')
  const m = line.match(/sums=(\S+) (\S+) diff=(\S+) bound=(\S+)/)
  assert(m, `unexpected line: ${line}`)
  const [, left, right, diffText, boundText] = m
  const diff = Number(diffText), bound = Number(boundText)
  assert(Number.isFinite(Number(left)) && Number.isFinite(Number(right)), `non-finite sum: ${line}`)
  assert(Number.isFinite(diff) && Number.isFinite(bound), `non-finite difference or bound: ${line}`)
  assert(bound > 0, `the licence bound must be positive: ${line}`)
  assert(diff >= 0, `a largest absolute difference is not negative: ${line}`)
  assert(diff <= bound, `library GEMM difference ${diff} leaves the licence bound ${bound}`)
}
"""

[[tests]]
name = "library_gemm.tolerance.safe"
desc = "In safe mode tensor::fuse(safe_fp=true) withholds the library GEMM from every matmul (7.4), so the two products of the same program are bit-identical: the fallback is the canonical algorithm, not an approximation of it."
kind = "behavior"
case = "../../../cases/compile/numeric/gemm_library.cml"
args = ["${case}", "tensor::fuse(safe_fp=true)"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
  const line = input.normalized.stdout.trim().split('\n').find((l) => l.startsWith('gemm_library '))
  assert(line, 'the program prints its sums, difference and bound')
  const m = line.match(/sums=(\S+) (\S+) diff=(\S+) bound=(\S+)/)
  assert(m, `unexpected line: ${line}`)
  assert(Number(m[3]) === 0, `safe mode must be bit-identical, got diff ${m[3]}`)
}
"""
