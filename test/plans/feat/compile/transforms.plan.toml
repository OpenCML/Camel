[[tests]]
name = "reinterp_builds_its_own_graph.nvm"
desc = "The first form of `reinterp` does one thing and says it: it walks every function of the program that is made of operators -- for `f(x) = x*x + 3/x` that is `f`, with three primitives (a multiplication, an addition, a division) and two nodes that are not (the two constants) -- and builds a graph of the transform's own for each, printing its GraphId and node count. It is not a transform yet: the graph it builds is a single port handed to the output, and the reading says exactly that, so the next step has a number to grow from instead of a claim to believe."
kind = "behavior"
case = "../../../cases/compile/transforms/reinterp_scalar.cml"
args = ["${case}", "transforms::reinterp", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_stdout_contains = ["REINTERP target=f primitives=3 other=2 graph=", "nodes=1", "5.5"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000