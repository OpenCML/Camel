[[tests]]
name = "transpose.callee_is_a_returned_function.is_a_linearity_refusal"
desc = "`f(x) = mk(x)(2.0)` with `mk(x) = (y) => x*y`: the call applies a function the body **built out of `x`**, so `f` is not linear in that parameter, and the refusal says so (author, 2026-11-04 07:15: a callee built from a linear input is a **linearity** refusal -- the sentence names the parameter, and does not say \"the answer has no source\", which describes our walk and not the language). The criteria this pins: one line whose cause word is `callee-built-from-a-parameter` and whose `built-from=0` names `x` by position -- the parameter `mk` was applied to; the sentence `this function is not linear in the parameter at position 1: it builds the function this call applies out of that parameter`; `callee=none`, because no node of this graph names the graph the call applies; and no `skip=signature` line, since no signature of `mk` is read. The value is read by `GCGraph::staticFunctionGraphOf` (`what graph does this *value* name`) and not by `calleeIdOf` (`what does this node answer as a callee`, which answered `mk` -- the graph of the call that *produced* the value, not the graph this call applies). The reading that separated the two, and what the same program answers through the library's cut, are in `docs/handover/reports/2026-11-04-what-the-transpose-batch-measured.cn.md`, section 1: the library's cut owes the 2 at cotangent 1 because it carries such a value as a residual, and a bare `transpose(f)` refuses this shape by the language's rule, not by our state."
kind = "negative"
