[[tests]]
name = "transforms.with_grad_composition_meets_the_split_wall"
desc = "A library-level `with_grad` written as the composition design principles 9.9 asks for (author's ruling of 2026-11-03 09:50) -- the weight moved to an ordinary parameter by a lambda, `vjp` differentiating it there -- carrying the number it was held to since it was written: `(0.125, -0.75)` for x = 1.5, t = 2.0, w = 0.5, b = 0.75 (err = 0.5*1.5 + 0.75 - 2 = -0.5, loss = 0.5*err*err = 0.125, d(loss)/dw = err * x = -0.75). The case was negative for three walls in a row and the case file keeps all three sentences, because which refusal stood says what was missing where: the exit's shape (`skip=exit`, the lift answered with the call's pair instead of a fill of its own), the cut's forward walk on a captured value (`skip=forward`, `the port is not a parameter of the graph, so neither half takes it`), and the cut's backward walk on the same port together with a `with` argument carrying no tangent -- `jvp` wrote a call's arguments interleaved `(value, tangent)` while the lifted signature is the values and then their tangents, and the weight's tangent was a zero constant the lift wrote. `lane-withtan` answered the third (`modules/transforms/jvp.cpp`: the lifted call's arguments are filled from the callee's own lifted signature, and a `with` argument keeps its direction), `lane-withport` the second (`split` declares one closure port per capture), and the first had been answered before this entry was written. What this entry pins is therefore a number on the library's leg, not a message."
kind = "behavior"
case = "../../../cases/compile/transforms/with_grad_composition_meets_the_split_wall.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout = "value=0.12500000000000000 w=-0.75000000000000000\n"
expect_output_not_contains = ["Warning", "[Error]", "skip=backward", "skip=forward", "skip=exit"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "transforms.with_grad_from_the_library"
desc = "The criterion with an object: `stdlib/vjp.cml#with_grad` against the engine's `with_grad`, on the four groups of `grad_first_with_parameter.cml` (`gx/vg`, `pg/pvg`, `wg/wvg`, `sk/sx`), one line per group. Before this entry the criterion '库层 `with_grad` 在 `grad_first_with_parameter` 上与引擎同答' (author, 2026-11-03 17:55) named nothing that could be called: `stdlib/vjp.cml` exported `vjp` and a one-parameter `grad`, and `stdlib/signatures/autodiff.cml#with_grad` is a reference declaration that does not compile. The library now exports a `with_grad`, and it refuses on all four groups, so this entry holds both halves of the measurement: the engine's four answers, which are the numbers the composition owes, and four `RuntimeError` refusals with the sentence that says why. It is deliberately not a number on either side: the composition every `with_grad` has (`vjp` of a lambda that moves the weight to an ordinary parameter) cannot see the tangent of a value the body hands back to a call's `with` list -- forward mode answers that tangent as the zero of its type, `jvp((ww: float) => x_times_y<ww>(2.0))(3.0, 1.0)` reading `value=6.0 tangent=0.0` where the derivative it owes is 2.0 -- so a composition written straight through answers `0.0` where `weighted` owes `3.0`, and a zero gradient is not distinguishable from a refusal. The day forward mode carries that tangent, the four `library=` fields carry tuples, this entry goes red on the pin below, and the case and `stdlib/vjp.cml#with_grad` turn over together. `with_grad_composition_meets_the_split_wall` stays as it is: it pins the cut's own wall, which is a different one and still stands."
kind = "behavior"
case = "../../../cases/compile/transforms/with_grad_from_the_library.cml"
