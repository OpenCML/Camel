[[tests]]
name = "transpose_tuple_component.reads_the_first_slot"
desc = "`first(x) = let t = (x, 2x); t.0` returns one component of a tuple, and the pullback of 1.0 is 1: the tuple's cotangent is a value of the tuple's own shape, the read slot filled and the other zero. That zero is what the companion case checks from the other side -- a walk that zeroed where it should have filled, or filled every slot with the same cotangent, would still answer 1 here. Before this channel a component read dropped its cotangent as a read of a known value, so nothing past a tuple was differentiated and the function refused with `skip=output`.
kind = "behavior"
case = "../../../cases/compile/transforms/transpose_tuple_component_first.cml"
