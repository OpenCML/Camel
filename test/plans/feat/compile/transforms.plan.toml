# the handed-over program: `xs[1] * xs[0]` over `[3.0, 2.0]`, read through `vjp`.
# The cotangent of a function of an array should come back as an array, and the piece that was missing
# is **no longer the law**: `index_into`'s transposed member is built -- `TRANSPOSE
# function=rulesets.jvp::index_into<float> graph=128 type=(int, float[], float) => (float[],) nodes=3
# arms=0 rhs=idx_arr_t` -- and it answers `(float[],)`. What stops the shapes below is one step above
# it, at **the call site that needs the array's value**: `TRANSPOSE-NEEDS function=...param=0`, then
# `TRANSPOSE function=... skip=call-value-missing ... arg=N`. That value is what the member
# must carry in its closure (author, 2026-11-03 17:10); the closure is `b2f`'s lane, and these
# flip when it lands.
# (Until 2026-11-03 this block said "the wall is the law `idx_arr_t`, not the shape"; the reading that
# replaced it is the one above.)
[[tests]]
name = "grad_of_an_array_parameter"
desc = "The handed-over program: `xs[1] * xs[0]` over `[3.0, 2.0]`, read through `vjp` -- `6.0` and the array cotangent `[2.0, 3.0]`, each operator's value landing in the other's place. Same wall as the rest of the block: the element read's member is built, and the call site still needs the array's **value** (`param=0`, then `skip=call-value-missing ... arg=5`)."
kind = "behavior"
case = "../../../cases/compile/transforms/grad_of_an_array_parameter.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["6.0", "[2.0, 3.0]"]
expect_output_not_contains = ["skip=", "breaks its edge invariants"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000
# Marked known_fail on the author's ruling of 2026-11-03 00:30: a case that cannot pass today belongs
# in the plan with a mark, an owner and a reason, not outside it in CASE_EXCEPTIONS. The assertion is
# the answer the transform owes -- `[2.0, 3.0]` -- and not today's refusal, so the mark is the only
# thing standing between the plan and a red, and the runner reports a marked case that passes as a
# failure: that report is what asks for the mark's removal.

