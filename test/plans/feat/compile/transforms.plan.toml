expect_output_contains = ["1.0", "27.0", "6.0", "TRANSPOSE function=autodiff::add_tangent<float> graph="]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# A transform asks the type, not the writer of a rule, what a value's tangent space is
# (`camel/core/tangent_space.h`): `float`, the two reduced-precision floats and every float array
# are their own space, `(float, i32)` has none because the `i32` has none, and an integer or a
# string has none at all. `test::tangent_space` prints one line per type and changes no graph, so
# the answer is held still here and the query is asked before anything lifts a parameter.
[[tests]]
name = "tangent_space.the_type_answers"
desc = "The tangent-space query answers three ways and prints one line per type: `float` (and `f32`, `f16`, `bf16` -- a narrow float is a float) is its own space, `float[]` is its own space because its element is, `i32[]` has none because its element has none, `(float, i32)` has none because one member has none, and `string` has none at all. The reading is the query's own, taken through `test::tangent_space`, which reads the program and gives it back unchanged."
kind = "behavior"
case = "../../../cases/compile/transforms/jvp_lifted.cml"
args = ["${case}", "test::tangent_space", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_stdout_contains = ["TANGENT type=float space=self", "TANGENT type=f32 space=self", "TANGENT type=f16 space=self", "TANGENT type=bf16 space=self", "TANGENT type=i32 space=none", "TANGENT type=string space=none", "TANGENT type=float[] space=self", "TANGENT type=i32[] space=none", "TANGENT type=(float, i32) space=none", "TANGENT type=(float, float) space=self"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# Four cases of this block were marked known_fail until 2026-11-02, and their notes said the process
# was killed at the timeout with exit null. That reading was the runner's, not the case's: it printed
# `got null` for every death by signal, and a bare run takes zero seconds and returns 139 (SIGSEGV) -
# an array cotangent summed as one number rather than an array. lane-lit2 repaired it (19f0b05e8,
# 0aed45eb6) and removed the marks in the same commit; the four now pass in about 0.1-0.2 s each.
# The two walls between here and the array arm of grad, pinned as refusals rather than known_fail: a wall
# that falls must turn its assertion into a number, and known_fail would hide that.
[[tests]]
name = "grad_array_no_int"
desc = "The gradient of an array through `vjp`, on the backend whose program contains no integer: `xs[0] * xs[1]` over `[3.0, 2.0]` answers `6.0` and the array cotangent `[2.0, 3.0]`, on fvm. The transposed `index_into` member is built; what the walk still needs is the **array's value at the call site** (`TRANSPOSE-NEEDS ... param=0`, then `skip=call-value-missing ... arg=5`), which the member carries only once its closure does."
kind = "behavior"
case = "../../../cases/compile/transforms/grad_array_no_int.cml"
args = ["${case}", "${backend}"]
backends = ["fvm"]
expect_exit = 0
expect_stdout_contains = ["6.0", "[2.0, 3.0]"]
timeout_ms = 15000

# The same read with the extent written in the parameter's type -- `float[3]`, which is the half of
# the author's 2026-11-03 16:15 ruling a reader can act on today ("转置需要参数的形状：在类型里写出来").
# The numbers are hand arithmetic and every position is its own assertion, because the third one is
# what tells a cotangent built from the read positions from one built from the array: `d/dxs[2]` is
# zero and nothing reads it.
#
# What this case does **not** pin is a mechanism: the transposed member still takes the array's value
# (`TRANSPOSE function=rulesets.jvp::index_into<float> graph=388 type=(int, float[], float) =>
# (float[],)`), so the extent in the type is not what answers it -- the split's residual is. The
# measurement of both sources, and why neither reaches a law, is
# `docs/handover/questions/2026-11-04-does-a-shape-in-the-type-reach-the-law.cn.md`.
[[tests]]
name = "grad_array_fixed_shape"
desc = "A `float[3]` parameter read at two positions: `xs[1] * xs[0]` over `[3.0, 2.0, 5.0]` answers `6.0`, and the cotangent is `2.0`, `3.0`, `0.0` position by position -- the third one the zero the body never reads. This is `grad_array_no_int` with the extent stated in the type, which is the shape the ruling asks a caller to write."
kind = "behavior"
case = "../../../cases/compile/transforms/grad_array_fixed_shape.cml"
args = ["${case}", "${backend}"]
backends = ["fvm"]
expect_exit = 0
expect_stdout_contains = ["value = 6.0", "d/dxs[0] = 2.0", "d/dxs[1] = 3.0", "d/dxs[2] = 0.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 15000

[[tests]]
name = "grad_array_with_int.fvm"
kind = "behavior"
case = "../../../cases/compile/transforms/grad_array_with_int.cml"
args = ["${case}", "std::fvm"]
expect_exit = 0
expect_output_contains = ["6.0", "([2.0, 3.0], ())"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 15000

# The same two answers with the `int` on the other side of the array, which is the only place a half's
# port index and a parameter's index come apart: `((), float[])` has one port, `dxs`, and it is
# parameter 1. A build that reads a port's position as a parameter's position names `n`, answers the
# wrong shape or refuses, and never reaches the numbers.
[[tests]]
name = "grad_array_int_parameter_first"
desc = "`f(n, xs) = xs[n]` at (1, [3.0, 2.0]) through `vjp`: 2.0, `()` for the `int` -- an empty member of the answer, since `Tangent<int>` is `()` and the pullback answers one slot per parameter -- and `[0.0, 1.0]` for `xs`. The backward half's type is `((), float[])` and its one port is `dxs`, which is parameter 1: a port index read as a parameter index names `n`, so this is where the two readings differ. The `()` answers a member and takes no port -- nobody can pass a value where there is none."
kind = "behavior"
case = "../../../cases/compile/transforms/grad_array_int_parameter_first.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 0
expect_output_contains = ["2.0", "()", "[0.0, 1.0]"]
expect_output_not_contains = ["skip="]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

