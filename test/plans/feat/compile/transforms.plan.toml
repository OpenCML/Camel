# The same wall read from the `vjp` side, and kept as the *positive* entry it was always meant to
# become. `cross_call_gradient_is_not_zero` landed on 2026-11-04 07:34 as a `known_fail` that pinned
# the wrong line this tree printed (`known_fail_msg = "g'(3) = 0.0"`, the zero a linear half that
