desc = "`vjp` of a function that writes `with` parameters, which is what the ruling of 2026-11-03 13:50 unblocked: the lambda `vjp` answers names the `with` list it takes from its position (`<..ws> (..xs) => ...`) and hands it to `split(jvp(f))<..ws>(..xs)`, so a `with` value reaches the forward half and the transform differentiates the ordinary parameters only. Every line is hand-computed and pinned: `scale(x) = w * x` at w = 2.0, x = 3.0 answers value 6.0 and slope 2.0; `quadratic(x) = w * x + v * x * x` at w = 2.0, v = 3.0, x = 1.5 answers 9.75 and 11.0; the same function with the two `with` values exchanged at w = 3.0, v = 2.0, x = 1.0 answers 5.0 and 7.0. The last two rows answer different numbers only if each `with` value lands in its own slot. Before, the first line stopped with `ArgumentsMismatch` at `split(jvp(f))(..xs)`: `jvp(f)` takes `f`'s `with` list and the lambda had no name for it."
