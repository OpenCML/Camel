name = "transpose_unread_state_answers_zero.nvm"
desc = "A parameter the loop never reads answers a zero cotangent: `transpose(k)` for `k(x) = loop s = 0.0 for i in [1, 2, 3] do s + 2.0` answers `(0.0)` for a cotangent of 1 and 0 (linear), where the same shape used to be refused with `skip=state-unread`; `m(x) = loop s = x ...` is the control and answers `(1.0)`. On paper `k(x) = 6` for all `x` so `k' = 0`, and `m(x) = x + 6` so `m' = 1`."
kind = "behavior"
case = "../../../cases/compile/transforms/transpose_unread_state_answers_zero.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_output_contains = ["k value= 6.0", "k pullback(1.0)= (0.0)", "k pullback(2.0)= (0.0)", "m value= 9.0", "m pullback(1.0)= (1.0)"]
