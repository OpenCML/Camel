# A loop whose state starts at a constant, and the parameter it never reads: `k(x) = loop s = 0.0 for
# i in [1, 2, 3] do s + 2.0` is `6.0` for every `x`, so `k'(x) = 0`. The loop is the whole answer and
# the value its state starts from answers no parameter, so the cotangent of the loop's value is the
# zero of its cotangent space -- the reading 48bfa6778 took for a straight line ("a parameter the body
# never reads answers a zero cotangent, not a refusal"), read for a loop (author's ruling of 2026-11-03,
# `origin/fsh-dev = ad7e716b0`, fourth of four).
#
# Two things make the zero a pin and not a shrug: it is *linear* -- `pullback(2.0)` answers `0.0`, where
# the constant `1.0` this shape answered before the loop branch existed would answer `2.0` -- and `m`,
# whose state starts at the parameter, keeps answering `1.0` for `m(x) = x + 6`, so the branch answers a
# zero only where nothing reaches the parameter and not on the way past the loop that does reach it.
# The half that carries a closure answers the same zero: a member carries its closure whatever its
# answer reads -- a zero answer is a constant and the closure is still filled -- so the shape that
# used to be refused with `skip=state-unread` is answered by that half too (author, 2026-11-03,
# `origin/fsh-dev = 3ab482ab2`), and the cause is gone from `TransposeRefusalCause`.
