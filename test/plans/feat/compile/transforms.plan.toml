# A read with a stated length, `tensor:pick_at`, is the operator the linear half of a read is written
# with (`stdlib/rulesets/jvp.cml#jvp_idx_arr` answers with `pick_at(dxs, extent_pair(i, len(xs)))`).
# It carried a reverse law (`stdlib/rulesets/transpose.cml#pick_at_t`) and no forward one, so a
# program that wrote the read itself was refused where the lift looks the rule up:
#
#     REINTERP jvp function=read skip=rule uri=tensor:pick_at reason=the operator has no forward rule bound at all
#
# `jvp_pick_at` is one line -- a read moves no element, so its tangent is the read of the tangent --
# and it needs no stated twin, because the list that carries the position (`at[0]`) already carries
# the length (`at[1]`). The engine's own `grad` refused the same read for a second and separate
# reason -- no `setVjp` under that name in the reverse pass's table -- and that row landed with
# `lane-pickatvjp` (2026-11-04). The two entries below are therefore the two legs of one read, and
# they answer the same number: the library's `jvp`/`vjp` and the engine's `grad`.
[[tests]]
name = "pick_at_forward_rule_answers_both_directions"
desc = "The library's two legs over `read(x) = pick_at(x, [1, 3])` on `x = [1.0, 2.0, 3.0]` and the direction `dx = [0.5, 0.25, -1.0]`, every number hand-computed before the run: the read is the second element, so the forward tangent is `dx[1] = 0.25` and the reverse leg's cotangent of 1.0 lands at position 1 alone, `dL/dx = [0.0, 1.0, 0.0]`. The third line is what ties the two laws together instead of comparing them by eye -- the forward tangent is the gradient applied to the direction, `sum(dL/dx * dx) = 0.0*0.5 + 1.0*0.25 + 0.0*(-1.0) = 0.25` -- so a `pick_at_t` that scattered the cotangent to another position, or a `jvp_pick_at` that read one, prints a line that does not close. Before the law the program stopped at the lift with `skip=rule uri=tensor:pick_at reason=the operator has no forward rule bound at all`; the stderr side pins the rule that answers now (`rules=jvp_pick_at`) and that no `skip=` line remains."
kind = "behavior"
case = "../../../cases/compile/transforms/pick_at_forward_rule.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["forward value=2.0 tangent=0.25", "reverse value=2.0 dL/dx=[0.0, 1.0, 0.0]", "agreement 0.25"]
expect_stderr_contains = ["rules=jvp_pick_at"]
expect_output_not_contains = ["skip="]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

