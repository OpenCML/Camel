# The two derivative tables are written independently -- `src/core/derivative.cpp` (keyed by the
# operator's URI) and `stdlib/rulesets/*.cml` (keyed by the rule's left-hand head and operand count)
# -- and nothing in the build compares them. That is how `pick_at`, `sum_stated`, `take_stated` and
# `mean_axis_stated` each came to have a law the engine's reverse pass could not read: a hole no
# compiler error can see, because each side is complete in itself.
#
# `scripts/vjp-parity.mjs` is the comparison, and `scripts/vjp-parity-exemptions.tsv` is the list of
# differences the repo has decided to keep, one row per key with an owner and a reason (a wildcard is
# refused, so every row answers "why is this one allowed"). A difference that is not in the list is a
# debt and the gate exits 1. It is not a strict-equality check -- a law may belong to the library
# alone (machinery, or a value with no tangent) and a rule to the engine alone (an operator the
# library's forward half files no `jvp_*` for) -- so the list is the contract, not the count.
#
# `test/tools/check-vjp-parity.mjs` is the three readings that say the gate works: the real tree has
# `0 new`; a law added to a copy of the rulesets with no engine rule behind it is **reported** by
# name; and the same law with the row it would need is **not** reported. The copy links the real
# `src/` and `modules/`, so the engine side of the comparison is the tree's own.
[[tests]]
name = "vjp_api.the_two_tables_are_compared"
desc = "`scripts/vjp-parity.mjs` reads both derivative tables out of the source -- the library's laws and the engine's `setVjp`/`setRule` registrations, reduced to the same `head@arity` key -- and reports every difference the exemption list does not hold. This entry runs `test/tools/check-vjp-parity.mjs`, which pins three readings: the real tree answers `0 new`; a `fake_parity_op_t` law appended to a copy of `stdlib/rulesets/transpose.cml` (with `src/` and `modules/` linked to the real tree, so the engine's table is the tree's own) is reported by name with exit 1; and the same law with the row it would need appended to a copy of the exemption list is not reported, with exit 0. A gate that answered `0 new` for the second reading would be green on the day someone files a law no engine rule answers, which is the debt this comparison exists to catch."
kind = "behavior"
tool = "node"
case = "../../../../test/tools/check-vjp-parity.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["the real tree has no difference the list does not hold", "a law with no engine rule is reported", "the same law is not reported once the list holds it", "PASS the parity gate answers the three readings it exists for"]
normalizers = ["normalize_newlines"]
timeout_ms = 120000

# The comparison the author named: one `f` with two parameters, and the library's gradient beside
# the derivative worked out on paper. `f(x, y) = x*x*y` at `(3, 2)` has `df/dx = 2*x*y = 12` and
# `df/dy = x*x = 9`, and both numbers are printed -- `library` first, `analytic` under it -- so the
# reading is a comparison. The surface is JAX's (the author's ruling of 2026-11-01): `vjp(f)(x)` is
# the pair `(y, pullback)` and `pullback(ct)` is the cotangent of `f`'s parameters, so the call is
# `vjp(f)(3.0, 2.0)` and then `pullback(1.0)`. The juxtaposed call `transpose` writes is the
# internal assembly; it is not a standard-library signature and nothing here writes it.
#
# The main line: the case the library has to keep answering, on the program the author named, in
# every backend. `f(x, y) = x*x*y` at `(3, 2)` has `df/dx = 2*x*y = 12` and `df/dy = x*x = 9`, and
# both numbers are printed -- `library` first, `analytic` under it -- so the reading is a comparison.
# The surface is JAX's (the author's ruling of 2026-11-01): `vjp(f)(x)` is the pair `(y, pullback)`
# and `pullback(ct)` is the cotangent of `f`'s parameters, so the call is `vjp(f)(3.0, 2.0)` and then
# `pullback(1.0)`. The juxtaposed call `transpose` writes is the internal assembly; it is not a
# standard-library signature and nothing here writes it.
#
# No precondition and no skip: the composition runs, so a wall here is a red and not a silence. Four
# backends are asked for the same six lines -- `nvm`, `fvm`, `jit`, `prl` -- and compared on the exit
# code and on the whole standard output, so "the library is the language's" is read once per executor.
# `18.0` is `3*3*2`; `12` and `9` are the derivative worked out on paper, printed beside the
# library's answer. `test/tools/check-vjp-ruleset.mjs` drops one of the library's two ruleset imports
# in a copy, so a missing import is red in its own case as well as here.
[[tests]]
name = "vjp_api.analytic_gradient"
desc = "The library's gradient against the derivative worked out on paper, on the author's example: `f(x, y) = x*x*y` at `x = 3`, `y = 2`, so `df/dx = 2*x*y = 12` and `df/dy = x*x = 9`. `vjp(f)(3.0, 2.0)` gives the pair `(y, pullback)` and `pullback(1.0)` gives the two cotangents, in JAX's order; the program prints `f(3, 2) = 18.0`, `library y = 18.0`, then `library`/`analytic` for `df/dx` and `df/dy`. The library half comes from `transpose(split(reinterp<jvp>(f)))` in `stdlib/vjp.cml` and nothing else -- not from the C++ autodiff -- and the two rulesets that composition needs are that file's own imports, so this program imports `vjp` and nothing else. Run on `nvm`, `fvm`, `jit` and `prl`, which must agree on the exit code and on the whole standard output."
kind = "behavior"
case = "../../../cases/compile/transforms/vjp_analytic_gradient.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "output_normalized"]
expect_exit = 0
expect_stdout_contains = ["f(3, 2) = 18.0", "library  y = 18.0", "library  df/dx = 12.0", "analytic df/dx = 12.0", "library  df/dy = 9.0", "analytic df/dy = 9.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

