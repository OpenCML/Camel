desc = "The same gradient through the library's `vjp`: `jvp_relu` (`stdlib/rulesets/jvp.cml`) and `relu_t` (`stdlib/rulesets/transpose.cml`) answer it, and the forward rule writes the mask as a forward-half value (`where(x > 0, 1, 0) * dx`) so the linear half is one `mul_tensor`, and the backward walk turns the sum around with `sum_stated_t` and then reaches the product. Where it stops now is measured, not hoped for: the mask is a value the backward half computes from the close-over `x`, and the closure-member rules answer that (`modules/transforms/transpose.cpp#buildTransposeMember`, author 2026-11-03 19:55): a closed-over member takes no cotangent, so the walk no longer asks the product's law for the mask's own cotangent, and stops at the position whose cotangent the answer does need -- the tangent's -- where the law reads that same operand for `sum_to`'s shape and finds no value: `skip=cotangent-needs-a-value uri=tensor:multiply`. The remaining step is the rule layer's (`stdlib/rulesets/transpose.cml#mul_tensor_t`, the 2026-11-03 17:35 item the index family already has), not this member; `test/cases/compile/transforms/relu_gradient_through_the_library.cml` records both readings inside it. Pinned on three streams: the number (identical to the engine's, element for element), the rule names the walk reports (`rules=jvp_relu,jvp_sum`), and the absence of the refusal this case had before the rules existed -- `skip=rule uri=tensor:relu reason=the operator has no forward rule bound at all`, replaced by the rule names."
kind = "behavior"
case = "../../../cases/compile/transforms/relu_gradient_through_the_library.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["relu library value=3.0 dL/dx=[0.0, 0.0, 1.0, 0.0]"]
expect_stderr_contains = ["rules=jvp_relu"]
expect_output_not_contains = ["skip=rule uri=tensor:relu", "skip=call-no-transpose"]
known_fail = ["nvm"]
known_fail_owner = "lane-fwdclosure"
known_fail_reason = "the case stops at `skip=cotangent-needs-a-value uri=tensor:multiply`, and the library's leg stops where the multiply law is missing: `stdlib/rulesets/transpose.cml#mul_tensor_t` has no safe writing (author's ruling of 2026-11-03 00:30)"
known_fail_msg = "skip=cotangent-needs-a-value uri=tensor:multiply"
known_fail_note = "Waits on the rule layer, not on this transform. Measured 2026-11-04 at 34b659107 with the closure-member rules landed (modules/transforms/transpose.cpp#buildTransposeMember: a closure member takes no cotangent -- author, 2026-11-03 19:55 -- and a value computed only from closure members is not asked for one): the walk no longer asks the product law for the closed-over operand's cotangent, and stops one step further on, where the law reads the operand **whose cotangent it is answering** for sum_to's shape -- sum_to(ct * w, x) reads x, sum_to(ct * x, w) reads w. That operand is a tangent, so what the law wants is the shape of a tangent, and float[...] does not state it: shapeCarrierOf answers only for a stated shape (float[2]), which is the author's 2026-11-03 16:15 rule. So forward and the closure are not what is missing any more -- the law reads a linear operand, the 2026-11-03 17:35 item the index family got (element_at(dxs, extent_pair(i, len(xs)))) and the multiply family has not (stdlib/rulesets/transpose.cml#mul_tensor_t). The number comes back when that law hands the extents as a known argument, the way sum_stated_t and take_stated_t do; the expected numbers are unchanged. Measured 2026-11-04: the other way of satisfying 17:35 -- naming the operand the side is *not* answering for, `sum_to(ct * w, w)` -- is not it. On a broadcasting product (`x=[1,2,3]`, `w=[2]`, product shape (3,)) that spelling answers `d/dx numel=1 d/dx=[6.0]` and `d/dw numel=3 d/dw=[1.0, 2.0, 3.0]`, where the answer is `d/dx=[2.0, 2.0, 2.0]` (numel 3) and `d/dw=[6.0]` (numel 1), and it answers those wrong shapes for `float[...]` and for `float[3]`/`float[1]` alike, because `sum_to`'s second argument is the *target shape* and only the operand whose cotangent is being built carries it. A wrong number is worse than this named refusal, so `stdlib/rulesets/transpose.cml#mul_tensor_t` stays as it is."
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

