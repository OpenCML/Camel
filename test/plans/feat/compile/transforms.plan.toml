timeout_ms = 20000

[[tests]]
name = "transpose_walks_each_arm_of_a_branch.nvm"
desc = "`transpose` of a function with a branch: each arm is a linear chain of its own, the cotangent runs backwards inside the arm that produced the value, and the condition is read as it was -- the same predicate, at the values the caller passed -- choosing the other arm. The transposed function therefore takes the parameters of `f` first and the cotangent last, which is the one shape for every function: `transpose(f)(x, 1.0)`. For `pick(x)` returning `2*x` when `x > 0` and `3*x` otherwise, the cotangent 1.0 pulls back to 2 at a positive x and 3 at a negative one. `merged(x)` uses its parameter twice on one side only (`2*x + 5*x`, else `4*x`), so the two sides answer 7 and 4: within an arm two cotangents add, while the two arms' cotangents are joined rather than added, because only the arm that ran contributed one. The reading names the arms it built (`arms=2`), the rules it applied, and the type the resolver and the graph agree on."
kind = "behavior"
case = "../../../cases/compile/transforms/transpose_branch.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_stdout_contains = ["TRANSPOSE function=pick graph=", "type=(float, float) => float nodes=9 arms=2 rhs=mul_t", "TRANSPOSE function=merged graph=", "nodes=12 arms=2 rhs=add_t,mul_t", "2.0", "3.0", "7.0", "4.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "transpose_runs_a_loop_rounds_backwards.nvm"
desc = "`transpose` of a loop whose body only uses constants: the rounds run in the other direction, and a constant multiplier is the same multiplier whatever order it arrives in, so a loop of the same number of rounds with each rule replaced by its transpose is the pullback. The round count is the loop's own -- the two bounds of the interval are copied with the loop, and nothing in the case says three -- which the four-round loop in the same file settles: it answers 16 where the three-round one answers 8. For `thrice(x) = loop s = x for i in 0..3 do s * 2.0` the value at x = 1 is 2*2*2 = 8 and the pullback of 1.0 is 8 too; a pullback is linear in its cotangent, so 2.0 at x = 1 pulls back to 16, and that is the same graph read twice. A body that needed the round's own state would be refused by name (`skip=state` with the origin), never answered with a cotangent from nowhere."
kind = "behavior"
case = "../../../cases/compile/transforms/transpose_loop.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_stdout_contains = ["TRANSPOSE function=thrice graph=", "type=(float, float) => float", "nodes=11 arms=0 rhs=mul_t", "TRANSPOSE function=quad graph=", "8.0", "16.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# A loop body that reads a value from outside its own region sends a round's cotangent to that value,
# and the loop hands back one state -- so the transpose used to refuse. It now carries those
# cotangents as states of its own: one accumulator per escaped value, all beside the one carried
# cotangent, all advanced by the same rounds. It is one loop, not one loop per escape. The reading did
# not go away when the fix landed: `captures` is how many values escaped and one `ESCAPE` line still
# names each of them -- the value the cotangent landed on (`target`), the node whose rule handed it
# out (`from`, always an `Oper`: the body's own product, never a port), and the loop's `norm` and
# `with` inputs, which stay the old loop's own.
#
# `carried=` replaced `skip=state`, and `answer=` says which of two things a count means, because
# "two escapes" is not one situation: `answer=summed` is one value read by several products (the
# products add into one sum, and if that value is also the one the state starts from, the state's
# cotangent adds to it) -- 15 and 22 below. `answer=per-target` is several values, one sum each, and
# nothing is added across values -- `read_outer` below, whose 29 is 15 through `x` and 14 through `k`.
#
# A loop that already carries two states before anything escapes -- `carried` below -- needs one
# cotangent per state, not one, and the loop's value is then a tuple. Using it means reading a
# component (`t.0`), which is where the second channel starts: a component read fills that slot of the
# tuple's cotangent and leaves the rest zero, so `first` answers 1 and `second` answers 2 from the same
# tuple, and `carried` answers 10 with its accumulators after the two states. Before that channel every
# one of the three refused at `skip=output`, and with it every tuple-shaped value in a transposed
# function refuses the same way -- which is what the switch flips.
#
# Three readings then take the same ruler to the rest of the channel: the second state of that loop
# (`carried_p`, 7 rather than 10, which only the slot index can tell apart), a tuple inside a tuple
# (`nested`, `t.0.1`, where the cotangent is a tuple in a tuple's slot), and both slots of one tuple
# read at once (`both`, 3, where two reads are two slots of one cotangent and add). Each case answers
# its transpose twice, the second time with twice the cotangent, because a plan line the forward
# reading already satisfies cannot tell a working transpose from a silent zero -- `nested` answered 0.0
# for exactly that reason until the tuple-in-a-tuple rule was written, and its forward 2.0 had hidden
# it.
[[tests]]
name = "transpose_loop_escape.names_the_value_one_read"
desc = "`read_one(x) = loop s = x for i in 0..3 do 2.0*s + x` reads the parameter inside the loop body, so every round's cotangent lands on `x` and has to leave the loop. The loop carries it as a second state and answers 15 -- `s = 2s + x` three times is `8x + 7x`, the state's own cotangent 8 plus the carried sum 7 -- where before this cut it refused with `skip=state`. The reading is kept: `carried=1` in place of `skip=state`, `answer=summed` because the escaped value is the one the state starts from, `captures=1`, and the `ESCAPE` line still names the parameter port as the target and the body's `add` as the product that handed the cotangent out. A channel that dropped that line when it started working could not be compared with the refusal it replaced."
kind = "behavior"
case = "../../../cases/compile/transforms/transpose_loop_escape_reads_one.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code"]
expect_exit = 0
expect_output_contains = ["TRANSPOSE function=read_one carried=1 node=10 origin=0 captures=1 answer=summed", "ESCAPE target=0 from=9 kindOfFrom=11 kindOfTarget=1 typeOfTarget=float norm=[3,0,] with=[9,11,]", "TRANSPOSE function=read_one graph=", "type=(float, float) => float", "15.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "transpose_loop_escape.one_value_read_twice_is_one_capture"
desc = "`read_twice(x) = loop s = x for i in 0..3 do 2.0*s + x + x` reads the parameter through two different `add`s, so two products hand a cotangent to the same value. The count is `captures=1`: the collection is keyed by the value that escaped, not by the product, and the two products' cotangents add into one sum, so the line says `answer=summed` -- 22, since `s = 2s + 2x` three times is `8x + 14x`, where keying by product would hand the cotangent back twice and 15 would be the previous file's number. `from` names the product the reverse walk reached first."
kind = "behavior"
case = "../../../cases/compile/transforms/transpose_loop_escape_reads_twice.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code"]
expect_exit = 0
expect_output_contains = ["TRANSPOSE function=read_twice carried=1 node=11 origin=0 captures=1 answer=summed", "ESCAPE target=0 from=10 kindOfFrom=11 kindOfTarget=1 typeOfTarget=float norm=[3,0,] with=[10,12,]", "22.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "transpose_loop_escape.two_values_of_two_kinds"
desc = "`read_outer(x) = let k = x*x; loop s = x for i in 0..3 do 2.0*s + k + x` reads two values from outside the body, of two different kinds: `x` is the function's parameter port and `k` is a product computed before the loop. Each gets an accumulator of its own -- `carried=2` beside the one carried cotangent, one loop with three states -- and the line says `answer=per-target`, because these are two values and not two reads of one: `x`'s slot is the state's cotangent plus its sum (8 + 7 = 15) while `k`'s sum (7) goes to `k` alone and its product carries it to `x` as 7 * 2x = 14. The answer is 29 at x = 1, and 22 or 15 would be a sum taken across values that are not the same value. Both `ESCAPE` lines still print, with `kindOfTarget` 1 (a port) and 11 (an operand) -- the two kinds this cut has to tell apart."
kind = "behavior"
case = "../../../cases/compile/transforms/transpose_loop_escape_reads_outer.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code"]
expect_exit = 0
expect_output_contains = ["TRANSPOSE function=read_outer carried=2 node=12 origin=0 captures=2 answer=per-target", "ESCAPE target=0 from=11 kindOfFrom=11 kindOfTarget=1 typeOfTarget=float norm=[4,0,] with=[11,13,]", "ESCAPE target=1 from=10 kindOfFrom=11 kindOfTarget=11 typeOfTarget=float norm=[4,0,] with=[11,13,]", "29.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

