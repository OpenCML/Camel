# row into `grad_across_a_call` above. The number moved and the case file stayed on disk with nothing
# reading it -- which is exactly what `gate.case_ledger` reports: a case no code reaches cannot fail,
# so a change that broke it would be invisible. It is not deleted. The record is the point, and the
# rule this pair keeps is "a wall that falls turns its assertion into a number": the mark goes in the
# same commit that pins the number, and `flat` -- the same arithmetic written flat -- must still
# answer 12.0, because a fix that moved that number would be a fix that broke the path which was
# already right.
