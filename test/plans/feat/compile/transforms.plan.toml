[[tests]]
name = "transpose_loop_escape.int_is_a_zero_tangent_space"
desc = "An escape whose target is not a float: `int_escape(x) = let n = int(3x); loop s = x for i in 0..3 do s + float(n)` reads an integer inside the loop body, and the answer is 1.0 -- `x` contributes 1 and the truncation contributes 0, because an integer is a zero tangent space and `float(int(3x))` is a step function that is constant between its jumps. The forward reading is pinned with it: 10.0 is 1 plus three rounds of `int(3)`, so the integer is really there and really used. The two controls are the other half: `g(x) = float(int(5x)) + x` is 1.0 (an integer branch beside a float one does not swallow it), `h(x) = x + x` is 2.0 (no integer anywhere, and not 1). Every transpose is asked twice at different cotangents, and the second answer -- 5.0, 3.0, 4.0 -- is on no forward line, so the answer has to scale with the cotangent and cannot be satisfied by a reading of the value; `skip=` must not appear at all, because this shape used to answer a refusal and a refusal is not an answer. The zero is not printed by a reading of its own: the integer is a closure capture port of the backward half, no cotangent is handed to a capture port, and `noteZero` therefore has no delivery to name (docs/handover/questions/2026-11-03-does-note-zero-cover-a-closure-capture-port.cn.md). What the numbers say is the whole claim."
