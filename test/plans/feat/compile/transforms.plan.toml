# The gradient of a loop, read through the library and nothing else.
#
# The stop this pins: `vjp` over a loop used to end at `transpose` of `split`'s backward half with
# `skip=state`, because that half reads the round's *primal* values -- the tape `split` appends one
# member of per round -- and the reverse loop had nowhere to hand them in
# (`arm-stop ... callee=autodiff::add_tangent<float>` after the arm's first value argument). The
# backward half itself was never wrong: `split(jvp(f))`'s `lin(1.0)` answered the tangent before and
# answers it now. What was missing is the wire the case reads: the round's element port is the one
# value both loops have, and it is where the tape's per-round residuals come from.
#
# The numbers are paper first: `f(x) = loop s = 0.0 for i in [1.0, 2.0, 3.0, 4.0] do s + x*x*i`
# adds `i*x*x` once per round, so `f(x) = x*x*(1+2+3+4) = 10x^2`, `f(3) = 90`, `f'(x) = 20x` and
# `f'(3) = 60`; the pullback is linear in its cotangent, so `pullback(2.0).0` is `120.0`. The weights
# are what makes it a tape pin and not just a loop pin: every round reading the same element would
# answer `24`.
#
# The round *order* is not what this pins, and cannot be: each round's map is `ds + 2x*dx*i`, a sum of
# scalars, and a sum does not care in which order it is added. `vjp` over a loop does not walk the
# rounds backwards yet (`docs/design/program-transforms` 4.2/4.3; the 2026-11-02 question page on
# reversing a backward), so the case pins the value the tree can produce and says so in its comment.
[[tests]]
name = "vjp_loop_gradient.nvm"
desc = "The library's gradient through a loop: `vjp(f)`/`grad(f)` at 3 for `f(x) = loop s = 0.0 for i in [1.0, 2.0, 3.0, 4.0] do s + x*x*i`. On paper `f(x) = 10x^2`, so the value is 90, the cotangent of `1.0` is `(60.0)`, the gradient 60, and the cotangent of `2.0` is 120 (a pullback is linear in its cotangent). The per-round weights 1,2,3,4 are the tape's own: a backward half that paired every round with one element would answer 24. The reading also pins the two halves: `split` carries `tape=4 invariants=1` and the transposed half reports `carried=1 ... answer=per-target`."
kind = "behavior"
case = "../../../cases/compile/transforms/vjp_loop_gradient.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_output_contains = ["REINTERP split function=jvp_of_f", "tape=4 invariants=1", "TRANSPOSE function=split_of_jvp_of_f_backward carried=1", "answer=per-target", "vjp_loop value=90.0", "(60.0)", "vjp_loop cotangent=60.0", "vjp_loop grad=60.0", "vjp_loop linear-in-ct=120.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 20000

