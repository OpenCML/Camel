# Marked known_fail on 2026-11-04, against the author's ruling of 2026-11-03 00:30 (a case that cannot
# pass today belongs in the plan with a mark, an owner and a reason, not outside it). The number this
# case asks for is 29 at x = 1, and 29 is `15 + 7 * 2x`: a function of `x`, not of the cotangent alone.
# A transposition is handed the cotangent and no operand -- the member's type here is
# `(float) => (float,)` -- so no member can read 29 off `back(1.0)` without inventing `x = 1`; this
# case's own paper passes two arguments (`transpose(read_outer)(1, 1)`, case comment line 13) while its
# `main` passes one. Both routes were measured on 2026-11-04 and both refuse by name, so this is not a
# missing rule:
#  - `transpose(read_outer)` stops at `TRANSPOSE function=read_outer skip=cotangent-needs-a-value
#    uri=:op/mul_d position=0 reason=the rule's right side reads a value the caller does not carry`:
#    `k = x * x`'s law reads the other operand's value, `x` is a parameter a cotangent is answered for
#    (so it is no port of the member), and a `float` has no shape carrier to answer it from.
#  - `split(jvp(read_outer))` stops at `REINTERP split function=jvp_of_read_outer skip=forward
#    construct=a tangent port why=the value half reads the tangent of parameter 0, which the forward
#    half does not take`: the value chain of a lifted graph is a projection of a ruleset pair node, and
#    that node takes the tangents as inputs.
# What the case is about is already printed beside the refusal -- `TRANSPOSE function=read_outer
# carried=2 node=12 origin=0 captures=2 answer=per-target` and both `ESCAPE` lines, `kindOfTarget` 1 and
# 11 -- so the channel the case was written for is there and the last number is not. The mark goes away
# in the commit that answers
# `docs/handover/questions/2026-11-04-does-a-transposed-member-get-a-port-for-a-parameter-value.cn.md`,
# and the four pins above stay as the answer's, not as the refusal's.
[[tests]]
name = "transpose_loop_escape.two_values_of_two_kinds"
desc = "`read_outer(x) = let k = x*x; loop s = x for i in 0..3 do 2.0*s + k + x` reads two values from outside the body, of two different kinds: `x` is the function's parameter port and `k` is a product computed before the loop. Each gets an accumulator of its own -- `carried=2` beside the one carried cotangent, one loop with three states -- and the line says `answer=per-target`, because these are two values and not two reads of one: `x`'s slot is the state's cotangent plus its sum (8 + 7 = 15) while `k`'s sum (7) goes to `k` alone and its product carries it to `x` as 7 * 2x = 14. The answer is 29 at x = 1, and 22 or 15 would be a sum taken across values that are not the same value. Both `ESCAPE` lines still print, with `kindOfTarget` 1 (a port) and 11 (an operand) -- the two kinds this cut has to tell apart."
kind = "behavior"
case = "../../../cases/compile/transforms/transpose_loop_escape_reads_outer.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code"]
expect_exit = 0
expect_output_contains = ["TRANSPOSE function=read_outer carried=2 node=12 origin=0 captures=2 answer=per-target", "ESCAPE target=0 from=11 kindOfFrom=11 kindOfTarget=1 typeOfTarget=float norm=[4,0,] with=[11,13,]", "ESCAPE target=1 from=10 kindOfFrom=11 kindOfTarget=11 typeOfTarget=float norm=[4,0,] with=[11,13,]", "29.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
known_fail = ["nvm"]
known_fail_owner = "lane-valports"
known_fail_reason = "the transposed member has no value port for the parameter `x` (`modules/transforms/transpose.cpp#buildTransposeMember`), which is the port list `lane-valports` reports as the wall after the ordering problem: `docs/handover/questions/2026-11-04-how-is-a-two-port-transposed-value-called.cn.md`"
known_fail_msg = "skip=cotangent-needs-a-value uri=:op/mul_d position=0"
known_fail_note = "Waits on docs/handover/questions/2026-11-04-does-a-transposed-member-get-a-port-for-a-parameter-value.cn.md (does a transposed member get a port for the value of a parameter a rule reads?). Measured 2026-11-04 on this tree: the two readings the case exists for are printed (`carried=2 ... answer=per-target`, both `ESCAPE` lines with `kindOfTarget` 1 and 11), and the walk then stops at `TRANSPOSE function=read_outer skip=cotangent-needs-a-value uri=:op/mul_d position=0 reason=the rule's right side reads a value the caller does not carry` -- `k = x*x`'s law needs `x`'s value, `x` is a parameter a cotangent is answered for, and the member takes no port for it. 29 is `15 + 7*2x`, a function of `x`, so the number itself says the value has to travel; the case's paper passes two arguments and its `main` passes one, which is the same defect seen from the test's side. The mark goes away with the ruling, in the commit that answers the page and fixes that call."

