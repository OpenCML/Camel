# ---- the four laws of the 2026-11-03 tranche, and why they are not here ----
#
# `abs`, `log`, `maximum` and `minimum` are not linear, and `transpose` is defined for linear
# functions: the four `_t` laws that stood here were their pullbacks written a second time, beside
# the forward rules -- a second truth (author, 2026-11-04 06:55, `d79408e45`). They are gone, and a
# bare `transpose` of any of the four is refused at the build with a sentence that says only what the
# index can prove: the family holds no rule for the operator, `transpose` is for linear functions,
# take the gradient with `vjp`. The three entries below are the pair that keeps this honest -- two
# refusals and the `vjp` route that does answer -- plus the guard that an operator which does have a
# law still turns.

[[tests]]
name = "stop_gradient_gradient_through_the_engine"
desc = "`d(stop_gradient(x))/dx` at `x = 4` through the engine's own rules: the value passes through (`4.0`) and the gradient is the zero of its type (`0.0`). The engine's kernel is the identity slot (`modules/autodiff/operators.cpp#stopGradientKernel`) and the rule registered for the operator is `camel::core::noGradient`, which contributes nothing; the pullback then materializes the missing contribution as the zero of the value's own type (`modules/autodiff/pullback.cpp#Backward::checkGradientType`). Pinned as one reading, `value` and `gradient` together, because a cut that also changed the value would be a different operator."
kind = "behavior"
case = "../../../cases/compile/transforms/stop_gradient_gradient_through_the_engine.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["stop_gradient engine value=4.0 dL/dx=0.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "stop_gradient_gradient_through_the_library"
desc = "The same cut through `vjp`, which is `transpose(split(jvp(f)))`: both halves need a law, and neither existed -- `vjp` stopped in the *forward* half with `skip=rule uri=autodiff:stop_gradient reason=the operator has no forward rule bound at all`, which is the reading this entry was red with before `jvp_stop_gradient` and `stop_gradient_t` were written. The answer is the engine's to the number, `4.0` and `0.0`: the tangent of the result is the zero of its own type and the cotangent of the argument is the same zero, and the zero is the law's answer rather than a value standing in for one -- no operand is read, and the type is the operator's own signature's. `residuals=0` in the split's reading says the same thing from the other side: there is nothing to carry, because the tangent depends on no input."
kind = "behavior"
case = "../../../cases/compile/transforms/stop_gradient_gradient_through_the_library.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["stop_gradient library value=4.0 dL/dx=0.0", "residuals=0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

