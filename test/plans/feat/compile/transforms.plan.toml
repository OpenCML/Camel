# The two cases below read a GraphId (`closure graph=…`, `built graph=…`) and do not pin it. The id
# is positional: it comes from a counter that the ruleset's own rule graphs consume first, so adding
# a rule to `stdlib/rulesets/jvp.cml` shifts every id after it while the program stays exactly as
# correct. It was re-pinned twice in one day that way (107 -> 286 and 56 -> 236 when `jvp_pow` joined
# the family, then again by the two rules this lane added). Both readings now pass through
# `normalize_graph_ids` (`test/tools/normalizers.mjs`), the normalizer this repository already keeps
# for exactly this: it replaces `graph=<n>` with `graph=<GRAPH>` on a `REINTERP ` line, so the whole
# line is still asserted -- that a graph was reserved and named here, what it is laid out as, the
# slots it closes over, the node and region counts -- and the run's counter is not. A number a
# counter hands out is not a fact about this transform.
#
# The two assertions were each shown to fail before they were kept, by breaking the thing they name:
# one more node in the case's body read `nodes=15 exit=14`, and a renamed graph (the `feat/trans/macro`
# case's `iterate`, renamed `accumulate`) read `graph=3 name=accumulate` -- the same number under
# another name, which is precisely what a number cannot tell apart.
[[tests]]
name = "reinterp_builds_its_own_graph"
desc = "The first form of `reinterp` does two things and says them. It prints the other key the index holds, one line per operator: the left side of a rule is written `a + b` and a node names its operator by URI, so the instance records the URI its left side is written with, and the reading is `URI -> rule -> the GraphId of its right side` (`:op/div_d -> rule jvp_div -> rhs N`). Then it walks every function of the program that is made of operators -- for `f(x) = x*x + 3/x` that is `f`, with three primitives and two constants -- and builds a graph of the transform's own for each, printing its GraphId and node count. It is not a transform yet: the graph it builds is a single port handed to the output, and the reading says exactly that, so the next step has a number to grow from instead of a claim to believe."
kind = "behavior"
case = "../../../cases/compile/transforms/reinterp_scalar.cml"
args = ["${case}", "transforms::reinterp", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["REINTERP uri :op/add_d -> rule jvp_add -> rhs ", "REINTERP uri :op/mul_d -> rule jvp_mul -> rhs ", "REINTERP uri :op/div_d -> rule jvp_div -> rhs ", "vars=x,w count=2", "fill=FunctionClosure slots=2", "type=(dx: float, dw: float) => float", "REINTERP closure graph=<GRAPH> layout=(float, float) built=yes slots=x,w", "REINTERP target=f primitives=1 other=2 graph=", "nodes=1", "1.5"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_graph_ids"]
timeout_ms = 20000

[[tests]]
name = "jvp_is_a_function_value"
desc = "`reinterp<jvp>(f)` is the operator `jvp(f)`, and it produces a new function (the author's ruling a824031aa), not a rewritten graph: the call builds a graph of the transform's own and answers with a function value naming it. The lifted signature is `(float, float) => (float, float)` -- the ordinary parameter becomes a value and its tangent, and the result is the pair -- so `jvp(f)(2.0, 1.0)` passes two numbers and reads back `(value, tangent)`. Both halves are computed by the new graph: for `f(x) = x*x + 3/x` at 2 the chain gives `f(2) = 5.5`, and the forward rules along it give `f'(2) = 3.25` (2x - 3/x^2, seeded with the 1.0 the caller passed). The rules are the ruleset's: the reading says `source=ruleset` and names what it applied (`jvp_mul`, `jvp_div`, `jvp_add`), because the transform reads `stdlib/rulesets/jvp.cml`'s index at the moment it builds -- there is no second table of laws in C++. A primitive with no rule there is refused by name (`skip=rule uri=...`), never answered with 0 or 1. The operator's own line, `REINTERP jvp op ...`, prints the spelling a declaration writes, the type the call resolved to, the lifted half, and the type of the graph the call answered with: the two have to be one string, and they are. The build also says what it made -- `REINTERP jvp built graph=… nodes=12 exit=11 regions=1 function=f` -- the member the lift reserved, the nodes and regions the draft holds before it is encoded, and the node the graph exits at. The one region is the draft's body: a draft is made with its body region (`GraphDraft`), so a graph with no control region still holds that one region and `region(0)` never has to answer with a record the draft does not have. The lift is the run-time kernel's, on every shape: there is one implementation of the transform and the call reaches it as a call."
kind = "behavior"
case = "../../../cases/compile/transforms/jvp_lifted.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["REINTERP jvp function=f graph=", "type=(float, float) => (float, float)", "exit=Tuple{chain,tangent} tangent=computed source=ruleset rules=jvp_mul,jvp_div,jvp_add", "REINTERP jvp op signature=(f: (..) => any) => (the parameters and their tangents) => (value, tangent)", "lifted=(float, float) => (float, float) pure graph=(float, float) => (float, float) pure same=yes", "REINTERP jvp built graph=<GRAPH> nodes=12 exit=11 regions=1 function=f", "5.5", "3.25"]
expect_stdout_not_contains = ["TRANSPOSE function=", "REINTERP "]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_graph_ids"]
timeout_ms = 20000

# A branch is a property of the graph, not of a node: its arms are regions, its value is the Join's,
# and each arm is interpreted on its own. `f(2) = 4` with `f'(2) = 4` and `f(-2) = 2` with
# `f'(-2) = -1` say the arm the condition chose is the arm that was differentiated -- the four numbers
# are also folded into one (4419) so a single string pins all of them.
[[tests]]
name = "jvp_branch.arms_are_each_interpreted"
desc = "`f(x) = if x > 0 then x*x else -x` is differentiated the way it is written: the condition is copied and read by the `Brch`, never differentiated, and each arm's exit becomes the lifted pair of the arm's value and its tangent, which is what the `Join` yields. So `jvp(f)(2.0, 1.0)` reads `(4, 4)` -- `2x` at 2 -- and `jvp(f)(-2.0, 1.0)` reads `(2, -1)`, the arm that was actually taken. The arms stay arms in the lifted graph (their nodes are copied into their own regions), so an operator only one arm uses is not computed for the arm that was not taken."
kind = "behavior"
case = "../../../cases/compile/transforms/jvp_branch.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["REINTERP jvp function=f graph=", "exit=Tuple{chain,tangent} tangent=computed source=ruleset rules=jvp_mul,jvp_neg", "4419"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# A loop's state is the LOOP node's value and its rounds are a region of the same graph, so lifting
# it is lifting the *state*: the node's value becomes the pair, the body's state port is a pair port
# whose halves the body reads through projections, and the region's result is the pair of the body's
# new value and its tangent. `f(x) = loop s = 0.0 for i in [1,2,3,4] do s + x*x` carries `x*x = 9`
# four times at x = 3 -- `f(3) = 36` -- and carries `8x = 24` four times -- `f'(3) = 24`. The number
# that says the tangent is *carried* and not recomputed is 24: keeping only the last round's
# derivative would read 6, which is what the case's comment records as the failure symptom.
[[tests]]
name = "jvp_loop.state_is_lifted"
desc = "A loop is reinterpreted by lifting its state, not by interpreting its body twice: the LOOP node's value is the state, the rounds are a region of the same graph, and the lifted graph carries `(value, tangent)` from the initial `(0.0, 0.0)` through every round. `jvp(f)(3.0, 1.0)` reads `(36, 24)` -- `36` is `x*x` added four times at x = 3, `24` is `8x` added four times -- and the reading names the rules it applied (`jvp_mul`, `jvp_add`). `6` would be the answer of a tangent recomputed from the last round alone, which is why the case's comment names it as the symptom."
kind = "behavior"
case = "../../../cases/compile/transforms/jvp_loop.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["REINTERP jvp function=f graph=", "type=(float, float) => (float, float)", "exit=Tuple{chain,tangent} tangent=computed source=ruleset rules=jvp_mul,jvp_add", "36", "24"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# The same lift, with the state an array instead of a float. The pair is `(float[], float[])` and the
# two readings beside it are the two columns of the loop's Jacobian, so a lift that loses the rounds'
# composition cannot pass by getting one column right.
[[tests]]
name = "jvp_loop.array_state_is_lifted"
desc = "A loop whose state is an array of floats is reinterpreted like a float one: the pair is `(float[], float[])`, the body region's result is a FILL whose tangent is the same FILL over the members' tangents, and the round's element arrives through the iterable, which is copied rather than paired. For `loop x = s for k in [1.0, 10.0] do [x[1], x[0] + x[1] * k]` the per-round map is `M_k = [[0,1],[1,k]]`, so two rounds give `M = [[1,1],[10,11]]`: `f(1,2) = (3, 32)` and the two seeds read `(1, 10)` and `(1, 11)`. The reading names the three rules it applied, `jvp_idx_arr` among them -- the array read is differentiated by the rule the ruleset already had. This does not lift a tuple or a struct state (that still stops at the body) and does not pin any walk order: the rules are elementwise, so every order gives these numbers."
kind = "behavior"
case = "../../../cases/compile/transforms/jvp_loop_array_state.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["REINTERP jvp function=f graph=", "type=(float[], float[]) => (float[], float[]) pure", "rules=jvp_idx_arr,jvp_mul,jvp_add", "value= [3.0, 32.0]", "dx= [1.0, 10.0]", "dy= [1.0, 11.0]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# The same lift with the state a struct, whose members are read by key rather than by number. Two
# programs, because the two places a member is read are different code paths: the state going in
# and out, and a `{ a: ..., b: ... }` literal in the body.
[[tests]]
name = "jvp_loop.struct_state_is_lifted"
desc = "A loop whose state is a struct is reinterpreted like a tuple one, with one difference the shape makes visible: a struct's members are read by key (`GCAccsKind::StructKey`) where a tuple's are read by number, so the projection has to be written as keyed for both the value and the tangent half -- reading it by the number the payload carries would project another member. Two programs pin it. `identity(s) = loop x = s for k in [1.0, 10.0] do x` is the identity, so its Jacobian is I and both seeds come back unchanged: `(1, 0)` and `(0, 1)`. `swap(s) = loop x = s for k in [1.0, 10.0] do { a: x.b, b: x.a + x.b * k }` has the per-round map `M_k = [[0,1],[1,k]]`, so `M = [[1,1],[10,11]]`, `swap(1,2) = (3, 32)`, and the seeds read `(1, 10)` and `(1, 11)`. The struct literal is lowered to a tuple fill, so the struct-ness lives at the boundary; a template or projection of the wrong shape shows up in these six numbers rather than in the graph's shape."
kind = "behavior"
case = "../../../cases/compile/transforms/jvp_loop_struct_state.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["REINTERP jvp function=identity graph=", "type=(Pair, Pair) => (Pair, Pair) pure", "identity value=  1.0   2.0", "identity d1= 1.0   0.0", "identity d2= 0.0   1.0", "REINTERP jvp function=swap graph=", "rules=jvp_mul,jvp_add", "swap value=  3.0   32.0", "swap d1= 1.0   10.0", "swap d2= 1.0   11.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# The walk order, pinned by a number. The program above answers the same two columns under every
# walk, so the pin is its pullback: with the rounds undone in the other direction `g(s) = f(s)[0]`
# has the gradient `s0 + s1` (`(1.0, 1.0)`), and undone in the order they were written it has
# `s0 + 10*s1` (`(1.0, 10.0)`). One cotangent, two numbers, no seed to argue about.
#
# Marked known_fail against the author's ruling of 2026-11-03 00:30 (a case that cannot pass today
# belongs in the plan with a mark, an owner and a reason, not outside it): the assertion is the
# answer the transform owes, not today's refusal, and the runner reports a marked case that passes
# as a failure, so the mark's removal is what this case asks for.
#
# Where the wall is today, read off the run rather than off the transpose site itself: `split` now
# builds both halves of this loop (`REINTERP split function=jvp_of_g forward=276 backward=277 ...
# residuals=1 loop=1 tape=5 invariants=0`), because the exit reads the loop's cell through one
# `TupleIndex` per side and those two projections are what the cut hands each half -- no body region
# is copied. The wall is one step later and is not a loop wall at all:
# `TRANSPOSE function=split_of_jvp_of_g_backward skip=call-value-computed-by-the-body param=0
# node=23 arg=2` -- the exit the backward half copies is `index_into(dxs, 0)`, whose array argument
# the backward half
# *recomputes* (the loop is copied into that half and its cell is a node there, not a residual), so
# the member built for the callee cannot be handed the array's **value**. (The word was
# `call-value-missing` until 2026-11-03, when one word was split into two: that one now means "the
# call does not carry the parameter's own value", and this refusal is the other shape -- the value is
# one this half computes out of a loop, so carrying it means transposing the body, not passing an
# argument. The split is in `modules/transforms/transpose.cpp`'s `unforwardedCause`, its sentence in
# `transpose_operator.cpp`, and `test/tools/transpose_refusal/check.py` holds the two words apart.)
# Measured 2026-11-03: the
# same refusal stands with and without the reverse walk in `modules/transforms/transpose.cpp` -- the
# walk is behind this wall, not in front of it, so the number this case asks for is not readable until
# the array argument at that call is carried instead of recomputed.
# Owner, re-read after the closure item landed (2026-11-03, `34788b554`: a closure member carries the
# parameter it is the value of, so a parameter value the second half reads is a residual): still the
# cut's residual set, and **not** the parameter tail. Measured again on that tree, the line has not
# moved by one field:
#   REINTERP split function=jvp_of_g forward=276 backward=277 type=(float[]) => (float, (float[]) =>
#     float pure) pure residuals=1 loop=1 tape=5 invariants=0
#   TRANSPOSE function=split_of_jvp_of_g_backward skip=call-value-computed-by-the-body param=0
#     node=23 arg=2
# `invariants=0` is the whole reason the closure item cannot be the owner: this backward half reads no
# parameter's value, so there is no member for the identity table to name and nothing for it to
# carry. The callee's member *was* built (`TRANSPOSE function=rulesets.jvp::index_into<float>
# graph=289 type=(int, float[], float) => (float[],) nodes=3 arms=0 rhs=idx_arr_t`, and its own zero
# reading `contribution=0 node=1 type=int space=none from=2` is printed because that index *is* handed
# a cotangent) -- what the call site cannot hand it is the array, which the backward half recomputes.
# So the missing thing is a residual for a value the half computes and then reads back, not a residual
# for a parameter. `transpose_loop_escape.int_is_a_zero_tangent_space` is not in this group any more
# (it answers its numbers on the same tree); `transpose_loop_escape.second_state_of_the_same_loop`
# still is.
#
# The reverse walk itself is *not* behind that wall any more (2026-11-03): `transpose`'s loop case now
# iterates `range(n - 1, -1, -1)` and reads each round's element with `:op/idx_arr` instead of copying
# the sequence, which is the shape the author named at 18:50 and the one path B of
# `docs/handover/questions/2026-11-02-does-reversing-a-backward-need-a-new-operator.cn.md` describes --
# no operator is added. Measured on this tree: the refusal below is identical with and without it, so
# the walk is behind the wall rather than in front of it, and the number this case asks for stays
# unreadable until the array argument at that call is carried instead of recomputed.
[[tests]]
name = "vjp_loop.rounds_are_undone_in_reverse"
desc = "The pullback of a two-round loop reads `(1.0, 1.0)` and not `(1.0, 10.0)`: for `loop x = s for k in [1.0, 10.0] do [x[1], x[0] + x[1] * k]` the per-round map is `M_k = [[0,1],[1,k]]`, so `M = M_10 * M_1 = [[1,1],[10,11]]`, and a pullback must apply `M_1^T` after `M_10^T` -- the rounds are undone in the other direction (design 4.2/4.3). Reading the loop's first component, the correct walk gives the gradient `(1.0, 1.0)` and a copied range gives `(1.0, 10.0)`; the two numbers separate the walks and nothing else in the program has to change. `vjp` takes a function whose result is a `float` (the cotangent of the result is the seed), so the pullback's subject is `g(s) = (loop ...)[0]` -- the same loop, the same two numbers."
kind = "behavior"
case = "../../../cases/compile/transforms/vjp_loop_rounds_walk_backwards.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
known_fail = ["nvm"]
known_fail_msg = "split_of_jvp_of_g_backward skip=call-value-computed-by-the-body param=0 node=23"
known_fail_note = "倒序本身已经做了（`transpose` 侧不再照抄 iterable）；这条用例仍红是因为 backwards 里 `index_into` 的数组参数是重算的、不是残差。**这一项不是作者第 1 项**：那一项（参数原值作为残差进闭包）已于 `34788b554` 落地，而这半的 `invariants=0` —— 它不读任何参数的值，身份表里没有成员可写，所以它不可能被那一项修好；缺的是"这半自己算出来又读回去的值"的残差。摘标记的前提是先有 `grad= [1.0, 1.0]` 这个读数，今天没有。`split` builds both halves; the refusal is one step before the walk, at the call the backward half recomputes (`index_into(dxs, 0)`), whose array argument is not a residual the cut carries."
expect_exit = 0
expect_output_contains = ["value= 3.0", "grad= [1.0, 1.0]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# A loop whose body never reads the state's tangent -- `s + 1.0`, where the derivative does not
# flow through the state at all -- is still lifted: the tangent is carried as zero, and the value is
# what the loop computes. The pair is the loop's value whether or not anything differentiates it.
[[tests]]
name = "jvp_loop.value_only_is_still_lifted"
desc = "A loop whose body does not touch the state's tangent (`s + 1.0` four times, so `f(3) = 4`) is lifted all the same: the state is carried as `(value, tangent)` from `(0.0, 0.0)`, the body reads only the value half, and the derivative stays 0 -- it does not flow through the state. The reading still says `tangent=computed source=ruleset`, and `jvp(f)(3.0, 1.0)` reads `(4, 0)`."
kind = "behavior"
case = "../../../cases/compile/transforms/jvp_loop_value_only.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["REINTERP jvp function=f graph=", "type=(float, float) => (float, float)", "4.0", "0.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# The initial state is lifted like every other node: a constant gets the zero tangent, a value that
# comes from the input gets the tangent the chain computed for it. `s = x`, three rounds of `s * x`:
# `f(x) = x**4`, so `f(3) = 81`, `f'(3) = 108` -- not `(81, 0)`, which is what a lift that starts
# every state at `(value, 0)` reads, and not `(0, 0)` either.
[[tests]]
name = "jvp_loop.init_from_input_is_lifted"
desc = "A loop whose state starts at the input, not at a constant: `loop s = x for i in [1, 2, 3] do s * x` is `f(x) = x**4`, so `jvp(f)(3, 1)` reads `(81, 108)`. The initial state's tangent is not zero-by-default: the state is a node on the chain like any other, so `x` hands in `x`'s tangent and only a constant hands in zero. `(81, 0)` and `(0, 0)` are both distinguishable from `(81, 108)`, so the two numbers name the defect if the initial state is ever wired as `(value, 0)` again."
kind = "behavior"
case = "../../../cases/compile/transforms/jvp_loop_init_from_input.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["REINTERP jvp function=f graph=", "81.0", "108.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# An effect is executed as written, not differentiated: the print inside `g` runs once (the same
# number of times the original body ran it), and a number's tangent is still nonzero beside it.
[[tests]]
name = "jvp_effect.runs_as_written_and_zero_tangent"
desc = "A function with an effect (`println` in the body) is lifted so that the effect keeps running exactly as often as it did -- once -- while the numeric part is differentiated: `g(x) = x*x` with a print reads `effect`, then `9.0` and `6.0`. The effect has no tangent and none is invented for it, but the tangent of the value does not become zero because an effect sits beside it, which is what a lift that gave up on the whole straight line at the first effect would read."
kind = "behavior"
case = "../../../cases/compile/transforms/jvp_effect.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
# The count: `g(3.0)` prints `3.0` once and the lifted `g` prints it once, so exactly two `3.0`
# lines appear (the plain call's print, then the lifted call's print) -- a third would mean the
# lift ran the effect again, and a single one would mean it dropped it. `9.0` and `6.0` are the
# value and the tangent of the lifted call, and the plain call's `9.0` is the third.
expect_output_contains = ["REINTERP jvp function=g graph=", "3.0\n9.0\n6.0"]
expect_stdout_not_contains = ["3.0\n3.0\n3.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# A call is lifted as a call: the callee gets a lifted graph of its own, and it gets exactly one --
# `f(x) = g(x) + g(x)` calls `g` twice and the reading says `callees=1`. The numbers are checked
# against the derivative written by hand: `g(x) = x*x`, `f(x) = 2*x*x`, so `f(3) = 18` and
# `f'(3) = 4x = 12`.
[[tests]]
name = "jvp_call.callee_is_lifted_once"
desc = "A function that calls another one is reinterpreted through the call, not around it: a `Func` node names the callee graph, so the lift gives the callee a graph of its own with the lifted signature, and the call passes `(value, tangent)` in and answers with the pair. `f(x) = g(x) + g(x)` with `g(x) = x*x` reads `(18, 12)` at `x = 3, dx = 1` -- `f = 2x*x`, `f' = 4x` -- and `REINTERP jvp callees=1` says the two calls of `g` made one graph, not two."
kind = "behavior"
case = "../../../cases/compile/transforms/jvp_call.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["REINTERP jvp function=g graph=", "REINTERP jvp function=f graph=", "REINTERP jvp callees=1", "18.0", "12.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# The negative side of the same rule table, and the point of it: a primitive the ruleset has no rule
# for is not answered with 0 or 1 and is not only printed at -- it is a diagnostic that names the
# primitive and stands *where the primitive is written*. `pow` is `math:pow_d`, which no forward rule
# is bound for, so `jvp(f)` cannot build; the error is at `f`'s `pow` (`file:line:col`) and the
# process stops without running `main`, while the call site is kept beside it as a related position.
[[tests]]
name = "rulesets_probe_missing.at_the_primitive"
