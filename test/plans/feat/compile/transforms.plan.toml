[[tests]]
name = "extent_of_is_not_shape"
desc = "`extent_of` is not a second name for `shape`: `shape(xs)` asks a value and `extent_of::<A>()` asks a type. This case pins both halves in one program -- on `float[2, 3]` the type states what the value has, so `shape(t) == extent_of::<float[2, 3]>()` is `true`; on `float[...]` only the value states it, so `shape(t)` still answers `[2]` while `extent_of::<float[...]>()` is the refusal its sibling entry pins. Neither function may drift into being the other: the first line would stop being `true`, or the second would stop answering."
kind = "behavior"
case = "../../../cases/compile/transforms/extent_of_is_not_shape.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["true", "[2]"]
expect_output_not_contains = ["PassInternalError", "internal error", "defect of the compiler"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# The two special cases of `extent_of`, one entry each: what a known operand changes about the
# answer (nothing: the type is the source, and the value is not read), and what an open position
# costs (a refusal that names it).

[[tests]]
name = "extent_of_answers_a_known_operand"
desc = "A known operand does not change the question: `extent_of::<A>()` answers the type's extents whether a value of that type is in the function's hands or not, and it never reads the value. Four spellings answer `[2, 3]` -- a call with nothing of the type at hand (`from_type`), a call in a function whose parameter `xs` is a known operand (`shape_of`), the name handed on as a value to a function that has no type argument of its own (`takes_it(extent_of::<float[2, 3]>)`), and the same name where a position states a function type (`typed_binding`) -- and the fifth line is the control: `shape(xs)` reads the operand and answers the same list, so the two sources agree here and the entry would say so the day they stop. Two of those spellings were red: measured 2026-11-04 on `ca464bca2` the third and the fourth each stopped the run with `RuntimeDiag::PassInternalError` ('Pass ''calling `extent_of`'' failed with an internal error'), which is the compiler complaining about a program that is right, because the answer existed in the type argument written at that position and only the run had nothing left to read. They are settled where the name is used as a value now (`Builder::functionValueOf`, `Builder::overloadValueFor`), and the answer is a function of no parameters that gives the list."
kind = "behavior"
case = "../../../cases/compile/transforms/extent_of_answers_a_known_operand.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "[2, 3]\n[2, 3]\n[2, 3]\n[2, 3]\n[2, 3]\n"
expect_output_not_contains = ["PassInternalError", "internal error", "defect of the compiler"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "extent_of_answers_a_known_operand.graph"
desc = "The other half of the same reading, and the one that can fail while the numbers stay right: the graph holds the answer itself. `std::gir` of the case above shows a `DATA` node labelled `[2, 3]` of type `int[]` and **no** `:op/extent_of` node at all -- no operand of the answer exists to read, so nothing of `xs` reaches it. A reader that took the shape from the value (as `shape(xs)` does) would print the same four lines and put an OPER node in the graph, so this entry, not the numbers, is what says the answer is the type's."
kind = "behavior"
case = "../../../cases/compile/transforms/extent_of_answers_a_known_operand.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
expect_output_contains = ["label=\"[2, 3]\"", "value_type=\"int[]\""]
expect_output_not_contains = [":op/extent_of"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "extent_of_names_the_open_position"
desc = "A type whose shape is not written down is refused, and the sentence names the **position** that is open, because that position is where the repair is written: `float[...]` states no rank at all, so position 0 is the open one and `..` gives no position after it a length; `float[2, ?]` states two positions and leaves the second without a number; `float[]` (= `float[?]`) has one position and no length for it. Measured 2026-11-04 on `ca464bca2` the sentence was 'an extent it writes is not a number' -- a reader who wrote `float[2, ?]` had to find the second extent themselves -- and all three refusals are reported together, each at its own call. The refusal must stay a refusal: `[]` would be the rank-zero shape, which `sum_to` reads as one element, a wrong number no diagnostic would name."
kind = "negative"
case = "../../../cases/compile/transforms/extent_of_names_the_open_position.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ExtentOfNeedsStatedShape"
expect_output_contains = ["the type it is instantiated at is 'float[...]', and position 0 is open: `..` states no dimension there, so no position has a length to read", "the type it is instantiated at is 'float[2, ?]', and position 1 is open: it has no number written in it", "the type it is instantiated at is 'float[]', and position 0 is open: it has no number written in it", "take the shape from a value the program has"]
expect_output_not_contains = ["PassInternalError", "internal error", "defect of the compiler"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "chain_place_after_a_branch"
desc = "The statement a `sync` block writes after a call whose inlined body ends inside a branch arm. `pick`'s body is one branch and each arm ends with an effect, so nothing of the body is left outside the arms; the caller writes `let first = pick(1)` and then prints. The two statements cannot be joined by a `sync` edge -- the arm the other branch takes does not run whenever the print does (docs/design/effects/edges.cn.md 4.6, docs/technical/17_graph_rewrite_api_contracts.md 4.1) -- so the print heads its own block's chain and the order the splice owes it is the order edge written beside the call. The numbers are the case's own: `pick(1)` is 10 and `pick(-1)` is 20. It was red while the same judgement was applied to the handover a pruned branch makes, where the arm's code *does* become the block's code: `pick: not positive` was dropped, a wrong answer rather than a refusal, and that is the line this entry pins."
kind = "behavior"
case = "../../../cases/compile/transforms/chain_place_after_a_branch.cml"
args = ["${case}", "std::macro", "std::opt", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["pick: positive", "after 10", "pick: not positive", "after 20"]
expect_output_not_contains = ["PassInternalError", "internal error", "defect of the compiler", "branch-arm invariant"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "transpose_refuses_a_nonlinear_operator"
desc = "`abs` is not linear, so it has no transpose, and a bare `transpose` of it stops at the build. The sentence names the operator, says the family holds no rule for it, and points at the way a gradient is taken (`vjp`). It deliberately does **not** say `abs` is not linear in its parameter: that fact lives in the forward family's index, which a program importing only `rulesets.transpose` does not carry, and a wrong explanation is worse than none because a reader acts on it (`docs/handover/questions/2026-11-04-must-a-transpose-refusal-claim-the-operator-is-not-linear.cn.md`). The right numbers for `abs` are pinned where they belong, through `vjp`, in `vjp_answers_abs_log_maximum_and_minimum` -- only one of the two routes is supposed to answer, which is what makes them a pair."
kind = "negative"
case = "../../../cases/compile/transforms/transpose_refuses_a_nonlinear_operator.cml"
args = ["${case}"]
expect_exit = 1
expect_stdout_contains = ["operator `tensor:abs`", "the family holds no rule for `tensor:abs`", "`transpose` is for linear functions", "take the gradient with `vjp`"]
timeout_ms = 20000

[[tests]]
name = "transpose_refuses_maximum"
desc = "The same refusal for `maximum`, and the case that `transpose_laws_of_maximum_and_minimum_are_refused` became: that entry pinned `skip=rule-ranks`, an instantiation that could never be made, waiting for a law that the author's 2026-11-04 ruling answered should not exist at all. This one pins a language rule instead of a gap -- the family holds no rule, `transpose` is for linear functions, take the gradient with `vjp` -- so the day the law is (wrongly) restored, this entry fails and names it."
kind = "negative"
case = "../../../cases/compile/transforms/transpose_refuses_maximum.cml"
args = ["${case}"]
expect_exit = 1
expect_stdout_contains = ["operator `tensor:maximum`", "the family holds no rule for `tensor:maximum`", "take the gradient with `vjp`"]
timeout_ms = 20000

[[tests]]
name = "vjp_answers_abs_log_maximum_and_minimum"
desc = "The route that does take these gradients, element by element: `split` cuts the forward half out and the transpose turns the **linear** half, so `vjp` answers `abs` at [1, -2, 3] as [1.0, -1.0, 1.0], `log` at [1, 2, 4] as [1.0, 0.5, 0.25], `maximum(x, [1,2,3])` at [0, 2, 4] as [0.0, 1.0, 1.0] and `minimum` there as [1.0, 1.0, 0.0]. Every number is the right one at its point, which is what the removed laws could not be asked to provide without writing the pullback a second time."
kind = "behavior"
case = "../../../cases/compile/transforms/vjp_answers_abs_log_maximum_and_minimum.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["abs vjp   = [1.0, -1.0, 1.0]", "log vjp   = [1.0, 0.5, 0.25]", "max vjp   = [0.0, 1.0, 1.0]", "min vjp   = [1.0, 1.0, 0.0]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "transpose_still_turns_linear_operators"
desc = "The guard for the refusal, and the case with the longer shadow: the sentence says \"the family holds no rule for this operator\", a fact about the index -- not a verdict about linearity -- so its failure mode is a **linear** operator whose law is there being refused by mistake, which would tell a reader to use `vjp` for a function `transpose` can turn around. This walks `Σx` -- one law, `sum` -- through a bare `transpose` and pins the map's own answer, the cotangent spread to every element: [1, 1, 1]. What it measures is **\"the law is still there and still usable\", not \"the conclusion is right\"** -- the second is `abs_gradient_both_legs`'s and `vjp`'s, and the two claims must not be confused. Its operator is `sum`, not "any linear operator": it was chosen because a composite of `mul`, `add` and `neg` over an array is refused today **one step later than a missing law**: measured, `Σ(2x+1)` answers `skip=rule-ranks uri=tensor:multiply rule=mul_tensor_t node=2 position=0 ranks=(1, ..)` -- the law is found and its instance cannot be made (`sum_to` needs the broadcast product's shape stated, which another line is repairing). That is neither `skip=rule reason=unbound` (no law) nor `cotangent-needs-a-value` (a law whose right side cannot reach a value), and the difference matters here: a guard written on a composite would go red for a reason that is not this guard's, and a guard written on an operator that merely happens to work today proves that one path is alive -- not the class. **A guard written on a lucky sample goes red the day the sample dies, while the thing it guards may have been healthy throughout**, which is why the reason for the sample is written here rather than left to the run."
kind = "behavior"
case = "../../../cases/compile/transforms/transpose_still_turns_linear_operators.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["total ct=1.0 ([1.0, 1.0, 1.0])  right=[1.0, 1.0, 1.0]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
