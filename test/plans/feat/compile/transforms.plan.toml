[[tests]]
name = "reinterp_builds_its_own_graph.nvm"
desc = "The first form of `reinterp` does two things and says them. It prints the other key the index holds, one line per operator: the left side of a rule is written `a + b` and a node names its operator by URI, so the instance records the URI its left side is written with, and the reading is `URI -> rule -> the GraphId of its right side` (`:op/div_d -> rule jvp_div -> rhs N`). Then it walks every function of the program that is made of operators -- for `f(x) = x*x + 3/x` that is `f`, with three primitives and two constants -- and builds a graph of the transform's own for each, printing its GraphId and node count. It is not a transform yet: the graph it builds is a single port handed to the output, and the reading says exactly that, so the next step has a number to grow from instead of a claim to believe."
kind = "behavior"
case = "../../../cases/compile/transforms/reinterp_scalar.cml"
args = ["${case}", "transforms::reinterp", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_stdout_contains = ["REINTERP uri :op/add_d -> rule jvp_add -> rhs ", "REINTERP uri :op/mul_d -> rule jvp_mul -> rhs ", "REINTERP uri :op/div_d -> rule jvp_div -> rhs ", "vars=x,w count=2", "fill=FunctionClosure slots=2", "type=(dx: float, dw: float) => float", "REINTERP closure graph=107 layout=(float, float) built=yes slots=x,w", "REINTERP target=f primitives=1 other=2 graph=", "nodes=1", "1.5"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "jvp_is_a_function_value.nvm"
desc = "`reinterp<jvp>(f)` is the operator `jvp(f)`, and it produces a new function (the author's ruling a824031aa), not a rewritten graph: the call builds a graph of the transform's own and answers with a function value naming it. The lifted signature is `(float, float) => (float, float)` -- the ordinary parameter becomes a value and its tangent, and the result is the pair -- so `jvp(f)(2.0, 1.0)` passes two numbers and reads back `(value, tangent)`. Both halves are computed by the new graph: for `f(x) = x*x + 3/x` at 2 the chain gives `f(2) = 5.5`, and the forward rules along it give `f'(2) = 3.25` (2x - 3/x^2, seeded with the 1.0 the caller passed). The rules are the ruleset's: the reading says `source=ruleset` and names what it applied (`jvp_mul`, `jvp_div`, `jvp_add`), because the transform reads `stdlib/rulesets/jvp.cml`'s index at the moment it builds -- there is no second table of laws in C++. A primitive with no rule there is refused by name (`skip=rule uri=...`), never answered with 0 or 1. The type the reading prints is the one `jvpSignature` builds, and it is the same string `JvpResolver` gives the operator."
kind = "behavior"
case = "../../../cases/compile/transforms/jvp_lifted.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_stdout_contains = ["REINTERP jvp function=f graph=", "type=(float, float) => (float, float)", "exit=Tuple{chain,tangent} tangent=computed source=ruleset rules=jvp_mul,jvp_div,jvp_add", "REINTERP jvp op signature=(f: (float) => float) => (float, float) => (float, float)", "lifted=(float, float) => (float, float) graph=(float, float) => (float, float) same=yes", "5.5", "3.25"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# A branch is a property of the graph, not of a node: its arms are regions, its value is the Join's,
# and each arm is interpreted on its own. `f(2) = 4` with `f'(2) = 4` and `f(-2) = 2` with
# `f'(-2) = -1` say the arm the condition chose is the arm that was differentiated -- the four numbers
# are also folded into one (4419) so a single string pins all of them.
[[tests]]
name = "jvp_branch.arms_are_each_interpreted"
desc = "`f(x) = if x > 0 then x*x else -x` is differentiated the way it is written: the condition is copied and read by the `Brch`, never differentiated, and each arm's exit becomes the lifted pair of the arm's value and its tangent, which is what the `Join` yields. So `jvp(f)(2.0, 1.0)` reads `(4, 4)` -- `2x` at 2 -- and `jvp(f)(-2.0, 1.0)` reads `(2, -1)`, the arm that was actually taken. The arms stay arms in the lifted graph (their nodes are copied into their own regions), so an operator only one arm uses is not computed for the arm that was not taken."
kind = "behavior"
case = "../../../cases/compile/transforms/jvp_branch.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_stdout_contains = ["REINTERP jvp function=f graph=", "exit=Tuple{chain,tangent} tangent=computed source=ruleset rules=jvp_mul,jvp_neg", "4419"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# The other construct this transform has no reading for yet, and the same rule about refusals: a
# loop's state is the LOOP node's value and its rounds are a region of the same graph, so lifting it
# is its own step. Until then the refusal stands at the loop -- `jvp_loop.cml:10:12`, the `loop`
# keyword -- and names it, instead of stopping at whichever operand the walk reached first with a
# `skip=body` reading and a fault at the `jvp(f)` call. The day the state is lifted this case becomes
# 36 / 24 (see the numbers in the case); today it is the diagnostic.
[[tests]]
name = "jvp_loop.refused_at_the_loop"
desc = "A loop is not reinterpreted yet, and the run says so where the loop is: the fault stands at `jvp_loop.cml:10:12` -- the `loop` keyword in `f` -- and names the construct and the reason (its state is a region of this graph). Before this it stopped at the call site with `skip=body`, which named nothing: a reading, not a diagnostic. The exit is non-zero, so no value from a graph that could not be differentiated is printed."
kind = "behavior"
case = "../../../cases/compile/transforms/jvp_loop.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 1
expect_output_contains = ["jvp_loop.cml:10:12: [Error]:", "jvp does not reinterpret a loop yet"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# The negative side of the same rule table, and the point of it: a primitive the ruleset has no rule
# for is not answered with 0 or 1 and is not only printed at -- it is a diagnostic that names the
# primitive and stands *where the primitive is written*. `pow` is `math:pow_d`, which no forward rule
# is bound for, so `jvp(f)` cannot build; the error is at `f`'s `pow` (`file:line:col`) and the
# process stops without running `main`, while the call site is kept beside it as a related position.
[[tests]]
name = "rulesets_probe_missing.at_the_primitive"
desc = "With a primitive carrying no forward rule, `jvp(f)` is a diagnostic and not a value: it names the operator (`math:pow_d`) and the reason no rule was found, and its position is the primitive's own -- `rulesets_probe_missing.cml:10:12`, the `pow` in `f` -- which is the position a reader has to be sent to, not the `jvp(f)` call. The reading line still names what was refused (`skip=rule uri=math:pow_d`), and the run's exit is non-zero: the program does not go on to print a value it could not differentiate."
kind = "behavior"
case = "../../../cases/compile/transforms/rulesets_probe_missing.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 1
expect_output_contains = ["skip=rule uri=math:pow_d", "rulesets_probe_missing.cml:10:12: [Error]:", "jvp has no forward rule for `math:pow_d`"]
expect_stdout_not_contains = ["5.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000