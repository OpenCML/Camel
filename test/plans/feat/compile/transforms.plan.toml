# written into the law -- the axis is normalized where the reduction's entry point already normalizes
# it (`modules/tensor/kernels/reduce.cpp#normalizeAxis`, at `k::reduceAxis`), and the lane length is
# the extent the list carries. The count half reads the operand (the ruling of 2026-11-03 16:15),
# which is why the positive spelling of the lane already passed
# (`mean_axis1_keepdims_gradient_reads_the_row_length`).
[[tests]]
name = "mean_axis_negative_axis.engine"
