[[tests]]
name = "reinterp_builds_its_own_graph.nvm"
desc = "The first form of `reinterp` does two things and says them. It prints the other key the index holds, one line per operator: the left side of a rule is written `a + b` and a node names its operator by URI, so the instance records the URI its left side is written with, and the reading is `URI -> rule -> the GraphId of its right side` (`:op/div_d -> rule jvp_div -> rhs N`). Then it walks every function of the program that is made of operators -- for `f(x) = x*x + 3/x` that is `f`, with three primitives and two constants -- and builds a graph of the transform's own for each, printing its GraphId and node count. It is not a transform yet: the graph it builds is a single port handed to the output, and the reading says exactly that, so the next step has a number to grow from instead of a claim to believe."
kind = "behavior"
case = "../../../cases/compile/transforms/reinterp_scalar.cml"
args = ["${case}", "transforms::reinterp", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_stdout_contains = ["REINTERP uri :op/add_d -> rule jvp_add -> rhs ", "REINTERP uri :op/mul_d -> rule jvp_mul -> rhs ", "REINTERP uri :op/div_d -> rule jvp_div -> rhs ", "vars=x,w count=2", "fill=FunctionClosure slots=2", "type=(dx: float, dw: float) => float", "REINTERP closure graph=107 layout=(float, float) built=yes slots=x,w", "REINTERP target=f primitives=1 other=2 graph=", "nodes=1", "1.5"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "jvp_is_a_function_value.nvm"
desc = "`reinterp<jvp>(f)` is the operator `jvp(f)`, and it produces a new function (the author's ruling a824031aa), not a rewritten graph: the call builds a graph of the transform's own and answers with a function value naming it. The lifted signature is `(float, float) => (float, float)` -- the ordinary parameter becomes a value and its tangent, and the result is the pair -- so `jvp(f)(2.0, 1.0)` passes two numbers and reads back `(value, tangent)`. Both halves are computed by the new graph: for `f(x) = x*x + 3/x` at 2 the chain gives `f(2) = 5.5`, and the forward rules along it give `f'(2) = 3.25` (2x - 3/x^2, seeded with the 1.0 the caller passed). The rules are the ruleset's: the reading says `source=ruleset` and names what it applied (`jvp_mul`, `jvp_div`, `jvp_add`), because the transform reads `stdlib/rulesets/jvp.cml`'s index at the moment it builds -- there is no second table of laws in C++. A primitive with no rule there is refused by name (`skip=rule uri=...`), never answered with 0 or 1. The operator's own line, `REINTERP jvp op ...`, prints the spelling a declaration writes, the type the call resolved to, the lifted half, and the type of the graph the call answered with: the two have to be one string, and they are. The build also says what it made -- `REINTERP jvp built graph=56 nodes=12 exit=11 regions=0 function=f` -- the member the lift reserved, the nodes and regions the draft holds before it is encoded, and the node the graph exits at. The lift is the run-time kernel's, on every shape: there is one implementation of the transform and the call reaches it as a call."
kind = "behavior"
case = "../../../cases/compile/transforms/jvp_lifted.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_stdout_contains = ["REINTERP jvp function=f graph=", "type=(float, float) => (float, float)", "exit=Tuple{chain,tangent} tangent=computed source=ruleset rules=jvp_mul,jvp_div,jvp_add", "REINTERP jvp op signature=(f: (float) => float) => (float, float) => (float, float)", "lifted=(float, float) => (float, float) pure graph=(float, float) => (float, float) pure same=yes", "REINTERP jvp built graph=56 nodes=12 exit=11 regions=0 function=f", "5.5", "3.25"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# A branch is a property of the graph, not of a node: its arms are regions, its value is the Join's,
# and each arm is interpreted on its own. `f(2) = 4` with `f'(2) = 4` and `f(-2) = 2` with
# `f'(-2) = -1` say the arm the condition chose is the arm that was differentiated -- the four numbers
# are also folded into one (4419) so a single string pins all of them.
[[tests]]
name = "jvp_branch.arms_are_each_interpreted"
desc = "`f(x) = if x > 0 then x*x else -x` is differentiated the way it is written: the condition is copied and read by the `Brch`, never differentiated, and each arm's exit becomes the lifted pair of the arm's value and its tangent, which is what the `Join` yields. So `jvp(f)(2.0, 1.0)` reads `(4, 4)` -- `2x` at 2 -- and `jvp(f)(-2.0, 1.0)` reads `(2, -1)`, the arm that was actually taken. The arms stay arms in the lifted graph (their nodes are copied into their own regions), so an operator only one arm uses is not computed for the arm that was not taken."
kind = "behavior"
case = "../../../cases/compile/transforms/jvp_branch.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_stdout_contains = ["REINTERP jvp function=f graph=", "exit=Tuple{chain,tangent} tangent=computed source=ruleset rules=jvp_mul,jvp_neg", "4419"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# A loop's state is the LOOP node's value and its rounds are a region of the same graph, so lifting
# it is lifting the *state*: the node's value becomes the pair, the body's state port is a pair port
# whose halves the body reads through projections, and the region's result is the pair of the body's
# new value and its tangent. `f(x) = loop s = 0.0 for i in [1,2,3,4] do s + x*x` carries `x*x = 9`
# four times at x = 3 -- `f(3) = 36` -- and carries `8x = 24` four times -- `f'(3) = 24`. The number
# that says the tangent is *carried* and not recomputed is 24: keeping only the last round's
# derivative would read 6, which is what the case's comment records as the failure symptom.
[[tests]]
name = "jvp_loop.state_is_lifted"
desc = "A loop is reinterpreted by lifting its state, not by interpreting its body twice: the LOOP node's value is the state, the rounds are a region of the same graph, and the lifted graph carries `(value, tangent)` from the initial `(0.0, 0.0)` through every round. `jvp(f)(3.0, 1.0)` reads `(36, 24)` -- `36` is `x*x` added four times at x = 3, `24` is `8x` added four times -- and the reading names the rules it applied (`jvp_mul`, `jvp_add`). `6` would be the answer of a tangent recomputed from the last round alone, which is why the case's comment names it as the symptom."
kind = "behavior"
case = "../../../cases/compile/transforms/jvp_loop.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_stdout_contains = ["REINTERP jvp function=f graph=", "type=(float, float) => (float, float)", "exit=Tuple{chain,tangent} tangent=computed source=ruleset rules=jvp_mul,jvp_add", "36", "24"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# A loop whose body never reads the state's tangent -- `s + 1.0`, where the derivative does not
# flow through the state at all -- is still lifted: the tangent is carried as zero, and the value is
# what the loop computes. The pair is the loop's value whether or not anything differentiates it.
[[tests]]
name = "jvp_loop.value_only_is_still_lifted"
desc = "A loop whose body does not touch the state's tangent (`s + 1.0` four times, so `f(3) = 4`) is lifted all the same: the state is carried as `(value, tangent)` from `(0.0, 0.0)`, the body reads only the value half, and the derivative stays 0 -- it does not flow through the state. The reading still says `tangent=computed source=ruleset`, and `jvp(f)(3.0, 1.0)` reads `(4, 0)`."
kind = "behavior"
case = "../../../cases/compile/transforms/jvp_loop_value_only.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_stdout_contains = ["REINTERP jvp function=f graph=", "type=(float, float) => (float, float)", "4.0", "0.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# The initial state is lifted like every other node: a constant gets the zero tangent, a value that
# comes from the input gets the tangent the chain computed for it. `s = x`, three rounds of `s * x`:
# `f(x) = x**4`, so `f(3) = 81`, `f'(3) = 108` -- not `(81, 0)`, which is what a lift that starts
# every state at `(value, 0)` reads, and not `(0, 0)` either.
[[tests]]
name = "jvp_loop.init_from_input_is_lifted"
desc = "A loop whose state starts at the input, not at a constant: `loop s = x for i in [1, 2, 3] do s * x` is `f(x) = x**4`, so `jvp(f)(3, 1)` reads `(81, 108)`. The initial state's tangent is not zero-by-default: the state is a node on the chain like any other, so `x` hands in `x`'s tangent and only a constant hands in zero. `(81, 0)` and `(0, 0)` are both distinguishable from `(81, 108)`, so the two numbers name the defect if the initial state is ever wired as `(value, 0)` again."
kind = "behavior"
case = "../../../cases/compile/transforms/jvp_loop_init_from_input.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_stdout_contains = ["REINTERP jvp function=f graph=", "81.0", "108.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# An effect is executed as written, not differentiated: the print inside `g` runs once (the same
# number of times the original body ran it), and a number's tangent is still nonzero beside it.
[[tests]]
name = "jvp_effect.runs_as_written_and_zero_tangent"
desc = "A function with an effect (`println` in the body) is lifted so that the effect keeps running exactly as often as it did -- once -- while the numeric part is differentiated: `g(x) = x*x` with a print reads `effect`, then `9.0` and `6.0`. The effect has no tangent and none is invented for it, but the tangent of the value does not become zero because an effect sits beside it, which is what a lift that gave up on the whole straight line at the first effect would read."
kind = "behavior"
case = "../../../cases/compile/transforms/jvp_effect.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
# The count: `g(3.0)` prints `3.0` once and the lifted `g` prints it once, so exactly two `3.0`
# lines appear (the plain call's print, then the lifted call's print) -- a third would mean the
# lift ran the effect again, and a single one would mean it dropped it. `9.0` and `6.0` are the
# value and the tangent of the lifted call, and the plain call's `9.0` is the third.
expect_stdout_contains = ["REINTERP jvp function=g graph=", "3.0\n9.0\n6.0"]
expect_stdout_not_contains = ["3.0\n3.0\n3.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# A call is lifted as a call: the callee gets a lifted graph of its own, and it gets exactly one --
# `f(x) = g(x) + g(x)` calls `g` twice and the reading says `callees=1`. The numbers are checked
# against the derivative written by hand: `g(x) = x*x`, `f(x) = 2*x*x`, so `f(3) = 18` and
# `f'(3) = 4x = 12`.
[[tests]]
name = "jvp_call.callee_is_lifted_once"
desc = "A function that calls another one is reinterpreted through the call, not around it: a `Func` node names the callee graph, so the lift gives the callee a graph of its own with the lifted signature, and the call passes `(value, tangent)` in and answers with the pair. `f(x) = g(x) + g(x)` with `g(x) = x*x` reads `(18, 12)` at `x = 3, dx = 1` -- `f = 2x*x`, `f' = 4x` -- and `REINTERP jvp callees=1` says the two calls of `g` made one graph, not two."
kind = "behavior"
case = "../../../cases/compile/transforms/jvp_call.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_stdout_contains = ["REINTERP jvp function=g graph=", "REINTERP jvp function=f graph=", "REINTERP jvp callees=1", "18.0", "12.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# The negative side of the same rule table, and the point of it: a primitive the ruleset has no rule
# for is not answered with 0 or 1 and is not only printed at -- it is a diagnostic that names the
# primitive and stands *where the primitive is written*. `pow` is `math:pow_d`, which no forward rule
# is bound for, so `jvp(f)` cannot build; the error is at `f`'s `pow` (`file:line:col`) and the
# process stops without running `main`, while the call site is kept beside it as a related position.
[[tests]]
name = "rulesets_probe_missing.at_the_primitive"
desc = "With a primitive carrying no forward rule, `jvp(f)` is a diagnostic and not a value: it names the operator (`math:pow_d`) and the reason no rule was found, and its position is the primitive's own -- `rulesets_probe_missing.cml:10:12`, the `pow` in `f` -- which is the position a reader has to be sent to, not the `jvp(f)` call. The reading line still names what was refused (`skip=rule uri=math:pow_d`), and the run's exit is non-zero: the program does not go on to print a value it could not differentiate. Read as a whole the assertions say *when* the fault is raised: the diagnostic carries the primitive's own position, the reason the table gave (`no forward rule bound at all`), and the raise-site hint (`[raised here`) that keeps the `jvp(f)` call beside it -- a graph-time fault, not a value computed and then checked."
kind = "behavior"
case = "../../../cases/compile/transforms/rulesets_probe_missing.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 1
expect_output_contains = ["skip=rule uri=math:pow_d", "rulesets_probe_missing.cml:10:12: [Error]:", "jvp has no forward rule for `math:pow_d`", "no forward rule bound at all", "[raised here"]
expect_stdout_not_contains = ["5.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
# The library carries the rulesets it composes.
#
# `vjp` is `transpose(split(reinterp<jvp>(f)))`, so it needs the forward rules (`rulesets.jvp`) and
# the ones the backward walk asks for (`rulesets.transpose`). Both are imports of `stdlib/vjp.cml`,
# not of the program that calls it: a library whose callers have to know how it is put together is
# not a library, which is the same reading as a pass's precondition -- it is the library's job, and
# it diagnoses what it cannot do.
#
# The case's only import is `vjp`, so it fails exactly when one of those two lines is missing, and
# it fails on the library's own line: `transpose has no transpose for this function` (without
# `rulesets.transpose`, whose absence reads `TRANSPOSE ... skip=rule uri=:op/add_d
# reason=no-such-family`) or `jvp has no forward rule for :op/mul_d` (without `rulesets.jvp`).
# `f(x) = x*x*x` at 3 reads 27 three ways: the value, the cotangent, the gradient. The gate is the
# composition's buildability, so while a step of the walk is still missing this skips and says so;
# the numbers then run, and a missing ruleset import is a red rather than a skip.
[[tests]]
name = "vjp_api.carries_its_own_ruleset"
desc = "A program whose only import is `vjp` gets a derivative: the library imports the rulesets it composes, so its caller does not have to know that `vjp` is `transpose(split(reinterp<jvp>(f)))`. For `f(x) = x*x*x` at 3 the program prints the value `27.0`, the cotangent `27.0` and the gradient `27.0`. Take either ruleset import out of `stdlib/vjp.cml` and the run stops at that library's own line with `transpose has no transpose for this function` or `jvp has no forward rule for :op/mul_d` -- never here, and never in a sentence of the form `not implemented yet`."
kind = "behavior"
case = "../../../cases/compile/transforms/vjp_carries_its_ruleset.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "stdout"]
skip_unless = ["node", "test/tools/have-library-vjp.mjs"]
expect_exit = 0
expect_stdout_contains = ["27.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# One case per ruleset import. `vjp_carries_its_own_ruleset` guards that the library carries both;
# these two say which line does what, so a missing one is not just "the composition broke" but
# "this half broke, here". `test/tools/check-vjp-ruleset.mjs` comments out **one** line in a copy of
# the installed library, points `CAMEL_STD_LIB` at the copy and runs the same program twice: dropped,
# it must stop on the library's own line with the words that name what is missing; back, it must
# print the three 27.0 readings. No program's source can tell the two lines apart -- a caller imports
# neither -- so the A/B is the only reading there is, and the tool also goes red when the line it
# guards is gone from the library (nothing to drop, and the restored half is the one that failed).
[[tests]]
name = "vjp_api.the_jvp_import_is_load_bearing"
desc = "Dropping `import rulesets.jvp` from `stdlib/vjp.cml` stops a program that only imports `vjp`: the forward walk has no rule for the multiply in `x*x*x`, so the run exits 1 with `jvp has no forward rule for ':op/mul_d'` and a `note: raised here` standing on the library's own line (`stdlib/vjp.cml:<line>:`). With the line back the same program exits 0 and prints `27.0` three times. The tool drops the line in a copy of the installed library and points `CAMEL_STD_LIB` at it, so the library on disk is untouched."
kind = "behavior"
tool = "node"
case = "../../../../test/tools/check-vjp-ruleset.mjs"
args = ["${case}", "--drop", "rulesets.jvp"]
expect_exit = 0
expect_stdout_contains = ["the library imports rulesets.jvp", "jvp has no forward rule for `:op/mul_d`", "note: raised here", "stdlib/vjp.cml:", "prints 2 x 27.0 + 1 x (27.0)"]
normalizers = ["normalize_newlines"]
timeout_ms = 30000

[[tests]]
name = "vjp_api.the_transpose_import_is_load_bearing"
desc = "Dropping `import rulesets.transpose` from `stdlib/vjp.cml` stops the backward walk of a program that only imports `vjp`: the walk finds no family for `:op/add_d` (`TRANSPOSE ... skip=rule uri=:op/add_d reason=no-such-family`) and raises `transpose has no transpose for this function` on the library's own line (`stdlib/vjp.cml:<line>:`). With the line back the same program exits 0 and prints `27.0` three times. The tool drops the line in a copy of the installed library and points `CAMEL_STD_LIB` at it, so the library on disk is untouched."
kind = "behavior"
tool = "node"
case = "../../../../test/tools/check-vjp-ruleset.mjs"
args = ["${case}", "--drop", "rulesets.transpose"]
expect_exit = 0
expect_stdout_contains = ["the library imports rulesets.transpose", "transpose has no transpose for this function", "skip=rule uri=:op/add_d reason=no-such-family", "stdlib/vjp.cml:", "prints 2 x 27.0 + 1 x (27.0)"]
normalizers = ["normalize_newlines"]
timeout_ms = 30000

# The comparison the author named: one `f` with two parameters, and the library's gradient beside
# the derivative worked out on paper. `f(x, y) = x*x*y` at `(3, 2)` has `df/dx = 2*x*y = 12` and
# `df/dy = x*x = 9`, and both numbers are printed -- `library` first, `analytic` under it -- so the
# reading is a comparison. The surface is JAX's (the author's ruling of 2026-11-01): `vjp(f)(x)` is
# the pair `(y, pullback)` and `pullback(ct)` is the cotangent of `f`'s parameters, so the call is
# `vjp(f)(3.0, 2.0)` and then `pullback(1.0)`. The juxtaposed call `transpose` writes is the
# internal assembly; it is not a standard-library signature and nothing here writes it.
#
# The main line: the case the library has to keep answering, on the program the author named, in
# every backend. `f(x, y) = x*x*y` at `(3, 2)` has `df/dx = 2*x*y = 12` and `df/dy = x*x = 9`, and
# both numbers are printed -- `library` first, `analytic` under it -- so the reading is a comparison.
# The surface is JAX's (the author's ruling of 2026-11-01): `vjp(f)(x)` is the pair `(y, pullback)`
# and `pullback(ct)` is the cotangent of `f`'s parameters, so the call is `vjp(f)(3.0, 2.0)` and then
# `pullback(1.0)`. The juxtaposed call `transpose` writes is the internal assembly; it is not a
# standard-library signature and nothing here writes it.
#
# No precondition and no skip: the composition runs, so a wall here is a red and not a silence. Four
# backends are asked for the same six lines -- `nvm`, `fvm`, `jit`, `prl` -- and compared on the exit
# code and on the whole standard output, so "the library is the language's" is read once per executor.
# `18.0` is `3*3*2`; `12` and `9` are the derivative worked out on paper, printed beside the
# library's answer. `test/tools/check-vjp-ruleset.mjs` drops one of the library's two ruleset imports
# in a copy, so a missing import is red in its own case as well as here.
[[tests]]
name = "vjp_api.analytic_gradient"
desc = "The library's gradient against the derivative worked out on paper, on the author's example: `f(x, y) = x*x*y` at `x = 3`, `y = 2`, so `df/dx = 2*x*y = 12` and `df/dy = x*x = 9`. `vjp(f)(3.0, 2.0)` gives the pair `(y, pullback)` and `pullback(1.0)` gives the two cotangents, in JAX's order; the program prints `f(3, 2) = 18.0`, `library y = 18.0`, then `library`/`analytic` for `df/dx` and `df/dy`. The library half comes from `transpose(split(reinterp<jvp>(f)))` in `stdlib/vjp.cml` and nothing else -- not from the C++ autodiff -- and the two rulesets that composition needs are that file's own imports, so this program imports `vjp` and nothing else. Run on `nvm`, `fvm`, `jit` and `prl`, which must agree on the exit code and on the whole standard output."
kind = "behavior"
case = "../../../cases/compile/transforms/vjp_analytic_gradient.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "output_normalized"]
expect_exit = 0
expect_stdout_contains = ["f(3, 2) = 18.0", "library  y = 18.0", "library  df/dx = 12.0", "analytic df/dx = 12.0", "library  df/dy = 9.0", "analytic df/dy = 9.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# The single-parameter reading, beside the two-parameter main line: `f(x) = x*x*x`, so
# `vjp(f)(3.0)` is `(27.0, pullback)` and `pullback(1.0)` is `27.0`, and `grad(f)(3.0)` is the same
# number through the wrapper. The three-step composition is checked against the derivative written by
# hand, not against the C++ autodiff, and the rulesets are the library's own imports, so this program
# imports `vjp` and nothing else. No skip: the composition runs.
[[tests]]
name = "vjp_api.gradient_when_the_steps_land"
desc = "`vjp(f)(3.0)` on `f(x) = x*x*x` reads `(27.0, 27.0)` and `grad(f)(3.0)` reads `27.0`: the library's three-step composition against the derivative written by hand, with the two rulesets imported by `stdlib/vjp.cml` rather than by this program. The 27.0 is `3x^2` at 3, and the number the pullback answers is the same one the gradient wrapper reads."
kind = "behavior"
case = "../../../cases/compile/transforms/vjp_gradient.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_stdout_contains = ["27.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# The two halves, and the type function between them. `ResidualsOf<F>` is what the first half
# answers with beside the result -- the values the backward half reads, numbered in program order --
# and it is the *compiler's* type: no signature names it (`stdlib/signatures/transforms.cml` writes
# it out in a comment, as the author wrote it), so what a test can read is what the halves are worth,
# not the type's spelling. `f(x) = x*x*x` at 3: the first half gives `27.0` and the residuals, the
# second turns them and the cotangent `1.0` back into `27.0`.
[[tests]]
name = "vjp_api.split_halves"
desc = "`split(jvp(f))` gives the two halves of `Lift<T> = (T, Tangent<T>)`: the first takes the ordinary parameters and answers `(ResultOf<F>, ResidualsOf<F>)` -- for `f(x) = x*x*x` at 3, the value `27.0` and the residuals in program order -- and the second takes those residuals and the cotangent `1.0` and answers `27.0`. `ResidualsOf<F>` is the compiler's type function and appears in no signature; the test reads the numbers, not its spelling."
kind = "behavior"
case = "../../../cases/compile/transforms/vjp_split_halves.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "stdout"]
expect_exit = 0
expect_stdout_contains = ["27.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "transpose_runs_the_data_flow_backwards.nvm"
desc = "`transpose(f)` is the pullback of a linear function's graph, built the way `jvp` builds the forward one: a new function value naming a graph of the transform's own, with `f` untouched. The walk runs the graph backwards -- a value used k times receives k cotangents that add -- and each primitive is replaced by the rule the `rulesets.transpose` family files under its operator, asked of the index by `transposeRuleOf` rather than matched against the uri in C++. For `f(x) = 2*x + 3*x` the parameter is used twice, so the cotangent 1.0 pulls back to 2 + 3 = 5; for `f(x) = (x*2 + x*3) * 4` the outer 4 reaches the sum before it splits, so the answer is 4*2 + 4*3 = 20. A primitive whose other operand is not a constant needs that operand's forward value, which is a residual this step does not have: it is refused by name, never answered with a wrong cotangent."
kind = "behavior"
case = "../../../cases/compile/transforms/transpose_straight_line.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_stdout_contains = ["TRANSPOSE function=sum_of_scaled graph=", "type=(float, float) => float nodes=6 arms=0 rhs=add_t,mul_t", "TRANSPOSE function=scaled_chain graph=", "rhs=mul_t,add_t", "TRANSPOSE op signature=(f: (float) => float | ((..Residuals), float, ...) => float) => (knowns.., cotangent) => (cotangents..)", "transposed=(float, float) => float", "same=yes", "5.0", "20.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# The initial state's tangent rides the chain like any other tangent: `s0 = x` is a port, its tangent
# is the seed, and the body reads the state twice, so the chain's tangent is `8 x^7` and not a zero
# and not the last round's `2 x^3`.
[[tests]]
name = "jvp_loop.state_read_twice_is_lifted"
desc = "`loop s = x for i in [1, 2, 3] do s * s` is `f(x) = x^8`: at 3 the value is 6561 and the derivative 8*3^7 = 17496. The initial state is the input, not a constant, and the body reads it twice each round; a tangent that started at zero would read 0.0, one that carried only the last round would be off by a factor of the round count."
kind = "behavior"
case = "../../../cases/compile/transforms/jvp_loop_state_read_twice.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "stdout"]
expect_exit = 0
expect_stdout_contains = ["6561.0", "17496.0", "REINTERP jvp function=f graph="]
expect_stdout_not_contains = ["0.0\n0.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# One lifted body per callee. `g` is called three times and the count says one.
[[tests]]
name = "jvp_call.three_calls_one_body"
desc = "`g` is called three times in `f(x) = g(x) + g(x) + g(x) = 3 x^2`: the lift makes one body for it (`callees=1`), and the numbers are 27 at 3 with the derivative 6*3 = 18. A lift that made a body per call site would read `callees=3` and the same numbers; the count is what tells the two apart."
