known_fail_msg = "skip=cotangent-needs-a-value uri=tensor:multiply"
known_fail_note = "Waits on the rule layer, and the rule layer has no safe writing for it -- measured, not assumed. `mul_tensor_t`'s adjoint has to hand `sum_to` the shape it reduces to, and `sum_to(t, like)`'s second argument is the **target shape** (`stdlib/tensor.cml#sum_to`), so it can only be the operand whose cotangent is being answered: `sum_to(ct * w, x)` reads `x`, `sum_to(ct * x, w)` reads `w`. Handing it the *other* operand is what a broadcast program would need and is what answers a wrong number there (measured: `d/dx` answered `[6.0]` where it is `[2.0, 2.0, 2.0]`, `d/dw` answered `[1.0, 2.0, 3.0]` where it is `[6.0]` -- the engine's leg right, the library's wrong), and whether the two operands' shapes are equal is not visible on the open-rank type `float[...]`, so no writing is both right on the equal-shape case and safe under broadcast. Two things unblock it: a `sum_to` whose target shape arrives as a twin (the way `sum_stated` and `take_stated` carry theirs), or the operand's shape stated in its type. Until then this entry is the wall rather than a bug in the case: the expected numbers are unchanged, and the mark pins today's refusal by fragment so a different failure still turns the run red."
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

