# The mean's tangent takes its length from the operand (`stdlib/rulesets/jvp.cml#jvp_mean_axis`,
# author 2026-11-03 16:15), and the tangent it builds keeps the *operand's* shape while the reduced
# output's tangent is the reduced one. The two shapes broadcast only when the reduced axis is the
# last one, or when `keepdims` keeps a 1 in its place. This entry pins the reading that is correct
# TODAY -- `axis = 1` (not the last axis) with `keepdims = true` -- element by element. It is not a
# wish: the numbers it names were answered on 2026-11-04, and they are the hand-derived ones.
# What it guards is the day the `arity` wall falls and `mean_axis_t`
# (`stdlib/rulesets/transpose.cml#mean_axis_t`) starts running: the same numbers must come out of
# the law rather than out of the kernel's broadcast.
[[tests]]
name = "mean_axis1_keepdims_gradient_reads_the_row_length"
desc = "The library's `vjp` of `f(x) = sum(mean_axis(x, 1, true) * [[10], [20]])` on `x = [[1, 2, 3], [4, 5, 6]]`: `120.0`, and a cotangent read ELEMENT BY ELEMENT as `[[3.333333333333333, 3.333333333333333, 3.333333333333333], [6.666666666666666, 6.666666666666666, 6.666666666666666]]` -- `w[i] / 3`, constant along each row, because every position of a row was averaged over that row's three positions. The axis is NOT the last one and `keepdims` is true: that is the shape pair the law builds for today (`keepdims = false` at this axis is refused in the tensor kernel instead, `cannot broadcast [2, 3] with [2]`, `docs/handover/questions/2026-11-04-does-a-mean-tangent-reduce-the-axis-it-averaged`). The wrong lengths separate from the target at the FIRST element: the other extent (2) would answer `[[5, 5, 5], [10, 10, 10]]`, and the total `numel(x) = 6` would answer `[[1.666..., x3], [3.333..., x3]]`; the axis-0 sibling answers `[[5, 10, 15], [5, 10, 15]]` on weights `[10, 20, 30]`, increasing along a row where this one is constant. Pinned with the absence of `skip=arity uri=tensor:mean_axis` as well, so a law that regresses to the three-operand form fails here instead of silently moving the numbers. `std::fvm` was measured to answer the same line and is not pinned, to keep this entry one test."
kind = "behavior"
case = "../../../cases/compile/transforms/mean_axis1_keepdims_gradient_reads_the_row_length.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["mean_axis1 keepdims value=120.0 cotangent=[[3.333333333333333, 3.333333333333333, 3.333333333333333], [6.666666666666666, 6.666666666666666, 6.666666666666666]]"]
expect_output_not_contains = ["skip=arity uri=tensor:mean_axis", "skip=call-no-transpose"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
