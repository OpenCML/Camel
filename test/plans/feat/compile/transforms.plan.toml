# A refusal is one cause, and the cause is a value: the header declares it
# (`enum class TransposeRefusalCause`), `transposeRefusalWord` spells it into the reading log,
# `refusalSentence` renders the sentence a reader is handed from it, and a refusal site records it
# (`refuse(TransposeRefusalCause::X)`). The four can drift apart and no program can see it: most of the
# causes are not reachable from anything this tree can run, so a case that runs `camel` cannot pin
# them -- the ones it can reach say nothing about the rest. So the check reads the four sources and
# holds the sets together, and it holds them as relations, never as counts: a count is a number a
# reader has to edit for a reason no reader can see (2026-11-03: splitting one word into two made `17`
# red before `18`, on two trees that satisfied every relation).
#
# The reds it can be are the four directions, and each is one of the four places: a cause with no word
# cannot be spelled into the log; a cause with no sentence is answered with nothing; a cause that names
# the shape without being written out as one is an authored decision made quietly; a cause with a word
# and a sentence and no site is a promise nothing keeps. The check also refuses a sentence file that
# spells any of the words itself, which is the second spelling of the fact this change removed.
[[tests]]
name = "transpose_refusal_is_one_cause_in_four_places"
desc = "One refusal is one cause, and the cause is read in four places that have to agree: the header declares it, the word table spells it into the log, `refusalSentence` renders the sentence a reader is handed from it, and a site decides it -- the walk's one `refuse` lambda, which also renders the log's line, or, for a cause that no step of the walk can see, the record written after the walk (the promise guard compares the member's ports with the operator's type, a fact about the whole member). Held as relations, not counts: every cause has one word, one sentence and a site -- the list of causes that wait for a site is empty since `NeedsAValueOutsideTheClosure` got one -- a cause with no sentence of its own lands on the one that names the shape and that list is written out in the check, and the word a cause is spelled as appears in one file only, the table, so the caller renders the sentence from the cause and never from the log. That last relation is the point of the entry: the caller used to recover the cause by searching the log text for the word's prefix, so the spelling itself was the fact, and a word renamed on one side of the pair was a sentence about a cause nothing named. The four ways it can be red are the four places -- a cause with no word, a cause with no sentence, a cause that names the shape without being written out as one, and a cause with a word and a sentence that no site records."
kind = "behavior"
tool = "python"
case = "../../../tools/transpose_refusal/check.py"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["every cause has one word, one sentence, and a site that records it", "no sentence of its own lands on the one that names the shape", "renders the sentence from the cause and never from the log", "the list of causes that wait for a site is empty"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000

[[tests]]
name = "vjp_api.carries_its_own_ruleset"
desc = "A program whose only import is `vjp` gets a derivative: the library imports the rulesets it composes, so its caller does not have to know that `vjp` is `transpose(split(reinterp<jvp>(f)))`. For `f(x) = x*x*x` at 2 the program prints the value `8.0`, the cotangent `(12.0)` and the gradient `12.0`. The point is chosen so the value and the gradient differ, and every printed line is pinned whole: the reading was `x = 3` before, where value, cotangent and gradient are all `27.0`, so an assertion that only asked whether `27.0` appears answered yes to a gradient computed as the value it differentiates (P2-22 of the 2026-11-01 review). `expect_output_not_contains` refuses the old point outright, so a case that drifts back to it cannot pass on the ambiguous number again. Take either ruleset import out of `stdlib/vjp.cml` and the run stops at that library's own line with `transpose has no transpose for this function` or `jvp has no forward rule for :op/mul_d` -- never here, and never in a sentence of the form `not implemented yet`."
kind = "behavior"
case = "../../../cases/compile/transforms/vjp_carries_its_ruleset.cml"
