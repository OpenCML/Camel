# A rule is instantiated at the type of the operand it was matched on, not at `float`.
#
# `f32` is the smallest program that tells the two writings apart: its tangent space is the value's
# own type, and it is not `float`. An array operand cannot show it -- the rule's `T` is the array's
# *element*, so `sum_axis` over a `float[]` is filed at `float` either way -- which is why the
# question is `rule_types.h`'s (the element of the first value operand) and not the operand's type.
#
# With `{Type::Float64()}` written into the instance call, this program did not read a wrong number:
# it built `autodiff::mul_tangent<float>` around `f32` operands and the pass refused the graph it was
# handed -- "passes a f32 as ordinary argument 0 of 'autodiff::mul_tangent<float>', which takes a
# float", four edges. `g(x) = x * x` at 1 reads `(1, 2)`.
[[tests]]
name = "jvp_rule_instance_at_the_operand_type.f32"
desc = "`g(x: f32) = x * x` differentiated by `jvp`: every value in the body is an `f32`, so the rule the ruleset files for `*` has to be instantiated at `f32` -- the operand's own type -- and the lifted signature and the pair it answers with are `(f32, f32)`. Instantiating it at `float` instead builds `mul_tangent<float>` around `f32` values and the pass refuses the graph (four broken edges), so this case reads `1.0` and `2.0` only when the type argument comes from the operand."
kind = "behavior"
case = "../../../cases/compile/transforms/jvp_rule_at_the_operand_type.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "stdout"]
expect_exit = 0
# The reading spans both streams: the two numbers are the program's output, and the
# `REINTERP` lines that name the rule instance and the type it was asked for are the pass
# talking, which goes to stderr. Asserting both against stdout made this case look broken on a
# tree where the fix is present -- the run of 2026-11-02 18:45 printed exactly the expected
# stderr lines and failed on four needles that were never on that stream. `expect_output_*`
# reads the two streams as one, which is what a case reports when its verdict is a sentence the
# program and the pass together print.
expect_output_contains = ["rules=jvp_mul", "type=(f32, f32) => (f32, f32)", "1.0", "2.0"]
expect_output_not_contains = ["mul_tangent<float>", "which takes a float"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "transpose_walks_each_arm_of_a_branch"
desc = "`transpose` of a function with a branch: each arm is a linear chain of its own, the cotangent runs backwards inside the arm that produced the value, and the condition is read as it was -- the same predicate, at the values the caller passed -- choosing the other arm. The values each arm reads are the ones the cut carried, so the transposed half takes the cotangent alone (author, 2026-11-02 11:30) and the case is spelled the way a transposition is asked now: `let (_, lin) = split(jvp(pick))(1.0)` then `transpose(lin)(1.0)`. For `pick(x)` returning `2*x` when `x > 0` and `3*x` otherwise, the cotangent 1.0 pulls back to 2 at a positive x and 3 at a negative one. `merged(x)` uses its parameter twice on one side only (`2*x + 5*x`, else `4*x`), so the two sides answer 7 and 4: within an arm two cotangents add, while the two arms' cotangents are joined rather than added, because only the arm that ran contributed one -- and the two summands reach the arm's `add_tangent` as values the arm computes, which is a shape the arm's forward had to learn to answer (`forwardInArm`'s operator case) for this number to exist. The reading names the arms it built (`arms=2` on each half), the laws the rule kernel was transposed with (`rhs=add_t,mul_t` on the kernel's own line, since the half's own line applies no rule), and the type the resolver and the graph agree on."
kind = "behavior"
case = "../../../cases/compile/transforms/transpose_branch.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["TRANSPOSE function=split_of_jvp_of_pick_backward graph=", "type=(float) => (float,) nodes=11 arms=2", "TRANSPOSE function=split_of_jvp_of_merged_backward graph=", "type=(float) => (float,) nodes=16 arms=2", "TRANSPOSE function=autodiff::mul_tangent<float> graph=", "rhs=add_t,mul_t", "(2.0)", "(3.0)", "(7.0)", "(4.0)"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "transpose_runs_a_loop_rounds_backwards"
desc = "`transpose` of a loop whose body only uses constants: the rounds run in the other direction, and a constant multiplier is the same multiplier whatever order it arrives in, so a loop of the same number of rounds with each rule replaced by its transpose is the pullback. The round count is the loop's own -- the two bounds of the interval are copied with the loop, and nothing in the case says three -- which the four-round loop in the same file settles: it answers 16 where the three-round one answers 8. For `thrice(x) = loop s = x for i in 0..3 do s * 2.0` the value at x = 1 is 2*2*2 = 8 and the pullback of 1.0 is 8 too; a pullback is linear in its cotangent, so 2.0 at x = 1 pulls back to 16, and that is the same graph read twice. A body that needed the round's own state would be refused by name (`skip=state` with the origin), never answered with a cotangent from nowhere."
kind = "behavior"
case = "../../../cases/compile/transforms/transpose_loop.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["TRANSPOSE function=thrice graph=", "type=(float) => (float,)", "nodes=11 arms=0 rhs=mul_t", "TRANSPOSE function=quad graph=", "8.0", "16.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# A loop body that reads a value from outside its own region sends a round's cotangent to that value,
# and the loop hands back one state -- so the transpose used to refuse. It now carries those
# cotangents as states of its own: one accumulator per escaped value, all beside the one carried
# cotangent, all advanced by the same rounds. It is one loop, not one loop per escape. The reading did
# not go away when the fix landed: `captures` is how many values escaped and one `ESCAPE` line still
# names each of them -- the value the cotangent landed on (`target`), the node whose rule handed it
# out (`from`, always an `Oper`: the body's own product, never a port), and the loop's `norm` and
# `with` inputs, which stay the old loop's own.
#
# `carried=` replaced `skip=state`, and `answer=` says which of two things a count means, because
# "two escapes" is not one situation: `answer=summed` is one value read by several products (the
# products add into one sum, and if that value is also the one the state starts from, the state's
# cotangent adds to it) -- 15 and 22 below. `answer=per-target` is several values, one sum each, and
# nothing is added across values -- `read_outer` below, whose 29 is 15 through `x` and 14 through `k`.
#
# A loop that already carries two states before anything escapes -- `carried` below -- needs one
# cotangent per state, not one, and the loop's value is then a tuple. Using it means reading a
# component (`t.0`), which is where the second channel starts: a component read fills that slot of the
# tuple's cotangent and leaves the rest zero, so `first` answers 1 and `second` answers 2 from the same
# tuple, and `carried` answers 10 with its accumulators after the two states. Before that channel every
# one of the three refused at `skip=output`, and with it every tuple-shaped value in a transposed
# function refuses the same way -- which is what the switch flips.
#
# Three readings then take the same ruler to the rest of the channel: the second state of that loop
# (`carried_p`, 7 rather than 10, which only the slot index can tell apart), a tuple inside a tuple
# (`nested`, `t.0.1`, where the cotangent is a tuple in a tuple's slot), and both slots of one tuple
# read at once (`both`, 3, where two reads are two slots of one cotangent and add). Each case answers
# its transpose twice, the second time with twice the cotangent, because a plan line the forward
# reading already satisfies cannot tell a working transpose from a silent zero -- `nested` answered 0.0
# for exactly that reason until the tuple-in-a-tuple rule was written, and its forward 2.0 had hidden
# it.
# A better pin for these two cases is derived and is not here on purpose: lane-norm-arity re-pins both
# to `split(jvp(...))` at `x = 2` (value 30, cotangent 15 -- at `x = 1` both are 15, so a run that
# answered the value where the cotangent belongs would look right). Measured on this tree that pin fails
# with "transpose has no transpose for this function: a loop carries...", because the reverse walk
# `split(jvp(...))` needs is not on develop yet, and taking it here would have added two reds. The pin
# lands when the walk does; this note is what tells the next reader why the better pin is absent.
[[tests]]
name = "transpose_loop_escape.names_the_value_one_read"
desc = "`read_one(x) = loop s = x for i in 0..3 do 2.0*s + x` reads the parameter inside the loop body, so every round's cotangent lands on `x` and has to leave the loop. The loop carries it as a second state and answers 15 -- `s = 2s + x` three times is `8x + 7x`, the state's own cotangent 8 plus the carried sum 7 -- where before this cut it refused with `skip=state`. The reading is kept: `carried=1` in place of `skip=state`, `answer=summed` because the escaped value is the one the state starts from, `captures=1`, and the `ESCAPE` line still names the parameter port as the target and the body's `add` as the product that handed the cotangent out. A channel that dropped that line when it started working could not be compared with the refusal it replaced."
kind = "behavior"
case = "../../../cases/compile/transforms/transpose_loop_escape_reads_one.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code"]
expect_exit = 0
# Pinned before 17:10 and held back on purpose until `jvp` had a forward transform for a loop
# (`REINTERP jvp function=read_one skip=loop`); re-pinning it before that would have been a guess.
# That condition is met now, and the shape below is read off the run rather than guessed: the
# transposed member answers `(float) => (float,)`, one cotangent in and one per parameter out.
expect_output_contains = ["TRANSPOSE function=read_one carried=1 node=10 origin=0 captures=1 answer=summed", "ESCAPE target=0 from=9 kindOfFrom=11 kindOfTarget=1 typeOfTarget=float norm=[3,0,] with=[9,11,]", "TRANSPOSE function=read_one graph=", "type=(float) => (float,) nodes=12 arms=0 rhs=add_t,mul_t", "15.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

