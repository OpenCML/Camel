expect_exit = 0
expect_stdout = "gx/vg  engine=(9.0, 3.0) library=RuntimeError\npg/pvg engine=(11.0, { a: 4.0, b: 1.0 }) library=RuntimeError\nwg/wvg engine=(32.0, [4.0, 5.0, 6.0]) library=RuntimeError\nsk/sx  engine=6.0 4.0 library=RuntimeError\nwhy=vjp is transpose(split(jvp(f))), and forward mode answers the tangent of a value handed to a call's `with` list as the zero of its type, so a `with_grad` built on this composition would answer the zero of the gradient's type for every weight that reaches the body through that list. Read the gradient of a first `with` parameter with `grad(f)<w>(...)` from the autodiff module, and the derivatives of the ordinary parameters with `vjp(f)`.\n"
