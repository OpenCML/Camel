normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "grad_of_a_division"
desc = "`grad((x) => x / 4.0)` at 8 is `0.25`, not a crash and not a division by zero: the transposed `div_tangent` divides by `w * w`, a value rather than a constant, so `div_t`'s second position is reached and answered by the rule's second component -- which reads both operands, the way its law does -- instead of by the first component with the operands swapped (`ct / 0`, since the dividend there is `x * dw` and `dw` is the zero tangent of a constant). `grad((x) => 4.0 / x)` at 2 is `-1.0`: the differentiated value is the divisor, its cotangent is `-(ct * x / (c * c))`, and both values it needs are carried. `grad((x) => -x)` is `-1.0` -- the negation's cotangent is `-ct` -- and the multiplication and subtraction beside it keep their numbers. Today the first four numbers print and the run stops one step later, on the same wall as the array block: the backward half's body reads a value the transposed function does not carry -- `TRANSPOSE-NEEDS ... param=0`, then `skip=call-value-missing param=3 node=6 arg=3` -- so the two remaining answers wait for the closure (`b2f`)."
kind = "behavior"
case = "../../../cases/compile/transforms/grad_of_a_division.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 0
expect_output_contains = ["3.0", "1.0", "-1.0", "0.25", "-1.0", "TRANSPOSE function=autodiff::div_tangent<float> graph="]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# The forward rule of the matrix product, `d(a · b) = da · b + a · db`: the rule is filed
# (`tensor:matmul` -> `matmul` at two operands in `rulesets.jvp`, so the old refusal -- "the operator
# has no forward rule bound at all" -- is gone), and this case records the wall that keeps it from
# answering: a constant has a zero tangent only where the value has a pair, and `pairTypeOf` writes a
# pair for a floating scalar and nothing else, so the constant array operand gets no tangent node and
# the walk gives up on the body without naming an operator. When the lift can carry an array's zero,
# this expectation flips to `jvp matmul dx=(1,0) value=5.0000 tangent=1.0000` and
# `jvp matmul dx=(0,1) value=5.0000 tangent=2.0000` (A = [[1, 2], [3, 4]], x = (1, 2)).
[[tests]]
name = "transforms.jvp_matmul"
desc = "The rule for `tensor:matmul` is indexed, and it still cannot answer -- but not for the reason this entry used to give. It said the constant `A`'s zero tangent had no node (`pairTypeOf` carrying a pair for a floating scalar only), and that is no longer true: `jvp` writes the zero of an array type too, so the lift now carries the `float[2, 2]` constant's tangent and the walk goes on past `matmul` to the index that reads one element of its result -- `matmul(A, x)[0]`, where the value is a `float[...]` and the law `jvp_idx_arr` is written for a rank-one `T[]`, so the refusal is `jvp has no forward rule for `:op/idx_arr`` with the two port lists and the data-operand count. The hand calculation the day the last wall falls: `A · x = (5, 11)`, so the value is 5, and the tangents along `(1, 0)` and `(0, 1)` are 1 and 2."
kind = "negative"
case = "../../../cases/compile/transforms/jvp_matmul.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "diagnostics", "stdout_normalized"]
expect_exit = 1
expect_stdout_contains = ["jvp has no forward rule for", ":op/idx_arr"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "transpose_unread_parameter_answers_zero"
desc = "`f(x, y) = x * 2.0` never reads `y`, and the transpose answers a zero cotangent for it: `back(1.0)` prints `(2.0, 0.0)` and exits 0. The case was written expecting a refusal and the first run answered `(2.0, 0.0)` -- a parameter the body does not read has no influence, so its cotangent is zero, and that is the reading this pins."
kind = "behavior"
case = "../../../cases/compile/transforms/transpose_unread_parameter_answers_zero.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_output_contains = ["(2.0, 0.0)"]

# The neighbour above answers a zero for an unread *number*; an unread *array* is stopped one gate
# before that answer is the walk's to give, and the case pins which gate stops it rather than the
# refusal it was written to expect. It is a refusal entry, not a known failure: the sentence is the
# reading, and a tree that starts answering a number here has to say so by turning this entry red
# instead of leaving a stale green behind.
[[tests]]
name = "transpose_unread_array_parameter_stops_earlier"
desc = "`g(x: float[], n: float) = n * 2.0` never reads `x`, and the transpose of it does not reach `skip=unread-parameter` at all: the walk answers from the type, one gate earlier. This entry pinned the refusal that stood there (`autodiff: a zero tangent array needs an array with a tangent`, exit 1) and now pins the reading that replaced it -- `([], 2.0)`, exit 0 -- because `transpose` asks the parameter's tangent space for the zero and, when the member holds no value for that parameter, writes the zero the type states: the same rule, in the same words, as `jvp`'s `zeroConstantFor`. A type that leaves a dimension open states no size for it, and a zero of it has 0 elements there, so an unread `float[]` answers `[]` where an unread `float` answers `0.0`; the difference between the two entries is the type, not the reading. The refusal it used to pin was a different defect (`:tangent/zeros_arr` named in the walk's own source, handed a node of the source graph). Whether an empty array is the right zero for a length nobody stated is the open question this entry leaves to `docs/handover/questions/2026-11-04-is-an-open-rank-zeros-answer-an-empty-array-or-a-refusal.cn.md`."
kind = "behavior"
case = "../../../cases/compile/transforms/transpose_unread_array_parameter_stops_earlier.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_output_contains = ["([], 2.0)", "TRANSPOSE function=g graph=", "type=(float) => (float[], float)"]
expect_output_not_contains = ["skip=unread-parameter"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# The same wall from the other side, and the one the zero carrier answers. `transpose` answers one
# cotangent per parameter and passes nothing else (design principles 9.9: every parameter is a linear
# input), while this body reads its array parameter to build a zero array of that array's shape. What
# the law needs from that read is the parameter's **shape**, and since `lane-trefuse` the shape a
# parameter's type states is enough to carry it: the zero carrier answers `pick(x: float[3]) = x[1]`
# as `([0.0, 1.0, 0.0])` -- slot 1 filled, every other slot zero -- without being handed the value.
# So the entry asserts that array and exit 0, on both back ends, and pins that the crash this program
# used to be (`Runtime indirect call norm-arity mismatch ... has 1 args, target graph
# 'transpose_of_pick' has 2 norm ports` on nvm, `FastVM indirect call norm-arity mismatch ...
# expected 2, got 1` and exit 134 on fvm) does not come back.
#
# This is the zero carrier answering by type, not a widened criterion: the refusal is still raised
# for the positions whose law reads *elements* rather than shapes (`#mul_tensor_t`'s `ct * w`,
# `#relu_t`'s `where(x > 0.0, ct, 0.0)`), which no shape can stand in for.
[[tests]]
name = "transpose_refuses_a_parameter_value_it_cannot_be_handed"
desc = "`transpose(pick)` where `pick(x: float[3]) = x[1]`: the cotangent of `x` is a zero array of its shape with slot 1 filled, and the shape is written in the parameter's type, so the zero carrier answers it without being handed the value -- `back(1.0)` prints `([0.0, 1.0, 0.0])` and exits 0 on both back ends. The entry used to pin a refusal here. Before the zero carrier landed this program was a crash on both back ends -- a norm-arity count on nvm whose help asked for the program to be reported, an abort with exit 134 on fvm -- so the entry still asserts that neither of those sentences appears."
kind = "behavior"
case = "../../../cases/compile/transforms/transpose_refuses_a_parameter_value_it_cannot_be_handed.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["([0.0, 1.0, 0.0])"]
expect_output_not_contains = ["Invariant Violation", "norm-arity mismatch", "defect of the compiler", "report the program"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "jvp_of_a_power"
desc = "`x ^ 2.0` is a power of a float, and until 2026-11-04 the transform could not lift it: `^` had no key (`ruleKeyOf` derives a `:op/` key only from `add sub mul div neg`), so the walk stopped with `skip=rule uri=:op/pow_d reason=the operator has no forward rule bound at all`. `pow` is one of the written operations now, and `jvp_pow` is its rule, so `d(x^2)` answers `2x dx`: 9.0 and 6.0 at x = 3, and 9.0 and -6.0 at x = -3. The second pair is the one that keeps the rule honest: the constant exponent's tangent has a **structural** zero (a constant has no tangent), so the term that tangent multiplies -- `x^w * log(x) * dw`, whose `log(-3.0)` is NaN -- is not built at all, and `omit=structurally-zero-tangent` in the expansion's reading is the record of it (the 2026-11-04 ruling: the term is omitted where the rule is expanded, `modules/transforms/rule_expand.cpp`, and `pow_tangent`'s `if dw == T(0)` guard is gone; the rule no longer branches on a tangent's value). The third function writes the exponent as the integer literal `2`: the lift sees one operator (`rules=jvp_pow` alone, no `jvp_ltod`) and the exponent's tangent is a constant `0.0` written in the graph, which the expansion recognises by its own type and value -- `omit=structurally-zero-tangent` appears for it too, and the tangent is the same 6.0."
kind = "behavior"
case = "../../../cases/compile/transforms/jvp_of_a_power.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["REINTERP jvp function=p graph=", "rules=jvp_pow", "omit=structurally-zero-tangent", "REINTERP jvp function=q graph=", "REINTERP jvp function=s graph=", "9.0", "6.0", "-6.0", "56.66253179403897", "-0.037037037037037035", "nan"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "tangent_of_a_pack_keeps_every_parameter"
desc = "A type function applied to a pack answers one member per member. `...Tangent<ParamsOf<F>>` in a function type's parameter list -- the splice `types` writes to declare `Jvp<F>` and `Vjp<F>` -- read as the empty tuple for every parameter, so a function whose parameters are arrays declared no tangent at all and the call that its own declaration asked for was refused. `Tangent<float[...]>` is `float[...]` and `Tangent<int[...]>` is `()`, so the reading agrees with the declared type for a function of `int`, `string` and `bool` (where every tangent is `()`) and disagrees only for a parameter that has something to differentiate: `(a: float[...], b: int[...], c: int[...]) => float` is six parameters at `(...ParamsOf<F>, ...Tangent<ParamsOf<F>>)`, three values and then the tangent of each, with both `int[...]` parameters still in place though their tangents are the same type. `Vjp<F3>` then equals the type written out by hand, pullback and all. The last line is the case that must not change: a function of two floats keeps two tangents, both `float` -- the reading that already worked, and the one a splice that merged members by type would have broken."
kind = "behavior"
case = "../../../cases/compile/transforms/tangent_of_a_pack_keeps_every_parameter.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["tangent_of_float_array true", "tangent_of_int_array true", "params_of_f3 true", "params_and_tangents true", "vjp_of_f3 true", "tangents_of_two_floats true"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "transpose_hand_closed_lambda.same_answer_as_the_cut"
desc = "The criterion of the 2026-11-03 rework as two readings of one number: a lambda a caller closes by hand and the second half `split` builds answer the same. `g(x) = x*x` at 3 lifts to `(x, dx) => (x*x, x*dx + x*dx)`, so the cut's second half is `lin(dx) = 6*dx`; a lambda written by hand over the same value, `(dx) => 2.0 * x * dx` with `x = 3`, is the same linear map spelled without a cut. Every transpose is asked at cotangent 1 and 3, so the four readings are 6, 18, 6, 18: the pair 6/6 is the criterion, and 18 is on no forward line, so an answer only proportional to the cotangent can produce it. Before the rework the cut's half answered and the hand-closed one refused -- `34788b554` gave every closure member the number of the parameter whose value it held, and a closure a caller wrote records nothing -- which made the result depend on where the graph came from."
