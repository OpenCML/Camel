# A loop body that reads a value from outside its own region sends a round's cotangent to that value,
# and the loop hands back one state -- so the transpose used to refuse. It now carries those
# cotangents as states of its own: one accumulator per escaped value, all beside the one carried
# cotangent, all advanced by the same rounds. It is one loop, not one loop per escape. The reading did
# not go away when the fix landed: `captures` is how many values escaped and one `ESCAPE` line still
# names each of them -- the value the cotangent landed on (`target`), the node whose rule handed it
# out (`from`, always an `Oper`: the body's own product, never a port), and the loop's `norm` and
# `with` inputs, which stay the old loop's own.
#
# `carried=` replaced `skip=state`, and `answer=` says which of two things a count means, because
# "two escapes" is not one situation: `answer=summed` is one value read by several products (the
# products add into one sum, and if that value is also the one the state starts from, the state's
# cotangent adds to it) -- 15 and 22 below. `answer=per-target` is several values, one sum each, and
# nothing is added across values -- `read_outer` below, whose 29 is 15 through `x` and 14 through `k`.
#
# A loop that already carries two states before anything escapes -- `carried` below -- needs one
# cotangent per state, not one, and the loop's value is then a tuple. Using it means reading a
# component (`t.0`), which is where the second channel starts: a component read fills that slot of the
# tuple's cotangent and leaves the rest zero, so `first` answers 1 and `second` answers 2 from the same
# tuple, and `carried` answers 10 with its accumulators after the two states. Before that channel every
# one of the three refused at `skip=output`, and with it every tuple-shaped value in a transposed
# function refuses the same way -- which is what the switch flips.
#
# Three readings then take the same ruler to the rest of the channel: the second state of that loop
# (`carried_p`, 7 rather than 10, which only the slot index can tell apart), a tuple inside a tuple
# (`nested`, `t.0.1`, where the cotangent is a tuple in a tuple's slot), and both slots of one tuple
# read at once (`both`, 3, where two reads are two slots of one cotangent and add). Each case answers
# its transpose twice, the second time with twice the cotangent, because a plan line the forward
# reading already satisfies cannot tell a working transpose from a silent zero -- `nested` answered 0.0
# for exactly that reason until the tuple-in-a-tuple rule was written, and its forward 2.0 had hidden
# it.
# A better pin for these two cases is derived and is not here on purpose: lane-norm-arity re-pins both
# to `split(jvp(...))` at `x = 2` (value 30, cotangent 15 -- at `x = 1` both are 15, so a run that
# answered the value where the cotangent belongs would look right). Measured on this tree that pin fails
# with "transpose has no transpose for this function: a loop carries...", because the reverse walk
# `split(jvp(...))` needs is not on develop yet, and taking it here would have added two reds. The pin
# lands when the walk does; this note is what tells the next reader why the better pin is absent.
[[tests]]
name = "transpose_loop_escape.names_the_value_one_read"
desc = "`read_one(x) = loop s = x for i in 0..3 do 2.0*s + x` reads the parameter inside the loop body, so every round's cotangent lands on `x` and has to leave the loop. The loop carries it as a second state and answers 15 -- `s = 2s + x` three times is `8x + 7x`, the state's own cotangent 8 plus the carried sum 7 -- where before this cut it refused with `skip=state`. The reading is kept: `carried=1` in place of `skip=state`, `answer=summed` because the escaped value is the one the state starts from, `captures=1`, and the `ESCAPE` line still names the parameter port as the target and the body's `add` as the product that handed the cotangent out. A channel that dropped that line when it started working could not be compared with the refusal it replaced."
kind = "behavior"
case = "../../../cases/compile/transforms/transpose_loop_escape_reads_one.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code"]
expect_exit = 0
# Pinned before 17:10 and held back on purpose until `jvp` had a forward transform for a loop
# (`REINTERP jvp function=read_one skip=loop`); re-pinning it before that would have been a guess.
# That condition is met now, and the shape below is read off the run rather than guessed: the
# transposed member answers `(float) => (float,)`, one cotangent in and one per parameter out.
expect_output_contains = ["TRANSPOSE function=read_one carried=1 node=10 origin=0 captures=1 answer=summed", "ESCAPE target=0 from=9 kindOfFrom=11 kindOfTarget=1 typeOfTarget=float norm=[3,0,] with=[9,11,]", "TRANSPOSE function=read_one graph=", "type=(float) => (float,) nodes=12 arms=0 rhs=add_t,mul_t", "15.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

