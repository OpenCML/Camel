expect_output_contains = ["6561.0", "17496.0", "REINTERP jvp function=f graph="]
expect_stdout_not_contains = ["0.0\n0.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

