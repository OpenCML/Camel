# ---- `mean` at a negative axis: the engine's numbers, and the library's law reading the axis ----
#
# One lane, two spellings. `mean<-1, true>(x)` says "the last axis" without counting the rank, and
# on a 2x3 value it names axis 1, the lane `mean<1, true>(x)` names. The two entries below are one
# pair: the first pins the numbers the engine answers and that both spellings answer the same ones;
# the second pins that the library's own path answers the same numbers through its own machinery.
#
# The pair is the reading that "the library answers what the engine answers" is measured on for this
# operator. The library's half is the stated one: `jvp_mean_axis` hands its adjoint the axis, the flag
# and the extents in one list (`mean_axis_stated`), and `mean_axis_stated_t`'s `mean_axis_cotangent`
