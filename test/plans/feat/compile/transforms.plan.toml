backends = ["nvm"]
backends_agree = ["exit_code", "stdout"]
expect_exit = 0
expect_stdout_contains = ["vjp_ruleset value=8.0", "(12.0)", "vjp_ruleset cotangent=12.0", "vjp_ruleset grad=12.0"]
