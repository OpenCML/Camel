id = "compile.range_functions"
order = 324
tier = "fast"
tags = ["feat", "compile", "overloads", "range"]
desc = "Temporary probe: which of the functions a range shares with an `int[]` resolve once they are ordinary prelude functions declared beside the operator of the same name."

[[tests]]
name = "range_len"
kind = "behavior"
case = "../../../cases/compile/overloads/range_len.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "5\n5\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

