# Diagnostic plan (lane S1-6, 2026-11-20). Not a contract: the same program is compiled by 20
# independent process launches on each back end, and every launch must print the same graph. A
# compile whose shape follows an address prints two different graphs here; a compile that reads
# only what the source says prints one. Remove before the fix is merged.
id = "compile.s16determinism"
order = 998
tier = "fast"
tags = ["feat", "compile", "stream", "probe"]
desc = "Twenty process launches of the same program, agreeing on the graph they print."

[[tests]]
name = "stream.s16det_r01"
desc = "Launch 1 of 20: this program's graph, as this process built it."
kind = "behavior"
case = "../../../cases/compile/stream/generators_shapes_consumed.cml"
args = ["${case}", "std::gir", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]

