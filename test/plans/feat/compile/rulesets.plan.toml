expect_output_contains = ["[2.0, 5.0, nan]", "[-0.0, 3.0, nan]", "[3.0, 12.0, nan]", "[6.0, nan]", "[1.0, nan]", "[5, 4]", "[1, 0]", "rules=vmap_rule_max elements=float", "rules=vmap_rule_min elements=float", "rules=vmap_rule_max elements=int", "rules=vmap_rule_min elements=int", "rules=vmap_rule_sum elements=float"]
