# A capture is part of the *function value*, and the transform has to copy it. `make(3.0)` answers
# `(x) => x + c` with `c` in the value's closure; the walk of the body used to answer every port with
# the batch parameter, so the capture read `x` and `x + c` computed `2x` -- `[2.0, 4.0, 6.0]` where
# the answer is `[4.0, 5.0, 6.0]`, printed in silence (author's review of 2026-11-02, high-2). The
# capture now enters the batched graph as a constant, lifted the way a constant written in the body is
# lifted, in the source graph's capture order.
[[tests]]
name = "vmap_reads_a_captured_value"
desc = "A function that captures a value, batched: `vmap(make(3.0))` over `[1.0, 2.0, 3.0]` answers `[4.0, 5.0, 6.0]` -- `1+3, 2+3, 3+3`, hand-computed -- because the capture is a constant of the batched graph and not the batch element it was answered with before (`[2.0, 4.0, 6.0]`, the defect the author's review reports). The second line is the same defect with two captures: `make2(2.0, 1.0)` answers `(x) => x * a + b`, so the batch is `[3.0, 5.0, 7.0]` and both captures are read in their own order rather than both folding into the batch (`[2.0, 6.0, 12.0]` before). The reading beside them is the count: one primitive asked and answered for `+` and two for `*` then `+`, the rule names in the order the walk asked."
kind = "behavior"
case = "../../../cases/compile/transforms/vmap_capture_is_a_constant.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_contains = ["asked=1 found=1 missing=0 rules=vmap_rule_add elements=float", "[4.0, 5.0, 6.0]", "asked=2 found=2 missing=0 rules=vmap_rule_mul,vmap_rule_add elements=float", "two captures=[3.0, 5.0, 7.0]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# `remat` copies the graph and sets one bit on the copy, so the copy is the same function -- and a
# copy that declared none of the graph's captures was not: the value still carried the closure, the
# graph said it took none, and every read of a capture answered the zero of its slot. `make(3.0)(1.0)`
# printed `1.0` where `4.0` is the answer, and batched it printed `[2.0, 4.0, 6.0]` where the answer is
# `[4.0, 5.0, 6.0]` (the same capture-loss class as `vmap`'s).
[[tests]]
name = "remat_keeps_a_captured_value"
desc = "A function that captures a value, marked for recomputation: `remat(make(3.0))(1.0)` answers `4.0` -- `1 + 3` -- where it printed `1.0` (the capture's slot read as its zero), and the same function batched through `vmap` answers `[4.0, 5.0, 6.0]` where it printed `[2.0, 4.0, 6.0]`. The mark still sets the property on the copy, which the `in_recompute=0 out_recompute=1` lines say, and the numbers are the same on the two back ends. Before 2026-11-02 the copy declared no capture port at all, so a call through the marked value bound nothing (author's review, high-2)."
kind = "behavior"
case = "../../../cases/compile/transforms/remat_capture_is_a_constant.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_contains = ["in_recompute=0 out_recompute=1", "remat capture value=4.0", "[4.0, 5.0, 6.0]", "asked=1 found=1 missing=0 rules=vmap_rule_add elements=float"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
