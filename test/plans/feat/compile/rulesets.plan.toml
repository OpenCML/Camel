id = "compile.rulesets"
order = 1007
tier = "fast"
tags = ["feat", "compile", "rulesets", "transforms"]
desc = "A ruleset is a module of the standard library the transforms read: `rulesets.jvp` exports `Lift<T>` (a value and the tangent of that value) and `lift`, which turns a value into itself plus the zero tangent of its type -- the zero number for a float, the zero tensor for a tensor, and the empty tuple where the type has no tangent"

[[tests]]
name = "rulesets.jvp_lift"
desc = "`lift(3.0)` is `(3.0, 0.0)`: a float's tangent is a float and the zero of it is the zero number. `lift(7)` is `7` with the empty tuple -- the `()` annotation is the type assertion, not a printed value."
kind = "behavior"
case = "../../../cases/compile/rulesets/jvp_lift.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "diagnostics", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "3.0\n0.0\n7\n2\n2\n1\n2.0\n2.0\n0.25\n0.25\n0.125\n0.125\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "rulesets_rule_heads"
desc = "The index of a module's rules is built from the heads of their left sides, read where the rules are written: `x + w` is filed under `+`, `x * w` under `*`, and `-x` under `-`. The probe prints one line per rule, so the index is read rather than assumed."
kind = "behavior"
case = "../../../cases/compile/rulesets/rulesets.probe_rule_heads.cml"
args = ["${case}", "std::rulesets", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "diagnostics", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "RULESET rulesets.probe_rule_heads */2 -> mul_rule\nRULESET rulesets.probe_rule_heads +/2 -> add_rule\nRULESET rulesets.probe_rule_heads -/1 -> neg_rule\n1\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "rulesets_duplicate_head_refused"
desc = "A second rule under one head is refused, and the refusal names both rules and the head: the transform would otherwise choose between them by the order they are written in."
kind = "negative"
case = "../../../cases/compile/rulesets/rulesets.err_duplicate_head.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::DuplicateRuleForOperator"
expect_diagnostic_code = "0x03000205"
expect_diagnostic_line = 7

[[tests]]
name = "rulesets_left_not_operator_refused"
desc = "A rule whose left side is a bare name is refused, and the refusal says what was written: the shape is named, because the writer cannot see that the index needs an operator at the head."
kind = "negative"
case = "../../../cases/compile/rulesets/rulesets.err_left_not_operator.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::RuleLeftIsNotAnOperator"
expect_diagnostic_code = "0x03000204"
expect_diagnostic_line = 3

[[tests]]
name = "rulesets_arity_keeps_two_primitives_apart"
desc = "`-x` and `x - w` write the same operator token and are two primitives (`__neg__` and `__sub__`). The index files a rule by the operator and the number of operands, so one module holds a rule for each and neither is refused as the other's duplicate."
kind = "behavior"
case = "../../../cases/compile/rulesets/rulesets.probe_arity.cml"
args = ["${case}", "std::rulesets", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "diagnostics", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "RULESET rulesets.probe_arity -/1 -> neg_rule\nRULESET rulesets.probe_arity -/2 -> sub_rule\n1\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "rulesets_arity_of_a_call_counts_its_arguments"
desc = "A rule whose left side is a call is filed under the head of that call and the number of arguments it writes: `one(a)` is `one/1`, `two(a, b)` is `two/2`, `three(a, b, c)` is `three/3`. The count is the arguments, not the children of the call's bracket node -- those are the same three (bracket, argument list, bracket) for every call, which files all three rules under three and leaves the one- and two-argument rules unreachable by the operator that writes them. The arity is part of the key, so it is pinned through the pass that prints the index: `std::rulesets`."
kind = "behavior"
case = "../../../cases/compile/rulesets/rulesets.probe_call_arity.cml"
args = ["${case}", "std::rulesets", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "diagnostics", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "RULESET rulesets.probe_call_arity one/1 -> one_rule (rhs one)\nRULESET rulesets.probe_call_arity three/3 -> three_rule (rhs three)\nRULESET rulesets.probe_call_arity two/2 -> two_rule (rhs two)\n1\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "rulesets_lookup_answers_and_says_why_not"
desc = "The index is asked through `lookupRule(family, head, arity)` -- the function a transform asks -- by the `std::rulesets` pass (`query=`), and the answers are pinned: `-` with one operand in `rulesets.jvp` is `jvp_neg`, `-` with two is `jvp_sub` (two primitives, one token), `-` with three has no rule, and a family no module declares is unknown. The two ways of not finding a rule are named apart, because the repairs differ: write the rule, or import the ruleset. A program that asks nothing prints nothing. The three binding tables are then checked against the index the same pass printed, and nothing in the case counts rules: every binding resolves, asking the index for that key answers the same rule the binding printed, and each family holds exactly the keys its table binds -- so a rule or a binding added to either half is checked as it is added, instead of a written number going red for the one change that cannot be wrong."
kind = "behavior"
tool = "python"
case = "../../../cases/compile/rulesets/rulesets_lookup.py"
args = ["${case}", "--camel", "${camel}"]
expect_exit = 0
expect_stdout_contains = ["ruleset lookup: PASS"]
expect_output_not_contains = ["FAIL"]
timeout_ms = 60000

[[tests]]
name = "rulesets_keys_are_derived_and_the_exceptions_are_printed"
desc = "No operator is bound to a key by hand: `std::rulesets forward=true` prints the three operators whose key cannot be derived from the operator itself, each with the reason, and the sentence saying how every other key is derived. `xs[i]` is a bracket form, which is none of `a <op> b`, `<op> a` or `f(a, b)`, so `:op/idx_arr`'s rule is filed under the call `index_into(x, i)`; `float(n)` is `float` at one operand, a spelling every conversion to a double shares, so `:op/ltod`'s rule is filed under the call `float_of_int(n)`; `*/2` is already `:op/mul_d`'s key, so `tensor:multiply`'s rule is filed under `mul_tensor(x, w)`. The three lines print on every run of the pass, not only when asked for, because an exception only visible on request is an exception nobody reads. The other half of the reading -- the key an operator's rule is looked up under -- is asked with an operator and no field (`query=:op/itod`): a conversion's key is the spelling of the destination the registration states (`float` for `:op/itod`, and `int` for `:op/dtol`, which the old letter table could not spell at all), and an operator that converts nothing has no key at all -- `:var/get` reads a variable, its result is a float, and it must not be given a conversion's key."
kind = "behavior"
case = "../../../cases/compile/rulesets/rulesets_lookup.cml"
args = ["${case}", "std::rulesets", "forward=true", "query=:op/itod;:op/dtol;:var/get", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "diagnostics", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["RULEKEY-EXCEPTION :op/idx_arr -> index_into/2 because", "RULEKEY-EXCEPTION tensor:multiply -> mul_tensor/2 because", "RULEKEY derivable: an operator's key is its own spelling", "KEY :op/itod -> float/1", "KEY :op/dtol -> int/1", "KEY :var/get -> none"]
expect_stdout_not_contains = ["FORWARD ", "VMAP ", "-> no rule", "no such family"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "rulesets_probe_missing_says_no_rule_for_div"
desc = "A ruleset with four of the five scalar primitives answers `no rule` for `/` and a name for the other four. This is the fixture a replacement needs: the missing rule is a property of a test ruleset, not of the production one, so the production rules stay complete. What it pins today is the index's answer and nothing more -- the refusal at the primitive belongs to `reinterp`, which does not exist yet, and the case says so rather than pretending this reading is that refusal."
kind = "behavior"
case = "../../../cases/compile/rulesets/rulesets_missing.cml"
args = ["${case}", "std::rulesets", "query=rulesets.probe_missing|+|2;rulesets.probe_missing|-|1;rulesets.probe_missing|*|2;rulesets.probe_missing|/|2", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "diagnostics", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["LOOKUP rulesets.probe_missing +/2 -> add_ok", "LOOKUP rulesets.probe_missing -/1 -> neg_ok", "LOOKUP rulesets.probe_missing */2 -> mul_ok", "LOOKUP rulesets.probe_missing //2 -> no rule", "RULESET rulesets.probe_missing -/2 -> sub_ok"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "rulesets_vmap_elementwise_keys"
desc = "The `vmap` ruleset files the elementwise tier under the five keys the scalar arithmetic already has: `+`, `-`, `*`, `/` at two operands and `-` at one (`-x` and `x - w` are two primitives that share one token, which is why the operand count is part of the key). `std::rulesets query=` asks the index the way a transform asks it, and the answers are pinned: every key resolves to its `vmap_*` rule and `+` at three operands has no rule. The right side of each rule takes the *lifted* operands and answers the lifted result, which for `vmap` is one batch -- that is what `Lift<T> = RowsOf<T>` says, and the reading beside this one shows the two writings agree bit for bit."
kind = "behavior"
case = "../../../cases/compile/rulesets/vmap_ruleset.cml"
args = ["${case}", "std::rulesets", "query=rulesets.vmap|+|2;rulesets.vmap|-|2;rulesets.vmap|-|1;rulesets.vmap|*|2;rulesets.vmap|/|2;rulesets.vmap|+|3", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "diagnostics", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["RULESET rulesets.vmap +/2 -> vmap_rule_add", "RULESET rulesets.vmap -/2 -> vmap_rule_sub", "RULESET rulesets.vmap -/1 -> vmap_rule_neg", "RULESET rulesets.vmap */2 -> vmap_rule_mul", "RULESET rulesets.vmap //2 -> vmap_rule_div", "LOOKUP rulesets.vmap +/2 -> vmap_rule_add", "LOOKUP rulesets.vmap -/2 -> vmap_rule_sub", "LOOKUP rulesets.vmap -/1 -> vmap_rule_neg", "LOOKUP rulesets.vmap */2 -> vmap_rule_mul", "LOOKUP rulesets.vmap //2 -> vmap_rule_div", "LOOKUP rulesets.vmap +/3 -> no rule"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "vmap_elementwise_agrees_with_row_by_row_map"
desc = "The ruleset alone, with no transform: `array.vmap` is a row-writing `map`, and these are the numbers a batched function has to answer -- `[1.5, 4.0, 6.5, 0.25]` for `x*2.0 + x/2.0 - 1.0`, `[0.375, 6.0, -9.0]` for its negation, and `lift(3.0)` the batch of one row (`[3.0]`). The pairs are compared with each other rather than with a written golden, because what this pins is that the two writings are one computation; `vmap_transform_agrees_with_row_by_row_map` below is the same comparison for the transform that reads this ruleset, and the two readings must agree."
kind = "behavior"
case = "../../../cases/compile/rulesets/vmap_ruleset.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.split('\n')
assert(out[0] === out[1] && out[0] === '[1.5, 4.0, 6.5, 0.25]', `f: ${out[0]} vs ${out[1]}`)
assert(out[2] === out[3] && out[2] === '[0.375, 6.0, -9.0]', `g: ${out[2]} vs ${out[3]}`)
assert(out[4] === '[3.0]', `lift: ${out[4]}`)
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "vmap_transform_agrees_with_row_by_row_map"
desc = "`reinterp<vmap>` -- the transform -- against the row-by-row `map` of the same function: `vmap(f)(xs)` and `xs->map(f)` print the same numbers bit for bit, and so do `vmap(g)(ys)` and `ys->map(g)`. The transform asks `rulesets.vmap` for every primitive of the body and calls the function the rule names with the batches, so the reading beside the values is the count: `asked=4 found=4` for `f` and `asked=5 found=5` for `g`, with the five rules named in the order the walk asked. A ruleset that is written is not a ruleset that is used, and this is the cell that says it was asked."
kind = "behavior"
case = "../../../cases/compile/transforms/vmap_elementwise.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_contains = ["REINTERP vmap function=f graph=", "kinds=8/8 asked=4 found=4 missing=0 rules=vmap_rule_mul,vmap_rule_div,vmap_rule_add,vmap_rule_sub", "REINTERP vmap function=g graph=", "kinds=9/9 asked=5 found=5 missing=0 rules=vmap_rule_mul,vmap_rule_div,vmap_rule_add,vmap_rule_sub,vmap_rule_neg", "REINTERP vmap op signature=(f: (f32) => f32) => (f32[]) => f32[]", "same=yes"]
verify_script = """
({ input, assert }) => {
const values = input.normalized.stdout.split('\n').filter(line => line.startsWith('['))
assert(values.length === 4, `printed ${values.length} values: ${JSON.stringify(values)}`)
assert(values[0] === values[1] && values[0] === '[1.5, 4.0, 6.5, 0.25]', `f: ${values[0]} vs ${values[1]}`)
assert(values[2] === values[3] && values[2] === '[0.375, 6.0, -9.0]', `g: ${values[2]} vs ${values[3]}`)
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "vmap_batches_the_product_of_two_arrays"
desc = "`r * r` on a row, batched: `tensor:multiply` is not `:op/mul_d` and it has no token a rule's left side could be written with, so its rule is filed under a call -- `mul_tensor` at two operands -- and the operator is bound to that key where it is declared. The reading says the rule was reached (`asked=1 found=1 missing=0 rules=vmap_rule_mul_tensor`), and the values say the two writings are one computation: `[[1, 2, 3], [4, 5, 6]]` squared is `[[1.0, 4.0, 9.0], [16.0, 25.0, 36.0]]` row by row and by the transform, and a batch of one row is still one row (`[[4.0, 9.0, 16.0]]`). The batch is `Lift<f32[3]>` = `f32[?, 3]`, one dimension in front of the row, and the transform multiplies the whole batch at once -- the same operator, so the same bits."
kind = "behavior"
case = "../../../cases/compile/rulesets/vmap_array_product.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_contains = ["REINTERP vmap op signature=(f: (f32) => f32) => (f32[]) => f32[]", "type=(f32[?, 3]) => f32[?, 3]", "asked=1 found=1 missing=0 rules=vmap_rule_mul_tensor", "same=yes"]
verify_script = """
({ input, assert }) => {
const values = input.normalized.stdout.split('\n').filter(line => line.startsWith('['))
assert(values.length === 4, `printed ${values.length} values: ${JSON.stringify(values)}`)
assert(values[0] === values[1] && values[0] === '[[1.0, 4.0, 9.0], [16.0, 25.0, 36.0]]', `rows: ${values[0]} vs ${values[1]}`)
assert(values[2] === values[3] && values[2] === '[[4.0, 9.0, 16.0]]', `one row: ${values[2]} vs ${values[3]}`)
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "vmap_batches_the_element_of_a_row"
desc = "`r[0] + r[1]` on a row, batched: `:op/idx_arr` is the one primitive of the elementwise tier that reduces rank, so it is the one whose rule's type parameter is not its operand's type -- a rule is instantiated at the primitive's result type (`f32`), while the value indexed is the row (`f32[3]`). The rule states the row as `T[]` and its batch as `Lift<T[]>` (`f32[?, ?]`), hands back `Lift<T>` (one element per row), and costs one strided read per row. The reading says the rules were reached -- `asked=3 found=3 missing=0 rules=vmap_rule_idx,vmap_rule_idx,vmap_rule_add` -- and the values say the two writings are one computation: `[[1, 2, 3], [4, 5, 6]]` gives `[3.0, 9.0]` both ways, and a batch of one row gives `[15.0]`."
kind = "behavior"
case = "../../../cases/compile/rulesets/vmap_row_element.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_contains = ["type=(f32[?, 3]) => f32[]", "asked=3 found=3 missing=0 rules=vmap_rule_idx,vmap_rule_idx,vmap_rule_add", "same=yes"]
verify_script = """
({ input, assert }) => {
const values = input.normalized.stdout.split('\n').filter(line => line.startsWith('['))
assert(values.length === 4, `printed ${values.length} values: ${JSON.stringify(values)}`)
assert(values[0] === values[1] && values[0] === '[3.0, 9.0]', `rows: ${values[0]} vs ${values[1]}`)
assert(values[2] === values[3] && values[2] === '[15.0]', `one row: ${values[2]} vs ${values[3]}`)
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "vmap_matmul_agrees_with_row_by_row_map"
desc = "`matmul` batched: the batch is one axis in front of both operands, which is exactly the axes `matmul` already walks as batch axes, so the rule is the operator over the lifted operands -- no row loop, no reshape. `f` multiplies by the matrix it writes (`w = [[1, 2], [3, 4]]`, which is the batch of one row), and the two rows `[[1, 2], [3, 4]]` and `[[5, 6], [7, 8]]` answer `[[7, 10], [15, 22]]` and `[[23, 34], [31, 46]]` -- read by hand from `p + 3q` and `2p + 4q`. The second line is the row-by-row `array.vmap` of the same function and the plan compares the two strings rather than a written golden, because what this pins is that the two writings are one computation; the reading above them says the rule was asked for and answered: `asked=1 found=1 missing=0 rules=vmap_rule_matmul`."
kind = "behavior"
case = "../../../cases/compile/transforms/vmap_matmul.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_contains = ["REINTERP vmap function=f graph=", "asked=1 found=1 missing=0 rules=vmap_rule_matmul", "[[[7.0, 10.0], [15.0, 22.0]], [[23.0, 34.0], [31.0, 46.0]]]"]
verify_script = """
({ input, assert }) => {
const values = input.normalized.stdout.split('\n').filter(line => line.startsWith('['))
assert(values.length === 2, `printed ${values.length} values: ${JSON.stringify(values)}`)
