id = "compile.with_overloads"
order = 929
tier = "fast"
tags = ["feat", "compile", "overload"]
desc = "Functions of one name whose `with` parameter lists differ in count are one overload set"

[[tests]]
name = "with_overloads.by_count"
desc = "`total(xs)`, `xs->total<axis: 3>` and `xs->total<1, true>` pick three overloads of one name; `fill()` and `fill<3>()` two."
kind = "behavior"
case = "../../../cases/compile/with_overloads/by_count.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "diagnostics", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "2\n3\n11\n[0] [3]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "with_overloads.generic_explicit"
desc = "Generic functions of one name that differ in their `with` parameters: explicit type arguments choose among them by the count of `with` arguments written and by their names (`pick::<int>(1)` and `pick::<int><n: 2>(1)`; `tag::<int><label: 'a'>` and `tag::<int><times: 7>`)."
kind = "behavior"
case = "../../../cases/compile/with_overloads/generic_explicit.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "diagnostics", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "1\n[1, 1]\n[1, 1, 1]\na\n7\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
