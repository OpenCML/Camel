[[tests]]
name = "semantic.try_not_supported_json"
desc = "The not-supported diagnostic in JSON: one error, stage typecheck, the range of the whole try expression, the file; stdout is nothing but the array."
kind = "behavior"
case = "../../../cases/compile/semantic/try_not_supported.cml"
args = ["--output-format", "json", "${case}"]
expect_exit = 1
verify_script = """
const diags = JSON.parse(input.stdout)
assert(diags.length === 1, 'one diagnostic, got ' + diags.length)
const d = diags[0]
assert(d.severity === 'Error' && d.data.name === 'SemanticDiag::ConstructNotSupported', d.severity + ' ' + d.data.name)
assert(d.data.stage === 'typecheck', 'stage ' + d.data.stage)
assert(d.range.start.line === 8 && d.range.start.character === 4 && d.range.end.line === 14, 'range ' + JSON.stringify(d.range))
assert(d.data.modulePath.endsWith('try_not_supported.cml'), 'file ' + d.data.modulePath)
assert(input.stderr === '', 'stderr empty')
"""
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 4000
