[[tests]]
name = "semantic.throw_not_supported"
desc = "`throw` is rejected at compile time with ConstructNotSupported at the statement; it is no longer compiled as `return`."
kind = "negative"
case = "../../../cases/compile/semantic/throw_not_supported.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ConstructNotSupported"
expect_diagnostic_code = "0x0300001F"
expect_diagnostic_line = 10
expect_diagnostic_column = 9
expect_output_contains = ["'throw' is not supported: exceptions are not implemented."]
expect_output_not_contains = ["never printed", "UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 4000

