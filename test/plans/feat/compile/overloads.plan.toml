id = "compile.overloads"
order = 326
tier = "fast"
tags = ["feat", "compile", "functions", "overloads"]
desc = "User functions overloaded on their parameter types."

[[tests]]
name = "overloads.nvm"
desc = "Functions of one name with different parameter types are overloads, chosen by the argument types; the second used to be built into the graph of the first (nvm)"
kind = "behavior"
case = "../../../cases/compile/overloads/overloads.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "int",
  "string a",
  "two ints",
  "float",
  "42 abab",
  "3 5",
  "[2, 4]",
  "local int local bool",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

