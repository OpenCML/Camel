[[tests]]
name = "generic_overloads.nvm"
desc = "Generic functions of one name whose parameters differ in type are overloads (design principles 4.4): each call takes the one whose parameter accepts its argument, and instantiates its own type variables (nvm)"
kind = "behavior"
case = "../../../cases/compile/overloads/generic_overloads.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
assert(out === "generic_overloads sgd=1 adam=2 m=0.9", `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

[[tests]]
name = "generic_overloads_same_param_name"
desc = "Two generic overloads of one name that write the same parameter name each, both called in one module, each answer from their own declaration: `init<Sgd>` gives the first field of `SgdState` and `init<Adam>` the second of `AdamState`, so the two instances do not share a parameter of the same name. `Scope::enter(name)` reuses a child of that name, so an instance's scope is qualified by its template; without that, `opt` of the second instance resolved to the first instance's node of the other type."
kind = "behavior"
case = "../../../cases/compile/overloads/generic_overloads_same_param_name.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
assert(out === "generic_overloads sgd=1 adam=2 m=0.9", `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

[[tests]]
name = "generic_same_signature"
desc = "Two generic functions of one name whose parameter types cannot be told apart are one signature, so the second is a redeclaration, reported where it is declared"
kind = "negative"
case = "../../../cases/compile/overloads/generic_same_signature.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::Redeclaration"
expect_diagnostic_code = "0x03000001"
expect_diagnostic_line = 11
expect_diagnostic_column = 1
expect_output_contains = ["Redeclaration of reference: 'g'"]
expect_output_not_contains = ["never printed", "UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "same_signature"
desc = "A second function of one name with the same parameter types is a redeclaration, reported where it is declared"
kind = "negative"
case = "../../../cases/compile/overloads/same_signature.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::Redeclaration"
expect_diagnostic_code = "0x03000001"
expect_diagnostic_line = 12
expect_diagnostic_column = 1
expect_output_contains = ["Redeclaration of reference: 'f'"]
expect_output_not_contains = ["never printed", "UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "when_disjoint_same_signature"
desc = "Two ordinary functions of one name with the same parameters are told apart by their `when` conditions, as two declarations of a kernel are (design principles 4.4). Both `label` declarations write `(x: int): string`; `is_int::<int>()` holds and `is_text::<int>()` does not, so the call is the first declaration and prints its body's value where the second declaration of the same signature was a `SemanticDiag::Redeclaration`."
kind = "behavior"
case = "../../../cases/compile/overloads/when_ordinary_disjoint.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "integer\n"
expect_output_not_contains = ["Redeclaration", "UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "no_match"
desc = "A call none of the overloads takes is rejected at the call, with the overloads listed"
kind = "negative"
case = "../../../cases/compile/overloads/no_match.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "no_match.cml:16:14:", "(bool)", "f: (x: int) => string", "f: (x: string) => string"]
expect_output_not_contains = ["never printed", "UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "overloaded_name_as_value"
desc = "A name with several overloads has no single function value; returning it is rejected at the return"
kind = "negative"
case = "../../../cases/compile/overloads/overloaded_name_as_value.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::FunctionNameAsValue"
expect_diagnostic_code = "0x03000060"
expect_diagnostic_line = 16
expect_diagnostic_column = 5
expect_output_contains = ["'f' is used as a value here, but it names 2 functions of that name"]
expect_output_not_contains = ["never printed", "UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "ambiguous_literal"
desc = "A call whose numeric literal enters two parameter types is refused as ambiguous, not settled by declaration order (design principles 5.1); both candidates are listed and the help says to annotate the literal or add a cast."
kind = "negative"
case = "../../../cases/compile/overloads/ambiguous_literal.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::AmbiguousCall"
expect_diagnostic_code = "0x030000F4"
expect_diagnostic_line = 16
expect_diagnostic_column = 18
expect_output_contains = ["The call to 'scale' with (int) fits more than one overload", "(x: f32) => f32", "(x: float) => float", "annotate the literal with its type", "2 as f32"]
expect_output_not_contains = ["never printed", "UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "ambiguous_composite"
desc = "A call whose array literal enters two parameter types is refused the same way: a composite literal enters parameter types as a numeric one does, and several candidates in that pass are an ambiguity."
kind = "negative"
case = "../../../cases/compile/overloads/ambiguous_composite.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::AmbiguousCall"
expect_diagnostic_code = "0x030000F4"
expect_diagnostic_line = 17
expect_diagnostic_column = 17
expect_output_contains = ["The call to 'pick' with (int[])", "(xs: f32[]) => f32", "(xs: float[]) => float", "annotate the literal with its type", "2 as f32"]
expect_output_not_contains = ["never printed", "UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "exact_over_entering"
desc = "An exact match still wins over a literal entering a parameter type, whatever the declaration order: `[1.0]` is a `float[]` and `2.0` a `float`, so the float overloads are meant though the f32 ones are declared first."
kind = "behavior"
case = "../../../cases/compile/overloads/exact_over_entering.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "float[]\nfloat\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "single_entering"
desc = "A literal that enters exactly one candidate is accepted: entering is not an ambiguity by itself."
kind = "behavior"
case = "../../../cases/compile/overloads/single_entering.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "3.5\n2.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "decorated_overloads"
desc = "Overloads of which some are decorated are chosen by the parameters of what the decorators return, exact matches first; only the decorated function declared last used to be seen. The same on the four back ends."
kind = "behavior"
case = "../../../cases/compile/overloads/decorated_overloads.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "3 2.5",
  "18 3.0",
  "3 4.5",
  "21 21 21 21",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 20000

[[tests]]
name = "decorated_call_mismatch"
desc = "A call of a decorated function with an argument its decorated form does not take is rejected at the call; the float used to be read as an int."
kind = "negative"
case = "../../../cases/compile/overloads/decorated_call_mismatch.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ArgumentsMismatch"
expect_diagnostic_line = 15
expect_diagnostic_column = 18
expect_output_contains = ["Function of type '(x: int) => int' cannot be called with argument types: <> (float)."]
expect_output_not_contains = ["never printed"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000
