# The rule of a captured value (design principles 3.5): a closure captures a name by value wherever it
# is written, so a capture port is a value and reads inside the body are the port.
#
# `decideCaptureByValue` keeps the CELL in four shapes only, each for a reason of its own: a `var`
# parameter (the caller's cell), a module-level `var` (a value of the top level is captured by value
# only where the function is used as a value, so a capture of a name the program writes keeps the
# cell), the generator machine's own step function and a decorated block -- the last two because the
# write they make has to land in the cell (`requireCapturedNameWritable` exempts both). A
# by-reference capture's write would land in the cell the closure was handed, and a closure does not
# get one: assigning an outer name from inside a closure is refused, and the `err.*` entries below pin
# that refusal. The `byref` cases and the `stream` packer are written the way the rule allows -- the
# packer holds four `Ref`s.
#
# The other half of the rule: a closure may not assign an outer name, and a captured `var` may not be
# assigned between the making of the closure and its last use. Both are reported, and the `err.*`
# entries below are the ways that write is written. `tee` holds four `Ref`s and no cells, so its five
# outputs do not depend on this choice.
#
# The entries are of two kinds, and each says which it is:
#   - `ok.*` -- legal under the rule as it stands (the regression guards);
#   - `err.*` -- refused. The first one is refused by a rule that does not depend on the capture's kind:
#     an assignment to a `let` captured from the graph around it has no cell to write even where the
#     capture is of a cell, which is the general assignment rule (`ImmutablePassedToVarParam`,
#     `0x0300001D`). A closure assigning a captured name is `ClosureAssignsCapturedName`
#     (`0x03000213`), and a write after the closure is `CapturedVarWrittenAfterTheClosure`
#     (`0x03000214`).

[[tests]]
name = "ok.update_reads_a_captured_var"
desc = "A closure reads a `var` of the function that made it and writes nothing (`update(x, () => x + 1)`); legal under the rule, so this entry is a regression guard. The reading is 2."
kind = "behavior"
case = "../../../cases/compile/var_closure/ok_update_reads_captured.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "2\n"

[[tests]]
name = "ok.a_closure_made_in_each_turn_of_a_loop"
desc = "A closure made in the body of a loop, once per turn, reading the turn's own `var`; legal under the rule. The reading is 60."
kind = "behavior"
case = "../../../cases/compile/var_closure/ok_closure_in_loop_body.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "60\n"

[[tests]]
name = "ok.generator_body_is_not_a_program_closure"
desc = "A generator writes its own `var` between two `yield`s. That write is the step closure the compiler makes (`visitGeneratorBody`, src/compile/gct/builder.cpp), not a name the program captured, so it is not asked about: the mark is written where the body is synthesised and read by `visitFuncNode`. The reading is 5 (0 then 5)."
kind = "behavior"
case = "../../../cases/compile/var_closure/ok_generator_body_is_not_a_program_closure.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "5\n"

[[tests]]
name = "err.assignment_to_a_captured_let_is_refused"
desc = "A closure assigns a `let` bound outside it, and the program is refused -- by the general assignment rule, not by the closure rule: the write goes through `__assn__`'s `var` parameter, and a `let` has no cell to be written through, in a closure or outside one. The code pinned here is `ImmutablePassedToVarParam` (`0x0300001D`); the closure rule's own code is `ClosureAssignsCapturedName` (`0x03000213`), which does not fire here because the write is refused before the capture is asked about. `desc` says "refused at the assignment" for the reason that still holds: the refusal is about the write, not about the capture."
kind = "negative"
case = "../../../cases/compile/var_closure/err_closure_assigns_let.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ImmutablePassedToVarParam"
expect_diagnostic_code = "0x0300001D"
expect_output_contains = ["'k' is immutable and cannot be passed to a var parameter"]
# ---- The rule's other half -------------------------------------------------------------------
# Design principles 3.5 (197, 198): a closure may not write a name it captured, and a `var` a closure
# mentions may not be assigned from the making of the closure to its last use. The three entries below
# are the three ways that write is written.
#
# Which of the two ends 3.5 (198) names without a source offset are reported, and which is not:
#
#   - a closure the program puts into another value IS reported: the value is used to the end of the
#     scope, `scanClosureLastUses` records that end as `CapturedVar::stretchToEnd`, and every write
#     after the making is inside it. The tuple shape is read on
#     `test/cases/opt/effects/dead_write_dropped_closure.cml` and the array
#     shape on `err_captured_var_put_into_an_array` below. A write built and then erased for having no
#     reader left is no node and no diagnostic, which is the class of defect this rule exists to
#     remove.
#   - a closure written at a call's argument position is NOT reported when the callee's result type
#     can hold a function (3.5, 198 gives that shape the rest of the scope too). `scanClosureLastUses`
#     reads the GCT before any body is built, so it cannot resolve a callee, and the shape falls to
#     the "used by that call" end. Measured on this tree, and it is the shape in which the defect
#     the tuple and array entries pin is still open:
#
#         func take(f: () => int): () => int { return f }
#         func probe(): int {
#             var c = 0
#             let h = (): int => c
#             let kept = take(h)
#             c = 41
#             return kept()
#         }
#
#     exits 0 and prints `0` with an empty stderr: no node, no diagnostic. No entry below reads it,
#     because an entry that asserts the refusal would be red on this tree, and one that asserts the
#     silence would pin the defect as the behaviour. Reported, not papered over.

[[tests]]
name = "err.a_closure_assigns_a_captured_var"
desc = "A function written inside a body assigns a `var` of that body. The closure holds the value the name had when it was made, so the write has nowhere to go (design principles 3.5, 197). The report names the closure and the name, and its help gives the three ways out: return the new value, write the state as a loop's carried state or a `fold`, or hold it in a `Ref`."
kind = "negative"
case = "../../../cases/compile/var_closure/err_closure_assigns_captured.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ClosureAssignsCapturedName"
expect_diagnostic_code = "0x03000213"

[[tests]]
name = "err.a_captured_var_assigned_after_the_closure"
desc = "A closure is bound to a name, the `var` it read is assigned, and the closure is used again after that write: the write lands between the making of the closure and its last use (design principles 3.5, 198). `g()` would read 1 and not 2, which is the surprise the rule refuses to leave silent."
kind = "negative"
case = "../../../cases/compile/var_closure/err_captured_var_written_after_the_closure.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::CapturedVarWrittenAfterTheClosure"
expect_diagnostic_code = "0x03000214"

[[tests]]
name = "err.a_captured_var_handed_to_a_var_parameter"
desc = "The same window, with the write written by a callee: a `var` parameter is the caller's cell and its write-back is the assignment written at the call (design principles 3.5, 192). `ok.update_reads_a_captured_var` above is the other side of this line -- there the closure is written at the call's argument position, so its last use is that call and the write-back counts after it."
kind = "negative"
case = "../../../cases/compile/var_closure/err_captured_var_handed_to_var_parameter.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::CapturedVarHandedToVarParameter"
expect_diagnostic_code = "0x03000215"

# ---- The four call sites a capture PORT turns into a value -------------------------------
# The step that removed the by-reference capture port left four places where a
# captured name stops being a variable, so the general rule that answers "not a variable" fired
# before the capture rule was asked. Three of them had no case at all: they do not turn red, they
# only stop saying what they used to say. The four entries below are those places, one each, and
# the rule makes fixing them the step before `gate5` goes.
#
# The fourth is the BENIGN direction (`mutableName`, builder_control.cpp): it answers the same
# before and after the gate goes, so its entry pins the refusal that stands, and names the stale
# reason the message gives as a thing reported apart.

[[tests]]
name = "err.a_captured_name_handed_to_a_var_parameter_inside_the_closure"
desc = "builder_calls.cpp#Builder::requireMutableArgument, the `isVariable` threshold: a closure hands the name it captured to a `var` parameter, so the refusal that has to answer is the capture rule's (ClosureAssignsCapturedName, 197) and not the general 'the target must be a variable'."
kind = "negative"
case = "../../../cases/compile/var_closure/err_captured_name_handed_to_var_parameter_in_a_closure.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ClosureAssignsCapturedName"
expect_diagnostic_code = "0x03000213"

[[tests]]
name = "err.an_in_place_operator_on_a_captured_array"
desc = "builder_operator_writes.cpp#Builder::inPlaceRebindingOf, the `xs` holds an array threshold: `xs = xs->sort` inside a closure has to be refused by the capture rule, not turned into NoMatchingFunction by a rewrite that declines to run."
kind = "negative"
case = "../../../cases/compile/var_closure/err_in_place_operator_on_a_captured_array.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ClosureAssignsCapturedName"
expect_diagnostic_code = "0x03000213"

[[tests]]
name = "err.a_discarded_result_of_a_captured_name"
desc = "builder_diagnostics.cpp#Builder::rejectUnusedPureResult, the 'bind it to the result' hint: a pure call dropped on a name a closure captured still says to bind that variable to the result, instead of falling back to the generic sentence."
kind = "negative"
case = "../../../cases/compile/var_closure/err_discarded_result_of_a_captured_name.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::UnusedPureResult"
expect_output_contains = ["to change the variable 'xs', bind it to the result: 'xs = len(xs)'"]

[[tests]]
name = "err.a_captured_nullable_var_is_not_narrowed"
desc = "builder_control.cpp#Builder::mutableName: the null test on a name a closure captured still does not narrow the arm. BENIGN for this change -- deleting the cell gate moves the capture to a value, and this site's answer is the same either way -- but the reason the diagnostic gives is stale: it still says a `var` may be rewritten between the test and the use, and a capture port cannot be rewritten at all. Pinned by name, code and place only; the wording is reported apart, so rewording it leaves this entry alone."
kind = "negative"
case = "../../../cases/compile/var_closure/err_a_captured_nullable_var_is_not_narrowed.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::NoMatchingFunction"
expect_diagnostic_code = "0x0300000F"

# ---- The end 3.5 (198) gives without a source offset, on the array shape -----------------------
# The entries above read the end the block's own use of the closure's NAME gives. This one reads the
# other end: the name the closure was bound to is never named again, because the program put the
# closure's value into another value -- an array -- and design principles 3.5 (198) runs that shape
# to the rest of the scope. It is the same rule the tuple shape of
# `test/cases/opt/effects/dead_write_dropped_closure.cml` reads, from the other kind of aggregate, so
# a reader can tell "the tuple is special-cased" from "the sentence is implemented".
[[tests]]
name = "err.a_captured_var_written_after_its_closure_is_put_into_an_array"
desc = "The name a closure read is assigned after the closure's value is put into another value -- the array `many` -- so design principles 3.5 (198) runs the stretch to the rest of the scope and the write stands inside it. The report is the one the tuple shape gets: `CapturedVarWrittenAfterTheClosure` (`0x03000214`). The scan reaches it without a source offset: the block that binds `h` never names it again (`many[1]()` names `many`), so `CapturedVar::stretchToEnd` is the end, and a write anywhere after the making is inside it."
kind = "negative"
case = "../../../cases/compile/var_closure/err_captured_var_put_into_an_array.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::CapturedVarWrittenAfterTheClosure"
expect_diagnostic_code = "0x03000214"
