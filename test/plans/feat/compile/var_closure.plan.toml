# The rule of a captured value (design principles 3.5, the author's ruling of 2026-11-15): what the
# main line pins about it after `lane-varclos` (`218f3b3f7`).
#
# Where the rule stands today. A closure captures a NAME BY VALUE when the name is a top-level value of
# a module, no function writes it, and the function was used as a value (`decideCaptureByValue`); a
# capture port is a value then, and reads inside the body are the port. Everywhere else the port is
# still the CELL, and a by-reference capture's write is legal -- it lands in the cell the closure was
# handed, which is how `byref` and the `stream` packer work.
#
# The other half of the ruling (a closure may not assign an outer name, and a captured `var` may not be
# assigned between the making of the closure and its last use) was NOT REPORTED when this plan was
# written. The author ruled that reporting it before `tee` was migrated to `Ref` would only turn a green
# ruler into a red one, and that the migration is the next step of the same item rather than a later
# round -- see `docs/handover/questions/q-2026-11-16-can-tee-capture-by-reference.cn.md`, where applying
# by-value capture everywhere made `tee`'s five cases fail with `Runtime graph 'side0' breaks its edge
# invariants`. `tee` itself no longer keeps cells: it holds four `Ref`s (`lane-teeref`), so its five
# outputs never depended on this choice, and `lane-closurediag` (2026-11-16) is the step that reports the
# rule. The three `err.*` entries at the end of this plan are the three ways that write is written; the
# `transitional.*` entries are the same programs, accepted while the capture port was a cell and refused
# once the rule reports -- they are deleted by the step that removes the by-reference capture port.
#
# The entries are of three kinds, and each says which it is:
#   - `ok.*` -- legal under the rule as it stands (the regression guards; six of them came from the
#     retired `hold/varclo` branch and pass on the main line unchanged);
#   - `transitional.*` -- accepted BEFORE the reporting and refused after it; the entry names the step
#     that removes it. None of these may be read as the design;
#   - `err.*` -- refused. The first one is refused by a rule that does not depend on the capture's kind:
#     an assignment to a `let` captured from the graph around it has no cell to write even in the
#     by-reference world, which is the general assignment rule (`ImmutablePassedToVarParam`,
#     `0x0300001D`). `ClosureAssignsCapturedName` was retired on the main line and came back with this
#     branch under a new number (`0x03000213`), which is why the `0x03000214` the retired one carried now
#     belongs to `CapturedVarWrittenAfterTheClosure`.

[[tests]]
name = "ok.update_reads_a_captured_var"
desc = "A closure reads a `var` of the function that made it and writes nothing (`update(x, () => x + 1)`); legal before and after the ruling, so this entry is the regression guard the acceptance names by hand. The reading is 2."
kind = "behavior"
case = "../../../cases/compile/var_closure/ok_update_reads_captured.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "2\n"

[[tests]]
name = "ok.a_closure_made_in_each_turn_of_a_loop"
desc = "A closure made in the body of a loop, once per turn, reading the turn's own `var`; legal before and after the ruling, and the acceptance names this shape too. The reading is 60."
kind = "behavior"
case = "../../../cases/compile/var_closure/ok_closure_in_loop_body.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "60\n"

[[tests]]
name = "ok.generator_body_is_not_a_program_closure"
desc = "A generator writes its own `var` between two `yield`s. That write is the step closure the compiler makes (`visitGeneratorBody`, src/compile/gct/builder.cpp), not a name the program captured, so it is not asked about: the mark is written where the body is synthesised and read by `visitFuncNode`. The reading is 5 (0 then 5)."
kind = "behavior"
case = "../../../cases/compile/var_closure/ok_generator_body_is_not_a_program_closure.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "5\n"

[[tests]]
name = "transitional.by_reference_capture_write_is_accepted"
desc = "A closure assigns a `var` of the function that made it. The ruling answers that with a refusal (a value has nowhere to write), and this lane cannot ask it yet: the capture port is the cell, so the write lands in the frame's variable and the program is accepted, reading 3. Read it as the state of the transition, not as the language: the entry becomes `err.*` the day the capture port is a value, and the step that removes the by-reference port deletes the case with it."
kind = "behavior"
case = "../../../cases/compile/var_closure/transitional_byref_write_accepted.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "3\n"

[[tests]]
name = "transitional.write_after_the_closure_is_accepted"
desc = "A closure is made, the `var` it read is assigned, and the closure is called after that. The ruling refuses the assignment while the captured name is still used afterwards; this lane accepts it for the same reason as the entry above (the port is the cell), and the call reads the value written after it, so the reading is 2. Transitional, not design."
kind = "behavior"
case = "../../../cases/compile/var_closure/transitional_write_after_the_closure_accepted.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "2\n"

[[tests]]
name = "transitional.program_closure_still_seen_where_the_rule_would_ask"
desc = "The same generator (whose body is the compiler's own closure, never asked about) beside a closure writing a `var` of its own frame. Both are accepted today -- the second because the capture is by reference -- and the readings are 5 then 2. The entry exists so the switch's other side (a program's closure is the one the rule would ask about) stays visible for the day the refusals come back."
kind = "behavior"
case = "../../../cases/compile/var_closure/transitional_program_closure_pin.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "5\n2\n"

[[tests]]
name = "err.assignment_to_a_captured_let_is_refused"
desc = "A closure assigns a `let` bound outside it, and the program is refused -- by the general assignment rule, not by the closure rule: the write goes through `__assn__`'s `var` parameter, and a `let` has no cell to be written through, in a closure or outside one. The code pinned here is `ImmutablePassedToVarParam` (`0x0300001D`); the closure rule's own code is `ClosureAssignsCapturedName` (`0x03000213`), which does not fire here because the write is refused before the capture is asked about. `desc` says "refused at the assignment" for the reason that still holds: the refusal is about the write, not about the capture."
kind = "negative"
case = "../../../cases/compile/var_closure/err_closure_assigns_let.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ImmutablePassedToVarParam"
expect_diagnostic_code = "0x0300001D"
expect_output_contains = ["'k' is immutable and cannot be passed to a var parameter"]
# ---- The rule's other half, asked from 2026-11-16 --------------------------------------------
# Design principles 3.5 (197, 198) is reported from here on: a closure may not write a name it
# captured, and a `var` a closure mentions may not be assigned from the making of the closure to its
# last use. The three entries below are the three ways that write is written. The `transitional.*`
# entries above are two of the same programs accepted, and they go red with this change: the step that
# removes the by-reference capture (the `tee` migration) deletes them, it does not change them.
#
# What is NOT reported, and why: a closure written at a call's argument position is used by that call
# (3.5, 198), and a closure the program puts into another value is used to the end of the scope. Neither
# end is a source offset this build can prove, so neither shape is refused here -- under-reporting
# leaves a program to the next step; over-reporting refuses one the design allows.

[[tests]]
name = "err.a_closure_assigns_a_captured_var"
desc = "A function written inside a body assigns a `var` of that body. The closure holds the value the name had when it was made, so the write has nowhere to go (design principles 3.5, 197). The report names the closure and the name, and its help gives the three ways out: return the new value, write the state as a loop's carried state or a `fold`, or hold it in a `Ref`."
kind = "negative"
case = "../../../cases/compile/var_closure/err_closure_assigns_captured.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ClosureAssignsCapturedName"
expect_diagnostic_code = "0x03000213"

[[tests]]
name = "err.a_captured_var_assigned_after_the_closure"
desc = "A closure is bound to a name, the `var` it read is assigned, and the closure is used again after that write: the write lands between the making of the closure and its last use (design principles 3.5, 198). `g()` would read 1 and not 2, which is the surprise the rule refuses to leave silent."
kind = "negative"
case = "../../../cases/compile/var_closure/err_captured_var_written_after_the_closure.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::CapturedVarWrittenAfterTheClosure"
expect_diagnostic_code = "0x03000214"

[[tests]]
name = "err.a_captured_var_handed_to_a_var_parameter"
desc = "The same window, with the write written by a callee: a `var` parameter is the caller's cell and its write-back is the assignment written at the call (design principles 3.5, 192). `ok.update_reads_a_captured_var` above is the other side of this line -- there the closure is written at the call's argument position, so its last use is that call and the write-back counts after it."
kind = "negative"
case = "../../../cases/compile/var_closure/err_captured_var_handed_to_var_parameter.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::CapturedVarHandedToVarParameter"
expect_diagnostic_code = "0x03000215"
