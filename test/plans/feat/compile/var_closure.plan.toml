# The rule of a captured value (design principles 3.5, the author's ruling of 2026-11-15): what the
# main line pins about it after `lane-varclos` (`218f3b3f7`).
#
# Where the rule stands today. A closure captures a NAME BY VALUE when the name is a top-level value of
# a module, no function writes it, and the function was used as a value (`decideCaptureByValue`); a
# capture port is a value then, and reads inside the body are the port. Everywhere else the port is
# still the CELL, and a by-reference capture's write is legal -- it lands in the cell the closure was
# handed, which is how `byref` and the `stream` packer work.
#
# The other half of the ruling (a closure may not assign an outer name, and a captured `var` may not be
# assigned between the making of the closure and its last use) is NOT REPORTED today: see the choice
# recorded in `docs/handover/questions/q-2026-11-16-can-tee-capture-by-reference.cn.md`, where applying
# by-value capture everywhere makes `tee`'s five cases fail with `Runtime graph 'side0' breaks its edge
# invariants`. So the shapes on which that rule would fire keep their cell and produce no diagnostic.
#
# The entries are of three kinds, and each says which it is:
#   - `ok.*` -- legal under the rule as it stands (the regression guards; six of them came from the
#     retired `hold/varclo` branch and pass on the main line unchanged);
#   - `transitional.*` -- accepted TODAY because the capture is by reference; the ruling's answer would be
#     a refusal, and the entry names the step that would turn it into one. None of these may be read as
#     the design;
#   - `err.*` -- refused today by a rule that does not depend on the capture's kind: an assignment to a
#     `let` captured from the graph around it has no cell to write even in the by-reference world, which
#     is the general assignment rule and not this rule's. Its code is `ImmutablePassedToVarParam`
#     (`0x0300001D`) because `ClosureAssignsCapturedName` (`0x03000214`) was retired on the main line --
#     `git grep` finds neither the name nor the code in `HEAD`.

[[tests]]
name = "ok.update_reads_a_captured_var"
desc = "A closure reads a `var` of the function that made it and writes nothing (`update(x, () => x + 1)`); legal before and after the ruling, so this entry is the regression guard the acceptance names by hand. The reading is 2."
kind = "behavior"
case = "../../../cases/compile/var_closure/ok_update_reads_captured.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "2\n"

[[tests]]
name = "ok.a_closure_made_in_each_turn_of_a_loop"
desc = "A closure made in the body of a loop, once per turn, reading the turn's own `var`; legal before and after the ruling, and the acceptance names this shape too. The reading is 60."
kind = "behavior"
case = "../../../cases/compile/var_closure/ok_closure_in_loop_body.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "60\n"

[[tests]]
name = "ok.generator_body_is_not_a_program_closure"
desc = "A generator writes its own `var` between two `yield`s. That write is the step closure the compiler makes (`visitGeneratorBody`, src/compile/gct/builder.cpp), not a name the program captured, so it is not asked about: the mark is written where the body is synthesised and read by `visitFuncNode`. The reading is 5 (0 then 5)."
kind = "behavior"
case = "../../../cases/compile/var_closure/ok_generator_body_is_not_a_program_closure.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "5\n"

[[tests]]
name = "transitional.by_reference_capture_write_is_accepted"
desc = "A closure assigns a `var` of the function that made it. The ruling answers that with a refusal (a value has nowhere to write), and this lane cannot ask it yet: the capture port is the cell, so the write lands in the frame's variable and the program is accepted, reading 3. Read it as the state of the transition, not as the language: the entry becomes `err.*` the day the capture port is a value, and the step that removes the by-reference port deletes the case with it."
kind = "behavior"
case = "../../../cases/compile/var_closure/transitional_byref_write_accepted.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "3\n"

[[tests]]
name = "transitional.write_after_the_closure_is_accepted"
desc = "A closure is made, the `var` it read is assigned, and the closure is called after that. The ruling refuses the assignment while the captured name is still used afterwards; this lane accepts it for the same reason as the entry above (the port is the cell), and the call reads the value written after it, so the reading is 2. Transitional, not design."
kind = "behavior"
case = "../../../cases/compile/var_closure/transitional_write_after_the_closure_accepted.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "2\n"

[[tests]]
name = "transitional.program_closure_still_seen_where_the_rule_would_ask"
desc = "The same generator (whose body is the compiler's own closure, never asked about) beside a closure writing a `var` of its own frame. Both are accepted today -- the second because the capture is by reference -- and the readings are 5 then 2. The entry exists so the switch's other side (a program's closure is the one the rule would ask about) stays visible for the day the refusals come back."
kind = "behavior"
case = "../../../cases/compile/var_closure/transitional_program_closure_pin.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "5\n2\n"

[[tests]]
name = "err.assignment_to_a_captured_let_is_refused"
desc = "A closure assigns a `let` bound outside it, and the program is refused -- by the general assignment rule, not by the closure rule: the write goes through `__assn__`'s `var` parameter, and a `let` has no cell to be written through, in a closure or outside one. The code pinned here is `ImmutablePassedToVarParam` (`0x0300001D`); the closure rule's own code, `ClosureAssignsCapturedName` (`0x03000214`), was retired with the by-value capture work and `git grep` finds it nowhere in `HEAD`. `desc` says "refused at the assignment" for the reason that still holds: the refusal is about the write, not about the capture."
kind = "negative"
case = "../../../cases/compile/var_closure/err_closure_assigns_let.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ImmutablePassedToVarParam"
expect_diagnostic_code = "0x0300001D"
expect_output_contains = ["'k' is immutable and cannot be passed to a var parameter"]