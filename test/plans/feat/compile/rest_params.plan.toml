id = "compile.rest_params"
order = 340
tier = "fast"
tags = ["feat", "compile", "generics", "rest"]
desc = "Rest parameters (design principles 5.5): `...ts` is the last parameter, a call expands the body in place, and `...e` passes the elements of a compile-time tuple. A rest parameter that writes its type (`...xs: ...A`) declares the pack of the head, which each call binds (5.6)."

[[tests]]
name = "rest_params"
desc = "A rest function takes every argument left over: written out, expanded from a tuple literal, forwarded as `...ts`, with a fixed parameter before it, with no rest arguments at all, and read by position."
kind = "behavior"
case = "../../../cases/compile/rest_params/rest_params.cml"
args = ["${case}", "std::fvm"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const want = ["6", "9", "13", "8", "0", "9 10"].join(String.fromCharCode(10))
assert(input.normalized.stdout.trim() === want, `rest parameters changed: ${input.normalized.stdout}`)
}
"""
timeout_ms = 8000

[[tests]]
name = "rest_call_has_no_call_node"
desc = "The instance is the caller's code: the graph of `main` has the expanded body and no CALL node (and no static node left)."
kind = "behavior"
case = "../../../cases/compile/rest_params/rest_inline.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const lines = input.stdout.split(String.fromCharCode(10))
const at = lines.findIndex((line) => line.includes('label="main"'))
assert(at > 0, "the graph of main is missing")
const indent = lines[at - 1].slice(0, lines[at - 1].indexOf(lines[at - 1].trim()))
const end = lines.findIndex((line, i) => i > at && line === indent + "}")
assert(end > at, "the graph of main has no end")
const body = lines.slice(at, end)
const calls = body.filter((line) => line.includes('type="CALL"'))
assert(calls.length === 0, `the rest call was not expanded: ${calls[0]}`)
const staticNodes = body.filter((line) => /type="(SFOR|SLOOP|SACC|SCCS)"/.test(line))
assert(staticNodes.length === 0, `a static node was left in the graph: ${staticNodes[0]}`)
}
"""
timeout_ms = 8000

[[tests]]
name = "rest_parameter_pack"
desc = "A rest parameter that writes its type declares the pack of the head (`func both::<...A>(...xs: ...A)`): each call binds one type per argument left over, and a type written `...A` is those types in order."
