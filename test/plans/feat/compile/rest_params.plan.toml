[[tests]]
name = "lambda_rest_parameter"
desc = "A lambda's parameter list takes a rest parameter and the shape parses: `(...xs) => body`. What it stands for comes from the function type the lambda is in, and this position has none -- the value is bound by `let` with no declared type -- so the report is the one a lambda's unwritten parameter gets: the type is not written and nothing here expects a function type. That is 'this place cannot', not 'not done yet'."
kind = "negative"
case = "../../../cases/compile/rest_params/lambda_rest_untyped.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::LambdaParameterWithoutType"
expect_output_contains = ["is not written and cannot be inferred: nothing here expects a function type"]
expect_output_not_contains = ["throw", "is not lowered yet"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "lambda_rest_parameter_typed"
desc = "The same shape with a type after `...` (`(...xs: float[...])`) is answered the same way: a pack written there says which types the parameters have, not how many there are, and this position declares no function type to count them from."
kind = "negative"
case = "../../../cases/compile/rest_params/lambda_rest_typed.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::LambdaParameterWithoutType"
