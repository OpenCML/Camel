# The encoder asks the same graph twice as it builds it -- once as the draft it was written as, once
# as the graph it was encoded to -- and refuses a graph whose two readings disagree
# (`camel::graph::firstDifference`, kernel/graph/consistency.h, read over the view). Every program in
# this tree has had the question asked; this plan's case is the one written for it, so that what is
# asked is in front of a reader in one place: a call, an operator, a cast, the front end's
# placeholders on the draft side, and a numbering that changes between the two. The readings
# themselves are printed by `feat/opt/graph_faces` (`[VF] agree=1`).

[[tests]]
name = "graph_read.draft_agrees_with_frozen"
desc = "One graph, asked twice: the draft the compiler wrote and the frozen graph built from it answer the same node slots, the same live nodes, the same kind, type, constant, inputs, predecessors, operator, callee and regions for every node (camel::graph::firstDifference over `GraphView`). The encoder asks this of every graph it encodes and refuses a graph whose two readings disagree, so the assertion here is the one every program in the tree makes: this case compiles and answers. The case is chosen so the graphs are not all one kind -- a FUNC node with a callee (`twice`), an OPER node with an operator, and the placeholders the front end leaves on the draft side, which is where a reading that only copied ids would pass and prove nothing."
kind = "behavior"
case = "../../../cases/compile/graph_read/callee_and_oper.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["5.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000