id = "compile.operators"
order = 324
tier = "feat"
tags = ["feat", "compile", "semantic", "negative", "ops"]
desc = "A combination of operator and operand type without an implementation is rejected when the program is compiled, at the operator."

[[tests]]
name = "string_sub_assign"
desc = "-= on strings is rejected when compiled; it used to compile and do nothing"
kind = "negative"
case = "../../../cases/compile/operators/string_sub_assign.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "string_sub_assign.cml:9:5:", "(string, string)", "operator '-=' is not defined for these operand types"]
expect_output_not_contains = ["never printed", "UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

