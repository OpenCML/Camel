id = "compile.recursive_struct"
order = 333
tier = "fast"
tags = ["feat", "compile", "types", "struct", "recursive", "gc"]
desc = "A struct that mentions itself through an array (design principles 5.2): `type Node = { value: int, children: Node[] }` is one nominal type, the field holds the same type object, construction and reading work, path assignment through `children[i].value` keeps value semantics, and a live tree survives a moving collection because the collector traces the slot array with the element type `Node`."

[[tests]]
name = "recursive_struct.array"
desc = "Build a two-level tree, read it recursively through `children[i]`, print it and assign `children[i].value` through a path. The tree is unchanged by the assignment (the struct and the slot array are copied on the way). Alike on the four back ends."
kind = "behavior"
case = "../../../cases/compile/semantic/recursive_struct_array.cml"
args = ["-E", "short", "${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "10",
  "{ value: 1, children: [{ value: 2, children: [] }, { value: 3, children: [{ value: 4, children: [] }] }] }",
  "64 10",
  "40",
  "true false",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 20000

[[tests]]
name = "recursive_struct.array_gc_nvm"
desc = "The live tree is read after 32 temporary trees forced collections at NVM safepoints; `std::gc::verify` also checks the heap. The tree's values are unchanged, so the collector traced the `children` slot array and every moved Node it reaches."
kind = "behavior"
case = "../../../cases/compile/semantic/recursive_struct_array_gc.cml"
args = ["${case}", "std::gc::verify", "${run_nvm}"]
envs = ["CAMEL_GC_VERIFY=both", "CAMEL_GC_STRESS_ALLOC=5", "CAMEL_GC_STRESS_SAFEPOINT=1", "CAMEL_GC_STRESS_MODE=major"]
expect_exit = 0
expect_stdout_contains = ["\"ok\":true", "10 178 1024", "4"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_duration_seconds"]
timeout_ms = 20000

[[tests]]
name = "recursive_struct.array_gc_fvm"
desc = "The same live tree across moving collections at FastVM call-boundary safepoints."
kind = "behavior"
case = "../../../cases/compile/semantic/recursive_struct_array_gc.cml"
args = ["${case}", "std::gc::verify", "${run_fvm}"]
envs = ["CAMEL_GC_VERIFY=both", "CAMEL_GC_STRESS_ALLOC=5", "CAMEL_GC_STRESS_SAFEPOINT=1", "CAMEL_GC_STRESS_MODE=major"]
expect_exit = 0
expect_stdout_contains = ["\"ok\":true", "10 178 1024", "4"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_duration_seconds"]
timeout_ms = 20000