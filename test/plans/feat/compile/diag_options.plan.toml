[[tests]]
name = "errors.json_array"
desc = "With several errors --output-format json is still one array."
kind = "behavior"
case = "../../../cases/compile/diag_options/many_errors.cml"
args = ["--output-format", "json", "--max-errors", "4", "${case}"]
expect_exit = 1
verify_script = """
const diags = JSON.parse(input.stdout)
assert(diags.length === 4, '4 diagnostics, got ' + diags.length)
assert(diags.every((d) => d.data.name === 'SemanticDiag::UnresolvedReference'), 'all unresolved references')
assert(diags[3].range.start.line === 9, 'fourth error on line 10, got ' + (diags[3].range.start.line + 1))
"""
timeout_ms = 8000

[[tests]]
name = "errors.runtime_first_fault"
desc = "A run-time fault ends the run at the first one, whatever --max-errors says."
kind = "behavior"
case = "../../../cases/compile/diag_options/two_faults.cml"
args = ["--max-errors", "0", "${case}"]
expect_exit = 1
verify_script = """
const n = (input.stdout.match(/name=RuntimeDiag::IndexOutOfRange/g) || []).length
assert(n === 1, 'one fault reported, got ' + n)
assert(input.stdout.includes('Index 5 is out of range'), 'the first fault')
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "json.related_information"
desc = "The secondary location of a diagnostic is relatedInformation in JSON: the call that instantiated the generic function, with its file and range; the message is free of it."
kind = "behavior"
case = "../../../cases/compile/diag_render/sem_generic_instance.cml"
args = ["--output-format", "json", "${case}"]
expect_exit = 1
verify_script = """
const diags = JSON.parse(input.stdout)
const d = diags.find((x) => x.message.includes("operator '+' is not defined"))
assert(d, 'the error of the instance is there')
assert(!d.message.includes('instantiated'), 'the message does not hold the instance note: ' + d.message)
assert(Array.isArray(d.relatedInformation) && d.relatedInformation.length === 1, 'one related location')
const r = d.relatedInformation[0]
assert(r.message.includes("in the instance 'twice<int[]>' of the generic function 'twice' with T = int[]"), r.message)
assert(r.location.path.endsWith('sem_generic_instance.cml'), r.location.path)
assert(r.location.range.start.line === 9 && r.location.range.start.character === 17, JSON.stringify(r.location.range))
assert(typeof d.data.suggestion === 'string' && d.data.suggestion.length > 0, 'the suggestion is in data')
"""
timeout_ms = 8000

[[tests]]
name = "errors.imports"
desc = "Each import that fails is reported, and a type one of them would have declared is not reported as unresolved."
kind = "behavior"
case = "../../../cases/compile/diag_options/missing_module.cml"
args = ["${case}"]
expect_exit = 1
verify_script = """
const n = (input.stdout.match(/name=SemanticDiag::ModuleNotFound/g) || []).length
assert(n === 2, 'two imports reported, got ' + n)
assert(input.stdout.includes("Module 'no_such_module_a' not found") && input.stdout.includes("Module 'no_such_module_b' not found"), input.stdout)
assert(!input.stdout.includes('UnresolvedTypeReference'), 'the use of the imported type is not reported')
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

