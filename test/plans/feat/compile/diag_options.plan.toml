tool = "node"
case = "../../../cases/compile/diag_options/lsp_diagnostics.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["PASS"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000
