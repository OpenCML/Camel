[[tests]]
name = "warn.werror_pass_warning"
desc = "A warning raised by a pass and made an error ends the pipeline after that pass: the program is not run."
kind = "behavior"
case = "../../../cases/opt/generic/fold_constant_fault.cml"
args = ["-Werror", "${case}", "std::opt::fold", "std::nvm"]
expect_exit = 1
verify_script = """
assert(input.stdout.includes('[Error]: This constant expression faults whenever it is evaluated (DivisionByZero)'), input.stdout)
assert(input.stdout.includes('name=RuntimeDiag::ConstantExpressionFaults, code=0x04100015'), input.stdout)
assert(!/^7$/m.test(input.stdout), 'the program did not run: ' + input.stdout)
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "warn.wno_pass_warning"
desc = "A warning raised by a pass is switched off like any other."
kind = "behavior"
case = "../../../cases/opt/generic/fold_constant_fault.cml"
args = ["-Wno-constant-expression-faults", "${case}", "std::opt::fold", "std::nvm"]
expect_exit = 0
verify_script = """
assert(input.stderr === '', 'no warning: ' + input.stderr)
assert(input.normalized.stdout === '7\n', input.normalized.stdout)
"""
normalizers = ["normalize_newlines"]
timeout_ms = 8000

