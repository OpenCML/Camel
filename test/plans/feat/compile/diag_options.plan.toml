id = "compile.diag_options"
order = 329
tier = "fast"
tags = ["feat", "compile", "diagnostics"]

[[tests]]
name = "info.invalid_format"
desc = "Informational commands validate an invalid diagnostics environment setting."
kind = "behavior"
case = "../../../cases/compile/check/clean.cml"
args = ["--version"]
envs = ["CAMEL_ERROR_FORMAT=invalid"]
expect_exit = 1
expect_stderr_contains = ["unknown diagnostics format 'invalid'"]

[[tests]]
name = "info.invalid_warning"
desc = "Informational commands still consult the catalog when a warning name needs validation."
kind = "behavior"
case = "../../../cases/compile/check/clean.cml"
args = ["--version", "-Wno-bogus"]
expect_exit = 1
expect_stderr_contains = ["no warning is named 'bogus'"]

[[tests]]
name = "option.unknown"
desc = "An option the parser does not know is reported as an unknown option, not taken for the input file (it used to say 'Cannot open file --bogus')."
