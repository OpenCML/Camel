[[tests]]
name = "when.rule"
desc = "A rule with `when` keeps the same surface: the declaration compiles the condition into the third function of the rule (`guarded__when`) and passes it to the Rule value. This pins the rule half independently of the combinator names another branch adds."
kind = "behavior"
case = "../../../cases/compile/when/rule_when.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "guarded\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000
[[tests]]
name = "when.type_predicates"
desc = "Each of the seven standard type predicates is used as a `when` condition in both directions: one declaration fires when it holds, one when `!` makes it false, so an identity pattern that answers wrongly on either side changes the output. The bodies are the standard ones, written locally because a condition sees the generic functions of its own module only."
kind = "behavior"
case = "../../../cases/compile/when/type_predicates.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "numeric\nnot numeric\ninteger\nnot integer\nfloat\nnot float\nordered\nnot ordered\nfunction\nnot function\nstring\nnot string\nbool\nnot bool\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000
[[tests]]
name = "when.types_module"
desc = "The standard module `types` is imported and one of its head-only predicates is called from a `when` condition: the imported template keeps its type parameter, is instantiated with `T`, and its identity cases answer the condition."
kind = "behavior"
case = "../../../cases/compile/when/types_module.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "numeric\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "when.types_numeric_complex"
desc = "`is_numeric` is composed of `is_integer`, `is_float` and `is_complex` rather than listing numeric types again: a declaration guarded by `is_numeric::<T>()` accepts `c64`, while `is_integer` and `is_float` are false for it, so the complex branch is what makes it applicable. `is_ordered` composes the same way and rejects `c64`. A duplicated `c64` case, a false `is_complex`, or a hand-written integer list in `is_ordered` changes the application or the printed answers."
kind = "behavior"
case = "../../../cases/compile/when/types_numeric_complex.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "numeric\nnot integer\nnot float\ncomplex\nnumeric\nnot ordered\nnot numeric\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "when.ordinary_call"
desc = "A `when` calls an ordinary function of this module with a compile-time constant: the condition is evaluated where the declaration is written, so `is_positive(1)` holds and `is_positive(0)` does not, and the two overloads are told apart by the folded value."
kind = "behavior"
case = "../../../cases/compile/when/ordinary_call.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "42\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "when.ordinary_call_unmet"
desc = "The same ordinary call where it does not hold: `is_positive(0)` is folded to false, the only candidate is inapplicable, and the call site lists `is_positive(0)` among the conditions."
kind = "negative"
case = "../../../cases/compile/when/ordinary_call_unmet.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::WhenConditionUnmet"
expect_diagnostic_line = 15
expect_output_contains = ["is_positive(0)", "every candidate's 'when' condition is false"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "when.plain_struct"
desc = "A predicate whose fold recurses over a field's own type is answered: `is_plain::<T>()` walks `fields T` and asks `is_plain::<F>()` about each field, so a struct of plain fields is plain and the declaration it guards applies."
kind = "behavior"
case = "../../../cases/compile/when/plain_struct.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "plain\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "when.plain_nested"
desc = "The same fold one field deep: the struct holds a struct, so the nested call is folded with the field's own type bound rather than left open."
kind = "behavior"
case = "../../../cases/compile/when/plain_nested.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "plain\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "when.plain_struct_false"
desc = "The recursion's false side: a field whose type is not plain makes the struct not plain, so the guarded declaration is inapplicable and the call site lists `is_plain::<T>()`."
kind = "negative"
case = "../../../cases/compile/when/plain_struct_false.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::WhenConditionUnmet"
expect_diagnostic_line = 15
expect_output_contains = ["is_plain::<T>()", "every candidate's 'when' condition is false"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000
# ---- Build-time evaluation does not guess ----

[[tests]]
name = "when.called_declaration_scope"
desc = "A called declaration's `when` is answered where the declaration is written, not where the call is: `ns::slot` sits in a namespace beside the predicate `plain_int` and names it unqualified, and the call, at the top of the module, folds to the key of a static access. The condition used to be read in the caller's scope and the call was refused."
kind = "behavior"
case = "../../../cases/compile/when/scope/main.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "20\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "when.overloaded_predicate"
desc = "A predicate with two overloads in a condition is chosen by the call's arguments, not by declaration order: `pick::<T>('s')` is the `string` one, which holds, and the declaration applies. The first declaration of the name used to answer every call."
kind = "behavior"
case = "../../../cases/compile/when/overload_predicate.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "5\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "when.fold_broken_body"
desc = "A function whose body does not build is not folded: its own error is the one reported, and the call is not given a value read from a body that has a diagnostic (it used to add a second error about effects)."
kind = "negative"
case = "../../../cases/compile/when/fold_broken_body.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::UnresolvedReference"
expect_output_contains = ["Unresolved reference: 'missing_name'"]
expect_output_not_contains = ["FoldCallHasEffects", "cannot be evaluated at build time"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "when.generic_overload_disjoint"
desc = "Two generic functions of one name and one signature, told apart by their `when` conditions on their own type parameter: `is_int::<T>()` holds for the `int` call and `is_float::<T>()` for the `float` one, so each call is the declaration its argument's type satisfies. The selection reads the conditions like the non-generic path does; before that, both declarations took both calls and every call was an ambiguity."
kind = "behavior"
case = "../../../cases/compile/when/generic_overload_disjoint.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "int\nfloat\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "when.generic_overload_overlap"
desc = "Two generic functions of one name and one signature whose `when` conditions are not disjoint (`is_integer::<T>()` and `is_numeric::<T>()` both hold for `int`): neither covers a family of types the other does not, so the second is refused where it is declared with WhenDeclarationOverlap, naming the type both apply to and both declarations with their conditions -- the same report two `#impl` arms of one signature get, and not an ordinary Redeclaration."
kind = "negative"
case = "../../../cases/compile/when/generic_overload_overlap.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::WhenDeclarationOverlap"
expect_diagnostic_line = 29
expect_output_contains = ["Two declarations of 'both' both apply to the type 'int': '(x: T) => string — when is_integer::<T>()' and '(x: T) => string — when is_numeric::<T>()'."]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "when.generic_overload_both_hold"
desc = "Two generic functions of one name whose conditions both hold for one call (`T` is `i32`, `U` is `int`): the call has no answer, and the call site lists the two candidates with the condition each of them wrote (design principles 4.4: '带 `when` 的候选都适用时，调用处报歧义，列出两条候选与各自成立的条件'). The declaration-time separation check asks one registered type at a time, so it never sees the overlap."
kind = "negative"
case = "../../../cases/compile/when/generic_overload_both_hold.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::AmbiguousCall"
expect_diagnostic_line = 36
expect_output_contains = ["The call to 'dual' with (i32, int) fits more than one overload", "The overloads that take them: dual: (a: T, b: U) => string — when is_first_i32::<T>(); dual: (a: T, b: U) => string — when is_second_int::<U>()"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "when.generic_overload_none_apply"
desc = "Two generic functions of one name whose conditions are both false for the call's type (`string`): no declaration is the call's overload, and the report names the conditions that were not met rather than a mismatch of types (design principles 4.4; '条件不满足与类型不匹配分开报')."
kind = "negative"
case = "../../../cases/compile/when/generic_overload_none_apply.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::WhenConditionUnmet"
expect_diagnostic_line = 32
expect_output_contains = ["No candidate of 'pick' applies to (string): every candidate's 'when' condition is false", "Candidates: pick: (x: T) => string — when is_float::<T>(); pick: (x: T) => string — when is_int::<T>()"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "when.nested_open_type"
