id = "compile.effects_syntax"
order = 342
tier = "fast"
tags = ["feat", "compile", "effects", "resources", "syntax"]
desc = "The surface of the resource model (design effects plan 3.1): `resource` and `unordered`, `#resource` on a nominal type, and `uses`/`pure` on a function declaration or a function type; the signature a declaration publishes is the one a call touches, and a body-less declaration must carry the signature its operator declares"

# Design effects plan step 3: the syntax the resource model reads. A clause is lowered to the
# function type's ResourceSignature, so a call's footprint comes from the declaration and not from
# the body it happens to have; `#resource` marks the type whose values are handles; a body-less
# declaration is checked against the C++ operator's own declaration.

[defaults]
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "Internal", "bad any_cast"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 12000

# ---- A source program: the clause is what a call touches ----

[[tests]]
name = "source.declared_resources"
desc = "Two calls of `consume` touch the same handle (the value they are given) and are ordered by control, two calls of `tick` touch the group's `db` and `stdout` and are visible outside the program -- naming an ambient resource in a clause promises the effect that comes with it -- and two calls of `bump` touch the same cell: the bodies touch nothing, so the footprint can only come from the clauses. The program's own output is unchanged."
kind = "behavior"
case = "../../../cases/effects/declared.cml"
args = ["${case}", "test::resources"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const lines = input.normalized.stdout.split('\n')
const nodes = (re) => lines.map((l) => l.match(re)).filter(Boolean)
const allNodes = lines.filter((l) => l.startsWith('RESOURCES node')).join(' ; ')
const orders = nodes(/^RESOURCES order \S+ (\d+) (\d+) resource ordered by control$/)
const ordered = (a, b) => orders.some((m) => (m[1] === a && m[2] === b) || (m[1] === b && m[2] === a))
const pair = (label, found) => {
  assert(found.length === 2, `${label}: expected two calls, got ${found.map((m) => m[0]).join(' | ')}; all nodes: ${allNodes}`)
  assert(ordered(found[0][1], found[1][1]), `${label}: the two calls are not ordered by control: ${found.map((m) => m[0]).join(' | ')}; orders: ${orders.map((m) => m[0]).join(' | ')}`)
}

const handles = nodes(/^RESOURCES node \S+ (\d+) FUNC consume: rmw handle \S+::Stream \(node (\d+)\)$/)
pair('consume', handles)
assert(handles[0][2] === handles[1][2], `consume: the two calls name different values: ${handles[0][0]} | ${handles[1][0]}`)

const cells = nodes(/^RESOURCES node \S+ (\d+) FUNC bump: rmw variable \(node (\d+)\)$/)
pair('bump', cells)
assert(cells[0][2] === cells[1][2], `bump: the two calls name different cells: ${cells[0][0]} | ${cells[1][0]}`)

const ambient = nodes(/^RESOURCES node \S+ (\d+) FUNC tick: rmw ambient db; rmw ambient stdout; external$/)
assert(ambient.length === 2, `tick: expected two calls of the group, got ${ambient.map((m) => m[0]).join(' | ')}; all nodes: ${allNodes}`)
pair('tick', ambient)

assert(lines.includes('7'), `the handle value was not printed: ${lines.filter((l) => !l.startsWith('RESOURCES')).join(' | ')}`)
assert(lines.includes('0'), `the untouched cell was not printed: ${lines.filter((l) => !l.startsWith('RESOURCES')).join(' | ')}`)
}
"""

# ---- A resource is an exported name of the module that declares it ----
#
# A resource is identified by the module that declares it together with its name (design principles
# 10.2), so another module reaches it the way it reaches any other exported name: through the
# module (`m::r`), or by importing it by name and writing it bare. A name that is neither declared
# here, nor standard, nor imported stays unknown (the case below).

[[tests]]
name = "resource.through_module"
desc = "A clause writes `test_support::rendezvous_point`, the exported resource of an imported module: accepted, and the program runs."
kind = "behavior"
case = "../../../cases/effects/exported_resource_qualified.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "0\n"

[[tests]]
name = "resource.imported_by_name"
desc = "A clause writes `rendezvous_point` after `import { rendezvous_point } from test_support`: the imported resource, named bare."
kind = "behavior"
case = "../../../cases/effects/exported_resource_imported.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "0\n"

# ---- A body-less native declaration carries the operator's signature ----

[[tests]]
name = "native.same_signature"
desc = "`fs:exists` declares `uses fs`; a body-less declaration in a module named `fs` that writes the same clause is accepted, and the call reaches the operator."
kind = "behavior"
case = "../../../cases/effects/native_clause.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "false\n"

[[tests]]
name = "native.wrong_signature"
desc = "The same declaration written `pure`: the operator reads the file system, so the declaration promises what the operator does not keep. One diagnostic at the declaration, naming both sides."
kind = "negative"
case = "../../../cases/effects/native_clause_wrong.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::NativeResourceMismatch"
expect_diagnostic_code = "0x030001A4"
expect_output_contains = ["native_clause_wrong.cml:", "exists", "fs:exists", "pure", "uses fs"]

# ---- Step 5, the other half: what a clause-less declaration publishes ----
#
# A function that writes no clause has no promise to read, so what it promises is what its body
# was measured to reach, and that measurement is written onto its own signature -- the open one,
# which no other function shares (only a function-typed *parameter*
# that writes no resources stays Generic, because it is determined per instantiation). A value of
# the function is therefore judged by the same set the declaration is, and the two cases below
# pin both halves: a resource-generic parameter takes whatever instantiates it, and a clause-less
# function that reaches `stdout` does not fit a `pure` parameter.

[[tests]]
name = "inferred.parameter_is_resource_generic"
desc = "A function-typed parameter that writes no clause is determined per instantiation: `apply` says nothing about what `f` touches, so the resources of the value it is instantiated with are what the call through it reaches, and `noisy`, whose body prints, is a value it takes. The program runs as it always did, and the effect is carried by the resource set the value infers, not by a flag on its type."
kind = "behavior"
case = "../../../cases/effects/generic_parameter_takes_instantiation.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "4\n8\n"

[[tests]]
name = "effect.through_parameter"
desc = "The effect of a call through a function-typed parameter is the resource set of the value it is instantiated with: `add<t>` writes the cell it bound, so a call through the parameter is an effectful call. Outside a sync block a result nothing depends on does not run it and is reported (EffectNotExecuted, the same warning the direct call of the value gets); inside one it runs and the write lands. The reads after the calls show both."
kind = "behavior"
case = "../../../cases/effects/effect_through_parameter.cml"
args = ["${case}"]
expect_exit = 0
expect_output_contains = ["SemanticDiag::EffectNotExecuted", "effect_through_parameter.cml:21:", "0 0 1 2"]

[[tests]]
name = "effect.parameter_promises_pure"
desc = "The other side of the same rule: a parameter written `pure` promises the empty set, so a call through it is not an effect and a result nothing depends on is dropped without a warning. A function whose type says `pure` stands at the parameter."
kind = "behavior"
case = "../../../cases/effects/pure_parameter_takes_pure.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "0\n"
expect_output_not_contains = ["SemanticDiag::EffectNotExecuted"]

[[tests]]
name = "inferred.lambda_is_empty"
desc = "A lambda is the same rule without a written clause: its type carries what its body measures, so a lambda that touches nothing measures the empty set and stands where `pure` is asked for. No syntax of its own: the resources of a lambda are inferred."
kind = "behavior"
case = "../../../cases/effects/pure_parameter_takes_lambda.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "0\n"
expect_output_not_contains = ["SemanticDiag::EffectNotExecuted"]

[[tests]]
name = "effect.ambient_clause_covers_body"
desc = "A clause that names the resource its body reaches keeps its promise, the effect outside the program included: `stdout` is state the program does not own, so a clause that writes it promises the effect that comes with it, and the resource and the effect are not two things the writer has to say."
kind = "behavior"
case = "../../../cases/effects/uses_ambient_covers_body.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "x\n1\n"

[[tests]]
name = "inferred.recursive_is_empty"
desc = "A recursive function that wrote no clause settles at the set its body reaches: the measurement starts every body at the empty set and grows it round by round, so the call to itself reads the round before and `step` ends at the empty set -- its type says `pure`, and a caller taking its value reads that, not `Generic`."
kind = "behavior"
case = "../../../cases/effects/inferred_recursive_is_empty.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
expect_output_contains = ["Function(graph=step", "value_type=\"(n: int) => int pure\""]
verify_script = """
({ input, assert }) => {
const lines = input.normalized.stdout.split('\n')
const step = lines.filter((l) => l.includes('Function(graph=step')).join(' | ')
assert(step.includes('(n: int) => int pure'), `step's value carries the set its body settled at, not nothing: ${step}`)
assert(!step.includes('(n: int) => int"'), `step's value is not read as a signature that says nothing: ${step}`)
}
"""

# ---- Refusals ----

[[tests]]
name = "err.inferred_not_pure"
desc = "A clause-less function promises what its body was measured to reach: `noisy` prints, so the value it is known by says `uses stdout`, and the `pure` parameter does not take it. The refusal is at the call and names the signature that would have matched."
kind = "negative"
case = "../../../cases/effects/err_inferred_not_pure.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::NoMatchingFunction"
expect_diagnostic_code = "0x0300000F"
expect_output_contains = ["err_inferred_not_pure.cml:19:", "uses stdout", "(x: int) => int pure"]

[[tests]]
name = "err.pure_parameter_write"
desc = "A parameter written `pure` takes only a value that promises the empty set: `add<t>` writes the cell it bound and its type says so, so the call is refused where the two meet. The bare type the value was known by is `(x: int) => int`, and the signature the parameter asked for is the one the error names."
kind = "negative"
case = "../../../cases/effects/err_pure_parameter_write.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::NoMatchingFunction"
expect_diagnostic_code = "0x0300000F"
expect_output_contains = ["err_pure_parameter_write.cml:21:", "usePure: (f: (x: int) => int pure) => int pure"]

[[tests]]
name = "err.promise_through_parameter"
desc = "A body that declares `pure` and calls through a parameter that writes no clause has not proved the empty set: what the call reaches is the instantiation's, which nobody wrote, so the declaration is refused at its own clause (UsesPromiseViolated), and the help says to write `pure` on the parameter."
kind = "negative"
case = "../../../cases/effects/err_promise_through_parameter.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::UsesPromiseViolated"
expect_output_contains = ["err_promise_through_parameter.cml:9:", "write 'pure' on the parameter", "an effect outside the program"]

[[tests]]
name = "err.unknown_resource"
desc = "`uses nowhere`: the name is not a parameter, not a resource of the module, not a standard resource and not imported."
kind = "negative"
case = "../../../cases/effects/err_unknown_resource.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::UnknownResource"
expect_diagnostic_code = "0x030001A0"
expect_output_contains = ["err_unknown_resource.cml:", "'nowhere'"]

[[tests]]
name = "err.resource_not_imported"
desc = "`uses rendezvous_point` without importing it: importing the module `test_support` does not put the resource it exports into this module's own namespace, and the name is no standard resource."
kind = "negative"
case = "../../../cases/effects/err_resource_not_imported.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::UnknownResource"
expect_diagnostic_code = "0x030001A0"
expect_output_contains = ["err_resource_not_imported.cml:", "'rendezvous_point'"]

[[tests]]
name = "err.pure_and_uses"
desc = "`pure` and `uses` on one signature: `pure` says the call touches nothing, `uses` names what it touches."
kind = "negative"
case = "../../../cases/effects/err_pure_and_uses.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::PureAndUses"
expect_diagnostic_code = "0x030001A1"
expect_output_contains = ["err_pure_and_uses.cml:", "'pure'", "'uses'"]

[[tests]]
name = "err.pure_var"
desc = "`pure` with a `var` parameter: the parameter is a resource by itself, so the signature breaks its own promise and the note points at the parameter."
kind = "negative"
case = "../../../cases/effects/err_pure_var.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::UsesPromiseViolated"
expect_diagnostic_code = "0x030001F1"
expect_output_contains = ["err_pure_var.cml:", "'var' parameter 'c'"]

[[tests]]
name = "err.pure_body"
desc = "`pure` on a body that writes stdout: the signature promises the empty set and the body reaches past it, so the declaration is refused at its own clause and the resource it did not name is reported."
kind = "negative"
case = "../../../cases/effects/err_pure_body.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::UsesPromiseViolated"
expect_diagnostic_code = "0x030001F1"
expect_output_contains = ["err_pure_body.cml:7:", "pure", "stdout"]

[[tests]]
name = "err.pure_body2"
desc = "The same refusal where the function is only passed as a value: the error is at the declaration whose body reaches past `pure`, not at the call site that reads the declaration. The two reports do not fight: the refusal names the broken promise, and the effect warning still names the dropped call."
kind = "negative"
case = "../../../cases/effects/err_pure_body2.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::UsesPromiseViolated"
expect_diagnostic_code = "0x030001F1"
expect_output_contains = ["err_pure_body2.cml:13:", "(x: int) => int pure", "stdout", "err_pure_body2.cml:14:"]

[[tests]]
name = "err.uses_live"
desc = "`uses fs` with a body that writes stdout: `uses` is an upper bound, so the declaration is refused and the resource the clause left out is named."
kind = "negative"
case = "../../../cases/effects/err_uses_live.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::UsesPromiseViolated"
expect_diagnostic_code = "0x030001F1"
expect_output_contains = ["err_uses_live.cml:8:", "uses fs", "stdout"]

[[tests]]
name = "err.group_cycle"
desc = "`a = [b]` and `b = [a]`: a group cannot be one of its own members, and the message shows the path."
kind = "negative"
case = "../../../cases/effects/err_group_cycle.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ResourceGroupCycle"
expect_diagnostic_code = "0x030001A2"
expect_output_contains = ["err_group_cycle.cml:", "contains itself", "a", "b"]

[[tests]]
name = "err.handle_not_nominal"
desc = "`#resource` before an alias: an alias has no identity of its own to name, so `#resource` says nothing about it."
kind = "negative"
case = "../../../cases/effects/err_handle_not_nominal.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::HandleTypeNotNominal"
expect_diagnostic_code = "0x030001A3"
expect_output_contains = ["err_handle_not_nominal.cml:", "'Id'"]

[[tests]]
name = "err.callee_clause_reaches"
desc = "A call reads the signature of the function it calls: `stamp` promises `db` and its body calls `fill`, which promises `cache`, so the caller has reached `cache` and is refused even though `fill`'s body touches nothing -- the clause is the contract, which is what lets `fill` change its body within it later without touching its callers."
kind = "negative"
case = "../../../cases/effects/err_callee_clause_reaches.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::UsesPromiseViolated"
expect_diagnostic_code = "0x030001F1"
expect_output_contains = ["err_callee_clause_reaches.cml:16:", "uses db", "cache"]

[[tests]]
name = "err.promise_note"
desc = "The note of a violation points at the first use the clause does not name, skipping the uses it does name: `bump` promises the cell `c` and then prints, so the report names `stdout` and the note lands on the print rather than on the write of `c` above it."
kind = "negative"
case = "../../../cases/effects/err_promise_note.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::UsesPromiseViolated"
expect_diagnostic_code = "0x030001F1"
expect_output_contains = ["err_promise_note.cml:8:", "stdout", "at 10:5]"]

[[tests]]
name = "err.pure_recursive"
desc = "A recursive `pure` function is held to its clause like any other: the body prints, and the call to itself is a use like any other call, so the declaration is refused and the use is named."
kind = "negative"
case = "../../../cases/effects/err_pure_recursive.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::UsesPromiseViolated"
expect_diagnostic_code = "0x030001F1"
expect_output_contains = ["err_pure_recursive.cml:9:", "(n: int) => int pure", "stdout"]

[[tests]]
name = "err.wide_parameters"
desc = "A use through a parameter the signature cannot number (the 257th) is not dropped: the measurement gives up on the body and records it as reaching something unknown, so a declaration whose clause cannot be shown to cover it is refused rather than passing on a use nobody recorded."
kind = "negative"
case = "../../../cases/effects/err_wide_parameters.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::UsesPromiseViolated"
expect_diagnostic_code = "0x030001F1"
expect_output_contains = ["err_wide_parameters.cml:11:", "does not keep its resource promise"]
