id = "compile.equality"
order = 333
tier = "fast"
tags = ["feat", "compile", "equality", "types"]
desc = "`==` and `!=` by content on arrays, tuples and structs, and `contains` on strings (design principles 4.2): the four back ends, the optimisation pipelines, and what is refused at compile time"

# The values themselves are checked on the four back ends by consistency.values
# (value.content_equality). Here: the pipelines give the same output (the operator is pure and
# may be folded), and the operand types `==` is not defined for are located compile-time errors.

[defaults]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

[[tests]]
name = "equality.inline"
desc = "The golden output of value.content_equality after std::opt::inline, on the three linear back ends."
backends = ["inline_nvm", "inline_fvm", "inline_jit"]
args = ["${case}", "${backend}"]
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
case = "../../../cases/consistency/values/content_equality.cml"
golden = "../consistency/golden/content_equality.txt"
expect_exit = 0
expect_output_not_contains = ["[Error]", "Segmentation fault", "dumped core"]

[[tests]]
name = "equality.fold"
desc = "The same output under std::opt::fold: folding a comparison of constants gives what running it gives."
args = ["${case}", "std::opt::fold", "std::fvm"]
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
case = "../../../cases/consistency/values/content_equality.cml"
golden = "../consistency/golden/content_equality.txt"
expect_exit = 0
expect_output_not_contains = ["[Error]", "Segmentation fault", "dumped core"]

[[tests]]
name = "equality.simplify"
desc = "The same output under std::opt."
args = ["${case}", "std::opt", "std::nvm"]
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
case = "../../../cases/consistency/values/content_equality.cml"
golden = "../consistency/golden/content_equality.txt"
expect_exit = 0
expect_output_not_contains = ["[Error]", "Segmentation fault", "dumped core"]

[[tests]]
name = "equality.macro_opt"
desc = "The same output under std::macro std::opt and the JIT."
args = ["${case}", "std::macro", "std::opt", "std::jit"]
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
case = "../../../cases/consistency/values/content_equality.cml"
golden = "../consistency/golden/content_equality.txt"
expect_exit = 0
expect_output_not_contains = ["[Error]", "Segmentation fault", "dumped core"]

[[tests]]
name = "equality.err_function_part"
desc = "An array of function values cannot be compared: no overload of `==`, at the operator; the message lists the overload for composite values and what it needs."
kind = "negative"
case = "../../../cases/compile/equality/err_function_part.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["err_function_part.cml:5:19: [Error]: No matching function found", "(name=SemanticDiag::NoMatchingFunction, code=0x0300000F)", "operator '==' is not defined for these operand types", "T an array, tuple or struct of comparable parts"]

[[tests]]
name = "equality.err_not_equal_function"
desc = "A tuple with a function value in it cannot be compared with `!=` either. (`!=` used to accept any two values of one type and compared references.)"
kind = "negative"
case = "../../../cases/compile/equality/err_not_equal_function.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["err_not_equal_function.cml:4:25: [Error]: No matching function found", "(name=SemanticDiag::NoMatchingFunction, code=0x0300000F)", "operator '!=' is not defined for these operand types"]

[[tests]]
name = "equality.err_types_differ"
desc = "Both sides must have the same type: int[] against float[] is a compile-time error, nothing is converted."
kind = "negative"
case = "../../../cases/compile/equality/err_types_differ.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["err_types_differ.cml:2:23: [Error]: No matching function found", "(name=SemanticDiag::NoMatchingFunction, code=0x0300000F)", "(int[], float[])"]

[[tests]]
name = "equality.null_test_never_null"
desc = "A null test on a value that cannot be null is fixed, not open: `x` has type `int`, so `x == null` is always false, and the report says so -- naming the value, its type and the answer -- while the program still runs on the fixed answer. Design principles 3.8."
kind = "negative"
case = "../../../cases/compile/equality/null_test_never_null.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "always\n"
expect_diagnostic_name = "SemanticDiag::NullTestNeverNull"
expect_output_contains = ["'x' has type 'int', which is never null: this test is always false."]

[[tests]]
name = "equality.negates_the_whole_comparison"
desc = "`!=` on an array, a tuple, a struct and a string is the negation of the whole `==`: the graph holds `:op/eq` -- the entry that compares a composite by content -- and `:op/not`, and no node named `:op/ne`, because the front end builds `!=` as `!(==)` for every operand type and the group `__neq__` is a name the modules fill rather than a resolver `!=` asks."
kind = "behavior"
case = "../../../cases/compile/equality/negates_the_whole_comparison.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = """true false
true false
true false
false true
"""

[[tests]]
name = "equality.negative_graph"
desc = "The same program printed as a graph: the whole comparisons are `:op/eq` nodes and the negations are `:op/not` on their result, and nothing in the graph is named `:op/ne`."
kind = "behavior"
case = "../../../cases/compile/equality/negates_the_whole_comparison.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
expect_stdout_contains = ["label=\":op/eq\"", "label=\":op/not\""]
expect_output_not_contains = ["label=\":op/ne\""]
[[tests]]
name = "equality.collections_compare_by_content"
desc = "A map and a set are compared by content -- same entries, same members, in any order -- and their `!=` is the negation of that comparison; the four back ends agree."
kind = "behavior"
case = "../../../cases/compile/equality/collections_compare_by_content.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = """true false
false true
true false
false true
"""

[[tests]]
name = "equality.collections_negative_graph"
desc = "The same program printed as a graph: a map's and a set's equality is `:coll/eq` and its negation is `:op/not`, and nothing in the graph is named `:coll/neq` -- the collection reaches its `!=` through the equality it owns."
kind = "behavior"
case = "../../../cases/compile/equality/collections_compare_by_content.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
expect_stdout_contains = ["label=\":coll/eq\"", "label=\":op/not\""]
expect_output_not_contains = ["coll/neq"]