id = "compile.module_imports"
order = 333
tier = "feat"
tags = ["feat", "compile", "semantic", "negative", "modules", "import"]
desc = "Imports that used to compute with the wrong value or crash the compiler are located compile-time errors"

# docs/design/module-root/README.cn.md, appendix B (D1 to D6). Exported values and the merged
# root are not implemented; these tests hold the diagnostics that stand in their place. No
# program here may crash.

[defaults]
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "Internal", "bad any_cast", ":?:?"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

# ---- D1: an imported function that uses a value of the top level of its own module ----

[[tests]]
name = "imports.d1_shadow"
desc = "The importing module has a top-level value of the same name: the imported function used it silently (1001 instead of 11). Now an error at the function, with the use."
kind = "negative"
case = "../../../cases/compile/module_imports/d1_shadow.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ImportedFunctionUsesModuleValue"
expect_diagnostic_line = 10
expect_diagnostic_column = 1
expect_output_contains = ["mi_values.cml:10:1", "The function 'bump' is used from another module, but it uses 'base' of the top level of its own module", "used from another module here at", "d1_shadow.cml:6:13", "Pass the value as a parameter"]
expect_output_not_contains = ["1001", "Segmentation fault", "internal error", "Internal"]

[[tests]]
name = "imports.d1_shadow_check"
desc = "The same through `camel check`."
kind = "negative"
case = "../../../cases/compile/module_imports/d1_shadow.cml"
args = ["check", "-O", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ImportedFunctionUsesModuleValue"
expect_diagnostic_line = 10
expect_output_contains = ["mi_values.cml:10:1", "d1_shadow.cml:6:13"]

[[tests]]
name = "imports.d1_unresolved"
desc = "Without a value of that name in the importing module it was UnresolvedReference pointing at the importer's `main`."
kind = "negative"
case = "../../../cases/compile/module_imports/d1_unresolved.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ImportedFunctionUsesModuleValue"
expect_diagnostic_line = 10
expect_output_contains = ["mi_values.cml:10:1", "d1_unresolved.cml:4:13"]
expect_output_not_contains = ["UnresolvedReference", "Segmentation fault", "internal error", "Internal"]

[[tests]]
name = "imports.d1_indirect"
desc = "The exported function calls a function of its module that is not exported, and that one uses the value."
kind = "negative"
case = "../../../cases/compile/module_imports/d1_indirect.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ImportedFunctionUsesModuleValue"
expect_diagnostic_line = 14
expect_output_contains = ["mi_values.cml:14:1", "The function 'indirect' is used from another module, but it uses 'base'", "d1_indirect.cml:6:13"]
expect_output_not_contains = ["2001", "Segmentation fault", "internal error", "Internal"]

[[tests]]
name = "imports.d1_var"
desc = "A top-level `var` of the declaring module."
kind = "negative"
case = "../../../cases/compile/module_imports/d1_var.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ImportedFunctionUsesModuleValue"
expect_diagnostic_line = 18
expect_output_contains = ["mi_values.cml:18:1", "The function 'count' is used from another module, but it uses 'cnt'", "d1_var.cml:4:13"]

[[tests]]
name = "imports.d1_qualified"
desc = "The imported function reached through its module (`m::f`)."
kind = "negative"
case = "../../../cases/compile/module_imports/d1_qualified.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ImportedFunctionUsesModuleValue"
expect_diagnostic_line = 10
expect_output_contains = ["mi_values.cml:10:1", "d1_qualified.cml:6:13"]
expect_output_not_contains = ["1001", "Segmentation fault", "internal error", "Internal"]

[[tests]]
name = "imports.d1_ok"
desc = "Not refused: imported functions that use no top-level value (one takes the value as a parameter, one calls a function without parameters), from a module that also has functions which do; and the entry module's own functions using its own top-level `let` and `var`."
kind = "behavior"
case = "../../../cases/compile/module_imports/d1_ok.cml"
args = ["-E", "short", "${case}"]
expect_exit = 0
expect_stdout_exact = "2 2000 11\n1001 5 11\n"
expect_output_not_contains = ["Error", "Warn"]

[[tests]]
name = "imports.d1_ok_check"
desc = "The same program through `camel check`: no diagnostic."
kind = "behavior"
case = "../../../cases/compile/module_imports/d1_ok.cml"
args = ["check", "-O", "short", "${case}"]
expect_exit = 0
expect_output_not_contains = ["Error", "Warn"]

# ---- D2: using an exported value ----

[[tests]]
name = "imports.d2_value"
desc = "`export let` used by the importing module crashed the compiler. ConstructNotSupported at the use."
kind = "negative"
case = "../../../cases/compile/module_imports/d2_value.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ConstructNotSupported"
expect_diagnostic_line = 4
expect_diagnostic_column = 13
expect_output_contains = ["'pi' is not supported: a value exported by another module cannot be used yet"]

[[tests]]
name = "imports.d2_value_check"
desc = "The same through `camel check` (it crashed too)."
kind = "negative"
case = "../../../cases/compile/module_imports/d2_value.cml"
args = ["check", "-O", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ConstructNotSupported"
expect_diagnostic_line = 4
expect_diagnostic_column = 13

[[tests]]
name = "imports.d2_qualified"
desc = "The same value reached as `m::pi`."
kind = "negative"
case = "../../../cases/compile/module_imports/d2_qualified.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ConstructNotSupported"
expect_diagnostic_line = 4
expect_diagnostic_column = 13
expect_output_contains = ["'mi_values::pi' is not supported"]

[[tests]]
name = "imports.d2_unused"
desc = "Importing the value without using it stays accepted."
kind = "behavior"
case = "../../../cases/compile/module_imports/d2_unused.cml"
args = ["-E", "short", "${case}"]
expect_exit = 0
expect_stdout_exact = "2\n"

# ---- D3: modules that import each other ----

[[tests]]
name = "imports.d3_mutual"
desc = "a imports b, b imports a: the compiler crashed. ImportCycle at the import that closes the ring, with the ring."
kind = "negative"
case = "../../../cases/compile/module_imports/d3_mutual.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_output_contains = ["cyc_b.cml:2:1: [Error]: The module 'cyc_a' is imported while it is itself being loaded (import cycle: cyc_a -> cyc_b -> cyc_a)", "name=SemanticDiag::ImportCycle", "name=SemanticDiag::ImportedModuleHasErrors", "d3_mutual.cml:1:1"]

[[tests]]
name = "imports.d3_mutual_check"
desc = "`camel check` on one module of the ring (it crashed too)."
kind = "negative"
case = "../../../cases/compile/module_imports/cyc_a.cml"
args = ["check", "-O", "short", "${case}"]
expect_exit = 1
expect_output_contains = ["name=SemanticDiag::ImportCycle", "import cycle: cyc_b -> cyc_a -> cyc_b"]

[[tests]]
name = "imports.d3_ring"
desc = "A ring of three modules."
kind = "negative"
case = "../../../cases/compile/module_imports/d3_ring.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_output_contains = ["ring_c.cml:2:1: [Error]: The module 'ring_a' is imported while it is itself being loaded (import cycle: ring_a -> ring_b -> ring_c -> ring_a)", "name=SemanticDiag::ImportCycle"]

# ---- D5: two imports of one name ----

[[tests]]
name = "imports.d5_conflict"
desc = "Two imports bring `f(int)`: the first was taken silently (printed 2). Design principles 2.10: an error, at the second import with the first."
kind = "negative"
case = "../../../cases/compile/module_imports/d5_conflict.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ImportNameConflict"
expect_diagnostic_line = 2
expect_diagnostic_column = 1
expect_output_contains = ["The name 'f' is imported from the modules 'conf_b' and 'conf_c' with the same signature (int)", "also imported here at 1:1"]

[[tests]]
name = "imports.d5_conflict_check"
desc = "The same through `camel check`."
kind = "negative"
case = "../../../cases/compile/module_imports/d5_conflict.cml"
args = ["check", "-O", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ImportNameConflict"
expect_diagnostic_line = 2

[[tests]]
name = "imports.d5_overload"
desc = "Unchanged, and undecided (design note Q11): the same name with different parameter types forms a set of overloads."
kind = "behavior"
case = "../../../cases/compile/module_imports/d5_overload.cml"
args = ["-E", "short", "${case}"]
expect_exit = 0
expect_stdout_exact = "2 a!\n"

[[tests]]
name = "imports.d5_qualified"
desc = "Not a conflict: both modules imported whole and the functions reached by qualified names."
kind = "behavior"
case = "../../../cases/compile/module_imports/d5_qualified.cml"
args = ["-E", "short", "${case}"]
expect_exit = 0
expect_stdout_exact = "2 101\n"

[[tests]]
name = "imports.d5_same_twice"
desc = "Not a conflict: the same name imported twice from the same module."
kind = "behavior"
case = "../../../cases/compile/module_imports/d5_same_twice.cml"
args = ["-E", "short", "${case}"]
expect_exit = 0
expect_stdout_exact = "2\n"

# ---- D4: std::cpp and a computed top-level value ----

[[tests]]
name = "imports.d4_cpp_computed"
desc = "std::cpp writes what `main` is given as an expression; a top-level value that is computed has none and the emitter crashed. TranslationRefused at the value."
kind = "negative"
case = "../../../cases/compile/module_imports/d4_cpp_computed.cml"
args = ["-E", "short", "${case}", "std::cpp"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::TranslationRefused"
expect_diagnostic_line = 5
expect_output_contains = ["std::cpp translates only literal top-level values yet"]

[[tests]]
name = "imports.d4_cpp_literal"
desc = "Unchanged: a literal top-level value is passed to the entry function."
kind = "behavior"
case = "../../../cases/compile/module_imports/d4_cpp_literal.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
expect_stdout_contains = ["generated::f_main(10LL)"]

# ---- D6: port names of a function that captures, in std::rgir ----

[[tests]]
name = "imports.d6_rgir_port_names"
desc = "The capture port is named by the captured name and the parameter by its own (the capture had the parameter's name and the parameter none)."
kind = "behavior"
case = "../../../cases/compile/module_imports/d4_cpp_literal.cml"
args = ["${case}", "std::rgir"]
expect_exit = 0
expect_stdout_contains = ["N00 [label=\"k\", type=\"PORT\"];", "N01 [label=\"x\", type=\"PORT\"];", "F02 -> N00 [label=\"0\", type=\"WITH_PORT\"];", "F02 -> N01 [label=\"0\", type=\"NORM_PORT\"];"]
