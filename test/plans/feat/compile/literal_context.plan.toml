# A position that takes a value by putting it into the form (`T?`, `T!`) takes the value itself
# and the payload, so it does not determine which of the two the value is (design principles 3.8,
# 5.2): a call standing there keeps the type its own arguments give it, and the form is put on at
# the position. Before the position's `int?` solved the call's result type variable, the
# deferred initial value of the reduction was given `int?` with it, and the call was refused as a
# whole -- the 82 cells of `opt.progen` (seeds 19 and 23), and every position below.

[[tests]]
name = "context.boxed_position"
desc = "A `T?` position does not make the call standing in it a `T?`: `let v: int? = xs->reduce<(a: int, b: int): int => a + b, 0>` is an `int` reduction with the form put on at the declaration, at the arm of an `if` under a declared `T?` return, at a struct field and at an `int?` parameter. A lambda with unwritten parameter types takes them at the call, and the accumulator is the position's payload (`f64` when the initial `0` takes it there). A `with` parameter of the concrete type `int?` and the literal `5` in an `int?` declaration still take the form. Before this every construct but the last two was `NoMatchingFunction` (`<(a: int, b: int) => int, int?> (int[])`)."
kind = "behavior"
case = "../../../cases/compile/literals/context_boxed_position.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "10 10 10\nabc 10\n10 4.0\n5 0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

# `x->f` is `f(x, ...)`, so a composite literal in the receiver of the arrow is the first
# ordinary argument and takes the parameter's type by the same rule (design principles 4.4, 5.1):
# `[1.0, 2.0]->total` with `total(xs: f32[])` is an `f32[]`, an integer element takes the element
# type, a struct and a tuple receiver become the parameter's type, and the elements are converted
# once from the values as they were written (1.00000012, not the 1 the double prints).

[[tests]]
name = "context.arrow_receiver"
desc = "A composite literal in the receiver of `->` takes the parameter's type: `[1.0, 2.0]->total` with `xs: f32[]` is an `f32[]` (an integer element too), `[]` is the empty one, a nested array, a struct literal and a struct literal with an array field become the parameter's type, and so does a tuple. The receiver enters the first call of a chain, an argument written after the receiver is an argument like any other, and the element just above the f32 midpoint prints 1.00000012 where the same array written in a declared `f32[]` position prints 1 (that one is a `float[]` rounded through the double)."
kind = "behavior"
case = "../../../cases/compile/literals/context_arrow_receiver.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["Error", "Warn"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
expect_stdout_exact = "3.0 3 0 3.0\n25.0 12.0 3.5\n4.0 3.0\n3 3\n"
timeout_ms = 8000

