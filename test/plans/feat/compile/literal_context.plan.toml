# The other direction (H15h): a number where a text is declared is a type mismatch too, and the
# help names `string(n)`, the conversion that writes a number as text.

[[tests]]
name = "context.declared_string_int"
desc = "`let x: string = 42` is DeclaredTypeMismatch saying an `int` is not a `string` (design principles 5.1: no implicit conversion either way), not a literal that cannot be represented; the help names `string(n)` (H15h)."
kind = "negative"
case = "../../../cases/compile/literals/context_declared_string_int.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::DeclaredTypeMismatch"
expect_diagnostic_line = 9
expect_diagnostic_column = 5
expect_output_contains = ["This value has type 'int', which is not the declared type 'string'", "'string(n)' for a number written as text"]
expect_output_not_contains = ["LiteralNotRepresentable", "cannot be represented"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

