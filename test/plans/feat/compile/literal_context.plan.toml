# A composite literal is a position with an expected type too (design principles
# 5.1): an array or struct literal argument enters its parameter's type, as a numeric literal
# does, and its elements (fields) are converted once from the values written.

[[tests]]
name = "context.composite_argument"
desc = "An array or struct literal argument takes the parameter's type: `pick([1.0])` with `xs: f32[]` is an `f32[]` (integer elements too), `[]` is the empty one, `norm({ x: 3.0, y: 4.0 })` is the struct parameter's type, and so are an array of arrays, a method-style call, a `with` argument, an operator of the program (exact and generic) and a generic parameter another argument fixes. The decimals just above the f32 midpoint print 1.00000012, not 1.0: elements are converted from the values written."
kind = "behavior"
case = "../../../cases/compile/literals/context_composite_argument.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
