id = "compile.literal_context"
order = 328
tier = "feat"
tags = ["feat", "compile", "literals"]
desc = "A literal takes its type from the context: the expected type (a declaration, a parameter, a return, an array element, a struct field, a match pattern, a `return` in an arm), the other operand, then the default type (design principles 5.1)."

# The rule, its order and its arithmetic, printed on every scheduler.
[[tests]]
name = "context.order"
desc = "A literal takes the type of the position it is written in (declaration, parameter, return, the other operand of an operator), else its default type; an expression of literals only is computed with its exact value (0.1 + 0.2 is 0.3, 2 ^ 63 - 1 has no room to overflow); integer and real stay apart (1 / 3 is 0)."
kind = "behavior"
case = "../../../cases/compile/literals/literal_context.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["Error", "Warn"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "2.0 1.0 3",
  "7.0 2.5 0.0",
  "2.0 2.0",
  "3.0 2.5 4",
  "3 3.0 x true",
  "true false",
  "9223372036854775807 9223372036854775807",
  "2000000000",
  "0 0.3333333333333333 1024 1024.0",
  "0.33333334 0.3",
  "3 -3 1 -1",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

# The rule is a compile-time rule: a value that does not fit the type it is given is an error at
# the position that gave it the type, not a fault at run time (and not a wrap-around).

[[tests]]
name = "context.fold_out_of_range"
desc = "`9223372036854775807 + 1` is 9223372036854775808 exactly and does not fit an int: an error at the whole expression, where a run-time add would wrap, quoting the expression as written and the value it came to."
kind = "negative"
case = "../../../cases/compile/literals/context_fold_out_of_range.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::LiteralNotRepresentable"
expect_diagnostic_line = 9
expect_diagnostic_column = 18
expect_output_contains = ["'9223372036854775807 + 1'", "type 'int'", "the value 9223372036854775808 is out of range (-9223372036854775808 to 9223372036854775807)"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "context.argument_out_of_range"
desc = "A literal argument takes the parameter's type: 3000000000 does not fit the i32 of `take`."
kind = "negative"
case = "../../../cases/compile/literals/context_argument_out_of_range.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::LiteralNotRepresentable"
expect_diagnostic_line = 10
expect_diagnostic_column = 18
expect_output_contains = ["'3000000000'", "type 'i32'", "out of range (-2147483648 to 2147483647)"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "context.operand_out_of_range"
desc = "A literal operand takes the other operand's type: `t + 3000000000` is an i32 sum, and 3000000000 does not fit an i32."
kind = "negative"
case = "../../../cases/compile/literals/context_operand_out_of_range.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::LiteralNotRepresentable"
expect_diagnostic_line = 7
expect_diagnostic_column = 17
expect_output_contains = ["'3000000000'", "type 'i32'"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

# The other positions with an expected type (handover H24): the elements of an array literal, the
# fields of a struct literal, the pattern of a `match` case, and a `return` written in an arm.

[[tests]]
name = "context.data_literal"
desc = "The elements of an array literal and the fields of a struct literal take the expected type (`let xs: float[] = [1, 2.0]` is all float, `let p: Point = { x: 1, y: 2.0 }` too); with no expected type one array widens to the widest kind of the literals written in it (`[1, 2.0]` is float), while a struct literal keeps each field's own kind; a match pattern is the type of the value matched."
kind = "behavior"
case = "../../../cases/compile/literals/context_data_literal.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["Error", "Warn"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "[1.0, 2.0] [1, 2] { x: 1.0, y: 2.0 }",
  "[1.0, 2.0] { x: 1, y: 2.0 }",
  "1 0",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

[[tests]]
name = "context.arm_value"
desc = "The value of an `if` or `match` arm takes the expected type of the whole expression: `let x: float` makes both arms floats (`1`, printed `1.0`), `let z: i32` makes them i32s, and an arm that is an array literal takes the element type of the whole (`[1.0]` is an `f32[]`); a function body whose last expression is a branch is a position too, and so is the value of a `return`."
kind = "behavior"
case = "../../../cases/compile/literals/context_arm_value.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["Error", "Warn"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "1.0 1.0 1",
  "1.0",
  "1.0 2.0",
  "1.0 2.0",
  "2.0",
  "1.0 2.0",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

[[tests]]
name = "context.composite_rounding"
desc = "A composite literal keeps the exact value each element was written as, and GIR rebuilds it from those values: a decimal just above the midpoint between 1.0 and the next f32 prints 1.00000012 whether it is returned from an array literal, declared, a struct field or a nested array, not 1.0 from a rounding through a double."
kind = "behavior"
case = "../../../cases/compile/literals/context_composite_rounding.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["Error", "Warn"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "1.00000012",
  "1.00000012",
  "1.00000012",
  "1.00000012",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

[[tests]]
name = "context.arm_exit"
desc = "A `return` written in a branch arm takes the type of the arm's position, not the declared return type of the function: with nothing expected, `2` in an arm of a float function is an int (printed `2`); with `let v: float`, the same `2` is a float (printed `2.0`), and the function may return an int."
kind = "behavior"
case = "../../../cases/compile/literals/context_arm_exit.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["Error", "Warn"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "2",
  "3",
  "2.0 3.0",
  "2.0",
  "2.0",
  "2 2",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

[[tests]]
name = "context.truncated"
desc = "`let x: int = 1.9` is `LiteralNotRepresentable` at the declaration, and says the value would be truncated: neither wrapped nor cut."
kind = "negative"
case = "../../../cases/compile/literals/context_truncated.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::LiteralNotRepresentable"
expect_diagnostic_line = 9
expect_diagnostic_column = 5
expect_output_contains = ["'1.9'", "type 'int'", "the value would be truncated"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "context.not_a_number"
desc = "`int('12abc')` is `LiteralNotRepresentable`: the text is not a number, quoted as written."
kind = "negative"
case = "../../../cases/compile/literals/context_not_a_number.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::LiteralNotRepresentable"
expect_diagnostic_line = 7
expect_diagnostic_column = 16
expect_output_contains = ["12abc", "type 'int'", "the text is not a number"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "context.conversion_out_of_range"
desc = "A conversion written by the program with a literal argument (`i32(5000000000)`) is the same diagnostic, saying the value is out of the range."
kind = "negative"
case = "../../../cases/compile/literals/context_conversion_out_of_range.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::LiteralNotRepresentable"
expect_diagnostic_line = 8
expect_diagnostic_column = 16
expect_output_contains = ["'5000000000'", "type 'i32'", "out of range (-2147483648 to 2147483647)"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "context.array_element_out_of_range"
desc = "An element of an array literal takes the element type: 3000000000 does not fit the i32 of `let xs: i32[] = [1, 3000000000]`, and the error is at the element."
kind = "negative"
case = "../../../cases/compile/literals/context_array_element_out_of_range.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::LiteralNotRepresentable"
expect_diagnostic_line = 8
expect_diagnostic_column = 25
expect_output_contains = ["'3000000000'", "type 'i32'", "out of range (-2147483648 to 2147483647)"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "context.pattern_out_of_range"
desc = "A match pattern takes the type of the value matched: `case 5000000000` against an i32 is `LiteralNotRepresentable`."
kind = "negative"
case = "../../../cases/compile/literals/context_pattern_out_of_range.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::LiteralNotRepresentable"
expect_diagnostic_line = 9
expect_diagnostic_column = 14
expect_output_contains = ["'5000000000'", "type 'i32'", "out of range (-2147483648 to 2147483647)"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "context.struct_field_variable"
desc = "A field of a struct literal written as a name is a variable: `let p: Point = { x: n, y: 2.0 }` with `n` an int does not meet the declared type (DeclaredTypeMismatch), though its literal fields do take the type."
kind = "negative"
case = "../../../cases/compile/literals/context_struct_field_variable.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::DeclaredTypeMismatch"
expect_diagnostic_line = 11
expect_diagnostic_column = 5
expect_output_contains = ["type '{ x: int, y: float }'", "declared type '{ x: float, y: float }'"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

# What the rule must not do: convert a variable.

[[tests]]
name = "context.variable_declaration"
desc = "`let y: float = n` with `n` an int is still an error: the expected type moves a literal, never a variable."
kind = "negative"
case = "../../../cases/compile/literals/context_variable_declaration.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::DeclaredTypeMismatch"
expect_diagnostic_line = 7
expect_output_contains = ["type 'int'", "declared type 'float'"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "context.variable_operator"
desc = "`a + b` with `a` an i32 and `b` an int is still an error: variables of two numeric types do not meet in an operator."
kind = "negative"
case = "../../../cases/compile/literals/context_variable_operator.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_output_contains = ["context_variable_operator.cml:8:17: [Error]: No matching function found", "(name=SemanticDiag::NoMatchingFunction, code=0x0300000F)", "(i32, int)", "operator '+' is not defined"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "context.literal_operand_mismatch"
desc = "`n + 1.0` with `n` an int is still an error: the real literal does not become an int because the other operand is one."
kind = "negative"
case = "../../../cases/compile/literals/context_literal_operand_mismatch.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_output_contains = ["context_literal_operand_mismatch.cml:7:17: [Error]: No matching function found", "(name=SemanticDiag::NoMatchingFunction, code=0x0300000F)", "(int, float)", "operator '+' is not defined"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000