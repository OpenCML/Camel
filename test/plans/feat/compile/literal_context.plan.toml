id = "compile.literal_context"
order = 328
tier = "feat"
tags = ["feat", "compile", "literals"]
desc = "A literal takes its type from the context: the expected type (a declaration, a parameter, a return, an array element, a struct field, a match pattern, a `return` in an arm), the other operand, then the default type (design principles 5.1)."

# The rule, its order and its arithmetic, printed on every scheduler.
[[tests]]
name = "context.order"
desc = "A literal takes the type of the position it is written in (declaration, parameter, return, the other operand of an operator), else its default type; an expression of literals only is computed with its exact value (0.1 + 0.2 is 0.3, 2 ^ 63 - 1 has no room to overflow); integer and real stay apart (1 / 3 is 0)."
kind = "behavior"
case = "../../../cases/compile/literals/literal_context.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["Error", "Warn"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "2.0 1.0 3",
  "7.0 2.5 0.0",
  "2.0 2.0",
  "3.0 2.5 4",
  "3 3.0 x true",
  "true false",
  "9223372036854775807 9223372036854775807",
  "2000000000",
  "0 0.3333333333333333 1024 1024.0",
  "0.33333334 0.3",
  "3 -3 1 -1",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

# The empty array literal is the one whose type the position decides entirely (design principles
# 5.1, 5.2): it holds nothing, so `[]` in a `T[]` position is the empty array of `T`.

[[tests]]
name = "context.empty_array"
desc = "`[]` in a position of type `T[]` is that type: a cast (`[] as int[]`), a declaration, an array of arrays, a struct field, a parameter, and the value of a loop (`loop acc = []` whose loop gives an `int[]`, in a function and under an annotated `let`). When the loop's position is open too, the appended value gives the state its element type. A cast of `[]` used to be refused."
kind = "behavior"
case = "../../../cases/compile/literals/empty_array_context.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "0\n[0, 1, 4, 9]\n[0.5, 1.0, 1.5]\n[0, 1, 4, 9]\n0\n[[]]\n0\n0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

# A comprehension is not the empty literal. `[e for x in s]` writes no element list either, so a
# position that stated an array type used to build it as `[]` and drop every round without a word:
# the name held an empty array and the rounds were never counted (design principles 4.2, 5.1).
# A comprehension is a value of its own, and the position's type reaches it the way it reaches the
# same comprehension returned from a function with that declared type.

[[tests]]
name = "context.comprehension_position"
desc = "A comprehension written where a `T[]` is stated keeps its rounds: a declaration's annotation, a `var` declaration, an `as` cast, an element of a tuple, and the declared return type of a function (the position that always worked). It used to be built as the empty array literal, silently."
kind = "behavior"
case = "../../../cases/compile/literals/comprehension_in_position.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "[0.0, 1.0, 2.0, 3.0] 4\n[1, 2, 3, 4] 4\n4 7\n[0.0, 0.5, 1.0, 1.5] 4\n[0, 1, 4, 9] 4\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

# The rule is a compile-time rule: a value that does not fit the type it is given is an error at
# the position that gave it the type, not a fault at run time (and not a wrap-around).

[[tests]]
name = "context.fold_out_of_range"
desc = "`9223372036854775807 + 1` is 9223372036854775808 exactly and does not fit an int: an error at the whole expression, where a run-time add would wrap, quoting the expression as written and the value it came to."
kind = "negative"
case = "../../../cases/compile/literals/context_fold_out_of_range.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::LiteralNotRepresentable"
expect_diagnostic_line = 9
expect_diagnostic_column = 18
expect_output_contains = ["'9223372036854775807 + 1'", "type 'int'", "the value 9223372036854775808 is out of range (-9223372036854775808 to 9223372036854775807)"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "context.argument_out_of_range"
desc = "A literal argument takes the parameter's type: 3000000000 does not fit the i32 of `take`."
kind = "negative"
case = "../../../cases/compile/literals/context_argument_out_of_range.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::LiteralNotRepresentable"
expect_diagnostic_line = 10
expect_diagnostic_column = 18
expect_output_contains = ["'3000000000'", "type 'i32'", "out of range (-2147483648 to 2147483647)"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "context.operand_out_of_range"
desc = "A literal operand takes the other operand's type: `t + 3000000000` is an i32 sum, and 3000000000 does not fit an i32."
kind = "negative"
case = "../../../cases/compile/literals/context_operand_out_of_range.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::LiteralNotRepresentable"
expect_diagnostic_line = 7
expect_diagnostic_column = 17
expect_output_contains = ["'3000000000'", "type 'i32'"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

# The other positions with an expected type: the elements of an array literal, the
# fields of a struct literal, the pattern of a `match` case, and a `return` written in an arm.

[[tests]]
name = "context.data_literal"
desc = "The elements of an array literal and the fields of a struct literal take the expected type (`let xs: float[] = [1, 2.0]` is all float, `let p: Point = { x: 1, y: 2.0 }` too); with no expected type one array widens to the widest kind of the literals written in it (`[1, 2.0]` is float), while a struct literal keeps each field's own kind; a match pattern is the type of the value matched."
kind = "behavior"
case = "../../../cases/compile/literals/context_data_literal.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["Error", "Warn"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "[1.0, 2.0] [1, 2] { x: 1.0, y: 2.0 }",
  "[1.0, 2.0] { x: 1, y: 2.0 }",
  "1 0",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

[[tests]]
name = "context.arm_value"
desc = "The value of an `if` or `match` arm takes the expected type of the whole expression: `let x: float` makes both arms floats (`1`, printed `1.0`), `let z: i32` makes them i32s, and an arm that is an array literal takes the element type of the whole (`[1.0]` is an `f32[]`); a function body whose last expression is a branch is a position too, and so is the value of a `return`."
kind = "behavior"
case = "../../../cases/compile/literals/context_arm_value.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["Error", "Warn"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "1.0 1.0 1",
  "1.0",
  "1.0 2.0",
  "1.0 2.0",
  "2.0",
  "1.0 2.0",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

# The value of a `loop` is a position with an expected type as well, and it reaches the literals
# written in the loop at last: a loop of one state has the state's type, so the state's first
# value stands at the loop's own position; a loop of several states gives a tuple, whose elements
# are the states' positions. Before this, only the empty array literal took that position
# (`loop acc = []`, in context.empty_array), and a literal state kept its default type, so the
# loop was a `float` wherever an `f32` was declared.

[[tests]]
name = "context.loop_state"
desc = "The state's first value takes the loop's own position: a declaration and a declared return type make `loop s = 0.0 while s < 3.0 do s + 1.0` a loop of `f32` (body and condition literals follow from the state's type), a `for` loop of `i32`, an expression of literals only (`1.0 + 2.0`) takes the position as well, and a loop of several states takes one type per element of the tuple position. A composite or empty-array state is not this rule and keeps its own shape (cases/loops/zero_leaf_state.cml, context.empty_array). Before this each of these was a `DeclaredTypeMismatch`/`ReturnTypeMismatch` for `float` where `f32` was declared."
kind = "behavior"
case = "../../../cases/compile/literals/context_loop_state.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["Error", "Warn"]
expect_stdout = "3.0\n3\n3.0\n3\n5.0\n9.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "context.composite_rounding"
desc = "A composite literal keeps the exact value each element was written as, and GIR rebuilds it from those values: a decimal just above the midpoint between 1.0 and the next f32 prints 1.00000012 whether it is returned from an array literal, declared, a struct field or a nested array, not 1.0 from a rounding through a double."
kind = "behavior"
case = "../../../cases/compile/literals/context_composite_rounding.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["Error", "Warn"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "1.00000012",
  "1.00000012",
  "1.00000012",
  "1.00000012",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

[[tests]]
name = "context.arm_exit"
desc = "A `return` written in a branch arm takes the type of the arm's position, not the declared return type of the function: with nothing expected, `2` in an arm of a float function is an int (printed `2`); with `let v: float`, the same `2` is a float (printed `2.0`), and the function may return an int."
kind = "behavior"
case = "../../../cases/compile/literals/context_arm_exit.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["Error", "Warn"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "2",
  "3",
  "2.0 3.0",
  "2.0",
  "2.0",
  "2 2",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

