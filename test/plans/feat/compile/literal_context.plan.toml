name = "context.composite_holes_mismatch"
desc = "A field of a struct literal is a position with an expected type like an array or a tuple element (design principles 5.1): a computed field is a value of its own type and takes no type from the position, so `float` where the field is `int`, and a computed `f64[]` where the field is an `f32[2]`, are each reported at the field itself as `ElementTypeMismatch`, naming the field and the type the position gives it."
