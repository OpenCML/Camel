verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "1.5 1.0 3.25 0",
  "25.0 12.0 3.0",
  "3.5",
  "2.5 8.0",
  "3.0 [1.0, 2.0]",
  "3.0 1.0",
  "1.00000012",
