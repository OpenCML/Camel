[[tests]]
name = "context.struct_argument_shape"
desc = "A struct literal argument must write exactly the fields of the parameter's struct type: `norm({ x: 1.0 })` for a `{ x: f32, y: f32 }` parameter stays `NoMatchingFunction`; the rule moves literals into the type, it does not invent the fields a type has."
kind = "negative"
case = "../../../cases/compile/literals/context_struct_argument_shape.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_output_contains = ["context_struct_argument_shape.cml:13:17: [Error]: No matching function found", "(name=SemanticDiag::NoMatchingFunction, code=0x0300000F)", "({ x: float })", "norm: (p: Point) => f32"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

# A text where a field expects a number (H15h). The field is the position that cannot take the
# value, so the mismatch is reported there in each shape a composite literal has: a struct field
# by name, a positional tuple element, a field of a nested literal, a field of an argument, and a
# field of a returned value.

[[tests]]
name = "context.struct_field_text"
desc = "A text written as a field of a struct literal is DeclaredTypeMismatch at that field: the field's position expects a float and nothing converts a text to a number (design principles 5.1); the message names `string` and `float`, not a literal the whole struct cannot become. The fields are written out of name order, so the position proves an element's origin follows the field, not its slot in the data (H15h)."
kind = "negative"
case = "../../../cases/compile/literals/context_struct_field_text.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::DeclaredTypeMismatch"
expect_diagnostic_line = 13
expect_diagnostic_column = 33
expect_output_contains = ["This value has type 'string', which is not the declared type 'float'", "'string(n)' for a number written as text"]
expect_output_not_contains = ["LiteralNotRepresentable", "the text is not a number"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

