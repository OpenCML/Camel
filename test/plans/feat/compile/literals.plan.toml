normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 20000

[[tests]]
name = "number_token_forms"
desc = "The number tokens a literal and an entry argument share (H15i): hexadecimal, binary and `0o` octal integer tokens take a float position (`0xFF` is 255.0, `0b1010` 10.0, `0o77` 63.0), and a real token with leading zeros is unambiguous (`077.5` is 77.5). A leading-zero decimal integer (`077`) is a lexical error in source, while an entry argument reads it as 77 (entry_args.integer_leading_zero_is_decimal). The translated program is compared with camel on all of them (test/tools/cppexec/expect.txt)."
kind = "behavior"
case = "../../../cases/compile/literals/number_token_forms.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "255.0 10.0 63.0 77.5\n255 10 63\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

