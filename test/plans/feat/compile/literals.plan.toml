# A literal its type cannot hold is a located compile-time error. It used to wrap around or to
# be cut off silently: 9223372036854775808 and 1e400 were the smallest int, and
# `let b: i32 = 3000000000` was -1294967296
# (docs/issues/2026-10-12-language-surface-findings.md, 2).

[[tests]]
name = "literal_range.limits"
desc = "The largest and the smallest literals an int and an i32 hold are accepted, -9223372036854775808 included, in every base and with an exponent; the four back ends print the same."
kind = "behavior"
case = "../../../cases/compile/literals/integer_limits.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["Error", "Warn"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "-9223372036854775808 9223372036854775807",
  "9223372036854775807 -9223372036854775808 7 511 -511",
  "1000000000000000000 9000000000000000000 -9000000000000000000 15 1 0 0 0",
  "2147483647 -2147483648 1.5 -2147483648",
  "9223372036854775806 -9223372036854775807 -9223372036854775808",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

[[tests]]
name = "literal_range.int_too_large"
desc = "9223372036854775808 does not fit an int; it was the smallest int."
kind = "behavior"
case = "../../../cases/compile/literals/int_too_large.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::LiteralOutOfRange"
expect_diagnostic_line = 2
expect_diagnostic_column = 13
expect_output_contains = ["'9223372036854775808'", "type 'int'"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

