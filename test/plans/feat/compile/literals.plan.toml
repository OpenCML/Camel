[[tests]]
name = "literal_range.negative_exponent_warns"
desc = "`1e-2` is the int 0 and `15e-1` the int 1, as before (whether such a literal is a float or an error is not decided); the dropped fraction is now a located warning. `1500e-2` is exactly 15 and is not reported."
kind = "behavior"
case = "../../../cases/compile/literals/int_negative_exponent.cml"
args = ["-E", "short", "${case}"]
expect_exit = 0
expect_stdout_contains = ["0 1 15"]
expect_stderr_contains = ["name=SemanticDiag::IntegerLiteralTruncated", "'1e-2'", "'1.0e-2'", "'15e-1'"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const warnings = input.normalized.stderr.split('\n').filter((l) => l.includes('IntegerLiteralTruncated'))
assert(warnings.length === 2, `expected 2 warnings, got ${warnings.length}: ${input.normalized.stderr}`)
assert(warnings[0].includes(':2:13:'), warnings[0])
}
"""
timeout_ms = 8000
