[[tests]]
name = "literal_range.exponent_is_float"
desc = "A literal with an exponent is a floating-point number (design principles 5.1): `1e-2` is 0.01 and `15e-1` is 1.5; nothing is truncated and nothing is warned about. The warning the old reading used here (`IntegerLiteralTruncated`) was unreachable after H15h and is deleted (H15i)."
kind = "behavior"
case = "../../../cases/compile/literals/int_negative_exponent.cml"
args = ["-E", "short", "${case}"]
expect_exit = 0
expect_stdout_contains = ["0.01 1.5 15"]
expect_output_not_contains = ["Warn"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "literal_conversion.float_to_int"
desc = "A conversion whose argument is a literal that does not fit is refused when the program is compiled, as a literal given such a type is; it was a fault at run time (and a warning of the folding pass)."
kind = "negative"
case = "../../../cases/compile/literals/convert_float_to_int.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::LiteralNotRepresentable"
expect_diagnostic_line = 2
expect_output_contains = ["The literal '1.0e30' cannot be represented as type 'int': out of range (-9223372036854775808 to 9223372036854775807)"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

