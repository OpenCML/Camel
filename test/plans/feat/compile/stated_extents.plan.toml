[[tests]]
name = "stated_take_extents_refused"
desc = "The same check on the parameter that carries it: `take_stated(x, [0], [9])` states an extent of nine against four rows, and stops with `states extent 9 at dimension 0 and the tensor has 4`. The parameter is the point -- the extents are the third one and the indices are the second, and a check that read the indices for the extents would compare `0` with `4` and pass."
kind = "behavior"
