# The three reverse laws that need the extents their forward half consumed: a sum, a take and a lane
# mean. Each forward rule (`stdlib/rulesets/jvp.cml`) passes the extents to the **stated** spelling of
# the operator -- `sum_stated`, `take_stated`, `mean_axis_stated` -- as one known actual argument, and
# each reverse law (`stdlib/rulesets/transpose.cml`, `sum_stated_t` and its two neighbours) reads that
# argument and nothing of the operand the cotangent comes back through. These three cases are what
# says the laws answer the number on paper, and not merely that the walk stopped refusing.
[[tests]]
name = "stated_sum_gradient"
desc = "The gradient of `sum(x)` over `[1.0, 2.0, 3.0]`: `jvp_sum` states `shape(xs)` in the linear call and `sum_stated_t` spreads the cotangent of 1.0 over those extents, so every element gets one -- value 6.0, `dL/dx=[1.0, 1.0, 1.0]`. The reading also names the reverse law the walk applied (`rhs=sum_stated_t`), which is what says the stated operator was reached and not the operand-reading one it replaced."
kind = "behavior"
case = "../../../cases/compile/transforms/stated_sum_gradient.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["stated sum value=6.0 dL/dx=[1.0, 1.0, 1.0]"]
expect_stderr_contains = ["rhs=sum_stated_t"]
expect_output_not_contains = ["skip="]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "stated_take_gradient"
desc = "The gradient of `sum(take(x, [0, 2]))` over `[1.0, 2.0, 3.0, 4.0]`: value 4.0, and `dL/dx=[1.0, 0.0, 1.0, 0.0]`, because the rows read are positions 0 and 2 and the row nobody read gets nothing. The zeros are the point: an adjoint that spread a row's cotangent everywhere, or put it at the wrong position, answers a different array, and the extents it scatters into are `at`'s rather than the cotangent's (which knows only the rows)."
kind = "behavior"
case = "../../../cases/compile/transforms/stated_take_gradient.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["stated take value=4.0 dL/dx=[1.0, 0.0, 1.0, 0.0]"]
expect_output_not_contains = ["skip="]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "stated_mean_axis_gradient"
desc = "The gradient of `sum(mean_axis(x, 0, true))` over `[1.0, 2.0, 3.0, 4.0]`: the value is the mean, 2.5, and every position gets a quarter, `dL/dx=[0.25, 0.25, 0.25, 0.25]` -- the lane length `numel(t) / numel(ct)` the reverse law reads off the stated extents. A law that spread the whole cotangent over the lane (the sum's answer) would read 1.0 here, and one that divided by the cotangent's count would read 0.5. The mean keeps its axis because `transpose.cml#mean_axis_stated_t` declares its cotangent `float[..]`: without `keepdims` the mean of a rank-1 operand answers the element (design principles 5.4) and that law reads it as an array -- which is a SIGSEGV in `numelKernel`, recorded in docs/handover/questions/2026-11-04-axis-reductions-state-their-extents.cn.md, and not this case's to hide."
kind = "behavior"
case = "../../../cases/compile/transforms/stated_mean_axis_gradient.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["stated mean value=2.5 dL/dx=[0.25, 0.25, 0.25, 0.25]"]
expect_output_not_contains = ["skip="]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# The signature, where it can be stated: `at` written in the call is a compile-time constant, so
# `mean_axis_stated` answers the extents the list names instead of `T[..]`. The number is the same
# either way; the *type* is what this pins, because that is what the reverse law reads.
[[tests]]
name = "stated_mean_axis_declares_the_extents"
desc = "`mean_axis_stated(x, [0, 0, 4])` over `[1.0, 2.0, 3.0, 4.0]` states the result's extents: axis 0, no `keepdims`, four elements, so the answer is the element 2.5 and the graph's node is a `float` rather than a `float[..]` under a conversion. The value alone does not say which of the two types was read -- a rank-zero array is its element (design principles 5.4) -- so the case reads the graph: the node's `value_type` and the absence of the `CAST` a declared `T[..]` forced."
kind = "behavior"
case = "../../../cases/compile/transforms/stated_mean_axis_declares_the_extents.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
  const lines = input.normalized.stdout.split(String.fromCharCode(10))
  const stated = lines.filter((l) => l.includes('tensor:mean_axis_stated') || l.includes('mean_axis_stated'))
  assert(stated.length > 0, `no mean_axis_stated node: ${lines.join(' | ')}`)
  const asElement = stated.filter((l) => l.includes('value_type="float"'))
  assert(asElement.length === 1, `the stated lane mean is not a float: ${stated.join(' | ')}`)
  const casts = lines.filter((l) => l.includes('type="CAST"') && l.includes('value_type="float"'))
  assert(casts.length === 0, `a conversion stands between the node and the return: ${casts.join(' | ')}`)
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "stated_mean_axis_declares_the_extents_value"
desc = "The same program run: the stated lane mean of `[1.0, 2.0, 3.0, 4.0]` along its only axis, without `keepdims`, is the mean of the four, 2.5. It is the number the type promised, so the case that reads the graph and the case that reads the answer cannot drift apart without one of them going red."
kind = "behavior"
case = "../../../cases/compile/transforms/stated_mean_axis_declares_the_extents.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["stated lane mean=2.5"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000


[[tests]]
name = "stated_sum_extents_refused"
desc = "A stated extent the tensor does not have is a fault: `sum_stated(x, [2])` over four elements stops on the operator's own line with `states extent 2 at dimension 0 and the tensor has 4`, and the program never prints its reading. This is the check the forward half's `shape(xs)` makes unnecessary and no less necessary: the value does not read the list, so nothing but this comparison can say it is wrong, and an extent nobody compared is a gradient of the wrong shape."
kind = "behavior"
case = "../../../cases/compile/transforms/stated_sum_extents_refused.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 1
expect_output_contains = ["states extent 2 at dimension 0 and the tensor has 4"]
expect_output_not_contains = ["stated sum="]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "stated_take_extents_refused"
desc = "The same check at the second list's own offset: `take_stated(x, [1, 0, 9])` states one index, then one extent of nine against four rows, and stops with `states extent 9 at dimension 0 and the tensor has 4`. The offset is the point -- the extents start after the count and the indices -- so a check that always read from position 0 would compare the index with the extent and pass."
kind = "behavior"
case = "../../../cases/compile/transforms/stated_take_extents_refused.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 1
expect_output_contains = ["states extent 9 at dimension 0 and the tensor has 4"]
expect_output_not_contains = ["stated take="]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
