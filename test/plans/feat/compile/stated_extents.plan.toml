# The three reverse laws that need the extents their forward half consumed: a sum, a take and a lane
# mean. Each forward rule (`stdlib/rulesets/jvp.cml`) passes the extents to the **stated** spelling of
# the operator -- `sum_stated`, `take_stated`, `mean_axis_stated` -- as a named argument, and
# each reverse law (`stdlib/rulesets/transpose.cml`, `sum_stated_t` and its two neighbours) reads that
# argument and nothing of the operand the cotangent comes back through. These three cases are what
# says the laws answer the number on paper, and not merely that the walk stopped refusing.
[[tests]]
name = "stated_sum_gradient"
desc = "The gradient of `sum(x)` over `[1.0, 2.0, 3.0]`: `jvp_sum` states `shape(xs)` in the linear call and `sum_stated_t` spreads the cotangent of 1.0 over those extents, so every element gets one -- value 6.0, `dL/dx=[1.0, 1.0, 1.0]`. The reading also names the reverse law the walk applied (`rhs=sum_stated_t`), which is what says the stated operator was reached and not the operand-reading one it replaced."
kind = "behavior"
case = "../../../cases/compile/transforms/stated_sum_gradient.cml"
args = ["--trace", "transforms", "${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["stated sum value=6.0 dL/dx=[1.0, 1.0, 1.0]"]
expect_stderr_contains = ["rhs=sum_stated_t"]
expect_output_not_contains = ["skip="]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "stated_take_gradient"
desc = "The gradient of `sum(take(x, [0, 2]))` over `[1.0, 2.0, 3.0, 4.0]`: value 4.0, and `dL/dx=[1.0, 0.0, 1.0, 0.0]`, because the rows read are positions 0 and 2 and the row nobody read gets nothing. The zeros are the point: an adjoint that spread a row's cotangent everywhere, or put it at the wrong position, answers a different array, and the extents it scatters into are `at`'s rather than the cotangent's (which knows only the rows)."
kind = "behavior"
case = "../../../cases/compile/transforms/stated_take_gradient.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["stated take value=4.0 dL/dx=[1.0, 0.0, 1.0, 0.0]"]
expect_output_not_contains = ["skip="]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "stated_mean_axis_gradient"
desc = "The gradient of `mean<0, false>(x)` over `[1.0, 2.0, 3.0, 4.0]`: the value is the mean of the four, 2.5, and every position gets a quarter, `dL/dx=[0.25, 0.25, 0.25, 0.25]` -- the lane length `numel(t) / numel(ct)` the reverse law reads off the stated extents. A law that spread the whole cotangent over the lane (the sum's answer) would read 1.0 here, and one that divided by the cotangent's count would read 0.5. The answer is the element itself -- one axis, no `keepdims`, design principles 5.4 -- so the cotangent the law works from has no shape while its port says `T[...]`, and the compiler's rank-zero conversion is what makes `numel(ct)` answer 1 (`camel/core/type/composite/array.h#isRankZeroEdge`, `Array::createRankZero` through `ArrayType::castSlotFrom`). The case wrote `keepdims = true` until the ruling of 2026-11-04 04:20 turned it back, so this reading is the one that says the conversion did not change the derivative."
kind = "behavior"
case = "../../../cases/compile/transforms/stated_mean_axis_gradient.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["stated mean value=2.5 dL/dx=[0.25, 0.25, 0.25, 0.25]"]
expect_output_not_contains = ["skip="]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
known_fail = ["nvm"]
known_fail_owner = "unowned (`lane-rank0point` wrote this mark and is gone)"
known_fail_reason = "the graph is built and then refused by its own return type: `():?:?: [Error]: The value the graph 'split_of_jvp_of_total_backward' hands on has type 'float[...]', and the graph declares 'float'; the value is node 8.` -- `tensor:mean_axis` computes the element at rank 0, the lift states the pair as `(float, float)` because that is the value's own type, and the tangent the rule's right side wrote (`mean_axis_stated(dxs, at)`) is typed `T[...]`; `split` then copies that node as the backward half's exit, whose declared type is `Tangent<float>`"
known_fail_msg = "declares 'float'"
known_fail_ends_when = "when `split` types the rank-zero answer at the cut's exit instead of copying the rank-zero node into a `Tangent<float>` slot, this entry prints `stated mean value=2.5 dL/dx=[0.25, 0.25, 0.25, 0.25]` and exits 0 -- 1.0 in those slots would be the sum's answer spread over the lane and 0.5 a division by the cotangent's count. No refusal is pinned in this sentence, so the run reports `marked known_fail ... but passes` on that reading"
timeout_ms = 20000

# The law with the mean's answer an element instead of an array: `keepdims = false` on a rank-one
# operand, which the entry above cannot be. It was eight SIGSEGVs in `numelKernel` while
# `mean_axis_stated_t` stated its cotangent as `float[...]`
# (docs/handover/reviews/2026-11-04-a-rank-zero-cotangent-is-read-as-a-pointer.cn.md): a port that
# looks like it already has a rank is a slot nothing converts, so `numel(ct)` read the number's bits
# as a pointer. That reading is what the port's `T` was for; the ruling of 2026-11-04 04:20 has the
# port say `T[...]` again and the conversion happen in the compiler, once, where a value's type goes
# from `T` to `T[...]` -- so this entry's own red is now the next boundary, not this one.
[[tests]]
name = "stated_mean_axis_element_gradient"
desc = "The gradient of a lane mean whose answer is the element itself: `mean<0, false>(x)` over `[1.0, 2.0, 3.0, 4.0]` is 2.5, and the adjoint gives every position a quarter, `dL/dx=[0.25, 0.25, 0.25, 0.25]`. The lane length `numel(t) / numel(ct)` divides by three extents' product over `numel(ct)`, so a cotangent read as a pointer is a SIGSEGV and one spread over the lane answers 1.0 -- the number, not just the exit, is what says the conversion happened."
kind = "behavior"
case = "../../../cases/compile/transforms/stated_mean_axis_element_gradient.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["stated mean element value=2.5 dL/dx=[0.25, 0.25, 0.25, 0.25]"]
expect_output_not_contains = ["skip="]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
known_fail = ["nvm"]
known_fail_owner = "unowned (`lane-statedsig` wrote this mark and is gone)"
known_fail_reason = "the graph is built and then refused by its own return type: `():?:?: [Error]: The value the graph 'split_of_jvp_of_total_backward' hands on has type 'float[...]', and the graph declares 'float'; the value is node 8.` -- `tensor:mean_axis`'s result is computed now (`cmp:mean_axis` answers the element at rank 0, which is what the declaration `T[...]` used to deny), and the transpose of the jvp graph still hands the rank-zero array where the split signature says `float`"
known_fail_msg = "declares 'float'"
known_fail_ends_when = "with `stated_mean_axis_gradient`, on the writing whose answer is the element itself: when the cut's exit types the rank-zero answer, this entry prints `stated mean element value=2.5 dL/dx=[0.25, 0.25, 0.25, 0.25]` and exits 0 -- the four quarters are `numel(t) / numel(ct)` read off the stated extents, and a cotangent read as a pointer is the SIGSEGV this case was written to catch"
timeout_ms = 20000

# The signature, where it can be stated: `at` written in the call is a compile-time constant, so
# `mean_axis_stated` answers the extents the list names instead of `T[...]`. The number is the same
# either way; the *type* is what this pins, because that is what the reverse law reads.
[[tests]]
name = "stated_mean_axis_declares_the_extents"
desc = "`mean_axis_stated(x, [0, 0, 4])` over `[1.0, 2.0, 3.0, 4.0]` states the result's extents: axis 0, no `keepdims`, four elements, so the answer is the element 2.5 and the graph's node is a `float` rather than a `float[...]` under a conversion. The value alone does not say which of the two types was read -- a rank-zero array is its element (design principles 5.4) -- so the case reads the graph: the node's `value_type` and the absence of the `CAST` a declared `T[...]` forced."
kind = "behavior"
case = "../../../cases/compile/transforms/stated_mean_axis_declares_the_extents.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
  const lines = input.normalized.stdout.split(String.fromCharCode(10))
  const stated = lines.filter((l) => l.includes('tensor:mean_axis_stated') || l.includes('mean_axis_stated'))
  assert(stated.length > 0, `no mean_axis_stated node: ${lines.join(' | ')}`)
  const asElement = stated.filter((l) => l.includes('value_type="float"'))
  assert(asElement.length === 1, `the stated lane mean is not a float: ${stated.join(' | ')}`)
  const casts = lines.filter((l) => l.includes('type="CAST"') && l.includes('value_type="float"'))
  assert(casts.length === 0, `a conversion stands between the node and the return: ${casts.join(' | ')}`)
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

