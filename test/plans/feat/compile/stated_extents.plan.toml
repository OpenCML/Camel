normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
known_fail = ["nvm"]
known_fail_owner = "unowned (`lane-statedsig` wrote this mark and is gone)"
known_fail_reason = "the same wall `stated_mean_axis_element_gradient` hits, on the library leg: `The value the graph 'split_of_jvp_of_through_library_backward' hands on has type 'float[...]', and the graph declares 'float'` -- `vjp(mean<0, false>(x))` lifts through `rulesets/jvp.cml#jvp_mean_axis`, and the transposed half hands the rank-zero array where the lifted signature says `float`"
known_fail_msg = "declares 'float'"
known_fail_ends_when = "with `stated_mean_axis_element_gradient`, on the library leg: when the cut's exit types the rank-zero answer, this entry prints `value=2.5 engine dL/dw=[0.25, 0.25, 0.25, 0.25] library dL/dx=[0.25, 0.25, 0.25, 0.25]` and exits 0 -- the engine leg is green and stays pinned, and the library leg prints the same four quarters it owes"


