[[tests]]
name = "compile.state_escape.escape_into_closure"
desc = "One level down: `outer` captures `inner`, which holds a cell of `make`'s call, and `make` returns `outer`. The capture travels into a value whose type cannot show it, and that is still fine (3.5); the write `inner` makes is not, and it is `ClosureAssignsCapturedName` (0x03000213)."
