"""

[[tests]]
name = "compile.state_escape.escape_stored_by_callee"
desc = "Route three, a call that keeps it: `keep` returns the function it is given in a pair, so `make` hands it a closure over its own `acc`, and the closure assigns `acc`. Handing it to a function that keeps it is legal now; the write is `ClosureAssignsCapturedName` (0x03000213)."
kind = "negative"
case = "../../../cases/compile/state_escape/err_escape_stored_by_callee.cml"
