[[tests]]
name = "compile.state_escape.read_escape_return"
desc = "Route one read as a value: `make` binds `acc` to 21 and returns a closure that only reads it. Nothing is carried out that has to be owned (the rule), so this is a legal program and it prints 21 + 1 = 22. It pins the legality and the value, not a value port against a shared cell: the name is bound once, and the two-binding shape that would separate them is measured in the header."
kind = "behavior"
case = "../../../cases/compile/state_escape/ok_read_escape_return.cml"
args = ["${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
assert(out.trim() === '22', 'the closure reads the value `acc` had when it was made: ' + JSON.stringify(out))
}
"""

[[tests]]
name = "compile.state_escape.read_escape_field"
desc = "Route two, a field: `fill` binds `acc` to 21 and stores a closure that only reads it into the caller's `b.f`, which outlives the call. The store is legal and the value stored is the value of the name at creation; the call prints 22."
kind = "behavior"
case = "../../../cases/compile/state_escape/ok_read_escape_field.cml"
args = ["${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
assert(out.trim() === '22', 'the stored closure reads the value at creation: ' + JSON.stringify(out))
}
"""

[[tests]]
name = "compile.state_escape.read_escape_array"
desc = "Route two, an element: `fill` binds `acc` to 21 and writes a closure that only reads it into `out[0]`, an element of the caller's array. Same reading as the field: the element holds a value nobody has to own, and the call prints 22."
kind = "behavior"
case = "../../../cases/compile/state_escape/ok_read_escape_array.cml"
args = ["${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
assert(out.trim() === '22', 'the closure in the element reads the value at creation: ' + JSON.stringify(out))
}
"""

[[tests]]
name = "compile.state_escape.read_escape_stored_by_callee"
desc = "Route three, a call that keeps it: `make` binds `acc` twice (0, then 21), hands `keep` a closure that only reads it, and calls back what `keep` returned. The pair holds a value, so the program runs and prints 21 + 0 = 21. Unlike its four siblings this one keeps both bindings: the call that keeps the closure is its last use, and the call site hands over the write's version, so the reading does separate a value from a cell here."
kind = "behavior"
case = "../../../cases/compile/state_escape/ok_read_escape_stored_by_callee.cml"
args = ["${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
assert(out.trim() === '21', 'the kept closure reads the value at creation: ' + JSON.stringify(out))
}
"""

[[tests]]
name = "compile.state_escape.read_escape_into_closure"
desc = "One level down: `inner` reads the 21 `make` bound `acc` to, `outer` captures `inner`, and `make` returns `outer`. The capture travels as a value; the call prints 21 + 1 + 1 = 23."
kind = "behavior"
case = "../../../cases/compile/state_escape/ok_read_escape_into_closure.cml"
args = ["${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
assert(out.trim() === '23', 'the read travels two closures down as the value at creation: ' + JSON.stringify(out))
}
"""

[[tests]]
name = "compile.state_escape.top_level_value"
desc = "The top level is untouched by this lane, and this is its legal half: a `let` constant and a function value are read by the functions that name them (10 + 1 = 11, doubled 22), and nothing is reported -- what a module declares is a value, and no evaluation of it is over."
kind = "behavior"
case = "../../../cases/compile/state_escape/ok_top_level_value.cml"
args = ["${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
assert(out.includes('11'), 'the top-level constant is read: ' + JSON.stringify(out))
assert(out.includes('22'), 'the top-level function value is handed to `double`: ' + JSON.stringify(out))
}
"""