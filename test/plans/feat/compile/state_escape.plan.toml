[[tests]]
name = "compile.state_escape.escape_into_closure"
desc = "One level down: `outer` captures `inner`, which holds a cell of `make`'s call, and `make` returns `outer` -- the value's type cannot show the capture, and the rule follows the value into the closure it is. Compile error."
kind = "negative"
case = "../../../cases/compile/state_escape/err_escape_into_closure.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ClosureCaptureEscapes"
