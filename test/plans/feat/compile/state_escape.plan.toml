[[tests]]
name = "compile.state_escape.top_level_value"
desc = "The top level is untouched by this lane, and this is its legal half: a `let` constant and a function value are read by the functions that name them (10 + 1 = 11, doubled 22), and nothing is reported -- what a module declares is a value, and no evaluation of it is over."
kind = "behavior"
case = "../../../cases/compile/state_escape/ok_top_level_value.cml"
args = ["${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
assert(out.includes('11'), 'the top-level constant is read: ' + JSON.stringify(out))
assert(out.includes('22'), 'the top-level function value is handed to `double`: ' + JSON.stringify(out))
}
"""
