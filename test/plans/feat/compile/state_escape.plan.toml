# What these five cases are now, and what they were.
#
# They were written for the state rule of 2026-11-14 (rule two): a `var` local lives in the call that
# declares it, so a closure may capture one by reference only while it stays inside that call, and a
# closure that leaves -- as a result, into a place the call does not own, or through a call that keeps
# it -- is `SemanticDiag::ClosureCaptureEscapes` (0x03000210). The author withdrew rule two on
# 2026-11-16: a closure captures a VALUE (design principles 3.5, "a closure captures a value", which
# replaces rule two), so carrying a value out of the scope that made it is not a fault of any kind, and
# the diagnostic is deleted from the compiler, the registry and the generated document. A closure that
# captures and only reads a `var` now leaves by every one of the five routes below without a report.
#
# What is left in these programs is the write: each one has `acc = acc + k` inside the closure, and a
# closure cannot assign a name it captured (design principles 3.5, 197) -- the value has nowhere to be
# written. So each is still a compile error, and the rule it is refused by is now
# `SemanticDiag::ClosureAssignsCapturedName` (0x03000213), the one the author says the five should be
# read as. The five cases keep their programs and their names, because the program is what names the
# route; what changed is which rule refuses it.
#
# The five routes, and the case for each:
#
#   as a result              `make` returns the closure that reads its own `acc`
#   into a place it does not own
#                            `fill` stores it into a field, and into an element, of the caller's cell
#   handed to a call that keeps it
#                            `keep` returns it in a pair, and `make` hands `keep` what it was given
#   one level down           `outer` captures `inner`, which holds the cell
#
# A call that merely takes a function still is not a route and never was: `map` and `foreach` take a
# closure and drop it when they return. That half of the old plan stands; what does not stand is that
# leaving at all is a fault.
#
# The bytes of what is refused are pinned: the diagnostic is ClosureAssignsCapturedName, the program is
# refused before it runs, so the cases print nothing.
#
# The module top level is a scope under the same rules, and that half is still NOT in this lane: a
# module `var` works as it did, and its own rule (design principles 3.5, "a module's top level holds
# declarations only: a top-level `var` has no use") is a lane of its own. It is filed as
# docs/handover/reviews/2026-11-14-who-migrates-the-module-level-var.cn.md.
#
# What is NOT covered here either, by design: `Ref<T>` (the sanctioned way to hand long-lived shared
# state out). That belongs to another lane of the same ruling.

id = "compile.state_escape"
order = 1010
tier = "fast"
tags = ["feat", "compile", "effects", "state"]

[defaults]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 20000

[[tests]]
name = "compile.state_escape.capture_within"
desc = "The positive side: a closure captures `acc`, a `var` of `total`'s call, and `total` calls it in its own body -- the write is real and the caller sees it (0 + 1 + 2 + 3 = 6). Nothing is reported."
kind = "behavior"
case = "../../../cases/compile/state_escape/ok_capture_within.cml"
args = ["${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
assert(out.trim() === '6', 'the closure reads and writes the cell inside the call: ' + JSON.stringify(out))
}
"""

[[tests]]
name = "compile.state_escape.escape_return"
desc = "Route one, as a result: `make` returns the closure that reads `acc`, a `var` of its own call, and the closure assigns it. Being carried out of the call is no longer a fault of its own (design principles 3.5, the ruling of 2026-11-16); the write is. Refused by `ClosureAssignsCapturedName` (0x03000213), with the three ways out the design names."
kind = "negative"
case = "../../../cases/compile/state_escape/err_escape_return.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ClosureAssignsCapturedName"
expect_diagnostic_code = "0x03000213"
verify_script = """
({ input, assert }) => {
const text = ((input.output || '') + ' ' + (input.stderr || '')).replace(/\\s+/g, ' ')
assert(text.includes('is assigned inside a closure'), 'the report states the rule: ' + text)
assert(text.includes('return the new value'), 'the first way out is named: ' + text)
assert(text.includes('carried state'), 'the second way out is named: ' + text)
assert(text.includes('a `Ref`'), 'the third way out is named: ' + text)
}
"""

[[tests]]
name = "compile.state_escape.escape_field"
desc = "Route two, a field: `fill` stores the closure that reads its own `acc` into `b.f`, a field of the caller's variable, which outlives the call, and the closure assigns `acc`. The store is not a refusal (3.5, the ruling of 2026-11-16); the write is, and it is `ClosureAssignsCapturedName` (0x03000213)."
kind = "negative"
case = "../../../cases/compile/state_escape/err_escape_field.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ClosureAssignsCapturedName"
expect_diagnostic_code = "0x03000213"
verify_script = """
({ input, assert }) => {
const text = ((input.output || '') + ' ' + (input.stderr || '')).replace(/\\s+/g, ' ')
assert(text.includes('is assigned inside a closure'), 'the report states the rule: ' + text)
assert(text.includes('return the new value'), 'the first way out is named: ' + text)
assert(text.includes('carried state'), 'the second way out is named: ' + text)
assert(text.includes('a `Ref`'), 'the third way out is named: ' + text)
}
"""

[[tests]]
name = "compile.state_escape.escape_array"
desc = "Route two, an element: `fill` stores the closure into `out[0]`, an element of the caller's array, which outlives the call, and the closure assigns `acc`. Same reading as the field: the store is legal, the write is `ClosureAssignsCapturedName` (0x03000213)."
kind = "negative"
case = "../../../cases/compile/state_escape/err_escape_array.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ClosureAssignsCapturedName"
expect_diagnostic_code = "0x03000213"
verify_script = """
