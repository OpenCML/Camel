id = "compile.lambda_inference"
order = 327
tier = "fast"
tags = ["feat", "compile", "lambda", "function_types", "inference"]

# A lambda's parameter types come from the function type of the position it stands in (design
# principles 5.9, item 2). The positions are those of the reference: an argument to
# a parameter of function type (normal and `with`), a binding declared with a function type (and
# an assignment back into it), and the result of a function whose result type is a function type.
# A parameter the expected type does not determine is an error at that parameter, naming it.
#
# Two things this plan pins down beyond the positions: a lambda that writes its types still picks
# the overload it picked before (the overload_typed case prints the same on 950b690f5, the base of
# this branch), and a lambda that writes none, given to a name with two overloads, is an error
# rather than a pick. The generic higher-order case (`map`, `reduce`) is settled: the ordinary
# arguments are typed first, so the operator's type variable is known when the with-arguments are
# lowered, and a lambda or a literal there takes the parameter's type (design principles 5.9).

[[tests]]
name = "lambda_inference.positions"
desc = "The three positions and the assignment: an argument, a `with` argument, a declared binding, an assignment to it, and a returned result; a lambda that writes no return type takes it from the expected type (1 as an f64 prints 1.0)."
kind = "behavior"
case = "../../../cases/compile/lambda_inference/positions.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout = "arg 4 6\nwith 42\nmixed 15\nlet 42 101\nexit 1.0\nreturn 42 42 42\n"
expect_output_not_contains = ["Warning", "[Error]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "lambda_inference.no_expected"
desc = "A lambda bound with no declared type: nothing expects a function type there, so the parameter is reported at the parameter (SyntaxDiag::UnexpectedToken at the `=>` before this change)."
kind = "negative"
case = "../../../cases/compile/lambda_inference/no_expected.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::LambdaParameterWithoutType"
expect_diagnostic_code = "0x0300017E"
expect_diagnostic_line = 8
expect_diagnostic_column = 14
expect_output_contains = ["The type of the parameter 'x' of this lambda is not written and cannot be inferred: nothing here expects a function type."]
expect_output_not_contains = ["never printed", "UnknownInternalError", "Warning"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

