# The array types of a tensor, after the transitional name went (docs/design/arrays-memory/plan.cn.md
# section 5): a tensor's type is the array spelling that states its element type, the shape a `var`
# widens to keeps its rank, a bare numeric array enters a shaped position through the checked
# conversion, and the printed text of a type is the array's.
#
# `alias.bare_tensor` (below) and the signature in test/cases/loops/iterate_tensor.cml were the two
# places that locked the *transitional* spelling. The deletion step removed the name and the
# diagnostic that asked for an element type, so a signature that writes the old name now writes an
# unknown name, and the spellings that state an element type are the array types (`f32[..]`,
# `f32[2, 3]`) or a type variable declared in the head (`func f::<T>(x: T[..])`).
id = "compile.array_alias"
order = 343
tier = "fast"
tags = ["feat", "compile", "types", "array", "tensor", "alias"]
desc = "A tensor's type is the native array type (docs/design/arrays-memory/plan.cn.md section 5): the array spelling states the element type and the shape, the shape a `var` widens to keeps its rank, a bare numeric array enters a shaped position through the checked conversion, the printed text of a type is the array's, and the removed `Tensor` name is an unknown name where it is written."

[[tests]]
name = "alias.bare_tensor"
desc = "A tensor type states its element type and the name that did not is gone: a signature that writes `Tensor` writes an unknown name, and the report says so where it is written. The spellings that state an element type are the array types (`f32[..]`, `f32[2, 3]`), and a signature taking any element type declares a type variable in its head (`func f::<T>(x: T[..])`). The positive spelling of that rewrite is test/cases/loops/iterate_tensor.cml."
kind = "negative"
case = "../../../cases/compile/array_alias/bare_tensor.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::UnresolvedTypeReference"
expect_output_contains = ["Unresolved type reference: 'Tensor'"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "alias.type_text"
desc = "The printed form of a type is its array spelling: `f32[..]` and `f32[2, 3]`. The candidate list of a refused call names both in one line."
kind = "negative"
case = "../../../cases/compile/array_alias/type_text.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::NoMatchingFunction"
expect_output_contains = ["takes: (a: f32[..], b: f32[2, 3]) => int"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "alias.as_shape_check"
desc = "A bare numeric array enters a shaped position through `as`; the shape is checked when the conversion runs and the value's shape is the one declared."
kind = "behavior"
case = "../../../cases/compile/array_alias/as_shape_check.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["2"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "alias.err_as_shape"
desc = "The checked conversion refuses a value whose shape is not the one the type names, and the message gives the shape the value has. It is a runtime refusal, not a dynamic cast refused at compile time."
kind = "negative"
case = "../../../cases/compile/array_alias/err_as_shape.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 1
expect_stdout_contains = ["conversion to 'f32[3, 2]' failed: the array has shape [2, 3]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "alias.var_widening"
desc = "`var` widening keeps the rank (plan Q5): a rank-2 tensor binding widens to `f32[?, ?]`, so it still fills a rank-2 parameter after a second assignment. A binding that widened to an any-rank type would fill no rank-2 parameter."
kind = "behavior"
case = "../../../cases/compile/array_alias/var_widening.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["4"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "alias.err_var_rank"
desc = "The other half of Q5: the widening keeps the rank, so a rank-1 value does not enter the rank-2 binding a `var` established."
kind = "negative"
case = "../../../cases/compile/array_alias/err_var_rank.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::NoMatchingFunction"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000
