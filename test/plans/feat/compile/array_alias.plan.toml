# P4's acceptance suite: P4 (`Tensor` as an array alias) has not landed, so every test below
# carries `known_fail` and the run reports XFAIL for each of them -- the fast layer walks the file
# like any other plan under test/plans/, and a test that starts passing fails the run the moment
# P4 lands, which is how the marks come off.
id = "compile.array_alias"
order = 343
tier = "fast"
tags = ["feat", "compile", "types", "array", "tensor", "alias"]
desc = "`Tensor` is an alias of the native array type (docs/design/arrays-memory/plan.cn.md section 5): `Tensor<f32, [2, 3]>` and `f32[2, 3]` are one type, a bare `Tensor` is the numeric array whose element type is not fixed, the shape a `var` widens to keeps its rank, a bare numeric array enters a shaped position through the checked conversion, and the printed text of every spelling is the array's."

[[tests]]
name = "alias.eq_two_spellings"
desc = "The two spellings are one type: a value bound as `f32[2, 3]` fills a `Tensor<f32, [2, 3]>` parameter, a value bound as `Tensor<f32, [2, 3]>` fills an `f32[2, 3]` parameter, and a `Tensor<f32, [2, 3]>` value fills `f32[..]` (`Tensor<f32>`). Every argument states its extent where it is made, so the calls bind and check a real shape."
kind = "behavior"
case = "../../../cases/compile/array_alias/eq_two_spellings.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
known_fail = ["nvm"]
known_fail_note = "P4 (`Tensor` as an array alias, docs/design/arrays-memory/plan.cn.md section 5) has not landed: this locks the behaviour P4 must produce. Remove the mark in the P4 commit."
expect_exit = 0
verify_script = """
({ input, assert }) => {
const lines = input.normalized.stdout.trim().split(String.fromCharCode(10))
assert(lines.length === 3, `expected three lines, got ${lines.length}`)
assert(lines[0].trim() === '2', `from_tensor_type printed ${lines[0]}`)
assert(lines[1].trim() === '2', `from_array_type printed ${lines[1]}`)
assert(lines[2].trim() === '2', `any_rank printed ${lines[2]}`)
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "alias.bare_tensor"
desc = "A bare `Tensor` is the numeric array with no fixed element type: an `int[3]` and an `f32[2, 3]` both fill it, and `len` reads the first dimension. Under a second tensor type neither call has a candidate."
kind = "behavior"
case = "../../../cases/compile/array_alias/bare_tensor.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
known_fail = ["nvm"]
known_fail_note = "P4 (`Tensor` as an array alias, docs/design/arrays-memory/plan.cn.md section 5) has not landed: this locks the behaviour P4 must produce. Remove the mark in the P4 commit."
expect_exit = 0
verify_script = """
({ input, assert }) => {
const lines = input.normalized.stdout.trim().split(String.fromCharCode(10))
assert(lines.length === 2, `expected two lines, got ${lines.length}`)
assert(lines[0].trim() === '3', `count(ints) printed ${lines[0]}`)
assert(lines[1].trim() === '2', `count(floats) printed ${lines[1]}`)
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "alias.type_text"
desc = "The printed form of each spelling: `Tensor<f32>` is `f32[..]`, `Tensor<f32, [2, 3]>` is `f32[2, 3]`, and `Tensor<[3]>` keeps the `Tensor` word for an element nobody fixed. The candidate list of a refused call names all three in one line."
kind = "negative"
case = "../../../cases/compile/array_alias/type_text.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
known_fail = ["nvm"]
known_fail_note = "P4 (`Tensor` as an array alias, docs/design/arrays-memory/plan.cn.md section 5) has not landed: this locks the behaviour P4 must produce. Remove the mark in the P4 commit."
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::NoMatchingFunction"
expect_output_contains = ["takes: (a: f32[..], b: Tensor<[3]>, c: f32[2, 3]) => int"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

