id = "compile.generics"
order = 323
tier = "fast"
tags = ["feat", "compile", "generics", "types"]
desc = "Generic functions that declare their type parameters at their head (`func first::<T>(...)`, one subgraph per set of argument types) and type functions (`type Pair<T> = ...`), design principles 5.5 and 5.6."

[[tests]]
name = "explicit_type_arguments"
desc = "Explicit ::<T>, combination with value contexts, function values and result inference from declarations/parameters/returns."
kind = "behavior"
case = "../../../cases/compile/generic_explicit_types.cml"
args = ["${case}", "std::fvm"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const wanted = ['7', 'typed', '[5, 5, 5]', '9', '0', '0', '0', '0', '0', '(4, pair)']
assert(input.normalized.stdout.trim() === wanted.join(String.fromCharCode(10)), 'explicit instantiation or contextual result inference changed')
}
"""
timeout_ms = 10000

