# DESIGN-QUESTION(generic-export): the template is exported by the module that declares it and
# each importing module builds the instances it calls.

[[tests]]
name = "generic_exported"
desc = "Generic functions exported by a module written in Camel: called from another module by name, by qualified name and from a namespace; their bodies use private functions, a private generic function and an import of their own module; two modules each instantiate the same types. The four back ends and the optimizing pipelines agree."
kind = "behavior"
case = "../../../cases/compile/generics/export_use.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl", "inline_jit"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = ["101", "[3, 2, 1]", "[b, a]", "[5, 4]", "101", "2.0", "[false, true]", "(3, 3)"].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

[[tests]]
name = "generic_exported_opt"
desc = "The same program through std::opt and std::macro std::opt."
kind = "behavior"
case = "../../../cases/compile/generics/export_use.cml"
args = ["${case}", "std::macro", "std::opt", "std::fvm"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = ["101", "[3, 2, 1]", "[b, a]", "[5, 4]", "101", "2.0", "[false, true]", "(3, 3)"].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

[[tests]]
name = "generic_exported_instances"
desc = "One instance per set of types in the whole program (design principles 2.11): rev<int> is one graph, though two modules call it, named with the module that declares it (2.12)."
kind = "behavior"
case = "../../../cases/compile/generics/export_use.cml"
args = ["${case}", "std::rgir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const count = (s) => out.split(`label="${s}";`).length - 1
assert(count('export_lib::rev<int>') === 1, `rev<int> clusters: ${count('export_lib::rev<int>')}`)
assert(count('export_lib::rev<string>') === 1, `rev<string> clusters: ${count('export_lib::rev<string>')}`)
assert(count('export_lib::rev<bool>') === 1, `rev<bool> clusters: ${count('export_lib::rev<bool>')}`)
}
"""
timeout_ms = 8000

