[[tests]]
name = "instances_are_concrete"
desc = "The graph holds one subgraph per set of types (`first<int>` once for two calls) and every instance has a concrete signature; no template and no type variable reaches the graph."
kind = "behavior"
case = "../../../cases/compile/generics/basic.cml"
args = ["${case}", "std::rgir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const graphs = [...out.matchAll(/label="([^"]+)";\s*tooltip="([^"]+)";/g)].map((m) => `${m[1]} :: ${m[2]}`)
const want = [
  'first<int> :: (xs: int[]) => int',
  'first<string> :: (xs: string[]) => string',
  'first<float> :: (xs: float[]) => float',
  'pick<int> :: (c: bool, a: int, b: int) => int',
  'pick<string> :: (c: bool, a: string, b: string) => string',
  'pair_of<int, string> :: (a: int, b: string) => (int, string)',
  'swap<int, string> :: (p: (int, string)) => (string, int)',
  'swap<float, bool> :: (p: (float, bool)) => (bool, float)',
]
for (const graph of want) {
  assert(graphs.filter((g) => g === graph).length === 1, `expected exactly one graph '${graph}' in: ${graphs.join(' | ')}`)
}
assert(!/typeas|: T\b|=> T\b/.test(graphs.join(' ')), `a type variable reached a graph: ${graphs.join(' | ')}`)
assert(!graphs.some((g) => /^(first|pick|pair_of|swap) ::/.test(g)), 'a template was built as a graph')
}
"""
timeout_ms = 8000

