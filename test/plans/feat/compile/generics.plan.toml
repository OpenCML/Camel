id = "compile.generics"
order = 323
tier = "feat"
tags = ["feat", "compile", "generics", "types"]
desc = "Generic functions bound with `typeas` (one subgraph per set of argument types) and type functions (`type Pair<T> = ...`), design principles 2.9."

[[tests]]
name = "basic"
desc = "One and several type variables; a second call with the same types uses the instance of the first."
kind = "behavior"
case = "../../../cases/compile/generics/basic.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "1",
  "a",
  "1.5",
  "4",
  "1",
  "y",
  "(7, seven)",
  "(seven, 7)",
  "(true, 1.5)",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

