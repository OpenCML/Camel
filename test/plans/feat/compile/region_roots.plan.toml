id = "compile.region_roots"
order = 1012
tier = "fast"
tags = ["feat", "compile", "effects", "regions"]
desc = "The roots a region has (design principles 3.1): a write to a resource outside the program runs because the region it is written in runs."

# Design principles 3.1, "区域的根" (docs/design/effects/analysis.cn.md 3.4, `regionRoot`): a write to a
# resource outside the program is used by the region it is written in, so a running region runs it
# although nothing reads what it produces. The author's ruling of 2026-11-15 names this case first
# ("非同步函数里的打印不执行"): with `main` not written `sync`, its three prints printed nothing and
# reported one `SemanticDiag::EffectNotExecuted` per line.
#
# The rule is read from the resource a write names and never from the operator's name, so the second
# case writes `rng` through `seed` rather than the console. The two remaining cases are the boundary:
# the warning is not silenced -- it names what really does not run (a region whose owner runs
# nothing, and a read nothing needs).

[[tests]]
name = "region_roots.plain_body"
desc = "A body that is not a sync block holds three bare prints: a running region runs the writes it holds, so all three run in the order they are written and nothing is reported. The four back ends print the same bytes."
kind = "behavior"
case = "../../../cases/compile/region_roots/plain_body.cml"
args = ["-E", "short", "${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized", "diagnostics"]
expect_exit = 0
expect_stdout_exact = "alpha\nbeta\ngamma\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
assert(input.diagnostics.length === 0, `expected no diagnostic, got ${input.diagnostics.length}: ${input.normalized.stderr}`)
}
"""
timeout_ms = 20000

