[[tests]]
name = "region_roots.resource_write"
desc = "The rule is by resource, not by operator name: `seed` writes the generator `rng` and is a bare statement of a body that is not a sync block, and the key the body draws from it is the one the seed gave."
kind = "behavior"
case = "../../../cases/compile/region_roots/resource_write.cml"
args = ["-E", "short", "${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized", "diagnostics"]
expect_exit = 0
expect_stdout_exact = "keys agree\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
assert(input.diagnostics.length === 0, `expected no diagnostic, got ${input.diagnostics.length}: ${input.normalized.stderr}`)
}
"""
timeout_ms = 20000

[[tests]]
name = "region_roots.dead_loop"
desc = "The boundary of the rule: a write is a root of its region and a region runs because its owner runs, so the print in a loop whose value nobody takes does not run, and SemanticDiag::EffectNotExecuted still names the loop and the write."
kind = "negative"
case = "../../../cases/compile/region_roots/dead_loop.cml"
args = ["-E", "short", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
assert(out === '', `the loop body does not run, so nothing is printed, got: ${out}`)
assert(input.normalized.stderr.includes('The loop reaches outside the program and is never executed'), `the loop is what does not run, and the warning says so: ${input.normalized.stderr}`)
assert(input.diagnostics.length === 2, `the loop and the write in its body, got ${input.diagnostics.length}: ${input.normalized.stderr}`)
assert(input.diagnostics.every(d => d.name === 'SemanticDiag::EffectNotExecuted'), `expected only EffectNotExecuted, got ${input.diagnostics.map(d => d.name).join(', ')}`)
}
"""
timeout_ms = 20000

[[tests]]
name = "region_roots.read_only"
desc = "The boundary of the rule, and why the predicate is a write and not an effect: a read of an outside resource is a dependency like a read of a variable, so `get_env` with nobody needing its value does not run and is still reported."
kind = "negative"
case = "../../../cases/compile/region_roots/read_only.cml"
args = ["-E", "short", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
assert(out === '', `nothing needs the value, so nothing is printed, got: ${out}`)
assert(input.diagnostics.length === 1, `expected exactly one diagnostic, got ${input.diagnostics.length}: ${input.normalized.stderr}`)
assert(input.diagnostics[0].name === 'SemanticDiag::EffectNotExecuted', `expected EffectNotExecuted, got ${input.diagnostics[0].name}`)
}
"""
timeout_ms = 20000
