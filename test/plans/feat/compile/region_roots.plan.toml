name = "region_roots.plain_body.default"
desc = "A body that is not a sync block holds three bare prints: a running region runs the writes it holds, so all three run in the order they are written and nothing is reported. Pipeline: default (interpreter)."
kind = "behavior"
case = "../../../cases/compile/region_roots/plain_body.cml"
args = ["-E", "short", "${case}"]
expect_exit = 0
expect_stdout_exact = "alpha\nbeta\ngamma\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
assert(input.diagnostics.length === 0, `expected no diagnostic, got ${input.diagnostics.length}: ${input.normalized.stderr}`)
}
"""
