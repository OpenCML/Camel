[[tests]]
name = "graph.null_then"
desc = "`a ?? b` on the graph: one OPER reading the tag, one BRCH/JOIN pair with two arms (regions of the graph, each feeding the JOIN; an arm that only gives a value computed outside the branch has no node), and the OPER that takes the value out inside an arm. No node kind of its own."
kind = "behavior"
case = "../../../cases/compile/tagged/graph_null_then.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const lines = out.split('\n')
const count = (text) => out.split(text).length - 1
const idOf = (text) => {
  const line = lines.find((l) => l.includes('[label="' + text + '"'))
  assert(line, 'a node ' + text)
  return line.trim().split(' ')[0]
}
assert(count('type="BRCH"') === 1, 'one BRCH')
assert(count('type="JOIN"') === 1, 'one JOIN')
assert(count('label=":op/tag_is_null"') === 1, 'one tag read')
assert(count('label=":op/tag_null_value"') === 1, 'one value read')
const brch = idOf('BRCH'), join = idOf('JOIN'), tag = idOf(':op/tag_is_null')
assert(out.includes(tag + ' -> ' + brch + ' [label="0|0", type="NORM"]'), 'the tag is the condition')
const edges = lines.filter((l) => l.includes(' -> ') && /type="(CTRL|NORM)"/.test(l)).map((l) => l.trim().split(' ').filter((_, i) => i == 0 || i == 2))
const after = (node, seen = new Set()) => {
  if (seen.has(node)) return false
  seen.add(node)
  return edges.some(([from, to]) => to === node && (from === brch || after(from, seen)))
}
const arms = lines.filter((l) => l.includes(' -> ' + join + ' ') && l.includes('type="WITH"')).map((l) => l.trim().split(' ')[0])
assert(arms.length === 2, 'BRCH enters two arms')
// The arm that takes the value out has code, ordered after the BRCH; the other gives `b`, which
// is computed outside the branch, and has no node of its own.
assert(arms.filter((node) => after(node)).length === 1, 'one arm has code, after the BRCH')
// The value is taken out inside an arm: it runs after the BRCH.
assert(after(idOf(':op/tag_null_value')), 'the value read is inside an arm')
}
"""
timeout_ms = 8000

