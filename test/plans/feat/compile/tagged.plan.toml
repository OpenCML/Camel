[[tests]]
name = "graph.throw_and_pass"
desc = "`return e` in a function declared `T!` is the exit of its graph (OPER, CAST, EXIT, no branch); `x -> f` is one BRCH/JOIN."
kind = "behavior"
case = "../../../cases/compile/tagged/graph_throw_pass.cml"
args = ["${case}", "std::gir", "std::nop"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const lines = out.split('\n')
const count = (text) => out.split(text).length - 1
const idOf = (text) => {
  const line = lines.find((l) => l.includes('[label="' + text + '"'))
  assert(line, 'a node ' + text)
  return line.trim().split(' ')[0]
}
assert(count('type="BRCH"') === 1 && count('type="JOIN"') === 1, 'one branch: the one of ->')
assert(count('label=":op/tag_throw"') === 1, 'one throw')
assert(count('label=":op/tag_is_error"') === 1, 'one tag read')
assert(count('label=":op/tag_error_value"') === 1, 'one value read')
const thrown = idOf(':op/tag_throw')
const next = lines.find((l) => l.trim().startsWith(thrown + ' -> '))
assert(next, 'the thrown value is used')
const cast = next.trim().split(' ')[2]
// The step that makes the thrown value the exit is the entering the compiler inserts -- `:op/enter`,
// not `:op/cast`: entering is not a conversion (design principles 5.1). The graph is the same graph:
// the throw's value is the operand of the entering, which is the exit.
assert(lines.some((l) => l.trim().startsWith(cast + ' [label=":op/enter"')), 'throw feeds the entering')
assert(lines.some((l) => l.trim().startsWith(cast + ' -> O') && l.includes('type="EXIT"')), 'the conversion is the exit of the graph')
assert(out.includes('label="graph_throw_pass.cml:10:12"'), 'the position of error(...) is a constant argument')
}
"""
timeout_ms = 8000

