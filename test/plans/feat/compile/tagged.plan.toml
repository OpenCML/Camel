expect_exit = 0
expect_stdout_starts_with = "ab\ntrue\nfalse\nfalse\ntrue\ntrue\n1\n1\n1\n7\n4\n5\ntrue\n-1.5\n"
expect_output_not_contains = ["[Error]", "UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]

[[tests]]
name = "optional_operand_not_bool"
desc = "A `bool?` is still not a `bool` in an operand of `||`: the operand position is a `bool` whatever the surrounding position wants, so the value has to be opened with `??` (design principles 4.2)."
kind = "negative"
case = "../../../cases/compile/tagged/err_optional_operand.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::LogicalOperandNotBool"
expect_diagnostic_line = 8
expect_diagnostic_column = 13
expect_output_contains = ["The left side of '||' has type 'bool?', not 'bool'."]
expect_output_not_contains = ["never printed", "UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]

[[tests]]
name = "nullable_positions"
desc = "`null` is a compile-time constant of the nullable type it stands in (design principles 4.4, 5.1): a `let` whose declared type is a `T?` gives the literal that type, a `return` under a declared `T?` does the same, and the default of a `with` parameter of a nullable type takes this constant. The graph of the declaration is what says the value is a constant of the type: the node of the default is a DATA node labelled `null` of type `int?`, not a CAST of a `void` one."
kind = "behavior"
case = "../../../cases/compile/tagged/nullable_positions.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "null\nnull\n1\nnull\n4\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 12000

[[tests]]
name = "nullable_positions.default_is_a_null_constant"
desc = "The same case under `std::gir`: the default of the `with` parameter `p` is one static DATA node whose label is `null` and whose `value_type` is `int?` (the constant of the position's type), so a position that requires a compile-time constant reads a value of the type rather than a CAST of one."
kind = "behavior"
case = "../../../cases/compile/tagged/nullable_positions.cml"
args = ["${case}", "std::gir", "std::nop"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const lines = out.split('\n')
const nulls = lines.filter((l) => l.includes('label="null"') && l.includes('type="DATA"'))
const typed = nulls.filter((l) => l.includes('value_type="int?"'))
assert(typed.length === 1, 'one null constant of the position\'s type, got ' + typed.length + ': ' + nulls.join(' | '))
assert(typed[0].includes('span="19:16-19:20"'), "the constant stands where the default is written: " + typed[0])
const id = typed[0].trim().split(' ')[0]
assert(out.split(id + ' ->').length - 1 === 2, 'both calls that leave the parameter out read that one node')
}
"""
timeout_ms = 12000

# ---- the checked unwrap (`__unwrap__`, `:op/tag_unwrap`) ----
#
# The one operator of the tagged forms that reads the tag itself. It is placed where the compiler
# has already read the tag, so a null is the compiler's own defect and is reported as one
# (`RuntimeDiag::NullSlotUnwrapped`, an internal error that `attempt` cannot isolate) instead of
# being handed on as the zero slot of the payload type (the rule;
# internal/reviews/2026-11-18-unwrapping-a-nullable-state-slot.cn.md).

[[tests]]
name = "unwrap.null_is_an_internal_error"
desc = "`__unwrap__(null)` refuses with `RuntimeDiag::NullSlotUnwrapped`: an internal error of the compiler, reported where the call stands, and never the zero slot of the payload type."
kind = "behavior"
case = "../../../cases/compile/tagged/unwrap_null.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::NullSlotUnwrapped"
expect_diagnostic_code = "0x040001B2"
expect_diagnostic_line = 9
expect_output_contains = ["The slot unwrapped here is null, and its type is 'int?': an internal error of the compiler"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "unwrap.value_passes_through"
desc = "`__unwrap__` on a non-null `T?` gives the payload unchanged: the operator is silent on the case every caller is supposed to be in."
kind = "behavior"
case = "../../../cases/compile/tagged/unwrap_value.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "41\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "unwrap.null_is_not_isolated"
desc = "`attempt` does not turn the refusal into an error value: a defect of the compiler is not a fault of the program, so the run stops with the diagnostic instead of printing the `!!` fallback (-12345)."
kind = "behavior"
case = "../../../cases/compile/tagged/unwrap_null_attempt.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::NullSlotUnwrapped"
expect_output_not_contains = ["-12345"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

# ---- Entering is not a conversion (design principles 5.1) ----
# The step the compiler inserts to make two types meet is `:op/enter`, it always succeeds, and a
# conversion the program writes is still `:op/cast`. The four tests below pin the three halves of
# that ruling: the graph says which operator each step is (twice, once per side), the entry that
# used to end in a conversion fault now runs to its end, and the one step that would have had to
# fail is a compile-time type error naming both types.

[[tests]]
name = "entering.never_fails"
desc = "A step the compiler inserts -- an error value taking the declared `int?!` of its position, a literal taking the position's type -- runs to the end of the entry: the failed form of a position is entered, not converted, so nothing it was given can be refused at run time."
kind = "behavior"
case = "../../../cases/compile/tagged/entering_operator.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = ["error KeyError", "5"].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 12000

[[tests]]
name = "entering.graph_names_the_compiler_step"
desc = "`std::gir` names the compiler's step `:op/enter` and nothing in this program is a conversion the program wrote: the URIs are `:op/enter` only."
kind = "behavior"
case = "../../../cases/compile/tagged/entering_operator.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines"]
verify_script = """
({ input, assert }) => {
const gir = input.normalized.stdout
assert(gir.includes(':op/enter'), 'the graph holds no :op/enter node')
assert(!gir.includes(':op/cast'), 'the graph holds a :op/cast node a step the compiler wrote did not make')
}
"""
timeout_ms = 12000

[[tests]]
name = "cast.graph_names_the_written_step"
desc = "`std::gir` names a conversion the program wrote `:op/cast`: the two steps are different operators, and a reader of the graph can tell which it is looking at."
kind = "behavior"
case = "../../../cases/compile/tagged/user_cast_is_a_conversion.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines"]
verify_script = """
({ input, assert }) => {
const gir = input.normalized.stdout
assert(gir.includes(':op/cast'), 'the graph holds no :op/cast node for the conversion the program wrote')
}
"""
timeout_ms = 12000

[[tests]]
name = "err.entering_that_would_fail_is_a_type_error"
desc = "`enter::<int, float>` is a pair that needs a conversion which may fail, and a step the compiler inserts cannot fail: the call is a type error that names both types (0x00021A), and no node is built."
kind = "negative"
case = "../../../cases/compile/tagged/err_enter_needs_cast.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ConversionNeededWhereTheCompilerWouldInsertOne"
expect_diagnostic_code = "0x0300021A"
expect_output_contains = ["'int'", "'float'"]
expect_output_not_contains = ["UnknownInternalError", "Invalid argument of 'cast'"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000
