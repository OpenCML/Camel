id = "compile.tagged"
order = 324
tier = "fast"
tags = ["feat", "compile", "nullable", "fallible", "types"]
desc = "The tagged forms `T?` and `T!`, the operators `??`, `!!`, `?->`, the fixed `match` patterns and `throw` (design principles 3.9; docs/technical/29_nullable_and_fallible_values.md)."

[[tests]]
name = "nullable"
desc = "`T?`: `null`, `v as T?`, an annotated `let`, `return` under a declared `T?`, `??` (its right side evaluated only when taken), `match` with `case null` in either order, printing."
kind = "behavior"
case = "../../../cases/compile/tagged/nullable.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "5",
  "null",
  "5",
  "0",
  "some 5",
  "none",
  "7",
  "1",
  "9",
  "1.5",
  "true",
  "false",
  "5",
  "fallback evaluated",
  "-1",
  "[5, null, 7]",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 12000

[[tests]]
name = "fallible"
desc = "`T!`: `throw error(kind, message)` with the position of the call, `return` under a declared `T!`, `!!`, `?->` (one step and chained, with a callee that returns `U` or `U!`), `match` with `case error e`, rethrowing a caught error."
kind = "behavior"
case = "../../../cases/compile/tagged/fallible.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "5",
  "error DivByZero: the divisor is zero",
  "5",
  "-1",
  "ok 5",
  "DivByZero: the divisor is zero at fallible.cml:10:15",
  "ok 10",
  "DivByZero: the divisor is zero at fallible.cml:10:15",
  "ok 4",
  "DivByZero: the divisor is zero at fallible.cml:10:15",
  "ok 6",
  "DivByZero: the divisor is zero at fallible.cml:10:15",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 12000

[[tests]]
name = "stdlib"
desc = "Library operators that can fail return a `T!`: parse_int, parse_float, fs::try_read_text."
kind = "behavior"
case = "../../../cases/compile/tagged/stdlib.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "42",
  "-7",
  "0",
  "ParseError: 'oops' is not an integer at <parse_int>",
  "ParseError: '99999999999999999999' is out of the range of an integer at <parse_int>",
  "2.5",
  "-1.0",
  "error IOError: cannot open 'tagged_no_such_file.txt'",
  "<no file>",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 12000

