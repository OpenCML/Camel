[[tests]]
name = "fstring_lambda_spec"
desc = "A typed lambda at the top level of an interpolation: the ':' of its return type is read as the start of the format specification, and the parse error says to put the lambda in parentheses."
kind = "negative"
case = "../../../cases/compile/fstring/lambda_spec.cml"
args = ["${case}"]
