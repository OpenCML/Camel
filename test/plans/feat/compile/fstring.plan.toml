expect_diagnostic_name = "SyntaxDiag::MissingToken"
expect_diagnostic_line = 3
expect_diagnostic_column = 24
expect_output_contains = ["needs its own parentheses at the top level of an interpolation"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "fstring_lambda_spec_format"
desc = "The same shape where the expression is complete and the specification is what fails: an invalid specification containing '=>' hints that a lambda needs parentheses."
kind = "negative"
