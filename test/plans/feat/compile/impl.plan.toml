id = "compile.impl"
order = 228
tier = "fast"
tags = ["feat", "compile", "tags", "native", "impl", "semantics"]
desc = "`#impl<f>` (design principles 10.4): a function's Camel body is its semantics and the body-less declaration f of the same module is the operator that runs it. An ordinary call is one OPER of the kernel, the body is not inlined and is absent from the ordinary dump; the body graph stays the semantic function for what asks to look inside (Program::implBodies / test::impl). The agreement case compiles the same function twice in one program, once as a direct call (the kernel) and once through its function value (the body), and checks that both print the same values while a profile counts the two paths apart; a deliberately wrong kernel shows that the comparison can fail. The pass groups take the same two paths through one production pass at a time, over real kernels of the standard library (`tensor:sum`, `tensor:mean`, `:op/mul_d`): the optimizer, `rules::fusion`, the autodiff macro and the ONNX exporter each see the kernel operator at the call site and the body only behind a function value, and each case compares the two paths and pins what the pass did to the graph. Six refusals, one case each: the tag on a body-less declaration, a kernel no declaration brings, a kernel of another module, a kernel whose signature differs, a kernel that has a body, and a generic function, whose instances carry no single signature. Each refusal names the misuse and is pinned to its source line and column."

[defaults]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

# ---- The ordinary pipeline: one call of the kernel, no body ----

[[tests]]
name = "impl.ordinary_call"
desc = "`std::gir` shows exactly one OPER of the kernel's URI (`:op/add_l`) for the call of the `#impl` function, and none of the body's nodes (`:op/sub_l`, `:op/neg_l`): the ordinary pipeline treats the function as the kernel, not as a body to inline."
kind = "behavior"
case = "../../../cases/compile/native/impl_ordinary.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const kernel = out.match(/label=":op\/add_l"/g) || []
assert(kernel.length === 1, `expected one :op/add_l OPER, got ${kernel.length}:\n${out}`)
assert(!out.includes(':op/sub_l'), `the body is in the ordinary dump:\n${out}`)
assert(!out.includes(':op/neg_l'), `the body is in the ordinary dump:\n${out}`)
// The caller's graph: everything the dump prints under `label="main"`, to the end of that
// cluster.
const start = out.indexOf('label="main"')
assert(start >= 0, `no main graph in the dump:\n${out}`)
const tail = out.slice(start)
const close = tail.indexOf('\n    }\n')
const main = close >= 0 ? tail.slice(0, close) : tail
assert(!main.includes('type="FUNC"'), `the caller still calls the body as a function:\n${main}`)
assert(!main.includes('type="CALL"'), `the caller still calls the body as a function:\n${main}`)
}
"""

[[tests]]
name = "impl.ordinary_run"
desc = "The same program runs through the kernel operand in the four back ends: `add(19, 23)` is 42 and the body is never needed."
kind = "behavior"
case = "../../../cases/compile/native/impl_ordinary.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "impl_ordinary add=42\n"

# ---- Expansion: the body is the graph the tag-less function has ----

[[tests]]
name = "impl.expansion"
desc = "`test::impl` reads the semantic bodies through Program::implBodies (kGraphFlagImplBody). The body of `add_via_kernel` expands to the same graph, node for node, as `add_via_body`, which is the same Camel body written without the tag: the tag changes call resolution only."
kind = "behavior"
case = "../../../cases/compile/native/impl_differential.cml"
args = ["${case}", "test::impl"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const lines = input.normalized.stdout.split('\n')
assert(lines.some(l => l === 'IMPL bodies 1'), `expected one impl body:\n${input.normalized.stdout}`)
const graphLine = name => lines.find(l => l.startsWith('IMPL graph ' + name + ' '))
const impl = graphLine('add_via_kernel')
const plain = graphLine('add_via_body')
assert(impl && impl.includes('body=yes'), `the body is not marked impl: ${impl}`)
assert(plain && plain.includes('body=no'), `the tag-less twin is marked impl: ${plain}`)
const nodes = name => lines
  .filter(l => l.startsWith('IMPL node ' + name + ' '))
  .map(l => l.slice(('IMPL node ' + name + ' ').length))
const expanded = nodes('add_via_kernel')
const written = nodes('add_via_body')
assert(expanded.length > 3, `the body has no nodes: ${expanded.length}`)
assert(expanded.length === written.length, `node count differs: ${expanded.length} vs ${written.length}`)
for (let i = 0; i < expanded.length; ++i) {
  assert(expanded[i] === written[i], `node ${i} differs:\n${expanded[i]}\n${written[i]}`)
}
}
"""

# ---- The twin differential: the same body written twice, one tagged ----

[[tests]]
name = "impl.differential"
desc = "The kernel path (`add_via_kernel`, one OPER of :op/add_l) and the body path (`add_via_body`, a CALL of the Camel body) compute the same values; the tolerance is zero and every printed difference is 0."
kind = "behavior"
case = "../../../cases/compile/native/impl_differential.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "kernel=42,2,0,1 body=42,2,0,1 diff=0,0,0,0\n"

# ---- The passes that can meet a tagged function: the same two paths, one pass at a time ----
#
# `impl_pass_agreement.cml` is the plain-call agreement over real kernels of the standard library
# (`tensor:sum`, `tensor:mean`, `:op/mul_d`), and the groups below take the same two paths through
# one production pass at a time. `impl_pass_disagreement.cml` is the wrong-kernel observation for
# all of them: it names `:op/sub_l` where the body says `a + b`, and `math:sqrt` where the body
# says `x * x`, so a `diff` of zero in an agreement case cannot come from a pair that never ran.

[[tests]]
name = "impl.pass.agreement"
desc = "The agreement of both paths over real kernels: `total` (kernel `tensor:sum`, body a reshape), `average` (kernel `tensor:mean`, body `mean`) and `scale` (kernel `:op/mul_d`, body `:op/mul_d`/`:op/div_d`) take the same inputs through the direct call and through the function value and print the same value, with the magnitudes showing each side is its own path's result. Runs on every back end."
kind = "behavior"
case = "../../../cases/compile/native/impl_pass_agreement.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const pair = (name, kernel, body) => {
    const m = out.match(new RegExp('^' + name + ' kernel=(-?[0-9.eE+]+) body=(-?[0-9.eE+]+) diff=(-?[0-9.eE+-]+)$', 'm'))
    assert(m, `no ${name} line:\\n${out}`)
    const k = Number(m[1]), b = Number(m[2]), d = Number(m[3])
    assert(Math.abs(k - kernel) < 1e-5, `${name} kernel path printed ${k}, expected ${kernel}:\\n${out}`)
    assert(Math.abs(b - body) < 1e-5, `${name} body path printed ${b}, expected ${body}:\\n${out}`)
    assert(d === 0, `${name} paths disagree by ${d}:\\n${out}`)
}
pair('total', 10.0, 10.0)
pair('average', 2.5, 2.5)
pair('scale', 6.0, 6.0)
}
"""

[[tests]]
name = "impl.pass.agreement.paths"
desc = "The paths of the agreement case are counted apart: the three direct calls are one kernel OPER each (`tensor:sum`, `tensor:mean`, `:op/mul_d`), the three calls through function values run the body operators instead (`tensor:sum`'s body is a reshape, `tensor:mean`'s is `mean`, and `:op/mul_d`'s is a multiply and a divide), so the equal values are not one path compared with itself."
kind = "behavior"
case = "../../../cases/compile/native/impl_pass_agreement.cml"
args = ["${case}", 'std::profile top=0 json="${test_tmp}/profile.json"', "std::nvm"]
expect_exit = 0
verify_script = """
async ({ input, assert }) => {
    const fs = await import('node:fs')
    const out = input.normalized.stdout
    const m = out.match(/^total kernel=(-?[0-9.eE+-]+) body=(-?[0-9.eE+-]+)/m)
    assert(m && Math.abs(Number(m[1]) - 10.0) < 1e-5, `the sum kernel path changed:\\n${out}`)
    const report = JSON.parse(fs.readFileSync(input.test_tmp + '/profile.json', 'utf8'))
    const calls = Object.fromEntries(report.operator_rows.map(row => [row.uri, row.calls]))
    assert(calls['tensor:sum'] === 1, `the sum kernel ran ${calls['tensor:sum']} times, not once:\\n${out}`)
    assert(calls['tensor:mean'] === 1, `the mean kernel ran ${calls['tensor:mean']} times, not once:\\n${out}`)
    assert((calls[':op/mul_d'] ?? 0) === 2, `:op/mul_d ran ${calls[':op/mul_d']} times, not twice (kernel and body):\\n${out}`)
    assert((calls[':op/div_d'] ?? 0) === 1, `the body's division ran ${calls[':op/div_d']} times, not once:\\n${out}`)
}
"""
timeout_ms = 60000

[[tests]]
name = "impl.pass.agreement.gir"
desc = "The graphs of the two paths in one program: the direct calls are one OPER each of the kernels' URIs (`tensor:sum`, `tensor:mean`, `:op/mul_d`), the bodies of `total` and `scale` sit behind the function values their names were bound to, and `average`'s body is the same `tensor:mean` operator — so the dump shows which path each value came from."
kind = "behavior"
case = "../../../cases/compile/native/impl_pass_agreement.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const count = s => out.split(s).length - 1
assert(count('label="tensor:sum", type="OPER"') === 1, `expected the kernel's one sum OPER:\\n${out}`)
assert(count('label="tensor:mean", type="OPER"') === 2, `expected the mean OPER and the body's mean call:\\n${out}`)
assert(count('label=":op/mul_d", type="OPER"') >= 1, `expected the kernel multiply:\\n${out}`)
assert(count('label=":op/div_d", type="OPER"') === 1, `expected the body's divide, which the kernel has not:\\n${out}`)
assert(out.includes('label="total"'), `the body graph of total is not in the dump:\\n${out}`)
assert(out.includes('label="scale"'), `the body graph of scale is not in the dump:\\n${out}`)
}
"""

[[tests]]
name = "impl.pass.disagreement"
desc = "The wrong-kernel observation of the whole pass set: `wrong` says `a + b` and names `:op/sub_l` (direct call 3, body 42, diff -39), and `mix` says `a * b` and names `:op/div_d`, whose registered rule gives the reverse pass 0.5 where the body's `a * b` gives 2.0. The same comparison that prints 0 for the real kernels prints non-zero here, so the agreement cases are falsifiable."
kind = "behavior"
case = "../../../cases/compile/native/impl_pass_disagreement.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const m = out.match(/^wrong kernel=(-?[0-9]+) body=(-?[0-9]+) diff=(-?[0-9]+)$/m)
assert(m, `no wrong line:\\n${out}`)
assert(Number(m[1]) === 3 && Number(m[2]) === 42 && Number(m[3]) === -39, `wrong kernel changed: ${m[0]}`)
const g = out.match(/^grad kernel=(-?[0-9.eE+-]+) body=(-?[0-9.eE+-]+) diff=(-?[0-9.eE+-]+)$/m)
assert(g, `no grad line:\\n${out}`)
assert(Math.abs(Number(g[1]) - 0.5) < 1e-9, `the div kernel's gradient is not 1/b: ${g[0]}`)
assert(Math.abs(Number(g[2]) - 2.0) < 1e-9, `the body's gradient is not a: ${g[0]}`)
assert(Math.abs(Number(g[3]) + 1.5) < 1e-9, `the two gradients agree, so the reverse pass did not take the kernel: ${g[0]}`)
}
"""

# ---- The optimizer: a direct call is not a call to inline ----

[[tests]]
name = "impl.pass.optimizer.run"
desc = "`std::opt` (inline, devirtualize, specialize, fold, algebra, cse, dce, ctrl) over a program with both paths of `plus`: the direct call is the kernel OPER, the call through the function value is the body. The optimizer may inline the body call and must leave the kernel operator alone; both values stay 42."
kind = "behavior"
case = "../../../cases/compile/native/impl_pass_optimizer.cml"
args = ["${case}", "std::opt", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "opt kernel=42 body=42 diff=0\n"

[[tests]]
name = "impl.pass.optimizer.gir"
desc = "The optimized graph: exactly one `:op/add_l` OPER, which is the direct call (the kernel), and the body's `:op/sub_l` nodes are in the graph of the function value, not inlined into `main` — the optimizer sees a call it may inline and an operator it may not look inside."
kind = "behavior"
case = "../../../cases/compile/native/impl_pass_optimizer.cml"
args = ["${case}", "std::opt", "std::gir"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const count = s => out.split(s).length - 1
assert(count('label=":op/add_l", type="OPER"') === 1, `the kernel call is not one OPER after the optimizer:\\n${out}`)
assert(count('label=":op/sub_l", type="OPER"') === 2, `the body's two operators are not in the graph:\\n${out}`)
assert(out.includes('label="plus";'), `the body graph of plus is not in the dump:\\n${out}`)
const start = out.indexOf('label="main"')
assert(start >= 0, `no main graph:\\n${out}`)
const tail = out.slice(start)
const close = tail.indexOf('\\n    }\\n')
const main = close >= 0 ? tail.slice(0, close) : tail
assert(main.includes('label=":op/add_l"'), `the kernel is not in main:\\n${main}`)
assert(!main.includes('label=":op/sub_l"'), `the body was inlined into main:\\n${main}`)
}
"""

# ---- Fusion: the fused operator is the kernel, the chain is the body ----

[[tests]]
name = "impl.pass.fusion.run"
desc = "`rules::fusion` in front of the scheduler over both paths of `chain` (kernel `tensor:sigmoid`, body `1/(1+exp(-x))`, the exact chain the library rewrites): the values are bit-identical to the unfused run on every back end, and the direct call keeps running the kernel."
kind = "behavior"
case = "../../../cases/compile/native/impl_pass_fusion.cml"
args = ["${case}", "rules::fusion", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const m = out.match(/^fusion kernel_sum=(-?[0-9.eE+-]+) body_sum=(-?[0-9.eE+-]+) diff=(-?[0-9.eE+-]+)$/m)
assert(m, `no fusion line:\\n${out}`)
assert(Number(m[3]) === 0, `the two paths differ after fusion: ${m[0]}`)
assert(Math.abs(Number(m[1]) - 1.1085993) < 1e-6, `the kernel path printed ${m[1]}, not the sigmoid sum: ${m[0]}`)
}
"""

[[tests]]
name = "impl.pass.fusion.gir"
desc = "The same program with the fusion rewrite in place: the direct call of `chain` is one OPER of `tensor:sigmoid` (the kernel), and the body reached through the function value has been rewritten into the same operator — its `tensor:exp` is gone. The pass read the body that a function value exposes; it has no path to the tagged function's own body, and needs none, because that body is already the fused form."
kind = "behavior"
case = "../../../cases/compile/native/impl_pass_fusion.cml"
args = ["${case}", "rules::fusion", "std::gir"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const count = s => out.split(s).length - 1
assert(count('label="tensor:sigmoid", type="OPER"') >= 2, `expected the kernel OPER and the rewritten body:\\n${out}`)
assert(count('label="tensor:exp", type="OPER"') === 0, `the body's exp survived the rewrite:\\n${out}`)
}
"""

[[tests]]
name = "impl.pass.fusion.unrewritten"
desc = "The same program with no fusion pass: the kernel path is still one OPER of `tensor:sigmoid`, and the body path is the chain the file is written as — `tensor:neg`, `tensor:exp`, the addition and the division are all in the dump. The two dumps together show that `rules::fusion` rewrote the body and left the kernel operator alone."
kind = "behavior"
case = "../../../cases/compile/native/impl_pass_fusion.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
assert(out.includes('label="tensor:exp", type="OPER"'), `the body chain is not in the unfused dump:\\n${out}`)
assert(out.includes('label="tensor:sigmoid", type="OPER"'), `the kernel OPER is not in the unfused dump:\\n${out}`)
}
"""

[[tests]]
name = "impl.pass.fusion.disagreement"
desc = "The wrong-kernel observation for fusion: the tag names `tensor:tanh` while the body is the sigmoid chain, so the direct call is one tanh OPER and the body path (with `rules::fusion` in front of it) computes a sigmoid. The two paths must disagree (about 0.81 on these inputs), which is what the agreement case's `diff=0` is measured against — and the body is still what the rule rewrites, not the kernel."
kind = "behavior"
case = "../../../cases/compile/native/impl_pass_fusion_wrong.cml"
args = ["${case}", "rules::fusion", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const m = out.match(/^fusion kernel_sum=(-?[0-9.eE+-]+) body_sum=(-?[0-9.eE+-]+) diff=(-?[0-9.eE+-]+)$/m)
assert(m, `no fusion line:\\n${out}`)
assert(Math.abs(Number(m[3])) > 0.1, `the wrong kernel was not observed: ${m[0]}`)
assert(Math.abs(Number(m[1]) - 0.2994770) < 1e-6, `the tanh kernel's sum is not tanh(1.0)+tanh(-0.5): ${m[0]}`)
assert(Math.abs(Number(m[2]) - 1.1085993) < 1e-6, `the body path is not the sigmoid sum: ${m[0]}`)
}
"""

# ---- Autodiff: the reverse pass reads the kernel operator ----

[[tests]]
name = "impl.pass.autodiff.kernel"
desc = "`std::macro` expands `grad` over both paths of one tagged function: the direct call of `curve` is one OPER of `:op/div_d`, so the kernel's own registered derivative rule runs (1/b = 0.5 at (4.0, 2.0)), while the same Camel body reached through the function value is `a * b` and its gradient is 2.0. The two gradients differ by 1.5: the reverse pass differentiates the operator the call site holds, not the semantic body. This is the sharpest form of the finding — 10.4 says differentiation expands the body on demand, and it does not; `modules/autodiff/pullback.cpp:3486` looks the operator's URI up in the derivative registry."
kind = "behavior"
case = "../../../cases/compile/native/impl_pass_autodiff.cml"
args = ["${case}", "std::macro", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const m = out.match(/^grad kernel=(-?[0-9.eE+-]+) body=(-?[0-9.eE+-]+) diff=(-?[0-9.eE+-]+)$/m)
assert(m, `no grad line:\\n${out}`)
assert(Math.abs(Number(m[1]) - 0.5) < 1e-9, `the kernel path's gradient is not 1/b: ${m[0]}`)
assert(Math.abs(Number(m[2]) - 2.0) < 1e-9, `the body path's gradient is not a at b = 2.0: ${m[0]}`)
assert(Math.abs(Number(m[3]) + 1.5) < 1e-9, `the two paths agree, so the reverse pass read the body: ${m[0]}`)
}
"""

# ---- The exporter: the kernel the model carries must be the kernel that ran ----

[[tests]]
name = "impl.pass.export.kernel"
desc = "An ONNX model of a tagged function whose kernel the backend can lower (`tensor:sum`): the direct call runs the kernel (the printed sum is 10.0), and the model must carry that kernel as `ReduceSum` — the exporter walks the graph the call site is in, where the call is one OPER of the kernel, and lowering it is what makes the model and the run the same function."
kind = "behavior"
case = "../../../cases/compile/native/impl_pass_export_kernel.cml"
args = ["${case}"]
envs = ["ONNX_OUT=${test_tmp}/impl_pass_export_kernel.onnx"]
expect_exit = 0
verify_script = """
async ({ input, assert }) => {
const path = await import('path')
const url = await import('url')
const helper = path.join(input.repo_root, 'test/cases/modules/onnx/onnx_ops.mjs')
const { readOnnxModel } = await import(url.pathToFileURL(helper).href)
const out = input.normalized.stdout
assert(out.includes('export kernel_sum=10'), `the kernel did not run: \\n${out}`)
assert(out.includes('exported'), `the export did not finish:\\n${out}`)
const model = readOnnxModel(path.join(input.test_tmp, 'impl_pass_export_kernel.onnx'))
const count = (op) => model.ops.filter((o) => o === op).length
assert(count('ReduceSum') === 1, `the kernel's lowering is not in the model: ${model.ops}`)
assert(!model.ops.includes('Add') && !model.ops.includes('Sub'), `a body operator was exported instead of the kernel: ${model.ops}`)
}
"""

[[tests]]
name = "impl.pass.export.refuse"
desc = "An ONNX export of a tagged function whose kernel has no lowering (`tensor:one_hot`) while its Camel body would lower: the exporter refuses at the kernel operator and says so, instead of dropping the call or exporting the body. The refusal is the finding — a model written from the body would compute something the run does not."
kind = "behavior"
case = "../../../cases/compile/native/impl_pass_export_refuse.cml"
args = ["${case}"]
envs = ["ONNX_OUT=${test_tmp}/impl_pass_export_refuse.onnx"]
expect_exit = 1
verify_script = """
({ input, assert }) => {
const out = input.normalized.output
assert(out.includes("operator 'tensor:one_hot' has no ONNX lowering"), `the refusal does not name the kernel operator:\\n${out}`)
assert(/impl_pass_export_refuse[.]cml:\\d+:\\d+/.test(out), `the refusal has no source position:\\n${out}`)
assert(!out.includes('unreachable'), `the export must fail before the next statement:\\n${out}`)
}
"""

# ---- The agreement case: the same function, direct (kernel) and by value (body) ----

[[tests]]
name = "impl.agreement"
desc = "The same function `add` in one program: the direct calls are OPERs of the kernel `:op/add_l`, the calls through the function value `by_body = add` are CALLs of the semantic body graph (`:op/sub_l` in `a - (0 - b)`). Both paths take the same four inputs and print the same values, on every back end."
kind = "behavior"
case = "../../../cases/compile/native/impl_agreement.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "kernel=42,2,0,1 body=42,2,0,1\n"

[[tests]]
name = "impl.agreement.paths"
desc = "In the run that printed equal values, `std::profile` counts four calls of the kernel's `:op/add_l` and eight calls of the body's `:op/sub_l`: both paths ran, and the equality is not the equality of one path with itself. A compiler that ran the body for both calls would count 0 and 16; one that ran the kernel for both would count 8 and 0."
kind = "behavior"
case = "../../../cases/compile/native/impl_agreement.cml"
args = ["${case}", 'std::profile top=0 json="${test_tmp}/profile.json"', "std::nvm"]
expect_exit = 0
verify_script = """
async ({ input, assert }) => {
    const fs = await import('node:fs')
    const out = input.normalized.stdout
    const line = out.split('\n')[0]
    assert(line === 'kernel=42,2,0,1 body=42,2,0,1', `the values changed:\n${out}`)
    assert(out.includes('cpu  :op/add_l') && out.includes('cpu  :op/sub_l'), `the profile names neither path:\n${out}`)
    const report = JSON.parse(fs.readFileSync(input.test_tmp + '/profile.json', 'utf8'))
    const calls = Object.fromEntries(report.operator_rows.map(row => [row.uri, row.calls]))
    assert(calls[':op/add_l'] === 4, `the kernel ran ${calls[':op/add_l']} times, not four:\n${out}`)
    assert(calls[':op/sub_l'] === 8, `the body ran ${calls[':op/sub_l']} sub operators, not eight:\n${out}`)
}
"""
timeout_ms = 60000

[[tests]]
name = "impl.agreement.gir"
desc = "`std::gir` shows the split of the same function: four `:op/add_l` OPERs from the direct calls, a `Function(graph=add)` value, four CALLs of it, and the body graph `add` with its two `:op/sub_l` nodes. There is no `FUNC` node: the kernel call is an operator and the body call is a call of the function value."
kind = "behavior"
case = "../../../cases/compile/native/impl_agreement.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
    const out = input.normalized.stdout
    const count = s => out.split(s).length - 1
    assert(count('label=":op/add_l", type="OPER"') === 4, `expected four kernel OPERs:\n${out}`)
    assert(count('label=":op/sub_l", type="OPER"') === 2, `expected the body's two OPERs:\n${out}`)
    assert(count('label="CALL", type="CALL"') === 5, `expected four body CALLs plus the entry CALL:\n${out}`)
    assert(out.includes('label="Function(graph=add, tupleSlots=0)", type="DATA"'), `no function value of add:\n${out}`)
    assert(out.includes('label="add";'), `the body graph is not in the dump:\n${out}`)
    assert(!out.includes('type="FUNC"'), `a call of add was compiled as a function call:\n${out}`)
}
"""

[[tests]]
name = "impl.agreement.expansion"
desc = "`test::impl` reads Program::implBodies: the semantic body of the same function is retained as one graph marked body=yes, with the body's five nodes (two `:op/sub_l`) and none of the kernel's `:op/add_l`. The body is the graph a consumer that asks to look inside gets."
kind = "behavior"
case = "../../../cases/compile/native/impl_agreement.cml"
args = ["${case}", "test::impl"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
    const lines = input.normalized.stdout.split('\n')
    assert(lines.some(l => l === 'IMPL bodies 1'), `expected one impl body:\n${input.normalized.stdout}`)
    const graph = lines.find(l => l.startsWith('IMPL graph add '))
    assert(graph && graph.includes('body=yes'), `the body of add is not marked impl: ${graph}`)
    const nodes = lines.filter(l => l.startsWith('IMPL node add '))
    assert(nodes.length === 5, `expected five body nodes, got ${nodes.length}`)
    assert(nodes.some(l => l.includes('OPER :op/sub_l')), `the body has no sub operator: ${nodes.join(' | ')}`)
    assert(!nodes.some(l => l.includes(':op/add_l')), `the kernel is inside the body: ${nodes.join(' | ')}`)
}
"""

# ---- Across modules: the body of an imported function is part of the program too ----

[[tests]]
name = "impl.cross_module.direct"
desc = "A function tagged in another module and only ever called directly from this one: the direct call compiles to the kernel, so nothing reachable from `main` names the body graph, yet the body is still the semantics of the function (design principles 10.4) and `test::impl` must list it through Program::implBodies, marked body=yes and holding the body's `:op/sub_l`, not the kernel. The check names the graph, so a count that includes another graph cannot pass it."
kind = "behavior"
case = "../../../cases/compile/native/impl_cross_module.cml"
args = ["${case}", "test::impl"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
    const lines = input.normalized.stdout.split('\n')
    assert(lines.some(l => l === 'IMPL bodies 1'), `expected one impl body:\n${input.normalized.stdout}`)
    const graph = lines.find(l => l.startsWith('IMPL graph impl_cross_module_lib::add '))
    assert(graph && graph.includes('body=yes'), `the body of the imported add is not marked impl: ${graph}`)
    const nodes = lines.filter(l => l.startsWith('IMPL node impl_cross_module_lib::add '))
    assert(nodes.length === 5, `expected five body nodes, got ${nodes.length}`)
    assert(nodes.some(l => l.includes('OPER :op/sub_l')), `the body has no sub operator: ${nodes.join(' | ')}`)
    assert(!nodes.some(l => l.includes(':op/add_l')), `the kernel is inside the body: ${nodes.join(' | ')}`)
}
"""

[[tests]]
name = "impl.cross_module.run"
desc = "The imported tagged function still runs the kernel on a direct call: `add(19, 23)` is 42 on every back end, and the disagreement case below proves the kernel, not the body, is what the direct call took."
kind = "behavior"
case = "../../../cases/compile/native/impl_cross_module.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "kernel=42\n"

[[tests]]
name = "impl.cross_module.paths"
desc = "The direct cross-module call runs the kernel once and the retained body zero times: `std::profile` counts one `:op/add_l` and no `:op/sub_l`. A fix that ran the body on the direct call, or ran it twice, would move these counts."
kind = "behavior"
case = "../../../cases/compile/native/impl_cross_module.cml"
args = ["${case}", 'std::profile top=0 json="${test_tmp}/profile.json"', "std::nvm"]
expect_exit = 0
verify_script = """
async ({ input, assert }) => {
    const fs = await import('node:fs')
    const out = input.normalized.stdout
    assert(out.split('\n')[0] === 'kernel=42', `the value changed:\n${out}`)
    const report = JSON.parse(fs.readFileSync(input.test_tmp + '/profile.json', 'utf8'))
    const calls = Object.fromEntries(report.operator_rows.map(row => [row.uri, row.calls]))
    assert(calls[':op/add_l'] === 1, `the kernel ran ${calls[':op/add_l']} times, not once:\n${out}`)
    assert((calls[':op/sub_l'] ?? 0) === 0, `the body ran ${calls[':op/sub_l']} times on a direct call:\n${out}`)
}
"""
timeout_ms = 60000

[[tests]]
name = "impl.cross_module.disagreement"
desc = "The cross-module kernel path and body path disagree: the imported function's direct call runs the wrong `:op/sub_l` kernel and prints -4, the call through the imported function value runs the body `a + b` and prints 42. The disagreement makes the agreement check below falsifiable rather than a tautology."
kind = "behavior"
case = "../../../cases/compile/native/impl_cross_module_disagreement.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "kernel=-4 body=42\n"
verify_script = """
({ input, assert }) => {
    const m = input.normalized.stdout.match(/^kernel=(-?[0-9]+) body=(-?[0-9]+)/)
    assert(m, `no values:\n${input.normalized.stdout}`)
    const kernel = Number(m[1])
    const body = Number(m[2])
    assert(kernel === -4 && body === 42, `expected -4 and 42, got ${kernel} and ${body}`)
    assert(kernel !== body, `the wrong kernel was not observed: both paths printed ${body}`)
}
"""

[[tests]]
name = "impl.cross_module.disagreement.paths"
desc = "The profile of the cross-module disagreement: one `:op/sub_l` is the imported kernel path and one `:op/add_l` is the body path reached through the function value. The two paths are counted apart, so the equality of values in an agreement case cannot be the equality of one path with itself."
kind = "behavior"
case = "../../../cases/compile/native/impl_cross_module_disagreement.cml"
args = ["${case}", 'std::profile top=0 json="${test_tmp}/profile.json"', "std::nvm"]
expect_exit = 0
verify_script = """
async ({ input, assert }) => {
    const fs = await import('node:fs')
    const out = input.normalized.stdout
    assert(out.split('\n')[0] === 'kernel=-4 body=42', `the values changed:\n${out}`)
    const report = JSON.parse(fs.readFileSync(input.test_tmp + '/profile.json', 'utf8'))
    const calls = Object.fromEntries(report.operator_rows.map(row => [row.uri, row.calls]))
    assert(calls[':op/sub_l'] === 1, `the wrong kernel ran ${calls[':op/sub_l']} times, not once:\n${out}`)
    assert(calls[':op/add_l'] === 1, `the body ran ${calls[':op/add_l']} times, not once:\n${out}`)
}
"""
timeout_ms = 60000

# ---- A wrong kernel: the comparison must be able to fail ----

[[tests]]
name = "impl.disagreement"
desc = "The same body `a + b` with the real `:op/sub_l` kernel as its implementation: the direct call prints -4, the body path prints 42. The agreement test above expects the two to be equal, so this case is the observation that makes that expectation a check rather than a tautology; this test pins the disagreement itself."
kind = "behavior"
case = "../../../cases/compile/native/impl_disagreement.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "kernel=-4 body=42\n"
verify_script = """
({ input, assert }) => {
    const m = input.normalized.stdout.match(/^kernel=(-?[0-9]+) body=(-?[0-9]+)/)
    assert(m, `no values:\n${input.normalized.stdout}`)
    const kernel = Number(m[1])
    const body = Number(m[2])
    assert(kernel === -4 && body === 42, `expected -4 and 42, got ${kernel} and ${body}`)
    assert(kernel !== body, `the wrong kernel was not observed: both paths printed ${body}`)
    assert(body - kernel === 46, `the disagreement changed: ${body} - ${kernel}`)
}
"""

[[tests]]
name = "impl.disagreement.paths"
desc = "The same profile check applied to the wrong kernel: one `:op/sub_l` call is the kernel path and one `:op/add_l` call is the body path. The paths are distinguishable even when their values are not equal, so the profile cannot be a count of the same operator twice."
