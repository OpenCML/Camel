# ---- The declaration site a standard library kernel would need ----

[[tests]]
name = "impl.kernel_site"
desc = "Where a kernel can be declared, and why the ruling's two items (Adam in `optim`, a composite tensor operation) have no site yet: `#op<'tensor:log_softmax'>` outside the tensor module is refused as another module's operator, not as an operator no module implements; `#op<'nn:adam'>` is refused the same way, and `#impl` on a generic function as such; and a copy of the tensor module's own `.cml` beside its `.cmo` may declare the kernel but not hold the definition's body."
kind = "behavior"
tool = "node"
case = "../../../cases/compile/native/impl_kernel_site.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["PASS"]
timeout_ms = 300000

