# ---- The one refusal the reverse pass adds: a kernel two bodies answer for ----

[[tests]]
name = "impl.grad.body_ambiguous_kernel"
desc = "Two `#impl` functions of one program naming one kernel: `t` is `a * b` and `u` is `a + b`, and a call of the tagged function is one OPER of `:op/div_d` with nothing at the call site saying which body it means. Nothing else in the language forbids the sharing, and a kernel implements one function (design principles 10.4), so autodiff refuses at the call rather than taking one body's derivative or the kernel's rule; the refusal names both functions so the mistake is repairable. The same two-body program without the tag differentiates both bodies without a word."
kind = "negative"
case = "../../../cases/compile/native/impl_grad_ambiguous_kernel.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::RuntimeError"
expect_diagnostic_line = 25
expect_output_contains = ["2 semantic bodies of this program implement that kernel ('t', 'u')"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
