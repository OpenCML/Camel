[[tests]]
name = "impl.disagreement.gir"
desc = "`std::gir` of the wrong kernel: the direct call is one `:op/sub_l` OPER, and the body of the same function is the one `:op/add_l` in the `add` graph behind the function value. The builder checked the signature and accepted this kernel; only the differential comparison can see the difference."
