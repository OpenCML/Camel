expect_diagnostic_column = 12
expect_output_contains = ["The match over 'Shape' has no case for 'Rect', and no 'case _'"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

