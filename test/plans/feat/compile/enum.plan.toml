expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::MacroEvaluationFailed"
expect_diagnostic_line = 25
expect_diagnostic_column = 13
expect_output_contains = ["a value that depends on a differentiated parameter is put into an enum 'Shape'", "Gradients do not flow through it"]
expect_output_not_contains = ["Segmentation fault", "dumped core", "UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 20000

[[tests]]
name = "refuse_onnx"
desc = "onnx::export refuses a model whose input is an enum: a model input is a tensor, a number, or a struct or tuple of those."
kind = "negative"
case = "../../../cases/compile/enum/refuse_onnx.cml"
args = ["-E", "short", "${case}", "onnx::export out=\"${test_tmp}/enum_never_written.onnx\""]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::TranslationRefused"
expect_diagnostic_line = 15
expect_diagnostic_column = 1
expect_output_contains = ["Translation pass 'onnx::export_model' refused the graph: parameter 's' of 'main' has type 'Shape'"]
expect_output_not_contains = ["wrote", "Segmentation fault", "dumped core", "UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000
[[tests]]
name = "cross_module"
desc = "An enum declared in one module (`shapes`, with a tuple variant, a struct variant and a unit one, plus a generic `Option<T>`) is exported, imported by another module and used there: construction by the qualified variant, an exhaustive `match` written in the declaring module, the generic instance `Option<int>` inferred from the annotation, and the qualified call `shapes::area`. Alike on the four back ends."
kind = "behavior"
case = "../../../cases/compile/enum/cross/use.cml"
args = ["-E", "short", "${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "3.14159 6.0 0.0",
  "7 -1",
  "12.56636",
  "Shape::Circle(1.0) Shape::Rect { w: 2.0, h: 3.0 } Shape::Empty",
].join('\n')
assert(out === want, `stdout: ${out}`)
}
"""
timeout_ms = 8000

[[tests]]
name = "type_argument_not_inferred"
desc = "A unit variant of a generic enum (`Option::None`) says nothing about the type argument: the construction is refused where it is written, naming the variant's fields, and says to give the expected type (`let x: Option<int> = Option::None`)."
kind = "negative"
case = "../../../cases/compile/enum/type_argument_not_inferred.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::EnumTypeArgumentNotInferred"
expect_diagnostic_code = "0x03000139"
expect_diagnostic_line = 6
expect_diagnostic_column = 13
expect_output_contains = ["Cannot infer the type argument 'T' of enum 'Option' from the fields of 'None'."]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000
