id = "compile.enum"
order = 327
tier = "feat"
tags = ["feat", "compile", "enum", "types", "match"]
desc = "Nominal enums (design principles 5.3): `type E = enum { A(i32), B { x: f32 }, C }`, construction by a qualified variant, `match` over the variants with an exhaustiveness check, printing, equality, generics, all four schedulers, the translation passes that refuse an enum, and the retirement of `A | B` and `T ? U`."

[[tests]]
name = "shapes"
desc = "Three variant shapes (a tuple, a struct, a unit), construction, an exhaustive `match` without a wildcard, one with `case _`, printing (`Shape::Rect { w: 2.0, h: 3.0 }`, `Shape::Empty`), equality and inequality by content, an enum of an enum, and an array of enums. Alike on the four back ends."
kind = "behavior"
case = "../../../cases/compile/enum/shapes.cml"
args = ["-E", "short", "${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "3.14159",
  "6.0",
  "0.0",
  "circle",
  "rect",
  "empty",
  "Shape::Circle(1.0)",
  "Shape::Rect { w: 2.0, h: 3.0 }",
  "Shape::Empty",
  "true",
  "false",
  "true",
  "true",
  "true",
  "true",
  "Slot::Full(Shape::Rect { w: 2.0, h: 3.0 })",
  "true",
  "false",
  "9.14159",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 20000

[[tests]]
name = "generic_tree"
desc = "A generic enum: `Option<T>` (inferred from the field, from the declared type of the binding, and from an argument position) and a recursive `Tree<T>` (a field whose type names the enum again), with matching, sums, depth and printing. Alike on the four back ends."
kind = "behavior"
case = "../../../cases/compile/enum/generic_tree.cml"
args = ["-E", "short", "${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "42",
  "9",
  "11",
  "6",
  "3",
  "Tree::Node { left: Tree::Leaf(1), right: Tree::Node { left: Tree::Leaf(2), right: Tree::Leaf(3) } }",
  "Option::Some(7)",
  "12",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 20000

[[tests]]
name = "macro_pipeline"
desc = "`std::macro` evaluates what it can ahead of time and leaves an enum construction to run time: the program prints the same."
kind = "behavior"
case = "../../../cases/compile/enum/shapes.cml"
args = ["-E", "short", "${case}", "std::macro"]
expect_exit = 0
expect_output_contains = ["Shape::Rect { w: 2.0, h: 3.0 }", "9.14159"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 20000

[[tests]]
name = "gc_generational"
desc = "Enum values are run-time objects whose fields the collector traces: many values are built, dropped and read back under the generational collector."
kind = "behavior"
case = "../../../cases/compile/enum/gc_stress.cml"
args = ["-E", "short", "--gc", "generational", "${case}"]
expect_exit = 0
expect_output_contains = ["596", "2001000", "Box::Two { left: Box::One(3), right: Box::One(4) }", "8"]
expect_output_not_contains = ["Segmentation fault", "dumped core", "UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 60000

[[tests]]
name = "gc_mark_sweep"
desc = "The same program under the mark-sweep collector prints the same values."
kind = "behavior"
case = "../../../cases/compile/enum/gc_stress.cml"
args = ["-E", "short", "--gc", "mark-sweep", "${case}"]
expect_exit = 0
expect_output_contains = ["596", "2001000", "Box::Two { left: Box::One(3), right: Box::One(4) }", "8"]
expect_output_not_contains = ["Segmentation fault", "dumped core", "UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 60000

[[tests]]
name = "wildcard_only"
desc = "`match` over an enum with only `case _`: the subject is a call (so the wildcard has to stay a branch), and the other match names a variant before the wildcard."
kind = "behavior"
case = "../../../cases/compile/enum/wildcard_only.cml"
args = ["-E", "short", "${case}"]
expect_exit = 0
expect_output_contains = ["3", "2.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 12000

