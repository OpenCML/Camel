[[tests]]
name = "stream.type_signature"
desc = "A stream type stands where any type stands (the author's ruling of 2026-10-24: `T..` is a core type, not a spelling of `T`): a parameter, a result, a function type and a generic signature all take one, and the suffix is read left to right with no special case - `int?..` is the stream of a nullable int, `int..?` the possibly absent stream, `int[3]..` the stream of three-element arrays and `int[..]..` the stream of open-rank arrays, while `int[..]` keeps its own reading. None of these parsed before: `func count(s: int..)` was MissingComma at the `..`."
kind = "behavior"
case = "../../../cases/compile/stream/type_signature.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_starts_with = "1\n"
expect_output_not_contains = ["UnknownInternalError", "[Error]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "stream.type_signature_printed"
desc = "One element type, one spelling: every stream type of a signature reaches `std::jgir` as the suffix that was written - `int..`, `int?..`, `int..?`, `int[3]..`, `int[..]..` - and the open-rank array `f32[..]` is still an array. The signature of the graph is where a type is read by every tool, so this is the printing the diagnostics and `std::gir` share."
kind = "behavior"
case = "../../../cases/compile/stream/type_signature.cml"
args = ["${case}", "std::jgir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const doc = JSON.parse(input.normalized.stdout)
const signature = (name) => {
    const graph = doc.graphs.find((g) => g.name === name)
    assert(graph, `${name} is missing from ${doc.graphs.map((g) => g.name).join(', ')}`)
    return graph.signature
}
assert(signature('count') === '(s: int..) => int', `count is ${signature('count')}`)
assert(
    signature('shapes') === '(a: int?.., b: int!.., c: int..?, d: int[3].., e: int[..]..) => int',
    `shapes is ${signature('shapes')}`,
)
assert(signature('teePair') === '(pair: (int.., int)) => int', `teePair is ${signature('teePair')}`)
assert(signature('openRank') === '(rows: f32[..]) => int', `openRank is ${signature('openRank')}`)
const types = [...new Set(doc.graphs.flatMap((g) => g.nodes.map((n) => n.outputType)).filter(Boolean))]
for (const wanted of ['int..', 'int?..', 'int!..', 'int..?', 'int[3]..', 'int[..]..', 'f32[..]', '(int.., int)']) {
    assert(types.includes(wanted), `${wanted} is not among ${JSON.stringify(types)}`)
}
}
"""
timeout_ms = 10000

[[tests]]
name = "stream.type_alias"
desc = "`type Ints = int..` names the same interned type the suffix writes: `take(s: Ints)` and `give(s: int..)` print the identical signature `(s: int..) => int`, and the alias's own name is printed nowhere. The same rule from the other side: `int`, `int..` and `int[]` are three types, so the three overloads of `pick` are three signatures."
kind = "behavior"
case = "../../../cases/compile/stream/type_alias.cml"
args = ["${case}", "std::jgir"]
expect_exit = 0
expect_output_not_contains = ["Ints"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const doc = JSON.parse(input.normalized.stdout)
const signature = (name) => {
    const graph = doc.graphs.find((g) => g.name === name)
    assert(graph, `${name} is missing from ${doc.graphs.map((g) => g.name).join(', ')}`)
    return graph.signature
}
assert(signature('take') === '(s: int..) => int', `take is ${signature('take')}`)
assert(signature('give') === '(s: int..) => int', `give is ${signature('give')}`)
const pick = doc.graphs.filter((g) => g.name.startsWith('pick')).map((g) => g.signature)
for (const wanted of ['(x: int) => int', '(x: int..) => int', '(x: int[]) => int']) {
    assert(pick.includes(wanted), `${wanted} is not in ${JSON.stringify(pick)}`)
}
}
"""
timeout_ms = 10000

[[tests]]
name = "stream.type_alias_identity"
desc = "The identity has a consequence: two declarations that differ only in writing the stream as `int..` or as an alias of it declare the same signature, and the second is refused as a redeclaration. It is the type that is the same, not the name that repeats - `pick(x: int[]): int` beside `pick(x: Ints): int` is an ordinary overload set (stream.type_alias)."
kind = "negative"
case = "../../../cases/compile/stream/type_alias_identity.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::Redeclaration"
expect_diagnostic_code = "0x03000001"
expect_diagnostic_line = 17
expect_diagnostic_column = 1
expect_output_contains = ["Redeclaration of reference: 'pick'"]
expect_output_not_contains = ["UnknownInternalError", "Warning"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "stream.type_in_container"
desc = "A stream is consumed once and the elements of an array are read more than once, so the suffix applies to a whole type and an array of streams is refused by name (SemanticDiag::StreamInContainer). `int..[3]` is read left to right as `(int..)[3]`: the dimension is read against the stream, and the refusal names the stream and the container. The type is never built, so a dimension that makes no sense cannot reach the array builder either."
kind = "negative"
case = "../../../cases/compile/stream/type_in_container.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::StreamInContainer"
expect_diagnostic_code = "0x030001E3"
expect_diagnostic_line = 11
expect_diagnostic_column = 12
expect_output_contains = ["'int..' cannot be the element of an array", "a stream is consumed once, while the elements of a container are read more than once"]
expect_output_not_contains = ["UnknownInternalError", "Warning"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "stream.type_in_collection"
desc = "The same linearity rule where the container is a map or a set: the value of a map and the element of a set are read more than once, so a stream cannot be one of them, and the refusal is StreamInContainer - not the key rule's 'no order', which would name a reason that is not the one (the ruling of 2026-10-24 rests on linearity). Both are reported in one run: the map first, the set after it."
kind = "negative"
case = "../../../cases/compile/stream/type_in_collection.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::StreamInContainer"
expect_diagnostic_code = "0x030001E3"
expect_diagnostic_line = 9
expect_diagnostic_column = 15
expect_output_contains = ["'int..' cannot be the element of a map", "'int..' cannot be the element of a set"]
expect_output_not_contains = ["UnknownInternalError", "Warning", "CollectionKeyNotAllowed"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "stream.type_as"
desc = "The right side of `as` is always a type (the author's ruling of 2026-10-24, option (c)): `xs as int..` reads the stream type where a type stands, and the program is not a syntax error. The conversion itself has no reading yet - nothing turns an array into a stream, and producing a stream value is another slice - so it is refused with the two types printed. It used to be `Unexpected '..'; expected '}'.` at the `..`."
