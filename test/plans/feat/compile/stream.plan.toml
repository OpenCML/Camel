id = "compile.stream"
order = 336
tier = "fast"
tags = ["feat", "compile", "stream"]
desc = "The stream surface: `f..g` and the interval `a..b` (slice A of the stream plan: the ruled readings of `..`, and the removal of `?..`); and the interval line: the two-parameter `range(a, b)` is deleted, and `for i in 0..n` is fused by the compiler rather than materialised."

[[tests]]
name = "stream.composition"
desc = "`f..g` is the composition `(x) => g(f(x))`: `(inc..dbl)(3)` is `dbl(inc(3))` = 8, not `inc(dbl(3))` = 7. It used to be ConstructNotSupported at the operator."
kind = "behavior"
case = "../../../cases/compile/stream/composition.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_starts_with = "8\n"
expect_output_not_contains = ["UnknownInternalError", "[Error]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "stream.composition_uses"
desc = "A composition is a function value like any other: `map<inc..dbl>` and `3->(inc..dbl)` give what the two calls written out give. Beside `->` a composition keeps its parentheses, because `..` is looser than `->`: `3->inc..dbl` is `(3->inc)..dbl` and is refused where an `int` meets a function."
kind = "behavior"
case = "../../../cases/compile/stream/composition_uses.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_starts_with = "[4, 6, 8]\n8\n"
expect_output_not_contains = ["UnknownInternalError", "[Error]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "stream.interval"
desc = "`a..b` is the interval [a, b) of integers, an `int[]`, on literals and on names alike. It used to be ConstructNotSupported at the operator, with the composition's text."
kind = "behavior"
case = "../../../cases/compile/stream/interval.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_starts_with = "[1, 2, 3, 4]\n[0, 1, 2]\n"
expect_output_not_contains = ["UnknownInternalError", "[Error]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "stream.comp_operand_mismatch"
desc = "`..` has two readings and takes nothing else: two texts are neither two functions nor two integers, so the compiler refuses the construct and names both operand types."
