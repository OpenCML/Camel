[[tests]]
name = "stream.tee_report"
desc = "A profile session prints one `STREAM_TEE` line per tee, counting elements (and bytes where one element's size is known): the first tee is given a hint of 2 and its side reads 20 elements before the other reads any, so its peak is 20 and shows that the hint is not a bound; the second is given a hint wider than the implementation honours and reports the cap it was clamped to; the third is given no hint and reports the default."
kind = "behavior"
case = "../../../cases/compile/stream/tee_report.cml"
args = ["${case}", "std::profile"]
expect_exit = 0
expect_stdout_contains = ["PROFILE camel", "streams - one line per tee", "STREAM_TEE {\"tee\":1,\"elem\":\"int\",\"elements\":20,\"peak\":20,\"elem_bytes\":8,\"bytes\":160,\"hint\":2,\"cap\":64}", "STREAM_TEE {\"tee\":2,\"elem\":\"int\",\"elements\":3,\"peak\":3,\"elem_bytes\":8,\"bytes\":24,\"hint\":64,\"cap\":64}", "STREAM_TEE {\"tee\":3,\"elem\":\"int\",\"elements\":3,\"peak\":3,\"elem_bytes\":8,\"bytes\":24,\"hint\":8,\"cap\":64}"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "stream.tee_report_element_size_unknown"
desc = "A `tee` of a stream whose elements are not one fixed number of bytes reports the elements it pulled and the most it buffered, and leaves the bytes out (design principles 5.4): a string's length is part of its value, so a peak in bytes would state a number the tee never held."
kind = "behavior"
case = "../../../cases/compile/stream/tee_element_size_unknown.cml"
args = ["${case}", "std::profile"]
expect_exit = 0
expect_stdout_contains = ["PROFILE camel", "streams - one line per tee", "STREAM_TEE {\"tee\":1,\"elem\":\"string\",\"elements\":3,\"peak\":3,\"hint\":8,\"cap\":64}"]
expect_stdout_not_contains = ["elem_bytes"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "stream.tee_report_absent"
desc = "A program with no tee is reported as it was: the same profile session, the same program shape as `stream.tee_report` without a tee, asserts the report and no line about a tee -- so what the change added is printed only where a tee is written."
kind = "behavior"
case = "../../../cases/compile/stream/tee_no_report.cml"
args = ["${case}", "std::profile"]
expect_exit = 0
expect_stdout_contains = ["PROFILE camel", "operator calls", "6"]
expect_stdout_not_contains = ["STREAM_TEE", "streams - one line per tee"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "stream.arm_error_keeps_its_diagnosis"
desc = "A stream read in each arm of a branch is one consumer per path; an arm given up over a mistake in it reports that mistake, and not a second consumer of the stream."
kind = "behavior"
case = "../../../cases/compile/stream/arm_error_keeps_its_diagnosis.cml"
args = ["${case}"]
expect_exit = 1
expect_stdout_contains = ["nowhere_name"]
expect_stdout_not_contains = ["consumed twice", "consumed once per round"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000
[[tests]]
name = "stream.generator"
desc = "A function that writes `yield` hands out a stream: three `yield`s with a `var` written between them are three elements, the tuple element is read with `.0` and `.1`, a branch with a `yield` in each arm goes on in the arm the condition chose, and a closure the body made before a `yield` reads the cell a later pull wrote through it (`read()` is 5, not 0). All four back ends agree."
kind = "behavior"
case = "../../../cases/compile/stream/generators.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "56\n1234\n10\n-10\n5\n"
expect_output_not_contains = ["[Error]", "[Warn]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "stream.generator_default"
desc = "The same program with no pass named: the default path is std::nvm, and it is the fifth back end the case is pinned on."
kind = "behavior"
case = "../../../cases/compile/stream/generators.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "56\n1234\n10\n-10\n5\n"
expect_output_not_contains = ["[Error]", "[Warn]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "stream.generator_no_sync"
desc = "A generator head without `sync`: what the body writes between two `yield`s is an effect like any other, and the program is told so rather than the write quietly taking place or quietly going away."
kind = "behavior"
case = "../../../cases/compile/stream/generators_no_sync.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "5\n"
expect_output_not_contains = ["[Error]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "stream.generator_match"
desc = "A `yield` in each arm of a `match`: the arm the value picks is the point the next pull goes on from, so the element after the arm's `yield` is the one this pull hands out next. Both arms are taken in one program."
kind = "behavior"
case = "../../../cases/compile/stream/generators_match.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "100\n200\n"
expect_output_not_contains = ["[Error]", "[Warn]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
