timeout_ms = 10000

[[tests]]
name = "stream.type_impl_signature"
desc = "`#impl` matches the kernel's signature to the function's by type identity (design principles 10.4), and a stream type is one of the types that identity compares: `(a: int, b: int) => int` and `(a: int, b: int..) => int` are different functions, and the refusal prints the stream in the signature it names. Before the rule the spelling did not parse at all, so the kernel could not be compared to it."
kind = "negative"
case = "../../../cases/compile/stream/type_impl_signature.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ImplSignatureMismatch"
expect_diagnostic_code = "0x030001DB"
expect_diagnostic_line = 12
expect_diagnostic_column = 2
expect_output_contains = ["has the signature (a: int, b: int) => int, but the function has (a: int, b: int..) => int."]
expect_output_not_contains = ["UnknownInternalError", "Warning"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "stream.comp_operand_generic"
desc = "An operand of `..` whose type is not settled: `ident` is generic, and nothing at this position says which instance it is - the composition stands in a `let` with no declared type - so it is refused by that name. The refusal is the composition's own diagnostic, and it says what the old one did not: which operand is the generic function, that the type arguments name the instance, and that an expected function type for the whole expression settles it. With such a type the same program passes - stream.comp_expected_type - and the refusal no longer prints `void` as if it were the operand's type or reaches CompOperandMismatch, which stays for operands `..` cannot take at all."
kind = "negative"
case = "../../../cases/compile/stream/comp_operand_generic.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::CompOperandGenericWithoutType"
expect_diagnostic_code = "0x030001E4"
expect_diagnostic_line = 13
expect_diagnostic_column = 20
expect_output_contains = ["'..' composes two functions, and its left operand, the generic function 'ident', has no instance here: write its type arguments ('ident::<int>'), or give the whole expression an expected function type."]
expect_output_not_contains = ["UnknownInternalError", "Warning", "'void'"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "stream.comp_operand_generic_mixed"
desc = "Which operand is generic is part of what the refusal says: `ident::<int>` on the left is the instance written out, so the composition is one operand short, and the refusal names the right one. The position alone would have settled both, which is why the same text with `ident` on both sides is refused for a different reason (there is no expected type there) and not for this one."
kind = "negative"
case = "../../../cases/compile/stream/comp_operand_generic_mixed.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::CompOperandGenericWithoutType"
