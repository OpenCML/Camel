[[tests]]
name = "stream.interval_loop"
desc = "`for i in 0..n` is fused by the compiler: the loop walks the two bounds, so the rounds are `a .. b - 1`, an interval that ends where it starts and one whose end is below its start run no round, the bounds are read once, and the end takes no round."
