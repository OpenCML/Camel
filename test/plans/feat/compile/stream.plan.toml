timeout_ms = 10000


[[tests]]
name = "stream.range_import_wins"
desc = "A name imported by name is the name the program means: with `import { range } from tensor` the call is tensor's `range`, at its one-argument and three-argument arities, and the built-in of the same spelling (the prelude, the lowest layer) does not answer for the name (design principles 6.x). The graph names the entity that answered."
kind = "behavior"
case = "../../../cases/compile/stream/range_import_wins.cml"
args = ["${case}", "std::jgir", "canonical=true"]
expect_exit = 0
expect_output_contains = ["tensor:range"]
expect_output_not_contains = ["struct/range", "UnknownInternalError", "[Error]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000


[[tests]]
name = "stream.range_using_wins"
