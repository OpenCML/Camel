args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::RangeStepZero"
expect_diagnostic_code = "0x030001E6"
expect_diagnostic_line = 8
expect_diagnostic_column = 27
expect_output_contains = ["The range 'range(0, 10, 0)' has a step of 0, so it is no sequence of integers."]
expect_output_not_contains = ["UnknownInternalError", "Warning"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000


