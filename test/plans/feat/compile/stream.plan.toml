expect_diagnostic_line = 16
expect_diagnostic_column = 1
expect_output_contains = ["Redeclaration of reference: 'pick'"]
expect_output_not_contains = ["UnknownInternalError", "Warning"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "stream.type_in_container"
desc = "A stream is consumed once and the elements of an array are read more than once, so the suffix applies to a whole type and an array of streams is refused by name (SemanticDiag::StreamInContainer). `int..[3]` is read left to right as `(int..)[3]`: the dimension is read against the stream, and the refusal names the stream and the container. The type is never built, so a dimension that makes no sense cannot reach the array builder either."
kind = "negative"
case = "../../../cases/compile/stream/type_in_container.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::StreamInContainer"
expect_diagnostic_code = "0x030001E3"
expect_diagnostic_line = 10
expect_diagnostic_column = 12
expect_output_contains = ["'int..' cannot be the element of an array", "a stream is consumed once, while the elements of a container are read more than once"]
expect_output_not_contains = ["UnknownInternalError", "Warning"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "stream.type_in_collection"
desc = "The same linearity rule where the container is a map or a set: the value of a map and the element of a set are read more than once, so a stream cannot be one of them, and the refusal is StreamInContainer - not the key rule's 'no order', which would name a reason that is not the one. Both are reported in one run: the map first, the set after it."
kind = "negative"
case = "../../../cases/compile/stream/type_in_collection.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::StreamInContainer"
expect_diagnostic_code = "0x030001E3"
expect_diagnostic_line = 8
expect_diagnostic_column = 15
expect_output_contains = ["'int..' cannot be the element of a map", "'int..' cannot be the element of a set"]
expect_output_not_contains = ["UnknownInternalError", "Warning", "CollectionKeyNotAllowed"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "stream.type_as"
desc = "The right side of `as` is always a type (the right side of `as` is always a type): `xs as int..` reads the stream type where a type stands, and the program is not a syntax error. The conversion itself has no reading yet - nothing turns an array into a stream, and producing a stream value is another slice - so it is refused with the two types printed. It used to be `Unexpected '..'; expected '}'.` at the `..`."
