[[tests]]
name = "stream.interval_loop"
desc = "`for i in 0..n` is fused by the compiler: the loop walks the two bounds, so the rounds are `a .. b - 1`, an interval that ends where it starts and one whose end is below its start run no round, the bounds are read once, and the end takes no round."
kind = "behavior"
case = "../../../cases/compile/stream/interval_loop.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_starts_with = "1234\n0\n0\n10\n2\n0\n"
expect_output_not_contains = ["UnknownInternalError", "[Error]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000


[[tests]]
name = "stream.interval_loop_fused"
