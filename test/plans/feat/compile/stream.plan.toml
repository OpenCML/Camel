expect_output_not_contains = ["UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000


[[tests]]
name = "stream.step_value"
desc = "A stream`s value is its step function with its state: a function value of the step signature `() => (T, T..)?` is a stream where a stream is expected, and a stream is read through that signature, where one pull answers the element with the rest of the stream. The consumer threads the rest it was handed, so the same closure answers the same element twice, and the stream ends with `null`."
kind = "behavior"
case = "../../../cases/compile/stream/step_value.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["6"]
expect_output_not_contains = ["UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "stream.step_value_other_signature"
desc = "The step signature is the only function value that is a stream: a function value of any other signature is refused where a stream is expected, so the seam between a stream and a function value is exactly one signature wide. The lambda writes no resource clause, so its type carries what its body was measured to reach -- it touches nothing, which is `pure` -- and the refusal quotes the type it has."
kind = "behavior"
case = "../../../cases/compile/stream/step_value_signature.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["has type '(x: int) => int pure', which is not the declared type 'int..'"]
expect_output_not_contains = ["UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000
[[tests]]
name = "stream.step_value_pull_type"
desc = "One pull of a stream has the type of the step signature`s exit: the nullable pair of the element and the rest of the stream. The probe reads that type back out of a declared position, so the type a consumer takes apart is a reading rather than a belief."
kind = "behavior"
case = "../../../cases/compile/stream/probe_pull_type.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["has type '(int, int..)?'"]
expect_output_not_contains = ["UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000
[[tests]]
name = "stream.for_loop"
desc = "`for x in s` over a stream expands into the `while` the graph already has: the rounds are the pulls of the stream`s step function, the element is read out of the pull, the body gives the state of the next round and the round ends by pulling the element that follows. The case walks a hand-written stream through the three shapes (one state, the empty stream, and a head that wrote a condition) and through two states."
kind = "behavior"
case = "../../../cases/compile/stream/for_loop.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["6", "0", "3", "3 6"]
expect_output_not_contains = ["UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

