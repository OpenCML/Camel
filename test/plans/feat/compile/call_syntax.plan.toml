id = "compile.call_syntax"
order = 324
tier = "fast"
tags = ["feat", "compile", "calls", "pipelines"]
desc = "The forms a call is written in: `x->f(a, b)` is `f(x, a, b)` (design principles 4.4)"

# Handover H27c: the arrow puts the value on its left in front of the arguments written after
# it. It used to make the value the whole call's only argument — `1->add(2)` became
# `add(2)(1)`, which no function of one argument could take — so the forms below are held
# against the four back ends.

[[tests]]
name = "call_syntax.pipeline_arguments"
desc = "The receiver is the first ordinary argument of the call written on the right: an ordinary function (`1->add(2)`), a function with a `with` argument (`1->bump<10>(2)`), a generic function (`1->pick(2)`), through `?->`, with no extra argument (`1->inc()`), and in a chain (`1->add(2)->add(3)`)."
kind = "behavior"
case = "../../../cases/compile/callform/pipeline_arguments.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["[Error]", "error[", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = ["3", "13", "2", "2", "6", "5"].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 30000