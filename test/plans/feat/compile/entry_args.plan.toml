kind = "behavior"
tool = "node"
case = "../../../cases/compile/entry_args/timeit.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["timeit with arguments: 2 runs", "timeit without: EntryArgumentMissing", "PASS"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

