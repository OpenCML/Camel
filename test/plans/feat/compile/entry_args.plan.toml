[[tests]]
name = "entry_args.float_hex_refused"
desc = "A float parameter reads the language's whole number grammar, not strtod's: the hexadecimal float `0x1.8p1` is refused as a located error."
kind = "behavior"
case = "../../../cases/compile/entry_args/scalars.cml"
args = ["${case}", "--arg", "n=3", "--arg", "rate=0x1.8p1", "--arg", "name=hi", "--arg", "loud=true"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 7
expect_output_contains = ["Cannot bind the argument 'rate' of 'main': '0x1.8p1' is not a number"]
expect_output_not_contains = ["hi 3"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths"]
timeout_ms = 8000

