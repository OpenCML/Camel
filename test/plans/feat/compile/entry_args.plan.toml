expect_output_contains = ["Cannot bind the argument 'w' of 'main': Cannot convert '3.5e38+1i' to c64: the real part is outside the range of c64 (each part at most about 3.4e38 in magnitude)"]
expect_output_not_contains = ["1+2i"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths"]
timeout_ms = 8000

