expect_diagnostic_line = 7
expect_output_contains = ["Cannot bind the argument 'rate' of 'main': Cannot convert the string '0x1.8p1' to float"]
expect_output_not_contains = ["hi 3"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths"]
timeout_ms = 8000

