desc = "A NaN real text is read as the real part (`nan` is `nan+0i`); it is a number, so it is not refused, and the NaN's sign is not written."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z=nan", "--arg", "w=4i"]
expect_exit = 0
expect_stdout_contains = ["nan+0i 0+4i", "nan 0.0", "0.0 4.0", "nan+4i"]
expect_output_not_contains = ["Error", "-nan"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "entry_args.complex_malformed"
desc = "A malformed complex text is the same located error at the argument, naming it and showing the text; the program does not run. `1+2` has no imaginary part (`i`), so it is not a complex number."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z=1+2", "--arg", "w=4i"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 11
expect_output_contains = ["Cannot bind the argument 'z' of 'main'", "Cannot convert the string '1+2' to a complex number"]
expect_output_not_contains = ["0+4i", ":?:?:"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.complex_malformed_suffix"
desc = "The imaginary part must be the language's `i`: `1+2j` is refused like any other malformed complex text."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z=1+2j", "--arg", "w=4i"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 11
expect_output_contains = ["Cannot convert the string '1+2j' to a complex number"]
expect_output_not_contains = ["0+4i"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.complex_not_a_number"
desc = "Text that is not a number at all is refused, not read as a complex value: `abc` is the located EntryArgumentInvalid."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z=abc", "--arg", "w=4i"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 11
expect_output_contains = ["Cannot bind the argument 'z' of 'main'", "Cannot convert the string 'abc' to a complex number", "or a real number such as 1.5"]
expect_output_not_contains = ["0+4i"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.complex_incomplete"
desc = "An incomplete complex text is refused: `1+` has no imaginary part, and it is not a number either."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z=1+", "--arg", "w=4i"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 11
expect_output_contains = ["Cannot bind the argument 'z' of 'main'", "Cannot convert the string '1+' to a complex number"]
expect_output_not_contains = ["0+4i"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.complex_real_out_of_range"
desc = "A complex text whose real part is a number c128 cannot hold is refused as out of range, naming the part and the range; it is not 'not a complex number'."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z=1e9999+2i", "--arg", "w=4i"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 11
expect_output_contains = ["Cannot bind the argument 'z' of 'main': Cannot convert '1e9999+2i' to c128: the real part is outside the range of c128 (each part at most about 1.8e308 in magnitude)"]
expect_output_not_contains = ["0+4i"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.complex_imaginary_underflow_refused"
desc = "Each part of a complex text is a number token of the language: an imaginary part too small to tell from zero is refused with the part named, not read as `0i` (H15i, superseding H15h's zero here)."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z=1+2i", "--arg", "w=1+1e-9999i"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 11
expect_output_contains = ["Cannot bind the argument 'w' of 'main': Cannot convert '1+1e-9999i' to c64: the imaginary part is too small for c64 (the nearest value is zero)"]
expect_output_not_contains = ["1+0i"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "entry_args.complex_integer_bases"
desc = "Each part of a complex text is one number token, so the integer tokens work in it too: `1+0x10i` is `1+16i`, and `0x10-0o77i` is `16-63i` (octal 63), as the same literals in the language are (H15i writes octal `0o77`)."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z=1+0x10i", "--arg", "w=0x10-0o77i"]
expect_exit = 0
expect_stdout_contains = ["1+16i 16-63i", "1.0 16.0", "16.0 -63.0", "17-47i"]
expect_output_not_contains = ["Error"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "entry_args.complex_c64_part_boundary_fit"
desc = "Each part of a c64 is a float (H15g): the largest f32 is a part it holds, converted once at that width, and the value prints as the f32 it was read as."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z=1+2i", "--arg", "w=3.4028235e38+1i"]
expect_exit = 0
expect_stdout_contains = ["1+2i 3.4028235e+38+1i", "3.4028235e+38 1.0"]
expect_output_not_contains = ["Error"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "entry_args.complex_c64_real_part_out_of_range"
desc = "3.5e38 is a number a c64's real part cannot hold: refused as out of range, naming the part and `c64` with its range, rather than read at c128 width and narrowed."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
