[[tests]]
name = "entry_args.rgir_open_parameters"
desc = "std::rgir on the program without any --arg: a dump needs no values. The entry graph has one port per parameter of main, named like it, and passes them on to main."
kind = "behavior"
case = "../../../cases/compile/entry_args/scalars.cml"
args = ["${case}", "std::rgir"]
expect_exit = 0
expect_output_not_contains = ["Error", "arity"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
const ports = (name) => input.normalized.stdout.split('label="' + name + '", type="PORT"').length - 1
for (const name of ['n', 'rate', 'name', 'loud']) {
  assert(ports(name) === 2, 'parameter ' + name + ': one port in main and one in the entry graph, got ' + ports(name))
}
assert(input.normalized.stdout.split('[label="0|3", type="NORM"]').length - 1 === 2, 'the entry graph passes four arguments to main (and main four to println)')
"""
timeout_ms = 8000

[[tests]]
name = "entry_args.rgir_partly_bound"
desc = "A bound parameter is a constant of the entry graph, the others stay ports: with --arg n=3 the entry graph has three ports left."
kind = "behavior"
case = "../../../cases/compile/entry_args/scalars.cml"
args = ["${case}", "--arg", "n=3", "std::rgir"]
expect_exit = 0
expect_output_not_contains = ["Error"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
const ports = (name) => input.normalized.stdout.split('label="' + name + '", type="PORT"').length - 1
assert(ports('n') === 1, 'n is bound: only the port of main itself is left, got ' + ports('n'))
assert(ports('rate') === 2 && ports('name') === 2 && ports('loud') === 2, 'the other parameters stay ports of the entry graph')
"""
timeout_ms = 8000

[[tests]]
name = "entry_args.missing_argument"
desc = "Running needs every parameter: a missing value is the error EntryArgumentMissing located at the definition of main, naming the parameters without a value; nothing runs (no zeros, no random values)."
kind = "behavior"
case = "../../../cases/compile/entry_args/scalars.cml"
args = ["${case}", "--arg", "n=3"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentMissing"
expect_diagnostic_code = "0x04000010"
expect_diagnostic_line = 7
expect_diagnostic_column = 1
expect_output_contains = ["No value was given for the parameters 'rate', 'name' and 'loud' of 'main'", "--arg name=value"]
expect_output_not_contains = ["hi", "arity", ":?:?:"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.missing_argument_json"
desc = "The same under each scheduler in --output-format json: one diagnostic, stage run, a source range, and the program does not run."
kind = "behavior"
tool = "node"
case = "../../../cases/compile/entry_args/missing.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["std::fvm: EntryArgumentMissing", "std::nvm: EntryArgumentMissing", "std::jit: EntryArgumentMissing", "std::tf: EntryArgumentMissing", "default: EntryArgumentMissing", "PASS"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "entry_args.unknown_name"
desc = "An --arg that names no parameter is EntryArgumentInvalid at main and lists the parameters; the program does not run."
kind = "behavior"
case = "../../../cases/compile/entry_args/scalars.cml"
args = ["${case}", "--arg", "n=3", "--arg", "rate=0.5", "--arg", "name=hi", "--arg", "loud=true", "--arg", "extra=1"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_code = "0x04000011"
expect_diagnostic_line = 7
expect_diagnostic_column = 1
expect_output_contains = ["Cannot bind the argument 'extra' of 'main'", "its parameters: n, rate, name, loud"]
expect_output_not_contains = ["hi 3"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.bad_literal"
