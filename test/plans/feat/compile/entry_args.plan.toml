timeout_ms = 30000

[[tests]]
name = "entry_args.cpp_bound"
desc = "std::cpp translates a main with parameters (design principles 10.6): values bound with --arg when it translates are constants of the program."
kind = "behavior"
case = "../../../cases/compile/entry_args/scalars.cml"
args = ["${case}", "--arg", "n=3", "--arg", "rate=0.5", "--arg", "name=hi", "--arg", "loud=true", "std::cpp"]
expect_exit = 0
expect_stdout_contains = ["main_(0, 3, 0.5, lit::str_hi, true)", "int main(int argc, char **argv)"]
expect_output_not_contains = ["TranslationRefused", "internal error"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.cpp_open"
desc = "Parameters left open are read by the generated program from its command line, --arg name=value as camel takes them, each by its declared type (design principles 10.6). That the program's output and reports agree with camel's is checked by feat/trans/cpp.agree_with_fvm (test/tools/cppexec/expect.txt)."
kind = "behavior"
case = "../../../cases/compile/entry_args/scalars.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
expect_stdout_contains = ["rt::EntryArguments args(argc, argv, {{\"n\", rt::EntryKind::Int}, {\"rate\", rt::EntryKind::Float}, {\"name\", rt::EntryKind::Text}, {\"loud\", rt::EntryKind::Bool}}", "args.integer(0), args.number(1), args.text(2), args.boolean(3)"]
expect_output_not_contains = ["TranslationRefused", "internal error"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.complex_text"
desc = "A c128 and a c64 parameter are read from the language's complex text: `1+2i` has both parts, `0.5-0.25i` a negative imaginary part; each part is printed by the width the parameter declares (c128 as double, c64 as f32)."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z=1+2i", "--arg", "w=0.5-0.25i"]
expect_exit = 0
expect_stdout_contains = ["1+2i 0.5-0.25i", "1.0 2.0", "0.5 -0.25", "1.5+1.75i"]
expect_output_not_contains = ["Error"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "entry_args.complex_imaginary_only"
desc = "A text with no real part is the imaginary part only, with its sign: `-2i` is `0-2i` and `4i` is `0+4i` (language reference 2.5.3)."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z=-2i", "--arg", "w=4i"]
expect_exit = 0
expect_stdout_contains = ["0-2i 0+4i", "0.0 -2.0", "0.0 4.0"]
expect_output_not_contains = ["Error"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "entry_args.complex_negative_parts"
desc = "A negative real part and a negative imaginary part: `-1.5-0.25i`; the sign of the imaginary part is the separator."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z=-1.5-0.25i", "--arg", "w=-2i"]
expect_exit = 0
expect_stdout_contains = ["-1.5-0.25i 0-2i", "-1.5 -0.25", "-1.5-2.25i"]
expect_output_not_contains = ["Error"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "entry_args.complex_real_text"
desc = "A real number is read as the real part with an imaginary part of zero, at both widths: a literal takes its type from context (design principles 5.1), so `z=1.5` is `1.5+0i` for the c128 and a negative `w=-2` is `-2+0i` for the c64."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z=1.5", "--arg", "w=-2"]
expect_exit = 0
expect_stdout_contains = ["1.5+0i -2+0i", "1.5 0.0", "-2.0 0.0", "-0.5+0i"]
expect_output_not_contains = ["Error"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "entry_args.complex_real_exponent"
desc = "A real text with an exponent and an infinity are read as the real part, with an imaginary part of zero (`1e-3` is `0.001+0i`, `inf` is `inf+0i`)."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z=1e-3", "--arg", "w=inf"]
expect_exit = 0
expect_stdout_contains = ["0.001+0i inf+0i", "0.001 0.0", "inf 0.0", "inf+0i"]
expect_output_not_contains = ["Error"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "entry_args.complex_real_hex_refused"
desc = "A hexadecimal floating text is not a number the language writes (reference 2.5.2 has no hexadecimal float), so it is refused as a complex number too. The real entry parser reads the language's number grammar, not strtod's."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z=0x1.8p1", "--arg", "w=-2"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 11
expect_output_contains = ["Cannot bind the argument 'z' of 'main'", "'0x1.8p1' is not a complex number"]
expect_output_not_contains = ["3+0i"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.complex_real_trailing_dot_refused"
desc = "`1.` has no digit after the decimal point, which the language's number grammar requires (reference 2.5.2); it is not read as `1+0i`."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z=1.", "--arg", "w=-2"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 11
expect_output_contains = ["Cannot bind the argument 'z' of 'main'", "'1.' is not a complex number"]
expect_output_not_contains = ["1+0i"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.complex_real_leading_space_refused"
desc = "A number text has no blanks: a leading space is refused, as it is for a float parameter."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z= 1.5", "--arg", "w=-2"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 11
expect_output_contains = ["Cannot bind the argument 'z' of 'main'", "' 1.5' is not a complex number"]
expect_output_not_contains = ["1.5+0i"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.complex_real_signed"
desc = "A leading `+` is the number's sign in the language (reference 2.5.1), so `+1.5` is read as `1.5+0i`."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z=+1.5", "--arg", "w=-2"]
expect_exit = 0
expect_stdout_contains = ["1.5+0i -2+0i", "1.5 0.0", "-2.0 0.0", "-0.5+0i"]
expect_output_not_contains = ["Error"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "entry_args.complex_real_nan"
desc = "A NaN real text is read as the real part (`nan` is `nan+0i`); it is a number, so it is not refused, and the NaN's sign is not written."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z=nan", "--arg", "w=4i"]
expect_exit = 0
expect_stdout_contains = ["nan+0i 0+4i", "nan 0.0", "0.0 4.0", "nan+4i"]
expect_output_not_contains = ["Error", "-nan"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "entry_args.complex_malformed"
desc = "A malformed complex text is the same located error at the argument, naming it and showing the text; the program does not run. `1+2` has no imaginary part (`i`), so it is not a complex number."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z=1+2", "--arg", "w=4i"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 11
expect_output_contains = ["Cannot bind the argument 'z' of 'main'", "'1+2' is not a complex number"]
expect_output_not_contains = ["0+4i", ":?:?:"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.complex_malformed_suffix"
desc = "The imaginary part must be the language's `i`: `1+2j` is refused like any other malformed complex text."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z=1+2j", "--arg", "w=4i"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 11
expect_output_contains = ["'1+2j' is not a complex number"]
expect_output_not_contains = ["0+4i"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.complex_not_a_number"
desc = "Text that is not a number at all is refused, not read as a complex value: `abc` is the located EntryArgumentInvalid."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z=abc", "--arg", "w=4i"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 11
expect_output_contains = ["Cannot bind the argument 'z' of 'main'", "'abc' is not a complex number", "or a real number such as 1.5"]
expect_output_not_contains = ["0+4i"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.complex_incomplete"
desc = "An incomplete complex text is refused: `1+` has no imaginary part, and it is not a number either."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z=1+", "--arg", "w=4i"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 11
expect_output_contains = ["Cannot bind the argument 'z' of 'main'", "'1+' is not a complex number"]
expect_output_not_contains = ["0+4i"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.cpp_complex_open"
desc = "A c64 / c128 parameter left open is read by the generated program from its command line: std::cpp used to refuse a complex entry parameter (TranslationRefused) and now writes rt::EntryKind::C64 / C128. That the two agree is checked by feat/trans/cpp.agree_with_fvm (test/tools/cppexec/expect.txt)."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
expect_stdout_contains = ["{\"z\", rt::EntryKind::C128}, {\"w\", rt::EntryKind::C64}", "args.c128(0), args.c64(1)"]
expect_output_not_contains = ["TranslationRefused", "internal error"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.cpp_complex_bound"
desc = "A complex value bound with --arg when std::cpp translates is a constant of the program, a std::complex of the parameter's width."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z=1+2i", "--arg", "w=0.5-0.25i", "std::cpp"]
expect_exit = 0
expect_stdout_contains = ["std::complex<double>{1.0, 2.0}", "std::complex<float>{0.5f, -0.25f}"]
expect_output_not_contains = ["TranslationRefused", "internal error"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.cpp_complex_real_bound"
desc = "A real text bound to a complex parameter with --arg is the real part of the constant std::cpp writes, with an imaginary part of zero."
kind = "behavior"
case = "../../../cases/compile/entry_args/complex.cml"
args = ["${case}", "--arg", "z=1.5", "--arg", "w=-2", "std::cpp"]
expect_exit = 0
expect_stdout_contains = ["std::complex<double>{1.5, 0.0}", "std::complex<float>{-2.0f, 0.0f}"]
expect_output_not_contains = ["TranslationRefused", "internal error"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.cpp_struct_refused"
desc = "A parameter of a type the command line gives camel through files (a struct) is refused by std::cpp, located at main and naming the parameter."
kind = "behavior"
case = "../../../cases/compile/entry_args/struct_scalars.cml"
args = ["-E", "short", "${case}", "std::cpp"]
expect_exit = 1
expect_output_contains = ["RuntimeDiag::TranslationRefused", ".cml:5:1:", "the parameter 'p' of 'main' has type", "std::cpp reads from the command line only the parameters of type int, i32, float, f32, c64, c128, bool and string"]
expect_output_not_contains = ["internal error", ":?:?:"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

