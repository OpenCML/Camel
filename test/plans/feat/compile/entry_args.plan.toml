kind = "behavior"
case = "../../../cases/compile/entry_args/scalars.cml"
args = ["${case}", "--arg", "n=3", "--arg", "rate=0.5", "--arg", "name=hi", "--arg", "loud=true", "--arg", "extra=1"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_code = "0x04000011"
expect_diagnostic_line = 7
expect_diagnostic_column = 1
expect_output_contains = ["Cannot bind the argument 'extra' of 'main'", "its parameters: n, rate, name, loud"]
expect_output_not_contains = ["hi 3"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.bad_literal"
desc = "A value that is not a literal of the parameter's type is refused, naming the argument."
kind = "behavior"
case = "../../../cases/compile/entry_args/scalars.cml"
args = ["${case}", "--arg", "n=three", "--arg", "rate=0.5", "--arg", "name=hi", "--arg", "loud=true"]
