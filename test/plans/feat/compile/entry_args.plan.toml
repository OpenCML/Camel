[[tests]]
name = "entry_args.with_parameters"
desc = "`with` parameters of main (the weights) get their values like ordinary ones; the two call forms `layer<w, b>(x)` and `x->layer<w, b>` print the same tanh(x @ w + b). The .npy extension may be left out (b)."
kind = "behavior"
case = "../../../cases/compile/entry_args/with_params.cml"
args = ["${case}", "--arg", "x=test/cases/compile/entry_args/x.npy", "--arg", "w=test/cases/compile/entry_args/w.npy", "--arg", "b=test/cases/compile/entry_args/b"]
expect_exit = 0
expect_output_not_contains = ["Error"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
const out = input.normalized.stdout
const count = (s) => out.split(s).length - 1
assert(count('0.6878') === 2 && count('0.6351') === 2, 'both call forms print tanh(x @ w + b): ' + out)
"""
timeout_ms = 8000

