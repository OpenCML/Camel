id = "compile.entry_args"
order = 322
tier = "fast"
tags = ["feat", "compile", "entry"]
desc = "`main` with parameters: the entry graph takes them, `--arg name=value` binds them, what `main` returns goes to the output (`-o`, standard output by default)."

[[tests]]
name = "entry_args.scalars_default"
desc = "A `main` with int, float, string and bool parameters runs on the default pipeline with its values from `--arg`; the int result is the exit code (it used to end in an unlocated internal error on every pipeline: the entry graph called main with no arguments)."
kind = "behavior"
case = "../../../cases/compile/entry_args/scalars.cml"
args = ["${case}", "--arg", "n=3", "--arg", "rate=0.5", "--arg", "name=hi", "--arg", "loud=true"]
expect_exit = 4
expect_stdout_contains = ["hi 3 0.5 true"]
expect_output_not_contains = ["Error"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

