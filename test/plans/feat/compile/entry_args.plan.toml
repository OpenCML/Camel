# One number grammar for the command line and the source: an entry argument is one whole
# number token of the language, read by the same parser a literal is. The integer tokens are
# decimal, `0x` hexadecimal, `0b` binary and octal with a leading `0`; an integer token in a
# float parameter is converted to that width, as a source literal in a float position is.

[[tests]]
name = "entry_args.integer_hex"
desc = "An integer parameter reads a hexadecimal token as the language does (`--arg n=0x10` is 16), and a float parameter reads one too (`--arg rate=0xFF` is 255.0), because a source literal in those positions does (H15h)."
kind = "behavior"
case = "../../../cases/compile/entry_args/scalars.cml"
args = ["${case}", "--arg", "n=0x10", "--arg", "rate=0xFF", "--arg", "name=hi", "--arg", "loud=true"]
expect_exit = 17
expect_stdout_contains = ["hi 16 255.0 true"]
expect_output_not_contains = ["Error"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.integer_leading_zero_is_decimal"
desc = "A leading-zero decimal is data text: `--arg n=077` is 77, not the octal 63 a source literal would spell `0o77`, and a float parameter reads the same 77.0 (H15i; reference 2.5.2)."
kind = "behavior"
case = "../../../cases/compile/entry_args/scalars.cml"
args = ["${case}", "--arg", "n=077", "--arg", "rate=077", "--arg", "name=hi", "--arg", "loud=true"]
expect_exit = 78
expect_stdout_contains = ["hi 77 77.0 true"]
expect_output_not_contains = ["63"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.integer_binary_value"
desc = "A binary token is read as the language reads it (`0b1010` is 10), and a real token that fits prints as itself (`0.5`)."
kind = "behavior"
case = "../../../cases/compile/entry_args/scalars.cml"
args = ["${case}", "--arg", "n=0b1010", "--arg", "rate=0.5", "--arg", "name=hi", "--arg", "loud=true"]
expect_exit = 11
expect_stdout_contains = ["hi 10 0.5 true"]
expect_output_not_contains = ["Error"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.integer_bases_at_width"
desc = "An integer token is read at the declared width too: `0x7FFFFFFF` is the largest i32, and `0xFF` is a float, each converted once (H15h)."
kind = "behavior"
case = "../../../cases/compile/entry_args/widths.cml"
args = ["${case}", "--arg", "n=0x7FFFFFFF", "--arg", "rate=0xFF"]
expect_exit = 0
expect_stdout_contains = ["2147483647 255.0"]
expect_output_not_contains = ["Error"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.leading_zero_decimal_is_data_text"
desc = "`09` is data text, not a source literal: the entry reader reads it as the decimal 9, while the source lexer refuses `09` as one run (H15i; the two readers differ only in the two supplements of reference 2.5.2)."
kind = "behavior"
case = "../../../cases/compile/entry_args/scalars.cml"
args = ["${case}", "--arg", "n=09", "--arg", "rate=0.5", "--arg", "name=hi", "--arg", "loud=true"]
expect_exit = 10
expect_stdout_contains = ["hi 9 0.5 true"]
expect_output_not_contains = ["Error"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.int_exponent_refused"
desc = "`1e3` is a real token, not an integer one; an integer parameter refuses it, as `let n: int = 1e3` does (H15h: an entry argument is the token a literal is)."
kind = "behavior"
case = "../../../cases/compile/entry_args/scalars.cml"
args = ["${case}", "--arg", "n=1e3", "--arg", "rate=0.5", "--arg", "name=hi", "--arg", "loud=true"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 7
expect_output_contains = ["Cannot bind the argument 'n' of 'main': Cannot convert the string '1e3' to int"]
expect_output_not_contains = ["hi "]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.integer_too_large_for_float_refused"
desc = "An integer token whose value does not fit the int64 an integer literal is refused, naming the integer's range, not read as a float that could hold its magnitude: a source literal is refused the same way (H15h)."
kind = "behavior"
case = "../../../cases/compile/entry_args/scalars.cml"
args = ["${case}", "--arg", "n=3", "--arg", "rate=0xFFFFFFFFFFFFFFFF", "--arg", "name=hi", "--arg", "loud=true"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 7
expect_output_contains = ["Cannot bind the argument 'rate' of 'main': Cannot convert '0xFFFFFFFFFFFFFFFF' to float: the value is outside the range of an integer (-9223372036854775808 to 9223372036854775807)"]
expect_output_not_contains = ["hi 3"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.float_hex_fraction_refused"
desc = "A hexadecimal fraction without the `p` exponent (`0x1.8`) is not a number token: the language has no hexadecimal float, and a hexadecimal integer token has no point (H15h)."
kind = "behavior"
case = "../../../cases/compile/entry_args/scalars.cml"
args = ["${case}", "--arg", "n=3", "--arg", "rate=0x1.8", "--arg", "name=hi", "--arg", "loud=true"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 7
expect_output_contains = ["Cannot bind the argument 'rate' of 'main': Cannot convert the string '0x1.8' to float"]
expect_output_not_contains = ["hi 3"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.float_leading_space_refused"
desc = "A number text has no blanks: a leading space is refused by the whole-token parser (strtod used to skip it)."
kind = "behavior"
case = "../../../cases/compile/entry_args/scalars.cml"
args = ["${case}", "--arg", "n=3", "--arg", "rate= 0.5", "--arg", "name=hi", "--arg", "loud=true"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 7
expect_output_contains = ["Cannot bind the argument 'rate' of 'main': Cannot convert the string ' 0.5' to float"]
expect_output_not_contains = ["hi 3"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.float_trailing_space_refused"
desc = "A number text has no blanks: a trailing space is refused."
kind = "behavior"
case = "../../../cases/compile/entry_args/scalars.cml"
args = ["${case}", "--arg", "n=3", "--arg", "rate=0.5 ", "--arg", "name=hi", "--arg", "loud=true"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 7
expect_output_contains = ["Cannot bind the argument 'rate' of 'main': Cannot convert the string '0.5 ' to float"]
expect_output_not_contains = ["hi 3"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.float_overflow_refused"
desc = "A number too large for the declared float is a value that does not fit, refused rather than read as infinity: the message says it is out of range and names the range, not that it is not a number."
kind = "behavior"
case = "../../../cases/compile/entry_args/scalars.cml"
args = ["${case}", "--arg", "n=3", "--arg", "rate=1e9999", "--arg", "name=hi", "--arg", "loud=true"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 7
expect_output_contains = ["Cannot bind the argument 'rate' of 'main': Cannot convert '1e9999' to float: the value is outside the range of float (at most about 1.8e308 in magnitude)"]
expect_output_not_contains = ["hi 3"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.float_underflow_refused"
desc = "A nonzero real token too small to tell from zero is refused, not read as 0.0: the same rule a source literal and a conversion function apply (H15i, which supersedes H15h's zero for this case)."
kind = "behavior"
case = "../../../cases/compile/entry_args/scalars.cml"
args = ["${case}", "--arg", "n=3", "--arg", "rate=1e-9999", "--arg", "name=hi", "--arg", "loud=true"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 7
expect_output_contains = ["Cannot bind the argument 'rate' of 'main': Cannot convert '1e-9999' to float: the value is too small for float (the nearest value is zero)"]
expect_output_not_contains = ["hi 3 0.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.int_overflow_refused"
desc = "An integer text that is a number but does not fit int is refused as out of range, with the range in the message; it is not 'not an integer'."
kind = "behavior"
case = "../../../cases/compile/entry_args/scalars.cml"
args = ["${case}", "--arg", "n=99999999999999999999", "--arg", "rate=0.5", "--arg", "name=hi", "--arg", "loud=true"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 7
expect_output_contains = ["Cannot bind the argument 'n' of 'main': Cannot convert '99999999999999999999' to int: the value is outside the range of int (-9223372036854775808 to 9223372036854775807)"]
expect_output_not_contains = ["hi "]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.i32_boundaries_fit"
desc = "An `i32` parameter is read as an int32 and an `f32` as a float all the way (H15g): the boundary values of each fit and are converted once, at the declared width. 2147483647 is the largest i32 and 3.4028235e38 the largest f32 (printed as its shortest round-trip text)."
kind = "behavior"
case = "../../../cases/compile/entry_args/widths.cml"
args = ["${case}", "--arg", "n=2147483647", "--arg", "rate=3.4028235e38"]
expect_exit = 0
expect_stdout_contains = ["2147483647 3.4028235e+38"]
expect_output_not_contains = ["Error"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.i32_min_and_f32_subnormal_fit"
desc = "The smallest i32 and the smallest positive f32 (a subnormal, 1.4e-45) fit: the width rule refuses a value the type cannot hold, not every value near its end."
kind = "behavior"
case = "../../../cases/compile/entry_args/widths.cml"
args = ["${case}", "--arg", "n=-2147483648", "--arg", "rate=1.4e-45"]
expect_exit = 0
expect_stdout_contains = ["-2147483648 1e-45"]
expect_output_not_contains = ["Error"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.i32_overflow_refused"
desc = "3000000000 is a number an `i32` cannot hold: it is refused as out of range, naming the declared type `i32` and its range, not read as an int64 and narrowed (H15g)."
kind = "behavior"
case = "../../../cases/compile/entry_args/widths.cml"
args = ["${case}", "--arg", "n=3000000000", "--arg", "rate=0.5"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 8
expect_output_contains = ["Cannot bind the argument 'n' of 'main': Cannot convert '3000000000' to i32: the value is outside the range of i32 (-2147483648 to 2147483647)"]
expect_output_not_contains = ["2147483647 0.5"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.i32_underflow_refused"
desc = "-2147483649 is one below the smallest i32: refused as out of range, naming `i32` and its range."
kind = "behavior"
case = "../../../cases/compile/entry_args/widths.cml"
args = ["${case}", "--arg", "n=-2147483649", "--arg", "rate=0.5"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 8
expect_output_contains = ["Cannot convert '-2147483649' to i32: the value is outside the range of i32 (-2147483648 to 2147483647)"]
expect_output_not_contains = ["2147483647 0.5"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "entry_args.i32_not_a_number_names_i32"
desc = "Text that is not an integer names the declared type too: the cause is InvalidNumberText and the message says `i32`."
kind = "behavior"
case = "../../../cases/compile/entry_args/widths.cml"
args = ["${case}", "--arg", "n=three", "--arg", "rate=0.5"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::EntryArgumentInvalid"
expect_diagnostic_line = 8
