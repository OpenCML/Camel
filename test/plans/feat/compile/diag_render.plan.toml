id = "compile.diag_render"
order = 328
tier = "feat"
tags = ["feat", "compile", "diagnostics"]

[[tests]]
name = "render.syntax_missing_paren"
desc = "An unclosed '(' is MissingClosingDelimiter at the token where the parser gave up, with the '(' as a secondary location."
kind = "snapshot"
case = "../../../cases/compile/diag_render/syntax_missing_paren.cml"
args = ["--error-format", "text", "${case}"]
expect_exit = 1
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
golden = "golden/diag_render/syntax_missing_paren.txt"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

