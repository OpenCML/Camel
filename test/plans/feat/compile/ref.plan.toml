# ---- two references are two resources ----

[[tests]]
name = "ref.content_survives_collection"
desc = "A reference keeps its content across collections, including a value written into the box after the box's handle was promoted. The box is a C++ object the collector does not walk, so this is what its own root is for; under `--gc-stress` and `--gc-check verify=both,poison` a missing root reads a wrong value here."
kind = "behavior"
case = "../../../cases/compile/ref/ref_content_survives.cml"
backends = ["nvm", "fvm", "jit", "prl"]
args = ["--gc-stress", "alloc=3,safepoint=1,kind=both", "--gc-check", "poison,verify=both", "--gc", "generational", "${case}", "${backend}"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
verify_script = '''
({ input, assert }) => {
  const out = input.normalized.stdout
  const said = input.normalized.output.replace(/\n/g, ' | ')
  assert(out === '100000\nearly\npair 3\nwritten after the box was promoted\n',
    'every content is what was written, across the collections: ' + JSON.stringify(out) +
    ' exit=' + input.exit_code + ' output=' + said)
}
'''

[[tests]]
name = "ref.boxes_are_counted"
desc = "A box's whole lifetime is a count, so the count is read: `--gc-check foreign` prints the blocks made, released and still live when the program stops. A thousand boxes are made and one is kept. The case holds the runtime to the arithmetic -- every box counted (`created` >= 1001), each block released or live and counted once (`created` = `released` + `live`), and the exit releasing exactly what was live (`disposed` = `live`) -- and not to one number: `released` is what a running collection freed, and the backends do not agree on it (an interpreter may still reach a box through the frame that made it)."
kind = "behavior"
case = "../../../cases/compile/ref/ref_boxes_are_counted.cml"
backends = ["nvm", "fvm", "jit", "prl"]
args = ["--gc-stress", "alloc=7,safepoint=3,kind=both", "--gc-check", "foreign,verify=both", "--gc", "generational", "${case}", "${backend}"]
backends_agree = ["exit_code"]
expect_exit = 0
verify_script = '''
({ input, assert }) => {
  const out = input.normalized.stdout
  const said = input.normalized.output.replace(/\n/g, ' | ')
  assert(out.startsWith('499500\n20000\n41\n'),
    'the program ran: ' + JSON.stringify(out) + ' exit=' + input.exit_code + ' output=' + said)
  const line = out.split('\n').find(l => l.startsWith('FOREIGN_RESOURCES '))
  assert(line !== undefined, 'the counted blocks are read at exit: ' + said)
  const counts = Object.fromEntries(
    line.trim().split(' ').slice(1).map(w => w.split('=')).map(([k, v]) => [k, Number(v)]))
  assert(counts.created >= 1001,
    'every box the program made, and the one it kept, was counted: ' + line)
  assert(counts.released + counts.live === counts.created,
    'each block is released or live, and counted once: ' + line)
  assert(counts.disposed === counts.live,
    'the process releases exactly the blocks still live when it stopped: ' + line)
}
'''

[[tests]]
name = "ref.boxes_loop_ten"
desc = "The same place makes ten boxes, one per element of a range, and each is dead when its element is done. `--gc-check foreign` reads the counters at exit: the boxes went (`released` >= 1) and the ones still counted are not the range's (`live` <= 10). `ref.boxes_loop_thousand` is the same program over a range a hundred times longer, and its `live` is read beside this one's: a mechanism that never freed anything while the program ran would answer the longer range with a hundred times more live blocks."
kind = "behavior"
case = "../../../cases/compile/ref/ref_boxes_loop_ten.cml"
backends = ["nvm", "fvm", "jit", "prl"]
args = ["--gc-stress", "alloc=7,safepoint=3,kind=both", "--gc-check", "foreign,verify=both", "--gc", "generational", "${case}", "${backend}"]
backends_agree = ["exit_code"]
expect_exit = 0
verify_script = '''
({ input, assert }) => {
  const out = input.normalized.stdout
  const said = input.normalized.output.replace(/\n/g, ' | ')
  assert(out.startsWith('10 41\n'),
    'the program ran: ' + JSON.stringify(out) + ' exit=' + input.exit_code + ' output=' + said)
  const line = out.split('\n').find(l => l.startsWith('FOREIGN_RESOURCES '))
  assert(line !== undefined, 'the counted blocks are read at exit: ' + said)
  const counts = Object.fromEntries(
    line.trim().split(' ').slice(1).map(w => w.split('=')).map(([k, v]) => [k, Number(v)]))
  assert(counts.created >= 11, 'every box was counted: ' + line)
  assert(counts.released >= 1, 'the boxes of the elements that are done went: ' + line)
  assert(counts.live <= 10, 'the ones still counted are not the whole range: ' + line)
  assert(counts.released + counts.live === counts.created, 'each block is released or live: ' + line)
  assert(counts.disposed === counts.live, 'the exit releases what was still live: ' + line)
}
'''

[[tests]]
name = "ref.boxes_loop_thousand"
desc = "The same program as `ref.boxes_loop_ten` over a range a hundred times longer: a thousand boxes made in one place, one per element, dead when the element is done. The judgement is the pair of readings: `live` here must be the size of `live` there (not a hundred times it) while the thousand are released (`released` >= 900), because a box is freed when its last handle goes and the element's handle goes with the element."
kind = "behavior"
case = "../../../cases/compile/ref/ref_boxes_loop_thousand.cml"
backends = ["nvm", "fvm", "jit", "prl"]
args = ["--gc-stress", "alloc=7,safepoint=3,kind=both", "--gc-check", "foreign,verify=both", "--gc", "generational", "${case}", "${backend}"]
backends_agree = ["exit_code"]
expect_exit = 0
verify_script = '''
({ input, assert }) => {
  const out = input.normalized.stdout
  const said = input.normalized.output.replace(/\n/g, ' | ')
  assert(out.startsWith('1000 41\n'),
    'the program ran: ' + JSON.stringify(out) + ' exit=' + input.exit_code + ' output=' + said)
  const line = out.split('\n').find(l => l.startsWith('FOREIGN_RESOURCES '))
  assert(line !== undefined, 'the counted blocks are read at exit: ' + said)
  const counts = Object.fromEntries(
    line.trim().split(' ').slice(1).map(w => w.split('=')).map(([k, v]) => [k, Number(v)]))
  assert(counts.created >= 1001, 'every box was counted: ' + line)
  assert(counts.released >= 900,
    'the boxes of the elements that are done went while the program ran: ' + line)
  assert(counts.live <= 10,
    'the ones still counted are as many as the ten-element run made, not a hundred times more: ' + line)
  assert(counts.released + counts.live === counts.created, 'each block is released or live: ' + line)
  assert(counts.disposed === counts.live, 'the exit releases what was still live: ' + line)
}
'''

# red by new item 5 (plan-side last-use analysis); remove when it lands, then tighten live <= 3 to an
