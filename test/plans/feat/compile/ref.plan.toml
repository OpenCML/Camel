[[tests]]
name = "ref.boxes_made_per_call_ten"
desc = "`live` = 0 is not reached: a call makes a box and drops it, ten times over, and 2 blocks are still counted at the return of the run (3 on nvm), because the count of a counted value does not follow its holders yet. What this entry asserts instead: `created` >= 11, `created` = `released` + `live`, and `live` <= 3. Its pair `ref.boxes_made_per_call_thousand` is the same program over a range a hundred times longer and reads the same size, so the number of live blocks does not follow the number of calls whose boxes are over."
kind = "behavior"
case = "../../../cases/compile/ref/ref_boxes_made_per_call_ten.cml"
backends = ["nvm", "fvm", "jit", "prl"]
args = ["--gc-stress", "alloc=7,safepoint=3,kind=both", "--gc-check", "foreign,verify=both", "--gc", "generational", "${case}", "${backend}"]
backends_agree = ["exit_code"]
expect_exit = 0
verify_script = '''
({ input, assert }) => {
  const out = input.normalized.stdout
  const said = input.normalized.output.replace(/\n/g, ' | ')
  assert(out.startsWith('10 41\n'),
    'the program ran: ' + JSON.stringify(out) + ' exit=' + input.exit_code + ' output=' + said)
  const counted = (prefix) => {
    const line = out.split('\n').find(l => l.startsWith(prefix))
    assert(line !== undefined, 'the counted blocks are read (' + prefix.trim() + '): ' + said)
    return Object.fromEntries(
      line.trim().split(' ').slice(1).map(w => w.split('=')).map(([k, v]) => [k, Number(v)]))
  }
  const atReturn = counted('FOREIGN_RESOURCES_AT_RETURN ')
  assert(atReturn.created >= 11, 'every box was counted: ' + JSON.stringify(atReturn))
  assert(atReturn.live <= 3,
    'nothing accumulated: the live blocks do not follow the calls that are over: ' +
    JSON.stringify(atReturn))
  assert(atReturn.released === atReturn.created - atReturn.live,
    'every other box was released: ' + JSON.stringify(atReturn))
}
'''

