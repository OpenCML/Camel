# `Ref<T>` is a handle the core provides: one resource per value (design principles 3.3, "handle
# types"), created by `ref`, read by `get`, written by `set` and `update`, and passed as a value.
#
# The type's content may be any type but a `Ref`: a reference that can hold a reference would let
# two boxes hold each other's handles, the count would never reach zero, and the program's values
# would no longer be reclaimed by counting alone. The rule looks one layer at a time into what `T`
# holds -- the type itself, a field, an element, a variant's payload, what a function takes and
# returns, and the values a closure captures -- and each of the refusals below has a control
# beside it that must stay legal, so a refusal cannot be green for the wrong reason.
#
# A closure's captures are not in its type, so that part of the walk follows the graph the value
# was built as, and it follows it for as many layers as the chain of captures has: a closure may
# capture a closure that captured a closure, and the reference can be at the bottom. A layer the
# walk cannot read is refused and not passed -- a capture it cannot see may be the one holding the
# reference, and one box that holds one is never freed. `ref.holds_ref_closure_deep` and
# `ref.holds_ref_closure_unreadable` are the two halves of that: a reference three layers down, and
# a capture whose graph is the caller's, both of which used to compile and run with no report.
#
# The same is true wherever the closure sits: a record's field, a tuple's part, an array's element,
# and any nesting of those hold the closure instead of the box holding it directly, and the type
# walk says only that a function is in there. Those three are the members of one `FILL` node, so
# the walk reads them the same way and reaches the closure wherever it is; a container it cannot
# read and cannot show to hold no function is refused too. `ref.holds_ref_closure_in_struct`,
# `ref.holds_ref_closure_in_collection` and `ref.holds_ref_closure_in_struct_unreadable` are the
# three containers, again with a control beside them.
#
# Two references made in one body are two resources: no order edge joins the operations on one to
# the operations on the other, while two operations on one reference keep the order they are
# written in. One entry runs the program (the read of `same` answers 22 only if the order is
# there) and the `inspect --gir` entry reads the edges themselves: that reading would silently
# disappear -- with nothing failing -- if the operations were put back on one module cell.
#
# `state.cml` declares the operators; the kernels are C++ (modules/state). The four operations
# declare what they touch on the handle (operator contract), so `get` is a read and `set`/`update`
# are writes of the resource the handle value names.

id = "compile.ref"
order = 1011
tier = "fast"
tags = ["feat", "compile", "effects", "state", "ref"]

[defaults]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 20000

# ---- the content: any type, and the reference's own resource ----

[[tests]]
name = "ref.float"
desc = "A reference holds a float: `ref` takes the value, `get` reads it, `set` writes it and `update` advances it with a `pure` function of the content. The old library version admitted `int` only."
kind = "behavior"
case = "../../../cases/compile/ref/ref_float.cml"
backends = ["nvm", "fvm", "jit", "prl"]
args = ["${case}", "${backend}"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
verify_script = '''
({ input, assert }) => {
  const out = input.normalized.stdout
  const said = input.normalized.output.replace(/\n/g, ' | ')
  assert(out === '1.25\n2.5\n5.0\n',
    'the float goes in, comes back, is written and advanced: ' + JSON.stringify(out) +
    ' exit=' + input.exit_code + ' output=' + said)
}
'''

