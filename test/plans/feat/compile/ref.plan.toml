# ---- the content: no Ref, one layer at a time ----

[[tests]]
name = "ref.holds_ref"
desc = "`Ref<Ref<int>>` is refused where the outer reference is made, by name: the content is a reference itself. The report says what the rule is (the count would never reach zero), not that two types did not match."
kind = "negative"
case = "../../../cases/compile/ref/err_holds_ref.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::RefContentHoldsRef"
expect_diagnostic_code = "0x03000211"
verify_script = '''
({ input, assert }) => {
  const text = ((input.output || '') + ' ' + (input.stderr || '')).replace(/\s+/g, ' ')
  assert(text.includes("cannot be the content of a reference"), 'the report states the rule: ' + text)
  assert(text.includes('it holds a Ref'), 'the reason is a Ref inside the content: ' + text)
  assert(text.includes('reclaimed by counting'), 'the consequence is named: ' + text)
}
'''

[[tests]]
name = "ref.holds_ref_closure"
desc = "A closure that holds a reference is a content that holds a reference, so putting it into a reference is refused. A function type does not spell its captures, so the refusal follows the value into the closure it is and names what the closure captures."
kind = "negative"
case = "../../../cases/compile/ref/err_holds_ref_closure.cml"
args = ["${case}"]
expect_exit = 1
