# The transpose of the array product (`stdlib/rulesets/transpose.cml#mul_tensor_t`), which is the
# adjoint of the forward rule `rulesets.jvp` files as `jvp_mul_tensor`. The two cases are one law
# read from both ends: the pullback of `sum(xs * w)` answering both operands, and the forward
# tangent paired with that cotangent at one point -- the same number twice, if the law is the
# adjoint of the product rule and not merely a plausible one.
[[tests]]
name = "transpose_array_product.answers_both_operands"
desc = "`x * w` on two arrays is `tensor:multiply`, which the scalar `mul_t` does not reach: `x * w` at `T` is `:op/mul_d`, a different operator under a different key. The family now files the array product under the key the core names for it (`mul_tensor`, `ruleKeyExceptions`), and the pullback answers both names of the left side in its order, each with the operand's own shape: `ct * w` for `xs`, `ct * xs` for `w`. `transpose` takes a function whose result is a number -- its signature says so -- so the reading sums the product: `f(xs, w) = sum(xs * w)`, and at xs = (1, 2, 3), w = (2, 3, 4) the value is 20, the cotangent of `xs` is (2, 3, 4) and the cotangent of `w` is (1, 2, 3). `numel` is read before each answer because a cotangent with the right digits in the wrong shape is still the wrong answer."
kind = "behavior"
case = "../../../cases/compile/transforms/transpose_array_product.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_stdout_contains = ["value = 20.0", "d/dxs numel = 3", "d/dxs = 2.0 3.0 4.0", "d/dw numel = 3", "d/dw = 1.0 2.0 3.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
known_fail = ["nvm"]
known_fail_owner = "lane-fwdclosure"
known_fail_reason = "the transposed backward half stops at `skip=cotangent-needs-a-value uri=tensor:multiply position=0`: the product's law needs the other operand's value, which is a forward-half value the backward half closed over, and a transposition is handed the cotangent and no operand"
known_fail_msg = "skip=cotangent-needs-a-value uri=tensor:multiply position=0"
known_fail_note = "Waits on the author's ruling on docs/handover/questions/2026-11-04-does-a-closure-members-cotangent-have-a-slot.cn.md (does a closure member's cotangent have a slot?). A ruling of `乙` -- the member gets a slot -- flips about 16 cases, this one among them. Measured 2026-11-04 on the integration branch: the transposed backward half stops at `skip=cotangent-needs-a-value uri=tensor:multiply position=0 reason=the rule's right side reads a value the caller does not carry` -- the value the law needs for the other operand is a forward-half value the backward half closed over, and a transposition is handed the cotangent and no operand. The mark goes away in the commit that answers the page; the expected numbers are that answer's, not a different law's."

[[tests]]
name = "jvp_vjp_array_product.one_point_two_ends"
desc = "The two rules of the array product at one point, which is what makes `mul_tensor_t` the adjoint of `jvp_mul_tensor` and not a second guess at it. For `f(xs, w) = sum(xs * w)` at xs = (1, 2, 3), w = (2, 3, 4), dxs = (1, -1, 2), dws = (0, 1, -1) and ct = 1, the value is `sum(xs*w)` = 20, the forward tangent is `sum(dxs*w) + sum(xs*dws)` = 7 - 1 = 6, and the pullback's cotangents are `w` = (2, 3, 4) for `xs` and `xs` = (1, 2, 3) for `w`, which pair with the tangents to that same 6. The two numbers are printed one under the other, so the case reads the identity `<jvp tangent, ct> = <dxs, d/dxs> + <dws, d/dw>` rather than asserting that a gradient exists."
kind = "behavior"
case = "../../../cases/compile/transforms/jvp_vjp_array_product_cross.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_stdout_contains = ["value = 20.0", "forward  <jvp tangent, ct> = 6.0", "backward <dxs, d/dxs> + <dws, d/dw> = 6.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
known_fail = ["nvm"]
known_fail_owner = "lane-fwdclosure"
known_fail_reason = "the same wall read from the forward end: the transposed half stops at `skip=cotangent-needs-a-value uri=tensor:multiply position=0`, because the product's law reads the other operand's value and a transposition is handed the cotangent and no operand"
known_fail_msg = "skip=cotangent-needs-a-value uri=tensor:multiply position=0"
known_fail_note = "Waits on the author's ruling on docs/handover/questions/2026-11-04-does-a-closure-members-cotangent-have-a-slot.cn.md (does a closure member's cotangent have a slot?). A ruling of `乙` -- the member gets a slot -- flips about 16 cases, this one among them. Measured 2026-11-04 on the integration branch: the transposed backward half stops at `skip=cotangent-needs-a-value uri=tensor:multiply position=0 reason=the rule's right side reads a value the caller does not carry` -- the value the law needs for the other operand is a forward-half value the backward half closed over, and a transposition is handed the cotangent and no operand. The mark goes away in the commit that answers the page; the expected numbers are that answer's, not a different law's."
