[[tests]]
name = "err_literal_length"
desc = "Three elements written where the parameter states four are refused at the literal: the length a position states is exact, and a literal's elements are known where it is written. The refusal is the call's own NoMatchingFunction, whose candidate list is the evidence that no parameter takes the argument (the diagnostic is written over several lines, so its name is not asserted)."
kind = "negative"
case = "../../../../cases/compile/array_shape/err_literal_length.cml"
args = ["${case}", "std::nvm"]
expect_exit = 1
expect_output_contains = ["count: (x: f32[4]) => int"]
