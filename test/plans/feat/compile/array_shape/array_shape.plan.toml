[[tests]]
name = "let_named_dimension_on_the_graph"
desc = "The graph of the same program: the literal is a DATA of the shape its elements give it and a CAST to the declared `f32[n]` binds the name to that type -- a named dimension makes no instance, so the declaration's own graph states the extent the call supplies and the conversion is checked when it runs."
kind = "behavior"
case = "../../../../cases/compile/array_shape/let_named_dimension.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
  const lines = input.normalized.stdout.split(String.fromCharCode(10))
  const casts = lines.filter((l) => l.includes('type="CAST"') && l.includes('value_type="f32[n]"'))
  assert(casts.length === 1, `no CAST to f32[n]: ${lines.filter((l) => l.includes('type="CAST"')).join(' | ')}`)
  const ports = lines.filter((l) => l.includes('value_type="f32[n]"'))
  assert(ports.length >= 2, `the parameter and the binding are not f32[n]: ${ports.join(' | ')}`)
}
"""
timeout_ms = 8000

