[[tests]]
name = "any_typing.recommended_forms"
desc = "The forms AnyNotAllowed recommends work where `any` used to be written: a type parameter for a parameter, a `with` parameter and the result of a function-typed parameter; an inferred return type; a tuple and a struct for values of different types."
kind = "behavior"
case = "../../../cases/compile/any_typing/recommended_forms.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_starts_with = "abc1 2.5\n(1, t) (2, [1, 2])\nn4 true\n3\n(1, one) pq\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

