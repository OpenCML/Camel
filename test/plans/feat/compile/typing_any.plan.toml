id = "compile.typing_any"
order = 140
tier = "fast"
tags = ["feat", "compile", "diagnostics", "any"]

# `any` (design principles 5.10). It is not a type today:
# writing it is an ordinary unknown name. The remaining cases are reproducers of defects of the
# study (appendix B) from when a slot could be typed `any` — it recorded nothing about what
# entered it, so reading it as a type of its own crashed or retyped a value silently.

[[tests]]
name = "any_typing.cast_out"
desc = "Nothing reads a decoded value as another type unchecked. `decode(text) as string` was `any` read as a string: the decoded 12345 was followed as an address (segmentation fault; `12345 as any as string` alike). decode gives a `Json` now, which converts to nothing."
kind = "negative"
case = "../../../cases/compile/any_typing/cast_out.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::DynamicCastForbidden"
expect_diagnostic_code = "0x03000017"
expect_diagnostic_line = 10
expect_diagnostic_column = 13
expect_output_contains = ["Dynamic cast from 'Json' to 'string' is not allowed."]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 4000

[[tests]]
name = "any_typing.if_condition"
desc = "A decoded value as the condition of an `if` (defect D5: as an `any` its slot was read as a bool). It is a `Json` now, and a condition is a bool."
kind = "negative"
case = "../../../cases/compile/any_typing/if_condition.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ConditionNotBool"
expect_diagnostic_code = "0x030000E3"
expect_diagnostic_line = 8
expect_diagnostic_column = 16
expect_output_contains = ["The condition of this 'if' has type 'Json'; a condition is a 'bool'."]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 4000

[[tests]]
name = "any_typing.match_subject"
desc = "A decoded value as the subject of a `match` on literals (defect D5: as an `any` it was compared bit for bit, a string by address). It is a `Json` now, and a case has the type of the value matched."
kind = "negative"
case = "../../../cases/compile/any_typing/match_subject.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::MatchCaseTypeMismatch"
expect_diagnostic_code = "0x030000E4"
expect_diagnostic_line = 10
expect_diagnostic_column = 14
expect_output_contains = ["This case of a 'match' on a value of type 'Json' is a value of type 'int'."]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 4000

[[tests]]
name = "any_typing.array_literal"
desc = "A computed element whose type is not the one the literal elements fixed is an element type mismatch, reported at the element (defect D2: `[wrap_s('ab'), 5]` was an `int[]` whose first element was the string's address; the same held for a `string` element)."
kind = "negative"
case = "../../../cases/compile/any_typing/array_literal.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ElementTypeMismatch"
expect_diagnostic_line = 10
expect_diagnostic_column = 14
expect_output_contains = ["Cannot insert data of type 'Json' into a(n) array with element type 'int'."]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 4000

[[tests]]
name = "any_typing.nullable_box"
desc = "A value entering a `T?` is boxed, so `??` opens a real box (defect D1: an `any` entering `any?` was passed on unboxed and `??` read 7 as the address of a box, segmentation fault). decode gives a `Json` now."
kind = "behavior"
case = "../../../cases/compile/any_typing/nullable_box.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_starts_with = "7"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

[[tests]]
name = "any_typing.array_literal_string"
desc = "Defect D2 without `any`: `[s, 5]` with `s: string` is an element type mismatch; it was an `int[]` holding the string's address."
kind = "negative"
case = "../../../cases/compile/any_typing/array_literal_string.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ElementTypeMismatch"
expect_output_contains = ["Cannot insert data of type 'string' into a(n) array with element type 'int'."]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 4000

[[tests]]
name = "any_typing.encode_function"
desc = "json encode takes the types with a JSON form by a type rule instead of a parameter of type `any` (design principles 5.10); a function is refused when the call is compiled. It used to compile and fault at run time."
kind = "negative"
case = "../../../cases/compile/any_typing/encode_function.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["encode_function.cml:10:19", "No matching function found for argument types: <> ((x: int) => int)", "<json:encode>: (value: T) => string", "name=SemanticDiag::NoMatchingFunction"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 4000

[[tests]]
name = "any_typing.placeholders"
desc = "string(x), println, format and json encode, whose signatures used `any` as a placeholder, take each argument with its own static type (type rules; the signature texts use type variables)."
kind = "behavior"
case = "../../../cases/compile/any_typing/placeholders.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  'true [1, 2] (1, a) { k: 2.5 }',
  '41',
  '42',
  '[1] and (2, b)',
  '{"a":[1,2],"b":[true,"x"]} [',
  '  1.5',
  ']',
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 4000

[[tests]]
name = "any_typing.written_unknown_name"
desc = "`any` is an ordinary unknown type name outside a declaration's parameter and result types, where a name that is not a type binds a type variable (design principles 5.5): writing it in a `let` gives UnresolvedTypeReference (5.10). There is no diagnostic for it (AnyNotAllowed was deleted)."
kind = "negative"
case = "../../../cases/compile/any_typing/written_unknown_name.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::UnresolvedTypeReference"
expect_diagnostic_code = "0x0300000A"
expect_diagnostic_line = 7
expect_diagnostic_column = 12
expect_output_contains = ["Unresolved type reference: 'any'."]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 4000

[[tests]]
name = "any_typing.if_condition_string"
desc = "The condition of an `if` is a bool (language reference 6.8.1). Found with defect D5: a string condition used to be compared bit for bit with `true`, silently."
kind = "negative"
case = "../../../cases/compile/any_typing/if_condition_string.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ConditionNotBool"
expect_diagnostic_code = "0x030000E3"
expect_diagnostic_line = 7
expect_diagnostic_column = 16
expect_output_contains = ["The condition of this 'if' has type 'string'; a condition is a 'bool'."]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 4000

[[tests]]
name = "any_typing.match_case_type"
desc = "A case of a `match` has the type of the value matched. Found with defect D5: `case 1` on a string read the integer as a string's address (segmentation fault)."
kind = "negative"
case = "../../../cases/compile/any_typing/match_case_type.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::MatchCaseTypeMismatch"
expect_diagnostic_code = "0x030000E4"
expect_diagnostic_line = 8
expect_diagnostic_column = 14
expect_output_contains = ["This case of a 'match' on a value of type 'string' is a value of type 'int'."]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 4000
