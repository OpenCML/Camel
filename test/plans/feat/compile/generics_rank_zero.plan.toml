id = "compile.generics_rank_zero"
order = 324
tier = "fast"
tags = ["feat", "compile", "generics", "types"]
desc = "An open-rank parameter `T[..]` takes a rank-zero argument -- `T[..]` includes rank 0 and a rank-zero array is that element -- while `T[]` and `float[]` keep refusing one (design principles 5.4)."

[[tests]]
name = "open_rank_takes_rank_zero"
desc = "A generic function's `T[..]` parameter binds its element type from a number and answers the number; the same parameter still takes `float[3]` and `float[]`."
kind = "behavior"
case = "../../../cases/compile/generic_open_rank_rank_zero.cml"
args = ["${case}", "std::fvm"]
expect_exit = 0
expect_stdout_exact = "sum_to(6.0, xs) = 6.0\nsum_to(xs, 6.0) = 6.0\nsum_to(fixed, 6.0) = 6.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "closed_rank_still_rejects_rank_zero"
desc = "`T[]` states one dimension, so a number does not bind its element type: the call is a type mismatch, not a silent acceptance."
kind = "negative"
case = "../../../cases/compile/generic_closed_rank_rejects_rank_zero.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::NoMatchingFunction"
expect_output_contains = ["(float)", "take_first: (xs: T[]) => int"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "written_rank_still_rejects_rank_zero"
desc = "A non-generic parameter `float[]` keeps refusing a number, in the same words as before this edge existed."
kind = "negative"
case = "../../../cases/compile/closed_rank_rejects_rank_zero.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::NoMatchingFunction"
expect_output_contains = ["(float)", "first: (t: float[]) => float"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000