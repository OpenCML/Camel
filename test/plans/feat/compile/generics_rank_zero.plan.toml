id = "compile.generics_rank_zero"
order = 324
tier = "fast"
tags = ["feat", "compile", "generics", "types"]
desc = "An open-rank parameter `T[...]` binds its element type from a rank-zero argument -- `T[...]` includes rank 0 and a rank-zero array is that element -- while `T[]` and `float[]` keep refusing one (design principles 5.4)."

[[tests]]
name = "open_rank_takes_rank_zero"
desc = "A rank-zero argument at the position that binds `T` of `T[...]` is accepted, prints as the element, and the same parameter still takes `float[...]` and `float[3]`."
kind = "behavior"
case = "../../../cases/compile/generic_open_rank_rank_zero.cml"
args = ["${case}", "std::fvm"]
expect_exit = 0
expect_stdout_exact = "ident(6.0) = 6.0\nident(xs) = [1.0, 2.0, 3.0]\nident(fixed) = [1.0, 2.0, 3.0]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "closed_rank_still_rejects_rank_zero"
desc = "`T[]` states one dimension, so a number does not bind its element type: the call is refused as a mismatch of types, in the words a single generic candidate already used."
kind = "negative"
case = "../../../cases/compile/generic_closed_rank_rejects_rank_zero.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::GenericArgumentsMismatch"
expect_output_contains = ["cannot be called with argument types (float)", "its parameter 'xs: T[]' needs a type of that form"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "written_rank_still_rejects_rank_zero"
desc = "A non-generic parameter `float[]` keeps refusing a number, with the same diagnostic and the same overload list as before this edge existed."
kind = "negative"
case = "../../../cases/compile/closed_rank_rejects_rank_zero.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::NoMatchingFunction"
expect_output_contains = ["No matching function found for argument types: <> (float)", "first: (t: float[]) => float"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "broadcast_like_spreads_a_rank_zero_operand"
desc = "A spread is `broadcast_like`'s and not one direction of `sum_to`: a rank-zero operand is an element (design principles 5.4), so it spreads as that value, and a rank-one value spreads along the lanes a rank-two shape states. `sum_to` took both directions until ruling 甲 gave it the extents of a leading-axis reduction only (`stdlib/tensor.cml#sum_to`)."
kind = "behavior"
case = "../../../cases/compile/broadcast_like_spreads_rank_zero.cml"
args = ["${case}", "std::fvm"]
expect_exit = 0
expect_stdout_exact = "broadcast_like(6.0, xs) = [6.0, 6.0, 6.0]\nbroadcast_like(xs, m) = [[1.0, 2.0, 3.0], [1.0, 2.0, 3.0]]\nbroadcast_like(6.0, m) = [[6.0, 6.0, 6.0], [6.0, 6.0, 6.0]]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "sum_to_still_refuses_a_shape_it_cannot_reach"
desc = "Ruling 甲's check as a program can state it: the target extents are a suffix of `t`'s shape, so `[2, 2]` cannot become `[4]`. The refusal names both sides and the position that does not fit -- the tensor is `[2, 2]` and position 1 cannot be 4 -- which is what makes 甲 testable rather than a wording in a comment."
kind = "negative"
case = "../../../cases/compile/sum_to_refuses_a_shape_it_cannot_reach.cml"
args = ["${case}", "std::fvm"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::TensorDimensionMismatch"
expect_output_contains = ["the target extents [4] are not a suffix of the tensor's shape [2, 2]", "position 1 is 4 where the tensor has 2"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "sum_to_refuses_a_target_longer_than_its_operand"
desc = "The other half of the same check, and the direction the operator no longer takes: a target with more axes than the tensor is not a reduction at all -- there are lanes `t` never had -- so it is refused, and the sentence says which side is longer. A value that has to grow is `broadcast_like`'s (see the case above)."
kind = "negative"
case = "../../../cases/compile/sum_to_refuses_a_target_longer_than_its_operand.cml"
args = ["${case}", "std::fvm"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::TensorDimensionMismatch"
expect_output_contains = ["the target extents [2, 3] are not a suffix of the tensor's shape [3]", "the target states 2 axes and the tensor 1"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000