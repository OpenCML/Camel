id = "compile.modules_213"
order = 337
tier = "feat"
tags = ["feat", "compile", "modules"]
desc = "Modules by the rulings of 2026-10-15 (design principles 2.13): a module importing itself, types forming a cycle across modules."

[defaults]
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "Internal"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "modules_213.self_entry"
desc = "The entry module imports itself by its file name, in both forms: allowed, no effect; its names (qualified with its own name or not) stay its own."
kind = "behavior"
case = "../../../cases/compile/modules_213/self_entry.cml"
args = ["-E", "short", "${case}"]
expect_exit = 0
expect_stdout = "8 10\n"
expect_output_not_contains = ["[Warn]", "[Error]"]

[[tests]]
name = "modules_213.self_entry_error"
desc = "A module that imports itself is not loaded a second time: an error of it is reported once, as one of it (it was reported again for the copy, followed by ImportedModuleHasErrors)."
kind = "negative"
case = "../../../cases/compile/modules_213/self_entry_error.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_output_not_contains = ["ImportedModuleHasErrors", "imported by"]
verify_script = """
const errors = input.stdout.concat(input.stderr).split('\n').filter((l) => l.includes('[Error]'))
assert(errors.length === 1, 'one error: ' + input.stdout + input.stderr)
assert(errors[0].includes("Unresolved reference: 'nothing_named_so'"), errors[0])
"""

[[tests]]
name = "modules_213.self_imported"
desc = "An imported module that imports itself: no effect there either."
kind = "behavior"
case = "../../../cases/compile/modules_213/self_imported.cml"
args = ["-E", "short", "${case}"]
expect_exit = 0
expect_stdout = "3\n"

[[tests]]
name = "modules_213.type_cycle"
desc = "Two modules whose types contain each other: ModuleTypeCycle, with the cycle listed, where it closes (it was UnresolvedTypeReference in both modules)."
kind = "negative"
case = "../../../cases/compile/modules_213/type_cycle.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_output_contains = ["name=SemanticDiag::ModuleTypeCycle", "The type 'A' is part of a cycle of types across modules: cycle_a::A -> cycle_b::B -> cycle_a::A."]
expect_output_not_contains = ["UnresolvedTypeReference"]
