id = "compile.modules_213"
order = 337
tier = "fast"
tags = ["feat", "compile", "modules"]
desc = "Modules by the rule (design principles 10.1): a module that imports its own name, types forming a cycle across modules, values exported by a C++ module."

[defaults]
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "Internal"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "modules_213.self_entry"
desc = "A module that imports its own name finds no module: an import never resolves to the importing module itself (design principles 10.2), so with no other location holding the name it is ModuleNotFound, in both forms."
kind = "negative"
case = "../../../cases/compile/modules_213/self_entry.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_output_contains = ["name=SemanticDiag::ModuleNotFound", "Module 'self_entry' not found"]

[[tests]]
name = "modules_213.type_cycle"
desc = "Two modules whose types contain each other: ModuleTypeCycle, with the cycle listed, where it closes (it was UnresolvedTypeReference in both modules)."
kind = "negative"
case = "../../../cases/compile/modules_213/type_cycle.cml"
args = ["-E", "short", "${case}"]
expect_exit = 1
expect_output_contains = ["name=SemanticDiag::ModuleTypeCycle", "The type 'A' is part of a cycle of types: cycle_a::A -> cycle_b::B -> cycle_a::A."]
expect_output_not_contains = ["UnresolvedTypeReference"]

[[tests]]
name = "modules_213.values_cpp"
desc = "A C++ module exports values: `math::pi`, `e`, `inf`, `nan` are written without parentheses, through the module name, imported by name, in a function and in a typed `let`."
kind = "behavior"
case = "../../../cases/compile/modules_213/values_cpp.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "3.141592653589793 true 1.0\n12.566370614359172 true true true\n6.283185307179586\n"

[[tests]]
name = "modules_213.values_cpp.folded"
desc = "A use of a C++ module's value is a constant of the graph where it is used: std::opt folds `2.0 * pi` like a literal."
kind = "behavior"
case = "../../../cases/compile/modules_213/values_cpp.cml"
args = ["${case}", "std::opt", "std::fvm"]
expect_exit = 0
expect_stdout = "3.141592653589793 true 1.0\n12.566370614359172 true true true\n6.283185307179586\n"
