# The head's phi read off the graph itself: the LOOP node has two normal inputs (the declared `i`
# and the name's entry value), and its body region hands back one value -- the back edge -- which is
# not either of them. That is what "the head carries the name as a value" means in the document, and
# it is the shape criterion in a form a machine reads: without the two inputs the name would be a
# constant of the loop; without the region's result the body would not hand anything on.
[[tests]]
name = "var.loop_head_phi_has_two_sources"
desc = "`loop_phi_two_sources.cml` under `std::jgir`: one LOOP node with two normal inputs (the declared `i` and the name's entry value), its `loop_body` region handing back a value that is neither of them, and no `:var/new`/`:var/get` in the graph. The two inputs *and* the region's own result are the phi's two sources; the graph is where they are read."
kind = "behavior"
case = "../../../cases/compile/var/loop_phi_two_sources.cml"
args = ["${case}", "std::jgir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const doc = JSON.parse(input.normalized.stdout)
const graphs = doc.graphs || []
const nodes = graphs.flatMap((g) => g.nodes || [])
const edges = graphs.flatMap((g) => g.edges || [])
const regions = graphs.flatMap((g) => g.regions || [])
const loops = nodes.filter((n) => n.kind === 'LOOP')
assert(loops.length === 1, `one loop head in this program: ${loops.length}`)
const loop = loops[0]
const entry = edges.filter((e) => e.target === loop.id && e.kind === 'normal').map((e) => e.source)
const body = regions.find((r) => r.owner === loop.id && r.kind === 'loop_body')
assert(body !== undefined, `the loop has a body region: ${JSON.stringify(regions.map((r) => [r.kind, r.owner]))}`)
assert(typeof body.result === 'string', `the body region hands a value back: ${JSON.stringify(body)}`)
assert(entry.length === 2, `the entry value and the declared state are the head's two inputs: ${JSON.stringify(entry)}`)
assert(entry.includes(body.result) === false, `the back edge is the body's value and not the entry value (${body.result}): ${JSON.stringify(entry)}`)
const varNodes = nodes.map((n) => String(n.label || '')).filter((l) => l.indexOf(':var/') === 0)
assert(varNodes.length === 0, `the head carries a value, so the graph holds no cell operator: ${varNodes.join(', ')}`)
}
"""
timeout_ms = 30000

# Two names in one head, read off the graph: a branch's join carries one value and a loop head does
# not have that limit, so the two states this body writes are two components of the loop's value and
# neither of them is a cell.
[[tests]]
name = "var.loop_carry_two_names_are_two_states"
desc = "`loop_two_states.cml` under `std::jgir`: one LOOP node with three normal inputs (the declared `i` and the two names' entry values) and no `:var/new`/`:var/get`. Two writes in one round are two states of one head, which is the reading a branch's join cannot have."
kind = "behavior"
case = "../../../cases/compile/var/loop_two_states.cml"
args = ["${case}", "std::jgir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const doc = JSON.parse(input.normalized.stdout)
const graphs = doc.graphs || []
const nodes = graphs.flatMap((g) => g.nodes || [])
const edges = graphs.flatMap((g) => g.edges || [])
const loops = nodes.filter((n) => n.kind === 'LOOP')
assert(loops.length === 1, `one loop head: ${loops.length}`)
const entry = edges.filter((e) => e.target === loops[0].id && e.kind === 'normal').map((e) => e.source)
assert(entry.length === 3, `the declared state and the two written names: ${JSON.stringify(entry)}`)
const varNodes = nodes.map((n) => String(n.label || '')).filter((l) => l.indexOf(':var/') === 0)
assert(varNodes.length === 0, `neither name is a cell: ${varNodes.join(', ')}`)
}
"""
timeout_ms = 30000

# The copies reading is the other half of "one writing": a value that is the loop's state and is
# updated by an append is exactly the shape S3b has to make in-place, and a `copied` here is not a
# red for S3 (that is S3b's criterion) -- but a verdict that differs from the one before this stage
# is a regression, so the summary line is pinned as it stands.
[[tests]]
name = "var.loop_carry_append_copies_verdict"
desc = "`camel inspect --copies` on the append-in-a-loop program: the plan's verdict for the append, pinned. S3 changes the value's shape from a cell to the head's state; the pin is that the verdict it reports stays what it was before the change."
kind = "behavior"
tool = "camel"
case = "../../../cases/compile/var/loop_append_copies.cml"
args = ["inspect", "--copies", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
expect_stdout_matches = ["^COPIES .* updates [0-9]+ in-place [0-9]+ by-count [0-9]+ declared [0-9]+ copied 0$"]
timeout_ms = 30000
