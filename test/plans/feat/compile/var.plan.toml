# --- A `var` written inside a loop body is the loop head's phi (stage S3) -------------------------
#
# The author's third place (design principles 3.5: "a write to an outer `var` in a loop body becomes
# the loop's carried state"). Before S3 a write inside a loop body kept the name a cell for the rest
# of its life: the body's write was a store, the read in the next round was a `:var/get`, and the
# loop's state was the cell. The graph ran -- the readings below were the right numbers before this
# stage too, because a cell with one store per round is a correct program -- and that is exactly why
# the numbers alone are not the acceptance: what S3 changes is *how many writings* one value has.
# The criterion is two-sided and both sides are pinned here:
#
#   * the head carries the name as a value: the LOOP's state is the name, the body's port is the
#     value, a write rebinds it, and no `:var/new` or `:var/get` is in the graph (entries 7 and 8,
#     and `var.a_loop_assignment_is_the_loops_state` above, which is the canonical-graph half);
#   * the value is still the one the program wrote: every number below is the number the cell
#     lowering printed, so the stage bought a shape and not a different answer. The five shapes are
#     one loop and one name (13), two names in one head (3, 8), two heads nested (6), an arm inside
#     a head (22), and a read inside the round that wrote it (1, 2, 3, 3): the `[0, 1, 25, 3]`
#     incident's shape is the last of them, and it is pinned by all four lines rather than one.
#
# The corpus contains no case of this shape -- measured, not assumed: the census after S2 reads
# `var_new=228` and after S3 it is read again, and the number moves by exactly the units these six
# programs have, never by more. These six are therefore the only thing that holds S3 up.
#
#   phi_two_sources   13  the entry value is the last write before the loop (10), not the
#                         initialiser (5); the back edge is 10 + 0 + 1 + 2
#   two_states         3  `a` accumulates `i`: one head, two values, each with its own back edge
#                      8  ... and `b` doubles three times
#   nested             6  three outer rounds of two inner ones: two heads, two phis, one value
#   write_in_an_arm      --  does not compile, before this stage or after it: S2's join inside S3's
#                         head reaches the branch-arm invariant, and the entry is a known failure
#   write_then_read  1,2,3  the value read in the round that wrote it
#                    3  ... and after the loop
#   append             3  the value is an array the body appends to, so the copies reading applies
[[tests]]
name = "var.loop_carry_phi_two_sources"
desc = "`var total = 5; total = total * 2; loop i = 0 while i < 3 do { total = total + i }` then read `total` prints `13`. The head's phi has two sources and both are read: the entry value is 10 (the last write before the loop, not the initialiser 5, which would print 8) and the back edge is 10 + 0 + 1 + 2."
kind = "behavior"
case = "../../../cases/compile/var/loop_phi_two_sources.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
assert(out === '13', `10 before the loop plus 0+1+2 in the body is 13; 8 means the entry value was the initialiser 5, 6/9/11 mean a round's increment went to the head twice or not at all: ${out}`)
}
"""
timeout_ms = 30000

[[tests]]
name = "var.loop_carry_two_states"
desc = "Two `var`s written by one loop body print `3` and `8`: one head carries both, each with its own entry value and its own back edge, so a head is not limited to one carried value the way a branch's join is. `b` reading `a`'s value would print 8 for both, and `a` reading `b`'s would print 3 for both."
kind = "behavior"
case = "../../../cases/compile/var/loop_two_states.cml"
