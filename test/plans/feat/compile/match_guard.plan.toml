id = "compile.match_guard"
order = 345
tier = "fast"
tags = ["feat", "compile", "match", "when"]
desc = "The guard of a `match` case (`case p when c => body`): the case is taken only when its pattern matches and its guard holds, the guard is read in the arm's scope and so sees the names the pattern binds, a guard that does not hold leaves the value to the cases written after it, and a guarded case counts for no exhaustiveness. Before this change the parser read `when` as the second word of the pattern and every case here was a syntax error."

# Each case states what it pins. The guard is lowered into the cases written after it (the value
# is dispatched again there), so the answers below are what the rule says for
# the value the guard refuses, and `std::fvm` must agree with `std::nvm` on all of them: the
# guard reaches the runtime as ordinary control flow, not as a new branch the backends would
# each have to implement.

[defaults]
expect_output_not_contains = ["Segmentation fault", "dumped core", "internal error", "Internal"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 12000

[[tests]]
name = "match_guard.first_match_wins"
desc = "A guard that holds takes its case; a guard that does not leaves the value to the next case, whose pattern may then match (`case 20 when n > 10` on 7, `case true when false` on true, `case null when false` on null, `case _ when n > 100` on 7). The guard reads the names its pattern binds (`case Shape::Rect { w, h } when h == 0.0`, `case Shape::Circle(r) when r > 100.0`, `case v when v > 10`). A case with `|` shares its guard across the alternatives, and `case 0 | 1 when n < 2` is entered on 1. Both backends run it."
kind = "behavior"
case = "../../../cases/compile/match_guard/first_match_wins.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "12.0\n-1.0\n2.0\n-2.0\n0.0\nbig\nfive\ntiny\nsmall\n2\n3\n101\n1\n0\n1\n0\n1\n2\n"

[[tests]]
name = "match_guard.not_exhaustive"
desc = "A guarded case is not a default: a `match` whose only case is `case 1 when n > 0` has no `case _`, and the report is MatchWithoutDefault, listing the type of the value. Used to be a syntax error (`when` read as part of the pattern)."
kind = "negative"
case = "../../../cases/compile/match_guard/not_exhaustive.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::MatchWithoutDefault"
expect_diagnostic_line = 12
expect_output_contains = ["has no 'case _'"]

[[tests]]
name = "match_guard.enum_not_exhaustive"
desc = "A guarded case covers no variant of an enum: a match that names both variants but guards one of them is still missing that variant, and EnumMatchNotExhaustive names it ('A'), rather than passing because the variant appears in the source."
kind = "negative"
case = "../../../cases/compile/match_guard/enum_not_exhaustive.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::EnumMatchNotExhaustive"
expect_diagnostic_line = 16
expect_output_contains = ["has no case for 'A'"]

[[tests]]
name = "match_guard.tagged_missing_null"
desc = "A guarded `case null` does not open the null side of a `T?`: the value a false guard refuses has no case to reach, so the match is reported as one that does not list `case null` (TaggedMatchCases), instead of being accepted because the words `case null` occur in it."
kind = "negative"
case = "../../../cases/compile/match_guard/tagged_missing_null.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::TaggedMatchCases"
expect_diagnostic_line = 10
expect_output_contains = ["'case null' is missing"]

[[tests]]
name = "match_guard.faulting_guard"
desc = "A guard is part of the case it is written on (design principles 3.4): the out-of-range index of `case 1 when xs[5] > 0 => 1` faults where the guard is written (line 12), and the match itself -- which has its default -- is reported as well formed. The report is the index one, not a match one."
kind = "negative"
case = "../../../cases/compile/match_guard/faulting_guard.cml"
args = ["${case}", "std::nvm"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::IndexOutOfRange"
expect_diagnostic_line = 11
expect_output_contains = ["Index 5 is out of range for an array of length 3"]

[[tests]]
name = "match_guard.literal_type"
desc = "A pattern literal takes the type of the value it is matched against (design principles 5.1), guard or no guard: `case 3` on an `f32` is 3.0 and is taken for 3.0, `case 4 | 5` shares one guard across the alternatives, and a false guard drops that case as any other. Without the conversion the guarded case compared an `f32` with an `int` and the program did not compile at all."
kind = "behavior"
case = "../../../cases/compile/match_guard/literal_type.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "three\nother\nfive-ish\nother\n"

[[tests]]
name = "match_guard.case_type_mismatch"
desc = "A guarded case whose value cannot be compared with the value matched gets the report an unguarded one gets: `case 1` on a `string` is MatchCaseTypeMismatch, naming both types at the case, rather than a report about `==` having no overload. The guard must not change which diagnostic a case of the wrong type gets."
kind = "negative"
case = "../../../cases/compile/match_guard/case_type_mismatch.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::MatchCaseTypeMismatch"
expect_diagnostic_line = 10
expect_output_contains = ["'string'", "'int'"]