id = "runtime.block_body"
order = 389
tier = "fast"
tags = ["feat", "runtime", "graph", "block"]
desc = "A body handed to the compiler as text is compiled by the same compiler into a program of its own; the block's operator is named by the hash of that body's canonical form and its record is the effects read off the body's graphs, and one kernel reached through the executor manager by that name runs the body and answers its value, twice for the same block; the block's one node stands in the outer graph, and the program it was inserted into keeps every graph it had."

# What the case measures, in one run of each pipeline: `test::block_body` compiles five bodies as
# programs of their own (`compileAsProgram`, encoded by the same loader a pass library goes through),
# names each block by the portable hash of its body's graph, reads each record out of that graph's
# effects, registers them in the context's store and prints all three; it then calls two blocks'
# operators through the executor manager, with the ordinal in the node's attributes, prints the value
# the body computed, and calls the first block again after its first run is over; finally it puts one
# node of the first block into the exit of `<main>`. `std::stats` then reads the entry program -- one
# node, one operator and one edge more, and nothing else -- and `std::jgir` writes its graphs, none of
# which may be a body's.
[[tests]]
name = "runtime.block_body.the_body_is_a_program_of_its_own"
desc = "Each body compiles into its own program with its own graphs and yields a name and a record of its own, the block's operator runs it and answers its value, and the entry program gains exactly one node."
kind = "behavior"
tool = "python"
case = "../../../cases/runtime/block_body.py"
args = ["${case}", "--camel", "${camel}"]
expect_exit = 0
expect_stdout_contains = ["BLOCK_BODY built body graphs=2 nodes=6", "BLOCK_BODY built second graphs=2 nodes=6", "BLOCK_BODY built effectful graphs=2", "BLOCK_TRAITS body uri=block:", "BLOCK_TRAITS effectful uri=block:", "pure=false", "BLOCK_TRAITS fallible uri=block:", "mayFault=true", "BLOCK_CALL body block:", "argument=41 value=42", "argument=5 value=15", "argument=1 value=2", "into the exit of <main>", "BLOCK_BODY entry graphs 2 -> 2 nodes 76 -> 77", "block_body: body_graphs=2 body_nodes=6 blocks=5 store=5 block_calls=3 entry_nodes=76->77 entry_opers=", "Block body: PASS"]
timeout_ms = 60000