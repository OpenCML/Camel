id = "runtime.oper_shape"
order = 384
tier = "fast"
tags = ["feat", "runtime", "oper", "shape", "witness"]
desc = "A construction answers one shape whether the program writes the operator's call (`fill`) or the form the front end still builds (FILL), because the classification asks the operator the node names and not its kind; a conversion, a copy and a member read have one form only, since the four node kinds that wrote them are gone (CAST, COPY and the ACCS that `t.0` used to build are `:op/cast`, `:op/copy` and `:op/access` now)."
# `test::oper_shape` prints one line per form the program uses, so the reading compares the two
# writings of one operation instead of counting nodes: no program can see the classification, and a
# back end's answer for it is a decision about the operator, which is what this plan pins.
#
# The red condition is the decision itself. With `shapeOfOperation` answering from the kind alone
# (`camel/execute/shaped_operators.h`), every `oper=` line of this program stops matching -- the
# operator-built nodes answer `shape=none` -- while the `kind=` lines keep matching, so the plan's
# failure names the operator's half and not a program that stopped building the kind.
#
# The case runs to completion (`expect_exit = 0`): the reading is one `[OPER_SHAPE]` line per form
# the program writes, the construction among them twice (the `fill` call and the aggregate), and the
# line the program itself prints. `expect_stdout_not_contains` is the answer that says the
# classification lost an operation, so it is checked against a reading that has forms in it.
[[tests]]
name = "runtime.oper_shape.the_operator_and_the_kind_answer_one_shape"
desc = "The program writes one construction twice -- `fill((0, 0), a, b)` and the aggregate `(a, b)` -- and the two forms answer one shape, `construction`, though only one of them carries the FILL kind; a copy, a member read by place and one by name, and the entering a declared `int[...]` return makes answer their shapes off the operator each node names. A form answerable only as `shape=none` is the classification reading the node kind alone, which is this entry's red."
kind = "behavior"
case = "../../../cases/runtime/oper_shape/two_forms_one_shape.cml"
args = ["${case}", "test::oper_shape"]
expect_exit = 0
# The six forms the case writes, and the line the program prints: the case compiled, so the pass ran
# and the program ran, and every one of these lines is a reading rather than a refusal.
expect_stdout_contains = ["[OPER_SHAPE] kind=FILL shape=construction", "[OPER_SHAPE] oper=:op/fill shape=construction", "[OPER_SHAPE] oper=:op/copy shape=clone", "[OPER_SHAPE] oper=:op/access shape=access", "[OPER_SHAPE] oper=:op/access_key shape=access", "[OPER_SHAPE] oper=:op/enter shape=entering", "5 3 5 2 1 7 5"]
# A form answerable only as "not one of the four" is the revert this case exists for. With the case
# compiling, this reads the six forms above: a classifier that answered off the kind alone would
# print `shape=none` on every `oper=` line and this would be the assertion that says so.
expect_stdout_not_contains = ["shape=none", "not ok"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

# The registry behind the answer above, checked directly: the shape a statement writes, the shape a
# reader gets back off the record, and the refusal a completed record gives a second, different
# statement. None of it is visible to a program, so nothing in a case can stand in for it: a
# `stateShape` that took the second statement would leave the four operators' shapes as whatever was
# registered last, and the `oper=` lines above would keep matching while the registry drifted.
[[tests]]
name = "runtime.oper_shape.the_registry_states_one_shape"
desc = "`declareShape` states a shape at an operator and `shapeOfOperator` reads it back off the record; before the record is completed a later statement stands; after it is completed the same statement is a repetition and a different one is refused, naming both shapes, with the published shape left as it was."
kind = "behavior"
case = "../../../cases/compile/ref/ref_float.cml"
args = ["${case}", "test::oper_shape"]
expect_exit = 0
expect_stdout_contains = ["[SHAPE_REGISTRY] unstated_is_none ok", "[SHAPE_REGISTRY] declareShape ok", "[SHAPE_REGISTRY] completed_refuses_a_second_shape ok"]
expect_stdout_not_contains = ["not ok"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000
# A conversion written as the operator it is: `cast::<f32[6], f32[]>` names `:op/cast` and a pair
# of types the language allows *and* runs (the extent and the rank fit), so the reading has the line
# the rest of this plan has been missing -- `oper=:op/cast shape=conversion`. Nothing in the four
# node kinds reaches it: the CAST kind is gone, and `float(x)`, the writing a program would reach
# for, is a CALL of the prelude's own `float` function. This entry is what makes the conversion shape
# readable at all, and it is the pair, not a second name table, that the line rests on.
[[tests]]
name = "runtime.oper_shape.a_conversion_written_as_the_operator"
desc = "`cast::<f32[6], f32[]>(a)` builds an OPER node naming `:op/cast` and runs: six elements of a fixed rank into the open rank of the same element type. `test::oper_shape` reads the shape off the operator's record, so the reading carries `oper=:op/cast shape=conversion` -- the line the four node kinds cannot produce any more, since CAST is gone and `float(x)` is a CALL -- beside the `[SHAPE_REGISTRY]` half that answers the same registry for a URI no program can call."
kind = "behavior"
case = "../../../cases/runtime/oper_shape/cast_pair_conversion.cml"
args = ["${case}", "test::oper_shape"]
expect_exit = 0
expect_stdout_contains = ["[OPER_SHAPE] oper=:op/cast shape=conversion", "[SHAPE_REGISTRY] unstated_is_none ok"]
expect_stdout_not_contains = ["shape=none", "not ok", "[Error]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000
