id = "runtime.graph_draft_ledger"
order = 380
tier = "fast"
tags = ["feat", "runtime", "graph", "ledger"]
desc = "The direct-connection ledger of graph-store step 2 b as a gate: the references to `GraphDraft` outside the transaction, the construction points and the `GraphDraft::decode` points may only fall, and the check names which number rose and where when one does."

# The ledger page (docs/handover/reviews/graph-store-step2-b-ledger.cn.md) records three numbers per
# commit so that "GraphDraft is deleted" is a number and not a claim. This plan is that ledger as a
# check, in the fast layer, because a number nobody runs is a promise nobody keeps: the case reads the
# tracked tree with `git grep`, compares each number with the baseline it records, and fails when one
# of them rose -- naming the number, the old and the new value, and the `file#line#symbol` of the new
# site. A number that fell is green and prints a reminder to re-record the baseline, because the point
# of the step is that the numbers go down and the gain has to be locked in.
#
# `tier = "fast"` is the wiring, not decoration: the fast layer (`-Tier fast` over the tree, `npm run
# test`) runs this plan, so the ledger is checked on every gate instead of on the commits that happen
# to remember it. For `--changed` two things select it: the case's own directory mirrors to this plan
# through the `test/cases/` directory rule (test/cases/runtime/graph_draft_ledger -> this file), and
# the `src/runtime/` file rule names it, because that is where the storage and the transaction live
# and a commit there is exactly the kind that can add a direct connection.
[[tests]]
name = "runtime.graph_draft_ledger.never_rises"
desc = "Every number of the direct-connection ledger is at or below its recorded baseline; a rise is red and names the number and the site."
kind = "behavior"
tool = "node"
case = "../../../cases/runtime/graph_draft_ledger/check.mjs"
args = ["${case}"]
expect_exit = 0
# Only the parts that do not move with the numbers: a decrease must stay green, so the assertion
# cannot name today's value. The numbers themselves are printed on the line below and are what a
# reader compares with the ledger page.
expect_stdout_contains = ["[LEDGER] files ", "[LEDGER] ok"]
expect_output_not_contains = ["[LEDGER] RED"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000
# The check in Handle::create that a handle naming a program names a node that program has, and the
# check in `GCGraph::nodeRegion` that a region belongs to a node that is there. This case is what
# makes them checks and not comments: the pass makes a handle and a region query that are wrong on
# purpose, and the readings are the refusal and then the abort. The control lines come first -- a
# node that is there is allowed, and its region is 0, the body -- because a guard that also
# refused the right node would be a worse bug than the one it guards.
[[tests]]
name = "runtime.graph_draft_ledger.handle_and_region_invariants"
desc = "A handle that claims a node the program does not have is refused where the handle is made, and `nodeRegion` of a ref the graph does not have aborts with the region guard's reading -- after the controls that a node that is there is allowed and answers region 0. Answering 0 for the node that is not there prints a line and exits 0, which this test rejects."
kind = "behavior"
case = "../../../cases/runtime/graph_draft_ledger/probe_handle.cml"
args = ["${case}", "graph::probe_handle"]
expect_stdout_contains = ["HANDLE_PROBE allowed a node that is there: yes", "HANDLE_PROBE refused:", "REGION_PROBE body region of node 0: 0"]
expect_output_not_contains = ["REGION_PROBE answered the body for a node that is not there"]
expect_stderr_contains = ["Camel Invariant Violation:", "Region of a node that is not in the graph", "region 0 is the body, not the answer for a node that is not there"]
# No `expect_exit`: the guard aborts, and no plan field says "ended by a signal" -- POSIX records
# `signal = SIGABRT` with a null exit code, MSVC turns `abort()` into exit status 3. The abort is
# asserted from the runner's verify payload, which carries both (docs/test-plans.md,
# "verify_script"), the way test/plans/debug/view_escape.plan.toml does.
verify_script = """
if (input.signal !== null) {
    assert(input.signal === 'SIGABRT', `ended by signal ${input.signal}, not the abort`)
    assert(input.exit_code === null, `a signal and an exit code together: ${input.exit_code}`)
} else {
    assert(input.exit_code === 3, `ended with exit ${input.exit_code}, not the abort`)
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000