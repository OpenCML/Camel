id = "probe_wall1_captured_array"
order = 9918
tier = "fast"
tags = ["probe", "wal1", "vjp", "autodiff"]

# SCRATCH PROBE (lane-s2wall, 2026-11-03): measures where a captured array operand stops the
# forward lift, before any change. Two declarations of the SAME capture, differing only in whether
# the captured array's type states its extent (`float[2, 2]` vs `float[]`). Not a permanent test.

[[tests]]
name = "probe.captured_array.stated"
desc = "A captured array operand whose type states its extents: does the lift carry its zero tangent?"
kind = "behavior"
case = "../../cases/probe/probe_captured_stated.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "probe.captured_array.open"
desc = "The same capture with an open extent (`float[]`): the shape the zero would need is the value's."
kind = "behavior"
case = "../../cases/probe/probe_captured_open.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000