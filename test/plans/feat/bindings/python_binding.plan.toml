id = "feat.bindings.python"
order = 960
tier = "fast"
debug_tier = true # also selected by --tier debug (Debug build)
tags = ["feat", "bindings", "python", "dlpack", "zero-copy", "diagnostics"]
desc = "The Python binding (H253): a Python caller runs a Camel module's exported functions, an array crosses in and out through DLPack without a copy, a Camel error value and a Camel diagnostic arrive as Python exceptions with a position, and the bytes a call moves are measured against the bytes it does not (docs/design/arrays-memory/README.cn.md 3.2 and 3.3; include/camel/runtime/definitions.h, `libraryFunction`)."

# The Python test builds its DLPack capsules with ctypes, so it needs no third-party library; the
# extension module it imports is the one the build puts in out/<tag>/python/.
[defaults]
kind = "behavior"
case = "../../../cases/feat/bindings/python_rules.cml"
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 180000

[[tests]]
name = "python_binding.session"
desc = "The whole contract in one run of the Python test: the module is found by path, the extension is imported by the package, and the addresses, the timing, the memory, the fault and the diagnostic are asserted inside the script. It skips where the extension module was not built for this interpreter (no Python development files at configure time, or another ABI)."
kind = "behavior"
tool = "python"
case = "../../../cases/feat/bindings/python_binding.py"
args = ["${case}"]
skip_unless = ["${python}", "-c", 'import glob, importlib.machinery, sys; sys.exit(0 if glob.glob("out/latest/python/_camel" + importlib.machinery.EXTENSION_SUFFIXES[0]) else 1)']
expect_exit = 0
expect_stdout_contains = ["zero-copy in:  in 0x", "4 f32, no copy", "copy out:      in 0x", "caller's buffer untouched", "scalars:       energy = 30.0", "size          pass-through (the binding)   memmove (a copy of the same bytes)", "therefore:    64 MiB by call", "camel work:   2 MiB through scale() takes", "memory:        8 results of a 4 MiB pass-through hold", "error value:   camel.FaultError name=RangeError at python_rules.cml:", "the factor must not be negative", "diagnostic:    camel.DiagnosticError name=SemanticDiag::UnresolvedReference code=0x0300000B", "python_broken.cml:9:12", "absent name:   camel.DiagnosticError name=NoSuchExport:", "python binding: PASS"]
expect_output_not_contains = ["FAIL", "Traceback", "Segmentation fault", "dumped core", "[Error]"]