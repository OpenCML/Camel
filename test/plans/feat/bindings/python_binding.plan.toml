id = "feat.bindings.python"
order = 960
tier = "fast"
debug_tier = true # also selected by --tier debug (Debug build)
tags = ["feat", "bindings", "python", "dlpack", "zero-copy", "diagnostics"]
desc = "The Python binding: a Python caller runs a Camel module's exported functions, an array crosses in and out through DLPack without a copy, a Camel error value and a Camel diagnostic arrive as Python exceptions with a position, and the bytes a call moves are measured against the bytes it does not (docs/design/arrays-memory/README.cn.md 3.2 and 3.3; include/camel/runtime/definitions.h, `libraryFunction`)."

# The Python test builds its DLPack capsules with ctypes, so it needs no third-party library; the
# extension module it imports is the one the build puts in out/<tag>/python/.
[defaults]
kind = "behavior"
case = "../../../cases/feat/bindings/python_rules.cml"
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 180000

# The timing line inside the Python test used to compare one call's fixed cost with twice a 1 MiB
# memmove, so it could hold only where a call cost less than that copy: on macOS arm64 the call read
# 46.0 us against 41.2 us and the line red, and on the win-x64 runner 70.4 us against 62.6 us, both
# times although the call still passed the buffer by pointer (the address checks were green, and
# 64 MiB was copied on those hosts in 3109.7 and 3158.2 us, 68x and 45x the call). That was a fact
# about the host's call cost and its copy, not about whether the binding moves the bytes, so the line
# now compares 64 MiB with 64 MiB and carries no host term: it reds a binding that copies, and it
# stays green wherever the call passes the buffer by pointer.
#
# The `skip_unless` probe stays after that change, for the second question it asks: whether the
# extension module was built for this interpreter (it is one command, and the entry needs both). Its
# headroom half no longer decides anything now that the line carries no host term, and the docstring
# of `test/tools/have-binding-headroom.py` still quotes the old formula; dropping that half needs a
# macOS run to verify, so it is left as it is rather than changed blind here.
#
# The two questions are split now that they answer differently: whether the module exists is asked by
# `require_artifacts`, whose absence fails the entry and names the path, and the probe keeps only the
# host half, whose absence skips it. They used to share one exit code, and the module's absence was
# therefore a skip -- the same number in a summary as a pass, over an entry nothing had measured.
[[tests]]
name = "python_binding.session"
desc = "The whole contract in one run of the Python test: the module is found by path, the extension is imported by the package, and the addresses, the timing, the memory, the fault and the diagnostic are asserted inside the script. A build that produced no extension module for this interpreter fails the entry, naming the path; the probe below skips only the timing line's host premise."
kind = "behavior"
tool = "python"
case = "../../../cases/feat/bindings/python_binding.py"
require_artifacts = ["<install>/python/_camel*"]
args = ["${case}"]
skip_unless = ["${python}", "test/tools/have-binding-headroom.py"]
expect_exit = 0
expect_stdout_contains = ["zero-copy in:  in 0x", "4 f32, no copy", "copy out:      in 0x", "caller's buffer untouched", "scalars:       energy = 30.0", "size          pass-through (the binding)   memmove (a copy of the same bytes)", "therefore:    64 MiB by call", "camel work:   2 MiB through scale() takes", "memory:        8 results of a 4 MiB pass-through hold", "error value:   camel.FaultError name=RangeError at python_rules.cml:", "the factor must not be negative", "diagnostic:    camel.DiagnosticError name=SemanticDiag::UnresolvedReference code=0x0300000B", "python_broken.cml:8:12", "absent name:   camel.DiagnosticError name=NoSuchExport:", "python binding: PASS"]
expect_output_not_contains = ["FAIL", "Traceback", "Segmentation fault", "dumped core", "[Error]"]
# Slow layer: over the 2 s the fast layer allows -- 7.35 s of
# child wall clock.
tier = "slow"

[[tests]]
name = "python_binding.boundary"
desc = "What crosses the Python boundary and what happens when it may not: an array handed to Python is read-only (the DLPack 1.0 capsule carries READ_ONLY and the NumPy view is not writeable, so a write cannot reach a module-level table), a DLPack import that fails says why and leaves the capsule unconsumed so the producer gets its memory back, an accepted capsule is renamed `used_dltensor`, and a host failure arrives as a Python exception."
kind = "behavior"
tool = "python"
case = "../../../cases/feat/bindings/python_boundary.py"
# The same artifact as the entry above, asked the same way: a probe would answer "not there" as a
# skip, and this entry's whole subject is what happens across the boundary, so nothing about it can
# be measured without the module.
require_artifacts = ["<install>/python/_camel*"]
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["the exported capsule is DLPack 1.0 with READ_ONLY set", "a refused float16 capsule keeps its name; its deleter ran once", "an accepted capsule is renamed used_dltensor", "the interpreter survives", "python boundary: PASS"]
expect_output_not_contains = ["FAIL", "Traceback", "Segmentation fault", "dumped core", "[Error]"]
