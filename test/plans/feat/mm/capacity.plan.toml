name = "capacity.meta_limit_diagnostic"
desc = "With the meta space limited to 1 MB, 2000 functions that each own a string constant do not fit (about 1.2 KB each). The program is refused before anything runs with RuntimeDiag::MemoryExhausted, stage compile, at the function that was being compiled, naming the space, the usage, the limit and `--meta-space-limit-mb`."
