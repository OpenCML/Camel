id = "mm.capacity"
order = 368
tier = "fast"
debug_tier = true # also selected by --tier debug (Debug build)
tags = ["feat", "mm", "capacity", "scale"]
desc = """
Programs of ordinary size must not run into the capacity of the spaces the compiler keeps the
program in. The graph, permanent and meta spaces (runtime graphs; types and layouts; constants
and function objects of the graphs being compiled) grow by segments up to a configurable total
(`--graph-space-limit-mb`, `--perm-space-limit-mb`, `--meta-space-limit-mb`, 256 MB each
by default); reaching it is the located diagnostic RuntimeDiag::MemoryExhausted, which names the
space, the usage, the limit and the variable.

The programs are generated by test/tools/scale/scale.py: N small functions of one shape
(integer arithmetic, an `if`, a string literal, an array literal, a lambda passed to `map`, or
all in turn) and a `main` that prints the sum of their results, which the generator knows
without running Camel. Before the spaces could grow, and while every graph that owns a constant
took a 256 KB block of the 16 MB meta space, 62 such graphs were the limit: 60 functions with an
`if`, a string, an array or a lambda, or 3051 arithmetic functions (their 62 callers), ended in
an unlocated std::bad_alloc (progen finding F24).
"""

[[tests]]
name = "capacity.scale_check"
desc = "500 functions of each shape and 2000 of all shapes in turn compile and run on the node VM; the mixed 2000 also on the bytecode VM, and 500 on the JIT and on the parallel scheduler. Every run prints the sum the generator computed. The tool prints wall time and peak resident memory of each run for the record; there is no budget on them beyond the timeout (measured in a Linux container, release build: 0.07 to 0.5 s each, 49 to 226 MB, the memory being mostly the front end at about 75 KB per function)."
kind = "behavior"
tool = "python"
case = "../../../tools/scale/scale.py"
args = ["${case}", "check"]
expect_exit = 0
expect_stdout_contains = ["9 of 9 scale programs ran", "PASS"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 300000

[[tests]]
name = "capacity.wide_graph"
desc = "A graph has no size limit: one function of 30000 terms summed in a tree has 90000 nodes and 60000 frame slots (a runtime graph used to hold 65534 nodes and about 32766 slots) and compiles and runs on the node VM, the bytecode VM and the JIT, printing the sum the generator computed."
kind = "behavior"
tool = "python"
case = "../../../tools/scale/scale.py"
args = ["${case}", "wide"]
expect_exit = 0
expect_stdout_contains = ["3 of 3 wide runs", "PASS"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 120000

[[tests]]
name = "capacity.chunks_shared"
desc = "A commit that adds a node to a graph of 9000 nodes (36 node chunks) gives the new version every chunk of the old one but the last: the others are the same blocks (GCNodeChunk::shares), found by comparing what the encoder staged with what the old version holds."
kind = "behavior"
tool = "python"
case = "../../../tools/scale/scale.py"
