[[tests]]
name = "capacity.growth_nvm_gc_stress"
desc = "The three spaces grow by segments while the program is compiled and run: with a first segment of 64 KB (CAMEL_SPACE_SEGMENT_KB, a test control) 500 functions of all shapes need several segments of each space. The program prints the sum the generator computed and the statistics line shows at least 3 segments per space. Pipeline: std::nvm, with a verified major collection (heap verification before and after) at every safepoint: objects of the auto space are reached through graphs in several segments of the graph space."
kind = "behavior"
tool = "python"
case = "../../../tools/scale/scale.py"
args = ["${case}", "run", "mixed", "500"]
envs = ["CAMEL_SPACE_SEGMENT_KB=64", "CAMEL_GC_STATS=1", "CAMEL_GC_VERIFY=both", "CAMEL_GC_STRESS_SAFEPOINT=1", "CAMEL_GC_STRESS_MODE=major"]
expect_exit = 0
expect_stdout_contains = ["OK mixed n=500"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
for (const space of ["graph", "perm", "meta"]) {
  const m = new RegExp(space + "_segments=([0-9]+)").exec(out)
  assert(m !== null, `no segment count of the ${space} space in: ${out}`)
  assert(Number(m[1]) >= 3, `the ${space} space has ${m[1]} segment(s), expected it to have grown to at least 3`)
}
}
"""
timeout_ms = 300000

