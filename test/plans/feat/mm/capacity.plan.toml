tool = "python"
case = "../../../tools/scale/scale.py"
args = ["${case}", "limit", "meta", "1", "string", "2000"]
expect_exit = 0
expect_stdout_contains = ["\"code\":\"0x04000014\"", "\"stage\":\"compile\"", "Out of memory: The meta space (constants and function objects of the graphs being compiled) is exhausted while compiling function 'f", "of the limit of 1.0 MB are in use", "set CAMEL_META_SPACE_LIMIT_MB=<megabytes> to raise the limit (it is 1 now)", "camel exit=1"]
expect_output_not_contains = ["bad_alloc", "UnknownInternalError", "scale total="]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 120000

