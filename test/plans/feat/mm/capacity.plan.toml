[[tests]]
name = "capacity.perm_limit_diagnostic"
desc = "With the permanent space limited to 2 MB, compiling 2750 functions with a lambda hits the limit, and the run ends with exit 1 and the located resource-exhaustion diagnostic: the space, the limit and `--perm-space-limit-mb`. Which phase hits it is not pinned (the types are interned, so the lambdas share their types and the encoding of the runtime graphs is what runs out), and neither is whether a function can be named; what is pinned is that the limit is a clean refusal in any phase and that tearing the half-built program down afterwards does not crash (it used to end in a segmentation fault)."
kind = "behavior"
tool = "python"
case = "../../../tools/scale/scale.py"
args = ["${case}", "limit", "perm", "2", "lambda", "2750"]
expect_exit = 0
expect_stdout_contains = ["\"code\":\"0x04000014\"", "\"stage\":\"compile\"", "Out of memory: The permanent space (types and layouts) is exhausted", "of the limit of 2.0 MB are in use", "raise it with --perm-space-limit-mb=<megabytes> (it is 2 now)", "camel exit=1"]
expect_output_not_contains = ["bad_alloc", "UnknownInternalError", "scale total=", "camel exit=-11"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 120000

[[tests]]
name = "capacity.growth_nvm_gc_stress"
desc = "The three spaces grow by segments while the program is compiled and run: with a first segment of 32 KB (`--space-segment-kb`, a test control; since types are interned, the permanent space of 500 functions no longer fills three segments of 64 KB) 500 functions of all shapes need several segments of each space. The program prints the sum the generator computed and the statistics line shows at least 3 segments per space. Pipeline: std::nvm, with a verified major collection (heap verification before and after) at every safepoint: objects of the auto space are reached through graphs in several segments of the graph space."
kind = "behavior"
tool = "python"
case = "../../../tools/scale/scale.py"
args = ["${case}","run","mixed","500","std::profile gc_stats=1 report=false hints=false", "--camel-options", "--gc-stress safepoint=1,kind=major --gc-check verify=both --space-segment-kb 32"]
expect_exit = 0
expect_stdout_contains = ["OK mixed n=500"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
for (const space of ["graph", "perm", "meta"]) {
  const m = new RegExp(space + "_segments=([0-9]+)").exec(out)
  assert(m !== null, `no segment count of the ${space} space in: ${out}`)
  assert(Number(m[1]) >= 3, `the ${space} space has ${m[1]} segment(s), expected it to have grown to at least 3`)
}
}
"""
timeout_ms = 300000

