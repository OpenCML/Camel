id = "mm.gc_elder_exhaustion"
order = 366
tier = "slow"
tags = ["feat", "mm", "gc", "higher-order"]
desc = """
Programs that allocate more small arrays than the elder space holds (32 MB) inside the element
functions of nested map, filter, reduce and foreach. An allocation that found the elder space full
used to run a mark-sweep on the spot, which freed objects held only by C++ locals (an Array whose
backing store was being allocated); the next collection then traced the freed object, or the
program computed with reused memory. Every test checks the printed total against a value computed
independently of Camel.

Under std::tf a collection could also run while a flow was running: the other workers were inside
operators, and a map held the results of its finished elements outside any frame. The std::tf
tests cover that: the nested map at full size, and every program at a small size with a major
collection, heap verification before and after, at every safepoint the scheduler polls.
"""

# The layer, measured on 2026-11-25 at `2dcda93c7c` (`-Plan test/plans/feat/mm -Tier milestone
# -Jobs 8`, 4,889 cases, wall 334.6 s): this file's 22 entries cost 0.38-8.47 s each, so none of
# them belongs to the milestone layer, whose line is "minutes, or whose number depends on what else
# the machine is doing" (docs/test-plans.md, "Layers").
#
#   under 2 s -- 11 entries, 0.38-1.60 s: the four `nested_map` arms (1.48-1.60 s), `nested_map_tf`,
#     the four `_tf_stress` arms (0.38-0.44 s) and the two `live_table` arms (0.75-0.85 s). They are
#     `tier = "fast"` below, and the reason is the one the two `gc.plan` entries carry: the layer
#     this file sat in is what let a defect live for weeks, because `--tier fast` never read it.
#   over 2 s, under 30 s -- 11 entries, 2.09-8.47 s (`nested_filter` 3.78-5.34 s, `nested_reduce`
#     6.10-8.47 s, `nested_foreach` 3.27-4.65 s, `nested_map_simplify_nvm` 2.09 s). They stay out of
#     the developer loop by the same 2 s line, and they are `slow`: this file is in
#     `scripts/plan-inventory.mjs#SLOW_PLANS`, so the release gate runs all 22 entries, one plan at a
#     time, at every gate -- where a red is seen at the next gate rather than at the 09:00 cron that
#     is the milestone layer's only reader.
#
# The measurement is not the one that motivated the move, and the difference is the point: while the
# four `reduce` entries were red they died of SIGSEGV before compiling and cost 0.1 s each
# (`8bb9ff937d`, the case seeded its accumulator with the interval), so "cheap" was a property of
# the *defect* and not of the case. A cheap crash is not a cheap case: green, the same entry is
# 6.10-8.47 s, and a layer decided on the red reading would have put a 8.47 s case in the loop.

[[tests]]
name = "gc_elder_exhaustion.nested_map_default"
tier = "fast"
desc = "A table built by a map inside a map element, 200 times over, across several elder-space collections. Pipeline: the default pipeline."
kind = "behavior"
case = "../../../cases/feat/mm/gc/gc_nested_map.cml"
args = ["${case}", "--arg", "reps=200"]
expect_exit = 0
expect_stdout_contains = ["gc_nested_map total=17472000"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 120000

