[[tests]]
name = "gc_elder_exhaustion.nested_map_tf_stress"
desc = "A table built by a map inside a map element, 48 times over, with a verified major collection at every safepoint the scheduler polls. Pipeline: std::tf. The scheduler caps the collector (after a collection the next starts no sooner than twice the time it took), so not every poll collects: the test also asserts that at least 20 collections ran while a flow was running (measured: 85 to 132 in 12 runs at 2, 4 and 18 workers, load 11; the floor is about a quarter of the lowest), read from the scheduler's statistics line (std::prl gc_stats=1). The number follows the run time. It was measured again, and the repetitions raised from 3, when the higher-order operators stopped making a task of every element and the run became several times shorter (before: 40 to 86 with 3 repetitions). With one worker an unordered operator runs on the calling thread and a program may start no flow at all; the floor is then not applied (the statistics line gives the number of workers)."
kind = "behavior"
case = "../../../cases/feat/mm/gc/gc_nested_map.cml"
args = ["${case}", "--arg", "reps=48", "std::tf gc_stats=1"]
envs = ["CAMEL_GC_VERIFY=both", "CAMEL_GC_STRESS_SAFEPOINT=1", "CAMEL_GC_STRESS_MODE=major"]
expect_exit = 0
expect_stdout_contains = ["gc_nested_map total=2792448"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const m = /in_flow=([0-9]+)/.exec(input.normalized.stderr)
assert(m !== null, `no statistics line of the scheduler in stderr: ${input.normalized.stderr}`)
const workers = /workers=([0-9]+)/.exec(input.normalized.stderr)
assert(workers !== null, `no worker count in the statistics of the scheduler: ${input.normalized.stderr}`)
assert(Number(workers[1]) === 1 || Number(m[1]) >= 20, `only ${m[1]} collection(s) ran while a flow was running, expected at least 20`)
}
"""
timeout_ms = 240000

