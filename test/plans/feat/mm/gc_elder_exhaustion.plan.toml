[[tests]]
name = "gc_elder_exhaustion.nested_map_tf_stress"
desc = "A table built by a map inside a map element, 3 times over, with a verified major collection at every safepoint the scheduler polls. Pipeline: std::tf. The scheduler caps the collector (after a collection the next starts no sooner than twice the time it took), so not every poll collects: the test also asserts that at least 10 collections ran while a flow was running (measured: 40 to 86 in 12 runs at 1, 2 and 18 workers, load 16; the floor is about a quarter of the lowest), read from the scheduler's statistics line (CAMEL_TF_GC_STATS)."
kind = "behavior"
case = "../../../cases/feat/mm/gc/gc_nested_map.cml"
args = ["${case}", "--arg", "reps=3", "std::tf"]
envs = ["CAMEL_GC_VERIFY=both", "CAMEL_GC_STRESS_SAFEPOINT=1", "CAMEL_GC_STRESS_MODE=major", "CAMEL_TF_GC_STATS=1"]
expect_exit = 0
expect_stdout_contains = ["gc_nested_map total=148608"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const m = /in_flow=([0-9]+)/.exec(input.normalized.stderr)
assert(m !== null, `no statistics line of the scheduler in stderr: ${input.normalized.stderr}`)
assert(Number(m[1]) >= 10, `only ${m[1]} collection(s) ran while a flow was running, expected at least 10`)
}
"""
timeout_ms = 240000

