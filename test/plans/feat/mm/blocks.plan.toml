id = "mm.blocks"
order = 370
tier = "fast"
tags = ["feat", "mm", "array", "block", "dlpack"]
desc = "Data-block storage: a small numeric array is inline, a view promotes it once and shares the block, block bytes are counted, and DLPack export/import is zero-copy (docs/design/arrays-memory/README.cn.md, sections 2 and 3.3)."

# `std::gc::blocks` runs the data-block self-test and prints its counters; the program is empty.
[defaults]
kind = "behavior"
case = "../../../cases/feat/mm/blocks.cml"
expect_exit = 0
expect_stdout_contains = ["BLOCK_SELFTEST ok"]
expect_output_not_contains = ["Segmentation fault", "dumped core", "[Error]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000

[[tests]]
name = "blocks.selftest"
desc = "The core self-test: inline int[3], promotion by a view, int[100] block backed, zero-copy DLPack round trip."
args = ["${case}", "std::gc::blocks", "std::nvm"]

[[tests]]
name = "blocks.selftest_alias"
desc = "The same self-test through its short alias."
args = ["${case}", "std::gcblocks", "std::nvm"]