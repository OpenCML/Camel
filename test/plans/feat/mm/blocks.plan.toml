id = "mm.blocks"
order = 370
tier = "fast"
debug_tier = true # also selected by --tier debug (Debug build)
tags = ["feat", "mm", "array", "block", "dlpack"]
desc = "Data-block storage: a small numeric array is inline, a view promotes it once and shares the block, block bytes are counted, and DLPack export/import is zero-copy (docs/design/arrays-memory/README.cn.md, sections 2 and 3.3)."

# `std::gc::blocks` runs the data-block self-test and prints its counters; the program is empty.
[defaults]
kind = "behavior"
case = "../../../cases/feat/mm/blocks.cml"
expect_exit = 0
expect_stdout_contains = ["BLOCK_SELFTEST ok"]
expect_output_not_contains = ["Segmentation fault", "dumped core", "[Error]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000

[[tests]]
name = "blocks.selftest"
desc = "The core self-test: inline int[3], promotion by a view, int[100] block backed, zero-copy DLPack round trip."
args = ["${case}", "std::gc::blocks", "std::nvm"]

[[tests]]
name = "blocks.selftest_alias"
desc = "The same self-test through its short alias."
args = ["${case}", "std::gcblocks", "std::nvm"]

[[tests]]
name = "dlpack_complex_numpy"
desc = "The NumPy side of the DLPack contract for complex numbers, which the self-test round trip asserts from the C++ side: a NumPy complex128 array is dtype code 5, 128 bits, lanes 1, its capsule names the array's own memory, and its bytes are the (real, imaginary) float64 pairs the self-test writes. Skips where NumPy is not importable (there is no capsule bridge from a Camel array to Python yet; the self-test is the round trip itself)."
kind = "behavior"
tool = "python"
case = "../../../cases/feat/mm/dlpack_complex.py"
args = ["${case}"]
skip_unless = ["${python}", "-c", "import numpy"]
expect_exit = 0
expect_stdout_contains = ["complex128 is dtype code 5 bits 128 lanes 1", "dlpack complex: PASS"]
expect_output_not_contains = ["FAIL", "Traceback"]
timeout_ms = 60000