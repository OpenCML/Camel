id = "mm.writings"
order = 374
tier = "fast"
tags = ["feat", "mm", "writings"]
desc = """
Values with several writings (docs/design/graph-store 3.1, 3.4): a node already is a value, and
several writings are nodes declared equivalent. The classes are kept per numeric permission
context; the root of a class is its smallest node, whatever the order of the merges.
"""

[[tests]]
name = "writings.union_find"
desc = "The equivalence classes of a graph: merges, smallest node as root, ascending members, the same classes in any order of merges, a log that gives the classes back, the permission contexts (a context sees the equivalences within its permissions), at most four contexts, and a chain of 100000 merges."
kind = "behavior"
case = "../../../cases/feat/mm/writings/empty.cml"
args = ["${case}", "test::writings", "std::nvm"]

expect_exit = 0
expect_stdout_contains = ["WRITINGS merge_new ok", "WRITINGS root_is_smallest ok", "WRITINGS members_ascending ok", "WRITINGS alone ok", "WRITINGS order_free ok", "WRITINGS from_log ok", "WRITINGS strict_context ok", "WRITINGS granted_context ok", "WRITINGS two_grants ok", "WRITINGS exact_reaches_layers ok", "WRITINGS new_flag ok", "WRITINGS layer_limit ok", "WRITINGS long_chain ok"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "writings.congruence"
desc = "Nodes that compute the same thing from the same values are one value: the two writings of `a + 1` are merged when the draft is indexed, merging the parameters `a` and `b` merges what is built from them, and asking for a node that exists gives it."
kind = "behavior"
case = "../../../cases/feat/mm/writings/congruence.cml"
args = ["${case}", "test::writings", "std::nvm"]

expect_exit = 0
expect_stdout_contains = ["WRITINGS params_are_two ok", "WRITINGS build_merged_repeats ok", "WRITINGS parameters_joined ok", "WRITINGS congruence_follows ok", "WRITINGS classes_grew ok", "WRITINGS lookup_adds_once ok"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "writings.congruence_chain"
desc = "Two chains of 300 additions from two parameters: merging the parameters merges every step of the chains (the repair of users runs to a fixed point without scanning the graph again)."
kind = "behavior"
case = "../../../cases/feat/mm/writings/chains.cml"
args = ["${case}", "test::writings", "std::nvm"]

expect_exit = 0
expect_stdout_contains = ["WRITINGS chain_closes ok"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "writings.congruence_apart"
desc = "What is not one value stays two: `0.0` and `-0.0` (compared bit for bit) and two calls of an operator with an effect are not merged by congruence."
kind = "behavior"
case = "../../../cases/feat/mm/writings/apart.cml"
args = ["${case}", "test::writings", "std::nvm"]

expect_exit = 0
expect_stdout_contains = ["WRITINGS two_zeros_found ok", "WRITINGS zero_signs_apart ok", "WRITINGS two_events_found ok", "WRITINGS effects_apart ok"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "writings.commit_roundtrip"
desc = "The equivalences are content of the graph version: a commit that adds some gives a new version that is not in the executable state (no execution plan, the flag set), shares every node chunk but the last, decodes back into the same equivalences, and a commit that adds none leaves the version as it is; a draft with equivalences refuses to change or remove a node."
kind = "behavior"
case = "../../../cases/feat/mm/writings/congruence.cml"
args = ["${case}", "test::writings", "std::nvm"]

expect_exit = 0
expect_stdout_contains = ["WRITINGS draft_refuses_changes ok", "WRITINGS commit_makes_new_version ok", "WRITINGS flag_set ok", "WRITINGS other_graphs_executable ok", "WRITINGS no_plan ok", "WRITINGS chunks_shared ok", "WRITINGS decode_gives_them_back ok", "WRITINGS unchanged_is_same_version ok", "WRITINGS another_equivalence_exists ok", "WRITINGS table_is_content ok"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "writings.commit_chunks"
desc = "The same commit on a graph of about 1200 nodes (five node chunks): the equivalences, 300 of them found by congruence, and the node added make a new version that shares the first four chunks with the old one."
kind = "behavior"
case = "../../../cases/feat/mm/writings/chains.cml"
args = ["${case}", "test::writings", "std::nvm"]

expect_exit = 0
expect_stdout_contains = ["WRITINGS chunks_shared ok", "WRITINGS info chunks_shared=4 of 5", "WRITINGS table_is_content ok"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "writings.extract"
desc = "Extraction picks one writing for every value by cost and leaves the executable state: `a + 1` is also written `1 + a`, the cost model likes the second, and the users of the value read it; the program, run after the pass, prints what it printed. A value that is one of its own writings (`a == a * 1`) takes the one that does not read itself, whatever the model likes."
kind = "behavior"
case = "../../../cases/feat/mm/writings/congruence.cml"
args = ["${case}", "test::writings", "std::nvm"]

expect_exit = 0
expect_stdout_contains = ["WRITINGS commuted_is_new_writing ok", "WRITINGS extract_took_the_liked_writing ok", "WRITINGS extract_rewired_users ok", "WRITINGS extract_is_executable ok", "WRITINGS extracted_graph_runs ok", "WRITINGS one_found ok", "WRITINGS self_reading_writing_excluded ok", "\n15"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "writings.driver_extracts"
desc = "A program in the state with several writings (a pass left `a + 1` also written `1 + a`) reaches the back end with one writing per value: the pipeline driver extracts before a pass that consumes the program, and the program prints what it printed."
kind = "behavior"
case = "../../../cases/feat/mm/writings/congruence.cml"
args = ["${case}", "test::tabled", "std::nvm"]

expect_exit = 0
expect_stdout_contains = ["15"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "writings.driver_refuses_rewrite"
desc = "A rewrite pass that does not know the state with several writings does not get the program: the driver stops with PassNeedsExtraction, naming the pass and the extraction to put before it."
kind = "behavior"
case = "../../../cases/feat/mm/writings/congruence.cml"
args = ["${case}", "test::tabled", "std::opt::fold", "std::nvm"]

expect_exit = 1
expect_output_contains = ["PassNeedsExtraction", "std::opt::fold", "std::opt::extract"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "writings.extract_pass"
desc = "std::opt::extract chooses one writing for every value, so the rewrite pass after it gets a program it knows; its cost parameter names the model, and an unknown model is an error."
kind = "behavior"
case = "../../../cases/feat/mm/writings/congruence.cml"
args = ["${case}", "test::tabled", "std::opt::extract cost=\"nodes\"", "std::opt::fold", "std::nvm"]

expect_exit = 0
expect_stdout_contains = ["15"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "saturate.default"
desc = "The local algebra of std::opt::algebra as rules (exact commutation, neutral elements of wrapping integers, x*c+x*c, x*c1+x*c2, (x*c1)*c2, the last two needing reassociate for floats), saturated under the default numeric policy and extracted by node count, leaves the same operators as std::opt::algebra on every function of the algebra corpus: the products and sums of `strict`, `underflow_sensitive`, the coefficient functions and the integer ones fold into one product, `mixed_permissions` (a product outside the block that grants reassociate) is left alone. `shared_product` is `sync`: the sum waits for the println, and the product that replaces it takes over that wait (waits=1), so it folds as in std::opt::algebra. The program prints what it printed on every back end."
kind = "behavior"
case = "../../../cases/opt/generic/algebra.cml"
args = ["${case}", "--arg", "x=2", "std::opt::fold", "test::saturate", "${backend}"]
backends = ["nvm", "fvm"]

expect_exit = 0
expect_stdout_contains = ["SATURATE strict add=0 mul=1", "SATURATE underflow_sensitive add=0 mul=1", "SATURATE strict_coefficients add=0 mul=1", "SATURATE relaxed_coefficients add=0 mul=1", "SATURATE mixed_permissions add=1 mul=2", "SATURATE integer_coefficients add=0 mul=1", "SATURATE integer_chain add=0 mul=1", "SATURATE shared_product add=0 mul=2 waits=1", "SATURATE strict32 add=0 mul=1", "SATURATE integer32 add=0 mul=1", "12.0 0.4 16.0\n16.0 16.0\n56 42 56\n12.0\n6.0\n12.0\n12.0 18.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "saturate.safe"
desc = "The same rules under the strict policy (safe_fp): only the exact ones apply, as in std::opt::algebra safe_fp=true: `underflow_sensitive` (0.1 is not a whole number), the float coefficient functions and `mixed_permissions` keep their sums; `strict`, the integer functions and the f32 one fold; `shared_product` also folds (x*c + x*c with a whole c is exact; std::opt::algebra safe_fp=true leaves it because its product is shared)."
kind = "behavior"
case = "../../../cases/opt/generic/algebra.cml"
args = ["${case}", "--arg", "x=2", "std::opt::fold", "test::saturate_safe", "${backend}"]
backends = ["nvm", "fvm"]

expect_exit = 0
expect_stdout_contains = ["SATURATE strict add=0 mul=1", "SATURATE underflow_sensitive add=1 mul=1", "SATURATE strict_coefficients add=1 mul=2", "SATURATE relaxed_coefficients add=1 mul=2", "SATURATE mixed_permissions add=1 mul=2", "SATURATE integer_coefficients add=0 mul=1", "SATURATE integer_chain add=0 mul=1", "SATURATE shared_product add=0 mul=2 waits=1", "SATURATE strict32 add=0 mul=1", "SATURATE integer32 add=0 mul=1", "12.0 0.4 16.0\n16.0 16.0\n56 42 56\n12.0\n6.0\n12.0\n12.0 18.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "saturate.deterministic"
desc = "Saturation is asserted as a property, not as a snapshot of its counters: on every function of the algebra corpus the run terminates at a fixed point within the budget (`saturated=1`), saturating the same writings again adds no writing and no union (`SATURATE-AGAIN ... writings=0 unions=0 saturated=1`), and a second run over the same program finds the same rounds, matches, writings and unions (`SATURATE-STABLE ... same=1`, the matches are found in node order and applied in the order found; no hash table is walked). The operators the rules leave are what the rules exist for, so they are asserted as well: a rule that stopped firing changes an operator count even though the counters would stay stable. All of it holds on every back end; the differential case below repeats the run in a second process."
kind = "behavior"
case = "../../../cases/opt/generic/algebra.cml"
args = ["${case}", "--arg", "x=2", "std::opt::fold", "test::saturate_props", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]

expect_exit = 0
expect_stdout_contains = ["SATURATE-PROPS targets=10 saturated=10 fixpoint=10 stable=10", "SATURATE-AGAIN integer_chain writings=0 unions=0 saturated=1", "SATURATE-STABLE integer_chain same=1", "SATURATE strict add=0 mul=1", "SATURATE underflow_sensitive add=0 mul=1", "SATURATE strict_coefficients add=0 mul=1", "SATURATE relaxed_coefficients add=0 mul=1", "SATURATE mixed_permissions add=1 mul=2", "SATURATE integer_coefficients add=0 mul=1", "SATURATE integer_chain add=0 mul=1", "SATURATE shared_product add=0 mul=2 waits=1", "SATURATE strict32 add=0 mul=1", "SATURATE integer32 add=0 mul=1", "12.0 0.4 16.0\n16.0 16.0\n56 42 56\n12.0\n6.0\n12.0\n12.0 18.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "saturate.deterministic.again"
desc = "The same saturation in a second process: the counters, the fixed point and the operators left are identical, so nothing in the engine depends on an address or a hash order that only survives one run."
kind = "differential"
case = "../../../cases/opt/generic/algebra.cml"
args = ["${case}", "--arg", "x=2", "std::opt::fold", "test::saturate_props", "std::nvm"]
expect_exit = 0
compare_to = "saturate.deterministic.nvm"
compare_fields = ["exit_code", "stdout_normalized"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "saturate.budget"
desc = "A budget of one round stops the saturation where it is, without an error: `saturated=0`, and what is extracted from the writings found so far still runs and prints what it printed."
kind = "behavior"
case = "../../../cases/opt/generic/algebra.cml"
args = ["${case}", "--arg", "x=2", "std::opt::fold", "test::saturate_one_round", "std::nvm"]

expect_exit = 0
expect_stdout_contains = ["SATURATE-INFO strict rounds=1", "saturated=0", "12.0 0.4 16.0\n16.0 16.0\n56 42 56\n12.0\n6.0\n12.0\n12.0 18.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "writings.facts"
desc = "The fact of a value with several writings is the join of the facts of its writings (the analysis of the rewrite design 4.2); a value with one writing has the fact of that writing."
kind = "behavior"
case = "../../../cases/feat/mm/writings/congruence.cml"
args = ["${case}", "test::writings", "std::nvm"]

expect_exit = 0
expect_stdout_contains = ["WRITINGS class_fact_is_the_join ok", "WRITINGS single_writing_fact_is_its_own ok"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "rules.from_functions"
desc = "A rule is a pair of functions (rewrite design 2.1): the left one is the pattern, the right one what it becomes, the parameters named c... are const. compileRule turns the pairs of the program into the Rules of the engine; the integer rules of the algebra (commutation, neutral elements, x*c1+x*c2, (x*c1)*c2, x*c+x*c) saturate the three functions to one product each, as the native rules do, and the program prints what it printed. A constant the rule computes that faults (1 / 0) makes the rule not apply at that match, and the quotient stays."
kind = "behavior"
case = "../../../cases/feat/mm/writings/rules_int.cml"
args = ["${case}", "test::rules", "std::nvm"]

expect_exit = 0
expect_stdout_contains = ["RULES compiled=10", "RULES integer_coefficients add=0 mul=1 div=0", "RULES integer_chain add=0 mul=1 div=0", "RULES doubled add=0 mul=1 div=0", "RULES fault_case add=0 mul=0 div=1", "56 42 42"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "rules.refused"
desc = "A pair of functions that cannot be a rule says why: a right side that uses a parameter the left side does not, a left side that is a single parameter (it would match every value), a left side that calls a user function."
kind = "behavior"
case = "../../../cases/feat/mm/writings/rules_int.cml"
args = ["${case}", "test::rules", "std::nvm"]

expect_exit = 0
expect_stdout_contains = ["RULES error bad_unbound: Rule 'bad_unbound': the right side uses the parameter 1, which the left side does not.", "RULES error bad_everything: Rule 'bad_everything': the left side is not an operator applied to something, so it would match every value.", "RULES error bad_call: Rule 'bad_call': the left side has a term that is not an operator, a constant or a parameter."]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "rules.greedy"
desc = "The greedy rewrite applies the rules one way, in place: in a round the nodes in order, at each the first rule that matches; the nodes nothing reads are erased; rounds repeat until one applies nothing. The integer rules give one product for each function, like the saturation and extraction, and the program prints what it printed. A rule from a `<=>` (add_swap_both) is refused by the rewrite, with the rule's name."
kind = "behavior"
case = "../../../cases/feat/mm/writings/rules_int.cml"
args = ["${case}", "test::rules_greedy", "std::nvm"]

expect_exit = 0
expect_stdout_contains = ["RULES refused: Rule 'add_swap_both' holds both ways (<=>): rewriting applies a rule one way, saturation uses both.", "RULES integer_coefficients rounds=2 applied=1 erased=5 fixpoint=1", "RULES integer_chain rounds=2 applied=2 erased=6 fixpoint=1", "RULES doubled rounds=2 applied=1 erased=5 fixpoint=1", "RULES fault_case rounds=1 applied=0 erased=0 fixpoint=1", "RULES integer_coefficients add=0 mul=1 div=0", "RULES integer_chain add=0 mul=1 div=0", "RULES doubled add=0 mul=1 div=0", "RULES fault_case add=0 mul=0 div=1", "56 42 42"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

# The drawing of the state where a value has several writings. Each case runs the same program —
# `x + x` and `x * 2` are two writings of one value — through one pipeline and checks the drawing
# as a property of what came out, never as a count of lines: a check that examined no class at all
# fails, and `draw_classes.guard` shows the same check refusing a dump of the program without the
# saturation, naming the case file and the dump line of the writing that stands alone.

[[tests]]
name = "draw_classes.gir"
desc = "`std::opt::saturate` leaves the program in the state with several writings and `std::gir` draws it: every class is one dashed cluster with one class node and two or more writings inside, all of them naming that class and all of one type; exactly one writing of a class is marked `chosen=\"true\"`, and for the class that holds `x + x` and `x * 2` it is the add — the writing the cost model the pipeline itself extracts by likes (an add costs 1.0 and reads its value twice at 0.1, a product 3.0 and reads it once plus a constant, so 1.2 against 3.2), and the dump says which model chose (`writings_cost=\"weighted\"`); the value the graph returns is read from its class node and not from a writing."
kind = "behavior"
tool = "node"
case = "../../../cases/feat/mm/writings/draw_classes.mjs"
args = ["${case}", "gir"]
expect_exit = 0
expect_stdout_contains = ["draw classes gir: PASS", "DRAW gir classes=", "pair=add+mul", "marked=1", "cost=weighted"]
expect_output_not_contains = ["FAIL"]
timeout_ms = 60000

[[tests]]
name = "draw_classes.rgir"
desc = "The styled dump of the same state draws the class dashed and gives the writing extraction would take a heavier border: the same properties as `draw_classes.gir`, plus `style=dashed` on the class and `penwidth=2` on the marked writing."
kind = "behavior"
tool = "node"
case = "../../../cases/feat/mm/writings/draw_classes.mjs"
args = ["${case}", "rgir"]
expect_exit = 0
expect_stdout_contains = ["draw classes rgir: PASS", "pair=add+mul", "dashed=1", "heavy=1"]
expect_output_not_contains = ["FAIL"]
timeout_ms = 60000

[[tests]]
name = "draw_classes.jgir"
desc = "`std::jgir` carries the classes too: each is an entry with its id, its writings and the one extraction would take among them, and a cost; the class that holds `x + x` and `x * 2` is one entry and its chosen writing is the add, as in the DOT dumps. A graph with one writing per value gains no `classes` key, so no existing reader changes."
kind = "behavior"
tool = "node"
case = "../../../cases/feat/mm/writings/draw_classes.mjs"
args = ["${case}", "jgir"]
expect_exit = 0
expect_stdout_contains = ["draw classes jgir: PASS", "pair=add+mul", "chosen=add"]
expect_output_not_contains = ["FAIL"]
timeout_ms = 60000

[[tests]]
name = "draw_classes.egraph"
desc = "`std::jgir egraph=true` writes the document `egraph-serialize` reads instead of the display document: exactly `nodes`, `root_eclasses` and `class_data`; every child of a node is an e-class of the document and every root is one; every class says what computing its value costs; and the two writings `x + x` and `x * 2` are one e-class, which is what makes the export worth opening in the community's viewer."
kind = "behavior"
tool = "node"
case = "../../../cases/feat/mm/writings/draw_classes.mjs"
args = ["${case}", "egraph"]
expect_exit = 0
expect_stdout_contains = ["draw classes egraph: PASS", "pair=one-eclass", "roots="]
expect_output_not_contains = ["FAIL"]
timeout_ms = 60000

[[tests]]
name = "draw_classes.guard"
desc = "The drawing check is not vacuous: run on a dump of the same program without `std::opt::saturate` — one writing per value, so no class can exist — it refuses, naming the case file and the dump line of the writing that stands alone (asserted to be the node line it read), and run on the dump the saturation produces it accepts. Examining zero classes is a failure in both directions, and the check is the same code in both."
kind = "behavior"
tool = "node"
case = "../../../cases/feat/mm/writings/draw_classes.mjs"
args = ["${case}", "guard"]
expect_exit = 0
expect_stdout_contains = ["draw classes guard: PASS", "DRAW guard red=test/cases/feat/mm/writings/saturate_draw.cml:", "DRAW guard green classes="]
expect_output_not_contains = ["FAIL"]
timeout_ms = 60000

[[tests]]
name = "draw_classes.params"
desc = "The pass declares `rounds: int = 6` and `strict: bool = false` in stdlib/std.cml, and a parameter written after the pass name reaches it: `rounds=0` applies no rule, so the program keeps the writing it had and the check of `draw_classes.guard` refuses that dump; `rounds=1` already leaves `x + x` and `x * 2` in one class; `strict=true` keeps the pair, because the integer rules hold bit for bit; `rounds=1+1` is read as an int; and `rounds=true` is refused at the call, naming the declaration's type (`The argument 'rounds' of 'std::opt::saturate' has type 'bool', not 'int'`), before anything runs."
kind = "behavior"
tool = "node"
case = "../../../cases/feat/mm/writings/draw_classes.mjs"
args = ["${case}", "params"]
expect_exit = 0
expect_stdout_contains = ["draw classes params: PASS", "DRAW params rounds0=no-class", "strict=one-class", "wrongtype=refused"]
expect_output_not_contains = ["FAIL"]
timeout_ms = 60000

[[tests]]
name = "draw_classes.extract"
desc = "The pass extracts nothing: the program it leaves is in the state with several writings, a pass that consumes it (`std::nvm`) is given one writing per value by the driver and prints 42, `std::opt::extract` before it does the same, and a rewrite pass that does not declare that it accepts the state (`std::opt::fold`) is still refused with `PassNeedsExtraction` — the new rule is about a pass that asked for the state, not about every pass."
kind = "behavior"
tool = "node"
case = "../../../cases/feat/mm/writings/draw_classes.mjs"
args = ["${case}", "extract"]
expect_exit = 0
expect_stdout_contains = ["draw classes extract: PASS", "DRAW extract printed=42 refused_fold=1"]
expect_output_not_contains = ["FAIL"]
timeout_ms = 60000
