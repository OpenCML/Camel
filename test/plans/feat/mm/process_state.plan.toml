id = "mm.process_state"
order = 372
tier = "fast"
tags = ["feat", "mm", "gc", "process-state"]
desc = """
The process-level state of the runtime, registered by the owner that holds it (C24).

The allocator is one per process; the object root set and the graph sweeper belong to one `Context`
each. `test::contexts` creates a second context beside the running one, collects the heap while both
are alive, makes a registration of its own and takes it back, and reads how many `runtimeGraphRoots`
entries the allocator holds at each step from `rootSourceDescriptions()` -- the list the profiler and
`std::gcsnap` already report. `before=1 second=2` is one registration per context, and
`released=2 own=1 own_released=0` says that taking one registration back removes that one and
nobody else's.

Before the fix the allocator held one slot and every later registration replaced the earlier one:
`second` read 1 (the second context took the running one's over), the pass's own registration took
the second's over (`released` read 0), and the major collection taken in between marked almost
nothing -- the string constants the running program reaches through its own graphs were swept, and
the back end printed `contexts-1c2contexts-1c3` for `contexts-1-2-3`. That corrupted line, not a
crash, is what the defect cost the program itself.
"""

[[tests]]
name = "process_state.two_contexts_nvm"
desc = "A second Context beside the running one registers its own root set instead of taking the running one's over, and a registration taken back removes only its own entry: the allocator holds 1 runtimeGraphRoots entry before, 2 while both contexts exist and 2 again after the pass's own registration is released (own 1 -> 0), the running program's graph survives the major collection taken in between, and the back end prints the program's line -- before the fix that line read contexts-1c2contexts-1c3, its string constants swept as unreachable."
kind = "behavior"
case = "../../../cases/feat/mm/gc/contexts.cml"
args = ["--gc", "generational", "${case}", "test::contexts", "${run_nvm}"]
expect_exit = 0
expect_stdout_contains = ["CONTEXTS before=1 second=2 released=2 own=1 own_released=0 alive=1", "contexts-1-2-3"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000

[[tests]]
name = "process_state.two_contexts_fvm"
desc = "The same reading on the bytecode back end: the registrations are the allocator's, not a back end's."
kind = "behavior"
case = "../../../cases/feat/mm/gc/contexts.cml"
args = ["--gc", "generational", "${case}", "test::contexts", "${run_fvm}"]
expect_exit = 0
expect_stdout_contains = ["CONTEXTS before=1 second=2 released=2 own=1 own_released=0 alive=1", "contexts-1-2-3"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000