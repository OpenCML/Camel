id = "mm.buffers"
order = 370
tier = "fast"
tags = ["feat", "mm", "array", "buffer", "dlpack"]
desc = "Compact array storage: a small numeric array is inline, a view promotes it once and shares the buffer, buffer bytes are counted, and DLPack export/import is zero-copy (docs/design/arrays-memory/README.cn.md, sections 2 and 3.3)."

# `std::gc::buffers` runs the buffer self-test and prints its counters; the program is empty.
[defaults]
kind = "behavior"
case = "../../../cases/feat/mm/buffers.cml"
expect_exit = 0
expect_stdout_contains = ["BUFFER_SELFTEST ok"]
expect_output_not_contains = ["Segmentation fault", "dumped core", "[Error]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000

[[tests]]
name = "buffers.selftest"
desc = "The core self-test: inline int[3], promotion by a view, int[100] buffer backed, zero-copy DLPack round trip."
args = ["${case}", "std::gc::buffers", "std::nvm"]

[[tests]]
name = "buffers.selftest_alias"
desc = "The same self-test through its short alias."
args = ["${case}", "std::gcbuffers", "std::nvm"]