id = "mm.gc"
order = 365
tier = "feat"
tags = ["feat", "mm", "gc"]

[[tests]]
name = "gc.verify_stress_nvm"
desc = "Checks GC verification and deterministic stress requests can run at NVM safepoints."
kind = "behavior"
case = "../../../cases/feat/mm/gc/gc_fib10.cml"
args = ["${case}", "std::gc::verify", "${run_nvm}"]
env = ["CAMEL_GC_VERIFY=both", "CAMEL_GC_STRESS_ALLOC=5", "CAMEL_GC_STRESS_SAFEPOINT=1", "CAMEL_GC_STRESS_MODE=major"]
expect_exit = 0
expect_stdout_contains = ["\"ok\":true", "Fibonacci(10) = 55"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_duration_seconds"]
timeout_ms = 4000

