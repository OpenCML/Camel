args = ["${case}", "when_rules::apply", "std::nvm"]
envs = ["CAMEL_GC_POISON=1"]
expect_exit = 0
expect_stdout_contains = ["7 10 5 12", "10 2.5"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

