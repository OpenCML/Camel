[[tests]]
name = "gc.snapshot_json"
desc = "Checks the GC snapshot pass exposes assertion-friendly counters and root-source data."
kind = "behavior"
case = "../../../cases/feat/mm/gc/gc_fib10.cml"
args = ["${case}", "std::gcsnap"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
    const payload = JSON.parse(input.stdout)
    assert(payload.summary.regionCount >= 7, `expected memory regions, got ${payload.summary.regionCount}`)
    assert(payload.summary.objectCount >= 1, "expected at least one object in the snapshot")
    assert(payload.gc.rootSourceCount >= 1, "expected at least one root source")
    assert(Array.isArray(payload.gc.rootSources), "expected root source list")
    assert(payload.gc.rootSources.some((name) => name.startsWith("runtimeGraphRoots")), "expected runtime graph roots")
    assert(Number.isInteger(payload.gc.rememberedSetSize), "expected remembered-set size")
    assert(payload.foreignResources, "expected foreign resource diagnostics")
    assert(Number.isInteger(payload.foreignResources.liveControlBlocks), "expected live foreign resource count")
    assert(Number.isInteger(payload.foreignResources.activeRootedHandles), "expected active rooted foreign handles")
    assert(Number.isInteger(payload.foreignResources.activePinnedHandles), "expected active pinned foreign handles")
    assert(payload.regions.some((region) => region.name === "elderGenSpace"), "expected elder region")
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

