args = ["--gc", "generational", "${case}", "std::gc::verify", "std::prl gc_stress=true"]
envs = ["CAMEL_COLL_VALIDATE=1", "CAMEL_COLL_LEAF_CAPACITY=2", "CAMEL_COLL_FANOUT=4", "CAMEL_GC_VERIFY=both", "CAMEL_GC_STRESS_ALLOC=3", "CAMEL_GC_STRESS_SAFEPOINT=1", "CAMEL_GC_STRESS_MODE=both"]
expect_stdout_contains = ["\"ok\":true", "m=150/1124950 grown=160/2015440 cut=66/1239480", "[1, 1] [189, 35721] [0] false true", "s=260 k=160 both=148 either=272 only=12 subset=true", "grid=170 hit=key-24 miss=? items=170", "true false true 150 1124950"]
# CPU 15.32 s, 15 s and 15.49 s in the three windows taken for this arm on 2026-10-24:
# 1.63x the busiest, rounded up to the next 1000 ms, is 26 s. The head says what
# std::prl gc_stress=true does here, and the tiny case keeps its 300 s timeout.
cpu_budget_ms = 26000
timeout_ms = 300000

[[tests]]
name = "gc.collection_constant_trees_nvm"
desc = "Collection constants large enough to be trees, stored in the static area of a graph by std::macro, on std::nvm under heap verification and a collection every seventh allocation and fortieth safepoint (the non-moving collector; the program makes some ten thousand allocations): every table of the constant, and what the tables hold, is carried over and stays alive, and the tables built from the constant at run time share its unchanged ones."
case = "../../../cases/compile/collections/macro_constant_trees.cml"
args = ["${case}", "std::macro", "std::gc::verify", "${run_nvm}"]
envs = ["CAMEL_COLL_VALIDATE=1", "CAMEL_GC_VERIFY=both", "CAMEL_GC_STRESS_ALLOC=7", "CAMEL_GC_STRESS_SAFEPOINT=40", "CAMEL_GC_STRESS_MODE=both"]
timeout_ms = 180000
expect_stdout_contains = ["\"ok\":true", "400 305471 v1 v399 v144", "400 576520 last ? 400 305471 v0", "true false true", "600 true false 600 false 599 1 {w0}", "300 42 22 22 -21", "301 441"]

