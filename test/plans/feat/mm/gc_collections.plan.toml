id = "mm.gc_collections"
order = 369
tier = "milestone"
tags = ["feat", "mm", "gc", "collections", "map", "set"]
desc = "Maps and sets under collection stress: a table keeps its keys and values alive and follows them when they move (docs/technical/31_map_and_set.md, section 5; docs/technical/24_gc_verification_guide.md)."

# One program builds maps and sets entry by entry out of strings, arrays, tuples, boxes of
# `T?` and other maps, so that almost every table it allocates becomes garbage. It runs with
# heap verification around every collection and a collection requested every third
# allocation, with the collector that does not move objects and with the one that does. The
# output must be exactly that of an undisturbed run.

# Thirty-six of the entries below declare their own cost bound (cpu_budget_ms) and their timeouts
# are liveness bounds, by
# (the rule (a)):
#
#   "改量 CPU 时间，不量墙钟。共享主机上的墙钟随负载漂移 ... 进程的 CPU 时间（用户态 + 内核态）基本
#    不随负载变"
#
# Each of those entries is one fixed program under the collection stress, so a reading is its own CPU
# time against its work. They are exactly the entries this plan reddened on the loaded host through
# the runner's 4x margin: their wall read 15.7-44.3 s in the first window and 16.3-34.9 s in the
# second and 21.3-50.8 s in the third, against the 15 s that the plan-wide 60 s default timeout
# allows, and the load is other people's work (the host's 1-minute load average read
# 76.41/76.92/80.97, 85.69/91.25/84.56 and up to 112.8 in those three windows).
# The twenty-four nvm, fvm and jit arms were measured at three run lengths on 2026-10-24: in
# eleven slow plans in one run at -Jobs 8
# (186 tests), then this plan in a run of fifteen plan files, then this plan in a run of three
# plan files (76 tests) -- with each entry's own CPU readings beside it: 1.63x the highest of
# the three is the budget, rounded up to the next 1000 ms, which is the headroom the four
# resnet referees of feat/modules/autodiff.plan.toml took. The CPU figures of these entries
# spread 0.3-3.5 % across the three windows where their walls spread 9-84 %: on this host the
# wall of a fixed program moved by up to four fifths while its CPU time moved by at most 3.5 %.
#
# The thirty-six entries also declare their own timeout_ms: the plan-wide 60 s default would have
# the wall clock decide again (2.7x the busiest wall of the tree cases of those twenty-four, 1.4x
# of the tiny ones), so the tree cases take 120 s and the tiny ones 300 s -- 5.5x and 6.8x their
# busiest walls, which is the hang detector the timeout is for. The twelve `_prl`
# arms below keep the timeout of their case, and the note at the end of this head gives its factor.
# The twenty-two `_prl` arms of the collection-stress cases used to run the program and not the
# stress. The answer to the question the earlier note left open is the scheduler's safepoint
# policy: the parallel scheduler's gate paced its collections -- after a collection the next
# started no sooner than twice the time it took
# (src/passes/sched/taskflow/taskflow.cpp#TaskflowGcGate::collect, which holds the collector at a
# third of a production run) -- and skipped 3,525 of the 3,532 polls the tree cases reached and
# 627 of the 630 the small ones reached. Those arms were left with 3 to 18 collections, at most
# two of them while a flow was running, against the 3,538 the same tree case makes on std::fvm and
# the 4,235 it makes on std::nvm; the collector was reached and the program ran: 6,555 operator
# calls and 5,772 allocations, the same numbers as on std::fvm, and the same lines of output.
# The twenty-two now ask for their collections to be served one for one
# (std::prl gc_stress=true, the pass parameter the rule asks for, named
# to say what it does; every run that does not write it keeps the pacing, which is what
# feat/mm/gc_elder_exhaustion.plan.toml sizes its std::tf arms
# against), and they read what their nvm and fvm siblings read: 9.02-9.47 s of CPU for the six tree
# cases and 15.00-15.56 s for the six tiny ones, against 8.88-10.41 s and 14.72-17.53 s on those
# two back ends, with 3,535 major collections in place of 6 to 9 and 78 to 1,014 while a flow was
# running in place of at most two. The ten small arms stay under a second: 0.36-0.72 s of CPU, 633
# major collections in place of 5 or 6, and the plan-wide default timeout still covers the
# runner's 4x margin 22 times over.
# The two collection-constant `_prl` arms carry no control, because the gate never held their work
# back: their programs run in one flow, so their collections come from the interpreter's safepoints
# and not from the gate (4,621 major collections with 17 of their 21 polls capped, against 4,626
# with none capped; 45 against 55 for the small constant, which collects at every first allocation
# anyway).
# The twelve `gc.collection_trees_*_prl` entries declare a bound and a timeout of their own, taken
# from the three windows measured for them on 2026-10-24 (1.63x the busiest of the three, rounded
# up to the next 1000 ms; each arm records its three readings beside the number). Their timeouts are
# the ones their case already carried -- 120 s is 4.0x the busiest tree wall these windows read and
# 300 s 5.7x the busiest tiny one, where the nvm tiny arm read 72.57 s under the same 300 s -- and
# one arm's wall moved from 17.9 s to 29.7 s while its CPU moved from 9.09 s to 9.27 s, which is
# why the bound is CPU. These twelve readings were taken on the loaded host the way the
# twenty-four's were, and every run of them since has stayed inside the bound they set.

[defaults]
kind = "behavior"
case = "../../../cases/feat/mm/gc/gc_collections.cml"
expect_exit = 0
expect_stdout_contains = ["\"ok\":true", "map entries=60 total=73810", "m[7]=[7, 49, 8] m[59]=[59, 3481, 60] has60=false", "after remove: 10 [key-0, key-1, key-2, key-3, key-4, key-5, key-6, key-7, key-8, key-9]", "set size=80 has79=true has80=false", "intersect=60 union=80 difference=20", "pairs=40 hit=key-26 miss=?", "nested=12 last=12 total=650", "merge same=true items=[(key-0, [0, 0, 1]),"]
expect_output_not_contains = ["Segmentation fault", "dumped core", "\"ok\":false", "[Error]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000

[[tests]]
name = "gc.collections_major_stable_nvm"
desc = "Maps and sets on std::nvm with the non-moving collector, stress mode major, heap verification before and after every collection."
args = ["${case}", "std::gc::verify", "${run_nvm}"]
envs = ["CAMEL_GC_VERIFY=both", "CAMEL_GC_STRESS_ALLOC=3", "CAMEL_GC_STRESS_SAFEPOINT=1", "CAMEL_GC_STRESS_MODE=major"]

