envs = ["CAMEL_COLL_VALIDATE=1", "CAMEL_GC_VERIFY=both", "CAMEL_GC_STRESS_ALLOC=7", "CAMEL_GC_STRESS_SAFEPOINT=40", "CAMEL_GC_STRESS_MODE=both"]
timeout_ms = 180000
expect_stdout_contains = ["\"ok\":true", "400 305471 v1 v399 v144", "400 576520 last ? 400 305471 v0", "true false true", "600 true false 600 false 599 1 {w0}", "300 42 22 22 -21", "301 441"]

