name = "gc.collection_constants_fvm"
desc = "Maps and sets stored in the static area of a graph by std::macro, with string, array, map and function values, on std::fvm under heap verification and a collection at every allocation (the non-moving collector): what the constants hold is carried over with them and stays alive."
