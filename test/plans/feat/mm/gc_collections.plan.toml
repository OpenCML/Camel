name = "gc.collection_trees_tree_major_stable_nvm"
desc = "Maps and sets of 150 to 260 entries with string and tuple keys and array and `T?` values, built and cut down entry by entry while the earlier versions are kept, under the default widths on std::nvm with the non-moving collector, stress mode major, heap verification before and after every collection."
