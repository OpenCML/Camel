# ---- Trees of tables (docs/technical/31_map_and_set.md, section 5.3) ----
#
# The program above keeps its collections small enough to be single tables under the default
# widths. Here it runs again with tiny tables (2 entries to a leaf, 4 children to a branch), so
# that its maps and sets are trees four and five levels high whose branches the collector has
# to trace and, when it moves a table, to update; then a program whose collections are trees
# under the default widths too. CAMEL_COLL_VALIDATE=1 checks every table an operation returns.

[[tests]]
name = "gc.collections_tiny_major_stable_nvm"
desc = "Maps and sets as trees of tiny tables on std::nvm with the non-moving collector, stress mode major, heap verification before and after every collection."
args = ["${case}", "std::gc::verify", "${run_nvm}"]
envs = ["CAMEL_COLL_VALIDATE=1", "CAMEL_COLL_LEAF_CAPACITY=2", "CAMEL_COLL_FANOUT=4", "CAMEL_GC_VERIFY=both", "CAMEL_GC_STRESS_ALLOC=3", "CAMEL_GC_STRESS_SAFEPOINT=1", "CAMEL_GC_STRESS_MODE=major"]

