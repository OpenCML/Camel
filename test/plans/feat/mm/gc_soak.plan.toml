id = "mm.gc_soak"
order = 368
tier = "slow"
tags = ["feat", "mm", "gc", "soak"]
desc = """
Soak and scale tests of both collectors, in the sizes that fit the default test set (the
minute-long ones are in test/plans/perf/gc.plan.toml).

gc_soak allocates and drops without end around a live set that stays the same; the memory the
collector holds, read from its statistics line (CAMEL_GC_STATS=1), must not depend on how long
the program runs. gc_live_large keeps tens of megabytes of small objects alive, more than the
first elder segment holds. gc_prl_blocked_worker runs a parallel map in which one worker sits
in a long operator, so the stop-the-world handshake gives up, while the others allocate far
more than the birth space holds. The last tests set a heap limit that the program exceeds and
check the diagnostic.
"""

[[tests]]
name = "gc_soak.generational.3000.nvm"
desc = "3000 steps around a live table of 20,000 rows with the generational collector (nvm): the elder space stays at its first segment, and nearly nothing is promoted beyond the table."
kind = "behavior"
case = "../../../cases/feat/mm/gc/gc_soak.cml"
args = ["${case}", "--arg", "rows=20000", "--arg", "reps=3000", "${run_nvm}"]
envs = ["CAMEL_GC=generational", "CAMEL_GC_STATS=1"]
expect_exit = 0
expect_stdout_contains = ["gc_soak total=1120992"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const line = /.camel. gc: major=.*/.exec(input.normalized.stderr)
assert(line !== null, `no statistics line of the allocator in stderr: ${input.normalized.stderr}`)
const field = (name) => {
    const m = new RegExp(name + '=([0-9.]+)').exec(line[0])
    assert(m !== null, `no ${name} in: ${line[0]}`)
    return Number(m[1])
}
assert(field('minor') >= 5, `minor collections ran: ${line[0]}`)
assert(field('elder_reserved_mb') <= 32, `the elder space did not grow: ${line[0]}`)
assert(field('elder_live_mb') <= 8 && field('large_high_water_mb') <= 4, `no growth of the old spaces: ${line[0]}`)
assert(field('promoted') <= 60000, `only the live table is promoted, whatever the number of steps: ${line[0]}`)
}
"""
timeout_ms = 60000

[[tests]]
name = "gc_soak.mark_sweep.3000.nvm"
desc = "3000 steps around a live table of 20,000 rows with the default collector (nvm): the elder space holds the table plus one budget of garbage, at most two segments."
kind = "behavior"
case = "../../../cases/feat/mm/gc/gc_soak.cml"
args = ["${case}", "--arg", "rows=20000", "--arg", "reps=3000", "${run_nvm}"]
envs = ["CAMEL_GC=mark-sweep", "CAMEL_GC_STATS=1"]
expect_exit = 0
expect_stdout_contains = ["gc_soak total=1120992"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const line = /.camel. gc: major=.*/.exec(input.normalized.stderr)
assert(line !== null, `no statistics line of the allocator in stderr: ${input.normalized.stderr}`)
const field = (name) => {
    const m = new RegExp(name + '=([0-9.]+)').exec(line[0])
    assert(m !== null, `no ${name} in: ${line[0]}`)
    return Number(m[1])
}
assert(field('elder_reserved_mb') <= 64, `the elder space is bounded by the live set plus one budget: ${line[0]}`)
assert(field('minor') === 0, `the default collector does not copy: ${line[0]}`)
}
"""
timeout_ms = 60000

