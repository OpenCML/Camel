args = ["${case}", "--arg", "mb=256", "--arg", "reps=10", "${run_nvm}"]
envs = ["CAMEL_GC=generational", "CAMEL_GC_HEAP_LIMIT_MB=64"]
expect_exit = 1
expect_output_contains = ["MemoryExhausted", "The auto space (run-time values) is exhausted", "of the limit of 64.0 MB are in use", "CAMEL_GC_HEAP_LIMIT_MB"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 120000

