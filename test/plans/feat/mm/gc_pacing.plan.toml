# ---------------------------------------------------------------------------------------------
# Blocks held by promoted arrays: a major collection is asked for by their volume.
# ---------------------------------------------------------------------------------------------

[[tests]]
name = "gc_pacing.promoted_fvm"
desc = "A rolling window of 16 rows of 1 MB is kept; a row survives the four minor collections that promote it and is then garbage. The promoted block bytes (15 MB after the last sweep) ask for a major collection at the 4 MB floor: 64 majors in 300 steps, and the peak is 34.6 MB, which is the live window plus the floor and the young rows, not the 300 MB allocated. CAMEL_GC_GROWTH_PERCENT=25 keeps the budget at the floor. Pipeline: std::fvm."
kind = "behavior"
case = "../../../cases/feat/mm/gc/gc_promoted_blocks.cml"
args = ["${case}", "--arg", "steps=300", "--arg", "rows=16", "--arg", "size=131072", "${run_fvm}"]
envs = ["CAMEL_GC_STATS=1", "CAMEL_GC_GROWTH_PERCENT=25"]
expect_exit = 0
expect_stdout_contains = ["gc_promoted_blocks base=0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const m = /gc_promoted_blocks base=([0-9]+) peak=([0-9]+) low=([0-9]+) released=([0-9]+) total=([0-9]+)/.exec(input.normalized.stdout)
assert(m !== null, `no result line: ${input.normalized.stdout}`)
const [base, peak, low, released, total] = m.slice(1).map(Number)
assert(base === 0, `base ${base}, expected 0`)
assert(total === 39321600, `total ${total}, expected 39321600 (300 x 131072)`)
assert(peak >= 30000000 && peak <= 40000000, `peak ${peak}, expected the live window (16 MB) plus the young rows and the floor (30 to 40 MB)`)
assert(released >= 250, `${released} blocks released, expected the dropped rows (at least 250)`)
const line = /.camel. gc: major=.*/.exec(input.normalized.stderr)
assert(line !== null, `no statistics line: ${input.normalized.stderr}`)
const field = (name) => {
  const f = new RegExp(name + '=([0-9.]+)').exec(line[0])
  assert(f !== null, `no ${name} in: ${line[0]}`)
  return Number(f[1])
}
const major = field('major')
assert(major >= 20, `${major} major collections, expected the promoted blocks to ask for many (at least 20)`)
assert(major === field('by_elder_block_budget'), `every collection is asked for by the promoted-block budget: ${line[0]}`)
assert(field('by_elder_exhausted') === 0, `the elder-space allocation budget asked for a collection: ${line[0]}`)
const budget = field('elder_block_budget_mb')
assert(budget >= 3.9 && budget <= 5.0, `promoted-block budget ${budget} MB, expected the 4 MB floor (25 % of 15 MB is less)`)
assert(field('elder_block_live_mb') >= 12, `the promoted live blocks are not counted: ${line[0]}`)
}
"""
timeout_ms = 120000

