# ---------------------------------------------------------------------------------------------
# A training-style loop: the peak stays at the live set plus one window.
# ---------------------------------------------------------------------------------------------

[[tests]]
name = "gc_pacing.training_400"
desc = "400 training steps (batch 1024, model 512 x 4): 5.9 MB peak over a 2.1 MB live set, the longest stop is a 3.6 MB window, 2685 blocks released, and the loss falls to 0.0035. Pipeline: std::fvm."
kind = "behavior"
case = "../../../cases/feat/mm/gc/gc_training_peak.cml"
args = ["${case}", "--arg", "steps=400", "--arg", "batch=1024", "--arg", "width=512", "${run_fvm}"]
envs = ["CAMEL_GC_STATS=1"]
expect_exit = 0
expect_stdout_contains = ["gc_training_peak base=2117768"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const m = /gc_training_peak base=([0-9]+) peak=([0-9]+) low=([0-9]+) released=([0-9]+) loss=([0-9.eE+-]+)/.exec(input.normalized.stdout)
assert(m !== null, `no result line: ${input.normalized.stdout}`)
const [base, peak, low, released, loss] = m.slice(1).map(Number)
assert(base > 2000000 && base < 2200000, `base ${base}, expected the batch and the model (about 2.1 MB)`)
assert(peak - base >= 3000000, `peak ${peak} is only ${peak - base} above base: the pacing window was not used`)
assert(peak - base <= 4200000, `peak ${peak} is ${peak - base} above base, expected the window (3.6 MB) and a step's blocks, not the work done`)
assert(low - base <= 200000, `low ${low} is ${low - base} above base, expected the live set between two windows`)
assert(released >= 2400, `${released} blocks released, expected the churn of 400 steps`)
assert(loss > 0.0005 && loss < 0.01, `loss ${loss}, expected the model to have trained (0.0005 to 0.01)`)
const line = /.camel. gc: major=.*/.exec(input.normalized.stderr)
assert(line !== null, `no statistics line: ${input.normalized.stderr}`)
const field = (name) => {
  const f = new RegExp(name + '=([0-9.]+)').exec(line[0])
  assert(f !== null, `no ${name} in: ${line[0]}`)
  return Number(f[1])
}
assert(field('by_large_budget') === 0, `the large-object budget asked for a collection: ${line[0]}`)
assert(field('minor') >= 7, `${field('minor')} minor collections, expected the loop to have filled several windows`)
}
"""
timeout_ms = 120000

[[tests]]
name = "gc_pacing.training_800"
desc = "Twice the training steps: the peak stays at the live set plus one window (the same bound as 400 steps), the blocks released double and the loss halves. Pipeline: std::nvm."
kind = "behavior"
case = "../../../cases/feat/mm/gc/gc_training_peak.cml"
args = ["${case}", "--arg", "steps=800", "--arg", "batch=1024", "--arg", "width=512", "${run_nvm}"]
envs = ["CAMEL_GC_STATS=1"]
expect_exit = 0
expect_stdout_contains = ["gc_training_peak base=2117768"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const m = /gc_training_peak base=([0-9]+) peak=([0-9]+) low=([0-9]+) released=([0-9]+) loss=([0-9.eE+-]+)/.exec(input.normalized.stdout)
assert(m !== null, `no result line: ${input.normalized.stdout}`)
const [base, peak, low, released, loss] = m.slice(1).map(Number)
assert(base > 2000000 && base < 2200000, `base ${base}, expected about 2.1 MB`)
assert(peak - base <= 4200000, `peak ${peak} is ${peak - base} above base: doubling the work must not raise the peak`)
assert(released >= 5000, `${released} blocks released, expected the churn of 800 steps`)
assert(loss > 0.0005 && loss < 0.01, `loss ${loss}, expected the model to have trained`)
const line = /.camel. gc: major=.*/.exec(input.normalized.stderr)
assert(line !== null, `no statistics line: ${input.normalized.stderr}`)
const minor = Number(new RegExp('minor=([0-9]+)').exec(line[0])[1])
assert(minor >= 15, `${minor} minor collections, expected the loop to have filled many windows`)
}
"""
timeout_ms = 120000