id = "mm.gc_pacing"
order = 367
tier = "feat"
tags = ["feat", "mm", "gc", "pacing"]
desc = """
How often the allocator asks for a collection when a program allocates large objects, and how
much the large-object space holds at most. One array of 40 MB stays alive while 200 temporary
arrays of 0.8 MB each are allocated and dropped, one per call (190.7 MB in all). After a sweep
the budget is the larger of the floor (CAMEL_GC_LARGE_BUDGET_MB, default 4 MB) and
CAMEL_GC_GROWTH_PERCENT percent of the volume the sweep left, so the space holds at most
live * (1 + percent / 100) plus the allocation that crossed the budget, and the number of
collections is the volume allocated divided by the budget. Both are read from the allocator's
statistics line (CAMEL_GC_STATS=1); nothing here depends on time, and the program runs one node
at a time, so the numbers are the same on every run.
"""

[[tests]]
name = "gc_pacing.growth_default_fvm"
desc = "Default growth (100 percent): the budget equals the live volume, the space doubles between collections: 4 collections, high-water mark 77.8 MB for 38.9 MB alive. Pipeline: std::fvm."
kind = "behavior"
case = "../../../cases/feat/mm/gc/gc_large_pacing.cml"
args = ["${case}", "${run_fvm}"]
envs = ["CAMEL_GC_STATS=1"]
expect_exit = 0
expect_stdout_contains = ["gc_large_pacing total=25000000"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const line = /.camel. gc: major=.*/.exec(input.normalized.stderr)
assert(line !== null, `no statistics line of the allocator in stderr: ${input.normalized.stderr}`)
const field = (name) => {
    const m = new RegExp(name + '=([0-9.]+)').exec(line[0])
    assert(m !== null, `no ${name} in: ${line[0]}`)
    return Number(m[1])
}
const major = field('major')
const byBudget = field('by_large_budget')
const live = field('large_live_mb')
const high = field('large_high_water_mb')
const budget = field('budget_mb')
assert(field('growth_percent') === 100, `growth setting in force: ${line[0]}`)
assert(major === byBudget, `every collection is asked for by the large-object budget: ${line[0]}`)
assert(major >= 4 && major <= 4, `${major} collections, expected 4 to 4: ${line[0]}`)
assert(Math.abs(budget - 38.9) <= 0.2, `budget ${budget} MB, expected 38.9: ${line[0]}`)
// The space never holds more than what the last sweep left, plus the budget, plus the one
// temporary array (0.8 MB) whose allocation crossed the budget.
assert(high <= live + budget + 0.9, `high-water mark ${high} MB above live ${live} + budget ${budget} + 0.9: ${line[0]}`)
assert(high >= live + budget - 0.15, `high-water mark ${high} MB below live ${live} + budget ${budget}: the budget was not used: ${line[0]}`)
}
"""
timeout_ms = 120000

