id = "mm.gc_pacing"
order = 367
tier = "slow"
tags = ["feat", "mm", "gc", "pacing", "block"]
desc = """
What asks for a collection, how much one frees, and how high the program's memory gets.

Array data lives in data blocks, outside the collected heap. A minor collection is asked for when
the birth space plus the block bytes allocated since the last collection reach 90 % of the birth
space (3,774,873 bytes by default), so the window of block bytes a collection lets through is
fixed and the high-water mark is the live set plus one window plus the one allocation that crossed
it, whatever the number of steps (the first two cases). A churn-only program keeps nothing, so its
high-water mark is the window plus one block and it does not grow with the work done (the next
cases: the three back ends, the mark-sweep collector and a larger birth space).

A block held by an array that is promoted to the elder space can be released only by a major
collection (a minor collection does not sweep the elder space). The allocator counts the block
bytes of promoted values and asks for a major collection once they exceed a budget: the larger of
the CAMEL_GC_LARGE_BUDGET_MB floor (default 4 MB) and CAMEL_GC_GROWTH_PERCENT percent (default 100)
of the block bytes the last sweep left in promoted values. The rolled-window case keeps `rows`
arrays alive, so rows must survive the four minor collections that promote them and their blocks
become the garbage that drives the major collections; without that path the high-water mark would
grow with the number of steps. The training case is the shape of H40 section 8 (integer labels
cast inside the differentiated function, softmax cross entropy, grad, sgd): the batch and the
model stay alive and the peak stays at the live set plus one window, at twice the steps too.

Every number below is read from the program (`std::mem::blocks()`) or the allocator's statistics
line (CAMEL_GC_STATS=1). Nothing depends on time; the collections are counted, and the bounds are
wide enough for the three back ends (the parallel scheduler may allocate the same values in a
different order).
"""

# ---------------------------------------------------------------------------------------------
# A live set plus one temporary per step: the peak is the live set plus one window.
# ---------------------------------------------------------------------------------------------

[[tests]]
name = "gc_pacing.live_fvm"
desc = "40 MB live, 200 temporaries of 0.8 MB: the peak is 4.8 MB above the live set (3.6 MB window + 0.8 MB temporary), the low point is one temporary above it, and the block of the live array never enters the large-object space (no collection is asked for by the large-object budget). Pipeline: std::fvm."
kind = "behavior"
case = "../../../cases/feat/mm/gc/gc_block_pacing.cml"
args = ["${case}", "--arg", "steps=200", "--arg", "temp=100000", "${run_fvm}"]
envs = ["CAMEL_GC_STATS=1"]
expect_exit = 0
expect_stdout_contains = ["gc_block_pacing base=40000000"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const m = /gc_block_pacing base=([0-9]+) peak=([0-9]+) low=([0-9]+) released=([0-9]+) total=([0-9]+)/.exec(input.normalized.stdout)
assert(m !== null, `no result line: ${input.normalized.stdout}`)
const [base, peak, low, released, total] = m.slice(1).map(Number)
assert(base === 40000000, `base ${base}, expected 40000000 (5e6 ints of 8 bytes)`)
assert(total === 20000000, `total ${total}, expected 20000000 (200 temporaries of 100000)`)
assert(peak - base >= 3600000, `peak ${peak} is ${peak - base} above base, expected the 3.6 MB window to be used`)
assert(peak - base <= 5000000, `peak ${peak} is ${peak - base} above base, expected the live set plus the window plus one temporary (4.4 MB)`)
assert(low - base >= 700000, `low ${low} is ${low - base} above base, expected at least one temporary block`)
assert(low - base <= 900000, `low ${low} is ${low - base} above base, expected the temporary block and nothing else: the collector ran too early`)
assert(released >= 190, `${released} blocks released, expected all but the window (at least 190)`)
const line = /.camel. gc: major=.*/.exec(input.normalized.stderr)
assert(line !== null, `no statistics line: ${input.normalized.stderr}`)
const field = (name) => {
  const f = new RegExp(name + '=([0-9.]+)').exec(line[0])
  assert(f !== null, `no ${name} in: ${line[0]}`)
  return Number(f[1])
}
assert(field('by_large_budget') === 0, `the large-object budget asked for a collection: ${line[0]}`)
const minor = field('minor')
assert(minor >= 33 && minor <= 50, `${minor} minor collections, expected one per window (33 to 50)`)
}
"""
timeout_ms = 120000

