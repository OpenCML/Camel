id = "mm.gc_root_window"
order = 366
tier = "milestone"
tags = ["feat", "mm", "gc", "program"]

[[tests]]
name = "root_window.gru_lite.poison"
# Fast layer: `-Plan test/plans/feat/mm -Tier milestone -Jobs 8` reads it at 0.74 s,
# under the 2 s line, and the two entries beside it are already fast. The `residual_mlp` half of the
# pair is 3.08 s and stays where it is.
tier = "fast"
desc = "A pass-created Program and the graph versions reachable from it stay alive while its C++ holder needs them."
kind = "behavior"
case = "../../../cases/modules/nn/gru_lite.cml"
args = ["--gc-check", "poison", "${case}", "std::cxx::specialize", "std::opt", "tensor::fuse", "std::cxx::dce", "std::cxx::fold", "std::macro", "std::cxx::devirtualize", "std::fvm"]
expect_exit = 0
expect_stdout_contains = ["gru_lite metrics"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 120000

[[tests]]
name = "root_window.gru_lite.moving_stress"
desc = "The same holder remains valid when moving collection runs at every safepoint without poison."
tier = "fast"
kind = "behavior"
case = "../../../cases/modules/nn/gru_lite.cml"
args = ["--gc", "kind=generational", "--gc-stress", "safepoint=1,kind=minor", "--gc-check", "verify=both", "${case}", "std::cxx::specialize", "std::opt", "tensor::fuse", "std::cxx::dce", "std::cxx::fold", "std::macro", "std::cxx::devirtualize", "std::fvm"]
expect_exit = 0
expect_stdout_contains = ["gru_lite metrics"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 120000

[[tests]]
name = "root_window.residual_mlp.poison"
desc = "A different model exercises the same unrooted Program lifetime window."
kind = "behavior"
case = "../../../cases/modules/nn/residual_mlp.cml"
args = ["--gc-check", "poison", "${case}", "std::cxx::specialize", "std::opt", "tensor::fuse", "std::cxx::dce", "std::cxx::fold", "std::macro", "std::cxx::devirtualize", "std::fvm"]
expect_exit = 0
expect_stdout_contains = ["residual_mlp start"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 120000

[[tests]]
name = "root_window.residual_mlp.moving_stress"
desc = "The residual model remains valid under ordinary moving collection without poison."
tier = "fast"
kind = "behavior"
case = "../../../cases/modules/nn/residual_mlp.cml"
args = ["--gc", "kind=generational", "--gc-stress", "safepoint=1,kind=minor", "--gc-check", "verify=both", "${case}", "std::cxx::specialize", "std::opt", "tensor::fuse", "std::cxx::dce", "std::cxx::fold", "std::macro", "std::cxx::devirtualize", "std::fvm"]
expect_exit = 0
expect_stdout_contains = ["residual_mlp start"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
# 200 s, line 50 s. This case moves every young object at every safepoint and then runs the same
# pipeline as `residual_mlp_large_bytecode`, so its own cost is what decides the bound, and the
# slowest leg is the one that reds: the `linux-x64-nojit` leg read 39150, 45770, 47320 and 48120 ms
# of CPU over four runs (44996394183, 45005763652, 45007258569, 45003684718), while three runs of
# the same no-JIT build on the shared host read 22870, 24310 and 23800 ms. Its answer was right in
# every one of them (`value` equals `start`). 4 x 48120 ms is 192480, rounded up here to 200 s,
# which is 4.16x the worst CI reading and 8.2x the host's; the old 120 s drew a 30 s line through
# 48 s of work and redded the nojit leg on a run whose assertions all held.
timeout_ms = 200000
