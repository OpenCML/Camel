# The shapes the law leaves out, pinned as a reading. Rank three and above, and the vector-vector product
# whose answer is a number, have no cotangent overload, so the law is *chosen* and its own body has nothing
# for these operands. The walk refuses that by name, with the law, the operator and the ranks:
#
#     skip=rule-ranks uri=tensor:matmul_stated rule=matmul_stated_t node=<> position=0
#     ranks=(3, 2, 1, 1) operands=4
#
#     the law `matmul_stated_t` has no cotangent for `tensor:matmul_stated` at operands of rank
#     (3, 2, 1, 1), and it serves the ranks its cotangents are written for (node <>)
#
# `rule-ranks` is its own word, not `rule-shape`: that one means the law's *pattern* rejected the operand
# types and nothing was built, which is where this reading stood while the law named its ranks in the
# pattern (commit `5a2fed990`). A rule is instantiated with three type parameters -- the cotangent's element
# type and the two operand types -- so a head that names one shape's ranks serves that shape alone, and a
# ruleset files one rule per operator and arity (`SemanticDiag::DuplicateRuleForOperator`). Serving all three
# shapes from one key is what moved the ranks into the helpers, and the classification moved with them: one
# tells a reader to widen a pattern, the other to write the missing shape's law.
# The entry pins both sentences, not the exit code, so the day a batch axis is served it fails and names
# what replaced this.
[[tests]]
name = "matmul_t.rank_three_is_refused_by_name"
desc = "The product's linear call is `matmul_stated`, so the law that answers it is `matmul_stated_t`; it serves ranks one and two and refuses a batched operand by naming the law, the operator and the ranks: `skip=rule-ranks uri=tensor:matmul_stated rule=matmul_stated_t node=11 position=0 ranks=(3, 2, 1, 1) operands=4`, with the sentence `the law `matmul_stated_t` has no cotangent for `tensor:matmul_stated` at operands of rank (3, 2, 1, 1)`. Its own word and not `rule-shape`, because the pattern took the operands and the law's body is what declined. Pinned on both streams, not as an exit code, so the day the batch axis is served this entry fails rather than passing silently. The ranks list has one entry per operand -- the two tensors and the two stated lists -- and the `reason=` string is left unpinned because it names the helper's argument list rather than the law's"
kind = "negative"
case = "../../cases/compile/transforms/matmul_transpose_rank_three.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 1
expect_stdout_contains = ["transpose has no transpose for this function: the law `matmul_stated_t` has no cotangent for `tensor:matmul_stated` at operands of rank (3, 2, 1, 1)"]
expect_stderr_contains = ["skip=rule-ranks uri=tensor:matmul_stated rule=matmul_stated_t"]
# The node's number is where the compiler put it, so it is `<>` here and every other field of the
# line stays exact: the function, the skip's own word, the operator URI, the law, the operand
# position, the ranks and the operand count. The `reason=` string is left free, as the entry's own
# note says (it names the helper's argument list rather than the law), so the pinned text stops at
# `operands=4` and the line has to carry a `reason=` after it.
# Two streams name that node: the reading does it by number and the sentence prints the same number
# in `(node N)`. The assertion is the relation between them -- whatever number the reading names,
# the sentence has to name the same one -- so a walk that stopped at one node while the sentence
# reported another breaks it, and the two numbers are still tied together instead of waved through.
verify_script = """
({ input, assert }) => {
const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/<>/g, '\\d+')
const field = (text, name) => Number(text.split(name + '=')[1].split(/[ ,\]]/)[0])
const head = 'TRANSPOSE function=split_of_jvp_of_batched_sum_of_product_backward skip=rule-ranks uri=tensor:matmul_stated rule=matmul_stated_t node=<> position=0 ranks=(3, 2, 1, 1) operands=4'
const hits = input.normalized.stderr.split('\n').filter((l) => new RegExp('^' + esc(head) + ' reason=').test(l))
assert(hits.length === 1, `expected exactly one line like '${head} reason=...', found ${hits.length}`)
const named = /\(node ([0-9]+)\)/.exec(input.normalized.stdout)
assert(named, 'the sentence that says which law declined names the node it stopped at')
assert(Number(named[1]) === field(hits[0], 'node'), `the reading names node ${field(hits[0], 'node')}` + ` and the sentence names node ${named[1]}: one node, one number`)
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000

# The loop, which is the thing S2 is. Every row above is a first step, and a first step is not
# training. "The loss went down" is what any wrong gradient satisfies -- a gradient off by a constant
# factor still makes it go down -- so the criterion here is the curve itself: twelve rounds of
# `w = w - 0.03125 * dw`, the library's leg against the engine's `with_grad` leg on the same model
# with the same update rule, compared value by value. `1/32` is exact in binary and so is every
# literal, so the two legs are compared for equality and not against a tolerance, and the whole curve
# is pinned -- a future change to either leg moves a pinned value instead of only the difference.
#
# What this row does not claim: the loop composes `vjp`, not the name `grad`. `stdlib/vjp.cml#grad`
# is declared for `(x: float) => float`, and its general form -- the first `with` parameter, design
# principles 9.9 -- is the item still blocked on a lifted body calling a function value; `vjp` is the
# function `grad` is a reading of. The weights sit on ordinary parameters because that is the only
# channel `vjp` differentiates today, which is why the engine's leg keeps them in a `with` list and
# the two legs differ in where the weight sits and not in what they compute.
[[tests]]
name = "train.twelve_rounds_library_curve_is_the_engine_curve"
desc = "S2 trained for twelve rounds by the library's reverse transform, `vjp` -- `transpose(split(reinterp<jvp>(f)))`, the composition `grad` is a reading of -- against the engine's `with_grad` on the same tensor model (`x @ w`, `0.5 * sum(e * e)`, `x = [[1, 2], [3, 4]]`, `t = [[0, 0], [1, 1]]`, `w0 = [[0.5, 0.25], [0.125, 1]]`) with the same update rule `w = w - 0.03125 * dw`. The step size is a power of two and every literal is exact in binary, so the two legs are compared for equality and not against a tolerance: the case prints both curves and their largest difference, and this row pins all twelve values of both. It is the row that decides whether S2 can train on the library layer at all, and the reason it cannot say `grad`: that name is declared for `(x: float) => float` and its general form (the first `with` parameter, design principles 9.9) is blocked on a lifted body calling a function value."
kind = "behavior"
case = "../../cases/showcase_s2/train_curve.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_exact = "s2 curve library=[10.34375, 0.22930908203125, 0.1827995777130127, 0.18107431195676327, 0.1795608826687385, 0.1780609732736167, 0.17657359680496876, 0.17509864468616157, 0.17363601311700427, 0.17218559918157558, 0.17074730082370665, 0.16932101683972314]\ns2 curve engine=[10.34375, 0.22930908203125, 0.1827995777130127, 0.18107431195676327, 0.1795608826687385, 0.1780609732736167, 0.17657359680496876, 0.17509864468616157, 0.17363601311700427, 0.17218559918157558, 0.17074730082370665, 0.16932101683972314]\ns2 curve_max_abs_diff=0.000000000000e+00\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000
verify_script = '''
({ input, assert }) => {
const lines = input.normalized.stdout.trim().split(String.fromCharCode(10))
assert(lines.length === 3, `expected the two curves and their largest difference, found ${lines.length} line(s)`)
const curve = (name) => {
    const prefix = `s2 curve ${name}=`
    const line = lines.find((l) => l.startsWith(prefix))
    assert(line !== undefined, `no line reported for the ${name} curve`)
    return line.slice(prefix.length + 1, -1).split(', ').map(Number)
}
const library = curve('library')
const engine = curve('engine')
assert(library.length === 12, `the library's curve is ${library.length} values long, not 12`)
assert(engine.length === 12, `the engine's curve is ${engine.length} values long, not 12`)
for (let i = 0; i < 12; i += 1) {
    assert(Number.isFinite(library[i]), `round ${i}: the library's loss is not a number`)
    assert(Number.isFinite(engine[i]), `round ${i}: the engine's loss is not a number`)
    assert(library[i] === engine[i],
        `round ${i}: the library's loss ${library[i]} is not the engine's ${engine[i]}`)
}
const worst = lines[2].slice('s2 curve_max_abs_diff='.length)
assert(Number(worst) === 0, `the largest difference over the curve is ${worst}, not zero`)
}
'''
