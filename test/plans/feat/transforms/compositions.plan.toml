known_fail_msg = "vmap has no rule for `a constant`"
known_fail_note = "Wall: the batch pass has no rule for a constant -- `modules/transforms/vmap_operator.cpp:136` (the format is at `:143` today; the refusal is raised from `vmap.cpp`, `liftConstant`) refuses with `vmap has no rule for `a constant`` -- so `vmap(grad(f))` cannot be built. It used to be skipped behind `have-library-vjp.mjs`; the skip is gone and this is the red it hid (2026-11-02). Read again on 2026-11-03: the sentence is still there, with the cause appended in parentheses (`a constant of a type this transform has no batch for`), which is the fragment `known_fail_msg` pins."
kind = "behavior"
case = "../../../cases/transforms/compositions/vmap_grad_f.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const got = input.normalized.stdout.trim().split('\n').map((s) => Number(s.trim()))
const want = [2, 4, 6]
assert(got.length === want.length, `expected ${want.length} values, got ${JSON.stringify(got)}`)
want.forEach((w, i) => assert(Math.abs(got[i] - w) <= 1e-9, `element ${i}: got ${got[i]}, want ${w}`))
}
"""
timeout_ms = 30000

[[tests]]
name = "compositions.jvp_vjp_f"
desc = "jvp(vjp(f)) with f(x) = x*x, cotangent 1 and direction [0.5, 1.0, 1.5]: the pullback is 2vx, its derivative in x is 2v, so the directional derivative is [1, 2, 3]."
known_fail = ["nvm", "fvm"]
known_fail_msg = "takes a function that returns a `float`"
known_fail_note = "The reason as it stands today (B): `transpose` refuses the function on its exit type -- `modules/transforms/transpose_operator.cpp:100` requires `Float64`, and this case is written in `f32` (`(f32) => f32`), so the rejection lands before any arm is asked for. The reason this note pinned first (A, true before 2026-11-02): `stdlib/vjp.cml:73` calls `transpose(linear)` on a function that returns a pair, and `transpose` takes no function whose result is a pair -- the call is at `:74` today, and names `lin`. A and B are both recorded, and B is the one `known_fail_msg` pins, because what changed is the reading, not the mark: the case still fails, so the mark stands, and this entry now reports a drift away from either. It used to be skipped behind `have-library-vjp.mjs`; the skip is gone and this is the red it hid (2026-11-02)."
kind = "behavior"
case = "../../../cases/transforms/compositions/jvp_vjp_f.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const got = input.normalized.stdout.trim().split('\n').map((s) => Number(s.trim()))
const want = [1, 2, 3]
assert(got.length === want.length, `expected ${want.length} values, got ${JSON.stringify(got)}`)
want.forEach((w, i) => assert(Math.abs(got[i] - w) <= 1e-9, `element ${i}: got ${got[i]}, want ${w}`))
}
"""
timeout_ms = 30000

[[tests]]
name = "compositions.grad_vjp_g_zero"
desc = "grad(vjp(g)) with g(v) = sum(v*v) at v = [1, 2, 3, 4] must be all zeros: the pullback is linear in v, so its derivative is a constant and the gradient of a constant is 0. This is the one check the three combinations cannot make."
known_fail = ["nvm", "fvm"]
known_fail_msg = "takes a function that returns a `float`"
known_fail_note = "The reason as it stands today (B): the same call and the same rejection as the pair-typed combination -- `modules/transforms/transpose_operator.cpp:100` requires the function's exit type to be `Float64`, and this case's function is `(f32[4]) => f32`, so `transpose` refuses on the exit type and the array-valued result never reaches an arm. The reason this note pinned first (A, true before 2026-11-02): `stdlib/vjp.cml:73` (the call is at `:74` today) calls `transpose(lin)`, and `transpose` takes no function whose result is an array -- the sum-of-squares gradient stopped there. A and B are both recorded, and B is the one `known_fail_msg` pins, because what changed is the reading, not the mark: the case still fails, so the mark stands, and this entry now reports a drift away from either. It used to be skipped behind `have-library-vjp.mjs`; the skip is gone and this is the red it hid (2026-11-02)."
kind = "behavior"
case = "../../../cases/transforms/compositions/grad_vjp_g_zero.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const got = input.normalized.stdout.trim().split('\n').map((s) => Number(s.trim()))
const want = [0, 0, 0, 0]
assert(got.length === want.length, `expected ${want.length} values, got ${JSON.stringify(got)}`)
want.forEach((w, i) => assert(Math.abs(got[i] - w) <= 1e-9, `element ${i}: got ${got[i]}, want ${w}`))
}
"""
timeout_ms = 30000
