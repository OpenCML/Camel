known_fail_note = "Read 2026-11-20 on the four back ends: the case stops at its first nested call and reports `stdlib/vjp.cml:182`'s sentence, so no member of the matrix is read yet. The four numbers are pinned anyway, because the day the mark comes off they are what a Hessian is: the same five on nvm, fvm, jit and prl, and `h_ab - h_ba` exactly 0.0."
kind = "behavior"
case = "../../../cases/transforms/compositions/hessian_of_a_quadratic.cml"
