# M6: the three combinations, their numbers already written down
#
# `docs/design/program-transforms/m6-combination-numbers.cn.md` holds the expected values, derived
# by hand from the analytic derivatives (`f(x) = x*x`, `g(v) = sum(v*v)`), with the finite
# difference step and its error bound. This plan is that page as assertions, and the four
# combinations run: a disagreement with the numbers below is the implementation's -- they are not
# negotiable and were not read off any implementation.
#
# The acceptance line is the page's: |value - expected| <= 1e-9, which is 2.5x wider than the
# finite difference rounding bound at h = 1e-5 (2.0e-10 for f, 3.6e-10 for g) and far narrower than
# any real defect would be.
#
# `remat` (recompute a subgraph on the backward pass instead of storing its residuals) has no case
# here yet: its expectation is "the numbers above, bit for bit, and a lower residual count", which
# is a property of a run and not of a value. It stays in the page
# (`docs/design/program-transforms/m6-combination-numbers.cn.md` 4) until M1/M4 make it runnable.

[[tests]]
name = "compositions.vjp_single"
desc = "`vjp` itself on a single-parameter `f(x) = x*x*x` at x = 3 and cotangent 1: the pair's value is 27.0 and the pullback is 3*x*x = 27.0. This is the one M6 reading that runs today -- `vjp = transpose . split . reinterp<jvp>` builds the cut (`residuals=2`) and transposes `mul_tangent` -- so it is pinned, and the four combinations above stay skipped for the reasons their entries name (a batch axis, a call through a function value, or a pair-typed result)."
kind = "behavior"
case = "../../../cases/transforms/compositions/vjp_single.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["vjp_single y=27.0 dfdx=27.0"]
timeout_ms = 30000

[[tests]]
name = "compositions.grad_vmap_f"
desc = "grad(vmap(f)) with f(x) = x*x at x = [1, 2, 3]: the gradient of sum_j x_j^2 is [2, 4, 6]."
known_fail = ["nvm", "fvm"]
known_fail_msg = "cannot differentiate through this call of a function value"
known_fail_note = "Wall: the pullback pass has no rule for a call of a function value -- `modules/autodiff/pullback.cpp:3759` refuses with `cannot differentiate through this call of a function value: which function it calls is not evident` -- so `grad(vmap(f))` cannot be built. It used to be skipped behind `have-library-vjp.mjs`; the skip is gone and this is the red it hid (2026-11-02). Read again on 2026-11-03: the refusal is still this sentence, word for word, which is the fragment `known_fail_msg` pins."
kind = "behavior"
case = "../../../cases/transforms/compositions/grad_vmap_f.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const got = input.normalized.stdout.trim().split('\n').map((s) => Number(s.trim()))
const want = [2, 4, 6]
assert(got.length === want.length, `expected ${want.length} values, got ${JSON.stringify(got)}`)
want.forEach((w, i) => assert(Math.abs(got[i] - w) <= 1e-9, `element ${i}: got ${got[i]}, want ${w}`))
}
"""
timeout_ms = 30000

