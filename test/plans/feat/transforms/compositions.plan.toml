[[tests]]
name = "compositions.jvp_vjp_f"
desc = "jvp(vjp(f)) with f(x) = x*x, cotangent 1 and direction [0.5, 1.0, 1.5]: the pullback is 2vx, its derivative in x is 2v, so the directional derivative is [1, 2, 3]."
known_fail = ["nvm", "fvm"]
known_fail_owner = "lane-transforms"
known_fail_reason = "the case stops at `cannot be called with argument types`, and the case's own call text hands the cotangent to the forward call while `stdlib/vjp.cml#vjp` makes it the pullback's argument"
known_fail_msg = "cannot be called with argument types"
known_fail_note = "Read again on 2026-11-04, after `transpose` stopped refusing an `f32` exit (`modules/transforms/transpose.cpp#transposeSignature`: the cotangent of the result is the result's own tangent space, `Tangent<f32>` is `f32`, and the cotangents add with the addition of that width): the rejection this entry used to pin ('takes a function that returns a `float`') is gone. `vjp` over an `f32` function now types and runs -- measured on the same program in both widths, `vjp` of `x*x*x` at 3 answers value 27.0 and cotangent 27.0 in `f32` and in `float` -- and its pullback reads `(ct: f32) => (f32,)`. What this case meets now is its **own call text**: `test/cases/transforms/compositions/jvp_vjp_f.cml` writes `vjp(sq)(x, v)`, handing the cotangent to the forward call, while `stdlib/vjp.cml#vjp` declares `Vjp<F> = <..WithOf<F>> (..ParamsOf<F>) => (ResultOf<F>, Pullback<F>)` -- the cotangent is the pullback's argument (`vjp(sq)(x).1(v)`), which is the surface the author ruled on 2026-11-01. The refusal is `Function of type '(__pack_0_0: f32) => (f32, (ct: f32) => (f32,))' cannot be called with argument types: <> (f32, f32)`. Behind that text two more walls stand, both measured on `float` twins the same day, so neither is about `f32`: `jvp` of a function that calls a pullback refuses with `jvp has no forward transform for this function`, and with the batch axis outside the `jvp` -- `jvp(x => vmap(pull)(x))(xs, dx)` -- `vmap` refuses the captured cotangent with `vmap has no rule for` 'a constant', which is `vmap_grad_f`'s wall. A question page holds what to do with the call text: `docs/handover/questions/2026-11-04-two-f32-combination-cases-meet-their-own-call-text.cn.md`. The mark stands because the case still fails."
kind = "behavior"
case = "../../../cases/transforms/compositions/jvp_vjp_f.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const got = input.normalized.stdout.trim().split('\n').map((s) => Number(s.trim()))
const want = [1, 2, 3]
assert(got.length === want.length, `expected ${want.length} values, got ${JSON.stringify(got)}`)
want.forEach((w, i) => assert(Math.abs(got[i] - w) <= 1e-9, `element ${i}: got ${got[i]}, want ${w}`))
}
"""
timeout_ms = 30000

[[tests]]
name = "compositions.grad_vjp_g_zero"
desc = "grad(vjp(g)) with g(v) = sum(v*v) at v = [1, 2, 3, 4] must be all zeros: the pullback is linear in v, so its derivative is a constant and the gradient of a constant is 0. This is the one check the three combinations cannot make."
known_fail = ["nvm", "fvm"]
known_fail_owner = "lane-transforms"
known_fail_reason = "the case stops at `cannot be called with argument types`, and the case's own call text hands the cotangent to the forward call while `stdlib/vjp.cml#vjp` makes it the pullback's argument"
known_fail_msg = "cannot be called with argument types"
known_fail_note = "Read again on 2026-11-04, after the same `transpose` change (the `f32` exit is no longer refused, and this case's pullback now reads `(ct: f32) => (f32[4],)`). What the case meets now is its **own call text**: `test/cases/transforms/compositions/grad_vjp_g_zero.cml` writes `vjp(g)(w, 1.0)`, handing the cotangent to the forward call, while the cotangent is the pullback's argument (`vjp(g)(w).1(1.0)`, `stdlib/vjp.cml#vjp`, the surface of the author's 2026-11-01 ruling). The refusal is `Function of type '(__pack_0_0: f32[4]) => (f32, (ct: f32) => (f32[4],))' cannot be called with argument types: <> (f32[4], f32)`. Two more walls stand behind that text, both measured on `float` twins the same day and neither of them about `f32`: `grad` differentiates the first `with` parameter (`modules/autodiff/pullback.cpp#differentiationRefusal` -- 'it has no `with` parameter'), and with one added the pullback call is refused with `cannot differentiate through this call of a function value: ... the function is the result of 'transforms:split'`, which is `grad_vmap_f`'s wall. There is also a number question this entry does not answer: the reachable reading of the case's body is `sum(2w)`, whose gradient against `w` is 2 per entry, not the four zeros below, so the page's `0` belongs to a second derivative rather than to this program; the question page is `docs/handover/questions/2026-11-04-two-f32-combination-cases-meet-their-own-call-text.cn.md`. The mark stands because the case still fails."
kind = "behavior"
case = "../../../cases/transforms/compositions/grad_vjp_g_zero.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const got = input.normalized.stdout.trim().split('\n').map((s) => Number(s.trim()))
const want = [0, 0, 0, 0]
assert(got.length === want.length, `expected ${want.length} values, got ${JSON.stringify(got)}`)
want.forEach((w, i) => assert(Math.abs(got[i] - w) <= 1e-9, `element ${i}: got ${got[i]}, want ${w}`))
}
"""
timeout_ms = 30000

# --- added 2026-11-04 ---------------------------------------------------------------
#
# The two `f32` combinations above pin their **own call text**: they write `vjp(f)(x, ct)`,
# handing the cotangent to the forward call, while `stdlib/vjp.cml#vjp` answers
# `(value, pullback)` and the pullback takes the cotangent. That is a fact about those two
# case files, not a gap in the library, so the reading they *can* have is pinned separately
# by the two entries below, written against the surface that exists. They are the reachable
# half of the same compositions, in `f32` and in `float` in one program, so the width is
# compared inside one run instead of across two.

[[tests]]
name = "compositions.pullback_read_at_a_cotangent"
desc = "The pullback read at a cotangent -- `vjp(f)(x).1(ct).0` -- for `f(x) = x*x` in `f32` and in `float`, in one program: 2*ct*x, so 6, 6, 12, 12, -1.5, -1.5 for (x, ct) = (3, 1), (3, 2), (-1.5, 0.5). This is the reading the two `f32` entries in this plan cannot reach today (they hand the cotangent to the forward call), and it is the one that proves the walk carries an `f32` cotangent as an `f32`: both widths print the same numbers, and the answer's type is `(f32) => (f32,)` for the `f32` function."
kind = "behavior"
case = "../../../cases/transforms/compositions/pullback_read_at_a_cotangent.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["pullback f32  f(3) ct=1   -> 6.0", "pullback float f(3) ct=1  -> 6.0", "pullback f32  f(3) ct=2   -> 12.0", "pullback float f(3) ct=2  -> 12.0", "pullback f32  f(-1.5) ct=0.5 -> -1.5", "pullback float f(-1.5) ct=0.5 -> -1.5"]
timeout_ms = 30000

[[tests]]
name = "compositions.pullback_of_a_sum_of_squares"
desc = "The pullback of a function whose result is one number and whose parameter is an array -- `g(v) = sum(v*v)` at `v = [1, 2, 3, 4]` -- read at cotangent 1 and at 0.5, in `f32` and in `float`, in one program: 2*ct*v, so a sum of 20 and 10. The element-wise sum is printed beside `sum(...)` because a sum is blind to a permutation: this pins that an array cotangent crosses the walk as an array of the parameter's own width."
kind = "behavior"
case = "../../../cases/transforms/compositions/pullback_of_a_sum_of_squares.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["pullback f32  ct=1 sum -> 20.0", "pullback float ct=1 sum -> 20.0", "pullback f32  ct=1 by hand -> 20.0", "pullback float ct=1 by hand -> 20.0", "pullback f32  ct=0.5 sum -> 10.0", "pullback float ct=0.5 sum -> 10.0"]
timeout_ms = 30000
