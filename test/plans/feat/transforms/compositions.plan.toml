[[tests]]
name = "compositions.jvp_vjp_f"
desc = "jvp(vjp(f)) with f(x) = x*x, cotangent 1 and direction [0.5, 1.0, 1.5]: the pullback is 2vx, its derivative in x is 2v, so the directional derivative is [1, 2, 3]."
known_fail = ["nvm", "fvm"]
known_fail_owner = "lane-grad-form"
known_fail_reason = "the wall is one layer deeper than the port count: `transpose` reads a signature that eats only tangents, so the member it builds is `((f32, f32)) => (f32, f32)` against `Transpose<F>`'s own (ports=1 promised=1), and the walk then refuses at `TRANSPOSE function=jvp_of_split_of_jvp_of_sq_backward skip=call-value-missing param=2 node=4 arg=0` -- the lifted body's adjoint law wants the value half's primal as an operand, which the lifted signature cannot state and no closure carries"
known_fail_ends_when = "when that call can be turned around, this entry prints its three tangents `1.0`, `2.0` and `3.0`, one per line, and exits 0 -- the pullback is `2*v*x` at `v = 1`, `jvp` differentiates it in the directions `dx = [0.5, 1.0, 1.5]`, so the tangents are `2*v*dx` = 1, 2, 3, and those three numbers are what its `verify_script` compares against `[1, 2, 3]`. No refusal is pinned here, so the mark ends on that reading: the run reports `marked known_fail ... but passes`"
known_fail_note = "Corrected twice, and the two case mistakes it used to pin are neither of them the wall now. One: `vjp(sq)(x, v)` handed the cotangent to the forward call, while `stdlib/vjp.cml#vjp` answers `(value, pullback)` -- the case reads `vjp(sq)(x).1(v).0`. Two: `vmap(jvp(pull))` is not a call the batch pass can accept at all, because `vmap` takes a function of exactly one parameter (`stdlib/array.cml#vmap`) and `jvp(f)` is `(x, dx) => (value, tangent)`, so the batch is three points, one `jvp` each. The wall is not the cut: `split`'s `lin` already eats only tangents (`(f32) => f32`, the primal in its closure). It is now one layer past the value half: the lift of a function that eats only tangents is read as linear, so the value half is no port and the promise is met (`ports=1 promised=1`), and what stops the run is the lifted body's own adjoint law asking for that value half as an operand -- a value the signature cannot state and no closure carries. That is a fact about where the value has to come from, not about the operator's promise. The numbers are unchanged -- 1, 2, 3, the tangents of `2v*dx` at `v = 1` -- and they are what a flat twin of the same body answers: `jvp(x => 2.0 * x)` at (1, 0.5), (2, 1.0), (3, 1.5) prints 1.0, 2.0, 3.0 on both back ends. The mark comes off when this entry prints them, not before."
kind = "behavior"
case = "../../../cases/transforms/compositions/jvp_vjp_f.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const got = input.normalized.stdout.trim().split('\n').map((s) => Number(s.trim()))
const want = [1, 2, 3]
assert(got.length === want.length, `expected ${want.length} values, got ${JSON.stringify(got)}`)
want.forEach((w, i) => assert(Math.abs(got[i] - w) <= 1e-9, `element ${i}: got ${got[i]}, want ${w}`))
}
"""
timeout_ms = 30000

