kind = "behavior"
case = "../../../cases/transforms/compositions/grad_vjp_g_zero.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const got = input.normalized.stdout.trim().split('\n').map((s) => Number(s.trim()))
const want = [0, 0, 0, 0]
assert(got.length === want.length, `expected ${want.length} values, got ${JSON.stringify(got)}`)
want.forEach((w, i) => assert(Math.abs(got[i] - w) <= 1e-9, `element ${i}: got ${got[i]}, want ${w}`))
}
"""
timeout_ms = 30000

# --- added 2026-11-04 ---------------------------------------------------------------
#
# The two `f32` combinations above pin their **own call text**: they write `vjp(f)(x, ct)`,
# handing the cotangent to the forward call, while `stdlib/vjp.cml#vjp` answers
# `(value, pullback)` and the pullback takes the cotangent. That is a fact about those two
# case files, not a gap in the library, so the reading they *can* have is pinned separately
# by the two entries below, written against the surface that exists. They are the reachable
# half of the same compositions, in `f32` and in `float` in one program, so the width is
# compared inside one run instead of across two.

[[tests]]
name = "compositions.pullback_read_at_a_cotangent"
desc = "The pullback read at a cotangent -- `vjp(f)(x).1(ct).0` -- for `f(x) = x*x` in `f32` and in `float`, in one program: 2*ct*x, so 6, 6, 12, 12, -1.5, -1.5 for (x, ct) = (3, 1), (3, 2), (-1.5, 0.5). This is the reading the two `f32` entries in this plan cannot reach today (they hand the cotangent to the forward call), and it is the one that proves the walk carries an `f32` cotangent as an `f32`: both widths print the same numbers, and the answer's type is `(f32) => (f32,)` for the `f32` function."
kind = "behavior"
case = "../../../cases/transforms/compositions/pullback_read_at_a_cotangent.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["pullback f32  f(3) ct=1   -> 6.0", "pullback float f(3) ct=1  -> 6.0", "pullback f32  f(3) ct=2   -> 12.0", "pullback float f(3) ct=2  -> 12.0", "pullback f32  f(-1.5) ct=0.5 -> -1.5", "pullback float f(-1.5) ct=0.5 -> -1.5"]
timeout_ms = 30000

[[tests]]
name = "compositions.pullback_of_a_sum_of_squares"
desc = "The pullback of a function whose result is one number and whose parameter is an array -- `g(v) = sum(v*v)` at `v = [1, 2, 3, 4]` -- read at cotangent 1 and at 0.5, in `f32` and in `float`, in one program: 2*ct*v, so a sum of 20 and 10. The element-wise sum is printed beside `sum(...)` because a sum is blind to a permutation: this pins that an array cotangent crosses the walk as an array of the parameter's own width."
kind = "behavior"
case = "../../../cases/transforms/compositions/pullback_of_a_sum_of_squares.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["pullback f32  ct=1 sum -> 20.0", "pullback float ct=1 sum -> 20.0", "pullback f32  ct=1 by hand -> 20.0", "pullback float ct=1 by hand -> 20.0", "pullback f32  ct=0.5 sum -> 10.0", "pullback float ct=0.5 sum -> 10.0"]
timeout_ms = 30000
[[tests]]
name = "compositions.nested_grad_min"
desc = "The nest of `grad` in `grad` at its smallest, through the library's transform: f(x)=x*x, f'(x)=2x, f''(x)=2, so the second derivative at 2 is 2.0. The call form is the restored one: `grad(f)` keeps the weight in the `with` list (`GradientOf<F>`), so the outer `grad` finds the first `with` parameter the inner one differentiated and the nest is the same composition twice (design principles 9.9). The mark is on that number and not on the refusal the nest stops at today: 2.0, not 4.0 (the first derivative read twice) and not 0.0 (a cut that lost the first pass)."
known_fail = ["nvm", "fvm", "jit", "prl"]
known_fail_owner = "lane-grad-form"
known_fail_reason = "the nest builds and both layers lift; what refuses today is one step past them -- `transforms: transpose has no transpose for this function`, with the cause `the callee's transpose was built, but the parameter at position 3 reads a value this call does not carry`, `modules/transforms/transpose_operator.cpp#refusalSentence`. Read as the wall it is: the mark is on the number, so this sentence moving again does not touch this entry"
known_fail_ends_when = "when the nest of the library's `grad` in itself answers a number instead of a refusal, this entry prints `nested_grad_min second=2.0` and exits 0. 2.0 is the arithmetic, not a reading -- f(x)=x*x has f'(x)=2x and f''(x)=2 -- and it is not 4.0 (the first derivative read twice) nor 0.0 (a cut that lost the first pass). No refusal is pinned here, so the mark ends on that line and not on any wall moving: the run reports `marked known_fail ... but passes` the day the numbers arrive"
kind = "behavior"
case = "../../../cases/transforms/compositions/nested_grad_min.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["nested_grad_min second=2.0"]
timeout_ms = 30000

[[tests]]
name = "compositions.nested_grad_through_a_binding"
desc = "The same nest written through two bindings (`let inner = grad(cube)`, `let outer = grad(inner)`): f(x)=x*x*x, f'(x)=3x^2, f''(x)=6x, so the second derivative at 2 is 12.0. Two writings, one reading -- the inner gradient's weight is a `with` value, so the outer `grad` differentiates it the way it differentiates any `with` parameter (design principles 9.9). 12.0 is the mark's target and not 6.0, which is the first derivative read once and the answer a nest that differentiated its subject only once would print."
known_fail = ["nvm", "fvm", "jit", "prl"]
known_fail_owner = "lane-grad-form"
known_fail_reason = "as `compositions.nested_grad_min`: the nest builds and both layers lift, and what refuses today is one step past them -- `transforms: transpose has no transpose for this function`, raised with the cause `the callee's transpose was built, but the parameter at position 3 reads a value this call does not carry` from `modules/transforms/transpose_operator.cpp#refusalSentence`. The mark is on the number, so that sentence moving again does not touch this entry"
known_fail_ends_when = "when the nest answers a number, this entry prints `nested_grad_through_a_binding second=12.0` and exits 0 -- 12.0 because f(x)=x*x*x has f'(x)=3x^2 and f''(x)=6x, and 6.0 is what a nest that differentiated only once would print. The two bindings and the one-expression form answer the same kind of number, which is why the trigger is this line and not a refusal; the run reports `marked known_fail ... but passes` on that reading"
kind = "behavior"
case = "../../../cases/transforms/compositions/nested_grad_through_a_binding.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["nested_grad_through_a_binding second=12.0"]
timeout_ms = 30000

[[tests]]
name = "compositions.hessian_of_a_quadratic"
desc = "A Hessian element by element, through the library's `grad` nested: f(a,b) = a^2 + 3ab + 2b^2 has df/da = 2a + 3b and df/db = 3a + 4b, so the matrix is [[2, 3], [3, 4]]. `grad` differentiates the first `with` parameter, so the pure second derivatives are read on two declarations of the same body, `<a, b>` and `<b, a>`, and each mixed member on a function of the order the step after it needs whose body is one first derivative already computed; nothing here is a derivative written by hand. The last line pins the symmetry as a number: 0.0, not 'close'. An order lost between the two `with` values -- the weight moved onto the ordinary list -- puts 4 in one mixed member and 2 in the other, which is what this entry is here to catch. All five readings are targets and not reached yet: every one of them is a nest, so each dies one step past both lifts (the wall the two entries above hit), and the mark states the five lines that end it rather than today's refusal. They are the same five on all four back ends."
known_fail = ["nvm", "fvm", "jit", "prl"]
known_fail_owner = "lane-grad-form"
known_fail_reason = "every reading here is a nest of the library's `grad`, so each one dies one step past the lift: `transforms: transpose has no transpose for this function`, with the cause `the callee's transpose was built, but the parameter at position 3 reads a value this call does not carry`, `modules/transforms/transpose_operator.cpp#refusalSentence`. Nothing in this entry is blocked by the declaration or by the writing: with `grad(square)<2.0>()` first-order readings on the same build are green. The mark is on the five numbers, not on that sentence"
known_fail_ends_when = "when the nest answers numbers across the matrix instead of a refusal, this entry prints `hessian h_aa=2.0`, `hessian h_bb=4.0`, `hessian h_ab=3.0`, `hessian h_ba=3.0` and `hessian h_ab_minus_h_ba=0.0`, and exits 0. The five are the Hessian of f(a,b)=a^2+3ab+2b^2 at (1,2) worked out by hand -- d2f/da2=2, d2f/db2=4, both mixed members 3, and the difference exactly 0.0 -- and they are the same five on nvm, fvm, jit and prl. No refusal is pinned, so the mark ends on those lines: the run reports `marked known_fail ... but passes` on that reading"
kind = "behavior"
case = "../../../cases/transforms/compositions/hessian_of_a_quadratic.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["hessian h_aa=2.0", "hessian h_bb=4.0", "hessian h_ab=3.0", "hessian h_ba=3.0", "hessian h_ab_minus_h_ba=0.0"]
timeout_ms = 30000
