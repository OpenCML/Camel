[[tests]]
name = "nested.nest_quartic"
desc = "The reverse half, recorded as the refusal it is: `grad(grad(f))` for f(x)=x^4, whose hand-worked second derivative is f''(2)=48 (and f''(3)=108). It is a negative on the sentence and not on a number -- the nest prints nothing. Why it is refused was measured on 2026-11-20: the outer `jvp` must lift a function whose answer type is `(float, (float) => float)` (the value plus the linear half's closure), and that type has no tangent space, so `liftSignature` answers null before any callee is asked. The reading and the ruling it waits on are in docs/handover/questions/2026-11-20-whether-jvp-of-a-closure-answering-function-is-a-pair-or-a-lifted-closure.cn.md; when that is ruled on, this entry flips to `d2=48.0` and stops being a negative."
