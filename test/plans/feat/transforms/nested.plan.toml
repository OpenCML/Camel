args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["confusion x=1.0 d=1.0"]
known_fail = ["nvm"]
known_fail_owner = "lane-nested-transforms (nested-b)"
known_fail_reason = "same wall as `nested.nest_named`: the inner transform sits in the body of the function the outer one differentiates, so the outer `jvp`'s lift has to reach a callee `split` handed out, and it refuses (`transforms: jvp has no forward transform for this function`, `modules/transforms/jvp_operator.cpp:188`)"
known_fail_msg = "jvp has no forward transform for this function"
known_fail_note = "判据 ④. The expected answer is 1 and a confused implementation answers 2 (it reads the outer tangent as the inner one), which is what makes this reading worth keeping: the day the wall lifts, this is the entry that tells a correct nest from a plausible one. Today it prints nothing -- the refusal comes before the first number."
timeout_ms = 30000

[[tests]]
name = "nested.rule_writes_a_constant"
desc = "A law whose own left side writes a `<>` value describes the operator at that one configuration, and the fit compared types and counts only -- so `jvp_reshape` (`reshape<[2, 2]>(x)`, `stdlib/rulesets/jvp.cml:369`) answered for a `reshape<[8, 2, 8]>` node and its right side wrote `[2, 2]` into the tangent (measured 2026-11-20, `probes/06_layout.cml`, `TensorDimensionMismatch: [6] -> [2, 2]`). It is refused now, and the refusal names the law. This is the matcher's half of that defect; the rule's half is naming the configuration as a parameter (`(x, dims: int[])` reading `reshape<dims>`), and the day that lands this entry turns red and the derivative runs -- which is what it is for. Design principles 9.9: the right derivative, or a refusal that names the operator; never a wrong value."
kind = "negative"
case = "../../../cases/transforms/nested/rule_writes_a_constant.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 1
expect_output_contains = ["`<>` value(s) of its own"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "nested.rule_constant_agrees"
desc = "The other half of `nested.rule_writes_a_constant`, and the entry that keeps that guard honest: the same law (`jvp_reshape`, whose left side writes `reshape<[2, 2]>`) over a node that *is* a `reshape<[2, 2]>` -- the law's value and the node's value are the same array, so the law must still be chosen. A matcher that refused every law writing a `<>` value would pass the negative case and silence the whole family (`modules/autodiff/adjoint_reshape_array.cml`, `rules_angle_args_reshape.cml`, `nn/tiny_attention.cml`). The evidence is WHICH refusal fires: today it is the transposition's (`transpose has no transpose for this function`, on a step that is a `tensor:reshape`), not `jvp has no forward transform`, so `jvp` did accept the law. That back half is a wall of its own, written down in `stdlib/rulesets/transpose.cml:613`: `reshape` and `softmax` have no rule there because a rule cannot carry a `<>` value through its right side -- the same limitation `angleargs` met from the rule side. It is why no end-to-end positive case for this guard can exist today, and the entry turns red the day the transpose rule lands."
kind = "negative"
case = "../../../cases/transforms/nested/rule_constant_agrees.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 1
expect_output_contains = ["transpose has no transpose for this function"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000