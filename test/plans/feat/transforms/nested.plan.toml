kind = "behavior"
case = "../../../cases/transforms/nested/nest_quartic.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["nested_quartic d2=48.0"]
known_fail = ["nvm"]
known_fail_owner = "lane-nested-transforms (nested-b)"
known_fail_reason = "the nest is one step past both lifts and what refuses is `transforms: transpose has no transpose for this function` (cause `the callee's transpose was built, but the parameter at position 3 reads a value this call does not carry`, `modules/transforms/transpose_operator.cpp#refusalSentence`); the mark is on `d2=48.0` and not on that sentence"
