[[tests]]
name = "nested.nest_quartic_forward"
desc = "The green half of the second-order question, pinned against regression: `jvp(jvp(f))` for f(x)=x^4 at x=2 with the seed 1 answers ((16, 32), (32, 48)) -- the value and the once-lifted derivative, then the same derivative and the twice-lifted one. t1 = 48 is f''(2) = 12x^2 and t0 = 32 is f'(2) = 4x^3, so the two layers are not confused (a nest that read the outer tangent as the inner one answers 32 twice). This is the forward half the library already composes; the reverse half, `grad(grad(f))`, is `nested.nest_quartic` beside it."
kind = "behavior"
case = "../../../cases/transforms/nested/nest_quartic_forward.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["nested_quartic_forward y=16.0 t0=32.0 t1=48.0"]
timeout_ms = 30000

[[tests]]
name = "nested.nest_quartic"
desc = "The reverse half, now a positive on the number: `grad(grad(f))` for f(x)=x^4, whose hand-worked second derivative is f''(2)=48 (and f''(3)=108). It was `kind = \"negative\"`, pinning `split does not build this function (the value half reads the tangent of parameter 0, which the forward half does not take)`, and that negative had stopped holding before it stopped passing: `2da9735da` added the law that lifts an answer type of `(float, (float) => float)`, so the property the case was written to pin -- 'a result type with no tangent space is refused' -- is not true any more, and `2a2cf31a8` could then remove the cut's refusal. A positive on the number is what the case is about now: the nest prints 48.0, not a refusal. Re-registered 2026-11-21 by the author's ruling of 02:20, which named this entry as the one that must turn positive."
kind = "behavior"
case = "../../../cases/transforms/nested/nest_quartic.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["nested_quartic d2=48.0"]
known_fail = ["nvm"]
known_fail_owner = "lane-nested-transforms (nested-b)"
known_fail_reason = "the nest is one step past both lifts now and what refuses is `transforms: transpose has no transpose for this function` (cause `the callee's transpose was built, but the parameter at position 3 reads a value this call does not carry`, `modules/transforms/transpose_operator.cpp#refusalSentence`). The mark is on `d2=48.0` and not on that sentence -- this entry is the one the 2026-11-21 ruling turned from a negative on a refusal into a positive on a number, precisely so that the next move of that wall does not turn it red again"
known_fail_ends_when = "when `grad(grad(f))` answers a number instead of a refusal, this entry prints `nested_quartic d2=48.0` and exits 0 -- f(x)=x^4 has f'(x)=4x^3 and f''(x)=12x^2, so f''(2)=48 and f''(3)=108, and `nested.nest_quartic_forward` beside it already answers the same 48 as `t1` from the forward composition. No refusal is pinned, so the mark ends on that line: the run reports `marked known_fail ... but passes` on that reading"
known_fail_note = "Re-registered 2026-11-21 (author's ruling of 02:20). Two readings make the positive and not the negative the right shape: the sentence it pinned (`split does not build this function ...`, read at `6a21597db`) stopped appearing at `2a2cf31a8`, and the reason the case had for existing at all -- a result type with no tangent space being refused -- stopped being true at `2da9735da`. Its `desc` had been corrected on 2026-11-20 while the case file's own comment still described the oldest wall; the comment was corrected in the same commit as this registration. Cost, as on `nested.nest_square`: without a pinned sentence the run accepts any failure as the expected one until the number arrives."
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "nested.rule_writes_a_constant"
desc = "A reshape whose configuration is not one any law spells (`reshape<[2, 1, 2]>`) must still reach a law: `jvp_reshape` names `dims` as its second port now, so nothing states a configuration of its own. The reading is WHICH refusal fires -- the transposition half has no rule for `reshape` (`stdlib/rulesets/transpose.cml:613`), so it stops there, where a matcher refusal would mean the configuration was refused before any law ran. That is the regression a by-content comparison in `chooseRuleAmong` reintroduced on 2026-11-20 (27 red lines in `feat/compile`, with `jvp_reshape` and `jvp_permute` both refused over their own parameters). A law that spells a `<>` value of its own is still refused for every other configuration, which is why none is left: `jvp_softmax` wrote `<1>` until 2026-11-20 and answered only that axis (`feat/compile`'s `rules_angle_args.softmax_axes` is the three-axis reading)."
kind = "negative"
case = "../../../cases/transforms/nested/rule_writes_a_constant.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 1
expect_output_contains = ["transpose has no transpose for this function"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

