[[tests]]
name = "nested.nest_quartic"
desc = "The reverse half, recorded as the refusal it is: `grad(grad(f))` for f(x)=x^4, whose hand-worked second derivative is f''(2)=48 (and f''(3)=108). It is a negative on the sentence and not on a number -- the nest prints nothing. **Re-pinned 2026-11-20 (`2da9735da`, merged tree `79e47232d`)**: the refusal it used to pin, `jvp has no forward transform for this function`, is OBSOLETE -- that sentence marked `liftSignature` answering null because the answer type `(float, (float) => float)` had no tangent space, so the lift never ran. It now runs (that law is what `2da9735da` put in), and the stop is one step later: `transforms: split does not build this function (the value half reads the tangent of parameter 0, which the forward half does not take)`. The entry stays `negative` and not a number because the nest still prints nothing: pinning `d2=48.0` today would pin a value no reading produces. The reading and the ruling it waits on are in docs/handover/questions/2026-11-20-whether-the-value-half-takes-tangent-ports.cn.md; when the value half learns to hand that tangent out, this entry flips to `d2=48.0` and stops being a negative."
kind = "negative"
case = "../../../cases/transforms/nested/nest_quartic.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 1
expect_output_contains = ["split does not build this function (the value half reads the tangent of parameter 0, which the forward half does not take)"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

