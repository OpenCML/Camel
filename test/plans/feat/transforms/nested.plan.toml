# 变换嵌套乙 — the readings this lane's four items are judged by
#
# Section 乙 of `docs/handover/plans/2026-11-18-nested-transforms.cn.md`. Each entry is one of the
# shapes that section names, written the way the plan writes it, with the number derived by hand
# from the derivative (no implementation was read to get it).
#
# The numbers:
#   `square`: f(x)=x*x,        f'(2)=4,  f''(x)=2   -> 4 and 2
#   `cube`:   f(x)=x^3,        f'(2)=12, f''(2)=12  -> 12 and 12
#   `pb_again`: f=x^3, the pullback at 2 is the linear map ct |-> 12 ct, whose own slope is 12
#   `confusion`: d/dx ( x * (d/dy (x+y) at y=1) ) at x=1 == 1 (a confused reading gives 2)
#
# The first run of this plan was a *measurement*, and it stayed one: an entry that is refused is a
# wall the implementation has not reached yet. Since the ruling of 2026-11-21 02:20 a mark on such an
# entry states the line the entry has to print instead of quoting the refusal it reads that day, so
# the wall can move -- and it has, three times -- without the mark following it.

[[tests]]
name = "nested.nest_square"
desc = "判据 ①/②: the smallest nest of the library's `grad` in itself, f(x)=x*x at x=2: the first derivative is 4 and the second is 2. The second derivative is the number that says whether the nest ran at all, and the first is printed beside it so a refusal that also breaks the first derivative cannot pass as a second-order wall."
kind = "behavior"
case = "../../../cases/transforms/nested/nest_square.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["nested_square x=2.0 d1=4.0 d2=2.0"]
# `grad(grad(square))<2.0>()`: both numbers are the target shape (a `with` parameter is the weight,
# design principles 9.9). `nested.nest_named` and `nested.nest_lambda` still stop at the lift, one
# wall earlier, and pin that sentence; this entry and `nested.nest_cube` are past it and mark the
# numbers instead.
known_fail = ["nvm"]
known_fail_owner = "lane-nested-transforms (nested-b)"
known_fail_reason = "the wall has moved three times and the mark no longer tracks it: `2da9735da` made the outer `jvp`'s lift lift the answer type, `2a2cf31a8` removed `split`'s refusal (`the value half reads the tangent of parameter 0`), and what refuses today is one step later -- `transforms: transpose has no transpose for this function`, cause `the callee's transpose was built, but the parameter at position 3 reads a value this call does not carry`, `modules/transforms/transpose_operator.cpp#refusalSentence`. The mark is on the number, so this one moving again does not touch the entry"
known_fail_ends_when = "when the nest answers the numbers instead of a refusal, this entry prints `nested_square x=2.0 d1=4.0 d2=2.0` and exits 0 -- f(x)=x*x has f'(x)=2x and f''(x)=2, and d2 is the number that says the nest ran at all. No refusal is pinned, so the mark ends on that line and not on any wall moving: the run reports `marked known_fail ... but passes` on that reading"
known_fail_note = "Re-registered 2026-11-21 by the author's ruling of 02:20 (readings: `docs/handover/questions/2026-11-21-whether-a-pinned-sentence-follows-the-wall-it-was-pinned-to.cn.md`). It was a re-pin on 2026-11-20 and a re-pin before that, and each one held only until the wall moved: `jvp has no forward transform for this function` (liftSignature answering null), then `split does not build this function ...`, then `transpose has no transpose for this function`. Three sentences for one unfinished computation is the argument for the shape used now -- the mark names the line it has to print, which no wall changes. Cost: without a pinned sentence the run accepts any failure as the expected one until the numbers arrive."
timeout_ms = 30000

[[tests]]
name = "nested.nest_cube"
desc = "判据 ①/②: the same nest for f(x)=x^3 at x=2, where both derivatives are 12. f'(2)=3x^2=12 and f''(2)=6x=12, so the two numbers agree -- which is why the square case is here too, and why a run that answers 12 twice has to be read together with it."
kind = "behavior"
case = "../../../cases/transforms/nested/nest_cube.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["nested_cube x=2.0 d1=12.0 d2=12.0"]
known_fail = ["nvm"]
known_fail_owner = "lane-nested-transforms (nested-b)"
known_fail_reason = "same wall as `nested.nest_square`, and the same reason for not pinning it: what refuses today is `transforms: transpose has no transpose for this function` (cause `the callee's transpose was built, but the parameter at position 3 reads a value this call does not carry`, `modules/transforms/transpose_operator.cpp#refusalSentence`), and the mark is on the numbers"
known_fail_ends_when = "with `nested.nest_square`: when the nest answers the numbers, this entry prints `nested_cube x=2.0 d1=12.0 d2=12.0` and exits 0 -- f(x)=x^3 has f'(x)=3x^2=12 and f''(x)=6x=12 at 2. Both being 12 is why the square case sits beside it; the mark ends on that line, and the run reports `marked known_fail ... but passes` on that reading"
known_fail_note = "Re-registered 2026-11-21 with `nested.nest_square` (author's ruling of 02:20): the mark states the line that ends it instead of the refusal it reads today, because that refusal has now moved twice (`split`'s `the value half reads the tangent of parameter 0`, then `transpose`'s `no transpose for this function`) while the number has not. Both derivatives of f(x)=x^3 at 2 are 12, which is why a run that answers 12 twice has to be read together with a case whose two numbers differ. The cost of the shape is stated on the sibling's note."
timeout_ms = 30000

[[tests]]
name = "nested.nest_named"
desc = "判据 ①: the nest written through a NAMED function, which is the writing that goes around `first_with_as_param` -- `dcube` has a `with` parameter of its own, so the outer `grad` moves it and then has to differentiate a body whose inner transform is already a function value. f(x)=x^3 at x=2: 12 and 12. This is section 乙's item 1: the value being called has known code (the cut `stdlib/vjp.cml#grad` made when it evaluated `grad(cube)`), so the transform has to recurse into it."
kind = "behavior"
case = "../../../cases/transforms/nested/nest_named.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["nest_named x=2.0 d1=12.0 d2=12.0"]
# A wall, not a wish: this case wants the number. The inner `grad(cube)` runs to the end (under
# `--trace transforms` its `first_with_as_param`, `jvp`, `split` and `transpose` all leave a reading)
# and the OUTER `jvp` refuses with no cause and no place -- not one `REINTERP` line for it. Written up
# in `docs/handover/questions/2026-11-20-the-outer-jvp-needs-split-to-hand-out-static-code.cn.md`.
known_fail = ["nvm"]
known_fail_owner = "lane-nested-transforms (nested-b)"
known_fail_reason = "the outer `jvp`'s lift refuses a call whose callee's code is not readable, and the callee here is what `split` handed out: `transforms: jvp has no forward transform for this function`, raised from `modules/transforms/jvp_operator.cpp:188` with `refusedOrigin == kInvalidOriginId` (no cause, no place). Same wall as `compositions.jvp_vjp_f`'s note"
known_fail_msg = "jvp has no forward transform for this function"
known_fail_ends_when = "when `split` hands out code the transforms can read -- the `FunctionClosure` the backward graph is already published as, which `modules/transforms/jvp_operator.cpp` asks for and does not accept -- the outer lift stops refusing with `jvp has no forward transform for this function` and this entry prints `nest_named x=2.0 d1=12.0 d2=12.0` and exits 0. The run decides it: `marked known_fail ... but passes` on that reading, `known failure changed its mind` if a different refusal replaces the pinned one."
known_fail_note = "Measured 2026-11-20 with `--trace transforms` and pasted verbatim in the question page: the inner `grad(cube)` leaves `first_with_as_param function=cube ... graph=359`, `jvp function=cube__first_with_as_param ... source=ruleset rules=jvp_mul`, `split function=jvp_of_cube__first_with_as_param ... residuals=2`, and a `TRANSPOSE` line for its backward half; then `first_with_as_param function=dcube ... graph=405` succeeds and the outer `jvp` prints nothing at all. Lifting this wall needs `split` to hand out statically readable code first, which is the `grad-callform`/甲 face -- see the page for why this lane stopped there."
timeout_ms = 30000

