timeout_ms = 20000

[[tests]]
name = "remat_effectful_body_is_not_recomputed"
desc = "A body with an external effect is not marked for recompute: `jvp`'s lift asks `hasExternalEffect` before it carries `kGraphFlagRecomputeBackward`, and says `REINTERP jvp not_recomputed=g why=an operator of the body has an external effect, so it would run twice`. What the program then meets has moved: it used to be `split does not build this function`, and measured 2026-11-04 it is `Pass 'std::nvm' failed with an internal error: Runtime graph 'jvp_of_g' has GATE node 10 without a wait: no sync predecessor and no control input` -- the cut of this body now builds (`nodes=11 exit=10`, the graph `uses stdout`) and the GATE the effect put in it is not served by anything the cut emits. Both lines are compared, not just the exit code, so the entry records *where* an effectful `#remat` function is stopped today. The pass says of itself that this is `a defect of the compiler rather than of the program`, which is the honest severity: it is not a refusal the language chose. If `split` learns to serve that GATE, this goes red first; the case file says what to read then."
