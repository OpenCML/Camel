# `split` (design doc 4.2): one function in, two out -- the forward half, which computes everything
# the present inputs allow and hands the residuals on as values, and the backward half, which reads
# those residuals and the tangent direction and gives the tangent.
#
# **What crosses the cut is read off the graph, not off the type.** The result side of the exit is what
# the forward half keeps, the tangent side is what the backward half keeps, and a node both reach is a
# value that crosses -- `residualsOf` (modules/transforms/split.cpp) names them in program order and
# the two halves are typed with that tuple. A type cannot answer this question: `f(x) = x` and
# `f(x) = x*x` have the same lifted type and different residuals (0 and 1), which is why the residual
# position in `Split<F>` is a hole the compiler fills where the graph is in hand, and why the operator
# resolver's placeholder -- one slot per value parameter -- is only what a call site can be checked
# against, never what the graphs carry. Nothing on the far side of the cut is recomputed: every value
# the backward half reads comes out of the tuple.
#
# The readings, one per shape:
#   * the identity graph (`split_identity_pipeline`): a lifted body that computes nothing, so
#     `residuals=0` and the forward half answers `(3.0, ())` -- an empty tuple, and the backward half
#     hands the tangent through without reading anything.
#   * the author's example of 2026-10-31 15:25 (`g(x) = x*x` at x = 3): y = 9, one residual
#     `(3.0)` **in the graph**, tangent 6, and linear in the direction (dx = 2 gives 12, dx = 0 gives 0).
#     The call site's residuals tuple names no members (they are the graph's answer), so the program
#     prints it as `()` and hands it on whole -- the members it carries are not a signature's to name.
#   * the author's two-parameter program of 2026-11-01 (`f(x, y) = x*x*y` at 3, 2): the lift answers 18
#     with 12 in the direction (1, 0) and 9 in (0, 1), and the cut carries **three** residuals --
#     `x`, `y` and `x*x`, the product the rule for the second `mul` reads.
#   * a chain of multiplies (`f(x) = x*x*x` and `x*x*x*x` at 2): the derivatives are 12 and 32, the
#     counts are 2 and 3, and the count grows by one per factor. That pair is the shape check: a
#     backward half that recomputed the forward chain would answer the same numbers, so the count is
#     what tells carrying from recomputing, and a cut that stopped carrying would show up as a count
#     that did not grow.
#
# The five readings run by themselves: `split` exists and its forward half hands the residual tuple on,
# so there is nothing for a gate to ask.
[[tests]]
name = "split_forward_half"
desc = "The forward half of split(reinterp<jvp>(g)) for g(x) = x*x at x = 3: it computes what the present inputs allow and hands the residuals on whole. Reads `forward y= 9.0`, `residuals whole= ()` and the tangent 6.0; `residuals=2` is the graph's count -- the pair the body computes, plus the parameter's value port, which crosses now that the tangent side reads its tangent, and the members are the graph's answer, not a signature's."
kind = "behavior"
case = "../../../cases/transforms/split/split_forward_half.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_output_contains = ["forward y= 9", "residuals whole= ()", "tangent dx1= 6", "residuals=2"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "split_backward_tangent"
desc = "The backward half alone: it takes the residuals the forward half collected (r0 = 3) and the tangent direction, and gives the tangent 2x·dx = 6. The reading is the tangent and nothing else, because the forward half has its own entry."
kind = "behavior"
case = "../../../cases/transforms/split/split_backward_tangent.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["tangent dx1= 6"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "split_linear_in_dx"
desc = "The backward half is linear in the tangent direction: at x = 3 it is dx -> 6·dx, so dx = 2 gives 12, dx = 0 gives 0, and `twice == once + once` holds. One reading at dx = 1 cannot tell 6 + 6 from 2·6 + 1; this entry is what says the half is linear rather than pointwise right."
kind = "behavior"
case = "../../../cases/transforms/split/split_linear_in_dx.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["dx1= 6", "dx2= 12", "dx0= 0", "doubles= true"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
[[tests]]
name = "split_two_params"
desc = "The reading program the author named for this tier (f(x, y) = x*x*y at x = 3, y = 2), read at both ends of the composition. The lift takes the four numbers (x, dx, y, dy) and answers the value 18.0 with the derivative in the direction the caller seeded: 12.0 for (1, 0) and 9.0 for (0, 1), which is 2xy and x^2. `split` of that lift cuts at the pair, and what crosses the cut is read off the graph: **five** residuals -- `x`, `y`, `x*x`, the product the backward half's rule for the second `mul` reads, and the two parameters' value ports, which cross because the tangent side reads their tangents -- so the forward half answers a five-member tuple and the backward half turns (1, 0) into 12.0 and (0, 1) into 9.0 without computing that product again. The diagnostic reads `residuals=5` and the forward half's type is `(float, float) => (float, (float, float, float, float, float))`: the arity is the graph's, not the signature's."
kind = "behavior"
case = "../../../cases/transforms/split/split_two_params.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_output_contains = ["value= 18.0", "dfdx= 12.0", "dfdy= 9.0", "forward y= 18.0", "lin dx= 12.0", "lin dy= 9.0", "type=(float, float) => (float, (float, float) => float pure) pure residuals=5"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "residuals_in_the_closure"
desc = "The transposed linear half, reading the cut's residuals out of the closure (2026-11-02). `lin` is the backward graph closed over the five values the cut carried, so `transpose(lin)` declares one **capture port** per residual, in the closure's order, and gets them because `transpose(f)` keeps `f`'s closure. The two leading arguments are the tangent values the type law still asks for (`Transpose<F>` is unchanged by this step) and they are passed as **zeros on purpose**: a coefficient read from a parameter would be 0 and the answer would be (0, 0). It is (12, 9) -- 2xy and x^2 for f(x, y) = x*x*y at x = 3, y = 2 -- which says the values came out of the closure and out of nowhere else. The counts are read too: the transposed graph is `(float, float, float) => (float, float)` (two tangents, the cotangent, two cotangents out), and the `mul_tangent` call inside it is transposed as the linear map it is (`(float, float, float) => (float, float)`), which is the participating set the arm path always built and the straight-line body now builds as well."
kind = "behavior"
case = "../../../cases/transforms/transpose/residuals_in_the_closure.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_output_contains = ["value=  18.0", "back dx=  12.0  back dy=  9.0", "TRANSPOSE function=split_of_jvp_of_f_backward graph=", "TRANSPOSE function=autodiff::mul_tangent<float>"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
[[tests]]
name = "split_product_chain"
desc = "A chain of multiplies, both ends of the composition: `f3(x) = x*x*x` and `f4(x) = x*x*x*x` at x = 2. The derivatives are the analytic ones read through the backward half -- 12 = 3x^2 and 32 = 4x^3 -- and the cut carries 3 residuals for the cubic and 4 for the quartic (`x`, `x*x`; plus `x*x*x`; plus the parameter's value port, which crosses because the tangent side reads its tangent). The forward half's type reads `(float) => (float, (float, float, float))` and `(float) => (float, (float, float, float, float))` -- the arity the graph gave it."
kind = "behavior"
case = "../../../cases/transforms/split/split_product_chain.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_output_contains = ["cubic y= 8.0", "cubic dx1= 12.0", "quartic y= 16.0", "quartic dx1= 32.0", "type=(float) => (float, (float, float, float)) pure residuals=3", "type=(float) => (float, (float, float, float, float)) pure residuals=4", "REINTERP split function=jvp_of_cubic", "REINTERP split function=jvp_of_quartic"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "split_call_one"
desc = "The cut through a call: `g(x) = sq(x) + 1.0` at x = 3, so the lifted body calls `jvp_of_sq` and the value half has to answer with something. A lift answers the pair (result, tangent) and its arguments are a value and a seed per parameter, so a value half that copies the call needs a tangent port -- which is the refusal this entry replaced (`a tangent port ... the value half reads the tangent of parameter 0`). The lift records the graph it was lifted from (`kGraphRefLiftedFrom`), and the value half reads that record: it calls `sq` -- the graph the lift came from -- with the values its caller passes and no seeds at all. The reading is `g value=10.0 dgdx=6.0` -- `sq(3)+1` and `2*3` -- with `residuals=3`, the count the hand-inlined `x*x + 1.0` carries (`x`, `x*x`, the constant), so the retarget moves nothing the inline spelling would have carried differently. The tangent half is untouched: it still calls the lift, which is where the tangents are computed."
kind = "behavior"
case = "../../../cases/transforms/split/split_call_one.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_contains = ["g value=10.0", "g dgdx=6.0", "residuals=3"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "split_branch_arms"
desc = "The cut at a branch, and the numbers it was promised: `leaky(x) = if x > 0.0 then x*x else 0.5*x` at x = 2.0 and x = -1.0, one call per arm -- a cut that walks only one arm is not a cut of a branch. The four readings were written down as acceptance numbers *before* the code that prints them (`docs/handover/reviews/m2-split-call-and-branch.cn.md` §6): `4.0`/`4.0` for the arm `x*x` (`2x`), `-0.5`/`0.5` for the arm `0.5*x`. The rule is the author's (design 4.2): **the condition itself is a residual** -- it is a value of the region the branch stands in, not an arm's input, so carrying it across the cut is what lets the backward half pick the arm by the same value the forward half picked it by. The cut line says what crossed: `residuals=2` is `(x, condition)` -- the condition is `bool`, hence `(float, (float, bool))` -- and `arms=2` is the two arms each half built and joined. `WALK`/`ARM` still print: the walk they describe is the one that copies each arm into its own region, and it runs whichever arm the input takes."
kind = "behavior"
case = "../../../cases/transforms/split/split_branch_arms.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_contains = ["REINTERP split function=jvp_of_leaky", "type=(float) => (float, (float, bool)) pure residuals=2 arms=2", "branch x=2.0 value=4.0", "branch x=2.0 dgdx=4.0", "branch x=-1.0 value=-0.5", "branch x=-1.0 dgdx=0.5", "WALK half=backward region=1 arm=0 branch=6 members=3 ports=0 nested=0 outside=2", "ARM half=backward arm=1 region=2 yield=15 members=2 value=10 tangent=11"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "split_branch_author"
desc = "**The author's own shape**, asked for by name: `f(x) = if x > 0 then x*x else 3*x`, whose derivative at x = 2.0 and x = -2.0 is **4.0** and **3.0**. It stands beside `split_branch_arms` and the pair is deliberate: there, both arms are linear, so the two numbers alone cannot tell a cut that picked the arm from one that blended them (`4.0`/`0.5`); here the second arm is `3*x`, and a blend or a backward half that recomputed the comparison and took the other arm could not land on 4.0 and 3.0 together. The read path is the cut itself -- `split(jvp(f))` -- because `vjp` stops one step later, in `transpose` (see `split_branch_author_vjp`). The lift and the cut are both the run-time kernel's, on every shape: there is one implementation of each and the call reaches it as a call."
kind = "behavior"
case = "../../../cases/transforms/split/split_branch_author.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_contains = ["REINTERP split function=jvp_of_f", "REINTERP split function=jvp_of_f", "type=(float) => (float, (float, bool)) pure residuals=2 arms=2", "author x=2.0 value=4.0", "author x=2.0 dfdx=4.0", "author x=-2.0 value=-6.0", "author x=-2.0 dfdx=3.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "split_branch_author_vjp"
desc = "The same shape read through `vjp`, which is `transpose . split . reinterp<jvp>` -- and it reads the author's numbers: 4.0 at `x = 2.0` and 3.0 at `x = -2.0`, the same two the entry above reads through the cut. The four refusals this entry pinned on the way there are recorded in the case: `skip=signature` (a `bool` residual), `arm-stop kind=10` (an arm holds a `Func`), `arg=1` (a rule kernel's tangent has no value), and `kernel=mul_tangent values=2` (the split recorded on the call the rule produced (`GCNode::tangentArgs`, read as `arm-call ... tangent-args=2`) and turned into a partial transposition: the values are ports, the tangents are what the answer is a cotangent of). It runs on nvm, fvm, jit and prl, and all four agree -- the numbers are the back ends' question too: the same 4.0/4.0 and -6.0/3.0 on each."
kind = "behavior"
case = "../../../cases/transforms/split/split_branch_author_vjp.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_contains = ["TRANSPOSE function=split_of_jvp_of_f_backward arm-call region=1 node=7 callee=autodiff::mul_tangent<float> args=4 tangent-args=2", "TRANSPOSE function=autodiff::mul_tangent<float>", "type=(float, float, float) => (float, float)", "author vjp value=4.0 dfdx=4.0", "author vjp value=-6.0 dfdx=3.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "split_identity_pipeline"
desc = "The identity graph: `reinterp<jvp>` builds a body with no operator in it, so `split` has nothing to move and the reading is the pipeline itself. The forward half gives the value the caller passed (3.0) and a one-member residual tuple -- `(3.0, (x,))`, which the diagnostic reports as `residuals=1` and the forward half's type as `(float) => (float, (float,))` -- and the backward half gives the tangent back (1.0) without reading the residual: nothing is computed on the forward side of the cut, but the tangent side reads the tangent of parameter 0, and what the reverse reads crosses."
kind = "behavior"
case = "../../../cases/compile/transforms/split_identity_pipeline.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_output_contains = ["identity y= 3", "identity dx1= 1", "type=(float) => (float, (float,)) pure residuals=1"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
