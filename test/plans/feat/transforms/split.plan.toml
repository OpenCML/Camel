# `split` (design doc 4.2): one function in, two out -- the forward half, which computes everything
# the present inputs allow and hands the residuals on as values, and the backward half, which reads
# those residuals and the tangent direction and gives the tangent.
#
# **What crosses the cut is read off the graph, not off the type.** The result side of the exit is what
# the forward half keeps, the tangent side is what the backward half keeps, and a node both reach is a
# value that crosses -- `residualsOf` (modules/transforms/split.cpp) names them in program order and
# the two halves are typed with that tuple. A type cannot answer this question: `f(x) = x` and
# `f(x) = x*x` have the same lifted type and different residuals (0 and 1), which is why the residual
# position in `Split<F>` is a hole the compiler fills where the graph is in hand, and why the operator
# resolver's placeholder -- one slot per value parameter -- is only what a call site can be checked
# against, never what the graphs carry. Nothing on the far side of the cut is recomputed: every value
# the backward half reads comes out of the tuple.
#
# The readings, one per shape:
#   * the identity graph (`split_identity_pipeline`): a lifted body that computes nothing, so
#     `residuals=0` and the forward half answers `(3.0, ())` -- an empty tuple, and the backward half
#     hands the tangent through without reading anything.
#   * the author's example of 2026-10-31 15:25 (`g(x) = x*x` at x = 3): y = 9, one residual
#     `(3.0)`, tangent 6, and linear in the direction (dx = 2 gives 12, dx = 0 gives 0). `r0` is
#     printed as the tuple it is: a one-member tuple prints `(3.0)`.
#   * the author's two-parameter program of 2026-11-01 (`f(x, y) = x*x*y` at 3, 2): the lift answers 18
#     with 12 in the direction (1, 0) and 9 in (0, 1), and the cut carries **three** residuals --
#     `x`, `y` and `x*x`, the product the rule for the second `mul` reads.
#   * a chain of multiplies (`f(x) = x*x*x` and `x*x*x*x` at 2): the derivatives are 12 and 32, the
#     counts are 2 and 3, and the count grows by one per factor. That pair is the shape check: a
#     backward half that recomputed the forward chain would answer the same numbers, so the count is
#     what tells carrying from recomputing, and a cut that stopped carrying would show up as a count
#     that did not grow.
#
# The five readings run by themselves: `split` exists and its forward half hands the residual tuple on,
# so there is nothing left for a gate to ask. The identity entry keeps `test/tools/have-split.mjs` (a
# tree without `modules/transforms/split.cpp` skips instead of failing).
[[tests]]
name = "split_forward_half"
desc = "The forward half of split(reinterp<jvp>(g)) for g(x) = x*x at x = 3: it computes what the present inputs allow and hands the residuals on as values. Reads `forward y= 9.0` and `residual r0= (3.0)`, and the tangent 6.0 as well, since the same run is what a reader would write to see the pair."
kind = "behavior"
case = "../../../cases/transforms/split/split_forward_half.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["forward y= 9", "residual r0= (3.0)", "tangent dx1= 6", "residuals=1"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "split_backward_tangent"
desc = "The backward half alone: it takes the residuals the forward half collected (r0 = 3) and the tangent direction, and gives the tangent 2x·dx = 6. The reading is the tangent and nothing else, because the forward half has its own entry."
kind = "behavior"
case = "../../../cases/transforms/split/split_backward_tangent.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["tangent dx1= 6"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "split_linear_in_dx"
desc = "The backward half is linear in the tangent direction: at x = 3 it is dx -> 6·dx, so dx = 2 gives 12, dx = 0 gives 0, and `twice == once + once` holds. One reading at dx = 1 cannot tell 6 + 6 from 2·6 + 1; this entry is what says the half is linear rather than pointwise right."
kind = "behavior"
case = "../../../cases/transforms/split/split_linear_in_dx.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["dx1= 6", "dx2= 12", "dx0= 0", "doubles= true"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
[[tests]]
name = "split_two_params"
desc = "The reading program the author named for this tier (f(x, y) = x*x*y at x = 3, y = 2), read at both ends of the composition. The lift takes the four numbers (x, dx, y, dy) and answers the value 18.0 with the derivative in the direction the caller seeded: 12.0 for (1, 0) and 9.0 for (0, 1), which is 2xy and x^2. `split` of that lift cuts at the pair, and what crosses the cut is read off the graph: **three** residuals -- `x`, `y`, and `x*x`, the product the backward half's rule for the second `mul` reads -- so the forward half answers a three-member tuple and the backward half turns (1, 0) into 12.0 and (0, 1) into 9.0 without computing that product again. The diagnostic reads `residuals=3` and the forward half's type is `(float, float) => (float, (float, float, float))`: the arity is the graph's, not the signature's."
kind = "behavior"
case = "../../../cases/transforms/split/split_two_params.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["value= 18.0", "dfdx= 12.0", "dfdy= 9.0", "forward y= 18.0", "tangent dx= 12.0", "tangent dy= 9.0", "type=(float, float) => (float, (float, float, float)) pure residuals=3"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "split_product_chain"
desc = "A chain of multiplies, both ends of the composition: `f3(x) = x*x*x` and `f4(x) = x*x*x*x` at x = 2. The derivatives are the analytic ones read through the backward half -- 12 = 3x^2 and 32 = 4x^3 -- and the cut carries 2 residuals for the cubic and 3 for the quartic (`x`, `x*x`; plus `x*x*x`). The count growing by one per factor is the shape check: a backward half that recomputed the forward chain would print the same numbers, so the numbers alone cannot tell carrying from recomputing and the counts can. The forward half's type reads `(float) => (float, (float, float))` and `(float) => (float, (float, float, float))` -- the arity the graph gave it."
kind = "behavior"
case = "../../../cases/transforms/split/split_product_chain.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["cubic y= 8.0", "cubic dx1= 12.0", "quartic y= 16.0", "quartic dx1= 32.0", "type=(float) => (float, (float, float)) pure residuals=2", "type=(float) => (float, (float, float, float)) pure residuals=3"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "split_call_one"
desc = "The cut through a call: `g(x) = sq(x) + 1.0` at x = 3, so the lifted body calls `jvp_of_sq` and the value half has to answer with something. A lift answers the pair (result, tangent) and its arguments are a value and a seed per parameter, so a value half that copies the call needs a tangent port -- which is the refusal this entry replaced (`a tangent port ... the value half reads the tangent of parameter 0`). The lift records the graph it was lifted from (`kGraphRefLiftedFrom`), and the value half reads that record: it calls `sq` -- the graph the lift came from -- with the values its caller passes and no seeds at all. The reading is `g value=10.0 dgdx=6.0` -- `sq(3)+1` and `2*3` -- with `residuals=3`, the count the hand-inlined `x*x + 1.0` carries (`x`, `x*x`, the constant), so the retarget moves nothing the inline spelling would have carried differently. The tangent half is untouched: it still calls the lift, which is where the tangents are computed."
kind = "behavior"
case = "../../../cases/transforms/split/split_call_one.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["g value=10.0", "g dgdx=6.0", "residuals=3"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "split_branch_arms"
desc = "The cut at a branch, which it refuses -- and the refusal is the reading pinned here, because a refusal that does not say which exit it met leaves the reader with nothing. `jvp` gives a branch's Join the lifted type (the arm the condition picks writes the pair into it), so the exit of a lifted branching body is a Join and not a tuple fill, and the old answer was a bare `skip=exit`. The new answer names the shape and the author's rule for it: **the condition itself is a residual**, carried so the backward half picks the arm the forward half took by reading the same condition. What blocks the build is that an arm is a **region**, not a data input: a half's walk follows `dataInputsOf` and never enters it. The condition is read off the Brch that names the Join (`condition=5`), never guessed from the arms. The numbers this case cannot print are pinned where they do run -- `feat.modules.autodiff`'s `control_flow_grad` differentiates through branches, arms that read different values included (`a=6.0` and `b=0.5` are the two arms of `if x > 0.0 then x * x else 0.5 * x`)."
kind = "behavior"
case = "../../../cases/transforms/split/split_branch_arms.cml"
args = ["${case}", "std::nvm"]
expect_exit = 1
expect_stdout_contains = ["skip=branch exit=Join condition=", "the condition carried as a residual", "a half's walk does not enter a region yet"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "split_identity_pipeline"
desc = "The identity graph: `reinterp<jvp>` builds a body with no operator in it, so `split` has nothing to move and the reading is the pipeline itself. The forward half gives the value the caller passed (3.0) and an **empty** residual tuple -- `(3.0, ())`, which the diagnostic reports as `residuals=0` and the forward half's type as `(float) => (float, ())` -- and the backward half gives the tangent back (1.0) without reading anything. Nothing crosses the cut because nothing is computed on the forward side of it. Gated on `split` existing (`test/tools/have-split.mjs`)."
kind = "behavior"
case = "../../../cases/compile/transforms/split_identity_pipeline.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["identity y= 3", "identity dx1= 1", "type=(float) => (float, ()) pure residuals=0"]
skip_unless = ["node", "test/tools/have-split.mjs"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
