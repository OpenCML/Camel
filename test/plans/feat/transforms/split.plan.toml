[[tests]]
name = "split_identity_pipeline"
desc = "The identity graph: `reinterp<jvp>` builds a body with no operator in it, so `split` has nothing to move and the reading is the pipeline itself. The forward half gives the value the caller passed (3.0) and a one-member residual tuple -- `(3.0, (x,))`, which the diagnostic reports as `residuals=1` and the forward half's type as `(float) => (float, (float,))` -- and the backward half gives the tangent back (1.0) without reading the residual: nothing is computed on the forward side of the cut, but the tangent side reads the tangent of parameter 0, and what the reverse reads crosses."
