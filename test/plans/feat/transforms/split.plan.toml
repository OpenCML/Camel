[[tests]]
name = "split_loop_taped_rounds"
desc = "`split` through a loop: the exit of a lifted loop is the LOOP node itself (its two value components *are* the pair), so the cut gives the forward loop one collection slot -- one tuple per round holding what the backward half reads from that round -- and `lin` loops over that tape. The round's factor changes (2, 3, 5), so the primal 30 and the tangent 30 are the per-round tape's doing: a tape that kept only the last round's residuals would print 125 for `lin(1.0)`. The diagnostic pins the shape -- `loop=1 tape=2 invariants=0`, one collection slot and two residuals per round (the round's element and the state's value) -- and `residuals=1` says the tape crosses the cut inside `lin`'s closure like every other residual. What this entry cannot pin is the order the rounds are walked in: with one float state the per-round maps are scalars 2, 3, 5, they commute, and every walk order prints the same 30. No loop in this tree can pin the order, and that is the lift rather than this cut: `jvp` pairs a floating scalar and nothing else (`pairTypeOf`, jvp.cpp:59-72), so a loop state can only be a float, and one float's per-round maps are scalars that commute. The construct that would break the tie -- one state holding a 2x2 matrix, round maps Mk = [[1, k], [k*k, 1]] -- runs as a primal and is refused by the lift with `REINTERP jvp function=f skip=body` (jvp.cpp:995), before `split` sees it; the case records that verbatim, so the next reader measures it instead of rebuilding the probe. The reverse walk itself is `transpose`'s (4.3), and `transpose` still copies a loop's range as it stands; named in the case, not hidden."
kind = "behavior"
case = "../../../cases/transforms/split/split_loop_taped_rounds.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_output_contains = ["loop y= 30.0", "loop d= 30.0", "type=(float) => (float, (float) => float pure) pure residuals=1 loop=1 tape=2 invariants=0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# The same loop, read *into*: `g(s) = (loop x = s ...)[1]`. The exit is then not the LOOP cell but a
# tuple fill whose two members are one component of the loop read through a projection, so the cut has
# to reach the cell through the chain the exit reads. It does that by seeding the two projections --
# each half gets its own value for the component it reads -- and copying the chain above the loop into
# that half; no body region is copied, which is what the old refusal (`the half would have to copy a
# body region`) said it would have to do. The numbers are row 1 of `M = M_10 * M_1 = [[1,1],[10,11]]`:
# the value at (1, 2) is 32, and the linearization answers 10 for the seed (1, 0) and 11 for (0, 1).
# A half that answered the whole state instead of the projection would print a pair, so the three
# numbers check that the chain is on both sides of the cut and not only on one.
[[tests]]
name = "split_loop_value_projected"
desc = "`split` through a loop whose value the exit reads *into* (`g(s) = (loop ...)[1]`): the loop cell is one node inside the chain the exit reads, not the exit, so the cut seeds the cell's two `TupleIndex` projections and copies the chain above it into each half -- the forward half's answers the projection's value, `lin`'s answers its tangent. Nothing of the body region is copied. The numbers are row 1 of `M = M_10 * M_1 = [[1,1],[10,11]]` on `s = (1, 2)`: 32 for the value, 10 for the tangent along (1, 0) and 11 along (0, 1) -- three numbers that separate a half answering the projection from one answering the state whole (`(3, 32)`), and a chain copied on one side of the cut from a chain copied on both. What this case does not reach is the pullback: `transpose` refuses one step later, at the call above the loop, so `vjp_loop.rounds_are_undone_in_reverse` stays marked." 
kind = "behavior"
case = "../../../cases/transforms/split/split_loop_value_projected.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_output_contains = ["proj y= 32.0", "proj d1= 10.0", "proj d2= 11.0", "loop=1 tape=5 invariants=0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# What a **struct** is to the cut: a struct is a port like any other -- `Tangent<Point>` is the struct
# of the members' tangents, so the two halves take one `Point` each and the halving of the lifted
# signature is right -- and a struct field read is a read by **name**, which the two halves carry by
# name as well (the copy keeps `GCAccsKind::StructKey` and writes `addAccsNode(type, key)`).
#
# That second shape used to be lost rather than carried: the copy of an `Accs` node wrote a
# `TupleIndex` from the payload's `value` and dropped the key, so at run time a `Struct` was indexed
# as a `Tuple` and the VM stopped at `idx < t->size()` ("Tuple index out of bounds", nodevm.cpp).
# `jvp` alone answers 11.0 and 4.0 on that program, so the lift was never the defect.
[[tests]]
name = "split_struct_port"
desc = "A struct parameter the body only **passes** (`g(qq: Point) = qq`): the forward half answers the struct it was handed and `lin` answers the struct of the direction's members, so the reading is `{ a: 2.0, b: 3.0 }` and `{ a: 1.0, b: 0.0 }`. `residuals=1` is the parameter's value crossing, which the tangent side needs because it reads the tangent beside it. This entry is the guard beside `split_struct_field_read`: a struct port is cut, and a cut that stopped taking one would fail here first."
kind = "behavior"
case = "../../../cases/transforms/split/split_struct_port.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_output_contains = ["forward y= { a: 2.0, b: 3.0 }", "lin dp= { a: 1.0, b: 0.0 }", "type=(Point) => (Point, (Point) => Point pure) pure residuals=1"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "split_struct_field_read"
desc = "A struct parameter whose member the body **names** (`g(qq: Point) = qq.a * 4.0 + qq.b`), read by name through both halves: the copy of an `Accs` keeps the `GCAccsKind::StructKey` and the key, so the two halves project `a` and `b` of the same struct the source named. The reading is `forward y= 11.0` and `lin dp= 4.0` -- the two `jvp` alone answers on the same program, which is what says the cut carried the graph rather than reading another member: the cut's numbers are not the lift's by construction, they are the lift's because the same reads are copied. A member read as a *place* would misnumber a `Struct` and stop the VM at `idx < t->size()`; that is the reading this entry replaced, and it stays in the case file's header."
kind = "behavior"
case = "../../../cases/transforms/split/split_struct_field_read.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_output_contains = ["lift value= 11.0  tangent= 4.0", "forward y= 11.0", "lin dp= 4.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# A callee whose parameter has no tangent space, which is where the second half's **argument
# arithmetic** was wrong rather than merely unsupported: `Tangent<int> = ()`, the lifted callee
# declares `(int, float, (), float)`, its backward half declares one port (the float's tangent), and
# the cut handed it the slot's `()` as well -- `Runtime indirect call norm-arity mismatch: caller
# graph 'split_of_jvp_of_g_backward' ... has 2 args, target graph 'split_of_jvp_of_widen_backward'
# has 1 norm ports`. The slot is now dropped by the callee's own signature (`tangentArgumentsOf`),
# the same list `buildSplitGraph` numbers the backward ports from.
[[tests]]
name = "split_int_parameter_slot"
desc = "`split` of a lift whose body calls a function with an `int` parameter (`widen(n: int, x: float)`), so the callee's lifted list has the `()` slot `Tangent<int> = ()` writes. The reading is the cut's own numbers -- 7.0 for `widen(2, 2) + 1.0` and 3.0 for its tangent -- and the backward half's type `((), float) => float`: the slot stays in the *type* (the halves keep their places position by position) and is not an argument anyone takes."
kind = "behavior"
case = "../../../cases/transforms/split/split_int_parameter_slot.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_contains = ["lift value= 7.0  tangent= 3.0", "g y= 7.0", "g d= 3.0", "type=(int, float) => (float, ((), float) => float pure) pure residuals=3"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# A cut of a cut. `split(jvp(f))` with `f` calling `g` and `g` calling `h`: the cut of `jvp_of_f`
# answers f's call with the forward half of `jvp_of_g`, and the cut of that half answered g's call
# with the forward half of `jvp_of_h` -- a pair of graphs the nested build *adopted* and therefore did
# not own, so adopting only that build's program held one level of them and not two
# (`runtimeTarget != nullptr`, "a direct call names a function whose graph is not in the program's
# graph table"). `SplitGraph::nestedPrograms` is transitive now, and every program in it is adopted.
# `split_call_one` is the same shape one level shallower.
[[tests]]
name = "split_two_nested_cuts"
desc = "Two levels of nesting (`f` calls `g`, `g` calls `h`, `split(jvp(f))`): the cut of `jvp_of_f` names the forward half of `jvp_of_g`, and that half names the forward half of `jvp_of_h`, which the nested build only adopted -- so the outer build adopts the programs of both levels and the deeper call resolves. The numbers are `f(x) = 3·(2x + 1)` at x = 2 -- 15 -- and 6 in the direction 1.0, the ones the lift answers on the same program: a run that had lost the deeper pair would stop at the call, and one that recomputed it would print a different 6 only by luck, so both numbers are pinned. The two shallower cuts print their own lines above (`REINTERP split function=jvp_of_h forward=` and `jvp_of_g`), which is what shows the three cuts were built and in which order."
kind = "behavior"
case = "../../../cases/transforms/split/split_two_nested_cuts.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_output_contains = ["REINTERP split function=jvp_of_h forward=", "REINTERP split function=jvp_of_g forward=", "REINTERP split function=jvp_of_f forward=", "f y= 15.0", "f d= 6.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000


# A value the differentiated lambda captured, of a tensor-shaped type: the cut had no reading for a
# **closure** port, and the two roads it did have (an ordinary parameter, a `with` argument) are not
# where a capture arrives. `jvp` declares a capture as a closure port of the lifted graph, `split`
# listed its halves' ports from `normPorts` and from the call's `with` inputs, and the read was in
# neither map -- the refusal both halves gave was `the port is not a parameter of the graph, so
# neither half takes it`, measured on `vjp((ww) => dot<ww>(x))(w)` with `x` the capture, which is the
# shape of item 3 of `2026-11-04-where-the-library-and-the-engine-still-differ.cn.md`.
#
# The forward half now declares one port per closure node of the source, in the source's order, and
# takes the source's closure type when it states one (`addCapturePorts`): the operator already hands
# the forward half `f`'s tuple (`splitKernel` creates the value with `function->tupleType()` and
# copies every slot), so the port reads the caller's value and the call site fills it as it always
# filled a closure -- the author's shape for a closure port (2026-11-04 02:50: 转发成成员自己的端口、
# 调用点照常填). A capture the tangent side reads crosses the cut as a residual like a `with` port
# (`residualsOf`), so the backward half reads it out of `lin`'s closure and declares nothing.
[[tests]]
name = "split_capture_of_a_tensor"
desc = "`vjp` of a lambda whose body reads a captured tensor, `dot(w) = sum(w * x)`: the cut of the lifted lambda reads the capture through a closure port, which neither `normPorts` nor the call's `with` inputs named, so both halves refused the read (`skip=forward construct=a port uri=- why=the port is not a parameter of the graph, so neither half takes it`). The answer is the engine's number for the same derivative, computed by hand before the reading was taken: `sum([1,2,3] * [4,5,6]) = 32` with pullback `[4, 5, 6]`, and the same `w` against the capture `[-1, 2, 0.5]` giving `4.5` with pullback `[-1, 2, 0.5]` -- the second point is what separates a pullback that reads the capture from one that hands back a remembered array. The extent is stated (`f64[3]`): with an open extent the same cut answers and `transpose` refuses one step later (`skip=cotangent-needs-a-value uri=tensor:multiply`), which is the case's boundary and not its subject."
kind = "behavior"
case = "../../../cases/transforms/split/split_capture_of_a_tensor.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_stdout = "captured value=32.0 pullback=([4.0, 5.0, 6.0])\ncaptured value=4.5 pullback=([-1.0, 2.0, 0.5])\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000


[[tests]]
name = "remat_tag_is_a_standard_tag"
desc = "`#remat` written on a function is a standard tag, so it compiles, checks its own position, and changes nothing: `g` is tagged and `f` calls it, and the program prints 7.0 either way. **What this entry is for**: the tag exists in the standard table (`src/core/tags.cpp`, next to `strict`), so the spelling and the placement are checked by the compiler even though no pass reads it yet. The pass that gives it meaning is `split` (its reading is the next piece of this work); `std::gir` does not print declaration tags today, which this entry does not claim -- it claims that a function carrying the tag is an ordinary function to every other pass."
kind = "behavior"
case = "../../../cases/transforms/split/remat_tag.cml"
args = ["${case}", "std::nvm"]
envs = ["CAMEL_PACKAGES=../../../cases/transforms/split"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["7.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

# The three `#remat` readings below ask the cut with the **closure ABI** (author, 2026-11-02):
# `split(f)` is the forward function, `fwd(x)` answers `(y, lin)`, and the residuals are closed over
# inside `lin`. The earlier spelling destructured `split(jvp(g))` into `(fwd, lin)` and called
# `lin(residuals, seed)` -- that is the binary-tuple ABI that was replaced, so those three entries were
# withdrawn for "a cut this tree does not have" when what this tree does not have is *that spelling*.
# `test/cases/transforms/split/split_forward_half.cml` is the author's own sample of the shape used
# here; nothing in `split*.cpp` was changed to accept the old one.

[[tests]]
name = "remat_tag_removes_the_parameter_residual"
desc = "`#remat` written on a function is the same request as calling `remat(f)`: it becomes the graph's recompute bit at build time (`src/compile/gir/builder.cpp`), so the whole downstream -- `jvp`'s lift carrying it, `split` reading it -- is one mechanism and the tag has no reader of its own. Two cubics, `g` tagged and `h` not: both lifts carry one non-parameter residual (`x*x`), and only `g`'s cut drops it, reading `residuals=2 recompute=1` against `h`'s `residuals=3` -- the count includes the parameter, which the backward half reads (`ca1941405`), so the difference is the one the tag removes. The values are the same 27.0, which is what \"store less, compute again\" means; a cut that also changed the answer would be a different bug, not a cheaper cut."
kind = "behavior"
case = "../../../cases/transforms/split/remat_tag_residuals.cml"
args = ["${case}", "std::nvm"]
envs = ["CAMEL_PACKAGES=../../../cases/transforms/split"]
backends = ["nvm"]
expect_exit = 0
expect_output_contains = ["REINTERP split function=jvp_of_g", "residuals=2 recompute=1", "REINTERP split function=jvp_of_h", "residuals=3", "tagged dx= 27.0", "plain dx= 27.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "remat_across_module_boundary"
desc = "`#remat` on a function in another module still marks the graph that is cut. The tag becomes the graph's recompute bit when the graph is built (`src/compile/gir/builder.cpp`), and a module's declarations are built the same way as the file's own, so the reading is the one the same-file case gets, and the answer is still 27.0. The same-file case could not have shown a mark that stops at an import, and this one also shows it survives the closure ABI at the cut."
