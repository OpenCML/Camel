# `split` (design doc 4.2): one function in, two out -- the forward half, which computes everything
# the present inputs allow and hands the residuals on as values, and the backward half, which reads
# those residuals and the tangent direction and gives the tangent.
#
# Two acceptance forms live here, and they do not light up at the same moment:
#   * the identity graph (`split_identity_pipeline`): a lifted body that computes nothing is two
#     parameter ports and one tuple fill, so the cut has nothing to move between the halves -- the
#     forward half hands the value through, the backward half hands the tangent through, and the
#     residuals hold nothing. This is the reading the plumbing lands with;
#   * the numbers of the author's example of 2026-10-31 15:25 (g(x) = x*x, x = 3, dx = 1): the
#     forward half gives y = 9 and r0 = 3 (the residual is the value the backward half needs), the
#     backward half gives the tangent 6, and it is linear in the tangent direction (dx = 2 gives 12,
#     dx = 0 gives 0). Those readings need the backward half to *read* a residual, which is the step
#     after the plumbing: they stay written and open by themselves.
#
# So the entries ask two different gates, each the question its own readings need -- a missing
# construct is not a defect of the tree, and a red here would say it is. The identity entry asks
# `test/tools/have-split.mjs` (does `split` exist), and the three number entries ask
# `test/tools/have-split-residuals.mjs` (does the forward half hand residuals on).

[[tests]]
name = "split_forward_half"
desc = "The forward half of split(reinterp<jvp>(g)) for g(x) = x*x at x = 3: it computes what the present inputs allow and hands the residuals on as values. Reads `forward y= 9` and `residual r0= 3`, and the tangent 6 as well, since the same run is what a reader would write to see the pair."
kind = "behavior"
case = "../../../cases/transforms/split/split_forward_half.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["forward y= 9", "residual r0= 3", "tangent dx1= 6"]
skip_unless = ["node", "test/tools/have-split-residuals.mjs"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "split_backward_tangent"
desc = "The backward half alone: it takes the residuals the forward half collected (r0 = 3) and the tangent direction, and gives the tangent 2x·dx = 6. The reading is the tangent and nothing else, because the forward half has its own entry."
kind = "behavior"
case = "../../../cases/transforms/split/split_backward_tangent.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["tangent dx1= 6"]
skip_unless = ["node", "test/tools/have-split-residuals.mjs"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "split_linear_in_dx"
desc = "The backward half is linear in the tangent direction: at x = 3 it is dx -> 6·dx, so dx = 2 gives 12, dx = 0 gives 0, and `twice == once + once` holds. One reading at dx = 1 cannot tell 6 + 6 from 2·6 + 1; this entry is what says the half is linear rather than pointwise right."
kind = "behavior"
case = "../../../cases/transforms/split/split_linear_in_dx.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["dx1= 6", "dx2= 12", "dx0= 0", "doubles= true"]
skip_unless = ["node", "test/tools/have-split-residuals.mjs"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
[[tests]]
name = "split_identity_pipeline"
desc = "The identity graph: `reinterp<jvp>` builds a body with no operator in it, so `split` has nothing to move and the reading is the pipeline itself. The forward half gives the value the caller passed (3.0) with no residuals, and the backward half gives the tangent back (1.0). A non-zero residual count is a value carried across the cut that the backward half never needs. Gated on `split` existing (`test/tools/have-split.mjs`), which the other three entries also need but not enough of: this entry lights the moment the operator lands, with no edit here."
kind = "behavior"
case = "../../../cases/compile/transforms/split_identity_pipeline.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["identity y= 3", "residual count= 0", "identity dx1= 1"]
skip_unless = ["node", "test/tools/have-split.mjs"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
