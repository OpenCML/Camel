[[tests]]
name = "println_whole_lines.prl"
desc = "Lines printed by concurrent calls under PRL come out whole, each exactly once, whatever their order."
kind = "behavior"
case = "../../../cases/para/core/println_whole_lines.cml"
args = ["-t", "8", "${case}", "${run_prl}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines"]
verify_script = """
({ input, assert }) => {
const lines = input.normalized.stdout.split(String.fromCharCode(10))
if (lines[lines.length - 1] === '') lines.pop()
assert(lines.length === 3000, `expected 3000 lines, got ${lines.length}`)
const seen = new Set()
for (const line of lines) {
const m = /^line ([0-9]+) of the map$/.exec(line)
assert(m !== null, `broken line: '${line}'`)
seen.add(Number(m[1]))
}
assert(seen.size === 3000, `expected 3000 distinct lines, got ${seen.size}`)
}
"""
timeout_ms = 30000

[[tests]]
name = "recursion_too_deep.prl"
desc = "With the limit raised to 1000000, depth(400000) is far deeper than a native stack holds. main and depth are serial, so std::prl runs them on the bytecode interpreter, which keeps direct calls off the native stack: the recursion completes, as on std::fvm (design principles 9.10). The two back ends agree. (Without the option every scheduler stops at 1000: consistency.limits, para.handoff.)"
kind = "behavior"
case = "../../../cases/para/core/recursion_too_deep.cml"
args = ["-t", "4", "--max-recursion-depth", "1000000", "${case}", "${backend}"]
backends = ["fvm", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_starts_with = "1000\n400000\ndone\n"
# 400000 calls: under a sweep that collects at every safepoint (poison) that is 400000
# collections on std::fvm. What such a sweep checks, the other tests check.
sweep = false
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

[[tests]]
name = "recursion_too_deep.prl_evaluator"
desc = "The same program with the bytecode hand-off off (std::prl bytecode=false), so that the scheduler's own evaluator runs the recursion and every call nests on the native stack: it stops with MaxRecursionDepthExceeded when the stack of the thread is nearly full (the shared guard reserves space for reporting and fault unwinding on each platform) instead of a segmentation fault; depth(1000) printed before it, nothing after."
kind = "negative"
case = "../../../cases/para/core/recursion_too_deep.cml"
args = ["-t", "4", "--max-recursion-depth", "1000000", "${case}", "${run_prl_no_bytecode}"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::MaxRecursionDepthExceeded"
expect_diagnostic_code = "0x04000004"
expect_stdout_contains = ["1000", "the native stack of the thread"]
expect_stdout_starts_with = "1000\n"
expect_output_not_contains = ["400000\n"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

# Granularity: a scope runs as a task graph only when it has two unordered items that are each
# a higher-order operator or a call of a heavy graph (one that reaches a higher-order operator,
# a module operator or a call of a function value). Asserted through the scheduler's statistics
# line (std::prl gc_stats=1: "[taskflow] run: task_graphs=N workers=W"), not through time.
[[tests]]
name = "scalar_recursion_inline.prl"
desc = "Light side of the granularity rule: fib and a mutual recursion, bodies of built-in arithmetic only, make unordered recursive calls but run inline under PRL: 0 task graphs."
kind = "behavior"
case = "../../../cases/para/core/scalar_recursion_inline.cml"
args = ["-t", "4", "${case}", "${run_prl_gc_stats1}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim().split(String.fromCharCode(10)).join(' | ')
assert(out === '6765 | 987', `unexpected output: ${out}`)
const m = /task_graphs=([0-9]+)/.exec(input.normalized.stderr)
assert(m !== null, `no statistics line of the scheduler in stderr: ${input.normalized.stderr}`)
assert(Number(m[1]) === 0, `${m[1]} task graph(s) ran for a scalar recursion, expected 0`)
}
"""
timeout_ms = 30000

[[tests]]
name = "scalar_recursion_inline.prl_fanout_all"
desc = "The same program with the rule switched off (std::prl fanout_all=true) does run task graphs: the 0 above comes from the rule, not from the program."
kind = "behavior"
case = "../../../cases/para/core/scalar_recursion_inline.cml"
args = ["-t", "4", "${case}", "${run_prl_gc_stats1_fanout_all}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim().split(String.fromCharCode(10)).join(' | ')
assert(out === '6765 | 987', `unexpected output: ${out}`)
const m = /task_graphs=([0-9]+)/.exec(input.normalized.stderr)
assert(m !== null && Number(m[1]) > 1000, `expected many task graphs with the rule off: ${input.normalized.stderr}`)
}
"""
timeout_ms = 30000

[[tests]]
name = "concurrent_alloc.prl_fans_out"
desc = "Heavy side of the granularity rule: the two halves of a merge sort call module operators (array), so each split runs as a task graph under PRL: at least 12 task graphs (the program sorts 13 arrays; measured 225)."
kind = "behavior"
case = "../../../cases/para/core/concurrent_alloc.cml"
args = ["-t", "4", "${case}", "${run_prl_gc_stats1}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const m = /task_graphs=([0-9]+)/.exec(input.normalized.stderr)
assert(m !== null, `no statistics line of the scheduler in stderr: ${input.normalized.stderr}`)
assert(Number(m[1]) >= 12, `only ${m[1]} task graph(s) ran for the merge sort, expected at least 12`)
}
"""
timeout_ms = 30000

# Higher-order operators: the ordered ones (reduce, foreach) run their steps on the calling
# thread; the unordered ones (map, filter, unordered_foreach) hand their elements out in chunks
# whose size is measured, to helpers that are started at once or when the work proves worth it
# (docs/technical/06_runtime_and_execution.md, 4.3.2). Which elements shared a chunk and whether
# a light map got helpers depend on time and are not asserted; what is asserted is the result,
# and the task graphs that do not depend on time.
[[tests]]
name = "ordered_operators_inline.prl"
desc = "reduce over 2000 elements and foreach over 5 start no task graph under PRL (0 in the scheduler's statistics) and give the result and the order of the linear back ends."
kind = "behavior"
case = "../../../cases/para/core/ordered_operators_inline.cml"
args = ["-t", "4", "${case}", "${run_prl_gc_stats1}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim().split(String.fromCharCode(10)).join(' | ')
assert(out === '790806 | step 0 | step 1 | step 2 | step 3 | step 4', `unexpected output: ${out}`)
const m = /task_graphs=([0-9]+)/.exec(input.normalized.stderr)
assert(m !== null, `no statistics line of the scheduler in stderr: ${input.normalized.stderr}`)
assert(Number(m[1]) === 0, `${m[1]} task graph(s) ran for reduce and foreach, expected 0`)
}
"""
timeout_ms = 30000

[[tests]]
name = "map_chunks.nvm"
desc = "The reference output of map_chunks on the node VM: map, filter and unordered_foreach over arrays of thousands of elements with light, recursive and module-operator element functions, an empty and a one-element array."
kind = "behavior"
case = "../../../cases/para/core/map_chunks.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim().split(String.fromCharCode(10)).join(' | ')
assert(out === 'light 60000 0 4 199 399 3421445 | kept 17142 3 59994 31038796 | steps 4000 0 111 113 932314209 | roots 3000 0 2999 534809138 | edge 0 [6] | done', `unexpected output: ${out}`)
}
"""
timeout_ms = 30000

[[tests]]
name = "map_chunks.prl"
desc = "The same output under PRL with 4 workers, where the elements are handed out in chunks to several workers. The two maps whose element function recurses or calls a module operator get helpers from the start whatever the timing: at least 2 task graphs."
kind = "behavior"
case = "../../../cases/para/core/map_chunks.cml"
args = ["-t", "4", "${case}", "${run_prl_gc_stats1}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim().split(String.fromCharCode(10)).join(' | ')
assert(out === 'light 60000 0 4 199 399 3421445 | kept 17142 3 59994 31038796 | steps 4000 0 111 113 932314209 | roots 3000 0 2999 534809138 | edge 0 [6] | done', `unexpected output: ${out}`)
const m = /task_graphs=([0-9]+)/.exec(input.normalized.stderr)
assert(m !== null, `no statistics line of the scheduler in stderr: ${input.normalized.stderr}`)
assert(Number(m[1]) >= 2, `only ${m[1]} task graph(s) ran, expected at least 2`)
}
"""
timeout_ms = 30000

