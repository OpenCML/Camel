id = "para.core"
order = 350
tier = "feat"
tags = ["feat", "para"]

[[tests]]
name = "bootstrap_medians"
desc = "Checks PRL can execute repeated sample processing and parallel sort reductions coherently."
kind = "behavior"
case = "../../../cases/para/core/bootstrap_medians.cml"
args = ["${case}", "${run_prl}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

