id = "para.core"
order = 350
tier = "feat"
tags = ["feat", "para"]

[[tests]]
name = "bootstrap_medians"
desc = "Checks PRL can execute repeated sample processing and parallel sort reductions coherently."
kind = "behavior"
case = "../../../cases/para/core/bootstrap_medians.cml"
args = ["${case}", "${run_prl}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

[[tests]]
name = "file_chunk_hash"
desc = "Checks PRL can combine chunked file IO, worker-local hashing, and deterministic reduction."
kind = "behavior"
case = "../../../cases/para/core/file_chunk_hash.cml"
args = ["${case}", "${run_prl}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

[[tests]]
name = "monte_carlo_pi"
desc = "Checks PRL can execute a parallel Monte Carlo map-reduce estimator and finish within a routine feature-test budget."
kind = "behavior"
case = "../../../cases/para/core/monte_carlo_pi.cml"
args = ["${case}", "${run_prl}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000
