# Graph-level task execution: nodes of one graph with no path between them run concurrently
# under PRL, calls included. The assertions are deterministic: calls wait for each other at a
# rendezvous (module para) and report whether a peer arrived; nothing is timed. On a scheduler
# that runs a graph node by node every rendezvous times out and the counts are 0.
[[tests]]
name = "concurrent_calls.prl"
desc = "Two calls with no path between them in the graph run at the same time under PRL: both meet at a rendezvous."
kind = "behavior"
case = "../../../cases/para/core/concurrent_calls.cml"
args = ["-t", "4", "${case}", "${run_prl}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
assert(out === 'calls that met a peer: 2', `unexpected output: ${out}`)
}
"""
timeout_ms = 30000

[[tests]]
name = "concurrent_recursion.prl"
desc = "Tree recursion under PRL: the two recursive calls of every level run concurrently, so each of the 8 leaves meets a peer at a rendezvous."
kind = "behavior"
case = "../../../cases/para/core/concurrent_recursion.cml"
args = ["-t", "4", "${case}", "${run_prl}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
assert(out === 'leaves that met a peer: 8 of 8', `unexpected output: ${out}`)
}
"""
timeout_ms = 60000

[[tests]]
name = "merge_sort_small.prl"
desc = "merge_sort at a small size under PRL: the result is sorted and the two recursive calls of a split run concurrently (each of the 8 leaf sorts meets a peer at a rendezvous)."
kind = "behavior"
case = "../../../cases/para/core/merge_sort_small.cml"
args = ["-t", "4", "${case}", "${run_prl}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const lines = input.normalized.stdout.trim().split(String.fromCharCode(10))
assert(lines.length === 2, `unexpected output: ${lines.join(' | ')}`)
const expected = '[' + Array.from({ length: 64 }, (_, i) => i).join(', ') + ']'
assert(lines[0] === expected, `not sorted: ${lines[0]}`)
assert(lines[1] === 'leaf sorts that met a peer: 8 of 8', `unexpected output: ${lines[1]}`)
}
"""
timeout_ms = 60000

