id = "tools.debugger"
order = 910
tier = "fast"
tags = ["feat", "tools", "debugger"]
desc = "camel-db, the debugger. Each test is a script that starts camel-db and talks to it by protocol (test/tools/debugger/client.mjs): the retained HTTP gateway API, or the Debug Adapter Protocol over stdio."

[defaults]
kind = "behavior"
tool = "node"
args = ["${case}"]
expect_exit = 0
expect_stdout_starts_with = "ok "
normalizers = ["normalize_newlines"]
timeout_ms = 120000

[[tests]]
name = "debugger.http_gateway"
desc = "The HTTP API as the Web UI uses it: a file becomes a task in a worker process; node breakpoints by origin, node steps into a callee and over it, continue, the task's log, the graph after each pass, restart with the breakpoints and passes kept, terminate."
case = "../../../cases/tools/debugger/http_gateway.test.mjs"

[[tests]]
name = "debugger.dap_session"
desc = "A complete session over the Debug Adapter Protocol (camel-db --dap) on std::fvm and std::nvm: launch, line breakpoints (verified, and unverified with the reason on a line nothing depends on), the stop, the stack, variables (evaluated, not evaluated, a var cell, structured values), evaluate, continue, the program's output before exited and terminated, the exit code, arguments of main."
case = "../../../cases/tools/debugger/dap_session.test.mjs"
# Slow layer: measured 8.1 s in the full serial run (docs/handover/reports/H10.md).
tier = "slow"
timeout_ms = 300000

[[tests]]
name = "debugger.dap_stepping"
desc = "Steps over DAP on both back ends: next, stepIn, stepOut by source line in execution order (a line that is never executed is not a stop, and the console says why), the same by graph node (granularity instruction), recursion as one frame per call with the arms folded into the frames of their function or, switched by camel/setFrames or launched with frames subgraphs, as the subgraphs they are, a tail recursion as the one frame it is, and a branch whose untaken arm never stops."
case = "../../../cases/tools/debugger/dap_stepping.test.mjs"
# Slow layer: measured 8 s in the full serial run (docs/handover/reports/H10.md).
tier = "slow"
timeout_ms = 300000

[[tests]]
name = "debugger.dap_tail_steps"
desc = "Tail-recursive F10 skips replacement activations, F11 enters with new parameter snapshots, and breakpoints still interrupt step-over on NVM and FVM."
case = "../../../cases/tools/debugger/dap_tail_steps.test.mjs"
timeout_ms = 300000

[[tests]]
name = "debugger.dap_frames"
desc = "How the program is presented over DAP on both back ends (design principles 12.1): the arms of a branch are part of the frame of their function (line steps go through them, their names are the frame's while they run), the frames setting and camel/setFrames show the real subgraphs instead; a line step that goes past a line nothing uses the result of says so, and so does a breakpoint on it that was never hit; full names in the stack, captured values, evaluate and function breakpoints (ambiguous without the module, a function nothing calls)."
case = "../../../cases/tools/debugger/dap_frames.test.mjs"
timeout_ms = 300000

[[tests]]
name = "debugger.cli_session"
desc = "The REPL of camel-db (commands on stdin) on both back ends: breakpoints on a line, on a line nothing uses (with the reason) and on a function by its full name; run, step, next, finish with the line a step went past explained; bt, locals and print in the frame of a function with an arm folded into it; frames subgraphs and functions; the end of the run with the never-hit breakpoint explained; quit."
case = "../../../cases/tools/debugger/cli_session.test.mjs"
timeout_ms = 300000

[[tests]]
name = "debugger.dap_faults"
desc = "Faults over DAP on both back ends: an uncaught fault stops where it is raised with the diagnostic's text, position, stack and variables, exceptionInfo, and ends the program with exit code 1 when resumed; a fault inside attempt stops only with the isolated filter; no filter, no stop."
case = "../../../cases/tools/debugger/dap_faults.test.mjs"
# Slow layer: measured 7.3 s in the full serial run (docs/handover/reports/H10.md).
tier = "slow"
timeout_ms = 300000

[[tests]]
name = "debugger.dap_protocol"
desc = "DAP at its edges: error responses for unknown, malformed, mistimed and ill-formed requests; a program that does not compile; an unknown pass; pause, queries while running, terminate, disconnect and a closed input on a program that never ends; std::jit and std::prl running as std::fvm with a notice; breakpoints and names after optimisation passes; stopOnEntry; zero-based lines."
case = "../../../cases/tools/debugger/dap_protocol.test.mjs"
# Slow layer: measured 5 s in the full serial run (docs/handover/reports/H10.md).
tier = "slow"
timeout_ms = 300000

[[tests]]
name = "debugger.loop_frames"
desc = "A loop in the REPL on both back ends: its body is part of the frame of the function it is written in (design principles 12.1), a breakpoint in the body stops once per round with that round's element and state, and frames subgraphs shows the body as `squares [loop body at line N]`."
case = "../../../cases/tools/debugger/loop_frames.test.mjs"
timeout_ms = 300000

[[tests]]
name = "debugger.dap_pipeline"
desc = "Release compiler boundary stops, live JSON GIR, pass stepping, repeated pass names, runtime handoff, invalid configuration and terminate/consumed graphs."
case = "../../../cases/tools/debugger/dap_pipeline.test.mjs"

[[tests]]
name = "debugger.dap_memory"
desc = "Paused memory overview, bounded byte/object paging, lossless addresses, invalid requests, Release capability and session end."
case = "../../../cases/tools/debugger/dap_memory.test.mjs"

[[tests]]
name = "debugger.dap_node_breakpoints"
desc = "GIR origins set at compiler entry hit the transformed runtime node on NodeVM/FastVM; paused origin/source, actual GIR, clear and resume."
case = "../../../cases/tools/debugger/dap_node_breakpoints.test.mjs"
