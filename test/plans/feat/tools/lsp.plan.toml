id = "tools.lsp"
order = 900
tier = "fast"
tags = ["feat", "tools", "lsp"]
desc = "camel-ls, the language server. Each test is a script that starts the server, talks LSP to it over stdio (test/tools/lsp/client.mjs) and checks the answers."

[defaults]
kind = "behavior"
tool = "node"
args = ["${case}"]
expect_exit = 0
expect_stdout_starts_with = "ok "
normalizers = ["normalize_newlines"]
timeout_ms = 60000

[[tests]]
name = "lsp.basics"
desc = "Lifecycle, full document synchronisation, pull diagnostics (code, data, range), whole-document formatting, MethodNotFound for an unknown request."
case = "../../../cases/tools/lsp/basics.test.mjs"

[[tests]]
name = "lsp.navigation"
desc = "Push diagnostics, incremental synchronisation, hover (source spelling of types, signatures, documentation comments, generic instances, overloads, diagnostic codes), definition (also across files), references, highlights, document and workspace symbols."
case = "../../../cases/tools/lsp/navigation.test.mjs"

[[tests]]
name = "lsp.types_across_modules"
desc = "A type name whose declaration is in another module: definition of the name (imported by name and through a module prefix) is the declaration in that module, from the place the compiler recorded for it; the type also completes there."
case = "../../../cases/tools/lsp/types.test.mjs"

[[tests]]
name = "lsp.editing"
desc = "Completion (scope, fields after a dot, module members after ::, on text that does not parse), signature help, rename and its refusals, semantic tokens (var/let, sync)."
case = "../../../cases/tools/lsp/editing.test.mjs"

[[tests]]
name = "lsp.robustness"
desc = "Malformed frames, empty and half-written documents, positions outside the text, UTF-16 positions on lines with Chinese text and emoji, a document of 20000 lines, a burst of edits, cancellation: every request is answered and the server stays up."
case = "../../../cases/tools/lsp/robustness.test.mjs"
# Slow layer: measured 6.2 s in the full serial run (handover note ⟨617198c⟩ (H10)).
tier = "slow"
timeout_ms = 180000

[[tests]]
name = "lsp.graph"
desc = "camel/graph: the std::rgir text of the function at the cursor, of the whole program, after a pass sequence, for unsaved text, and the compiler's report when the program is in error."
case = "../../../cases/tools/lsp/graph.test.mjs"

[[tests]]
name = "lsp.operators"
desc = "Operator overloads of the program (design principles 4.3): hover and definition on the operator of a call that took one (binary and unary), a built-in operator unchanged, the overloads in the outline, the formatter's `func operator +(`."
case = "../../../cases/tools/lsp/operators.test.mjs"

[[tests]]
name = "lsp.fstring"
desc = "A formatted string is a string to the lexer but code inside `${...}`: hover on a local, a callee and a field, definition of a local declared outside the string, completion of the names in scope (design principles 11.5)."
case = "../../../cases/tools/lsp/fstring.test.mjs"

[[tests]]
name = "lsp.namespaces"
desc = "Namespace members by their full names (design principles 10.2): hover (functions, a nested namespace, a namespace written as a path, values), the outline, completion inside the namespace and after `N::` (labelled with the full name, written by the member's own)."
case = "../../../cases/tools/lsp/namespaces.test.mjs"
