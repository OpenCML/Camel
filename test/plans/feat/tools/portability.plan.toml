id = "tools.portability"
order = 915
tier = "fast"
tags = ["feat", "tools", "portability"]
desc = "Properties of the sources that one platform's toolchain does not check for the others."

# scripts/check-std-includes.mjs reads every .h / .cpp of src/, include/, modules/ and tools/:
# a file that names something of the standard library gets the header that declares it from its
# own include lines or from the project headers it includes, not from what one standard library
# includes inside another header (libstdc++, libc++ and the MSVC library differ there).
# `node scripts/check-std-includes.mjs --fix` adds the missing lines.

[[tests]]
name = "portability.std_includes"
desc = "No source file relies on a standard header that only another standard header brings in."
kind = "behavior"
tool = "node"
case = "../../../../scripts/check-std-includes.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["every standard header used is reached through its includes"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000

#  The source tree is not an install. A `.cmo` is a module binary and a `.so` / `.dll` /
# `.pdb` / `.o` is a linker output: both belong in `build/` or `out/<tag>/`, and the module loader
# finds modules beside the executable and under `CAMEL_HOME`, so nothing has to be written next to
# `stdlib/*.cml`. The build runs the same script at the end of `copyBuildArtifacts`, so a step that
# starts writing there fails the build; this is the plan-level check that the tree is clean.
# `node scripts/check-source-artifacts.mjs --clean` deletes what it lists.

[[tests]]
name = "portability.source_artifacts"
desc = "No build output (.cmo, .so, .dll, .pdb, .o) sits under a source directory."
kind = "behavior"
tool = "node"
case = "../../../../scripts/check-source-artifacts.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["no build output in the source tree"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000
