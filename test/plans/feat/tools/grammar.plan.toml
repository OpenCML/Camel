id = "tools.grammar"
order = 380
tier = "fast"
tags = ["feat", "tools", "editor", "grammar"]
desc = "The TextMate grammar of the VS Code extension (editors/vscode): its tables against the lexer, and the scopes it gives representative programs."

[[tests]]
name = "grammar.tables"
desc = "Every keyword of the lexer's token table (include/camel/parse/syntax/token_kinds.def) is matched by exactly one keyword pattern of the grammar and the grammar lists no other keyword; every operator and separator of the table is matched by an operator or punctuation pattern; the built-in type names are those of the compiler's root type scope; the contextual keywords of scripts/context-keywords.mjs (the table of the language reference, 02, 2.4.1) are the words of the grammar's contextual-keywords rule, each with a scope. No dependencies."
kind = "behavior"
tool = "node"
case = "../../../../editors/vscode/scripts/check-grammar.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["grammar check passed"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000

[[tests]]
name = "grammar.files"
desc = "The grammar, the language configuration and the extension manifest are valid JSON and refer to each other consistently (scope name, paths, language id, the custom semantic token modifiers). No dependencies."
kind = "behavior"
tool = "node"
case = "../../../../editors/vscode/scripts/check-manifest.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["manifest check passed"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000

[[tests]]
name = "grammar.scopes.literals"
desc = "Scopes of every literal form of the lexer: integers in each radix with and without exponent, reals, strings with escapes and placeholders, multi-line strings, formatted strings, booleans, null, tuple element access."
kind = "snapshot"
tool = "node"
case = "../../../cases/tools/grammar/literals.cml"
args = ["editors/vscode/scripts/tokenize.mjs", "${case}"]
skip_unless = ["node", "editors/vscode/scripts/have-deps.mjs"]
expect_exit = 0
normalizers = ["normalize_newlines"]
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
golden = "./golden/grammar/literals.scopes"
timeout_ms = 30000

[[tests]]
name = "grammar.scopes.comments"
desc = "Scopes of line, block and documentation comments, of '#' command lines, and of comment openers inside strings."
