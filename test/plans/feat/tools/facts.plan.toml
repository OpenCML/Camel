id = "tools.facts"
order = 918
tier = "fast"
tags = ["feat", "tools", "facts", "kernel"]

# The fact framework (`src/kernel/facts/include/camel/facts/facts.h`) had every declaration and no
# definition anywhere in the tree: `registerKind`, `findKind`, `kindInfo`, `registeredKinds`,
# `ReadLog::take`, all of `Store`, `computeAll` and `dump`. A framework declared and not defined
# reads like a framework that exists -- the header says what a fact is, how it is stamped and what
# it is about -- and nothing could register a kind or ask for one. `camel-facts --self-check` walks
# that path and asserts what a reader sees at each step.

[[tests]]
name = "facts.self_check"
desc = "A kind registers and is refused when it breaks a rule (a key that is not '<owner>.<name>', no print, the same key as another kind, a Content kind stating a merge, a Content kind that reads nothing), the same key registered again answers the id it already had, a store computes a fact on the first ask and answers the second from what it kept, a version that moved drops the entry instead of answering it, the validator compares a fresh computation with the stored one, a Content kind is read from the view each time and stored nowhere, a Target kind is stored under the hash of its target, computeAll fills the store at every anchor the kind names, the dump prints one FACT line per stored fact naming the kind and its class, the read log sorts and de-duplicates what a computation reported, a kind that states a merge law merges two parts into the value of their union, and dropping a graph's facts drops every fact anchored on it."
kind = "behavior"
tool = "camel-facts"
case = "../../../../tools/facts/main.cpp"
args = ["--self-check"]
expect_exit = 0
expect_stdout_contains = ["a kind registers and is found again by its key", "a kind registered again as another kind is refused, naming its key", "a Content kind that states a merge is refused: it is read, never stored", "the second ask answers from what the store kept, and computes nothing", "a version that moved drops the entry instead of answering it", "the validator says a stored value that disagrees with a fresh computation is not the fact", "a Content kind is read from the view and stored nowhere", "a kind that states a merge law merges two parts into the value of their union", "computeAll fills the store at every anchor the kind names, and nowhere else", "the dump prints one FACT line per stored fact, naming the kind and its class", "facts self-check: passed"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000

# `camel inspect --facts` is the fact framework's viewer switch (`D-1123-29` item 2, answered in
# internal/questions/2026-11-23-who-owns-a-store.cn.md: "--facts 接线, as the tool's view, not a
# pass"). Two stores exist and one command has to say which answered: the framework's
# (`camel/facts/facts.h`) and the older one (`camel/runtime/facts.h`), whose seven kinds are the
# baseline the remaining moves will be measured against. Every FACT line names its `library`.

[[tests]]
name = "facts.inspect_both_libraries"
desc = "camel inspect --facts on a compiled program prints one FACT line per fact of every registered kind, from the framework (core.arrangeable at the program's nodes, core.controlRegions on its root graph) and from the older store (core.shape and its six others), each line naming the library that answered it. The framework's kinds are registered when the library loads, not when a reader first asks, so an enumeration sees them without another reader having asked first."
kind = "behavior"
case = "../../../cases/facts/two_functions.cml"
args = ["inspect", "--facts", "${case}"]

expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const facts = out.split('\n').filter(l => l.startsWith('FACT ')).map(l => JSON.parse(l.slice(5)))
assert(facts.length > 0, 'no FACT line at all')
const framework = facts.filter(f => f.library === 'facts')
const older = facts.filter(f => f.library === 'runtime.facts')
assert(framework.length > 0, 'no line from the fact framework')
assert(older.length > 0, 'no line from the older store: --facts stopped printing its seven kinds')
for (const kind of ['core.arrangeable', 'core.controlRegions']) {
  assert(framework.some(f => f.kind === kind), `the framework registers ${kind} but no line says it`)
}
assert(older.some(f => f.kind === 'core.effects'), "the older store's core.effects is missing")
// The framework's lines are about the graph the tool compiled, and a node kind anchors nodes.
const arrangeable = framework.filter(f => f.kind === 'core.arrangeable')
assert(arrangeable.every(f => f.anchors.length === 1 && f.anchors[0].graph === 'root' && f.anchors[0].node !== undefined),
  "core.arrangeable lines are not one node each of the program's root graph")
const regions = framework.filter(f => f.kind === 'core.controlRegions')
assert(regions.length === 1 && regions[0].anchors.length === 1, 'core.controlRegions is not one graph fact')
}
"""
timeout_ms = 20000

[[tests]]
name = "facts.inspect_kind_by_name"
desc = "camel inspect --fact <key> prints the facts of the one kind named and nothing else, so a reader can read one kind without the other library's lines in the way."
kind = "behavior"
case = "../../../cases/facts/two_functions.cml"
args = ["inspect", "--fact", "core.controlRegions", "${case}"]

expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const facts = out.split('\n').filter(l => l.startsWith('FACT ')).map(l => JSON.parse(l.slice(5)))
assert(facts.length === 1, `expected one FACT line, got ${facts.length}`)
assert(facts[0].library === 'facts' && facts[0].kind === 'core.controlRegions',
  `wrong fact: ${facts[0].library}/${facts[0].kind}`)
assert(!out.includes('runtime.facts'), 'a kind was named, and the other store still printed')
}
"""
timeout_ms = 20000

[[tests]]
name = "facts.inspect_kind_no_such"
desc = "camel inspect --fact <key> for a key no store registers a kind under prints FACT-KIND-ABSENT and fails, instead of printing a table with no rows. The key is the one the author ruled out (the execution plan is `std.execPlan`, registered by the module that reads it, and is not a `core.*` kind), which is the ruling's own case: 'if the kind is not registered, report that there is no such fact kind, and do not guess'. An enumeration of the registered kinds cannot report a kind nobody registered, so the absence is asked by name."
kind = "behavior"
case = "../../../cases/facts/two_functions.cml"
args = ["inspect", "--fact", "core.execPlan", "${case}"]

expect_exit = 1
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const absent = out.split('\n').filter(l => l.startsWith('FACT-KIND-ABSENT '))
assert(absent.length === 1, `expected one FACT-KIND-ABSENT line, got ${absent.length}`)
const line = JSON.parse(absent[0].slice('FACT-KIND-ABSENT '.length))
assert(line.kind === 'core.execPlan', `wrong kind: ${line.kind}`)
assert(line.reason.includes('no such fact kind'), `the reason does not say so: ${line.reason}`)
assert(!out.split('\n').some(l => l.startsWith('FACT ')), 'an empty table was printed beside the absence')
}
"""
timeout_ms = 20000

# The two landed kinds against the algorithms they replaced, on one program, item by item
# (`test::facts_compare`, src/stdlib/test/facts_compare.h). A kind that is a new home for an answer
# is accepted by showing that the answers did not move: the counts are the reading, and a case that
# compared nothing must be red -- `agents/test.md`, a check over an empty set passes silently -- so
# each entry demands a lower bound on what was compared beside the zero on what differs.

[[tests]]
name = "facts.compare_control_regions"
desc = "test::facts_compare reads core.controlRegions through ControlRegions -- the reader the debugger asks -- and the walk the debugger computed for itself before the kind existed (the region table read with parent and a kind test: the innermost arm or loop region a region is in, the parent chain it kept as regionOuter, and 'is this region reached from that one' by walking outward), and prints the item-by-item counts. Every region's enclosing control region, every parent-chain answer, every pair of control regions and every node's control region agree; a run that compared nothing is red, because the counts are read as a lower bound as well as a zero on the differences."
kind = "behavior"
case = "../../../cases/facts/tensors_and_loops.cml"
args = ["${case}", "test::facts_compare"]

expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const line = out.split('\n').find(l => l.startsWith('FACTS_COMPARE kind=core.controlRegions'))
assert(line, 'no FACTS_COMPARE line for core.controlRegions')
const num = (name) => { const m = line.match(new RegExp(name + '=([0-9]+)')); assert(m, `${name} is missing from: ${line}`); return Number(m[1]) }
assert(num('graphs') > 0, 'no graph was compared')
assert(num('regions') > 0, 'no region was compared: the program has loops, so the walk had items')
assert(num('within_pairs') > 0, 'no visibility pair was compared')
assert(num('enclosing_diff') === 0, `the enclosing answers differ: ${line}`)
assert(num('chain_diff') === 0, `the parent-chain answers differ: ${line}`)
assert(num('within_diff') === 0, `the visibility answers differ: ${line}`)
assert(num('nodes_diff') === 0, `the node answers differ: ${line}`)
assert(num('enclosing_same') >= num('regions'), 'not every region was answered')
assert(num('chain_same') >= num('regions'), 'not every region got a parent-chain answer')
assert(num('nodes_same') > 0, 'no node was in a control region')
assert(!out.includes('state=no-store'), 'a graph had no fact store to compare with')
}
"""
timeout_ms = 20000

[[tests]]
name = "facts.compare_arrangeable"
desc = "test::facts_compare reads core.arrangeable at every node -- through the store, so the answer a reader gets -- and the algorithm it replaced, which answered OPER nodes only: the four terms of a node's operator, read from the operator itself. Every OPER node agrees with the older answer, and the count of nodes the older algorithm never answered (values, ports, branches, loops, calls) is printed as no_old: the fact answers them, and that count is part of what moving the question into a fact added."
kind = "behavior"
case = "../../../cases/facts/tensors_and_loops.cml"
args = ["${case}", "test::facts_compare"]

expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const line = out.split('\n').find(l => l.startsWith('FACTS_COMPARE kind=core.arrangeable'))
assert(line, 'no FACTS_COMPARE line for core.arrangeable')
const num = (name) => { const m = line.match(new RegExp(name + '=([0-9]+)')); assert(m, `${name} is missing from: ${line}`); return Number(m[1]) }
assert(num('graphs') > 0, 'no graph was compared')
assert(num('nodes') > 0, 'no node was compared')
assert(num('same') > 0, 'no operator node was answered by both routes')
assert(num('diff') === 0, `an operator node's terms differ: ${line}`)
assert(num('same') + num('no_old') === num('nodes'), 'the two counts do not cover the nodes')
}
"""
timeout_ms = 20000
[[tests]]
name = "facts.compare_arrangeable_readers"
desc = "test::facts_compare also reads `core.arrangeable` against the predicate a pass asks before it drops, moves, merges or reorders a node (`runtime::nodeIsFreelySchedulable`, the same four terms assembled inside `runtime::may_be_rearranged`): at every node of the program the two answers agree, no node is left without an answer, and both counts cover the nodes. The one node kind this comparison found disagreeing is the hand-on of an order -- a GATE carrying the chain of a `sync` block, which is pure, reaches nothing, cannot fault, ends, and still stands where the order says -- and the kind now declines for it instead of answering `freely arrangeable`, which is the answer a placement decision would act on (design principles 3.4; D-1124-65)."
kind = "behavior"
case = "../../../cases/facts/tensors_and_loops.cml"
args = ["${case}", "test::facts_compare"]

expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const line = out.split('\n').find(l => l.startsWith('FACTS_COMPARE kind=core.arrangeable readers'))
assert(line, 'no FACTS_COMPARE readers line for core.arrangeable')
const num = (name) => { const m = line.match(new RegExp(name + '=([0-9]+)')); assert(m, `${name} is missing from: ${line}`); return Number(m[1]) }
assert(num('nodes') > 0, 'no node was read')
assert(num('no_fact') === 0, `a node got no answer from the kind: ${line}`)
assert(num('diff') === 0, `a node is answered differently by the fact and by the pass predicate: ${line}\n${out.split('\n').filter(l => l.startsWith('FACTS_COMPARE reader_diff')).join('\n')}`)
assert(num('agree') + num('diff') === num('nodes'), 'the two counts do not cover the nodes')
const other = out.split('\n').find(l => l.startsWith('FACTS_COMPARE kind=core.arrangeable graphs='))
assert(other && other.match(/nodes=([0-9]+)/)[1] === String(num('nodes')), 'the two comparisons read different graphs')
}
"""
timeout_ms = 20000

# The call: the second disagreement the readers comparison found, and the one this lane answered.
# Before the change, on this program, `main`'s call of `f` was answered 1111 by the kind (the walk
# read the body of `f` and found it pure, infallible and ending) and 0 by the predicate a pass asks
# (`FACTS_COMPARE reader_diff graph=main node=1 node_kind=func oper=- kind=1 moved=0 terms=1111`),
# so the same node had two answers about whether a pass may move it. The kind declines at a call
# now -- the four terms are about the node's own place, and what a call runs is another graph's
# content -- which is the answer `graph::is_chain_statement` gives on purpose. A program whose
# only function-call node is in `main` is the smallest case that reads it: with one call node, one
# `reader_diff` line is the whole difference between the two answers.
[[tests]]
name = "facts.compare_arrangeable_readers_calls"
desc = "test::facts_compare's readers line on a program whose `main` calls `f`: the fact and the predicate a pass asks agree at every node, including the `func` node that makes the call. The two answered differently until the kind stopped reading a callee's body: the body of `f` is pure, cannot fail and ends, so the kind said `freely arrangeable` about a node whose place carries a call, and the predicate said it may not be moved. A `reader_diff` line names any node the two still answer differently; this test reads the count and the absence of the line."
kind = "behavior"
case = "../../../cases/facts/two_functions.cml"
args = ["${case}", "test::facts_compare"]

expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const line = out.split('\n').find(l => l.startsWith('FACTS_COMPARE kind=core.arrangeable readers'))
assert(line, 'no FACTS_COMPARE readers line for core.arrangeable')
const num = (name) => { const m = line.match(new RegExp(name + '=([0-9]+)')); assert(m, `${name} is missing from: ${line}`); return Number(m[1]) }
assert(num('nodes') > 0, 'no node was read')
assert(num('no_fact') === 0, `a node got no answer from the kind: ${line}`)
assert(num('diff') === 0, `the fact and the pass predicate answer a node differently: ${line}\\n${out.split('\\n').filter(l => l.startsWith('FACTS_COMPARE reader_diff')).join('\\n')}`)
assert(num('agree') === num('nodes'), 'not every node was answered the same way')
const diffs = out.split('\n').filter(l => l.startsWith('FACTS_COMPARE reader_diff'))
assert(diffs.length === 0, `a reader_diff line is still printed: ${diffs.join(' | ')}`)
}
"""
timeout_ms = 20000

# The framework holds a draft. `core.arrangeable` is a fact about a graph, and a graph is the
# frozen one a program holds *or* the one an editing session is building; until this lane only the
# frozen half had a store, so the kind could not be asked where a draft was all a caller had (the
# freeze decides `dropsOrder` from a draft). The `draft` line reads the same kind off a transaction
# this pass decodes each graph into: every node is answered (`no_fact=0`), no graph failed to get a
# store (`no_store=0`), every answer equals the frozen graph's answer at the same node
# (`diff=0`), every second ask was answered from what the store kept (`kept=nodes`), and an edit
# to the draft dropped the stored answer (`stale=graphs`) -- which is the stamp being the draft's
# revision and not the constant a frozen graph answers.
[[tests]]
name = "facts.compare_arrangeable_draft"
desc = "test::facts_compare asks `core.arrangeable` of the draft each reachable graph decodes into, at every node, and reads the counts: the framework found a store for every draft (`no_store=0`), answered every node (`no_fact=0`) with the same terms the frozen graph gives at that node (`diff=0`, and `same=nodes`), answered a second ask from what it kept (`kept=nodes`), and dropped the stored answers when the draft was edited (`stale=graphs`). Before the change the `storeHolding` of a draft answered nothing (`state=no-store`), so the count was zero and the reading said nothing: a kind that cannot be asked where a draft is all the caller has is the wall this test reads across."
kind = "behavior"
case = "../../../cases/facts/tensors_and_loops.cml"
args = ["${case}", "test::facts_compare"]

expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const line = out.split('\n').find(l => l.startsWith('FACTS_COMPARE kind=core.arrangeable draft'))
assert(line, 'no FACTS_COMPARE draft line for core.arrangeable')
const num = (name) => { const m = line.match(new RegExp(name + '=([0-9]+)')); assert(m, `${name} is missing from: ${line}`); return Number(m[1]) }
assert(num('graphs') > 0, 'no draft was asked')
assert(num('nodes') > 0, 'no node of a draft was asked')
assert(num('no_store') === 0, `a draft got no store from the framework, so the kind is not askable there: ${line}\\n${out.split('\\n').filter(l => l.startsWith('FACTS_COMPARE draft ')).join('\\n')}`)
assert(num('no_fact') === 0, `a node of a draft got no answer from the kind: ${line}`)
assert(num('diff') === 0, `the draft and the frozen graph answer a node differently: ${line}\\n${out.split('\\n').filter(l => l.startsWith('FACTS_COMPARE draft_diff')).join('\\n')}`)
assert(num('same') === num('nodes'), 'the two counts do not cover the nodes of the drafts')
assert(num('kept') === num('nodes'), `a draft fact was recomputed on the second ask instead of being answered from what the store kept: ${line}`)
assert(num('stale') === num('graphs'), `editing a draft did not drop the fact stored about it, so the stamp is not the draft's revision: ${line}`)
}
"""
timeout_ms = 20000