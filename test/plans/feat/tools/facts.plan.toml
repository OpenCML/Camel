const facts = out.split('\n').filter(l => l.startsWith('FACT ')).map(l => JSON.parse(l.slice(5)))
assert(facts.length === 1, `expected one FACT line, got ${facts.length}`)
assert(facts[0].library === 'facts' && facts[0].kind === 'core.controlRegions',
  `wrong fact: ${facts[0].library}/${facts[0].kind}`)
assert(!out.includes('runtime.facts'), 'a kind was named, and the other store still printed')
}
"""
timeout_ms = 20000

[[tests]]
name = "facts.inspect_kind_no_such"
desc = "camel inspect --fact <key> for a key no store registers a kind under prints FACT-KIND-ABSENT and fails, instead of printing a table with no rows. The key is the one the author ruled out (the execution plan is `std.execPlan`, registered by the module that reads it, and is not a `core.*` kind), which is the rule's own case: 'if the kind is not registered, report that there is no such fact kind, and do not guess'. An enumeration of the registered kinds cannot report a kind nobody registered, so the absence is asked by name."
kind = "behavior"
case = "../../../cases/facts/two_functions.cml"
args = ["inspect", "--fact", "core.execPlan", "${case}"]

expect_exit = 1
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const absent = out.split('\n').filter(l => l.startsWith('FACT-KIND-ABSENT '))
assert(absent.length === 1, `expected one FACT-KIND-ABSENT line, got ${absent.length}`)
const line = JSON.parse(absent[0].slice('FACT-KIND-ABSENT '.length))
assert(line.kind === 'core.execPlan', `wrong kind: ${line.kind}`)
assert(line.reason.includes('no such fact kind'), `the reason does not say so: ${line.reason}`)
assert(!out.split('\n').some(l => l.startsWith('FACT ')), 'an empty table was printed beside the absence')
}
"""
timeout_ms = 20000

# The two landed kinds against the algorithms they replaced, on one program, item by item
# (`test::facts_compare`, src/stdlib/test/facts_compare.h). A kind that is a new home for an answer
# is accepted by showing that the answers did not move: the counts are the reading, and a case that
# compared nothing must be red -- `agents/test.md`, a check over an empty set passes silently -- so
# each entry demands a lower bound on what was compared beside the zero on what differs.

[[tests]]
name = "facts.compare_control_regions"
desc = "test::facts_compare reads core.controlRegions through ControlRegions -- the reader the debugger asks -- and the walk the debugger computed for itself before the kind existed (the region table read with parent and a kind test: the innermost arm or loop region a region is in, the parent chain it kept as regionOuter, and 'is this region reached from that one' by walking outward), and prints the item-by-item counts. Every region's enclosing control region, every parent-chain answer, every pair of control regions and every node's control region agree; a run that compared nothing is red, because the counts are read as a lower bound as well as a zero on the differences."
kind = "behavior"
case = "../../../cases/facts/tensors_and_loops.cml"
args = ["${case}", "test::facts_compare"]

expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const line = out.split('\n').find(l => l.startsWith('FACTS_COMPARE kind=core.controlRegions'))
assert(line, 'no FACTS_COMPARE line for core.controlRegions')
const num = (name) => { const m = line.match(new RegExp(name + '=([0-9]+)')); assert(m, `${name} is missing from: ${line}`); return Number(m[1]) }
assert(num('graphs') > 0, 'no graph was compared')
assert(num('regions') > 0, 'no region was compared: the program has loops, so the walk had items')
assert(num('within_pairs') > 0, 'no visibility pair was compared')
assert(num('enclosing_diff') === 0, `the enclosing answers differ: ${line}`)
assert(num('chain_diff') === 0, `the parent-chain answers differ: ${line}`)
assert(num('within_diff') === 0, `the visibility answers differ: ${line}`)
assert(num('nodes_diff') === 0, `the node answers differ: ${line}`)
assert(num('enclosing_same') >= num('regions'), 'not every region was answered')
assert(num('chain_same') >= num('regions'), 'not every region got a parent-chain answer')
assert(num('nodes_same') > 0, 'no node was in a control region')
assert(!out.includes('state=no-store'), 'a graph had no fact store to compare with')
}
"""
timeout_ms = 20000

