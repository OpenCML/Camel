id = "tools.plan_refs_sweep"
order = 918
tier = "fast"
tags = ["feat", "tools", "exec"]
desc = "The plan-side table of the references that come back, checked on every case the tree has: `produced + copies == give-backs + kept + packed` per graph."

# The balance is a property of the walk and not of a program, so it is swept rather than pinned per
# program: `scripts/check-plan-refs.mjs` runs `test::plan_refs` on every case the tree has, and one
# graph that does not balance means the walk missed a path -- which is a reference given back too
# early the day a back end executes the table.
#
# It is a plan of its own, and not an entry beside the table's two programs, because of the cost
# class: a named plan file runs in full whatever `--tier` says, so a plan selected by a case path
# under test/cases must stay cheap, and this one spends a minute starting 3776 processes. Its case is
# the tool itself -- a path under scripts/, which no test/cases path owns -- so the file rule that
# names it (test/plan-selection.json) selects this plan and nothing rides a common case edit into it.
[[tests]]
name = "plan_refs.every_case_balances"
desc = "Every case the tree has is read through `test::plan_refs`, and every graph of every case that compiles balances `produced + copies == give-backs + kept + packed`, with no graph left unprinted."
kind = "behavior"
tool = "node"
case = "../../../../scripts/check-plan-refs.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["unbalanced=0", "silent=0", "every graph of every case that compiles balances"]
# The sweep starts one `camel` per case: 3776 cases, 2571 of them readable, 23993 graphs, about
# 238500 ms of CPU on one core and 54 s of wall clock at eight at a time. The bound is four times
# that work (the runner's margin), stated here because the number is the work's and not a guess; a
# host that runs the sweep slower spends wall clock, not CPU, so the bound stays a bound.
timeout_ms = 1200000