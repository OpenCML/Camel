# The positive side of each rename lives with the option it belongs to: `--diag-format` in
# compile.diag_options, `--spaces`/`--gc` in the sizing plans, and the subcommands here.

[[tests]]
name = "subcommand.docs"
desc = "`camel docs` is the documentation command: it exits 0 and prints the documentation it has."
kind = "behavior"
case = "../../../cases/compile/check/clean.cml"
args = ["docs"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "subcommand.about"
desc = "`camel about` prints the copyright and the build, and exits 0."
kind = "behavior"
case = "../../../cases/compile/check/clean.cml"
args = ["about"]
expect_exit = 0
expect_stdout_contains = ["Camel v"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "subcommand.zen"
desc = "`camel zen` prints the Zen of Camel, and exits 0."
kind = "behavior"
case = "../../../cases/compile/check/clean.cml"
args = ["zen"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "subcommand.explain"
desc = "`camel explain <name>` describes a diagnostic by name, the same text the option printed."
kind = "behavior"
case = "../../../cases/compile/check/clean.cml"
args = ["explain", "IndexOutOfRange"]
expect_exit = 0
expect_stdout_contains = ["RuntimeDiag::IndexOutOfRange"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000