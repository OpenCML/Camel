id = "tools.cli_removed_options"
order = 922
tier = "fast"
tags = ["feat", "tools", "cli"]
desc = "Every option the command line no longer has is refused as an unknown option, exit 1: the spellings that were renamed or merged into a subcommand are gone, not kept as aliases"

# The command line has one spelling for each setting (the command line design). An option
# that was renamed, merged into a key=value option, or turned into a subcommand is deleted: a
# command line that still writes it must fail, and say that the option is unknown. These cases
# hold the negative side of each deletion -- without them, "deleted" and "still there but never
# read" look the same from the outside.

[[tests]]
name = "removed.error_format"
desc = "`--error-format` is gone: the diagnostics format is `--diag-format`, in every command."
kind = "negative"
case = "../../../cases/compile/check/clean.cml"
args = ["--error-format", "short", "${case}"]
expect_exit = 1
expect_stderr_contains = ["unknown option '--error-format'"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

