[[tests]]
name = "arrangeable_families.tensors_and_loops"
desc = "The program `facts.plan.toml` reads: two loops (a `for` over a constant array, a `while`), a conversion, a reduction, an effect. It is the batch's control and the sharpest reading of the `loop` family: both loops carry an order inside (an effect in the body, a GATE at the exit), so both readers keep them and all 40 nodes agree. A `loop` row that turned free here would be a loop whose body stopped carrying its order."
kind = "behavior"
case = "../../../cases/facts/tensors_and_loops.cml"
args = ["${case}", "test::facts_compare"]

expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const rows = (prefix) => out.split('\n').filter(l => l.startsWith(prefix))
const fam = rows('FACTS_COMPARE readers_family ')
const draft = rows('FACTS_COMPARE draft_readers_family ')
const line = out.split('\n').find(l => l.startsWith('FACTS_COMPARE kind=core.arrangeable readers '))
const draftLine = out.split('\n').find(l => l.startsWith('FACTS_COMPARE kind=core.arrangeable draft '))
assert(line && draftLine, 'no readers or draft line')
const num = (t, n) => { const m = t.match(new RegExp(n + '=([0-9]+)')); assert(m, `${n} is missing from: ${t}`); return Number(m[1]) }
const loop = fam.find(l => l.includes(' family=loop '))
assert(loop, `the program holds two loops and there is no loop row: ${fam.join(' ; ')}`)
assert(num(loop, 'nodes') === 2 && num(loop, 'both_kept') === 2, `a loop that carries an order went free: ${loop}`)
assert(num(line, 'no_fact') === 0, `a node got no answer from the kind: ${line}`)
assert(num(line, 'diff') === 0 && num(draftLine, 'diff') === 0,
    `readers: ${line} || draft: ${draftLine} || frozen families: ${fam.join(' ; ')}`)
}
"""
timeout_ms = 30000