# The per-family reading of the arrangeable question (`test::facts_compare`, src/stdlib/test/
# facts_compare.h, the `answers_family` and `answers_kind` lines).
#
# What this file measures is `core.arrangeable`'s own answer, cut by the family it comes from. The
# total says how many nodes a pass may arrange anywhere; the rows say *which term* of design principles
# 3.4 refused the rest, and that is the reading a change to the fact has to move deliberately and not
# by accident: a row that moves here is a behaviour change, not a refactor.
#
# The batch is seven programs. `arm_loops.cml` carries every family at once; the other six carry one
# each in a plainer setting, so a row that moves in the batch can be narrowed down to a row that moves
# in a program built for it.
#
# The rows are the store's answers and not a derivation of them: `core.arrangeable` is a class (ii)
# kind of scope Node in the fact layer (`docs/design/op-semantics/README.cn.md`, 10.1: a derivable
# answer's place is the store, under a stamp; `docs/technical/40_graph_facts.md`, 2: the kind roster).
# What this file reads is therefore the answer a pass gets, cut by the family of the node that gave it.

[[tests]]
name = "arrangeable_families.loops_and_branches"
desc = "The whole table at once, on the program that carries every family: 210 nodes, and the eight family rows that cover them. `brch` 11 with 5 kept is the branch whose arm carries an exit GATE -- the branch is then a statement on the chain its arm runs on, and a pass that moved it would move the order it holds (3.4). `loop` 11 with 7 free is the other side of the same principle: a bounded `for` over a body that cannot fault and reaches nothing is known to end, so 3.4 tells nothing a pass may not move about, while the 4 kept ones carry their order inside them. `oper_may_fault` 17 kept and `oper_no_record` 1 free are the operator record read for what it states: a division may fault where it is written, and a FILL names no operator, so the fact answers it by the operation the node performs. `value` 132, `oper` 20, `call` 17 and `gate` 1 are the four other families, and the rows add up to the total. The draft answers the same 210 nodes the same way, so this is a reading of the model and not of one representation of it."
kind = "behavior"
case = "../../../cases/loops/arm_loops.cml"
args = ["${case}", "test::facts_compare"]

expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const rows = (prefix) => out.split('\n').filter(l => l.startsWith(prefix))
const fam = rows('FACTS_COMPARE answers_family ')
const line = out.split('\n').find(l => l.startsWith('FACTS_COMPARE kind=core.arrangeable answers '))
const draftLine = out.split('\n').find(l => l.startsWith('FACTS_COMPARE kind=core.arrangeable draft '))
assert(line && draftLine, 'no answers or draft line')
const num = (t, n) => { const m = t.match(new RegExp(n + '=([0-9]+)')); assert(m, `${n} is missing from: ${t}`); return Number(m[1]) }
// family: [nodes, free, kept]
const want = {
    value: [132, 132, 0],
    oper: [20, 20, 0],
    oper_may_fault: [17, 0, 17],
    oper_no_record: [1, 1, 0],
    call: [17, 0, 17],
    brch: [11, 6, 5],
    loop: [11, 7, 4],
    gate: [1, 0, 1],
}
const cols = ['nodes', 'free', 'kept']
for (const [name, expected] of Object.entries(want)) {
    const row = fam.find(l => l.includes(` family=${name} `))
    assert(row, `no ${name} row: ${fam.join(' ; ')}`)
    expected.forEach((value, i) => {
        assert(num(row, cols[i]) === value,
            `${name}.${cols[i]} is ${num(row, cols[i])}, the measured reading is ${value}: ${row}`)
    })
}
// The rows are the whole program: an extra family row, or a node the table lost, is a red rather than
// a row nobody reads.
assert(fam.length === Object.keys(want).length, `the table carries a family this case does not pin: ${fam.join(' ; ')}`)
assert(fam.reduce((acc, l) => acc + num(l, 'nodes'), 0) === num(line, 'nodes'),
    `the family rows do not cover the nodes: ${fam.join(' ; ')}`)
assert(num(line, 'nodes') === 210, `the program's node count moved: ${line}`)
assert(num(line, 'no_fact') === 0, `a node got no answer from the kind at all: ${line}`)
assert(num(line, 'free') === 166 && num(line, 'kept') === 44,
    `the two answers no longer split the program the way the rows do: ${line}`)
// The two rows the batch exists for, by name: the branch whose arm holds an order, and the bounded
// loop over a pure body.
const brch = fam.find(l => l.includes(' family=brch '))
assert(num(brch, 'kept') === 5, `the branch whose arm carries an exit GATE is not kept: ${brch}`)
const loop = fam.find(l => l.includes(' family=loop '))
assert(num(loop, 'free') === 7, `a bounded loop over a pure body is not free: ${loop}`)
// The draft answers the same families the same way: the graph an editing session holds is the one the
// freeze and the passes ask, so a count that holds on the frozen side alone is a fact of one
// representation and not of the model.
assert(num(draftLine, 'no_store') === 0, `a draft got no store from the framework: ${draftLine}`)
assert(num(draftLine, 'no_fact') === 0, `a node of a draft got no answer: ${draftLine}`)
assert(num(draftLine, 'diff') === 0, `the draft and the frozen graph answer a node differently: ${draftLine}`)
assert(num(draftLine, 'same') === num(draftLine, 'nodes'), 'the draft was not answered node for node')
assert(num(draftLine, 'nodes') === num(line, 'nodes'), 'the draft and the frozen graph hold different nodes')
}
"""
timeout_ms = 30000

[[tests]]
name = "arrangeable_families.calls"
desc = "A `sync` block whose first statement is a call of a pure function that cannot fault (`pure_call_first.cml`, the counterexample the chain case is built on). The call family in its plainest form: 2 CALL nodes, both kept. A call is an anchor that may be an effect and the body it runs is another graph's content, so the fact answers no rather than reading a body it does not have -- and the call row says it with nodes named, not only with a count."
kind = "behavior"
case = "../../../cases/compile/chain/pure_call_first.cml"
args = ["${case}", "test::facts_compare"]

expect_exit = 6
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const rows = (prefix) => out.split('\n').filter(l => l.startsWith(prefix))
const fam = rows('FACTS_COMPARE answers_family ')
const line = out.split('\n').find(l => l.startsWith('FACTS_COMPARE kind=core.arrangeable answers '))
assert(line, 'no answers line')
const num = (t, n) => { const m = t.match(new RegExp(n + '=([0-9]+)')); assert(m, `${n} is missing from: ${t}`); return Number(m[1]) }
const call = fam.find(l => l.includes(' family=call '))
assert(call, `the program calls a function twice and there is no call row: ${fam.join(' ; ')}`)
assert(num(call, 'nodes') === 2 && num(call, 'free') === 0 && num(call, 'kept') === 2,
    `a call was answered freely arrangeable: ${call}`)
assert(num(line, 'no_fact') === 0, `a node got no answer from the kind: ${line}`)
assert(fam.reduce((acc, l) => acc + num(l, 'nodes'), 0) === num(line, 'nodes'),
    `the family rows do not cover the nodes: ${fam.join(' ; ')}`)
}
"""
timeout_ms = 30000

[[tests]]
name = "arrangeable_families.a_faulting_callee"
desc = "The same shape with a callee that divides (`fault_call_first.cml`): the call family beside the `oper_may_fault` family, the division inside the callee's own body. A division may fault where it is written, so design principles 3.4 keeps it there -- the fault term is the one that decides, and it decides before the purity a pass could otherwise act on. Both operators are kept, the call with them, and the two rows together are the reading that says a callee that cannot fault is kept for the call and not for the fault."
kind = "behavior"
case = "../../../cases/compile/chain/fault_call_first.cml"
args = ["${case}", "test::facts_compare"]

expect_exit = 50
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const rows = (prefix) => out.split('\n').filter(l => l.startsWith(prefix))
const fam = rows('FACTS_COMPARE answers_family ')
const line = out.split('\n').find(l => l.startsWith('FACTS_COMPARE kind=core.arrangeable answers '))
assert(line, 'no answers line')
const num = (t, n) => { const m = t.match(new RegExp(n + '=([0-9]+)')); assert(m, `${n} is missing from: ${t}`); return Number(m[1]) }
const fault = fam.find(l => l.includes(' family=oper_may_fault '))
const call = fam.find(l => l.includes(' family=call '))
assert(fault, `a division is in the program and there is no oper_may_fault row: ${fam.join(' ; ')}`)
assert(num(fault, 'nodes') === 2 && num(fault, 'free') === 0 && num(fault, 'kept') === 2,
    `an operator that may fault was answered freely arrangeable: ${fault}`)
assert(call && num(call, 'kept') === 2 && num(call, 'free') === 0, `a call was answered freely arrangeable: ${call}`)
assert(num(line, 'no_fact') === 0, `a node got no answer from the kind: ${line}`)
assert(fam.reduce((acc, l) => acc + num(l, 'nodes'), 0) === num(line, 'nodes'),
    `the family rows do not cover the nodes: ${fam.join(' ; ')}`)
}
"""
timeout_ms = 30000

[[tests]]
name = "arrangeable_families.gates"
desc = "A function body whose exit GATE carries its order in the values it reads rather than in a wait edge (`a_body_exit_gate_reads_its_writes.cml`): the third of the three forms an order is written in, and the one a wait edge does not name. The gate family: one node, kept. Its four terms are all true and the fact still answers no, because the order a gate stands in is not a term a placement decision may ignore (3.4) -- and the value nodes beside it, computed from what they read, are free in the same run."
kind = "behavior"
case = "../../../cases/facts/a_body_exit_gate_reads_its_writes.cml"
args = ["${case}", "test::facts_compare"]

expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const rows = (prefix) => out.split('\n').filter(l => l.startsWith(prefix))
const fam = rows('FACTS_COMPARE answers_family ')
const line = out.split('\n').find(l => l.startsWith('FACTS_COMPARE kind=core.arrangeable answers '))
assert(line, 'no answers line')
const num = (t, n) => { const m = t.match(new RegExp(n + '=([0-9]+)')); assert(m, `${n} is missing from: ${t}`); return Number(m[1]) }
const gate = fam.find(l => l.includes(' family=gate '))
assert(gate, `the program carries a GATE and there is no gate row: ${fam.join(' ; ')}`)
assert(num(gate, 'nodes') === 1 && num(gate, 'kept') === 1 && num(gate, 'free') === 0,
    `the gate is not refused: ${gate}`)
assert(num(line, 'no_fact') === 0, `a node got no answer from the kind: ${line}`)
assert(fam.reduce((acc, l) => acc + num(l, 'nodes'), 0) === num(line, 'nodes'),
    `the family rows do not cover the nodes: ${fam.join(' ; ')}`)
}
"""
timeout_ms = 30000

[[tests]]
name = "arrangeable_families.branch_and_effect"
desc = "A function that branches over a value of its own and then prints (`branch_and_print.cml`). Here the branch's arms carry no exit GATE, so the branch is a value neither side keeps: 1 BRCH node, free. That is what makes the `brch` row of `arm_loops` readable as a fact about the arm and not about branches in general: the same kind is free where the arms hold no order and kept where one of them does."
kind = "behavior"
case = "../../../cases/opt/commit_checks/branch_and_print.cml"
args = ["${case}", "test::facts_compare"]

