[[tests]]
name = "arrangeable_families.tensors_and_loops"
desc = "The program `facts.plan.toml` reads: two loops (a `for` over a constant array, a `while`), a conversion, a reduction, an effect. It is the batch's control for the loop family: both loops carry their order inside them -- the `while` reads its condition again on every pass -- so both are kept, where `arm_loops` has seven bounded loops the same fact calls free. The two programs are the two directions of one term, on two programs rather than on two rows of one."
kind = "behavior"
case = "../../../cases/facts/tensors_and_loops.cml"
args = ["${case}", "test::facts_compare"]

expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const rows = (prefix) => out.split('\n').filter(l => l.startsWith(prefix))
