[[tests]]
name = "arrangeable_families.a_gradient_value"
desc = "A program that makes a gradient value and keeps it (`a_gradient_value.cml`): `grad(square)` is not expanded, because this program names no `std::macro`, so the gradient is one operator node rather than an expanded body. The rows this case pins are the two sides of the operator record: `autodiff:grad` is registered from C++ with `pure`, `readsGraphs` and `macro` and states no fault table, and a registration that states none is read as *may fault* (`operator_semantics.h`: `mayFault()` is `!faults || !faults->empty()`), so its node is `oper_may_fault` and is kept; the exit GATE of the body is kept as well. The count is the reading: a gradient a pass flattened would answer free here, and 3.4 says it may not be moved until its body has been expanded."
kind = "behavior"
case = "../../../cases/facts/a_gradient_value.cml"
args = ["${case}", "test::facts_compare"]

expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const rows = (prefix) => out.split('\n').filter(l => l.startsWith(prefix))
const fam = rows('FACTS_COMPARE answers_family ')
const line = out.split('\n').find(l => l.startsWith('FACTS_COMPARE kind=core.arrangeable answers '))
assert(line, 'no answers line')
const num = (t, n) => { const m = t.match(new RegExp(n + '=([0-9]+)')); assert(m, `${n} is missing from: ${t}`); return Number(m[1]) }
const fault = fam.find(l => l.includes(' family=oper_may_fault '))
assert(fault, `the gradient operator states no fault table and there is no oper_may_fault row: ${fam.join(' ; ')}`)
assert(num(fault, 'nodes') === 2 && num(fault, 'free') === 0 && num(fault, 'kept') === 2,
    `an operator that may fault was answered freely arrangeable: ${fault}`)
const gate = fam.find(l => l.includes(' family=gate '))
assert(gate && num(gate, 'nodes') === 1 && num(gate, 'kept') === 1, `the gate is not refused: ${gate}`)
assert(num(line, 'no_fact') === 0, `a node got no answer from the kind: ${line}`)
assert(fam.reduce((acc, l) => acc + num(l, 'nodes'), 0) === num(line, 'nodes'),
    `the family rows do not cover the nodes: ${fam.join(' ; ')}`)
}
"""
timeout_ms = 30000