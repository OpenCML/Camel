# The per-family reading of the arrangeable question (`test::facts_compare`, src/stdlib/test/
# facts_compare.h, the `readers_family` and `draft_readers_family` lines).
#
# Why a second plan and not one more entry in `facts.plan.toml`: that file pins answers the tree must
# not move (`diff = 0`). The lanes that settled the gate and the call (`plain-gate-2`, `node-roles-
# facts`, `facts-draft`) made the older predicate and the fact answer the same thing, so those cases
# measure agreement. This file measures the families where they still disagree, and pins the counts
# that a lane removing the second implementation has to move to zero: design principles 3.4 decides
# which side is right, and the counts are what that judgement is made against. A movement here is a
# behaviour change, not a refactor.
#
# The batch is six programs. `arm_loops.cml` carries every form of the two families that disagree on
# principle; the other five carry one family each in a plainer setting, and they all agree today.

[[tests]]
name = "arrangeable_families.loops_and_branches"
desc = "The one program in the batch whose answers still differ: 210 nodes, 13 of them answered one way by the older predicate and the other by the fact. The rows pin the disagreement per family -- `brch` 5 nodes the fact refuses and the predicate called free (the branch's arm carries an exit GATE, so the branch is a statement on the chain), `loop` 7 nodes the fact calls free and the predicate refused (a bounded `for` over a pure body is known to end), and `oper_no_record` 1 node (a FILL, whose operator the view cannot name, so the fact has no four terms to read and refuses where the predicate answered free). Both readers agree on all 132 values, all 20 operators, all 17 operators that may fault, all 17 calls and the one gate. The draft measures the same 210 nodes with the same counts, so the disagreement is not a representation artefact."
kind = "behavior"
case = "../../../cases/loops/arm_loops.cml"
args = ["${case}", "test::facts_compare"]

expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const rows = (prefix) => out.split('\n').filter(l => l.startsWith(prefix))
const fam = rows('FACTS_COMPARE readers_family ')
const draft = rows('FACTS_COMPARE draft_readers_family ')
const line = out.split('\n').find(l => l.startsWith('FACTS_COMPARE kind=core.arrangeable readers '))
const draftLine = out.split('\n').find(l => l.startsWith('FACTS_COMPARE kind=core.arrangeable draft '))
assert(line && draftLine, 'no readers or draft line')
const num = (t, n) => { const m = t.match(new RegExp(n + '=([0-9]+)')); assert(m, `${n} is missing from: ${t}`); return Number(m[1]) }
// family: [nodes, both_free, both_kept, kind_free_pred_kept, kind_kept_pred_free]
const want = {
    value: [132, 132, 0, 0, 0],
    oper: [20, 20, 0, 0, 0],
    oper_may_fault: [17, 0, 17, 0, 0],
    oper_no_record: [1, 0, 0, 0, 1],
    call: [17, 0, 17, 0, 0],
    brch: [11, 6, 0, 0, 5],
    loop: [11, 0, 4, 7, 0],
    gate: [1, 0, 1, 0, 0],
}
const cols = ['nodes', 'both_free', 'both_kept', 'kind_free_pred_kept', 'kind_kept_pred_free']
for (const [name, expected] of Object.entries(want)) {
    const row = fam.find(l => l.includes(` family=${name} `))
    assert(row, `no ${name} row: ${fam.join(' ; ')}`)
    expected.forEach((value, i) => {
        assert(num(row, cols[i]) === value,
            `${name}.${cols[i]} is ${num(row, cols[i])}, the measured reading is ${value}: ${row}`)
    })
}
assert(fam.reduce((acc, l) => acc + num(l, 'nodes'), 0) === num(line, 'nodes'),
    `the family rows do not cover the nodes: ${fam.join(' ; ')}`)
assert(draft.reduce((acc, l) => acc + num(l, 'nodes'), 0) === num(draftLine, 'nodes'),
    `the draft family rows do not cover the nodes: ${draft.join(' ; ')}`)
assert(num(line, 'diff') === 13, `the frozen disagreement moved: ${line} || ${fam.join(' ; ')}`)
assert(num(draftLine, 'shape_diff') === 0,
    `asking a draft by shape answers differently from asking it plain: ${draftLine}`)
assert(num(line, 'no_fact') === 0, `a node got no answer from the kind at all: ${line}`)
}
"""
timeout_ms = 30000

[[tests]]
name = "arrangeable_families.calls"
desc = "A `sync` block whose first statement is a call of a pure function that cannot fault (`pure_call_first.cml`, the counterexample the chain case is built on). The call family in its plainest form: 2 CALL nodes, both kept by both readers. A call is an anchor that may be an effect and the body it runs is another graph's content, so no reader calls it freely arrangeable -- and the fact says so by declining rather than by reading a body it does not have."
kind = "behavior"
case = "../../../cases/compile/chain/pure_call_first.cml"
args = ["${case}", "test::facts_compare"]

expect_exit = 6
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const rows = (prefix) => out.split('\n').filter(l => l.startsWith(prefix))
const fam = rows('FACTS_COMPARE readers_family ')
const draft = rows('FACTS_COMPARE draft_readers_family ')
const line = out.split('\n').find(l => l.startsWith('FACTS_COMPARE kind=core.arrangeable readers '))
const draftLine = out.split('\n').find(l => l.startsWith('FACTS_COMPARE kind=core.arrangeable draft '))
assert(line && draftLine, 'no readers or draft line')
const num = (t, n) => { const m = t.match(new RegExp(n + '=([0-9]+)')); assert(m, `${n} is missing from: ${t}`); return Number(m[1]) }
const call = fam.find(l => l.includes(' family=call '))
assert(call, `the program calls a function twice and there is no call row: ${fam.join(' ; ')}`)
assert(num(call, 'nodes') === 2 && num(call, 'both_kept') === 2, `a call was called arrangeable: ${call}`)
assert(num(line, 'diff') === 0 && num(draftLine, 'diff') === 0,
    `readers: ${line} || draft: ${draftLine} || frozen families: ${fam.join(' ; ')}`)
}
"""
timeout_ms = 30000

[[tests]]
name = "arrangeable_families.a_faulting_callee"
desc = "The same shape with a callee that divides (`fault_call_first.cml`): the call family beside the `oper_may_fault` family, the division inside the callee's own body. A division may fault where it is written, so design principles 3.4 keeps it there; both readers keep it, and the call with it."
kind = "behavior"
case = "../../../cases/compile/chain/fault_call_first.cml"
args = ["${case}", "test::facts_compare"]

expect_exit = 50
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const rows = (prefix) => out.split('\n').filter(l => l.startsWith(prefix))
const fam = rows('FACTS_COMPARE readers_family ')
const draft = rows('FACTS_COMPARE draft_readers_family ')
const line = out.split('\n').find(l => l.startsWith('FACTS_COMPARE kind=core.arrangeable readers '))
const draftLine = out.split('\n').find(l => l.startsWith('FACTS_COMPARE kind=core.arrangeable draft '))
assert(line && draftLine, 'no readers or draft line')
const num = (t, n) => { const m = t.match(new RegExp(n + '=([0-9]+)')); assert(m, `${n} is missing from: ${t}`); return Number(m[1]) }
const fault = fam.find(l => l.includes(' family=oper_may_fault '))
const call = fam.find(l => l.includes(' family=call '))
assert(fault, `a division is in the program and there is no oper_may_fault row: ${fam.join(' ; ')}`)
assert(num(fault, 'nodes') === 2 && num(fault, 'both_kept') === 2,
    `an operator that may fault was called freely arrangeable: ${fault}`)
assert(call && num(call, 'both_kept') === 2, `a call was called arrangeable: ${call}`)
assert(num(line, 'diff') === 0 && num(draftLine, 'diff') === 0,
    `readers: ${line} || draft: ${draftLine} || frozen families: ${fam.join(' ; ')}`)
}
"""
timeout_ms = 30000

[[tests]]
name = "arrangeable_families.gates"
desc = "A function body whose exit GATE carries its order in the values it reads rather than in a wait edge (`a_body_exit_gate_reads_its_writes.cml`): the gate family, the one the kind was already bent to agree about (D-1124-65). Both readers refuse the gate, and it stays one node after the second implementation is gone."
kind = "behavior"
case = "../../../cases/facts/a_body_exit_gate_reads_its_writes.cml"
args = ["${case}", "test::facts_compare"]

expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const rows = (prefix) => out.split('\n').filter(l => l.startsWith(prefix))
const fam = rows('FACTS_COMPARE readers_family ')
const draft = rows('FACTS_COMPARE draft_readers_family ')
const line = out.split('\n').find(l => l.startsWith('FACTS_COMPARE kind=core.arrangeable readers '))
const draftLine = out.split('\n').find(l => l.startsWith('FACTS_COMPARE kind=core.arrangeable draft '))
assert(line && draftLine, 'no readers or draft line')
const num = (t, n) => { const m = t.match(new RegExp(n + '=([0-9]+)')); assert(m, `${n} is missing from: ${t}`); return Number(m[1]) }
const gate = fam.find(l => l.includes(' family=gate '))
assert(gate, `the program carries a GATE and there is no gate row: ${fam.join(' ; ')}`)
assert(num(gate, 'nodes') === 1 && num(gate, 'both_kept') === 1, `the gate is not refused by both readers: ${gate}`)
assert(num(line, 'diff') === 0 && num(draftLine, 'diff') === 0,
    `readers: ${line} || draft: ${draftLine} || frozen families: ${fam.join(' ; ')}`)
}
"""
timeout_ms = 30000

[[tests]]
name = "arrangeable_families.branch_and_effect"
desc = "A function that branches over a value of its own and then prints (`branch_and_print.cml`). Here the branch's arms carry no exit GATE, so the branch is a value neither reader keeps: 1 BRCH node, both readers free, and all 17 nodes of the program agree. The rows beside it are what makes the `brch` disagreement in `arm_loops` readable as a fact about the arm rather than about branches in general."
kind = "behavior"
case = "../../../cases/opt/commit_checks/branch_and_print.cml"
args = ["${case}", "test::facts_compare"]

expect_exit = 44
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const rows = (prefix) => out.split('\n').filter(l => l.startsWith(prefix))
const fam = rows('FACTS_COMPARE readers_family ')
