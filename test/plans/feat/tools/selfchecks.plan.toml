# `test/tools/pwsh-selfcheck.mjs` exists: `case` names the self-check (so the ledger and a reader see
# the file the entry is about), `args` hands the runner the bridge and the absolute path, and
# `skip_unless` asks the bridge whether there is a pwsh at all. `expect_stdout_contains` asserts the
# summary line the file prints, so an entry cannot stay green over a file that printed nothing.

