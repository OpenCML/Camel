# Slow: 3.0 s, and it is the one file in this plan that is red today. Run over `-BashHost <host>`
# (the invocation `internal/tools/README.md` documents, because this machine's `bash` is WSL and
# cannot read a Windows path) it prints `44 checks, 2 failed`: `a process inside it is named` and
# `the bash guard exited 0`. The sweep keeps the fixture's `probe-f` and never prints
# `camel-remote.ps1`'s `a process is using it` line for it. Reproduced twice on 2026-11-25 while the
# host carried eleven other runs (1m load 28-32), so it is not the loaded-host flake the harness's
# own comment at line 240 describes: that one fails the check by the sweep finding nothing, not by
# the sweep keeping the tree without a reason. Pinning 44 and `0 failed` is the point -- this entry
# goes red and names the file on the first host that has a pwsh, which is what should happen. The
# count is not written as `20` (the part-B-skipped reading) and not as `2 failed`
# (`known_fail` in another spelling).
[[tests]]
name = "selfchecks.camel_remote_cleanup"
desc = "`internal/tools/camel-remote-cleanup.test.ps1`: a reading that failed removes nothing at all, and a live, locked, fresh, unrecorded or foreign checkout is kept and named -- the sweep that deleted two live lane checkouts on 2026-11-17 (44 checks; part B is red today, see the comment above)."
kind = "behavior"
tier = "slow"
tool = "node"
case = "../../../../internal/tools/camel-remote-cleanup.test.ps1"
args = ["test/tools/pwsh-selfcheck.mjs", "${case}"]
skip_unless = ["node", "test/tools/pwsh-selfcheck.mjs", "--probe"]
expect_exit = 0
expect_stdout_contains = ["44 checks, 0 failed"]
normalizers = ["normalize_newlines"]
timeout_ms = 300000

# Slow: 3.0 s over `-BashHost <host>` (three sweeps of a seven-candidate fixture). The number that
# matters here is the one its first part-B check prints: `readlink` calls for one sweep over seven
# candidates, **0** with the snapshot and **17 231** on the guard this replaces, which resolved two
# links per host process per candidate -- measured 2026-11-25 at ~1780 processes: 7.0 s per candidate,
# 290 s for the 40-candidate sweep a remote run pays before it starts, and a reading minutes old by
# the time the last candidate was judged. Part A needs a `pwsh` and part B a bash, so a run with no
# bash prints `21 checks, 0 failed, 18 skipped`; the count below is the one both readings contain,
# and the skipped checks are counted rather than dropped, because a part that silently does not run
# cannot be told from one that ran green.
[[tests]]
name = "selfchecks.camel_remote_cleanup_sweep_cost"
desc = "`internal/tools/camel-remote-cleanup-sweep-cost.test.ps1`: the host sweep's \"is any process inside this checkout\" reading is one /proc snapshot per sweep -- 0 per-process `readlink` forks, one `ls` for seven candidates and one for four, while a process in the cwd, in a subdirectory and in the executable is still named, `cand-1`'s process does not reach `cand-10`, a process that has exited stops being named, and a process list that could not be read keeps the checkout instead of reading as unused (21 checks)."
kind = "behavior"
tier = "slow"
tool = "node"
case = "../../../../internal/tools/camel-remote-cleanup-sweep-cost.test.ps1"
args = ["test/tools/pwsh-selfcheck.mjs", "${case}"]
skip_unless = ["node", "test/tools/pwsh-selfcheck.mjs", "--probe"]
expect_exit = 0
expect_stdout_contains = ["21 checks, 0 failed"]
normalizers = ["normalize_newlines"]
timeout_ms = 300000

