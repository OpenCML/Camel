id = "tools.selfchecks"
order = 919
tags = ["feat", "tools", "selfcheck"]
desc = "The tooling's own tests: every self-check under test/tools, internal/tools and scripts is started by this plan, and the ones a gate host cannot start skip with the reason on the line"

# A self-check that no plan starts cannot fail: a change to the tool it covers is read by nobody,
# and the file stays green by being unread. `scripts/plan-inventory.mjs#selfCheckProblems` is the
# ledger (it reds when a new `*.test.mjs` lands with no plan entry and no recorded reason); this
# plan is now the destination for every one of them, and the ledger's exception list is empty.
#
# Two classes, and the second is why this file is longer than its subject:
#
#   * the `*.test.mjs` and `--self-test` entries below are started by the runner directly;
#   * the `internal/tools/*.test.ps1` are started through `test/tools/pwsh-selfcheck.mjs`,
#     because a plan entry has no way to name `pwsh`: `tool = "pwsh"` resolves through the runner's
#     `toolExecutable` to `<install>/bin/pwsh`, a file no build produces, so the entry would fail
#     before the script ran, and a `.ps1` is not a file the runner can execute as its `case`. That
#     bridge runs the script with its exit code and output passed through; its other mode is the
#     entry's `skip_unless`, and it is also why these entries carry `case` = the self-check and the
#     bridge in `args` -- the name the ledger has to see is the file the entry is about.
#
# The gate host has no PowerShell: measured on the Linux build host, `uname -s` says
# `Linux` and `command -v pwsh` prints nothing (it prints `/usr/bin/node` and `/usr/bin/git` for the
# other two). So on today's gate these **skip**, and a skip is neither a pass nor a red:
# `[SUMMARY]` counts it on its own line and the reason names the host. They run for real on a host
# that has a pwsh, and nothing here has to change for that to happen. `camel-cleanup.test.ps1` and
# `camel-remote-cleanup.test.ps1` also take `-BashHost` on a machine whose `bash` cannot read a
# Windows path; on a Linux host their bash half runs with no flag, so no entry passes one.
#
# The layer each one is in is its measured wall clock, by the rule `docs/test-plans.md` uses for the
# 261 cases that moved out of the fast layer: over 2 s is `tier = "slow"`. The times in the comments
# below were read on the workstation -- the only machine with a pwsh -- one run each,
# warm, and they are that machine's numbers and not the host's.
#
# Nothing here needs a compiler or an install: these are the checks a tool of the tree runs on
# itself, and they fail by exiting non-zero after printing their own count. No entry pins how many
# checks a file has: that number is the file's own business and changes whenever a check is added, so
# a pinned one goes red for a reason that says nothing about the tool. The entries assert that the
# file printed its summary line and that nothing failed.

[[tests]]
name = "selfchecks.reading_normal"
desc = "Both directions of `normalizeReading`: under-normalising makes every comparison say changed, over-normalising makes two different failures one string. The file asserts its three cases and exits non-zero when either direction regresses."
kind = "behavior"
tool = "node"
case = "../../../../test/tools/reading-normal.test.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = [" fail 0"]
normalizers = ["normalize_newlines"]
timeout_ms = 120000

[[tests]]
name = "selfchecks.selection_docs_only"
desc = "A change that is only backlog rows and dated plan pages selects feat/docs_links and not the fast layer under another name, and no file of the change is left unmatched."
kind = "behavior"
tool = "node"
case = "../../../../test/tools/selection-docs-only.test.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = [" fail 0"]
normalizers = ["normalize_newlines"]
timeout_ms = 120000

# The one slow entry: it copies `test/tools` and starts the engine and the runner several times,
# which is 5.6 s of the host's wall clock at `-Jobs 8` (18 s on the workstation). It carries its own
# tier line rather than the plan's, because the nine above it are seconds long and this one is not.
[[tests]]
name = "selfchecks.selection_cases"
desc = "The record a change writes and the run that reads it agree on what a case is: a recorded case is read by its name, a record lists the run's own targets, a layer and the run of it count the same cases, a change record cannot narrow a layer run, a zero-row run exits 2, and a change no rule matches selects nothing. The rule-less file is found by asking the engine, not by trusting the name of a directory."
kind = "behavior"
tier = "slow"
tool = "node"
case = "../../../../test/tools/selftest/selection-cases.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["selection-cases self-test ok"]
normalizers = ["normalize_newlines"]
timeout_ms = 240000

