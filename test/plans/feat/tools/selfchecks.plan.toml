kind = "behavior"
tool = "node"
case = "../../../../scripts/count-graph-readers.mjs"
args = ["${case}", "--self-test"]
expect_exit = 0
expect_stdout_contains = [" checks passed"]
normalizers = ["normalize_newlines"]
timeout_ms = 120000

# --- the PowerShell self-checks --------------------------------------------------------
