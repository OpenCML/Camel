# push to the project's remote -- by URL or under any remote name -- is refused for a trace its added
# lines carry (a date of any year, a bare commit hash), a hex constant is not a trace, a trace the tree
# already held is not charged to the push, and a push that only deletes a ref runs no checker.
[[tests]]
name = "selfchecks.push_trace_range"
desc = "`test/tools/push-trace-range.test.mjs`: the pre-push hook judges a push to the project's remote on the lines it adds, whether the push names the URL or a remote called gh or origin, catches a date of any year and a bare hash that names a commit, leaves a hex constant and a trace already in the tree alone, and runs no checker for a push that only deletes."
kind = "behavior"
tool = "node"
case = "../../../../test/tools/push-trace-range.test.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["push-trace-range: ", " checks, 0 failed"]
normalizers = ["normalize_newlines"]
timeout_ms = 120000

# Fast: under 1 s. The coordinator's children counted by slot: the binding table's pure parts and the
# development-slot verdict of `lanes-below`, run without the host.
[[tests]]
name = "selfchecks.oversight_binding"
desc = "`test/tools/oversight-binding.test.mjs`: children are classified by the binding table (by id or by name, no row is buffer), counted per slot, rebinding replaces a row, a row whose child is gone stays visible as stale, and `lanes-below` fires at 7 development slots running with buffer children present and stays quiet at 8."
kind = "behavior"
tool = "node"
case = "../../../../test/tools/oversight-binding.test.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["oversight-binding: ", " checks, 0 failed"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000

# A case that exits non-zero with nothing said about the exit code is a red, and the red names the
# field that would have made it a reading. The three writings of the field -- a number, the word
# "script" for an entry whose verify script judges it, and nothing at all for the ordinary end of a
# process -- are pinned by the same file.
[[tests]]
name = "selfchecks.tool_exit"
desc = "`test/tools/run-tests.mjs` judges the exit code: an entry that says nothing about it expects 0, so a case that crashes is red and the red names the field; `expect_exit = 1` on a case that exits 1 is green; `expect_exit = ""script""` leaves the question to the verify script; a case file that is not there is not green."
kind = "behavior"
tier = "slow"
tool = "node"
case = "../../../../test/tools/tool-exit.test.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["tool-exit: ", " checks, 0 failed"]
normalizers = ["normalize_newlines"]
timeout_ms = 180000

[[tests]]
name = "selfchecks.entry_without_case"
desc = "An entry that names no `case` and fails is reported as that entry failing: the run prints its `[SUMMARY]`, the other entries keep their verdicts, and the exit code is non-zero, instead of the runner crashing while it resolves the case path."
kind = "behavior"
tier = "slow"
tool = "node"
case = "../../../../test/tools/entry-without-case.test.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["entry-without-case: ", " checks, 0 failed"]
normalizers = ["normalize_newlines"]
timeout_ms = 180000

# The host's token pool is a bash script over flock, so its self-test runs where flock exists (the
# build host) and is skipped elsewhere. The case file runs it through node so the plan needs no shell
# tool of its own.
[[tests]]
name = "selfchecks.host_tokens"
desc = "`internal/tools/host-tokens.sh self-test`: tokens are taken and given back per process, a crashed holder's tokens return to the pool, two takers that each want more than half the pool both finish one after the other, and the peak never exceeds the pool."
kind = "behavior"
tool = "node"
skip_unless = ["bash", "-c", "command -v flock"]
case = "../../../../test/cases/tools/host_tokens/selftest.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["selftest: ", " checks, 0 failed"]
normalizers = ["normalize_newlines"]
timeout_ms = 180000
