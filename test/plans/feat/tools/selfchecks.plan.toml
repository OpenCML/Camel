# matters here is the one its first part-B check prints: `readlink` calls for one sweep over seven
# candidates, **0** with the snapshot and **17 231** on the guard this replaces, which resolved two
# links per host process per candidate -- on a host of ~1780 processes: 7.0 s per candidate,
# 290 s for the 40-candidate sweep a remote run pays before it starts, and a reading minutes old by
# the time the last candidate was judged. Part A needs a `pwsh` and part B a bash with `flock`, so a run
# without one prints `21 checks, 0 failed, 18 skipped`; the skipped checks are counted rather than
# dropped, because a part that silently does not run cannot be told from one that ran green.
