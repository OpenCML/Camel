name = "selfchecks.merge_lane_resolved"
desc = "`internal/tools/merge-lane-resolved.test.ps1`: `-MergeCommit` -- the parents it asserts, the three shapes it refuses (first parent not origin, second parent not the lane, HEAD not the commit), and the regression that a run without it still asserts the old start point (10 checks)."
kind = "behavior"
tier = "slow"
tool = "node"
case = "../../../../internal/tools/merge-lane-resolved.test.ps1"
args = ["test/tools/pwsh-selfcheck.mjs", "${case}"]
skip_unless = ["node", "test/tools/pwsh-selfcheck.mjs", "--probe"]
expect_exit = 0
expect_stdout_contains = ["10 checks, 0 failed"]
normalizers = ["normalize_newlines"]
timeout_ms = 300000

