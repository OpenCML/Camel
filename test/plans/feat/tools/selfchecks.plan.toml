# Fast: 2 s. The develop-push reading, which is a different question from the per-merge one above
# (`selfchecks.merge_record`): a push to `develop` publishes a *tip*, and what has to hold is the
# promotion record of that tip -- the whole layer's counts, the comparison against the previous
# promotion case by case, and what its timeouts did when they were run alone. The last two checks
# start the real `scripts/hooks/pre-push`, because the wiring (which mode the hook calls, and the
# words it refuses in) is the half neither file shows alone: a hook still calling `verify` lets a
# develop push through, which the fixture with no record catches.
[[tests]]
name = "selfchecks.promotion_record"
desc = "`test/tools/promotion-record.test.mjs`: `merge-record.mjs verify-promotion` accepts a tip whose record sits above it and refuses the records that cannot answer which tip, which layer, what it was compared with or what its timeouts did; a tip this checkout does not carry is exit 2; and the real push hook refuses a develop push whose tip has no promotion record, in the words that name it (10 checks)."
kind = "behavior"
tool = "node"
case = "../../../../test/tools/promotion-record.test.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["promotion-record: 10 checks, 0 failed"]
normalizers = ["normalize_newlines"]
timeout_ms = 120000

# Fast: 3 s. A gate that never returns is ended at its limit together with the process it started:
# the fake gate sleeps 30 s and starts a child that does too, the run gets a 2 s limit, and what is
# read is the red line for that gate, the non-zero exit, and that neither process is left running.
[[tests]]
name = "selfchecks.gates_timeout"
desc = "`scripts/gates.test.mjs`: `scripts/gates.mjs` kills a gate that outlives its limit with the whole process tree it started, reports it on the gate's line as a failed gate that did not finish, and exits non-zero (6 checks)."
kind = "behavior"
tool = "node"
case = "../../../../scripts/gates.test.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["gates: 6 checks, 0 failed"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000
