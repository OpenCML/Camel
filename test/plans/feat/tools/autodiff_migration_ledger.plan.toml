id = "tools.autodiff_migration_ledger"
order = 918
tier = "fast"
tags = ["feat", "tools", "autodiff"]
desc = "The autodiff migration ledger compares this run with the last one recorded and holds one direction: every case the record names must still pass, and a fall names the case that fell. The record is the list of case paths that passed (`test/cases/tools/autodiff_migration_ledger/baseline.json`), not a count, because a count says how many fell and a list says which one; `--record` writes it and refuses to drop a name without `--force`. The six recorded numbers and the three classification columns are gone: they counted spellings in the case sources, a comment is not a spelling, a case that explained itself moved class with nothing rewritten, and whoever moves a reading also moves the target it is compared against. It is gated because a ruler nobody compares is a promise nobody keeps, and this tool is run by hand otherwise; the comparison is the whole point."

# The plan is named by `test/plan-selection.json` (`scripts/autodiff-migration-ledger.mjs`), which the
# runner self-test requires of every plan file: a plan no case path selects is a plan `--changed`
# never runs, and the self-test says so by name. That is how this file's first version was caught.
#
# What this test holds is the comparison, not the table: `--ledger-check` reads
# `test/cases/tools/autodiff_migration_ledger/baseline.json` and reds when a case the record names no
# longer passes. The record is written by `--record` on the build host and never by this plan, and a
# run that cannot start the binary is refused rather than compared against an unchanged record.
#
# The tool's per-case diagnostic column is a hint for a reader, and nothing compares it: a case passes
# on the exit code its own plan expects, so a wording that stops matching costs the hint and not the
# verdict. That reading is recorded by name in `test/tools/check-diagnostic-form-readers.mjs`.

[[tests]]
name = "tools.autodiff_migration_ledger.ratchet"
desc = "`--ledger-check` compares this run with the record case by case and says `ok` while every case the record names still passes; a case that fell is printed with its own `want` and `got`, so the red names the case and not only a number. The record is a run of one binary, so `pass=n/a` (no built tree) is refused rather than compared."
kind = "behavior"
tool = "node"
case = "../../../../scripts/autodiff-migration-ledger.mjs"
args = ["${case}", "--ledger-check"]
expect_exit = 0
expect_stdout_contains = ["[LEDGER-CHECK] ok: every case the record names still passes"]
# It runs alone: for the length of the run, `test/cases/modules/autodiff/` holds files that are not
# there before or after it (`<case>.ledger-probe.cml`, written and deleted per case), and two other
# checks walk that tree -- `plan-inventory.mjs`'s case ledger and `check-doc-links.mjs`'s citations --
# and reded on a file that vanished between their listing and their read when this test ran in
# parallel. The shared thing is the tree itself, so it takes every slot.
parallel = false
normalizers = ["normalize_newlines"]
timeout_ms = 900000