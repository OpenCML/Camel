id = "tools.facts_readers_sweep"
order = 919
# Slow layer: the sweep starts one `camel` per case the tree has -- 4123 of them, 40 s of wall clock
# at six at a time. A plan selected by a case path under test/cases must stay cheap, so the entry is
# its own plan and the case is the tool itself, a path under test/tools that no test/cases path owns.
tier = "slow"
tags = ["feat", "tools", "facts", "sweep"]
desc = "`test::facts_compare` read over every case the tree has: the corpus is swept, `core.arrangeable`'s answer at every node is counted per node kind and per family, and the older comparison with `runtime::nodeIsFreelySchedulable` is summed beside it, so the totals a report quotes can be produced again by one command"

# This is the instrument behind the readings the gate commits quote, and the corpus it reads. Those
# numbers belong to a tree and a binary, and they move whenever the compiler moves -- a node added
# anywhere moves `nodes` and `free` -- so a plan that asserted them would be red on every unrelated
# change, and one that asserted nothing would be decoration.
#
# What it asserts is the instrument's own health, the two figures that are a defect when they are
# not zero:
#
#   `silent=0`  every case the sweep did not read said why on its own stdout or stderr, and landed
#               in `skipped` with one of the two reasons the tool prints. A case that says nothing
#               is a program that did not reach the pass, and a corpus read with those leaving no
#               trace reads as coverage it does not have.
#   `no_fact=0` every node the walk printed had a fact to print. A node the fact layer refuses to
#               answer at is not a placement decision, so it cannot be folded into either column.
#
# The sweep reads every case but the `fixtures/` directories, which are other tools' inputs and not
# programs the corpus runs: one directory rule, and the number it left out is printed as `fixtures=`
# so the exclusion is visible. The program is never run -- the pipeline is
# `test::facts_compare std::nop` -- because a fact is read off the graph.
#
# The totals themselves are printed on `FACTS_READERS_SWEEP` and are the reading; this plan carries
# the command that produces them, which is what makes them re-weighable.
[[tests]]
name = "facts.readers_sweep"
desc = "Every `.cml` under `test/cases` is read through `test::facts_compare std::nop`, and the sweep prints `FACTS_READERS_SWEEP cases=4123 read=… skipped=… silent=0 nodes=… free=… kept=… no_fact=0 kinds=8 fixtures=24 …` beside one `FACTS_READERS_KIND` line per node kind, one `FACTS_READERS_FAMILY` line per family the tree answered in, and one `FACTS_READERS_SKIP` line per case it could not read, naming which of the two reasons it was; `silent=0` and `no_fact=0` say the reading covers the corpus it claims, and a kind the sweep does not know is printed rather than dropped."
kind = "behavior"
tool = "node"
case = "../../../tools/probe-facts-readers.mjs"
args = ["${case}", "--jobs", "6"]
expect_exit = 0
expect_stdout_contains = ["FACTS_READERS_SWEEP cases=", "silent=0", "no_fact=0"]
normalizers = ["strip_ansi", "normalize_newlines"]
# The sweep's cost is the coverage -- one `camel` per case the tree has -- so the way to a smaller
# bound is fewer cases, which is the reading doing less. The run that named the current numbers spent
# 40 s of wall clock at six workers; 1400 s is a bound on a hang, not on the work.
timeout_ms = 1400000