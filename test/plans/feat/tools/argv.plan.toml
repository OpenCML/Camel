id = "tools.argv"
order = 918
tier = "fast"
tags = ["feat", "tools", "argv"]
desc = "An option this tree does not know, a missing install and an empty selection are three different refusals: each prints its own sentence, and none of the three prints another's"

# On 2026-11-24 the host called `test/tools/run-tests.mjs --list-cases` on a lane cut before that
# option existed. The parser had no word for it, pushed it into `targets`, and `walkPlans` stat'ed
# `.../--list-cases`: a stack trace and exit 1, which `scripts/selection-cases.mjs` reported as
# `the plan loader refused this selection (exit 1)` and the gate as a selection that could not be
# computed. The words were about a selection; the cause was a caller newer than the tree.
#
# The runner now refuses a word that starts with `-` instead of treating it as a target, prints the
# argv it does know and the commit it is, and the consumer passes that through. These three cases
# pin the three sentences against each other: each case asserts its own words and the absence of the
# other two, so the check fails both when one goes missing and when two causes share one sentence
# again. Exit codes are asserted as they already are (`1`, `2`, `2`): this change moves no code the
# gate reads.

[[tests]]
name = "argv.unknown"
desc = "An option no tree has (`--list-cases-v0`, where a caller newer than the tree is the only way to send one) is refused by name, with the argv the tree does know and the commit it is, and the output carries neither the missing-install sentence nor the empty-selection one, nor 'refused this selection'."
kind = "behavior"
tool = "node"
case = "../../../cases/tools/argv/argv.mjs"
args = ["${case}", "--unknown"]
expect_exit = 0
expect_stdout_contains = ["PASS argv.unknown"]
normalizers = ["strip_ansi", "normalize_newlines"]
# Three subprocesses at most, each exiting before it reads a plan.
timeout_ms = 120000

[[tests]]
name = "argv.preflight"
desc = "A valid argv and an install that is not there still says 'no Release binary at ...', and never 'unknown option': a missing build is not a caller from the future."
kind = "behavior"
tool = "node"
case = "../../../cases/tools/argv/argv.mjs"
args = ["${case}", "--preflight"]
expect_exit = 0
expect_stdout_contains = ["PASS argv.preflight"]
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 120000

[[tests]]
name = "argv.empty"
desc = "A deliberately empty selection still says that nothing was started and nothing was measured, and that the plan tree was not widened to fill it -- not 'unknown option', not 'no Release binary'."
kind = "behavior"
tool = "node"
case = "../../../cases/tools/argv/argv.mjs"
args = ["${case}", "--empty"]
expect_exit = 0
expect_stdout_contains = ["PASS argv.empty"]
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 120000

# The end-to-end one: the three above check the parts, this one checks the sentence a gate prints.
# It runs `scripts/old-tree-probe.mjs --check`, which assembles a tree from this checkout whose
# runner predates `--list-cases` and runs the real `scripts/selection-cases.mjs` against it -- so the
# assertion lands on the pair, and the tool is kept from rotting by having a caller in the gate.
[[tests]]
name = "argv.gate"
desc = "The old-tree probe: a tree whose runner predates --list-cases, asked for its cases by this checkout's selection-cases.mjs, answers with the version mismatch itself -- the runner does not know the word, nothing was selected and this is not an empty selection -- and neither 'refused this selection' nor 'the cases this change selects could not be computed' appears. It proves itself on this tree first, so a probe that can only go red cannot pass for one that works."
kind = "behavior"
tool = "node"
case = "../../../cases/tools/argv/argv.mjs"
args = ["${case}", "--gate"]
expect_exit = 0
expect_stdout_contains = ["PASS argv.gate"]
normalizers = ["strip_ansi", "normalize_newlines"]
# Copies `test/tools` (2 MB) and makes one commit, twice (this tree and the old half): seconds.
timeout_ms = 180000


# The tool's four exits, one reading each. They are numbers, and only the sentences tell `1` from
# one `2` and both `2`s from each other; the two that share a code are required to say different
# things, because a refusal and a red finding that read alike are the defect this plan is about.
[[tests]]
name = "argv.exits"
desc = "scripts/old-tree-probe.mjs answers four ways: 0 PASS (the pit is there and the chain behaves), 1 FAIL (the pit is there and the chain misbehaves), 2 for a ref that cannot be read, and 2 for a checkout that is not a green starting point -- and the two 2s say different things."
kind = "behavior"
tool = "node"
case = "../../../cases/tools/argv/argv.mjs"
args = ["${case}", "--exits"]
expect_exit = 0
expect_stdout_contains = ["PASS argv.exits", "[EXITS] self refused: exit 2", "[EXITS] red: exit 1"]
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 180000
