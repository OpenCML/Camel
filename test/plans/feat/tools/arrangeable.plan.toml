id = "tools.arrangeable"
order = 918
tier = "slow"
tags = ["feat", "tools", "facts", "kernel"]
desc = "`core.arrangeable`'s own answers on the one node kind whose answer cannot be read from the operator record alone (a conversion's pair of types), and over every case the tree has."

# The fact answers one question -- may a pass arrange this node anywhere -- and one program cannot say
# how the tree answers it. The fact's own plan pins the census on four programs (`facts.arrangeable_
# answers*`), which is what a plan beside a case can afford; the tree is 4,000 programs, and the rows
# that matter are the ones no single case writes: which operators exist, and what a change to the four
# terms of design principles 3.4 does to them.
#
# The first entry is the pair of types made into a program, and it is `fast`: two conversions of one
# operator, one that cannot fail and one that may, so the reading is the same operator answered two
# ways and only the pair can tell them apart.
#
# The second entry is the sweep, and it is `slow` because it starts one `camel` per tracked `.cml`
# (4,400 of them, 2,981 readable without the arguments their own plans give them). A named plan file
# runs in full whatever `--tier` says, which is why the selection rule that names this file is layered
# (test/plan-selection.json).
[[tests]]
name = "facts.arrangeable_conversion_pair"
tier = "fast"
desc = "`test::facts_compare` on a program whose two `:op/cast` nodes convert different pairs: `f32[...]` into `f32[2, 3]` checks the value's shape when it runs and may fault, `float[6]` into `f32[]` keeps every value it is given. The fact's row for the operator has one node answered freely arrangeable and one answered no, with no node unanswered: a conversion's fault term is a property of the pair of types it converts between, so a row read from the operator alone -- which says 'a cast may fault' about both -- cannot be what produced it. The two nodes are one row because they are one operator, and the row is split because they are two pairs."
kind = "behavior"
case = "../../../cases/facts/conversions.cml"
args = ["${case}", "test::facts_compare"]

expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const row = out.split('\n').find(l => l.startsWith('FACTS_COMPARE answers_row node_kind=oper oper=:op/cast '))
assert(row, 'no answers row for :op/cast: the census did not print')
const num = (name) => { const m = row.match(new RegExp(name + '=([0-9]+)')); assert(m, `${name} is missing from: ${row}`); return Number(m[1]) }
assert(num('nodes') >= 2, `the program's two conversions were not both counted: ${row}`)
assert(num('free') >= 1, `the conversion that cannot fail is not answered freely arrangeable: ${row}`)
assert(num('kept') >= 1, `the conversion that checks its value is not kept: ${row}`)
assert(num('no_fact') === 0, `the fact answered nothing for a conversion: ${row}`)
const line = out.split('\n').find(l => l.startsWith('FACTS_COMPARE kind=core.arrangeable answers '))
assert(line, 'no answers line: the census did not run on this program')
const total = (name) => { const m = line.match(new RegExp(name + '=([0-9]+)')); assert(m, `${name} is missing from: ${line}`); return Number(m[1]) }
assert(total('no_fact') === 0, `a node of this program got no answer: ${line}`)
assert(total('free') + total('kept') === total('nodes'), 'the two answers do not cover the nodes')
}
"""
timeout_ms = 20000

# What the sweep decides is coverage and completeness, not agreement: there is no second answer to
# agree with. The tables it prints are the reading -- a kind, an operator or a family that moves is a
# row a reader can name -- and the row of every operator that matters to a change is printed whether
# or not it is inside the window.
[[tests]]
name = "facts.arrangeable_every_operator_answers"
desc = "`scripts/check-arrangeable.mjs` runs `test::facts_compare std::gir` on every `.cml` the revision tracks and sums the census it prints: the totals, one line per node kind, one per family the tree answered in, and the (node kind, operator) rows. It then reads three things -- the sweep read at least 1700 cases, no node of any graph went unanswered (`no_fact=0`, because an absent answer is not a placement decision but a fact-layer defect), and no row was dropped in the reading -- and prints the tables either way."
kind = "behavior"
tool = "node"
case = "../../../../scripts/check-arrangeable.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["ARRANGEABLE_SWEEP files=", "ARRANGEABLE_KIND node_kind=oper", "ARRANGEABLE_ROW node_kind=oper oper=:op/cast", "every node the sweep read was answered by the fact"]
# One `camel` per case, plus `std::gir` for each (the stopper that keeps a case from being executed:
# the comparison pass hands the program on, and the next fallback would run it). The reading is 2,981
# cases at 238,135 nodes, 453 s of CPU over eight workers on the gate host; 2,400,000 ms is over five
# times that, so the bound is a bound and not the work's own time. A host that runs it slower spends
# wall clock and no CPU, and CPU is what the runner reads.
timeout_ms = 2400000