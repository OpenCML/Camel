id = "tools.member_init"
order = 915
tier = "fast"
tags = ["feat", "tools", "member_init"]
desc = "Every data member a constructor leaves out carries a default member initializer."

# `scripts/check-member-init.mjs` is the class of defect `Builder`'s `synced_` / `varied_` belonged
# to: a member no constructor initializes is read as whatever the allocator left in it, and a
# garbage `true` in `synced_` built a closure under the wrong graph (the S1-6 capture refusal). The compiler's reading is `clang-tidy -checks=cppcoreguidelines-pro-type-member-init`
# over a compilation database: a whole-tree run on 2026-11-20 named 56 sites, all of them fixed by
# the sweep that added this check. The fast layer runs the text reading instead -- `--all
# --static-only`, 1.2 s, no toolchain beyond node -- because a whole-tree clang-tidy run costs
# eleven minutes and the build host carries no clang-tidy at all. It answers the weaker question
# (does any constructor name the member) and reports the members whose value would be
# indeterminate: a scalar, a pointer, an enum, a bit-field.

[[tests]]
name = "tools.member_init.sweep"
desc = "No data member of a class with a constructor is left without a default initializer."
kind = "behavior"
tool = "node"
case = "../../../../scripts/check-member-init.mjs"
args = ["${case}", "--all", "--static-only"]
expect_exit = 0
expect_stdout_contains = ["check-member-init: 0 finding(s)"]
normalizers = ["normalize_newlines"]
timeout_ms = 120000