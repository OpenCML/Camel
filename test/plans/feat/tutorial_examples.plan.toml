case = "../../../docs/tutorial/examples/10_pure_callback.cml"
golden = "golden/tutorial_examples/10_pure_callback.txt"

# The counter-example of the chapter: a function that prints cannot be passed where the signature
# requires a pure one, so nothing is run and the error names the signature that would have matched.
#
# Its name and position are asserted from the output text rather than with `expect_diagnostic_name`
# and its line and column: this diagnostic's message carries the available overloads on lines of its
# own, so in the short format the run uses the `(name=..., code=...)` that the diagnostic assertions
# read ends up on a later line than the position, and the one-line pattern they match against does
# not see it. The page shows the same three lines the command prints.
[[tests]]
name = "tutorial.examples.10_pure_callback_wrong"
desc = "A program the compiler refuses: a function that prints is passed where the signature requires a pure one, and the error names the position and the overload that would have matched."
kind = "behavior"
case = "../../../docs/tutorial/examples/10_pure_callback_wrong.cml"
backends = false
args = ["${case}"]
expect_exit = 1
expect_output_not_contains = []
expect_output_contains = ["10_pure_callback_wrong.cml:15:18: [Error]: No matching function found", "(name=SemanticDiag::NoMatchingFunction, code=0x0300000F)", "apply: (f: (x: int) => int pure, x: int) => int"]

# The counter-example of the `uses` section: the clause is a promise the compiler holds the body
# to, so a body that reaches past it is refused where the declaration is written, and the resource
# the clause left out is named. Like the one above, what is asserted is the output text: the run
# reads the position and the diagnostic name from it.
[[tests]]
name = "tutorial.examples.10_uses_beyond"
desc = "A program the compiler refuses: `stamp` promises `db` and its body writes the standard output, which the clause does not name, so the declaration is refused and the resource it left out is named."
kind = "behavior"
case = "../../../docs/tutorial/examples/10_uses_beyond.cml"
backends = false
args = ["${case}"]
expect_exit = 1
expect_output_not_contains = []
expect_output_contains = ["10_uses_beyond.cml:8:1: [Error]: '() => int uses db' does not keep its resource promise", "stdout", "(name=SemanticDiag::UsesPromiseViolated, code=0x030001F1)"]

[[tests]]
name = "tutorial.examples.10_exercise"
desc = "The answer to the exercise of chapter 10: a `var` written inside a sync block, and a callback whose body touches no resource, passed where the pure requirement asks for one."
case = "../../../docs/tutorial/examples/10_exercise.cml"
golden = "golden/tutorial_examples/10_exercise.txt"

