# named here, one entry per file: an example nobody runs is a file a page can point at while it
# stops being the program the page describes. The shape of an entry is the one above -- a case, a
# golden, and a diagnostic where the file's lesson is a warning the page does not show; the two
# files that read `08_words.txt`, the one that faults and the one the compiler refuses override
