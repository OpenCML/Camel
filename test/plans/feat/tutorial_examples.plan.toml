id = "tutorial.examples"
order = 915
tier = "fast"
tags = ["feat", "docs", "tutorial", "examples"]
desc = "Every example beside the tutorial runs as the file it is: what a tutorial page shows is what the file it names prints, on the four back ends"

# `docs/tutorial/examples/` holds the examples of `docs/tutorial/tutorial.*.md`, one file per chapter
# example, and the pages carry the output a reader gets. The pages are checked -- `docs.snippets_compile`
# compiles every fence and compares the ones that show a command with their `text` block -- but until
# this plan nothing ran the FILES: a page could keep a command while the file it names changed under it,
# and "the output in the text is the real output" was true of the copy in the page, not of the file.
# Every entry below runs one file, on the four back ends, and compares what it printed with the recorded
# text under `golden/tutorial_examples/`.
#
# The files are named one by one because the runner's plan schema has no directory or glob field to name
# them any other way (docs/test-plans.md: exactly these keys, and an unknown key fails the plan). So a
# chapter example is not run until it is named here: adding a file under `docs/tutorial/examples/` and
# adding its entry here are one change, the way an example under `examples/` is added together with its
# `examples.plan.toml` entry. A new entry is a name, a case and a golden:
#
#     [[tests]]
#     name = "tutorial.examples.NN_name"
#     case = "../../../docs/tutorial/examples/NN_name.cml"
#     golden = "golden/tutorial_examples/NN_name.txt"
#
# and the output it prints today is recorded once with
#
#     node test/tools/run-tests.mjs --update-golden test/plans/feat/tutorial_examples.plan.toml
#
# Four files deviate from the default run, and each entry's `desc` says why. `05_map_order.cml` is
# pinned on the three back ends whose output has a fixed order and separately on `std::prl`, where the
# page itself says the first line may come out in any order, so that entry asserts the same numbers in
# another order instead of recording one. `06_let_to_var.cml` and `09_fault.cml` fail on purpose -- a
# rejected program and a fault -- so what is pinned is the exit code, the diagnostic and the lines
# printed before it. `shapes.cml` is a module with no `main`: running it as a program is refused, and
# that refusal is its reading here; chapter 8 runs it by importing it. `13_graph.cml` has a second
# entry for the `std::rgir` dump that both its header and its page give, compared as graph shape rather
# than as text, because the page's figure is a trimmed illustration of the dump and not the dump.
#
# Commands that a page shows and no file's header gives are not run here: `std::stats`,
# `--dump-after-each-pass` and `std::profile` on `14_passes.cml` and `15_model.cml` print per-pass dumps
# and timings that the chapters introduce as illustrations, and a recorded text of those would pin a
# figure the pages are free to change. The page fences themselves are compiled by
# `test/plans/feat/docs_links.plan.toml`.
#
# The goldens hold standard output, which is what a page's `text` block shows for most of these files.
# Five of them also warn on standard error -- `04_block_return.cml`, `06_callee_decides.cml`,
# `06_sync_body.cml`, `06_unused_effect.cml` and `09_errors.cml` -- and no page shows those warnings, so
# each of those entries asserts the diagnostic name (the same quantity the page checker asserts for a
# block that does show one) and says so in its `desc`. A warning that appears or disappears is then a
# reading of this plan, not something a reader discovers in a terminal.
#
# `timeout_ms` is 30 s for every entry: each is a chapter example whose run takes a fraction of a
# second, which leaves a wide margin on a loaded host without hiding a program that hangs.

#
# Nineteen of the entries below name a file whose number is the first outline's, not this one: the
# examples of the chapters that outline numbered 6 to 16, kept under the names they were written
# with. Each one's `desc` opens with the chapter that teaches it today -- `06_sync_body.cml` is
# chapter 10's example, `15_tensor.cml` is chapter 14's -- so a moved example can be told from a new
# one at a glance, and the same is said of chapter 18's files at their own section below.
[defaults]
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
# `warning[` is deliberately not excluded here: several chapter examples of chapter 10 have a warning
# as their lesson. A `[Error]` in any stream is a failure for every entry that does not say otherwise.
expect_output_not_contains = ["[Error]", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

