# ---- Entries for the other command lines the headers and the pages give ----------------------

# The first line of `05_map_order.cml` has no order on `std::prl`, and no fixed contents either:
# `randint` advances a hidden state, so which draw an element gets depends on which ran first, and
# under load the interleaving has produced a line whose multiset differs from the sequential one
# (`[2, 2, 2, 36, 58, 88, 36, 8]`, seen on 2026-10-26 in a run with -Jobs 8), which is why the
# chapter's page shows one run rather than a pinned line. What is asserted about the first line is
# its shape; the second line, which the reduce writes in element order, is exact.
[[tests]]
name = "tutorial.examples.05_map_order_prl"
desc = "The same program on std::prl: the parallel map draws eight numbers, and the second line is still in element order."
kind = "behavior"
case = "../../../docs/tutorial/examples/05_map_order.cml"
backends = false
args = ["${case}", "std::prl"]
expect_exit = 0
expect_output_not_contains = []
verify_script = """
const numbers = (line) => line.replace(/[[\]]/g, '').split(',').map((part) => Number(part.trim()))
const lines = input.normalized.stdout.trimEnd().split('\n')
assert(lines.length === 2, 'the program prints two lines, got ' + lines.length)
const drawn = numbers(lines[0])
const ordered = numbers(lines[1])
assert(drawn.length === 8 && ordered.length === 8, 'eight numbers per line, got ' + drawn.length + ' and ' + ordered.length)
assert(ordered.join(', ') === '22, 72, 89, 99, 60, 96, 66, 2', 'the reduced line is in element order, got ' + lines[1])
assert(
  drawn.every((n) => Number.isInteger(n) && n >= 0 && n <= 99),
  'the first line holds eight draws of randint(0, 99), whatever order they happened in: ' + lines[0]
)
"""

# The dump the page's figure illustrates. It is compared as graph shape (`gir_dot_isomorphic`, which
# ignores node ids and the order of siblings) rather than as text, so that a renumbering inside the
# compiler does not redden the plan while a changed graph still does.
[[tests]]
name = "tutorial.examples.13_graph_rgir"
desc = "The graph of 13_graph.cml as std::rgir dumps it: the chapter's figure is this graph, and its shape is what is pinned."
case = "../../../docs/tutorial/examples/13_graph.cml"
backends = false
args = ["${case}", "std::rgir"]
snapshot_compare = "gir_dot_isomorphic"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths", "normalize_origins"]
golden = "golden/tutorial_examples/13_graph_rgir.dot"

# The page's second command for 14_passes.cml: the same program through the optimizer and the bytecode
# VM, which must print the same number as the plain run.
[[tests]]
name = "tutorial.examples.14_passes_opt_fvm"
desc = "The same program with std::opt and std::fvm: optimizing the graph does not change the result."
case = "../../../docs/tutorial/examples/14_passes.cml"
backends = false
args = ["${case}", "std::opt", "std::fvm"]
golden = "golden/tutorial_examples/14_passes_opt_fvm.txt"

# The export writes into the test's own scratch directory, so the path in the message is this run's and
# a golden could not hold it; what is asserted is the message with the path of this run in it. The
# command is the page's: the model is translated, not run, so it needs no `--arg`.
[[tests]]
name = "tutorial.examples.15_model_export"
desc = "Exporting the model to ONNX: the pass writes the file and says where, into the run's own directory."
kind = "behavior"
case = "../../../docs/tutorial/examples/15_model.cml"
backends = false
args = ["${case}", "std::macro", "std::opt", 'onnx::export out="${test_tmp}/model.onnx"']
expect_exit = 0
expect_output_not_contains = []
expect_stdout_contains = ["onnx::export: wrote ${test_tmp}/model.onnx"]

