[[tests]]
name = "rules.parts_query_ignores_the_order_of_a_commutative_operator"
desc = "A rule whose coefficient is a `const` parameter asks a parameterized fact query (`mul_by_one(x, node_of(c))`), and the query's two parts reach it in the order the rule's own match bound them -- the pairing which the declaration of a commutative operator may exchange (`swapped` is `a * 1` against the pattern `x * c`, where only the exchange binds the constant to `c`, so the query is asked with the parts in the order the product holds them the other way). Both orders name the same value (op-semantics 7.4: the exchange gives the same value), so the query answers with the operands in either order and the product goes: `swapped` loses its product and keeps the factor as its value (`7`). `kept` (`a * 2`), whose coefficient is not one, keeps its product and the value `14`, and `plain`, whose guard is on the value, loses its product in the same pass -- so the pass is neither failing nor quietly idle. The counts are one product in each function before the pass and none in `swapped` and `plain` after it."
kind = "behavior"
case = "../../../cases/modules/rules/parts_order.cml"
args = ["${case}", "parts_order::report", "parts_order::apply", "parts_order::report", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["swapped 1\nkept 1\nplain 1\nswapped 0\nkept 1\nplain 0\n7 14 3.0\n"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "rules.fact_query_that_finds_nothing_leaves_the_rule_out"
desc = "A fact query inside a condition that finds no value whose parts it was given makes the condition false -- this rule does not apply here -- and not a failure of the pass (design principles 4.4: `when` is the rule's applicability condition, so a case it does not hold for is a case the rule is left out of). `sub(a, b)` is the fact of a subtraction, whose two operands are not interchangeable, and the condition of `drop_by_one` asks `sub(x, node_of(c))` with the parts of `kept` (`a * 2`): no subtraction of the draft has those two nodes, so the query answers false, the rule leaves the product and the value `14` alone, and the pass goes on to drop the product of `plain` with its guard on the value (`0` in the second report) -- the pass's other work, which a pass that quietly did nothing would fail to show."
kind = "behavior"
case = "../../../cases/modules/rules/no_value.cml"
args = ["${case}", "no_value::report", "no_value::apply", "no_value::report", "${backend}"]
backends = ["nvm", "fvm"]
expect_exit = 0
expect_stdout_contains = ["kept 1\nplain 1\nkept 1\nplain 0\n14 3.0\n"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

