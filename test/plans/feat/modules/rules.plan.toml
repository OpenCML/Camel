timeout_ms = 10000

[[tests]]
name = "rules.typed_boundaries_not_crossed"
desc = "The boundaries of the typed laws, computed and then computed through `rules::simplify`: (x*2)/2 at INT_MAX is -1, not INT_MAX; (x + 1e30) - 1e30 at 1.0 is 0.0, not 1.0; (x*3)/3 at 7.7 is 7.6999993, not 7.7; x*0 at an infinity is NaN, not 0.0; x/x at an infinity is NaN, not 1.0. The output is identical before and after, on the interpreter and the byte-code VM."
kind = "behavior"
case = "../../../cases/modules/rules/typed_boundary.cml"
args = ["${case}", "rules::simplify", "${backend}"]
backends = ["nvm", "fvm"]
expect_exit = 0
expect_stdout_contains = ["-1 2147483647\n0.0 1.0\n7.6999993 7.7\nnan 0.0\nnan 1.0\n"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "rules.typed_boundaries_are_real"
desc = "The same boundary program under five deliberately wrong laws: each line collapses to the tempting answer, so the boundary test above would have caught a law that fired. (x*2)/2 at INT_MAX becomes INT_MAX, (x + 1e30) - 1e30 becomes 1.0, (x*3)/3 becomes 7.7, x*0 at an infinity becomes 0.0, and x/x becomes 1.0."
kind = "behavior"
case = "../../../cases/modules/rules/typed_boundary.cml"
args = ["${case}", "typed_pass::apply_all_boundary_wrong", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["2147483647 2147483647\n1.0 1.0\n7.7 7.7\n0.0 0.0\n1.0 1.0\n"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "rules.typed_exact_doubling_guard"
desc = "The exact-doubling law on its own (`typed_pass::apply_double_only`), so the combine rule cannot take the same instances first: it fires for the integral coefficient 3, and does not fire for 8388609 (past the conservative 2^23 bound) or for 0.1 (not an integer). Source `x*3.0 + x*3.0` has two constant nodes; the matcher compares their values, not their identity."
kind = "behavior"
case = "../../../cases/modules/rules/typed_target.cml"
args = ["${case}", "typed_counts::report", "typed_pass::apply_double_only", "typed_counts::report", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["f f32_double 0 0 1 0 0\nf f32_double_big 1 0 2 0 0\nf f32_double_frac 1 0 2 0 0\n"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "rules.typed_exact_doubling_boundary"
desc = "The exact-doubling guard at the subnormal: (x*0.1) + (x*0.1) for x = 7*min is 2*min, and the law does not fire."
