normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "rules.tensor_guards_hold"
desc = "The tensor coefficient laws' value guards at the values they are about: an overflowing f32 coefficient sum (x*3e38 + x*3e38 at 0 is 0, not NaN), a product of coefficients that underflows to zero in f32 while the program's own chain does not ((x*1e-30)*1e-30 at 1e30 is 1e-30), and coefficients that cancel (x*3 + x*-3 at -1 is +0, not -0). The guarded rules do not fire and `rules::simplify` leaves the values alone."
