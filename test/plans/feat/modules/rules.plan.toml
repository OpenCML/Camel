[[tests]]
name = "rules.an_integer_rule_is_translated_to_a_proposition"
desc = "A rule of the integer scalar fragment is translated into the proposition a decision procedure would be handed, and every one of its rows says so in the `coverage` column (H247, slice S1; the ruling of 2026-10-24 on `verification-verdict-surface`, 3, in `docs/handover/reviews/questions-2026-10-23.md`): `x + x => x * 2` at `int` is `integer scalar int: (x + x) = (x * 2)`, and `x + 0 => x` at `i32` is `integer scalar i32: (x + 0) = x`. The column is part of the row's fixed rendering too, so the text a reader reads and the column a tool reads are one answer. With no solver in the build every one of these rows is still `sampled` -- comparing ten samples is not establishing the proposition -- and the report of this case never says `proved`."
kind = "behavior"
case = "../../../cases/modules/rules/verify_translate.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["sampled twice: proposition equality, evidence samples 10, fired 8 of 8, coverage integer scalar int: (x + x) = (x * 2)", "sampled plus_zero: proposition equality, evidence samples 10, fired 8 of 8, coverage integer scalar i32: (x + 0) = x", "rows 4", "0 integer scalar int: (x + x) = (x * 2)", "1 integer scalar i32: (x + 0) = x"]
expect_output_not_contains = ["proved "]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 40000

[[tests]]
name = "rules.a_rule_outside_the_fragment_is_refused_with_its_reason"
desc = "A rule the layer cannot translate is refused rather than guessed at, and the reason names the class that stopped it (rewrite design 8.1: 覆盖之外一律拒绝翻译，并给出原因; the ruling of 2026-10-24 on `verification-verdict-surface`, 3: the rule is `sampled` and the reason is written on its row). `x ^ 2 => x * x` is one integer equality in spirit and is refused by the operator the fragment does not carry, `:op/pow_l`, and the rule is refused by its operator before its operands are read. A floating rule is refused by its element type: `float` is `f64` here, declared in the coverage table and not translated yet, and it is the *parameter's* class that decides, so the answer does not depend on which operator happens to stand at the top of the side. Neither rule becomes `proved`, and neither is silently treated as an integer equality."
