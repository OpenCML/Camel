[[tests]]
name = "rules.typed_library_also_covers_int64"
desc = "`rules::simplify` is the whole library, so on the same four-type target it rewrites all four combines, including the `int` and `float` ones; the typed passes above then show that the new laws are the missing element types, not a replacement."
