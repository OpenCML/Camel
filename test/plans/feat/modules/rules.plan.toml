timeout_ms = 10000

[[tests]]
name = "rules.typed_guards_hold"
desc = "The coefficient laws' value guards at the values they are about: an overflowing coefficient sum (x*3e38 + x*3e38 at 0), a product that underflows to zero ((x*1e-30)*1e-30 at 1e30), a product that overflows ((x*1e30)*1e30 at 1e-30), and a mixed pair whose sum is zero (x*3 + x*-3 at -1). The granted rules do not fire, and `rules::simplify` leaves the values alone."
