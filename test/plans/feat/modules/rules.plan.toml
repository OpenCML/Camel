[[tests]]
name = "rules.accuracy_library_passes_the_check"
desc = "The rules of `rules::accuracy`, checked in two calls: the log-of-softmax rule passes the error check over vectors, matrices and rank-3 tensors (overflow, underflow, denormals and the near-zero log), and the folded scalar laws are checked by instance, `float_log1p<float>`, `float_log1p<f32>`, `float_expm1<float>` and `float_expm1<f32>`, each with its own worst-case error ratio (`check` walks the instances of a generic law over the types the operator groups registered -- the ruling of 2026-10-24 on `generic-rule-check-surface-and-multi-parameter-instances`, §1; `rules.accuracy_licence_gates_simplify` is what shows the folded scalar laws firing at both widths). Neither law has a `bf16`/`f16` instance to report: `math:log1p` and `math:expm1` are registered for `f32`/`f64`, and a failed instantiation is quiet (the ruling of 2026-10-23 on `generic-rule-instantiation-set-and-predicate`, §3). The log-of-softmax rule's verdict is sample-dependent: it fails on draws with `inf` and `3.4e+38` in them (the seed of a rule now follows its identity rather than its place in the array -- the ruling of 2026-10-24 on `accuracy-check-sampling`, 1, landed by H247's slice S0 -- which is why the measurements of that slice are recorded in the ruling of 2026-10-24 on `verification-report-surface-s0`, in `docs/handover/reviews/questions-2026-10-23.md`), which is why it is measured in a call of its own, over the seed this case has always used."
kind = "behavior"
case = "../../../cases/modules/rules/check_accuracy_library.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["sampled float_log1p<float>: proposition error bound, evidence samples 100, worst error ratio 0.269", "sampled float_log1p<f32>: proposition error bound, evidence samples 100, worst error ratio 0.201", "sampled float_expm1<float>: proposition error bound, evidence samples 100, worst error ratio 0.233", "sampled float_expm1<f32>: proposition error bound, evidence samples 100, worst error ratio 0.201", "sampled tensor_log_softmax_of_softmax: proposition error bound, evidence samples 100, worst error ratio 1, fired 8 of 8"]
expect_output_not_contains = ["refuted", "ok ", "a generic rule, whose instances are not checked here"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000

[[tests]]
name = "rules.every_exported_rule_enters_the_check"
desc = "The check's input is the library's own list of exported rules, and a verify script asserts it name by name (the ruling of 2026-10-24 on `verification-verdict-surface`, §4: the hand-written list is what drifts, and the library's header rule -- no rule enters `stdlib/rules.cml` without passing the check -- has to be catchable by a test). The script reads `stdlib/rules.cml` (43 exported rules), the case's own source with its comments stripped, and this run's report, and fails unless the three name the same set: a rule added to the library and not to the case, a name the case invents, a rule the case hands over that reaches no line of the report, and any `refuted` in it. The gap this closes is measured: `tensor_sigmoid_chain` was exported, used by the fusion pass, and reached no `check` call of any case (the check cases handed over 42 of the library's 43 exported rules, and the folding lane counted the same gap as 68 of 69 rules). NO rule of the library is `refuted` now: the one the script used to name as known, `tensor_combine_mixed`, is `sampled`, because a `reassociate` rule is compared in the reference's precision rather than one element-type result against another (the ruling of 2026-10-24 on `verification-report-surface-s0`, withdrawing the method H247 measured), so the set the script names as known is empty and every `refuted` line -- H247's finding included -- fails the run (the ruling of 2026-10-24 on `verification-verdict-surface`, §1 and §3: `refuted` hard-fails). The rules are handed over in the arrangements the two cases beside this one measured, and the seed of a rule now follows its identity rather than its place in the array (the ruling of 2026-10-24 on `accuracy-check-sampling`, 1), so this case's report is the one a check on coverage reads."
kind = "behavior"
case = "../../../cases/modules/rules/check_every_rule.cml"
args = ["${case}", "std::nvm"]
verify_script_path = "./verify/check_covers_every_rule.mjs"
expect_exit = 0
expect_stdout_contains = ["sampled tensor_sigmoid_chain: proposition equality, evidence samples 200, fired 8 of 8", "sampled int_add_zero<int>: proposition equality, evidence samples 200, reason the condition selects the instances", "sampled float_log1p<f32>: proposition error bound, evidence samples 100, worst error ratio", "sampled tensor_log_softmax_of_softmax: proposition error bound, evidence samples 100, worst error ratio 1, fired 8 of 8"]
expect_output_not_contains = ["ok ", "FAIL ", "a generic rule, whose instances are not checked here"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000

