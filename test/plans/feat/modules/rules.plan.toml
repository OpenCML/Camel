id = "modules.rules"
order = 392
tier = "fast"
tags = ["feat", "modules", "rules", "rewrite"]
desc = "Rules (rewrite design 2): a pass written with `rule` declarations and the rewrite of the module rewrite, run on a program as a Camel pass."

[[tests]]
name = "rules.rewrite_pass"
desc = "simplify::apply rewrites the program with four rules: x*3 + x*5 becomes x*8 (the sum of the constants is computed by the operator), ((x+0)*3)*2 becomes x*6; the program prints what it printed."
kind = "behavior"
case = "../../../cases/modules/rules/target.cml"
args = ["${case}", "counts::report", "simplify::apply", "counts::report", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["coefficients 1 2\nchain 1 2\ncoefficients 0 1\nchain 0 1\n56 42\n"]
timeout_ms = 10000

[[tests]]
name = "rules.rewrite_pass_on_every_backend"
desc = "The rewritten program runs the same on the byte-code interpreter and the parallel scheduler."
kind = "behavior"
case = "../../../cases/modules/rules/target.cml"
args = ["${case}", "simplify::apply", "${backend}"]
backends = ["fvm", "prl"]
expect_exit = 0
expect_stdout_contains = ["56 42\n"]
timeout_ms = 10000

[[tests]]
name = "rules.two_way_refused"
desc = "A rule from <=> given to rewrite is an error value, RuleTwoWay, that names the rule: the pass fails and the program does not run."
kind = "negative"
case = "../../../cases/modules/rules/target.cml"
args = ["${case}", "simplify::swapped", "std::nvm"]
expect_exit = 1
expect_output_contains = ["GraphPassFailed", "RuleTwoWay", "Rule 'swap' holds both ways"]
expect_output_not_contains = ["56 42"]
timeout_ms = 10000

[[tests]]
name = "rules.saturate_and_extract"
desc = "simplify::saturated saturates both ways (swap rules included) and extracts by node count inside one Camel pass: the same operators as the greedy rewrite, the program prints what it printed."
kind = "behavior"
case = "../../../cases/modules/rules/target.cml"
args = ["${case}", "counts::report", "simplify::saturated", "counts::report", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["coefficients 1 2\nchain 1 2\ncoefficients 0 1\nchain 0 1\n56 42\n"]
timeout_ms = 10000

[[tests]]
name = "rules.saturation_alone_needs_an_extraction"
desc = "simplify::tabled only saturates: the program has values with several writings, and a pass that does not know them (counts::report) gets PassNeedsExtraction instead of the program."
kind = "negative"
case = "../../../cases/modules/rules/target.cml"
args = ["${case}", "simplify::tabled", "counts::report", "std::nvm"]
expect_exit = 1
expect_output_contains = ["PassNeedsExtraction", "counts::report", "std::opt::extract"]
timeout_ms = 10000

[[tests]]
name = "rules.saturation_then_the_extract_pass"
desc = "With std::opt::extract after the saturation, the program is back to one writing per value and runs."
kind = "behavior"
case = "../../../cases/modules/rules/target.cml"
args = ["${case}", "simplify::tabled", "std::opt::extract", "${backend}"]
backends = ["nvm", "fvm"]
expect_exit = 0
expect_stdout_contains = ["56 42\n"]
timeout_ms = 10000

[[tests]]
name = "rules.saturation_then_the_pipeline_extracts"
desc = "A saturated program given to a back end is extracted by the pipeline with the default cost."
kind = "behavior"
case = "../../../cases/modules/rules/target.cml"
args = ["${case}", "simplify::tabled", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["56 42\n"]
timeout_ms = 10000

[[tests]]
name = "rules.check_accepts_rules_that_hold"
desc = "The check every rule passes before it enters a library (graph store decision 5): 100 random instances of the two sides agree bit for bit (the rules that need no permission), and the engine fires the rule on its own left side and gets a function that agrees too. Integer rules, a rule with const parameters, a rule from <=> and the float rules x + -0.0 and x * 1.0."
kind = "behavior"
case = "../../../cases/modules/rules/check_rules.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["ok add_zero: 100 samples agree, fired 8 of 8", "ok mul_one: 100 samples agree, fired 8 of 8", "ok combine: 100 samples agree, fired 8 of 8", "ok swap: 100 samples agree, fired 8 of 8", "ok minus_zero: 100 samples agree, fired 8 of 8", "ok times_one: 100 samples agree, fired 8 of 8"]
expect_output_not_contains = ["ok wrong", "ok sign", "ok plus_zero"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "rules.check_finds_rules_that_do_not_hold"
desc = "A rule that is not an equation (x * 2 => x + 2 differs at the integer limit), one that flips a sign, and x + 0.0 => x (it turns -0.0 into 0.0) are reported with the arguments where the two sides differ."
kind = "behavior"
case = "../../../cases/modules/rules/check_rules.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["FAIL wrong: the two sides differ at (", "FAIL sign: the two sides differ at (", "FAIL plus_zero: the two sides differ at (-0)"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "rules.library_passes_the_check"
desc = "Every rule of the standard rules (stdlib/rules.cml: the integer and float laws that hold bit for bit, the float laws a permission allows, with commutation, association and distribution both ways) passes the check: 200 random instances agree and the engine fires the rule on its own left side."
kind = "behavior"
case = "../../../cases/modules/rules/check_library.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["ok int_add_zero: 200 samples agree, fired 8 of 8", "ok int_distribute: 200 samples agree, fired 8 of 8", "ok float_add_minus_zero: 200 samples agree, fired 8 of 8", "ok float_mul_comm: 200 samples agree, fired 8 of 8", "ok float_combine: the condition selects the instances", "ok float_fold: the condition selects the instances", "ok float_double: the condition selects the instances"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000

[[tests]]
name = "rules.check_bound_follows_the_permission"
desc = "The check takes the error bound of the permission a rule needs, not one uniform bound (design principles 7.2-7.4): the same wrong equation (x*2.0 => x*2.000000001, about 5e-10 relative) is rejected under reassociate, whose bound is a few ulps, and accepted under change_precision, whose bound is bf16's 2^-8 per step. A looser uniform bound would hide the first rule."
kind = "behavior"
case = "../../../cases/modules/rules/check_bound.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["FAIL wrong_reassociate: the two sides differ at (", "ok wrong_precision: 40 samples agree, fired 8 of 8"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "rules.float_permissions_gate_the_laws"
desc = "The float laws of the library apply where their permissions are granted: same-sign coefficients under the default reassociate, the exact doubling of an integral coefficient with no permission, and the cancellation and product-chain laws only on a node that grants no_infs/no_signed_zeros. The operator counts show which rule fired; the values are what the rewritten expressions compute."
kind = "behavior"
case = "../../../cases/modules/rules/float_target.cml"
args = ["${case}", "float_counts::report", "rules::simplify", "float_counts::report", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["combine 1 2\nmixed 1 2\nchain 0 2\ndouble 1 2\ngranted_mixed 1 2\ngranted_chain 0 2\ncombine 0 1\nmixed 1 2\nchain 0 2\ndouble 0 1\ngranted_mixed 0 1\ngranted_chain 0 1\n16.0 -4.0 12.0 12.0 -4.0 12.0\n"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "rules.float_permissions_on_every_backend"
desc = "The rewritten float program computes the same values on the byte-code interpreter and the parallel scheduler."
kind = "behavior"
case = "../../../cases/modules/rules/float_target.cml"
args = ["${case}", "rules::simplify", "${backend}"]
backends = ["fvm", "prl"]
expect_exit = 0
expect_stdout_contains = ["16.0 -4.0 12.0 12.0 -4.0 12.0\n"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "rules.library_simplify"
desc = "rules::simplify, the library pass, folds x*3 + x*5 and ((x+0)*3)*2 as std::opt::algebra does, and the program prints what it printed."
kind = "behavior"
case = "../../../cases/modules/rules/target.cml"
args = ["${case}", "counts::report", "rules::simplify", "counts::report", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["coefficients 1 2\nchain 1 2\ncoefficients 0 1\nchain 0 1\n56 42\n"]
timeout_ms = 10000

[[tests]]
name = "rules.library_saturate_all"
desc = "rules::saturate_all saturates with every rule of the library, the rearranging ones included, and extracts the smallest writing: the same operators."
kind = "behavior"
case = "../../../cases/modules/rules/target.cml"
args = ["${case}", "counts::report", "rules::saturate_all", "counts::report", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["coefficients 1 2\nchain 1 2\ncoefficients 0 1\nchain 0 1\n56 42\n"]
timeout_ms = 20000

[[tests]]
name = "rules.pass_in_the_program_module"
desc = "A module that holds the rule, the target and the pass itself (`export func apply`) is a pass like any other: the rewritten program is installed and run. The rule turns x + 0 into x + 1 on purpose, so the output (8) shows that the pass produced and ran the program; the same file without the pass prints 7."
kind = "behavior"
case = "../../../cases/modules/rules/same_module_pass.cml"
args = ["${case}", "same_module_pass::apply"]
expect_exit = 0
expect_stdout_contains = ["8\n"]
timeout_ms = 10000

[[tests]]
name = "rules.pass_in_the_program_module_without_the_pass"
desc = "The same file, run as a program: 7, the value before the rewrite. Together with rules.pass_in_the_program_module it says which program the pass produced."
kind = "behavior"
case = "../../../cases/modules/rules/same_module_pass.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["7\n"]
timeout_ms = 10000

[[tests]]
name = "rules.when_condition_selects_matches"
desc = "A rule with `when` fires only where its condition holds: the shapes and types of the draft tell the four pairs of functions apart. The report before and after the rewrite shows which products and additions were replaced, and the program still prints the values it should."
kind = "behavior"
case = "../../../cases/modules/rules/when_target.cml"
args = ["${case}", "when_rules::report", "when_rules::apply", "when_rules::report", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["byConst 1\nnotConst 1\nmulSum 1 1\nmulPlain 1\nintDouble 1 0\nfloatDouble 1 0\nbyConst 0\nnotConst 1\nmulSum 0 1\nmulPlain 1\nintDouble 0 1\nfloatDouble 0 1\n7 10 5 12\n10 2.5\n"]
timeout_ms = 20000

[[tests]]
name = "rules.when_on_every_backend"
desc = "The program a rule with a condition rewrote runs the same on the node VM, the byte-code interpreter, the JIT and the parallel scheduler."
kind = "behavior"
case = "../../../cases/modules/rules/when_target.cml"
args = ["${case}", "when_rules::apply", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
expect_exit = 0
expect_stdout_contains = ["7 10 5 12\n10 2.5\n"]
timeout_ms = 20000

[[tests]]
name = "rules.when_in_saturation"
desc = "saturate applies a rule with a condition to the writings whose match passes it, and the extraction brings the program back to one writing: the same values as the greedy rewrite."
kind = "behavior"
case = "../../../cases/modules/rules/when_target.cml"
args = ["${case}", "when_rules::saturated", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["7 10 5 12\n10 2.5\n"]
timeout_ms = 20000

[[tests]]
name = "rules.when_passes_the_check"
desc = "The check of a conditional rule cannot compare sampled values (the tool cannot ask a condition about them): it fires the rule on its own left side, where the condition holds, and compares the rewritten left side. A conditional rule whose sides disagree is still reported."
kind = "behavior"
case = "../../../cases/modules/rules/check_when.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["ok double_int: the condition selects the instances, fired 64 of 64", "ok double_float: the condition selects the instances, fired 64 of 64", "FAIL wrong_guard: the rewritten left side differs"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]

[[tests]]
name = "rules.requires_permission_grants"
desc = "A rule with `#requires<approx_math>` is applied only where the program grants the permission: `kept` carries `@numeric(approx_math)` and loses its product, `scaled` does not and keeps it. The requirement is compiled with the rule, not checked at run time."
kind = "behavior"
case = "../../../cases/modules/rules/requires_target.cml"
args = ["${case}", "counts::report_requires", "requires::apply", "counts::report_requires", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["scaled 1 kept 1\nscaled 1 kept 0\n3.0 4.0\n"]
timeout_ms = 10000

[[tests]]
name = "rules.requires_default_permission"
desc = "A rule that requires `reassociate`, which design principles 7.3 allows by default, applies without any grant: both products are folded."
kind = "behavior"
case = "../../../cases/modules/rules/requires_target.cml"
args = ["${case}", "counts::report_requires", "requires::apply_default", "counts::report_requires", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["scaled 1 kept 1\nscaled 0 kept 0\n3.0 4.0\n"]
timeout_ms = 10000

[[tests]]
name = "rules.requires_unknown"
desc = "A requirement that names no permission is reported at the argument, with the permissions that can be named."
kind = "negative"
case = "../../../cases/modules/rules/err_requires_unknown.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::TagNotAPermission"
expect_diagnostic_line = 6
expect_diagnostic_column = 11
expect_output_contains = ["The tag 'reassociate2' grants no numeric permission."]

[[tests]]
name = "rules.requires_not_a_permission"
desc = "A requirement that names a tag of the program grants no permission: the diagnostic says so at the argument."
kind = "negative"
case = "../../../cases/modules/rules/err_requires_not_permission.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::TagNotAPermission"
expect_diagnostic_line = 6
expect_diagnostic_column = 11
expect_output_contains = ["The tag 'plain' grants no numeric permission."]

[[tests]]
name = "rules.only_requires_before_a_rule"
desc = "Any tag other than `#requires` before a rule is a located error: a rule states requirements, not facts."
kind = "negative"
case = "../../../cases/modules/rules/err_rule_tag.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::RuleTagNotRequires"
expect_diagnostic_line = 6
expect_diagnostic_column = 2
expect_output_contains = ["A rule may be preceded only by '#requires<...>', not by the tag 'fast'."]

[[tests]]
name = "rules.requires_outside_a_rule"
desc = "`#requires` written before a function is not a tag the program can use: a located TagUndeclared, not a silent pass."
kind = "negative"
case = "../../../cases/modules/rules/err_requires_on_func.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::TagUndeclared"
expect_diagnostic_line = 4
expect_diagnostic_column = 2
expect_output_contains = ["No tag 'requires' is declared."]

[[tests]]
name = "rules.requires_without_argument"
desc = "`#requires` without an argument is reported with the number of arguments the form takes."
kind = "negative"
case = "../../../cases/modules/rules/err_requires_empty.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::TagArgumentCount"
expect_diagnostic_line = 4
expect_diagnostic_column = 2
expect_output_contains = ["The tag 'requires' takes 1 parameter(s), but 0 argument(s) are written."]

[[tests]]
name = "rules.requires_program_group"
desc = "A requirement may name a group of permissions the program declares (`tag fast = [reassociate, contract]`): `#requires<fast>` is the union of its members, so the rule applies to `kept` (which grants `contract`) and not to `scaled`."
kind = "behavior"
case = "../../../cases/modules/rules/requires_group_target.cml"
args = ["${case}", "counts::report_requires", "requires_group::apply", "counts::report_requires", "std::nvm"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const expected = ['scaled 1 kept 1', 'scaled 1 kept 0', '3.0 4.0', ''].join(String.fromCharCode(10))
assert(input.normalized.stdout === expected, `stdout was: ${JSON.stringify(input.normalized.stdout)}`)
}
"""
timeout_ms = 10000

[[tests]]
name = "rules.analysis_reads_a_fact_in_when"
desc = "An `analysis` (rewrite design 4) compiles to functions and a fact kind: `depth` counts the additions a value is under (initial 0, a constant 1, an addition one more than the deepest operand, any other operator the join of its operands) and `sign` is the value of a constant. `report` reads `depth` of the frozen graphs of the target (sum 3, mixed 2) and counts products; the rule `mul_one` reads `sign(c)` in its `when`, so it rewrites x * 1 but not x * 2; the second report shows the rewritten program."
kind = "behavior"
case = "../../../cases/modules/rules/analysis_target.cml"
args = ["${case}", "analysis_lib::report", "analysis_lib::apply", "analysis_lib::report", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["sum 3 mixed 2 one 1 two 1\nsum 3 mixed 2 one 0 two 1\n4 7 7 14\n"]
timeout_ms = 20000

[[tests]]
name = "rules.analysis_takes_the_parts_of_a_compound"
desc = "A declaration with parameters (`analysis mul_by_one(a: Node, b: Node): bool`) is a multi-parameter query: a rule's condition hands it the pattern variables, and the fact is the one of the compound whose parts they are. `mul_one_by_parts` rewrites `x * 1` to `x` because `mul_by_one(x, c)` reads `sign(c) == 1` through the `x * y` clause; `x * 2` keeps its product because the query answers false. The first report prints one product in each function, the second only in `two`, and the values are unchanged."
kind = "behavior"
case = "../../../cases/modules/rules/analysis_parts.cml"
args = ["${case}", "analysis_parts::report", "analysis_parts::apply", "analysis_parts::report", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["one 1 two 1\none 0 two 1\n7 14\n"]
timeout_ms = 20000

[[tests]]
name = "rules.requires_nondeterministic"
desc = "`nondeterministic` is a permission like the others (design principles 7.2): a rule may require it and a function grant it, and the rule is applied only where it is granted."
kind = "behavior"
case = "../../../cases/modules/rules/requires_nd_target.cml"
args = ["${case}", "counts::report_requires", "requires_nd::apply", "counts::report_requires", "std::nvm"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const expected = ['scaled 1 kept 1', 'scaled 1 kept 0', '3.0 4.0', ''].join(String.fromCharCode(10))
assert(input.normalized.stdout === expected, `stdout was: ${JSON.stringify(input.normalized.stdout)}`)
}
"""
timeout_ms = 10000
