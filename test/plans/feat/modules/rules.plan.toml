[[tests]]
name = "rules.with_parameter_and_a_type_parameter"
desc = "The rule of the design draft 1: `with <tile: int>` and `rule tile_scale::<T>(x: T)`, one instantiation channel. The value is the factor of the product, and both sides read it: the pattern `x * tile` matches `x * 2` where the rule is bound to 2 and not where it is bound to 3 or 0, and the replacement `x + x * (tile - 1)` is built from it, which is where the addition of the two rewritten functions comes from. The four reports show the additions and products of the target's functions before and after each binding, and the program prints what it printed."
kind = "behavior"
case = "../../../cases/modules/rules/with_generic_target.cml"
args = ["${case}", "with_generic_rules::report", "with_generic_rules::counted_two", "with_generic_rules::report", "with_generic_rules::counted_three", "with_generic_rules::report", "with_generic_rules::counted_zero", "with_generic_rules::report", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["wide 0 1\n", "again 0 1\n", "thrice 0 1\n", "zeroed 0 1\n", "6 8 15 0\n"]
timeout_ms = 30000

[[tests]]
name = "rules.with_parameter_and_a_type_parameter_instances"
desc = "The proof of the rule bound to 2 names the instance each rewrite came from: the two sites of `x * 2` are one instance, `tile_scale<int>(tile = 2)`, and the same rule bound to 3 is another, `tile_scale<int>(tile = 3)` -- the value is half of the key the instance is made under. `check` then enumerates the instances of the one bound value, one row per instance."
kind = "behavior"
case = "../../../cases/modules/rules/with_generic_target.cml"
args = ["${case}", "with_generic_rules::counted_two", "with_generic_rules::counted_three", "with_generic_rules::checked", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["rewrites 2 rule tile_scale\n", "tile_scale<int>(tile = 2)", "rewrites 1 rule tile_scale\n", "tile_scale<int>(tile = 3)", "6 8 15 0\n"]
timeout_ms = 30000

[[tests]]
name = "rules.with_parameter_binding_is_a_constant"
desc = "The value bound to a rule's `with` parameter is what selects the instance its sides are made at, so it is a value the compiler knows: a binding whose value is a parameter of the function around it is refused where the binding is written (RuleWithArgumentNotConstant), and the program does not run."
kind = "negative"
case = "../../../cases/modules/rules/err_rule_with_not_constant.cml"
args = ["${case}", "std::nvm"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::RuleWithArgumentNotConstant"
expect_diagnostic_line = 17
expect_output_contains = ["The value bound to the `with` parameter 'tile' of the rule 'add_tile' is not a compile-time constant of the type 'int'"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 20000

[[tests]]
name = "rules.fact_argument_is_not_a_constant"
desc = "A fact is computed once for the arguments it is queried with, and two different arguments are two different facts, so the compiler must compute the argument where the query is written: `capped<y>(x)` names a parameter of the rule, a value of the run, and the declaration is refused with `SemanticDiag::FactArgumentNotConstant` (name=SemanticDiag::FactArgumentNotConstant, code=0x030001C3) on the written argument, rather than computing a fact for every value the parameter may take."
kind = "negative"
case = "../../../cases/modules/rules/fact_arg_not_constant.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::FactArgumentNotConstant"
expect_diagnostic_line = 17
expect_output_contains = ["The argument 'cap' of a fact is not a compile-time constant of type 'int'.", "An argument is therefore a value the compiler computes where the query is written", "fact_arg_not_constant.cml:17:42"]
expect_output_not_contains = ["UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "rules.fact_without_a_default_case"
desc = "Every fact needs one case that takes whatever the others do not: `sign` matches only a constant, so nothing says what the fact is for a value no case matched, and the declaration is refused with `SemanticDiag::FactCaseDefaultMissing` (name=SemanticDiag::FactCaseDefaultMissing, code=0x030001C4) on the `fact` line. The value of that case is also what a value that depends on itself settles on, so it is not optional."
kind = "negative"
case = "../../../cases/modules/rules/fact_no_default.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::FactCaseDefaultMissing"
expect_diagnostic_line = 8
expect_output_contains = ["The fact 'sign' has no 'case _', so nothing says what it is for a value no other case matched.", "every fact needs one case that takes whatever they do not"]
expect_output_not_contains = ["UnknownInternalError"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "rules.fact_with_argument_is_read_by_a_case"
desc = "The arguments a fact is queried with are the fact's, and they reach the functions the declaration generates: `fact times` multiplies a constant by `with <factor: int>` and its initial case is the argument negated, so a case reads the value by name. Two rules ask the same pattern for different constants -- `mul_by_two` fires where `times<2>(y) == 4` (the constant is 2) and `mul_by_three` where `times<3>(y) == 9` (the constant is 3) -- and on a target with a product by 1 and a product by 2 the first rewrites the one product and the second none, so which constant a rule rewrites is the value the case read. `x * 2` is rewritten to `x + x`, so the numbers of the program are unchanged."
kind = "behavior"
case = "../../../cases/modules/rules/fact_with_value.cml"
args = ["${case}", "fact_with_value::report", "fact_with_value::apply_two", "fact_with_value::report", "fact_with_value::apply_three", "fact_with_value::report", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["one 1 two 1\none 1 two 0\none 1 two 0\n7 14\n"]
timeout_ms = 20000
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]

[[tests]]
name = "rules.a_condition_whose_fact_query_finds_nothing_does_not_leave_a_frame_behind"
desc = "A rule whose condition queries a fact over the parts of the redex and finds no value leaves the rewrite able to go on, and leaves nothing of its own behind. This is the minimal shape of the fact condition path: one two-parameter fact (`sub(a, b)`) whose case queries a second fact (`sign(y)`), asked from a rule's `when` about the operands of a product no subtraction has. The first query of `sub` answers nothing and throws `FactQueryNoValue`, which the condition turns into `false`; the query is asked again on the next match, and must not read anything of the evaluation that already ended. The point of the case is that the pass runs to the end and the product survives: it died with SIGSEGV on the host before the fix (exit 139, stdout stopping at the report before `apply`)."
kind = "behavior"
case = "../../../cases/modules/rules/fact_no_value.cml"
args = ["${case}", "fact_no_value::report", "fact_no_value::apply", "fact_no_value::report", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["kept 1\nkept 1\nkept 14\n"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 20000