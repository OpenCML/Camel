[[tests]]
name = "rules.tensor_laws_counts"
desc = "The tensor element laws of the standard rules, by operator count: `tensor_f32_combine` folds x*3 + x*5 under the default reassociate, the mixed and the product-chain laws wait for the permissions their guards name, `tensor_f32_double` (exact doubling) needs none, the bare-operand laws fold x*c + x with the same permissions as the two-term combine, `tensor_f32_add_self` turns t + t into t*2, the neutral laws reach a bare tensor, coefficients f32 does not hold exactly are left alone, and an i64 tensor keeps its own add (the f32 laws are typed and must not read it)."
kind = "behavior"
case = "../../../cases/modules/rules/tensor_target.cml"
args = ["${case}", "tensor_counts::report", "rules::simplify", "tensor_counts::report", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["combine 1 2\ncombine_mixed 1 2\ncombine_mixed_granted 1 2\nfold 0 2\nfold_granted 0 2\ndouble 1 2\nself 1 0\none 1 1\none_other 1 1\none_mixed 1 1\none_mixed_granted 1 1\nneutral 1 1\ninexact 1 2\ninexact_one 1 1\ni64_self 1 0\ni64_distribute 1 1\ncombine 0 1\ncombine_mixed 1 2\ncombine_mixed_granted 0 1\nfold 0 2\nfold_granted 0 1\ndouble 0 1\nself 0 1\none 0 1\none_other 0 1\none_mixed 1 1\none_mixed_granted 0 1\nneutral 0 0\ninexact 1 2\ninexact_one 1 1\ni64_self 1 0\ni64_distribute 1 1\n"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

