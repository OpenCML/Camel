normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "rules.element_bare_term_boundaries_are_real"
desc = "The same program under the bare-term law without its guards: the -0.0 case becomes -0.0 and the infinite case becomes infinity, so each boundary line collapses."
kind = "behavior"
case = "../../../cases/modules/rules/bare_boundary.cml"
args = ["${case}", "bare_boundary::apply", "std::nvm"]
