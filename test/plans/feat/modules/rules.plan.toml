normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "rules.element_bare_term_boundaries"
desc = "The bare-term law at the boundaries its guards name: `x * -1.0 + x` (whose coefficient sum is zero) keeps the program's +0.0 for -0.0, and `x * 0.0 + x` at infinity keeps the program's NaN (the implicit `x*1` is a product with zero, which the law would drop)."
kind = "behavior"
case = "../../../cases/modules/rules/bare_boundary.cml"
args = ["${case}", "rules::simplify", "std::nvm"]
