[[tests]]
name = "rules.attribution_records_without_changing_the_counters"
desc = "The attribution record is optional (rewrite design 8.7): `bench::compare` runs the same application twice on the same 200-function program, once without the record and once with it, and prints both. The counters must agree (200 rewrites, 2 rounds, the same visited count) and the program must be unchanged; the wall times are printed for the comparison and not pinned, because they depend on the machine."
kind = "behavior"
case = "../../../cases/modules/rules/bench_target.cml"
args = ["${case}", "bench::compare", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["bench off_seconds", "on_rewrites 200", "on_rounds 2", "\n200\n"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const line = out.split(String.fromCharCode(10)).find((l) => l.startsWith('bench off_seconds'))
assert(line, `the comparison did not run: ${JSON.stringify(out)}`)
const field = (name) => {
const match = line.match(new RegExp(` ${name} (-?[0-9.eE+]+)`))
return match ? match[1] : null
}
assert(field('off_rewrites') === field('on_rewrites'), `rewrites differ: ${line}`)
assert(field('off_rounds') === field('on_rounds'), `rounds differ: ${line}`)
assert(field('off_visited') === field('on_visited'), `visited differ: ${line}`)
assert(field('on_rewrites') === '200', `the benchmark makes 200 rewrites: ${line}`)
assert(field('on_rounds') === '2', `the benchmark makes 2 rounds: ${line}`)
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

