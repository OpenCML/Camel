timeout_ms = 10000

[[tests]]
name = "rules.tensor_saturation_keeps_values"
desc = "The tensor saturation (both ways, including the i64 distribution over tensor add) rewrites the same program to writings that still compute the values of the program as written: the point of a two-way law is that either direction is the same value."
