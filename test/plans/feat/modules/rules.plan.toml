id = "modules.rules"
order = 392
tier = "fast"
tags = ["feat", "modules", "rules", "rewrite"]
desc = "Rules (rewrite design 2): a pass written with `rule` declarations, the rewrite of the module rewrite, rules as `Rule` values and the scheduling combinators, run on a program as a Camel pass, with the cost of an application measured."

[[tests]]
name = "rules.rewrite_pass"
desc = "simplify::apply rewrites the program with four rules: x*3 + x*5 becomes x*8 (the sum of the constants is computed by the operator), ((x+0)*3)*2 becomes x*6; the program prints what it printed."
kind = "behavior"
case = "../../../cases/modules/rules/target.cml"
args = ["${case}", "counts::report", "simplify::apply", "counts::report", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["coefficients 1 2\nchain 1 2\ncoefficients 0 1\nchain 0 1\n56 42\n"]
timeout_ms = 10000

[[tests]]
name = "rules.rewrite_pass_on_every_backend"
desc = "The rewritten program runs the same on the byte-code interpreter and the parallel scheduler."
kind = "behavior"
case = "../../../cases/modules/rules/target.cml"
args = ["${case}", "simplify::apply", "${backend}"]
backends = ["fvm", "prl"]
expect_exit = 0
expect_stdout_contains = ["56 42\n"]
timeout_ms = 10000

[[tests]]
name = "rules.two_way_refused"
desc = "A rule from <=> given to rewrite is an error value, RuleTwoWay, that names the rule: the pass fails and the program does not run."
kind = "negative"
case = "../../../cases/modules/rules/target.cml"
args = ["${case}", "simplify::swapped", "std::nvm"]
expect_exit = 1
expect_output_contains = ["GraphPassFailed", "RuleTwoWay", "Rule 'swap' holds both ways"]
expect_output_not_contains = ["56 42"]
timeout_ms = 10000

[[tests]]
name = "rules.saturate_and_extract"
desc = "simplify::saturated saturates both ways (swap rules included) and extracts by node count inside one Camel pass: the same operators as the greedy rewrite, the program prints what it printed."
kind = "behavior"
case = "../../../cases/modules/rules/target.cml"
args = ["${case}", "counts::report", "simplify::saturated", "counts::report", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["coefficients 1 2\nchain 1 2\ncoefficients 0 1\nchain 0 1\n56 42\n"]
timeout_ms = 10000

[[tests]]
name = "rules.saturation_alone_needs_an_extraction"
desc = "simplify::tabled only saturates: the program has values with several writings, and a pass that does not know them (counts::report) gets PassNeedsExtraction instead of the program."
kind = "negative"
case = "../../../cases/modules/rules/target.cml"
args = ["${case}", "simplify::tabled", "counts::report", "std::nvm"]
expect_exit = 1
expect_output_contains = ["PassNeedsExtraction", "counts::report", "std::opt::extract"]
timeout_ms = 10000

[[tests]]
name = "rules.saturation_then_the_extract_pass"
desc = "With std::opt::extract after the saturation, the program is back to one writing per value and runs."
kind = "behavior"
case = "../../../cases/modules/rules/target.cml"
args = ["${case}", "simplify::tabled", "std::opt::extract", "${backend}"]
backends = ["nvm", "fvm"]
expect_exit = 0
expect_stdout_contains = ["56 42\n"]
timeout_ms = 10000

[[tests]]
name = "rules.saturation_then_the_pipeline_extracts"
desc = "A saturated program given to a back end is extracted by the pipeline with the default cost."
kind = "behavior"
case = "../../../cases/modules/rules/target.cml"
args = ["${case}", "simplify::tabled", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["56 42\n"]
timeout_ms = 10000

[[tests]]
name = "rules.check_accepts_rules_that_hold"
desc = "The check every rule passes before it enters a library (graph store decision 5): 100 random instances of the two sides agree bit for bit (the rules that need no permission), and the engine fires the rule on its own left side and gets a function that agrees too. Integer rules, a rule with const parameters, a rule from <=> and the float rules x + -0.0 and x * 1.0. Each line is a row of the verdict table: the verdict `sampled` (100 samples were compared and no solver established anything), the proposition `equality` (these rules ask for no permission) and the evidence `samples 100` (H247, slice S0). The old wording `ok ...: 100 samples agree` and the old words `FAIL`/`unchecked` are gone from the report."
kind = "behavior"
case = "../../../cases/modules/rules/check_rules.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["sampled add_zero: proposition equality, evidence samples 100, fired 8 of 8", "sampled mul_one: proposition equality, evidence samples 100, fired 8 of 8", "sampled combine: proposition equality, evidence samples 100, fired 8 of 8", "sampled swap: proposition equality, evidence samples 100, fired 8 of 8", "sampled minus_zero: proposition equality, evidence samples 100, fired 8 of 8", "sampled times_one: proposition equality, evidence samples 100, fired 8 of 8"]
expect_output_not_contains = ["refuted add_zero", "refuted mul_one", "refuted combine", "refuted swap", "refuted minus_zero", "refuted times_one", "proved ", "ok ", "unchecked "]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "rules.check_finds_rules_that_do_not_hold"
desc = "A rule that is not an equation (x * 2 => x + 2 differs at the integer limit), one that flips a sign, and x + 0.0 => x (it turns -0.0 into 0.0) are reported with the arguments where the two sides differ."
kind = "behavior"
case = "../../../cases/modules/rules/check_rules.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["refuted wrong: proposition equality, evidence counterexample, the two sides differ at (100): 200 and 102", "refuted sign: proposition equality, evidence counterexample, the two sides differ at (", "refuted plus_zero: proposition equality, evidence counterexample, the two sides differ at (-0): 0 and -0"]
expect_output_not_contains = ["ok ", "unchecked ", "FAIL "]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "rules.library_verdicts_are_exactly_these"
desc = "Every rule of the standard library enters the check with the verdict the table gives it, including one row per instance of a generic law: 200 random instances of a rule's two sides agree (or the engine fires the rule on its own left side and agrees), a conditional rule reports the instances its condition selects, and a rule the check cannot make a value for says so in its own reason column. The integer and floating laws are one generic law per fact since the fold (`when is_integer::<T>()`, `when is_float::<T>()`), and `check` walks their instances over the types the operator groups registered, filtered by the condition (the ruling of 2026-10-24 on `generic-rule-check-surface-and-multi-parameter-instances`, §1): `int_add_zero<int>` and `int_add_zero<i32>`, `float_mul_one<float>`/`<f32>`/`<bf16>`/`<f16>`, each under its own name. The old blanket `unchecked <name>: a generic rule, whose instances are not checked here` is gone from the report, and so is the word `unchecked`: a floating instance at `bf16`/`f16` is `sampled` with `evidence samples 200` like an f32 one: the sampler draws the two reduced-precision types as it draws any other floating element type -- the drawn value is rounded once into the element type, a tensor of either is two bytes per element -- and the comparison uses the element epsilon of the type the instance is at, bf16 2^-8 and f16 2^-10 apart from f32's (the ruling of 2026-10-23 on `docs/handover/reviews/questions-2026-10-23.md`, §check-generic-instance-space, 3, which opened that lane; `docs/handover/reviews/reduced-precision.md` item 2 for the scalars). The reason the check writes for a type it still cannot make a value of is unchanged and is pinned by `rules.check_names_the_type_it_cannot_make`. Every row names its proposition, which follows the permission the rule asks for (the ruling of 2026-10-24 on `verification-licence-to-precondition`, licence 2): the integer laws `equality`, the `reassociate` laws `real equality + IEEE on special values`, the accuracy laws `error bound`. NO rule of the library is `refuted` any more, and this entry pins the one the table used to refuse: `tensor_combine_mixed` is `sampled`, because a `reassociate` rule is compared where the real value is -- both sides evaluated in the reference's precision -- and not one element-type result against another (the ruling of 2026-10-24 on `verification-report-surface-s0`, correcting the method H247 measured: its `1e+30` sample, `c1 = 48`, `c2 = -47`, has two element-type results 27 ulps apart, `1.0000041e+30` and `1e+30`, and one real value; the reassociate contract is what the licence allows the rule's own roundings, not what the cancellation is measured against. Commutation and association are not rules to check any more: they are properties of the operator's declaration, read by the matcher (rewrite design 2 (second version) 6)."
kind = "behavior"
case = "../../../cases/modules/rules/check_library.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["sampled int_add_zero<int>: proposition equality, evidence samples 200, reason the condition selects the instances, so no sampled value was compared, the condition selects the instances, fired 64 of 64", "sampled int_distribute<int>: proposition equality, evidence samples 200, reason the condition selects the instances", "sampled float_add_minus_zero<float>: proposition equality, evidence samples 200, reason the condition selects the instances", "sampled float_add_minus_zero<bf16>: proposition equality, evidence samples 200, reason the condition selects the instances", "sampled float_add_minus_zero<f16>: proposition equality, evidence samples 200, reason the condition selects the instances", "sampled float_combine<float>: proposition real equality + IEEE on special values, evidence samples 200, reason the condition selects the instances", "sampled float_fold<f32>: proposition real equality + IEEE on special values, evidence samples 200, reason the condition selects the instances", "sampled float_double: proposition equality, evidence samples 200, reason the condition selects the instances", "sampled tensor_mul_one<f32>: proposition equality, evidence samples 200, reason the condition selects the instances, so no sampled value was compared, the condition selects the instances, fired 64 of 64", "sampled tensor_combine<f32>: proposition real equality + IEEE on special values, evidence samples 200, reason the condition selects the instances", "sampled tensor_combine_mixed<f32>: proposition real equality + IEEE on special values, evidence samples 200, reason the condition selects the instances, so no sampled value was compared, the condition selects the instances, fired 32 of 64", "refuted tensor_combine_mixed<f16>: proposition real equality + IEEE on special values, evidence counterexample", "refuted float_combine_mixed<f16>: proposition real equality + IEEE on special values, evidence counterexample, the rewritten left side differs at (10000.0, 39.0, -55.0): nan and -inf (bound 11 ulps, 0 relative, scale 100020001)", "sampled tensor_distribute<int>: proposition real equality + IEEE on special values, evidence samples 200, reason the condition selects the instances"]
expect_output_not_contains = ["ok ", "unchecked ", "a generic rule, whose instances are not checked here", "cannot make a value of type 'bf16'", "cannot make a value of type 'f16'"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000

[[tests]]
name = "rules.reduced_element_type_instances_are_checked"
desc = "The instances of a floating law at `bf16` and at `f16` are checked, not skipped: 200 values of each element type are drawn (rounded once into the element type, the way a literal and a written conversion round), the engine fires the law on its own left side and the two sides agree, so the row of `float_add_minus_zero<bf16>` and of `<f16>` reads `evidence samples 200` where it read `evidence none` and `the check cannot make a value of type 'bf16'` before, and the whole report contains that reason for neither type. `float_combine` is the second law: it asks for `reassociate`, so its two sides differ by a rounding and the comparison is the element type's own epsilon, bf16 2^-8 and f16 2^-10 (camel/core/operator_semantics.h, `elementEpsilon`; the ruling of 2026-10-23 on `docs/handover/reviews/questions-2026-10-23.md`, §check-generic-instance-space, 3: '误差界里的 epsilon 取元素类型的（bf16 是 2^-8，f16 是 2^-10）'), where an f32 epsilon would refute a legal reassociation and compare nothing at all would accept an illegal one. The `float` and `f32` instances of the same laws and the non-generic `float32_double` are pinned in the same table: their rows are what they were. The row count is pinned because the other way to make an instance quiet is to stop making it."
kind = "behavior"
case = "../../../cases/modules/rules/check_reduced_element_type.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["sampled float_add_minus_zero<bf16>: proposition equality, evidence samples 200", "sampled float_add_minus_zero<f16>: proposition equality, evidence samples 200", "sampled float_add_minus_zero<float>: proposition equality, evidence samples 200", "sampled float_add_minus_zero<f32>: proposition equality, evidence samples 200", "sampled float_combine<bf16>: proposition real equality + IEEE on special values, evidence samples 200", "sampled float_combine<f16>: proposition real equality + IEEE on special values, evidence samples 200", "sampled float_combine<float>: proposition real equality + IEEE on special values, evidence samples 200", "sampled float_combine<f32>: proposition real equality + IEEE on special values, evidence samples 200", "sampled float32_double: proposition equality, evidence samples 200", "rows 17"]
expect_output_not_contains = ["cannot make a value of type 'bf16'", "cannot make a value of type 'f16'", "refuted"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000

[[tests]]
name = "rules.check_names_the_type_it_cannot_make"
desc = "A law whose instance is at a type the sampler cannot make a value of is still `sampled` with `evidence none` and the reason naming that type -- `join::<string>` answers `the check cannot make a value of type 'string'`, where the type is the parameter's own and the reason is in the reason column, not in the verdict or the evidence (licence 3, option A, of the ruling of 2026-10-24 on `verification-licence-to-precondition`). The same call carries `float_add_self`, whose `bf16` and `f16` instances are checked with 200 values each, so the two answers are read side by side: making the two reduced-precision types drawable did not turn the undrawable types into a skip, a silent f32, or a value of some other type. This is the *no* half of the reduced-precision lane; `rules.reduced_element_type_instances_are_checked` is its *yes*."
kind = "negative"
case = "../../../cases/modules/rules/check_type_cannot_be_made.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["sampled join<string>: proposition equality, evidence none, reason the check cannot make a value of type 'string'", "sampled float_add_self<bf16>: proposition equality, evidence samples 200", "sampled float_add_self<f16>: proposition equality, evidence samples 200", "rows 5"]
expect_output_not_contains = ["refuted"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000

[[tests]]
name = "rules.pair_law_is_instantiated_per_type_pair"
desc = "A law written over two type parameters is a pair of types, not one: `pair_sum_self::<T, U>` (`(a + b) - b => a`) is one rule, and the engine instantiates it at the *pairs* of the program's own types, so the `int` site of `pair_target.cml` is rewritten by `pair_sum_self<int, int>` and the small one by `pair_sum_self<i32, i32>` (the ruling of 2026-10-23 on generic-rule-instantiation assumes one type per value, which left such a law with no instance at all: both rewrites were zero and the proof named nothing). The condition needs both parameters to be integers, so no pair of a floating or string type is an instance of this law at all."
kind = "behavior"
case = "../../../cases/modules/rules/pair_target.cml"
args = ["${case}", "generic_pair_law::counted", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["rewrites 2 rule pair_sum_self", "by pair_sum_self<int, int>", "by pair_sum_self<i32, i32>", "pair law\n3 5\n"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "rules.pair_law_instances_are_checked"
desc = "`check` enumerates the instances of a law of two type parameters over the product of the types the operator groups registered, filtered by the condition at the type level (the ruling of 2026-10-24 on `generic-rule-check-surface-and-multi-parameter-instances`): `pair_sum_self` has exactly the two instances of the integer pairs, each named with its tuple, and the pairs the condition rejects -- `float`, `bf16`, `string`, everything -- are not instances of this law and are not reported. The old blanket `unchecked pair_sum_self: a generic rule, whose instances are not checked here` is gone, and so is the arity complaint the maker used to answer with."
kind = "behavior"
case = "../../../cases/modules/rules/pair_target.cml"
args = ["${case}", "generic_pair_law::checked", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["sampled pair_sum_self<int, int>: proposition equality, evidence samples 200, reason the condition selects the instances, so no sampled value was compared, the condition selects the instances, fired 64 of 64", "sampled pair_sum_self<i32, i32>: proposition equality, evidence samples 200, reason the condition selects the instances, so no sampled value was compared, the condition selects the instances, fired 64 of 64"]
expect_output_not_contains = ["refuted", "a generic rule, whose instances are not checked here", "it takes 2 type parameter", "unchecked pair_sum_self"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "rules.pair_law_no_instance_says_the_body_reason"
desc = "`why_not` asked about a value of a type no instance of a two-parameter law can hold answers with the reason the *body* gave -- here the string value of `pair_target.cml`'s `greet`, whose `-` takes no string -- and not with how many type parameters the rule takes (the ruling of 2026-10-23 on `generic-rule-instantiation-set-and-predicate`, §3: a failed instantiation is quiet, and `why_not` is where the reason is read). The question gives one value, so the type tuples that could hold it are the pairs of the registered types with a `string` at either position, and the answer names the first of them that did not come about. Before this, the maker answered `it takes 2 type parameter(s), and it was asked for 1`, which says nothing about the law."
kind = "behavior"
case = "../../../cases/modules/rules/pair_target.cml"
args = ["${case}", "generic_pair_law::why_no_instance", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["pair_sum_self<string, string>` is the first", "operator '-' is not defined for these operand types"]
expect_output_not_contains = ["it takes 2 type parameter(s)"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "rules.check_bound_follows_the_permission"
desc = "The check takes the error bound of the permission a rule needs, not one uniform bound (design principles 7.2-7.4): the same wrong equation (x*2.0 => x*2.000000001, about 5e-10 relative) is rejected under reassociate, whose proposition is real equality and whose permission covers a rounding of the result -- 5e-10 is far outside it -- and accepted under change_precision, whose bound is bf16's 2^-8 per step. A looser uniform bound would hide the first rule."
kind = "behavior"
case = "../../../cases/modules/rules/check_bound.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["refuted wrong_reassociate: proposition real equality + IEEE on special values, evidence counterexample, the two sides differ at (", "sampled wrong_precision: proposition error bound, evidence samples 40, fired 8 of 8"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "rules.a_reassociate_rule_is_compared_in_the_higher_precision"
desc = "A rule that asks for `reassociate` or `contract` is compared where the real value is: both sides evaluated in the reference's precision, never one element-type result against another (the ruling of 2026-10-24 on `verification-report-surface-s0`, which corrected the method the library's `tensor_combine_mixed` was refused by). `x*48 + x*(-47) => x*1` at the sample the check draws (`x = 1e+30`) has two element-type results 27 ulps of the result apart -- `1.0000041e+30` against `1e+30`, far outside the 11 the reassociate contract allows -- and one real value, so the rule is right and the verdict is `sampled`. The other three rules pin the half of the proposition that still refuses: two sides whose real values agree but whose special values differ bit for bit (a NaN against a zero at `x = 1e+30`, and two zeros of different sign) are `refuted`, and the same zero law with `no_signed_zeros` asked for is `sampled`."
kind = "behavior"
case = "../../../cases/modules/rules/check_real_equality.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["at x = 1e+30 1.0000041e+30 1e+30", "sampled real_cancel: proposition real equality + IEEE on special values, evidence samples 200, fired 8 of 8", "refuted overflow_to_nan: proposition real equality + IEEE on special values, evidence counterexample, the two sides differ at (1.0000000150474662e+30): -nan and 0 (a special value is not the same bit for bit)", "refuted zero_sign: proposition real equality + IEEE on special values, evidence counterexample, the two sides differ at (1.0000000031710769e-30): -0 and 0 (a zero of the other sign is a different bit pattern)", "sampled zero_sign_licensed: proposition real equality + IEEE on special values, evidence samples 200, fired 8 of 8"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 40000

[[tests]]
name = "rules.every_verdict_line_wears_a_verdict_word"
desc = "The check answers a verdict table, and every line of its rendering begins with one of the three verdict words -- `proved`, `refuted`, `sampled` -- and names what the verdict is about in a fixed column and what it rests on in another (the rulings of 2026-10-24 on `verification-verdict-surface`, 2, and on `verification-licence-to-precondition`, licence 2). A rule that needs no permission is a claim of bit-for-bit `equality`; a rule that asks for `reassociate` claims `real equality + IEEE on special values`; one that asks for `refine_accuracy` claims an `error bound`. Evidence is `samples <n>` where samples were compared, `counterexample` where a value is the witness, and `none` where nothing could be compared -- and in that last case the reason is written in its own column, so a `sampled` that sampled is never read as one that did not (licence 3, option A). The fourth word the check used to print is gone from the report, and no line of it says `proved`: with no solver in the build, comparing samples is all that happened."
kind = "behavior"
case = "../../../cases/modules/rules/verify_report.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["sampled holds: proposition equality, evidence samples 100", "refuted differ: proposition equality, evidence counterexample, the two sides differ at (", "sampled anywhere: proposition equality, evidence none, reason no numeric bound", "sampled fold: proposition real equality + IEEE on special values, evidence samples 100", "sampled near_zero: proposition error bound, evidence samples 100"]
expect_output_not_contains = ["ok ", "unchecked ", "proved "]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 40000

[[tests]]
name = "rules.the_table_reads_column_by_column"
desc = "The report is a table of rows, not a string: each row carries its rule, its instance (a generic law's type tuple, empty otherwise), its verdict, its proposition and its evidence or reason, and the readers answer one column of one row at a time (the ruling of 2026-10-24 on `verification-verdict-surface`, 2: `CheckReport` rows carry `rule`, `instance`, `verdict`, `proposition` and `evidence`). The rendering and the columns are the same table read two ways: `check_text` is the rendering of the rows the readers answer. A row the report does not have is an error value, not an empty string (`check_rule(r, 5)` on a five-row report fails with `IndexError`)."
kind = "behavior"
case = "../../../cases/modules/rules/verify_report.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["rows 5", "0 sampled equality samples 100 [  ]", "1 refuted equality counterexample [  ]", "2 sampled equality none [ no numeric bound ]", "3 sampled real equality + IEEE on special values samples 100 [ fold ]", "4 sampled error bound samples 100 [  ]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 40000

[[tests]]
name = "rules.the_rule_and_instance_columns_are_separate"
desc = "A row's `rule` column is the law's own name and its `instance` column is the type tuple the instance was made at, not one string twice (the ruling of 2026-10-24 on `verification-verdict-surface`, 2). The engine names an instance of a generic law `int_add_zero<int>`; the row says `int_add_zero` in one column and `int` in the other, and the rendering puts them back together, so the name the report shows is still the one the engine, `explain` and the old report use. The two instances of the integer family are read this way: `int_add_zero` at `int` and at `i32`."
kind = "behavior"
case = "../../../cases/modules/rules/verify_report_instance.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["rows 2", "row 0 | int_add_zero | int | sampled", "row 1 | int_add_zero | i32 | sampled"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "rules.a_row_the_report_does_not_have_is_an_error"
desc = "Reading a column of a row the report does not have is an error value (`IndexError`, naming the count), not an empty string that would read like a row whose reason is empty (the ruling of 2026-10-24 on `verification-verdict-surface`, 2: the table is the report's data model, and reading it wrongly is a fault of the reader, not silence)."
kind = "negative"
case = "../../../cases/modules/rules/verify_report_row.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["IndexError", "the report has 1 row(s), and row 1 was asked for"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

#  ---- The translation layer (slice S1): a rule's two sides as integer scalar terms, and the
# ---- declaration of what the layer covers (rewrite design 8.1).

[[tests]]
name = "rules.the_translation_boundary_is_a_declared_table"
desc = "The translation layer's coverage is a value, not a paragraph: `check_coverage_table` answers the widths it translates (`int`, `i32`), the widths the design lists beside them and it does not translate yet (`float`, `f32`, `bf16`, `f16` -- asked of the floating family, so the two reduced-precision widths are not silently left out), the twelve integer operators it translates, what integer division and remainder mean (the fault at a zero divisor is part of the term, design 1.8: the language has no undefined behaviour), what is beyond translation coverage, and that a rule's condition is not a premise yet (S4). Rewrite design 8.1 asks for the coverage set to be declared; a declaration that lives only in a design document drifts from the code, so this one is read out of the code and pinned line by line."
kind = "behavior"
case = "../../../cases/modules/rules/verify_translate.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
