args = ["${case}", "rules::saturate_all", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["tensor([      8.,      16.,      24.], dtype=float32)"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "rules.strict_policy_refuses_reassociation"
desc = "The numeric policy of the rewrite pass is its own parameter (design principles 7.4, 7.5): `rules::simplify` grants the default permissions and folds x*3 + x*5 into x*8 (0 adds, 1 product), and the exact doubling law fires under both policies."
kind = "behavior"
case = "../../../cases/modules/rules/strict_target.cml"
args = ["${case}", "strict_target::report", "rules::simplify", "strict_target::report", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["combine 1 2\ndouble 1 2\ncombine 0 1\ndouble 0 1\n"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "rules.strict_policy_keeps_exact_laws"
desc = "The same program under `rules::simplify_strict`, which grants no permission: the reassociating combine does not fire (1 add, 2 products), while the exact doubling still does (0 adds, 1 product). A uniform policy would either hide the second law or let the first fire."
kind = "behavior"
case = "../../../cases/modules/rules/strict_target.cml"
args = ["${case}", "strict_target::report", "rules::simplify_strict", "strict_target::report", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["combine 1 2\ndouble 1 2\ncombine 1 2\ndouble 0 1\n"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "rules.strict_saturation_runs"
desc = "The strict saturation, the two-way pass with the same policy parameter, runs and preserves the values of the program."
kind = "behavior"
case = "../../../cases/modules/rules/strict_target.cml"
args = ["${case}", "rules::saturate_all_strict", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["16.0 12.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000
[[tests]]
name = "rules.element_bare_term_laws"
desc = "The bare-operand coefficient law on the four element families, in both orders: `x*3 + x` becomes `x*4` (one product, no addition, the counts go from 1 add and 1 product to 1 product), the i32 sum wraps as the program's does (2147483647 + 1 is INT_MIN), and the guards keep what they are about: `c = -1` (whose sum is zero), a mixed pair without the finite_math grant (1 add and 1 product stay), and the same pair with the grant, which folds."
