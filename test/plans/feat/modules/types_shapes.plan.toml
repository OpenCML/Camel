id = "modules.types_shapes"
order = 1002
tier = "fast"
tags = ["feat", "modules", "types", "match-type"]
desc = "The shapes `match type` names beside struct, tuple and func (array, nullable, fallible, map, set) and the predicates of `types` over them"

[[tests]]
name = "types_shapes.values"
desc = "Each shape word selects exactly its family (an array of any rank, `T?`, `T!`, a map, a set), a struct, a tuple and a function keep theirs, a scalar is a leaf, `#leaf` still takes every type no shape took, and the predicates agree. Four schedulers."
kind = "behavior"
case = "../../../cases/modules/types/shapes.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "array array nullable fallible\nmap set struct\ntuple func leaf\ncollection collection other composite\ntrue false true false\ntrue false true false\ntrue false\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "types_shapes.identity_after_shape"
desc = "An identity pattern after the shape that selects it (`case map`, then `case Map<string, int>`) is StaticMatchPatternCannotMatch."
kind = "negative"
case = "../../../cases/modules/types/shape_after_shape.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::StaticMatchPatternCannotMatch"
expect_diagnostic_line = 5
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000
