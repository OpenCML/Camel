id = "modules.array_reduction_kernels"
order = 378
tier = "fast"
tags = ["feat", "modules", "stdlib", "precision", "profile"]
desc = "`array::sum`, `min` and `max` have native kernels of the `array` executor (design principles 10.4). Each kernel answers what the Camel body beside it says, and a floating-point reduction still accumulates in f64 and rounds once into the element type (7.3). The kernel is one body-less declaration per element type, each naming its own element type's operator (`array:sum_i` for `i32`, `array:sum_d` for `float`, ...) and admitting exactly that element type with its own `when`, so the element type is known where the executor is chosen and no run-time switch on it is left; an element type no declaration admits (a complex one) keeps the body."

# The values, on vectors whose per-step f32 fold, f64 accumulation and one rounding are told apart,
# over every element type the kernels have an executor for, with the two non-numeric ordered types
# too.

[[tests]]
name = "array_reduction_kernels"
desc = "The kernel and the Camel body agree on every element type: `sum` over int, i32, f32, f64, f16 and bf16, `min` and `max` over f32 and f16. An f32 array of 2^24 then 1025 ones answers 16778240 (the f64 sum 16778241 rounded once, ties to even) where a per-step f32 accumulator answers 16777216; an f32 array of 2^24 and 0.5 answers the even 16777216 with an exact f64 sum of 16777216.5; an f16 array of 32768, 1 and 1.5 (exact sum 32770.5, the midpoint between 32770 and 32772) answers 32770, and the same array with 1 and 0.5 (exact sum 32769.5, the midpoint between 32769 and 32770) answers 32770 as well — 32768 there would mean the kernel rounded through f32. NaN on either side of `min`/`max` gives NaN, -0 is below +0 (the bytes of the results), a `string[]` gives 'apple' and 'pear', and a `bool[]` gives false and true. An empty array gives +0 for `sum` and null for `min` and `max`. The values are the same on all four back ends."
kind = "behavior"
case = "../../../cases/modules/stdlib/array_reduction_kernels.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "sum {} 16778240.0\nf64 {} 16778241.0\nrounded {} 16778240.0\nstepwise {} 16777216.0\nmidpoint {} 16777216.5\nf16 {} {} 32770.0 32770.0\nbf16 {} 32800.0\nbody {}/6 6\nrounds-once {} {} true true\nties {} {} true true\nnan {} {} true true\nzeros {} {} true true\nhalfzeros {} {} {} true true true\nminmax {} {} true true\nordered {}/4 4\nempty {} true\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "array_reduction_kernels.paths"
desc = "In that run `std::profile` counts each element type's own kernel apart, and the Camel body's own reduce as well: the integer and floating-point reductions take different declarations, and `:mark/reduce_arr` counts the folds the case writes out, the per-step f32 and f64 accumulations, the widening maps and the `#impl` bodies that no call reached. A compiler that ran the body for the direct calls as well would count the fallbacks' reduce calls; one whose kernels did not run would not show the `array:` rows at all; and a compiler that gave the instances one executor to switch on the element type inside could not show one row per element type."
kind = "behavior"
case = "../../../cases/modules/stdlib/array_reduction_kernels.cml"
args = ["${case}", "std::profile top=0 json=\"${test_tmp}/profile.json\"", "std::nvm"]
expect_exit = 0
verify_script = """
async ({ input, assert }) => {
    const fs = await import('node:fs')
    const report = JSON.parse(fs.readFileSync(input.test_tmp + '/profile.json', 'utf8'))
    const calls = Object.fromEntries(report.operator_rows.map(row => [row.uri, row.calls]))
    const shown = JSON.stringify(calls)
    // One row per element type, and no row for a reduction as a whole: this is what says the
    // element type was known where the executor was chosen rather than switched on inside it.
    const expected = {
        'array:sum_i': 1, 'array:sum_l': 2, 'array:sum_f': 3, 'array:sum_d': 1,
        'array:sum_bf': 5, 'array:sum_f6': 2,
        'array:min_l': 1, 'array:min_f': 4, 'array:min_bf': 3, 'array:min_f6': 4,
        'array:min_b': 2, 'array:min_s': 3,
        'array:max_l': 1, 'array:max_f': 4, 'array:max_bf': 3, 'array:max_f6': 3,
        'array:max_b': 2, 'array:max_s': 3,
    }
    for (const [uri, count] of Object.entries(expected)) {
        assert(calls[uri] === count, `${uri} ran ${calls[uri]} times, not ${count}: ${shown}`)
    }
    const reductionRows = Object.keys(calls).filter((uri) => /^array:(sum|min|max)(_|$)/.test(uri)).sort()
    const expectedRows = Object.keys(expected).sort()
    assert(JSON.stringify(reductionRows) === JSON.stringify(expectedRows),
        `the reduction rows are ${JSON.stringify(reductionRows)}, expected ${JSON.stringify(expectedRows)}: ${shown}`)
    assert(calls[':mark/reduce_arr'] === 22, `the body's reduce ran ${calls[':mark/reduce_arr']} times, not 22: ${shown}`)
    assert(input.normalized.stdout.includes('sum {} 16778240.0'), 'the program changed')
}
"""
timeout_ms = 60000

# ---- the three values can only come from the three paths ----

[[tests]]
name = "array_reduction_arms"
desc = "The rule's own case, over the module: `sum` over an `i32[]` is answered by the declaration for `is_elem_i32` (`array:sum_i`, 6), `sum` over a `float[]` by the declaration for `is_elem_f64` (`array:sum_d`, 4.0), and `sum` over a `c64[]` — which no declaration admits — by the body, whose complex arm gives (1 + 2i) + (3 + 4i) = 4 + 6i. A compiler that gave the complex instance an executor prints a number instead, and one that answered `i32` and `float` from a single declaration cannot produce both."
kind = "behavior"
case = "../../../cases/modules/stdlib/array_reduction_arms.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "i32 {} 6\nfloat {} 4.0\ncomplex {} 4+6i\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "array_reduction_complex_reduce"
desc = "The body's complex arm, written out with no array-module reduction in the program: `:mark/reduce_arr` with a `c64` accumulator over a `c64[]` gives `4+6i` on every back end. The case is kept because it measures that reduce on its own: the two bytecode VMs used to die by signal at it — a loop asked whether a compact element is one slot by its width alone, read the eight bytes of `1 + 2i` as one slot, and handed the complex operator 0x400000003F800000 where a `Complex *` is due — and a fix in the VMs and a change that hides the path are still told apart here."
kind = "behavior"
case = "../../../cases/modules/stdlib/array_reduction_complex_reduce.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "before\nreduce {} 4+6i\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "array_reduction_arms.paths"
desc = "The same run under `std::profile`: each element type is answered by its own declaration and by no other. The integer call runs `array:sum_i` once and the float call `array:sum_d` once, while the complex call has no kernel row at all and reaches the body's `reduce`. A compiler with one executor per reduction switching on the element type inside shows one row for all three calls; one that gave the complex instance an executor counts an `array:sum_*` row three times."
kind = "behavior"
case = "../../../cases/modules/stdlib/array_reduction_arms.cml"
args = ["${case}", "std::profile top=0 json=\"${test_tmp}/profile.json\"", "std::nvm"]
expect_exit = 0
verify_script = """
async ({ input, assert }) => {
    const fs = await import('node:fs')
    const out = input.normalized.stdout
    const lines = out.split('\n')
    assert(lines[0] === 'i32 {} 6' && lines[1] === 'float {} 4.0' && lines[2] === 'complex {} 4+6i', `the values changed:\n${out}`)
    const report = JSON.parse(fs.readFileSync(input.test_tmp + '/profile.json', 'utf8'))
    const calls = Object.fromEntries(report.operator_rows.map(row => [row.uri, row.calls]))
    const shown = JSON.stringify(calls)
    assert(calls['array:sum_i'] === 1, `the integer kernel ran ${calls['array:sum_i']} times, not once: ${shown}`)
    assert(calls['array:sum_d'] === 1, `the float kernel ran ${calls['array:sum_d']} times, not once: ${shown}`)
    const sumRows = Object.keys(calls).filter((uri) => uri.startsWith('array:sum')).sort()
    assert(JSON.stringify(sumRows) === JSON.stringify(['array:sum_d', 'array:sum_i']),
        `the sum rows are ${JSON.stringify(sumRows)}, expected exactly the two kernels: ${shown}`)
    // The complex call has no kernel: it runs the body, whose reduce is the only `sum` path left
    // for an element type no declaration admits.
    assert(calls[':mark/reduce_arr'] === 1, `the body's reduce ran ${calls[':mark/reduce_arr']} times, not once: ${shown}`)
}
"""
timeout_ms = 60000

# ---- the spelling that would need the run-time switch is refused ----

[[tests]]
name = "array_sum_kernel_overlap"
desc = "Two same-named body-less declarations of a reduction whose conditions are not mutually exclusive are refused where the second is written, and the report names the type both hold for and both declarations. `is_integer::<T>()` covers `i32` and `int` and `is_numeric::<T>()` covers those and the floating-point and complex types, so `i32` satisfies both and no order of the declarations could decide a call with an `i32[]`. This is the spelling the array module does not use: it names one element type per declaration (`is_elem_i32::<T>()`), which is what its one executor per element type takes."
kind = "negative"
case = "../../../cases/compile/native/array_sum_kernel_overlap.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::WhenDeclarationOverlap"
expect_diagnostic_code = "0x030001E0"
expect_output_contains = ["array_sum_kernel_overlap.cml:22", "Two declarations of 'sum_kernel' both apply to the type 'int'", "(xs: T[]) => T — when is_integer::<T>()", "(xs: T[]) => T — when is_numeric::<T>()"]
timeout_ms = 20000