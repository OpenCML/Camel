id = "modules.pass_as_value"
order = 379
tier = "fast"
tags = ["feat", "modules", "pass", "module"]

# A pass is a function value: its declaration in `stdlib/std.cml` gives it a type, so a program
# may name it the way it names any function of the library. Taking the value and giving it to
# nothing is silent -- the declaration resolved -- and a name the module does not export is still
# refused. Calling one is the next step (internal/plans/2026-11-26-pass-as-function), and the
# kernel reports it as an internal error there rather than pretending the pass ran.

[defaults]
kind = "behavior"
case = "../../../cases/modules/pass_as_value/take_cse.cml"
timeout_ms = 20000
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths", "trim_trailing_space"]

[[tests]]
name = "value.taken_and_not_called"
desc = "A program names the pass `std::cxx::cse` as a value and never calls it: the declaration resolves, nothing is reported, the program runs."
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_output_not_contains = ["not exported", "is declared as imported", "PassInternalError"]

[[tests]]
name = "value.unknown_name_refused"
desc = "`std::cxx::nope` is not a pass `namespace cxx` declares, and naming it is refused as a name the module does not export."
kind = "negative"
case = "../../../cases/modules/pass_as_value/unknown_name.cml"
args = ["${case}", "std::nvm"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ImportNameNotExported"
expect_output_contains = ["Reference 'std::cxx::nope' is declared as imported but is not exported by its module"]
