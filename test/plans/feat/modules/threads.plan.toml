# The process's own thread count, read from the operating system (`process.thread_count`), after a
# whole-work library product and a batched product have created every pool the run will have. At
# `-t 1` the run is the caller alone; at 4, 8 and 16 the tensor pool's workers are the only others.
# Before the library's constructor had already created 31 threads at `-t 1`, so all four cases
# were red by a wide margin.

[[tests]]
name = "pools.cli_one"
desc = "`-t 1` creates exactly one worker: the process has one thread, the caller, after the library and the batch have run."
kind = "behavior"
case = "../../../cases/modules/tensor/thread_pools.cml"
args = ["-t", "1", "${case}", "tensor::fuse", "std::fvm"]
expect_exit = 0
expect_stdout_exact = "thread_pools threads=1 budget=1\n"

[[tests]]
name = "pools.cli_four"
desc = "`-t 4` has four threads: the caller and three pool workers, and no library pool."
kind = "behavior"
case = "../../../cases/modules/tensor/thread_pools.cml"
args = ["-t", "4", "${case}", "tensor::fuse", "std::fvm"]
expect_exit = 0
expect_stdout_exact = "thread_pools threads=4 budget=4\n"

[[tests]]
name = "pools.cli_eight"
desc = "`-t 8` has eight threads: the caller and seven pool workers, and no library pool."
kind = "behavior"
case = "../../../cases/modules/tensor/thread_pools.cml"
args = ["-t", "8", "${case}", "tensor::fuse", "std::fvm"]
expect_exit = 0
expect_stdout_exact = "thread_pools threads=8 budget=8\n"

[[tests]]
name = "pools.cli_sixteen"
desc = "`-t 16` has sixteen threads: the caller and fifteen pool workers. A library pool would put the count above the budget, which is the failure this case pins."
kind = "behavior"
case = "../../../cases/modules/tensor/thread_pools.cml"
args = ["-t", "16", "${case}", "tensor::fuse", "std::fvm"]
expect_exit = 0
expect_stdout_exact = "thread_pools threads=16 budget=16\n"
