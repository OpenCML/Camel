id = "modules.threads"
order = 363
tier = "fast"
tags = ["feat", "modules", "tensor", "threads"]
desc = "`-t` sets the tensor pool as it sets the scheduler -- under `--timeit` as in an ordinary run -- `CAMEL_NUM_THREADS` is gone, and the thread count changes no value: the pool reports the number the run was given, the default is the hardware concurrency, the GEMM spends the run's number on the tensor pool and splits a whole-work product's rows over it (each library call one thread, reported separately, so the process has no second pool and its threads stay within `-t`), and a reduction and a GEMM produce the same bits at one thread, at four and at eight"

# The value of record is the run's `-t` (EntryConfig::maxThreads); the tensor module installs it
# into its kernel pool when it loads, and without `-t` every pool uses the machine's core count.
# The programs check the number the pool reports (`num_threads`) themselves and exit 1 on a
# mismatch, so the exit code is an assertion about the pool, not a wall-clock guess. The
# `CAMEL_NUM_THREADS` cases pin the retirement of the environment variable: setting it changes
# neither the reported count nor the output.
#
# What makes these cases red: a pool that does not take the run's number, as the tensor pool did
# while it read CAMEL_NUM_THREADS and otherwise the hardware count. `count.cli_one` then reports
# the hardware count and exits 1; `count.default_hardware` and `count.env_ignored` go red as soon
# as that default is not the hardware count; `values.cli_four` goes red if the GEMM or the
# reduction reassociates with the thread count, because the whole stdout must equal the one of
# `values.cli_one`.

[defaults]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000

[[tests]]
name = "count.cli_one"
desc = "`-t 1` reaches the tensor pool: `num_threads()` reports 1."
kind = "behavior"
case = "../../../cases/modules/tensor/thread_count.cml"
args = ["-t", "1", "--arg", "expected=1", "${case}", "std::fvm"]
expect_exit = 0
expect_stdout_exact = "threads=1 expected=1\n"

[[tests]]
name = "count.cli_four"
desc = "`-t 4` reaches the tensor pool: `num_threads()` reports 4, not the hardware count."
kind = "behavior"
case = "../../../cases/modules/tensor/thread_count.cml"
args = ["-t", "4", "--arg", "expected=4", "${case}", "std::fvm"]
expect_exit = 0
expect_stdout_exact = "threads=4 expected=4\n"

[[tests]]
name = "count.default_hardware"
desc = "Without `-t` the pool reports the hardware concurrency: the program compares `num_threads()` with `process.cpu_count()`, the same machine, and fails if they differ."
kind = "behavior"
case = "../../../cases/modules/tensor/thread_count.cml"
args = ["--arg", "expected=0", "${case}", "std::fvm"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const m = /^threads=([0-9]+) expected=([0-9]+)$/.exec(input.normalized.stdout.trim())
assert(m !== null, 'no thread-count line: ' + input.normalized.stdout)
assert(Number(m[1]) === Number(m[2]), 'the pool reports ' + m[1] + ', the machine has ' + m[2])
assert(Number(m[1]) >= 1, 'the pool reports ' + m[1])
}
"""

[[tests]]
name = "count.env_ignored"
desc = "`CAMEL_NUM_THREADS=1` without `-t` changes nothing: the pool still reports the hardware concurrency, so the retired variable cannot override the CLI or the default."
kind = "behavior"
case = "../../../cases/modules/tensor/thread_count.cml"
args = ["--arg", "expected=0", "${case}", "std::fvm"]
envs = ["CAMEL_NUM_THREADS=1"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const m = /^threads=([0-9]+) expected=([0-9]+)$/.exec(input.normalized.stdout.trim())
assert(m !== null, 'no thread-count line: ' + input.normalized.stdout)
assert(Number(m[1]) === Number(m[2]), 'the pool reports ' + m[1] + ', the machine has ' + m[2])
assert(Number(m[1]) >= 1, 'the pool reports ' + m[1])
}
"""

[[tests]]
name = "count.cli_wins_over_env"
desc = "With both set the command line is the one that counts: `-t 4` and `CAMEL_NUM_THREADS=1` report 4. The environment variable is no longer read."
kind = "behavior"
case = "../../../cases/modules/tensor/thread_count.cml"
args = ["-t", "4", "--arg", "expected=4", "${case}", "std::fvm"]
envs = ["CAMEL_NUM_THREADS=1"]
expect_exit = 0
expect_stdout_exact = "threads=4 expected=4\n"

# `--timeit` builds its own Context for every iteration (tools/camel-cli/timeit.cpp), and until
# it built it without `EntryConfig::maxThreads`: the flag was accepted and the pools of the
# timed run took the machine's core count instead, so `camel -t 4 --timeit std::prl/1 ...` measured
# a width nobody asked for. The two cases below pin the flag on that path, and each one's assertion
# prints the number the timed run actually saw, so a red names it. What they read is not a time:
# `num_threads()` is the tensor pool's size, which the module installs from `Context::threadLimit()`
# -- the same field the timed pass's own executor is built from (taskflow.h: `workerCount` ->
# `ctx->threadLimit()`) -- and `thread_count()` is the operating system's count of the process's
# threads. A pool that kept the hardware width fails on the printed number, on any machine whose
# core count is not the one `-t` wrote.

[[tests]]
name = "count.timeit_cli_four"
desc = "`-t 4` reaches the pool a `--timeit` run uses: with `--timeit std::prl/1` the program still reports `num_threads()` 4, not the machine's core count."
kind = "behavior"
case = "../../../cases/modules/tensor/thread_count.cml"
args = ["-t", "4", "--timeit", "std::prl/1", "--arg", "expected=4", "${case}", "std::prl"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const m = /^threads=([0-9]+) expected=([0-9]+)$/m.exec(input.normalized.stdout)
assert(m !== null, 'no thread-count line: ' + input.normalized.stdout)
assert(Number(m[1]) === 4, 'the pool of the timed run reports ' + m[1] + ', the run gave 4')
}
"""

[[tests]]
name = "count.timeit_cli_one_serial"
desc = "`-t 1` under `--timeit` is a serial run: one timed iteration of `std::fvm` on one thread leaves the process with one thread (the caller) and the pool reports 1."
kind = "behavior"
case = "../../../cases/modules/tensor/thread_pools.cml"
args = ["-t", "1", "--timeit", "std::fvm/1", "${case}", "std::fvm"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const m = /^thread_pools threads=([0-9]+) budget=([0-9]+)$/m.exec(input.normalized.stdout)
assert(m !== null, 'no thread-pool line: ' + input.normalized.stdout)
assert(Number(m[2]) === 1, 'the pool of the timed run reports ' + m[2] + ', the run gave 1')
assert(Number(m[1]) === 1, 'the timed run is serial with ' + m[1] + ' thread(s)')
}
"""

[[tests]]
name = "values.cli_one"
desc = "Reference run: at `-t 1` a column-sum reduction and a GEMM print the SHA-256 of their payloads. The program also checks that the pool reports 1."
kind = "behavior"
case = "../../../cases/modules/tensor/thread_values.cml"
args = ["-t", "1", "--arg", "expected=1", "${case}", "std::fvm"]
expect_exit = 0
expect_stdout_contains = ["reduction=", "product="]

[[tests]]
name = "values.cli_four"
desc = "The same reduction and GEMM at `-t 4` are bit-identical to the run at `-t 1`: the whole normalised stdout agrees byte for byte. Both kernels split their output between workers and keep each accumulator's order, so the relation is exact; no tolerance is involved."
kind = "differential"
case = "../../../cases/modules/tensor/thread_values.cml"
args = ["-t", "4", "--arg", "expected=4", "${case}", "std::fvm"]
expect_exit = 0
compare_to = "values.cli_one"
compare_fields = ["exit_code", "stdout_normalized"]

[[tests]]
name = "values.cli_four_env"
desc = "The same four-thread run with `CAMEL_NUM_THREADS=1` in the environment: still four threads (the program fails otherwise) and bit-identical to the one-thread run, so the retired variable changes neither the pool's size nor a value."
kind = "differential"
case = "../../../cases/modules/tensor/thread_values.cml"
args = ["-t", "4", "--arg", "expected=4", "${case}", "std::fvm"]
envs = ["CAMEL_NUM_THREADS=1"]
expect_exit = 0
compare_to = "values.cli_one"
compare_fields = ["exit_code", "stdout_normalized"]

[[tests]]
name = "values.cli_eight"
desc = "The same reduction and GEMM at `-t 8` are bit-identical to the run at `-t 1`. The product stays on the canonical algorithm (33M multiply-adds, below the library's 2^30 shape threshold), which splits its output tiles over the pool and keeps every accumulator's order, so the relation is exact equality at every thread count, not a tolerance."
kind = "differential"
case = "../../../cases/modules/tensor/thread_values.cml"
args = ["-t", "8", "--arg", "expected=8", "${case}", "std::fvm"]
expect_exit = 0
compare_to = "values.cli_one"
compare_fields = ["exit_code", "stdout_normalized"]

# The library GEMM's own pool is one thread (gemm.cpp): the tensor pool spends the run's
# budget, and a second pool beside it competed for the same cores on a loaded host (measured
# the uncapped library losing to the canonical kernel from four threads up). So a whole-work
# product splits its output rows over the tensor pool, one library thread per chunk: `plain` is
# the run's number again (rows only, every output element's sum stays inside one call), while
# `plain_lib` is the one thread each library call got. A batched product's calls take one thread
# each while the pool spreads the batch. The program prints the counts each product actually had
# (`gemm_threads`, `gemm_library_threads`) and exits non-zero when they are not those; a wall
# clock takes no part in it.
#
# The contract that came back: before `plain` had to equal `-t`, because the library took the
# whole budget for a whole-work product; with the library capped to one thread `plain` was 1 at
# every `-t` (that was the price of one pool); with the rows split over the pool `plain` is the
# run's number again, and the library's one thread is reported separately (`plain_lib`), not folded
# into it. A build without a CBLAS forwards the library path to the canonical kernel, which splits
# over the pool and reports 0 library threads; the script holds each number to what that build can
# honestly report, decided by `gemm_library()`.
#
# What makes these cases red: a pool that reports a number other than `-t`, a whole-work product
# that reports fewer chunks than the run gave it, a library call wider than one, a batch region
# that leaves the library more than one thread, and a process with more threads than `-t`
# (`pools.*`, which counts them at the operating system).

[[tests]]
name = "gemm_budget.cli_one"
desc = "At `-t 1` the whole-work product runs one library call on one thread and the batch of four takes one thread per call: `gemm_threads` reports 1, `gemm_library_threads` 1, for both."
kind = "behavior"
case = "../../../cases/modules/tensor/gemm_threads.cml"
args = ["-t", "1", "--arg", "expected=1", "${case}", "tensor::fuse", "std::fvm"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const m = /^gemm_threads pool=(\d+) plain=(\d+) plain_lib=(\d+) batched=(\d+) batched_lib=(\d+) expected=(\d+) library=(\S+)$/.exec(input.normalized.stdout.trim())
assert(m !== null, 'no gemm_threads line: ' + input.normalized.stdout)
assert(Number(m[1]) === Number(m[6]), 'the pool reports ' + m[1] + ', the run gave ' + m[6])
assert(Number(m[2]) === Number(m[6]), 'the whole-work product reports ' + m[2] + ', the run gave ' + m[6])
assert(Number(m[3]) === (m[7] === 'cblas' ? 1 : 0), 'the whole-work product reports ' + m[3] + ' library threads with library=' + m[7])
assert(Number(m[4]) === 1, 'the batched product reports ' + m[4] + ' threads per call')
assert(Number(m[5]) === (m[7] === 'cblas' ? 1 : 0), 'the batched product reports ' + m[5] + ' library threads with library=' + m[7])
}
"""

[[tests]]
name = "gemm_budget.cli_four"
desc = "At `-t 4` the whole-work product splits over four pool chunks, each a one-thread library call: `gemm_threads` reports 4 and `gemm_library_threads` 1, while the batch's calls take one thread each."
kind = "behavior"
case = "../../../cases/modules/tensor/gemm_threads.cml"
args = ["-t", "4", "--arg", "expected=4", "${case}", "tensor::fuse", "std::fvm"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const m = /^gemm_threads pool=(\d+) plain=(\d+) plain_lib=(\d+) batched=(\d+) batched_lib=(\d+) expected=(\d+) library=(\S+)$/.exec(input.normalized.stdout.trim())
assert(m !== null, 'no gemm_threads line: ' + input.normalized.stdout)
assert(Number(m[1]) === Number(m[6]), 'the pool reports ' + m[1] + ', the run gave ' + m[6])
assert(Number(m[2]) === Number(m[6]), 'the whole-work product reports ' + m[2] + ', the run gave ' + m[6])
assert(Number(m[3]) === (m[7] === 'cblas' ? 1 : 0), 'the whole-work product reports ' + m[3] + ' library threads with library=' + m[7])
assert(Number(m[4]) === 1, 'the batched product reports ' + m[4] + ' threads per call')
assert(Number(m[5]) === (m[7] === 'cblas' ? 1 : 0), 'the batched product reports ' + m[5] + ' library threads with library=' + m[7])
}
"""

[[tests]]
name = "gemm_budget.cli_eight"
desc = "At `-t 8` the whole-work product splits over eight pool chunks, each a one-thread library call, while the batch's calls take one each: the pool's number is what ran, not a cap."
