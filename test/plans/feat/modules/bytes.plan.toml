id = "modules.bytes"
order = 369
tier = "fast"
tags = ["feat", "modules", "bytes"]

[[tests]]
name = "binary_io_decoding_and_atomic_replace"
kind = "behavior"
case = "../../../cases/modules/bytes_values.cml"
args = ["${case}", "std::macro", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "[0, 65, 0, 255, 13, 10, 128, 0]\n[65, 0, 255, 13, 10, 128]\n0\n26aa5dd8eb311cb23d596c9ecb8cd1d959e3215033223177ee68a40f3ac4e2f0\ninvalid UTF-8\n中文 UTF-8\n[65, 0, 66]\n11\n[111, 107, 58, 0, 65, 0, 255, 13, 10, 128, 0]\n{ raw: 8, more: (3, 8) }\n0\n"
timeout_ms = 10000

[[tests]]
name = "text_reader_rejects_binary_content"
kind = "behavior"
case = "../../../cases/modules/bytes_text_reject.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_output_contains = ["EncodingError", "invalid UTF-8 at byte 0"]
timeout_ms = 10000

# The fault the retired `str::from_bytes` raised for a number outside 0..255 is `bytes::from_array`'s
# What changed is the other half of the pair: malformed UTF-8 used to be a fault
# in `str::from_bytes`; `bytes::decode` returns it as an error value (design principles 3.9).

[[tests]]
name = "from_array_rejects_non_byte"
desc = "from_array with a number that is not a byte: the same InvalidArgument fault the retired `str::from_bytes` raised, at the same place."
kind = "negative"
case = "../../../cases/modules/bytes_fault_from_array.cml"
args = ["${case}", "std::nvm"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::InvalidArgument"
expect_diagnostic_line = 7
expect_output_not_contains = ["not reached"]
timeout_ms = 10000

[[tests]]
name = "from_array_rejects_non_byte.opt"
desc = "The same through std::opt."
kind = "negative"
case = "../../../cases/modules/bytes_fault_from_array.cml"
args = ["${case}", "std::opt", "std::fvm"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::InvalidArgument"
expect_diagnostic_line = 7
expect_output_not_contains = ["not reached"]
timeout_ms = 10000

[[tests]]
name = "decode_malformed_utf8_is_an_error_value"
desc = "Malformed UTF-8 is a value-level decoding error, not a fault: the program runs on past it. The retired `str::from_bytes` faulted on the same bytes."
kind = "behavior"
case = "../../../cases/modules/bytes_invalid_utf8.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "before\ninvalid UTF-8\nafter\n"
timeout_ms = 10000
