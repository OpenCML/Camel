id = "modules.json_accessor_error"
order = 362
tier = "feat"
tags = ["feat", "modules", "std", "json", "errors"]

# A Json accessor takes a `Json!` and passes the error of the document on unchanged, and a
# document nested deeper than the limit is the error kind JsonTooDeep (design principles 11.2).
# The value of a `Json!` still comes out of the accessors, chainable over the two layers.

[[tests]]
name = "json.accessor_error"
desc = "get<key>, get<index>, as_int, as_string, as_bool, as_float, as_array and as_object of a failed Json! give that same error (same kind, message and location, not null and not a crash); the accessors of a plain Json still take parts out; the accessors of a document that has a value chain over Json!?; a document nested past the fixed limit (10000) gives JsonTooDeep with the line and column of the bracket that goes too deep, from decode and decode_as."
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
case = "../../../cases/modules/std/json/json_accessor_error.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
golden = "golden/json_accessor_error.txt"
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

[[tests]]
name = "json.accessor_error.opt"
desc = "The same output through `std::opt::inline std::opt std::fvm`."
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
case = "../../../cases/modules/std/json/json_accessor_error.cml"
args = ["${case}", "std::opt::inline", "std::opt", "std::fvm"]
golden = "golden/json_accessor_error.txt"
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

[[tests]]
name = "json.depth_limit"
desc = "The depth limit is a fixed constant, not an environment variable : the case decodes a document of exactly 10000 levels and gets JsonTooDeep for one of 10001 levels, at line 1, column 10001, naming the limit of 10000. The constant is named once, as kJsonMaxDepth in modules/json/operators.cpp; raising it makes the 10001-level document decode, lowering it makes the 10000-level one fail, so either change turns this case red."
kind = "behavior"
case = "../../../cases/modules/std/json/depth_limit.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = """20001
JsonTooDeep <json::decode>
the JSON document nests deeper than the limit of 10000 levels (at line 1, column 10001); decoding a deeper document would exhaust the native stack: decode a shallower document
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000