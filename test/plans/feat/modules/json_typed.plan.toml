id = "modules.json_typed"
order = 361
tier = "fast"
tags = ["feat", "modules", "std", "json", "collections"]
desc = "json::decode_as: decoding to a given type, with a `T!` result; Map and Set in json::encode (docs/technical/31_map_and_set.md, section 7)."

[[tests]]
name = "json.decode_as"
desc = "Objects to `Map<string, T>` and to structs, arrays to `T[]`, `Set<T>` and tuples, null to `T?`; text that is not JSON and JSON of another shape are error values that name the path; `encode` of a map and a set; a round trip. The four back ends agree."
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
case = "../../../cases/modules/std/json/decode_as.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
golden = "golden/json_decode_as.txt"
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

[[tests]]
name = "json.decode_as.opt"
desc = "The same output through `std::opt::inline std::opt std::fvm`."
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
case = "../../../cases/modules/std/json/decode_as.cml"
args = ["${case}", "std::opt::inline", "std::opt", "std::fvm"]
golden = "golden/json_decode_as.txt"
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

[[tests]]
name = "json.decode_as_no_form"
desc = "A type with no JSON form (a function) is rejected when the call is compiled: no candidate of `decode_as` applies, because `has_json_form` is false for it."
kind = "negative"
case = "../../../cases/modules/std/json/err_decode_as_shape.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["err_decode_as_shape.cml:4:47", "No candidate of 'decode_as' applies to", "when has_json_form::<T>()", "name=SemanticDiag::WhenConditionUnmet"]
expect_output_not_contains = ["never printed"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "json.decode_as_map_without_string_keys"
desc = "A map whose keys are not strings has no JSON form (an object has string keys): decoding to one is refused where the call is written, by the same condition."
kind = "negative"
case = "../../../cases/modules/std/json/err_decode_as_no_form.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["err_decode_as_no_form.cml:5:39", "No candidate of 'decode_as' applies to", "name=SemanticDiag::WhenConditionUnmet"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "json.encode_no_form"
desc = "A function has no JSON form: encoding one is refused where the call is written, by the condition of `encode`."
kind = "negative"
case = "../../../cases/modules/std/json/err_encode_no_form.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["err_encode_no_form.cml:6:19", "No candidate of 'encode' applies to", "name=SemanticDiag::WhenConditionUnmet"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000
