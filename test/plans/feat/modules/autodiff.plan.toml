[[tests]]
name = "collapse.stats"
desc = "std::stats before and after std::opt: the gradient's calls (direct and through pullback closures) are gone, and the value is unchanged."
kind = "behavior"
case = "../../../cases/modules/autodiff/collapse.cml"
args = ["${case}", "std::macro", "std::stats", "std::opt", "std::stats", "${run_nvm}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const stats = [...out.matchAll(/GRAPH_STATS ([{].*[}])/g)].map((m) => JSON.parse(m[1]))
assert(stats.length === 2, `expected two GRAPH_STATS lines: ${out}`)
const [before, after] = stats
assert(before.direct_calls + before.indirect_calls > 0, `nothing to collapse: ${JSON.stringify(before)}`)
assert(after.direct_calls === 0 && after.indirect_calls === 0, `calls left: ${JSON.stringify(after)}`)
assert(out.includes('collapse dh=22'), `unexpected output: ${out}`)
}
"""
timeout_ms = 4000

[[tests]]
name = "second_order.nvm"
desc = "grad of a function that calls grad: d2/dx2 x^3 at 2 is 12 (scalar), and grad(sum(grad(sum(x^3)))) is 6x (tensor); the inner gradient is built when the outer transformation meets it."
kind = "behavior"
case = "../../../cases/modules/autodiff/second_order.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
expect_stdout_contains = ["scalar d2=12", "tensor([      6.,     -12.,       3.], dtype=float32)"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 6000

[[tests]]
name = "second_order.simplified"
desc = "The second-order gradient graphs simplify to straight-line code: no direct or indirect call is left, and the values are unchanged."
kind = "behavior"
case = "../../../cases/modules/autodiff/second_order.cml"
args = ["${case}", "std::macro", "std::stats", "std::opt", "std::stats", "${run_nvm}"]
expect_exit = 0
expect_stdout_contains = ["scalar d2=12", "tensor([      6.,     -12.,       3.], dtype=float32)"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const stats = [...input.normalized.stdout.matchAll(/GRAPH_STATS ([{].*[}])/g)].map((m) => JSON.parse(m[1]))
assert(stats.length === 2, 'expected two GRAPH_STATS lines')
assert(stats[0].direct_calls + stats[0].indirect_calls > 0, 'nothing to simplify')
assert(stats[1].direct_calls === 0 && stats[1].indirect_calls === 0, `calls left: ${JSON.stringify(stats[1])}`)
}
"""
timeout_ms = 6000

[[tests]]
name = "fused_grad_check"
desc = "After tensor::fuse (and without std::macro), the program's own matmul, add and relu rules differentiate the marked groups: every operand's gradient matches finite differences."
kind = "behavior"
case = "../../../cases/modules/autodiff/fused_grad_check.cml"
args = ["${case}", "tensor::fuse", "${run_nvm}"]
expect_exit = 0
expect_stdout_contains = ["linear.x ok", "linear.w ok", "linear.b ok", "linear_relu.x ok", "linear_relu.w ok", "linear_relu.b ok"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 6000

[[tests]]
name = "fused_grad_check.fused"
desc = "The functions checked by fused_grad_check are indeed the marked groups: tensor::fuse leaves matmul, add and relu in them and writes tensor.fusion on every node of each group."
kind = "behavior"
case = "../../../cases/modules/autodiff/fused_grad_check.cml"
args = ["${case}", "tensor::fuse", "std::gir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const count = (text) => out.split(text).length - 1
const q = String.fromCharCode(92) + '"'
assert(count('label="tensor:matmul"') === 6, `expected six matmul nodes, got ${count('label="tensor:matmul"')}`)
assert(count('label="tensor:relu"') === 3, `expected three relu nodes, got ${count('label="tensor:relu"')}`)
assert(count('tensor.fusion=') === 15, `expected 15 grouped nodes, got ${count('tensor.fusion=')}`)
assert(count('tensor.fusion=' + q + 'linear_relu' + q) === 9, `expected three linear_relu groups, got ${count('tensor.fusion=' + q + 'linear_relu' + q)}`)
assert(count('matmul_add') === 0, 'no fused operator may appear')
}
"""
timeout_ms = 6000

