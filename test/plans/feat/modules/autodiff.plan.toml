[[tests]]
name = "loop_grad_sum"
desc = "The gradient of a loop that adds a captured parameter once per round: the forward loop keeps the values each round's pullback reads in its collection slots (the tape) and the reverse pass is a loop of its own over them, so three rounds send one each back to the parameter. Every executor collects and drives the two loops the same way."
