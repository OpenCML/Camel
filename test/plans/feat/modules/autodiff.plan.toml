# A label, an argmax result and a comparison mask are discrete: their derivative is zero by
# definition, so a backward pass that reaches one must materialize an exact zero and must not
# refuse. These cases put each of them inside the differentiated region, assert the exact
# zeros beside real gradients, and pin that a value with no gradient channel at all (a Map)
# is still refused where it is built.

