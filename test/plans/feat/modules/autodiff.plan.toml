[[tests]]
name = "tensor_grad_check.macro.nvm"
desc = "Checks every tensor derivative rule against finite differences."
kind = "behavior"
case = "../../../cases/modules/autodiff/tensor_grad_check.cml"
args = ["${case}", "std::macro", "${run_nvm}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
assert(!out.includes(' FAIL '), `gradient check failed: ${out}`)
const passed = (out.match(/ ok /g) || []).length
assert(passed === 21, `expected 21 passing checks, got ${passed}: ${out}`)
}
"""
timeout_ms = 20000

