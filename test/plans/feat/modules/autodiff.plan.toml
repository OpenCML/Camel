[[tests]]
name = "grad_structures"
desc = "Gradient check over 48 generated loss functions (fixed seed), each a random chain of the structures a derivative is routed through: a called function, a let-bound lambda with captures, a nested function with a capture, a branch whose arms are calls returning one value or a tuple. Reverse mode (under std::macro and on the default run) must agree with central finite differences of a NumPy float64 twin. Before the fix of stale call-site inputs 24 of the first 32 gradients were wrong; no hand-written test had combined the structures."
kind = "behavior"
tool = "python"
case = "../../../cases/modules/autodiff/grad_structures.py"
args = ["${case}"]
skip_unless = ["${python}", "-c", "import numpy"]
expect_exit = 0
expect_stdout_contains = ["96 gradients checked, 0 wrong", "PASS"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 240000

[[tests]]
name = "grad_effects_kept.default"
desc = "grad of a function with effects runs the function: all its prints happen, once and in order, also the print after the last value the gradient reads (it was dropped: the gradient did not depend on it). Compared with the plain call and with with_grad. Under: the default run (grad runs with the program)."
kind = "behavior"
case = "../../../cases/modules/autodiff/grad_effects_kept.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim().split(String.fromCharCode(10)).join(' | ')
assert(out === 'loss | helper | helper: done | loss: helper returned | 0.557950884103775 | loss | helper | helper: done | loss: helper returned | tensor([  1.769,   1.781,   1.777], dtype=float32) | loss | helper | helper: done | loss: helper returned | (0.557950884103775, tensor([  1.769,   1.781,   1.777], dtype=float32))', `unexpected output: ${out}`)
}
"""
timeout_ms = 12000

