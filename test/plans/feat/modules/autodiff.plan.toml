[[tests]]
name = "control_flow_grad.runtime.nvm"
desc = "Differentiates through data-dependent branches, arms reading different values, and recursion. (grad built at run time)"
kind = "behavior"
case = "../../../cases/modules/autodiff/control_flow_grad.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
assert(out.includes('control_flow_grad a=6 b=0.5 c=80 d=(12, 4) e=(0, 1) w=-10'), `unexpected output: ${out}`)
}
"""
timeout_ms = 4000

