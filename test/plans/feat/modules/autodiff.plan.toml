[[tests]]
name = "benchmark_gradients_vs_torch"
desc = "The training gradient of nine benchmark models (mlp, mlp_big, lenet, lenet_big, gru, gru_big, transformer, transformer4, transformer_big) against PyTorch float32 autograd on the benchmark weights and input (benchmarks/train.py --check): the gradient of mean(y * y) with respect to every weight, under std::macro std::nvm and under std::macro std::opt::simplify std::nvm, each weight within 1e-4 of the reference (max|diff| over the weight's largest gradient entry, floored at 1e-3 of the model's). 1e-4 is the benchmark's agreement tolerance; the worst of the nine measures 6.7e-06. This is the second of the two numerical comparisons (native execution against PyTorch), not the exported artifact against native execution. resnet and resnetbn are checked by the next four entries: a float32-against-float32 comparison is not a test of their rules."
kind = "behavior"
tool = "python"
case = "../../../../benchmarks/train.py"
args = ["${case}", "--check", "--models", "mlp,mlp_big,lenet,lenet_big,gru,gru_big,transformer,transformer4,transformer_big"]
skip_unless = ["${python}", "-c", "import numpy, psutil, torch"]
expect_exit = 0
expect_stdout_contains = ["== transformer_big (camel_opt_nvm)", "gradient check: PASS"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 300000

