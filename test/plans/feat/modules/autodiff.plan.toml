timeout_ms = 8000

[[tests]]
name = "loop_grad_affine"
desc = "A loop-carried accumulator with an affine update, acc ← acc·0.5 + w: the reverse pass chains each round's gradient through the state it produced, so the gradient is the geometric series 1 + 0.5 + 0.25 = 1.75, where summing per-round contributions without the state chain would give 3."
kind = "behavior"
case = "../../../cases/modules/autodiff/loop_grad_affine.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
expect_stdout_exact = "loop_grad_affine vg=(3.5, 1.75)\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "loop_grad_tuple_state"
desc = "A two-value state, (round, accumulator): the int has no tangent, so the reverse loop carries the accumulator's gradient alone while the loop's value keeps both components (n = 4, acc = 6) and three rounds add 2·w each (gradient 6)."
kind = "behavior"
case = "../../../cases/modules/autodiff/loop_grad_tuple_state.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
expect_stdout_exact = "loop_grad_tuple_state vg=(12.0, 6.0) rounds=406\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "loop_grad_struct_state"
desc = "A struct loop state is differentiable: the state is one struct, its tangent is the same struct, and the reverse pass reads the fields it needs. Before this, the forward rewrite took the programme's field read (`q.a`) for the loop's state projection, and the graph crashed while being scheduled (SIGSEGV: a struct access on a tuple). The shapes: a struct state the body also uses as a whole (`sumP(q)`, so H71's split into fields does not apply), a nested struct state, a struct state with an int field (its tangent is `{a}`), a one-field struct state, and a state whose struct part stays whole beside a counter. Every gradient is 24 (a·(1 + d) over d = 1, 2, 3), the same as the tuple-state reference; `mixedPart` adds b·d with b = 1, so its gradient is 1; a struct state whose array field is appended gives 2 in place and 6 when the round must be taped; a struct parameter tree differentiates to `{p: {a: 4, b: 4}, c: 4}`."
kind = "behavior"
case = "../../../cases/modules/autodiff/loop_grad_struct_state.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "loop_grad_struct_state grads=24.0 24.0 24.0 24.0 1.0 24.0 2.0 6.0 { p: { a: 4.0, b: 4.0 }, c: 4.0 }\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

