[[tests]]
name = "loop_grad_iterable"
desc = "A loop that iterates over an array built from the differentiated parameter differentiates: the reverse of a read by index is a scatter-add, so each round's element gradient goes back into the array's gradient at that round's index (design principles 9.9). f(w) = sum([w, 2w, 3w]) = 12 at w = 2, gradient 6. This used to be refused."
kind = "behavior"
case = "../../../cases/modules/autodiff/loop_grad_iterable.cml"
