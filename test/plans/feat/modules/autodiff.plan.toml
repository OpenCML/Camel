[[tests]]
name = "loop_grad_parameter_array.shape"
desc = "The twin over an array built from the parameter: the array takes part in the gradient, so the reverse loop carries it and both array-gradient operators are there: `:tangent/scatter_add_arr`, whose gradient base is a `float[]` port, and `:tangent/zeros_arr`, whose zero array is the forward array read from a capture port."
kind = "behavior"
case = "../../../cases/modules/autodiff/loop_grad_parameter_array.cml"
args = ["${case}", "std::macro", "std::jgir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const doc = JSON.parse(input.normalized.stdout)
const graphs = doc.graphs.map((g) => g.name)
assert(graphs.some((name) => name.endsWith('.tape.reverse')), `no reverse loop to inspect: ${JSON.stringify(graphs)}`)
const reverse = doc.graphs.find((g) => g.name.endsWith('.tape.reverse'))
const nodes = new Map(reverse.nodes.map((n) => [n.id, n]))
const inputs = (id) => reverse.edges.filter((e) => e.target === id).sort((a, b) => a.targetIndex - b.targetIndex).map((e) => nodes.get(e.source))
const scatter = reverse.nodes.find((n) => n.kind === 'OPER' && n.label === ':tangent/scatter_add_arr')
assert(scatter, `no scatter into the array's gradient: ${JSON.stringify(reverse.nodes.filter((n) => n.kind === 'OPER').map((n) => n.label))}`)
const base = inputs(scatter.id)[0]
assert(base && base.kind === 'PORT' && base.outputType === 'float[]', `the scatter's gradient base is not a float[] port: ${JSON.stringify(base)}`)
const zeros = reverse.nodes.find((n) => n.kind === 'OPER' && n.label === ':tangent/zeros_arr')
assert(zeros, 'no zero array for the iterated array')
const zeroBase = inputs(zeros.id)[0]
assert(zeroBase && zeroBase.kind === 'PORT' && zeroBase.parameter.kind === 'capture' && zeroBase.outputType === 'float[]', `the zero array does not read the forward array from a capture port: ${JSON.stringify(zeroBase)}`)
}
"""
timeout_ms = 8000

