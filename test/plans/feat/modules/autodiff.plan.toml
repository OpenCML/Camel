# The two cases below are twins: one loop body, iterating a literal array or an array built from
# the parameter. `std::macro` builds the gradient's reverse loop, `std::jgir` prints the graphs as
# JSON, and what is asserted is the array gradient's own machinery rather than a graph size:
# `:tangent/zeros_arr` (the zero array a round's element gradient is scattered into) and
# `:tangent/scatter_add_arr` (the scatter itself) must be absent for the literal and present for
# the parameter-built array. The parameter's scatter takes its gradient base from a `float[]` port
# and its zero array from the captured forward array; those ports are what a literal cannot have.
# No count is pinned, so a CSE or an inlining decision that moves node numbers leaves these
# assertions alone; dropping the reach test from the loop rule adds those two operators to the
# literal twin and fails its assertion, which prints the labels it found. The first entry of each
# pair asserts the shape, the second the printed value.

[[tests]]
name = "loop_grad_literal_array.shape"
desc = "A differentiated loop over an array literal: no port reaches the array, so its reverse loop carries no array gradient and neither array-gradient operator appears in it (`:tangent/zeros_arr`, `:tangent/scatter_add_arr`). The loop still iterates a `float[]` data node and the reverse loop is there, so the absence is the rule's, not a missing transformation or a folded-away literal. The parameter-built twin has both operators, the scatter reading its gradient base from a `float[]` port."
kind = "behavior"
case = "../../../cases/modules/autodiff/loop_grad_literal_array.cml"
args = ["${case}", "std::macro", "std::jgir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const doc = JSON.parse(input.normalized.stdout)
const graphs = doc.graphs.map((g) => g.name)
assert(graphs.some((name) => name.endsWith('.tape.reverse')), `no reverse loop to inspect: ${JSON.stringify(graphs)}`)
const forward = doc.graphs.filter((g) => !g.name.includes('.tape.'))
assert(forward.some((g) => g.nodes.some((n) => n.kind === 'LOOP') && g.nodes.some((n) => n.kind === 'DATA' && n.outputType === 'float[]')), 'the loop must still iterate an array literal')
const reverse = doc.graphs.find((g) => g.name.endsWith('.tape.reverse'))
const carried = reverse.nodes.filter((n) => n.kind === 'OPER' && (n.label === ':tangent/zeros_arr' || n.label === ':tangent/scatter_add_arr'))
assert(carried.length === 0, `the literal array's gradient is carried: ${JSON.stringify(carried.map((n) => n.label))}`)
}
"""
timeout_ms = 8000

