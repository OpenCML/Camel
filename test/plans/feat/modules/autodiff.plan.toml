[[tests]]
name = "second_order_array_append_init_blocked"
desc = "The block, pinned: the second derivative of `append` on the side of its array. append's adjoint splits the appended array's gradient into `:tangent/init_arr` (the parent's gradient) and `:tangent/last_arr` (the appended value's). The adjoint of init_arr would pad the upstream gradient with the zero tangent at the end, which needs an operator that grows a tangent array with a computed element as an ordinary input; the array library's append and extend take their value as a `with` input and a rule can emit only ordinary inputs. The first derivative is the real [6, 2] (f(xs)=ys0^2+ys1*ys2 at [3,4] gives ys=[3,4,2] and f'=[2*ys0, 2]); the second refuses by name at ':tangent/init_arr' with no derivative rule, rather than printing a zero for a derivative nobody computed. The value half (`:tangent/last_arr`) is in the same gradient graph and is blocked for the same reason; the backward order meets init_arr first here. No rule is written for either half."
kind = "negative"
case = "../../../cases/modules/autodiff/second_order_array_append_init_blocked.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 1
expect_stdout_contains = ["second_order_array_append_init d0=6.0 d1=2.0"]
expect_output_contains = ["no derivative rule for operator ':tangent/init_arr'"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "f64_broadcast_grad"
desc = "An f64 gradient through a broadcast: sum(x * p0) with x a Tensor<f64, [2, 3]> and p0 a Tensor<f64, [3]> multiplies by broadcasting p0 over the rows, and tensor:sum_to is the reduction of that broadcast, so this is where an f64 gradient was refused with \"'the gradient kernels' does not support a value of type 'Tensor<f64>'\". Both gradients are printed in the array form and both distances are 0.0 against the values written out by hand from the forward expression (d/dx is the row broadcast of p0, d/dp0 the column sum [5, 7, 9]). The wide pair sums 2^24 + 1 in the third column: 16777217.0 in f64 and 16777216.0 if the value is accumulated in f32, so its printed third coordinate and its distance (0.0 against 1.0) say which accumulator the arm uses."
kind = "behavior"
case = "../../../cases/modules/autodiff/f64_broadcast_grad.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const text = input.normalized.stdout
assert(text.includes('f64_broadcast_grad value=22.25 a_x=0.0 a_p0=0.0 wa=0.0'), `unexpected distances: ${text}`)
assert(text.includes('gx [[0.5, 0.25, 2.0], [0.5, 0.25, 2.0]]'), `the x gradient is not the row broadcast of p0: ${text}`)
assert(text.includes('gp [5.0, 7.0, 9.0]'), `the p0 gradient is not the column sum of x: ${text}`)
assert(text.includes('wp [16777217.0, 2.0, 16777217.0]'), `the wide sum did not accumulate in f64: ${text}`)
}
"""
timeout_ms = 10000
