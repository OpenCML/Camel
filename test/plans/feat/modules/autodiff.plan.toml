[[tests]]
name = "grad_scalar_width.runtime.nvm"
desc = "A gradient handed to the accumulator is of the parameter's own element type, and this is where the scalar path used to break it. `w * x` on an f32 parameter runs tensor:multiply, whose rule reduces the scalar operand's gradient with tensor:sum -- a float64 operator. Stored as it was, the float64 node sat in the f32 parameter's tangent and was read at f32's width: 6.0 is 0x4018000000000000, whose low half is 0x00000000, so the program printed a gradient of 0.0 with nothing faulting. The rules now convert the gradient to the value's width (:op/dtof) and the accumulator refuses any gradient still of another element type, so the multiply prints 6.0 and a `where` branch prints 1.0 -- their real derivatives. Red if a gradient of another element type is accepted again (both numbers are integral, so read at f32's width they are 0.0) and red if a rule stops converting and the accumulator refuses instead (the line is missing and the process exits 1). (grad built at run time)"
kind = "behavior"
case = "../../../cases/modules/autodiff/grad_scalar_width.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
expect_stdout_exact = "grad_scalar_width multiply=(12.0,6.0) where=(4.5,1.0)\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

