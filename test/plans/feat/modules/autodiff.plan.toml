# The cost bound is this referee's own CPU time (user + system), and the timeout is its liveness
# bound, by the author's ruling of 2026-10-23 (docs/handover/reviews/questions-2026-10-23.md,
# "declaration-cost-gate" (a)):
#
#   "改量 CPU 时间，不量墙钟。共享主机上的墙钟随负载漂移 ... 进程的 CPU 时间（用户态 + 内核态）基本
#    不随负载变"
#
# The ruling asks for a quiet host's median plus a margin. Nothing on this shared host was quiet (the
# 1-minute load stayed between 83 and 162 across every run), and the median of load-affected
# readings would leave only 13-21% of room to the busiest of them, so each of these four budgets is
# taken from the highest reading with that same margin instead: the direction that cannot fire on the
# host's load, which is the defect being removed.
#
# Measured on the Linux host (32 threads; the 1-minute load read 83-162 across the runs, so the
# machine was 3-5x oversubscribed):
#
#   44.33 s of CPU / 32.45 s wall   (2026-10-24, the four referees of this plan together at -Jobs 8)
#   47.15 s of CPU / 38.54 s wall   (2026-10-24, same)
#   52.95 s of CPU / 50.59 s wall   (2026-10-24, this plan in full, 199 tests at -Jobs 8)
#
# A 19% spread in the CPU figure against 56% in the wall clock. The budget is 80 s: 1.63x the higher
# of the two readings taken to set it (47.15 s, rounded up), the same headroom as
# benchmark_gradients_vs_torch above, and 1.51x the busiest reading any of the three runs gave. It
# still fails a run whose work has grown by two thirds. The wall clock used to decide this test
# through the runner's 4x margin, that is 75 s of this timeout, and at load 100 the referee is
# CPU-bound: the margin was reading the neighbours.
cpu_budget_ms = 80000
# Fires on a hang, not on a slow run: the referee bounds its own work (each camel run inside it is
# capped at 1800 s, benchmarks/tools/grad_referee.py), and 5 min is 6.4x the 38.5 s the loaded host
# gives it.
timeout_ms = 300000

