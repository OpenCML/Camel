assert(text.includes('grad_function_value_recursion.cml:7:53: [Error]'), 'the diagnostic is not located at the call (7:53): ' + text)
assert(/[(]at [^ ]*grad_function_value_recursion[.]cml:7:53[)]/.test(text), 'the message does not name the call: ' + text)
assert(text.split('[Error]').length === 2, 'expected one error: ' + text)
assert(text.includes('the function is a parameter of'), 'missing: the function is a parameter of in: ' + text)
assert(text.includes('iterate'), 'missing: iterate in: ' + text)
assert(text.includes('a recursive function that passes it on to itself'), 'missing: a recursive function that passes it on to itself in: ' + text)
assert(text.includes('could not be evaluated by std::macro'), 'not a macro error: ' + text)
assert(/the macro call is at [^ ]*[.]cml:[0-9]+:[0-9]+/.test(text), 'macro call not named: ' + text)
}
"""
timeout_ms = 12000

