[[tests]]
name = "collapse.simplified.rgir"
desc = "A gradient through helper calls collapses into straight-line code: after std::opt, fold and dce, the derivative graph has no calls, closures or tuples left."
kind = "behavior"
case = "../../../cases/modules/autodiff/collapse.cml"
args = ["${case}", "std::macro", "std::opt", "std::opt::fold", "std::opt::dce", "std::rgir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const start = out.indexOf('label="grad(h)";')
assert(start >= 0, `no grad(h) graph in: ${out}`)
// The graph's own nodes are indented one level below its label; nested clusters are deeper.
const body = out.slice(start).split('\n').slice(1)
const own = []
for (const line of body) {
  if (/^ {8}\}/.test(line)) break
  if (/^ {12}[NO][0-9A-F]+ \[/.test(line)) own.push(line)
}
assert(own.length > 0, `empty grad(h) graph`)
for (const kind of ['CALL', 'FUNC', 'FILL', 'ACCS']) {
  assert(!own.some(l => l.includes(`type="${kind}"`)), `grad(h) still has ${kind}: ${own.join('\n')}`)
}
}
"""
timeout_ms = 4000

