[[tests]]
name = "loop_grad_in_place"
desc = "A loop whose array state the compiler writes in place is still differentiable: the forward loop needs a tape (one array per round), which an in-place write cannot give, so the body falls back to the copying append. The gradient agrees with the same computation seeded from a parameter (the copying form), so differentiation is a fallback and never a rejection."
kind = "behavior"
case = "../../../cases/modules/autodiff/loop_grad_in_place.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "loop_grad_in_place a=2.0 b=2.0 va=(4.0, 2.0)\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "loop_grad_composite_read"
desc = "A composite loop state whose gradient comes from a value computed outside the loop and read only inside its body: the two-value state adds `s = w * 2` each round (value 12, gradient 6), and an array state grown by `append<a>` with `a = w + 1` outside the loop gives the gradient of `xs[1] + xs[2]` (2). The loop's value is read after the loop through a projection, which must pass the gradient on to the loop's site."
kind = "behavior"
case = "../../../cases/modules/autodiff/loop_grad_composite_read.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "loop_grad_composite_read vg=(12.0, 6.0) d=2.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

