[[tests]]
name = "resnetbn_gradient_smooth_vs_torch64"
# Slow layer: measured 14.5 s in the full serial run (handover note ⟨617198c⟩ (H10)).
tier = "slow"
desc = "resnetbn (20 training-mode batch_norms) with relu replaced by tanh on both sides: Camel's gradient against PyTorch float64 autograd, each of the 62 weights that have a gradient within 1e-4 (measured 7.8e-06), the loss and the 40 running statistics the forward leaves agreeing to 2e-7. The 20 conv biases in front of a batch_norm have a gradient of exactly zero (float64: 1e-17); what float32 computes there is the rounding of a sum that cancels, and it is accepted within 1e-4 of the floor or when no farther from float64 than PyTorch float32 on the same weight (measured: Camel 2.7e-04 of the floor, that is 2.7e-07 of the model's largest gradient entry; PyTorch float32 1.0e-03). Whether exactly-zero gradients need a bound of their own is open (benchmarks/README.md, Gradient agreement)."
kind = "behavior"
tool = "python"
case = "../../../../benchmarks/tools/grad_referee.py"
args = ["${case}", "--model", "resnetbn", "--activation", "tanh", "--require", "--no-fd", "--no-sensitivity"]
skip_unless = ["${python}", "-c", "import numpy, psutil, torch"]
expect_exit = 0
expect_stdout_contains = ["verdict resnetbn seed=benchmark activation=tanh: PASS (", "gradient referee: PASS"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 300000

[[tests]]
name = "resnet_gradient_relu_kinks_vs_torch64"
# Slow layer: measured 21.1 s in the full serial run (handover note ⟨617198c⟩ (H10)).
tier = "slow"
desc = "resnet as benchmarked, against PyTorch float64 autograd. The direct comparison is outside 1e-4 (3.1e-03 on stem_w; PyTorch float32 is 1.6e-03 from float64 on another weight) because the gradient is discontinuous where a relu input crosses zero and, of 8.9 million relu inputs, a few lie within float32 rounding of zero. The test requires that the gap is exactly that: Camel's gradient must be within 1e-4 of the float64 gradient recomputed with a few named relu decisions reversed, each of them a unit whose float64 input is within half the layer's float32/float64 forward drift of zero (measured: 2 units, inputs -3.9e-09 and +4.0e-08 in layers whose largest input is 3.4 and 5.3; residual 3.9e-07). A wrong rule is not explained by reversing such units and fails."
kind = "behavior"
tool = "python"
case = "../../../../benchmarks/tools/grad_referee.py"
args = ["${case}", "--model", "resnet", "--kinks", "--require", "--no-fd", "--no-sensitivity"]
skip_unless = ["${python}", "-c", "import numpy, psutil, torch"]
expect_exit = 0
expect_stdout_contains = ["verdict resnet seed=benchmark activation=relu: PASS", "gradient referee: PASS"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 600000

