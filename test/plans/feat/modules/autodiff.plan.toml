[[tests]]
name = "grad_function_values.default"
desc = "Gradients through calls of function values that are named or built elsewhere than at the call: (1) a closure called twice inside a second closure that captured it, (2) three closures deep, (3) a closure returned by a factory and called twice, (4) a factory closure capturing a tensor, (5) a closure passed to a function that calls it twice, (6) a named function passed, (7) a closure passed on through two functions, (8) a factory closure passed to a function, (9) a function taking a closure and returning one that captures it, (10) a lambda returning a lambda. In all but (6) a captured value depends on the differentiated parameter, so the gradient must also arrive through the capture. The expected gradients agree with central finite differences of an independent NumPy float64 version of each loss (grad_function_values_reference.py). Under: the default run (grad runs with the program)."
kind = "behavior"
case = "../../../cases/modules/autodiff/grad_function_values.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim().split(String.fromCharCode(10)).join(' | ')
assert(out === 'tensor([  1.935,   1.959,   1.951], dtype=float32) | tensor([  3.581,    2.37, -0.5429], dtype=float32) | tensor([ 0.2471,  0.2094,  0.1147], dtype=float32) | tensor([   2.89,   2.242,   2.462], dtype=float32) | tensor([  1.165,   1.178,   1.174], dtype=float32) | tensor([   1.25,   0.625,  -0.875], dtype=float32) | tensor([ 0.6224,  0.4746,   0.115], dtype=float32) | tensor([  1.165,   1.178,   1.174], dtype=float32) | tensor([ 0.4628,  0.4682,  0.4664], dtype=float32) | tensor([ 0.2382,  0.2388,  0.2386], dtype=float32)', `unexpected output: ${out}`)
}
"""
timeout_ms = 12000

