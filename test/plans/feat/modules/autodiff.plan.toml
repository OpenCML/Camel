[[tests]]
name = "loop_grad_sum"
desc = "The gradient of a loop that adds a captured parameter once per round: the forward loop keeps the values each round's pullback reads in its collection slots (the tape) and the reverse pass is a loop of its own over them, so three rounds send one each back to the parameter. Every executor collects and drives the two loops the same way."
kind = "behavior"
case = "../../../cases/modules/autodiff/loop_grad_sum.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "loop_grad_sum d=3.0 vg=(6.0, 3.0)\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "loop_grad_sum.macro"
desc = "The same summation loop differentiated ahead of time by std::macro: the macro evaluator's collecting loop is the tape and the reverse pass runs over it."
kind = "behavior"
case = "../../../cases/modules/autodiff/loop_grad_sum.cml"
args = ["${case}", "std::macro"]
expect_exit = 0
expect_stdout_exact = "loop_grad_sum d=3.0 vg=(6.0, 3.0)\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "loop_grad_product"
