[[tests]]
name = "grad_function_value_branch.default"
desc = "Refused: the function called is chosen by a branch at run time. The value is called twice; the diagnostic itself is located at the first call in source order (line 11), although the reverse pass meets the second call (line 11) first, and the reason given is the branch. Under: the default run (grad runs with the program)."
kind = "behavior"
case = "../../../cases/modules/autodiff/grad_function_value_branch.cml"
args = ["${case}"]
expect_exit = 1
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const text = input.normalized.output
assert(text.includes('grad_function_value_branch.cml:11:13: [Error]'), 'the diagnostic is not located at the call (11:13): ' + text)
assert(/[(]at [^ ]*grad_function_value_branch[.]cml:11:13[)]/.test(text), 'the message does not name the call: ' + text)
assert(text.split('[Error]').length === 2, 'expected one error: ' + text)
assert(text.includes('which function it calls is not evident where it is called'), 'missing: which function it calls is not evident where it is called in: ' + text)
assert(text.includes('the function is chosen by a branch at run time'), 'missing: the function is chosen by a branch at run time in: ' + text)
}
"""
timeout_ms = 12000

