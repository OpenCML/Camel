[[tests]]
name = "scalar_grad.runtime.nvm"
desc = "Differentiates straight-line scalar code with helper calls, value_and_grad and stop_gradient. (grad built at run time)"
kind = "behavior"
case = "../../../cases/modules/autodiff/scalar_grad.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
assert(out.includes('scalar_grad df=(12.5, 7.25) vg=(17.5, (12.5, 7.25)) dg=12'), `unexpected output: ${out}`)
}
"""
timeout_ms = 4000

