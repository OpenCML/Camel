# The edit operators that were missing from the graph module's draft: `order` (add an order
# edge) and the exit anchor query `exit`. They are the first step of the transform-engine plan
# the language author holds on `fsh-dev` ("Camel 实现变换引擎"): the operators the
# `edit` block will carry are written against today's interface (`open` / `commit`) first, so that
# the day the block syntax is decided the operators do not move. The two operators that step cannot
# write -- `inline`, whose `at` names a region and not a place, and `outline`, which would need a
# graph that was not there -- are the questions of 2026-11-18 under internal/questions/.
#
# Each case asserts the shape of the graph, not that the pass did not crash: the order edge is read
# back off the committed program (`order_inputs` of the node it reaches), and the exit is compared
# with the node an independent search for the shape finds.
id = "modules.graph_edits"
order = 377
tier = "fast"
tags = ["feat", "modules", "graph", "edit"]

[[tests]]
name = "exit_is_the_node_the_function_hands_out"
desc = "`exit` of the graph of `main` answers the addition the function returns: an operator node, of type `int`, an anchor, read by nothing -- and the same node an independent search for 'the addition that reads an addition' finds, which is what the query claims to be. Before this query existed a pass had to scan `nodes` and test `is_anchor` to name the node an edit that changes what the function gives has to put a value in the place of. The program exits 55, so the graph the pass read is the program that ran."
kind = "behavior"
case = "../../../cases/modules/graph_pass/edits_exit.cml"
args = ["${case}", "orderprobe::exit_shape", "std::nvm"]
expect_exit = 55
expect_stdout_exact = "NodeKind::Oper int true 0 2 1\ntrue\n"
timeout_ms = 20000

[[tests]]
name = "params_are_the_ports_the_declaration_states"
desc = "`params` of the graph of `inc` answers the one port node its declaration `(x: int)` makes: one node, of type `int`, and the same node `nodes` lists -- a port is a node of the graph like any other, which is what lets `add_param` add one and `erase` take an unused one away. Before this query existed a pass that had to know the parameters of a function counted the ports itself."
kind = "behavior"
case = "../../../cases/modules/graph_pass/edits.cml"
args = ["${case}", "orderprobe::params_of", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "ports: 1 int\nin nodes: 1\n126\ntext\n"
timeout_ms = 20000

[[tests]]
name = "order_adds_an_edge_and_the_program_still_computes"
desc = "Two `println` statements of `main` write to the console and neither is ordered by an order edge: `order_read` sees no order edge reaching the second, `order_add` writes one from the first, and the `order_read` after it sees one edge that reaches that `println`. The program prints the same two values, because an order edge only orders and never makes a node run (design principles 3.1). A pure node would drop the edge instead: the encoder keeps an ordering only where the node it reaches arranges itself nowhere (`src/runtime/graph.cpp`)."
kind = "behavior"
case = "../../../cases/modules/graph_pass/edits_order.cml"
args = ["${case}", "orderprobe::order_read", "orderprobe::order_add", "orderprobe::order_read", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "0\nfalse\n1\ntrue\n28\n27\n"
timeout_ms = 20000

[[tests]]
name = "order_refuses_a_cycle"
desc = "Ordering an addition that reads another addition before the one it reads would make the graph run `c` before `a` while `c` is computed from `a`. The operator refuses, naming itself and the cycle, and the pass stops before the commit has anything to say about the graph."
kind = "negative"
case = "../../../cases/modules/graph_pass/edits_order.cml"
args = ["${case}", "orderprobe::order_cycle", "std::nvm"]
expect_exit = 1
expect_output_contains = ["graph.order", "the edge would form a cycle"]
timeout_ms = 20000

# The anchor of the graph, replaced and erased: `replace(exit(d), v)` re-points what the exit hands
# out and leaves both nodes in the graph; `erase` of the same node is still refused. The two readings
# are separate programs because the refusal ends a program (a fault is not a value to handle).
[[tests]]
name = "replace_the_exit_points_the_graph_at_another_value"
desc = "`replace(exit(d), v)` makes the function give `v`, keeps the exit node, and leaves the node that was the result before in the graph; the committed function returns the new value"
kind = "behavior"
case = "../../../cases/modules/graph_function/replace_exit.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "[before] handed=:op/mul_l muls=1\n[after] anchor_alive=true old_alive=true old_users=0 handed= muls=1\n[committed] muls=1\n[run] the edited function:\nfirst\n7\n"
timeout_ms = 20000

[[tests]]
name = "erase_the_exit_is_still_refused"
desc = "`erase` of the node the graph hands its value out of is refused with the reason it names, so the rule that a replacement may re-point an anchor did not loosen what may be deleted"
kind = "negative"
case = "../../../cases/modules/graph_function/erase_anchor_refused.cml"
args = ["${case}", "std::nvm"]
expect_exit = 1
expect_output_contains = ["graph.erase", "the node anchors its graph"]
timeout_ms = 20000
# `eval(n)` takes the node as a value the program got at run time, not as a spelling the compiler can
# see: the test folds two different nodes of the same function and pins both numbers, so a wrong
# answer cannot hide behind a type check.
[[tests]]
name = "eval_folds_a_node_the_program_picked_at_run_time"
desc = "`eval(n)` folds the constant operator of whichever arithmetic node the program selected at run time, and the two selections give two different values back from the edited function"
kind = "behavior"
case = "../../../cases/modules/graph_function/eval_node.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "[eval] which=0 op=:op/add_l operands=2\nsubject runs\n[run] the edited function: 45\n"
timeout_ms = 20000