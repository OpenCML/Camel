id = "modules.stdlib_reduced"
order = 376
tier = "fast"
tags = ["feat", "modules", "stdlib", "types", "tensor"]
desc = "The reduced-precision floating types are scalar types of the language (design principles 7.3): `bf16` and `f16` have literals that round once to the nearest member of the type, written conversions (`bf16(x)`, `f16(x)`, `x as f32`) that need no numeric permission, the scalar arithmetic and comparison of any other float computed in f32 and rounded once into the element type, and a place in an array; `is_float` names both, so `is_numeric` and `is_ordered` inherit them; and `array::sum` over one of them accumulates in f64 and rounds once, as the tensor reduction does. What is left refused is refused by name, with the element type and the operation that cannot take it."

# The predicates: the element types belong to the float family, and the composed predicates follow.

[[tests]]
name = "reduced_predicates"
desc = "`is_float`, `is_numeric` and `is_ordered` answer true for bf16 and f16, and a generic function guarded by `is_numeric::<T>()` and one guarded by `is_ordered::<T>()` both accept an array of them. Before this change `is_float::<bf16>()` was false, `is_numeric::<bf16>()` was false, and both guarded calls failed with WhenConditionUnmet -- the element types were excluded from every numeric declaration by silence."
kind = "behavior"
case = "../../../cases/modules/stdlib/reduced_predicates.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "float\nfloat\nnumeric\nnumeric\nordered\nordered\n0\n0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 6000

# The language half of the rule: literals, the written conversion, the arithmetic and the
# comparison of the two types, each pinned by a value or by the bytes of the stored element.

[[tests]]
name = "reduced_scalar"
desc = "A bf16 or f16 literal is the nearest member of the written number, rounded once with ties to even (1+2^-8 is bf16 1.0 and 1+2^-11 is f16 1.0, the even neighbour of the tie), and an element of a cast tensor holding the same number has the same bytes (0.1 is bf16 0x3DCD and f16 0x2E66, the two types rounding the same f32 in opposite directions). The written conversion `bf16(x)` / `f16(x)` gives that element by another route; reading one back as f32 is exact; a result beyond the range of the element type is an infinity and not a saturation (the halfway 65504 + 16 is f16 +inf, and so is 65504 + 65504); a negative literal keeps its sign bit and still compares equal to its positive zero; arithmetic is computed in f32 and rounded once (0.1 * 0.1 is bf16 0x3C24, not 0x3C25); and the six answers of a comparison are the six of two equal values. The text of one of these values is the shortest that reads back as the same element of its own type, so 0.1 as a bf16 prints `0.1` and not the `0.100097656` of the f32 it widens to; the last section asserts that property of the largest finite value, the least normal value, a subnormal, a third and both zeros by reading the printed text back through `bf16(s)` / `f16(s)`, and asserts that an array element prints by the same rule as the scalar. The digits the rule gives are pinned by this plan's `expect_stdout`, and two of them are worth naming because they surprise: the f16 largest finite value 65504 prints `65500.0` and f16 32752 prints `32750.0`, the shortest decimals that round back to those elements rather than the values themselves; the bf16 third prints `0.334` and the f16 third `0.3333`. Before this change no line of the case compiled: bf16 had no literal, no conversion and no operator."
kind = "behavior"
case = "../../../cases/modules/stdlib/reduced_scalar.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "1.0 1.0 128 63\n0 60\n[205, 61]\n[102, 46]\n0.1 205 61 0.1\n205 61\n102 46\n127 127 3.3895314e+38\ninf 128\n255 123 65500.0\ninf inf 0 124 0 124\n-0.0 true 0 128\n2.0 0.01 0.334\n0 64 36 60\ntrue false false true false true\n6 6.0 6.0\n1.0 true 128 63\n[128, 75, 128, 63, 128, 203]\n[102, 46]\n3.39e+38 1.18e-38 5.9e-39 1.695e+38 0.334\n65500.0 6.104e-05 6e-08 32750.0 0.3333\n0.0 -0.0 0.0 -0.0\ntrue true true\ntrue true true\ntrue true\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

# The one arithmetic operator of the family, `^`, pinned on its own: an exact power in both types,
# an inexact one, one beyond each type's range, and the result's element type.

[[tests]]
name = "reduced_pow"
desc = "`x ^ y` over bf16 and f16 is the power of any other float: the operands widen to f32, the power is computed there and the result is rounded once into the element type, so 2.0 ^ 10.0 is 1024 (bf16 0x4480, f16 0x6400), 1.5 ^ 3.0 is 3.375 (0x4058, 0x42C0), 0.5 ^ -2.0 is 4.0 (0x4080, 0x4400), 10.0 ^ 3.0 is 1000 (0x447A, 0x63D0) and -2.0 ^ 3.0 is -8 (0xC100, 0xC800) exactly in both types; the inexact 3.0 ^ 0.5 is each type's nearest (bf16 1.734375, bytes [222, 63]; f16 1.732421875, bytes [238, 62]) rather than the f32 1.7320508 a result stored without rounding would keep; and 3.0e38 ^ 2.0 and 3.0e4 ^ 2.0 are infinities (0x7F80, 0x7C00) and not a saturation at the largest finite value. The result keeps the operands' element type: `let r: bf16 = x ^ y` compiles (no implicit numeric conversion, design principles 5.1) and a `bf16[]` of three results is six bytes, so an operator answering in f32 fails both. Each probe is also read against the same expression computed in f32 and rounded once into the element type, which must agree bit for bit, and against the exact power computed in f64, which the stored element must be within the type's own epsilon of (2^-8 for bf16, 2^-11 for f16): 1.734375 is 1.34e-3 from the exact 3^0.5, so it passes bf16's epsilon and fails f16's, which is what says the tolerance is the type's own and can fail."
kind = "behavior"
case = "../../../cases/modules/stdlib/reduced_pow.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "[128, 68] [88, 64] [128, 64] [122, 68] [0, 193]\n1024.0 3.375 4.0 1000.0 -8.0\n[222, 63] 1.734375 true [128, 127]\n[0, 100] [192, 66] [0, 68] [208, 99] [0, 200]\n1024.0 3.375 4.0 1000.0 -8.0\n[238, 62] 1.7324219 true [0, 124]\n6 6\ntrue true\ntrue true\ntrue true\ntrue true\nfalse true\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

# The compound forms: one rounding per statement, against the value a wider cell would give.

[[tests]]
name = "reduced_compound_assign"
desc = "`+= -= *= /= ^=` on a bf16 and on an f16 cell read the stored element, compute in f32 and round once into the element type, and the cell keeps that element type: each form answers the two bytes of the same binary operator written beside it (1.5 + 2.25 = 3.75, bf16 0x4070 [112, 64] and f16 0x4380 [128, 67]; 3.75 - 0.5 = 3.25, 0x4050 [80, 64] and 0x4280 [128, 66]; 3.25 * 2.0 = 6.5, 0x40D0 [208, 64] and 0x4680 [128, 70]; 6.5 / 4.0 = 1.625, 0x3FD0 [208, 63] and 0x3E80 [128, 62]; 1.625 ^ 2.0 = 2.640625, 0x4029 [41, 64] and 0x4148 [72, 65]), all five exact in both types so the lines separate the operator from the element type. The form is `a = a op b` (design principles 4.2, Builder::compoundAssignmentByRebinding), so what it follows is the plain narrow operator: removing the plain arm reds this case, while removing the group's `:op/assn_pow` arm changes nothing, which is why the plain arm is the one the reading pins. The rounding is pinned by a chain of two `+=` of the half ulp on a cell starting at 1.0: each statement rounds the exact halfway to the even neighbour, so the bf16 cell stays 1.0 ([128, 63]) and the f16 cell stays 1.0 ([0, 60]), while a cell that kept f32 between the statements would hold 1.0078125 ([129, 63]) and 1.0009765625 ([1, 60]) -- the case writes those wider values and compares, so `chain == bf16(1.0078125)` must be false and the one-rounding reading cannot pass vacuously. A one-element `bf16[]` of the chain is two bytes, and the inexact `^= 0.5` of 3.0 gives each type's nearest (0x3FDE, 0x3EEE) within the type's own epsilon of the exact power in f64."
kind = "behavior"
case = "../../../cases/modules/stdlib/reduced_compound_assign.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "[112, 64] [112, 64]\n[80, 64] [80, 64]\n[208, 64] [208, 64]\n[208, 63] [208, 63]\n[41, 64] [41, 64]\n2.640625\n[128, 67] [128, 67]\n[128, 66] [128, 66]\n[128, 70] [128, 70]\n[128, 62] [128, 62]\n[72, 65] [72, 65]\n2.640625\n[128, 63] false 2\n[0, 60] false 2\n[222, 63] 1.734375 true\n[238, 62] 1.7324219 true\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

# Scalar subtraction, which no case had pinned: exact differences, the two directions of a tie,
# a real rounding, zero, and one past the range.

[[tests]]
name = "reduced_subtraction"
desc = "`a - b` on bf16 and f16 is the type's one arithmetic path: the operands are elements, the difference is taken in f32 and rounded once into the element type, so 3.75 - 0.5 = 3.25 (bf16 0x4050 [80, 64], f16 0x4280 [128, 66]), 0.5 - 1.0 = -0.5 (0xBF00 [0, 191], 0xB800 [0, 184]) and -1.5 - 2.25 = -3.75 (0xC070 [112, 192], 0xC380 [128, 195]) exactly in both; the ties go to the even neighbour and both directions are pinned -- 1.0 - 2^-9 is halfway between 0.99609375 and 1.0 and answers 1.0 (0x3F80 [128, 63]), 1.0 - 1.5*2^-8 is halfway between 0.9921875 and 0.99609375 and answers 0.9921875 (0x3F7E [126, 63]), and each of the two is asserted to be a tie at all by comparing the distance to both neighbours, so a rule that always rounded up fails the first and one that always rounded down fails the second (f16: 0x3BFF [255, 59] and 0x3BFE [254, 59]); a difference that is not a tie rounds -- 1.0 - 0.1 answers 0.8984375 (0x3F66 [102, 63]) and 0.89990234375 (0x3B33 [51, 59]) -- and is also read against the exact difference in f64, which it must be within the type's own epsilon of (2^-8, 2^-11); 1.5 - 1.5 is +0.0 (0x0000 in both) and -max - max is -infinity (0xFF80 [128, 255], 0xFC00 [0, 252]) rather than a saturation at -max. The result keeps the operands' element type: a one-element array of it is two bytes."
kind = "behavior"
case = "../../../cases/modules/stdlib/reduced_subtraction.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "[80, 64] 3.25\n[0, 191] -0.5\n[112, 192] -3.75\n[128, 63] true\n[126, 63] true\n[102, 63] true\n[0, 0] 0.0\n[128, 255] -inf\n[128, 66] 3.25\n[0, 184] -0.5\n[128, 195] -3.75\n[255, 59] true\n[254, 59] true\n[51, 59] true\n[0, 0] 0.0\n[0, 252] -inf\n2 2\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

# Unary negation of a value that was computed: a sign bit and nothing else.

[[tests]]
name = "reduced_negate"
desc = "`-x` on a bf16 and on an f16 value that was computed rather than written as a literal is a change of the sign bit alone: it does not round, does not widen to f32 and back, and does not touch the significand. On x = 1.0 / 3.0, which no literal writes down (bf16 0x3EAB [171, 62], f16 0x3555 [85, 53]), -x is 0xBEAB [171, 190] and 0xB555 [85, 181] -- the low byte the same and the high byte 128 more, which is the same statement in bytes -- and -(-x) is 0x3EAB again, so neither of two sign flips rounded. A negation after a statement that rounded takes the sign of the rounded result: -(1.0 + 2^-8) is -1.0 (0xBF80 [128, 191], 0xBC00 [0, 188]). Zero keeps the sign a negation gives it: -(1.5 - 1.5) is -0.0 (0x8000 [0, 128]) and -(-0.0) is +0.0 (0x0000), so a negation that normalized zero fails. -(max + max) is -infinity (0xFF80 [128, 255], 0xFC00 [0, 252]) and not -max: the overflow is the sum's, the negation keeps it. -(x * x) and (-x) * x are the same element, because rounding to nearest even is symmetric about zero, so a negation that rounded would break the equality. The result keeps the operands' element type: a one-element array of it is two bytes."
kind = "behavior"
case = "../../../cases/modules/stdlib/reduced_negate.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "[171, 62] [171, 190]\ntrue true\n[171, 62]\n[128, 191]\n[0, 128]\n[0, 0]\n[128, 255]\ntrue\n[85, 53] [85, 181]\ntrue true\n[85, 53]\n[0, 188]\n[0, 128]\n[0, 0]\n[0, 252]\ntrue\n2 2\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

# The reduction the rule re-pointed: the refusal this case asserted became a computation.

[[tests]]
name = "reduced_sum_refused"
desc = "The case that used to assert that `sum` over a bf16 array is refused with SemanticDiag::StaticMatchNotExhaustive now computes, because the rule gives the two types the conversion the `match type` of `sum` was missing: `[2^24, 1, -2^24]` answers bf16 1.0 (an f32 accumulator answers 0, so the width is pinned), the same answer the tensor reduction gives bit for bit, the halfway total [1.0, 2^-8] rounds once with ties to even to 1.0, [1.0, 2^-8, 2^-8] answers 1.0078125 -- so the total is rounded once and not at every addition, which would answer 1.0 -- [65504, 736] rounds to f16 +infinity rather than saturating, and the sum of no elements is the bf16 +0, which prints `0.0` under the text rule of 7.7."
kind = "behavior"
case = "../../../cases/modules/stdlib/reduced_sum_refused.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "1.0 true true false\n[128, 63]\n1.0 true true\n1.01 false true\ninf true true\n0.0 true\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

# The reduction over a bf16 tensor still computes, wider accumulator and one rounding.

[[tests]]
name = "reduced_reduction_bytes"
desc = "A `sum` over a bf16[..] of shape [2, 3] along axis 1 gives two elements in four bytes: row [2^24, 1, -2^24] answers bf16 1.0 (0x3F80, bytes [128, 63]) because the accumulator is wider than f32 (an f32 accumulator answers 0), and row [3, 2^-7, 0] rounds the halfway 3.0078125 once, with ties to even, to bf16 3.0 (0x4040, bytes [64, 64])."
kind = "behavior"
case = "../../../cases/modules/stdlib/reduced_reduction_bytes.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "4\n[128, 63, 64, 64]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

# The array sequence functions that are not reductions: the sorts order four element types and
# refuse a reduced one where the call is written.

[[tests]]
name = "reduced_sort"
desc = "`sort` over an `f16[]`, a `bf16[]`, a `string[]` and a `bool[]`: none has a kernel, so the call runs the body `xs[argsort(xs)]` and orders them as `argsort` does -- the reduced-precision floats as the f32 they widen to, exactly, with -0 below +0."
kind = "behavior"
case = "../../../cases/modules/stdlib/reduced_sort.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "[-1.0, -0.0, 0.0, 2.0, 3.0] [-1.0, 2.0, 3.0]\n[apple, fig, pear] [false, true, true]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

# What diagnostic ReducedPrecisionUnsupported is left about: `%`, which no float has.

[[tests]]
name = "reduced_arithmetic_refused"
desc = "A `%` over two bf16 values has no candidate -- `__mod__` is registered for the integer types only, as it is for f32 -- so the call is refused as SemanticDiag::ReducedPrecisionUnsupported, naming `operator %` and the element type bf16 rather than listing overloads that could never match. `+` over the same values is no longer refused: a bf16 value has the scalar operations of any other float, and reduced_scalar pins what it computes. The case used to write `+`; that change is what re-points it at `%`."
kind = "negative"
case = "../../../cases/modules/stdlib/reduced_arithmetic_refused.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ReducedPrecisionUnsupported"
expect_output_contains = ["operator %", "bf16"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

# The other half of the conversion rule: `as` refuses the narrowing, the written conversion is it.

[[tests]]
name = "reduced_narrowing_as_refused"
desc = "`x as bf16` on an f32 is refused with SemanticDiag::DynamicCastForbidden: the conversion rounds, so a cast that says nothing about that is the wrong form for it, exactly as `x as i32` on an f32 is refused. `bf16(x)` is the written conversion and needs no permission; `b as f32` widens and is accepted, which reduced_scalar writes."
kind = "negative"
case = "../../../cases/modules/stdlib/reduced_narrowing_as_refused.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::DynamicCastForbidden"
expect_output_contains = ["f32", "bf16"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

# The rule's item 2, the three per-element operations it names: `min`, `max` and `abs` over the
# two reduced-precision types, and the two array folds over them that could not compute without
# them. Every line is a byte pair, so a wrong reading moves one.

[[tests]]
name = "reduced_minmax"
desc = "`math::min`/`max`/`abs` over bf16 and f16 are the exact IEEE 754-2019 operations on the value each operand widens to, so each returns one of its operands (or clears the sign) and never rounds: [1.0, 2.0] answers bf16 1.0 (bytes [128, 63]) and 2.0 ([0, 64]), f16 the same with 0x3C00 and 0x4000; min(-0, +0) is -0 (bytes [0, 128]) and max is +0 ([0, 0]) while the two compare equal -- comparing the 16-bit patterns or the raw slots picks +0 for both; abs(-0.0) is the two bytes [0, 0] in both types, so an abs that kept the sign or was written as max(x, -x) moves that line; `array::min`/`max` over [0.0, -0.0] folds to -0.0 and +0.0 by their bytes whatever the element order, over f16 [5.0, 65504.0, -1.0] to -1.0 and 65504.0 (0x7BFF, bytes [255, 123]) -- the largest finite f16 exactly, so a saturation or a re-rounding moves it -- a one-element array to that element, and an empty one to null; and `sum` over the same element types still accumulates in f64 and rounds once ([2^24, 1, -2^24] answers bf16 1.0, bytes [128, 63], where an f32 accumulator answers 0; [1.0, 2^-8, 2^-8] answers 1.0078125, where a rounding per addition answers 1.0). The case was red before the overloads existed: every min/max/abs call here and the two reduce lines of stdlib/array.cml reported SemanticDiag::ReducedPrecisionUnsupported or 'math::min names an operator with 6 signatures'."
kind = "behavior"
case = "../../../cases/modules/stdlib/reduced_minmax.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "1.0 2.0 1.0 2.0\n128 63 0 64\n0 60 0 64\ntrue true true\n0 128 0 0\ntrue true\n0 128 0 0\n0 0 0 0\n3.5 3.5 2.0 2.0\n1.0 2.0\n0 128\n0 0\ntrue true true\n-1.0 65500.0\n255 123\n0.1 205\n1.0 true 128 63\n1.01 true 129 63\n1.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000