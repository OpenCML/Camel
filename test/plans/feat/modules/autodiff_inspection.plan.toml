[[tests]]
name = "autodiff.random_input.macro.graph"
case = "../../../cases/modules/autodiff/collapse_random.cml"
args = ["${case}","std::macro","std::jgir"]
verify_script = '''
({ input, assert }) => {
 const doc = JSON.parse(input.normalized.stdout)
 const g = doc.graphs.find(g => g.name === 'main')
 for(const label of ['random::rand', 'rand:seed']) assert(g.nodes.filter(n => n.label === label).length === 1, label + ' executed early or duplicated')
 assert(doc.graphs.some(g => g.name === 'grad(h)'), 'gradient graph missing')
}
'''

[[tests]]
name = "autodiff.random_input.macro.results"
case = "../../../cases/modules/autodiff/collapse_random.cml"
args = ["${case}","std::macro","${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["stdout_normalized"]
verify_script = '''
({ input, assert, match, approx }) => {
 const m = match(/^collapse_random x=(\S+) dh=(\S+)$/, input.normalized.stdout.trim())
 const x = Number(m[1]), dy = Number(m[2])
 assert(x >= 0 && x < 1, 'random input outside range')
 assert(approx(dy, (x + x) + (3 * (x + 1) + 3 * (x + 1)), 1e-13), 'wrong derivative')
 assert(x === 0.4138508284758604, 'seed/draw order changed')
}
'''

[[tests]]
name = "autodiff.random_input.opt.graph"
case = "../../../cases/modules/autodiff/collapse_random.cml"
args = ["${case}","std::macro","std::opt","std::jgir"]
verify_script = '''
({ input, assert }) => {
 const doc = JSON.parse(input.normalized.stdout)
 const g = doc.graphs.find(g => g.name === 'main')
 for(const label of ['rand:next_key', 'rand:seed']) assert(g.nodes.filter(n => n.label === label).length === 1, label + ' executed early or duplicated')
 assert(g.nodes.some(n => n.label === ':op/mul_d') && g.nodes.some(n => n.label === ':str/format'), 'random gradient folded')
 assert(!g.nodes.some(n => ['CALL', 'FUNC', 'FILL', 'ACCS'].includes(n.kind)), 'calls remained')
}
'''

