id = "modules.autodiff_inspection"
order = 327
tier = "fast"
tags = ["feat","modules","autodiff","opt","entry_args"]

[defaults]
kind = "behavior"
expect_exit = 0
timeout_ms = 8000
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]

[[tests]]
name = "autodiff.open_input.macro"
case = "../../../cases/modules/autodiff/collapse_runtime.cml"
args = ["${case}","std::macro","std::jgir"]
verify_script = '''
({ input, assert }) => {
 const doc = JSON.parse(input.normalized.stdout)
 const main = doc.graphs.find(g => g.name === 'main')
 for (const name of ['main', '__root__']) assert(doc.graphs.find(g => g.name === name).normalPorts.length === 1, 'open input lost')
 assert(doc.graphs.some(g => g.name === 'grad(h)') && doc.graphs.some(g => g.name === 'sq.pb'), 'gradient graph missing')
 assert(main.nodes.some(n => n.kind === 'CALL'), 'macro invocation missing')
}
'''

[[tests]]
name = "autodiff.open_input.opt"
case = "../../../cases/modules/autodiff/collapse_runtime.cml"
args = ["${case}","std::macro","std::opt","std::jgir"]
verify_script = '''
({ input, assert }) => {
 const doc = JSON.parse(input.normalized.stdout)
 const main = doc.graphs.find(g => g.name === 'main')
 for (const name of ['main', '__root__']) assert(doc.graphs.find(g => g.name === name).normalPorts.length === 1, 'open input lost')
 assert(main.nodes.some(n => n.label === ':op/mul_d') && main.nodes.some(n => n.label === ':op/add_d'), 'runtime gradient folded')
 assert(!main.nodes.some(n => ['CALL', 'FUNC', 'FILL', 'ACCS'].includes(n.kind)), 'abstraction remained')
 const ctrl = main.edges.filter(e => e.kind === 'control')
 assert(ctrl.length === 1 && ctrl[0].target === main.exit, 'unnecessary controls')
 assert(main.nodes.find(n => n.id === ctrl[0].source).label === ':io/println', 'print ordering lost')
}
'''

