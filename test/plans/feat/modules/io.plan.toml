id = "modules.io"
order = 377
tier = "fast"
tags = ["feat", "modules", "io", "terminal"]

# `io` is the terminal until `Stream` exists (steps 4 and 10): what stdin has waiting, the keys
# themselves, and raw mode. The standard streams and `print`/`println`/`eprintln`/`input` are the
# prelude's. The cases below need no interactive terminal: the read side is fed through a pipe, and
# the effects and resources are read from the graph and from `inspect --ops`.
#
# The `eprintln` case is the prelude's own: it names no module, and the runner keeps stdout and
# stderr apart, so the case shows the text is on stderr and that the call needs no import.

[[tests]]
name = "eprintln_without_import"
desc = "`eprintln` is in the prelude , so a program calls it without an import; it has println's declaration shape — it returns its first argument — and writes standard error, while the value printed by println goes to standard output."
kind = "behavior"
case = "../../../cases/modules/io/eprintln.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized", "stderr_normalized"]
expect_exit = 0
expect_stdout_exact = "value: to stderr\n"
expect_stderr_contains = ["to stderr 1"]
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 20000

[[tests]]
name = "terminal_read_write_roundtrip"
desc = "`roundtrip.mjs` writes two characters into the child's stdin (a pipe); the program sees them with `has_input`, reads them with `get_char`/`get_chars` and writes them back, and turning raw mode off succeeds."
kind = "behavior"
tool = "node"
case = "../../../cases/modules/io/roundtrip.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["io terminal read/write round trip passed"]
timeout_ms = 20000

[[tests]]
name = "raw_mode_needs_a_terminal"
desc = "Turning raw mode off is a no-op that returns `void`; turning it on where stdin is not a terminal is a `RuntimeError` fault value at the call, not an exit."
kind = "behavior"
case = "../../../cases/modules/io/raw_mode.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "ok\nRuntimeError\n"
timeout_ms = 10000

[[tests]]
name = "effect_on_the_graph"
desc = "`std::jgir` marks the `io:get_chars` node with the `effect` role: the module declares the terminal operators impure (design principles 3.3), so the node is ordered and never folded away."
kind = "behavior"
case = "../../../cases/modules/io/effect_graph.cml"
args = ["${case}", "std::jgir"]
expect_exit = 0
timeout_ms = 10000
verify_script = """
({ input, assert }) => {
const dump = JSON.parse(input.normalized.stdout)
const main = dump.graphs.find((g) => g.nodes.some((n) => n.label === 'io:get_chars'))
assert(main, 'no graph calls io:get_chars')
const node = main.nodes.find((n) => n.label === 'io:get_chars')
assert(node.roles.includes('effect'), `io:get_chars roles: ${JSON.stringify(node.roles)}`)
}
"""

[[tests]]
name = "declared_resources"
desc = "`inspect --ops` reports the resources the module registered: all five operators touch the one `stdin` resource (read, read-modify-write or, for raw mode, write), all external. The terminal mode shares `stdin`, so raw mode and a read must order each other."
kind = "behavior"
case = "../../../cases/modules/io/resources.cml"
args = ["inspect", "--ops", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 20000
verify_script = """
({ input, assert }) => {
const ops = input.normalized.stdout.split('\n').filter((l) => l.startsWith('OPERATOR ')).map((l) => JSON.parse(l.slice(9)))
const byUri = Object.fromEntries(ops.map((o) => [o.uri, o]))
const resources = (uri) => byUri[uri] && byUri[uri].semantics && byUri[uri].semantics.resources
assert(resources('io:set_terminal_raw_mode') === 'write ambient stdin; external', resources('io:set_terminal_raw_mode'))
assert(resources('io:has_input') === 'read ambient stdin; external', resources('io:has_input'))
assert(resources('io:get_char') === 'rmw ambient stdin; external', resources('io:get_char'))
assert(resources('io:get_chars') === 'rmw ambient stdin; external', resources('io:get_chars'))
assert(resources('io:clear_input_buffer') === 'rmw ambient stdin; external', resources('io:clear_input_buffer'))
}
"""

[[tests]]
name = "terminal_mode_and_a_read_are_ordered"
desc = "Raw mode and reading input name the same `stdin` resource , so a terminal-mode call and a stdin read in one body must keep their order: `test::resources` reports both nodes as touching `stdin` and reports the pair as ordered. The case would be red if raw mode went back to a resource of its own, because its node line would name that resource instead."
kind = "behavior"
case = "../../../cases/modules/io/ordering.cml"
args = ["${case}", "test::resources", "std::gir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 20000
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const nodes = out.split('\n').filter((l) => l.startsWith('RESOURCES node '))
const node = (uri) => nodes.find((l) => l.includes(` ${uri}: `))
const raw = node('io:set_terminal_raw_mode')
const read = node('io:get_chars')
assert(raw, 'no node for io:set_terminal_raw_mode')
assert(read, 'no node for io:get_chars')
assert(raw.includes('write ambient stdin; external'), raw)
assert(read.includes('rmw ambient stdin; external'), read)
const id = (line) => Number(line.split(' ')[3])
const pair = out.split('\n').filter((l) => l.startsWith('RESOURCES order ')).find((l) => {
  const ids = l.split(' ').slice(3, 5).map(Number)
  return ids.includes(id(raw)) && ids.includes(id(read))
})
assert(pair, 'the terminal-mode call and the stdin read are not a pair the resources report')
assert(/ ordered by (data|control)$/.test(pair), pair)
}
"""