normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths", "trim_trailing_space"]
timeout_ms = 10000

# 's remaining nuance: a `--timeit` iteration reports a failed pass library through the same
# wrapper as a run. The iteration is a failed iteration (no elapsed time, no summary); the
# library's raw parse diagnostic is not what the user sees.

[[tests]]
name = "timeit_reports_a_failing_pass_library_as_invalid_pass_parameter"
desc = "`--timeit` on an unparsable pass library names the failed iteration, reports InvalidPassParameter with the library's parse error as a secondary location, and prints no bare SyntaxDiag, no elapsed time and no summary."
kind = "negative"
case = "../../../cases/modules/graph_pass/tiny.cml"
args = ["--timeit", "unparsable_pass_lib::run/1", "${case}"]
expect_exit = 1
expect_output_contains = ["[timeit] 1/1 pass=unparsable_pass_lib::run failed", "RuntimeDiag::InvalidPassParameter", "its library 'unparsable_pass_lib' does not compile.", "unparsable_pass_lib.cml:10:5"]
expect_output_not_contains = ["(name=SyntaxDiag::MissingClosingDelimiter", "elapsed=", "mean"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "timeit_json_reports_a_failing_pass_library_as_invalid_pass_parameter"
