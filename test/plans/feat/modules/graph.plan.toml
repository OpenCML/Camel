# The five identities the C++ reference mode applies are the rules library's five integer
# identities (stdlib/rules.cml: int_add_zero, int_sub_zero, int_mul_one, and the int32 versions;
# each law is written once for both operand orders, since the matcher reads the order the operator
# declares commutative -- the deleted int_zero_add and int_one_mul said it a second time). The case
# contains only those forms: the two tests below pin each implementation to the same surviving
# graph (the operand add, and no other operator), so a change to either side turns its test red.
# They are not a byte-for-byte differential: the C++ draft rewrite leaves the neutral operand
# constant dead and attaches the parameter's source span to the port it keeps, while the rule
# engine prunes the constant and its commit leaves the port without a span. Both are engine
# artefacts, not the laws §4 has the diff.

[[tests]]
name = "neutral_identities_by_std_opt_algebra"
desc = "The reference: std::opt::algebra neutral_only=true removes all five identities of both integer types."
kind = "behavior"
case = "../../../cases/modules/graph_pass/neutral_identities.cml"
args = ["${case}", "std::opt::algebra neutral_only=true", "std::opt::dce values_only=true", "std::jgir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths", "normalize_origins"]
verify_script = '''
({input,assert})=>{
 const d=JSON.parse(input.normalized.stdout);
 const g=name=>{const v=d.graphs.find(g=>g.name===name);assert(v,'missing '+name);return v};
 const ops=name=>g(name).nodes.filter(n=>n.kind==='OPER').map(n=>n.label);
 for(const [name,add] of [['five64',':op/add_l'],['five32',':op/add_i']]){
  const o=ops(name);
  assert(o.length===1&&o[0]===add,name+': '+o.join(',')+' (the five identities did not all go)');
  assert(g(name).nodes.every(n=>n.kind!=='DATA'),name+': a neutral operand constant survived dce');
 }
}
'''
timeout_ms = 20000

[[tests]]
name = "neutral_identities_by_the_rule_library"
desc = "rules::simplify removes the same five identities and leaves the same graph: the library has these laws."
kind = "behavior"
case = "../../../cases/modules/graph_pass/neutral_identities.cml"
args = ["${case}", "rules::simplify", "std::opt::dce values_only=true", "std::jgir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths", "normalize_origins"]
verify_script = '''
({input,assert})=>{
 const d=JSON.parse(input.normalized.stdout);
 const g=name=>{const v=d.graphs.find(g=>g.name===name);assert(v,'missing '+name);return v};
 const ops=name=>g(name).nodes.filter(n=>n.kind==='OPER').map(n=>n.label);
 for(const [name,add] of [['five64',':op/add_l'],['five32',':op/add_i']]){
  const o=ops(name);
  assert(o.length===1&&o[0]===add,name+': '+o.join(',')+' (the library did not apply the five)');
  assert(g(name).nodes.every(n=>n.kind!=='DATA'),name+': a neutral operand constant survived dce');
 }
}
'''
timeout_ms = 20000

