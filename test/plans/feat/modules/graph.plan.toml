# A pass module the user is still editing does not parse: the pipeline reports a bad pass
# specification, and the syntax error is a secondary location on it (its file, line and column),
# not text stitched into the message.

[[tests]]
name = "pass_module_that_does_not_compile"
desc = "unparsable_pass::run: the pass is InvalidPassParameter, the message names the pass and its library, and the parse error is a secondary location."
kind = "negative"
case = "../../../cases/modules/graph_pass/tiny.cml"
args = ["${case}", "unparsable_pass::run", "std::nvm"]
expect_exit = 1
expect_output_contains = ["InvalidPassParameter", "its library 'unparsable_pass' does not compile. [SyntaxDiag::MissingClosingDelimiter:", "Expected ')' before 'return', to close the '('.", "at <ROOT>/test/cases/modules/graph_pass/unparsable_pass.cml:8:5]"]
expect_output_not_contains = ["42", "does not compile: SyntaxDiag"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths", "trim_trailing_space"]
timeout_ms = 10000

# The same diagnostic in the text format: the pass module's file, line, column and original line
# are drawn exactly as for any other secondary location.

[[tests]]
name = "pass_module_error_is_a_secondary_location"
desc = "The unparsable pass module's syntax diagnostic is a note with the module's file, line, column and source line; the outer message stays InvalidPassParameter."
kind = "snapshot"
case = "../../../cases/modules/graph_pass/tiny.cml"
args = ["--error-format", "text", "${case}", "unparsable_pass::run", "std::nvm"]
expect_exit = 1
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
golden = "golden/graph_pass_unparsable_diagnostic.txt"
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths", "trim_trailing_space"]
timeout_ms = 10000

# The scope's other direction: an import is a dependency of the program, so a module that does
# not compile makes the program fail at the compile step with that module's diagnostic, before any
# pass runs. A pass library is not a dependency and is handled by pass resolution instead.

[[tests]]
name = "imported_module_that_does_not_compile"
desc = "A program importing a module that does not parse fails at the compile step with that module's parse diagnostic, not with a pass diagnostic."
kind = "negative"
case = "../../../cases/modules/graph_pass/imports_unparsable.cml"
args = ["${case}", "std::nvm"]
expect_exit = 1
expect_output_contains = ["ModuleParseFailed", "SyntaxDiag::MissingClosingDelimiter", "unparsable_pass.cml:8:5"]
expect_output_not_contains = ["InvalidPassParameter", "42"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths", "trim_trailing_space"]
timeout_ms = 10000

# The scope decides what is printed, not only whether the command stops. A pass library on the
# command line is not a module the program is made of, so a run whose program compiles and
# whose pass library does not reports the library through `InvalidPassParameter` (its first
# error as a secondary location) and never through a bare parse diagnostic of its own.

[[tests]]
name = "run_reports_a_failing_pass_library_as_invalid_pass_parameter"
desc = "A healthy program with an unparsable pass library on the pipeline reports InvalidPassParameter naming the library, with the parse error as a secondary location, and no bare SyntaxDiag of the library."
kind = "negative"
case = "../../../cases/modules/graph_pass/tiny.cml"
args = ["${case}", "unparsable_pass_lib::run", "std::nvm"]
expect_exit = 1
expect_output_contains = ["RuntimeDiag::InvalidPassParameter", "its library 'unparsable_pass_lib' does not compile. [SyntaxDiag::MissingClosingDelimiter:", "unparsable_pass_lib.cml:10:5"]
expect_output_not_contains = ["(name=SyntaxDiag::MissingClosingDelimiter", "42"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths", "trim_trailing_space"]
timeout_ms = 10000

# The parse-error path: resolving the pass list loads the pass's library before the program is
# parsed. When the program itself does not parse, that library is still not part of the program:
# the report is the entry module's syntax error, and the library's file does not appear.

[[tests]]
name = "run_parse_failure_report_excludes_the_pass_library"
desc = "A program that does not parse, with an unparsable pass library on the pipeline, reports only the program's syntax error; the pass library's file and diagnostic are absent."
kind = "negative"
case = "../../../cases/modules/graph_pass/unparsable_pass.cml"
args = ["${case}", "unparsable_pass_lib::run"]
expect_exit = 1
expect_output_contains = ["(name=SyntaxDiag::MissingClosingDelimiter", "unparsable_pass.cml:8:5"]
expect_output_not_contains = ["unparsable_pass_lib.cml", "InvalidPassParameter"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "run_parse_failure_counts_only_the_program_files"
desc = "The text format of the same parse failure prints one error in the summary (`camel: 1 error`) and no line from the pass library."
kind = "negative"
case = "../../../cases/modules/graph_pass/unparsable_pass.cml"
args = ["--error-format", "text", "${case}", "unparsable_pass_lib::run"]
expect_exit = 1
expect_output_contains = ["error[SyntaxDiag::MissingClosingDelimiter]", "unparsable_pass.cml:8:5", "camel: 1 error"]
expect_output_not_contains = ["unparsable_pass_lib.cml", "InvalidPassParameter", "camel: 2 errors"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths", "trim_trailing_space"]
timeout_ms = 10000

# The compile path: the program's own imported module fails, so the program fails as a program;
# the pass library that was loaded with the pass list is outside the report and outside the
# error count. Before its parse error was printed as a second module's diagnostics and counted
# in the summary (`camel: 3 errors`).

[[tests]]
name = "run_compile_failure_report_excludes_the_pass_library"
desc = "A program whose imported module does not parse, with an unrelated unparsable pass library on the pipeline, reports the program's two modules and not the library's diagnostic or file."
kind = "negative"
case = "../../../cases/modules/graph_pass/imports_unparsable.cml"
args = ["${case}", "unparsable_pass_lib::run", "std::nvm"]
expect_exit = 1
expect_output_contains = ["(name=SemanticDiag::ModuleParseFailed", "unparsable_pass.cml:8:5"]
expect_output_not_contains = ["unparsable_pass_lib.cml"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "run_compile_failure_counts_only_the_program_modules"
desc = "The text format of the same compile failure counts the program's two errors (`camel: 2 errors`), not a third from the pass library."
kind = "negative"
case = "../../../cases/modules/graph_pass/imports_unparsable.cml"
args = ["--error-format", "text", "${case}", "unparsable_pass_lib::run", "std::nvm"]
expect_exit = 1
expect_output_contains = ["[imported by main]", "unparsable_pass.cml:8:5", "camel: 2 errors"]
expect_output_not_contains = ["unparsable_pass_lib.cml", "camel: 3 errors"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths", "trim_trailing_space"]
timeout_ms = 10000

# The same answer in JSON: `-E json` prints the failed modules of the scope. The library's module
