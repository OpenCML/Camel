# The mode is not the library's simplify: it applies the five laws and nothing else. These four
# forms are exact laws of the library over the same integer names, and the mode must keep them.

[[tests]]
name = "neutral_mode_keeps_the_other_laws"
desc = "neutral_only=true leaves x*0, x-x, x/1 and -(-x): the mode's set is only the five neutral elements."
kind = "behavior"
case = "../../../cases/modules/graph_pass/neutral_kept.cml"
args = ["${case}", "std::opt::algebra neutral_only=true", "std::jgir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths", "normalize_origins"]
verify_script = '''
({input,assert})=>{
 const d=JSON.parse(input.normalized.stdout);
 const g=d.graphs.find(g=>g.name==='other');assert(g,'missing other');
 const ops=g.nodes.filter(n=>n.kind==='OPER').map(n=>n.label);
 const count=l=>ops.filter(x=>x===l).length;
 assert(count(':op/mul_l')===1,'x*0 was simplified by the neutral mode');
 assert(count(':op/sub_l')===1,'x-x was simplified by the neutral mode');
 assert(count(':op/div_l')===1,'x/1 was simplified by the neutral mode');
 assert(count(':op/neg_l')===2,'-(-x) was simplified by the neutral mode');
}
'''
timeout_ms = 20000

[[tests]]
name = "the_library_simplifies_the_other_laws"
desc = "rules::simplify removes those same four forms: the difference is the mode, not a law the library lacks."
kind = "behavior"
case = "../../../cases/modules/graph_pass/neutral_kept.cml"
args = ["${case}", "rules::simplify", "std::opt::dce values_only=true", "std::jgir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths", "normalize_origins"]
verify_script = '''
({input,assert})=>{
 const d=JSON.parse(input.normalized.stdout);
 const g=d.graphs.find(g=>g.name==='other');assert(g,'missing other');
 const ops=g.nodes.filter(n=>n.kind==='OPER').map(n=>n.label);
 const count=l=>ops.filter(x=>x===l).length;
 assert(count(':op/mul_l')===1,'the library did not fold the four laws into the product');
 assert(count(':op/sub_l')===0,'x-x survived the library');
 assert(count(':op/div_l')===0,'x/1 survived the library');
 assert(count(':op/neg_l')===0,'-(-x) survived the library');
}
'''
timeout_ms = 20000

# The precise limit of the reference mode, and the reason the C++ file is not deleted: it keeps the
# graph's named node (the C++ pass's isReplaceable), while the rule engine rewrites it and moves the
# anchor onto what the rule's right side wrote -- the handover the rule makes the engine's job and
# not a rule condition (` `, `rule-conditions-and-policy` item 3). Both facts are pinned here so
# that neither can drift silently.

[[tests]]
name = "neutral_mode_keeps_the_named_node"
desc = "neutral_only=true leaves x+0 when that add is the graph's return node."
kind = "behavior"
case = "../../../cases/modules/graph_pass/neutral_target.cml"
args = ["${case}", "std::opt::algebra neutral_only=true", "std::jgir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths", "normalize_origins"]
verify_script = '''
({input,assert})=>{
 const d=JSON.parse(input.normalized.stdout);
 const g=d.graphs.find(g=>g.name==='anchor');assert(g,'missing anchor');
 const add=g.nodes.find(n=>n.label===':op/add_l');
 assert(add,'the neutral mode simplified the graph\'s named node');
 assert(g.exit===add.id,'the anchor graph exits at a node other than the add');
}
'''
timeout_ms = 20000

[[tests]]
name = "the_rule_engine_retargets_the_named_node"
desc = "rules::simplify rewrites the same add and moves the graph's return to the port: the rule engine's job is the handover, not the refusal the C++ pass's isReplaceable applies (the 2026-10-23 ruling, `rule-conditions-and-policy` item 3)."
kind = "behavior"
case = "../../../cases/modules/graph_pass/neutral_target.cml"
args = ["${case}", "rules::simplify", "std::jgir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths", "normalize_origins"]
verify_script = '''
({input,assert})=>{
 const d=JSON.parse(input.normalized.stdout);
 const g=d.graphs.find(g=>g.name==='anchor');assert(g,'missing anchor');
 assert(!g.nodes.some(n=>n.label===':op/add_l'),'the rule engine kept the named add');
 const x=g.nodes.find(n=>n.kind==='PORT');assert(x,'missing the port');
 assert(g.exit===x.id,'the graph does not exit at the port');
}
'''
timeout_ms = 20000

