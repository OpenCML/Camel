id = "modules.stdlib_values"
order = 369
tier = "feat"
tags = ["feat", "modules", "stdlib", "consistency"]
desc = "The core standard library (str, math, statistics, array): values on the four back ends and through the optimizing pipelines, checked against golden files"

# Every case prints what the library functions return, including the boundaries (empty string
# or array, non-ASCII text, invalid UTF-8, NaN, the largest and smallest integers). Each runs
# on std::nvm, std::fvm, std::jit and std::prl; the four agree and the output is the golden
# file's. The same golden file is then required of std::opt::inline std::opt and std::macro
# std::opt: every operator used here is declared pure, so these pipelines fold, merge and
# drop calls.

[defaults]
kind = "snapshot"
snapshot_stream = "stdout"
snapshot_compare = "text_exact"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_output_not_contains = ["[Error]", "Floating point exception", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

[[tests]]
name = "stdlib.str_bytes"
desc = "The str module (code points): split, trim, case, replace, find, substr, starts_with/ends_with, repeat, bytes/from_bytes and indexing, with empty strings and non-ASCII text."
case = "../../../cases/modules/stdlib/str_bytes.cml"
golden = "golden/stdlib/str_bytes.txt"

[[tests]]
name = "stdlib.str_bytes.inline_opt"
desc = "The same through std::opt::inline std::opt."
case = "../../../cases/modules/stdlib/str_bytes.cml"
golden = "golden/stdlib/str_bytes.txt"
backends = false
args = ["${case}", "std::opt::inline", "std::opt", "std::fvm"]

[[tests]]
name = "stdlib.str_bytes.macro_opt"
desc = "The same through std::macro std::opt."
case = "../../../cases/modules/stdlib/str_bytes.cml"
golden = "golden/stdlib/str_bytes.txt"
backends = false
args = ["${case}", "std::macro", "std::opt", "std::nvm"]

