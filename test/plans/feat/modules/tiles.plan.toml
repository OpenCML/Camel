[[tests]]
name = "gpu_scope.host_effect_is_the_boundary"
desc = "A host effect in a `#gpu` scope is the scope's boundary, not a refusal (plan 2.4, question 3): `println` written between two device operators stays on the host, and the scope is still one device unit around it. Before the rule the same program stopped with 'cannot run on the device' on `:io/println`, and the effect could not be written at all. The effect is a statement of the body's chain and the pass cuts the body into segments beside it, so the scope runs as two segments with the effect between them: a statement a segment replaces hands its place in the chain, and what that place carried, to the call that replaces it. `--devices cpu` runs the segments on the host, writes no transfer at all, and still prints what the effect observes — nothing waits, so the run counts no synchronisation. While the fix was missing the effect kept no edge to the exit, so the run printed `main`'s observation alone with the effect's transfer beside it, unwritten: this entry is red on exactly that, the body's line is missing."
