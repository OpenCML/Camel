# a literal operand beside a tensor takes the tensor's element type (design principles 5.1),
# so `x * 2.0` leaves no f64 operand on the graph. Before this the graph carried one, and the
# device program builder excluded the operator as a `scalar_tensor_operand` (no f64 scalar
# lowering), so every `#gpu` scope that scaled by a constant was refused.

[[tests]]
name = "literal.tensor_element_type_is_a_segment"
desc = "`x * 2.0`, `1.0 - x` and `x / 0.0` over an `f32` tensor form one device region each, with the literal as a region input and no `scalar_tensor_operand` exclusion; the results are the ordinary ones. The `bf16` tensor's operator is no longer excluded for that reason either."
kind = "behavior"
case = "../../../cases/gpu/nofallback/scalar_literal.cml"
args = ["--devices", "cpu", "${case}", "std::nvm"]
envs = ["CUDA_VISIBLE_DEVICES=-1"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const plans = input.stdout.split(/\r?\n/).filter((line) => line.startsWith('{')).map(JSON.parse)
assert(plans.length === 4, `expected four graph region analyses, got ${plans.length}`)
const names = ['scale', 'shift', 'divide', 'bf16_scale']
plans.forEach((plan, i) => {
  const excluded = plan.excluded.map((e) => e.reason)
  assert(!excluded.includes('scalar_tensor_operand'),
    `${names[i]} must not be excluded as a scalar-tensor operand: ${JSON.stringify(plan.excluded)}`)
})
// The scale/shift/divide graphs: the literal is a region input, the operator is the one member.
plans.slice(0, 3).forEach((plan, i) => {
  assert(plan.regions.length === 1, `${names[i]} must form one region: ${JSON.stringify(plan)}`)
  assert(plan.regions[0].members.length === 1, `${names[i]} region members: ${plan.regions[0].members.length}`)
  assert(plan.regions[0].inputs.length === 2, `${names[i]} region inputs: ${plan.regions[0].inputs.length}`)
  assert(plan.transfers.uploads.length === 1 && plan.transfers.downloads.length === 1,
    `${names[i]} transfers: ${JSON.stringify(plan.transfers)}`)
})
assert(input.stdout.includes('12.0'), input.stdout)
assert(input.stdout.includes('-3.0'), input.stdout)
}
"""
timeout_ms = 30000

