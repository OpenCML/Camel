[[tests]]
name = "gpu_scope.inspect_segments"
desc = "What a `#gpu` scope is, read without a device (plan 2.1-2.3, 2.5): the body of a function tagged `#gpu` or `#cpu` is one segment of its own operators, an empty scope is planned as nothing at all (question 5: an empty scope is not a defect), and a body written in a loop keeps its segment in the loop."
kind = "behavior"
case = "../../../cases/modules/tiles/gpu_scope_inspect.cml"
args = ["--devices", "cpu", "${case}", "std::nvm"]
envs = ["CUDA_VISIBLE_DEVICES=-1"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const NL = String.fromCharCode(10)
const lines = (input.normalized.stdout + input.normalized.stderr).split(NL).filter(Boolean)
const plan = (label) => {
