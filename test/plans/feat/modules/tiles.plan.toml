[[tests]]
name = "placement.query"
desc = "The placement query resolves a node from its own fact, then the nearest tagged region, then the function body. `tiles::compile` prints the answer as one TILES_PLACEMENT JSON line per graph; the pass still does not choose an executor. A nested `#cpu` block overrides an outer `#gpu` block, an untagged function is the host, and a `#gpu` body is a device unit with a host escape inside it."
kind = "behavior"
case = "../../../cases/modules/tiles/placement_query.cml"
args = ["--devices", "cpu", "${case}", "tiles::compile", "std::nvm"]
envs = ["CUDA_VISIBLE_DEVICES=-1"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const rows = input.normalized.stdout.split('\n')
  .filter((line) => line.startsWith('TILES_PLACEMENT '))
  .map((line) => JSON.parse(line.slice('TILES_PLACEMENT '.length)))
assert(rows.length >= 3, `placement lines: ${rows.length}`)
const byName = new Map(rows.map((row) => [row.graph, row]))
const graph = (name) => {
  const found = byName.get(name)
  assert(found, `no placement line for ${name}: ${rows.map((r) => r.graph)}`)
  return found
}
// The tagged function is a device unit; its `#cpu` block is the inner scope and wins.
const onDevice = graph('on_device')
assert(onDevice.body === 'gpu-required', onDevice.body)
assert(onDevice.body_fact === 'gpu', onDevice.body_fact)
assert(onDevice.gpu_required > 0, JSON.stringify(onDevice))
assert(onDevice.host > 0, JSON.stringify(onDevice))
const escaped = onDevice.regions.find((region) => region.fact === 'cpu')
assert(escaped, JSON.stringify(onDevice.regions))
assert(escaped.host > 0 && escaped.gpu === 0 && escaped.gpu_required === 0,
  JSON.stringify(escaped))
// An untagged function is the host.
const plain = graph('plain')
assert(plain.body === 'host', plain.body)
assert(plain.body_fact === '', plain.body_fact)
assert(plain.gpu === 0 && plain.gpu_required === 0, JSON.stringify(plain))
assert(plain.host === plain.nodes, JSON.stringify(plain))
// An untagged graph whose body is a `#gpu` block: the block's nodes are on the device, the
// graph body is not, and the `#cpu` block inside it is the inner scope.
const blocks = graph('blocks')
assert(blocks.body === 'host', blocks.body)
assert(blocks.gpu > 0, JSON.stringify(blocks))
assert(blocks.gpu_required === 0, JSON.stringify(blocks))
const outer = blocks.regions.find((region) => region.fact === 'gpu')
const inner = blocks.regions.find((region) => region.fact === 'cpu')
assert(outer && outer.gpu > 0 && outer.host === 0 && outer.gpu_required === 0,
  JSON.stringify(blocks.regions))
assert(inner && inner.host > 0 && inner.gpu === 0 && inner.gpu_required === 0,
  JSON.stringify(blocks.regions))
assert(inner.parent === outer.id, `inner ${inner.id} parent ${inner.parent}, outer ${outer.id}`)
// An untagged graph outside any block stays entirely on the host.
const main = graph('main')
assert(main.body === 'host' && main.gpu === 0 && main.gpu_required === 0, JSON.stringify(main))
assert(main.host === main.nodes, JSON.stringify(main))
}
"""
timeout_ms = 30000

