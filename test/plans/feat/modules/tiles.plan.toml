[[tests]]
name = "slice_bounds_rejected_before_cuda"
kind = "negative"
case = "../../../cases/modules/tiles/slice_bounds.cml"
args = ["${case}", "std::nvm"]
envs = ["CAMEL_TILES_DEVICE=invalid"]
expect_exit = 1
expect_output_contains = ["slice bounds 0..9 are outside axis 0 of extent 3"]
timeout_ms = 10000

[[tests]]
name = "plan"
kind = "behavior"
case = "../../../cases/modules/tiles/plan.cml"
args = ["${case}"]
envs = ["CAMEL_TILES_DEVICE=invalid"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const p = JSON.parse(input.stdout)
assert(p.schema === 1 && p.kernels === 1, 'expected one fused kernel')
assert(p.values === 4 && p.materialized_values === 2, 'unexpected fusion boundary')
assert(p.logical_bytes === 48 && p.allocated_bytes === 24, 'unexpected memory plan')
}
"""
timeout_ms = 10000

