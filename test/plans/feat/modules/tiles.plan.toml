  return JSON.parse(lines[at].slice(label.length + 1))
}
const pair = plan('pair'), empty = plan('empty'), loop = plan('accumulated'), host = plan('kept')
assert(pair.stages.length === 1, `pair: ${JSON.stringify(pair.stages)}`)
assert(pair.stages[0].members.length === 3, `pair members: ${JSON.stringify(pair.stages)}`)
assert(empty.stages.length === 0, `empty: ${JSON.stringify(empty.stages)}`)
assert(loop.stages.length === 1 && loop.stages[0].members.length >= 1,
  `accumulated: ${JSON.stringify(loop.stages)}`)
assert(host.stages.length === 1, `kept: ${JSON.stringify(host.stages)}`)
