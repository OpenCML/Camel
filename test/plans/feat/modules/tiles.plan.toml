[[tests]]
name = "gpu_scope.macro_expansion_publishes_the_derived_graph"
desc = "With `std::macro` before the pass the scope holds the derived graph instead of the macro operator: it is refused for a tensor operator of the backward pass (`broadcast_like`, which the device back end does not lower), and `TILES_PLACEMENT` shows `grad(loss)` as a `#gpu` body — the derived graph inherits the primal's placement (plan 2.3, 2.6)."
kind = "negative"
case = "../../../cases/gpu/nofallback/grad_expand.cml"
args = ["--devices", "cpu", "${case}", "std::macro", "tiles::compile", "std::nvm"]
envs = ["CUDA_VISIBLE_DEVICES=-1"]
expect_exit = 1
expect_output_not_contains = ["is a macro operator no pass has expanded"]
verify_script = """
({ input, assert }) => {
const NL = String.fromCharCode(10)
const lines = (input.normalized.stdout + input.normalized.stderr).split(NL).filter(Boolean)
const row = lines.find((line) => line.startsWith('TILES_PLACEMENT') && line.includes('"graph":"grad(loss)"'))
assert(row, `no placement row for grad(loss): ${JSON.stringify(lines.filter((l) => l.startsWith('TILES_PLACEMENT')).map((l) => l.slice(0, 80)))}`)
const report = JSON.parse(row.slice('TILES_PLACEMENT '.length))
assert(report.body === 'gpu-required' && report.body_fact === 'gpu', row)
assert(report.gpu_required === report.nodes, row)
const refusal = lines.find((line) => line.includes("scope 'grad(loss)'"))
assert(refusal, JSON.stringify(lines.filter((l) => l.includes('scope '))))
assert(refusal.includes("operator 'tensor:"), refusal)
assert(refusal.includes('cannot run on the device'), refusal)
assert(!lines.some((l) => l.includes('autodiff:with_grad')), 'the scope still holds the runtime operator')
}
"""
timeout_ms = 30000

[[tests]]
name = "literal.type_is_the_element_type"
desc = "The graph itself: the literal operand of a tensor operator is built in the tensor's element type (`f32` beside an `f32` tensor, `bf16` beside a `bf16` one, and the tensor parameter of the `f64` spelling stays `float`). Printed as GIR, where every DATA node states its value type."
kind = "behavior"
case = "../../../cases/gpu/nofallback/scalar_literal.cml"
args = ["--devices", "cpu", "${case}", "std::gir"]
envs = ["CUDA_VISIBLE_DEVICES=-1"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const data = (label) => input.stdout.split(/\r?\n/).filter((line) =>
  line.includes(`[label="${label}", type="DATA"`))
assert(data('2.0').length === 2, `two 2.0 literals expected: ${data('2.0').length}`)
for (const line of data('2.0')) {
  assert(/value_type="(f32|bf16)"/.test(line), `2.0 must be an element type, not f64: ${line}`)
  assert(!/value_type="float"/.test(line), `2.0 must not stay a float: ${line}`)
}
const byElement = data('2.0').map((line) => /value_type="([^"]+)"/.exec(line)[1]).sort()
assert(byElement.join(',') === 'bf16,f32', `one f32 and one bf16 literal expected: ${byElement}`)
for (const label of ['1.0', '0.0']) {
  assert(data(label).length === 1, `${label}: ${data(label).length}`)
  assert(/value_type="f32"/.test(data(label)[0]), `${label} must be f32: ${data(label)[0]}`)
}
}
"""
timeout_ms = 30000