[[tests]]
name = "cast_like_aliases_the_same_element_type"
kind = "behavior"
case = "../../../cases/modules/tiles/cast_like.cml"
args = ["--devices", "cpu", "${case}", "std::macro"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const lines = input.stdout.trim().split('\n');
assert(lines.length === 4, 'expected the value, the error and two plans');
assert(lines[0].includes('dtype=float32'), 'cast-to-self changed the element type');
assert(lines[1] === '0.0', 'gradient of sum(x) is not all ones');
const withCast = JSON.parse(lines[2]);
const plain = JSON.parse(lines[3]);
for (const key of ['values', 'kernels', 'materialized_values', 'allocations', 'logical_bytes', 'allocated_bytes', 'borrowed_inputs', 'borrowed_bytes'])
    assert(withCast[key] === plain[key], 'cast or cast_like materialized a value: ' + key);
assert(JSON.stringify(withCast.stages) === JSON.stringify(plain.stages), 'cast or cast_like changed the stage plan');
assert(withCast.operator_contracts.some(c => c.identity === 'tensor:cast'), 'the cast was not seen');
assert(withCast.operator_contracts.some(c => c.identity === 'tensor:cast_like'), 'the cast_like was not seen');
assert(!plain.operator_contracts.some(c => c.identity === 'tensor:cast' || c.identity === 'tensor:cast_like'), 'the plain derivative names a cast');
}
"""
timeout_ms = 180000

