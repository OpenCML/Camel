[[tests]]
name = "gpu_scope.a_function_the_device_refuses_names_the_operator"
desc = "A report operator on a function the device back end refuses: `source<noisy>` where `noisy` prints. The reading is a dispatch decision and not a fault, so `RuntimeDiag::GraphNoDeviceProgram` (0x040001AA) names the operator that asked ('tiles:source'), the graph it asked for ('noisy') and what the back end said (the effectful operator inside it) — a named diagnostic with a code, not the `RuntimeError` that said 'An error has occurred', and not a `#gpu` scope, which this graph is not. The effect is still not executed, and the message the earlier entry pinned is preserved inside it. Red when a capability miss is reported as a runtime fault, when the operator or the graph is not named, or when the effect runs."
kind = "negative"
case = "../../../cases/modules/tiles/reject_effect.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::GraphNoDeviceProgram"
expect_diagnostic_code = "0x040001AA"
expect_output_contains = ["'tiles:source' has no device program for 'noisy'", "unsupported or effectful operator ':io/println'"]
expect_output_not_contains = ["RuntimeDiag::RuntimeError", "BODY MUST NOT EXECUTE"]
timeout_ms = 30000

[[tests]]
name = "gpu_scope.a_run_without_a_device_names_its_own_configuration"
desc = "`benchmark` on a whole graph in a run that has no device (`--devices cpu`): the report needs the device to compile and run the plan, so this is a capability miss again — `RuntimeDiag::DeviceNotSelected` (0x040001AB) names the operator ('tiles:benchmark') and the run's own configuration, which the message carries verbatim ('the run selected the host only (--devices cpu)'). `DeviceUnavailable` is the other shape of this: there the run named a device that must exist. Red when a run that says it has no device is reported as a runtime fault."
kind = "negative"
case = "../../../cases/modules/tiles/gpu_scope_benchmark.cml"
args = ["--devices", "cpu", "${case}"]
envs = ["CUDA_VISIBLE_DEVICES=-1"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::DeviceNotSelected"
expect_diagnostic_code = "0x040001AB"
expect_output_contains = ["No device to run 'tiles:benchmark' on", "the run selected the host only (--devices cpu)"]
expect_output_not_contains = ["RuntimeDiag::RuntimeError"]
timeout_ms = 30000

[[tests]]
name = "gpu_scope.regions_reads_the_segments_of_the_shared_cases"
desc = "`tiles::regions` on the module's own region cases through `tiles::compile`: every exec call the pass wrote is reported as a segment of its own, with the region analysis of the graph it carries, and none of them is one of the wrapper's `excluded` entries any more (`context_arguments` was the reason it gave for a call with context arguments). `detour` is the reading that shows the split: the host call in its middle makes two segments (`detour/tiles.region/1`, `/2`), and each is analysed on its own. Red when a cut scope's exec call is read as an exclusion, when the wrapper's own (empty) region analysis is all the report has, or when a split at a host call folds back into one segment."
kind = "behavior"
case = "../../../cases/modules/tiles/regions.cml"
args = ["--devices", "cpu", "${case}", "tiles::compile", "std::nvm"]
envs = ["CUDA_VISIBLE_DEVICES=-1"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const NL = String.fromCharCode(10)
const lines = input.normalized.stdout.split(NL).filter(Boolean).filter((line) => !line.startsWith('TILES_'))
assert(lines.length === 6, `expected six graph region analyses: ${JSON.stringify(lines.map((l) => l.slice(0, 40)))}`)
const plans = lines.map(JSON.parse)
for (const [at, plan] of plans.entries()) {
  assert(Array.isArray(plan.segments), `line ${at}: no segments array`)
  assert(!plan.excluded.some((e) => e.reason === 'context_arguments'),
    `line ${at}: an exec call is still excluded as context arguments: ${JSON.stringify(plan.excluded)}`)
}
const [chain, dynamic, detour] = plans
assert(chain.segments.length === 1 && chain.segments[0].graph.startsWith('chain/tiles.region/'), JSON.stringify(chain.segments))
assert(chain.segments[0].regions.length === 1 && chain.segments[0].regions[0].members.length === 2, JSON.stringify(chain.segments))
assert(chain.segments[0].transfers.uploads.length === 1 && chain.segments[0].transfers.downloads.length === 1, JSON.stringify(chain.segments))
assert(dynamic.segments.length === 0, JSON.stringify(dynamic.segments))
assert(detour.segments.length === 2, JSON.stringify(detour.segments.map((s) => s.graph)))
assert(detour.segments.every((s) => s.graph.startsWith('detour/tiles.region/') && s.regions.length === 1), JSON.stringify(detour.segments))
}
"""
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 30000

[[tests]]
name = "literal.type_is_the_element_type"
desc = "The graph itself: the literal operand of a tensor operator is built in the tensor's element type (`f32` beside an `f32` tensor, `bf16` beside a `bf16` one, and the tensor parameter of the `f64` spelling stays `float`). Printed as GIR, where every DATA node states its value type."
kind = "behavior"
case = "../../../cases/gpu/nofallback/scalar_literal.cml"
args = ["--devices", "cpu", "${case}", "std::gir"]
envs = ["CUDA_VISIBLE_DEVICES=-1"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const data = (label) => input.stdout.split(/\r?\n/).filter((line) =>
  line.includes(`[label="${label}", type="DATA"`))
assert(data('2.0').length === 2, `two 2.0 literals expected: ${data('2.0').length}`)
for (const line of data('2.0')) {
  assert(/value_type="(f32|bf16)"/.test(line), `2.0 must be an element type, not f64: ${line}`)
  assert(!/value_type="float"/.test(line), `2.0 must not stay a float: ${line}`)
}
const byElement = data('2.0').map((line) => /value_type="([^"]+)"/.exec(line)[1]).sort()
assert(byElement.join(',') === 'bf16,f32', `one f32 and one bf16 literal expected: ${byElement}`)
for (const label of ['1.0', '0.0']) {
  assert(data(label).length === 1, `${label}: ${data(label).length}`)
  assert(/value_type="f32"/.test(data(label)[0]), `${label} must be f32: ${data(label)[0]}`)
}
}
"""
timeout_ms = 30000

