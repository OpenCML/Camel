[[tests]]
name = "gpu_scope.report_without_a_pass_reads_the_whole_graph"
desc = "The same program without `tiles::compile`: no pass has cut anything, so the same three operators read the whole graph — one plan (`values:7`, `kernels:1`, no `segments` reading), one region whose three members are the scope's statements, one upload and one download, and one generated program with no segment header. The report's `schema` is 1, and stays 1 while fields are only added: it goes up when a field that is already there changes meaning or is removed, so a reader finds the reading by its leading `{\"schema\":1,`. Red when the segment reading is taken without a cut scope (it would have nothing to read), when the whole-graph reading is lost, or when the number moves for a field that was only added."
kind = "behavior"
case = "../../../cases/modules/tiles/gpu_scope_report.cml"
args = ["--devices", "cpu", "${case}"]
envs = ["CUDA_VISIBLE_DEVICES=-1"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const NL = String.fromCharCode(10)
const lines = input.normalized.stdout.split(NL).filter(Boolean).filter((line) => !line.startsWith('TILES_'))
const inspect = lines.find((line) => line.startsWith('inspect '))
const regions = lines.find((line) => line.startsWith('{"schema":1,'))
const sourceAt = lines.findIndex((line) => line.startsWith('source // Generated by Camel Tiles'))
assert(inspect && regions && sourceAt >= 0, JSON.stringify(lines.slice(0, 3).map((l) => l.slice(0, 120))))
const plan = JSON.parse(inspect.slice('inspect '.length))
assert(plan.segments === undefined, inspect)
assert(plan.values === 7 && plan.kernels === 1, JSON.stringify(plan))
const analysis = JSON.parse(regions)
// The number says when the report's meaning changed, not how many fields it has: a field that is
// only added leaves it where it is, so the documented keys are all present and none of them had to
// be paid for with a new number (docs/design/gpu/plan.cn.md, section on the residency conclusion).
assert(analysis.schema === 1, `the regions report says schema ${analysis.schema}`)
for (const key of ['segments', 'regions', 'transfers']) {
assert(key in analysis, `the regions report has no ${key}`)
}
assert(analysis.segments.length === 0, regions)
assert(analysis.regions.length === 1 && analysis.regions[0].members.length === 3, regions)
assert(analysis.transfers.uploads.length === 1 && analysis.transfers.downloads.length === 1, regions)
const source = lines.slice(sourceAt).join(NL)
assert(!source.includes('// segment '), source.slice(0, 200))
assert(source.includes('extern "C" __global__'), source.slice(0, 200))
assert(lines.includes('value 18.0'), input.normalized.stdout)
}
"""
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 30000

