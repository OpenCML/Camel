const lines = input.normalized.stdout.split(String.fromCharCode(10)).filter(Boolean)
const observed = lines.indexOf('12.0')
const result = lines.findIndex((line) => line.includes('result [3.0, 5.0, 7.0]'))
assert(observed >= 0, input.stdout)
assert(result > observed, input.stdout)
assert(report.device_work.kernels >= 1, JSON.stringify(report.device_work))
assert(report.device_work.syncs === 3, JSON.stringify(report.device_work))
// sum(y) answers y's element type f32, so the value the host reads where the `println` sits is 4
