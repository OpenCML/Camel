[[tests]]
name = "regions.nvm"
kind = "behavior"
case = "../../../cases/modules/tiles/regions.cml"
args = ["${case}", "std::nvm"]
envs = ["CAMEL_TILES_DEVICE=invalid"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const plans = input.stdout.trim().split(/\r?\n/).map(JSON.parse)
assert(plans.length === 6, "expected six graph region analyses")
assert(plans[0].transfers.uploads.length === 1 && plans[0].transfers.downloads.length === 1, "chain needs one upload and one download")
assert(plans[1].transfers.uploads.length === 0 && plans[1].transfers.downloads.length === 0, "CPU-only graph needs no transfers")
assert(plans[2].transfers.uploads.length === 2 && plans[2].transfers.downloads.length === 2 && plans[2].transfers.resident.length === 1, "CPU detour must retain its direct resident edge")
assert(!plans[2].transfers.uploads.includes(plans[2].transfers.resident[0].value), "resident edge must not upload again")
assert(plans[5].transfers.uploads.length === 1, "embedded axis and keepdims must not upload")
const [chain, dynamic, detour, ordered, sharedValues, constantAxis] = plans
assert(chain.regions.length === 1 && chain.regions[0].members.length === 2, "static pointwise chain must form one region")
assert(chain.regions[0].inputs.length === 1 && chain.regions[0].outputs.length === 1, "region boundary must deduplicate inputs")
assert(chain.regions[0].parameters.length === 1, "one external value must become one function parameter")
assert(sharedValues.regions.length === 1 && sharedValues.regions[0].result_arity === 2 && sharedValues.regions[0].extracted_nodes === 5, "shared external results must be packed into a tuple")
assert(constantAxis.regions.length === 1 && constantAxis.regions[0].inputs.length === 3 && constantAxis.regions[0].parameters.length === 1, "axis and keepdims must remain constants in extracted graphs")
assert(dynamic.regions.length === 0 && dynamic.excluded.some(n => n.reason === "unresolved_type"), "unknown shapes must not claim static compilation")
assert(detour.regions.length === 2 && detour.regions.every(r => r.members.length === 1), "CPU detour must prevent cyclic contraction")
assert(detour.regions[1].inputs.length === 2, "second region must retain both CPU and GPU dependencies")
assert(ordered.excluded.some(n => n.reason === "control_edge") && ordered.regions.every(r => r.members.length === 1), "control endpoints must remain outside GPU regions")
}
"""
timeout_ms = 10000

