assert(plans.segments[0].plan.values === 7 && plans.segments[0].plan.kernels === 1, JSON.stringify(plans.segments[0].plan))
assert(plans.inputs.startsWith('unbound'), JSON.stringify(plans.inputs))
const analysis = JSON.parse(regions)
assert(analysis.segments.length === 1, regions)
assert(analysis.segments[0].graph === plans.segments[0].graph, regions)
assert(analysis.segments[0].regions.length === 1 && analysis.segments[0].regions[0].members.length === 3, regions)
assert(analysis.regions.length === 0, regions)
assert(!analysis.excluded.some((e) => e.node === analysis.segments[0].call), `the exec call is still excluded: ${regions}`)
const source = lines.slice(sourceAt).join(NL)
assert(source.includes('extern "C" __global__'), source.slice(0, 200))
assert(source.includes('__fsub_rn('), 'the segment source is not the segment program')
