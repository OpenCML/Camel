desc = "`inspect`, `regions` and `source` on a `#gpu` function through `tiles::compile`: the scope is cut, so each operator reads the graph each exec call carries, one plan per segment (`{"segments":[{"call":9,"graph":"pair/tiles.region/1","plan":...}]}`), and `regions` reports the segments as segments — the exec call is not one of the wrapper's `excluded` entries, which said `context_arguments` because a call with context arguments has no plan of its own. The `value` line is the same program's result: the reading changed and the program did not. Red when a report operator reads the wrapper instead of the segments a pass cut, or when the cut scope stops computing its value."
