[[tests]]
name = "gpu_scope.host_effect_synchronises"
desc = "Where the host reads a value the device holds, the pass writes an explicit `download` there and the run waits there: `std::profile` counts the waits in `device_work.syncs` (waits, not values — `downloads`/`transfers` count values). The observation point of this program is the effect in the scope's body, whose `println` reads the segment's value, and it is the transfer the scope's boundary alone does not need. The numbers are the back end's only configuration: one device, one stream, the public synchronous path, so every transfer batch is one wait. The run counts 3 — the argument's upload, the value the effect reads, and the value `main` reads — where the same program counted 2 while the call that replaced the segment's statements did not take the effect's place in the chain, which left the effect and its transfer outside the executed graph. `--devices cpu` runs the segment on the host and counts none of them; `to_host_bytes` carries both readings the host makes."
kind = "behavior"
case = "../../../cases/modules/tiles/gpu_scope_host_effect.cml"
args = ["--devices", "0", "${case}", 'std::profile json="${test_tmp}/profile.json"', "tiles::compile", "std::nvm"]
