# A function given to Tiles is read as the program wrote it, LOOP included, on every back end:
# std::fvm, std::jit and std::prl run a private copy with the loops lowered to tail recursion,
# and hand Tiles the program's own graph (OperatorTraits::inspectsGraphs, op-semantics 11.4).
# Tiles does not compile LOOP yet: its refusal names the node, the same on all four.
[[tests]]
name = "loop_structure_nvm"
kind = "negative"
case = "../../../cases/modules/tiles/loop_source.cml"
args = ["${case}", "std::nvm"]
envs = ["CAMEL_TILES_DEVICE=invalid"]
expect_exit = 1
expect_output_contains = ["tiles: twice node 2: unsupported graph node kind 15"]
timeout_ms = 10000

