#  `onnx` gained a declaration module in (`stdlib/onnx.cml`), so it is now a Camel module of
#  the kind answers with the short diagnostic. The rule
# (pass-unavailable-diagnostics 2) makes the declaration the one statement of which passes a module
# provides: `stdlib/onnx.cml` declares `onnx::export_model` (the alias `onnx::export` is the
# registration's), so the sentence "it provides no passes" is gone -- the fact it asserted stopped
# being true. The generic unknown-pass answer is kept by the `hash` case in feat/compile/diag_json.

[[tests]]
name = "pass_absent_from_a_declaration_module"
desc = "onnx::nosuchpass: `onnx` declares the pass `export_model` and no `nosuchpass`, so the diagnostic is the H130 module-specific one and names the pass its `.cml` declares; the program does not run and the global pass list is not printed."
kind = "negative"
case = "../../../cases/linear/byref/order_direct_user.cml"
args = ["${case}", "onnx::nosuchpass", "std::nvm"]
expect_exit = 1
expect_output_contains = ["PassNotProvidedByModule", "Module 'onnx' provides no pass 'nosuchpass'", "it provides the pass 'export_model'"]
expect_output_not_contains = ["not found, available passes are", "2011"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths", "trim_trailing_space"]
timeout_ms = 20000

# A module whose file is there but that the loader refuses: the pass specification reports the
#  loader's reason. Before this was "Pass <unloadable::run> not found" with the reason lost.
#
#  the fixture is one line of text, 72 bytes, not a shared library. The lookup finds it (a
# `.cmo` of the name comes first), then `dlopen` / `LoadLibraryW` refuses it. The platform's own
# words differ -- "invalid ELF header" on Linux, `Win32Error(193)` ("not a valid Win32
# application", localized) on Windows -- so this case asserts only Camel's stable part:
# InvalidPassParameter, "its library 'unloadable' cannot be loaded", and "Found .cmo but load
# failed". The reason travels in the diagnostic and is not pinned. An empty file and a 21-byte
# text fail too, but Linux then says "file too short"; at 72 bytes the reason reads as "not a
# valid module" on both platforms. A real module in its place is accepted and the answer changes
# to the generic unknown-pass one, which is this case's red direction.

[[tests]]
name = "pass_module_that_cannot_be_loaded"
desc = "unloadable::run: the file is found and refused by the loader, so the diagnostic is InvalidPassParameter and keeps the loader's reason."
kind = "negative"
case = "../../../cases/modules/pass_not_found/main.cml"
args = ["${case}", "unloadable::run", "std::nvm"]
expect_exit = 1
expect_output_contains = ["InvalidPassParameter", "its library 'unloadable' cannot be loaded", "Found .cmo but load failed"]
expect_output_not_contains = ["not found, available passes are", "42"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths", "trim_trailing_space"]
timeout_ms = 10000

#  The rule (pass-unavailable-diagnostics 1): a module that fails to load gets its
# own `help`, one that says the module itself did not load and carries the module's own first
# diagnostic, instead of leaving the reader the paragraph about how pass parameters are written.
# The paragraph is the answer to a different problem: nothing on the command line is a parameter
#  mistake. The codes stay as they are -- this was and is `InvalidPassParameter`; the rule keeps
# both module codes (`PassNotProvidedByModule` / `PassNotExportedByModule`) for the two names that
# exist in a module that loads, because their fixes differ.

[[tests]]
name = "the_help_of_a_module_that_cannot_be_loaded_is_about_the_module"
desc = "unloadable::run: the help says the module itself did not load rather than teaching the key=value spelling; the module's own first reason is in the message the help points at."
kind = "negative"
case = "../../../cases/modules/pass_not_found/main.cml"
args = ["${case}", "unloadable::run", "std::nvm"]
expect_exit = 1
expect_output_contains = ["The module 'unloadable' itself did not load", "Fix what the loader reported about the module"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "json_help_of_a_module_that_cannot_be_loaded"
desc = "unloadable::run with --output-format json: the whole help, unpinned by the terminal's wrapping; it names the module and carries the loader's first reason, which is the module's own diagnostic from the message."
kind = "behavior"
case = "../../../cases/modules/pass_not_found/main.cml"
args = ["--output-format", "json", "${case}", "unloadable::run", "std::nvm"]
expect_exit = 1
verify_script = """
const diags = JSON.parse(input.stdout)
assert(diags.length === 1, 'one diagnostic: ' + input.stdout)
const d = diags[0]
assert(d.code === '0x04000060', 'code: ' + d.code)
assert(d.data.name === 'RuntimeDiag::InvalidPassParameter', 'name: ' + d.data.name)
assert(d.data.stage === 'pass:unloadable::run', 'stage: ' + d.data.stage)
assert(d.message.includes("its library 'unloadable' cannot be loaded"), 'message keeps the reason: ' + d.message)
assert(d.message.includes("Found .cmo but load failed"), 'message keeps the loader words: ' + d.message)
assert(typeof d.data.suggestion === 'string' && d.data.suggestion.length > 0,
    'a module that did not load gets a help: ' + JSON.stringify(d.data.suggestion))
assert(d.data.suggestion.startsWith("The module 'unloadable' itself did not load,"),
    'the help is about the module: ' + d.data.suggestion)
assert(d.data.suggestion.includes("Found .cmo but load failed"),
    'the help carries the module\'s own first reason: ' + d.data.suggestion)
assert(!d.data.suggestion.includes('key=value'),
    'the parameter paragraph is not the help here: ' + d.data.suggestion)
"""
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 10000

# The passing case, next to it: an unrelated missing pass of a module that does load keeps the
# answer it has today -- `PassNotProvidedByModule`, with the declaration-driven list -- and no
# module-load help. The two helps are read from the JSON form, where the terminal's wrapping has
# not folded them; `json_data_of_a_pass_the_module_does_not_provide` below pins the same run's
# message and envelope.

[[tests]]
name = "a_missing_pass_of_a_module_that_loads_keeps_its_own_help"
desc = "no_pass::run: the module loads, so the diagnostic stays PassNotProvidedByModule, its help is the one about a module's `.cml` pass declarations, and it is not the module-load help."
kind = "behavior"
case = "../../../cases/modules/pass_not_found/main.cml"
args = ["--output-format", "json", "${case}", "no_pass::run", "std::nvm"]
expect_exit = 1
verify_script = """
const diags = JSON.parse(input.stdout)
assert(diags.length === 1, 'one diagnostic: ' + input.stdout)
const d = diags[0]
assert(d.data.name === 'RuntimeDiag::PassNotProvidedByModule', 'name: ' + d.data.name)
assert(d.message.includes("Module 'no_pass' provides no pass 'run'"), 'message names both: ' + d.message)
assert(d.message.includes("it provides the pass 'ok'"), 'message names what it provides: ' + d.message)
assert(typeof d.data.suggestion === 'string' && d.data.suggestion.length > 0,
    'the diagnostic keeps a help: ' + JSON.stringify(d.data.suggestion))
assert(d.data.suggestion.includes('declares'), 'the help is about the declaration: ' + d.data.suggestion)
assert(d.data.suggestion.includes('is_function::<F>()'),
    'the help spells the declaration: ' + d.data.suggestion)
assert(!d.data.suggestion.includes('did not load'),
    'a module that loads gets no module-load help: ' + d.data.suggestion)
"""
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 10000

#  the fixture stays text, so review can read it and no loader can accept it. A compiled
# object (ELF, Mach-O, PE) has NUL bytes; committing one in the fixture's place fails here.

[[tests]]
name = "the_unloadable_fixture_is_text"
desc = "unloadable.cmo is plain text (no NUL byte, valid UTF-8), not a compiled object: the fixture stays readable and no platform's loader can accept it."
kind = "behavior"
tool = "node"
case = "../../../cases/modules/pass_not_found/unloadable_is_text.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["unloadable.cmo is text"]
normalizers = ["normalize_newlines"]
timeout_ms = 10000

