[[tests]]
name = "pass_absent_from_a_module_that_compiles"
desc = "no_pass::run: the module provides `ok` and no `run`; the diagnostic names the module and the pass it provides, and prints no global pass list."
kind = "negative"
case = "../../../cases/modules/pass_not_found/main.cml"
args = ["${case}", "no_pass::run", "std::nvm"]
expect_exit = 1
expect_output_contains = ["PassNotProvidedByModule", "Module 'no_pass' provides no pass 'run'", "it provides the pass 'ok'"]
expect_output_not_contains = ["not found, available passes are", "42"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "the_pass_that_module_provides_runs"
desc = "no_pass::ok runs the program and prints 42: the module loads fine, so the message above is about the name."
kind = "behavior"
case = "../../../cases/modules/pass_not_found/main.cml"
args = ["${case}", "no_pass::ok", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "42\n"
