id = "modules.pass_not_found"
order = 378
tier = "fast"
tags = ["feat", "modules", "pass", "diagnostics", "module"]
desc = "A pass named through a module that is there: a module that provides no such pass names itself and the passes it does provide, and a module that cannot be loaded keeps the loader's reason"

#  a pass named through a module that is there.
#
# `camel file.cml module::pass` used to answer "Pass <module::pass> not found, available passes
# are: ..." whenever the module could not be used: it does not export the name, it provides no such
# pass, or its file was found and the loader refused it. Every reason the module had was thrown
# away, so a module that is there and a module that is not were indistinguishable.
#
# Three answers now, told apart by what the lookup finds:
#   * the module file is there and cannot be loaded: InvalidPassParameter, with what the loader
#     said (this used to be "pass not found" too);
#   * the module compiles but provides no such pass: the short diagnostic that names the module and
#     the passes it does provide, and nothing else (no list of every pass of the compiler);
#   * the module is not there at all: the pipeline's unknown-pass answer, with the list, unchanged.

[[tests]]
name = "pass_not_exported_by_its_module"
desc = "declares_not_exported::run: the module declares `run` without `export`; the diagnostic says so, names the pass it does provide, and prints no global pass list."
kind = "negative"
case = "../../../cases/modules/pass_not_found/main.cml"
args = ["${case}", "declares_not_exported::run", "std::nvm"]
expect_exit = 1
expect_output_contains = ["PassNotExportedByModule", "Module 'declares_not_exported' declares 'run' but does not export it", "it provides the pass 'other'"]
expect_output_not_contains = ["not found, available passes are", "42"]
normalizers = ["strip_ansi", "normalize_newlines", "normalize_paths", "trim_trailing_space"]
timeout_ms = 10000

# The module that declares `run` without exporting it is a working pass module: `other` runs.

[[tests]]
name = "the_other_pass_of_that_module_runs"
desc = "declares_not_exported::other runs the program and prints 42: the module is usable, the name `run` is what is wrong."
kind = "behavior"
case = "../../../cases/modules/pass_not_found/main.cml"
args = ["${case}", "declares_not_exported::other", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "42\n"
timeout_ms = 10000

