# The six `nn` operators whose derivative the engine answered and the library did not.
#
# Each test runs one program that asks the same function three ways -- the engine's pullback
# (`grad`), the library's pullback (`vjp`, which is `transpose(split(jvp(f)))`), and the library's
# forward transform (`jvp`) -- and pins both directions agreeing: `reverse_ok` is the library's
# pullback against the engine's gradient, `forward_ok` is the library's forward answer against that
# gradient dotted with the seed it was asked in. The two halves of one law are then the same map
# read in two directions, and not two arithmetics that agree on the sample.
#
# The seventh key of that group, `batch_norm_train`, has no entry here: its forward law cannot be
# written with the library's operators, and the enumerated reason is the row for it in
# `scripts/vjp-parity-exemptions.tsv`.
id = "modules.nn.laws"
order = 362
tier = "fast"
tags = ["feat", "modules", "nn"]

[[tests]]
name = "library_law_conv2d"
desc = "`sum(conv2d(x, w, b))` on a `[1, 1, 3, 3]` input and a `[1, 1, 2, 2]` kernel, through both legs and in both directions: `src/stdlib/rulesets/jvp.cml#jvp_conv2d` is the convolution read once per operand with a zero in the other two places, and `src/stdlib/rulesets/transpose.cml#conv2d_t` is the engine's own three gradient operators. The library's pullback must answer the engine's `grad` (nothing about the first 3x3 tensor separates two wrong arithmetics, but the kernel's four entries and the bias's one do), and the library's `jvp` must answer `grad` dotted with the seed. Both directions are asked in one capture, so the two legs read the same primal."
kind = "behavior"
case = "../../../cases/modules/nn/library_law_conv2d.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["conv2d reverse_ok=true forward_ok=true"]
expect_output_not_contains = ["skip="]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "library_law_max_pool2d"
desc = "`sum(max_pool2d(x, 2))` on a `[1, 1, 4, 4]` input whose sixteen values are all distinct, in both directions. The forward law is *not* `max_pool2d(dx)`: which position of a window survives is decided by `x`, so a law that pooled the tangent would answer the tangent's own maximum. `jvp_max_pool2d` writes the engine's `max_pool2d_grad` over an all-ones output as a residual mask, sums each window's one survivor with `avg_pool2d`, and scales back by the window's area; the walk over that linear half names `avg_pool2d_t` and `mul_stated_t`. The program pins the forward answer at -44, which is the seed read at the four survivors (-6, -8, -14, -16), and pins the pullback to the engine's."
kind = "behavior"
case = "../../../cases/modules/nn/library_law_max_pool2d.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["max_pool2d forward=-44.0 reverse_ok=true forward_ok=true"]
expect_output_not_contains = ["skip="]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "library_law_avg_pool2d"
desc = "`sum(avg_pool2d(x, 2))` on the same `[1, 1, 4, 4]` input, in both directions: a window's average is a sum divided by a count that reads no element, so the tangent is the pool of the tangents and the transpose sends each window's cotangent back to all of its positions divided by the area. The program pins the forward answer at 4 -- four windows, each averaging four ones -- and the pullback at the engine's `0.25` in every one of the sixteen positions."
kind = "behavior"
case = "../../../cases/modules/nn/library_law_avg_pool2d.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["avg_pool2d forward=4.0 reverse_ok=true forward_ok=true"]
expect_output_not_contains = ["skip="]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "library_law_embedding"
desc = "`sum(embedding(table, [0, 2, 2]))` on a `[4, 2]` table, in both directions. A gather is a choice of rows, so it is linear in the table: the forward law is the same gather of the table's tangent and the transpose accumulates each row's cotangent over the reads of that row. The indices read row 0 once and row 2 twice, which separates an accumulation from a copy, and rows 1 and 3 must be exactly zero -- the engine's `embedding_table_grad` and this law's answer are the same operator, so the check is that the library reaches it. The forward answer is 9, which is the seed read at rows 0, 2 and 2."
kind = "behavior"
case = "../../../cases/modules/nn/library_law_embedding.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["embedding forward=9.0 reverse_ok=true forward_ok=true"]
expect_output_not_contains = ["skip="]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "library_law_softmax_cross_entropy"
desc = "The mean softmax cross-entropy of a `[2, 3]` logits against a same-shaped target distribution, differentiated with respect to the logits, in both directions. The loss is not linear in the logits, so the forward law is the inner product of the engine's own `softmax_cross_entropy_grad(logits, target, 1.0)` with the logits' tangent -- that gradient is a residual, which is what makes the linear half transposable -- and the transpose answers the same gradient scaled by the cotangent. The target's own cotangent is answered as zero on purpose: the true value needs a scalar times a tensor, `full` has no transpose, and the engine accumulates no cotangent for the target either. The program asks about the logits, which is the operand the engine differentiates."
kind = "behavior"
case = "../../../cases/modules/nn/library_law_softmax_cross_entropy.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["softmax_cross_entropy reverse_ok=true forward_ok=true"]
expect_output_not_contains = ["skip="]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "library_law_softmax_cross_entropy_labels"
desc = "The same loss with an integer class label per row, which the front end sends to a **different** operator: `nn:softmax_cross_entropy_labels`, whose key is `softmax_cross_entropy_labels@2` and not the distribution form's. A law is filed under the operator's own name and no name a program writes is that one, so the library's two laws for it declare the operator's name in their own module (`#op('nn:softmax_cross_entropy_labels')`, not exported) and spell it on their left sides; this case is what proves that declaration binds the URI the engine registered. The labels are integers, so the answer is one value and not a tuple, and the program pins both directions agreeing with the engine."
kind = "behavior"
case = "../../../cases/modules/nn/library_law_softmax_cross_entropy_labels.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
backends_agree = ["exit_code", "diagnostics"]
expect_exit = 0
expect_output_contains = ["softmax_cross_entropy_labels reverse_ok=true forward_ok=true"]
expect_output_not_contains = ["skip="]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000