id = "modules.array_whole"
order = 942
tier = "fast"
tags = ["feat", "modules", "stdlib", "array"]
desc = "The array module written on its own primitives: find_index, chunks, flatten of a rank, mean, argmax and argmin, and the reductions over every element of an array of any rank"

[[tests]]
name = "array_whole"
desc = "find_index (found and absent), chunks (uneven, longer than the array, the whole array), argmax and argmin with ties, NaN (the first wins) and the zeros (+0 above -0), mean, and sum, min, max, argmax, argmin, mean and flatten over a rank-2 array in row-major order."
kind = "behavior"
case = "../../../cases/modules/stdlib/array_whole.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "1 -1\n[[1, 2], [3, 4], [5]] [[1, 2]] [[3, 9, 2, 9]]\n1 1 1 2\n0 0\n2.5 1.5\n[1, 2, 3, 4] 10 1 4 3 0\n13.0 3.25 1.0 5.0 1 0\n[1, 2, 3] [a, b, c]\n0 [3, 1, 2] [9] []\n[fig, pear, apple]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
