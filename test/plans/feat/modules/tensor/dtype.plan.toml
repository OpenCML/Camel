id = "modules.tensor.dtype"
order = 367
tier = "fast"
tags = ["feat", "modules", "tensor", "types"]
desc = "A tensor's element type is the one the program writes (design/arrays-memory, P4 \"element type exact\"): Tensor<f64> holds f64, Tensor<i32> holds i32 and Tensor<bf16>/Tensor<f16> hold two bytes of their own reduced type end to end — creation, arithmetic, reduction, to_bytes/from_bytes — with no storage dtype a written type is replaced with. A conversion into bf16 or f16 rounds to nearest, ties to even, once; one the program writes needs no numeric permission, because `change_precision` governs a computation the compiler moves to lower precision (design principles 7.2-7.3), and reading it back into a wider type is exact. A kernel that computes in f32 only refuses the other element types at the call, naming the operator, the argument type and the set it takes, instead of narrowing. f32 programs keep their bytes."

# The element type is the one written, through every step of the value's life.

[[tests]]
name = "f64_exact"
desc = "`Tensor<f64>` is f64 end to end: the sum of 16777217.0 (16777216.0 in f32), an f64 scalar product, an f64 mean, 8-byte elements in `to_bytes`, and a `from_bytes` round trip. Under f32 normalization the first line printed 16777216 and every element was four bytes."
kind = "behavior"
case = "../../../../cases/modules/tensor/dtype/f64_exact.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "16777217.0\n33554434.0\n4194305.0\n8\n[0, 0, 0, 16, 0, 0, 112, 65]\n16777217.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "i32_exact"
desc = "`Tensor<i32>` is i32 end to end: four-byte elements in `to_bytes`, int32 wrapping in arithmetic (`2147483647 * 2` is -2, so the products sum to -4; under int64 normalization they summed to 4294967296), and a `from_bytes` round trip that gives the four bytes back."
kind = "behavior"
case = "../../../../cases/modules/tensor/dtype/i32_exact.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "2147483646.0\n16\n[255, 255, 255, 127, 1, 0, 0, 0, 254, 255, 255, 255, 0, 0, 0, 0]\n-4.0\n[254, 255, 255, 255, 2, 0, 0, 0, 252, 255, 255, 255, 0, 0, 0, 0]\n[255, 255, 255, 127, 1, 0, 0, 0]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

# The adjoint of an operator on an exact-typed tensor is of that element type too: a gradient is
# read at the width its type names, so a kernel that fills at another width answers with a number
# that is not the derivative.
[[tests]]
name = "gather_grad_f64"
desc = "`sum(w[labels])` on a `Tensor<f64>` (w = [[1, 2, 3], [-4, 5, -6]], labels = [1, 0]) has adjoint 1.0 at every element: each row enters the loss once, so the gradient sums to 6.0 and each row to 3.0. The scalar broadcast that starts the pullback used to fill f32, so the same buffer read as f64 summed to 3 * 2^-7 = 0.0234375 (six f32 1.0s: one row as f32 pairs, one row from the bytes past its end), with no error. The plain sum's gradient is pinned beside it because both start from that broadcast."
kind = "behavior"
case = "../../../../cases/modules/tensor/dtype/gather_grad_f64.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "total=1.0 grad_sum=6.0\ngather=1.0 grad_sum=6.0 row0=3.0 row1=3.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

# bf16 and f16 are stored element types of their own (H238): two bytes, and every kernel computes
# in f32 and rounds once. A conversion into them is written by the program, so it needs no numeric
# permission: `change_precision` governs a computation the compiler moves to lower precision
# (design principles 7.2-7.3).

[[tests]]
name = "bf16_storage"
desc = "`Tensor<bf16>` and `Tensor<f16>` hold two bytes per element and their own rounding: 0.1 is bf16 0x3DCD ([205, 61]) and f16 0x2E66 ([102, 46]), reading either back into f32 is exact (0x3DCD0000 is [0, 0, 205, 61], not the f32 0.1, which is [205, 204, 204, 61]), a bf16 sum of [1, 2^-8] rounds the exact halfway 1 + 2^-8 to 1 (ties to even), and 3 * 1.0078125 rounds 3.0234375 to 3.03125 (ties to even). A bf16 tensor backed by f32 storage would be 4 bytes and would print the f32 0.1."
kind = "behavior"
case = "../../../../cases/modules/tensor/dtype/bf16_storage.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "2\n[205, 61]\n[0, 0, 205, 61]\n[205, 204, 204, 61]\n2\n[102, 46]\n4\n[128, 63]\n2\n[66, 64]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

# The conversion the previous revision refused for want of the permission: the program writes it,
# so it is accepted, and it rounds once into the element type.
[[tests]]
name = "bf16_cast_no_permission"
desc = "A conversion into bf16 written by the program carries no tag and is accepted: it is the precision the program asked for, not a precision the compiler introduces, so no numeric permission is involved. 0.1 stores the nearest bf16 0x3DCD ([205, 61]) and reads back into f32 as 0x3DCD0000 ([0, 0, 205, 61]), not as the f32 0.1. The previous revision refused this line with SemanticDiag::PrecisionChangeNotPermitted."
kind = "behavior"
case = "../../../../cases/modules/tensor/dtype/bf16_cast_no_permission.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "[205, 61]\n[0, 0, 205, 61]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "bf16_cast_under_strict"
desc = "`#strict` revokes every numeric permission (design principles 7.4) and the written bf16 conversion needs none (7.2-7.3), so a function marked `#[strict, change_precision]` that casts into bf16 is accepted and stores the same nearest bf16 0x3DCD ([205, 61]). The previous revision refused it, reading the conversion as a compiler-introduced precision change that `#strict` revokes."
kind = "behavior"
case = "../../../../cases/modules/tensor/dtype/bf16_cast_under_strict.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "[205, 61]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

# The rounding itself, on values that separate the rules: an exact halfway value, the largest
# finite value, and a value above the overflow threshold. The expectations are the properties of
# correct rounding, decoded from the bytes the case prints, not the kernel's word for it.
[[tests]]
name = "bf16_cast_boundaries"
desc = "A written conversion into bf16 or f16 rounds once to nearest, ties to even, and overflows to infinity instead of flushing: 0.1 stores the nearest value (bf16 0x3DCD, f16 0x2E66); the exact halfway values 1 + 2^-8 and 1 + 2^-11 store 1.0, the even neighbour; 3.3895314e38 stores the largest finite bf16 0x7F7F while 3.4e38 and 65520.0 store +infinity (bf16 0x7F80, f16 0x7C00) rather than the largest finite value; 65504.0 stores the largest finite f16 0x7BFF; and reading any stored element back into f32 is exact. No tag is written anywhere in the case."
kind = "behavior"
case = "../../../../cases/modules/tensor/dtype/bf16_cast_boundaries.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "[205, 61]\n[128, 63]\n[0, 0, 128, 63]\n[127, 127]\n[128, 127]\n[0, 0, 128, 127]\n[102, 46]\n[0, 60]\n[0, 0, 128, 63]\n[255, 123]\n[0, 124]\n[0, 0, 128, 127]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000
verify_script = '''
({ input, assert }) => {
  // The case prints twelve lines of little-endian bytes: the two bytes of one stored element per
  // probe, and after the interesting ones, the four bytes of the f32 that element widens to.
  const lines = input.normalized.stdout.trim().split('\n').map((line) => JSON.parse(line))
  assert(lines.length === 12, `twelve probes expected, got ${lines.length}`)
  const [tenthBf, tieBf, tieBfWide, maxBf, overBf, overBfWide,
         tenthF16, tieF16, tieF16Wide, maxF16, overF16, overF16Wide] = lines

  // A stored element is two bytes in every probe; four would be f32 storage.
  for (const [label, bytes] of [['bf16 0.1', tenthBf], ['bf16 tie', tieBf], ['bf16 max', maxBf],
                                ['f16 0.1', tenthF16], ['f16 tie', tieF16], ['f16 max', maxF16]]) {
    assert(bytes.length === 2, `${label} stores ${bytes.length} bytes, not 2`)
  }

  const f32 = (bytes) => new DataView(new Uint8Array([...bytes].reverse()).buffer).getFloat32(0, false)
  // A bf16 element is the top two bytes of an f32, so its two little-endian bytes come first in
  // big-endian order; an f16 element is the 16 bits themselves.
  const bf16 = (bytes) => new DataView(new Uint8Array([bytes[1], bytes[0], 0, 0]).buffer).getFloat32(0, false)
  const f16 = (bytes) => {
    const bits = bytes[0] | (bytes[1] << 8)
    const sign = (bits & 0x8000) ? -1 : 1
    const exponent = (bits >> 10) & 0x1f
    const fraction = bits & 0x3ff
    if (exponent === 0x1f) return fraction === 0 ? sign * Infinity : NaN
    if (exponent === 0) return sign * fraction * Math.pow(2, -24)
    return sign * (1 + fraction / 1024) * Math.pow(2, exponent - 15)
  }
  const decode = (kind, bytes) => (kind === 'bf16' ? bf16(bytes) : f16(bytes))
  const pattern = (bytes) => bytes[0] | (bytes[1] << 8)

  // Correctly rounded: the stored value is at least as close to the input as either neighbour of
  // the element type, and an exact tie (the halfway value) goes to the neighbour whose
  // significand is even. A rounding that broke ties away from zero, or that kept f32 precision,
  // fails here even if the bytes in expect_stdout were changed to match it. The inputs are the
  // same literals the case writes, as the f32 the element type is asked to hold.
  const nearest = (label, kind, bytes, input) => {
    const stored = decode(kind, bytes)
    assert(Number.isFinite(stored), `${label}: stored ${stored}, which is not finite`)
    for (const neighbour of [pattern(bytes) - 1, pattern(bytes) + 1]) {
      const value = decode(kind, [neighbour & 0xff, (neighbour >> 8) & 0xff])
      if (!Number.isFinite(value)) continue
      const mine = Math.abs(stored - input)
      const theirs = Math.abs(value - input)
      assert(mine <= theirs, `${label}: ${stored} is farther from ${input} than the neighbour ${value}`)
      if (mine === theirs) {
        assert((neighbour & 1) !== 0 && (pattern(bytes) & 1) === 0,
               `${label}: the halfway ${input} must round to the even neighbour, not ${stored}`)
      }
    }
  }
  nearest('bf16 0.1', 'bf16', tenthBf, Math.fround(0.1))
  nearest('bf16 tie 1+2^-8', 'bf16', tieBf, Math.fround(1.00390625))
  nearest('bf16 largest finite', 'bf16', maxBf, Math.fround(3.3895314e38))
  nearest('f16 0.1', 'f16', tenthF16, Math.fround(0.1))
  nearest('f16 tie 1+2^-11', 'f16', tieF16, Math.fround(1.00048828125))
  nearest('f16 largest finite', 'f16', maxF16, Math.fround(65504.0))

  // The two halfway probes stored 1.0 exactly, the lower and even neighbour: 0x3F80 and 0x3C00.
  assert(pattern(tieBf) === 0x3f80, `the bf16 halfway stored 0x${pattern(tieBf).toString(16)}, not 1.0`)
  assert(pattern(tieF16) === 0x3c00, `the f16 halfway stored 0x${pattern(tieF16).toString(16)}, not 1.0`)

  // Above the threshold the element stores an infinity (exponent all ones, significand zero),
  // not the largest finite value and not a wrapped value; the largest finite values stay finite.
  assert(bf16(overBf) === Infinity, `bf16 3.4e38 stored ${bf16(overBf)}, not +infinity`)
  assert(f16(overF16) === Infinity, `f16 65520.0 stored ${f16(overF16)}, not +infinity`)
  assert(Number.isFinite(bf16(maxBf)) && Number.isFinite(f16(maxF16)), 'the largest finite values must not overflow')

  // Widening a stored element is exact: the f32 prints the same value, and the four bytes of a
  // bf16 element are its two bytes with two zero bytes under them.
  assert(f32(tieBfWide) === bf16(tieBf), `bf16 [${tieBf}] widened to ${f32(tieBfWide)}, not to ${bf16(tieBf)}`)
  assert(f32(tieF16Wide) === f16(tieF16), `f16 [${tieF16}] widened to ${f32(tieF16Wide)}, not to ${f16(tieF16)}`)
  assert(f32(overBfWide) === bf16(overBf) && f32(overF16Wide) === f16(overF16),
         `an overflowing element widened to ${f32(overBfWide)} / ${f32(overF16Wide)}`)
  assert(tieBfWide[0] === 0 && tieBfWide[1] === 0 && tieBfWide[2] === tieBf[0] && tieBfWide[3] === tieBf[1],
         `bf16 [${tieBf}] widened to [${tieBfWide}], which is not the same bits`)
}
'''

# A kernel whose declaration is f32 only says so where it is called: it never converts.

[[tests]]
name = "f32_only_kernel_refuses_f64"
desc = "`conv2d` computes in f32 only; an f64 tensor is refused at the call with RuntimeDiag::OperandTypeUnsupported, naming the operator, the argument's element type and the supported set. Before, the kernel silently cast the tensor to f32 (design principles 5.1, 13.1)."
kind = "negative"
case = "../../../../cases/modules/tensor/dtype/f32_only.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::OperandTypeUnsupported"
expect_output_contains = ["'conv2d' does not support a value of type 'Tensor<f64>'", "it takes f32 tensors."]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

# An element type that is not a tensor element type at all is the type's own refusal, and it says
# which ones it takes (it used to leave the constructor as an exception).
[[tests]]
name = "string_refused"
desc = "`Tensor<string>` is rejected with InvalidTypeArgument, naming the element types a tensor takes."
kind = "negative"
case = "../../../../cases/modules/tensor/dtype/string_refused.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::InvalidTypeArgument"
expect_output_contains = ["the element type is f32, f64, bf16, f16, i32, i64 or bool, not 'string'"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

# f32 keeps working, on every backend: the same values, the same bits.

[[tests]]
name = "f32_works"
desc = "`Tensor<f32>` is accepted as a parameter type and as the element type of a literal, and creation, arithmetic, reduction and `to_bytes` give the f32 values and IEEE-754 bytes on every backend."
kind = "behavior"
case = "../../../../cases/modules/tensor/dtype/f32_works.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "10.0\n20.0\n0.0\n4.0\n[0, 0, 128, 63, 0, 0, 0, 64, 0, 0, 64, 64, 0, 0, 128, 64]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

# An f32 program that predates this change, whose bytes are pinned on their own here: the element
# type change cannot move f32 storage, signed zero or NaN payloads without failing this.
[[tests]]
name = "f32_program_bytes_unchanged"
desc = "The existing binary_bytes program (modules.tensor) prints the same bytes as before the element-type change: f32 signed zero, an int64 value that f32 cannot hold, bool bytes, an empty tensor and a view of the same block."
kind = "behavior"
case = "../../../../cases/modules/tensor/binary_bytes.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout = "[0, 0, 128, 63, 0, 0, 32, 192, 0, 0, 0, 0, 0, 0, 0, 128]\n[1, 0, 0, 0, 0, 0, 32, 0, 254, 255, 255, 255, 255, 255, 255, 255]\n[1, 0, 1]\n0\n[0, 0, 128, 63, 0, 0, 32, 192, 0, 0, 0, 0, 0, 0, 0, 128]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

# The f32 arm of the broadcast gradient, pinned bit for bit: the f64 arm of `sum_to` is new, and
# the f32 one has to keep the additions at f32's width and the same bytes.
[[tests]]
name = "f32_broadcast_grad"
desc = "The f32 reading of the broadcast gradient (sum(x * p0) with p0 broadcast over rows, gradient reduction tensor:sum_to) with values f32 cannot hold exactly: d/dx is the row broadcast of p0 = [[0.1, 0.3, 0.7], [0.1, 0.3, 0.7]] and d/dp0 the column sums [1.1, 0.8, 1.0]. The f64 arm added to sum_to leaves these bytes exactly as they were, so an arm that routed f32 through an f64 accumulator or narrowed f64 into an f32 result fails here."
kind = "behavior"
case = "../../../../cases/modules/tensor/f32_broadcast_grad.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "gx tensor([[    0.1,     0.3,     0.7],\n        [    0.1,     0.3,     0.7]], dtype=float32)\ngp tensor([    1.1,     0.8,       1.], dtype=float32)\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

# `load_npy` declares the element type of the file it reads (handover H466, design principles 5.5):
# the call writes it, or the position the call stands in fixes it, and the file's own element type
# has to be that one.

[[tests]]
name = "npy_element_type"
desc = "`load_npy` reads an f32 `.npy` as `Tensor<f32>` (`load_npy::<f32>`) and the tree's only int64 `.npy` as `Tensor<i64>` (`load_npy::<i64>`), each with the file's extents (3 and 2 elements); a third load writes no type argument at all and takes the element type from the declared type of the position it stands in (`let typed: Tensor<f32> = load_npy(p)`). Before H466 the result had no element type the program could state, and the only spelling was the untyped `load_npy(p)`."
kind = "behavior"
case = "../../../../cases/modules/tensor/dtype/npy_element_type.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout = "3\n2\n3\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "npy_dtype_mismatch"
desc = "An int64 `.npy` read as `load_npy::<f32>(p)` is a RuntimeDiag::RuntimeError at the call, at the position of the type argument the call writes (`npy_dtype_mismatch.cml:10:21`), naming the file's element type and the declared one (`the file holds i64 and the program declares f32`). Before H466 no element type was declared, so a file of any element type loaded as-is and the mismatch could not be reported at all (design principles 5.1, 5.5)."
kind = "negative"
case = "../../../../cases/modules/tensor/dtype/npy_dtype_mismatch.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::RuntimeError"
expect_output_contains = ["the file holds i64 and the program declares f32", "npy_dtype_mismatch.cml:10:21"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "npy_no_element_type"
desc = "`load_npy(p)` with no type argument, standing where no element type is expected, does not resolve: the element type is the one type variable no parameter mentions, so the call is refused (No matching function found, `SemanticDiag::NoMatchingFunction`) and the candidates print the five element types a `.npy` file can hold, each with the type argument it takes (`<tensor:load_npy_f32>: ::<float32>(path: string) => Tensor<float32>`). Before H466 this call compiled and returned a tensor whose element type was whatever the file held (design principles 5.5)."
kind = "negative"
case = "../../../../cases/modules/tensor/dtype/npy_no_element_type.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "<tensor:load_npy_f32>: ::<float32>(path: string) => Tensor<float32>", "<tensor:load_npy_i64>: ::<int64>(path: string) => Tensor<int64>"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000
