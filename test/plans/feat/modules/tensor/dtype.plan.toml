[[tests]]
name = "one_width_arithmetic"
desc = "The positive control of the mixed refusal: `f32 * f32` and `f64 * f64` compute as before, and a literal takes the element type of the context it is written in, so `x * 2.0` beside a tensor of either width needs no conversion."
