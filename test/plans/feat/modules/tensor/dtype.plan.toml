[[tests]]
name = "f32_program_bytes_unchanged"
desc = "The existing binary_bytes program (modules.tensor) prints the same bytes as before the element-type change: f32 signed zero, an int64 value that f32 cannot hold, bool bytes, an empty tensor and a view of the same block."
kind = "behavior"
case = "../../../../cases/modules/tensor/binary_bytes.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout = "[0, 0, 128, 63, 0, 0, 32, 192, 0, 0, 0, 0, 0, 0, 0, 128]\n[1, 0, 0, 0, 0, 0, 32, 0, 254, 255, 255, 255, 255, 255, 255, 255]\n[1, 0, 1]\n0\n[0, 0, 128, 63, 0, 0, 32, 192, 0, 0, 0, 0, 0, 0, 0, 128]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

# The f32 arm of the broadcast gradient, pinned bit for bit: the f64 arm of `sum_to` is new, and
# the f32 one has to keep the additions at f32's width and the same bytes.
[[tests]]
name = "f32_broadcast_grad"
desc = "The f32 reading of the broadcast gradient (sum(x * p0) with p0 broadcast over rows, gradient reduction tensor:sum_to) with values f32 cannot hold exactly: d/dx is the row broadcast of p0 = [[0.1, 0.3, 0.7], [0.1, 0.3, 0.7]] and d/dp0 the column sums [1.1, 0.8, 1.0]. The f64 arm added to sum_to leaves these bytes exactly as they were, so an arm that routed f32 through an f64 accumulator or narrowed f64 into an f32 result fails here."
kind = "behavior"
case = "../../../../cases/modules/tensor/f32_broadcast_grad.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "gx [[0.1, 0.3, 0.7], [0.1, 0.3, 0.7]]\ngp [1.1, 0.8, 1.0]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

# `%` over numeric arrays of the reduced element types. bf16 and f16 are floating types on par
# with f32 (7.3), so the remainder of two of their arrays is their own operator applied
# elementwise — computed in f32, rounded once into the element type — not a reduced-precision
# case. Before the kernel existed the same lines were refused at the call:
#
#   bf16_modulo.cml:34:33: [Error]: No matching function found for argument types: <>
#     (bf16[], bf16[]); operator '%' is not defined for these operand types. ...
#   bf16_modulo.cml:40:37: [Error]: ... (f16[], f16[]) ...
#   bf16_modulo.cml:46:49: [Error]: ... (float[], float[]) ...
#   bf16_modulo.cml:50:48: [Error]: ... (i32[], i32[]) ...
#
# (SemanticDiag::NoMatchingFunction for all four: none of the element types had `%` before the
#  kernel existed, and the message named the operand types in every case.)
[[tests]]
name = "bf16_modulo"
desc = "`%` over numeric arrays of the reduced element types: 7.5 % 2.0 is 1.5, -7.5 % 2.0 is -1.5, 7.5 % -2.0 is 1.5 and 1.0 % 4.0 is 1.0 for bf16 and for f16 — the language's truncated remainder (camel::utils::remainder), the sign of the left operand, with no flooring. The result's element type is the operands' own, so four elements are eight bytes through `to_bytes` and the patterns are bf16 0x3FC0/0xBFC0/0x3F80 ([192, 63], [192, 191], [128, 63]) and f16 0x3E00/0xBE00/0x3C00 ([0, 62], [0, 190], [0, 60]): an implementation answering in f32 would report sixteen bytes and f32 patterns. The same definition is written for f64 and i32 arrays (-1.5, -1) and for an array with a literal operand, which takes the element type (design principles 5.1): -7.5 % 2.0 is -1.5 and 7.5 * 2.0 is 15.0 with the array's element type bf16 — the literal used to be read as a bool through the scalar operand, which printed -0.0 and 7.3e-40 for those two lines."
kind = "behavior"
case = "../../../../cases/modules/tensor/dtype/bf16_modulo.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "bf16 values: 1.5 -1.5 1.5 1.0\nbf16 bytes: 8 [192, 63, 192, 191, 192, 63, 128, 63]\nf16 values: 1.5 -1.5 1.5 1.0\nf16 bytes: 8 [0, 62, 0, 190, 0, 62, 0, 60]\nf64 value: -1.5\ni32 value: -1\nmixed scalar: -1.5 15.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

# `load_npy` declares the element type of the file it reads (design principles 5.5):
# the call writes it, or the position the call stands in fixes it, and the file's own element type
# has to be that one.

[[tests]]
name = "npy_element_type"
desc = "`load_npy` reads an f32 `.npy` as `f32[..]` (`load_npy::<f32>`) and the tree's only int64 `.npy` as `i64[..]` (`load_npy::<i64>`), each with the file's extents (3 and 2 elements); a third load writes no type argument at all and takes the element type from the declared type of the position it stands in (`let typed: f32[..] = load_npy(p)`). The result used to have no element type the program could state, and the only spelling was the untyped `load_npy(p)`."
kind = "behavior"
case = "../../../../cases/modules/tensor/dtype/npy_element_type.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout = "3\n2\n3\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

