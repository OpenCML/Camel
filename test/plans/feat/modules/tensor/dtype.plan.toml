id = "modules.tensor.dtype"
order = 367
tier = "fast"
tags = ["feat", "modules", "tensor", "types"]
desc = "A tensor's element type is the one the program writes (design/arrays-memory, P4 \"element type exact\"). This build stores f32, int64 and bool only, so a declaration that asks for f64 or i32 is refused at the type expression and names both types; it is never built as the element type it would have been replaced with. f32 keeps working, and its storage bytes do not move."

# The substitution is refused where the type is written, with a diagnostic of its own: the
# requested element type, the type it would have been replaced with, and the reason.

[[tests]]
name = "f64_refused"
desc = "`Tensor<f64>` is refused at the type expression: the diagnostic names f64 as written, f32 as what the tensor would hold, and says tensors that keep their element type are not implemented yet. Before the diagnostic the cast compiled and the program ran in f32."
kind = "negative"
case = "../../../../cases/modules/tensor/dtype/f64_refused.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::TensorElementTypeNotStored"
expect_output_contains = ["'f64' is not stored as written", "a tensor of 'f64' holds 'f32' here", "would silently run with 'f32'", "Tensors that keep the element type they are written with are not implemented yet."]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 4000

[[tests]]
name = "i32_refused"
desc = "`Tensor<i32, [4]>` is refused the same way: the diagnostic names i32 as written and i64 as what the tensor would hold. Before the diagnostic the cast compiled and the program ran with int64 storage."
kind = "negative"
case = "../../../../cases/modules/tensor/dtype/i32_refused.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::TensorElementTypeNotStored"
expect_output_contains = ["'i32' is not stored as written", "a tensor of 'i32' holds 'i64' here", "would silently run with 'i64'"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 4000

# An element type that is not a tensor element type at all is the type's own refusal, and it says
# which ones it takes (it used to leave the constructor as an exception).
[[tests]]
name = "string_refused"
desc = "`Tensor<string>` is rejected with InvalidTypeArgument, naming the element types a tensor takes."
kind = "negative"
case = "../../../../cases/modules/tensor/dtype/string_refused.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::InvalidTypeArgument"
expect_output_contains = ["the element type is f32, f64, i32, i64 or bool, not 'string'"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 4000

# The storage dtype still works, on every backend: the same values, the same bits.

[[tests]]
name = "f32_works"
desc = "`Tensor<f32>` is accepted as a cast target and as a parameter type, and creation, arithmetic, reduction and `to_bytes` give the f32 values and IEEE-754 bytes on every backend."
kind = "behavior"
case = "../../../../cases/modules/tensor/dtype/f32_works.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "10.0\n20.0\n0.0\n4.0\n[0, 0, 128, 63, 0, 0, 0, 64, 0, 0, 64, 64, 0, 0, 128, 64]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

# An f32 program that predates this change, whose bytes are pinned on their own here: the element
# type change cannot move f32 storage, signed zero or NaN payloads without failing this.
[[tests]]
name = "f32_program_bytes_unchanged"
desc = "The existing binary_bytes program (modules.tensor) prints the same bytes as before the element-type change: f32 signed zero, an int64 value that f32 cannot hold, bool bytes, an empty tensor and a view of the same block."
kind = "behavior"
case = "../../../../cases/modules/tensor/binary_bytes.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout = "[0, 0, 128, 63, 0, 0, 32, 192, 0, 0, 0, 0, 0, 0, 0, 128]\n[1, 0, 0, 0, 0, 0, 32, 0, 254, 255, 255, 255, 255, 255, 255, 255]\n[1, 0, 1]\n0\n[0, 0, 128, 63, 0, 0, 32, 192, 0, 0, 0, 0, 0, 0, 0, 128]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000