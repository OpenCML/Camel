args = ["${case}"]
expect_exit = 1
expect_output_contains = ["SemanticDiag::NoMatchingFunction", "<tensor:load_npy_f32>: ::<float32>(path: string) => float32[..]", "<tensor:load_npy_i64>: ::<int64>(path: string) => int64[..]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

# A generic wrapper writes the P4 endpoint: `T[..]` is the numeric array type (`Tensor` is that
# type, so the open-rank spelling and the alias are one type), and the element type travels on to
# `load_npy::<T>` -- the calls print the file's own extent, so a wrapper that lost the element type
# would fault on the int64 file instead (design principles 5.1, 5.2, 5.5).

[[tests]]
name = "npy_generic_wrapper"
desc = "A generic function declares its result as `T[..]` and forwards the element type to a typed loader (`func read_as::<T>(p: string): T[..] { return load_npy::<T>(p) }`), and each call reads the file at the caller's element type: `read_as::<f32>` on the f32 `.npy` gives 3 elements and `read_as::<i64>` on the tree's only int64 `.npy` gives 2. This is the spelling the P4 deletion step keeps: no signature writes the bare `Tensor` name, and the element type is a type variable of the head (design principles 5.1, 5.2, 5.5)."
kind = "behavior"
case = "../../../../cases/modules/tensor/dtype/npy_generic_wrapper.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout = "3\n2\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "npy_generic_wrapper_mismatch"
desc = "The element type a generic wrapper declares reaches the load: `read_as::<f32>` on the int64 `.npy` is the same fault as a direct `load_npy::<f32>`, a RuntimeDiag::RuntimeError reported at the call inside the wrapper (`npy_generic_wrapper_mismatch.cml:8:54` is the `load_npy::<T>(p)` of its body, with `T` instantiated to f32) and naming the file's element type and the declared one (`the file holds i64 and the program declares f32`). A wrapper that erased the element type would load the file instead (design principles 5.1, 5.5)."
kind = "negative"
case = "../../../../cases/modules/tensor/dtype/npy_generic_wrapper_mismatch.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::RuntimeError"
expect_output_contains = ["the file holds i64 and the program declares f32", "npy_generic_wrapper_mismatch.cml:8:54"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000
# A scalar operand beside a reduced-precision tensor: the literal takes the element type the
# operator declares (design principles 5.1), and the operand is read as the two-byte pattern of
# that type, which is the same bytes an element of it occupies (camel/core/rtdata/half.h). Held in
# a wider member of the operand's storage, every line below answers with the element 9.18e-40 (the
# bf16 pattern 0x0001) or, on the addition side, with 10: the tensor's elements and the number the
# program wrote met as two different values, and nothing was diagnosed.
[[tests]]
name = "reduced_scalar_operand"
desc = "A literal and an f32 value beside a `bf16[..]` or a `f16[..]` are read in the element type: `sum(b * 2.0)` is 20, `sum(b + 2.0)` is 18, `sum(h * 2.0)` is 20, `sum(where(b > 2.0, b, 0.0))` is 7, and a tensor on the right reads by the same rule (`sum(2.0 - b)` is -2). Read through a wider member of the storage, the products were 9.18e-40 and the sums 10."
kind = "behavior"
case = "../../../../cases/modules/tensor/dtype/reduced_scalar_operand.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout = "20.0 5.0 18.0 6.0 5.0\n20.0 5.0 18.0 6.0\n20.0 20.0\n7.0 7.0\n20.0 18.0 -2.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "f64_variable_beside_f32_tensor"
desc = "A value that carries an element type is that type: a float variable beside an f32 tensor is a mixed pair with no arm (design principles 5.1), and the call is refused rather than narrowed into one. Only a literal takes its element type from the context it is written in, which is what keeps `x * 0.5` with an f32 x a single-width call; the same holds for an f64 array whose extents no fact pins down, refused for its element type whatever is known of the shape."
kind = "negative"
case = "../../../../cases/modules/tensor/dtype/f64_variable_beside_f32_tensor.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ArgumentsRejected"
expect_output_contains = ["the scalar operand has type 'float', but the tensor's element type is 'f32'", "no implicit conversion between numeric types"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000
[[tests]]
name = "mixed_width_known_shapes"
desc = "Two tensor operands of different element types are refused: the element type of each is the one its type carries, so `float[2] * f32[2]` matches no arm rather than being widened into one, and the report names the conversion to write (design principles 5.1)."
kind = "negative"
case = "../../../../cases/modules/tensor/dtype/mixed_width_known_shapes.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ArgumentsRejected"
expect_output_contains = ["Invalid call to '__mul__'", "(float[2], f32[2])", "the two tensor operands have different element types ('float' and 'f32')", "float(value) or f32(value)"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

