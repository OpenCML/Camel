id = "modules.tensor.compound_assign"
order = 364
tier = "fast"
debug_tier = true # also selected by --tier debug (Debug build)
tags = ["feat", "modules", "tensor", "assignment"]
desc = "t += u on a tensor computes a new tensor and rebinds the variable; nothing is changed in place (design principles 4.2)"

[[tests]]
name = "tensor.compound_assign"
desc = "+=, -=, *=, /= with a tensor and with a scalar on the right, and through a var parameter: the variable holds the new tensor, another name of the old one keeps its value. Alike on the four back ends. (These were compile-time errors: no such operator for tensors.)"
kind = "behavior"
case = "../../../../cases/modules/tensor/compound_assign.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_starts_with = "4.0 2.0\n2.0 2.0\n4.0 2.0\n2.0 2.0\n6.0 2.0\n18.0 2.0\n16.0 2.0\n8.0 2.0\n10.0 10.0 2.0\n"
expect_output_not_contains = ["[Error]", "error[", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

[[tests]]
name = "tensor.compound_assign.opt"
desc = "The same through std::opt."
kind = "behavior"
case = "../../../../cases/modules/tensor/compound_assign.cml"
args = ["${case}", "std::opt", "std::nvm"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
expect_exit = 0
expect_stdout_starts_with = "4.0 2.0\n2.0 2.0\n4.0 2.0\n2.0 2.0\n6.0 2.0\n18.0 2.0\n16.0 2.0\n8.0 2.0\n10.0 10.0 2.0\n"
timeout_ms = 30000

[[tests]]
name = "tensor.compound_assign.inline"
desc = "The same through std::opt::inline."
kind = "behavior"
case = "../../../../cases/modules/tensor/compound_assign.cml"
args = ["${case}", "std::opt::inline", "std::fvm"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
expect_exit = 0
