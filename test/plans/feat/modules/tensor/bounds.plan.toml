id = "modules.tensor.bounds"
order = 364
tier = "fast"
debug_tier = true # also selected by --tier debug (Debug build)
tags = ["feat", "modules", "tensor", "diagnostics"]

[[tests]]
name = "slice_const"
desc = "A slice whose constant bounds lie outside a statically known extent is a compile-time error (it used to return an empty tensor)."
kind = "negative"
case = "../../../../cases/modules/tensor/bounds/slice_const.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ArgumentsRejected"
expect_output_contains = ["slice bounds 8..9 are outside axis 0 of extent 3"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "index_const"
desc = "A constant index outside a statically known extent is a compile-time error (it used to stop the running program after earlier effects)."
kind = "negative"
case = "../../../../cases/modules/tensor/bounds/index_const.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ArgumentsRejected"
expect_output_contains = ["index 8 is outside axis 0 of extent 3"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "index_declared_shape"
desc = "The extent may come from a declared parameter shape (`f32[3]`)."
kind = "negative"
case = "../../../../cases/modules/tensor/bounds/index_declared_shape.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ArgumentsRejected"
expect_output_contains = ["index 5 is outside axis 0 of extent 3"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "slice_untaken_branch"
desc = "The check does not depend on the branch being taken: an out-of-range slice in an arm the run never enters is still a compile-time error."
kind = "negative"
case = "../../../../cases/modules/tensor/bounds/slice_untaken_branch.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ArgumentsRejected"
expect_output_contains = ["slice bounds 8..9 are outside axis 0 of extent 3"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "in_range"
desc = "Slices and indexes inside the extent are unaffected, and every bound is a positive position: slice(b, 0, 1, 3) takes the tail from position 1 and slice(b, 0, 2, 3) the last element."
kind = "behavior"
case = "../../../../cases/modules/tensor/bounds/in_range.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["5", "3"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "unknown_runtime"
desc = "With an unknown extent (a tensor loaded at run time) the checks move to run time: an empty slice inside the extent is shape [0], and an index outside the extent is a run-time error of the subscript, reported as for any array."
kind = "behavior"
case = "../../../../cases/modules/tensor/bounds/unknown_runtime.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["ran", "[0]", "Index 8 is out of range for an array of length 3."]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "slice_runtime"
desc = "With an unknown extent, a slice bound outside the axis is a located run-time fault, SliceOutOfRange, as for an array (design principles 3.9; the kernel used to clamp). An end before the start is the empty range (3.9): slice(b, 0, 1, 0) is shape [0]."
kind = "behavior"
case = "../../../../cases/modules/tensor/bounds/slice_runtime.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["ran", "[0]", "SliceOutOfRange", "The range 8 to 9 is out of range for an array of length 3", "slice_runtime.cml:7:"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "tuple_index"
desc = "A tuple element past the end of the tuple is a compile-time error (the compiler used to crash)."
kind = "negative"
case = "../../../../cases/compile/bounds/tuple_index.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::InvalidAccessIndex"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000
