[[tests]]
name = "single_instance"
desc = "Dimension names are for checking only: `dense` is one graph called with two different shapes, its signature keeps the names, and no instance name carries an extent."
kind = "behavior"
case = "../../../../cases/modules/tensor/named_dims/single_instance.cml"
args = ["${case}", "std::rgir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
  const out = input.normalized.stdout
  const graphs = (out.match(/label="dense";/g) || []).length
  assert(graphs === 1, `expected exactly one 'dense' graph, found ${graphs}`)
  const calls = (out.match(/label="dense", type="FUNC"/g) || []).length
  assert(calls === 2, `expected the two calls to reach one FUNC node each, found ${calls}`)
  assert(!/dense</.test(out), 'a name carries an extent into an instance name')
  assert(out.includes('value_type="Tensor<float32, [n, k]>"'), 'the graph keeps its signature with the names')
}
"""
timeout_ms = 8000
