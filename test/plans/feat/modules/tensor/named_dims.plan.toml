id = "modules.tensor.named_dims"
order = 366
tier = "feat"
tags = ["feat", "modules", "tensor", "types", "dimensions"]
desc = "Named dimensions `constas` in tensor shapes (design principles 5.4): a name binds where it first appears in a parameter type and later occurrences write it; extents are linear forms whose equality is decidable, other results are unknown; an argument whose extent is unknown at compile time is accepted and checked where the call runs (like `as`); a name only the return type writes is an error; and the checking builds no new instance"

[[tests]]
name = "bind_and_reuse"
desc = "`constas n` in the first parameter binds the extent; the second parameter writes `n` and must have the same one. The function is called with two different extents."
kind = "behavior"
case = "../../../../cases/modules/tensor/named_dims/bind_and_reuse.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["6.0", "10.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "linear_forms"
desc = "Extents are linear: `n`, `n + 1`, `2 * n` and `n + m`; a name may be written by a parameter before the one that binds it, and two calls with different extents both hold."
kind = "behavior"
case = "../../../../cases/modules/tensor/named_dims/linear_forms.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["17.0", "27.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "nonlinear_unknown"
desc = "A product of two named dimensions is not linear, so its value is unknown and the argument is accepted whatever its extent is."
kind = "behavior"
case = "../../../../cases/modules/tensor/named_dims/nonlinear_unknown.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["104.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "unknown_extent_checked"
desc = "An argument whose extent the compiler does not know (`Tensor<... const [-1]>`) is accepted; the extent another argument binds is checked where the call runs."
kind = "behavior"
case = "../../../../cases/modules/tensor/named_dims/unknown_extent_checked.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["6.0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

