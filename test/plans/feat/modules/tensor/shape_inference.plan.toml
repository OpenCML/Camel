id = "modules.tensor.shape_inference"
order = 365
tier = "fast"
debug_tier = true # also selected by --tier debug (Debug build)
tags = ["feat", "modules", "tensor", "types", "diagnostics"]

[[tests]]
name = "si_shape_operator"
desc = "The shape of a tensor whose type carries it is a constant where it is passed on: reshape(y, shape(x)), zeros(shape(x)) and ones([dim(x, 1)]) have the shapes [2, 3], [2, 3] and [3] in their types (each is accepted by a parameter declared with that shape) and the values are right."
kind = "behavior"
case = "../../../../cases/modules/tensor/shape_inference/shape_operator.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["30"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "si_computed_extent"
desc = "A shape written in place with a computed extent keeps its rank and constant extents: zeros([n, 3]) and reshape(x, [n, 3]) are accepted by a parameter declared [-1, 3]; with a [6] input, reshape(y, [n, 3]) is [2, 3] (the only value of n that fits). Values are right."
kind = "behavior"
case = "../../../../cases/modules/tensor/shape_inference/computed_extent.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["27", "21"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "si_computed_extent_stays_open"
desc = "The computed extent itself stays unknown: reshape(x, [n, 3]) of a [-1, 3] input is Tensor<float32, [?, 3]> and does not enter a [2, 3] parameter without `as`."
kind = "negative"
case = "../../../../cases/modules/tensor/shape_inference/computed_extent_stays_open.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ArgumentNeedsConversion"
expect_diagnostic_line = 8
expect_diagnostic_column = 17
expect_output_contains = ["argument 1 ('reshape(x, [n, 3])', for parameter 'a') has type 'Tensor<float32, [?, 3]>', which is less exact than 'Tensor<float32, [2, 3]>'", "'reshape(x, [n, 3]) as Tensor<f32, const [2, 3]>'"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "si_computed_extent_run_time"
desc = "The [2, 3] inferred for reshape(y, [n, 3]) of a [6] input claims nothing that can be wrong: with n = 3 the reshape itself fails when it runs, at the reshape."
kind = "behavior"
case = "../../../../cases/modules/tensor/shape_inference/computed_extent_run_time.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["ran", "reshape changes tensor element count: [6] -> [3, 3]", "computed_extent_run_time.cml:8:18"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "si_row_loop"
desc = "A loop written as a recursion carries a [3] accumulator over the rows of a [?, 3] input; the first accumulator is zeros([dim(x, 1)]) and the input may come from concat(reshape(x, [n, 3]), x, 0). Everything is inferred, no `as`; values are right."
kind = "behavior"
case = "../../../../cases/modules/tensor/shape_inference/row_loop.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["tensor([      5.,       7.,       9.], dtype=float32)", "42"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "si_plain_result"
desc = "A result declared plain Tensor has no extents for its caller. Passing it to a shaped parameter names the argument, both types and the conversion to write."
kind = "negative"
case = "../../../../cases/modules/tensor/shape_inference/plain_result.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ArgumentNeedsConversion"
expect_diagnostic_line = 12
expect_diagnostic_column = 14
expect_output_contains = ["The call to 'h: (a: Tensor<float32, [3]>) => float' needs an explicit conversion", "argument 1 ('t', for parameter 'a') has type 'Tensor', which is less exact than 'Tensor<float32, [3]>'", "write the conversion: 't as Tensor<f32, const [3]>'"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "si_plain_result_as"
desc = "The same program with `t as Tensor<f32, const [3]>` compiles and runs."
kind = "behavior"
case = "../../../../cases/modules/tensor/shape_inference/plain_result_as.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["6"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "si_loaded_struct"
desc = "A struct with a field loaded from a file, passed to a with parameter whose field is shaped: the field is named and the conversion is suggested for it."
kind = "negative"
case = "../../../../cases/modules/tensor/shape_inference/loaded_struct.cml"
args = ["${case}"]
expect_exit = 1
