kind = "behavior"
case = "../../../../cases/modules/tensor/shape_inference/computed_slice_as.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["15"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "si_tuple_return"
desc = "A returned tuple whose elements came from a function declared (Tensor, Tensor): each element that is less exact than declared is named, with its own conversion."
kind = "negative"
case = "../../../../cases/modules/tensor/shape_inference/tuple_return.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ReturnNeedsConversion"
expect_diagnostic_line = 9
expect_diagnostic_column = 5
expect_output_contains = ["element .0 of the value ('(a, sum(x), b)') has type 'Tensor', which is less exact than 'Tensor<float32, [3]>'", "element .2 of the value", "'a as Tensor<f32, const [3]>', 'b as Tensor<f32, const [3]>'"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "si_tuple_return_as"
desc = "The same program with both elements converted."
kind = "behavior"
case = "../../../../cases/modules/tensor/shape_inference/tuple_return_as.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["3"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "si_branch_join"
desc = "Arms of extents 3 and 6 join to an unknown extent; a declared [3] result asks for `as` (an arm sliced back to 3 is accepted as it is)."
