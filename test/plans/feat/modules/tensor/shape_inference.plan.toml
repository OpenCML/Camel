expect_diagnostic_column = 5
expect_output_contains = ["the value ('if c then x else concat(x, x, 0)') has type 'Tensor<float32, [?]>', which is less exact than 'Tensor<float32, [3]>'", "'(if c then x else concat(x, x, 0)) as Tensor<f32, const [3]>'"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

