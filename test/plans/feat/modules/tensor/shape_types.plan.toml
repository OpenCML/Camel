id = "modules.tensor.shape_types"
order = 363
tier = "fast"
debug_tier = true # also selected by --tier debug (Debug build)
tags = ["feat", "modules", "tensor", "types"]

[[tests]]
name = "body_mismatch"
desc = "A shape written on a tensor parameter is part of its type (it used to be dropped): adding a [4] tensor to a parameter declared `Tensor<[3]>` is a compile-time error at the operator, and the program does not run."
kind = "negative"
case = "../../../../cases/modules/tensor/shape_types/body_mismatch.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ArgumentsRejected"
expect_output_contains = ["cannot broadcast extents 3 and 4"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "call_mismatch"
desc = "Passing a [4] tensor to a parameter declared `Tensor<[3]>` is a compile-time error at the call."
kind = "negative"
case = "../../../../cases/modules/tensor/shape_types/call_mismatch.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["f32[4]", "SemanticDiag::NoMatchingFunction"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "rank_mismatch"
desc = "Passing a [3, 1] tensor to a parameter declared `Tensor<[3]>` is a compile-time error at the call."
kind = "negative"
case = "../../../../cases/modules/tensor/shape_types/rank_mismatch.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["f32[3, 1]", "SemanticDiag::NoMatchingFunction"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "matmul_mismatch"
desc = "Declared parameter shapes reach operator inference: `x @ w` with [2, 3] and [4, 5] is a compile-time error naming the inner dimensions."
kind = "negative"
case = "../../../../cases/modules/tensor/shape_types/matmul_mismatch.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ArgumentsRejected"
expect_output_contains = ["matmul inner dimensions differ: 3 vs 4"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "propagated_mismatch"
desc = "Shapes propagate through operator result types into the next call: the [2, 5] result of `x @ w` does not fit a parameter declared [2, 4]."
kind = "negative"
case = "../../../../cases/modules/tensor/shape_types/propagated_mismatch.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["Tensor<[2, 5]>", "SemanticDiag::NoMatchingFunction"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "unshaped_argument"
desc = "A tensor of unknown shape (loaded at run time) does not fit a parameter with a declared shape; the diagnostic names the argument, both types and the conversion to write (`t as Tensor<[3]>`, see as_checked; `reshape` with a constant shape is the other checked way in, see reshape_gives_shape)."
kind = "negative"
case = "../../../../cases/modules/tensor/shape_types/unshaped_argument.cml"
args = ["${case}"]
envs = ["X=test/cases/modules/tensor/shape_types/x3.npy"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ArgumentNeedsConversion"
expect_output_contains = ["argument 1 ('t', for parameter 'b') has type 'Tensor', which is less exact than 'Tensor<[3]>'", "'t as Tensor<[3]>'"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "bad_argument"
desc = "A constant argument that is not a shape is rejected by the Tensor type with a diagnostic at the type; it is not ignored."
kind = "negative"
case = "../../../../cases/modules/tensor/shape_types/bad_argument.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::InvalidTypeArgument"
expect_output_contains = ["the constant argument of a Tensor type is its shape"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "not_parameterised"
desc = "A type that takes no arguments rejects a constant argument (`int<const 3>`); it used to be dropped silently."
kind = "negative"
case = "../../../../cases/modules/tensor/shape_types/not_parameterised.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::InvalidTypeArgument"
expect_output_contains = ["this type takes no arguments"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "ok"
desc = "A parameter declared `Tensor<[3]>` accepts a [3] tensor."
kind = "behavior"
case = "../../../../cases/modules/tensor/shape_types/ok.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["3"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "unknown_extent"
desc = "An extent written -1 is unknown: `Tensor<[?, 3]>` accepts batches of 5 and of 1, and the declared result shape `[-1, 2]` holds."
kind = "behavior"
case = "../../../../cases/modules/tensor/shape_types/unknown_extent.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["[[0.9950548, 0.9950548], [0.9950548, 0.9950548], [0.9950548, 0.9950548], [0.9950548, 0.9950548], [0.9950548, 0.9950548]]", "[[0.9950548, 0.9950548]]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "dtype_and_shape"
desc = "Element type and shape together: `f32[3]`."
kind = "behavior"
case = "../../../../cases/modules/tensor/shape_types/dtype_and_shape.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["3"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "reshape_gives_shape"
desc = "A tensor loaded at run time gets a static shape from `reshape(t, [3])` and then fits a parameter declared `Tensor<[3]>`."
kind = "behavior"
case = "../../../../cases/modules/tensor/shape_types/reshape_gives_shape.cml"
args = ["${case}"]
envs = ["X=test/cases/modules/tensor/shape_types/x3.npy"]
expect_exit = 0
expect_stdout_contains = ["3"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "as_checked"
desc = "A tensor of unknown shape enters a shaped position through an explicit conversion: `t as Tensor<[3]>`; the shape is checked when the conversion runs."
kind = "behavior"
case = "../../../../cases/modules/tensor/shape_types/as_checked.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["3"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "as_runtime_mismatch"
desc = "`t as Tensor<[4]>` on a tensor that turns out to have shape [3] is a run-time error at the conversion, naming both shapes."
kind = "behavior"
case = "../../../../cases/modules/tensor/shape_types/as_runtime_mismatch.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["ran", "conversion to 'Tensor<[4]>' failed: the array has shape [3]", "as_runtime_mismatch.cml:9:15"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "as_static_mismatch"
desc = "A conversion the static types already contradict (`ones([3]) as Tensor<[4]>`) is a compile-time error."
kind = "negative"
case = "../../../../cases/modules/tensor/shape_types/as_static_mismatch.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::DynamicCastForbidden"
expect_output_contains = ["f32[3]", "Tensor<[4]>"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000
