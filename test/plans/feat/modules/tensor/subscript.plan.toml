id = "modules.tensor.subscript"
order = 366
tier = "fast"
tags = ["feat", "modules", "tensor", "subscript", "diagnostics"]

[[tests]]
name = "take_rows"
desc = "`t[idx]` on a tensor is take (design principles 5.4): the rows the indices name, in that order, a repeated index repeating its row; the result's shape is `[len(idx)] + shape(t)[1:]`."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/take_rows.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["[3]", "9"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "slice_view"
desc = "`t[a:b]`, `t[:b]`, `t[a:]`, `t[:]` on a rank-1 tensor slice the first axis (design principles 5.4): an end equal to the extent is in range, and an end before the start is the empty slice (3.9)."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/slice_view.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "[2]\n5.0\n[2]\n[2]\n[4]\n[4]\n[0]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "slice_const_bounds"
desc = "A subscript slice whose constant bounds leave a statically known first extent is a compile-time error (design principles 3.9), the same rule as the function form of slice."
kind = "negative"
case = "../../../../cases/modules/tensor/subscript/slice_const_bounds.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ArgumentsRejected"
expect_output_contains = ["slice bounds 0..9 are outside axis 0 of extent 4"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "slice_rank2"
desc = "A subscript slice of the first dimension of a tensor of rank 2 or more is the core's one slice (design principles 5.4: every `slice(...)` call is the core's): the rows the range names, every element of the other dimensions taken at the coordinate it has. A step of 1 along the first dimension of a compact array is a run of the block, so the slice is a view sharing it (design principles 5.4); it no longer waits for the native array work."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/slice_rank2.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "ran\n[1, 3]\n[2, 3]\n[1, 3]\n[0, 3]\n21.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "slice_multidim"
desc = "A subscript that writes its bounds on a dimension other than the first (`m[:, 1:3]`) is the core's one slice with that dimension as its axis (design principles 5.4): the shape keeps the first extent and the second one becomes the range's, the sum of the elements is 16.0, and the distance to the same elements written out by hand is 0.0, so bounds read on the first dimension instead fail on all three readings."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/slice_multidim.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "ran\n[2, 2]\nsum=16.0\nd=0.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "slice_multidim_rank3"
desc = "The same on a tensor of rank 3, on two different dimensions (design principles 5.4): `c[:, :, 3:0:-1]` writes a negative step on the last dimension and `c[:, 1:3, :]` a range on the middle one. Each is the core's slice with that axis, so the shapes are [2, 3, 3] and [2, 2, 4], the sums are 234.0 and 232.0, and both distances to the elements written out by hand are 0.0. A step of 1 shares the block and a step of -1 does not, and the value and the shape are the readings either way."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/slice_multidim_rank3.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "ran\n[2, 3, 3]\nback=234.0\nback_d=0.0\n[2, 2, 4]\nmid=232.0\nmid_d=0.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "slice_two_axes_constant_and_computed"
desc = "A subscript that cuts two axes, one at bounds the program writes and one at a bound the run reads (design principles 5.4). The axis with constants states the length they give it and the axis with the run's bound states `?`, so the value is an `f32[?, 2]`, which `block`'s parameter states, and the read is [[1, 2], [4, 5]], shape [2, 2], sum 12.0; the same slice with the run's bound is 12.0."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/slice_two_axes_constant_and_computed.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "ran\n[2, 2]\nvalue=12.0\ncomputed=12.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "index_other_dimension"
desc = "A subscript that names a range on one dimension and a position on another (`m[:, 0]`): each written dimension is one node of the core's, each naming the axis the subscript wrote it on, lowered from the last written dimension back (design principles 5.4). The position drops its dimension and every other one is kept whole, so the first column of an `f32[2, 3]` is an `f32[2]` -- `column`'s parameter states exactly that, so the call needs no conversion -- and its sum is 5.0."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/index_other_dimension.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "reached\n[2]\nvalue=5.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "index_position_range"
desc = "`t[a:b, c]`: a range on one dimension and a position on another (design principles 5.4). The lowering goes from the last written dimension back, so the range on axis 0 reads what `t[a:b]` alone reads: `m[0:2, 1]` is an `f32[2]`, its sum is 7.0, and the distance between it and `s[:, 1]` -- the same slice with the same position on it -- is 0.0."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/index_position_range.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "ran\n[2, 3]\n[2]\nvalue=7.0\nd=0.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "index_two_positions"
desc = "`m[i, j]`: a position on every dimension of a rank-2 value (design principles 5.4). Both dimensions are dropped, so the result is one element, an `f32` -- which `element`'s parameter states -- and `m[1, 2]` is 6.0."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/index_two_positions.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "ran\nvalue=6.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "index_rank3_mixed"
desc = "Two mixed subscripts of a rank-3 value, with all three kinds of written dimension among them (design principles 5.4): `c[:, 1, 2:4]` writes a dimension whole, a position and a range, and `c[:, idx, 2:4]` takes a dimension with an integer array. The shapes are `f32[2, 2]` and `f32[2, 2, 2]`, which the two parameters state, and the sums are 54.0 and 108.0."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/index_rank3_mixed.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "ran\n[2, 2]\n[2, 2, 2]\none=54.0\ntwo=108.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "take_other_dimension"
desc = "`m[:, idx]`: an integer array on a dimension other than the first, with a repeated index (design principles 5.4). The positions are taken in the order the indices give and every other dimension is kept whole, so a repeated index repeats that dimension's slab and the result states the indices' length on it: an `f32[2, 3]`, which `columns`' parameter states, and 19.0."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/take_other_dimension.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "ran\n[2, 3]\nvalue=19.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "index_adjoint"
desc = "The adjoints of both index forms on a dimension other than the first (design principles 5.4, 9.9): the position `m[:, 0]` scatters a column's gradient back along axis 1 (`:tangent/scatter_add_arr`) and the take `m[:, [1, 1]]` scatters each column's gradient into the column it came from, adding where the index repeats (`:tangent/scatter_take_arr`). The values are 4.0 and 12.0, the gradients sum to 2.0 and 4.0, and their products with the gradients written out by hand are 2.0 and 8.0."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/index_adjoint.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "column value=4.0 grad_sum=2.0 grad_dot=2.0\ntake value=12.0 grad_sum=4.0 grad_dot=8.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "slice_step"
desc = "A step other than 1 is the core's slice too: the positions the step names, as a copy that does not share the parent's block -- the deviation the flip line records for a stepped slice, the view with strides waiting for the native array work."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/slice_step.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "ran\n[2]\n4.0\n[2]\n[4]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "core_slice_adjoint"
desc = "The core's slice answers `a[1:4]` on a rank-1 tensor whose length is stated (`reshape(x, [6])`), and its adjoint hands back a value of the element type the forward value has: `sum(a[1:4])` is 9.0 and the gradient sums to 3.0 instead of refusing with `sum: Unsupported Tensor dtype` ."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/core_slice_adjoint.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "core_slice_adjoint value=9.0 grad_sum=3.0 grad_dot=3.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "core_slice_adjoint.fvm"
desc = "The same node and the same adjoint on the bytecode VM: the gradient of the core's slice carries the element type there too (fvm)."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/core_slice_adjoint.cml"
args = ["${case}", "std::fvm"]
expect_exit = 0
expect_stdout_exact = "core_slice_adjoint value=9.0 grad_sum=3.0 grad_dot=3.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

# The same chain on a value whose length the type does not state: `x[1:4]` with `x: f32[]` is the
# core's slice on the flip line too, so this pair measures the core's chain itself, before and after
# the scatter kernel learned to create its result with the tangent's array type.
[[tests]]
name = "core_slice_adjoint_open"
desc = "The core's slice on a rank-1 value whose length is not stated (`x[1:4]`, `x: f32[]`) and its adjoint: `sum(x[1:4])` is 9.0 and the gradient sums to 3.0. Before the fix this refused with `sum: Unsupported Tensor dtype`, because the scatter created its result with bare slots."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/core_slice_adjoint_open.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "core_slice_adjoint_open value=9.0 grad_sum=3.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "core_slice_adjoint_open.fvm"
desc = "The same open-length slice and its adjoint on the bytecode VM (fvm)."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/core_slice_adjoint_open.cml"
args = ["${case}", "std::fvm"]
expect_exit = 0
expect_stdout_exact = "core_slice_adjoint_open value=9.0 grad_sum=3.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

