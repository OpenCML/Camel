[[tests]]
name = "slice_step_negative"
desc = "A negative step runs backwards on the core's one slice: `t[3:0:-1]` takes positions 3, 2 and 1 -- the end is where the walk stops -- and `t[3::-1]` takes all four, an end left out standing for the position before the first. A copy, not a view, as for any stepped slice; no gradient is built from a view with strides until the native array work lands."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/slice_step_negative.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "ran\n[3]\n9.0\n[4]\n[3]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "slice_step_zero"
desc = "The constant 0 step is refused where it is written, with the catalog's own diagnostic: 0 names no position, so the subscript that writes it is the compile-time `SemanticDiag::SliceStepZero` and the program after it does not run."
kind = "negative"
case = "../../../../cases/modules/tensor/subscript/slice_step_zero.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::SliceStepZero"
expect_diagnostic_code = "0x030001E9"
expect_diagnostic_line = 11
expect_diagnostic_column = 25
expect_output_contains = ["The slice 't[a:b:s]' has a step of 0"]
expect_output_not_contains = ["not reached"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

# A slice along an axis that is not the first: the core's own function form, called without the
# module's `slice` in scope, so the core's rule is the one that answers. The type the call has is
# what the parameter it is passed to states, which is how a static extent is observed in this
# language (the same idiom as si_computed_slice, whose computed axis keeps `?` and whose diagnostic
# is unchanged).
[[tests]]
name = "slice_axis_constant_bounds"
desc = "A slice of `m: f32[3, 4]` along axis 1 with the constant bounds 1 and 3 is an `f32[3, 2]`: the axis the slice does not cut keeps its stated length and the axis it cuts states the two positions the bounds and the step give it, so `row(a: f32[3, 2])` takes it with no conversion ."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/slice_axis_constant_bounds.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "39.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "slice_axis_computed_bounds"
desc = "The same slice with a computed bound is an `f32[3, ?]`: the cut axis is `?` because only the run knows how long it is, and the axis the slice does not cut still keeps its stated length, so `row(a: f32[3, ?])` takes it with no conversion. The old rule said `f32[?, ?]`, which this call would be refused for as less exact."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/slice_axis_computed_bounds.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "54.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000
