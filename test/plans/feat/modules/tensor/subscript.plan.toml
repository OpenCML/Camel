expect_stdout_not_contains = ["label=\"tensor:idx_take\""]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "slice_step_negative"
desc = "A negative step runs the slice backwards (design principles 5.4): the elements from the start down to the end, the start defaulting to the last element and the end to the position before the first."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/slice_step_negative.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "[3]\n6.0\n4.0\n2.0\n[6]\n6.0\n1.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "slice_step_zero"
desc = "A subscript slice of a tensor whose step is the constant 0 takes no element at all: refused where the step is written (design principles 5.4), as the step of a range is (4.2)."
kind = "negative"
case = "../../../../cases/modules/tensor/subscript/slice_step_zero.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ArgumentsRejected"
expect_output_contains = ["a slice step of 0 takes no element"]
expect_output_not_contains = ["not reached"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000