[[tests]]
name = "slice_node_take"
desc = "`x[[0, 2]]` on a rank-1 value whose length is stated: the core's `:op/idx_take`, printed by std::gir."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/slice_node_take.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
