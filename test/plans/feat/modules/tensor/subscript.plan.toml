id = "modules.tensor.subscript"
order = 366
tier = "fast"
tags = ["feat", "modules", "tensor", "subscript", "diagnostics"]

[[tests]]
name = "take_rows"
desc = "`t[idx]` on a tensor is take (design principles 5.4): the rows the indices name, in that order, a repeated index repeating its row; the result's shape is `[len(idx)] + shape(t)[1:]`."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/take_rows.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["[3]", "9"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "slice_view"
desc = "`t[a:b]`, `t[:b]`, `t[a:]`, `t[:]` on a rank-1 tensor slice the first axis (design principles 5.4): an end equal to the extent is in range, and an end before the start is the empty slice (3.9)."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/slice_view.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "[2]\n5.0\n[2]\n[2]\n[4]\n[4]\n[0]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "slice_const_bounds"
desc = "A subscript slice whose constant bounds leave a statically known first extent is a compile-time error (design principles 3.9), the same rule as the function form of slice."
kind = "negative"
case = "../../../../cases/modules/tensor/subscript/slice_const_bounds.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ArgumentsRejected"
expect_output_contains = ["slice bounds 0..9 are outside axis 0 of extent 4"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "slice_rank2"
desc = "A subscript slice of the first dimension of a tensor of rank 2 or more is the core's one slice (the author's ruling of 2026-10-25: every `slice(...)` call is the core's): the rows the range names, every element of the other dimensions taken at the coordinate it has. A step of 1 along the first dimension of a compact array is a run of the block, so the slice is a view sharing it (design principles 5.4); it no longer waits for H17."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/slice_rank2.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "ran\n[1, 3]\n[2, 3]\n[1, 3]\n[0, 3]\n21.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "slice_multidim"
desc = "A subscript that slices one dimension and indexes another (`m[:, 0]`) is a view with strides: the syntax is accepted and the form is refused with a located ConstructNotSupported that names H17 (design principles 5.4)."
kind = "negative"
case = "../../../../cases/modules/tensor/subscript/slice_multidim.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ConstructNotSupported"
expect_output_contains = ["a subscript that slices a dimension other than the first", "H17"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "slice_step"
desc = "A step other than 1 is the core's slice too (the author's ruling of 2026-10-25: any non-zero step is accepted, and only the constant 0 is refused where it is written): the positions the step names, as a copy that does not share the parent's block -- the deviation the flip line records for a stepped slice, the view with strides waiting for H17."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/slice_step.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "ran\n[2]\n4.0\n[2]\n[4]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "core_slice_adjoint"
desc = "The core's slice answers `a[1:4]` on a rank-1 tensor whose length is stated (`reshape(x, [6])`), and its adjoint hands back a value of the element type the forward value has: `sum(a[1:4])` is 9.0 and the gradient sums to 3.0 instead of refusing with `sum: Unsupported Tensor dtype` (the author's ruling of 2026-10-25, point 2)."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/core_slice_adjoint.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "core_slice_adjoint value=9.0 grad_sum=3.0 grad_dot=3.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "core_slice_adjoint.fvm"
desc = "The same node and the same adjoint on the bytecode VM: the gradient of the core's slice carries the element type there too (fvm)."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/core_slice_adjoint.cml"
args = ["${case}", "std::fvm"]
expect_exit = 0
expect_stdout_exact = "core_slice_adjoint value=9.0 grad_sum=3.0 grad_dot=3.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

# The same chain on a value whose length the type does not state: `x[1:4]` with `x: f32[]` is the
# core's slice on the flip line too, so this pair measures the core's chain itself, before and after
# the scatter kernel learned to create its result with the tangent's array type.
[[tests]]
name = "core_slice_adjoint_open"
desc = "The core's slice on a rank-1 value whose length is not stated (`x[1:4]`, `x: f32[]`) and its adjoint: `sum(x[1:4])` is 9.0 and the gradient sums to 3.0. Before the fix this refused with `sum: Unsupported Tensor dtype`, because the scatter created its result with bare slots."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/core_slice_adjoint_open.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "core_slice_adjoint_open value=9.0 grad_sum=3.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "core_slice_adjoint_open.fvm"
desc = "The same open-length slice and its adjoint on the bytecode VM (fvm)."
kind = "behavior"
case = "../../../../cases/modules/tensor/subscript/core_slice_adjoint_open.cml"
args = ["${case}", "std::fvm"]
expect_exit = 0
expect_stdout_exact = "core_slice_adjoint_open value=9.0 grad_sum=3.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "slice_one_node"
desc = "`x[1:4]`, `x[2:]`, `slice(x, 0, 1, 4)` and `x[[0, 2]]` on a rank-1 tensor whose length is stated: the three slice spellings are the core's one slice node and the row form is the core's take (std::gir prints the operators)."
