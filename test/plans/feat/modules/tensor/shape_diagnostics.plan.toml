id = "modules.tensor.shape_diagnostics"
order = 362
tier = "feat"
tags = ["feat", "modules", "tensor", "diagnostics"]

[[tests]]
name = "add"
desc = "A static shape conflict in `add` fails compilation at the call, naming both shapes."
kind = "negative"
case = "../../../../cases/modules/tensor/shape_diagnostics/add.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ArgumentsRejected"
expect_diagnostic_line = 10
expect_diagnostic_column = 16
expect_output_contains = ["cannot broadcast extents 2 and 4"]
expect_output_not_contains = ["unreachable"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 4000

