# `inline` as an operator of a transaction: the two semantics the ruling of 2026-11-18 gave
# (internal/reviews/2026-11-18-the-at-of-inline-says-a-region-not-a-place.cn.md
# section 5, docs/design/graph-editing/README.cn.md 7 and 15.3).
#
# The readings are printed by the program itself, because the two branches are not told apart by
# counting nodes: both add the body's code. What differs is where it lands and what the block's
# chain does.
#
#   `at` a statement of the chain (here the block's second print, which holds a place because it
#   writes): the print is gone, the body's gate stands where the print stood -- written after the
#   node the print was written after --, and the edited function prints `first` and no `5`.
#
#   `at` a pure node (here the addition `c = a + b`): the chain is unchanged, the addition still
#   reads its two calls and the print still reads it, the body's node is in an Inline region whose
#   parent is the addition's own region, and the edited function prints what it printed.
#
#   `at` the call of a function that writes nothing (here `inc(2)`): by the ruling's words a call is
#   a statement, and by the graph's structure it holds no place to take over. The reading says which
#   one the operator followed: the call is still there, still reads `2`, the chain did not move.
#
# The fourth reading is the ordering: `at` a pure node the body's writes have no place of their own,
# so the caller says where they run among the accesses already there -- and `order` takes a node of
# the transaction's draft, which is what the splice answers with. That is the promise
# `stdlib/graph.cml` makes for `inline` at a pure node ("the ordering of the body's writes among the
# accesses already there is `order`'s to say"), and the commit accepts it: the third print is in the
# graph the commit published, ordered after both prints that were already there.
#
# It runs as well, and that is the other half of the same reading: design principles 3.1 makes the
# body's write a write of the region it landed in, and that region's exit `GATE` waits for it. The
# author's ruling of 2026-11-20 (item 1) is why this is the reading and not the one
# this plan pinned before it: "体若带写，`inline` 自己把这些写挂进所选区域出口 `GATE` 的等待". The
# line this reading pinned until then -- the body's print sitting in a region no chain of the block
# reaches, so that the splice at a pure node changed nothing the program printed -- was that
# behaviour, and that behaviour is the defect the ruling names.
id = "modules.graph_inline"
order = 378
tier = "fast"
tags = ["feat", "modules", "graph", "edit", "inline"]

[[tests]]
name = "inline_at_a_statement_takes_over_its_place"
desc = "at a statement: the node is gone and the body stands in its place; at a pure node: the chain is unchanged and the body lands in an Inline region of that node's region; the node a splice answers with is one `order` takes"
kind = "behavior"
case = "../../../cases/modules/graph_function/inline.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "[run] subject, before any edit\nfirst\n5\n[pure] prints=2->2 body=0->1 sum_kept=1 sum_reads=call(inc),call(inc) sum_readers=1 value=const(42)\n[pure] body=1 node(s), region=RegionKind::Inline parent_is_sum_region=true\n[pure] chain=:io/println<-:io/println gate<-:io/println -> :io/println<-:io/println gate<-:io/println\n[pure] the edited function runs:\nfirst\n5\n[call] inc_calls=2->2 body=0->1 target_sync_in=(none) call_reads=const(2) call_feeds=1 chain_same=true value=const(42)\n[stmt] prints=2->1 body=0->1 value=gate\n[stmt] last=gate (written after :io/println) anchor=gate reading const(42)\n[stmt] chain=:io/println<-:io/println gate<-:io/println -> gate<-:io/println gate<-gate\n[stmt] the edited function runs:\nfirst\n[order] carried=:io/println ordered_after=2\n[order] prints=2->3 ordered_before=2 body=0 sum_kept=1\n[order] the edited function runs (the body runs: its write waits on the region exit gate):\nfirst\n5\nannounced\n"
timeout_ms = 20000

# The other half of the same reading, from the other end: the effect of a call through a function value
# is the clause of that value's type, and a gradient's type carries the clause of the function it
# transforms (`modules/autodiff/pullback.cpp#gradientSignature`, as `modules/transforms/jvp.cpp#liftSignature`
# does). With both in place the call in `step` reaches nothing, `step`'s type is published as the pure
# signature it measures, and a print an edit splices in is refused by the **effect** check: the refused
# diagnostic is `PassEffectBeyondType`, and the order check -- which used to answer first, because the
# call was recorded as `write unknown` -- is never reached. The type line is pinned too: it is the clause
# the call site reads.
[[tests]]
name = "a_call_through_a_value_reaches_what_its_type_declares"
desc = "a commit into a graph whose body holds a call through a gradient value: the type of that value prints the clause it derives, and the refused diagnostic is PassEffectBeyondType, not PassEffectOrder"
kind = "negative"
case = "../../../cases/modules/graph_function/commit_effect.cml"
args = ["${case}", "std::nvm"]
expect_exit = 1
timeout_ms = 20000
expect_diagnostic_name = "RuntimeDiag::PassEffectBeyondType"
expect_output_contains = ["[type] the value the call runs: <float> (float) => float pure", "write stdout", "reaches past the effect its own type declares"]