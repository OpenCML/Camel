id = "modules.resources"
order = 373
tier = "fast"
tags = ["feat", "modules", "semantics", "resources"]
desc = "The resources of operators (camel/core/resource_semantics.h, camel/runtime/resources.h; docs/design/op-semantics section 8): the declarations and their registration checks, mapped regions, and their resolution in a program: the accesses of each node, the footprint of each graph, and the pairs of nodes that must keep their order, kept apart from data dependence."

[defaults]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "core"
desc = "test::resources (test-only): one rejected declaration per rule of check 5 (an access of unknown class, an ambient resource without a name, a named variable, an ambient resource bound to an operand and a variable bound to none, an operator bound to a capture, a same result without its operand, a pure operator that touches something, an effectful one that touches nothing, an external effect for a state-only operator, an ambient allocation), the refinement of an operator its traits count as external, the minor version a declaration of resources adds to an existing record; the bounds of mapped regions and which overlap. In the program: assignments write their cell, reads read it, a var parameter, a capture and a recursion (a fixpoint) carry the access to the caller's cell, an array sorted in place is an object read and written, the generator, the console and the file system are ambient and external; pairs that conflict are ordered by data or by control edges, the arms of a branch are not a pair, and the program's output is unchanged."
kind = "behavior"
case = "../../../cases/resources/effects.cml"
args = ["${case}", "test::resources"]

expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const line = (l) => assert(out.includes(l + '\n'), `missing: ${l}`)
for (const [check, reason] of [
  ['unknown_class', 'an access names the class of its resource'],
  ['ambient_without_name', 'a resource of class ambient has a name'],
  ['variable_with_name', "a resource of class variable has no name ('x')"],
  ['ambient_bound_to_operand', 'an ambient resource is named by no operand'],
  ['variable_unbound', 'only an ambient resource is named by no operand'],
  ['operator_bound_to_capture', "an operator's access is bound to an operand, not a capture"],
  ['same_without_operand', 'a result that is same names its operand'],
  ['pure_touches', 'a pure operator touches no resource'],
  ['effectful_touches_nothing', 'an operator that is not pure touches, allocates or affects something'],
  ['external_against_state_only', 'its traits give it no external effect'],
  ['allocates_ambient', 'an operator allocates a variable, an object, a handle or a foreign resource'],
  ['var_param_not_written', 'the signature has a var ordinary parameter 0 that the declaration does not write'],
  ['written_without_var', 'the declaration writes a variable through ordinary parameter 0, which is not a var parameter'],
  ['late_resolver', 'the signature has a var ordinary parameter 0 that the declaration does not write'],
]) {
  const m = out.match(new RegExp(`RESOURCES ${check} (.*)`))
  assert(m && m[1].startsWith('rejected:') && m[1].includes(reason), `${check}: ${m ? m[1] : 'missing'}`)
}
for (const l of [
  'RESOURCES valid accepted', 'RESOURCES refines_external accepted', 'RESOURCES pure_touches_none accepted',
  'RESOURCES var_param_written accepted', 'RESOURCES late_declared accepted',
  'RESOURCES writes var_op 1 plain_op 1 late_op 0',
  'RESOURCES version semtest:pure@1.5 semtest:cell_write@1.0',
  'RESOURCES text write variable norm 0 whole',
  'RESOURCES conservative rmw unknown norm 0 region unknown; rmw unknown norm 1 region unknown; rmw unknown with 0 region unknown; result unknown; external',
  'RESOURCES conservative_pure none',
  'RESOURCES bounds [2, 5] [6, 9] [5, 7] empty [0, 6] unknown',
  'RESOURCES overlap a-b 0 a-c 1 a-empty 0 a-unknown 1',
  'RESOURCES footprint bump rmw variable norm 0 whole',
  'RESOURCES footprint countdown rmw variable norm 0 whole',
  'RESOURCES footprint __g_5__ rmw variable capture 0 whole; result fresh',
  'RESOURCES footprint main rmw ambient rng; write ambient stdout; read ambient fs; rmw object (any); external',
  'RESOURCES node main 2 :var/new: allocates variable',
  'RESOURCES node main 9 :op/assn_l: write variable (node 2); result may_alias 1',
  'RESOURCES node main 10 FUNC bump: rmw variable (node 2); result unknown',
  'RESOURCES node main 12 FUNC countdown: rmw variable (node 5); result unknown',
  'RESOURCES node main 15 CALL: rmw variable (node 2)',
  'RESOURCES node main 19 :var/take: rmw variable (node 18); result may_alias 0',
  'RESOURCES node main 20 array:sort_in_place: rmw object (node 19); result same 0',
  'RESOURCES node main 23 rand:seed: write ambient rng; external',
  'RESOURCES node main 29 fs:exists: read ambient fs; external',
  'RESOURCES node countdown 12 FUNC countdown: rmw variable (node 0); result unknown',
  'RESOURCES order main 8 9 resource ordered by data',
  'RESOURCES order main 9 10 resource ordered by control',
  'RESOURCES order main 12 34 resource ordered by control',
  'RESOURCES order main 19 21 resource ordered by data',
  'RESOURCES order main 23 24 external ordered by control',
  'RESOURCES order countdown 4 12 resource ordered by control',
  'true', 'false', '4', '16', '[1, 2, 3]',
]) line(l)
assert(!out.includes('RESOURCES order countdown 9 12'), 'the two arms of a branch are not a pair')
assert(!/RESOURCES order main (2|5|18) /.test(out), 'making a cell conflicts with nothing')
assert(!/RESOURCES order main 12 (8|9|10|15|32) /.test(out), 'the cells of c and d are different resources')
assert(!out.includes(' unordered'), 'the program orders every conflicting pair')

// ---- Synthetic graphs: the internal model of steps 1-2 (no syntax yet). ----
// (3c) A function that returns its parameter: the result is that port, not a fresh value.
line('RESOURCES synth result passthrough result same 0')
line('RESOURCES synth result same read handle semtest:Stream norm 0 whole; result same 0')
line('RESOURCES synth result open result fresh')
line('RESOURCES synth type intern same pure_generic different')
// (3a) open() then two operations on the same returned value: one object, serialised by the
// control edge the graph has.
const order = (name) => out.split('\n').filter((l) => l.startsWith(`RESOURCES synth order ${name} `))
const sameOne = order('same-one-ctrl')
assert(sameOne.some((l) => / 2 3 resource ordered by control$/.test(l)), `same-one-ctrl: ${sameOne}`)
// (3b) same(open()) of two different fresh objects: the results are Same of each, not Unknown,
// so the two chains are not serialised against each other (only each chain's own data edge is
// ordered: same -> next).
const sameTwice = order('same-twice')
assert(sameTwice.length === 2 && sameTwice.every((l) => l.endsWith('resource ordered by data')), `same-twice: ${sameTwice}`)
assert(!sameTwice.some((l) => / (2 5|3 4|4 5) /.test(l)), `same-twice must keep the two objects apart: ${sameTwice}`)
assert(order('open-twice').length === 0, `two open() results are different objects: ${order('open-twice')}`)
assert(order('open-twice-ctrl').length === 0, `two open() results are different objects: ${order('open-twice-ctrl')}`)
// A typed callee: the call's footprint comes from its type, not from its (empty) body. Two calls
// with different arguments bind different values...
const typed = out.split('\n').filter((l) => l.includes('RESOURCES synth node typed-caller') && l.includes('FUNC synth:typed:'))
assert(typed.length === 2, `typed calls: ${typed}`)
const bound = typed.map((l) => (l.match(/object \(node (\d+)\)/) || [])[1])
assert(bound[0] && bound[1] && bound[0] !== bound[1], `per-argument footprints: ${typed}`)
assert(order('typed-caller').length === 0, 'different arguments are different resources')
// ...and two calls with one argument are one resource, ordered by the control edge.
const typedSame = order('typed-same')
assert(typedSame.length === 1 && typedSame[0].endsWith('resource ordered by control'), `typed-same: ${typedSame}`)
// A `var` argument the signature says is unused produces no access.
const unused = out.split('\n').find((l) => l.includes('FUNC synth:typed-unused:'))
assert(unused && unused.endsWith(': none'), `unused var argument: ${unused}`)
}
"""

[[tests]]
name = "core_test_pass_is_not_in_a_pipeline"
desc = "test::resources is a test-only pass: no pipeline adds it, so a run that names no pass prints no check."
kind = "behavior"
case = "../../../cases/resources/effects.cml"
args = ["${case}"]
expect_exit = 0
expect_output_not_contains = ["RESOURCES "]

[[tests]]
name = "declared_resources"
desc = "`camel inspect --ops` shows the declared resources in each operator's semantics: the variable operators and the assignments (state, no external effect), the console, the file system and the generator (ambient, external)."
kind = "behavior"
case = "../../../cases/resources/effects.cml"
args = ["inspect", "--ops", "${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const ops = input.normalized.stdout.split('\n').filter((l) => l.startsWith('OPERATOR ')).map((l) => JSON.parse(l.slice(9)))
const byUri = new Map(ops.map((o) => [o.uri, o]))
const expect = {
  ':var/new': 'allocates variable',
  ':var/get': 'read variable norm 0 whole; result may_alias 0',
  ':var/take': 'rmw variable norm 0 whole; result may_alias 0',
  ':op/assn_l': 'write variable norm 0 whole; result may_alias 1',
  ':op/assn_add_l': 'rmw variable norm 0 whole',
  ':op/assn_owned': 'write variable norm 0 whole; result may_alias 1',
  ':io/println': 'write ambient stdout; external',
  ':io/eprintln': 'write ambient stderr; external',
  ':io/input': 'rmw ambient stdin; external',
  'fs:read_text': 'read ambient fs; external',
  'fs:write_text': 'rmw ambient fs; external',
  'rand:seed': 'write ambient rng; external',
  'rand:rand': 'rmw ambient rng; external',
}
for (const [uri, text] of Object.entries(expect)) {
  const op = byUri.get(uri)
  assert(op && op.semantics, `${uri} has no semantics`)
  assert(op.semantics.resources === text, `${uri}: ${op.semantics.resources}`)
  assert(op.semantics.key === `${uri}@1.0`, `${uri}: key ${op.semantics.key}`)
}
}
"""

[[tests]]
name = "resource_names"
desc = "The resource set of the standard library is pinned (H134): `camel inspect --ops` on a program that imports every module declaring a resource prints exactly these ambient and foreign names, so a later task cannot quietly rename one back. The names are the ones design principles 3.3 gives (`stdout`, `stderr`, `stdin`, `clock`, `env`, `fs`, plus the module's own `rng`, `tensor:generator`, `tensor:threads`, `tiles:driver`, `tiles:device`, `para:rendezvous`, `process`); raw mode writes `stdin`, the one resource the terminal mode was merged into (the author's ruling on H134 question 1)."
kind = "behavior"
case = "../../../cases/resources/names.cml"
args = ["inspect", "--ops", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 30000
verify_script = """
({ input, assert }) => {
const ops = input.normalized.stdout.split('\n').filter((l) => l.startsWith('OPERATOR ')).map((l) => JSON.parse(l.slice(9)))
const byUri = new Map(ops.map((o) => [o.uri, o]))
const resources = (uri) => { const op = byUri.get(uri); return op && op.semantics && op.semantics.resources }
// Every ambient or foreign resource any listed operator names.
const names = new Set()
for (const op of ops) {
  const text = op.semantics && op.semantics.resources
  if (!text) continue
  for (const m of text.matchAll(/(?:ambient|foreign) ([^\s;]+)/g)) names.add(m[1])
}
const expected = [
  'clock', 'env', 'fs', 'para:rendezvous', 'process', 'rng', 'stderr',
  'stdin', 'stdout', 'tensor:generator', 'tensor:threads', 'tiles:device', 'tiles:driver',
]
const got = [...names].sort()
assert(got.length === expected.length, `expected ${expected.length} resources, got ${got.length}: ${got.join(', ')}`)
for (const name of expected) assert(names.has(name), `missing resource ${name}`)
for (const old of ['io:stdout', 'io:stdin', 'io:stderr', 'time:clock', 'process:environment', 'rand:generator'])
  assert(!names.has(old), `old resource name ${old} is back`)
// One operator of each kind, so a name cannot move between operators unnoticed.
const expect = {
  ':io/print': 'write ambient stdout; external',
  ':io/println': 'write ambient stdout; external',
  ':io/eprintln': 'write ambient stderr; external',
  ':io/input': 'rmw ambient stdin; external',
  'io:has_input': 'read ambient stdin; external',
  'io:get_char': 'rmw ambient stdin; external',
  'io:set_terminal_raw_mode': 'write ambient stdin; external',
  'fs:read_text': 'read ambient fs; external',
  'fs:write_text': 'rmw ambient fs; external',
  'rand:seed': 'write ambient rng; external',
  'rand:rand': 'rmw ambient rng; external',
  'time:now': 'read ambient clock; external',
  'time:strftime': 'read ambient env; external',
  'env:get_env': 'read ambient env; external',
  'process:sleep': 'read ambient clock; external',
  'process:whoami': 'read ambient env; external',
  'process:exit': 'rmw ambient process; external',
  'ckpt:load_tree': 'read ambient fs; write ambient stderr; external',
  'ckpt:save_tree': 'rmw ambient fs; external',
  'tensor:show': 'write ambient stdout; external',
  'tensor:seed': 'write ambient tensor:generator; external',
  'nn:save_params': 'rmw ambient fs; external',
  'tiles:upload': 'rmw ambient tiles:driver; allocates foreign tiles:device; external',
}
for (const [uri, text] of Object.entries(expect)) {
  assert(resources(uri) === text, `${uri}: ${resources(uri)}`)
}
}
"""

[[tests]]
name = "inspect_resources_is_not_an_option"
desc = "There is no `inspect --resources` flag (the author's ruling on H134 question 3): the command line is refused before anything runs, and the unknown option is named. The resources are read per operator from `inspect --ops` instead."
kind = "negative"
case = "../../../cases/resources/names.cml"
args = ["inspect", "--resources", "${case}"]
expect_exit = 1
expect_stderr_contains = ["unknown option", "'--resources'"]
normalizers = ["normalize_newlines"]
timeout_ms = 10000
