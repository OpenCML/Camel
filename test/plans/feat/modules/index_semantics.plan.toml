id = "modules.index_semantics"
order = 364
tier = "feat"
tags = ["feat", "modules", "tensor", "semantics"]
desc = "The index semantics of operators (camel/core/index_semantics.h, docs/design/op-semantics sections 5 and 7): the quasi-affine expression language, the structural validation of instances, the query through the operator table, the text form, splitting dims for tiles and the strided view of a row-major operand."

[defaults]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "core"
desc = "test::index_semantics (CAMEL_ENABLE_TEST_PASSES): expressions simplify and intern as they are built (constants fold, a constant term goes right and a constant factor left, nested scales multiply), floordiv and mod are mathematical (-7 floordiv 2 = -4, -7 mod 2 = 1), the affine form of an expression with known parameters, and the forms outside the quasi-affine language are rejected (a product of two dims, a division by zero or by a dim, overflow). validate rejects a combining write without a law, a reduction written uniquely, an extent that depends on a dim, a divisor parameter not known to be positive (and accepts it once a constraint requires it), an expression id outside the instance. instantiate returns the declared instance, and none for an operator without index semantics, an instantiation function that finds none, one that throws, one that returns an invalid instance. splitDims of a matrix product by 4 on m and k keeps exactly M*N*K points inside the guard, with the original bounds as the guard; rowMajorView gives a transpose's and a slice's offset and strides, and none for a reshape across axes."
kind = "behavior"
case = "../../../cases/consistency/values/max_min_special.cml"
args = ["${case}", "test::index_semantics"]
envs = ["CAMEL_ENABLE_TEST_PASSES=1"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const line = (l) => assert(out.includes(l + '\n'), `missing: ${l}`)
for (const l of [
  'INDEX fold 5', 'INDEX add_zero d0', 'INDEX constant_right d0 + 1', 'INDEX constants_merge d0 - 3',
  'INDEX subtract d0 - d1', 'INDEX scale_nested 12*d0', 'INDEX param_factor p0*d0', 'INDEX const_factor_first 2*p0',
  'INDEX div_mod ((d0 + d1) floordiv 4) mod 3', 'INDEX div_by_one d0 0', 'INDEX interned yes', 'INDEX floor_negative -4 1',
  'INDEX evaluate 21', 'INDEX affine 0 5 -2', 'INDEX affine_mod none', 'INDEX affine_unknown none',
  'INDEX product_of_dims rejected: a product of two expressions that are not constants or parameters is not quasi-affine',
  'INDEX mod_by_zero rejected: a floordiv or mod divides by a positive constant or by a parameter',
  'INDEX div_by_dim rejected: a floordiv or mod divides by a positive constant or by a parameter',
  'INDEX overflow rejected: index arithmetic overflows 64 bits',
  'INDEX validate_matmul ok',
  'INDEX validate_combine_without_law rejected: a combining write names no reduction law',
  'INDEX validate_reduction_written_unique rejected: a domain with a reduction dim writes each result element more than once, not uniquely',
  'INDEX validate_extent_mentions_dim rejected: the extent of n depends on a dim',
  'INDEX validate_divisor_not_known_positive rejected: a floordiv or mod divides by s, which the constraints do not require to be positive',
  'INDEX validate_divisor_required_positive ok',
  'INDEX validate_expression_out_of_range rejected: expression 999 is not in the instance',
  'INDEX query_declared instance', 'INDEX query_no_instance none', 'INDEX query_throws none',
  'INDEX query_invalid none', 'INDEX query_undeclared none',
  'params   M = extent(0, 0) = 2; K = extent(0, 1) = 4; N = extent(1, 1) = 3',
  'domain   m < M parallel; n < N parallel; k < K reduction',
  'norm 0   (m, k)', 'norm 1   (k, n)',
  'domain   m_o < (M + 3) floordiv 4 parallel; m_i < 4 parallel; n < N parallel; k_o < (K + 3) floordiv 4 reduction; k_i < 4 reduction',
  'guard    4*m_o + m_i < M, 4*k_o + k_i < K',
  'norm 0   (4*m_o + m_i, 4*k_o + k_i)',
  'INDEX split_valid yes', 'INDEX split_extents 2 4 3 2 4', 'INDEX split_points 105',
  'INDEX split_bad_dim rejected: splitDims: a dim out of range or a factor below 1',
  'INDEX view_transpose offset 0 strides 1 5', 'INDEX view_slice offset 1 strides 2 5', 'INDEX view_reshape none',
  'write    (m, n) combine law fma_f32',
  'law      fma_f32: fma_chain f32 -> f32 -> f32, init 0x0, ascending, empty initial, commutative, identity 0x80000000',
  'INDEX query_undeclared_law none',
  'INDEX freedom sum_i64 [none] regroup permute block_identity',
  'INDEX freedom sum_f32 [none] none', 'INDEX freedom sum_f32 [reassociate] regroup permute',
  'INDEX freedom sum_f32 [contract,change_precision] change_precision',
  'INDEX freedom sum_f32_from_minus_zero [reassociate] regroup permute block_identity',
  'INDEX freedom max_f32 [none] regroup permute block_identity',
  'INDEX freedom mul_add_f32 [none] none', 'INDEX freedom mul_add_f32 [contract,change_precision] contract change_precision',
  'INDEX freedom unordered [none] regroup',
  'INDEX law_valid accepted',
]) line(l)
for (const [check, reason] of [
  ['float_add_associative', 'law sum_f32: floating-point add is not exactly associative'],
  ['constant_too_wide', 'law sum_f32: a constant does not fit its 32-bit accumulator'],
  ['first_without_fault', 'law max_f32: it starts from its first contribution, so having none is a fault'],
  ['custom_without_combiner', 'law unordered: a custom law names the operand of its combining function'],
  ['untyped', 'law sum_i64: it names its input, accumulator and result types'],
]) {
  const m = out.match(new RegExp(`INDEX law_${check} (.*)`))
  assert(m && m[1].startsWith('rejected:') && m[1].includes(reason), `${check}: ${m ? m[1] : 'missing'}`)
}
}
"""

[[tests]]
name = "core_test_pass_needs_the_environment"
desc = "test::index_semantics is a test-only pass: without CAMEL_ENABLE_TEST_PASSES it does not exist."
kind = "negative"
case = "../../../cases/consistency/values/max_min_special.cml"
args = ["${case}", "test::index_semantics"]
expect_exit = 1
expect_output_not_contains = ["INDEX "]

[[tests]]
name = "instances"
desc = "`camel inspect --instances` prints the instance of every operator node whose operator declares index semantics (runtime::instanceOf on the frozen graph: input types and static inputs). Shapes fixed by the types: matmul's (m, n, k) with k the reduction, fma_f32 and the K extents required equal; the broadcast bias reads (d1); transpose reads (d1, d0); a slice reads start + d0; reshape across axes linearizes and delinearizes; max with keepdims writes 0 on the reduced axis. An open extent is a parameter without a value; an unknown rank or two open extents that may broadcast give no instance (Q9). The sum in a function with @numeric(reassociate) may be regrouped and permuted, not without it; unordered_reduce's own Unordered law allows regrouping; max_pool2d excludes the window's elements outside the input."
kind = "behavior"
case = "../../../cases/modules/tensor/index_semantics.cml"
args = ["inspect", "--instances", "${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const rows = input.normalized.stdout.split('\n').filter((l) => l.startsWith('INSTANCE ')).map((l) => JSON.parse(l.slice(9)))
const find = (graph, uri) => rows.filter((r) => r.graph === graph && r.uri === uri)
const one = (graph, uri) => { const r = find(graph, uri); assert(r.length === 1, `${graph} ${uri}: ${r.length} nodes`); return r[0] }
const has = (r, line) => assert(r.instance && r.instance.includes(line), `${r.graph} ${r.uri}: missing '${line}' in ${JSON.stringify(r.instance)}`)
const mm = one('layers', 'tensor:matmul')
assert(mm.key === 'tensor:matmul@1.1', mm.key)
has(mm, 'domain   d0 < s0_0 parallel; d1 < s1_1 parallel; d2 < s0_1 reduction')
has(mm, 'where    s0_1 = s1_0')
has(mm, 'norm 0   (d0, d2)'); has(mm, 'norm 1   (d2, d1)')
has(mm, 'write    (d0, d1) combine law fma_f32')
has(one('layers', 'tensor:add'), 'norm 1   (d1)')
has(one('layers', 'tensor:transpose'), 'norm 0   (d1, d0)')
has(one('layers', 'tensor:slice'), 'norm 0   (start + d0, d1)')
has(one('layers', 'tensor:reshape'), 'norm 0   ((2*d0 + d1) floordiv 4, (2*d0 + d1) mod 4)')
has(one('layers', 'tensor:permute'), 'norm 0   (d1, d0)')
const mx = one('layers', 'tensor:max_axis')
has(mx, 'write    (d0, 0) combine law max_axis_f32')
assert(JSON.stringify(mx.freedom) === '["regroup","permute","block_identity"]', `max freedom ${JSON.stringify(mx.freedom)}`)
const sums = find('layers', 'tensor:sum')
assert(sums.length === 2 && sums.every((r) => JSON.stringify(r.freedom) === '[]'), 'a float sum without permissions may not be reordered')
has(one('rows', 'tensor:add'), 'params   s0_0 = extent(0, 0); s0_1 = extent(0, 1) = 3')
assert(one('open', 'tensor:add').instance === null, 'two open extents: no instance (Q9)')
assert(one('unknown', 'tensor:multiply').instance === null, 'unknown rank: no instance')
const rg = one('regrouped', 'tensor:sum_axis')
assert(rg.permissions === 'reassociate' && JSON.stringify(rg.freedom) === '["regroup","permute"]', `regrouped: ${rg.permissions} ${JSON.stringify(rg.freedom)}`)
const ur = one('main', ':mark/unordered_reduce_arr')
has(ur, 'write    () combine law unordered_reduce')
assert(JSON.stringify(ur.freedom) === '["regroup"]', `unordered_reduce freedom ${JSON.stringify(ur.freedom)}`)
has(one('pooled', 'nn:max_pool2d'), 'norm 0   (d0, d1, stride*d2 + d4 - pad, stride*d3 + d5 - pad) valid [0 <= stride*d2 + d4 - pad, stride*d2 + d4 - pad < s0_2, 0 <= stride*d3 + d5 - pad, stride*d3 + d5 - pad < s0_3] else excluded')
}
"""

[[tests]]
name = "declaration_evaluator"
desc = "tensor::test_index_eval (CAMEL_ENABLE_TEST_PASSES), the declaration evaluator of design section 12: for every declared tensor operator and nn's pooling, deterministic pseudo-random calls (empty, size-1 and broadcast axes, negative axes, absent optional arguments, NaN, infinities, signed zeros, subnormals, int64 and bool elements) are executed from the declaration alone (domain, access maps with their validity policies, write map, reduction law) and compared with the CPU kernel: the same bits (exp and log within their declared 2 ulp), or both faulting. Every map is checked for soundness on the way (reads in range, writes inside the result, a unique write written exactly once). The facts that give no instance are queried too: unknown rank, Q9 broadcasts, constants that are not constant, a slice step of 0, a slice bound out of range (a fault, design principles 2.10), mixed matmul dtypes."
kind = "behavior"
case = "../../../cases/modules/tensor/index_semantics.cml"
args = ["${case}", "tensor::test_index_eval"]
envs = ["CAMEL_ENABLE_TEST_PASSES=1"]
expect_exit = 0
timeout_ms = 60000
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const lines = out.split('\n')
assert(!out.includes('EVAL_MISMATCH'), lines.filter((l) => l.startsWith('EVAL_MISMATCH')).join(' | '))
const ops = lines.filter((l) => l.startsWith('EVAL op='))
assert(ops.length === 31, `${ops.length} operators evaluated`)
for (const l of ops) {
  const f = Object.fromEntries(l.slice(5).split(' ').map((kv) => kv.split('=')))
  assert(f.cases === f.agree && f.unsound === '0' && Number(f.cases) >= 40, `${f.op}: ${l}`)
}
const total = lines.find((l) => l.startsWith('EVAL total '))
assert(total, 'no total line')
const t = Object.fromEntries(total.slice(11).split(' ').map((kv) => kv.split('=')))
assert(t.operators === '31' && t.cases === t.agree && Number(t.cases) >= 2500 && Number(t.points) >= 30000, total)
assert(t.unsound === '0' && t.mismatches === '0' && t.undeclared === '0', total)
for (const [check, result] of [
  ['broadcast_unknown_both', 'none'], ['broadcast_unknown_vs_known', 'none'], ['show_broadcast_unknown_alone', 'instance'],
  ['show_broadcast_unknown_vs_one', 'instance'], ['unknown_rank', 'none'], ['show_relu_unknown_extents', 'instance'],
  ['sum_axis_axis_not_constant', 'none'], ['show_sum_axis_unknown_extents', 'instance'], ['permute_not_constant', 'none'],
  ['slice_unknown_extent', 'none'], ['show_slice', 'instance'], ['slice_out_of_range', 'none'], ['slice_step_zero', 'none'], ['reshape_unknown_input', 'none'],
  ['show_reshape', 'instance'], ['show_reshape_unit_axes', 'instance'], ['show_matmul_batched', 'instance'],
  ['matmul_batch_q9', 'none'], ['matmul_mixed_dtypes', 'none'], ['show_transpose', 'instance'], ['show_sum_to', 'instance'],
  ['show_max_pool2d', 'instance'], ['show_avg_pool2d_unknown_extents', 'instance'],
]) {
  assert(lines.includes(`QUERY ${check} ${result}`), `QUERY ${check} ${result}`)
}
for (const l of [
  'norm 1   (0, d1)',
  'norm 0   (d0, start + step*d1)',
  'norm 0   (d1, 0, d2)',
  'write    (d1, 0) combine law sum_to_f32',
  'oh = derived((s0_2 - kernel) floordiv kernel + 1)',
]) assert(out.includes(l), `missing: ${l}`)
}
"""

[[tests]]
name = "evaluator_needs_the_environment"
desc = "tensor::test_index_eval is a test-only pass: without CAMEL_ENABLE_TEST_PASSES the tensor module does not contribute it."
kind = "negative"
