[[tests]]
name = "graph_autograd_multi_param_gir"
desc = "Inspects the generated grad(mse_loss) graph: weight pullback via matmul_grad_rhs, broadcast bias reduced by sum_to, one sgd node in main."
kind = "behavior"
case = "../../../cases/modules/nn/graph_autograd_multi_param_demo.cml"
args = ["${case}", "std::macro", "std::gir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
assert(input.exit_code === 0, `camel exited ${input.exit_code}`)
const text = input.normalized.output
const bs = String.fromCharCode(92)
const ops = new Map()
for (const chunk of text.split('tooltip="').slice(1)) {
    const end = chunk.indexOf('::node#')
    if (end < 0) continue
    const parts = chunk.slice(0, end).split(bs + 'n')
    if (parts.length !== 2) continue
    const [op, graph] = parts
    if (!ops.has(graph)) ops.set(graph, new Map())
    ops.get(graph).set(op, (ops.get(graph).get(op) || 0) + 1)
}
const count = (graph, op) => (ops.get(graph) && ops.get(graph).get(op)) || 0
const has = (graph, op) => assert(count(graph, op) > 0, `expected ${op} in graph ${graph}`)
assert(ops.has('grad(mse_loss)'), 'GIR output missing the grad(mse_loss) graph')
has('grad(mse_loss)', 'tensor:matmul_grad_rhs')
has('grad(mse_loss)', 'tensor:sum_to')
assert(count('main', 'nn:sgd') === 1, `expected one nn:sgd call in main, got ${count('main', 'nn:sgd')}`)
}
"""
timeout_ms = 4000

