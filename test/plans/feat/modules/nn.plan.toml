[[tests]]
name = "embedding_grad_sanity"
desc = "Checks embedding table gradients accumulate repeated indices and leave unvisited rows zero."
kind = "behavior"
case = "../../../cases/modules/nn/embedding_grad_sanity.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert, approx, match }) => {
assert(input.exit_code === 0, `camel exited ${input.exit_code}`)
const found = match(/embedding_grad_sanity gathered_sum=([0-9.eE+-]+) row0=([0-9.eE+-]+) row1=([0-9.eE+-]+) row2=([0-9.eE+-]+)/, input.normalized.stdout)
const gathered = Number(found[1])
const row0 = Number(found[2])
const row1 = Number(found[3])
const row2 = Number(found[4])
assert(Number.isFinite(gathered) && Number.isFinite(row0) && Number.isFinite(row1) && Number.isFinite(row2), 'metrics are not finite')
assert(approx(gathered, 2.5, 1e-6), `unexpected gathered sum ${gathered}`)
assert(approx(row0, 0.0, 1e-6), `unvisited row should have zero grad, got ${row0}`)
assert(approx(row1, 7.0, 1e-6), `repeated row grad should accumulate to 7, got ${row1}`)
assert(approx(row2, 9.0, 1e-6), `single visited row grad should be 9, got ${row2}`)
}
"""
timeout_ms = 4000

