const bs = String.fromCharCode(92)
const ops = new Map()
for (const chunk of text.split('tooltip="').slice(1)) {
    const end = chunk.indexOf('::node#')
    if (end < 0) continue
    const parts = chunk.slice(0, end).split(bs + 'n')
