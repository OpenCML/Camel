[[tests]]
name = "with_context_step_demo"
desc = "Trains a with-context Linear model: value_and_grad through a with-context helper, then one functional sgd step."
kind = "behavior"
case = "../../../cases/modules/nn/with_context_step_demo.cml"
args = ["${case}", "std::macro", "std::nvm"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert, approx, match }) => {
assert(input.exit_code === 0, `camel exited ${input.exit_code}`)
const out = input.normalized.stdout
const found = match(/with_context_step_demo metrics before=([0-9.eE+-]+) step=([0-9.eE+-]+) after=([0-9.eE+-]+)/, out)
const [before, step, after] = found.slice(1, 4).map(Number)
assert([before, step, after].every(Number.isFinite), 'metrics are not finite')
assert(before > 0, `expected positive initial loss, got ${before}`)
assert(approx(step, before, 1e-9), `value_and_grad loss ${step} should equal pre-update loss ${before}`)
assert(after < before, `expected one sgd step to lower the loss: before=${before}, after=${after}`)
match(/with_context_step_demo weight=tensor/, out)
match(/with_context_step_demo grad=tensor/, out)
const nums = (line) => (line.match(/-?[0-9]+[.]?[0-9]*(e[-+]?[0-9]+)?/g) || []).map(Number)
const gradValues = nums(match(/with_context_step_demo grad=(.*)/, out)[1])
assert(approx(gradValues[0], -2, 1e-6), `expected d(loss)/d(weight[0]) = -2, got ${gradValues[0]}`)
}
"""
timeout_ms = 4000

