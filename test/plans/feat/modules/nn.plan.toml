[[tests]]
name = "graph_autograd_multi_param_gir"
desc = "Inspects std::gir output for two parameter updates from one loss graph."
kind = "behavior"
case = "../../../cases/modules/nn/graph_autograd_multi_param_demo.cml"
args = ["${case}", "std::macro", "std::gir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
assert(input.exit_code === 0, `camel exited ${input.exit_code}`)
const text = input.normalized.output
assert(text.includes('nn::autograd_sgd_step'), 'GIR output missing autograd step graph')
assert((text.match(/nn:add_grad/g) || []).length >= 2, 'expected at least two nn:add_grad nodes')
assert((text.match(/nn:sgd/g) || []).length >= 2, 'expected at least two nn:sgd nodes')
}
"""
timeout_ms = 4000

