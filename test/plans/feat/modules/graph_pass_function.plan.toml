id = "modules.graph_pass_function"
order = 929
tier = "fast"
tags = ["feat", "modules", "graph", "pass"]
desc = "A pass written in Camel is a function transform (f: F) => F! (design principles 9.1): the pipeline offers it the root function of the program and goes on with the function it hands back; the snapshot of the program is not on the interface."

[defaults]
kind = "behavior"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 20000

[[tests]]
name = "pass_over_function_keeps_the_program"
desc = "A generic identity pass runs on the root function and the pipeline goes on: the program runs as before."
case = "../../../cases/modules/graph_pass/tiny.cml"
args = ["${case}", "over_function::keep", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "42\n"

[[tests]]
name = "pass_over_function_error_stops_the_pipeline"
desc = "A pass over a function that returns an error value stops the pipeline there, as any pass does."
kind = "negative"
case = "../../../cases/modules/graph_pass/tiny.cml"
args = ["${case}", "over_function::refuse", "std::nvm"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::UnhandledError"
expect_output_not_contains = ["42"]

[[tests]]
name = "commit_refuses_an_arm_reading_its_join"
desc = "An edit that makes an arm's node the value a node after the branch reads: `replace` rewires every user of `x + 1` to the arm's `x * 7`, so the node that ran after the branch now runs in arm 0 and reads the JOIN, which runs after every arm. `commit` refuses it as `GraphInvalid` and names both nodes, the BRCH and the arm; the cycle the back end used to report (`Cycle detected while building runtime execution topo`) never happens, because the graph is judged at the commit that made it (design principles 1.2, invariants 1 and 3)."
kind = "negative"
case = "../../../cases/modules/graph_pass/arm_join_target.cml"
args = ["${case}", "cross_arm::move", "std::nvm"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::UnhandledError"
expect_output_contains = ["GraphInvalid", "breaks the branch-arm invariant", "runs in arm 0 of BRCH", "reads its JOIN"]
expect_output_not_contains = ["Cycle detected"]
