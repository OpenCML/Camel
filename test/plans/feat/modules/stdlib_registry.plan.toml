id = "modules.stdlib_registry"
order = 371
tier = "fast"
tags = ["feat", "modules", "stdlib", "registry", "purity"]
desc = "What the modules of this repository register: every operator declares whether it is pure, and the signature files list exactly the operators that exist"

# `camel inspect --ops` lists every operator of the built-in module and of the modules a
# program imports: name, URI, parameter counts, declared purity and signature.

[[tests]]
name = "registry.purity_declared"
desc = "No operator of a module of this repository is left without a purity declaration (design principles 3.3), and the ones that read a clock, a random generator, the environment or a file are not declared pure."
kind = "behavior"
case = "../../../cases/modules/stdlib/registry_all.cml"
args = ["inspect", "--ops", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines"]
verify_script = """
({ input, assert }) => {
const ops = input.normalized.stdout.split('\n').filter((l) => l.startsWith('OPERATOR ')).map((l) => JSON.parse(l.slice(9)))
assert(ops.length > 300, `only ${ops.length} operators listed`)
const modules = new Set(ops.map((o) => o.module))
for (const m of ['<builtin>', 'algo', 'hash', 'fs', 'io', 'json', 'math', 'process', 'para', 'random', 're', 'sim', 'statistics', 'str', 'env', 'this', 'time']) {
  assert(modules.has(m), `module ${m} is not listed`)
}
const undeclared = ops.filter((o) => o.purity === 'undeclared').map((o) => o.uri)
assert(undeclared.length === 0, `operators without a purity declaration: ${undeclared.join(', ')}`)
const purity = Object.fromEntries(ops.map((o) => [o.uri, o.purity]))
const notPure = ['time:now', 'time:strftime', 'time:strptime', 'rand:rand', 'rand:seed', 'rand:shuffle', 'rand:choice', 'env:get_env', 'env:get_cwd',
  'fs:read_text', 'fs:try_read_text', 'fs:exists', 'fs:file_size', 'fs:write_text', 'process:whoami', 'process:cpu_count', 'process:sleep', 'process:exit',
  'io:set_terminal_raw_mode', 'io:has_input', 'io:get_char', 'io:get_chars', 'io:clear_input_buffer',
  ':io/print', ':io/println', ':io/input', ':op/assn', ':op/assn_owned', 'para:rendezvous',
  ':mark/map_arr', ':mark/foreach_arr']
for (const uri of notPure) {
  assert(purity[uri] === 'effectful', `${uri} is declared ${purity[uri]}, expected effectful`)
}
const pure = ['str:split', 'str:codepoints', 'math:sin_d', 'math:shl', 'statistics:median', 'algo:sort', 'algo:argsort',
  're:test', 'json:encode', 'json:decode', 'hash:sha256_str', 'hash:sha256_bytes', 'this:zen', ':op/add_l', ':op/idx_str', ':struct/slice_arr', ':str/format',
  // They return a new array and leave their argument unchanged (design principles 11.3).
  ':struct/append_arr', ':struct/extend_arr', 'algo:sort', 'algo:quick_sort', 'algo:insert_sort', 'algo:merge_sort']
for (const uri of pure) {
  assert(purity[uri] === 'pure', `${uri} is declared ${purity[uri]}, expected pure`)
}
assert(purity[':var/new'] === 'state' && purity[':var/get'] === 'state', 'var/new and var/get touch only the variables of the program')
}
"""
timeout_ms = 20000

[[tests]]
name = "registry.purity_declared_tensor_stack"
desc = "The same for nn, tensor, autodiff and onnx."
kind = "behavior"
case = "../../../cases/modules/stdlib/registry_tensor.cml"
args = ["inspect", "--ops", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines"]
verify_script = """
({ input, assert }) => {
const ops = input.normalized.stdout.split('\n').filter((l) => l.startsWith('OPERATOR ')).map((l) => JSON.parse(l.slice(9)))
const modules = new Set(ops.map((o) => o.module))
for (const m of ['nn', 'tensor', 'autodiff', 'onnx']) {
  assert(modules.has(m), `module ${m} is not listed`)
}
const undeclared = ops.filter((o) => o.purity === 'undeclared').map((o) => o.uri)
assert(undeclared.length === 0, `operators without a purity declaration: ${undeclared.join(', ')}`)
}
"""
timeout_ms = 20000

[[tests]]
name = "registry.signatures_match"
desc = "The declaration files (stdlib/*.cml and stdlib/signatures/*.cml) list exactly the operators the modules register: every registered operator is declared, every declaration names a registered operator, the parameter counts agree, @pure / @effect is the declared purity, and no signature-file declaration carries a body."
kind = "behavior"
tool = "node"
case = "../../../../scripts/stdlib-reference.mjs"
args = ["${case}", "--verify-ops"]
expect_exit = 0
expect_stdout_contains = ["the declarations agree with the"]
normalizers = ["normalize_newlines"]
timeout_ms = 30000

[[tests]]
name = "registry.migrations_stay_migrated"
desc = "A module that has moved to a declaration module stays migrated: C++ has no StaticFuncTypeResolver for a name the declaration fixes, no stray stdlib/signatures/<module>.cml survives unless the reference generator names it in computed:, every declaration is behind a registered operator (--verify-ops, reused), the C++ export groups are the declaration's plus the computed signatures, and a computed name has exactly one recorded place (its computed: signature file, never an inline // dynamic func; handover H180)."
kind = "behavior"
tool = "node"
case = "../../../../scripts/stdlib-declarations.mjs"
args = ["${case}", "--check"]
expect_exit = 0
expect_stdout_contains = ["migrated modules stay migrated"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000

# ---- A declaration file that failed to load is an error, not a shorter list (H172) ----

# `inspect --ops` is the tool people use to check what the modules register. A declaration module
# that exists and does not load leaves its operators out of the listing; before H172 the tool
# printed the rest and exited 0 (that is how H166 found its seven names only by counting them).
# The case makes the declaration module in its scratch directory out of a real `.cmo` and points
# `CAMEL_STD_LIB` at it.

[[tests]]
name = "registry.declaration_load_failure_is_an_error"
desc = "`camel inspect --ops` exits 1 and reports on stderr, with a line naming the module and its declaration file, when a declaration module a program imports fails to load; it prints no operator listing it cannot vouch for. A module that is not imported is not an error, and the module's real declaration still lists with the same `CAMEL_STD_LIB`."
kind = "behavior"
tool = "node"
case = "../../../cases/tools/inspect/declaration_load_failure.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["PASS"]
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 120000

[[tests]]
name = "registry.reference_is_generated"
desc = "docs/stdlib-reference.md is what scripts/stdlib-reference.mjs --write produces from the signature files and the library sources: it is generated, not edited."
kind = "behavior"
tool = "node"
case = "../../../../scripts/stdlib-reference.mjs"
args = ["${case}", "--verify-doc"]
expect_exit = 0
expect_stdout_contains = ["docs/stdlib-reference.md is up to date"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000
