}
"""
timeout_ms = 20000

[[tests]]
name = "registry.signatures_match"
desc = "The declaration files (stdlib/*.cml and stdlib/signatures/*.cml) list exactly the operators the modules register: every registered operator is declared, every declaration names a registered operator, the parameter counts agree, @pure / @effect is the declared purity, and no signature-file declaration carries a body."
kind = "behavior"
tool = "node"
case = "../../../../scripts/stdlib-reference.mjs"
# `${camel}` is the compiler of the build under test, named as an argument.
args = ["${case}", "--verify-ops", "--camel", "${camel}"]
expect_exit = 0
expect_stdout_contains = ["the declarations agree with the"]
normalizers = ["normalize_newlines"]
timeout_ms = 30000

# A position that means the same thing carries the same name in every rule of a name: that is what
# a named argument binds to (`len(x: xs)`), and it is why `stdlib/json.cml` and
# `stdlib/signatures/globals.cml` rename a position. The declaration files and the rules C++
# registers are two places a rule's names are written; `registry.signatures_match` compares their
# parameters and names position by position, and this compares the names within one name's rules,
# so the two cannot drift apart again. Two sets are the counter-examples the reference page states:
# `contains`, whose first position means an element in one form and a substring in another, and
# `py_call`, whose parameter count follows the arguments.
[[tests]]
name = "registry.overload_position_names_agree"
desc = "One position, one name: `json.get`'s with-parameter is `key` in every one of its eight declarations and in `:coll/map_get` (a string argument is a member key, an integer one an element index), `len`'s one parameter is `x` in the string, array, map and set rules, `items`' is `m` in the map and set rules, and `json.as_int`'s ordinary parameter is `j` in all four. These are the names the reference page declares for them, and every rule of each such set names the position -- a rule that gives no name would take no named argument silently. `contains` and `py_call` are not such sets: `contains` names its first position `value` in the collection forms and `sub` in the string form, and `py_call`'s parameter count follows its arguments (two forms that differ in arity), so neither takes a named argument, as the reference page states."
kind = "behavior"
case = "../../../cases/modules/stdlib/registry_all.cml"
args = ["inspect", "--ops", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines"]
verify_script = """
({ input, assert }) => {
const ops = input.normalized.stdout.split('\n').filter((l) => l.startsWith('OPERATOR ')).map((l) => JSON.parse(l.slice(9)))
// Every `name:` in a signature is a parameter's name, the with-parameters before the ordinary
// ones, and the index of the position tells which is which.
const names = (o) => [...o.signature.matchAll(/([A-Za-z_][A-Za-z0-9_]*)\s*:/g)].map((m) => m[1])
const oneNamePerSet = (what, rules, position, expected) => {
  assert(rules.length > 1, `${what}: ${rules.length} rule(s) listed, expected the rules of an overload set`)
  for (const o of rules) {
    const at = names(o)
    assert(at.length > position, `${what} ${o.signature}: no parameter at position ${position}`)
    assert(at[position] === expected,
      `${what} ${o.signature}: the parameter at position ${position} is '${at[position]}', and every rule of the set must call it '${expected}'`)
  }
}
oneNamePerSet('json.get', ops.filter((o) => o.uri === 'json:get'), 0, 'key')
oneNamePerSet('get', ops.filter((o) => o.name === 'get'), 0, 'key')
oneNamePerSet('json.as_int', ops.filter((o) => o.uri === 'json:as_int'), 0, 'j')
oneNamePerSet('len', ops.filter((o) => o.name === 'len'), 0, 'x')
oneNamePerSet('items', ops.filter((o) => o.name === 'items'), 0, 'm')
// `contains` is the set the reference page says takes no named argument: every rule names its
// first position, but they do not agree on the name -- an element (`value`) in the two collection
// forms, the substring (`sub`) in the string form. A rule that gave the position no name at all is
// the other state this rules out: it would bind no name while looking like it agreed.
const contains = ops.filter((o) => o.name === 'contains').map((o) => names(o)[0])
assert(contains.length > 1, `contains: only ${contains.length} rule(s) listed`)
assert(contains.every((n) => n !== undefined),
  `every rule of contains must name its first position: ${contains.join(', ')}`)
assert(contains.includes('value') && contains.includes('sub'),
  `contains names its first position 'value' in the collection forms and 'sub' in the string form: ${contains.join(', ')}`)
assert(new Set(contains).size > 1, `contains would take a named argument if its rules agreed: ${contains.join(', ')}`)
// `py_call` is the other set the page says takes no named argument, for the other reason: its
// parameter count follows the arguments (a rest list), so no position is a parameter a name could
// mark, and the two forms of the name differ in arity.
const pyCall = ops.filter((o) => o.name === 'py_call')
assert(pyCall.length === 2, `py_call: ${pyCall.length} rule(s) listed`)
assert(pyCall.every((o) => o.norm === -1),
  `py_call's parameters follow its arguments: ${pyCall.map((o) => o.norm).join(', ')}`)
assert(pyCall[0].signature !== pyCall[1].signature,
  `the two forms of py_call differ in arity: ${pyCall.map((o) => o.signature).join(' | ')}`)
}
"""
timeout_ms = 20000

[[tests]]
name = "registry.docs_complete"
desc = "Every name the reference prints has a description and an @example, every example compiles as a call of its declaration (its arguments bound to the declared parameter types, the types it mentions imported), a fallible result has an @fails line naming the error, and an example the checker cannot compile says why with @example-fragment <reason>."
kind = "behavior"
tool = "node"
case = "../../../../scripts/stdlib-reference.mjs"
args = ["${case}", "--verify-docs", "--camel", "${camel}"]
expect_exit = 0
expect_stdout_contains = ["every declared name has a description and an @example"]
normalizers = ["normalize_newlines"]
timeout_ms = 120000

[[tests]]
name = "registry.migrations_stay_migrated"
desc = "A module that has moved to a declaration module stays migrated: C++ has no StaticFuncTypeResolver for a name the declaration fixes, no stray stdlib/signatures/<module>.cml survives unless the reference generator names it in computed:, every declaration is behind a registered operator (--verify-ops, reused), the C++ export groups are the declaration's plus the computed signatures, and a computed name has exactly one recorded place (its computed: signature file, never an inline // dynamic func; handover H180)."
kind = "behavior"
tool = "node"
case = "../../../../scripts/stdlib-declarations.mjs"
args = ["${case}", "--check"]
expect_exit = 0
expect_stdout_contains = ["migrated modules stay migrated"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000

# ---- A declaration file that failed to load is an error, not a shorter list ----

# `inspect --ops` is the tool people use to check what the modules register. A declaration module
# that exists and does not load leaves its operators out of the listing; before the tool printed
# the rest and exited 0 (that is how found its seven names only by counting them). The case makes
# the declaration module in its scratch directory out of a real `.cmo` and points `CAMEL_STD_LIB`
# at it.

[[tests]]
name = "registry.declaration_load_failure_is_an_error"
desc = "`camel inspect --ops` exits 1 and reports on stderr, with a line naming the module and its declaration file, when a declaration module a program imports fails to load; it prints no operator listing it cannot vouch for. A module that is not imported is not an error, and the module's real declaration still lists with the same `CAMEL_STD_LIB`."
kind = "behavior"
tool = "node"
case = "../../../cases/tools/inspect/declaration_load_failure.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["PASS"]
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 120000

[[tests]]
name = "registry.reference_is_generated"
desc = "docs/stdlib-reference.md is what scripts/stdlib-reference.mjs --write produces from the signature files and the library sources: it is generated, not edited."
kind = "behavior"
tool = "node"
case = "../../../../scripts/stdlib-reference.mjs"
args = ["${case}", "--verify-doc"]
expect_exit = 0
expect_stdout_contains = ["docs/stdlib-reference.md is up to date"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000

# `import algo` is gone and the operators are `array:`'s. The inspection above catches an
# `algo:` URI that a program imports; this scan catches one that nothing imports yet, and the
# return of the files the module was made of. `docs/` is a record and is not scanned.
[[tests]]
name = "registry.algo_module_gone"
desc = "No source, test, example or benchmark names an `algo:` operator or imports `algo`, and neither `stdlib/algo.cml` nor `modules/algo/` exists: the module was folded into `array` and cannot come back alongside its operators."
kind = "behavior"
tool = "node"
case = "../../../tools/check-no-algo.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["PASS no algo module"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000
