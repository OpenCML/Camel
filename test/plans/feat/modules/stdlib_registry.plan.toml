id = "modules.stdlib_registry"
order = 371
tier = "feat"
tags = ["feat", "modules", "stdlib", "registry", "purity"]
desc = "What the modules of this repository register: every operator declares whether it is pure, and the signature files list exactly the operators that exist"

# `camel inspect --ops` lists every operator of the built-in module and of the modules a
# program imports: name, URI, parameter counts, declared purity and signature.

[[tests]]
name = "registry.purity_declared"
desc = "No operator of a module of this repository is left without a purity declaration (design principles 2.9), and the ones that read a clock, a random generator, the environment or a file are not declared pure."
kind = "behavior"
case = "../../../cases/modules/stdlib/registry_all.cml"
args = ["inspect", "--ops", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines"]
verify_script = """
({ input, assert }) => {
const ops = input.normalized.stdout.split('\n').filter((l) => l.startsWith('OPERATOR ')).map((l) => JSON.parse(l.slice(9)))
assert(ops.length > 300, `only ${ops.length} operators listed`)
const modules = new Set(ops.map((o) => o.module))
for (const m of ['<builtin>', 'algo', 'crypto', 'fs', 'json', 'math', 'os', 'para', 'random', 're', 'sim', 'statistics', 'str', 'sys', 'this', 'time']) {
  assert(modules.has(m), `module ${m} is not listed`)
}
const undeclared = ops.filter((o) => o.purity === 'undeclared').map((o) => o.uri)
assert(undeclared.length === 0, `operators without a purity declaration: ${undeclared.join(', ')}`)
const purity = Object.fromEntries(ops.map((o) => [o.uri, o.purity]))
const notPure = ['time:now', 'time:strftime', 'time:strptime', 'rand:rand', 'rand:seed', 'rand:shuffle', 'rand:choice', 'sys:get_env', 'sys:get_cwd',
  'fs:read_text', 'fs:try_read_text', 'fs:exists', 'fs:file_size', 'fs:write_text', 'os:whoami', 'os:cpu_count', 'os:sleep', 'os:exit',
  ':io/print', ':io/println', ':io/input', ':op/assn', ':struct/append_arr', ':struct/extend_arr', 'algo:sort', 'para:rendezvous',
  ':mark/map_arr', ':mark/foreach_arr']
for (const uri of notPure) {
  assert(purity[uri] === 'effectful', `${uri} is declared ${purity[uri]}, expected effectful`)
}
const pure = ['str:split', 'str:codepoints', 'math:sin_d', 'math:shl', 'math:pi', 'statistics:median', 'algo:sorted', 'algo:argsort',
  're:test', 'json:encode', 'json:decode', 'crypto:sha256', 'this:zen', ':op/add_l', ':op/idx_str', ':struct/slice_arr', ':str/format']
for (const uri of pure) {
  assert(purity[uri] === 'pure', `${uri} is declared ${purity[uri]}, expected pure`)
}
assert(purity[':var/new'] === 'state' && purity[':var/get'] === 'state', 'var/new and var/get touch only the variables of the program')
}
"""
timeout_ms = 20000

[[tests]]
name = "registry.purity_declared_tensor_stack"
desc = "The same for nn, tensor, autodiff and onnx."
kind = "behavior"
case = "../../../cases/modules/stdlib/registry_tensor.cml"
args = ["inspect", "--ops", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines"]
verify_script = """
({ input, assert }) => {
const ops = input.normalized.stdout.split('\n').filter((l) => l.startsWith('OPERATOR ')).map((l) => JSON.parse(l.slice(9)))
const modules = new Set(ops.map((o) => o.module))
for (const m of ['nn', 'tensor', 'autodiff', 'onnx']) {
  assert(modules.has(m), `module ${m} is not listed`)
}
const undeclared = ops.filter((o) => o.purity === 'undeclared').map((o) => o.uri)
assert(undeclared.length === 0, `operators without a purity declaration: ${undeclared.join(', ')}`)
}
"""
timeout_ms = 20000
