[[tests]]
name = "registry.signatures_match"
desc = "The declaration files (stdlib/*.cml and stdlib/signatures/*.cml) list exactly the operators the modules register: every registered operator is declared, every declaration names a registered operator, the parameter counts agree, @pure / @effect is the declared purity, and no signature-file declaration carries a body."
kind = "behavior"
tool = "node"
case = "../../../../scripts/stdlib-reference.mjs"
# `${camel}` is the compiler of the build under test, named as an argument.
args = ["${case}", "--verify-ops", "--camel", "${camel}"]
expect_exit = 0
expect_stdout_contains = ["the declarations agree with the"]
normalizers = ["normalize_newlines"]
timeout_ms = 30000

# A declaration states the type its call gives back, and the operator states its own in the
# signature it registers; `--verify-ops` compares the two, so a declaration cannot promise a type
# the operator does not return. Nothing compared them before: `one_hot` was declared `int64[...]`
# for months while its kernel, its inference and every test returned f32 rows, and the reference
# run stayed green because only names, arity, parameter names and purity were read. The run names
# both halves -- how many result types it compared and which operators it could not compare -- and
# this test fails if the comparison reports none, or if it has quietly widened into all-but-a-few.
[[tests]]
name = "registry.result_types_match"
desc = "Every operator's declared result type is the one the operator registers (types compared through the compiler's own spellings, not through the text), and the operators whose result type cannot be compared -- a type variable, a named type, a sentence, or an element type taken from an argument -- are named with what each side says."
kind = "behavior"
tool = "node"
case = "../../../../scripts/stdlib-reference.mjs"
args = ["${case}", "--verify-ops", "--camel", "${camel}"]
expect_exit = 0
expect_stdout_contains = ["the declared result type agrees with the operator's own for"]
normalizers = ["normalize_newlines"]
verify_script = """
({ input, assert }) => {
const stdout = input.normalized.stdout
const compared = /the declared result type agrees with the operator's own for ([0-9]+) of them/.exec(stdout)
assert(compared !== null, 'the run did not say how many result types it compared')
const comparedCount = compared === null ? 0 : Number(compared[1])
// The number moves with the library; the floor is what keeps "compared nothing, or compared
// almost nothing" from passing as agreement. 517 of 558 overloads are compared today. The exact
// count of each exception class is not here: EXCEPTIONS in the script holds it, and the run
// refuses a class it does not record.
assert(comparedCount > 400, `only ${comparedCount} operator(s) had their result type compared`)
const excused = /the declared result type was not compared for ([0-9]+) operator[(]s[)]/.exec(stdout)
const excusedCount = excused === null ? 0 : Number(excused[1])
assert(excusedCount < 60, `${excusedCount} operators have a result type the two sides cannot compare`)
// Every overload is either compared or named, the same invariant the parameter half asserts.
const checked = /the declarations agree with the ([0-9]+) registered operator overloads/.exec(stdout)
if (checked !== null && comparedCount < Number(checked[1])) {
    assert(excused !== null, `${Number(checked[1]) - comparedCount} overload(s) were neither compared nor named`)
}
}
"""
timeout_ms = 30000

# The other half of the same signature: what the operator says it takes, position by position,
# against what the declaration promises. The operator's side is ten kinds (`Tensor` is any tensor,
# `int[]` a number array, `float[...] | number` a tensor or a number) and the declaration's is one
# type, so the comparison is containment -- a declaration may narrow a kind, never promise a value
# the operator refuses. `one_hot`'s neighbour: the same run that never read a result type never read
# a parameter type either, so `axis: int` could have been written `axis: float` for months.
[[tests]]
name = "registry.parameter_types_match"
desc = "Every operator's declared parameter types are ones the operator takes, position by position, kind by kind: an `int` array fits a `number` array and an `int` fits a `number`, a tensor does not fit an array, and the parameters that cannot be compared -- a function type, a module's own type, a nameless pack, a bare type variable -- are named with the piece that stopped it."
kind = "behavior"
tool = "node"
case = "../../../../scripts/stdlib-reference.mjs"
args = ["${case}", "--verify-ops", "--camel", "${camel}"]
expect_exit = 0
expect_stdout_contains = ["the declared parameter types fit what the operator takes for"]
normalizers = ["normalize_newlines"]
verify_script = """
({ input, assert }) => {
const stdout = input.normalized.stdout
const compared = /the declared parameter types fit what the operator takes for ([0-9]+) of them/.exec(stdout)
assert(compared !== null, 'the run did not say how many parameter lists it compared')
const comparedCount = compared === null ? 0 : Number(compared[1])
// 524 of 558 overloads are compared today. The floor keeps "compared nothing, or compared almost
// nothing" from passing as agreement, the same floor the result half carries.
assert(comparedCount > 400, `only ${comparedCount} operator(s) had their parameter types compared`)
// The classes and their counts are `EXCEPTIONS.parameter` in the script, which the run itself
// checks: a stop with no class, a class it does not hold or a class whose count moved fails there.
// Here the ceiling is all that is asserted, so the two places cannot disagree about a number.
const excused = /the declared parameter types was not compared for ([0-9]+) operator[(]s[)]/.exec(stdout)
const excusedCount = excused === null ? 0 : Number(excused[1])
assert(excusedCount < 60, `${excusedCount} operators have parameter types the two sides cannot compare`)
// Every overload is either compared or named: a run that compared fewer lists than it checked and
// said nothing about the rest has skipped silently, which is the hole this half closes.
const checked = /the declarations agree with the ([0-9]+) registered operator overloads/.exec(stdout)
if (checked !== null && comparedCount < Number(checked[1])) {
    assert(excused !== null, `${Number(checked[1]) - comparedCount} overload(s) were neither compared nor named`)
}
// The run prints the totals it compared its own exception lists with: a class that took an entry the
// table does not hold (an operator a merge brings in, say) has to appear in that number, so the line
// is what a green run is read from.
assert(/the exception lists are the ones EXCEPTIONS records: result [0-9]+ in [0-9]+ class[(]es[)], parameter [0-9]+ in [0-9]+ class[(]es[)]/.test(stdout),
    'the run did not print the totals it compared its own exception lists with')
}
"""
timeout_ms = 30000

# A position that means the same thing carries the same name in every rule of a name: that is what
# a named argument binds to (`len(x: xs)`), and it is why `stdlib/json.cml` and
# `stdlib/prelude.cml` rename a position. The declaration files and the rules C++
# registers are two places a rule's names are written; `registry.signatures_match` compares their
# parameters and names position by position, and this compares the names within one name's rules,
# so the two cannot drift apart again. Two sets are the counter-examples the reference page states:
# `contains`, whose first position means an element in one form and a substring in another, and
# `println`, whose parameter count follows the arguments.
[[tests]]
name = "registry.overload_position_names_agree"
desc = "One position, one name: `json.get`'s with-parameter is `key` in every one of its eight declarations and in `:coll/map_get` (a string argument is a member key, an integer one an element index), `len`'s one parameter is `x` in the string, array, map and set rules, `items`' is `m` in the map and set rules, and `json.as_int`'s ordinary parameter is `j` in all four. These are the names the reference page declares for them, and every rule of each such set names the position -- a rule that gives no name would take no named argument silently. `contains` and `py_call` are not such sets: `contains` names its first position `value` in the collection forms and `sub` in the string form, and `py_call`'s parameter count follows its arguments (two forms that differ in arity), so neither takes a named argument, as the reference page states."
kind = "behavior"
case = "../../../cases/modules/stdlib/registry_all.cml"
args = ["inspect", "--ops", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines"]
verify_script = """
({ input, assert }) => {
const ops = input.normalized.stdout.split('\n').filter((l) => l.startsWith('OPERATOR ')).map((l) => JSON.parse(l.slice(9)))
// Every `name:` in a signature is a parameter's name, the with-parameters before the ordinary
// ones, and the index of the position tells which is which.
const names = (o) => [...o.signature.matchAll(/([A-Za-z_][A-Za-z0-9_]*)\s*:/g)].map((m) => m[1])
const oneNamePerSet = (what, rules, position, expected) => {
  assert(rules.length >= 1, `${what}: no rule listed`)
  for (const o of rules) {
    const at = names(o)
    assert(at.length > position, `${what} ${o.signature}: no parameter at position ${position}`)
    assert(at[position] === expected,
      `${what} ${o.signature}: the parameter at position ${position} is '${at[position]}', and every rule of the set must call it '${expected}'`)
  }
}
oneNamePerSet('json.get', ops.filter((o) => o.uri === 'json:get'), 0, 'key')
oneNamePerSet('get', ops.filter((o) => o.name === 'get'), 0, 'key')
oneNamePerSet('json.as_int', ops.filter((o) => o.uri === 'json:as_int'), 0, 'j')
oneNamePerSet('len', ops.filter((o) => o.name === 'len'), 0, 'x')
oneNamePerSet('items', ops.filter((o) => o.name === 'items'), 0, 'm')
// A name with a declaration takes its parameters' names from it, whatever its signature is: the
// two declarations of `with_probe` (a generic one and a fixed one, each with defaults) and the one
// rule of the second alone name their positions as the declaration of stdlib/test_support.cml does.
oneNamePerSet('with_probe base', ops.filter((o) => o.name === 'with_probe'), 0, 'base')
oneNamePerSet('with_probe step', ops.filter((o) => o.name === 'with_probe'), 1, 'step')
oneNamePerSet('with_probe mode', ops.filter((o) => o.name === 'with_probe'), 2, 'mode')
oneNamePerSet('with_probe_array', ops.filter((o) => o.uri === 'test_support:with_probe_array'), 1, 'step')
// `contains` is the set the reference page says takes no named argument: every rule names its
// first position, but they do not agree on the name -- an element (`value`) in the two collection
// forms, the substring (`sub`) in the string form. A rule that gave the position no name at all is
// the other state this rules out: it would bind no name while looking like it agreed.
const contains = ops.filter((o) => o.name === 'contains').map((o) => names(o)[0])
assert(contains.length > 1, `contains: only ${contains.length} rule(s) listed`)
assert(contains.every((n) => n !== undefined),
  `every rule of contains must name its first position: ${contains.join(', ')}`)
assert(contains.includes('value') && contains.includes('sub'),
  `contains names its first position 'value' in the collection forms and 'sub' in the string form: ${contains.join(', ')}`)
assert(new Set(contains).size > 1, `contains would take a named argument if its rules agreed: ${contains.join(', ')}`)
// `println` is the other set the page says takes no named argument, for the other reason: its
// parameter count follows the arguments (a rest list), so no position is a parameter a name could
// mark.
const printing = ops.filter((o) => o.name === 'println')
assert(printing.length >= 1, `println: ${printing.length} rule(s) listed`)
assert(printing.every((o) => o.norm === -1 || o.norm === 0),
  `println's parameters follow its arguments: ${printing.map((o) => o.norm).join(', ')}`)
}
"""
timeout_ms = 20000

# Every example of every module is compiled -- the ones the page presents and the ones a
# `@example-fragment` marker calls "not compiled" -- and the run prints how many it wrote, how many
# of them are a program of their own, how many compile and how many do not, with the last group
# counted by the kind of diagnostic that stopped it. An example that is neither compiled nor counted
# is the skip this closes, so the test fails when the numbers do not add up as well as when a name
# has no description or no example.
[[tests]]
name = "registry.docs_complete"
desc = "Every name the reference prints has a description and an @example, every example compiles as a call of its declaration (its arguments bound to the declared parameter types, the types it mentions imported), a fallible result has an @fails line naming the error, and an example the checker cannot compile says why with @example-fragment <reason> -- and that marker is tried, not trusted: every marked example is compiled too, so a marker on an example that compiles with nothing bound (it is a program of its own) is counted and named, as is an example that does not compile, and a marker that is right has to give the name the example is missing."
kind = "behavior"
tool = "node"
case = "../../../../scripts/stdlib-reference.mjs"
args = ["${case}", "--verify-docs", "--camel", "${camel}"]
expect_exit = 0
expect_stdout_contains = ["every declared name has a description and an @example"]
normalizers = ["normalize_newlines"]
# The bound moved with the work, and the two readings below are why (both on `88zjwei`, the same
# tree, `--verify-docs --camel out/latest/bin/camel`):
#
#   * at 180000 ms, tip `ffa27bba1`, 2026-11-04 04:39 +08:00, 1m load 16.5: `used 47750 ms of CPU
#     against a 180000 ms timeout, below the 4x margin` -- 47750 > 180000/4 = 45000, so the bound
#     was the red, and the verdict itself passed (`every declared name has a description and an
#     @example: 574 example(s) checked, 65 entry(ies) marked a fragment were compiled too`, exit 0).
#   * at 240000 ms, tip `b8d944be9`, 2026-11-04 05:19 +08:00, 1m load 30.3: `User time 26.67 s +
#     System time 20.35 s = 47.02 s of CPU` (wall 19.95 s, 235% of a core), against 240000/4 =
#     60000 ms -- 12.98 s of margin, and the same two verdict lines: `575 example(s) checked, 65
#     entry(ies) marked a fragment were compiled too` and `the example counts are the ones the
#     script records: 24 that do not compile in 1 class(es), 0 marked a fragment that compile
#     alone, 41 that compile only with the name they say they need`.
#
# So the count the work needs is 47 s of CPU -- the library's own arithmetic, 575 examples, each
# its own process -- and a bound it cannot meet is a red about the bound. 240000 ms leaves 60 s of
# margin, the case still asks for every slot, and the number is stated rather than waved at.
timeout_ms = 240000
# This case compiles every `@example` of the library -- several hundred programs, each its own
# process -- and reports how many of them compile. Under a full gate that number is a reading
# about the machine as much as about the library: on 2026-11-02 the same tree passed alone and
# failed inside an eight-job gate, because examples that lost the CPU race were counted in the
# "does not compile" group. A count that moves with the load is not a count, so the case asks
# for every slot and runs alone. The same rule holds for any future case whose verdict is a
# number of compiled programs rather than an assertion about one program.
parallel = false
verify_script = """
({ input, assert }) => {
const stdout = input.normalized.stdout
const counted = /the examples: ([0-9]+) written in the modules, ([0-9]+) a program of their own, ([0-9]+) compile, ([0-9]+) do not/.exec(stdout)
assert(counted !== null, 'the run did not say how many examples it compiled')
const [written, programs, compiled, stopped] = counted.slice(1).map(Number)
assert(compiled + stopped === programs,
  `${programs} example(s) are a program of their own, and ${compiled} compile with ${stopped} that do not`)
assert(written >= programs, `${written} example(s) written, ${programs} of them a program of their own`)
// The claims the script makes about the list are printed as numbers; a class the script does not
// record, or a count that moved, fails the run itself and this test with it.
assert(/the example counts are the ones the script records/.test(stdout),
  'the run did not say that its counts are the ones the script records')
if (stopped > 0) {
  const classes = stdout.split('\n').filter((line) => /^    an? [a-z]+ error: [0-9]+$/.test(line))
  assert(classes.length > 0, `${stopped} example(s) do not compile and no class is listed`)
}
}
"""

[[tests]]
name = "registry.migrations_stay_migrated"
desc = "A module that has moved to a declaration module stays migrated: C++ has no StaticFuncTypeResolver for a name the declaration fixes, no stray stdlib/signatures/<module>.cml survives unless the reference generator names it in computed:, every declaration is behind a registered operator (--verify-ops, reused), the C++ export groups are the declaration's plus the computed signatures, and a computed name has exactly one recorded place ."
kind = "behavior"
tool = "node"
case = "../../../../scripts/stdlib-declarations.mjs"
args = ["${case}", "--check"]
expect_exit = 0
expect_stdout_contains = ["migrated modules stay migrated"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000

#  ---- A declaration file that failed to load is an error, not a shorter list ----

# `inspect --ops` is the tool people use to check what the modules register. A declaration module
# that exists and does not load leaves its operators out of the listing; before the tool
# printed the rest and exited 0 (that is how found its seven names only by counting them).
# The case makes the declaration module in its scratch directory out of a real `.cmo` and points
# `CAMEL_STD_LIB` at it.

[[tests]]
name = "registry.declaration_load_failure_is_an_error"
desc = "`camel inspect --ops` exits 1 and reports on stderr, with a line naming the module and its declaration file, when a declaration module a program imports fails to load; it prints no operator listing it cannot vouch for. A module that is not imported is not an error, and the module's real declaration still lists with the same `CAMEL_STD_LIB`."
kind = "behavior"
tool = "node"
case = "../../../cases/tools/inspect/declaration_load_failure.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["PASS"]
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 120000

# `--audit` had no case of its own, and a mode nothing runs rots: it answered `ReferenceError:
# names is not defined` for as long as nobody called it (the variable it counted was deleted with
# the guards around it, and the line that read it stayed). What the entry reads is the check the
# mode now makes -- every entry of the table reads a file that exists -- plus the two sentences
# that say what it audited and what it found, so a mode that stops working is a red and not a
# script nobody has run.
[[tests]]
name = "registry.audit_table_matches_the_library"
desc = "`scripts/stdlib-reference.mjs --audit` answers what the module table and the library on disk say to each other: every entry reads a file that is there, the files no entry reads are named, and each module's declarations are counted with a `pending` column for the ones the page leaves out. It exits 0 with a sentence saying what it audited, and 1 with a `MISMATCH` line when an entry names a file the library does not have."
kind = "behavior"
tool = "node"
case = "../../../../scripts/stdlib-reference.mjs"
args = ["${case}", "--audit"]
expect_exit = 0
expect_stdout_contains = ["auditing: the module table against the library on disk", "the module table matches the library"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000

[[tests]]
name = "registry.reference_is_generated"
desc = "docs/stdlib-reference.md is what scripts/stdlib-reference.mjs --write produces from the signature files and the library sources: it is generated, not edited."
kind = "behavior"
tool = "node"
case = "../../../../scripts/stdlib-reference.mjs"
args = ["${case}", "--verify-doc"]
expect_exit = 0
expect_stdout_contains = ["docs/stdlib-reference.md is up to date"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000

# `import algo` is gone and the operators are `array:`'s. The inspection above catches an
# `algo:` URI that a program imports; this scan catches one that nothing imports yet, and the
# return of the files the module was made of. `docs/` is a record and is not scanned.
[[tests]]
name = "registry.algo_module_gone"
desc = "No source, test, example or benchmark names an `algo:` operator or imports `algo`, and neither `stdlib/algo.cml` nor `modules/algo/` exists: the module was folded into `array` and cannot come back alongside its operators."
kind = "behavior"
tool = "node"
case = "../../../tools/check-no-algo.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["PASS no algo module"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000

# The environment switches that are left are a ledger: a new `getenv` of a CAMEL_* variable fails
# here, and so does a ledger line whose switch was cleared.
[[tests]]
name = "registry.no_env_switches"
desc = "Every `getenv` under `src/` and `modules/` is in `test/tools/check-env-switches.mjs`: no CAMEL_* variable decides a run's behaviour unless an explicit line says why it is still there, and a line whose switch was cleared fails too."
kind = "behavior"
tool = "node"
case = "../../../tools/check-env-switches.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["PASS no environment switch outside the ledger"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000
