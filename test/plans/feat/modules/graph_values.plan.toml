id = "modules.graph_values"
order = 377
tier = "fast"
tags = ["feat", "modules", "graph"]

# Graphs are values (design principles 9.1): a transform gives a new function, and the function it
# was given stays the same for every other holder -- a name that calls it, a closure that captured
# it, a caller that is not transformed, and the Program it was taken from. Each case holds
# `target` (or `loss`, `ratio`), transforms it, and then looks at it again: what it computes and
# what its graph contains.

[[tests]]
name = "function_txn_leaves_the_original"
desc = "open/replace/commit make a function without the `+ 1`; target still computes 18, its own graph still has the `+ 1` and the same number of nodes, and a closure made before and two callers by name still see the original."
kind = "behavior"
case = "../../../cases/modules/graph_values/function_txn.cml"
backends = ["nvm", "fvm", "jit"]
args = ["${case}", "${backend}"]
expect_exit = 0
expect_stdout_exact = "new: 15 0\nold: 18 1 true\nholders: 1018 118 36\n"
timeout_ms = 20000

[[tests]]
name = "program_txn_leaves_the_program_and_the_running_code"
desc = "open/replace/commit over a function that reaches `target`: the committed function has no `+ 1`, the function the transaction was opened on still has it, and the running target -- called by name, read through graph_of, and through a closure made after the commit -- is the original."
kind = "behavior"
case = "../../../cases/modules/graph_values/program_txn.cml"
backends = ["nvm", "fvm", "jit"]
args = ["${case}", "${backend}"]
expect_exit = 0
expect_stdout_contains = ["committed: 0\n", "opened on: 1\n", "running: 18 1\n", "made after: 1018\n"]
timeout_ms = 20000

[[tests]]
name = "program_txn_does_not_republish_current"
desc = "A commit made by the program itself gives a value and changes nothing another holder sees (design principles 9.1), so `main` still names the running program afterwards."
kind = "behavior"
case = "../../../cases/modules/graph_values/program_txn.cml"
backends = ["nvm", "fvm", "jit"]
args = ["${case}", "${backend}"]
expect_exit = 0
expect_stdout_contains = ["current: 1\n"]
timeout_ms = 20000

[[tests]]
name = "rewrite_leaves_the_program_and_the_running_code"
desc = "user->rewrite<[x + 1 => x]>: the result has no `+ 1`, the function it was given still has it, and the running target -- by name, through graph_of, and through a closure made afterwards -- is the original."
kind = "behavior"
case = "../../../cases/modules/graph_values/rewrite_rule.cml"
backends = ["nvm", "fvm", "jit"]
args = ["${case}", "${backend}"]
expect_exit = 0
expect_stdout_contains = ["rewritten: 0\n", "given: 1\n", "running: 18 1\n", "made after: 1018\n"]
timeout_ms = 20000

[[tests]]
name = "rewrite_does_not_republish_current"
desc = "p->rewrite<rules> gives a function and changes nothing another holder sees (design principles 9.1), so `main` still names the running program afterwards."
kind = "behavior"
case = "../../../cases/modules/graph_values/rewrite_rule.cml"
backends = ["nvm", "fvm", "jit"]
args = ["${case}", "${backend}"]
expect_exit = 0
expect_stdout_contains = ["current: 1\n"]
timeout_ms = 20000

[[tests]]
name = "rewrite_callee_runs_the_graph_it_shows"
desc = "user->rewrite<[x + 1 => x]> and chain->rewrite<[x + 1 => x]>: the rewritten function calls the version of its callee that its own program holds, so `graphs_of(q)` having no `+ 1` in target and `q(5)` computing 5 are one reading -- the graph and the run agree. The program the rewrite was taken from keeps its caller and its callee, so `user(5)` still computes 6."
kind = "behavior"
case = "../../../cases/modules/graph_values/rewrite_callee.cml"
backends = ["nvm", "fvm", "jit"]
args = ["${case}", "${backend}"]
expect_exit = 0
expect_stdout_exact = "one: 0 5\ntwo: 0 5\ngiven: 1 6\n"
timeout_ms = 20000

[[tests]]
name = "rewritten_callee_reads_the_same_on_every_back_end"
desc = "The author's `p10c4`: a rewritten function's callee is the one its program holds, so the graph query and the run agree -- 0 `+ 1` nodes in the `target` reachable from `q` beside `q(5)` computing 5, and 1 beside 6 for the program the rewrite was taken from. The four back ends read the same line; a call site left on the old graph reads `val 6 6`."
kind = "behavior"
case = "../../../cases/modules/graph_values/p10c4_rule_callee_value_vs_graph.cml"
backends = ["nvm", "fvm", "jit", "prl"]
args = ["${case}", "${backend}"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "gr 1 0\nval 6 5\n"
timeout_ms = 20000

[[tests]]
name = "grad_leaves_loss_and_its_callers"
desc = "grad(loss) and with_grad(loss) built at run time: loss and user, which calls it, compute the same before and after, and user's graph keeps its size."
kind = "behavior"
case = "../../../cases/modules/graph_values/grad_holders.cml"
backends = ["nvm", "fvm", "jit"]
args = ["${case}", "${backend}"]
expect_exit = 0
expect_stdout_exact = "before: 20.0 21.0\nderived: 10.0 20.0 10.0\nafter: 20.0 21.0 true\n"
timeout_ms = 20000

[[tests]]
name = "grad_expanded_by_macro_leaves_loss_and_its_callers"
desc = "The same program with std::macro expanding grad and with_grad ahead of time: the output is the one of the run-time route, so the expansion did not change loss or its caller."
kind = "behavior"
case = "../../../cases/modules/graph_values/grad_holders.cml"
args = ["${case}", "std::macro", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "before: 20.0 21.0\nderived: 10.0 20.0 10.0\nafter: 20.0 21.0 true\n"
timeout_ms = 20000

[[tests]]
name = "grad_expanded_by_macro_leaves_loss_and_its_callers_fvm"
desc = "As above, executed by the bytecode VM."
kind = "behavior"
case = "../../../cases/modules/graph_values/grad_holders.cml"
args = ["${case}", "std::macro", "std::fvm"]
expect_exit = 0
expect_stdout_exact = "before: 20.0 21.0\nderived: 10.0 20.0 10.0\nafter: 20.0 21.0 true\n"
timeout_ms = 20000

[[tests]]
name = "attempt_leaves_the_function"
desc = "attempt(ratio)(x) isolates the fault at the call; ratio called directly afterwards still faults with its location, and its graph keeps its size."
kind = "behavior"
case = "../../../cases/modules/graph_values/attempt_holders.cml"
backends = ["nvm", "fvm"]
args = ["${case}", "${backend}"]
expect_exit = 1
expect_stdout_starts_with = "isolated: 3 -1\nsame: 3 true\n"
expect_output_contains = ["RuntimeDiag::DivisionByZero", "attempt_holders.cml:42:15"]
timeout_ms = 20000

[[tests]]
name = "pipeline_rewrites_its_only_holder"
desc = "The command-line pipeline is the program's only holder and may rewrite in place: after inlining and optimising, the function, its two callers and a closure compute what the source says."
kind = "behavior"
case = "../../../cases/modules/graph_values/pipeline_inline.cml"
backends = ["nvm", "inline_nvm", "inline_fvm", "inline_jit"]
args = ["${case}", "std::opt", "${backend}"]
expect_exit = 0
expect_stdout_exact = "20 21 60 19\n"
timeout_ms = 20000

[[tests]]
name = "cloned_graph_is_read_in_its_own_program"
desc = "remat(q) copies q's `user` graph into a graph of the transform's own program and hands back a value that names it: the copy reaches the `target` the rewrite left without a `+ 1` and computes 15, beside `user(5)` computing 18, and the graph query says the same thing. A copy whose calls were read in the program the run was handed reads 18 beside ones=0."
kind = "behavior"
case = "../../../cases/modules/graph_values/clone_program.cml"
backends = ["nvm", "fvm", "jit", "prl"]
args = ["${case}", "${backend}"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "clone: 15 ones=0\ngiven: 18 ones=1\ncopy: user__remat\n"
timeout_ms = 20000

[[tests]]
name = "reinterpretation_copies_the_body_into_its_own_program"
desc = "first_with_as_param(q) copies q's `weighted` body into a graph of the transform's own program and hands back a value that names it: the copy reaches the `scaled` the rewrite left without a `+ 1` and computes 5 * 2 = 10, beside the same body in the program the rewrite was taken from computing 6 * 2 = 12, and the graph query says the same thing. A copy whose calls were read where its source graph came from reads 12 beside ones=0."
kind = "behavior"
case = "../../../cases/modules/graph_values/reinterpret_copies_its_body.cml"
backends = ["nvm", "fvm", "jit", "prl"]
args = ["${case}", "${backend}"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "copy 10 0\ngiven 12 1\nform weighted__first_with_as_param\n"
timeout_ms = 20000

[[tests]]
name = "discarded_rewrite_does_not_reach_the_run"
desc = "A pass written in Camel tries a rewrite and returns the Program it was given: the pipeline goes on with that Program, so target computes 18."
kind = "behavior"
case = "../../../cases/modules/graph_values/discard_target.cml"
backends = ["nvm", "fvm", "jit"]
args = ["${case}", "discard_pass::discard", "${backend}"]
expect_exit = 0
expect_stdout_contains = ["running: 18\n"]
timeout_ms = 20000

[[tests]]
name = "discarded_rewrite_does_not_become_current"
desc = "The same run: the rewrite the pass threw away is no holder's value, so `main` inside the run still names the Program the pass returned, with the `+ 1`."
kind = "behavior"
case = "../../../cases/modules/graph_values/discard_target.cml"
backends = ["nvm", "fvm", "jit"]
args = ["${case}", "discard_pass::discard", "${backend}"]
expect_exit = 0
expect_stdout_contains = ["current: 1\n"]
timeout_ms = 20000
