id = "modules.ckpt"
order = 368
tier = "fast"
tags = ["feat", "modules", "ckpt"]

[[tests]]
name = "type_directed_map_unzip_and_ordered_reduce"
kind = "behavior"
case = "../../../cases/modules/tree_operations.cml"
args = ["${case}", "std::macro", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "{ w: 6.0, block: (8.0, 10.0) }\n{ count: 4, weight: 3.0 }\n{ count: 3, weight: 2.0 }\n({ w: 6.0, block: (8.0, 10.0) }, { w: 0.0, block: (0.0, 0.0) }, { w: 9.0, block: (16.0, 25.0) })\n{ w: 9.0, block: (12.0, 15.0) }\n8.0\n(3.0, 4.0, 5.0)\n{ w: w, block: (block.0, block.1) }\n{ samples: 3 }\n1.0\n"
timeout_ms = 10000

[[tests]]
name = "shape_mismatch_is_a_compile_error"
desc = "A secondary tree whose leaf is where the first tree has a branch is rejected while `tree_map` expands: the field access on the secondary's leaf has no field. The expansion reports the access itself, not a tree path, because Camel has no compile-time error of its own yet (`static error`)."
kind = "negative"
case = "../../../cases/modules/tree_shape_error.cml"
args = ["${case}", "std::nvm"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::StaticAccessNotInternal"
timeout_ms = 10000

[[tests]]
name = "tree_library_and_ckpt_run_together"
desc = "`tree_paths`, `tree_map`, `tree_reduce` and `tree_unzip` are the Camel tree library (`stdlib/tree.cml`); only `tree_leaves` is still a native intrinsic of `ckpt`. A program importing both runs and gets the same values the old single module gave."
kind = "behavior"
case = "../../../cases/modules/tree_library.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "{ w: w, block: (block.0, block.1) }\n(3.0, 4.0, 5.0)\n{ w: 4.0, block: (5.0, 6.0) }\n"
timeout_ms = 10000

[[tests]]
name = "tree_is_a_camel_library_not_a_native_module"
desc = "The dead-code guard: `inspect --ops` on a program importing both names lists `tree_leaves` among the operators of the native `ckpt` module, no operator of a module `tree`, and none of the three tree operations the library now expands from its Camel bodies. A surviving native `tree.cmo` would be listed here (and would shadow `stdlib/tree.cml` in the same directory)."
kind = "behavior"
case = "../../../cases/modules/tree_library.cml"
args = ["inspect", "--ops", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines"]
verify_script = """
({ input, assert }) => {
const ops = input.normalized.stdout.split('\n').filter((line) => line.startsWith('OPERATOR ')).map((line) => JSON.parse(line.slice('OPERATOR '.length)))
const names = new Set(ops.map((op) => op.name))
assert(names.has('tree_leaves'), 'ckpt lost tree_leaves, the one tree operator that is still native')
for (const name of ['tree_map', 'tree_reduce', 'tree_unzip']) {
  assert(!names.has(name), name + ' is still a native operator: it belongs to stdlib/tree.cml')
}
assert(!names.has('tree_paths'), 'tree_paths is still a native operator: it belongs to stdlib/tree.cml')
assert(!ops.some((op) => op.module === 'tree'), 'a native module tree is still registered; stdlib/tree.cml would be dead code')
}
"""
timeout_ms = 20000
