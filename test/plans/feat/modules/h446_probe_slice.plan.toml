id = "modules.h446_probe_slice"
order = 9999
tier = "fast"
tags = ["feat", "modules", "autodiff", "probe"]

[[tests]]
name = "probe.slice_open_end.probe"
desc = "H446 probe: run slice_open_end with the zero-tangent probe on."
