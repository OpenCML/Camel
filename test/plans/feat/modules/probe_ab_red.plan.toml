id = "modules.probe_onnx_array_field"
order = 9999
tier = "fast"
tags = ["feat", "probe"]

[[tests]]
name = "probe.carried_array_field"
kind = "behavior"
case = "../../../cases/modules/onnx/export_loop_carried_array_field.cml"
args = ["${case}"]
envs = ["ONNX_OUT=${test_tmp}/probe_carried_array_field.onnx"]
expect_exit = 1
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const text = input.normalized.output.split(String.fromCharCode(10)).join(' / ')
assert(text.includes("a recursive call changes argument 2 of a recursion whose depth depends on the model input"), 'missing the argument: ' + text)
assert(text.includes("the leaf 'xs', a value of type 'int[]'"), 'the diagnostic must name the array field: ' + text)
assert(text.includes('a carried state with an array field is refused until native multi-dimensional arrays settle the shapes of fixed-size arrays (H17 items 2 and 4)'), 'the diagnostic must say what is missing: ' + text)
}
"""
timeout_ms = 20000