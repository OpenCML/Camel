id = "modules.selected_protection"
order = 932
tier = "fast"
tags = ["feat", "modules", "rewrite", "effects"]
desc = "Caller-selected deletion guards, extraction and explicit pass-boundary checking. An external access and a final write to a variable that outlives the call are kept by the graph, not by a guard: `protect_order=false` drops neither, and only `protect_faults` still selects a deletion (design principles 9.7)."

[defaults]
kind = "behavior"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

[[tests]]
name = "pure.direct.11"
case = "../../../cases/modules/selected_protection/pure.cml"
args = ["${case}", "policy::direct", "order=true", "faults=true", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "0\n"

