id = "modules.onnx_loop_collect"
order = 365
tier = "fast"
tags = ["feat", "modules", "onnx"]

# A loop that collects a value every round into an array is a Loop with scan outputs: the body
# gives one more value per collection slot each round, the Loop stacks them along a new first
# axis, and that array is what the loop hands out (camel/runtime/loop.h). The state such a loop
# starts from (`[]`, only appended to) is the same array, so it is not carried at all.
#
# A loop whose rounds a condition decides (`while`, `for ... while`) collects the same way: the
# number of values is a run-time quantity, which is what an ONNX scan output's first dimension
# already is -- the spec leaves it a dimension with neither a value nor a name, so the model
# states no length for it (onnx/defs/controlflow/old.cc, `LoopInferenceFunction_opset13`).
#
# The negative control is the shape this does not cover: an array built with no loop at all (no
# round to scan).

[[tests]]
name = "loop_collect_for_scan_output"
desc = "A counted `for` that collects into an array exports as one Loop whose extra output is the array; the model's output states one dimension for the rounds."
kind = "behavior"
case = "../../../cases/modules/onnx/loop_collect/for_collect.cml"
args = ["${case}"]
envs = ["ONNX_OUT=${test_tmp}/loop_collect_for.onnx"]
expect_exit = 0
expect_stdout_contains = ["exported"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
async ({ input, assert }) => {
const path = await import('path')
const url = await import('url')
const helper = path.join(input.repo_root, 'test/cases/modules/onnx/onnx_ops.mjs')
const { readOnnxModel } = await import(url.pathToFileURL(helper).href)
const model = readOnnxModel(path.join(input.test_tmp, 'loop_collect_for.onnx'))
assert(model.ops.filter((o) => o === 'Loop').length === 1, `the collecting loop is one Loop, got ${model.ops}`)
assert(model.outputs.join() === 'output', `unexpected graph outputs ${model.outputs}`)
const dims = model.outputDims[0]
assert(dims && dims.length === 1 && typeof dims[0] === 'string', `the array's length is a fact about the data, so its one dimension is symbolic; got ${JSON.stringify(dims)}`)
}
"""
timeout_ms = 20000

[[tests]]
name = "loop_collect_for_scan_output_shape"
desc = "The same collection over an input whose length the program states: the collected array is four values on every call, and the model's declared output shape says so."
kind = "behavior"
