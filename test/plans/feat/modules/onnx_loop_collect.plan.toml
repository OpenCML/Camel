[[tests]]
name = "loop_collect_while_scan_output"
desc = "A `while` that collects exports as one Loop with scan outputs: the round count is decided while it runs, and the model states no length for the array."
kind = "behavior"
case = "../../../cases/modules/onnx/loop_collect/while_collect.cml"
args = ["${case}"]
envs = ["ONNX_OUT=${test_tmp}/loop_collect_while.onnx"]
expect_exit = 0
expect_stdout_contains = ["exported"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
async ({ input, assert }) => {
const path = await import('path')
const url = await import('url')
const helper = path.join(input.repo_root, 'test/cases/modules/onnx/onnx_ops.mjs')
const { readOnnxModel } = await import(url.pathToFileURL(helper).href)
const model = readOnnxModel(path.join(input.test_tmp, 'loop_collect_while.onnx'))
assert(model.ops.filter((o) => o === 'Loop').length === 1, `the collecting loop is one Loop, got ${model.ops}`)
assert(model.outputs.length === 2, `the loop's value is a pair of the array and the counter, so the graph has two outputs; got ${model.outputs}`)
const dims = model.outputDims[0]
assert(dims && dims.length === 1 && typeof dims[0] === 'string', `the array's length is decided while the loop runs, so its one dimension carries no number; got ${JSON.stringify(dims)}`)
}
"""
timeout_ms = 20000

[[tests]]
name = "loop_collect_for_while_stops_early"
desc = "A `for ... while` that collects over an input of stated length whose condition stops it early: the model must not state the input's length for the array, because the run collected fewer values than that."
kind = "behavior"
case = "../../../cases/modules/onnx/loop_collect/for_while_collect.cml"
args = ["${case}"]
envs = ["ONNX_OUT=${test_tmp}/loop_collect_for_while.onnx"]
expect_exit = 0
expect_stdout_contains = ["exported"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
async ({ input, assert }) => {
const path = await import('path')
const url = await import('url')
const helper = path.join(input.repo_root, 'test/cases/modules/onnx/onnx_ops.mjs')
const { readOnnxModel } = await import(url.pathToFileURL(helper).href)
const model = readOnnxModel(path.join(input.test_tmp, 'loop_collect_for_while.onnx'))
assert(model.ops.filter((o) => o === 'Loop').length === 1, `the collecting loop is one Loop, got ${model.ops}`)
const dims = model.outputDims[0]
assert(dims && dims.length === 1, `the array is one dimension, got ${JSON.stringify(dims)}`)
assert(typeof dims[0] === 'string', `the condition ends this loop early, so the four elements of x are an upper bound and not the length; the model stated ${JSON.stringify(dims)}`)
}
"""
timeout_ms = 20000

