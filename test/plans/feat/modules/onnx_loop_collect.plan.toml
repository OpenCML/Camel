[[tests]]
name = "loop_collect_forward_main.ort"
# Slow layer: an ONNX Runtime session, an ONNX checker pass and three Camel runs.
tier = "slow"
desc = "The exported forward Loop runs on ONNX Runtime: the model passes onnx.checker's full check, and for both budgets the scan output, the round counter and the summed total agree with Camel's own arrays. The tolerance is 1e-12 relative: both sides compute in f64 with the same operations in the same order, so the only difference possible is the order the four products of a row are added in -- at most 4 ulp, 8.9e-16 relative -- and 1e-12 is four orders tighter than an f32 would hide a different order at."
kind = "behavior"
tool = "python"
case = "../../../cases/modules/onnx/ort_forward_collect.py"
args = ["${case}"]
skip_unless = ["${python}", "-c", "import numpy, onnx, onnxruntime"]
expect_exit = 0
expect_stdout_contains = ["onnx.checker full_check ok", "budget 0.5: rounds camel 2 ort 2", "budget 100.0: rounds camel 6 ort 6", "cc forward ORT: PASS"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 180000