# ---------------------------------------------------------------------------------------------------
# The CC main case's forward half: a loss summed over a loop whose rounds the data decides. The
# budget, not a length the program states, decides how many rounds run -- the same six rows ask for
# two rounds under 0.5 and six under 100 -- and the loss of every round is collected into the array
# the Loop hands out, which is the residual the reverse half will read (design principles 9.9).
[[tests]]
name = "loop_collect_forward_main.nvm"
desc = "The main case's forward loop runs on the interpreter over two budgets and collects two different numbers of rounds: the same data asks for two rounds under a budget of 0.5 and six under 100, and the summed total is exact on both."
kind = "behavior"
case = "../../../cases/modules/onnx/loop_collect/forward_collect.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["rounds budget=0.5 2 budget=100 6", "totals 0.8125 0.953125", "0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

