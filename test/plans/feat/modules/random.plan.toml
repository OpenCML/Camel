id = "modules.random"
order = 365
tier = "fast"
tags = ["feat", "modules", "random", "purity"]

# Keyed random: `random::key`, `split` and `permutation` are pure Philox4x32-10
# functions. The same key gives the same bits on all four schedulers, in translated C++ and on
# every platform; nothing touches the process generator.

[[tests]]
name = "keyed_random.four_schedulers"
desc = "key(seed), split(key) and permutation(key, n) print the same values on std::nvm, std::fvm, std::jit and std::prl: a key is the struct { hi, lo } of two int64 fields, split gives the same pair every time, permutation(_, 0) is [] and (_, 1) is [0]."
kind = "behavior"
case = "../../../cases/modules/random/keyed_random.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "keyed key={ hi: 0, lo: 42 } a={ hi: -6481381978313301641, lo: -125808508541856219 } b={ hi: 8292705212686920034, lo: 249182360730218723 }\nkeyed repeat={ hi: 0, lo: 42 } pure=true perm=[2, 4, 1, 0, 6, 5, 3, 7]\nkeyed small p0=[] p1=[0]\nkeyed splitrepeat=({ hi: -6481381978313301641, lo: -125808508541856219 }, { hi: 8292705212686920034, lo: 249182360730218723 }) ({ hi: -6481381978313301641, lo: -125808508541856219 }, { hi: 8292705212686920034, lo: 249182360730218723 })\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "keyed_random.leaves_generator_alone"
desc = "key, split and permutation read no generator state: the draws around them are the same as the draws alone, and permuting twice with one key gives one permutation."
kind = "behavior"
case = "../../../cases/modules/random/random_independence.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["same=true", "order=[2, 4, 1, 0, 3] repeat=[2, 4, 1, 0, 3]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "keyed_random.permutation_non_positive"
desc = "permutation of a length of zero or below is [] and of one is [0]: no fault, on every scheduler."
kind = "behavior"
case = "../../../cases/modules/random/permutation_non_positive.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "permutation empty=[] negative=[] one=[0]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "keyed_random.std_cpp_agrees"
# Slow layer: builds each program with the system C++ compiler.
tier = "slow"
desc = "std::cpp translates the keyed primitive and the global stream (rand:philox, rand:seed, rand:next_key) over camel/utils/philox.h; the standalone program prints what std::fvm prints (same keys, same draws). permutation and the whole-array draws are not translated: they sit on array:argsort and a tensor kernel."
kind = "behavior"
tool = "python"
case = "../../../tools/cppexec/run.py"
args = ["${case}", "--expect", "test/tools/cppexec/expect_h20.txt"]
skip_unless = ["${python}", "test/tools/cppexec/run.py", "--have-compiler"]
expect_exit = 0
expect_stdout_contains = ["PASS"]
expect_output_not_contains = ["FAIL"]
timeout_ms = 120000