[[tests]]
name = "array.sort_reference"
desc = "Every sorting operator of the array module (sort, quick_sort, insert_sort, merge_sort, merge_sorted_arrays; the `-ed` twins are gone, design principles 11.3) against Python's sorted() on generated int and float arrays (random, duplicates, sorted, reversed, constant; lengths 1 to 257; fixed seed), the input of every form unchanged (no operator sorts its argument in place, 11.3), also as the rebinding `v = v->sort` that sorts in place when nothing else holds the array (11.3), and 200000 already sorted / reversed elements. The sorts once returned unsorted arrays (wrong quicksort partition), and no sort ordered floats (slots were compared as unsigned integers)."
kind = "behavior"
tool = "python"
case = "../../../cases/modules/std/array/sort_reference.py"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["1890 results and one large program, 0 wrong", "PASS"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 120000
