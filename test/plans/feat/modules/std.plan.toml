case = "../../../cases/modules/std/array/every_operator.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "[1, 2, 3]\n[1, 2, 0]\n[1, 2, 3]\n[3, 1, 2]\n[1, 2, 3] [3, 1, 2]\n"
