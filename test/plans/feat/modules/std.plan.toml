id = "modules.std"
order = 360
tier = "fast"
tags = ["feat", "modules", "std"]

[[tests]]
name = "array.sort_basic"
desc = "Exercises the sorting and merge functions of the array module, which now owns the algorithms the deleted algo module used to load."
kind = "behavior"
case = "../../../cases/modules/std/array/sort_basic.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "array.every_operator"
desc = "Every native operator of array, called through `array::`, answers the value it answered as an operator of algo: sort, insert_sort, quick_sort, merge_sort, merge_sorted_arrays, argsort, flatten and unique, and sort leaves its argument unchanged."
kind = "behavior"
case = "../../../cases/modules/std/array/every_operator.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "[1, 2, 3]\n[1, 2, 3]\n[1, 2, 3]\n[1, 2, 3]\n[1, 2, 3, 4]\n[1, 2, 0]\n[1, 2, 3]\n[3, 1, 2]\n[1, 2, 3] [3, 1, 2]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

