args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "array.every_operator"
desc = "Every function of array that has a native atom, called through `array::`, answers the value it answered as an operator of algo: sort, argsort, flatten and unique, and sort leaves its argument unchanged."
