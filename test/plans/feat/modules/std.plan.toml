[[tests]]
name = "python.errors"
desc = "A Python exception is an error value of kind PythonError whose message starts with the exception class (a missing module, a missing attribute, a bad call, a syntax error), and py_unwrap refuses with PythonTypeError and a path when the object is not the kind asked for: 5 is not a bool, bytes is not a string, 1e300 is not an f32, True is not an int, 1.5 is not an int, and a list, tuple or dict must have the right elements."
kind = "behavior"
case = "../../../cases/modules/std/python/errors.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "PythonError: KeyError: 'missing'\nPythonError: ModuleNotFoundError: No module named 'no_such_module_zzz'\nPythonError: AttributeError: 'int' object has no attribute 'nope'\nPythonError: ValueError: invalid literal for int() with base 10: 'x'\nPythonError: AttributeError: module 'math' has no attribute 'nope'\nPythonError: SyntaxError\nok\nok 5\nok 2.0\nok 1.5\nok text\nPythonTypeError: value: expected a bool, found int\nok true\nPythonTypeError: value: expected a str, found bytes\nPythonTypeError: value: the number 1e+300 does not fit an f32\nPythonTypeError: value: expected an int, found bool\nPythonTypeError: value: expected an int, found float\nPythonTypeError: value: the int 1099511627776 does not fit an i32\nPythonTypeError: value[1]: expected an int, found str\nPythonTypeError: value: expected a tuple of 2 element(s), found 3\nPythonTypeError: value: missing field 'b'\nok [1, 2, 3]\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

