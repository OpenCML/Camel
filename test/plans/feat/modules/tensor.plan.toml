[[tests]]
name = "print_value"
desc = "An array value prints by its own extents and by the element type its declaration fixes, or, when the declaration fixes none (a `Tensor` parameter), by the type the value holds: a rank-2 value comes out nested and complete instead of as its first extent flat, and no element is `null`. The controls keep the rank-1 and rank-0 forms and the same value read through a declaration that names the element type."
kind = "behavior"
case = "../../../cases/modules/tensor/print_value.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const nl = String.fromCharCode(10)
const tab = String.fromCharCode(9)
const start = (name) => out.indexOf(name + ' ')
const body = (name, next) => {
    const i = start(name)
    assert(i >= 0, name + ' is missing: ' + out)
    const j = next === null ? out.length : start(next)
    return out.slice(i, j > i ? j : out.length)
}
const flat = (xs) => JSON.stringify(xs)
// The value's printed text, from `name=`: what is asserted is the shape and the parts, so the
// printer's own spelling (a `tensor(...)` wrapper, a dtype, a sign or a space before a float) is
// not pinned here -- that text is the subject of the case, and the compensations the flip makes
// to the printer's spelling are not this test's to decide.
const printed = (name, next) => {
    const s = body(name, next)
    const at = s.indexOf('name=')
    // The label line of a `Tensor` value carries `name=`; a control prints the value after the
    // label, so its text starts at the first bracket.
    if (at >= 0) {
        return s.slice(at + 5)
    }
    const i = s.indexOf('[')
    assert(i >= 0, name + ': no array text in: ' + s)
    return s.slice(i)
}
const text = (name, next) => {
    const s = printed(name, next)
    const i = s.indexOf('[')
    const j = s.lastIndexOf(']')
    assert(i >= 0 && j > i, name + ': no array text in: ' + s)
    return s.slice(i, j + 1)
}
// The elements of one bracket level: a number, or the text of a nested level.
const level = (t) => {
    assert(t[0] === '[' && t[t.length - 1] === ']', 'not one level: ' + t)
    const inner = t.slice(1, -1)
    const parts = []
    let k = 0
    while (k < inner.length) {
        const c = inner[k]
        if (c === ',' || c === ' ' || c === nl || c === tab) { k += 1; continue }
        if (c === '[') {
            let d = 1
            let e = k + 1
            for (; e < inner.length; ++e) {
                if (inner[e] === '[') d += 1
                else if (inner[e] === ']') { d -= 1; if (d === 0) break }
            }
            assert(d === 0, 'unbalanced level: ' + inner)
            parts.push(level(inner.slice(k, e + 1)))
            k = e + 1
            continue
        }
        // No backslash escapes here: this script travels as a TOML string, and an escaped class
        // arrives as its own letter.
        const m = /^-?[0-9]+([.][0-9]*)?(e-?[0-9]+)?/.exec(inner.slice(k))
        assert(m, 'a part of the array is not a number: ' + inner)
        parts.push(Number(m[0]))
        k += m[0].length
    }
    return parts
}
const value = (name, next) => {
    const t = text(name, next)
    assert(!t.includes('null'), name + ': an element printed as null: ' + t)
    return level(t)
}
// The number of elements a rank-2 print of `[[...], [...]]` has, and the rank of its nesting.
const elements = (a) => a.reduce((n, x) => n + (Array.isArray(x) ? elements(x) : 1), 0)
const depth = (a) => (Array.isArray(a) ? 1 + Math.max(0, ...a.map(depth)) : 0)
// A, B and C go through a `Tensor` parameter: the declaration fixes no element type, so the
// elements are the value's own and a rank-2 value is complete and nested.
const a = value('A', 'B')
assert(flat(a) === '[[0,0,0]]', 'A lost its rank-2 shape: ' + flat(a))
const b = value('B', 'C')
assert(depth(b) === 2 && elements(b) === 8, 'B is not the 2x4 value: ' + flat(b))
assert(b.length === 2 && b[0].length === 4 && b[1].length === 4, 'B is not 2x4: ' + flat(b))
assert(b[0][0] > 0.99 && b[1][3] > 0.99, 'B lost its elements: ' + flat(b))
const c = value('C', 'D')
assert(flat(c) === '[[3],[3]]', 'C is not the 2x1 value: ' + flat(c))
assert(body('D', 'E').includes('sum=2.0'), 'the value behind D is not the one printed')
// Controls: the rank-1 and rank-0 forms keep their text.
assert(flat(value('E', 'E2')) === '[1,2]', 'the rank-1 control changed: ' + body('E', 'E2'))
assert(flat(value('E2', 'E3')) === '[1]', 'the one-element rank-1 control changed: ' + body('E2', 'E3'))
assert(value('E3', 'F').length === 0, 'the empty rank-1 control changed: ' + body('E3', 'F'))
// A rank-2 array, nested and complete, whichever way the declaration is written.
assert(flat(value('F', 'F2')) === '[[1,2],[3,4]]', 'F is not nested and complete: ' + body('F', 'F2'))
assert(flat(value('F3', 'F4')) === '[[1,2],[3,4]]', 'F3 is not nested and complete: ' + body('F3', 'F4'))
assert(flat(value('F2', 'F3')) === '[[1,2],[3,4],[5,6]]', 'F2 is not nested and complete: ' + body('F2', 'F3'))
assert(flat(value('F4', null)) === '[[[1,2],[3,4]],[[5,6],[7,8]]]', 'F4 is not nested and complete: ' + body('F4', null))
}
"""
timeout_ms = 20000

