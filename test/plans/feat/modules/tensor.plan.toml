# --- the numeric contract (design principles 7) -------------------------------------------

[[tests]]
name = "numeric_contract"
desc = "max and min are IEEE 754-2019 maximum/minimum on every operator (elementwise, axis reductions): a NaN on either side or anywhere in the reduced axis gives the canonical NaN (it printed only when it came first: max([1, NaN, 3]) was 3, max([NaN, 1, 3]) NaN), -0 is below +0 on either side (max([-0, 0]) was -0); relu(x) = maximum(x, +0) (relu(NaN) was 0); matmul is one fused multiply-add per step in one chain over the whole of k (2^24 then 511 ones gave 16777472: the ones were summed per 256-wide block first); softmax is exp(x - max) / sum(exp(x - max)) bit for bit (it multiplied by a rounded reciprocal). Alike on the four back ends."
kind = "behavior"
case = "../../../cases/modules/tensor/numeric_contract.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = """tensor([    nan,       0.,       1.,       0.], dtype=float32)
tensor([    nan,     nan,       0.,       0.], dtype=float32)
tensor([    nan,     nan,       0.,       0.], dtype=float32)
tensor([    nan,     nan,      -0.,      -0.], dtype=float32)
tensor([    nan,     nan,      -0.,      -0.], dtype=float32)
tensor(    nan, dtype=float32)
tensor(    nan, dtype=float32)
tensor(    nan, dtype=float32)
tensor(    nan, dtype=float32)
tensor(      0., dtype=float32)
tensor(      0., dtype=float32)
tensor(     -0., dtype=float32)
tensor(     -0., dtype=float32)
matmul fma_step=0.0004883408546447754
matmul chain=16777216.0
softmax equal=0.0
softmax nan_count=3.0
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

