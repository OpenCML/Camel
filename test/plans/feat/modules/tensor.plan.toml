[[tests]]
name = "transcendentals"
desc = "Vectorized exp/tanh/sigmoid/gelu/softmax: accurate ordinary values, IEEE-like saturation at the float range ends, and a subnormal e^-100 (27 * 2^-149, correctly rounded; it used to be flushed to 0)."
kind = "behavior"
case = "../../../cases/modules/tensor/transcendentals.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert, approx, match }) => {
const out = input.normalized.stdout
const e = match(/exp (\S+) (\S+) (\S+) (\S+) (\S+) (\S+)/, out)
assert(Number(e[1]) === 1 && approx(e[2], Math.E, 1e-6) && approx(e[3], 1 / Math.E, 1e-7), `exp values ${e[0]}`)
assert(e[4] === 'inf' && Number(e[5]) === 27 * 2 ** -149 && e[6] === 'true', `exp saturation ${e[0]}`) // e^-100 is the subnormal 27 * 2^-149, not 0
const t = match(/tanh (\S+) (\S+) (\S+) (\S+)/, out)
assert(Number(t[1]) === 0 && approx(t[2], Math.tanh(0.5), 1e-7) && Number(t[3]) === 1 && Number(t[4]) === -1, `tanh ${t[0]}`)
const s = match(/sigmoid (\S+) (\S+) (\S+)/, out)
assert(Number(s[1]) === 0.5 && Number(s[2]) === 1 && Number(s[3]) === 0, `sigmoid ${s[0]}`)
const g = match(/gelu (\S+) (\S+) (\S+)/, out)
assert(Number(g[1]) === 0 && approx(g[2], 0.8411920, 1e-6) && Number(g[3]) === 0, `gelu ${g[0]}`)
const p = match(/softmax (\S+) (\S+) (\S+) (\S+)/, out)
assert(Number(p[1]) === 0.5 && Number(p[2]) === 0.5 && Number(p[3]) === 0 && Number(p[4]) === 0, `softmax ${p[0]}`)
}
"""
timeout_ms = 4000

