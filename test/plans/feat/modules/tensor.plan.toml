[[tests]]
name = "fuse_linear_graph"
desc = "tensor::fuse changes no operator: the graph keeps every matmul/add/relu and records tensor.kernel on each matmul and tensor.fusion on the nodes of the five groups it found; the product with a second reader is in no group."
kind = "behavior"
case = "../../../cases/modules/tensor/fuse_linear.cml"
args = ["${case}", "tensor::fuse", "std::gir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const q = String.fromCharCode(92) + '"'
const count = (text) => out.split(text).length - 1
const labels = (uri) => count(`label="${uri}"`)
assert(labels('tensor:matmul') === 6, `expected 6 matmul, got ${labels('tensor:matmul')}`)
assert(labels('tensor:add') === 6, `expected 6 add, got ${labels('tensor:add')}`)
assert(labels('tensor:relu') === 1, `expected 1 relu, got ${labels('tensor:relu')}`)
assert(count('matmul_add') === 0 && count('matmul_blas') === 0, 'no fused operator may appear')
const fusion = (value) => count('tensor.fusion=' + q + value + q)
assert(fusion('linear') === 8, `expected four linear groups, got ${fusion('linear')} nodes`)
assert(fusion('linear_relu') === 3, `expected one linear_relu group, got ${fusion('linear_relu')} nodes`)
assert(count('tensor.fusion=') === 11, `expected 11 grouped nodes, got ${count('tensor.fusion=')}`)
assert(count('tensor.kernel=' + q + 'library' + q) === 6, 'every matmul records how it runs')
}
"""
timeout_ms = 10000

[[tests]]
name = "fuse_linear_graph_safe"
desc = "tensor::fuse safe_fp=true keeps the groups but records the canonical algorithm on every matmul (design principles 7.4)."
kind = "behavior"
case = "../../../cases/modules/tensor/fuse_linear.cml"
args = ["${case}", "tensor::fuse safe_fp=true", "std::gir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const q = String.fromCharCode(92) + '"'
const count = (text) => out.split(text).length - 1
assert(count('label="tensor:matmul"') === 6, `expected 6 matmul, got ${count('label="tensor:matmul"')}`)
assert(count('tensor.kernel=' + q + 'canonical' + q) === 6, 'safe mode runs the canonical algorithm')
assert(count('tensor.kernel=' + q + 'library' + q) === 0, 'no library GEMM in safe mode')
assert(count('matmul_add') === 0, 'no fused operator may appear')
}
"""
timeout_ms = 10000

