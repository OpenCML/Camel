[[tests]]
name = "broadcast_ops"
desc = "NumPy-style broadcasting across arithmetic, comparison, where, cast, relu, and maximum."
kind = "behavior"
case = "../../../cases/modules/tensor/broadcast_ops.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert, match }) => {
const out = input.normalized.stdout
const grid = match(/broadcast shape=\[3, 2\] sum=([0-9.]+)/, out)
assert(Number(grid[1]) === 102, `expected grid sum 102, got ${grid[1]}`)
const mask = match(/broadcast mask_sum=([0-9]+) clipped_sum=([0-9.]+)/, out)
assert(Number(mask[1]) === 3 && Number(mask[2]) === 66, `unexpected mask/where results ${mask[0]}`)
const act = match(/broadcast relu_sum=([0-9.]+) max_sum=([0-9.]+)/, out)
assert(Number(act[1]) === 2 && Number(act[2]) === 2, `unexpected relu/maximum results ${act[0]}`)
}
"""
timeout_ms = 4000

[[tests]]
name = "reductions"
desc = "Axis reductions with keepdims, full reductions, and softmax/log_softmax along an axis."
kind = "behavior"
case = "../../../cases/modules/tensor/reductions.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert, approx, match }) => {
const out = input.normalized.stdout
const a = match(/reduce rows=([0-9.]+) cols_shape=\[1, 3\] mean=([0-9.]+)/, out)
assert(Number(a[1]) === 21 && Number(a[2]) === 3.5, `unexpected sum/mean ${a[0]}`)
const b = match(/reduce colmax_sum=([0-9.]+) argmax_sum=([0-9]+) mean_axis_sum=([0-9.eE+-]+)/, out)
assert(Number(b[1]) === 15 && Number(b[2]) === 3, `unexpected max/argmax ${b[0]}`)
assert(approx(Number(b[3]), 7, 1e-5), `unexpected mean axis ${b[3]}`)
const c = match(/reduce softmax0_sum=([0-9.eE+-]+) logsoftmax_expsum=([0-9.eE+-]+)/, out)
assert(approx(Number(c[1]), 3, 1e-5) && approx(Number(c[2]), 2, 1e-5), `unexpected softmax sums ${c[0]}`)
}
"""
timeout_ms = 4000

[[tests]]
name = "linalg_layout"
desc = "Batched broadcasting matmul, matrix-vector matmul, linear, layer_norm, and layout operators."
kind = "behavior"
case = "../../../cases/modules/tensor/linalg_layout.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert, approx, match }) => {
const out = input.normalized.stdout
const mm = match(/linalg matmul_shape=\[2, 3, 5\] matmul_sum=([0-9.]+) linear_shape=\[2, 3, 2\] linear_sum=([0-9.]+)/, out)
assert(Number(mm[1]) === 1380 && Number(mm[2]) === 552, `unexpected matmul/linear ${mm[0]}`)
const mv = match(/linalg matvec_shape=\[3\] matvec_sum=([0-9.]+)/, out)
assert(Number(mv[1]) === 30, `unexpected matvec ${mv[0]}`)
const ln = match(/linalg layernorm_sum=([0-9.eE+-]+)/, out)
assert(approx(Number(ln[1]), 0, 1e-4), `layer_norm rows should be zero-mean, got ${ln[1]}`)
assert(out.includes('layout permute=[4, 2, 3] slice=[2, 3, 2] slice_sum=144 flatten=[2, 12] unsqueeze=[1, 2, 4, 3]'), 'unexpected layout results')
}
"""
timeout_ms = 4000

