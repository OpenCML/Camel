[[tests]]
name = "gemm_canonical.fused"
desc = "In safe mode (tensor::fuse(safe_fp=true)) every matmul is withheld from the library GEMM (7.4), so the fused expression is bit-identical to the unfused one: K exceeds one cache block, which is where an accumulation order could show."
kind = "behavior"
case = "../../../cases/modules/tensor/gemm_canonical.cml"
args = ["${case}", "tensor::fuse(safe_fp=true)"]
expect_exit = 0
expect_stdout_exact = "gemm product_sum=425.47250219917623\ngemm affine_sum=424.9194541722536 relu_sum=3375.5932369083166\ngemm linear_diff=0.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "gemm_canonical.library"
desc = "With a BLAS the default policy's library GEMM may reorder this K=600 accumulation (7.3). The three sums and the linear/canonical difference stay inside the licence's bound; without a BLAS the library path is the canonical kernel and every difference is zero."
kind = "behavior"
case = "../../../cases/modules/tensor/gemm_canonical.cml"
args = ["${case}", "tensor::fuse"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
  const out = input.normalized.stdout
  const one = (key) => {
    const m = out.match(new RegExp(key + '=([-+0-9.eE]+)'))
    assert(m, `missing ${key} in ${out}`)
    return Number(m[1])
  }
  const product = one('product_sum')
  const affine = one('affine_sum')
  const relu = one('relu_sum')
  const linearDiff = one('linear_diff')
  assert(Math.abs(product - 425.47250219917623) <= 1e-3, `product_sum ${product} leaves the licence bound`)
  assert(Math.abs(affine - 424.9194541722536) <= 1e-3, `affine_sum ${affine} leaves the licence bound`)
  assert(Math.abs(relu - 3375.5932369083166) <= 1e-2, `relu_sum ${relu} leaves the licence bound`)
  assert(linearDiff <= 1e-2, `linear_diff ${linearDiff} leaves the licence bound`)
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

