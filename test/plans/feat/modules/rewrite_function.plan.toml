id = "modules.rewrite_function"
order = 931
tier = "fast"
tags = ["feat", "modules", "rewrite"]
desc = "The rewrite engines take a function and give a function of the same type (design principles 9.1): `f->rewrite<rules>`, `saturate`, `extract` with a cost written in Camel, `run`, and `check` over the types of a function; the report of a check is a struct."

[defaults]
kind = "behavior"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

[[tests]]
name = "rewrite_function.engines"
desc = "rewrite changes the function and leaves the one it was given; run counts what it did; saturate keeps every writing and extract chooses by a cost function; check answers a struct whose rows are read as fields and rendered by check_text."
case = "../../../cases/modules/rewrite_function/apply.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "10 12\n1 true 12\n10\ntrue\n1\n"

[[tests]]
name = "rewrite_function.pipeline_pass"
desc = "A pass of the rules library runs on the root function of the program on the pipeline: `(x + 0) * 1` in a function is its argument."
case = "../../../cases/modules/rewrite_function/simp_target.cml"
args = ["${case}", "rules::simplify", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "5\n"

[[tests]]
name = "rewrite_function.ordered"
desc = "Ordered binding forbids nested swaps, guard fallback and associative remainder search; defaults preserve them. Repeated variables keep identity, and explicit commutativity still adds saturation alternatives."
case = "../../../cases/modules/rewrite_function/ordered.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "guard ordered 0 3\nguard default 1 2\nguard omitted 1 2\nnested ordered 0 1\nnested default 1 0\nrepeated swapped ordered 0 1\nrepeated swapped default 1 0\nrepeated shared ordered 1 0\nrepeated distinct ordered 0 1\nchain ordered 0 2\nchain default 1 1\nrewrite ordered 3 10\nrewrite default 2 10\nsaturate ordered 3 10\nsaturate default 2 10\nexplicit commute true\nRuleTwoWay\nRuleTwoWay\n"
expect_output_not_contains = ["error[", "warning["]

[[tests]]
name = "rewrite_function.ordered_explain"
desc = "why_not reads the stored positional policy for both concrete and generic rules."
case = "../../../cases/modules/rewrite_function/ordered_explain.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "concrete ordered true\ngeneric ordered true\nconcrete default true\ngeneric default true\n"
expect_output_not_contains = ["error[", "warning["]

[[tests]]
name = "rewrite_function.ordered_type_error"
desc = "All three entry points reject a non-bool matching option."
case = "../../../cases/modules/rewrite_function/ordered_type_error.cml"
args = ["${case}"]
expect_exit = 1
expect_output_contains = ["<rewrite:rewrite>: <rules:", "<rewrite:run>: <rules:", "<rewrite:saturate>: <rules:", "ordered: bool"]
verify_script = """
({ input, assert }) => {
    assert((input.normalized.stdout.match(/SemanticDiag::NoMatchingFunction/g) || []).length === 3,
        'each entry point must diagnose the wrong policy type')
}
"""
