id = "h499probe"
order = 9900
tier = "fast"
tags = ["h499", "scratch"]
desc = "Scratch plan for the H499 type-identity lane: the two red cases copied verbatim from their own plans, run alone so a manual reading is affordable. Not committed."

[[tests]]
name = "h499probe.export_fold"
desc = "Copy of modules.onnx export_fold, verbatim."
kind = "behavior"
case = "../../../cases/modules/onnx/export_fold.cml"
args = ["${case}"]
envs = ["ONNX_OUT=${test_tmp}/export_fold.onnx"]
expect_exit = 0
expect_stdout_contains = ["exported"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
async ({ input, assert }) => {
const path = await import('path')
const url = await import('url')
const helper = path.join(input.repo_root, 'test/cases/modules/onnx/onnx_ops.mjs')
const { readOnnxModel } = await import(url.pathToFileURL(helper).href)
const model = readOnnxModel(path.join(input.test_tmp, 'export_fold.onnx'))
const count = (op) => model.ops.filter((o) => o === op).length
assert(count('MatMul') === 3 && count('Relu') === 3 && count('Mul') === 3, `expected 3 unrolled steps, got ${model.ops}`)
assert(count('Reshape') === 1 && count('Identity') === 1, `unexpected tail ops ${model.ops}`)
assert(model.ops.length === 14, `shape arithmetic must fold away, got ${model.ops}`)
assert(model.initializers.includes('w') && model.initializers.includes('b'), `weights not named by field: ${model.initializers}`)
assert(model.inputs.join() === 'input' && model.outputs.join() === 'output', `unexpected graph io ${model.inputs} -> ${model.outputs}`)
}
"""
timeout_ms = 10000

[[tests]]
name = "h499probe.rules.tensor_saturation_keeps_values"
desc = "Copy of modules.rules rules.tensor_saturation_keeps_values, verbatim."
kind = "behavior"
case = "../../../cases/modules/rules/tensor_target.cml"
args = ["${case}", "rules::saturate_all", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["[8.0, 16.0, 24.0]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "h499probe.specialize_growing_shape.fold_specialize.bounded"
desc = "Copy of opt.generic specialize_growing_shape.fold_specialize.bounded, verbatim."
kind = "behavior"
case = "../../../cases/opt/generic/specialize_growing_shape.cml"
args = ["${case}", "std::opt::fold", "std::opt::specialize", "std::stats", "std::fvm"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
async ({ input, assert }) => {
const out = input.normalized.stdout.trim()
const stats = JSON.parse(out.match(/GRAPH_STATS (\{.*\})/)[1])
assert(stats.specializations === 1, `expected one type specialization, got ${stats.specializations}`)
assert(stats.graphs > 5 && stats.graphs <= 120, `unexpected graph count: ${stats.graphs}`)
assert(out.endsWith('[12, 2]\n36.0'), `unexpected output: ${out}`)
}
"""
timeout_ms = 8000