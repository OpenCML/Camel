[[tests]]
name = "json.gc.default.nvm"
desc = "A Json kept across allocation in a frame slot, through a function and in an array of Json is traced (mark-sweep, no forced collection; nvm). As an `any` it was not."
kind = "behavior"
case = "../../../cases/modules/std/json/json_gc.cml"
args = ["${case}", "--arg", "n=20000", "${run_nvm}"]
envs = []
expect_exit = 0
expect_stdout_starts_with = "20000 [alpha, beta, gamma] x-20000\n20000 [v-0, v-1, v-2]"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000

