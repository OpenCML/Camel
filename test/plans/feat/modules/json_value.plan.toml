id = "modules.json_value"
order = 352
tier = "fast"
tags = ["feat", "modules", "json", "gc"]

# json.decode gives a `Json!` (design principles 11.2; modules/json/value.h): a value of a
# definite type whose content describes itself, looked into with the accessors of the json
# module, and traced by both collectors through the types its kinds fix.

[[tests]]
name = "json.value.nvm"
desc = "decode gives a Json! (an error value for text that is not JSON, design principles 11.2); kind, get (by key and by index, chained over Json?), the as_ accessors, decode_as of a Json and of a shape with a Json member, encode and printing (nvm)."
kind = "behavior"
case = "../../../cases/modules/std/json/json_value.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
expect_stdout_starts_with = "{\"none\":null,\"on\":true,\"ratio\":2,\"server\":{\"host\":\"example.org\",\"port\":9000},\"tags\":[\"a\",\"b\",3]}\nobject array true\n9000 8080\nexample.org\na 3\nout of range not a string\n2.0 2 true\n3 [string, string, int]\n[none, on, ratio, server, tags]\nexample.org 9000\n7 {\"any\":[1,{\"x\":null}]} object\n[\"a\",\"b\",3] [true,1.5]\n1.8446744073709552e+19 -3 \"s\"\nerror 9000"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

