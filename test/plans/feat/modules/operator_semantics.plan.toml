id = "modules.operator_semantics"
order = 363
tier = "fast"
tags = ["feat", "modules", "tensor", "math", "semantics"]
desc = "The registration and query interface of operator semantics (camel/core/operator_semantics.h, docs/design/op-semantics section 4): the checks a declaration must pass, the version rules of bind, the declaration epoch, and the numeric semantics declared for the built-in scalar arithmetic, the tensor operators and the math module's operators, as `camel inspect --ops` shows them."

[defaults]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "registration_and_queries"
desc = "test::operator_semantics (test-only): each registration check of design 4.4 rejects one declaration, naming the operator and the reason; a well-formed one is accepted. bind accepts a recorded key of the same major version whose minor version is not above the declared one, and refuses another major version, a higher minor version, an unknown operator and one without semantics. Every accepted declaration increments the epoch, a rejected one leaves it. Permission names, finite_math for its four assumptions."
kind = "behavior"
case = "../../../cases/consistency/values/max_min_special.cml"
args = ["${case}", "test::operator_semantics"]

expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const line = (l) => assert(out.includes(l), `missing: ${l}`)
line('SEMANTICS valid accepted')
line('SEMANTICS traits semtest:derived_pure pure=1 elementwise=0 stateOnly=0 mayFault=0 callsGraphs=0 readsGraphs=0')
line('SEMANTICS traits semtest:derived_pure pure=0 elementwise=0 stateOnly=1 mayFault=0 callsGraphs=0 readsGraphs=0')
line('SEMANTICS derived_calls accepted')
line('SEMANTICS traits semtest:derived_calls pure=0 elementwise=0 stateOnly=0 mayFault=1 callsGraphs=1 readsGraphs=0')
line('SEMANTICS derived_elementwise accepted')
line('SEMANTICS traits semtest:derived_elementwise pure=1 elementwise=1 stateOnly=0 mayFault=1 callsGraphs=0 readsGraphs=0')
line('SEMANTICS derived_faults accepted')
line('SEMANTICS traits semtest:derived_faults pure=1 elementwise=0 stateOnly=0 mayFault=1 callsGraphs=0 readsGraphs=0')
line('SEMANTICS traits semtest:derived_undeclared undeclared')
for (const [check, reason] of [
  ['key_names_other_operator', "'semtest:a' are rejected: its key semtest:b@1.0 names another operator"],
  ['lower_version', 'it would replace semtest:ok@1.2 by the lower version semtest:ok@1.1'],
  ['faults_against_traits', 'it declares faults, but its traits say it never faults'],
  ['bounded_without_ulp', 'a bounded operator declares a positive ulp bound'],
  ['bounded_not_approx', 'a bounded operator is sensitive to approx_math'],
  ['bounded_without_type', 'a bounded operator names the type it computes in'],
  ['exact_with_rounding_permission', 'an exact operator has no rounding for reassociate to change'],
  ['exact_with_ulp', 'an exact operator has no ulp bound'],
  ['rounded_with_ulp', 'a correctly rounded operator has no ulp bound'],
  ['rounded_without_float_type', 'a correctly rounded operator names the type its steps are rounded in'],
  ['opaque_not_sensitive_to_all', 'an opaque operator is sensitive to every permission'],
]) {
  const m = out.match(new RegExp(`SEMANTICS ${check} (.*)`))
  assert(m && m[1].startsWith('rejected:') && m[1].includes(reason), `${check}: ${m ? m[1] : 'missing'}`)
}
line('SEMANTICS key semtest:ok@1.2')
line('SEMANTICS undeclared_key none')
for (const [key, result] of [['semtest:ok@1.0', 'bound'], ['semtest:ok@1.2', 'bound'], ['semtest:ok@1.3', 'refused'],
  ['semtest:ok@2.0', 'refused'], ['semtest:missing@1.0', 'refused'], ['semtest:never@1.0', 'refused'],
  ['semtest:ok@1', 'unparsable'], ['semtest:ok@1.x', 'unparsable']]) {
  line(`SEMANTICS bind ${key} ${result}`)
}
line('SEMANTICS replace_higher accepted')
line('SEMANTICS epoch_increments yes')
line('SEMANTICS epoch_unchanged_on_reject yes')
line("SEMANTICS builtin_key :op/add_d@1.0 protocol=''")
line('SEMANTICS permission finite_math [finite_math]')
line('SEMANTICS permission no_nans [no_nans]')
line('SEMANTICS permission fast unknown')
line('SEMANTICS permissions_text [reassociate, contract, no_nans, no_infs]')
}
"""

[[tests]]
name = "test_pass_is_not_in_a_pipeline"
desc = "test::operator_semantics is a test-only pass: no pipeline adds it, so a run that names no pass prints no check."
kind = "behavior"
case = "../../../cases/consistency/values/max_min_special.cml"
args = ["${case}"]
expect_exit = 0
expect_output_not_contains = ["SEMANTICS"]

[[tests]]
name = "declared_numeric_semantics"
desc = "`camel inspect --ops` shows the declared semantics: the stable key, the numeric class, the type the steps are rounded in, the ulp bound of a bounded operator, the permissions that can change the result, the special values it departs from IEEE on, the faults. Covers the operators a tensor compiler meets first and the built-in scalar arithmetic; an operator without a declaration has no semantics member."
kind = "behavior"
case = "../../../cases/modules/tensor/numeric_contract.cml"
args = ["inspect", "--ops", "${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const ops = input.normalized.stdout.split('\n').filter((l) => l.startsWith('OPERATOR ')).map((l) => JSON.parse(l.slice(9)))
const byUri = new Map(ops.map((o) => [o.uri, o]))
const expect = {
  'tensor:add': ['correctly_rounded', 'f32', ['reassociate', 'contract', 'change_precision', 'finite_math']],
  'tensor:subtract': ['correctly_rounded', 'f32', ['reassociate', 'contract', 'change_precision', 'finite_math']],
  'tensor:multiply': ['correctly_rounded', 'f32', ['reassociate', 'contract', 'change_precision', 'finite_math']],
  'tensor:divide': ['correctly_rounded', 'f32', ['approx_math', 'change_precision', 'finite_math']],
  'tensor:maximum': ['exact', 'f32', ['finite_math']],
  'tensor:minimum': ['exact', 'f32', ['finite_math']],
  'tensor:neg': ['exact', 'f32', ['finite_math']],
  'tensor:abs': ['exact', 'f32', ['finite_math']],
  'tensor:relu': ['exact', 'f32', ['finite_math']],
  'tensor:sqrt': ['correctly_rounded', 'f32', ['approx_math', 'change_precision', 'finite_math']],
  'tensor:rsqrt': ['correctly_rounded', 'f32', ['approx_math', 'change_precision', 'finite_math']],
  'tensor:exp': ['bounded', 'f32', ['approx_math', 'change_precision', 'finite_math']],
  'tensor:log': ['bounded', 'f32', ['approx_math', 'change_precision', 'finite_math']],
  'tensor:sum': ['correctly_rounded', 'f64', ['reassociate', 'change_precision', 'finite_math']],
  'tensor:sum_axis': ['correctly_rounded', 'f64', ['reassociate', 'change_precision', 'finite_math']],
  'tensor:mean': ['correctly_rounded', 'f64', ['reassociate', 'change_precision', 'finite_math']],
  'tensor:mean_axis': ['correctly_rounded', 'f64', ['reassociate', 'change_precision', 'finite_math']],
  'tensor:max_axis': ['exact', 'f32', ['finite_math']],
  'tensor:min_axis': ['exact', 'f32', ['finite_math']],
  'tensor:matmul': ['correctly_rounded', 'f32', ['reassociate', 'change_precision', 'finite_math']],
  'tensor:reshape': ['exact', undefined, []],
  'tensor:transpose': ['exact', undefined, []],
  'tensor:permute': ['exact', undefined, []],
  'tensor:slice': ['exact', undefined, []],
  ':op/add_i': ['exact', undefined, []],
  ':op/add_d': ['correctly_rounded', 'f64', ['reassociate', 'contract', 'change_precision', 'finite_math']],
  ':op/mul_f': ['correctly_rounded', 'f32', ['reassociate', 'contract', 'change_precision', 'finite_math']],
  ':op/div_d': ['correctly_rounded', 'f64', ['approx_math', 'change_precision', 'finite_math']],
  ':op/div_l': ['exact', undefined, []],
  ':op/neg_d': ['exact', 'f64', ['finite_math']],
  ':op/lt_d': ['exact', 'f64', ['finite_math']],
}
for (const [uri, [cls, compute, sensitive]] of Object.entries(expect)) {
  const op = byUri.get(uri)
  assert(op, `operator ${uri} is not listed`)
  const s = op.semantics
  assert(s, `${uri} has no semantics`)
  // Phase 2 added index semantics to the tensor operators: version 1.1 (design 4.1); phase 4
  // a definition to relu and mean: 1.2.
  const version = ['tensor:relu', 'tensor:mean'].includes(uri) ? '1.2' : uri.startsWith('tensor:') ? '1.1' : '1.0'
  assert(s.key === `${uri}@${version}`, `${uri}: key ${s.key}`)
  assert((s.indexing === true) === uri.startsWith('tensor:'), `${uri}: indexing ${s.indexing}`)
  assert(s.numeric === cls, `${uri}: numeric ${s.numeric}, expected ${cls}`)
  assert(s.compute === compute, `${uri}: compute ${s.compute}, expected ${compute}`)
  assert(JSON.stringify(s.sensitive_to) === JSON.stringify(sensitive), `${uri}: sensitive_to ${JSON.stringify(s.sensitive_to)}`)
  assert(typeof s.algorithm === 'string' && s.algorithm.length > 0, `${uri}: no algorithm`)
}
assert(byUri.get('tensor:exp').semantics.ulp === 2 && byUri.get('tensor:log').semantics.ulp === 2, 'exp and log are declared within 2 ulp')
assert(byUri.get('tensor:exp').semantics.not_ieee === undefined && byUri.get('tensor:log').semantics.not_ieee === undefined, 'exp and log keep subnormal results (no departure from IEEE declared)')
assert(JSON.stringify(byUri.get(':op/div_d').semantics.faults) === '["division_by_zero"]', 'scalar float division faults on a zero divisor')
assert(JSON.stringify(byUri.get(':op/add_d').semantics.faults) === '[]', 'scalar float addition never faults')
assert(byUri.get('tensor:matmul').semantics.faults === undefined, 'tensor faults are not declared yet')
assert(byUri.get('tensor:softmax').semantics.numeric === 'opaque' && byUri.get('tensor:softmax').semantics.definition === 'tensor_definitions::softmax(norm 0, norm 1 = -1)', 'softmax declares only its definition (phase 4)')
assert(JSON.stringify(byUri.get('tensor:sum_axis').semantics.laws) === '["sum_axis_f32","sum_axis_i64","sum_axis_bool"]', 'sum_axis declares a law per dtype')
assert(JSON.stringify(byUri.get('tensor:matmul').semantics.laws) === '["fma_f32","mul_add_i64"]', 'matmul laws')
}
"""

[[tests]]
name = "declared_math_numeric_semantics"
desc = "Every operator the math module exports declares its numeric semantics, as `camel inspect --ops` shows them (design principles 7.1; docs/design/op-semantics 6.2; reviews/2026-10-19/modules.cn.md item 15): exact for the integer arithmetic, the bit operations, the sign and rounding operators, min, max, clamp, the tests and the complex accessors and conjugate; correctly rounded for sqrt; bounded for the transcendentals, exp and log within the standard library target of 2 ulp and the others within 4 ulp, complex abs and exp within the platform bound of 4 ulp. pow and hypot declare that they do not always propagate a NaN, as do complex abs and exp. A declaration missing for any math operator fails the completeness check."
kind = "behavior"
case = "../../../cases/modules/stdlib/math_functions.cml"
args = ["inspect", "--ops", "${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const ops = input.normalized.stdout.split('\n').filter((l) => l.startsWith('OPERATOR ')).map((l) => JSON.parse(l.slice(9)))
const mathOps = ops.filter((o) => o.module === 'math')
assert(mathOps.length > 0, 'no math operators are listed')
const APPROX = ['approx_math', 'change_precision', 'finite_math']
const FINITE = ['finite_math']
const NONE = []
const expected = new Map()
const add = (uri, cls, compute, sensitive, ulp, notIeee) => expected.set(uri, { cls, compute, sensitive, ulp, notIeee })
const both = (name, cls, sensitive, ulp) => {
  add(`math:${name}_f`, cls, 'f32', sensitive, ulp)
  add(`math:${name}_d`, cls, 'f64', sensitive, ulp)
}
// Bounded: the standard library target is 2 ulp for exp and log; the other transcendentals
// declare the conservative 4 ulp (the source of each bound is in modules/math/semantics.cpp).
for (const name of ['exp', 'log']) both(name, 'bounded', APPROX, 2)
for (const name of ['sin', 'cos', 'tan', 'asin', 'acos', 'atan', 'sinh', 'cosh', 'tanh',
                    'log2', 'log10', 'log1p', 'expm1']) both(name, 'bounded', APPROX, 4)
for (const name of ['atan2', 'pow', 'hypot']) both(name, 'bounded', APPROX, 4)
// pow(1, NaN) is 1 and hypot(+inf, NaN) is +inf by the C standard: NaN is not propagated.
for (const name of ['pow', 'hypot']) {
  expected.get(`math:${name}_f`).notIeee = ['nans']
  expected.get(`math:${name}_d`).notIeee = ['nans']
}
// Exact float operators: no rounding; only the finite_math assumptions can change the result.
for (const name of ['abs', 'round', 'ceil', 'floor', 'trunc', 'min', 'max', 'clamp', 'sign',
                    'is_nan', 'is_inf']) both(name, 'exact', FINITE)
// Complex: re, im and conj are exact (a part read and a sign flip are not arithmetic); abs is
// hypot and exp is the platform's std::exp(std::complex), bounded by the platform's accuracy of
// the functions they are built from (4 ulp, not the 2 ulp target of the real exp alone).
for (const name of ['re', 'im', 'conj']) {
  add(`math:${name}_c`, 'exact', 'f32', FINITE)
  add(`math:${name}_z`, 'exact', 'f64', FINITE)
}
for (const name of ['abs', 'exp']) {
  add(`math:${name}_c`, 'bounded', 'f32', APPROX, 4)
  add(`math:${name}_z`, 'bounded', 'f64', APPROX, 4)
}
// hypot(+inf, NaN) is +inf and cexp(-inf + i*NaN) is 0: NaN is not always propagated.
for (const uri of ['math:abs_c', 'math:abs_z', 'math:exp_c', 'math:exp_z']) {
  expected.get(uri).notIeee = ['nans']
}
// One correctly rounded square root in the width of the argument.
add('math:sqrt', 'correctly_rounded', 'f32', APPROX)
// Exact integer operators: no rounding and no permission can change the result.
for (const name of ['abs', 'min', 'max', 'clamp', 'sign', 'gcd', 'lcm', 'bit_and', 'bit_or',
                    'bit_xor', 'bit_not', 'bin', 'oct', 'hex']) {
  for (const suffix of ['_i', '_l']) add(`math:${name}${suffix}`, 'exact', undefined, NONE)
}
for (const name of ['shl', 'shr']) add(`math:${name}`, 'exact', undefined, NONE)

for (const op of mathOps) {
  const uri = op.uri
  const e = expected.get(uri)
  assert(e, `math operator ${uri} is not covered by the expected declarations: update this test`)
  const s = op.semantics
  assert(s, `${uri} has no numeric declaration`)
  assert(s.key === `${uri}@1.0`, `${uri}: key ${s.key}`)
  assert(s.numeric === e.cls, `${uri}: numeric ${s.numeric}, expected ${e.cls}`)
  assert(s.compute === e.compute, `${uri}: compute ${s.compute}, expected ${e.compute}`)
  assert(JSON.stringify(s.sensitive_to) === JSON.stringify(e.sensitive), `${uri}: sensitive_to ${JSON.stringify(s.sensitive_to)}`)
  assert(s.ulp === e.ulp, `${uri}: ulp ${s.ulp}, expected ${e.ulp}`)
  assert(JSON.stringify(s.not_ieee) === JSON.stringify(e.notIeee), `${uri}: not_ieee ${JSON.stringify(s.not_ieee)}`)
  assert(typeof s.algorithm === 'string' && s.algorithm.length > 0, `${uri}: no algorithm`)
}
assert(mathOps.length === expected.size, `${mathOps.length} math operators listed, ${expected.size} expected`)
assert(!mathOps.some((o) => o.semantics.indexing), 'no math operator declares index semantics')
}
"""
