args = ["${case}", "test::facts_seed", "std::opt", "test::facts_check"]
envs = ["CAMEL_ENABLE_TEST_PASSES=1"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const line = (l) => assert(out.includes(l + '\n'), `missing: ${l}`)
for (const l of [
  'FACTS graph layer valid=6 revalidated=0 stale=0', 'FACTS graph total valid=4 revalidated=0 stale=0',
  'FACTS graph count.loop1.cond valid=1 revalidated=0 stale=0',
  'FACTS graph main valid=0 revalidated=2 stale=6', 'FACTS gone 0', '60.0',
]) line(l)
assert(/FACTS verify equal=\d+ differ=0\n/.test(out), 'every stored fact equals a fresh computation')
