[[tests]]
name = "persistence_round_trip"
desc = "test::facts_persist: every encodable fact (shapes, reorder freedom, effects: class ii; permissions: class i) is exported in a process-independent form whose text reads back to the same fact; loaded into an empty store against the same program, each is stored (or matches the graph) and equals a fresh computation; after main changes, the facts about main and the root (which refers to it) are refused as 'graph changed' and the others are stored."
kind = "behavior"
case = "../../../cases/facts/tensors_and_loops.cml"
args = ["${case}", "test::facts_persist"]

expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const line = (l) => assert(out.includes(l + '\n'), `missing: ${l}`)
for (const l of [
  'FACTS exported core.shape 13', 'FACTS exported core.reorder 2', 'FACTS exported core.effects 6',
  'FACTS exported core.permissions 1', 'FACTS text round trip 22/22',
  'FACTS imported stored 21', 'FACTS imported matches the graph 1',
  'FACTS loaded equal to a fresh computation 21/21',
  'FACTS reloaded main graph changed 6', 'FACTS reloaded __root__ graph changed 1',
  'FACTS reloaded layer stored 5', 'FACTS reloaded total stored 3', 'FACTS reloaded total matches the graph 1',
  'FACTS reloaded twice stored 5', 'FACTS reloaded count stored 1',
  '60.0',
]) line(l)
assert(!/FACTS reloaded (layer|total|twice|count)\S* graph changed/.test(out), 'unchanged graphs load')
}
"""

[[tests]]
name = "node_versions"
desc = "test::facts_node: a fact of a kind about a node's own version (Dependency::Node, design 4.4) holds across a commit that changed its graph but not the node, where the fact of the conservative rule on the same node goes stale; the node's fact goes stale once the node itself changes. Every fact of that rule is about the record and the inputs of its nodes, so a rewrite that leaves a node where it was keeps its facts however many other nodes it changed."
kind = "behavior"
case = "../../../cases/facts/two_functions.cml"
args = ["${case}", "test::facts_node"]

expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const line = (l) => assert(out.includes(l + '\n'), `missing: ${l}`)
for (const l of [
  'FACTS node_revision new',
  'FACTS node_version kept',
  'FACTS node_other node=valid graph=stale',
  'FACTS node_self node=stale',
  '41',
]) line(l)
}
"""
