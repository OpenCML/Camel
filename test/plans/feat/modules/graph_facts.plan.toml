[[tests]]
name = "inspect_facts"
desc = "camel inspect --facts computes every core kind for the program and prints each fact with its stamp: shapes from types (matmul's [2, 4]; an open shape as rank ?), the index instance of matmul with its fma_f32 law and of a full sum, 'none' where the facts give no instance, reorder freedom (in-order contract for matmul, regroup and permute for the sum under @numeric(reassociate)), effect summaries through loops, a For loop over a constant array of 2 and a While loop, the resources of the nodes that touch any (println writes the console; pure tensor code touches none), and the granted permission (class i, no stamp)."
kind = "behavior"
case = "../../../cases/facts/tensors_and_loops.cml"
args = ["inspect", "--facts", "${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const facts = input.normalized.stdout.split('\n').filter(l => l.startsWith('FACT ')).map(l => JSON.parse(l.slice(5)))
const find = (kind, graph, node) => facts.find(f => f.kind === kind && f.anchors[0].graph === graph && (node === undefined || f.anchors[0].node === node))
const value = (kind, graph, node) => { const f = find(kind, graph, node); assert(f, `no ${kind} at ${graph} ${node}`); return f.value }
assert(value('core.shape', 'layer', 2) === 'f32 [2, 4]', 'matmul shape')
assert(value('core.shape', 'twice', 0) === 'f32 [rank ?]', 'open shape')
assert(value('core.instance', 'layer', 2).includes('law      fma_f32: fma_chain f32 -> f32 -> f32'), 'matmul instance')
assert(value('core.instance', 'total', 1).includes('d0 < s0_0 reduction; d1 < s0_1 reduction'), 'sum instance')
assert(facts.some(f => f.kind === 'core.instance' && f.value === 'none'), 'an instance-less node')
assert(value('core.reorder', 'layer', 2) === 'contract', 'matmul freedom')
assert(value('core.reorder', 'total', 1) === 'regroup, permute', 'sum freedom under reassociate')
assert(value('core.effects', 'count') === 'may fault, may not terminate', 'loop effects')
const loopFor = find('core.loopDomain', 'twice')
assert(loopFor && loopFor.anchors[1].graph === 'twice' && loopFor.value.includes('= 2; element port 2 reads xs(t)'), 'for domain')
assert(value('core.loopDomain', 'count') === 'while: rounds unbounded (no sequence)', 'while domain')
const p = find('core.permissions', 'total', 1)
assert(p && p.value === 'reassociate' && p.class === 'content' && p.stamp === null, 'permissions')
const s = find('core.shape', 'layer', 2).stamp
assert(s.revisions[0].graph === 'layer' && s.epoch === 0 && s.nodes.length === 1 && s.nodes[0].graph === 'layer' && s.nodes[0].node === 2 && /^[0-9a-f]{16}$/.test(s.nodes[0].hash), 'shape stamp: the version of the node, not of a cone')
assert(find('core.instance', 'layer', 2).stamp.epoch > 0, 'instance stamp has the epoch')
assert(facts.some(f => f.kind === 'core.resources' && f.anchors[0].graph === 'main' && f.value === 'write ambient io:stdout; external'), 'println writes the console')
assert(!facts.some(f => f.kind === 'core.resources' && f.anchors[0].graph === 'layer'), 'pure tensor code touches no resource')
}
"""

[[tests]]
name = "rewrite_inline"
desc = "Facts computed before std::opt::inline: the graphs it changed (main, which gets the callees' bodies, the root and twice, which refer to them) read stale, apart from the shapes of the nodes it left where they were: a shape is about a node's own version (Dependency::Node), so it holds although the graph's revision changed (the shapes of the nodes the rewrite did touch read stale); the graphs it did not change keep every fact. Everything stale is computed again and every stored fact then equals a fresh computation. A private loop lowering (as std::fvm does) makes the graphs that held a loop, and those referring to them, new; the others keep their facts."
kind = "behavior"
case = "../../../cases/facts/tensors_and_loops.cml"
args = ["${case}", "test::facts_seed", "std::opt::inline", "test::facts_check"]
envs = ["CAMEL_ENABLE_TEST_PASSES=1"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const line = (l) => assert(out.includes(l + '\n'), `missing: ${l}`)
for (const l of [
  'FACTS seeded core.shape 13', 'FACTS seeded core.instance 5', 'FACTS seeded core.reorder 2',
  'FACTS seeded core.effects 6', 'FACTS seeded core.loopDomain 2', 'FACTS seeded core.resources 4',
  'FACTS graph layer valid=6 revalidated=0 stale=0', 'FACTS graph total valid=4 revalidated=0 stale=0',
  'FACTS graph count valid=2 revalidated=0 stale=0', 'FACTS graph twice valid=7 revalidated=0 stale=0',
  'FACTS graph main valid=2 revalidated=0 stale=9', 'FACTS graph __root__ valid=0 revalidated=0 stale=2',
  'FACTS gone 0',
'FACTS outlined count valid=0 revalidated=0 stale=2', 'FACTS outlined twice valid=1 revalidated=0 stale=6',
  'FACTS outlined layer valid=6 revalidated=0 stale=0',
  '60.0',
]) line(l)
assert(/FACTS verify equal=\d+ differ=0\n/.test(out), 'every stored fact equals a fresh computation')
assert(!out.includes('shared id'), 'one graph per GraphId')
}
"""

