[[tests]]
name = "inspect_facts"
desc = "camel inspect --facts computes every core kind for the program and prints each fact with its stamp: shapes from types (matmul's [2, 4]; an open shape as rank ?), the index instance of matmul with its fma_f32 law and of a full sum, 'none' where the facts give no instance, reorder freedom (in-order contract for matmul, regroup and permute for the sum under @numeric(reassociate)), effect summaries through loops, a For loop over a constant array of 2 and a While loop, and the granted permission (class i, no stamp)."
kind = "behavior"
case = "../../../cases/facts/tensors_and_loops.cml"
args = ["inspect", "--facts", "${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const facts = input.normalized.stdout.split('\n').filter(l => l.startsWith('FACT ')).map(l => JSON.parse(l.slice(5)))
const find = (kind, graph, node) => facts.find(f => f.kind === kind && f.anchors[0].graph === graph && (node === undefined || f.anchors[0].node === node))
const value = (kind, graph, node) => { const f = find(kind, graph, node); assert(f, `no ${kind} at ${graph} ${node}`); return f.value }
assert(value('core.shape', 'layer', 2) === 'f32 [2, 4]', 'matmul shape')
assert(value('core.shape', 'twice', 0) === 'f32 [rank ?]', 'open shape')
assert(value('core.instance', 'layer', 2).includes('law      fma_f32: fma_chain f32 -> f32 -> f32'), 'matmul instance')
assert(value('core.instance', 'total', 1).includes('d0 < s0_0 reduction; d1 < s0_1 reduction'), 'sum instance')
assert(facts.some(f => f.kind === 'core.instance' && f.value === 'none'), 'an instance-less node')
assert(value('core.reorder', 'layer', 2) === 'contract', 'matmul freedom')
assert(value('core.reorder', 'total', 1) === 'regroup, permute', 'sum freedom under reassociate')
assert(value('core.effects', 'count') === 'may fault, may not terminate', 'loop effects')
assert(value('core.effects', 'count.loop1.cond') === 'none', 'pure condition')
const loopFor = find('core.loopDomain', 'twice')
assert(loopFor && loopFor.anchors[1].graph === 'twice.loop1.body' && loopFor.value.includes('= 2; element port 0 reads xs(t)'), 'for domain')
assert(value('core.loopDomain', 'count') === 'while: rounds unbounded (no sequence)', 'while domain')
const p = find('core.permissions', 'total', 1)
assert(p && p.value === 'reassociate' && p.class === 'content' && p.stamp === null, 'permissions')
const s = find('core.shape', 'layer', 2).stamp
assert(s.revisions[0].graph === 'layer' && s.epoch === 0 && /^[0-9a-f]{16}$/.test(s.cone), 'shape stamp')
assert(find('core.instance', 'layer', 2).stamp.epoch > 0, 'instance stamp has the epoch')
}
"""

[[tests]]
name = "rewrite_inline"
desc = "Facts computed before std::inline: the graphs it changed (main, which gets the callees' bodies, the root and twice, which refer to them) read stale, apart from the shapes whose node types did not change (Cone: revalidated); the graphs it did not change keep every fact. Everything stale is computed again and every stored fact then equals a fresh computation. A private loop lowering (as std::fvm does) makes the graphs that held a loop, and those referring to them, new; the loops' own graphs and the others keep their facts."
kind = "behavior"
case = "../../../cases/facts/tensors_and_loops.cml"
args = ["${case}", "test::facts_seed", "std::inline", "test::facts_check"]
envs = ["CAMEL_ENABLE_TEST_PASSES=1"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const line = (l) => assert(out.includes(l + '\n'), `missing: ${l}`)
for (const l of [
  'FACTS seeded core.shape 14', 'FACTS seeded core.instance 5', 'FACTS seeded core.reorder 2',
  'FACTS seeded core.effects 9', 'FACTS seeded core.loopDomain 2',
  'FACTS graph layer valid=6 revalidated=0 stale=0', 'FACTS graph total valid=4 revalidated=0 stale=0',
  'FACTS graph count valid=2 revalidated=0 stale=0', 'FACTS graph twice.loop1.body valid=5 revalidated=0 stale=0',
  'FACTS graph main valid=0 revalidated=2 stale=6', 'FACTS graph __root__ valid=0 revalidated=0 stale=1',
  'FACTS gone 0',
  'FACTS lowered count valid=0 revalidated=0 stale=2', 'FACTS lowered count.loop1.body valid=1 revalidated=0 stale=0',
  'FACTS lowered layer valid=6 revalidated=0 stale=0', 'FACTS lowered twice.loop1.body valid=5 revalidated=0 stale=0',
  '60.0',
]) line(l)
assert(/FACTS verify equal=\d+ differ=0\n/.test(out), 'every stored fact equals a fresh computation')
assert(!out.includes('shared lineage'), 'one graph per lineage')
}
"""

