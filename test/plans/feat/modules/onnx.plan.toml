[[tests]]
name = "resnetbn_train_step_export"
# Slow layer: measured 9.2 s in the full serial run.
tier = "milestone"
desc = "T4: the literal ResNet-18 training step (20 training-mode batch_norms, running statistics as graph I/O) exports, passes onnx.checker(full_check), and matches Camel native execution on every one of the 123 outputs on ONNX Runtime (benchmarks/train.py --check-onnx)."
kind = "behavior"
tool = "python"
case = "../../../../benchmarks/train.py"
args = ["${case}", "--check-onnx", "--models", "resnetbn"]
skip_unless = ["${python}", "-c", "import numpy, onnx, onnxruntime, psutil, torch"]
expect_exit = 0
expect_stdout_contains = ["onnx.checker ok", "onnx training-step check: PASS"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
# The cost bound is this case's own CPU time (user + system) and the timeout is its liveness bound,
# by the rule (docs/handover/reviews/questions-2026-10-23.md,
# "declaration-cost-gate" (a)), quoted in full on resnet_gradient_smooth_vs_torch64 in
# test/plans/feat/modules/autodiff.plan.toml. The case is Python driving 123 ONNX Runtime runs, so
# the reading sums ~5.8 threads and the test's own CPU exceeds its wall clock -- the shape
# test/tools/run-tests.mjs names when it says such a test "states its cost as a `cpu_budget_ms` if
# its total work is what it wants bounded".
#
# Measured with that reading, this plan in full at -Jobs 8 (the 1-minute load on this 32-thread host
# read 120-129 across the window):
#
#   111.99 s of CPU                (2026-10-24 02:39, the slow-layer run of the batch point)
#   121.81 s of CPU / 21.03 s wall  (2026-10-24 05:22, 136 tests, this entry red on the margin only)
#   117.21 s of CPU / 24.97 s wall  (2026-10-24 05:30, the same plan, 136 tests, green under this
#                                    budget; the run waited 210 s for a build slot, another lane)
#
# An 8.8% spread in the CPU figure against the wall clock, which is the neighbours'. The budget is
# 199 s: 1.63x the higher of the two readings it was set from (121.81 s), rounded up, the same
# headroom as the four autodiff budgets taken by this rule, and 1.63x the busiest reading of the
# three as well. It still fails a run whose work has grown by two thirds.
#
# What failed here was never the work: the 2026-10-24 05:22 run exited 0 with `exported in 2.55 s:
# 1125 nodes, onnx.checker ok` and all 123 per-output checks `ok` (`onnx training-step check: PASS`,
# 126 lines of output, nothing on stderr). It was the runner's 4x margin on the timeout -- 300 s / 4
# = 75 s of work allowed against 121.81 s measured -- which reads a timeout as a cost ceiling.
# Declaring the cost puts the timeout back to what it is:
cpu_budget_ms = 199000
# Fires on a hang, not on a slow run: 5 min is 14x the 21.0 s wall the loaded host gives it, and the
# case bounds its own work (each camel run it starts is capped at 600 s, benchmarks/train.py:
# run_camel_full).
timeout_ms = 300000

