[[tests]]
name = "pass_export_equals_export_model"
# Slow layer: measured 15.9 s in the full serial run.
tier = "milestone"
desc = "For twenty-six programs (forward, training steps with sgd/Adam/batch-norm/conv/frozen parameters, an If, dynamic axes, and since the pass finishes simplification with the example shapes: the four branched training steps, the gated GRU forward and its training step, the dynamic-batch mean step, a local variable, a float array literal, gradients through mean and vector matmul, a loop that returns its state with a counter and the gradient of a loss over it) the model written by `std::macro std::opt onnx::export` and the one written by export_model both pass onnx.checker(full_check) and give bit-identical ONNX Runtime outputs on the same inputs (numpy array_equal)."
kind = "behavior"
tool = "python"
case = "../../../cases/modules/onnx/pass_export.py"
args = ["${case}", "equiv"]
skip_unless = ["${python}", "-c", "import numpy, onnx, onnxruntime"]
expect_exit = 0
expect_stdout_contains = ["export_fold.cml: pass: onnx.checker full_check ok", "export_train_step.cml: pass: onnx.checker full_check ok", "onnx::export equiv: PASS"]
expect_output_not_contains = ["array_equal False"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
# CPU time, by the same rule and for the same reason as resnetbn_train_step_export above: this
# case exports twenty-six programs and runs each on ONNX Runtime, so its CPU figure (user + system,
# summed over its threads) is the work and the wall clock is the host's. Measured this plan in full
# at -Jobs 8:
#
#   40.77 s of CPU                (2026-10-24 02:39, the slow-layer run of the batch point)
#   45.60 s of CPU / 25.69 s wall  (2026-10-24 05:22, 136 tests, this entry red on the margin only)
#   46.09 s of CPU / 30.92 s wall  (2026-10-24 05:30, the same plan, 136 tests, green under this
#                                   budget)
#
# A 13% spread in the CPU figure. The budget is 75 s: 1.63x the higher of the two readings it was set
# from (45.60 s), rounded up, and 1.63x the busiest reading of the three as well (46.09 s). The work
# itself was green in the same run: exit 0, 52 `onnx.checker full_check ok` lines and 360 trial
# outputs each `array_equal True` with no `array_equal False` (439 lines), `onnx::export equiv: PASS`.
# What failed was the 4x margin on the timeout, 120 s / 4 = 30 s of work allowed against 45.60 s
# measured.
cpu_budget_ms = 75000
# Fires on a hang, not on a slow run: 2 min is 4.7x the 25.7 s wall the loaded host gives it.
timeout_ms = 120000

[[tests]]
name = "export_ctrl_effect"
desc = "An effect that is only on the control path of the exported function (a println statement of a sync callee, its value reaches no output) is refused at the println by export_model, and no model is written (it used to exit 0 and write a model without the effect)."
kind = "behavior"
case = "../../../cases/modules/onnx/export_ctrl_effect.cml"
args = ["${case}"]
envs = ["ONNX_OUT=${test_tmp}/export_ctrl_effect.onnx"]
expect_exit = 1
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
async ({ input, assert }) => {
const fs = await import('fs')
const path = await import('path')
const text = input.normalized.output
assert(text.includes("impure operator ':io/println' cannot be exported"), 'missing impure-operator detail')
assert(/at [^ ]*export_ctrl_effect[.]cml:14:5[)]/.test(text), 'missing source position of the println')
assert(!text.includes('unreachable'), 'export must fail before the next statement')
assert(!text.includes('EFFECT'), 'the exported function must not be executed')
assert(!fs.existsSync(path.join(input.test_tmp, 'export_ctrl_effect.onnx')), 'a refused export must not write a model')
}
"""
timeout_ms = 10000

