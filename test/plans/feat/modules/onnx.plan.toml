[[tests]]
name = "export_gated_gru_forward"
desc = "E13/T5: a data-dependent branch inside a statically unrolled recurrence (GRU cell update gated on mean(|x_t|), T = 3) exports as standard If operators. The gate at step t+1 depends only on the model input, so the export has always had a choice between copying the continuation into both arms of every branch (2^3 - 1 = 7 Ifs) and deciding each gate after the previous branch joined (one If per gate, 4 with the last cell nested in an arm). H44c's cache that does not own its graphs made the second shape the one the exporter emits: with the optimizer's specialization no longer pinned in the program, the export specializes the continuation once more and hoists the next gate out of the arms. The two shapes compute the same function; the loss the model returns was checked with onnxruntime against the interpreter for the case's input (0.0632271543) and for an all-ones input (0.0852279197), and the count of Ifs and the top-level op list are asserted so a change of shape is noticed. The reading after the specialization fixed point (the ruling of 2026-10-24 evening, item 3, which removed the eight-copy bound) shapes the next gate in the second arm with a `Slice` and a `Reshape` and no `Concat` between them -- an all-constant length folds to one `int64s` initializer -- with the count of Ifs unchanged at 4. (The earlier reading of this same case had a `Concat` there; it came from the parts of a constant literal being concatenated, which the exporter no longer does.)"
kind = "behavior"
case = "../../../cases/modules/onnx/export_gated_gru_forward.cml"
args = ["${case}"]
envs = ["ONNX_OUT=${test_tmp}/export_gated_gru_forward.onnx"]
expect_exit = 0
expect_stdout_contains = ["exported"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
async ({ input, assert }) => {
const path = await import('path')
const url = await import('url')
const fs = await import('fs')
const helper = path.join(input.repo_root, 'test/cases/modules/onnx/onnx_ops.mjs')
const { readOnnxModel } = await import(url.pathToFileURL(helper).href)
const file = path.join(input.test_tmp, 'export_gated_gru_forward.onnx')
const model = readOnnxModel(file)
assert(model.ops.join() === 'Slice,Reshape,Abs,Cast,ReduceMean,Greater,If,Slice,Reshape,Abs,Cast,ReduceMean,Greater,If,MatMul,Add,Mul,Cast,ReduceMean,Identity', `unexpected top-level ops ${model.ops}`)
assert(model.inputs.join() === 'w_ir,w_iz,w_in,w_hr,w_hz,w_hn,b_ir,b_iz,b_in,b_hr,b_hz,b_hn,fc_w,fc_b,input1', `unexpected inputs ${model.inputs}`)
assert(model.outputs.join() === 'output', `unexpected outputs ${model.outputs}`)
// One If per gate decision (three gates, four If nodes: the last cell's branch nests in one arm).
// The exporter keeps the continuation after a branch instead of copying it into both arms when
// the next gate's condition depends only on the model input, which is what it does now that the
// specialization the optimizer made is not pinned in the program (the cache is not an
// owner): the first branch is decided before the second, so the second If sits after it.
const buf = fs.readFileSync(file)
const mark = Buffer.from([0x22, 0x02, 0x49, 0x66])
let ifs = 0, at = 0
while ((at = buf.indexOf(mark, at)) !== -1) { ifs += 1; at += 1 }
assert(ifs === 4, `expected 4 If nodes (one per gate decision), got ${ifs}`)
}
"""
timeout_ms = 6000

