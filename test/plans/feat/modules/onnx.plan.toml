name = "export_loop"
desc = "Two tail recursions whose depth depends on the model input (one bounded by the data alone, one a counter against a data-dependent bound with an argument that never changes) export as two ONNX Loops; the unchanged argument is not a carried value."
kind = "behavior"
case = "../../../cases/modules/onnx/export_loop.cml"
args = ["${case}", "std::macro"]
