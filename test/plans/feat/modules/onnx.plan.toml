[[tests]]
name = "inspect_attribute_fates"
desc = "camel inspect --attrs prints every attribute the tree can write with its fate in the interpreter, the dumps, the ONNX export and Tiles. The check is not vacuous: it prints more than twenty rows, and the rows that decide carry/refuse say so (tensor.kernel=library is carried by ONNX, tensor.kernel=canonical and strict are refused by it)."
kind = "behavior"
case = "../../../cases/modules/onnx/export_fused_linear.cml"
args = ["inspect", "--attrs", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
async ({ input, assert }) => {
const lines = input.normalized.stdout.split('\n')
const rows = lines.filter((l) => l.startsWith('ATTRIBUTE '))
assert(rows.length >= 20, `the table must classify the attributes the modules register, got ${rows.length} rows`)
const row = (prefix) => rows.find((l) => l.startsWith(prefix))
const library = row('ATTRIBUTE tensor.kernel=library')
assert(library && library.includes('interpreter=carried') && library.includes('dump=carried') && library.includes('onnx=carried') && library.includes('tiles=carried'), `tensor.kernel=library is not classified everywhere: ${library}`)
const canonical = row('ATTRIBUTE tensor.kernel=canonical')
assert(canonical && canonical.includes('onnx=refused') && canonical.includes('tiles=carried'), `tensor.kernel=canonical: ${canonical}`)
const strict = row('ATTRIBUTE strict ')
assert(strict && strict.includes('onnx=refused') && strict.includes('tiles=carried'), `strict: ${strict}`)
assert(!lines.some((l) => l.startsWith('UNCLASSIFIED')), 'a normal program must have a complete classification')
}
"""
timeout_ms = 8000

