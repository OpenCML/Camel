const { readOnnxModel } = await import(url.pathToFileURL(helper).href)
const model = readOnnxModel(path.join(input.test_tmp, 'export_loop.onnx'))
// Loops may sit inside an If (the first call is peeled): count every NodeProto op_type
// (field 4 -> key 0x22, length 4) equal to "Loop" in the file.
const fs = await import('fs')
const buf = fs.readFileSync(path.join(input.test_tmp, 'export_loop.onnx'))
const mark = Buffer.from([0x22, 0x04, 0x4c, 0x6f, 0x6f, 0x70])
let loops = 0, at = 0
while ((at = buf.indexOf(mark, at)) !== -1) { loops += 1; at += 1 }
assert(loops === 2, `2 Loop node(s) expected, got ${loops}; top-level ops ${model.ops}`)
assert(model.outputs.length === 2, `two results: ${model.outputs}`)
}
"""
timeout_ms = 8000

