desc = "E13/T5: the training step of a recurrent network whose cell update branches on the step's input (gated GRU, T = 3) exports: weights and input in, the loss and the 14 updated weights out, a decision tree of If operators and no Loop. A branch arm's pullback and the call of it are in the branch's own graph, so the exporter keeps the branch and calls the pullbacks inside its If arms. The numbers are checked by ort_gated_gru_step."
kind = "behavior"
case = "../../../cases/modules/onnx/export_gated_gru_step.cml"
