[[tests]]
name = "export_capability"
desc = "Relu on int64 is valid ONNX but ONNX Runtime's CPU provider has no kernel for it at opset 17: the export fails at the relu call (capability data), while target 'none' writes the model."
kind = "behavior"
case = "../../../cases/modules/onnx/export_capability.cml"
args = ["${case}"]
envs = ["ONNX_OUT=tmp/test/onnx/export_capability.onnx", "ONNX_OUT_UNCHECKED=tmp/test/onnx/export_capability_unchecked.onnx"]
expect_exit = 1
expect_stdout_contains = ["written without the check"]
expect_output_contains = ["(CPUExecutionProvider) has no kernel for Relu on int64 tensors at opset 17", "it has one at opset 18"]
expect_output_not_contains = ["unreachable"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
assert(/at [^ ]*export_capability[.]cml:15:12[)]/.test(input.normalized.output), 'missing source position of the relu call')
}
"""
timeout_ms = 6000

