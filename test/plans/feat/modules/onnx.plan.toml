[[tests]]
name = "export_train_step_dynamic"
desc = "E14/T7: a training step (value_and_grad + sgd) exports with a dynamic batch axis. The batch mean written as sum / shape arithmetic keeps the divisor input-dependent (Shape + Gather + Div instead of a folded constant) and the gradient's broadcast becomes an Expand on a Shape."
kind = "behavior"
case = "../../../cases/modules/onnx/export_train_step_dynamic.cml"
args = ["${case}"]
envs = ["ONNX_OUT=tmp/test/onnx/export_train_step_dynamic.onnx"]
expect_exit = 0
expect_stdout_contains = ["exported"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
async ({ input, assert }) => {
const path = await import('path')
const url = await import('url')
const helper = path.join(input.repo_root, 'test/cases/modules/onnx/onnx_ops.mjs')
const { readOnnxModel } = await import(url.pathToFileURL(helper).href)
const model = readOnnxModel(path.join(input.repo_root, 'tmp/test/onnx/export_train_step_dynamic.onnx'))
assert(model.inputs.join() === 'w1,b1,w2,b2,input1', `unexpected inputs ${model.inputs}`)
assert(model.outputs.join() === 'output_0,output_1_w1,output_1_b1,output_1_w2,output_1_b2', `unexpected outputs ${model.outputs}`)
assert(JSON.stringify(model.inputDims[model.inputs.indexOf('input1')]) === '["batch",2]', `data input must keep a symbolic batch, got ${JSON.stringify(model.inputDims)}`)
assert(model.inputDims[0].join() === '2,3', `weights must stay static, got ${JSON.stringify(model.inputDims)}`)
const count = (op) => model.ops.filter((o) => o === op).length
assert(count('MatMul') === 5, `expected 5 MatMul, got ${model.ops}`)
assert(count('Sub') >= 4, `expected an SGD update per parameter, got ${model.ops}`)
for (const op of ['Shape', 'Gather', 'Div', 'Expand']) {
    assert(model.ops.includes(op), `dynamic batch count/broadcast must lower via ${op}, got ${model.ops}`)
}
const standard = new Set(['MatMul', 'Add', 'Relu', 'Mul', 'ReduceSum', 'Shape', 'Gather', 'Cast', 'Div', 'Expand', 'Transpose', 'Greater', 'Reshape', 'Sub', 'Identity'])
assert(model.ops.every((o) => standard.has(o)), `non-standard op in ${model.ops}`)
assert(model.initializers.length <= 8, `weights must be inputs, not initializers: ${model.initializers}`)
}
"""
timeout_ms = 6000

