[[tests]]
name = "function_branch.operator"
desc = "A branch on a condition that depends on the model input whose arms yield functions, outside the recursion with one recursive call that is exported as loops (the returned function calls the next one twice), is refused at the branch, saying that a function value would be chosen when the model runs. It used to stop with 'the dtype of 'arm_out' is not known statically'. By the operator (default run): the same refusal, as the error of the export_model call, with the position of the construct in its text."
kind = "negative"
case = "../../../cases/modules/onnx/refusals/function_branch.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::RuntimeError"
expect_output_contains = ["a branch on a condition that depends on the model input chooses between functions (its value is a '(x: float[..]) => float[..]')", "function_branch.cml:14:12"]
expect_output_not_contains = ["arm_out"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 60000

[[tests]]
name = "export_var_append"
desc = "export_model of a function that grows an array variable with `acc = acc->append<v>` (the in-place `:op/assn_owned`, design principles 11.3): refused with a located diagnostic naming the append; the program's own run before the export still prints the tensor."
kind = "negative"
case = "../../../cases/modules/onnx/export_var_append.cml"
args = ["${case}", "std::macro"]
envs = ["ONNX_OUT=${test_tmp}/export_var_append.onnx"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::RuntimeError"
expect_diagnostic_line = 22
expect_diagnostic_column = 5
expect_output_contains = ["an array variable is appended to (`acc = acc->append<v>`)", "export_var_append.cml:16:12"]
expect_output_not_contains = ["exported", "internal error", "Segmentation fault"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 6000

[[tests]]
name = "export_take"
desc = "take with a constant index array exports as one Gather on axis 0 with the indices as an i64 initializer; the capture `forward` is inlined and the tail reshape folds to Identity (H20-2)."
kind = "behavior"
case = "../../../cases/modules/onnx/export_take.cml"
args = ["${case}"]
envs = ["ONNX_OUT=${test_tmp}/export_take.onnx"]
expect_exit = 0
expect_stdout_contains = ["exported"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
async ({ input, assert }) => {
const path = await import('path')
const url = await import('url')
const helper = path.join(input.repo_root, 'test/cases/modules/onnx/onnx_ops.mjs')
const { readOnnxModel } = await import(url.pathToFileURL(helper).href)
const model = readOnnxModel(path.join(input.test_tmp, 'export_take.onnx'))
assert(model.ops.includes('Gather'), `expected a Gather, got ${model.ops}`)
assert(model.initializers.includes('ints'), `expected i64 index initializer, got ${model.initializers}`)
assert(model.inputs.join() === 'input' && model.outputs.join() === 'output', `unexpected graph io ${model.inputs} -> ${model.outputs}`)
}
"""
timeout_ms = 10000
