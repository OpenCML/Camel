verify_script = """
async ({ input, assert }) => {
const fs = await import('fs')
const path = await import('path')
const diags = JSON.parse(input.normalized.stdout)
assert(diags.length === 1, `expected one diagnostic, got ${diags.length}`)
const d = diags[0]
assert(d.data.name === 'RuntimeDiag::TranslationRefused' && d.data.stage === 'pass:onnx::export', `unexpected diagnostic ${d.data.name} at stage ${d.data.stage}`)
assert(d.message.includes('is made in an arm of this branch') && d.message.includes('is not known at compile time'), `unexpected message: ${d.message}`)
assert(d.range.start.line === 18 && d.range.start.character === 11 && d.range.end.line === 22, `unexpected range ${JSON.stringify(d.range)}`)
