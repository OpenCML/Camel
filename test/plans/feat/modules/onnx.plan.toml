[[tests]]
name = "export_gated_gru_forward"
desc = "E13/T5: a data-dependent branch inside a statically unrolled recurrence (GRU cell update gated on mean(|x_t|), T = 3) exports as a binary decision tree of standard If operators (2^3 - 1 = 7 counting nested subgraphs)."
kind = "behavior"
case = "../../../cases/modules/onnx/export_gated_gru_forward.cml"
args = ["${case}"]
envs = ["ONNX_OUT=tmp/test/onnx/export_gated_gru_forward.onnx"]
expect_exit = 0
expect_stdout_contains = ["exported"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
async ({ input, assert }) => {
const path = await import('path')
const url = await import('url')
const fs = await import('fs')
const helper = path.join(input.repo_root, 'test/cases/modules/onnx/onnx_ops.mjs')
const { readOnnxModel } = await import(url.pathToFileURL(helper).href)
const file = path.join(input.repo_root, 'tmp/test/onnx/export_gated_gru_forward.onnx')
const model = readOnnxModel(file)
assert(model.ops.join() === 'Slice,Reshape,Abs,ReduceMean,Greater,If,MatMul,Add,Mul,ReduceMean,Identity', `unexpected top-level ops ${model.ops}`)
assert(model.inputs.join() === 'w_ir,w_iz,w_in,w_hr,w_hz,w_hn,b_ir,b_iz,b_in,b_hr,b_hz,b_hn,fc_w,fc_b,input1', `unexpected inputs ${model.inputs}`)
assert(model.outputs.join() === 'output', `unexpected outputs ${model.outputs}`)
// nested decision tree: count every NodeProto op_type (field 4 -> key 0x22, length 2) equal to "If"
const buf = fs.readFileSync(file)
const mark = Buffer.from([0x22, 0x02, 0x49, 0x66])
let ifs = 0, at = 0
while ((at = buf.indexOf(mark, at)) !== -1) { ifs += 1; at += 1 }
assert(ifs === 7, `expected 2^3 - 1 = 7 If nodes in the decision tree, got ${ifs}`)
}
"""
timeout_ms = 6000

