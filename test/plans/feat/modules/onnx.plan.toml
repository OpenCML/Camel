[[tests]]
name = "typed_constant_ends_unrolling.pass"
desc = "A constant typed by a declared struct type that says neither element type nor shape, used inside a recursion, is a constant of that type at every level: the simplification ends and the export succeeds. Before H5 an unnamed struct value was typed by its fields where the constant was visible, so every unrolled level was more precisely typed than the loop, the unrolling never ended, and the export was refused (TranslationRefused, or the unlocated 'Runtime draft encoding failed to allocate ... bytes'). Now the literal is built in its declared type (design principles 5.2) -- a struct type's identity is its declaration -- so the loop is the same at every level. H44b made the specialization table program-level and pinned every copy it made; a recursive call whose argument type got more precise then had its copy inlined into its own copy again, one layer per export round, and the export refused again (96 s in the measured run). H44c's inline history stops that: a call that lies in a copy inlined from a function is not inlined into that copy again, so the loop stays one call and the export finishes in milliseconds. By the pass (std::macro std::opt onnx::export)."
kind = "behavior"
case = "../../../cases/modules/onnx/refusals/unended_unrolling.cml"
args = ["${case}", "std::macro", "std::opt", "onnx::export"]
expect_exit = 0
expect_output_contains = ["onnx::export: wrote"]
expect_output_not_contains = ["did not end", "Runtime draft encoding failed to allocate"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 60000

