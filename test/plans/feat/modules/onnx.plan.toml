verify_script = """
async ({ input, assert }) => {
const path = await import('path')
const url = await import('url')
const fs = await import('fs')
const helper = path.join(input.repo_root, 'test/cases/modules/onnx/onnx_ops.mjs')
const { readOnnxModel } = await import(url.pathToFileURL(helper).href)
const file = path.join(input.test_tmp, 'export_gated_gru_step.onnx')
const model = readOnnxModel(file)
const weights = 'w_ir,w_iz,w_in,w_hr,w_hz,w_hn,b_ir,b_iz,b_in,b_hr,b_hz,b_hn,fc_w,fc_b'
assert(model.inputs.join() === weights + ',input1', `weights and the input must be graph inputs: ${model.inputs}`)
assert(model.outputs.join() === 'output_0,' + weights.split(',').map((w) => 'output_1_' + w).join(), `loss and updated weights must be outputs: ${model.outputs}`)
assert(!model.initializers.some((n) => weights.split(',').includes(n)), `weights must be inputs, not initializers: ${model.initializers}`)
const count = (op) => model.ops.filter((o) => o === op).length
assert(count('If') >= 3, `expected an If per gate decision at the top level, got ${model.ops}`)
assert(count('Loop') === 0, `the recursion over three steps must be unrolled, got ${model.ops}`)
// nested decision tree: every NodeProto op_type (field 4 -> key 0x22, length 2) equal to "If"
const buf = fs.readFileSync(file)
