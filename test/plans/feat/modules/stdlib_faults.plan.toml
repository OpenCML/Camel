id = "modules.stdlib_faults"
order = 370
tier = "fast"
tags = ["feat", "modules", "stdlib", "consistency", "fault"]
desc = "The core standard library: an index or range out of bounds and an argument outside what an operator defines is a located fault, the same on the four back ends"

# Only an operation declared to fail returns an error value (design principles 3.9); out of
# range is a fault. Each case prints a line, faults, and must not print the next line. The
# four back ends agree on exit code, standard output and the diagnostic (name, line, column).
# Each is also run through std::opt: the faulting call has constant arguments and the operator
# is pure, and the fault must still happen when the program runs, at the same place.

[defaults]
kind = "negative"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized", "diagnostics"]
expect_exit = 1
expect_output_not_contains = ["not reached", "Floating point exception", "Segmentation fault", "dumped core"]
expect_stdout_starts_with = "before\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 20000

[[tests]]
name = "stdlib.fault.index"
desc = "A string indexed at its length."
case = "../../../cases/modules/stdlib/fault_index.cml"
expect_diagnostic_name = "RuntimeDiag::IndexOutOfRange"
expect_diagnostic_line = 8

[[tests]]
name = "stdlib.fault.index.opt"
desc = "The same through std::opt."
case = "../../../cases/modules/stdlib/fault_index.cml"
backends = false
args = ["${case}", "std::opt", "std::fvm"]
expect_diagnostic_name = "RuntimeDiag::IndexOutOfRange"
expect_diagnostic_line = 8

