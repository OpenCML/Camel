id = "docs.links"
order = 920
tier = "fast"
tags = ["feat", "docs"]
desc = "The relative links of the reader-facing documents point at files and headings that exist, and the technical index lists every page under docs/technical"

# scripts/check-doc-links.mjs reads the READMEs, the roadmap, the design principles, the CLI
# guides, the language reference, the tutorial, the technical index and the example READMEs,
# and checks every relative link: the file exists and, for a link with a fragment, the target
# has a heading with that anchor. `node scripts/check-doc-links.mjs --all` checks every
# document of the repository. Its `--technical-index` mode covers the other half the link
# check cannot see: a page that was added (or whose row was lost) is not a broken link, it is
# a page no reader reaches. The mode derives the page list from the tree — every *.md under
# docs/technical except the index itself, jit/ included — and fails naming each unlisted page.
#
# scripts/check-doc-snippets.mjs compiles every `cml`/`camel` fence of the reader-facing pages
# with `camel <file> std::gir`, runs the fences that carry a command and a `text` block, and
# compares stdout, the exit code and the diagnostic name. A `graph-dump` fence is compared too:
# the graph pass prints the dump on stdout and the block is checked against it, after `origin`,
# `span` and `srcfile` -- the attributes that say where the file was, not what the graph is -- lose
# their values; a block that does not open the dump is one excerpt of it and must appear in the dump
# as a contiguous run of lines. A fence that is deliberately a fragment, a counter-example, a graph
# dump or compile-only carries an HTML comment marker with a reason. A snippet that a page written
# against the target language shows before the tree can compile it is registered in the script's
# pending list instead: the page carries no mark, the run prints the entry and its reason, and the
# list only shrinks. Cost: 296 snippets in about 5 s
# on the Linux build host, with 8 workers; each snippet runs in its own process because every fence
# can declare its own module and entry. Task reports and dated reviews are records and are not scanned.
#
# scripts/check-doc-links.mjs --citations covers what a link checker cannot see: a `*.md` path
# cited in a code comment, a `.cml` comment, a plan description or README prose is not a Markdown
# link, but it still promises that the file exists. A source citation names a file and a symbol,
# `path#Symbol`, never a line: a line number moves with every edit, so the check reports one as a
# defect instead of verifying it. The file must exist and must name the symbol; an ambiguous short
# name is resolved by the symbol. A run that verified no citation fails, so a green run checked
# something. What the check cannot know is whether the symbol still supports the sentence.
#
# Both whole-tree modes walk a checkout that on a developer's machine holds what a build, a Python
# environment and a dependency download left there: `.venv`, `venv`, `.cache`, `.ccache`,
# `__pycache__` and `vendor` are not content of the repository -- git ignores all of them -- and on
# the machine where this was measured two of them (a `.venv` of 29,926 files and a `.cache` of
# 15,481) made a `--citations` run take longer than ten minutes and get reported as a hang, while
# two headers of `vendor` send the citation patterns into catastrophic backtracking (208.5 s and
# 82.7 s in the symbol pattern, 205.7 s and 82.8 s in the line pattern, for zero matches) and the
# vendored trees report citations of this repository that nobody made. So SKIP_DIRS names them, and
# `--self-test` is that property as a case: it writes a miniature checkout beside one directory per
# name that must be skipped, each holding a citation of a missing file, and fails if any of them is
# read or if the walk stops reading the checkout. The names are written down in the case rather
# than read from SKIP_DIRS, so it is red the moment a name leaves that set.
#

[[tests]]
name = "docs.links.reader_facing"
desc = "No broken relative link or anchor in the reader-facing documents."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--default-roots"]
expect_exit = 0
expect_stdout_contains = ["no broken links in"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000

[[tests]]
name = "docs.links.technical_index"
desc = "Every page under docs/technical (jit/ included, except the index itself) has a row in docs/technical/README.md; the page list is derived from the tree, so a page cannot be added, or its row lost, without the check naming it."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--technical-index"]
expect_exit = 0
expect_stdout_contains = ["every page under docs/technical is listed in docs/technical/README.md"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000

[[tests]]
name = "docs.links.questions_index"
desc = "The pending table of docs/handover/questions is what the generator writes: the same function builds the page from the directory -- one row per page, the title of the page as its sentence, the header counting the directory -- and the check compares the file with that text, so a hand edit is a red naming the line and printing both versions. No count is kept beside the directory to fall out of step with it, which is why the table is generated rather than written and then compared."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--questions-index"]
expect_exit = 0
expect_stdout_contains = ["the pending table lists", "as the header says"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000

[[tests]]
name = "docs.links.citations"
desc = "Every cited file exists and every path#Symbol citation names a symbol in that file; a citation with a line number is a defect."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--citations"]
expect_exit = 0
expect_stdout_contains = ["no unverified citation", "symbol citation(s) verified"]
normalizers = ["normalize_newlines"]
timeout_ms = 30000

[[tests]]
name = "docs.links.citations_symbol"
desc = "A path#Symbol citation whose file exists and names the symbol passes, and the run reports the count."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--citations", "--root", "test/plans/feat/docs_links/fixture/symbol/good"]
expect_exit = 0
expect_stdout_contains = ["1 of 1 symbol citation(s) verified"]
normalizers = ["normalize_newlines"]
timeout_ms = 30000

[[tests]]
name = "docs.links.citations_missing_symbol"
desc = "A cited file that does not name the symbol fails, naming the citing file and line, the citation and which half is missing."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--citations", "--root", "test/plans/feat/docs_links/fixture/symbol/missing-symbol"]
expect_exit = 1
expect_stdout_contains = ["notes.md:3: 'src/thing.c#Missing': the file exists but does not name 'Missing'"]
normalizers = ["normalize_newlines"]
timeout_ms = 30000

[[tests]]
name = "docs.links.citations_missing_file"
desc = "A cited file that does not exist fails, naming the citing file and line, the citation and which half is missing."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--citations", "--root", "test/plans/feat/docs_links/fixture/symbol/missing-file"]
expect_exit = 1
expect_stdout_contains = ["notes.md:3: 'src/nope.c#Thing': no such file"]
normalizers = ["normalize_newlines"]
timeout_ms = 30000

[[tests]]
name = "docs.links.citations_line_number"
desc = "A citation that names a line fails and asks for a symbol, because a line number moves with every edit."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--citations", "--root", "test/plans/feat/docs_links/fixture/symbol/line"]
expect_exit = 1
expect_stdout_contains = ["notes.md:3: 'src/thing.c:2': names a line; cite 'src/thing.c#Symbol' instead"]
normalizers = ["normalize_newlines"]
timeout_ms = 30000

[[tests]]
name = "docs.links.citations_empty"
desc = "A scan that finds no citation at all exits 2: a check of nothing is not a pass."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--citations", "--root", "test/plans/feat/docs_links/fixture/symbol/empty"]
expect_exit = 2
expect_stdout_contains = ["no citation in 1 file(s): nothing was checked"]
normalizers = ["normalize_newlines"]
timeout_ms = 30000

[[tests]]
name = "docs.links.citations_skip_local_caches"
desc = "A virtual environment, a tool cache and a dependency tree beside the checkout are not scanned and the checkout still is: a tree with one page, one source file and one directory per name that must be skipped -- each cache file citing a file that does not exist -- is verified whole. The three readings it pins: green it prints `1 of 1 symbol citation(s) verified, 1 path citation(s) across 3 file(s)` and exits 0; with the set emptied it reports 30 unverified citations and exits 1; with `.venv` alone dropped it reports 2 and names `.venv/lib/ghost.ts`. So the case is red when a name leaves the skip set, and also when the walk stops reading real files (a count that is not the three the miniature checkout holds). It is the reading that failed before: 45,407 files and 1.87 GB of cache plus two backtracing vendored headers turned a four-second walk into a run that had not finished after three quarters of an hour."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--self-test"]
expect_exit = 0
expect_stdout_contains = ["were not scanned", "1 of 1 symbol citation(s) verified, 1 path citation(s) across 3 file(s)"]
normalizers = ["normalize_newlines"]
timeout_ms = 30000

[[tests]]
name = "docs.snippets_compile"
desc = "Every Camel fence in a reader-facing page compiles; when the fence has a command and a text block it runs and prints that text. Incomplete or deliberately wrong fences carry a marker with a reason."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-snippets.mjs"
# `${camel}` is the compiler of the build under test, named as an argument.
args = ["${case}", "--default-roots", "--camel", "${camel}"]
expect_exit = 0
expect_stdout_contains = ["no stale snippet in"]
normalizers = ["normalize_newlines"]
timeout_ms = 120000

[[tests]]
name = "docs.snippets_dump_is_compared"
desc = "A `graph-dump` fence's text block is checked against the dump the graph pass prints: a page whose dump is not its program's graph fails, naming the first line that differs."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-snippets.mjs"
args = ["${case}", "test/plans/feat/docs_links/fixture/snippets/dump_stale.md", "--camel", "${camel}"]
expect_exit = 1
expect_stdout_contains = ["the graph differs from the text block", "line 2:"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000

[[tests]]
name = "docs.snippets_dump_excerpt_matches_up_to_renumbering"
desc = "An excerpt does not compare node numbers: the block below names the dump's nodes and its cluster differently, and one one-to-one renaming makes it a run of the dump, so the page holds."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-snippets.mjs"
args = ["${case}", "test/plans/feat/docs_links/fixture/snippets/dump_renumbered.md", "--camel", "${camel}"]
expect_exit = 0
expect_stdout_contains = ["no stale snippet in"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000

[[tests]]
name = "docs.snippets_dump_excerpt_different_operator_fails"
desc = "The renaming is about numbers only: an excerpt that calls a node by the wrong operator occurs nowhere in the dump, however its numbers are renamed, and fails."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-snippets.mjs"
args = ["${case}", "test/plans/feat/docs_links/fixture/snippets/dump_content_differs.md", "--camel", "${camel}"]
expect_exit = 1
expect_stdout_contains = ["the graph differs from the text block", "occurs nowhere"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000

[[tests]]
name = "docs.snippets_dump_excerpt_number_may_not_be_reused"
desc = "One page number may not become two dump numbers: an excerpt that writes one number on two different nodes has no one-to-one renaming and fails, so the rule is not a licence to drop a node."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-snippets.mjs"
args = ["${case}", "test/plans/feat/docs_links/fixture/snippets/dump_number_reused.md", "--camel", "${camel}"]
expect_exit = 1
expect_stdout_contains = ["the graph differs from the text block", "not one run of them"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000

[[tests]]
name = "docs.diagnostics_catalog"
desc = "No two diagnostics share a code: the catalogue is the one place a code is written down, and a second name on a value means one of the two is never emitted."
kind = "behavior"
tool = "node"
case = "../../../scripts/diagnostics-catalog.mjs"
args = ["${case}", "--check"]
expect_exit = 0
expect_stdout_contains = ["no value used twice"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000

[[tests]]
name = "docs.no_unfinished_merge_left_in_the_tree"
desc = "No tracked text file carries the leftovers of an unfinished merge: a hunk head, a diff3 base block, a separator or a tail. The gate we typed by hand before this only looked for the head, and on 2026-11-02 a merge that had been aborted was committed as 407a7ee9f with test/plans/feat/trans/cml.plan.toml still holding its `||||||| bbc9b2b65` base block -- a file that parses far enough to be reported as a case. A bare `=======` is not a marker by itself (in Markdown it is a setext heading underline), so it counts only where a hunk head precedes it in the same block."
kind = "behavior"
tool = "node"
case = "../../../scripts/conflict-markers.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["no conflict markers", "hunk head, a base block, a separator or a tail"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000

[[tests]]
name = "docs.no_unfinished_merge_pattern_sees_all_four_forms"
desc = "The marker rule's reverse reading: on a probe file carrying all four forms, this rule catches four lines and the old one-line `git grep '^<<<<<<< '` catches one, so the rule is known to catch 407a7ee9f's shape rather than merely passing on a clean tree."
kind = "behavior"
tool = "node"
case = "../../../scripts/conflict-markers.mjs"
args = ["${case}", "--self-test"]
expect_exit = 0
expect_stdout_contains = ["catches 4 line(s)", "the old one-liner catches 1", "misses three of the four forms"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000

# A law's cotangent port and the body written against it. Nothing compared the two sentences until
# this case: on 2026-11-04 `lane-rank0` measured 8 of 8 runs dying in `numelKernel`, because a law
# handed `numel` a value the port had promised as something else, and neither the index nor the
# transform had an opinion about the pair. `scripts/law-cotangent-ports.mjs` reads the laws of
# `stdlib/rulesets` as text -- no build, no compiler -- and states, for each port, which requirement
# the body's uses put on it and where that requirement is written down (`stdlib/tensor.cml#numel`
# for an array, the module's own `spread_over` for an element). The three readings below are the
# three the change was accepted on: the tree's own laws, and the two directions of one disagreement.
#
# The axis the crash itself was on -- the type the transform hands a law at build time -- is not
# reachable from a source-only check and is recorded, with its measurement, in
# `docs/handover/questions/2026-11-04-where-a-laws-port-disagrees-with-the-value-it-is-handed.cn.md`.

[[tests]]
name = "docs.every_laws_port_agrees_with_its_body"
desc = "Every law of `stdlib/rulesets` states ports that the body uses at the same kind: an element port handed to a scalar helper or to `spread_over`, an array port handed to `numel` or one of the `*_cotangent` helpers that read a length, and -- the one pair that is not a disagreement -- an element port handed to a parameter declared as that same element's open rank with no prefix, which design principles 5.4 makes one value and the language boxes at the argument position. The run prints how many laws and ports it read and how many it could not witness at all -- a port the body only returns, or only multiplies by a value of unknown shape, is counted as unwitnessed rather than passed."
kind = "behavior"
tool = "node"
case = "../../../scripts/law-cotangent-ports.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["no law's port disagrees with its body or its left side", "law(s) in"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000

[[tests]]
name = "docs.a_port_and_its_body_disagreeing_are_caught_both_ways"
desc = "The reverse reading, so the rule cannot be a blanket: on probe modules this script writes under the system temp directory, an element port whose body hands it to a parameter of three elements is reported with the declaration that makes it a requirement (`element_port_fixed_extent.cml#three_lanes`, `ct: T[3]` -- a fixed extent reads more than one element, and the rank-zero box is one wide), an array port handed to `spread_over` is reported as the other direction, the rank-zero equivalence (`T` handed to `ct: T[...]`, design principles 5.4) and the two laws of the library written the same way are not reported at all, and the one shape this check cannot open -- a helper whose body reads a length and assumes more than one element -- is printed as measured rather than caught."
kind = "behavior"
tool = "node"
case = "../../../scripts/law-cotangent-ports.mjs"
args = ["${case}", "--self-test"]
expect_exit = 0
expect_stdout_contains = ["cotangent port is 'T' but the body hands it to 'three_lanes', which reads an array", "cotangent port is 'T[...]' but the body hands it to 'spread_over', which takes an element", "a port 'T' handed to a parameter 'T[3]' is reported", "the rank-zero pair 'T' -> 'T[...]' is not reported", "the helper that reads a length and assumes more than one element is NOT reported -- the assumption is inside the helper", "both disagreements are caught, the rank-zero equivalence and the clean pair are not, so the reading is a rule and not a blanket"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000

[[tests]]
name = "docs.an_element_port_may_enter_the_same_elements_open_rank"
desc = "The allowance read on the library itself: `stdlib/rulesets/transpose.cml#mean_axis_stated_t` states its cotangent as `T` and hands it to `mean_axis_cotangent(ct: T[...])`, which `--explain` reads as the rank-zero equivalence of design principles 5.4 rather than as a disagreement -- one value read either way, the box made where it enters the array position (`ArrayType::castSlotFrom`, the exporter's `rt::Array<T>::element`). The row is pinned so the day the allowance widens or the law's port changes spelling, the table says so; the ruling is `docs/handover/questions/2026-11-04-narrow-the-declaration-or-teach-the-consumer.cn.md`."
kind = "behavior"
tool = "node"
case = "../../../scripts/law-cotangent-ports.mjs"
args = ["${case}", "--explain"]
expect_exit = 0
expect_stdout_contains = ["mean_axis_stated_t", "stdlib/rulesets/transpose.cml#mean_axis_cotangent, parameter 1 `ct: T[...]`", "the rank-zero array of 5.4, one value read either way"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000