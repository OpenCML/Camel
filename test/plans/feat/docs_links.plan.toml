id = "docs.links"
order = 920
tier = "fast"
tags = ["feat", "docs"]
desc = "The relative links of the reader-facing documents point at files and headings that exist, and the technical index lists every page under docs/technical"

# scripts/check-doc-links.mjs reads the READMEs, the roadmap, the design principles, the CLI
# guides, the language reference, the tutorial, the technical index and the example READMEs,
# and checks every relative link: the file exists and, for a link with a fragment, the target
# has a heading with that anchor. `node scripts/check-doc-links.mjs --all` checks every
# document of the repository. Its `--technical-index` mode covers the other half the link
# check cannot see: a page that was added (or whose row was lost) is not a broken link, it is
# a page no reader reaches. The mode derives the page list from the tree — every *.md under
# docs/technical except the index itself, jit/ included — and fails naming each unlisted page.
#
# scripts/check-doc-snippets.mjs compiles every `cml`/`camel` fence of the reader-facing pages
# with `camel <file> std::gir`, runs the fences that carry a command and a `text` block, and
# compares stdout, the exit code and the diagnostic name. A fence that is deliberately a
# fragment, a counter-example, a graph dump or compile-only carries an HTML comment marker
# with a reason. A snippet that a page written against the target language shows before the tree
# can compile it is registered in the script's pending list instead: the page carries no mark, the
# run prints the entry and its reason, and the list only shrinks. Cost: 254 snippets in about 4 s
# on the Linux build host, with 8 workers; each snippet runs in its own process because every fence
# can declare its own module and entry. Task reports and dated reviews are records and are not scanned.
#
# scripts/check-doc-links.mjs --citations covers what a link checker cannot see: a `*.md` path
# cited in a code comment, a `.cml` comment, a plan description or README prose is not a Markdown
# link, but it still promises that the file exists. A source citation names a file and a symbol,
# `path#Symbol`, never a line: a line number moves with every edit, so the check reports one as a
# defect instead of verifying it. The file must exist and must name the symbol; an ambiguous short
# name is resolved by the symbol. A run that verified no citation fails, so a green run checked
# something. What the check cannot know is whether the symbol still supports the sentence.
#

[[tests]]
name = "docs.links.reader_facing"
desc = "No broken relative link or anchor in the reader-facing documents."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--default-roots"]
expect_exit = 0
expect_stdout_contains = ["no broken links in"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000

[[tests]]
name = "docs.links.technical_index"
desc = "Every page under docs/technical (jit/ included, except the index itself) has a row in docs/technical/README.md; the page list is derived from the tree, so a page cannot be added, or its row lost, without the check naming it."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--technical-index"]
expect_exit = 0
expect_stdout_contains = ["every page under docs/technical is listed in docs/technical/README.md"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000

[[tests]]
name = "docs.links.citations"
desc = "Every cited file exists and every path#Symbol citation names a symbol in that file; a citation with a line number is a defect."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--citations"]
expect_exit = 0
expect_stdout_contains = ["no unverified citation", "symbol citation(s) verified"]
normalizers = ["normalize_newlines"]
timeout_ms = 30000

[[tests]]
name = "docs.links.citations_symbol"
desc = "A path#Symbol citation whose file exists and names the symbol passes, and the run reports the count."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--citations", "--root", "test/plans/feat/docs_links/fixture/symbol/good"]
expect_exit = 0
expect_stdout_contains = ["1 of 1 symbol citation(s) verified"]
normalizers = ["normalize_newlines"]
timeout_ms = 30000

[[tests]]
name = "docs.links.citations_missing_symbol"
desc = "A cited file that does not name the symbol fails, naming the citing file and line, the citation and which half is missing."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--citations", "--root", "test/plans/feat/docs_links/fixture/symbol/missing-symbol"]
expect_exit = 1
expect_stdout_contains = ["notes.md:3: 'src/thing.c#Missing': the file exists but does not name 'Missing'"]
normalizers = ["normalize_newlines"]
timeout_ms = 30000

[[tests]]
name = "docs.links.citations_missing_file"
desc = "A cited file that does not exist fails, naming the citing file and line, the citation and which half is missing."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--citations", "--root", "test/plans/feat/docs_links/fixture/symbol/missing-file"]
expect_exit = 1
expect_stdout_contains = ["notes.md:3: 'src/nope.c#Thing': no such file"]
normalizers = ["normalize_newlines"]
timeout_ms = 30000

[[tests]]
name = "docs.links.citations_line_number"
desc = "A citation that names a line fails and asks for a symbol, because a line number moves with every edit."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--citations", "--root", "test/plans/feat/docs_links/fixture/symbol/line"]
expect_exit = 1
expect_stdout_contains = ["notes.md:3: 'src/thing.c:2': names a line; cite 'src/thing.c#Symbol' instead"]
normalizers = ["normalize_newlines"]
timeout_ms = 30000

[[tests]]
name = "docs.links.citations_empty"
desc = "A scan that finds no citation at all exits 2: a check of nothing is not a pass."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--citations", "--root", "test/plans/feat/docs_links/fixture/symbol/empty"]
expect_exit = 2
expect_stdout_contains = ["no citation in 1 file(s): nothing was checked"]
normalizers = ["normalize_newlines"]
timeout_ms = 30000

[[tests]]
name = "docs.snippets_compile"
desc = "Every Camel fence in a reader-facing page compiles; when the fence has a command and a text block it runs and prints that text. Incomplete or deliberately wrong fences carry a marker with a reason."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-snippets.mjs"
# `${camel}` is the compiler of the build under test, named as an argument.
args = ["${case}", "--default-roots", "--camel", "${camel}"]
expect_exit = 0
expect_stdout_contains = ["no stale snippet in"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000

[[tests]]
name = "docs.diagnostics_catalog"
desc = "No two diagnostics share a code: the catalogue is the one place a code is written down, and a second name on a value means one of the two is never emitted."
kind = "behavior"
tool = "node"
case = "../../../scripts/diagnostics-catalog.mjs"
args = ["${case}", "--check"]
expect_exit = 0
expect_stdout_contains = ["no value used twice"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000
