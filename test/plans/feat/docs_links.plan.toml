id = "docs.links"
order = 920
tier = "fast"
tags = ["feat", "docs"]
desc = "The relative links of the reader-facing documents point at files and headings that exist, and the technical index lists every page under docs/technical"

# scripts/check-doc-links.mjs reads the READMEs, the roadmap, the design principles, the CLI
# guides, the language reference, the tutorial, the technical index and the example READMEs,
# and checks every relative link: the file exists and, for a link with a fragment, the target
# has a heading with that anchor. `node scripts/check-doc-links.mjs --all` checks every
# document of the repository. Its `--technical-index` mode covers the other half the link
# check cannot see: a page that was added (or whose row was lost) is not a broken link, it is
# a page no reader reaches. The mode derives the page list from the tree — every *.md under
# docs/technical except the index itself, jit/ included — and fails naming each unlisted page.
#
# scripts/check-doc-snippets.mjs compiles every `cml`/`camel` fence of the reader-facing pages
# with `camel <file> std::gir`, runs the fences that carry a command and a `text` block, and
# compares stdout, the exit code and the diagnostic name. A fence that is deliberately a
# fragment, a counter-example, a graph dump or compile-only carries an HTML comment marker
# with a reason. Cost: 211 snippets in about 2 s on the Linux build host, with 8 workers; each
# snippet runs in its own process because every fence can declare its own module and entry.
# Task reports and dated reviews are records and are not scanned.
#
# scripts/check-doc-links.mjs --citations covers what a link checker cannot see: a `*.md` path
# cited in a code comment, a `.cml` comment, a plan description or README prose is not a Markdown
# link, but it still promises that the file exists. The mode reads every page, plan and code
# comment of the tree, resolves each citation (relative to the citing file, to the repository
# root, or by a file name that exists in the tree) and fails naming the file, the line and the
# target. It prints how many citations it examined, and a run that examined none fails.
#

[[tests]]
name = "docs.links.reader_facing"
desc = "No broken relative link or anchor in the reader-facing documents."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--default-roots"]
expect_exit = 0
expect_stdout_contains = ["no broken links in"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000

[[tests]]
name = "docs.links.technical_index"
desc = "Every page under docs/technical (jit/ included, except the index itself) has a row in docs/technical/README.md; the page list is derived from the tree, so a page cannot be added, or its row lost, without the check naming it."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--technical-index"]
expect_exit = 0
expect_stdout_contains = ["every page under docs/technical is listed in docs/technical/README.md"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000

[[tests]]
name = "docs.links.citations"
desc = "Every *.md path cited in a page, a plan or a code comment resolves to a file in the tree; the check names the citing file, the line and the target, reports how many citations it examined, and fails when it examined none."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--citations"]
expect_exit = 0
expect_stdout_contains = ["no missing citation target in"]
normalizers = ["normalize_newlines"]
timeout_ms = 30000

[[tests]]
name = "docs.snippets_compile"
desc = "Every Camel fence in a reader-facing page compiles; when the fence has a command and a text block it runs and prints that text. Incomplete or deliberately wrong fences carry a marker with a reason."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-snippets.mjs"
args = ["${case}", "--default-roots"]
expect_exit = 0
expect_stdout_contains = ["no stale snippet in"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000
