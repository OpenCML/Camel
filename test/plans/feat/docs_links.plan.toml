id = "docs.links"
order = 920
tier = "fast"
tags = ["feat", "docs"]
desc = "The relative links of the reader-facing documents point at files and headings that exist, and the technical index lists every page under docs/technical"

# scripts/check-doc-links.mjs reads the READMEs, the roadmap, the design principles, the CLI
# guides, the language reference, the tutorial, the technical index and the example READMEs,
# and checks every relative link: the file exists and, for a link with a fragment, the target
# has a heading with that anchor. `node scripts/check-doc-links.mjs --all` checks every
# document of the repository. Its `--technical-index` mode covers the other half the link
# check cannot see: a page that was added (or whose row was lost) is not a broken link, it is
# a page no reader reaches. The mode derives the page list from the tree — every *.md under
# docs/technical except the index itself, jit/ included — and fails naming each unlisted page.
#
# scripts/check-doc-snippets.mjs compiles every `cml`/`camel` fence of the reader-facing pages
# with `camel <file> std::gir`, runs the fences that carry a command and a `text` block, and
# compares stdout, the exit code and the diagnostic name. A fence that is deliberately a
# fragment, a counter-example, a graph dump or compile-only carries an HTML comment marker
# with a reason. Cost: 211 snippets in about 2 s on the Linux build host, with 8 workers; each
# snippet runs in its own process because every fence can declare its own module and entry.
# Task reports and dated reviews are records and are not scanned.
#
# scripts/check-doc-links.mjs --citations covers what a link checker cannot see: a `*.md` path
# cited in a code comment, a `.cml` comment, a plan description or README prose is not a Markdown
# link, but it still promises that the file exists. A `file:line` or `file:start-end` citation
# promises more: that the cited line holds what the sentence says. It carries that proof as a
# trailing anchor, `path:12 # "text on that line"`, and the mode fails when the anchor is not in
# the cited range, naming the citing file and line, what the line holds, what was claimed and,
# when the text moved, the line that now holds it. A citation with no anchor fails too: the mode
# will not certify a claim it cannot read. `--allow-unanchored` is the explicit exception used by
# the first case below, for the line citations that predate the convention: it lists each one with
# the line it holds, so the debt is visible in every run instead of being blessed. A run that
# verified none fails, so a green run always checked something.
#

[[tests]]
name = "docs.links.reader_facing"
desc = "No broken relative link or anchor in the reader-facing documents."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--default-roots"]
expect_exit = 0
expect_stdout_contains = ["no broken links in"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000

[[tests]]
name = "docs.links.technical_index"
desc = "Every page under docs/technical (jit/ included, except the index itself) has a row in docs/technical/README.md; the page list is derived from the tree, so a page cannot be added, or its row lost, without the check naming it."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--technical-index"]
expect_exit = 0
expect_stdout_contains = ["every page under docs/technical is listed in docs/technical/README.md"]
normalizers = ["normalize_newlines"]
timeout_ms = 20000

[[tests]]
name = "docs.links.citations"
desc = "Every citation that carries a quoted anchor points at a range that holds that text; a wrong line fails naming the citing file, the line, what the line holds, what was claimed and where the text is; the citations that predate the convention are listed, not certified, by --allow-unanchored; a run that verified none fails."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--citations", "--allow-unanchored"]
expect_exit = 0
expect_stdout_contains = ["no unverified anchored citation"]
normalizers = ["normalize_newlines"]
timeout_ms = 30000

[[tests]]
name = "docs.links.citations_unverifiable"
desc = "A line citation with no quoted anchor fails by default, naming the citing file, the cited line and what the line holds; the run verified nothing and does not report a pass."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--citations", "--root", "test/plans/feat/docs_links/fixture/unverifiable"]
expect_exit = 1
expect_stdout_contains = ["notes.md:3: 'src/thing.c:3': cannot be verified: no quoted anchor; the cited line holds \"int value = 2;\"", "1 unverified citation(s) in 1 line citation(s)"]
normalizers = ["normalize_newlines"]
timeout_ms = 30000

[[tests]]
name = "docs.links.citations_anchor"
desc = "A citation one line off fails: the fixture's second citation claims text that is on line 3 while pointing at line 4, and the check names the citing file, the cited line, what the line holds, what was claimed and the line that holds the text; the citation that does match in the same fixture is not reported."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-links.mjs"
args = ["${case}", "--citations", "--root", "test/plans/feat/docs_links/fixture/anchored"]
expect_exit = 1
expect_stdout_contains = ["wrong.md:5: 'src/thing.c:4': line 4 holds \"int value = 3;\"", "the citation claims \"int value = 2;\"", "that text is at line 3", "1 unverified citation(s) in 3 line citation(s)"]
expect_stdout_not_contains = ["good.md:", "wrong.md:3:"]
normalizers = ["normalize_newlines"]
timeout_ms = 30000

[[tests]]
name = "docs.snippets_compile"
desc = "Every Camel fence in a reader-facing page compiles; when the fence has a command and a text block it runs and prints that text. Incomplete or deliberately wrong fences carry a marker with a reason."
kind = "behavior"
tool = "node"
case = "../../../scripts/check-doc-snippets.mjs"
args = ["${case}", "--default-roots"]
expect_exit = 0
expect_stdout_contains = ["no stale snippet in"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000

[[tests]]
name = "docs.diagnostics_catalog"
desc = "No two diagnostics share a code: the catalogue is the one place a code is written down, and a second name on a value means one of the two is never emitted."
kind = "behavior"
tool = "node"
case = "../../../scripts/diagnostics-catalog.mjs"
args = ["${case}", "--check"]
expect_exit = 0
expect_stdout_contains = ["no value used twice"]
normalizers = ["normalize_newlines"]
timeout_ms = 60000
