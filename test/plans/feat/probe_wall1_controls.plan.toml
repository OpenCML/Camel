id = "probe_wall1_controls"
order = 9919
tier = "fast"
tags = ["probe", "wal1", "vjp", "autodiff"]

# SCRATCH PROBE (lane-s2wall): three controls that separate "an array has no tangent pair" from
# "a captured value stops the lift" and from "a closure does not lift at all". Not permanent.

[[tests]]
name = "probe.control.array"
desc = "An array parameter and no capture: does a function of an array lift at all?"
kind = "behavior"
case = "../../cases/probe/probe_control_array.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "probe.control.float_capture"
desc = "A captured float read by a lambda over an array: is the capture the refusal?"
kind = "behavior"
case = "../../cases/probe/probe_control_float.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

[[tests]]
name = "probe.control.closure"
desc = "A captured float and no array: does a closure lift at all?"
kind = "behavior"
case = "../../cases/probe/probe_control_closure.cml"
args = ["${case}", "${backend}"]
backends = ["nvm"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000