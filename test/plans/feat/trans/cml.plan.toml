id = "trans.cml"
order = 340
tier = "fast"
tags = ["feat", "trans", "dump", "cml", "roundtrip"]

[[tests]]
name = "print_and_recompile"
desc = "std::cml prints a runtime program as Camel source: module values, functions, branches (if, match, nested arms, a return that gives an arm's value), loops (for, while, for ... while, several states, a struct state, effects in the body), closures (a lambda as a value, a block body, captures, a returned lambda, a closure over a cell), with parameters, and var parameters. The printed source compiles to a canonical graph isomorphic to the original (test/tools/cml_roundtrip.py, version 2), runs with the same stdout and exit status, is deterministic, keeps the source's names, refuses a construct outside this subset with CmlUnsupportedConstruct without partial output, and refuses a constant over max_literal_bytes with CmlBigConstant naming the size and the limit."
kind = "behavior"
tool = "python"
case = "../../../cases/trans/cml_contract.py"
# `${camel}` is the compiler of the build under test, named as an argument.
args = ["${case}", "--camel", "${camel}"]
expect_exit = 0
expect_stdout_contains = ["cml round trip: PASS"]
timeout_ms = 180000

[[tests]]
name = "print_then_run_agrees_with_the_origin"
desc = "The `std::cml` round trip measured as behaviour, not as text: each of the eight cases the defect list (A7) named as behaving differently after a print is printed, the printed program is run, and its `rc` and `stdout` are compared with the origin's (a diagnostic's file path is normalized to `<PATH>`, because the printed program lives in a scratch directory). One line per case -- `case=<name> rc=<n> stdout=identical` -- so the reading says which cases ran, not just that the whole thing passed."
kind = "behavior"
tool = "node"
case = "../../../tools/roundtrip-compare.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["ROUNDTRIP cases=8 identical=8 differs=0", "case=linear/runtime/var_read_before_region rc=0 stdout=identical", "case=linear/runtime/order_edges_regions rc=56 stdout=identical"]
timeout_ms = 120000

[[tests]]
name = "print_then_run_negative_swap_is_seen"
desc = "The round trip tool's own discriminability: two `println` statements of a printed body are swapped and the tool must report a difference. A harness that cannot see a swap it planted itself reports `identical` for everything, which is the failure this entry exists to catch -- so the expected line names the planted swap and the difference it produced."
kind = "behavior"
tool = "node"
case = "../../../tools/roundtrip-compare.mjs"
args = ["${case}", "--negative", "effects/writer_table_through_callee"]
expect_exit = 0
expect_stdout_contains = ["negative=seen", "stdout=differs at line", "planted: println at line"]
timeout_ms = 120000