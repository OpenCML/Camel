id = "trans.macro"
order = 331
tier = "feat"
tags = ["feat", "trans", "macro"]

[[tests]]
name = "basic"
desc = "Exercises a single-step macro expansion into a concrete arithmetic expression."
kind = "behavior"
case = "../../../cases/trans/macro/basic.cml"
args = ["${case}", "std::macro"]
expect_exit = 0
failure_note = "Macro runtime execution is currently unstable under std::macro on this build."
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

