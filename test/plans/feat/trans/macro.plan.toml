[[tests]]
name = "not_static.note"
desc = "A macro call with an argument that is not a constant is the normal case, not a failure: the program runs (20, 7), nothing is printed at default level, and with -v a note names the call (10:12) and the argument."
kind = "behavior"
case = "../../../cases/trans/macro/not_static.cml"
args = ["-v", "${case}", "std::macro", "std::nvm"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
verify_script = """
({ input, assert }) => {
const err = input.normalized.stderr
assert(/<Macro> 'count' at .*not_static\.cml:10:12 stays a run-time call: argument 1 is not a constant\./.test(err), `note missing: ${err}`)
assert(!input.normalized.output.includes('MacroEvaluationFailed'), 'not a failure')
assert(input.normalized.stdout.trim() === '20\n7', `unexpected stdout: ${input.normalized.stdout}`)
}
"""
timeout_ms = 10000

