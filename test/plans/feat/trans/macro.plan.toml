[[tests]]
name = "failed_evaluation.error"
desc = "A macro call with constant arguments whose evaluation fails is a run-time fault of std::macro: RuntimeDiag::MacroEvaluationFailed at the call (19:13), with the reason. The program does not run. The effect the evaluation performed before failing has happened at pass time (once per round of the pass)."
kind = "behavior"
case = "../../../cases/trans/macro/failed_evaluation.cml"
args = ["${case}", "std::macro", "std::nvm"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::MacroEvaluationFailed"
expect_diagnostic_code = "0x0400000E"
expect_diagnostic_line = 17
expect_diagnostic_column = 13
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.output
assert(/failed_evaluation\.cml:19:13: \[Error\]: 'boom' could not be evaluated by std::macro: DivisionByZero: Attempted division by zero\./.test(out), `error missing: ${out}`)
assert(!out.includes('main start'), `the program must not run: ${out}`)
assert(!out.includes("'fine'"), `a call that evaluated was reported: ${out}`)
assert(!out.includes('[Warn]'), `no warning is left: ${out}`)
}
"""
timeout_ms = 10000

[[tests]]
name = "failed_evaluation.json"
desc = "With --output-format json the failed evaluation is the only diagnostic: an Error with stage pass:std::macro and the call's range. No run-stage diagnostic follows, because nothing ran."
kind = "behavior"
case = "../../../cases/trans/macro/failed_evaluation.cml"
args = ["--output-format", "json", "${case}", "std::macro", "std::nvm"]
expect_exit = 1
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const diags = JSON.parse(out.slice(out.indexOf('[\n{')))
assert(diags.length === 1, `one diagnostic: ${out}`)
const d = diags[0]
assert(d.data.name === 'RuntimeDiag::MacroEvaluationFailed' && d.severity === 'Error' && d.code === '0x0400000E', `name/severity/code: ${JSON.stringify(d)}`)
assert(d.data.stage === 'pass:std::macro', `stage: ${d.data.stage}`)
assert(d.range.start.line === 18 && d.range.start.character === 12, `range: ${JSON.stringify(d.range)}`)
assert(d.message === "'boom' could not be evaluated by std::macro: DivisionByZero: Attempted division by zero.", `message: ${d.message}`)
}
"""
timeout_ms = 10000

[[tests]]
name = "failed_evaluation.without_macro"
desc = "Without std::macro the same macro function is an ordinary function: the program runs up to the failing call and stops there with the run-time error."
kind = "behavior"
case = "../../../cases/trans/macro/failed_evaluation.cml"
args = ["${case}", "std::nvm"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::DivisionByZero"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
assert(out.startsWith('main start\n42\nEFFECT boom\n'), `unexpected stdout: ${out}`)
assert(!input.normalized.output.includes('MacroEvaluationFailed'), 'no macro diagnostic without the pass')
}
"""
timeout_ms = 10000

[[tests]]
name = "failed_no_rule.error"
desc = "grad over an operator without a derivative rule cannot be expanded by std::macro: a run-time fault located at the operator whose rule is missing (10:12), whose message names the operator and the macro call (15:13); the program does not start."
kind = "behavior"
case = "../../../cases/trans/macro/failed_no_rule.cml"
args = ["${case}", "std::macro", "std::fvm"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::MacroEvaluationFailed"
expect_diagnostic_line = 8
expect_diagnostic_column = 12
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.output
assert(/'autodiff:grad' could not be evaluated by std::macro: RuntimeError: An error has occurred: autodiff: no derivative rule for operator 'math:sin_d'/.test(out) && out.includes('failed_no_rule.cml:10:12'), `error missing: ${out}`)
assert(!out.includes('main start'), `the program must not run: ${out}`)
}
"""
timeout_ms = 10000

[[tests]]
name = "failed_depth.error"
desc = "A macro recursion deeper than the 64-frame evaluation limit is a failed evaluation: a run-time fault at the call (17:13) naming the limit, and the program does not run, although it runs without std::macro (next test). count(20) on the line before is evaluated without a diagnostic."
kind = "behavior"
case = "../../../cases/trans/macro/failed_depth.cml"
args = ["${case}", "std::macro", "std::nvm"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::MacroEvaluationFailed"
expect_diagnostic_line = 15
expect_diagnostic_column = 13
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.output
assert(/failed_depth\.cml:17:13: \[Error\]: 'count' could not be evaluated by std::macro: the evaluation needs more than 64 nested calls \(at 'count'\)\./.test(out), `error missing: ${out}`)
assert((out.match(/MacroEvaluationFailed/g) || []).length === 1, `expected one error: ${out}`)
assert(!/^20$/m.test(input.normalized.stdout), `the program must not run: ${input.normalized.stdout}`)
}
"""
timeout_ms = 10000

