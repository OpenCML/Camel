id = "trans.effect_trace"
order = 337
tier = "feat"
tags = ["feat", "trans", "effect_trace"]

[[tests]]
name = "effect_order_across_backends"
desc = "CAMEL_EFFECT_TRACE: the effect-order exemplar yields the same trace (uri, stage, origin, payload hash) under NodeVM, FastVM and inline + NodeVM."
kind = "behavior"
tool = "python"
case = "../../../cases/trans/effect_trace/effect_trace.py"
args = ["${case}", "order"]
expect_exit = 0
expect_stdout_contains = ["effect trace: PASS"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000

[[tests]]
name = "macro_body_effect_stage"
desc = "CAMEL_EFFECT_TRACE: a println in a macro function body is traced with stage macro under std::macro and stage run without it."
kind = "behavior"
tool = "python"
case = "../../../cases/trans/effect_trace/effect_trace.py"
args = ["${case}", "stage"]
expect_exit = 0
expect_stdout_contains = ["effect trace: PASS"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000
