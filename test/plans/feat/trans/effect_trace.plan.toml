id = "trans.effect_trace"
order = 337
tier = "fast"
tags = ["feat", "trans", "effect_trace"]

[[tests]]
name = "effect_order_across_backends"
desc = "std::profile effect_trace="<file>": the effect-order exemplar yields the same trace (uri, stage, origin, payload hash) under NodeVM, FastVM and inline + NodeVM."
kind = "behavior"
tool = "python"
case = "../../../cases/trans/effect_trace/effect_trace.py"
args = ["${case}", "order"]
expect_exit = 0
expect_stdout_contains = ["effect trace: PASS"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000

[[tests]]
name = "macro_body_effect_stage"
desc = "std::profile effect_trace="<file>": a println in a macro function body is traced with stage macro under std::macro and stage run without it."
kind = "behavior"
tool = "python"
case = "../../../cases/trans/effect_trace/effect_trace.py"
args = ["${case}", "stage"]
expect_exit = 0
expect_stdout_contains = ["effect trace: PASS"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000

[[tests]]
name = "effect_payload_text"
desc = "std::profile effect_trace="<file>": `payload` is the hashed argument text, JSON-escaped; a payload over 2048 bytes is cut on a character boundary with payload_truncated, and payload_sha1 still covers the full text."
kind = "behavior"
tool = "python"
case = "../../../cases/trans/effect_trace/effect_trace.py"
args = ["${case}", "payload"]
expect_exit = 0
expect_stdout_contains = ["effect trace: PASS"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000

[[tests]]
name = "variable_reads_not_traced"
desc = "std::profile effect_trace="<file>": a store into a var is an effect event, creating and reading the variable (:var/new, :var/get) are not, under NodeVM, FastVM and inline + NodeVM."
kind = "behavior"
tool = "python"
case = "../../../cases/trans/effect_trace/effect_trace.py"
args = ["${case}", "variables"]
expect_exit = 0
expect_stdout_contains = ["effect trace: PASS"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000
