id = "trans.reduced_crashes"
order = 470
tier = "fast"
tags = ["feat", "trans", "crashes", "reduced"]
desc = "Two programs reduced from the e9 corpus that used to abort the executor. Both run now -- no output, exit 0 -- and these cases are what keeps them that way: an input that reaches the compiler must end in a diagnostic or a correct result, never in an abort (the language author's rule for A4b/A4c, 2026-11-02). The messages they used to die on are asserted absent, so a regression fails here with the same sentence the author reported."

# Both programs are the author's reductions, copied verbatim from
# docs/handover/reports/eval-defects-2026-11-01/e9_reduced/. Their names keep the seed that reduced
# them; the comment at the top of each file says which abort it used to produce.
[[tests]]
name = "trans.reduced.rc01_inline_fvm"
desc = "std::opt::inline std::fvm on the A4b reduction: it used to abort with 'Region 2 yields node 8 and its owner 5 is in the execution, but that node is not'. Measured 2026-11-02: three runs, exit 0, no output."
kind = "behavior"
case = "../../../cases/trans/reduced/rc01_seed47.cml"
args = ["${case}", "std::opt::inline", "std::fvm"]
expect_exit = 0
expect_output_not_contains = ["Region 2 yields node", "terminate called", "SIGABRT", "Guarantee"]
timeout_ms = 30000

[[tests]]
name = "trans.reduced.rc02_opt_fvm"
desc = "std::opt std::fvm on the A4c reduction: it used to abort on 'Guarantee: brchTargetMap.empty() ... BRCH nodes have unmatched control outputs without corresponding JOIN nodes'. Measured 2026-11-02: three runs, exit 0, no output."
kind = "behavior"
case = "../../../cases/trans/reduced/rc02_seed6.cml"
args = ["${case}", "std::opt", "std::fvm"]
expect_exit = 0
expect_output_not_contains = ["brchTargetMap", "terms in the guarantee are not", "terminate called", "SIGABRT"]
timeout_ms = 30000

# The other two backends on the same two programs: the crash was reported against fvm, and a case
# that only pins one backend would let the same shape come back through nvm.
[[tests]]
name = "trans.reduced.rc01_inline_nvm"
kind = "behavior"
case = "../../../cases/trans/reduced/rc01_seed47.cml"
args = ["${case}", "std::opt::inline", "std::nvm"]
expect_exit = 0
expect_output_not_contains = ["terminate called", "SIGABRT"]
timeout_ms = 30000

[[tests]]
name = "trans.reduced.rc02_opt_nvm"
kind = "behavior"
case = "../../../cases/trans/reduced/rc02_seed6.cml"
args = ["${case}", "std::opt", "std::nvm"]
expect_exit = 0
expect_output_not_contains = ["terminate called", "SIGABRT"]
timeout_ms = 30000