[[tests]]
name = "reshape_computed_shape"
desc = "A target shape the program computes at run time (`reshape<[n, 3]>(y)` with n a parameter) is the operator's value argument, so the extents the call writes are those values, not the ones the caller's contract put in the result type: `rt::reshapeBy(y, rt::Array<int64_t>{n, 3}, at_...)` reads them, and a target that changes the element count reports `[6] -> [3, 3]` -- both shapes filled at run time, the interpreter's sentence. Written from the type, the call carried `{2, 3}` and the fault never happened. agree_with_fvm compares the reading with std::fvm byte for byte."
