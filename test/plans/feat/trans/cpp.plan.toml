kind = "behavior"
case = "../../../cases/trans/cpp/fault_narrow_text_range.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
expect_stdout_contains = ["the value is outside the range of bf16 ("]
expect_output_not_contains = ["TranslationRefused"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

