expect_exit = 0
expect_stdout_contains = ["rt::div("]
expect_output_not_contains = ["TranslationRefused", "libcamel"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "narrow_argmax"
desc = "The positions read from a value of bf16 or f16: `argsort` names its element type (`array:argsort_bf`, `array:argsort_f6`) and answers with an index, so the rule is one per type but the answer's type is everyone's -- the case where a narrow float's operator result is not a narrow float. `array::argmax` and `argmin` are Camel loops over `argsort` of two elements, so they follow from it, and the order is the one `min` and `max` state (NaN last, -0 below +0, ties where they stand). It is translated into rt::halfArgsort with no bridged call, and its readings are in expect.txt: what kept them out was the writer, not this type -- a `for i in a..b` loop declared its items with the type of the node that holds the interval's two bounds, and that pair is written as a struct as soon as the program has a value of the same shape (function_emitter.cpp, the interval's array)."
kind = "behavior"
case = "../../../cases/trans/cpp/narrow_argmax.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
expect_stdout_contains = ["rt::halfArgsort("]
expect_output_not_contains = ["TranslationRefused", "rt::bridge", "libcamel"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

