timeout_ms = 8000

[[tests]]
name = "slice_rank"
desc = "A slice names one dimension of a value and keeps every other one whole: `m[0:2]` is the first two rows of a rank-2 value, `m[:, 1]` its second column, `len` of a row range answers the rows it kept, and `t[1:]` of a rank-3 value is the rank-2 value behind its first row. The dimension sliced takes the length the bounds give it and the shape everywhere else is the value's own, so the runtime's slice gathers along an axis instead of over the whole run. The program is built and run by agree_with_fvm, which compares it with std::fvm byte for byte."
kind = "behavior"
case = "../../../cases/trans/cpp/slice_rank.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
expect_stdout_contains = ["rt::sliceSub("]
expect_output_not_contains = ["TranslationRefused", "internal error"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "index_rank"
desc = "A position on a value of several dimensions: `m[1]` is the second row (`rt::atRow`, one dimension less and of the row's own extent), `m[1, 0]` writes the axis it drops and is the element (`rt::atAxis`, every other dimension kept whole), and `t[1]` of a rank-3 value is the rank-2 value behind it. `len` of a row answers the dimension that is left. The program is built and run by agree_with_fvm, which compares it with std::fvm byte for byte -- six lines, rows and elements both. The operator rule that used to turn a value of several dimensions away is gone with it, as are the two module programs that took the same road: `index_two_positions` translates and agrees."
kind = "behavior"
case = "../../../cases/trans/cpp/index_rank.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
expect_stdout_contains = ["rt::atRow(", "rt::atAxis("]
expect_output_not_contains = ["TranslationRefused", "internal error"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

