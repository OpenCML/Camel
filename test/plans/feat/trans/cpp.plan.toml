[[tests]]
name = "refuse_tensor"
desc = "std::cpp does not translate tensors. The refusal is located at the operator use that needs one -- 	ensor:ones in main, line 15 column 23 -- and names the operator and the type of its argument (int[], the shape); the Tensor-returning scale is never reached (the operator use in the body stands in main, which the pass walks first). It used to be the unlocated PassInternalError \"runtime graph 'scale' is not supported by the direct C++ path: node#N: non-bridgeable return type\"."
kind = "negative"
case = "../../../cases/trans/cpp/refuse_tensor.cml"
args = ["${case}", "std::cpp"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::TranslationRefused"
expect_diagnostic_code = "0x0400000B"
expect_diagnostic_line = 15
expect_diagnostic_column = 23
expect_output_contains = ["Translation pass 'std::cpp' refused the graph: function 'main' uses the operator 'tensor:ones' on a value of type 'int[]', which has no translation in std::cpp yet"]
expect_output_not_contains = ["internal error", "node#", "non-bridgeable", ":?:?:", "#include"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "refuse_tensor_json"
desc = "The same refusal in --output-format json: one diagnostic, TranslationRefused, stage pass:std::cpp, the range of the definition of `scale` (lines 10 to 12), nothing of a translation unit on stdout."
kind = "behavior"
case = "../../../cases/trans/cpp/refuse_tensor.cml"
args = ["--output-format", "json", "${case}", "std::cpp"]
expect_exit = 1
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const diags = JSON.parse(input.normalized.stdout)
assert(diags.length === 1, `expected one diagnostic, got ${diags.length}`)
const d = diags[0]
assert(d.data.name === 'RuntimeDiag::TranslationRefused' && d.data.stage === 'pass:std::cpp', `unexpected diagnostic ${d.data.name} at stage ${d.data.stage}`)
assert(d.code === '0x0400000B', `code ${d.code}`)
assert(d.message.includes("function 'main' uses the operator 'tensor:ones' on a value of type 'int[]'"), `unexpected message: ${d.message}`)
assert(d.range.start.line === 14 && d.range.start.character === 22 && d.range.end.line === 14, `unexpected range ${JSON.stringify(d.range)}`)
}
"""
timeout_ms = 8000

[[tests]]
name = "refuse_rank"
desc = "A rule that declines says which values it declined: a slice of a value of two dimensions is not the one slice this back end has -- it keeps no shape, so `m[0:1]` of `float[2, 3]` is not a run of a block here -- and the refusal names both types it was given ('float[2, 3]' and 'int') where it used to say only \"on values\", which left the reader to guess the shape it wanted."
kind = "negative"
case = "../../../cases/trans/cpp/refuse_rank.cml"
args = ["${case}", "std::cpp"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::TranslationRefused"
expect_diagnostic_line = 10
expect_diagnostic_column = 14
expect_output_contains = ["function 'main' uses the operator ':op/slice_sub' on values of type 'float[2, 3]' and 'int' std::cpp does not translate it for yet"]
expect_output_not_contains = ["internal error", "node#", "non-bridgeable"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "enum_types"
desc = "An enum is translated as a struct of its own: a tag and a std::variant payload struct per variant, with make<Tag>, get<Tag, Index> and an appendText that writes it as the interpreter does; :enum/tag and :enum/field become rt::enumTag and rt::enumField. The program itself is built and run by agree_with_fvm."
kind = "behavior"
case = "../../../cases/consistency/values/enums.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
expect_stdout_contains = ["struct Shape {", "std::variant<std::monostate, Circle, Rect, Empty> value;", "Shape::make<", "rt::enumField<", "out += \"Shape::Circle\";"]
expect_output_not_contains = ["camel/core/", "libcamel"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "recursive_enum_types"
desc = "A recursive enum is translated: the field that contains the enum is held through std::shared_ptr, not refused; make boxes it, get and appendText dereference it, and a generated destructor and operator== walk it on explicit stacks (camel/standalone/recursive.h). The million-node chain itself is built and run by agree_with_fvm, which checks the text and the equality result against std::fvm."
kind = "behavior"
case = "../../../cases/consistency/values/deep_enum_chain.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
expect_stdout_contains = ["struct Chain {", "std::shared_ptr<Chain>", "rt::box<Chain>", "rt::beginDestroy()", "std::vector<std::pair<const Chain *, const Chain *>> pending"]
expect_output_not_contains = ["camel/core/", "libcamel", "TranslationRefused"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "links_runtime_warning"
desc = "An operator std::cpp has no standalone translation for (`str:to_upper`) is called through the Camel runtime: the pass warns once, at the first such call, and says the generated program is built with libcamel. The translation itself succeeds (exit 0), so the warning is what is pinned."
kind = "behavior"
case = "../../../cases/trans/cpp/runtime_bridge.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
expect_diagnostic_name = "RuntimeDiag::TranslationLinksRuntime"
expect_diagnostic_code = "0x04100016"
expect_diagnostic_line = 6
expect_diagnostic_column = 13
expect_stderr_contains = ["std::cpp has no standalone translation of the operator 'str:to_upper': the program it writes calls the Camel runtime there and is built with libcamel."]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000
