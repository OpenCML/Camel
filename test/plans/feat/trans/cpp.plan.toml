expect_exit = 0
expect_stdout_contains = ["struct Shape {", "std::variant<std::monostate, Circle, Rect, Empty> value;", "Shape::make<", "rt::enumField<", "out += \"Shape::Circle\";"]
expect_output_not_contains = ["camel/core/", "libcamel"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "recursive_enum_types"
desc = "A recursive enum is translated: the field that contains the enum is held through std::shared_ptr, not refused; make boxes it, get and appendText dereference it, and a generated destructor and operator== walk it on explicit stacks (camel/standalone/recursive.h). The million-node chain itself is built and run by agree_with_fvm, which checks the text and the equality result against std::fvm."
kind = "behavior"
case = "../../../cases/consistency/values/deep_enum_chain.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
expect_stdout_contains = ["struct Chain {", "std::shared_ptr<Chain>", "rt::box<Chain>", "rt::beginDestroy()", "std::vector<std::pair<const Chain *, const Chain *>> pending"]
expect_output_not_contains = ["camel/core/", "libcamel", "TranslationRefused"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "links_runtime_warning"
desc = "An operator std::cpp has no standalone translation for (`str:to_upper`) is called through the Camel runtime: the pass warns once, at the first such call, and says the generated program is built with libcamel. The translation itself succeeds (exit 0), so the warning is what is pinned."
kind = "behavior"
case = "../../../cases/trans/cpp/runtime_bridge.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
expect_diagnostic_name = "RuntimeDiag::TranslationLinksRuntime"
expect_diagnostic_code = "0x04100016"
expect_diagnostic_line = 6
expect_diagnostic_column = 13
expect_stderr_contains = ["std::cpp has no standalone translation of the operator 'str:to_upper': the program it writes calls the Camel runtime there and is built with libcamel."]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000
