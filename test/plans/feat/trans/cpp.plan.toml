id = "trans.cpp"
order = 330
tier = "fast"
tags = ["feat", "trans", "cpp"]

[[tests]]
name = "exec_mod_scalar"
desc = "A program of scalars is translated into a standalone C++ file: it includes camel/standalone/runtime.h and nothing of the compiler or the runtime, and `%` goes through rt::mod, which faults on zero at a located site (the program itself is built and run by agree_with_fvm)."
kind = "behavior"
case = "../../../cases/trans/cpp/exec_mod_scalar.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
expect_stdout_contains = ["#include \"camel/standalone/runtime.h\"", "A standalone program", "rt::mod(", "int main(int argc, char **argv) {", "return camel::standalone::run(1000, [&] { return program::entry(argc, argv); });"]
expect_output_not_contains = ["bridge.h", "camel/core/", "libcamel"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "complex_numbers"
desc = "A complex number is translated as std::complex of its parts' width (c64 is std::complex<float>, c128 is std::complex<double>): the literal is a std::complex of two float literals, `/` goes through rt::complexDiv, which faults on the complex zero at a located site, abs is rt::complexAbs (hypot of the parts), and `^` with an integer exponent is rt::pow (repeated squaring). The program itself is built and run by agree_with_fvm."
kind = "behavior"
case = "../../../cases/trans/cpp/complex_scalar.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
expect_stdout_contains = ["std::complex<double>{3.0, 4.0}", "std::complex<float>", "rt::complexDiv(", "rt::complexAbs(", "rt::pow(", "std::exp(", "rt::toText("]
expect_output_not_contains = ["camel/core/", "libcamel", "TranslationRefused", "bridge"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "agree_with_fvm"
# The default layer. It is the only test of the tree that catches a generated C++ program that
# builds and runs but prints what the interpreter does not -- a format specification that reached
# the writer as plain text padded the whole array and exited 0 -- so it runs with the plan: about
# 40 s of wall clock at 8 jobs, and nothing else looks at this.
#
# Its bound is 900 s, not 600: the runner fails a test whose own CPU time is more than a quarter of
# its timeout, and 129 C++ compilations at -O2 cost about 150 s of CPU on this host -- at 600 the
# test sat exactly on the margin and failed on the host's contention with 129 of 129 programs
# agreeing (151.6 s against a 150 s quarter). The work cannot be made smaller without dropping
# programs, so the number is raised, with this note, as docs/test-plans.md asks.
tier = "fast"
desc = "The programs of test/tools/cppexec/expect.txt are translated with std::cpp, built with the system's C++ compiler and run; each prints what std::fvm prints and exits with its code: scalars and their text, strings, branches as statements, the order of effects, faults with their located report, the recursion limit, tail calls as loops (also between two functions), exit codes, complex numbers (arithmetic, `^`, the math functions, their text and formatting, a faulting division), and operators of runtime modules through the bridge."
kind = "behavior"
tool = "python"
case = "../../../tools/cppexec/run.py"
args = ["${case}", "--expect", "test/tools/cppexec/expect.txt"]
skip_unless = ["${python}", "test/tools/cppexec/run.py", "--have-compiler"]
expect_exit = 0
expect_stdout_contains = ["PASS"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 900000 # 129 compilations, ~150 s of CPU: see the note above the test

[[tests]]
name = "recursion_site_message"
desc = "The report a call site pre-renders into its rt::Site names the recursion limit the program was translated with (`Maximum recursion depth (1000) exceeded when evaluating graph 'depth'.`), not the value placeholder the old table wrote (`\\0370`, the unit separator and a digit). The `filled` field carries the same text, so the number is still filled in when the fault happens; the program itself is built and run by agree_with_fvm."
kind = "behavior"
case = "../../../cases/trans/cpp/exec/site_message.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
expect_stdout_contains = ["Maximum recursion depth (1000) exceeded when evaluating graph 'depth'.", "const rt::Site"]
expect_output_not_contains = ["Maximum recursion depth (\\037", "\\0370) exceeded"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "named_struct_types"
desc = "A named struct type is one C++ struct named by its declaration, and a second declaration of the same layout is another name for it (`using Spot = Point;`); a type that writes its fields in another order is a struct of its own, and converting to it copies field by field in the declaration's order (`Point{lit::record_2.x, lit::record_2.y}`). The program itself is built and run by agree_with_fvm."
kind = "behavior"
case = "../../../cases/trans/cpp/named_structs.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
expect_stdout_contains = ["struct Point {", "struct Swapped {", "using Spot = Point;", "Point{lit::record_2.x, lit::record_2.y}"]
expect_output_not_contains = ["TranslationRefused", "camel/core/", "libcamel"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

