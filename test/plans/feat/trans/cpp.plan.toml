id = "trans.cpp"
order = 330
tier = "feat"
tags = ["feat", "trans", "cpp"]

[[tests]]
name = "exec_mod_scalar"
desc = "A program of scalars is translated into a standalone C++ file: it includes camel/standalone/runtime.h and nothing of the compiler or the runtime, and `%` goes through rt::mod, which faults on zero at a located site (the program itself is built and run by agree_with_fvm)."
kind = "behavior"
case = "../../../cases/trans/cpp/exec_mod_scalar.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
expect_stdout_contains = ["#include \"camel/standalone/runtime.h\"", "A standalone program", "rt::mod(", "int main() { return camel::standalone::run(1000, exec_mod_scalar::entry); }"]
expect_output_not_contains = ["bridge.h", "camel/core/", "libcamel"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

[[tests]]
name = "agree_with_fvm"
desc = "The programs of test/tools/cppexec/expect.txt are translated with std::cpp, built with the system's C++ compiler and run; each prints what std::fvm prints and exits with its code: scalars and their text, strings, branches as statements, the order of effects, faults with their located report, the recursion limit, tail calls as loops (also between two functions), exit codes, and operators of runtime modules through the bridge."
kind = "behavior"
tool = "python"
case = "../../../tools/cppexec/run.py"
args = ["${case}", "--expect", "test/tools/cppexec/expect.txt"]
skip_unless = ["${python}", "test/tools/cppexec/run.py", "--have-compiler"]
expect_exit = 0
expect_stdout_contains = ["PASS"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 600000

[[tests]]
name = "main_io"
desc = "Checks the C++ translation path preserves imports, formatting, timing calls, and stdout side effects."
kind = "behavior"
case = "../../../cases/trans/cpp/main_io.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000


[[tests]]
name = "refuse_tensor"
desc = "std::cpp translates scalar and string values only. A function that returns a Tensor is refused with a located TranslationRefused at the definition of the function, naming the function and the type; it used to be the unlocated PassInternalError \"runtime graph 'scale' is not supported by the direct C++ path: node#N: non-bridgeable return type\"."
kind = "negative"
case = "../../../cases/trans/cpp/refuse_tensor.cml"
args = ["${case}", "std::cpp"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::TranslationRefused"
expect_diagnostic_code = "0x0400000B"
expect_diagnostic_line = 10
expect_diagnostic_column = 1
expect_output_contains = ["Translation pass 'std::cpp' refused the graph: function 'scale' returns a value of type 'Tensor'; std::cpp translates values of the types int32, int64, float32, float64, bool, string and void only"]
expect_output_not_contains = ["internal error", "node#", "non-bridgeable", ":?:?:", "#include"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "refuse_tensor_json"
desc = "The same refusal in --output-format json: one diagnostic, TranslationRefused, stage pass:std::cpp, the range of the definition of `scale` (lines 10 to 12), nothing of a translation unit on stdout."
kind = "behavior"
case = "../../../cases/trans/cpp/refuse_tensor.cml"
args = ["--output-format", "json", "${case}", "std::cpp"]
expect_exit = 1
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const diags = JSON.parse(input.normalized.stdout)
assert(diags.length === 1, `expected one diagnostic, got ${diags.length}`)
const d = diags[0]
assert(d.data.name === 'RuntimeDiag::TranslationRefused' && d.data.stage === 'pass:std::cpp', `unexpected diagnostic ${d.data.name} at stage ${d.data.stage}`)
assert(d.code === '0x0400000B', `code ${d.code}`)
assert(d.message.includes("function 'scale' returns a value of type 'Tensor'"), `unexpected message: ${d.message}`)
assert(d.range.start.line === 9 && d.range.start.character === 0 && d.range.end.line === 11, `unexpected range ${JSON.stringify(d.range)}`)
}
"""
timeout_ms = 8000
