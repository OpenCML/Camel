[[tests]]
name = "narrow_reductions_needs_no_runtime"
# Red when the `math:min_f`/`math:max_f` rules are deleted: the library's own `min` widens a bf16
# to `float` before comparing, so the fold reaches `math:min_d`, the bridge, and a link line that
# names libcamel -- while the program still prints the same lines (agree_with_fvm stays green).
# That is the case this entry exists for: "standalone" is a claim about the artifact, and only the
# artifact can falsify it.
desc = "The program std::cpp writes for a value of bf16 or f16 needs no Camel runtime: the generated code names no operator of the bridge, the link line names no Camel library, and the built executable's own dependencies (`ldd`) hold none. The link line is what falsifies it -- a program whose operator has no standalone translation is linked with libcamel, and a half the bridge cannot carry (bridge::Value has no sixteen-bit kind) must not be emitted as a bridged call. Read as an artifact question, not as a reading of the writer's intent."
kind = "behavior"
tool = "python"
case = "../../../tools/cppexec/run.py"
args = ["${case}", "--standalone", "test/cases/trans/cpp/narrow_reductions.cml"]
skip_unless = ["${python}", "test/tools/cppexec/run.py", "--have-compiler"]
expect_exit = 0
expect_stdout_contains = ["bridge: no", "needs: none of the Camel runtime", "PASS: 1 of 1 program(s) need no Camel runtime"]
expect_output_not_contains = ["FAIL", "libcamel"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 120000

[[tests]]
name = "every_expect_program_links_no_runtime"
desc = "The same property as narrow_reductions_needs_no_runtime, asked of every program the expect list names instead of one: each is translated, built and its own dependencies read (`ldd`), and the set of programs that still link the Camel runtime has to be exactly the set test/tools/cppexec/bridged.txt names -- 1 today, written down there as the bridge's own exception and not a gap. Both directions are checked: a second program that links it is red, and so is the one here becoming standalone, because the list is then wrong and a list that can only grow says nothing. What is left is re:test (a regex engine is not in the header set); the tensor builders left it when they stopped calling the bridge, and the line was deleted the same commit."
kind = "behavior"
tool = "python"
case = "../../../tools/cppexec/run.py"
args = ["${case}", "--standalone", "--expect=test/tools/cppexec/expect.txt", "--baseline=test/tools/cppexec/bridged.txt"]
skip_unless = ["${python}", "test/tools/cppexec/run.py", "--have-compiler"]
expect_exit = 0
