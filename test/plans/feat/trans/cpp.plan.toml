[[tests]]
name = "refuse_tensor"
desc = "std::cpp does not translate tensors. The refusal is located at the operator use that needs one -- tensor:ones in main, line 15 column 23 -- and names the missing tensor value rather than the shape array it takes: the array is translated, the tensor is what the pass has no type for. The Tensor-returning scale is never reached (the operator use in the body stands in main, which the pass walks first). It used to be the unlocated PassInternalError \"runtime graph 'scale' is not supported by the direct C++ path: node#N: non-bridgeable return type\"."
kind = "negative"
case = "../../../cases/trans/cpp/refuse_tensor.cml"
args = ["${case}", "std::cpp"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::TranslationRefused"
expect_diagnostic_code = "0x0400000B"
expect_diagnostic_line = 15
expect_diagnostic_column = 23
expect_output_contains = ["Translation pass 'std::cpp' refused the graph: function 'main' uses 'tensor:ones' to build a tensor, and std::cpp writes no tensor value: the pass has no tensor type, so a shape cannot be handed to it"]
expect_output_not_contains = ["internal error", "node#", "non-bridgeable", ":?:?:", "#include"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "narrow_floats"
desc = "bf16 and f16 are core value types of the language (reduced-precision.md b1) and values of the standalone runtime (include/camel/standalone/half.h), so a program that holds one is translated rather than refused: `rt::BF16` and `rt::F16` stand for the two types, sixteen bits of storage whose constant is the pattern itself (`fromBits`, exact for every pattern a program can write), the text is the type's own shortest text (so `0.1` as a bf16 prints `0.1` and not the `0.100097656` of the f32 it widens to), and arithmetic is computed in f32 and rounded once -- `/` through rt::div, where zero is a fault as it is for f32, and `^` through rt::pow. This entry pinned a refusal before the rules existed; it is now the acceptance case, and the program is built and run by agree_with_fvm, which is what says the two back ends print it byte for byte."
kind = "behavior"
case = "../../../cases/trans/cpp/narrow_floats.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
expect_stdout_contains = ["rt::BF16", "rt::F16", "rt::BF16::fromBits(uint16_t{", "rt::F16::fromBits(uint16_t{", "rt::div(", "rt::pow(", "rt::halfFromText<rt::BF16>(", "rt::halfFromText<rt::F16>(", "rt::convertArray<rt::BF16>(", "rt::convertArray<rt::F16>("]
expect_output_not_contains = ["TranslationRefused", "no such element type", "camel/core/", "libcamel"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "fault_narrow_text_number"
desc = "A text that is not a number, read as a bf16, is a fault at run time, and the compiler renders its report into the site the conversion calls: the program is translated rather than refused, and it carries the invalid-text sentence. The value the fault reports is known only when it happens, so the sentence is written with a placeholder where the text goes; that the program *prints* it -- and prints it as the interpreter does, byte for byte -- is what agree_with_fvm compares (test/tools/cppexec/expect.txt)."
kind = "behavior"
case = "../../../cases/trans/cpp/fault_narrow_text_number.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
expect_stdout_contains = ["Cannot convert the string", "InvalidNumberText"]
expect_output_not_contains = ["TranslationRefused"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "fault_narrow_text_range"
