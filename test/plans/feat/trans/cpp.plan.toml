id = "trans.cpp"
order = 330
tier = "feat"
tags = ["feat", "trans", "cpp"]

[[tests]]
name = "exec_mod_scalar"
desc = "A program of scalars is translated into a standalone C++ file: it includes camel/standalone/runtime.h and nothing of the compiler or the runtime, and `%` goes through rt::mod, which faults on zero at a located site (the program itself is built and run by agree_with_fvm)."
kind = "behavior"
case = "../../../cases/trans/cpp/exec_mod_scalar.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
expect_stdout_contains = ["#include \"camel/standalone/runtime.h\"", "A standalone program", "rt::mod(", "int main(int argc, char **argv) {", "return camel::standalone::run(1000, [&] { return program::entry(argc, argv); });"]
expect_output_not_contains = ["bridge.h", "camel/core/", "libcamel"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

[[tests]]
name = "agree_with_fvm"
desc = "The programs of test/tools/cppexec/expect.txt are translated with std::cpp, built with the system's C++ compiler and run; each prints what std::fvm prints and exits with its code: scalars and their text, strings, branches as statements, the order of effects, faults with their located report, the recursion limit, tail calls as loops (also between two functions), exit codes, and operators of runtime modules through the bridge."
kind = "behavior"
tool = "python"
case = "../../../tools/cppexec/run.py"
args = ["${case}", "--expect", "test/tools/cppexec/expect.txt"]
skip_unless = ["${python}", "test/tools/cppexec/run.py", "--have-compiler"]
expect_exit = 0
expect_stdout_contains = ["PASS"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 600000

[[tests]]
name = "main_io"
desc = "Checks the C++ translation path preserves imports, formatting, timing calls, and stdout side effects."
kind = "behavior"
case = "../../../cases/trans/cpp/main_io.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000


[[tests]]
name = "refuse_tensor"
desc = "std::cpp does not translate tensors. A function that returns a Tensor is refused with a located TranslationRefused at the definition of the function, naming the function and the type; it used to be the unlocated PassInternalError \"runtime graph 'scale' is not supported by the direct C++ path: node#N: non-bridgeable return type\"."
kind = "negative"
case = "../../../cases/trans/cpp/refuse_tensor.cml"
args = ["${case}", "std::cpp"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::TranslationRefused"
expect_diagnostic_code = "0x0400000B"
expect_diagnostic_line = 10
expect_diagnostic_column = 1
expect_output_contains = ["Translation pass 'std::cpp' refused the graph: function 'scale' returns a value of type 'Tensor'; std::cpp translates numbers, bool, string, enums, arrays, tuples, structs, T?, T!, functions and var variables of these, and void"]
expect_output_not_contains = ["internal error", "node#", "non-bridgeable", ":?:?:", "#include"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "refuse_tensor_json"
desc = "The same refusal in --output-format json: one diagnostic, TranslationRefused, stage pass:std::cpp, the range of the definition of `scale` (lines 10 to 12), nothing of a translation unit on stdout."
kind = "behavior"
case = "../../../cases/trans/cpp/refuse_tensor.cml"
args = ["--output-format", "json", "${case}", "std::cpp"]
expect_exit = 1
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const diags = JSON.parse(input.normalized.stdout)
assert(diags.length === 1, `expected one diagnostic, got ${diags.length}`)
const d = diags[0]
assert(d.data.name === 'RuntimeDiag::TranslationRefused' && d.data.stage === 'pass:std::cpp', `unexpected diagnostic ${d.data.name} at stage ${d.data.stage}`)
assert(d.code === '0x0400000B', `code ${d.code}`)
assert(d.message.includes("function 'scale' returns a value of type 'Tensor'"), `unexpected message: ${d.message}`)
assert(d.range.start.line === 9 && d.range.start.character === 0 && d.range.end.line === 11, `unexpected range ${JSON.stringify(d.range)}`)
}
"""
timeout_ms = 8000

[[tests]]
name = "enum_types"
desc = "An enum is translated as a struct of its own: a tag and a std::variant payload struct per variant, with make<Tag>, get<Tag, Index> and an appendText that writes it as the interpreter does; :enum/tag and :enum/field become rt::enumTag and rt::enumField. The program itself is built and run by agree_with_fvm."
kind = "behavior"
case = "../../../cases/consistency/values/enums.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
expect_stdout_contains = ["struct Shape {", "std::variant<std::monostate, Circle, Rect, Empty> value;", "Shape::make<", "rt::enumField<", "out += \"Shape::Circle\";"]
expect_output_not_contains = ["camel/core/", "libcamel"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

[[tests]]
name = "recursive_enum_types"
desc = "A recursive enum is translated: the field that contains the enum is held through std::shared_ptr, not refused; make boxes it, get and appendText dereference it, and a generated destructor and operator== walk it on explicit stacks (camel/standalone/recursive.h). The million-node chain itself is built and run by agree_with_fvm, which checks the text and the equality result against std::fvm."
kind = "behavior"
case = "../../../cases/consistency/values/deep_enum_chain.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
expect_stdout_contains = ["struct Chain {", "std::shared_ptr<Chain>", "rt::box<Chain>", "rt::beginDestroy()", "std::vector<std::pair<const Chain *, const Chain *>> pending"]
expect_output_not_contains = ["camel/core/", "libcamel", "TranslationRefused"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000
