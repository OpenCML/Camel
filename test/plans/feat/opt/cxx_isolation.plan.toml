[[tests]]
name = "cxx_isolation.cse.by_cpp"
desc = "The C++ common-subexpression elimination (`std::cxx::cse`) on the corpus whose expression is written twice over one value: the canonical document of the graph it leaves, the sweep reached its fixpoint, and the `flags` word it prints -- the one field that tells it from the Camel reading."
kind = "behavior"
case = "../../../cases/opt/cxx_isolation/subject.cml"
args = ["${case}", "std::cxx::cse", "std::jgir canonical=true"]
expect_exit = 0
timeout_ms = 20000
verify_script = """
const doc = JSON.parse(input.normalized.stdout)
const fail = (why) => {
    throw new Error("std::cxx::cse: " + why)
}
if (doc.format !== "camel.gir" || doc.canonical !== true) {
    fail("the run did not print the canonical document: " + input.normalized.stdout.slice(0, 200))
}
const graphs = doc.graphs || []
if (graphs.length < 5) {
    fail("the document holds " + graphs.length + " graph(s), not the five the program has")
}
const operands = (n) => (n.inputs || []).filter((i) => i.kind === "norm").map((i) => i.source).join(",")
for (const g of graphs) {
    const seen = new Set()
    for (const n of g.nodes || []) {
        const op = n.payload && n.payload.op ? n.payload.op : ""
        if (n.kind !== "OPER" || !op.startsWith(":op/")) continue
        const key = op + "(" + operands(n) + ")"
        if (seen.has(key)) {
            fail("two nodes of one graph compute " + key + ", so the sweep did not reach its fixpoint")
        }
        seen.add(key)
    }
}
const flags = graphs.map((g) => g.flags).sort().join(",")
if (flags !== "0,2,2,2,2") {
    fail("the graph set prints flags [" + flags + "], not [0,2,2,2,2]: exactly one graph is left "
        + "with no commit having looked at its gates, because this sweep writes only the graphs it "
        + "rewrites (docs/handover/reports/2026-11-18-two-implementations-of-one-pass.md)")
}
"""

[[tests]]
name = "cxx_isolation.cse.by_camel"
desc = "The Camel common-subexpression elimination (`opt::cse`, stdlib/opt.cml) on the same graph, read the same way: the same graphs, nodes, operators and operands, the sweep reached its fixpoint, and every graph prints the gates-dissolved bit because a program-wide commit looked at all of them."
kind = "behavior"
case = "../../../cases/opt/cxx_isolation/subject.cml"
args = ["${case}", "opt::cse", "std::jgir canonical=true"]
expect_exit = 0
timeout_ms = 20000
verify_script = """
const doc = JSON.parse(input.normalized.stdout)
const fail = (why) => {
    throw new Error("opt::cse: " + why)
}
if (doc.format !== "camel.gir" || doc.canonical !== true) {
    fail("the run did not print the canonical document: " + input.normalized.stdout.slice(0, 200))
}
const graphs = doc.graphs || []
if (graphs.length < 5) {
    fail("the document holds " + graphs.length + " graph(s), not the five the program has")
}
const operands = (n) => (n.inputs || []).filter((i) => i.kind === "norm").map((i) => i.source).join(",")
for (const g of graphs) {
    const seen = new Set()
    for (const n of g.nodes || []) {
        const op = n.payload && n.payload.op ? n.payload.op : ""
        if (n.kind !== "OPER" || !op.startsWith(":op/")) continue
        const key = op + "(" + operands(n) + ")"
        if (seen.has(key)) {
            fail("two nodes of one graph compute " + key + ", so the sweep did not reach its fixpoint")
        }
        seen.add(key)
    }
}
const flags = graphs.map((g) => g.flags).sort().join(",")
if (flags !== "2,2,2,2,2") {
    fail("the graph set prints flags [" + flags + "], not [2,2,2,2,2]: this sweep opens one "
        + "transaction over the program and commits it once, so a commit has looked at the gates of "
        + "every graph, including the one it merged nothing in (docs/handover/reports/"
        + "2026-11-18-two-implementations-of-one-pass.md)")
}
"""