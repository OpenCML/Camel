# The one name the rework kept. `std::opt` is not a spelling of a sub-pass: it is the name of the
# default pipeline, the choice "optimize by default", and today it selects the C++ implementation.
# The two entries below are its reading, and they are a relation rather than a stored document: the
# canonical graph the default name prints has to be the one the registered name prints, byte for
# byte, with no normalizer between them. A run of `std::opt` that stopped resolving to the kernel
# would fail the reference entry; one that resolved to a *different* kernel would fail the
# comparison.
[[tests]]
name = "cxx_isolation.default_pipeline.by_default_name"
desc = "The default pipeline, run by the name a program writes -- `std::opt`, the word a program that asks for optimization by name uses -- prints a canonical document of the whole graph set in which no operation over constants is left. This is the reference `by_registered_name` is compared against; it asserts a canonical, non-empty document of five graphs because an empty run against an empty run compares equal, which is the trap the experiment's report names (internal/reports/2026-11-18-two-implementations-of-one-pass.md, section 4)."
kind = "behavior"
case = "../../../cases/opt/cxx_isolation/subject.cml"
args = ["${case}", "std::opt", "std::jgir canonical=true", "std::nop"]
expect_exit = 0
timeout_ms = 20000
verify_script = """
const doc = JSON.parse(input.normalized.stdout)
const fail = (why) => {
    throw new Error("std::opt: " + why)
}
if (doc.format !== "camel.gir" || doc.canonical !== true) {
    fail("the run did not print the canonical document: " + input.normalized.stdout.slice(0, 200))
}
const graphs = doc.graphs || []
if (graphs.length < 5) {
    fail("the document holds " + graphs.length + " graph(s), not the five the program has")
}
const operands = (n) => (n.inputs || []).filter((i) => i.kind === "norm").map((i) => i.source)
for (const g of graphs) {
    const constants = new Set((g.nodes || []).filter((n) => n.kind === "DATA").map((n) => n.id))
    for (const n of g.nodes || []) {
        if (n.kind !== "OPER") continue
        const ins = operands(n)
        if (ins.length >= 2 && ins.every((s) => constants.has(s))) {
            fail("an operation over constants is left in the graph, so the default pipeline did not "
                + "fold it: " + n.id)
        }
    }
}
"""

[[tests]]
name = "cxx_isolation.default_pipeline.by_registered_name"
desc = "The same pipeline under the name the isolation registered, `std::opt`: the canonical document is the one the default name printed, byte for byte -- same exit, same bytes, no normalizer. The rework deleted every old sub-pass name and kept `std::opt` alone, so this is the entry that says what it kept still runs the kernel rather than merely resolving to a name."
kind = "differential"
case = "../../../cases/opt/cxx_isolation/subject.cml"
args = ["${case}", "std::opt", "std::jgir canonical=true", "std::nop"]
expect_exit = 0
timeout_ms = 20000
compare_to = "cxx_isolation.default_pipeline.by_default_name"
compare_fields = ["exit_code", "stdout_normalized"]

# ---- inlining: the two implementations on four corpora ----
#
# The readings below were taken before the assertions were written, which is why each `by_cpp` entry
# names an absolute count and not "fewer than before": the baseline is the same corpus read with no
# pass at all. Canonical documents drop the graph names, so a reading is the multiset of
# `calls/nodes` over the graphs of the document, sorted, plus the total number of call sites.
#
#   corpus        before                          after either inliner
#   figure1       0/3 1/2 1/7 1/9     (3 calls)   0/10 0/15 0/3 1/2   (1 call)   both calls inlined
#   closure       0/3 0/3 0/3 0/5 1/2 4/26 (6)   unchanged                     a call through a value is left
#   budget_zero   0/3 1/2 1/4 1/7     (4 calls)   unchanged                     the budget is 0, nothing is copied
#   recursion     1/11 1/2 1/7        (3 calls)   unchanged                     the callee recurses
#
# The three "unchanged" corpora are the control: a comparison of two implementations that both did
# nothing is a comparison of the input, and the entries say so instead of passing on a coincidence.

[[tests]]
name = "cxx_isolation.inline_figure1.by_cpp"
desc = "The C++ inlining on the printed figure of the paper, `inc(x) * 3 + (x + 1) * 4` with the call one level down so the front end keeps it: both call sites are expanded, so the reading is one call site (the document root's) and the graphs are 0/10, 0/15, 0/3, 1/2. The corpus with no pass at all reads 0/3, 1/2, 1/7, 1/9 -- three call sites -- which is the decrease this entry asserts."
kind = "behavior"
case = "../../../cases/opt/cxx_isolation/inline_figure1.cml"
args = ["${case}", "std::cxx::inline", "std::jgir canonical=true", "std::nop"]
expect_exit = 0
timeout_ms = 20000
verify_script = """
const doc = JSON.parse(input.normalized.stdout)
if (doc.format !== "camel.gir" || doc.canonical !== true) {
    throw new Error("std::cxx::inline: the run did not print the canonical document: " + input.normalized.stdout.slice(0, 200))
}
const rows = (doc.graphs || []).map((g) => (g.nodes || []).filter((n) => n.kind === "CALL" || n.kind === "FUNC").length + "/" + (g.nodes || []).length)
const key = rows.slice().sort().join(" ")
if (key !== "0/10 0/15 0/3 1/2") {
    throw new Error("std::cxx::inline, figure1: the graphs read " + key + ", not 0/10 0/15 0/3 1/2 -- the corpus reads 0/3 1/2 1/7 1/9 with no pass, so a call site that survives means the pass did not inline it")
}
const calls = rows.reduce((a, r) => a + Number(r.split("/")[0]), 0)
if (calls !== 1) {
    throw new Error("std::cxx::inline, figure1: " + calls + " call site(s) left, not 1")
}
"""

[[tests]]
name = "cxx_isolation.inline_figure1.by_camel"
desc = "`opt::inline` on the same figure: the run that produced the C++ reading, with the Camel pass in its place, and the two canonical documents are compared byte for byte."
kind = "differential"
case = "../../../cases/opt/cxx_isolation/inline_figure1.cml"
args = ["${case}", "opt::inline", "std::jgir canonical=true", "std::nop"]
expect_exit = 0
timeout_ms = 20000
compare_to = "cxx_isolation.inline_figure1.by_cpp"
compare_fields = ["exit_code", "stdout_normalized"]

