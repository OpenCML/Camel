# ALGEBRA: one law set in the rules library (`rules::algebra`, stdlib/rules.cml) and two names that
# run it -- the C++ pass under the isolation's name and `opt::algebra` in the module `opt`, which is
# `rules::simplify` -- so the two readings of one corpus are one document, character for character.
# They are compared in the egraph document (`std::jgir canonical=true egraph=true`), which is the
# graph: the classes, the writings, the operator of each writing. The display document is compared
# too, in one pair below, because this pass prints the same `flags` word on both sides (all three
# graphs print 2, measured; the C++ passes commit every graph of the program and so does this one),
# and that is a property of this pass, not of the comparison: the fold pair above prints two different
# words for the same graphs and cannot be compared, so it is asserted on each side instead.
#
# Three corpora, because there is more than one way for the law to see one value:
#
#   single_x    `x * 3 + x * 4`: one name written twice, so the two products are products of one
#               node and `x * c1 + x * c2 is x * (c1 + c2)` reads them as one value. `algebra` alone
#               fires here.
#   two_writes  `(x + 1) * 3 + (x + 1) * 4`: `x + 1` written twice is two nodes, and no algebraic law
#               reads two nodes as one value -- `algebra` alone rewrites nothing, which the control
#               reading in the entry's comment names (3 additions, 2 multiplications, the constants 3
#               and 4). The common-subexpression elimination merges the two writings first, and then
#               the law fires; so each side runs its own cse before its algebra, and the comparison is
#               of `std::cxx::cse std::cxx::algebra` against `opt::cse opt::algebra`. Compared after
#               `algebra` alone, both sides would print the corpus the front end built and the
#               equality would be the equality of two non-runs.
#   bound       `let a = x + 1` then `a * 3 + a * 4`: the binding makes one value of two writings
#               without a cse, so the law fires on `algebra` alone. It is the third path to the same
#               law, and it also carries the doubling (`b + b` over `b = x * 3` folds to `x * 6`) and
#               the neutral elements (`x * 1 + 0` leaves the port).
#
# Every entry says what the document of a run that did nothing would hold, so "both sides did
# nothing" cannot pass as equality.

[[tests]]
name = "cxx_isolation.algebra_single_x.by_cpp"
desc = "The C++ algebraic simplification (`std::cxx::algebra`) on `x * 3 + x * 4`, one name written twice: the egraph document of the graph set it leaves, with no addition, one multiplication over the constant 7 and neither coefficient, which is the document `opt::algebra` is compared against."
kind = "behavior"
case = "../../../cases/opt/cxx_isolation/algebra_single_x.cml"
args = ["${case}", "std::cxx::algebra", "std::jgir canonical=true egraph=true", "std::nop"]
expect_exit = 0
timeout_ms = 20000
verify_script = """
const doc = JSON.parse(input.normalized.stdout)
const fail = (why) => {
    throw new Error("std::cxx::algebra: " + why)
}
for (const key of ["class_data", "nodes", "root_eclasses"]) {
    if (!(key in doc)) {
        fail("the run did not print the egraph document: " + input.normalized.stdout.slice(0, 200))
    }
}
const ops = Object.values(doc.nodes).map((n) => n.op)
const count = (op) => ops.filter((o) => o === op).length
if (doc.root_eclasses.length < 3) {
    fail("the document holds " + doc.root_eclasses.length + " root class(es), not the three graphs the program has")
}
if (count(":op/add_l") !== 0) {
    fail("the document holds " + count(":op/add_l") + " addition(s): `x * 3 + x * 4` was not merged into one product")
}
if (count(":op/mul_l") !== 1) {
    fail("the document holds " + count(":op/mul_l") + " multiplication(s), not the one the merged coefficients leave")
}
for (const gone of ["3", "4"]) {
    if (count(gone) !== 0) {
        fail("the document holds the constant " + gone + ": the two coefficients were not merged into one")
    }
}
if (count("7") !== 1) {
    fail("the document holds " + count("7") + " constant(s) 7, not the one merged coefficient")
}
"""

[[tests]]
name = "cxx_isolation.algebra_single_x.by_camel"
desc = "The Camel algebraic simplification (`opt::algebra`, stdlib/opt.cml) on the same corpus, in the same document: it is `rules::simplify`, the laws are written once, so this is the C++ reading byte for byte -- same exit, same bytes, no normalizer."
kind = "differential"
case = "../../../cases/opt/cxx_isolation/algebra_single_x.cml"
args = ["${case}", "opt::algebra", "std::jgir canonical=true egraph=true", "std::nop"]
expect_exit = 0
timeout_ms = 20000
compare_to = "cxx_isolation.algebra_single_x.by_cpp"
compare_fields = ["exit_code", "stdout_normalized"]

[[tests]]
name = "cxx_isolation.algebra_two_writes.by_cpp"
desc = "The C++ pair of steps this corpus needs -- the common-subexpression elimination (`std::cxx::cse`) and then the algebraic simplification (`std::cxx::algebra`) -- on `(x + 1) * 3 + (x + 1) * 4`, whose `x + 1` is written twice: the egraph document of the graph set the two steps leave, with one addition, one multiplication over the constant 7 and neither coefficient. `algebra` alone leaves 3 additions, 2 multiplications and both constants, which is why the cse is there and why a reader of this entry should not read it as `algebra` firing by itself."
kind = "behavior"
case = "../../../cases/opt/cxx_isolation/algebra_two_writes.cml"
args = ["${case}", "std::cxx::cse", "std::cxx::algebra", "std::jgir canonical=true egraph=true", "std::nop"]
expect_exit = 0
timeout_ms = 20000
verify_script = """
const doc = JSON.parse(input.normalized.stdout)
const fail = (why) => {
    throw new Error("std::cxx::cse std::cxx::algebra: " + why)
}
for (const key of ["class_data", "nodes", "root_eclasses"]) {
    if (!(key in doc)) {
        fail("the run did not print the egraph document: " + input.normalized.stdout.slice(0, 200))
    }
}
const ops = Object.values(doc.nodes).map((n) => n.op)
const count = (op) => ops.filter((o) => o === op).length
if (doc.root_eclasses.length < 3) {
    fail("the document holds " + doc.root_eclasses.length + " root class(es), not the three graphs the program has")
}
if (count(":op/add_l") !== 1) {
    fail("the document holds " + count(":op/add_l") + " addition(s), not the one `x + 1` the corpus keeps: "
        + "the two writings of `x + 1` were not merged, so the cse did nothing")
}
if (count(":op/mul_l") !== 1) {
    fail("the document holds " + count(":op/mul_l") + " multiplication(s), not the one the merged coefficients leave: "
        + "the two products were not merged, so the algebra did nothing")
}
for (const gone of ["3", "4"]) {
    if (count(gone) !== 0) {
        fail("the document holds the constant " + gone + ": the two coefficients were not merged into one")
    }
}
if (count("7") !== 1) {
    fail("the document holds " + count("7") + " constant(s) 7, not the one merged coefficient")
}
"""

