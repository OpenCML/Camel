name = "cxx_isolation.fold.by_old_name"
desc = "The same C++ pass under the name it had before the isolation, `std::opt::fold`: the alias resolves to the kernel `std::cxx::fold` names, so this reading is the one `by_cpp` printed. A rename that changed the graph shows here."
kind = "differential"
case = "../../../cases/opt/cxx_isolation/subject.cml"
args = ["${case}", "std::opt::fold", "std::jgir canonical=true"]
expect_exit = 0
timeout_ms = 20000
compare_to = "cxx_isolation.fold.by_cpp"
