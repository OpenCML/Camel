id = "opt.cxx_isolation"
order = 485
tier = "fast"
tags = ["feat", "opt", "cxx", "differential", "fold", "cse", "algebra"]

# The C++ optimization passes and the Camel ones are two implementations of one optimization.
# Neither is deleted yet (docs/roadmap.cn.md, P, written by the author): the C++
# ones stay, isolated under `cxx::`, and are compared against the Camel ones -- "输出图是否规范相等
# （不等处逐例归因）" -- before anything decides which one runs by default. The report of the
# experiment is internal/reports/2026-11-18-two-implementations-of-one-pass.md.
#
# The comparison is a run, not a reading. `std::jgir canonical=true` writes the document the
# equivalence checker reads (src/passes/trans/json/gir_canonical.cpp): the graph and node names,
# the node ids and the source origins are dropped, the ordering edges are reduced to the part no
# other path implies, the keys are in a canonical order and the node order comes from the graph's
# own structure. Two runs that produced the same graph therefore print the same bytes. No entry
# names a normalizer and this file has no `[defaults]`, so the runner normalizes nothing and the
# compared field `stdout_normalized` IS what the run printed: a difference is a difference in the
# graph, and a reviewer reads the disagreement rather than a count of it. Writing
# `normalizers = []` would say the same and is itself a finding -- `test/tools/
# plan-fields-baseline.json` counts an empty list as a field that checks nothing -- so the property
# is kept by leaving the field out, and each entry that compares says so in its own words.
#
#   by_cpp       the C++ pass under the name the isolation gives it: `std::cxx::fold`, `std::cxx::cse`
#   by_camel     the Camel pass of the module `opt` (stdlib/opt.cml): `opt::fold`, `opt::cse`
#   by_old_name  the name the pass had before the isolation, `std::opt::fold`: the isolation keeps
#                **no** alias for it (the author's rework, 2026-11-18), so the run has to be
#                refused as an unknown pass and the refusal has to name the name. This is the
#                control of the isolation itself, read in the negative: a rename that left the old
#                spelling resolving would turn this case red, which is what makes it a control.
#
# A reading's `flags` word is what a commit opened, not what the graph is. A pass edits a draft and
# the draft is the graph it edits, so a graph the pass rewrote nothing in stays the graph it decoded
# and the commit that closes the session gives it no `kGraphFlagGatesDissolved` bit
# (include/camel/runtime/graph.h); the bit only says "the gates of this graph have been looked at",
# which the first commit that reaches it would otherwise do. Both implementations of a pass leave
# that word where their own writing left it, and the C++ and the Camel fold do not write the same
# graphs -- the C++ fold commits every graph of the program, the Camel fold the ones it rewrites --
# while the two CSE readings agree on it, because neither sweep rewrites `chain`, the folding corpus
# and the graph with no expression written twice in it. So the word is a memo, and the entries write
# it down instead of letting one side stand in for the other.
#
# `flags` is the commit's own memo: a graph it looked at and found unchanged is not decoded again
# (kernel/runtime/draft_session.cpp, the commit's skip). No pass reads it to decide anything, so a
# reading that differs only in this word is the same graph reached by doing more work.
#
# FOLD: the two readings hold the same five graphs -- the same nodes, the same constants and the same
# edges of the corpus -- and differ only in the `flags` word of the graphs the Camel fold did not
# write, so no text comparison is possible between them. Each is asserted itself: a canonical
# document, the program's own graph set, no operation over two constants left, and the `flags` word
# the run prints. The name they were separated from is not a third reading: it is refused, and the
# refusal is asserted here rather than assumed.
#
# CSE: the two readings are one document, `flags` word included: neither sweep rewrites `chain`, so
# neither commits it and both print 0 for it. The entries are still the two readings themselves,
# each asserted, rather than one compared against the other: the comparison a text differential would
# make is made where it is a graph comparison, and the memo word is asserted on each side so that a
# change to either one turns its entry red.

[[tests]]
name = "cxx_isolation.fold.by_cpp"
desc = "The C++ constant folding (`std::cxx::fold`) on the corpus whose literals form a chain: the canonical document of the graph it leaves, with no operation over two constants remaining, and the reading the Camel pass is put to."
kind = "behavior"
case = "../../../cases/opt/cxx_isolation/subject.cml"
args = ["${case}", "std::cxx::fold", "std::jgir canonical=true", "std::nop"]
expect_exit = 0
timeout_ms = 20000
verify_script = """
const doc = JSON.parse(input.normalized.stdout)
if (doc.format !== "camel.gir" || doc.canonical !== true) {
    throw new Error("std::cxx::fold: the run did not print the canonical document: " + input.normalized.stdout.slice(0, 200))
}
const graphs = doc.graphs || []
if (graphs.length < 5) {
    throw new Error("std::cxx::fold: the document holds " + graphs.length + " graph(s), not the five the program has")
}
const operands = (n) => (n.inputs || []).filter((i) => i.kind === "norm").map((i) => i.source)
for (const g of graphs) {
    const constants = new Set((g.nodes || []).filter((n) => n.kind === "DATA").map((n) => n.id))
    for (const n of g.nodes || []) {
        if (n.kind !== "OPER") continue
        const ins = operands(n)
        if (ins.length >= 2 && ins.every((s) => constants.has(s))) {
            throw new Error("std::cxx::fold: an operation over constants is left in the graph, so the fold did not reach its fixpoint: " + n.id)
        }
    }
}
"""

[[tests]]
name = "cxx_isolation.fold.by_camel"
desc = "The Camel constant folding (`opt::fold`, stdlib/opt.cml) on the same graph, read the same way as the C++ one: the canonical document of the same five graphs with no operation over two constants remaining, and the `flags` word the run prints -- the memo of which graphs its commit opened, which is the two graphs the fold rewrote nothing in."
kind = "behavior"
case = "../../../cases/opt/cxx_isolation/subject.cml"
args = ["${case}", "opt::fold", "std::jgir canonical=true", "std::nop"]
expect_exit = 0
timeout_ms = 20000
verify_script = """
const doc = JSON.parse(input.normalized.stdout)
const fail = (why) => {
    throw new Error("opt::fold: " + why)
}
if (doc.format !== "camel.gir" || doc.canonical !== true) {
    fail("the run did not print the canonical document: " + input.normalized.stdout.slice(0, 200))
}
const graphs = doc.graphs || []
if (graphs.length < 5) {
    fail("the document holds " + graphs.length + " graph(s), not the five the program has")
}
const operands = (n) => (n.inputs || []).filter((i) => i.kind === "norm").map((i) => i.source)
for (const g of graphs) {
    const constants = new Set((g.nodes || []).filter((n) => n.kind === "DATA").map((n) => n.id))
    for (const n of g.nodes || []) {
        if (n.kind !== "OPER") continue
        const ins = operands(n)
        if (ins.length >= 2 && ins.every((s) => constants.has(s))) {
            fail("an operation over constants is left in the graph, so the fold did not reach its fixpoint: " + n.id)
        }
    }
}
// The `flags` word is written down rather than compared with the C++ reading, which commits every
// graph and so prints 2 five times: this fold commits the graphs it rewrote, and the two it did not
// rewrite keep the 0 that says no commit has looked at their gates yet. The bit is a memo (see the
// file comment) and the graphs are the C++ ones, node for node.
const flags = graphs.map((g) => g.flags).sort().join(",")
if (flags !== "0,0,2,2,2") {
    fail("the graph set prints flags [" + flags + "], not [0,0,2,2,2]: the fold rewrites three of the "
        + "five graphs of this corpus, and a graph it rewrote nothing in is not committed by this pass")
}
"""

[[tests]]
name = "cxx_isolation.fold.by_old_name"
desc = "The name the C++ fold had before the isolation, `std::opt::fold`, is not accepted: the isolation keeps no alias (author's rework, 2026-11-18), so the pipeline is refused as an unknown pass and the refusal names the name. The same program under the same dump pass, one word changed -- the reading differs from `by_cpp` in the only way a retired name can differ: it never runs."
kind = "behavior"
case = "../../../cases/opt/cxx_isolation/subject.cml"
args = ["${case}", "std::opt::fold", "std::jgir canonical=true", "std::nop"]
expect_exit = 1
timeout_ms = 20000
expect_output_contains = ["Pass <std::opt::fold> not found, available passes are:"]
# The alias listing is what an old spelling would have resolved through; the entry that answered
# `std::opt::fold` is gone, and what is left is `std::opt` -- the default pipeline's name.
expect_output_not_contains = ["std::opt::fold ->"]
verify_script = """
// The refusal goes to stdout with the rest of the compiler's report, so the reading is not "stdout
// is empty" -- it is that no graph document left the run: the pipeline was never entered, so
// `std::jgir` printed nothing of the program.
if (/camel\.gir|"graphs"\s*:/.test(input.normalized.stdout)) {
    throw new Error("std::opt::fold: the run printed a graph document, so a pass ran under a name that is not a pass: " + input.normalized.stdout.slice(0, 200))
}
"""

[[tests]]
name = "cxx_isolation.cse.by_cpp"
desc = "The C++ common-subexpression elimination (`std::cxx::cse`) on the corpus whose expression is written twice over one value: the canonical document of the graph it leaves, the sweep reached its fixpoint, and the `flags` word it prints -- the memo of which graphs its commit opened, asserted on this side and on the Camel one instead of compared across."
kind = "behavior"
case = "../../../cases/opt/cxx_isolation/subject.cml"
args = ["${case}", "std::cxx::cse", "std::jgir canonical=true", "std::nop"]
expect_exit = 0
timeout_ms = 20000
verify_script = """
const doc = JSON.parse(input.normalized.stdout)
const fail = (why) => {
    throw new Error("std::cxx::cse: " + why)
}
if (doc.format !== "camel.gir" || doc.canonical !== true) {
    fail("the run did not print the canonical document: " + input.normalized.stdout.slice(0, 200))
}
const graphs = doc.graphs || []
if (graphs.length < 5) {
    fail("the document holds " + graphs.length + " graph(s), not the five the program has")
}
const operands = (n) => (n.inputs || []).filter((i) => i.kind === "norm").map((i) => i.source).join(",")
for (const g of graphs) {
    const seen = new Set()
    for (const n of g.nodes || []) {
        const op = n.payload && n.payload.op ? n.payload.op : ""
        if (n.kind !== "OPER" || !op.startsWith(":op/")) continue
        const key = op + "(" + operands(n) + ")"
        if (seen.has(key)) {
            fail("two nodes of one graph compute " + key + ", so the sweep did not reach its fixpoint")
        }
        seen.add(key)
    }
}
const flags = graphs.map((g) => g.flags).sort().join(",")
if (flags !== "0,2,2,2,2") {
    fail("the graph set prints flags [" + flags + "], not [0,2,2,2,2]: exactly one graph is left "
        + "with no commit having looked at its gates, because this sweep writes only the graphs it "
        + "rewrites (internal/reports/2026-11-18-two-implementations-of-one-pass.md)")
}
"""

