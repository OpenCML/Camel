[[tests]]
name = "cxx_isolation.algebra_display.by_cpp"
desc = "The same `single_x` run in the display document: the canonical document of the three graphs with the shape the entries above read -- no addition, one multiplication, neither coefficient -- and the `flags` word it prints, 2 for every graph because this pass commits every graph of the program."
kind = "behavior"
case = "../../../cases/opt/cxx_isolation/algebra_single_x.cml"
args = ["${case}", "std::cxx::algebra", "std::jgir canonical=true", "std::nop"]
expect_exit = 0
timeout_ms = 20000
verify_script = """
const doc = JSON.parse(input.normalized.stdout)
const fail = (why) => {
    throw new Error("std::cxx::algebra: " + why)
}
if (doc.format !== "camel.gir" || doc.canonical !== true) {
    fail("the run did not print the canonical document: " + input.normalized.stdout.slice(0, 200))
}
const graphs = doc.graphs || []
if (graphs.length < 3) {
    fail("the document holds " + graphs.length + " graph(s), not the three the program has")
}
// An operator in this document is named by its semantic key, version included (`:op/mul_l@1.0`;
// std/gir/json/gir_canonical.cpp, the payload of an OPER node), where the egraph document names the
// node's uri (`:op/mul_l`; std/gir/recordLabel). The count is by name -- the operator the graph
// calls -- because the version belongs to the operator's declaration in the semantics table and both
// readings read that one table: pinning the number here would make an operator's own version bump
// turn this entry red for a reason that has nothing to do with the algebraic laws. The version is not
// dropped silently, either: every operator this document names has to carry one.
const opStrings = graphs.flatMap((g) => (g.nodes || []).filter((n) => n.kind === "OPER").map((n) => (n.payload && n.payload.op) ? n.payload.op : ""))
for (const op of opStrings) {
    if (op.startsWith(":op/") && !op.includes("@")) {
        fail("the operator " + op + " carries no version: this document names an operator by its semantic key")
    }
}
const opName = (op) => op.split("@")[0]
const count = (op) => opStrings.filter((o) => opName(o) === op).length
if (count(":op/add_l") !== 0) {
    fail("the document holds " + count(":op/add_l") + " addition(s): `x * 3 + x * 4` was not merged into one product")
}
if (count(":op/mul_l") !== 1) {
    fail("the document holds " + count(":op/mul_l") + " multiplication(s), not the one the merged coefficients leave")
}
const flags = graphs.map((g) => g.flags).sort().join(",")
if (flags !== "2,2,2") {
    fail("the graph set prints flags [" + flags + "], not [2,2,2]: this pass commits every graph it decodes, "
        + "as the C++ kernel does, which is what lets this document be compared with the C++ one at all")
}
"""

[[tests]]
name = "cxx_isolation.algebra_display.by_camel"
desc = "The same Camel run in the display document, compared with the C++ one byte for byte: this pass prints the same `flags` word on both sides (every graph it decodes is committed), so the display documents of the two names are one document, unlike the fold pair's. That equality is the reading: a change to which graphs either implementation commits moves it."
kind = "differential"
case = "../../../cases/opt/cxx_isolation/algebra_single_x.cml"
