id = "opt.fault_preservation"
order = 324
tier = "fast"
tags = ["feat", "opt", "rules", "inline", "faults", "negative"]
desc = "A pass never removes a fault the program has: a rule that drops a factor, dead-code elimination of a statement on a sync chain, and inlining of a faulting callee"

# Whether a node may be dropped, moved or reordered is one question, asked of every node the same
# way: it must be pure and unable to fault (design principles 3.4, 9.7). Each case here is a
# program whose fault must survive the pass named in the entry, on every back end.
#
#   rules_drop_division            the rule `x * 0 => 0` may not drop `a / b`
#   dce_chained_division           an unread division written in a sync block stays
#   chained_cast                   an unread checked conversion written in a sync block stays
#   inline_faulting_callee_order   the inlined body of a faulting callee stays after the effects
#                                  its argument waited for
#
# The statement of a function that is not a sync block is not on a chain, and an unused fault there
# never runs (consistency.faults: fault.in_unused); the control entries keep that true under the
# passes as well.

[defaults]
kind = "negative"
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 1
expect_output_not_contains = ["not reached", "Floating point exception", "Segmentation fault", "dumped core"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 20000

[[tests]]
name = "rules_drop_division.algebra"
desc = "`std::opt::algebra` applies int_mul_zero to `(a / b) * 0`, which would drop the division."
case = "../../../cases/opt/fault_preservation/rules_drop_division.cml"
args = ["${case}", "std::opt::algebra", "${backend}"]
expect_diagnostic_name = "RuntimeDiag::DivisionByZero"
expect_stdout_starts_with = "before\n"

[[tests]]
name = "rules_drop_division.opt"
desc = "The same program through the whole optimizer."
case = "../../../cases/opt/fault_preservation/rules_drop_division.cml"
args = ["${case}", "std::opt", "${backend}"]
expect_diagnostic_name = "RuntimeDiag::DivisionByZero"
expect_stdout_starts_with = "before\n"

[[tests]]
name = "dce_chained_division.dce"
desc = "`std::opt::dce` leaves `let r = 5 / z` in a sync block, so `after` is not printed."
case = "../../../cases/opt/fault_preservation/dce_chained_division.cml"
args = ["${case}", "std::opt::dce", "${backend}"]
expect_diagnostic_name = "RuntimeDiag::DivisionByZero"
expect_stdout_starts_with = "before\n"

[[tests]]
name = "dce_chained_division.opt"
desc = "The same program through the whole optimizer."
case = "../../../cases/opt/fault_preservation/dce_chained_division.cml"
args = ["${case}", "std::opt", "${backend}"]
expect_diagnostic_name = "RuntimeDiag::DivisionByZero"
expect_stdout_starts_with = "before\n"

[[tests]]
name = "chained_cast.reference"
desc = "No pass: an unread conversion in a sync block still faults where it is written."
case = "../../../cases/opt/fault_preservation/chained_cast.cml"
args = ["${case}", "${backend}"]
expect_stdout_starts_with = "before\n"
expect_output_contains = ["conversion to 'f32[2, 3]' failed"]

[[tests]]
name = "chained_cast.dce"
desc = "`std::opt::dce` keeps the unread conversion."
case = "../../../cases/opt/fault_preservation/chained_cast.cml"
args = ["${case}", "std::opt::dce", "${backend}"]
expect_stdout_starts_with = "before\n"
expect_output_contains = ["conversion to 'f32[2, 3]' failed"]

[[tests]]
name = "inline_faulting_callee_order.opt"
desc = "After inlining, `7 / b` still runs after the effects `show` has, so `2` is printed before the fault."
case = "../../../cases/opt/fault_preservation/inline_faulting_callee_order.cml"
args = ["${case}", "std::opt", "${backend}"]
expect_diagnostic_name = "RuntimeDiag::DivisionByZero"
expect_stdout_starts_with = "1\n2\n"

# ---- the same three programs through the Camel passes ----

# `opt::dce` is the standard library's own dead-value sweep (`stdlib/opt.cml`), and the ruling on
# the A10 defect is that it decides what it may drop with the fact the C++ sweep decides with:
# `may_fault` (`stdlib/graph.cml`), which reads the operator table's fault feature and
# `castMayFault` the way `isValueOnly` does. An unread statement that can fault therefore stays,
# and each entry below holds the Camel run to the C++ run of the same program on the same back
# end, field for field: the same exit code and the same stdout, diagnostic and all (`*_agrees`).
# The fault cases are `dce_chained_division` (an unread `div_l` in a `sync` block),
# `chained_cast` (an unread `CAST` whose conversion is checked) and `one_hot_oob` (an unread
# `tensor:one_hot` whose label is out of range).

[[tests]]
name = "dce_chained_division.camel_dce"
desc = "`opt::dce`, written in Camel, keeps `let r = 5 / z`: the division may fault, so it is no value a pass may drop, and `after` is not printed."
case = "../../../cases/opt/fault_preservation/dce_chained_division.cml"
args = ["${case}", "opt::dce", "${backend}"]
expect_diagnostic_name = "RuntimeDiag::DivisionByZero"
expect_stdout_starts_with = "before\n"

[[tests]]
name = "dce_chained_division.camel_dce_agrees_with_cpp"
desc = "The Camel sweep and the C++ sweep of the same program are the same run: the same exit code and the same stdout, the DivisionByZero located at the same place."
kind = "differential"
case = "../../../cases/opt/fault_preservation/dce_chained_division.cml"
args = ["${case}", "opt::dce", "std::nvm"]
compare_to = "dce_chained_division.dce.nvm"
compare_fields = ["exit_code", "stdout_normalized"]

[[tests]]
name = "chained_cast.camel_dce"
desc = "`opt::dce` keeps the unread checked conversion: `may_fault` answers true for the CAST whose conversion is checked, as `castMayFault` does for the C++ sweep."
case = "../../../cases/opt/fault_preservation/chained_cast.cml"
args = ["${case}", "opt::dce", "${backend}"]
expect_stdout_starts_with = "before\n"
expect_output_contains = ["conversion to 'f32[2, 3]' failed"]

[[tests]]
name = "chained_cast.camel_dce_agrees_with_cpp"
desc = "The two sweeps of the conversion program are the same run: the same exit code and the same stdout, the failed conversion located at the same place."
kind = "differential"
case = "../../../cases/opt/fault_preservation/chained_cast.cml"
args = ["${case}", "opt::dce", "std::nvm"]
compare_to = "chained_cast.dce.nvm"
compare_fields = ["exit_code", "stdout_normalized"]

[[tests]]
name = "one_hot_oob.dce"
desc = "`std::opt::dce` keeps the unread `one_hot`: the call may fault, so the program reports the label outside [0, classes) and exits 1."
case = "../../../cases/modules/tensor/one_hot_oob.cml"
args = ["${case}", "std::opt::dce", "${backend}"]
expect_diagnostic_name = "RuntimeDiag::IndexOutOfRange"
expect_output_contains = ["Index 3 is out of range for the class dimension of one_hot of length 3"]

[[tests]]
name = "one_hot_oob.camel_dce"
desc = "`opt::dce` keeps it too: `tensor:one_hot` may fault, so the Camel sweep drops no call of it that nothing reads."
case = "../../../cases/modules/tensor/one_hot_oob.cml"
args = ["${case}", "opt::dce", "${backend}"]
expect_diagnostic_name = "RuntimeDiag::IndexOutOfRange"
expect_output_contains = ["Index 3 is out of range for the class dimension of one_hot of length 3"]

[[tests]]
name = "one_hot_oob.camel_dce_agrees_with_cpp"
desc = "The two sweeps of the `one_hot` program are the same run: the same exit code and the same stdout, the out-of-range label located at the same place."
kind = "differential"
case = "../../../cases/modules/tensor/one_hot_oob.cml"
args = ["${case}", "opt::dce", "std::nvm"]
compare_to = "one_hot_oob.dce.nvm"
compare_fields = ["exit_code", "stdout_normalized"]
