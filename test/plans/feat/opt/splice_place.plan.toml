id = "opt.splice_place"
order = 332
tier = "fast"
tags = ["feat", "opt", "control"]

# The place the splice takes back from the chain (`resolvePlaceForks`,
# src/runtime/draft_inline.cpp). A call that heads its block has no sync predecessor while it does
# have the statement the block's chain names after it, and the splice used to fall back to the
# control followers whenever the predecessors were missing -- so every node that merely waited on
# the call (a read of a `var` it writes, a gate carrying the block's value, the tuple a `let` takes
# apart) was given a place in the chain beside that one statement. One statement with three such
# followers is a chain that forks, which is no chain (docs/design/effects/edges.cn.md 5.3), and the
# seal reported it as an internal error of the pass.
#
# These are the three programs of the whole corpus that reached it. What is locked here: the
# statement the sync edge names follows the body's tail, the nodes that only waited on the call go
# on waiting on what the call became, the seal reports no fork, and the values are the ones the
# program computes with nothing but the executor -- to the byte, on every back end.

[defaults]
kind = "behavior"
expect_exit = 0
timeout_ms = 20000
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]

# Three arguments of one `println` are calls of a function with a `with <var>` parameter; each
# splice left the `:var/peek` and the block's gate beside the statement that really follows.

[[tests]]
name = "var_parameter.reference"
case = "../../../cases/consistency/partial_application/var_parameter.cml"
desc = "The values with nothing but the executor: three calls through a `with <var>` partial application, and the accumulator after them."
expect_stdout_exact = "1 3 6 6\n16 16\n"
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
args = ["${case}", "${backend}"]

[[tests]]
name = "var_parameter.opt"
case = "../../../cases/consistency/partial_application/var_parameter.cml"
desc = "`std::opt` inlines the three calls: the chain of the block keeps one follower per statement and the values do not change."
