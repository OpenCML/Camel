# The timed loop sits in an arm of a branch, and the place the splice writes for the body's tail is
# the one the branch's `brch` gave it. The program's own `println` is not in a sync block and nothing
# depends on it, so its value is never printed: stdout carries the helper's twenty measured rounds
# and nothing else. What is compared is the shape of those lines -- the round they belong to and the
# six decimals the timer reports, with the number itself swept out -- the exit code that says the
# warm-up value and the average and the margin are sane, and the absence of a refused graph.

[[tests]]
name = "perf_fib_smoke.reference"
case = "../../../cases/linear/jit/perf_fib_smoke.cml"
desc = "The timed helper's twenty rounds with nothing but the executor: the numbers are the measurement, the lines and the exit code are the behavior."
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code"]
args = ["${case}", "${backend}"]
verify_script = """
({ input, assert }) => {
    assert(input.exit_code === 0, `camel exited ${input.exit_code}`)
    assert(!input.normalized.stderr.includes('PassInternalError'), 'the graph was refused by the seal')
    const lines = input.normalized.stdout.split('\n').filter((line) => line.length > 0)
    assert(lines.length === 20, `expected the 20 measured rounds, got ${lines.length}`)
    for (let i = 0; i < lines.length; i += 1) {
        const round = String(20 - i).padStart(3)
        const shape = lines[i].replace(/[0-9]+\.[0-9]{6}/g, '<T>')
        assert(shape === `[${round}] <T> s`, `round ${20 - i} is '${lines[i]}'`)
    }
}
"""

