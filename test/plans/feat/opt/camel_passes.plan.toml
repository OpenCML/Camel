id = "opt.camel_passes"
order = 332
tier = "fast"
tags = ["feat", "opt", "camel", "differential", "dce", "cse", "fold"]

[defaults]
kind = "behavior"
expect_exit = 0
timeout_ms = 20000
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths", "normalize_origins"]

#  A pass written in Camel (`stdlib/opt.cml`) against the C++ pass that does the
# same (`std::opt::cse`, `std::opt::dce values_only=true`). The evidence is graph equality: the
# C++ run records the graph it produced in a golden, and the Camel run's graph is put to the
# isomorphic comparison the snapshot tests use (`gir_dot_isomorphic`, `test/tools/gir-dot.mjs`),
# which compares each node's kind, type, shape and in/out degree and each edge's endpoint kinds,
# link type and label — the same values, of the same types, in the same region structure, wired
# the same way round. The two dumps are never compared as text: compiling the pass's own library
# renumbers every node's source origin, and a node's id is the compiler's, not the graph's.
#
#   `by_cpp`      the reference: the C++ pass, recorded as a golden.
#   `by_camel`    the Camel pass, compared with that golden by `graph_equal.mjs`.
#   `same_text`   the same two runs compared as text after the origin ids are normalized: the
#                 stronger form for a pass the C++ one agrees with node for node.
#   `is_a_fixpoint` the Camel pass run on its own output: a sweep that stopped early shows here.
#   `property`    what the Camel pass leaves, read from the JSON `std::jgir` prints: a node count
#                 cannot say that the right pair was merged and the right node kept.
#   `subject`     the same case one pass earlier, asserting the corpus holds what the sweep is
#                 about: a guard that examined nothing would pass on a graph with nothing to do.
#   `program_still_runs` the program after the Camel pass, on four back ends, computes what it did.

# ---- common subexpressions ----

[[tests]]
name = "camel_passes.cse.subject"
desc = "The corpus before any pass: `shared` writes `x * 7` twice over two separate 7s, `literals` has two constants of 7 that its one product reads, and `written` has two 3s beside the two products over two different reads of the cell."
case = "../../../cases/opt/camel_passes/cse_subject.cml"
args = ["${case}", "std::jgir"]
verify_script_path = "../../../cases/opt/camel_passes/cse_subject.mjs"

[[tests]]
name = "camel_passes.cse.by_cpp"
desc = "The reference: std::opt::cse on the corpus whose literals and expressions repeat."
kind = "snapshot"
case = "../../../cases/opt/camel_passes/cse_subject.cml"
args = ["${case}", "std::opt::cse", "std::gir"]
snapshot_stream = "stdout"
golden = "./golden/camel_passes.cse.dot"

[[tests]]
name = "camel_passes.cse.by_camel"
desc = "opt::cse, written in Camel with the graph module, gives the graph the C++ pass gives: the golden of the entry above, compared node by node and edge by edge."
case = "../../../cases/opt/camel_passes/cse_subject.cml"
args = ["${case}", "opt::cse", "std::gir"]
verify_script_path = "../../../cases/opt/camel_passes/graph_equal.mjs"

[[tests]]
name = "camel_passes.cse.is_a_fixpoint"
desc = "opt::cse run on its own output gives the same graph: the sweep repeats its rounds until no two nodes are one value, so a version that merged one round of duplicates and stopped is refused here."
kind = "differential"
case = "../../../cases/opt/camel_passes/cse_subject.cml"
args = ["${case}", "opt::cse", "opt::cse", "std::gir"]
compare_to = "camel_passes.cse.by_camel"
compare_fields = ["exit_code", "stdout_normalized"]

[[tests]]
name = "camel_passes.cse.property"
desc = "What opt::cse leaves: no graph keeps two nodes that are one value, the two products over two reads of a written cell stay two nodes over two different reads, `shared`'s sum reads its one product twice, `literals`' product reads one value twice, and `apart`'s two sums keep the constants 1 and 2."
case = "../../../cases/opt/camel_passes/cse_subject.cml"
args = ["${case}", "opt::cse", "std::jgir"]
verify_script_path = "../../../cases/opt/camel_passes/cse_property.mjs"

[[tests]]
name = "camel_passes.cse.program_still_runs"
desc = "The program after opt::cse prints `shared(3)`, `literals()`, `written(4)` and `apart(5)`: merging equal values changed no result, on NVM, FastVM, JIT and the parallel scheduler."
case = "../../../cases/opt/camel_passes/cse_subject.cml"
args = ["${case}", "opt::cse", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_stdout_exact = "42\n49\n27\n42\n"

[[tests]]
name = "camel_passes.cse_written_variable.by_cpp"
desc = "The reference: std::opt::cse on the var corpus whose expression is reread after a write, whose two reads of the cell must stay apart."
kind = "snapshot"
case = "../../../cases/opt/generic/written_variable.cml"
args = ["${case}", "std::opt::cse", "std::gir"]
snapshot_stream = "stdout"
golden = "./golden/camel_passes.cse_written_variable.dot"

[[tests]]
name = "camel_passes.cse_written_variable.by_camel"
desc = "opt::cse gives the graph std::opt::cse gives on the var corpus too: the two products over two reads of a cell with a write between them are not merged, and the two constants they read are."
case = "../../../cases/opt/generic/written_variable.cml"
args = ["${case}", "opt::cse", "std::gir"]
verify_script_path = "../../../cases/opt/camel_passes/graph_equal.mjs"

[[tests]]
name = "camel_passes.cse_written_variable.program_still_runs"
desc = "The program after opt::cse prints what it printed before it, the same nine values the reference entry of `feat.opt.generic` (`written_variable.cse.nvm`) pins for the C++ pass."
case = "../../../cases/opt/generic/written_variable.cml"
args = ["${case}", "opt::cse", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_stdout_exact = "3\n2\n7\n3\n2\n7\n3\n2\n7\n"

# ---- dead values ----

# The dead values are not in the compiled graph by themselves: a `let` of the source that no
# expression reads is never built. `std::opt::inline` is what leaves values nobody reads — it takes
# the only user of `chain`'s product away — and the sweep is what removes them, the product first
# and the constant it reads after.

[[tests]]
name = "camel_passes.dce.subject"
desc = "The corpus one pass before the sweep: after std::opt::inline, `chain` holds a product no node reads, over a constant 2 that the product is the only user of — the node a sweep that stopped after one round would leave behind."
case = "../../../cases/opt/camel_passes/dce_subject.cml"
args = ["${case}", "std::opt::inline", "std::jgir"]
verify_script_path = "../../../cases/opt/camel_passes/dce_subject.mjs"

[[tests]]
name = "camel_passes.dce.by_cpp"
desc = "The reference: std::opt::dce restricted to values, after the inlining that leaves the dead chain."
kind = "snapshot"
case = "../../../cases/opt/camel_passes/dce_subject.cml"
args = ["${case}", "std::opt::inline", "std::opt::dce values_only=true", "std::gir"]
snapshot_stream = "stdout"
golden = "./golden/camel_passes.dce.dot"

[[tests]]
name = "camel_passes.dce.by_camel"
desc = "opt::dce, written in Camel with the graph module, gives the graph the C++ pass gives, on the corpus whose dead chain needs two rounds: the product, then the constant it reads."
case = "../../../cases/opt/camel_passes/dce_subject.cml"
args = ["${case}", "std::opt::inline", "opt::dce", "std::gir"]
verify_script_path = "../../../cases/opt/camel_passes/graph_equal.mjs"

[[tests]]
name = "camel_passes.dce.is_a_fixpoint"
desc = "opt::dce run on its own output gives the same graph: the sweep repeats its rounds until no value nobody reads is left, so removing `chain`'s product and leaving the constant it read behind is refused here."
kind = "differential"
case = "../../../cases/opt/camel_passes/dce_subject.cml"
args = ["${case}", "std::opt::inline", "opt::dce", "opt::dce", "std::gir"]
compare_to = "camel_passes.dce.by_camel"
compare_fields = ["exit_code", "stdout_normalized"]

[[tests]]
name = "camel_passes.dce.property"
desc = "What opt::dce leaves: no graph keeps a value nobody reads, and the value the program uses is still there — `kept`'s product is read by its sum and keeps both its operands."
case = "../../../cases/opt/camel_passes/dce_subject.cml"
args = ["${case}", "std::opt::inline", "opt::dce", "std::jgir"]
verify_script_path = "../../../cases/opt/camel_passes/dce_property.mjs"

[[tests]]
name = "camel_passes.dce.program_still_runs"
desc = "The program after opt::dce prints `chain(3)` and `kept(5)`: removing values nobody reads changed no result, on NVM, FastVM, JIT and the parallel scheduler."
case = "../../../cases/opt/camel_passes/dce_subject.cml"
args = ["${case}", "std::opt::inline", "opt::dce", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_stdout_exact = "5\n11\n"

# ---- constant folding ----

# A pure operation whose operands are constants is the value they compute. The corpus holds
# operations the compiler leaves in the graph — `chain` reaches one through a `let` chain, so the
# pass needs two rounds, and `compare` folds a comparison — beside an operation over a parameter
# that must not fold. Two literals of one expression are folded by the front end before any pass
# runs (`2 * 3` is one constant here), and a branch over constants (`&&`) is reduced by the C++
# pass as well and left by this one; both are recorded in `docs/technical/45_graph_module.md`.

[[tests]]
name = "camel_passes.fold.subject"
desc = "The corpus before any pass: `chain` holds an addition over a constant and a product over that addition (two rounds of folding), `compare` a comparison over two let-bound constants, and `live` an operation over a parameter that must stay — the guard refuses a corpus with nothing to fold."
case = "../../../cases/opt/camel_passes/fold_subject.cml"
args = ["${case}", "std::jgir"]
verify_script_path = "../../../cases/opt/camel_passes/fold_subject.mjs"

[[tests]]
name = "camel_passes.fold.by_cpp"
desc = "The reference: std::opt::fold on the corpus whose operations are over constants."
kind = "snapshot"
case = "../../../cases/opt/camel_passes/fold_subject.cml"
args = ["${case}", "std::opt::fold", "std::gir"]
snapshot_stream = "stdout"
golden = "./golden/camel_passes.fold.dot"

[[tests]]
name = "camel_passes.fold.by_camel"
desc = "opt::fold, written in Camel with the graph module's `eval`, gives the graph the C++ pass gives: the golden of the entry above, compared node by node and edge by edge."
case = "../../../cases/opt/camel_passes/fold_subject.cml"
args = ["${case}", "opt::fold", "std::gir"]
verify_script_path = "../../../cases/opt/camel_passes/graph_equal.mjs"

[[tests]]
name = "camel_passes.fold.same_text"
desc = "The two runs of `by_cpp` and `by_camel` as text: with the origin ids normalized the dumps are identical character for character, which is stronger than the isomorphic comparison and holds the two passes to the same node ids in the same order."
kind = "differential"
case = "../../../cases/opt/camel_passes/fold_subject.cml"
args = ["${case}", "opt::fold", "std::gir"]
compare_to = "camel_passes.fold.by_cpp"
compare_fields = ["exit_code", "stdout_normalized"]

[[tests]]
name = "camel_passes.fold.is_a_fixpoint"
desc = "opt::fold run on its own output gives the same graph: `chain` needs two rounds, so a version that folded one round and stopped is refused here."
kind = "differential"
case = "../../../cases/opt/camel_passes/fold_subject.cml"
args = ["${case}", "opt::fold", "opt::fold", "std::gir"]
compare_to = "camel_passes.fold.by_camel"
compare_fields = ["exit_code", "stdout_normalized"]

[[tests]]
name = "camel_passes.fold.property"
desc = "What opt::fold leaves: no operation over constants anywhere, the value `chain` and `compare` print is the constant the folding computed, and `live`'s operation over a parameter still reads its port."
case = "../../../cases/opt/camel_passes/fold_subject.cml"
args = ["${case}", "opt::fold", "std::jgir"]
verify_script_path = "../../../cases/opt/camel_passes/fold_property.mjs"

[[tests]]
name = "camel_passes.fold.program_still_runs"
desc = "The program after opt::fold prints what it printed before — `chain`'s 20 before `main`'s print of its 0, `compare`'s true, `live(4)`'s 13 — on NVM, FastVM, JIT and the parallel scheduler: folding a value into the constant it computes changed no result."
case = "../../../cases/opt/camel_passes/fold_subject.cml"
args = ["${case}", "opt::fold", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_stdout_exact = "20\n0\ntrue\n0\n13\n0\n"

# ---- a constant expression that can only fault ----

# `1 / 0` over two constants, in the value the function returns: the pass evaluates it — that is
# what warns where it is written — and may not replace it, because the returned value anchors its
# graph. Beside it sits an operation over two constants the same round does replace, so one round
# both evaluates a node it leaves and replaces one it keeps, and a pass that gave up on the round
# when it met the expression it could not replace is refused here. The expression is left as
# written, so the program faults where it is written exactly as it does without the pass.

[[tests]]
name = "camel_passes.fold_fault.subject"
desc = "The corpus before any pass: `main` returns the division `1 / 0` over two constants — a constant expression that can only fault, and the value the function returns — with `x * y` over two let-bound constants beside it ordered after the division, so one round holds a node the pass may not replace and one it does."
case = "../../../cases/opt/camel_passes/fold_fault.cml"
args = ["${case}", "std::jgir"]
verify_script_path = "../../../cases/opt/camel_passes/fold_fault_subject.mjs"

[[tests]]
name = "camel_passes.fold_fault.by_cpp"
desc = "The reference: std::opt::fold on a corpus whose returned value is a constant expression that can only fault — it warns where the expression is written, leaves it there, and folds the product beside it."
kind = "snapshot"
case = "../../../cases/opt/camel_passes/fold_fault.cml"
args = ["${case}", "std::opt::fold", "std::jgir"]
snapshot_stream = "stdout"
golden = "./golden/camel_passes.fold_fault.jgir"

[[tests]]
name = "camel_passes.fold_fault.same_text"
desc = "The two folds as text: with the origin ids and the paths normalized the dumps and the warnings are both identical character for character, so the Camel pass evaluates the same node, leaves it there and warns at the same position with the same words as the C++ pass."
kind = "differential"
case = "../../../cases/opt/camel_passes/fold_fault.cml"
args = ["${case}", "opt::fold", "std::jgir"]
compare_to = "camel_passes.fold_fault.by_cpp"
compare_fields = ["exit_code", "stdout_normalized", "stderr_normalized"]

[[tests]]
name = "camel_passes.fold_fault.property"
desc = "What opt::fold leaves: the division over constants is still the value the function returns, the product beside it is gone and its constant 6 reaches the print, no other operation over constants is left, and the order the source wrote is untouched."
case = "../../../cases/opt/camel_passes/fold_fault.cml"
args = ["${case}", "opt::fold", "std::jgir"]
verify_script_path = "../../../cases/opt/camel_passes/fold_fault_property.mjs"

[[tests]]
name = "camel_passes.fold_fault.without_the_pass"
desc = "The corpus with no pass at all: `main` returns `1 / 0`, so the run reports the division by zero where the expression is written and exits 1 — the run the entry below holds the folded program to."
case = "../../../cases/opt/camel_passes/fold_fault.cml"
args = ["${case}", "std::nvm"]
expect_exit = 1

[[tests]]
name = "camel_passes.fold_fault.same_run"
desc = "The program with the fold runs to the same fault as without it, on the same exit code and the same stdout: an expression that can only fault is left as written, so the run reaches it exactly as it did before (design principles 3.9). The warning the fold adds is on stderr and is compared by `same_text`."
kind = "differential"
case = "../../../cases/opt/camel_passes/fold_fault.cml"
args = ["${case}", "opt::fold", "std::nvm"]
expect_exit = 1
compare_to = "camel_passes.fold_fault.without_the_pass"
compare_fields = ["exit_code", "stdout_normalized"]

[[tests]]
name = "camel_passes.fold_fault.fault_is_reported"
desc = "Both reports are there when the folded program runs: the run-time DivisionByZero of the expression the fold left in place, and the fold's own ConstantExpressionFaults warning, both pointing at the position the expression is written at."
case = "../../../cases/opt/camel_passes/fold_fault.cml"
args = ["${case}", "opt::fold", "std::nvm"]
expect_exit = 1
verify_script = """
assert(input.exit_code === 1, 'the run faults: ' + input.exit_code)
assert(input.stdout.includes('RuntimeDiag::DivisionByZero'), 'the run reports the fault: ' + input.stdout)
assert(input.stderr.includes('RuntimeDiag::ConstantExpressionFaults'), 'the fold warns: ' + input.stderr)
assert(input.stdout.includes('9:15'), 'the run points at the expression: ' + input.stdout)
assert(input.stderr.includes('9:15'), 'the warning points at the expression: ' + input.stderr)
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths", "normalize_origins"]