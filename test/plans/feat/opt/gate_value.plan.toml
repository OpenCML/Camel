[[tests]]
name = "branch.graph"
case = "../../../cases/opt/generic/gate_branch_wait.cml"
args = ["${case}", "std::opt", "std::jgir"]
verify_script = '''
({input,assert})=>{
 const g=JSON.parse(input.normalized.stdout).graphs.find(g=>g.name==='main');
 const join=g.nodes.find(n=>n.kind==='JOIN');
 assert(join&&g.nodes.some(n=>n.kind==='BRCH'),'runtime branch disappeared');
 const arms=g.edges.filter(e=>e.target===join.id&&e.kind==='context');
 assert(arms.length===2&&arms.every(e=>g.nodes.find(n=>n.id===e.source).kind==='GATE'),'branch exit gates lost');
 assert(!g.edges.some(e=>e.target===join.id&&e.kind==='control'),'conditional wait made unconditional');
}
'''
