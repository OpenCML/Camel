[[tests]]
name = "recursion_unroll.simplify.rgir"
desc = "std::opt unrolls a recursion of constant depth: forward becomes straight-line code with no call or branch."
kind = "behavior"
case = "../../../cases/opt/generic/recursion_unroll.cml"
args = ["${case}", "std::opt", "${run_rgir}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
// Nodes of graph `name` itself (nested graphs excluded), as [kind, label] pairs.
const nodesOf = (text, name) => {
  const stack = []; const own = []
  for (const line of text.split('\n')) {
    if (line.includes('subgraph')) { stack.push(null); continue }
    const label = line.match(/label="([^"]*)";/)
    if (label && stack.length && stack[stack.length - 1] === null) { stack[stack.length - 1] = label[1]; continue }
    if (line.trim() === '}' && stack.length) { stack.pop(); continue }
    const node = line.match(/^\s*[NO][0-9A-F]+ \[label="([^"]*)", type="([A-Z_]+)"/)
    if (node && stack[stack.length - 1] === name) own.push([node[2], node[1]])
  }
  return own
}
const own = nodesOf(input.normalized.stdout, 'forward')
assert(own.some(([kind]) => kind === 'OPER'), `forward has no operators: ${JSON.stringify(own)}`)
for (const kind of ['FUNC', 'CALL', 'BRCH', 'JOIN']) {
  assert(!own.some(([k]) => k === kind), `forward still has ${kind}: ${JSON.stringify(own)}`)
}
}
"""
timeout_ms = 10000

