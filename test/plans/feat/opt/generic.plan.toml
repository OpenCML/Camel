[[tests]]
name = "static_branches.simplify.rgir"
desc = "After std::opt, main has no branch left."
kind = "behavior"
case = "../../../cases/opt/generic/static_branches.cml"
args = ["${case}", "std::opt", "${run_rgir}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
// Nodes of graph `name` itself (nested graphs excluded), as [kind, label] pairs.
const nodesOf = (text, name) => {
  const stack = []; const own = []
  for (const line of text.split('\n')) {
    if (line.includes('subgraph')) { stack.push(null); continue }
    const label = line.match(/label="([^"]*)";/)
    if (label && stack.length && stack[stack.length - 1] === null) { stack[stack.length - 1] = label[1]; continue }
    if (line.trim() === '}' && stack.length) { stack.pop(); continue }
    const node = line.match(/^\s*[NO][0-9A-F]+ \[label="([^"]*)", type="([A-Z_]+)"/)
    if (node && stack[stack.length - 1] === name) own.push([node[2], node[1]])
  }
  return own
}
const own = nodesOf(input.normalized.stdout, 'main')
assert(own.length > 0, 'no main graph in the dump')
assert(!own.some(([kind]) => kind === 'BRCH' || kind === 'JOIN'), `main still branches: ${JSON.stringify(own)}`)
}
"""
timeout_ms = 10000

