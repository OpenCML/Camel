[[tests]]
name = "fold_cast.rewrites"
desc = "A conversion (`e as T`, a CAST node) of a constant is a constant: after std::opt no CAST is left, for a conversion to the shape the compiler already knew, for one checked against the value (the source is declared a plain Tensor) and for a number converted to another primitive type. Folding used to leave every CAST, so nothing under `as` was a constant."
kind = "behavior"
case = "../../../cases/opt/generic/fold_cast.cml"
args = ["${case}", "std::opt", "std::gir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const count = (label) => (out.match(new RegExp(`label="${label}"`, 'g')) || []).length
assert(count('CAST') === 0, `a conversion of a constant was not folded: ${count('CAST')} CAST nodes left`)
assert(out.includes('label="31.5"'), 'the expression over the converted constants must fold to its value, 31.5')
assert(count(':io/println') >= 1, 'effects must be kept')
}
"""
