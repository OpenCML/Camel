assert(JSON.stringify(lines) === JSON.stringify(['start', 'seen [7, 8, 9]', 'count 7500']), `unexpected output: ${out}`)
assert(out.includes('[      0.,       1.,       0.'), `one-hot rows missing: ${out}`)
}
"""
timeout_ms = 8000

