[[tests]]
name = "specialize_dim_name_recursion.bounded"
desc = "The program after std::opt::specialize holds exactly one instance of the recursion (4 graphs in all): the call the entry makes takes the one instance, and the call inside it - the same function with a different key along the call cycle - binds nothing, because there the dimension name's extent is widened to `?`. The recursion therefore reaches a fixed point instead of taking a copy per level, and not by a count: kMaxTypeSpecializationsPerRecursiveFunction is on its way out (the ruling of 2026-10-24 evening, item 3), and these readings are the same with it at 8 and at 4096."
kind = "behavior"
case = "../../../cases/opt/generic/specialize_dim_name_recursion.cml"
args = ["${case}", "std::opt::specialize", "std::stats", "std::nvm"]
expect_exit = 0
expect_stderr_contains = ["DimensionNameUsedOnce"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const stats = JSON.parse(out.match(/GRAPH_STATS (\{.*\})/)[1])
assert(stats.graphs === 4, `unexpected graph count: ${stats.graphs}`)
assert(stats.specializations === 1, `unexpected specialization count: ${stats.specializations}`)
assert(stats.nodes === 48, `unexpected node count: ${stats.nodes}`)
assert(out.endsWith('4.0'), `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

[[tests]]
name = "specialize_dim_name_recursion.graph"
desc = "The graph of the same program names what the widening did to the types: the one instance the recursion takes is declared `(n: int, xs: f32[n]) => f32`, the declaration itself with the name still unbound and never the eight the entry argument is long, and the call inside it is a call of the base `walk` that takes no further instance."
kind = "behavior"
case = "../../../cases/opt/generic/specialize_dim_name_recursion.cml"
args = ["${case}", "std::opt::specialize", "std::jgir"]
expect_exit = 0
expect_stderr_contains = ["DimensionNameUsedOnce"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const doc = JSON.parse(input.normalized.stdout.match(/\{[\s\S]*\}/)[0])
const byId = new Map(doc.graphs.map((g) => [g.id, g]))
const base = doc.graphs.find((g) => g.name === 'walk')
const instance = doc.graphs.find((g) => g.name === 'walk$spec0')
assert(base && instance, `graphs: ${doc.graphs.map((g) => g.name).join(', ')}`)
assert(instance.signature === '(n: int, xs: f32[n]) => f32', `instance declared '${instance.signature}'`)
const call = instance.nodes.find((n) => n.callee !== undefined)
assert(call && byId.get(call.callee) === base, `the recursive call is bound to '${call && byId.get(call.callee).name}'`)
const instances = doc.graphs.filter((g) => g.name.startsWith('walk$'))
assert(instances.length === 1, `the recursion took ${instances.length} instances`)
}
"""
timeout_ms = 8000

