}
"""
timeout_ms = 8000

[[tests]]
name = "broken_branch.node_in_no_arm"
desc = "The branch-arm invariant (docs/technical/17_graph_rewrite_api_contracts.md, 4.1) is checked when a rewrite is committed, in release builds too. The test-only pass test::leak_branch_arm (a test-only pass) adds a node that waits on a BRCH and that only the JOIN waits on: it runs because of the branch and belongs to no arm. The commit is rejected as PassInternalError naming the pass, the graph, the node, the BRCH and the JOIN, and nothing executes. Such a graph passed every other structural check; the back ends lay the node out behind the last arm and never run it."
kind = "behavior"
case = "../../../cases/opt/generic/broken_branch.cml"
args = ["--output-format", "json", "${case}", "test::leak_branch_arm", "std::fvm"]

expect_exit = 1
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout + input.normalized.stderr
assert(out.includes('"stage":"pass:test::leak_branch_arm"'), `stage missing: ${out}`)
assert(out.includes('"name":"RuntimeDiag::PassInternalError"'), `name missing: ${out}`)
assert(/Runtime graph 'main' breaks the branch-arm invariant: SYNC \d+ runs between BRCH \d+ and its JOIN \d+ and belongs to no arm/.test(out), `reason missing: ${out}`)
assert(!out.includes('main start'), `the program ran: ${out}`)
}
"""
timeout_ms = 8000

[[tests]]
name = "broken_branch.node_in_two_arms"
desc = "The other half of the branch-arm invariant: test::share_branch_arm makes the second arm of a branch wait on the first, so the first arm's code belongs to two arms (it would run only when the first arm is taken, and the second reads it). The commit is rejected as PassInternalError naming the node and the two arms, and nothing executes."
kind = "behavior"
