[[tests]]
name = "graph_too_large.diagnostic"
desc = "A pass that builds a graph too large for the runtime representation (here the test-only pass test::overgrow_graph, which adds COPY nodes to `main` until its edges exceed 65535) is stopped with RuntimeDiag::GraphTooLarge at the definition of the function, naming the pass, the graph, the quantity, the size it needs and the limit, and nothing executes. It used to be the unlocated PassInternalError '... exceeds the target integral width'."
kind = "negative"
case = "../../../cases/opt/generic/broken_graph.cml"
args = ["${case}", "test::overgrow_graph", "std::fvm"]
envs = ["CAMEL_ENABLE_TEST_PASSES=1"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::GraphTooLarge"
expect_diagnostic_code = "0x04000013"
expect_diagnostic_line = 10
expect_diagnostic_column = 1
expect_output_contains = ["Pass 'test::overgrow_graph' cannot build graph 'main': it needs ", " edges (every input of every node is one)", "and one graph holds at most 65535."]
expect_output_not_contains = ["main start", "internal error", "integral width", ":?:?:"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "graph_too_large.diagnostic_json"
desc = "The same in --output-format json: one diagnostic, GraphTooLarge, stage pass:test::overgrow_graph, the range of `main`, a size above the limit."
kind = "behavior"
case = "../../../cases/opt/generic/broken_graph.cml"
args = ["--output-format", "json", "${case}", "test::overgrow_graph", "std::fvm"]
envs = ["CAMEL_ENABLE_TEST_PASSES=1"]
expect_exit = 1
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const diags = JSON.parse(input.normalized.stdout)
assert(diags.length === 1, `expected one diagnostic, got ${diags.length}`)
const d = diags[0]
assert(d.data.name === 'RuntimeDiag::GraphTooLarge' && d.code === '0x04000013', `unexpected diagnostic ${d.data.name} ${d.code}`)
assert(d.data.stage === 'pass:test::overgrow_graph', `stage ${d.data.stage}`)
const m = /cannot build graph 'main': it needs (\d+) edges .* holds at most (\d+)[.]/.exec(d.message)
assert(m && Number(m[2]) === 65535 && Number(m[1]) > 65535, `graph, size and limit are missing: ${d.message}`)
assert(d.range.start.line === 9 && d.range.start.character === 0, `unexpected range ${JSON.stringify(d.range)}`)
}
"""
timeout_ms = 8000

[[tests]]
name = "fold_cast.rewrites"
desc = "A conversion (`e as T`, a CAST node) of a constant is a constant: after std::opt::simplify no CAST is left, for a conversion to the shape the compiler already knew, for one checked against the value (the source is declared a plain Tensor) and for a number converted to another primitive type. Folding used to leave every CAST, so nothing under `as` was a constant."
kind = "behavior"
case = "../../../cases/opt/generic/fold_cast.cml"
args = ["${case}", "std::opt::simplify", "std::rgir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const count = (label) => (out.match(new RegExp(`label="${label}"`, 'g')) || []).length
assert(count('CAST') === 0, `a conversion of a constant was not folded: ${count('CAST')} CAST nodes left`)
assert(out.includes('label="31.5"'), 'the expression over the converted constants must fold to its value, 31.5')
assert(count(':io/println') >= 1, 'effects must be kept')
}
"""
timeout_ms = 8000

[[tests]]
name = "fold_cast.results"
