[[tests]]
name = "fold_struct_cast.in_return_position"
desc = "A Safe conversion of a constant struct in return position is folded after std::opt: the function graph's returned value is also its exit and output value, and folding it moves those anchors to the constant (design principles 5.1, 5.2: the conversion only names the type the value is used as and moves nothing). Folding used to treat the graph's returned value as a pinned anchor, so `mk` kept a CAST over its folded constant, and every inlining of `mk` copied the unfolded conversion. The final graph must hold no CAST, and the folded constant must keep the declared type P."
kind = "behavior"
case = "../../../cases/opt/generic/fold_struct_cast.cml"
args = ["${case}", "std::opt", "std::gir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const count = (label) => (out.match(new RegExp(`label="${label}"`, 'g')) || []).length
assert(count('CAST') === 0, `a struct conversion of a constant in return position was not folded: ${count('CAST')} CAST nodes left`)
assert(out.includes('value_type="P"'), 'the folded constant must keep the declared result type P')
assert(out.includes('label="{ a: 3, b: 1.5 }"'), 'the returned struct must be folded to its value')
}
"""
timeout_ms = 8000

