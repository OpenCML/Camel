[[tests]]
name = "shape_unroll.simplify.rgir"
desc = "std::opt specializes forward to its argument's static shape, folds shape(x) and unrolls the recursion: the specialized forward and everything it calls are branch-free."
kind = "behavior"
case = "../../../cases/opt/generic/shape_unroll.cml"
args = ["${case}", "std::opt", "${run_rgir}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
// Nodes of every graph, by graph name (nested graphs are separate entries). The DOT writer
// breaks a label that does not fit into lines (`run$t\nspec3`), so a name is compared without
// those breaks: a longer specialization name is still the name of its graph.
const unwrap = (text) => text.replace(/\\n/g, '')
const graphs = {}
const stack = []
for (const line of input.normalized.stdout.split('\n')) {
  if (line.includes('subgraph')) { stack.push(null); continue }
  const label = line.match(/label="([^"]*)";/)
  if (label && stack.length && stack[stack.length - 1] === null) { stack[stack.length - 1] = unwrap(label[1]); graphs[unwrap(label[1])] = []; continue }
  if (line.trim() === '}' && stack.length) { stack.pop(); continue }
  const node = line.match(/^\s*[NO][0-9A-F]+ \[label="([^"]*)", type="([A-Z_]+)"/)
  if (node && stack.length && stack[stack.length - 1]) {
    // The rich dump wraps a label to two short lines and cuts it with '...' (`run$tsp\nec6$...`),
    // and keeps the whole label in the tooltip before the record: read the name from there.
    const tip = line.match(/tooltip="([^"]*)"/)
    const full = tip ? tip[1].split('\\n')[0] : unwrap(node[1])
    graphs[stack[stack.length - 1]].push([node[2], full])
  }
}
const specialized = Object.keys(graphs).filter((name) => name.startsWith('forward$'))
assert(specialized.length === 1, `expected one specialized forward, got ${specialized}`)
const forward = graphs[specialized[0]]
assert(!forward.some(([k]) => k === 'BRCH'), `specialized forward branches: ${JSON.stringify(forward)}`)
for (const [kind, callee] of forward.filter(([k]) => k === 'FUNC')) {
  const body = graphs[callee]
  assert(body, `callee ${callee} not in the dump`)
  assert(!body.some(([k]) => ['BRCH', 'FUNC', 'CALL'].includes(k)), `callee ${callee} not straight-line: ${JSON.stringify(body)}`)
  // The end of the unrolled chain is the base case (`t >= steps` known true): it returns one of
  // its parameters and has no operator. Every other callee computes something.
  assert(body.some(([k]) => k === 'OPER') || body.every(([k]) => ['PORT', 'EXIT'].includes(k)), `callee ${callee} neither computes nor forwards: ${JSON.stringify(body)}`)
}
}
"""
timeout_ms = 10000

[[tests]]
name = "effect_order_folded.nvm"
desc = "An effect before code simplify folds away still runs first, an arm reading a value computed before its branch is entered after the branch, and tail calls through nested branches keep the stack flat (NodeVM)."
