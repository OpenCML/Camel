[[tests]]
name = "cse_arm_constants.inline_cse.nvm"
desc = "Equal literals in arms of different branches stay separate nodes for std::opt::cse after the arms are inlined (merging them made a node of one branch wait on the other BRCH: 'Cycle detected while building runtime execution topo'). Under: std::inline std::opt::cse."
