id = "opt.generic"
order = 321
tier = "feat"
tags = ["feat", "opt", "generic"]

[[tests]]
name = "results_reference"
desc = "Results and print order of the generic-pass inputs are unchanged by: no pass."
kind = "behavior"
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
assert(out === 'before\nafter\ngeneric a=23 p=1 q=1 r=2', `unexpected output: ${out}`)
}
"""
timeout_ms = 4000

