[[tests]]
name = "perm_space_exhausted.diagnostic"
desc = "Exhausting the permanent space inside a pass is RuntimeDiag::MemoryExhausted with the stage of the pass, raised before anything executes, naming the space, the limit and the variable that raises it (it used to be a write through null: the guard was an ASSERT, compiled out in release builds; then a PassInternalError). The budget is lifted by CAMEL_OPT_GROWTH_BUDGET to reach the limit, and the space is limited to 2 MB so that the limit is reached in a few seconds (it was 32 MB, the size of the space when it could not grow, until frame layouts were interned, then 16 MB until they moved into the graphs' own blocks: the same run now ends by itself with 2.9 MB in use)."
kind = "behavior"
case = "../../../cases/opt/generic/specialize_growing_shape.cml"
args = ["--output-format", "json", "${case}", "std::opt::simplify", "std::nvm"]
envs = ["CAMEL_OPT_GROWTH_BUDGET=100000000", "CAMEL_PERM_SPACE_LIMIT_MB=2"]
expect_exit = 1
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout + input.normalized.stderr
assert(out.includes('"stage":"pass:std::opt::simplify"'), `stage missing: ${out}`)
assert(out.includes('"name":"RuntimeDiag::MemoryExhausted"'), `name missing: ${out}`)
assert(out.includes('The permanent space (types and layouts) is exhausted'), `reason missing: ${out}`)
assert(out.includes('of the limit of 2.0 MB are in use'), `limit missing: ${out}`)
assert(out.includes('set CAMEL_PERM_SPACE_LIMIT_MB=<megabytes> to raise the limit (it is 2 now)'), `advice missing: ${out}`)
assert(!out.includes('[12, 2]'), `the program ran: ${out}`)
}
"""
timeout_ms = 30000

