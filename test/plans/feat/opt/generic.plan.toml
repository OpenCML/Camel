[[tests]]
name = "perm_space_exhausted.diagnostic"
desc = "Exhausting the permanent space inside a pass is RuntimeDiag::MemoryExhausted with the stage of the pass, raised before anything executes, naming the space, the limit and the variable that raises it (it used to be a write through null: the guard was an ASSERT, compiled out in release builds; then a PassInternalError). The test-only pass test::exhaust_perm_space makes types of ever more members, and the space is limited to 2 MB so that the limit is reached at once."
kind = "behavior"
case = "../../../cases/opt/generic/specialize_growing_shape.cml"
args = ["--output-format", "json", "${case}", "test::exhaust_perm_space", "std::nvm"]
envs = ["CAMEL_PERM_SPACE_LIMIT_MB=2"]
expect_exit = 1
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout + input.normalized.stderr
assert(out.includes('"stage":"pass:test::exhaust_perm_space"'), `stage missing: ${out}`)
assert(out.includes('"name":"RuntimeDiag::MemoryExhausted"'), `name missing: ${out}`)
assert(out.includes('The permanent space (types and layouts) is exhausted'), `reason missing: ${out}`)
assert(out.includes('of the limit of 2.0 MB are in use'), `limit missing: ${out}`)
assert(out.includes('set CAMEL_PERM_SPACE_LIMIT_MB=<megabytes> to raise the limit (it is 2 now)'), `advice missing: ${out}`)
assert(!out.includes('[12, 2]'), `the program ran: ${out}`)
}
"""
timeout_ms = 30000

[[tests]]
name = "broken_graph.commit_validation"
desc = "D23: structural validation runs when a rewrite is committed, in release builds too. The test-only pass test::drop_call_argument (a test-only pass) commits a call that passes fewer arguments than its callee takes; the commit is rejected as PassInternalError naming the pass, and nothing executes. Before, nvm/fvm/jit ran the broken program and printed 0 instead of 42."
kind = "behavior"
case = "../../../cases/opt/generic/broken_graph.cml"
args = ["--output-format", "json", "${case}", "test::drop_call_argument", "std::fvm"]

expect_exit = 1
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout + input.normalized.stderr
assert(out.includes('"stage":"pass:test::drop_call_argument"'), `stage missing: ${out}`)
assert(out.includes('"name":"RuntimeDiag::PassInternalError"'), `name missing: ${out}`)
assert(/Runtime graph 'main' has FUNC node \d+ passing 0 arguments and 0 'with' arguments to 'twice', which takes 1 and 0/.test(out), `reason missing: ${out}`)
assert(!out.includes('main start'), `the program ran: ${out}`)
}
"""
timeout_ms = 8000

[[tests]]
name = "broken_graph.test_pass_is_not_in_a_pipeline"
desc = "The fault-injection pass is a test-only pass: no pipeline adds it, so a run that names no pass is untouched and the program runs."
kind = "behavior"
