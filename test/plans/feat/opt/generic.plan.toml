[[tests]]
name = "simplify_growth_budget.table_is_not_an_owner"
desc = "A specialization belongs to the program, not to the session that made it, but the table is a cache, not an owner. std::opt simplifies in rounds, each a session over the program the round before produced; a copy made in one round is found in the next while the program still reaches it, instead of being made again. A commit binds the graphs the root reaches and drops the entries whose copy nothing reachable calls any more (the author's ruling: the cache does not keep a graph alive, and a later round that needs the binding makes the copy again). fib(10) and fib(18) inline the copies they specialize into the model, so those copies become unreachable immediately: the numbers the four surviving copies carry are the ones a program that made every copy again would give them (fib$spec123..fib$spec130), and the table that H44b measured at 20 entries (it pinned every copy it had made) now holds only the copies the root reaches. The reachable program itself is unchanged: it reaches the same copies the round before produced (H100: the rules library's algebra removes one more operation than the old C++ pass did)."
kind = "behavior"
case = "../../../cases/opt/generic/simplify_growth_budget.cml"
args = ["${case}", "std::opt", "std::stats", "std::jgir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const at = out.indexOf('GRAPH_STATS ')
const stats = JSON.parse(out.slice(at + 'GRAPH_STATS '.length, out.indexOf('}', at) + 1))
const names = JSON.parse(out.slice(out.indexOf('}', at) + 1).trim()).graphs.map((g) => g.name)
const specialized = names.filter((name) => name.startsWith('fib$')).sort()
assert(JSON.stringify(specialized) === JSON.stringify(['fib$spec123', 'fib$spec124', 'fib$spec126', 'fib$spec130']), `the copies that survive are not the ones the program reaches: ${specialized}`)
assert(stats.specializations === specialized.length, `the table must hold exactly the copies the program reaches, got ${stats.specializations} for ${specialized.length} reachable copies`)
}
"""
timeout_ms = 8000

[[tests]]
name = "specialization_survives_the_round.copy_is_reused_in_a_later_round"
desc = "A specialization belongs to the program, not to the session that made it, and a later round that binds the same (function, values) gets the copy back instead of making a second one -- while the program still reaches it. walk's first argument drives the unrolling (walk(6) makes walk(5), which makes walk(4), ...) and its second starts in a `var` that does not escape, so it becomes SSA (the graph has no :var/get) and every copy works on the value the write made; spin is recursive, so every copy keeps reaching a recursion, is not inlined and stays reachable from the root in the rounds that follow. The copy the first chain made for walk(5, 4) is handed back to a later request for the same value (the request adds no copy, and the shared copy is named twice in the document), while the request walk(4, k) binds a different value and makes its own chain: the copies the program reaches are all the table holds, where a table that lives with the session would keep the copies it made. The other side is here too: tick's copies are inlined into main in the round that makes them, so the commit drops their entries and the table reports only the copies the root still reaches, not the ones a table that pinned the graphs it named would count. The reachable program is unchanged."
kind = "behavior"
case = "../../../cases/opt/generic/specialization_survives_the_round.cml"
args = ["${case}", "std::opt", "std::stats", "std::jgir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const at = out.indexOf('GRAPH_STATS ')
const stats = JSON.parse(out.slice(at + 'GRAPH_STATS '.length, out.indexOf('}', at) + 1))
const graphs = JSON.parse(out.slice(out.indexOf('}', at) + 1).trim()).graphs
const names = graphs.map((g) => g.name)
const specialized = names.filter((name) => name.startsWith('walk$')).sort()
assert(JSON.stringify(specialized) === JSON.stringify(['walk$spec0', 'walk$spec1', 'walk$spec13', 'walk$spec15', 'walk$spec2', 'walk$spec23', 'walk$spec25', 'walk$spec27', 'walk$spec29', 'walk$spec39', 'walk$spec7', 'walk$spec9']), `the copies that survive are not the ones the program reaches: ${specialized}`)
assert(stats.specializations === specialized.length, `the table must hold exactly the copies the program reaches, got ${stats.specializations} for ${specialized.length} reachable copies`)
assert(!names.some((name) => name.startsWith('tick$')), `a copy whose caller inlined it must not be kept: ${names.filter((name) => name.startsWith('tick$'))}`)
// The request for walk(5, 4) binds a value the first chain already bound, so it gets that copy
// back instead of making a second one: the copy is named twice in the document (its own graph and
// the call that reuses it), where a copy that only one chain reached is named once.
const named = {}
for (const m of input.normalized.stdout.matchAll(/"(walk\$spec\d+)"/g)) { named[m[1]] = (named[m[1]] || 0) + 1 }
const shared = Object.keys(named).filter((name) => named[name] > 1)
assert(shared.length > 0, `the request for a value the first chain bound must get that copy back, so some copy is named twice; found ${JSON.stringify(named)}`)
}
"""
timeout_ms = 8000

[[tests]]
name = "specialization_survives_the_round.results_are_unchanged"
desc = "The copies the simplifier reuses compute the same values: the optimized program prints what the plain one does."
kind = "behavior"
case = "../../../cases/opt/generic/specialization_survives_the_round.cml"
args = ["${case}", "std::opt", "${run_nvm}"]
expect_exit = 0
expect_stdout_exact = "87\n16\n86\n45\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

[[tests]]
name = "fold_cast.failing_is_kept"
desc = "A conversion of a constant that fails is not folded: the CAST stays in the simplified graph, and compiling is not an error."
kind = "behavior"
case = "../../../cases/opt/generic/fold_cast_fails.cml"
args = ["${case}", "std::opt", "std::gir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const count = (label) => (out.match(new RegExp(`label="${label}"`, 'g')) || []).length
assert(count('CAST') >= 1, 'the failing conversion must stay in the graph')
}
"""
timeout_ms = 8000

[[tests]]
name = "fold_cast.failing_fails_at_run_time"
desc = "The failing conversion left by folding fails when the simplified program runs, after what ran before it, with the conversion's own error at the conversion."
kind = "negative"
case = "../../../cases/opt/generic/fold_cast_fails.cml"
args = ["${case}", "std::opt", "${run_nvm}"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::RuntimeError"
expect_diagnostic_line = 14
expect_diagnostic_column = 13
expect_output_contains = ["before", "conversion to 'Tensor<float32, [3, 2]>' failed: the tensor has shape [2, 3]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000
