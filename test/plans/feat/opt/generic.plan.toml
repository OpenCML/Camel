[[tests]]
name = "integrated_rewrites"
desc = "The std::opt entry folds constants, merges duplicate expressions and removes unused products while retaining effects."
kind = "behavior"
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "std::opt", "std::jgir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
    const graph = JSON.parse(input.normalized.stdout).graphs.find(g => g.name === '__root__')
    assert(graph, 'root graph missing')
    const count = uri => graph.nodes.filter(n => n.label === uri).length
    assert(count(':op/mul_l') === 3, `expected 3 multiplications, got ${count(':op/mul_l')}`)
    assert(count(':op/add_l') === 2, `expected 2 additions, got ${count(':op/add_l')}`)
    assert(count(':io/println') === 3, 'effects must be kept')
    assert(graph.nodes.some(n => n.kind === 'DATA' && n.label === '23'), 'constant expression was not folded')
}
"""
timeout_ms = 10000

