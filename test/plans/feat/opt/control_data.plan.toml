[[tests]]
name = "control_data.graph"
case = "../../../cases/opt/generic/control_data_paths.cml"
args = ["${case}", "std::macro", "std::opt", "std::jgir"]
verify_script = '''
({ input, assert }) => {
 const g = JSON.parse(input.normalized.stdout).graphs.find(g => g.name === 'main')
 const nodes = new Map(g.nodes.map(n => [n.id, n]))
 const controls = g.edges.filter(e => e.kind === 'control')
 assert(g.normalPorts.length === 2, 'runtime inputs were specialized away')
 assert(g.nodes.some(n => n.label === ':op/mul_d'), 'gradient folded away')
 assert(controls.length <= 10, 'data-covered controls survived')
 const joins = new Set(g.nodes.filter(n => n.kind === 'JOIN').map(n => n.id))
 assert(joins.size === 1, 'branch completion was lost')
 for (const e of controls) {
   if (joins.has(e.source)) assert(nodes.get(e.target).kind === 'GATE', 'JOIN control duplicates data ordering')
 }
 // No alternate path may use the candidate edge itself or a conditional arm.
 for (const edge of controls) {
   if (nodes.get(edge.target).kind !== 'OPER' || nodes.get(edge.source).kind === 'BRCH') continue
   const seen = new Set(), work = g.edges.filter(e => e.target === edge.target && e !== edge).map(e => e.source)
   while (work.length) {
     const n = work.pop()
     assert(n !== edge.source, 'ordinary operator retained a proven data-covered control')
     if (seen.has(n) || ['BRCH', 'JOIN', 'LOOP'].includes(nodes.get(n).kind)) continue
     seen.add(n)
     work.push(...g.edges.filter(e => e.target === n).map(e => e.source))
   }
 }
}
'''

