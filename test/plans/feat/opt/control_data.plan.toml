order = 328
tier = "fast"
tags = ["feat", "opt", "control", "branch"]

[defaults]
kind = "behavior"
expect_exit = 0
timeout_ms = 8000
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]


[[tests]]
name = "control_data.unused_argument.reference"
case = "../../../cases/opt/generic/control_unused_argument.cml"
args = ["${case}","${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["stdout_normalized"]
verify_script = '''
({ input, assert }) => {
 assert(input.normalized.stdout.trim() === 'before\nafter', input.normalized.stdout)
}
'''

