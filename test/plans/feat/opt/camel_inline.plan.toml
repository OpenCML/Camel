id = "opt.camel_inline"
order = 488
tier = "fast"
tags = ["feat", "opt", "inline", "recursion", "camel"]

# The recursion rule of `opt::inline` (stdlib/opt.cml), and its control.
#
# A pass that expands a call whose callee recurses does not stop there: expanding `down` into `main`
# brings `down(n - 1)` into `main`, that call is still not a call of the graph being edited, and the
# next round expands it again until the whole growth budget is spent -- `main` grew to 4095 nodes on
# the first corpus below. The C++ engine declines exactly these calls (`InlineRewriteConfig`, "which
# functions recurse"), so the pass reads that rule too: `callee_is_self` for the call inside the
# recursive function, and `recurses` (a walk of the callee's own call graph, in stdlib/opt.cml) for
# the calls made from outside it.
#
# The four corpora are the four shapes:
#
#   self_recursion   one function that calls itself: nothing is inlined, on either side;
#   mutual_recursion a pair that calls each other: nothing is inlined, on either side;
#   two_level_call   a plain two-level call: everything is inlined -- the control that says the
#                    recursion rule did not stop the pass from working;
#   mixed_call_sites one callee called at three places, one of them its own: the two calls `main`
#                    makes stay as well, because the callee recurses.
#
# Each entry reads the graphs with `std::jgir` and compares, graph by graph, the number of call
# sites (CALL and FUNC nodes) and the number of nodes. The `by_cpp` entry is the C++ implementation
# on the same file: it is the side the rule is read from, and three of the four corpora come out
# identical to the letter. The mutual pair is the one difference, written down instead of hidden:
# the C++ engine also inlines inside the cycle (`is_even` 9 nodes -> 16), while this pass declines
# both directions (9 nodes) -- "less inlined" is what stdlib/opt.cml's header says this pass may be.
#
# The last assertion of every entry is the one the first corpus taught: no graph is above 64 nodes,
# so a pass that forgot the rule cannot come back as a green reading of a corpus that merely fits.

[[tests]]
name = "camel_inline.self_recursion.by_cpp"
desc = "The C++ inlining on a function that calls itself: nothing is inlined, so `main` keeps its call to `down` and `down` keeps its own, and the graphs are the ones the corpus wrote."
kind = "behavior"
case = "../../../cases/opt/camel_inline/self_recursion.cml"
args = ["${case}", "std::cxx::inline", "std::jgir", "std::nop"]
expect_exit = 0
timeout_ms = 20000
verify_script = """
({ input }) => {
    const doc = JSON.parse(input.normalized.stdout)
    const fail = (why) => { throw new Error("std::cxx::inline, self_recursion: " + why) }
    const calls = (g) => g.nodes.filter((n) => n.kind === "CALL" || n.kind === "FUNC").length
    const got = {}
    for (const g of doc.graphs || []) got[g.name] = calls(g) + "/" + g.nodes.length
    const want = { __root__: "1/2", main: "1/7", down: "1/11" }
    for (const name of Object.keys(want)) {
        if (got[name] !== want[name]) fail(name + " is " + (got[name] || "missing") + ", not " + want[name])
    }
    for (const g of doc.graphs || []) {
        if (g.nodes.length > 64) fail(g.name + " holds " + g.nodes.length + " nodes: a recursive callee was expanded")
    }
}
"""

