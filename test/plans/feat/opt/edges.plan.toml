id = "opt.edges"
order = 323
tier = "fast"
tags = ["feat", "opt", "validation"]

# A commit enforces the edge invariants of a graph (docs/design/graph-store 5.4): no cycle of
# inputs, the types agree along the edges, and no order edge on a pure node (docs/design/effects/
# edges.cn.md 4.6). The test passes edit the root graph through the draft API in ways a pass could
# and commit; the commit refuses the broken ones.

[defaults]
kind = "behavior"
case = "../../../cases/opt/generic/generic_passes.cml"
timeout_ms = 20000
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]

[[tests]]
name = "valid_edit_is_accepted"
desc = "Control: a node that breaks no invariant commits, and the session hands out one graph at one address for as long as it edits it (the pass keeps its graph by reference)."
args = ["${case}", "test::edges_ok"]
expect_stdout_contains = ["EDGES accepted", "EDGES transaction stable"]
expect_output_not_contains = ["refused", "transaction moved"]

[[tests]]
name = "cycle_is_refused"
desc = "Two nodes that wait on each other form a cycle of control inputs; the commit names the cycle."
args = ["${case}", "test::edges_cycle"]
expect_stdout_contains = ["EDGES refused", "lies on a cycle of inputs"]

[[tests]]
name = "copy_type_mismatch_is_refused"
desc = "A COPY typed i32 of an f32 value: the types disagree along the edge."
args = ["${case}", "test::edges_type"]
expect_stdout_contains = ["EDGES refused", "copies a f32 as a i32"]

[[tests]]
name = "order_edge_survives_the_commit"
desc = "An order edge is not a port and not a control input: it is written once, it is kept out of the node's input runs, and the graph the commit makes holds it in its own array, from which it is read back by the user's predecessors (docs/design/effects/edges.cn.md 1.5, 5)."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edges_order_ok"]
expect_stdout_contains = ["ORDER wrote=1 twice=0", "ORDER preds=1 users=1", "ORDER wrote_reversed=11", "EDGES accepted", "ORDER frozen_agrees=1 some_node_ordered=1 frozen_sorted=1"]

[[tests]]
name = "order_edge_on_a_pure_node_is_refused"
desc = "Nothing orders a pure node: a constant computes a value from nothing a resource owns, so an order edge on it is a graph the builder must not have produced, and the seal check names it (docs/design/effects/edges.cn.md 4.6). The negative case is built on the finished graph, where the check owns the rule: a draft no longer produces such a graph at all (the encoder drops the edge and the committed graph has none), so the bad graph is written straight into the frozen records the check reads."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edges_order_pure"]
expect_stdout_contains = ["ORDER wrote=1", "ORDER frozen_edges=0", "EDGES refused", "is on a pure node"]

[[tests]]
name = "order_edge_orders_the_nodes_that_run"
desc = "An order edge is what a scheduler lays out by: of two nodes the exit waits for, the one the order edge names second comes first in the execution plan, and a node the order edge only names as a predecessor, which nothing else reaches, does not enter the plan at all (docs/design/effects/edges.cn.md 1.5, 2: order orders, it does not execute)."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edges_order_schedule"]
expect_stdout_contains = ["ORDER wrote=11", "EDGES accepted", "ORDER ordered_pairs=1 obeyed=1", "ORDER unexecuted_pred_absent=1"]

[[tests]]
name = "order_edges_survive_a_removed_node"
desc = "Removing a node keeps the ordering that passed through it: of the chain A -> B -> C the graph loses B and keeps A -> C, through the same eraseNode call a dead-code pass makes (docs/design/effects/edges.cn.md 4). B is an anchor no pass may arrange freely, so the graph may carry an order edge on it at all (4.6)."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edges_order_splice"]
verify_script = '''
({ input, assert }) => {
  const lines = input.normalized.stdout.trim().split('\n')
  assert(lines[1] === 'EDGES accepted', input.normalized.stdout)
  const chain = lines[0].split(/\s+/).slice(2).map(s => s.split('>'))
  const kept = lines[2].split(/\s+/).slice(2).map(s => s.split('>'))
  assert(chain.length === 2, 'the anchor chain was not written: ' + input.normalized.stdout)
  assert(kept.length === 1, 'A -> C was not kept: ' + input.normalized.stdout)
  assert(chain[0][0] === kept[0][0] && chain[1][1] === kept[0][1],
    'the kept edge is not A -> C: ' + input.normalized.stdout)
}
'''

[[tests]]
name = "order_edges_follow_a_replacement"
desc = "A replacement takes the replaced node's order edges in both directions: of A -> B -> C the replacer D takes B's place and the graph holds A -> D and D -> C, not A -> C (docs/design/effects/edges.cn.md 4)."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edges_order_replace"]
verify_script = '''
({ input, assert }) => {
  const lines = input.normalized.stdout.trim().split('\n')
  assert(lines[1].startsWith('EDGES accepted replacer='), input.normalized.stdout)
  const replacer = lines[1].split('=')[1]
  const chain = lines[0].split(/\s+/).slice(2).map(s => s.split('>'))
  const kept = lines[2].split(/\s+/).slice(2).map(s => s.split('>'))
  assert(chain.length === 2, 'the anchor chain was not written: ' + input.normalized.stdout)
  assert(kept.length === 2, 'the replacement did not take both orderings: ' + input.normalized.stdout)
  assert(kept.some(e => e[0] === chain[0][0] && e[1] === replacer) &&
    kept.some(e => e[0] === replacer && e[1] === chain[1][1]),
    'the orderings did not reach the replacer: ' + input.normalized.stdout)
}
'''

[[tests]]
name = "gate_waits_on_the_sync_chain"
desc = "docs/design/effects/edges.cn.md 5.3: a GATE is one data port reading a value and one sync predecessor, which is the chain's tail, and it has no control input at all. The commit accepts that shape and keeps the GATE instead of dissolving it into its input, because 5.3 lets a GATE be replaced by its input only once its sync predecessor is gone."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edges_sync_gate"]
expect_stdout_contains = ["SYNCGATE wrote=1 ctrl=0", "EDGES accepted", "SYNCGATE frozen_sync_edges=1 gates=1 gates_waiting_on_the_chain=1 gates_with_ctrl=0"]

[[tests]]
name = "sync_chain_place_is_handed_to_a_gate"
desc = "A three-statement chain A -> B -> C replaces B by a shared pure value. The replacement has real sync and order edges to inherit, so the draft must produce A -> GATE(value) -> C and put the order edge on that GATE, never on the pure value. Exactly one GATE is added; the value's ordinary COPY reader stays direct. A second replacement with no old sync edges must not invent a chain place or another GATE, which separates a legal handover from manufacturing a position."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edges_sync_gate"]
expect_stdout_contains = ["EDGES accepted", "SYNCPLACE middle_gate=1 predecessor=1 successor=1 gate_delta=1 shared_value_direct=1 order_on_gate=1 order_on_value=0"]
expect_output_not_contains = ["refused"]

[[tests]]
name = "sync_chain_fork_is_refused"
desc = "The other half of the same rule: one statement follows one other at most *and* one statement follows it. A statement two statements of its block follow is a chain that forks, which is no chain, so a rewrite that leaves the graph in that state -- an inline splice that cannot put a statement in its place without making the graph wait on itself -- is refused by the seal, which names the statement the two follow, rather than freezing a chain the layout may walk one way and silently drop the other."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edges_sync_fork"]
expect_stdout_contains = ["SYNCFORK fork=", "EDGES refused", "sync chain forks at node", "block's statements are one chain"]

[[tests]]
name = "a_chain_end_hands_its_value_on_to_two_blocks"
desc = "What 5.3 allows and the fork check must not report: the one chain end hands its value on, and a GATE does that for a block that ends on it, so two GATEs may follow one statement. An end of the chain is not a continuation of it."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edges_sync_fork_gate"]
expect_stdout_contains = ["SYNCFORKGATE tail=", "EDGES accepted"]
expect_output_not_contains = ["refused"]

[[tests]]
name = "commit_conflict_is_detected"
desc = "Three sessions on one program (design 4.3.1): after the first commits, the one that wrote the same graph conflicts and its checked commit is refused; the one that wrote another graph does not conflict."
case = "../../../cases/opt/inline/consecutive_sync_calls.cml"
args = ["${case}", "test::commit_conflict"]
expect_stdout_contains = ["CONFLICTS before=0", "CONFLICTS same_graph=1 other_graph=0", "CHECKED refused: 1 graph(s)"]

[[tests]]
name = "stale_commit_merges_into_the_newest_snapshot"
desc = "A session that started from a program another session has replaced, and whose graphs the other one did not touch, commits into that newest program (design 4.3.1: no conflict, one compare-and-swap) instead of forking the history: the change of the first session is kept, the second graph gets its own change, and the program that holds both is the one installed."
case = "../../../cases/opt/inline/consecutive_sync_calls.cml"
args = ["${case}", "test::commit_merge"]
expect_stdout_contains = ["MERGE stale=1", "MERGE installed=1 first_kept=1 second_kept=1 root_edited=1"]

[[tests]]
name = "a_sync_cycle_is_refused"
desc = "A cycle on sync edges: two statements that each follow the other. The draft's check and the freeze's walk are one function over one list of edge kinds (camel/runtime/cycle.h), so the pass prints what the draft's side reports -- the cycle found, with both nodes on the chain it returns -- and then commits the same graph, which the freeze refuses with the cycle named. A freeze that walked four kinds again would accept this graph and hand it to a back end; nothing else in the layer would notice, since no program composes the shape."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edges_sync_cycle"]
expect_stdout_contains = ["SYNCCYCLE a=", "found=1 on_cycle_a=1 on_cycle_b=1", "EDGES refused", "lies on a cycle of inputs"]

[[tests]]
name = "the_five_user_sets_read_the_same_on_both_sides_of_the_freeze"
desc = "The users of a node in the five kinds a pass asks about -- a value port, a context port, a control input, a place on a `sync` block's chain, and an order edge leaving it. A draft keeps one list per kind as a pass writes each edge; the graph a commit makes keeps one table built from the input runs, with the two side arrays beside them, and it had no accessor for five of those lists at all. The pass builds one node read in all five kinds, compares the two readings node for node in the runtime refs the commit gives the draft's nodes, and prints the five sets of that node and the number of nodes the two sides disagree about: disagree=0 is the assertion, and the five counts are what a reading that named another set would have to get right as well."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edge_users"]
expect_stdout_contains = ["EDGES accepted", "EDGE_USERS norm=2 with=1 ctrl=1 sync=1 order=1", "disagree=0"]

[[tests]]
name = "an_edit_that_writes_only_an_edge_reaches_the_graph"
desc = "The commit keeps the copy it encoded only while that copy differs from the graph it would replace, and `sameContent` decides. The order and sync edges are the graph's own arrays beside the node columns -- not ports, not entries of a node -- so a comparison that reads the columns, the ports and the regions but not those two arrays answers `the same graph` for an edit that wrote an edge, and the commit releases the copy it encoded and hands back the graph the edit never reached. The pass writes one sync edge between two statements the graph already has, so no node is added, removed or changed and the edge is the whole difference, and prints what the graph the commit made holds: `after` one more than `before`, the user's sync input present, and `reused=0` (the graph object is not the one it was). A second session changes nothing at all and must keep the graph where it is (`reused=1`, the copy released): that is the reason the comparison exists, and a fix that always made a new version would take it away."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edges_edit_only"]
verify_script = '''
({ input, assert }) => {
  const lines = input.normalized.stdout.trim().split('\n')
  const pair = lines.find(l => l.startsWith('EDITONLY pair '))
  assert(pair !== undefined, input.normalized.stdout)
  const sync = lines.find(l => l.startsWith('EDITONLY sync '))
  assert(sync !== undefined, input.normalized.stdout)
  assert(sync.includes('wrote=1'), 'the sync edge was not written: ' + sync)
  assert(sync.includes('reused=0'), 'the commit kept the old graph over an edge-only edit: ' + sync)
  assert(sync.includes('mine=1'), 'the edge the session wrote is not the one the graph holds: ' + sync)
  assert(sync.includes('sync_in=1'), 'the user does not wait on one edge: ' + sync)
  const untouched = lines.find(l => l.startsWith('EDITONLY untouched '))
  assert(untouched !== undefined, input.normalized.stdout)
  assert(untouched.includes('reused=1'),
    'a session that changed nothing made a new version: ' + untouched)
}
'''

[[tests]]
name = "the_same_edit_commits_the_same_with_and_without_an_unrelated_write"
desc = "Difference test for the page `2026-11-15-can-a-commit-depend-on-unrelated-writes`: one edit, committed twice from one program, once alone and once beside a write nothing reads (a node nothing reads and nothing runs, which adds no edge). The two graphs the commits make must hold the same edges -- the four kinds, compared edge for edge -- because a commit whose answer depends on another write in the same transaction is a commit that cannot be reproduced. The 'DIFF a' and 'DIFF b' lines are the full edge list of each committed graph, so a red reading names the edge that differs instead of a digest."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edges_commit_differential"]
verify_script = '''
({ input, assert }) => {
  const lines = input.normalized.stdout.trim().split('\n')
  const pair = lines.find(l => l.startsWith('DIFF pair '))
  assert(pair !== undefined, input.normalized.stdout)
  const user = /user=(\d+)/.exec(pair)[1]
  const pred = /pred=(\d+)/.exec(pair)[1]
  const a = lines.find(l => l.startsWith('DIFF a '))
  const b = lines.find(l => l.startsWith('DIFF b '))
  assert(a !== undefined && b !== undefined, input.normalized.stdout)
  assert(a.includes('sync:' + user + '>' + pred),
    'the edit alone did not reach the committed graph: ' + a)
  assert(b.includes('sync:' + user + '>' + pred),
    'the edit beside an unrelated write did not reach the committed graph: ' + b)
  const same = lines.find(l => l.startsWith('DIFF same='))
  assert(same !== undefined, input.normalized.stdout)
  assert(same.includes('same=1'),
    'the same edit committed to two different graphs: ' + same + ' / ' + a + ' / ' + b)
}
'''

[[tests]]
name = "the_commit_reads_its_graph_back_and_names_a_lost_edge"
desc = "The commit's delivery check (src/runtime/graph_build.h, verifyDraftDelivery): the graph a commit made, read back against the draft it encoded, edge by edge and both ways. The first half commits the one-edge edit with the check on (a Release build runs it only when a test asks, and it throws rather than asserting, so a shipped build that runs it can still say what is wrong); the second half hands the check a draft that holds one sync edge the graph does not -- the state an encoding that lost an edge leaves behind -- and the refusal has to name the graph, the kind of edge and the two nodes."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edges_delivery_check"]
verify_script = '''
({ input, assert }) => {
  const lines = input.normalized.stdout.trim().split('\n')
  const pair = lines.find(l => l.startsWith('DELIVERY pair '))
  assert(pair !== undefined, input.normalized.stdout)
  const accepted = lines.find(l => l.startsWith('DELIVERY commit '))
  assert(accepted !== undefined, input.normalized.stdout)
  assert(accepted.includes('checked=1'), 'the delivery check was not on: ' + accepted)
  assert(accepted.includes('accepted=1'), 'the check refused a commit it must accept: ' + accepted)
  const refused = lines.find(l => l.startsWith('DELIVERY refused: '))
  assert(refused !== undefined, 'the check did not report the lost edge: ' + input.normalized.stdout)
  assert(refused.includes('is not the draft it encoded'), 'the sentence does not name the shape: ' + refused)
  assert(refused.includes('sync edge from node'), 'the sentence does not name the edge: ' + refused)
  assert(refused.includes('is in the draft and not in the graph'),
    'the sentence does not say which side lost it: ' + refused)
}
'''