id = "opt.edges"
order = 323
tier = "fast"
tags = ["feat", "opt", "validation"]

# A commit enforces the edge invariants of a graph (docs/design/graph-store 5.4): no cycle of
# inputs, the types agree along the edges, and no order edge on a pure node (docs/design/effects/
# edges.cn.md 4.6). The test passes edit the root graph through the draft API in ways a pass could
# and commit; the commit refuses the broken ones.

[defaults]
kind = "behavior"
case = "../../../cases/opt/generic/generic_passes.cml"
timeout_ms = 20000
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]

[[tests]]
name = "valid_edit_is_accepted"
desc = "Control: a node that breaks no invariant commits."
args = ["${case}", "test::edges_ok"]
expect_stdout_contains = ["EDGES accepted"]
expect_output_not_contains = ["refused"]

[[tests]]
name = "cycle_is_refused"
desc = "Two nodes that wait on each other form a cycle of control inputs; the commit names the cycle."
args = ["${case}", "test::edges_cycle"]
expect_stdout_contains = ["EDGES refused", "lies on a cycle of inputs"]

[[tests]]
name = "copy_type_mismatch_is_refused"
desc = "A COPY typed i32 of an f32 value: the types disagree along the edge."
args = ["${case}", "test::edges_type"]
expect_stdout_contains = ["EDGES refused", "copies a f32 as a i32"]

[[tests]]
name = "order_edge_survives_the_commit"
desc = "An order edge is not a port and not a control input: it is written once, it is kept out of the node's input runs, and the graph the commit makes holds it in its own array, from which it is read back by the user's predecessors (docs/design/effects/edges.cn.md 1.5, 5)."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edges_order_ok"]
expect_stdout_contains = ["ORDER wrote=1 twice=0", "ORDER preds=1 users=1", "EDGES accepted", "ORDER frozen_agrees=1 some_node_ordered=1"]

[[tests]]
name = "order_edge_on_a_pure_node_is_refused"
desc = "Nothing orders a pure node: a constant computes a value from nothing a resource owns, so an order edge on it is a graph the builder must not have produced, and the seal check names it (docs/design/effects/edges.cn.md 4.6)."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edges_order_pure"]
expect_stdout_contains = ["ORDER wrote=1", "EDGES refused", "is on a pure node"]

[[tests]]
name = "order_edge_orders_the_nodes_that_run"
desc = "An order edge is what a scheduler lays out by: of two nodes the exit waits for, the one the order edge names second comes first in the execution plan, and a node the order edge only names as a predecessor, which nothing else reaches, does not enter the plan at all (docs/design/effects/edges.cn.md 1.5, 2: order orders, it does not execute)."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edges_order_schedule"]
expect_stdout_contains = ["ORDER wrote=11", "EDGES accepted", "ORDER ordered_pairs=1 obeyed=1", "ORDER unexecuted_pred_absent=1"]

[[tests]]
name = "order_edges_survive_a_removed_node"
desc = "Removing a node keeps the ordering that passed through it: of the chain A -> B -> C the graph loses B and keeps A -> C, through the same eraseNode call a dead-code pass makes (docs/design/effects/edges.cn.md 4). B is an anchor no pass may arrange freely, so the graph may carry an order edge on it at all (4.6)."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edges_order_splice"]
verify_script = '''
({ input, assert }) => {
  const lines = input.normalized.stdout.trim().split('\n')
  assert(lines[1] === 'EDGES accepted', input.normalized.stdout)
  const chain = lines[0].split(/\s+/).slice(2).map(s => s.split('>'))
  const kept = lines[2].split(/\s+/).slice(2).map(s => s.split('>'))
  assert(chain.length === 2, 'the anchor chain was not written: ' + input.normalized.stdout)
  assert(kept.length === 1, 'A -> C was not kept: ' + input.normalized.stdout)
  assert(chain[0][0] === kept[0][0] && chain[1][1] === kept[0][1],
    'the kept edge is not A -> C: ' + input.normalized.stdout)
}
'''

[[tests]]
name = "order_edges_follow_a_replacement"
desc = "A replacement takes the replaced node's order edges in both directions: of A -> B -> C the replacer D takes B's place and the graph holds A -> D and D -> C, not A -> C (docs/design/effects/edges.cn.md 4)."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edges_order_replace"]
verify_script = '''
({ input, assert }) => {
  const lines = input.normalized.stdout.trim().split('\n')
  assert(lines[1].startsWith('EDGES accepted replacer='), input.normalized.stdout)
  const replacer = lines[1].split('=')[1]
  const chain = lines[0].split(/\s+/).slice(2).map(s => s.split('>'))
  const kept = lines[2].split(/\s+/).slice(2).map(s => s.split('>'))
  assert(chain.length === 2, 'the anchor chain was not written: ' + input.normalized.stdout)
  assert(kept.length === 2, 'the replacement did not take both orderings: ' + input.normalized.stdout)
  assert(kept.some(e => e[0] === chain[0][0] && e[1] === replacer) &&
    kept.some(e => e[0] === replacer && e[1] === chain[1][1]),
    'the orderings did not reach the replacer: ' + input.normalized.stdout)
}
'''

[[tests]]
name = "gate_waits_on_the_sync_chain"
desc = "docs/design/effects/edges.cn.md 5.3: a GATE is one data port reading a value and one sync predecessor, which is the chain's tail, and it has no control input at all. The commit accepts that shape and keeps the GATE instead of dissolving it into its input, because 5.3 lets a GATE be replaced by its input only once its sync predecessor is gone."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edges_sync_gate"]
expect_stdout_contains = ["SYNCGATE wrote=1 ctrl=0", "EDGES accepted", "SYNCGATE frozen_sync_edges=1 gates=1 gates_waiting_on_the_chain=1 gates_with_ctrl=0"]

[[tests]]
name = "sync_chain_fork_is_refused"
desc = "The other half of the same rule: one statement follows one other at most *and* one statement follows it. A statement two statements of its block follow is a chain that forks, which is no chain, so a rewrite that leaves the graph in that state -- an inline splice that cannot put a statement in its place without making the graph wait on itself -- is refused by the seal, which names the statement the two follow, rather than freezing a chain the layout may walk one way and silently drop the other."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edges_sync_fork"]
expect_stdout_contains = ["SYNCFORK fork=", "EDGES refused", "sync chain forks at node", "block's statements are one chain"]

[[tests]]
name = "a_chain_end_hands_its_value_on_to_two_blocks"
desc = "What 5.3 allows and the fork check must not report: the one chain end hands its value on, and a GATE does that for a block that ends on it, so two GATEs may follow one statement. An end of the chain is not a continuation of it."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edges_sync_fork_gate"]
expect_stdout_contains = ["SYNCFORKGATE tail=", "EDGES accepted"]
expect_output_not_contains = ["refused"]

[[tests]]
name = "commit_conflict_is_detected"
desc = "Three sessions on one program (design 4.3.1): after the first commits, the one that wrote the same graph conflicts and its checked commit is refused; the one that wrote another graph does not conflict."
case = "../../../cases/opt/inline/consecutive_sync_calls.cml"
args = ["${case}", "test::commit_conflict"]
expect_stdout_contains = ["CONFLICTS before=0", "CONFLICTS same_graph=1 other_graph=0", "CHECKED refused: 1 graph(s)"]

[[tests]]
name = "stale_commit_merges_into_the_newest_snapshot"
desc = "A session that started from a program another session has replaced, and whose graphs the other one did not touch, commits into that newest program (design 4.3.1: no conflict, one compare-and-swap) instead of forking the history: the change of the first session is kept, the second graph gets its own change, and the program that holds both is the one installed."
case = "../../../cases/opt/inline/consecutive_sync_calls.cml"
args = ["${case}", "test::commit_merge"]
expect_stdout_contains = ["MERGE stale=1", "MERGE installed=1 first_kept=1 second_kept=1 root_edited=1"]
