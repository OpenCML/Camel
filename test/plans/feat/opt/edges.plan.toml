id = "opt.edges"
order = 323
tier = "fast"
tags = ["feat", "opt", "validation"]

# A commit enforces the edge invariants of a graph (docs/design/graph-store 5.4): no cycle of
# inputs, the types agree along the edges, and no order edge on a pure node (docs/design/effects/
# edges.cn.md 4.6). The test passes edit the root graph through the draft API in ways a pass could
# and commit; the commit refuses the broken ones.

[defaults]
kind = "behavior"
case = "../../../cases/opt/generic/generic_passes.cml"
timeout_ms = 20000
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]

[[tests]]
name = "valid_edit_is_accepted"
desc = "Control: a node that breaks no invariant commits."
args = ["${case}", "test::edges_ok"]
expect_stdout_contains = ["EDGES accepted"]
expect_output_not_contains = ["refused"]

[[tests]]
name = "cycle_is_refused"
desc = "Two SYNC nodes that wait on each other form a cycle of control inputs; the commit names the cycle."
args = ["${case}", "test::edges_cycle"]
expect_stdout_contains = ["EDGES refused", "lies on a cycle of inputs"]

[[tests]]
name = "copy_type_mismatch_is_refused"
desc = "A COPY typed i32 of an f32 value: the types disagree along the edge."
args = ["${case}", "test::edges_type"]
expect_stdout_contains = ["EDGES refused", "copies a f32 as a i32"]

[[tests]]
name = "order_edge_survives_the_commit"
desc = "An order edge is not a port and not a control input: it is written once, it is kept out of the node's input runs, and the graph the commit makes holds it in its own array, from which it is read back by the user's predecessors (docs/design/effects/edges.cn.md 1.5, 5)."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edges_order_ok"]
expect_stdout_contains = ["ORDER wrote=1 twice=0", "ORDER preds=1 users=1", "EDGES accepted", "ORDER frozen_agrees=1 some_node_ordered=1"]

[[tests]]
name = "order_edge_on_a_pure_node_is_refused"
desc = "Nothing orders a pure node: a constant computes a value from nothing a resource owns, so an order edge on it is a graph the builder must not have produced, and the seal check names it (docs/design/effects/edges.cn.md 4.6)."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edges_order_pure"]
expect_stdout_contains = ["ORDER wrote=1", "EDGES refused", "is on a pure node"]

[[tests]]
name = "order_edge_orders_the_nodes_that_run"
desc = "An order edge is what a scheduler lays out by: of two nodes the exit waits for, the one the order edge names second comes first in the execution plan, and a node the order edge only names as a predecessor, which nothing else reaches, does not enter the plan at all (docs/design/effects/edges.cn.md 1.5, 2: order orders, it does not execute)."
case = "../../../cases/opt/generic/generic_passes.cml"
args = ["${case}", "test::edges_order_schedule"]
expect_stdout_contains = ["ORDER wrote=11", "EDGES accepted", "ORDER ordered_pairs=1 obeyed=1", "ORDER unexecuted_pred_absent=1"]

[[tests]]
name = "commit_conflict_is_detected"
desc = "Three sessions on one program (design 4.3.1): after the first commits, the one that wrote the same graph conflicts and its checked commit is refused; the one that wrote another graph does not conflict."
case = "../../../cases/opt/inline/consecutive_sync_calls.cml"
args = ["${case}", "test::commit_conflict"]
expect_stdout_contains = ["CONFLICTS before=0", "CONFLICTS same_graph=1 other_graph=0", "CHECKED refused: 1 graph(s)"]

[[tests]]
name = "stale_commit_merges_into_the_newest_snapshot"
desc = "A session that started from a program another session has replaced, and whose graphs the other one did not touch, commits into that newest program (design 4.3.1: no conflict, one compare-and-swap) instead of forking the history: the change of the first session is kept, the second graph gets its own change, and the program that holds both is the one installed."
case = "../../../cases/opt/inline/consecutive_sync_calls.cml"
args = ["${case}", "test::commit_merge"]
expect_stdout_contains = ["MERGE stale=1", "MERGE installed=1 first_kept=1 second_kept=1 root_edited=1"]
