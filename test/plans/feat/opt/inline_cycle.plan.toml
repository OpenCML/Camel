id = "opt.inline_cycle"
order = 481
tier = "fast"
tags = ["feat", "opt", "inline", "defects"]

# The defect `a1723fbb9` fixed, and the instance of it no plan guarded: progen seed 23 under
# `std::opt::fold std::opt::inline`, the `fold+inline@nvm` cell of its 41-cell cross matrix -- the one
# cell that was red before the commit and green after it. `rc04`'s wall for it was
# `Pass 'std::opt::inline' failed with an internal error: Runtime graph 'main' breaks its edge
# invariants: graph 'main' node 16 (11): lies on a cycle of inputs:
# 16(11) <- 39(11) <- 340(13) <- 334(13) <- 328(13) <- 16`.
#
# What the commit changed is *where* the spliced body's head is written: after the statement the call
# is written after -- with no `sync` predecessor, that is the argument the call reads -- and not after
# that statement's own predecessor (the call's control frontier). So the place is the whole of the
# subject, and a case that only asks "did it run" cannot tell the two places apart. `splice_place`
# below reads the drawing and asks the two questions the place decides, naming nodes:
#
#   - no statement is written before one it reads (`:struct/len_arr` moved after the body's tail is
#     exactly that), and
#   - no node but a `BRCH` hands the chain on to two statements (the body's head written beside the
#     argument instead of after it makes the argument's predecessor name two followers).
#
# Both are what the seal refuses, and the seal is what the pass hit before the commit; a drawing is
# therefore only reachable once the place is right. Reading the drawing is the guard that survives a
# fix which stops refusing -- a place that is wrong without a cycle seals, and only this reads it.
#
# The seed is the author's own program, not a reduction of it: `python test/tools/progen/progen.py
# show --seed 23` (generator version 7) draws it today and it produces the recorded cycle word for
# word, node numbers included, under the pre-`a1723fbb9` binary.

[defaults]
kind = "behavior"
case = "../../../cases/opt/inline_cycle/seed23_fold_inline.cml"
expect_exit = 0
envs = ["PROGEN_I0=5", "PROGEN_S1=x"]
timeout_ms = 20000
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]

[[tests]]
name = "inline_cycle.reference"
kind = "negative"
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ClosureAssignsCapturedName"
expect_diagnostic_code = "0x03000213"
desc = "The program with no pass at all: the sixteen lines its reference evaluator computes. Green before and after the commit -- it is what the two runs below must reproduce. `seed23_fold_inline` is refused by the closure rule before any pass runs, so this entry pins the refusal instead of the reading it used to pin (`SemanticDiag::ClosureAssignsCapturedName`, 0x03000213, at the assignment inside the closure: the state rule of 2026-11-14 was withdrawn on 2026-11-16 and the write is what refuses the program now); the program is left in the corpus rather than edited, because hand-editing a seed replaces the shape it was generated for."
args = ["${case}"]


[[tests]]
name = "inline_cycle.fold_then_inline"
kind = "negative"
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ClosureAssignsCapturedName"
expect_diagnostic_code = "0x03000213"
desc = "The folding followed by the inlining -- the pair the cycle was found with: the same sixteen lines. Red before `a1723fbb9`, and the reading is the cycle of inputs itself, quoted whole, so that a return of the defect names the positions and not only the exit code. `seed23_fold_inline` is refused by the closure rule before any pass runs, so this entry pins the refusal instead of the reading it used to pin (`SemanticDiag::ClosureAssignsCapturedName`, 0x03000213, at the assignment inside the closure: the state rule of 2026-11-14 was withdrawn on 2026-11-16 and the write is what refuses the program now); the program is left in the corpus rather than edited, because hand-editing a seed replaces the shape it was generated for."
args = ["${case}"]

verify_script = """
({ input, assert }) => {
    const said = ((input.output || '') + ' ' + (input.stderr || '')).replace(/\s+/g, ' ')
    assert(said.includes('is assigned inside a closure'), 'the closure rule refuses the write: ' + said)
    assert(said.includes('a `Ref`'), 'and the report names the ways out: ' + said)
}
"""

[[tests]]
name = "inline_cycle.splice_place"
kind = "negative"
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ClosureAssignsCapturedName"
expect_diagnostic_code = "0x03000213"
desc = "The same pair drawn with `std::gir`: the placed statements are read, not just counted. No statement is written before one it reads, and no node but a `BRCH` hands the chain on to two statements -- the argument keeps its own place and the body's head follows the argument, not the statement before it. `seed23_fold_inline` is refused by the closure rule before any pass runs, so this entry pins the refusal instead of the reading it used to pin (`SemanticDiag::ClosureAssignsCapturedName`, 0x03000213, at the assignment inside the closure: the state rule of 2026-11-14 was withdrawn on 2026-11-16 and the write is what refuses the program now); the program is left in the corpus rather than edited, because hand-editing a seed replaces the shape it was generated for."
args = ["${case}"]
verify_script = """
({ input, assert }) => {
    const said = ((input.output || '') + ' ' + (input.stderr || '')).replace(/\s+/g, ' ')
    assert(said.includes('is assigned inside a closure'), 'the closure rule refuses the write: ' + said)
    assert(said.includes('a `Ref`'), 'and the report names the ways out: ' + said)
}
"""

# What the three entries above measure today, and what they cannot (measured 2026-11-15 on
# 6c64f2042, the tree of this lane):
#
#   1. `seed23_fold_inline` is refused by the state rule before any pass runs -- the call is
#      `checkCellEscapes();` in src/compile/gir/program.cpp, and `camel <case> std::gir` exits 1
#      and prints no graph at all. None of the three entries above exercises the optimizer; their
#      green is the front end's refusal, not the reading they were written for.
#   2. With that one call taken out, the program and its legal same shape
#      `seed23_fold_inline_within_call.cml` (the `var` captured by a closure that is called inside
#      the call that declares it, so nothing is carried out) print the same sixteen lines at exit
#      0: the state rule is the only thing standing in this program's way.
#   3. The ring `a1723fbb9` fixed is unobservable in this shape today, not gone. With the place
#      decision that commit added switched off (`if (false && placePreds.empty())` on the
#      argument-place block of src/runtime/draft_inline.cpp#inlineCallableInDraft), this program's
#      inlined drawing is byte-for-byte identical -- 2246 lines, the 194 `ORDER` edges included --
#      exit 0 and no `PassInternalError`; three hand-written argument shapes (`k(len([1,2]))`,
#      `k(1+2)`, `k(foo())`) ring nowhere either. Making the ring observable again is work on a
#      branch that reverts `a1723fbb9`, not a new seed: a seed that only runs would be green for
#      a reason unrelated to what this plan was written to guard.
#
# What is still guardable is the half that is live: the pair inlines at all. The two entries below
# read that number -- `direct_calls` 24 with no pass and 3 under the pair.
#
# That half stopped being legal on 2026-11-16: the shape it was legal in was `ClosureCaptureEscapes`'
# (a `var` captured by a closure that is called inside the call that declares it carries nothing
# out), and that rule was withdrawn when a closure was ruled to hold a value (design principles 3.5,
# the author's ruling of 2026-11-16). The write the closure makes is refused on its own now
# (`SemanticDiag::ClosureAssignsCapturedName`, 0x03000213), so both entries below pin the refusal
# instead. The seed stays in the corpus unedited, the same choice the three entries above make.
[[tests]]
name = "inline_cycle.within_call_no_pass"
desc = "The within-call half of seed 23 as the closure rule leaves it: refused before any pass runs -- `SemanticDiag::ClosureAssignsCapturedName` (0x03000213) at the assignment inside the closure. It read `direct_calls` 24 with no pass until 2026-11-16; that reading is gone because the shape it stood on was `ClosureCaptureEscapes`', withdrawn when a closure was ruled to hold a value (design principles 3.5). The seed is left in the corpus unedited: hand-editing it replaces the shape it was generated for, and the day it is regenerated under the rule it is this entry that is rewritten."
kind = "negative"
case = "../../../cases/opt/inline_cycle/seed23_fold_inline_within_call.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ClosureAssignsCapturedName"
expect_diagnostic_code = "0x03000213"
verify_script = """
({ input, assert }) => {
    const said = ((input.output || '') + ' ' + (input.stderr || '')).replace(/\s+/g, ' ')
    assert(said.includes('is assigned inside a closure'), 'the closure rule refuses the write: ' + said)
    assert(said.includes('a `Ref`'), 'and the report names the ways out: ' + said)
}
"""

[[tests]]
name = "inline_cycle.within_call_fold_then_inline"
desc = "The same refusal: `seed23_fold_inline_within_call` is refused before any pass runs, so `std::opt::fold std::opt::inline` never sees it (0x03000213 at the assignment inside the closure). It read 3 direct calls remaining (from 24) until 2026-11-16, and that reading is gone with the shape it stood on -- `ClosureCaptureEscapes`, withdrawn when a closure was ruled to hold a value (design principles 3.5). Kept rather than deleted: the seed is the shape `a1723fbb9` was found on, and the entry is where the pipeline has to come back from once a legal seed is generated for it."
kind = "negative"
case = "../../../cases/opt/inline_cycle/seed23_fold_inline_within_call.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ClosureAssignsCapturedName"
expect_diagnostic_code = "0x03000213"
verify_script = """
({ input, assert }) => {
    const said = ((input.output || '') + ' ' + (input.stderr || '')).replace(/\s+/g, ' ')
    assert(said.includes('is assigned inside a closure'), 'the closure rule refuses the write: ' + said)
    assert(said.includes('a `Ref`'), 'and the report names the ways out: ' + said)
}
"""