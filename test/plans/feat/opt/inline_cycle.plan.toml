id = "opt.inline_cycle"
order = 481
tier = "fast"
tags = ["feat", "opt", "inline", "defects"]

# The defect `a1723fbb9` fixed, and the instance of it no plan guarded: progen seed 23 under
# `std::opt::fold std::opt::inline`, the `fold+inline@nvm` cell of its 41-cell cross matrix -- the one
# cell that was red before the commit and green after it. `rc04`'s wall for it was
# `Pass 'std::opt::inline' failed with an internal error: Runtime graph 'main' breaks its edge
# invariants: graph 'main' node 16 (11): lies on a cycle of inputs:
# 16(11) <- 39(11) <- 340(13) <- 334(13) <- 328(13) <- 16`.
#
# What the commit changed is *where* the spliced body's head is written: after the statement the call
# is written after -- with no `sync` predecessor, that is the argument the call reads -- and not after
# that statement's own predecessor (the call's control frontier). So the place is the whole of the
# subject, and a case that only asks "did it run" cannot tell the two places apart. `splice_place`
# below reads the drawing and asks the two questions the place decides, naming nodes:
#
#   - no statement is written before one it reads (`:struct/len_arr` moved after the body's tail is
#     exactly that), and
#   - no node but a `BRCH` hands the chain on to two statements (the body's head written beside the
#     argument instead of after it makes the argument's predecessor name two followers).
#
# Both are what the seal refuses, and the seal is what the pass hit before the commit; a drawing is
# therefore only reachable once the place is right. Reading the drawing is the guard that survives a
# fix which stops refusing -- a place that is wrong without a cycle seals, and only this reads it.
#
# The seed is the author's own program, not a reduction of it: `python test/tools/progen/progen.py
# show --seed 23` (generator version 7) draws it today and it produces the recorded cycle word for
# word, node numbers included, under the pre-`a1723fbb9` binary.

[defaults]
kind = "behavior"
case = "../../../cases/opt/inline_cycle/seed23_fold_inline.cml"
expect_exit = 0
envs = ["PROGEN_I0=5", "PROGEN_S1=x"]
timeout_ms = 20000
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]

[[tests]]
name = "inline_cycle.reference"
kind = "negative"
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ClosureCaptureEscapes"
expect_diagnostic_code = "0x03000210"
desc = "The program with no pass at all: the sixteen lines its reference evaluator computes. Green before and after the commit -- it is what the two runs below must reproduce. `seed23_fold_inline` is refused by the state rule of 2026-11-14 before any pass runs, so this entry pins the refusal (`SemanticDiag::ClosureCaptureEscapes`, 0x03000210) instead of the reading it used to pin; the program is left in the corpus rather than edited, because hand-editing a seed replaces the shape it was generated for."
args = ["${case}"]


[[tests]]
name = "inline_cycle.fold_then_inline"
kind = "negative"
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ClosureCaptureEscapes"
expect_diagnostic_code = "0x03000210"
desc = "The folding followed by the inlining -- the pair the cycle was found with: the same sixteen lines. Red before `a1723fbb9`, and the reading is the cycle of inputs itself, quoted whole, so that a return of the defect names the positions and not only the exit code. `seed23_fold_inline` is refused by the state rule of 2026-11-14 before any pass runs, so this entry pins the refusal (`SemanticDiag::ClosureCaptureEscapes`, 0x03000210) instead of the reading it used to pin; the program is left in the corpus rather than edited, because hand-editing a seed replaces the shape it was generated for."
args = ["${case}"]

verify_script = """
({ input, assert }) => {
    const said = ((input.output || '') + ' ' + (input.stderr || '')).replace(/\s+/g, ' ')
    assert(said.includes('cannot leave the call that declares it'), 'the state rule refuses the program: ' + said)
    assert(said.includes('0x03000210'), 'and the report names the code the rule landed with: ' + said)
}
"""

[[tests]]
name = "inline_cycle.splice_place"
kind = "negative"
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ClosureCaptureEscapes"
expect_diagnostic_code = "0x03000210"
desc = "The same pair drawn with `std::gir`: the placed statements are read, not just counted. No statement is written before one it reads, and no node but a `BRCH` hands the chain on to two statements -- the argument keeps its own place and the body's head follows the argument, not the statement before it. `seed23_fold_inline` is refused by the state rule of 2026-11-14 before any pass runs, so this entry pins the refusal (`SemanticDiag::ClosureCaptureEscapes`, 0x03000210) instead of the reading it used to pin; the program is left in the corpus rather than edited, because hand-editing a seed replaces the shape it was generated for."
args = ["${case}"]
verify_script = """
({ input, assert }) => {
    const said = ((input.output || '') + ' ' + (input.stderr || '')).replace(/\s+/g, ' ')
    assert(said.includes('cannot leave the call that declares it'), 'the state rule refuses the program: ' + said)
    assert(said.includes('0x03000210'), 'and the report names the code the rule landed with: ' + said)
}
"""