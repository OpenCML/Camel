id = "probe.inline_diff_measure"
order = 490
tier = "fast"
tags = ["probe", "opt", "inline"]

# The dot text of the three steps, thrown so the run log carries it: the report pastes these and
# hashes them; the entries are not kept.

[[tests]]
name = "dot.inline"
kind = "behavior"
case = "../../../cases/opt/cxx_isolation/paper_figure1.cml"
args = ["${case}", "opt::inline", "std::gir", "std::nop"]
expect_exit = 0
timeout_ms = 20000
verify_script = """
throw new Error("DOTBEG inline\\n" + input.normalized.stdout + "\\nDOTEND")
"""

[[tests]]
name = "dot.cse"
kind = "behavior"
case = "../../../cases/opt/cxx_isolation/paper_figure1.cml"
args = ["${case}", "opt::inline", "opt::cse", "std::gir", "std::nop"]
expect_exit = 0
timeout_ms = 20000
verify_script = """
throw new Error("DOTBEG cse\\n" + input.normalized.stdout + "\\nDOTEND")
"""

