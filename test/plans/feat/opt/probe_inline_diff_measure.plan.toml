id = "probe.inline_diff_measure"
order = 490
tier = "fast"
tags = ["probe", "opt", "inline"]

# A measuring pass, not a judge: the figure corpus, read before and after each inliner.

[[tests]]
name = "measure.figure1.before"
kind = "behavior"
case = "../../../cases/opt/cxx_isolation/inline_figure1.cml"
args = ["${case}", "std::jgir canonical=true", "std::nop"]
expect_exit = 0
timeout_ms = 20000
verify_script = """
const doc = JSON.parse(input.normalized.stdout)
const rows = (doc.graphs || []).map((g) => [(g.nodes || []).filter((n) => n.kind === "CALL" || n.kind === "FUNC").length, (g.nodes || []).length])
throw new Error("COUNT figure1.before " + JSON.stringify(rows))
"""

