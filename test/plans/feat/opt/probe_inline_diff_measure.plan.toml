id = "probe.inline_diff_measure"
order = 490
tier = "fast"
tags = ["probe", "opt", "inline"]

# A measuring pass, not a judge: each entry reads the canonical document and throws with the node
# and call counts of every graph it found, so one run names the numbers the assertions need.

[[tests]]
name = "measure.small_non_arm.before"
kind = "behavior"
case = "../../../cases/opt/inline/strategy_small_non_arm.cml"
args = ["${case}", "std::jgir canonical=true", "std::nop"]
expect_exit = 0
timeout_ms = 20000
verify_script = """
const doc = JSON.parse(input.normalized.stdout)
const rows = (doc.graphs || []).map((g) => [(g.nodes || []).filter((n) => n.kind === "CALL" || n.kind === "FUNC").length, (g.nodes || []).length])
throw new Error("COUNT small_non_arm.before " + JSON.stringify(rows))
"""

