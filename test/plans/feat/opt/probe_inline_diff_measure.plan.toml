id = "probe.inline_diff_measure"
order = 490
tier = "fast"
tags = ["probe", "opt", "inline"]

# A measuring pass, not a judge: the four corpora the comparison is written on, read both ways.

[[tests]]
name = "measure.two_level.by_cpp"
kind = "behavior"
case = "../../../cases/opt/camel_inline/two_level_call.cml"
args = ["${case}", "std::cxx::inline", "std::jgir canonical=true", "std::nop"]
expect_exit = 0
timeout_ms = 20000
verify_script = """
const doc = JSON.parse(input.normalized.stdout)
const rows = (doc.graphs || []).map((g) => [(g.nodes || []).filter((n) => n.kind === "CALL" || n.kind === "FUNC").length, (g.nodes || []).length])
throw new Error("COUNT two_level.by_cpp " + JSON.stringify(rows))
"""

