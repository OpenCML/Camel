[[tests]]
name = "adb67e081.rc04_seed72_inline"
desc = "`rc04_seed72` under `std::opt::inline`, the pipeline it was found with. Green today, measured 2026-11-05: exits 0 and prints nothing. What it guards against is the cycle of inputs the inlined graph used to have -- `node 24 (11): lies on a cycle of inputs: 24(11) <- 27(13) <- 38(13) <- 24` -- and the run asserts an empty stdout as well as exit 0, so the cycle printing again turns red here."
kind = "behavior"
case = "../../../cases/opt/adb67e081/rc04_seed72.cml"
args = ["${case}", "std::opt::inline", "${run_nvm}"]
expect_exit = 0
expect_output_not_contains = ["branch-arm invariant", "PassInternalError", "internal error", "defect of the compiler"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
assert(out === '', `unexpected output: ${out}`)
}
"""
timeout_ms = 20000