id = "opt.commit_refusal"
order = 483
tier = "fast"
tags = ["feat", "opt", "effects", "commit-checks"]

# The checks a commit answers, as the author's rework of 2026-11-18 has them (the rework commit
# `18ae6f296`, answering `docs/handover/reviews/2026-11-18-commit-checks-which-pairs-a-commit-owns.cn.md`
# and `.../questions/2026-10-29.md`'s "the six checks of a commit"):
#
#   ① the exit is in the top region -- the value a graph hands on is read at its exit, and the exit,
#   the output and the returned value are nodes of the function body (region 0). Asked by the seal
#   (`validateRuntimeGraphPayloadImpl`, src/runtime/graph.cpp) at every commit, in every build,
#   whatever the draft added: it is a property of the graph published, not of the commit's edit.
#   ② no cycle -- asked at every commit by the same seal the commit already runs
#   (`validateRuntimeGraphPayload` -> `EdgeChecker::findCycle`, src/runtime/graph_edges.cpp), in every
#   build, before the two checks below.
#   ③ the tier is what the draft added, not what the build is -- a draft that added an access is asked
#   the effect and order checks in every build, and a draft that added none owes no answer about them
#   in any build. This replaces the ruling of 2026-11-16, which read the tier as a build's answer.
#   ④ the regions a commit answers for are the ones it touched and every region around them: an owner
#   node stands in the region it sits in for everything under it, so a write spliced into an arm
#   changes what the branch node carries outside while no node of a pair out there is one this commit
#   made.
#
# 甲 containment -- for every graph the draft changed, the footprint its nodes add up to (from what
# the operators declare, bottom-up, principle 3.3) must stay inside the effect its own type
# declares; a footprint that reaches past it is refused, and the diagnostic names the resource, the
# node and the source position.
#
# 乙 order completeness -- for every graph the draft changed and every region ④ names, take the nodes
# that touch a resource; for each pair of which at least one writes, and which can both run in one
# execution, there must be a path on the graph that puts one before the other (a data edge, a sync
# edge, an order edge, or a region's `GATE` input). No path is refused, and the diagnostic names the
# pair, the resource and the source position. Two nodes in different arms of one branch cannot both
# run and are not a pair; a resource the declaration itself calls `unordered` promises no order.
#
# 甲 and 乙 are asked by the one function every commit path reaches (`camel::runtime::commitViolation`,
# src/runtime/resources.cpp, called from the commit in src/runtime/draft_session.cpp): a pass written
# in Camel can only rewrite through the graph module, and the graph module's `commit` is that same
# commit, so the named paths are one reading and not two copies of it. ① and ② are asked by the seal
# the same commit runs before them (`validateRuntimeGraphPayload`, src/runtime/graph.cpp), which is
# why neither reads the tier: a graph that would publish reads its value in the body and closes no
# cycle whatever a draft did to it.
#
# What the three cases of the first commit became under the rework, one by one:
#
#   `commit_refusal.order`     kept as it was: the splice adds an access, so the commit is asked, and
#                              the pair it wrote in the body has no path. Only the first line it
#                              prints changed -- the tier line that used to read the build's cell now
#                              reads the draft.
#   `commit_refusal.effect`    kept as the same check and moved to the defect the check can still see:
#                              the old case published a graphing *type* over a body (no node made, so
#                              no access added), and under ③ a commit is not asked about a draft that
#                              added none. The check is now read where a rewrite reaches it, on a
#                              spliced write in a graph whose type declares nothing -- which is the
#                              defect `test::fold_function_type` leaves behind, reached by the door a
#                              rewrite uses. The type-replacement reading moved to `commit_refusal.retier`,
#                              where it is the "adds nothing, so nothing is asked" half of ③.
#   `commit_refusal.legal_splice`  kept as it was: the positive half that says the refusals above are
#                              about the defect and not about the pass being named.
#
# The four readings the rework adds are `commit_refusal.exit_region` (①), `commit_refusal.cycle` (②),
# `commit_refusal.retier` (③) and `commit_refusal.ancestor_region` (④).
#
# All of them run on `fold_function_type.cml`, `branch_and_print.cml` and `identity_at_exit.cml`: one
# prints and declares the write (`announced`), one has the same shape and does not (`doubled`), one
# branches over a value of its own while printing a constant -- which is what a region under the body
# needs -- and one is the calculus's own counter-example, an identity applied at the exit.

[defaults]
kind = "negative"
timeout_ms = 20000
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]

# 乙, refused. `announced` already writes stdout and its type declares the write, so containment has
# nothing to say here: the only broken promise is the order one. `test::commit_order` splices a second
# print into that graph, ordered against nothing.
#
# Every line quoted below is part of the refusal: the pass says which node the program already wrote
# at and which one it added, the diagnostic says which check refused, and the reading names both
# nodes and the resource -- a refusal nobody can act on is not a refusal.
[[tests]]
name = "commit_refusal.order"
desc = "A splice writes the console a second time with nothing ordering the two writes: the commit is refused, and the diagnostic names both nodes, the resource and the graph."
case = "../../../cases/opt/commit_checks/fold_function_type.cml"
args = ["${case}", "test::commit_order", "std::nvm"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::PassEffectOrder"
expect_output_contains = ["commit_order: the draft splices two writes to stdout", "it adds an access, so the commit asks the effect and order checks in every build", "already writes stdout at node", "and now writes it again at", "with no edge ordering either before the other", "commit_order: refused, check=order", "committed a graph whose conflicting effects are not ordered", "has no order against", "write stdout"]

# 甲, refused, on the draft the check can still see: the write is spliced into a graph whose type
# declares nothing, so the draft added an access and the commit is asked in this build. The defect is
# the one E9 found -- a printing body under a type that promises nothing -- reached the way a rewrite
# reaches it.
[[tests]]
name = "commit_refusal.effect"
desc = "A splice writes the console inside a graph whose own type declares nothing: the commit is refused, and the diagnostic names the node, the resource and the type."
case = "../../../cases/opt/commit_checks/fold_function_type.cml"
args = ["${case}", "test::commit_effect", "std::nvm"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::PassEffectBeyondType"
expect_output_contains = ["commit_effect: the draft splices a write to stdout into a graph whose type declares nothing", "so the commit asks the effect and order checks in every build", "declares nothing and its body now writes stdout at node", "commit_effect: refused, check=effect", "committed a graph that reaches past the effect its own type declares", "makes an access the type does not cover", "write stdout"]

# The same splice as the first case, ordered after the write that was already there, in the same graph
# whose type declares the write: both checks are asked, both pass, and the commit publishes. This is
# the reading that says the two refusals above are about the defect.
[[tests]]
name = "commit_refusal.legal_splice"
desc = "A splice of the same write, ordered after the write the program already had and declared by the graph's type, is committed and the program runs."
kind = "behavior"
case = "../../../cases/opt/commit_checks/fold_function_type.cml"
args = ["${case}", "test::commit_legal_splice", "std::nvm"]
expect_exit = 48
expect_stdout_contains = ["commit_legal_splice: the draft splices a write to stdout ordered after the write that was already there", "so the commit asks the effect and order checks in every build", "writes stdout at node", ", ordered after it", "commit_legal_splice: the commit published it, and nothing was refused"]

# ③, the tier itself, as two drafts read under both answers the one build cell can hold. The first
# draft adds an access and is refused with the cell off; the second adds no node at all and is
# published with the cell on. Under the ruling of 2026-11-16 the first line would have read
# `published` and the second `refused` -- the tier followed the cell; here neither moves.
#
# The second draft is the type replacement the old `commit_refusal.effect` read: `announced` takes
# `doubled`'s type and keeps its printing body. No node is made, so no access is added, so the commit
# is not asked -- and it publishes a graph whose body reaches past the type it just published. That
# is the reading, and it is why the containment reading above moved to a splice: under ③ a commit
# answers for what a draft *adds*, and a type replacement adds nothing. What still refuses the
# uncontained program is the pass boundary (`opt.commit_checks`), which is a different question
# asked at a different place -- the pass's own return, not the commit.
[[tests]]
name = "commit_refusal.retier"
desc = "Two drafts and the one build cell: the draft that adds an access is refused with the cell off, the draft that adds none is published with the cell on, and the tier follows the draft and not the build."
kind = "behavior"
case = "../../../cases/opt/commit_checks/fold_function_type.cml"
args = ["${case}", "test::commit_tier", "std::nvm"]
expect_exit = 48
expect_stdout_contains = ["commit_tier: cell=0, draft adds an access", "commit_tier: cell=0, refused, check=order", "the tier is the draft's, not the build's", "commit_tier: cell=1, draft adds no access", "commit_tier: cell=1, published, and nothing was asked", "the tier is the draft's, not the build's", "cell=0 add-an-access -> refused=1, cell=1 adds-nothing -> published=1", "the same two drafts answer the same under both builds"]

# ①, refused, in the seal and in every build. The exit is moved onto a node of one arm -- the shape
# the calculus's counter-example lands in (`f(b) = let y = if b then {not(b)} else {false}; not(y)`,
# with the identity inlined onto the exit) -- and `validateRuntimeGraphPayloadImpl` refuses it. This
# one is not one of the two checks the tier scopes: it is a property of the graph published, so it is
# asked of every commit whatever the draft added, which is why the refusal is the seal's own and not
# a `CommitViolation`.
[[tests]]
name = "commit_refusal.exit_region"
desc = "A commit reads the graph's value at a node of one arm: the seal refuses it, naming the node, the region it landed in and the function body it should have been in, and the program it did not publish still runs."
kind = "behavior"
case = "../../../cases/opt/commit_checks/identity_at_exit.cml"
args = ["${case}", "test::commit_exit_region", "std::nvm"]
expect_exit = 48
expect_stdout_contains = ["commit_exit_region: the seal asks it", "now reads its value at node", "and not in the function body", "commit_exit_region: refused at the commit:", "has its exit at node", "instead of the function body (region 0)", "so the read never happens"]

# ②, refused. One node is made to read itself -- no input setter looks for a cycle, because one
# rewrite cannot see a cycle another one closes -- and the commit refuses the graph at the seal it
# already runs. The refusal is the seal's, which is where acyclicity is answered; the pass is not in
# this plan's reading of the graph's shape, so it hands the program back and `std::nvm` runs it.
[[tests]]
name = "commit_refusal.cycle"
desc = "A draft leaves one node reading itself: the commit refuses the graph as one that closes a cycle of inputs, and the program it did not publish still runs."
kind = "behavior"
case = "../../../cases/opt/commit_checks/fold_function_type.cml"
args = ["${case}", "test::commit_cycle", "std::nvm"]
expect_exit = 48
expect_stdout_contains = ["commit_cycle: the draft's input setters do not look for a cycle, the commit does", "now reads itself", "commit_cycle: refused at the commit:", "breaks its edge invariants", "lies on a cycle of inputs"]

# ④, refused. The write is spliced into one arm, ordered against nothing; the body already writes
# stdout, and the edit also re-sequences that write (it no longer waits for the branch, so nothing
# orders the two). The pair the commit must refuse is the branch node (standing, in the body, for the
# write under it) against the body's own write -- and *neither* of those two nodes is one this commit
# made: the branch node and the write were the program's before the commit. A commit that judged a
# pair only when one of its nodes was made publishes this one, which is what the ruling of 2026-11-18
# changed.
[[tests]]
name = "commit_refusal.ancestor_region"
desc = "A splice writes the console inside one arm, where the branch node carries it in the body against a write already in the body, and nothing orders the two: the commit is refused, although neither node of the pair was made by it."
case = "../../../cases/opt/commit_checks/branch_and_print.cml"
args = ["${case}", "test::commit_ancestor", "std::nvm"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::PassEffectOrder"
expect_output_contains = ["commit_ancestor: the regions a commit answers for are the ones it touched and every region around them", "and now waits for nothing", "now writes stdout at node", "neither the branch node nor the write left in the body is a node this commit made", "commit_ancestor: refused, check=order", "committed a graph whose conflicting effects are not ordered", "has no order against", "write stdout"]