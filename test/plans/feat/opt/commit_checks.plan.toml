id = "opt.commit_checks"
order = 482
tier = "fast"
tags = ["feat", "opt", "effects", "commit-checks"]

# The first of the two checks the effect analysis makes when a C++ pass commits a program
# (docs/design/effects/analysis.cn.md 4.1, the ruling of 2026-11-15): at every call site, the
# footprint of the function value called must not exceed what the type at that call site declares.
#
# The case runs a test-only pass that writes exactly that defect, on the smallest program that can
# show it. It is refused, and the diagnostic names the call site and the accesses the type leaves
# out. The second check (order completeness) is not landed here; the commit that adds this plan
# carries the readings of the existing passes it refuses.
#
# The second case is the same pass on a program where it has nothing to fold: nothing is refused and
# the program runs, which is what makes the refusal above about the defect and not about naming the
# pass.

[defaults]
kind = "negative"
timeout_ms = 20000
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]

[[tests]]
name = "commit_checks.effect_containment"
desc = "A pass gives a function whose body prints the type of one that does not, and leaves the body where it is: the call sites of the printing function now declare `pure` while the body they run writes to the console. The refused program names the call node and the access that is beyond the type."
case = "../../../cases/opt/commit_checks/fold_function_type.cml"
args = ["${case}", "test::fold_function_type", "std::nvm"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::PassEffectContainment"
expect_output_contains = ["Pass 'test::fold_function_type' returned a program whose call site", "reaches past the type it declares", "write stdout"]

[[tests]]
name = "commit_checks.nothing_to_fold"
desc = "A program whose only function is called and does not print has no second function of its shape to fold: the pass writes nothing, and the commit check has nothing to refuse."
kind = "behavior"
case = "../../../cases/compile/pass_guard/plain.cml"
args = ["${case}", "test::fold_function_type", "std::nvm"]
expect_exit = 0
expect_stdout_contains = ["fold_function_type: no two functions of one shape to fold", "3"]

# The exemption every pass written in Camel carries, read as the ruling of 2026-11-16 has it: the
# check is a theorem for such a pass, so a shipped build (`NDEBUG`) does not ask it -- and a build
# that has the suite asks anyway, which is how anyone knows the theorem still holds. One run prints
# both answers, at one program and one pass, the request being the only difference between them:
#
#   CAMEL_CHECKS build asks=0                    the shipped build's answer
#   CAMEL_CHECKS accepted, asked=0               the pass ran and was not checked
#   CAMEL_CHECKS released: ...                   and the run went on, so nothing was checked
#   CAMEL_CHECKS asked=1 -> ...                  the same program, the same pass, asked
#   error[RuntimeDiag::PassEffectContainment]:   ...and refused
#
# The refusal ends the run at its own diagnostic, which is why the expectation is announced before
# the second run and not confirmed after it: a check that has stopped refusing leaves
# `CAMEL_CHECKS asked=1 -> accepted` instead, and that line is not in this list.
#
# The refusal is the diagnostic of the case above, on a pass (`opt::cse`, stdlib/opt.cml) whose
# rewriting interface is the graph module's alone. That this plan runs on a Release install is what
# makes the first line the shipped build's answer; the debug build answers `asked=1` by itself, and
# `debug/camel_pass_commit_checks` is the plan that reads it there.
[[tests]]
name = "commit_checks.camel_pass_is_asked_when_the_build_asks"
desc = "A pass written in Camel is not asked for the commit checks in a shipped build, and is refused by them the moment they are asked: the same program the fold made, handed to `opt::cse` twice in one run."
kind = "negative"
case = "../../../cases/opt/commit_checks/fold_function_type.cml"
args = ["${case}", "test::camel_commit_checks", "std::nvm"]
expect_exit = 1
timeout_ms = 20000
expect_diagnostic_name = "RuntimeDiag::PassEffectContainment"
expect_output_contains = ["fold_function_type: the call site at node", "now declares '(x: int) => int pure'", "while the body it runs is 'announced'", "CAMEL_CHECKS build asks=0", "CAMEL_CHECKS accepted, asked=0", "CAMEL_CHECKS released: the run continued past opt::cse with the checks off", "CAMEL_CHECKS asked=1 -> the same program, the same pass", "Pass 'opt::cse' returned a program whose call site reaches past the type it declares", "write stdout"]

# What the check declined to judge, so that "I looked and it is fine" and "I refused to look" do not
# read the same in a log. Both numbers are pinned: a checker that stays green by declining more has
# to raise `declined` first, and one that judges nothing has to keep `checked` above zero.
#
# The reading is a run reading on the `effects` area of the tracing channel, not an environment switch
# and no longer a log scope: a run's behaviour is decided by the program, the command line and the build
# options (design principles 9.3), and one kind of reading has one way to ask for it -- `--trace effects`
# (the ruling of 2026-11-16 moved it off the environment and off the `Pass` scope).
[[tests]]
name = "commit_checks.counts_what_it_declines"
desc = "With the Pass scope at info, the check says what it compared and what it declined, and the two counts are pinned so that silence has to show up as a number."
kind = "behavior"
case = "../../../cases/compile/generics/pipelines.cml"
args = ["-vv", "--log-include", "Pass", "--trace", "effects", "${case}", "std::opt", "std::nvm"]
expect_exit = 0
timeout_ms = 60000
expect_stderr_contains = ["effect containment: checked"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stderr
const line = out.split('\n').find(l => l.includes('effect containment: checked '))
assert(line !== undefined, `no summary line in: ${out}`)
const m = line.match(/effect containment: checked (\d+) call site\(s\), declined (\d+) reading\(s\) \(any unknown (\d+) \/ any object (\d+) \/ any handle (\d+) \/ variable cell (\d+) \/ unresolved (\d+) \/ other (\d+)\)$/)
assert(m !== null, `the summary line does not parse: ${line}`)
const n = m.slice(1).map(Number)
const [checked, declined, unknown, object, handle, variable, unresolved, other] = n
const parts = n.slice(2).reduce((a, b) => a + b, 0)
assert(parts === declined, `the components do not add up: ${line}`)
assert(checked > 0, `checked ${checked}: a checker that judges no call site is green for no reason`)
assert(declined <= 3, `declined=${declined} (any unknown ${unknown} / any object ${object} / any handle ${handle} / variable cell ${variable} / unresolved ${unresolved} / other ${other}), checked=${checked}: 3 is what this program needed on 2026-11-15, and a checker that stays green by declining more has to raise this number first`)
assert(unknown <= 3, `any unknown=${unknown}: 3 is what this program needed on 2026-11-15`)
}
"""

[[tests]]
name = "commit_checks.declines_add_up"
desc = "The components of the summary are counted apart, so a gap in the analysis -- a call site the graph does not resolve -- cannot hide inside the conservative readings of the resource classes."
kind = "behavior"
case = "../../../cases/compile/pass_guard/plain.cml"
args = ["-vv", "--log-include", "Pass", "--trace", "effects", "${case}", "test::fold_function_type", "std::nvm"]
expect_exit = 0
timeout_ms = 20000
expect_stderr_contains = ["effect containment: checked"]

# A type that carries no clause promises nothing, so a call site that has one cannot be in breach:
# "no promise, no breach" is not the same sentence as "a reading the checker cannot name", and the
# two must not collapse into one branch. Here the call site is a call through a parameter whose type
# is `(x: int) => int -- no resource clause at all -- and the body behind it prints.
[[tests]]
name = "commit_checks.a_type_that_promises_nothing"
desc = "A call through a parameter of function type carries a Generic signature. The body behind the value prints, and that is not a violation: there was no promise to break."
kind = "behavior"
case = "../../../cases/opt/commit_checks/generic_call.cml"
args = ["-vv", "--log-include", "Pass", "--trace", "effects", "${case}", "std::opt", "std::nvm"]
expect_exit = 3
timeout_ms = 20000
expect_stdout_contains = ["3"]
expect_stderr_contains = ["effect containment: checked"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stderr
const line = out.split('\n').find(l => l.includes('effect containment: checked '))
assert(line !== undefined, `no summary line in: ${out}`)
// The call site must be *judged* and passed, not declined: a checker that answers "I cannot look at
// this" would be right by accident here, and would stop being right the moment a type does promise
// something. `declined` is what separates the two answers.
const m = line.match(/checked (\d+) call site\(s\), declined (\d+) reading\(s\)/)
assert(m !== null, `the summary line does not parse: ${line}`)
assert(Number(m[1]) >= 3, `checked ${m[1]}: the three call sites of this program must be compared`)
assert(Number(m[2]) === 0, `the generic call site was declined instead of judged: ${line}`)
}
"""
