case = "../../../cases/opt/generic/probe_half.cml"
args = ["${case}", "std::opt::specialize", "std::jgir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000