id = "opt.screens"
order = 322
tier = "fast"
tags = ["feat", "opt", "generic", "screens"]

# The generic passes skip a graph when a screen read from the frozen graph says they have nothing
# to do in it (generic/screen.cpp), and when they already left its content alone. Each test runs
# the optimizer with check_screens=true: the skipped graphs are given to the pass anyway, and a
# rewrite there fails the run. A new rewrite in a pass that does not widen its screen fails here.
#
# This plan is also an acceptance item of, stated as the contract the screens owe: a screen may
# not be stricter than the pass it screens for (the rule,
# "fold-screen-contract-without-block", option (a); generic/screen.cpp states the same rule at the
# top of the file). The group at the end of this plan is the one that carries it for the own
# inputs -- the frozen graph of the effects model, a `var` read across a callee's write, a `sync`
# block's chain, the two libraries whose results the same batch watches (`library_gemm`,
# `grad_library`) -- so that a screen that starts refusing a rewrite those programs need fails a
# test that names rather than only the corpus around it.

[defaults]
kind = "behavior"
timeout_ms = 60000
expect_exit = 0

[[tests]]
name = "nn.autoencoder"
case = "../../../cases/modules/nn/autoencoder.cml"
args = ["${case}", "std::opt check_screens=true", "std::null"]

