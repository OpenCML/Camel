id = "opt.regions"
order = 369
tier = "fast"
tags = ["feat", "opt", "regions"]
desc = """
Regions (docs/design/graph-store 3.3): a column of the region a node is in and a table of the
regions of a graph, kept by decode, encode, commit and the chunks. `test::regions` puts nodes of
a program's largest graph in two nested regions and commits; the new version has them, a decode
and a second commit with no change in between give the same version, and the program runs as
before (no back end reads regions yet).

The two entries that ran that pass on `../../../cases/opt/generic/arm_tail_gate.cml` moved to
`arm_tail_gate_regions.cml`, word for word. That program's arms read its body's ports and its
condition, so every body value is one an arm reads, and a block around them would be read from an
arm across two branches -- a shape a region may not have (the commit refuses it). The old case file
stays in the tree; the graph it builds cannot host the blocks the pass puts down.
"""

[[tests]]
name = "regions.inline_origin"
desc = "std::opt::inline puts the body of each function it inlines in a region of kind inline, inside the region of the call, which names the function it came from (std::jgir shows them); the program still runs."
kind = "behavior"
case = "../../../cases/opt/generic/arm_tail_gate.cml"
args = ["${case}", "std::opt::inline", "std::jgir"]
expect_exit = 0
expect_output_contains = ["\"regions\"", "\"kind\": \"inline\"", "\"inlined\": \"forward\"", "\"region\": \"g1r1\""]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "regions.inline_runs"
desc = "A program inlined by std::opt::inline, with its inline regions, runs on every back end as before."
kind = "behavior"
case = "../../../cases/opt/generic/arm_tail_gate.cml"
args = ["${case}", "std::opt::inline", "${run_fvm}"]
expect_exit = 0
expect_stdout_contains = ["[8.0, 8.0]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "regions.dot_clusters"
desc = "std::gir_regions and std::rgir_regions draw the regions of a graph as clusters inside the cluster of its function; std::gir and std::rgir draw the same graph without them."
kind = "behavior"
case = "../../../cases/opt/generic/arm_tail_gate.cml"
args = ["${case}", "std::opt::inline", "std::gir_regions"]
expect_exit = 0
expect_output_contains = ["label=\"inlined forward\""]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "regions.dot_default_unchanged"
desc = "Without the regions option the dump has no region cluster."
kind = "behavior"
case = "../../../cases/opt/generic/arm_tail_gate.cml"
args = ["${case}", "std::opt::inline", "std::rgir"]
expect_exit = 0
expect_output_not_contains = ["inlined forward"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "regions.exec_plan"
desc = "test::exec_plan prints the order the back ends run a graph in, with the region of each node and the entry and tail of each arm of its branches: the program has a BRCH with both arms."
kind = "behavior"
case = "../../../cases/opt/generic/arm_tail_gate.cml"
args = ["${case}", "test::exec_plan"]

expect_exit = 0
expect_output_contains = ["PLAN run ", " arm0=", " arm1="]
timeout_ms = 20000

[[tests]]
name = "regions.survive_commit_body"
desc = "The same two nested Block regions, the same port and the same answer, on a graph whose body does work of its own: `arm_tail_gate_regions.cml` exists because on `arm_tail_gate.cml` the arms read the body's ports and its condition, so every body value is one an arm reads, and a block around them would be read from an arm across two branches -- a shape a region may not have. The expect strings are the ones the old case carries, word for word."
kind = "behavior"
case = "../../../cases/opt/generic/arm_tail_gate_regions.cml"
args = ["${case}", "test::regions", "std::nvm"]

expect_exit = 0
expect_output_contains = ["REGIONS count=5 in_inner=2 in_outer=1 result=ok ports=1 within=1", "REGIONS recommit same=1", "[8.0, 8.0]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "regions.survive_optimization_body"
desc = "std::opt after test::regions on the body-work graph leaves the answer unchanged, with the regions still there."
kind = "behavior"
case = "../../../cases/opt/generic/arm_tail_gate_regions.cml"
args = ["${case}", "test::regions", "std::opt", "std::nvm"]

expect_exit = 0
expect_output_contains = ["REGIONS count=5", "[8.0, 8.0]"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "regions.sibling_refused"
desc = "The commit refuses a node of one arm reading a port the graph gives to the other arm of the same branch, and the refusal names the port and the reader. `test::regions` builds that shape in a draft over the program it is handed, commits it, and reports what came back; the refused commit publishes nothing, so the rest of the entry is the same run as before."
kind = "behavior"
case = "../../../cases/opt/generic/arm_tail_gate_regions.cml"
args = ["${case}", "test::regions", "std::nvm"]

expect_exit = 0
expect_output_contains = ["REGIONS sibling_refused=1 port=0 reader=8 arm=2 sibling=1 rule=1 named_port=1 named_reader=1"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "regions.owner_refused"
desc = "The owner's exception is written on the port, not on the reader: the node that owns a region may read that region's exit (`region.result`, whatever kind of node the exit is) and nothing else in it. `test::regions` builds the two shapes the rule refuses -- a node of one arm reading a port the graph gives to the other arm (`regions.sibling_refused`), and here the owner read with the exit taken away: on this program the loop inside the arm reads its body's exit port, and the draft makes the body end in nothing, so the loop's read is of a port the region does not end in. Under the wider exception (the owner reads any port of its region) this draft commits; the rule as the author narrowed it (2026-11-03 08:10) refuses it, naming node 10 in region 1 reading port 9 of region 2."
kind = "behavior"
case = "../../../cases/compile/expected_type_loop/loop_parts.cml"
args = ["${case}", "test::regions", "std::nvm"]

expect_exit = 0
expect_output_contains = ["REGIONS sibling_refused=1 port=1 reader=6 arm=1 sibling=3 rule=1 named_port=1 named_reader=1", "REGIONS owner_refused=1 port=9 owner=10 region=2 rule=1 named_port=1 named_reader=1 violations=1", "REGIONS count=7 in_inner=2 in_outer=1 result=ok ports=1 within=1"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "regions.orphan_owner_refused"
desc = "A control region may not outlive the node it belongs to. `test::regions` asks that of the commit by giving a region an owner the draft then erases, which is the state a pruning pass leaves when it takes the loop or the branch away and forgets the region; the region's kind and members stay as they were, its owner is not there, and the commit refuses it, naming the region (`validateRuntimeRegions`, src/runtime/graph.cpp). No program in the tree builds that draft, so with no case this check would look the same whether it read the owner or not. The two readings are `gone=1` (the draft really erased the owner) and `rule=1 named_region=1` (the refusal is the owner's own wording and names the region, not a neighbouring rule about a port or a member)."
kind = "behavior"
case = "../../../cases/compile/expected_type_loop/loop_parts.cml"
args = ["${case}", "test::regions", "std::nvm"]

expect_exit = 0
expect_output_contains = ["REGIONS orphan_owner_refused=1 region=1 gone=1 rule=1 named_region=1", "REGIONS orphan_member_refused=1 region=2 rule=1"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "regions.orphan_member_refused"
desc = "The other direction of the same rule: a node whose region is not there. `test::regions` retires a region and leaves a node of the draft in it; the commit refuses the graph and names the node and the region (`validateRuntimeRegions`), because a region has no member table a check could find short -- the membership is the column on the node, so that is the side that has to be read. `rule=1` says the refusal is that wording and not another one about the same draft."
kind = "behavior"
case = "../../../cases/opt/generic/arm_tail_gate_regions.cml"
args = ["${case}", "test::regions", "std::nvm"]

expect_exit = 0
expect_output_contains = ["REGIONS orphan_member_refused=1 region=3 rule=1"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "regions.branch_pruned"
desc = "A branch whose condition is statically known is replaced by the arm it takes, and the graph that is published holds no control region of that branch: the arm regions went with it (the draft dissolves them and hands what they held to the region around, GraphDraft::dissolveRegionsOf), so nothing is left pointing at a branch that is not there. Read through `test::exec_plan`, whose REGION lines are the control regions of each graph: none is left, while the program still prints what it printed before the branch was folded."
kind = "behavior"
case = "../../../cases/opt/generic/pruned_branch_keeps_condition_effect.cml"
args = ["${case}", "std::opt", "test::exec_plan"]

expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const lines = input.normalized.stdout.split(String.fromCharCode(10))
const left = lines.filter((line) => line.startsWith('REGION '))
assert(left.length === 0, `the dissolved branch left ${left.length} control region(s): ${left.join(' | ')}`)
const printed = lines.filter((line) => line.trim() !== '').slice(-3).join(' | ')
assert(printed === 'side 2 | side 2 | bd 1 1', `unexpected output: ${printed}`)
}
"""
timeout_ms = 20000
