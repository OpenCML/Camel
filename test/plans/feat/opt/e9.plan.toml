# --- rc19_seed70: the argument after a bound one, typed as its predecessor ----------------------
#
# The program is the fifth shape of that run's crash class, and the crash is the C++ compiler's
# sentence: `error: no matching function for call to 'f1'`, with
#
#   note: candidate function not viable: no known conversion from 'Fn<int64_t (double)>' to
#         'Fn<bool (rt::Str, int64_t)>' for 3rd argument
#
# `std::cxx::specialize` binds the literal `false` into `f1`'s first parameter: it bakes the value
# into the copy (`f1$spec1`), erases that formal from the copy's ports, and drops the argument from
# the call. The copy's *declared* function type keeps the erased parameter -- `specializeGraphWith
# Bindings` renumbers the resource clause and copies the parameter list as it stands
# (`setRenumberedClause`, src/runtime/draft_inline.cpp) -- and the writer matched the surviving
# arguments against that list by position (`FunctionEmitter::lowerCall`,
# src/passes/trans/cpp/function_emitter.cpp), so the closure in the third slot was spelled with the
# second parameter's type: `rt::Fn<int64_t(double)>` where the definition it calls takes
# `rt::Fn<bool(rt::Str, int64_t)>`. Nothing was lost at run time -- the graph is right and all four
# back ends run it -- and nothing was lost in the call either: one *type* was off by one slot.
# The writer now takes the parameter types from the callee's ports, which is where the definition's
# own parameter list comes from (`collectParameters`), so a call that matches the ports matches the
# definition by construction.
#
# The 19-line form of this file (b728a7c1f) is the same point with a `with <k33>` member and a
# `match` around the call; this is its reduction, and the chain is seed 70's own 142-line program ->
# that form -> no `with` member -> no unused `let` -> the closures used -> 7 lines, each step
# verified against an unpatched install (the clang sentence above, at the same argument).

[[tests]]
