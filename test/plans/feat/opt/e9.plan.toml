case = "../../../cases/opt/e9/rc19_seed70.cml"
args = ["${case}", "${backend}"]
expect_exit = 0
expect_stdout_exact = "r true\n"

[[tests]]
name = "rc19_seed70.specialize"
desc = "The same program after `std::cxx::specialize`, on all four back ends: the specialization fires (`false` is bound into `f1`, the call passes two arguments instead of three), the graph stays right, and the program still prints `r true`. This is what says the defect was in the writer's reading of the callee's type and not in the specialization."
case = "../../../cases/opt/e9/rc19_seed70.cml"
args = ["${case}", "std::cxx::specialize", "${backend}"]
expect_exit = 0
expect_stdout_exact = "r true\n"

[[tests]]
