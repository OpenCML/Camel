desc = "The writer's text after the same pass: the closure that fills the second surviving parameter is spelled with that parameter's own type -- `rt::Fn<bool(rt::Str, int64_t)>(` and not its predecessor's `rt::Fn<int64_t(double)>(`. Before the fix the text carried the wrong spelling and clang refused it; the run that builds and runs the text, and compares what it prints with `std::fvm`, is `feat/trans/cpp.rc19_seed70_builds_after_specialize`."
