#   rc16_seed153                no result in 30 s under `std::jit` on every pipeline. One program.
#   rc17_seed193                clang: "non-void function 'lambda' should return a value": the
#                               writer left the lambda's `return` with no value, because the
#                               branch that gave it was no longer the sequence's last word. Two.
#   rc18_seed429                clang: "expected expression" at a `= ;` the C++ writer left. One.
#   rc19_seed70                 clang: "no matching function for call to 'f1'". One program.
#   rc20_seed262                `binding != nullptr` in `Builder::rebindSsa`. Eight programs, and
#                               the one shape here that is not this lane's: it arrived with the
#                               merge (S1), and its entry is the one at the end of this section.
