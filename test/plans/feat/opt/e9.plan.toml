# --- The effect that does not run, which the author ruled must ---------------------------------
#
# `rc23_seed429_sync_arm` is the smallest program of a shape the E9 run reports as a wrong value
# and the compiler reported as a warning: a `sync` block inside the value of a binding nobody reads,
# holding an outside write (`q(5)` prints).
#
# The author ruled on 2026-11-17:
#
#   "by principles 3.1 and 3.4 an outside write is used by the region it runs in, so a call, loop
#    or block that writes runs even when its value is unread; region roots follow the inferred
#    effect and the warning that named it goes."
#
# So the print happens and the warning stops being reported. The mechanism is an **edge that makes
# the region's exit a place the walk reaches**, not a rule that reads the region's roots: an arm
# whose value the JOIN does not take exits through a GATE of its own (`Builder::layRegionWriteEdges`,
# `gateExitOf`), which forwards the arm's value, takes the arm's statement chain, orders the JOIN
# after it by a sync edge, and becomes `region.result`.
#
# That distinction is the whole repair, and it cost three measurements to get to: an edge laid to a
# region's exit **orders a write before the value** but cannot make the region **run**, so a JOIN
# that does not hold the arm's value leaves nothing that carries the walk into the arm's interior.
# A symbol being present in the tree is not evidence about a shape; the evidence is the shape going
# through and the path being taken.
#
# The two facts that make this the *minimal* program, both measured: dropping the `var v`
# declaration and its write makes the print come back (the branch is then needed for the print
# alone), and the write itself is not an effect (3.5), which is what kept the branch unneeded
# before the fix.
#
# The entry is a normal one -- an expectation that holds, not a known failure: the program prints
# `P 5` on all four back ends. **The warning is gone because nothing is left dangling for it to
# describe, not because the diagnostic was removed**: the never-executed warning and
# `drop_effect` are untouched, and reporting a warning that describes no defect would be the same
# mistake in the other direction.

[[tests]]
name = "rc23_seed429_sync_arm.runs"
desc = "An outside write inside a `sync` arm of a `match` whose value nobody reads: by 3.1 and 3.4 the write runs with the region it is written in, so the program prints `P 5`, exits 0, and reports nothing."
case = "../../../cases/opt/e9/rc23_seed429_sync_arm.cml"
args = ["${case}", "${backend}"]
expect_exit = 0
expect_stdout_exact = "P 5\n"
# The author's rework order of 2026-11-18 is that this case is not withdrawn to make a
# number look better: it pins a behaviour he confirmed it has an owner, and it stays in
# the plan as a red that is being repaired -- `known_fail` is "在修的红", not an accepted answer. The
# three parts he asked a mark to carry are the three fields below.
#
#   the defect -- **a region's write is not joined to the region's exit when the graph is built**
#     (a finding still true of this tree). Measured with a temporary trace in
#     `Builder::layRegionWriteEdges`: `q(5)` *is* collected as a write of the `case _` arm
#     (`id=16 kind=10 -> statement=16 region=3 exit=18`), and then `gateOf` lays no GATE for it,
#     because the arm's exit already reaches the write (`region=3 write=16 dropped: result already
#     reaches it`) and nothing else makes that exit needed. The whole `match` is then unreachable when
#     the graph is frozen -- the graph holds no `BRCH`, no `JOIN` and no call to `q`, and the run
#     prints the warning below instead of `P 5`.
#   the owner  -- this lane's rework: the exit `GATE` that reads the region's writes.
#   the unhide -- when that rework is merged, delete the mark; the case prints `P 5` and reports
#     nothing. The rework landed in the merge that brought the region exit GATE (a region's exit GATE forwards
#     the value its reader takes), the run below passed on all four back ends, and the four fields are
#     gone; what stays is this record of what the mark was and why it had to come off.
#
# The four fields are gone: `known_fail_msg` pinned the warning, the warning stopped being reported
# when the rework landed, and the entry reads `P 5` on all four back ends. `develop` printed `P 5`
# here before that batch (`feat/opt` 1538/1538), so the mark was a regression of the
# batch that added it and not a reading the language had not settled -- the tree is back to that
# reading, and no new mark replaces it.

# --- The five statements a chain splice used to drop -------------------------------------------
#
# The E9 differential campaign put six reduced programs in one class: under `std::opt`, or a prefix
# of the ladder, a statement that prints stopped running, or ran after the statement written after
# it. One place lost all six -- `GraphDraft::closeChainOver` (`src/runtime/draft.cpp`) kept the wait
# of a predecessor only when `nodeRegion(pred)` was the user's region, and a splice gives the code
# it moves an `Inline` region, so a predecessor still carrying the annotation of the region it came
# from was refused -- and the repair reads "another block" through `sameSyncBlock`, the block test
# the rest of that file and `placeLostStatements` already use (merge,
# docs/design/effects/edges.cn.md 4.6 and 5.7).
#
# Five of the six turned correct with it and the sixth did not; these five entries are those five,
# the bisection's own reductions (internal/reports/2026-11-18-e9-six-bisected-by-seed.cn.md,
# section 4), 10 to 23 lines each. Each is one pair: the reading with no pass at all, which the
# optimized run is held to, and the shortest prefix of the ladder the bisection named as the one
# that loses the statement. Both cells of all five were measured on the `draft.cpp` of `2779ad600^1`
# and on the one after that change (the file swapped in place and rebuilt either way, `std::nvm`,
# `--gc generational`), which is where the before/after sentence in each entry comes from:
#
#   rc24_seed131  devirtualize + inline + fold  `L5 [{ x: 0, y: 0 }]` then the blank line: the
#                                               closure's `println('')` moved to the end of the output
#   rc25_seed141  inline + fold                 no line at all; the called function's `println` does
#                                               not run
#   rc26_seed417  inline + fold                 only `L4 0 0`; the inlined statement's `println` is gone
#   rc27_seed419  inline + cse                  no line at all; `q21`'s `println` does not run
#   rc28_seed484  inline + fold                 no line at all; `q27`'s `println` does not run
#
# The shorter prefixes are green even before the repair, measured rather than assumed, and that is
# what makes the pair worth writing: `std::cxx::fold` alone reads all five correctly, `inline + fold`
# is green on `rc24_seed131`, and `std::cxx::cse` alone is green on `rc27_seed419`. The trigger is a
# statement a splice has already moved into an `Inline` region and the fold then replaces -- exactly
# the annotation `closeChainOver` had to look through -- so `rc24_seed131`, whose trigger also needs
# the `devirtualize` in front of the inline, is the one whose prefix is three passes long.
# `std::opt` as a whole was red on all five before the repair and is green on all five after it on
# all four back ends, so the prefix below is the narrow reading of the same fact, not a weaker one.
#
# The bisection report wrote that these could only be single-cell cases because the no-pass cell is
# not green. On that tree all five read correctly with no pass at all, so the pair stands here as
# it does for every other program in this file.
#
# `311`, the sixth, was deliberately not here while it was red. `std::cxx::inline` on it stops the
# `println('MAIN')` written before a macro expanded in an argument from running, `sameSyncBlock` does
# not reach it, and it read the same wrong answer as on `2779ad600^1`. A `known_fail`
# would have recorded a wrong answer as the expected one: the answer was to fix it, and the fix
# did (`GraphDraft::closeChainOver`, src/runtime/draft.cpp). Its entry is the section at the end of
# this file, and it is four cells rather than the pair the five above have.

