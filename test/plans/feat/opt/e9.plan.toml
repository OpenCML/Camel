#
#   * `std::nvm`, `std::fvm`, `std::jit` answered 0 for a variable that is 5 (measured on
#     `rc21_seed429`, whose answer is 5 on all four back ends, and whose answer was 0 on all four
#     before this fix) -- a silent wrong value, the kind no differential comparison can catch,
#     because all the back ends were wrong together;
#   * `std::cpp` left the branch's temporary unassigned in one arm: `v1_branch = ;`, which clang
#     refuses.
#
# `rc21_seed429` is the smallest program of the shape (the write inside a nested `if`), and
# `rc22_flat_if_var` is the control: the same `if` without `else` and without the nesting, where
# the back ends were right and `std::cpp` was wrong (its text stored 0 where the answer is 5).
# Both are in `test/tools/cppexec/expect.txt` too, so the C++ path is not only read here: the
# program is translated, built, run and compared with `std::fvm`.

