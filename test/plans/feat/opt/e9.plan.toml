# --- The sixth: the wait a splice let evaporate behind a macro expanded in an argument ----------
#
# `rc29_seed311` is the 20-line program of the sixth figure of
# `internal/reports/2026-11-18-e9-six-bisected-by-seed.cn.md` section 4 (reproduced 5/5), and
# it is the sixth of the six wrong values one merge turned correct -- the one that merge
# left wrong. Under `std::macro std::cxx::inline` the `println('')` written *before* the call does
# not run, so the program prints one blank line where it should print two. The inline expands the
# macro call `f1(true, 10.0)` into the argument slot; the statement written before the call hangs on
# the chain by an ORDER edge only, and the gate standing for that call carries it. `closeChainOver`
# would not hand that wait on: the successor it named already had two waits -- the inlined body's
# completion *and* the call whose gate was going -- and the test it asked was "does this successor
# wait on anything else", which answers the right question only while a successor has one wait or
# none.
#
# The repair is `GraphDraft::closeChainOver` (src/runtime/draft.cpp): the condition a
# predecessor's wait is kept by now reads "the successor waited on this node -- its own wait is the
# one going away -- or it waits on nothing", so two waits no longer refuse the hand-on and the wait
# evaporates into the chain instead of into nobody.
#
# Four cells, and the shape of the set is the claim this entry makes:
#
#   without_the_pass  the reference: two blank lines with no pass at all. Nothing the ladder does is
#                     what the fault needed, so what the ladder prints is held to what the program
#                     prints -- the entry names no number that the program itself does not give.
#   macro_inline      `std::macro std::cxx::inline`, the ladder the bisection named: the same two
#                     lines. Before the repair this cell reads one, and it is the red this pins.
#   macro_only        `std::macro` alone: the same two lines, on both sides of the repair.
#   inline_only       `std::cxx::inline` alone: the same two lines, on both sides of the repair.
#
# The last two are the reverse pin, and they are the reason the ladder cell is worth writing at all.
# `std::opt` as a whole was measured green on this program before and after the repair (by the lane
# that measured the six), and so is each of these two passes on its own. A mark on `std::opt` would
# sit where it was green all along, and a later regression in the *pair* -- the only shape this
# program has ever been wrong in -- would be hidden by passes that still cancel it out. Three cells
# that stay green while one flips is "only the pair was ever broken"; one green cell on the whole
# ladder would only say "the ladder is green today".

[[tests]]
