# `rc03_seed56` is the program of this group that no single pass of `std::opt` reaches: every one of
# its eight passes, run alone, is green, and the whole pipeline used to end in `PassInternalError`
# naming an order edge that entered a region:
#
#   graph '__root__': order edge 25 -> 10 enters region 5; an arm or a part of a loop runs as a
#   whole, so the order it has with the code around it is written on the node that owns the region
#
# The edge was written while both of its ends were in one region -- that is when it says what it has
# to say -- and a rewrite moved one of them afterwards. The program prints nothing under any pass,
# so what the entries hold is exit 0 and no output, the same as with no pass at all, on all four
# back ends.
#
# `rc03_seed56.opt` is the entry the defect came back in: the sentence it used to print is in
# `expect_output_not_contains` by name, so a run that meets it again is red.

[[tests]]
name = "rc03_seed56.without_the_pass"
desc = "The program with no pass at all: runs, says nothing, exits 0."
case = "../../../cases/opt/e9/rc03_seed56.cml"
args = ["${case}", "${backend}"]
expect_exit = 0
expect_stdout_exact = ""

[[tests]]
name = "rc03_seed56.opt"
desc = "The whole optimizer, on the program whose fixed point left an order edge reaching into a region one of its ends had been moved into: exit 0 and no output, the same as with no pass at all."
case = "../../../cases/opt/e9/rc03_seed56.cml"
args = ["${case}", "std::opt", "${backend}"]
expect_exit = 0
expect_stdout_exact = ""
expect_output_not_contains = ["enters region", "PassInternalError", "internal error"]
# The loop's table was refused here (`begin` after `condEnd`, so the Test fired before the node it
# reads) until the dispatch of a call through a value was written in the call's own region: the
# range is one range now, node 8 stands before the Test, and all four back ends -- nvm included --
# really do run this loop. The defect is fixed; nothing about this entry's reading is what changed.

# The A16 group of the same campaign (A16a-A16e, pages
# `internal/reviews/questions-2026-10-29.md`): five reduced programs that came back from the
# optimizer with the *wrong program*, not with a refusal. Every one of them exits 0, and the fault
# is the value it prints -- which is why each entry here pins the exact stdout rather than "no
# error", and why the same program with no pass at all is in the plan beside it: that run is the
# model the optimized one is held to, and on all four back ends it is the same reading.
#
#   rc02_seed9   A16a  `std::cxx::specialize std::cxx::inline std::cxx::fold` printed `q36 10`
#                      then `q36 0`; the program prints `q36 0` then `q36 10`.
#   rc04_seed251 A16b  `std::cxx::inline` printed one blank line twice (a two-element `loop` inside
#                      an inlined body ran the statement before it once per round).
#   rc05_seed256 A16c  `std::opt` printed nothing where the program prints one blank line.
#   rc07_seed140 A16d  `std::cxx::inline std::cxx::dce` printed one blank line where the program
#                      prints two.
#   rc09_seed15  A16e  `std::cxx::inline std::cxx::fold` printed the blank line then `L4 0 `; the
#                      program prints `L4 0 ` then the blank line.
#
# A16b, A16c and A16d are green on the develop this lane started from (they were red on the build
# of 2026-11-12 the campaign reduced them with); their entries stay, because a reduction of this
# campaign that is not in the plan is a defect that can come back unseen.
#
# Where each one first goes wrong, measured -- the build the campaign reduced them
# on -- by adding the ladder's passes one at a time (`std::macro`, then devirtualize, specialize,
# inline, fold, cse, algebra, dce, order, then `std::opt` as a whole) under `--gc generational
# std::nvm`, and comparing the bytes with the same program and no pass:
#
#   rc02_seed9   +std::cxx::fold    `q36 10` then `q36 0`
#   rc04_seed251 +std::cxx::inline  two blank lines where the program prints one
#   rc05_seed256 std::opt           nothing at all; no earlier prefix of the ladder is wrong
#   rc07_seed140 +std::cxx::dce     one blank line of the two
#   rc09_seed15  +std::cxx::fold    the blank line first, then `L4 0 `
#
# A16e's row in the campaign table names `std::cxx::order`, and that is not where the reading
# first goes wrong: `+dce`, the step before `+order`, already reads the program's lines in the
# program's order again, so `+order` cannot be the first wrong step. What `+fold` breaks on
# `rc09_seed15` is the place `+fold` breaks on `rc02_seed9`. On the baseline these
# entries run on -- every one of the five reads correctly at every step of the ladder.
#
# A16a and A16e are one defect and one case: `std::cxx::fold`'s `pruneBranch` dissolves the branch
# and takes the place of the block with it. The `JOIN` was the only node that carried the block's
# source order -- what was written before the branch, the arm it took, what was written after -- so
# when it goes, two effects of one block are left with no edge between them and the scheduler is
# free to run them in either order, which it does. In `rc09_seed15` the taken arm is itself the
# effect (`then println('L4 0 ')`), in `rc02_seed9` the arm that was dropped used an effect produced
# before the branch and kept alive by a `GATE`. Both shapes are one rule: the place goes to what
# stands in it, so `pruneBranch` now orders the statements the `JOIN` ordered after that node and
# after every effect the dropped arm kept alive (src/passes/opt/generic/generic.cpp). The two
# programs are kept, one entry for each, as the two shapes of that one case.

[[tests]]
name = "rc02_seed9.without_the_pass"
desc = "`rc02_seed9` (A16a) with no pass at all: the reading the optimized run is held to. Two lines, in this order -- `q36 0` from the call before the branch, `q36 10` from the one after it. First wrong pass: this program first goes wrong in `std::cxx::fold` (measured; correct on this baseline)."
kind = "behavior"
case = "../../../cases/opt/e9/rc02_seed9.cml"
args = ["${case}", "--gc", "generational", "${backend}"]
expect_exit = 0
expect_stdout_exact = "q36 0\nq36 10\n"
normalizers = ["strip_ansi", "normalize_newlines"]
verify_script = """
({ input, assert }) => {
const lines = input.normalized.stdout.split('\n')
assert(lines.length === 3 && lines[2] === '', `expected two lines, got ${JSON.stringify(lines)}`)
assert(lines[0] === 'q36 0', `first line is ${JSON.stringify(lines[0])}, not "q36 0"`)
assert(lines[1] === 'q36 10', `second line is ${JSON.stringify(lines[1])}, not "q36 10"`)
}
"""
timeout_ms = 20000

[[tests]]
name = "rc02_seed9.specialize_inline_fold"
desc = "`rc02_seed9` (A16a) under the reduced pipeline the campaign found it with: the same two lines in the same order. The branch the fold dissolves stood between the two calls, so the printed lines used to come out swapped -- the blank line of A16e and this one are one defect, one place `pruneBranch` now hands over. First wrong pass: this program first goes wrong in `std::cxx::fold` (measured; correct on this baseline)."
kind = "behavior"
case = "../../../cases/opt/e9/rc02_seed9.cml"
args = ["${case}", "--gc", "generational", "std::cxx::specialize", "std::cxx::inline", "std::cxx::fold", "${backend}"]
