name = "unread_gate.graph.opt"
desc = "The integrated std::opt pipeline does the same as dce here: the anchor gate is there, no gate is left unread, and the program's eight effects (the effect count is the property, see the note above the entries)."
case = "../../../cases/opt/generic/unread_gate.cml"
args = ["${case}","std::opt","std::jgir"]
