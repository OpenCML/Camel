[[tests]]
name = "unread_gate.graph.opt_dce"
desc = "std::opt followed by dce leaves the anchor gate, no unread gate, and the program's eight effects: the second removal finds nothing to drop (the effect count is the property, see the note above the entries)."
case = "../../../cases/opt/generic/unread_gate.cml"
args = ["${case}","std::opt","std::opt::dce","std::jgir"]
verify_script = '''
