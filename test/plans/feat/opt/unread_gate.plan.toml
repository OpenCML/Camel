[[tests]]
name = "unread_gate.results.reference"
case = "../../../cases/opt/generic/unread_gate.cml"
args = ["${case}","${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["stdout_normalized"]
verify_script = '''
({input,assert})=>assert(input.normalized.stdout.trim()==="1\n2\n3\n4\n5\n3\n4\n4",input.normalized.stdout)
'''

