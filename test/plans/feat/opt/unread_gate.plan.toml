id = "opt.unread_gate"
order = 325
tier = "fast"
tags = ["feat", "opt", "control", "dce"]

[defaults]
kind = "behavior"
expect_exit = 0
timeout_ms = 10000
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]

[[tests]]
name = "unread_gate.before"
case = "../../../cases/opt/generic/unread_gate.cml"
args = ["${case}","std::inline","std::jgir"]
verify_script = '''
({input,assert})=>{
 const g=JSON.parse(input.normalized.stdout).graphs.find(g=>g.name==='main');
 assert(g.nodes.filter(n=>n.kind==='GATE').length===4,'regression setup changed');
}
'''

[[tests]]
name = "unread_gate.graph.inline_dce"
case = "../../../cases/opt/generic/unread_gate.cml"
args = ["${case}","std::inline","std::opt::dce","std::jgir"]
verify_script = '''
({input,assert})=>{
 const g=JSON.parse(input.normalized.stdout).graphs.find(g=>g.name==='main');
 const gates=g.nodes.filter(n=>n.kind==='GATE');
 assert(gates.length===1&&gates[0].id===g.exit,'unread/data-covered gates survived or return anchor removed');
 assert(g.nodes.filter(n=>n.label===':io/println').length===8,'effect lost');
}
'''

