id = "opt.unread_gate"
order = 325
tier = "fast"
tags = ["feat", "opt", "control", "dce"]

[defaults]
kind = "behavior"
expect_exit = 0
timeout_ms = 10000
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]

# The graph entries below assert the effect count, and that count is the property, deliberately:
# `unread_gate.cml` writes five prints, and `effect_value` (three prints in two inlined calls) — the
# eight `:io/println` operators of the inlined main graph are exactly the program's effects, so the
# number moves only when an effect is dropped or duplicated, never when an unrelated pass moves nodes
# or changes the graph's shape. It is kept as a number with this reason written down, not by
# oversight; `unread_gate.before` asserts the property that makes the case a regression at all (an
# unread gate exists, and the caller's return anchor is still there) instead of its gate total.

[[tests]]
name = "unread_gate.before"
desc = "The setup the dce entries are a regression against: after std::inline the graph carries a gate whose value has no reader (a discarded call's return) and the caller's return anchor. The gate total is not asserted; what makes the rewrite worth testing is that an unread gate exists to drop and that the exit anchor is still there to keep."
case = "../../../cases/opt/generic/unread_gate.cml"
args = ["${case}","std::inline","std::jgir"]
verify_script = '''
({input,assert})=>{
 const g=JSON.parse(input.normalized.stdout).graphs.find(g=>g.name==='main');
 const gates=g.nodes.filter(n=>n.kind==='GATE');
 const unread=gates.filter(n=>n.id!==g.exit&&g.edges.every(e=>e.source!==n.id||e.kind!=='normal'));
 assert(unread.length>0,'no unread gate is left, so the setup no longer exercises the rewrite');
 assert(gates.some(n=>n.id===g.exit),'the caller return anchor is missing');
}
'''

[[tests]]
name = "unread_gate.graph.inline_dce"
desc = "One dce pass: the caller's return anchor is still there, no gate is left without a value reading it, and all eight of the program's effects survive (the effect count is the property, see the note above the entries)."
case = "../../../cases/opt/generic/unread_gate.cml"
args = ["${case}","std::inline","std::opt::dce","std::jgir"]
verify_script = '''
({input,assert})=>{
 const g=JSON.parse(input.normalized.stdout).graphs.find(g=>g.name==='main');
 const gates=g.nodes.filter(n=>n.kind==='GATE');
 assert(gates.some(n=>n.id===g.exit),'the caller return anchor is missing');
 assert(gates.filter(n=>n.id!==g.exit).every(n=>g.edges.some(e=>e.source===n.id&&e.kind==='normal')),'a gate no value reads survived');
 assert(g.nodes.filter(n=>n.label===':io/println').length===8,'effect lost');
}
'''

[[tests]]
name = "unread_gate.graph.inline_dce_twice"
desc = "dce is idempotent: the second pass leaves the same anchor, still no unread gate, and the same eight effects (the effect count is the property, see the note above the entries)."
case = "../../../cases/opt/generic/unread_gate.cml"
args = ["${case}","std::inline","std::opt::dce","std::opt::dce","std::jgir"]
verify_script = '''
({input,assert})=>{
 const g=JSON.parse(input.normalized.stdout).graphs.find(g=>g.name==='main');
 const gates=g.nodes.filter(n=>n.kind==='GATE');
 assert(gates.some(n=>n.id===g.exit),'the caller return anchor is missing');
 assert(gates.filter(n=>n.id!==g.exit).every(n=>g.edges.some(e=>e.source===n.id&&e.kind==='normal')),'a gate no value reads survived');
 assert(g.nodes.filter(n=>n.label===':io/println').length===8,'effect lost');
}
'''

