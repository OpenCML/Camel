[[tests]]
name = "boundary64.5e-324.reference"
case = "../../../cases/opt/generic/algebra_boundary.cml"
args = ["${case}","--arg","x=5e-324","${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["stdout_normalized"]
verify_script = '''
({input,assert})=>{const parse=s=>s==='inf'?Infinity:s==='-inf'?-Infinity:s==='nan'?NaN:Number(s);const same=(a,b)=>Object.is(a,b)||(Number.isNaN(a)&&Number.isNaN(b));
 const x=parse("5e-324"),p=x*3,n=x*-3,f=x*0.1;
 const expected=[p+p,n+n,f+f];const actual=input.normalized.stdout.trim().split(String.fromCharCode(10)).map(parse);
 assert(actual.length===3&&actual.every((v,i)=>same(v,expected[i])),input.normalized.stdout);
}
'''

