# The laws the rules library has and the old C++ pass did not: x * 0, x - x, x / 1, -(-x) for
# the integer element types, and the same division/negation laws on an element-wise tensor. Each
# function's graph keeps no operator where the law fired, so `std::opt::algebra` alone (without
# fold) is enough to see the library is the pass. The values are the source's.

[[tests]]
name = "library.laws.graph"
desc = "std::opt::algebra is rules::simplify: x * 0, x - x, x / 1 and -(-x) leave no operator, the coefficient combine still gives x * 8, and the tensor division/negation laws fire."
kind = "behavior"
case = "../../../cases/opt/generic/algebra_library.cml"
args = ["${case}","std::opt::algebra","std::jgir"]
verify_script = '''
({input,assert})=>{
 const d=JSON.parse(input.normalized.stdout);
 const g=name=>{const v=d.graphs.find(g=>g.name===name);assert(v,'missing '+name);return v};
 const ops=name=>g(name).nodes.filter(n=>n.label.startsWith(':op/')||n.label.startsWith('tensor:')).length;
 for(const name of ['int_zero','int_sub_self','int_div_one','int_neg_neg','tensor_div_one','tensor_neg_neg'])
   assert(ops(name)===0,name+': law did not fire ('+ops(name)+' operators left)');
 assert(ops('int_combine')===1,'coefficient law did not fold to one product');
 assert(g('int_combine').nodes.some(n=>n.label==='8'),'coefficient eight missing');
}
'''

