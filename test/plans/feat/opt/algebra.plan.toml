[[tests]]
name = "tensor.graph.default"
desc = "The elementwise tensor operators declare the laws the algebra pass uses (OperatorSemantics::binary), so x * 3 + x * 5 becomes x * 8 under the default policy as the scalar case does (the coefficient law); a chain of float products is not regrouped without the finite_math grant, as for scalars; coefficients the element type does not hold exactly are left alone; t + t becomes t * 2 by the add-self law; and a product both uses read keeps its two operators."
kind = "behavior"
case = "../../../cases/opt/generic/algebra_tensor.cml"
args = ["${case}","std::opt::fold","std::opt::algebra","std::jgir"]
verify_script = '''
({input,assert})=>{
 const d=JSON.parse(input.normalized.stdout), safe=false;
 const g=name=>{const v=d.graphs.find(g=>g.name===name);assert(v,'missing '+name);return v};
 const counts=(name,add,mul)=>{const a=g(name).nodes.filter(n=>n.label==='tensor:add').length,m=g(name).nodes.filter(n=>n.label==='tensor:multiply').length;assert(a===add&&m===mul,name+': '+a+' adds, '+m+' multiplies')};
 counts('merged',safe?1:0,safe?2:1);counts('merged_explicit',safe?1:0,safe?2:1);
 counts('chain',0,2);counts('inexact',1,2);counts('shared_product',safe?1:0,safe?1:2);
}
'''

