[[tests]]
name = "commutative.graph_safe"
desc = "Under the strict numeric policy the pair is still one graph: the exact doubling of 3.0 needs no permission, so the safe policy takes the same law and the same shape."
case = "../../../cases/opt/generic/algebra_commutative.cml"
args = ["${case}","std::opt safe_fp=true","std::jgir"]
verify_script = '''
({input,assert})=>{
 const d=JSON.parse(input.normalized.stdout),G=n=>{const g=d.graphs.find(x=>x.name===n);assert(g,'missing '+n);return g};
 const T=g=>{const N=new Map(g.nodes.map(n=>[n.id,n])),I=new Map();
  for(const e of g.edges)if(e.kind==='normal'){if(!I.has(e.target))I.set(e.target,new Map());I.get(e.target).set(e.targetIndex,e.source)}
  const M=new Map(),W=id=>{if(M.has(id))return M.get(id);const n=N.get(id);assert(n,'dead reference '+id);
   const v={k:n.kind,l:n.label,t:n.outputType,i:[...(I.get(id)||new Map()).keys()].sort((a,b)=>a-b).map(i=>W(I.get(id).get(i)))};
   M.set(id,v);return v};return JSON.stringify(W(g.exit))};
 const tl=T(G('left')),tr=T(G('right'));
 assert(tl===tr,'the two spellings are different graphs under safe_fp:\n'+tl+'\n'+tr);
 assert(tl.split(':op/mul_d').length-1===1,'left: expected one multiply, got '+tl);
 assert(tl.includes('"l":"6.0"'),'left: coefficient six missing');
}
'''

[[tests]]
name = "commutative.noncommutative"
desc = "The guard's other half: `-` and `/` declare no commutativity, so `0.0 - x` is not read as `x - 0.0` (which would give x) and `1.0 / x` is not read as `x / 1.0` (which would give x). The execution test pins the values (-2.0, 0.5)."
case = "../../../cases/opt/generic/algebra_commutative.cml"
args = ["${case}","std::opt::algebra","std::jgir"]
verify_script = '''
({input,assert})=>{
 const d=JSON.parse(input.normalized.stdout),G=n=>{const g=d.graphs.find(x=>x.name===n);assert(g,'missing '+n);return g};
 const T=g=>{const N=new Map(g.nodes.map(n=>[n.id,n])),I=new Map();
  for(const e of g.edges)if(e.kind==='normal'){if(!I.has(e.target))I.set(e.target,new Map());I.get(e.target).set(e.targetIndex,e.source)}
  const M=new Map(),W=id=>{if(M.has(id))return M.get(id);const n=N.get(id);assert(n,'dead reference '+id);
   const v={k:n.kind,l:n.label,t:n.outputType,i:[...(I.get(id)||new Map()).keys()].sort((a,b)=>a-b).map(i=>W(I.get(id).get(i)))};
   M.set(id,v);return v};return JSON.stringify(W(g.exit))};
 const s=T(G('subtract')),q=T(G('divide'));
 assert(s.split(':op/sub_d').length-1===1,'subtract was commuted: '+s);
 assert(q.split(':op/div_d').length-1===1,'divide was commuted: '+q);
 assert(s.includes('"l":"0.0"'),'subtract lost its zero: '+s);
}
'''

[[tests]]
name = "commutative.execution"
desc = "The pair computes the same value in both orders on every backend (18.0 = (2+1)*3 doubled), and the non-commutative functions keep their values (-2.0, 0.5), so the equal graph is also the equal program."
case = "../../../cases/opt/generic/algebra_commutative.cml"
args = ["${case}","--arg","x=2","std::opt","${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["stdout_normalized"]
verify_script = '''
({input,assert})=>assert(input.normalized.stdout.trim()==="18.0 18.0\n-2.0 0.5",input.normalized.stdout)
'''

