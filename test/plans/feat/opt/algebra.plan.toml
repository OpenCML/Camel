[[tests]]
name = "order.graph"
desc = "A law over data inputs fires on a product that carries a control input, and the writing that replaces it waits for what the product waited for: the rewritten products keep their control edges, so no computation crosses the effect's ordering (design principles 3.3, 3.4)."
kind = "behavior"
case = "../../../cases/opt/generic/algebra_order.cml"
args = ["${case}", "std::opt::inline", "std::opt::algebra", "std::jgir"]
verify_script = '''
({input,assert})=>{
 const g=JSON.parse(input.normalized.stdout).graphs.find(g=>g.name==='main');
 const nodes=g.nodes, edges=g.edges;
 const byId=id=>nodes.find(n=>n.id===id);
 const ctrlOf=n=>edges.filter(e=>e.target===n.id&&e.kind==='control').map(e=>byId(e.source));
 const muls=nodes.filter(n=>n.label===':op/mul_d');
 assert(muls.length===2,'the two scaled calls were not folded into products: '+muls.length);
 assert(!nodes.some(n=>n.label===':op/add_d'),'the doubled product was not folded');
 assert(nodes.some(n=>n.label==='0.2'),'coefficient 0.2 missing');
 for(const m of muls){
  const waits=ctrlOf(m);
  assert(waits.length>0,'the rewritten product lost its control input');
  assert(waits.some(w=>w.label===':io/println'),'the rewritten product no longer waits for the effect it was ordered after');
 }
 assert(muls.some(m=>ctrlOf(m).some(w=>muls.includes(w))),'the control edge between the two calls was lost');
}
'''

[[tests]]
name = "order.execution"
desc = "The rewritten products still run after the effects they were ordered after: the print order is the source's on every back end."
kind = "behavior"
case = "../../../cases/opt/generic/algebra_order.cml"
args = ["${case}", "std::opt", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "first\nscaled 0.4 0.4\nlast\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
