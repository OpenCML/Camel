id = "opt.algebra"
order = 329
tier = "fast"
tags = ["feat", "opt", "numeric", "algebra"]

[defaults]
kind = "behavior"
expect_exit = 0
timeout_ms = 10000
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]

[[tests]]
name = "graph.default"
case = "../../../cases/opt/generic/algebra.cml"
args = ["${case}","std::opt::fold","std::opt::algebra","std::jgir"]
verify_script = '''
({input,assert})=>{
 const d=JSON.parse(input.normalized.stdout), safe=false;
 const g=name=>{const v=d.graphs.find(g=>g.name===name);assert(v,'missing '+name);return v};
 const counts=(name,add,mul)=>{const a=g(name).nodes.filter(n=>n.label.startsWith(':op/add_')).length,m=g(name).nodes.filter(n=>n.label.startsWith(':op/mul_')).length;assert(a===add&&m===mul,name+': '+a+' adds, '+m+' multiplies')};
 for(const name of ['strict','strict32','integer_coefficients','integer32','integer_chain'])counts(name,0,1);
 counts('underflow_sensitive',safe?1:0,1);
 for(const name of ['strict_coefficients','relaxed_coefficients'])counts(name,safe?1:0,safe?2:1);
 counts('mixed_permissions',1,2);counts('shared_product',safe?1:0,safe?1:2);
 const mul=g('strict').nodes.find(n=>n.label===':op/mul_d');
 assert(g('strict').nodes.some(n=>n.label==='6.0'),'coefficient six missing');
 assert(mul.origin&&mul.source,'consumer source lost');
 const relaxed=g('relaxed_coefficients').nodes.filter(n=>n.kind==='OPER');
 assert(relaxed.every(n=>n.numeric==='reassociate'),'permissions changed');
}
'''

[[tests]]
name = "graph.safe"
case = "../../../cases/opt/generic/algebra.cml"
args = ["${case}","std::opt::fold","std::opt::algebra(safe_fp=true)","std::jgir"]
verify_script = '''
({input,assert})=>{
 const d=JSON.parse(input.normalized.stdout), safe=true;
 const g=name=>{const v=d.graphs.find(g=>g.name===name);assert(v,'missing '+name);return v};
 const counts=(name,add,mul)=>{const a=g(name).nodes.filter(n=>n.label.startsWith(':op/add_')).length,m=g(name).nodes.filter(n=>n.label.startsWith(':op/mul_')).length;assert(a===add&&m===mul,name+': '+a+' adds, '+m+' multiplies')};
 for(const name of ['strict','strict32','integer_coefficients','integer32','integer_chain'])counts(name,0,1);
 counts('underflow_sensitive',0,2);
 for(const name of ['strict_coefficients','relaxed_coefficients'])counts(name,safe?1:0,safe?2:1);
 counts('mixed_permissions',1,2);counts('shared_product',0,2);
 const mul=g('strict').nodes.find(n=>n.label===':op/mul_d');
 assert(g('strict').nodes.some(n=>n.label==='6.0'),'coefficient six missing');
 assert(mul.origin&&mul.source,'consumer source lost');
 const relaxed=g('relaxed_coefficients').nodes.filter(n=>n.kind==='OPER');
 assert(relaxed.every(n=>n.numeric==='reassociate'),'permissions changed');
}
'''

