id = "opt.algebra"
order = 329
tier = "fast"
tags = ["feat", "opt", "numeric", "algebra"]

[defaults]
kind = "behavior"
expect_exit = 0
timeout_ms = 10000
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]

# The two graph entries assert the property, not the totals: each function's graph must hold exactly
# the operators of its rewritten expression, each rendered as its own subexpression, so a folded
# coefficient, a product that should not have combined and a stray operator are all visible. An
# `:op/add_*` / `:op/mul_*` total cannot tell `x*3.0 + x*5.0` from `x*2.0 + x*6.0`. The expected
# shapes are stated, with the mode that produces them, in `algebra_shapes.mjs`.

[[tests]]
name = "graph.default"
desc = "Without safe_fp the laws rewrite every function of algebra.cml to its expected expression shape: `t + t` doubles the coefficient (`x*6.0`, `x*0.2`), the coefficient law combines `x*3.0 + x*5.0` into `x*8.0`, `((x + 0) * 3) * 2` becomes `x*6`, `mixed_permissions` keeps its two products because the annotations differ, and `shared_product` keeps the product its print reads beside the folded one it returns. The shapes of the operators are the assertion; no addition or multiplication total is pinned."
case = "../../../cases/opt/generic/algebra.cml"
args = ["${case}","std::opt::fold","std::opt::algebra","std::jgir"]
verify_script_path = "../../../cases/opt/generic/algebra_shapes.mjs"

[[tests]]
name = "graph.safe"
desc = "With safe_fp=true the same functions keep the shapes strict floating point allows: the doubling of `x*0.1` stays a product of that product by 2.0, and the coefficient law declines to combine the two products of `x*3.0 + x*5.0`, while the exact cases (`x*6.0`, `x*8`, `x*6`) are rewritten as in the default mode. The shapes of the operators are the assertion; no addition or multiplication total is pinned."
case = "../../../cases/opt/generic/algebra.cml"
args = ["${case}","std::opt::fold","std::opt::algebra safe_fp=true","std::jgir"]
verify_script_path = "../../../cases/opt/generic/algebra_shapes.mjs"

[[tests]]
name = "commutative.graph"
desc = "The two operand orders of the same program become the same graph: `3.0*(x+1); t+t` and `(x+1)*3.0; t+t` both take the law's shape `x*(c+c)` = `(x+1)*6.0`, because `*`'s declared semantics say the exchange gives the same value and the replacement is built from the law's right side. The 3.0 and the doubling 2.0 are gone."
case = "../../../cases/opt/generic/algebra_commutative.cml"
args = ["${case}","std::opt","std::jgir"]
verify_script = '''
({input,assert})=>{
 const d=JSON.parse(input.normalized.stdout),G=n=>{const g=d.graphs.find(x=>x.name===n);assert(g,'missing '+n);return g};
 const T=g=>{const N=new Map(g.nodes.map(n=>[n.id,n])),I=new Map();
  for(const e of g.edges)if(e.kind==='normal'){if(!I.has(e.target))I.set(e.target,new Map());I.get(e.target).set(e.targetIndex,e.source)}
  const M=new Map(),W=id=>{if(M.has(id))return M.get(id);const n=N.get(id);assert(n,'dead reference '+id);
   const v={k:n.kind,l:n.label,t:n.outputType,i:[...(I.get(id)||new Map()).keys()].sort((a,b)=>a-b).map(i=>W(I.get(id).get(i)))};
   M.set(id,v);return v};return JSON.stringify(W(g.exit))};
 const tl=T(G('left')),tr=T(G('right'));
 assert(tl===tr,'the two spellings are different graphs:\n'+tl+'\n'+tr);
 assert(tl.split(':op/add_d').length-1===1,'left: expected one add, got '+tl);
 assert(tl.split(':op/mul_d').length-1===1,'left: expected one multiply, got '+tl);
 assert(tl.includes('"l":"6.0"'),'left: coefficient six missing');
 assert(!tl.includes('"l":"3.0"')&&!tl.includes('"l":"2.0"'),'left: an old coefficient survived');
}
'''

