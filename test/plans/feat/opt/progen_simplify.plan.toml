id = "opt.progen_simplify"
order = 323
tier = "feat"
tags = ["feat", "opt", "progen", "simplify", "regression"]

[[tests]]
name = "simplify_nested_function_effect_lost.default"
desc = "progen finding F07 under [no pass]. A branch arm whose head is a pure value nothing follows any more (its only user was pruned with an inner `if false`) is still run: the println of the nested sync function called in the taken arm is printed."
kind = "behavior"
case = "../../../cases/opt/progen/findings/simplify_nested_function_effect_lost.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.split(String.fromCharCode(10)).join('|')
assert(out === '|', `unexpected output: ${JSON.stringify(out)}`)
}
"""
timeout_ms = 8000

