[[tests]]
name = "simplify_crash.default"
desc = "progen finding F23 under [no pass]. A branch arm whose head is a pure value nothing follows any more (dce removed the unused variable's initializer chain) is still run: the JOIN reads the taken arm's string, not a slot never written (which crashed in `len`)."
