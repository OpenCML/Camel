[[tests]]
name = "defun.higher_order.lowered"
desc = "Three functions of one family called through parameters become one enum with three variants and one match on the tag, and two functions of one family called by name become direct calls: no call through a value and no closure is left, the two families of one parameter each get their own enum, and the program prints the same line."
kind = "behavior"
case = "../../../cases/opt/defun/higher_order.cml"
args = ["${case}", "std::defunctionalize", "std::stats", "std::nvm"]
expect_exit = 0
verify_script = """
const lines = input.normalized.stdout.trim().split('\n')
const summary = lines.find((line) => line.startsWith('DEFUNCTIONALIZE types='))
assert(/^DEFUNCTIONALIZE types=2 values=5 calls=4 refused=0$/.test(summary), 'the families: ' + summary)
const families = lines.filter((line) => line.startsWith("DEFUNCTIONALIZE type='"))
assert(families.length === 2, 'one line per family: ' + JSON.stringify(families))
assert(families.some((line) => /type='\(x: int\) => int' variants='__g_\d+__,negate,square' values=4 calls=1/.test(line)), JSON.stringify(families))
assert(families.some((line) => /type='\(x: int, y: int\) => int' variant='__g_\d+__' values=1 calls=3/.test(line)), JSON.stringify(families))
const stats = JSON.parse(lines.find((line) => line.startsWith('GRAPH_STATS ')).replace('GRAPH_STATS ', ''))
// The one call through a value that is left is the shell's call of the entry function: the pass
// writes the values the program wrote, and `defun.fixed_before_opt` pins that the optimizer then
// makes that one direct too.
assert(stats.indirect_calls === 1, 'no call through a program value is left: ' + JSON.stringify(stats))
assert(stats.closures === 0, 'no closure is added: ' + JSON.stringify(stats))
assert(stats.branches === 2, 'one match per family that needs one: ' + JSON.stringify(stats))
assert(lines[lines.length - 1] === 'HIGHER ORDER named=16 lambda=104 pairs=[10, 40, 90] taken=25 other=-5', lines[lines.length - 1])
assert(input.normalized.stderr === '', 'nothing to report: ' + input.normalized.stderr)
"""
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 8000

[[tests]]
name = "defun.captured.lowered"
desc = "A closure is a function value with the values it captured, and it is lowered like any other: the captures become the variant's data and the call through them one match, so a program whose function values are all lowered keeps no closure and no call through a value, and prints the same line."
kind = "behavior"
case = "../../../cases/opt/defun/captured.cml"
args = ["${case}", "std::defunctionalize", "std::stats", "std::nvm"]
expect_exit = 0
verify_script = """
const lines = input.normalized.stdout.trim().split('\n')
const summary = lines.find((line) => line.startsWith('DEFUNCTIONALIZE types='))
assert(/^DEFUNCTIONALIZE types=1 values=2 calls=1 refused=0$/.test(summary), 'the families: ' + summary)
const stats = JSON.parse(lines.find((line) => line.startsWith('GRAPH_STATS ')).replace('GRAPH_STATS ', ''))
assert(stats.closures === 0, 'no closure is left: ' + JSON.stringify(stats))
assert(stats.indirect_calls === 1, 'no call through a program value is left: ' + JSON.stringify(stats))
assert(stats.branches === 1, 'one match for the two variants: ' + JSON.stringify(stats))
assert(lines[lines.length - 1] === 'CAPTURED captured=15 named=6', lines[lines.length - 1])
assert(input.normalized.stderr === '', 'nothing to report: ' + input.normalized.stderr)
"""
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 8000

