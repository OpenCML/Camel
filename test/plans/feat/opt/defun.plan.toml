# The tests below name `std::defunctionalize` to read its own report -- what it lowered, what it
# refused and why. The pass is also a fixed step of the lowering: `std::opt` runs it whether or not
# the program writes it (defun.fixed_before_opt pins that), so a program does not have to know the
# name to get the form, and naming it is still allowed and still works where it is written.

[[tests]]
name = "defun.fixed_before_opt"
desc = "The pass is a fixed step of the lowering and not an optional one: a program that writes only std::opt has its function values lowered before the optimizer runs, so no call through a value is left after it, the inserted step says nothing on the program's own output, and the program prints the same line as without it."
kind = "behavior"
case = "../../../cases/opt/defun/higher_order.cml"
args = ["${case}", "std::opt", "std::stats", "std::nvm"]
expect_exit = 0
verify_script = """
const lines = input.normalized.stdout.trim().split('\n')
assert(!lines.some((line) => line.includes('DEFUNCTIONALIZE')), 'the inserted step reports nothing: ' + input.normalized.stdout)
const stats = JSON.parse(lines.find((line) => line.startsWith('GRAPH_STATS ')).replace('GRAPH_STATS ', ''))
assert(stats.indirect_calls === 0, 'no call through a value is left when the optimizer starts: ' + JSON.stringify(stats))
assert(stats.closures === 0, 'no closure is left: ' + JSON.stringify(stats))
assert(lines[lines.length - 1] === 'HIGHER ORDER named=16 lambda=104 pairs=[10, 40, 90] taken=25 other=-5', lines[lines.length - 1])
assert(input.normalized.stderr === '', 'nothing to report: ' + input.normalized.stderr)
"""
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 15000

[[tests]]
name = "defun.four_backends"
desc = "std::defunctionalize gives every function value one form -- a variant of the enum of its type, with the values it captured -- and turns the calls through them into direct calls, or one match where only the run time knows the tag: four cases print what they print without the pass, on all four backends, and the counts say no call through a value and no closure is left."
kind = "behavior"
tool = "python"
case = "../../../cases/opt/defun/four_backends.py"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["Defunctionalization gives function values one form without changing results: PASS"]
timeout_ms = 120000

