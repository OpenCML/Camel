[[tests]]
name = "defun.native_map.kept"
desc = "A higher-order operator calls what it is given inside the operator (zip and map here), so a function value handed to one is not a call this pass can see: that family is refused as a whole, the closure is still there, the program prints the same line, and the warning names the type and the reason."
kind = "behavior"
case = "../../../cases/opt/defun/native_map.cml"
args = ["${case}", "std::defunctionalize", "std::stats", "std::nvm"]
expect_exit = 0
verify_script = """
const lines = input.normalized.stdout.trim().split('\n')
const summary = lines.find((line) => line.startsWith('DEFUNCTIONALIZE types='))
assert(/^DEFUNCTIONALIZE types=0 values=0 calls=0 refused=1$/.test(summary), 'the families: ' + summary)
const refused = lines.find((line) => line.startsWith('DEFUNCTIONALIZE refused='))
assert(refused === "DEFUNCTIONALIZE refused='(x: int) => int' reason='the value is read by a node that is not a call'", refused)
const stats = JSON.parse(lines.find((line) => line.startsWith('GRAPH_STATS ')).replace('GRAPH_STATS ', ''))
assert(stats.closures === 1, 'the refused family keeps its closure: ' + JSON.stringify(stats))
assert(lines[lines.length - 1] === 'MAP ys=[11, 12, 13] zs=[2, 4, 6] pairs=[(1, 10), (2, 20)]', lines[lines.length - 1])
const warnings = input.normalized.stderr.split('\n').filter((line) => line.includes('DefunctionalizationIncomplete'))
assert(warnings.length === 1, 'one warning: ' + input.normalized.stderr)
assert(warnings[0].includes("Defunctionalization left '(x: int) => int' (the value is read by a node that is not a call) as written."), warnings[0])
assert(warnings[0].endsWith('(name=RuntimeDiag::DefunctionalizationIncomplete, code=0x04100017)'), warnings[0])
"""
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 8000
[[tests]]
name = "defun.value_tag.plain"
desc = "Without the pass the program is what it is: two direct calls and the one call through the function value, no closure, one line."
kind = "behavior"
case = "../../../cases/opt/defun/value_tag.cml"
args = ["${case}", "std::stats", "std::nvm"]
expect_exit = 0
verify_script = """
const lines = input.normalized.stdout.trim().split('\n')
assert(lines.length === 2, 'a statistics line and the program line: ' + input.normalized.stdout)
const stats = JSON.parse(lines[0].replace('GRAPH_STATS ', ''))
