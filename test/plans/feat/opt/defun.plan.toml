[[tests]]
name = "defun.family_shape.by_structure"
desc = "A family is the signatures with the same parameters and result, not the ones that are assignable: `() => void` and `() => int` are two families, and both single-function families are rewritten with nothing refused; before the change the assignability closure put those two results in one family, which then stood for two functions and the pass refused it. `(x: int) => int` and its `pure` spelling stay one family, which `defun.value_tag.tag` pins at `types=1`."
kind = "behavior"
case = "../../../cases/opt/defun/family_shape.cml"
args = ["${case}", "std::defunctionalize", "std::stats", "std::nvm"]
expect_exit = 0
verify_script = """
const lines = input.normalized.stdout.trim().split('\n')
const summary = lines.find((line) => line.startsWith('DEFUNCTIONALIZE types='))
assert(/^DEFUNCTIONALIZE types=2 values=2 calls=1 refused=0$/.test(summary), 'the families: ' + summary)
const families = lines.filter((line) => line.startsWith("DEFUNCTIONALIZE type='"))
assert(families.length === 2, 'one line per family: ' + JSON.stringify(families))
assert(families.some((line) => line.includes("type='() => void' variant='notice' values=1 calls=0")), JSON.stringify(families))
assert(families.some((line) => line.includes("type='(x: int) => int' variant='inc' values=1 calls=1")), JSON.stringify(families))
const stats = JSON.parse(lines.find((line) => line.startsWith('GRAPH_STATS ')).replace('GRAPH_STATS ', ''))
assert(stats.indirect_calls === 1, 'no call through a program value is left: ' + JSON.stringify(stats))
assert(stats.closures === 0, 'no closure is added: ' + JSON.stringify(stats))
assert(lines[lines.length - 1] === 'FAMILY a=42', lines[lines.length - 1])
"""
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 8000

