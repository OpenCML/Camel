[[tests]]
name = "defun.fold_and_dispatch.folded"
desc = "Two calls through the same closure: the one whose callee is the value written in this graph folds (the tag is known, the captures are passed as arguments, no match is built), and the one through the parameter of a family with one variant takes the captures out of the value and calls the function directly. Neither adds a branch, and the program prints the same two numbers."
kind = "behavior"
case = "../../../cases/opt/defun/fold_and_dispatch.cml"
args = ["${case}", "std::defunctionalize", "std::stats", "std::nvm"]
expect_exit = 0
verify_script = """
const lines = input.normalized.stdout.trim().split('\n')
const summary = lines.find((line) => line.startsWith('DEFUNCTIONALIZE types='))
assert(/^DEFUNCTIONALIZE types=1 values=1 calls=2 refused=0$/.test(summary), 'the families: ' + summary)
const families = lines.filter((line) => line.startsWith("DEFUNCTIONALIZE type='"))
assert(families.some((line) => /type='\(x: int\) => int' variant='__g_\d+__' values=1 calls=2/.test(line)), JSON.stringify(families))
const stats = JSON.parse(lines.find((line) => line.startsWith('GRAPH_STATS ')).replace('GRAPH_STATS ', ''))
assert(stats.indirect_calls === 1, 'no call through a program value is left: ' + JSON.stringify(stats))
assert(stats.closures === 0, 'no closure is left: ' + JSON.stringify(stats))
assert(stats.branches === 0, 'nothing to branch on: ' + JSON.stringify(stats))
assert(lines[lines.length - 1] === 'FOLD folded=12 dispatched=12', lines[lines.length - 1])
assert(input.normalized.stderr === '', 'nothing to report: ' + input.normalized.stderr)
"""
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 8000
