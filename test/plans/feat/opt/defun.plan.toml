[[tests]]
name = "defun.value_tag.tag"
desc = "The pass gives the one-valued function type the enum form (one variant, no data) and turns its one call into a direct call: the counts move from 2 direct / 1 indirect to 3 direct / 1 indirect (the one left is the shell's call of the entry function), no closure and no branch is added, and the program prints the same line."
kind = "behavior"
case = "../../../cases/opt/defun/value_tag.cml"
args = ["${case}", "std::defunctionalize", "std::stats", "std::nvm"]
expect_exit = 0
verify_script = """
const lines = input.normalized.stdout.trim().split('\n')
assert(lines.length === 4, 'the pass lines, a statistics line and the program line: ' + JSON.stringify(lines))
assert(lines[0] === 'DEFUNCTIONALIZE types=1 values=2 calls=1 refused=0', lines[0])
assert(lines[1] === "DEFUNCTIONALIZE type='(x: int) => int' variant='inc' values=2 calls=1", lines[1])
const stats = JSON.parse(lines[2].replace('GRAPH_STATS ', ''))
assert(stats.direct_calls === 3, 'direct calls: ' + lines[2])
assert(stats.indirect_calls === 1, 'indirect calls: ' + lines[2])
assert(stats.closures === 0, 'closures: ' + lines[2])
assert(stats.branches === 0, 'no dispatch is built for one variant: ' + lines[2])
assert(lines[3] === 'VALUE TAG a=5 b=11', lines[3])
"""
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 8000

