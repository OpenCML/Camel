[[tests]]
name = "defun.closure_dispatch.lowered"
desc = "A family of three functions, two of which capture a value, becomes one enum with three variants (the captures are their data) and the call through the parameter becomes one match: the tag reads which variant, its arm takes the captures out of the value and calls the function with them as trailing arguments, and the arm of the function that captured nothing passes none. No closure and no call through a value is left, and the program prints the same three numbers."
kind = "behavior"
case = "../../../cases/opt/defun/closure_dispatch.cml"
args = ["${case}", "std::defunctionalize", "std::stats", "std::nvm"]
expect_exit = 0
verify_script = """
const lines = input.normalized.stdout.trim().split('\n')
const summary = lines.find((line) => line.startsWith('DEFUNCTIONALIZE types='))
assert(/^DEFUNCTIONALIZE types=1 values=3 calls=1 refused=0$/.test(summary), 'the families: ' + summary)
const families = lines.filter((line) => line.startsWith("DEFUNCTIONALIZE type='"))
assert(families.length === 1, 'one line per family: ' + JSON.stringify(families))
assert(families.some((line) => /type='\(x: int\) => int' variants='__g_\d+__,__g_\d+__,plus' values=3 calls=1/.test(line)), JSON.stringify(families))
const stats = JSON.parse(lines.find((line) => line.startsWith('GRAPH_STATS ')).replace('GRAPH_STATS ', ''))
assert(stats.indirect_calls === 1, 'no call through a program value is left: ' + JSON.stringify(stats))
assert(stats.closures === 0, 'no closure is left: ' + JSON.stringify(stats))
assert(stats.branches === 1, 'one match, not one per call: ' + JSON.stringify(stats))
assert(lines[lines.length - 1] === 'DISPATCH p=11 q=12 r=30', lines[lines.length - 1])
assert(input.normalized.stderr === '', 'nothing to report: ' + input.normalized.stderr)
"""
normalizers = ["strip_ansi", "normalize_newlines"]
timeout_ms = 8000

