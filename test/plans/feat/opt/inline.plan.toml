[[tests]]
name = "branch_arm_behavior"
desc = "Checks inline rewriting preserves branch-arm behavior when a call result rejoins control flow."
kind = "behavior"
case = "../../../cases/opt/inline/branch_arm_behavior.cml"
args = ["${case}", "std::inline"]
expect_exit = 0
verify_script = """
({ input, assert, match }) => {
    assert(input.exit_code === 0, `camel exited ${input.exit_code}`)
    const found = match(/inline_branch_arm_behavior a=([0-9]+) b=([0-9]+)/, input.normalized.stdout)
    assert(Number(found[1]) === 10, `expected a=10, got ${found[1]}`)
    assert(Number(found[2]) === 104, `expected b=104, got ${found[2]}`)
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

