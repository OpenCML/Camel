[[tests]]
name = "arm_call_then_effect.inline.nvm"
desc = "A call followed by an effect inside a branch arm (a sync callee inlined into the arm) is not compiled as a tail call: the effect after it still runs, and the tail recursion inside the callee stays a tail call. Under: std::inline on NodeVM (the println after the call was skipped)."
kind = "behavior"
case = "../../../cases/opt/inline/arm_call_then_effect.cml"
args = ["${case}", "std::inline", "std::nvm"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim().split(String.fromCharCode(10)).join(' | ')
assert(out === 'start | saved | arm_call_then_effect r=50000', `unexpected output: ${out}`)
}
"""
timeout_ms = 10000

