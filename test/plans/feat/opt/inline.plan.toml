[[tests]]
name = "arm_call_then_effect.inline.tf"
desc = "The recursion of timed stays a tail call when std::inline has unrolled timed into itself: the call then feeds an inner JOIN of nested branches in tail position, and the parallel scheduler took it for an ordinary call (50000 levels: segmentation fault). The println after the call of timed in measure still runs. Under: std::inline on Taskflow."
kind = "behavior"
case = "../../../cases/opt/inline/arm_call_then_effect.cml"
args = ["${case}", "std::inline", "std::tf"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim().split(String.fromCharCode(10)).join(' | ')
assert(out === 'start | saved | arm_call_then_effect r=50000', `unexpected output: ${out}`)
}
"""
timeout_ms = 10000

