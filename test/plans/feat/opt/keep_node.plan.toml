id = "opt.keep_node"
order = 337
tier = "fast"
tags = ["feat", "opt", "effects", "keep"]
desc = "`:op/keep` where a keeper is due and where none is: a test-only pass builds both shapes at the graph level, and the run says whether the kept node still runs"

# Design principles 3.3 and 9.7: a pass that removes the last use of a node whose running is
# observed leaves a keeper on data -- `:op/keep(x, v)` gives `v`, and `x` stays read through a data
# edge. `std::opt` writes that node on its own today; what this plan adds is the read either side of
# the count, which a running pipeline cannot give -- where a keeper is due and the kept node still
# runs (`.run`), and where none is due and none appears (`.pure`).
#
#   keep_node_shape.reference  the program as written: `side` prints, then `2`
#   keep_node_shape.gir        `:op/keep` is in the graph the pass returns
#   keep_node_shape.run        KEEPNODE keep=1 reads_the_divisor=1, and the division still runs:
#                              the program faults on it, which it can only do through the keeper
#   keep_node_shape.pure       the counter-case: where no keeper may appear, none does, and the
#                              program prints what it printed without any pass
#
# The reading with the insertion switched off, measured by hand (opt/generic/rewrite.cpp,
# keepThroughValue returning `value` on entry): `KEEPNODE keep=0 reads_the_divisor=0`. The
# counter-case has one of its own: with the "it is the node's last reader" test in
# `lastReadsGoingOut` relaxed, `keep_shared` reads 1 and the pass dies on a keeper with no reader
# and no place in the chain.

[defaults]
kind = "behavior"
backends = ["nvm"]
backends_agree = []
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "keep_node_shape.reference"
desc = "No pass: the call prints `side`, the value the branch of the program prints is `2`."
case = "../../../cases/opt/effects/keep_node_shape.cml"
args = ["${case}", "${backend}"]
expect_exit = 0
expect_stdout_exact = "side\n2\n"

[[tests]]
name = "keep_node_shape.gir"
desc = "The graph the pass returns holds `:op/keep`, and the print reads the value it gives back."
case = "../../../cases/opt/effects/keep_node_shape.cml"
args = ["${case}", "test::keep_node", "std::gir"]
expect_exit = 0
expect_stdout_contains = [":op/keep", "KEEPNODE keep=1 reads_the_divisor=1 printed=1"]

[[tests]]
name = "keep_node_shape.run"
desc = "The division by zero is still run: it is read by the keeper, and the print reads what the keeper gives."
case = "../../../cases/opt/effects/keep_node_shape.cml"
args = ["${case}", "test::keep_node", "${backend}"]
expect_exit = 1
expect_stdout_contains = ["KEEPNODE keep=1 reads_the_divisor=1 printed=1"]
expect_stderr_contains = ["DivisionByZero"]

# The other side of the same question: a keeper is not inserted for every removal. Two shapes that
# must stay at `keep=0` -- a node that reads nothing whose running is observed, and a node whose
# observed source is still read by someone else after the removal. The second one is the one a
# relaxed condition would break: drop the "it is the node's last reader" test from
# `lastReadsGoingOut` and it reads `keep_shared=1` here while the program still prints the same,
# which is exactly why the reading, and not the program's output, is what the plan asserts.
[[tests]]
name = "keep_node_shape.pure"
desc = "Counter-case: nothing observed to keep, and an observed source that still has another reader. No keeper is inserted, and the program's output is the reference's, byte for byte."
case = "../../../cases/opt/effects/keep_node_shape.cml"
args = ["${case}", "test::keep_node_pure", "${backend}"]
expect_exit = 0
expect_stdout_exact = "KEEPNODE_PURE keep_pure=0 keep_shared=0\nside\n2\n"
