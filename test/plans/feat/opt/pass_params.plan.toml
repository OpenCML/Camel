args = ["${case}", "std::opt safe_fp=3", "std::fvm"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ParamArgumentWrongType"
expect_diagnostic_line = 1
expect_diagnostic_column = 10
expect_output_contains = ["The argument 'safe_fp' of 'std::opt' has type 'int', not 'bool'."]

[[tests]]
name = "error.missing_value"
