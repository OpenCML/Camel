id = "opt.pass_params"
order = 331
tier = "fast"
tags = ["feat", "opt", "pipeline", "pass-parameters"]

# Pass parameters are the `with` parameters of the pass declaration (design principles 9.3):
# `name key=value ...`, the values constant expressions, checked against the declaration in
# stdlib/std.cml before anything runs.

[defaults]
kind = "behavior"
case = "../../../cases/opt/pass_params/plain.cml"
timeout_ms = 20000
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]

[[tests]]
name = "valid.opt"
desc = "A parameter of the core's own pass, written as a literal; no special code in the pipeline."
args = ["${case}", "std::opt safe_fp=true", "std::fvm"]
expect_exit = 0
expect_stdout_starts_with = "camel-ran-marker\n"

[[tests]]
name = "valid.constant_expression"
desc = "The value is a Camel constant expression: operators and negation."
args = ["${case}", "std::opt safe_fp=!false growth_budget=2*8", "std::fvm"]
expect_exit = 0
expect_stdout_starts_with = "camel-ran-marker\n"

[[tests]]
name = "valid.passes_option"
desc = "--passes splits at the commas outside the parameters."
args = ["${case}", "--passes", "std::opt safe_fp=false,std::fvm stats=\"\""]
expect_exit = 0
expect_stdout_starts_with = "camel-ran-marker\n"

[[tests]]
name = "valid.scheduler_parameters"
desc = "Parameters of the schedulers (they were environment variables)."
args = ["${case}", "std::jit hot_threshold=0"]
expect_exit = 0
expect_stdout_starts_with = "camel-ran-marker\n"

[[tests]]
name = "valid.taskflow_parameters"
desc = "Parameters of std::tf, with an int where an int is declared."
args = ["${case}", "std::tf bytecode=false gc_stats=0 linear=true"]
expect_exit = 0
expect_stdout_starts_with = "camel-ran-marker\n"

[[tests]]
name = "string.word_as_written"
desc = "The declared type decides how a value is read, not its text (design principles 9.3): `onnx::export` declares `out: string`, so the word is taken as written even though it is no constant expression, and the model is written to the path the word names."
case = "../../../cases/modules/onnx/entry/forward.cml"
args = ["${case}", "std::macro", "std::opt", "onnx::export out=${test_tmp}/word_as_written.onnx"]
expect_exit = 0
expect_stdout_contains = ["onnx::export: wrote ${test_tmp}/word_as_written.onnx"]
verify_script = """
async ({ input, assert }) => {
const fs = await import('fs')
const path = await import('path')
const written = path.join(input.test_tmp, 'word_as_written.onnx')
assert(fs.existsSync(written), `no model at the path the word names: ${written}`)
assert(fs.statSync(written).size > 0, 'the model file is empty')
const models = fs.readdirSync(input.test_tmp).filter((name) => name.endsWith('.onnx'))
assert(models.length === 1, `one model expected, got ${models}`)
assert(models[0] === 'word_as_written.onnx', `the name is not the word as written: ${models[0]}`)
}
"""

[[tests]]
name = "string.quoted_value_with_a_space"
desc = "A value with a space is quoted, and a string parameter takes the quoted value whole: the file is named with the space in it, so neither the quotes nor the space split the word."
case = "../../../cases/modules/onnx/entry/forward.cml"
args = ["${case}", "std::macro", "std::opt", 'onnx::export out="${test_tmp}/a b.onnx"']
expect_exit = 0
expect_stdout_contains = ["onnx::export: wrote ${test_tmp}/a b.onnx"]
verify_script = """
async ({ input, assert }) => {
const fs = await import('fs')
const path = await import('path')
const written = path.join(input.test_tmp, 'a b.onnx')
assert(fs.existsSync(written), `no model at the quoted value: ${written}`)
assert(fs.statSync(written).size > 0, 'the model file is empty')
}
"""

[[tests]]
name = "error.unknown_parameter"
desc = "An unknown parameter is a semantic diagnostic at the call, on the pass's own line; nothing runs."
args = ["${case}", "std::fvm", "std::opt safe_fpp=true"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ParamArgumentUnknown"
expect_diagnostic_line = 2
expect_diagnostic_column = 10
expect_output_contains = ["'safe_fpp' is not a parameter of 'std::opt'", "<pipeline>:2:10"]
expect_output_not_contains = ["camel-ran-marker"]

[[tests]]
name = "error.wrong_type"
