expect_output_not_contains = ["camel-ran-marker"]

[[tests]]
name = "declaration.every_parameter_by_name"
desc = "The guard that a declaration and a call agree: the test pass declares five parameters and this call writes every one of them as key=value words, so a parameter the call cannot accept shows up as a refusal rather than at pass execution. `declared=5` pins the count of the declaration."
args = ["${case}", "test::params flag=true n=1 ratio=2.5 label=\"all\" count=9", "std::nvm"]
expect_exit = 0
expect_output_contains = ["test::params flag=true (given) n=1 (given) ratio=2.5 (given) label=all (given) count=9 (given) declared=5", "camel-ran-marker"]
expect_output_not_contains = ["(default)"]

[[tests]]
name = "default.folded_constants"
desc = "A default is a constant expression evaluated where the declaration is, so the default `2 + 3` reads 5 and the defaults are the same in both calls. Every default lives in one place: the declaration."
args = ["${case}", "test::params flag=true", "test::params flag=true", "std::nvm"]
expect_exit = 0
verify_script = """
const lines = input.normalized.stdout.split('\n').filter((l) => l.startsWith('test::params'))
assert(lines.length === 2, 'two calls print two lines, got ' + lines.length)
for (const line of lines) {
    assert(line.includes('n=5 (default)'), 'the default expression is evaluated: ' + line)
    assert(line.includes('ratio=1.5 (default)'), 'the float default: ' + line)
    assert(line.includes('label=x (default)'), 'the string default: ' + line)
    assert(line.includes('declared=5'), 'the declaration keeps its five parameters: ' + line)
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]

