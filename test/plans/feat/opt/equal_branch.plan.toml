[[tests]]
name = "equal_branch.known_gradient"
case = "../../../cases/modules/autodiff/collapse.cml"
args = ["${case}","std::macro","std::opt","std::jgir"]
verify_script = '''
({ input, assert }) => {
 const g = JSON.parse(input.normalized.stdout).graphs.find(g => g.name === 'main')
 assert(!g.nodes.some(n => [':op/mul_d', ':op/add_d', ':str/format'].includes(n.label)), 'known gradient did not fold')
 assert(g.nodes.some(n => n.label === 'sys:get_env') && g.nodes.some(n => n.kind === 'JOIN'), 'condition lost')
}
'''

[[tests]]
name = "equal_branch.reference.left"
case = "../../../cases/opt/generic/equal_branch_values.cml"
args = ["${case}","${backend}"]
envs = ["CAMEL_EQUAL_BRANCH="]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["stdout_normalized"]
verify_script = '''
({ input, assert }) => {
 assert(input.normalized.stdout.trim() === "left\n4.0\n4.0\n0.0", input.normalized.stdout)
}
'''

