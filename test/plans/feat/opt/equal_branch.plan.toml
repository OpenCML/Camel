id = "opt.equal_branch"
order = 326
tier = "fast"
tags = ["feat","opt","fold","branch"]

[defaults]
kind = "behavior"
expect_exit = 0
timeout_ms = 8000
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]

[[tests]]
name = "equal_branch.graph.inline"
case = "../../../cases/opt/generic/equal_branch_values.cml"
args = ["${case}","std::inline","std::jgir"]
verify_script = '''
({ input, assert }) => {
 const g = JSON.parse(input.normalized.stdout).graphs.find(g => g.name === 'main')
 const count = label => g.nodes.filter(n => n.label === label).length
 assert(count(':op/mul_d') === 3, 'wrong remaining scalar arithmetic')
 assert(count('JOIN') === 3 && count('BRCH') === 3, 'branch structure lost')
 assert(count('sys:get_env') === 1, 'runtime condition lost')
}
'''

