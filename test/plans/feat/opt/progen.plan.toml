id = "opt.progen"
order = 322
tier = "milestone"
tags = ["feat", "opt", "progen", "differential"]

[[tests]]
name = "progen_check"
desc = "Random programs with a reference output computed outside the compiler (test/tools/progen): a fixed batch of seeds over integer, float, bool and string arithmetic, arrays, tuples, structs, let and var (written through var parameters and captures), if and match, functions, bounded recursion, closures, higher-order functions, map / filter / reduce / foreach / zip / range, sync blocks with println, and wait. Each program runs without passes and under every cell of the cross matrix (25 rewrite sequences on the node VM; no rewrite, std::cxx::inline, std::opt, std::opt and std::macro std::opt also on the bytecode VM, the JIT and the parallel scheduler) and every run must print exactly the reference output or decline with a located diagnostic of a pass. The batch holds only seeds whose every cell passes today; the seeds left out and the defects they show are recorded in test/cases/opt/progen/README.md and in CHECK_EXCLUDED of progen.py."
kind = "behavior"
tool = "python"
case = "../../../tools/progen/progen.py"
# `${camel}` is the compiler of the build under test, named before the subcommand.
args = ["${case}", "--camel", "${camel}", "check"]
expect_exit = 0
expect_stdout_contains = ["0 wrong", "PASS"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
# The work is fixed (25 programs x 41 pipelines = 1,025 cells, each one a compiler run), so what
# bounds it is its own CPU time, and `timeout_ms` below is the liveness bound only -- the reading
# the rule asks for, and the one the resnet referees of
# feat/modules/autodiff and the entries of perf/step_budget state. Measured on the 32-core host
# of this project, the plan alone under camel-remote -Jobs 8:
#
#   86560 ms of CPU / 91858 ms wall  (the first window in which every cell ran)
#   82180 ms of CPU / 51220 ms wall  (the run that turned this entry green)
#   83670 ms of CPU / 42820 ms wall  (the measurement in force: every cell reaches
#                                     the compiler again, 223 of them by failing)
#
# The budget is 150000 ms and is not re-derived from the newest reading: it keeps the margin the
# slower 2026-10-24 reading set (150000 / 86560 = 1.73x), the headroom those referees took, which
# is what the budget states instead of the runner's 4x margin (300000 / 86560 = 3.47x, the reading
# before the cells began to run). The 2026-10-27 measurement leaves that budget at
# 150000 / 83670 = 1.79x.
cpu_budget_ms = 150000
timeout_ms = 300000

# Seed 4 of `generate.VERSION` 8, run on its own, and a fast reading of the seed the optimizer broke
# last. It was the seed the batch left out and the entry carried `known_fail = true`; both are gone
# because the crash is. `progen_4` of the E9 differential went from crash 1 to crash 0,
# and `test/cases/opt/inline/loop_wait_after_inline.cml` is its 25-line reduction: the four `inline`
# cells (inline@nvm, @fvm, @jit, @prl) died of SIGSEGV because `addSpliceOrderEdges` writes the wait
# of the statement a call was written after onto the nodes of the spliced body that own a region, and
# `computeExecutionOrder` laid that predecessor between the body's range and the `LOOP`, which
# `buildLoopTables` requires to be one range. `CHECK_EXCLUDED` in test/tools/progen/progen.py is
# empty now, so the seed is back in `progen_check` as well; this entry stays because the batch is the
# milestone layer and the seed the optimizer broke last is worth four seconds on every merge.
#
# The seed number alone does not name a program: `generate.VERSION` 7 -> 8 ("existing
# seeds are other programs") re-pointed every seed at another program. Any entry that records a seed
# records the generator version with it, or it names a program the next version will not generate.
[[tests]]
name = "progen_seed_4"
desc = "Seed 4 of `generate.VERSION` 8 through the cross matrix, alone: 41 cells (25 rewrite sequences on the node VM, and no rewrite, std::cxx::inline, std::opt, std::opt and std::macro std::opt on the three other schedulers) all print the reference output. The four `inline` cells used to end in SIGSEGV; a later fix closed it, and `test/cases/opt/inline/loop_wait_after_inline.cml` is the 25-line reduction of the shape (`f8(...)` inside `let n69 = concat(...)` of `main`, whose spliced body owns a loop carrying the wait of the statement the call was written after). A red here is that crash returning: the entry reads `0 wrong` and `PASS`, and the program is `progen.py show --seed 4`."
kind = "behavior"
# A reading on every run, not only when someone runs the milestone layer: measured at 5.4 s on
# 2026-11-15, so it is in the fast layer while the batch it belongs to stays in the milestone one.
tier = "fast"
tool = "python"
case = "../../../tools/progen/progen.py"
args = ["${case}", "--camel", "${camel}", "check", "--seeds", "4"]
expect_exit = 0
expect_stdout_contains = ["0 wrong", "PASS"]
expect_output_not_contains = ["FAIL", "CRASH"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 300000

[[tests]]
name = "progen_fixed"
desc = "The archived progen findings that are recorded as fixed (test/cases/opt/progen/findings.json, key `fixed`): reduced programs on which std::cxx::inline, std::opt or a pass after them ran code of a branch arm that is not taken, dropped or reordered an effect of a sync block, produced a wrong value, or crashed. Each runs under the rewrite sequence it was found with and under std::cxx::inline, std::opt, std::cxx::inline std::cxx::dce, std::opt and std::cxx::specialize, on the node VM, the bytecode VM, the JIT and the parallel scheduler, and every run must print exactly the output the generator's reference evaluator computed."
kind = "behavior"
tool = "python"
case = "../../../tools/progen/progen.py"
args = ["${case}", "--camel", "${camel}", "fixed"]
expect_exit = 0
expect_stdout_contains = ["0 wrong", "PASS"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 300000
