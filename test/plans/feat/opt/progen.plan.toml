id = "opt.progen"
order = 322
tier = "milestone"
tags = ["feat", "opt", "progen", "differential"]

[[tests]]
name = "progen_check"
desc = "Random programs with a reference output computed outside the compiler (test/tools/progen): a fixed batch of seeds over integer, float, bool and string arithmetic, arrays, tuples, structs, let and var (written through var parameters and captures), if and match, functions, bounded recursion, closures, higher-order functions, map / filter / reduce / foreach / zip / range, sync blocks with println, and wait. Each program runs without passes and under every cell of the cross matrix (25 rewrite sequences on the node VM; no rewrite, std::opt::inline, std::opt, std::opt and std::macro std::opt also on the bytecode VM, the JIT and the parallel scheduler) and every run must print exactly the reference output or decline with a located diagnostic of a pass. The batch holds only seeds whose every cell passes today; the seeds left out and the defects they show are recorded in test/cases/opt/progen/README.md and in CHECK_EXCLUDED of progen.py."
kind = "behavior"
tool = "python"
case = "../../../tools/progen/progen.py"
# `${camel}` is the compiler of the build under test, named before the subcommand.
args = ["${case}", "--camel", "${camel}", "check"]
expect_exit = 0
expect_stdout_contains = ["0 wrong", "PASS"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
# The work is fixed (25 programs x 41 pipelines = 1,025 cells, each one a compiler run), so what
# bounds it is its own CPU time, and `timeout_ms` below is the liveness bound only -- the reading
# the rule asks for, and the one the resnet referees of
# feat/modules/autodiff and the entries of perf/step_budget state. Measured on the 32-core host
# of this project, the plan alone under camel-remote -Jobs 8:
#
#   86560 ms of CPU / 91858 ms wall  (2026-10-24, the first window in which every cell ran)
#   82180 ms of CPU / 51220 ms wall  (2026-10-24, the run that turned this entry green)
#   83670 ms of CPU / 42820 ms wall  (2026-10-27, the measurement in force: every cell reaches
#                                     the compiler again, 223 of them by failing)
#
# The budget is 150000 ms and is not re-derived from the newest reading: it keeps the margin the
# slower 2026-10-24 reading set (150000 / 86560 = 1.73x), the headroom those referees took, which
# is what the budget states instead of the runner's 4x margin (300000 / 86560 = 3.47x, the reading
# before the cells began to run). The 2026-10-27 measurement leaves that budget at
# 150000 / 83670 = 1.79x.
cpu_budget_ms = 150000
timeout_ms = 300000

# The seed the batch above leaves out, run on its own. `progen_check` holds only seeds whose every
# cell passes, so the one seed that does not pass is left out of it -- see CHECK_EXCLUDED in
# test/tools/progen/progen.py for why, and `progen.py show --seed 4` for the program. Left out is
# not absent: this entry runs the same check over that seed alone, with `--with-excluded`, so every
# run of this plan prints what it shows, and it is marked `known_fail` so that the reading is a
# reading and not a decision the gate takes. When the crash goes away this entry passes and the
# marker turns red until it is removed, and if the seed starts failing differently the marker turns
# red the same way, because the mark pins its sentence.
[[tests]]
name = "progen_known_crash"
desc = "The one seed the batch of progen_check leaves out (seed 4 of generate.VERSION 8), run through the same cross matrix on its own: the four cells of the pipeline `inline` (inline@nvm, inline@fvm, inline@jit, inline@prl) end in SIGSEGV while the same program runs under the other pipelines, so this is a crash of std::opt::inline and not a refusal of the front end. The expression that reaches it is the call `f8(...)` inside `let n69 = concat(...)` of `main`; neither `f8` alone nor either of its ingredients (a `for` loop over structs compared with the user `operator <`, and that operator on two struct literals) crashes on its own. Reproduction: `progen.py check --seeds 4 --with-excluded`, and `progen.py show --seed 4` for the program. The owner of that pass makes this entry green; until then it is the visible form of the seed the batch cannot hold."
kind = "behavior"
# A reading on every run, not only when someone runs the milestone layer: this entry costs four
# compiler runs, so it is in the fast layer while the batch it belongs to stays in the milestone
# one.
tier = "fast"
tool = "python"
case = "../../../tools/progen/progen.py"
args = ["${case}", "--camel", "${camel}", "check", "--seeds", "4", "--with-excluded"]
expect_exit = 0
expect_stdout_contains = ["0 wrong", "PASS"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
# Every run prints `seed 4 [inline@nvm]: CRASH: exit code -11;` and the summary, so a reader of the
# gate sees the defect on every run instead of an absent seed.
known_fail = true
known_fail_owner = "the pass owner of std::opt::inline"
known_fail_reason = "`std::opt::inline` ends in SIGSEGV on the `f8(...)` call of seed 4's `main` (CHECK_EXCLUDED in test/tools/progen/progen.py keeps the seed out of the batch for the same crash)"
known_fail_msg = "seed 4 [inline@nvm]: CRASH"
# Printed beside the mark on every run, so the reading does not depend on opening the log.
known_fail_note = "known crash: seed 4 under std::opt::inline (inline@nvm, @fvm, @jit and @prl end in SIGSEGV); the other pipelines of the same program agree with the reference, so this is a crash of that pass and not a refusal of the front end, and no seed of this shape is missing from the batch -- it is this one, named."
timeout_ms = 300000

[[tests]]
name = "progen_fixed"
desc = "The archived progen findings that are recorded as fixed (test/cases/opt/progen/findings.json, key `fixed`): reduced programs on which std::opt::inline, std::opt or a pass after them ran code of a branch arm that is not taken, dropped or reordered an effect of a sync block, produced a wrong value, or crashed. Each runs under the rewrite sequence it was found with and under std::opt::inline, std::opt, std::opt::inline std::opt::dce, std::opt and std::opt::specialize, on the node VM, the bytecode VM, the JIT and the parallel scheduler, and every run must print exactly the output the generator's reference evaluator computed."
kind = "behavior"
tool = "python"
case = "../../../tools/progen/progen.py"
args = ["${case}", "--camel", "${camel}", "fixed"]
expect_exit = 0
expect_stdout_contains = ["0 wrong", "PASS"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 300000
