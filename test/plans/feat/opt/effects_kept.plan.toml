# A GATE at the head of a `sync` block's chain holds a place even though nothing waits on it from
# the front: the statement after it is written after it. `cseDraft`'s constant merge asked a gate
# only whether it waits on something, so a gate at the head of a chain looked like a plain value and
# was merged into the constant it forwards -- both compute one value. That put a value where a
# statement stood, and the print after it kept a control wait only, which orders and does not run
# (design principles 3.1, 5.7; docs/design/effects/edges.cn.md 1.5, 4.6). The case prints the two
# positions of the dropped statement side by side, and both runs are held to the same four lines:
# without the fix the optimizer answers two of them.

[[tests]]
name = "dropped_value_statement.keeps_its_prints.without_the_pass"
desc = "No pass: the two dropped-value statements and the two prints after them, all four lines."
case = "../../../cases/compile/surface/dropped_value_statement.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "stmt_name\nstmt_bound_name\n3\ndone\n"

[[tests]]
name = "dropped_value_statement.keeps_its_prints.opt"
desc = "The whole optimizer: the same four lines. Without the place a chain gate holds, `std::opt` answers only the last two."
case = "../../../cases/compile/surface/dropped_value_statement.cml"
args = ["${case}", "std::opt", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "stmt_name\nstmt_bound_name\n3\ndone\n"
