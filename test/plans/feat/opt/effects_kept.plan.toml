id = "opt.effects_kept"
order = 335
tier = "fast"
tags = ["feat", "opt", "effects", "inline", "dce", "fold"]
desc = "A pass never changes which effects run: an effect inside a statement, in an argument the callee never reads, and outside a branch whose other arm is taken"

# The effects a program has are decided by the program, not by a pass (design principles 9.7): what
# the program's statements, arguments and branch arms read, runs -- on every back end, and through
# the whole optimizer as well as through the one pass that used to drop it.
#
#   dce_effect_under_pure_arithmetic  the effect inside a statement stays when the statement's value
#                                     is unread (3.4)
#   inline_argument_effect            an argument's effect stays when the callee never reads the
#                                     parameter (3.4)
#   fold_keeps_arm_effect             a value the dropped arm read from outside keeps running: the
#                                     branch is used as a whole (3.1)
#   branch_keeps_outer_effect         the same, with the branch's value read by an arithmetic whose
#                                     other operand is an effect
#
# Each entry compares the pass against the same program with no pass at all, on all four back ends.

[defaults]
kind = "behavior"
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "dce_effect_under_pure_arithmetic.reference"
desc = "No pass: the statement of the `sync` block prints `5`, and the function returns 7."
case = "../../../cases/opt/effects/dce_effect_under_pure_arithmetic.cml"
args = ["${case}", "${backend}"]
expect_exit = 7
expect_stdout_exact = "5\n"

[[tests]]
name = "dce_effect_under_pure_arithmetic.dce"
desc = "`std::opt::dce` drops the unread subtraction: the print it holds stays."
case = "../../../cases/opt/effects/dce_effect_under_pure_arithmetic.cml"
args = ["${case}", "std::opt::dce", "${backend}"]
expect_exit = 7
expect_stdout_exact = "5\n"

[[tests]]
name = "dce_effect_under_pure_arithmetic.opt"
desc = "The same program through the whole optimizer."
case = "../../../cases/opt/effects/dce_effect_under_pure_arithmetic.cml"
args = ["${case}", "std::opt", "${backend}"]
expect_exit = 7
expect_stdout_exact = "5\n"

[[tests]]
name = "inline_argument_effect.reference"
desc = "No pass: `first` returns the 5 it reads, and the argument's `9` is printed before it."
case = "../../../cases/opt/effects/inline_argument_effect.cml"
args = ["${case}", "${backend}"]
expect_exit = 5
expect_stdout_exact = "9\n"

[[tests]]
name = "inline_argument_effect.inline"
desc = "`std::opt::inline` binds no use to the parameter the callee never reads; the argument's effect stays."
case = "../../../cases/opt/effects/inline_argument_effect.cml"
args = ["${case}", "std::opt::inline", "${backend}"]
expect_exit = 5
expect_stdout_exact = "9\n"

[[tests]]
name = "inline_argument_effect.opt"
desc = "The same program through the whole optimizer."
case = "../../../cases/opt/effects/inline_argument_effect.cml"
args = ["${case}", "std::opt", "${backend}"]
expect_exit = 5
expect_stdout_exact = "9\n"

[[tests]]
name = "fold_keeps_arm_effect.reference"
desc = "No pass: `println(1)` runs because the branch uses it as a whole, then the taken arm prints `2`."
case = "../../../cases/opt/effects/fold_keeps_arm_effect.cml"
args = ["${case}", "${backend}"]
expect_exit = 0
expect_stdout_exact = "1\n2\n1\n"

[[tests]]
name = "fold_keeps_arm_effect.fold_after_inline"
desc = "Inlining makes the condition constant and the fold takes the other arm; the print the dropped arm read stays."
case = "../../../cases/opt/effects/fold_keeps_arm_effect.cml"
args = ["${case}", "std::opt::inline", "std::opt::fold", "${backend}"]
expect_exit = 0
expect_stdout_exact = "1\n2\n1\n"

[[tests]]
name = "fold_keeps_arm_effect.opt"
desc = "The same program through the whole optimizer."
case = "../../../cases/opt/effects/fold_keeps_arm_effect.cml"
args = ["${case}", "std::opt", "${backend}"]
expect_exit = 0
expect_stdout_exact = "1\n2\n1\n"

[[tests]]
name = "branch_keeps_outer_effect.reference"
desc = "No pass: both calls print `1` before the `3` written after the branch."
case = "../../../cases/opt/effects/branch_keeps_outer_effect.cml"
args = ["${case}", "${backend}"]
expect_exit = 0
expect_stdout_exact = "1\n3\n4\n1\n3\n3\n"

[[tests]]
name = "branch_keeps_outer_effect.fold_after_inline"
desc = "The second call's condition is constant after inlining; the effect the dropped arm read still runs."
case = "../../../cases/opt/effects/branch_keeps_outer_effect.cml"
args = ["${case}", "std::opt::inline", "std::opt::fold", "${backend}"]
expect_exit = 0
expect_stdout_exact = "1\n3\n4\n1\n3\n3\n"

[[tests]]
name = "branch_keeps_outer_effect.opt"
desc = "The same program through the whole optimizer."
case = "../../../cases/opt/effects/branch_keeps_outer_effect.cml"
args = ["${case}", "std::opt", "${backend}"]
expect_exit = 0
expect_stdout_exact = "1\n3\n4\n1\n3\n3\n"

# The assertion the rest of this plan cannot make: the output itself. Every entry above compares a
# pass against the same program with no pass, on four back ends -- but each of them names the bytes it
# expects, so an effect that goes missing shows up as a wrong line. A program whose effect is left in
# no chain of its graph has no wrong line to show: it exits 0, its diagnostics are empty, and the
# lines it no longer prints are simply not there. `nn.mnist` did exactly that -- `std::opt` dropped
# `Iteration 0` -- and no plan noticed, because `nn.mnist` is run with `std::null` and compared with
# nothing.
#
# So this one compares the two runs with each other instead of with a golden: same binary, same host,
# so the numbers cancel out and the check stays true whatever the floats print as. It is a `tool =
# "node"` test because a plan entry runs one command with one `expect_stdout_*`; comparing two runs
# byte for byte and naming the line that went missing needs both in one process (see
# `cases/opt/effects/opt_matches_interpreter/check.mjs`).
[[tests]]
name = "opt_matches_interpreter.mnist"
desc = "`std::opt` prints what the interpreter prints, byte for byte, on `nn.mnist` -- the program where a dissolved branch left its `:io/println` in no chain and the pass silently lost output."
kind = "behavior"
tool = "node"
# One backend, because the check runs the interpreter and the optimizer itself and compares them: the
# `${backend}` of the other entries would only make it repeat that comparison four times.
backends = ["nvm"]
case = "../../../cases/opt/effects/opt_matches_interpreter/check.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["[EFFECTS] ok std::opt std::nvm", "[EFFECTS] ok the optimizer prints what the interpreter prints"]
expect_output_not_contains = ["[EFFECTS] RED", "[EFFECTS]   lost:"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 120000

# The fold runs the program it was handed. `fold_keeps_inner_fault` is the case where the value the
# fold takes the last read of may fault: `1 / z > 0` is the condition of the inner branch, the fold
# prunes the branch above it and nothing reads the comparison any more, so the division is the last
# read this removal takes. It may fault, so it must still run, and it does: the fault is reported and
# the program exits 1 instead of printing the arm's 4.
#
# The keeper is not a `GATE` here. A gate stands in a value that somebody reads; after the fold
# nothing reads the folded comparison, and a gate with no value reader and no sync user cannot end a
# sync edge (src/runtime/graph_edges.cpp, `canEndSyncEdge`), so `keepThroughValue` cannot build one
# and the code that took the branch's place waits on the division itself. That wait is the control
# edge the residue of a pruned branch leaves, which is also why the control edge is still there.
[[tests]]
name = "fold_keeps_inner_fault.reference"
desc = "No pass: the division runs and the program stops with the fault, not with the arm's value."
case = "../../../cases/opt/effects/fold_keeps_inner_fault.cml"
args = ["${case}", "${backend}"]
kind = "negative"
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::DivisionByZero"

[[tests]]
name = "fold_keeps_inner_fault.fold"
desc = "`std::opt::fold`: the fault still happens after the branch above it is pruned."
case = "../../../cases/opt/effects/fold_keeps_inner_fault.cml"
args = ["${case}", "std::opt::fold", "${backend}"]
kind = "negative"
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::DivisionByZero"

[[tests]]
name = "fold_keeps_inner_fault.opt"
desc = "The same program through the whole optimizer: the fault is not dropped."
case = "../../../cases/opt/effects/fold_keeps_inner_fault.cml"
args = ["${case}", "std::opt", "${backend}"]
kind = "negative"
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::DivisionByZero"

# The fold's own drawing and run of the branch it prunes: `fold_leaves_no_control_edge` is the
# program of R1's second half, and it pins what the fold still does to it -- the two prints run, the
# arm that is not taken never does, and the value is the taken arm's. The residue that this lane sets
# out to remove is not removed: taking the control edge away from the pruned branch's structure takes
# the division's last read with it (measured: the program prints `4` and exits 4 instead of faulting),
# because the keeper that should stand in its place cannot be built. The two readings of the removed
# edge -- no `CTRL` in the drawing, none of the inner three nodes in the run -- are written down here
# rather than asserted.
[[tests]]
name = "fold_leaves_no_control_edge.reference"
desc = "No pass: the two prints of the source run, and the program returns the second one's value."
case = "../../../cases/opt/effects/fold_leaves_no_control_edge.cml"
args = ["${case}", "${backend}"]
expect_exit = 8
expect_stdout_exact = "8\n8\n"

[[tests]]
name = "fold_leaves_no_control_edge.fold"
desc = "`std::opt::fold` takes the same two prints on every back end."
case = "../../../cases/opt/effects/fold_leaves_no_control_edge.cml"
args = ["${case}", "std::opt::fold", "${backend}"]
expect_exit = 8
expect_stdout_exact = "8\n8\n"

[[tests]]
name = "fold_leaves_no_control_edge.opt"
desc = "The same program through the whole optimizer."
case = "../../../cases/opt/effects/fold_leaves_no_control_edge.cml"
args = ["${case}", "std::opt", "${backend}"]
expect_exit = 8
expect_stdout_exact = "8\n8\n"

# "Is an operator the passes write still reachable?" is a number pinned by name: `:enum/tag` and
# `:enum/field` over `test/cases/opt/defun`, and `:enum/make` pinned to zero, with the writer it
# would have. A case whose effects the statement chain already reaches needs no redundant keeper;
# that is not the same as losing an effect credential. One more case means a rule started writing
# the operator, one fewer means a rule stopped. The denominator is the whole corpus and may grow;
# the finding is what may not move.
#
# The keeper itself is no longer an operator (design principles 3.3, edges.cn.md 5.3): a removal that
# takes the last use of an observed run hands it to a `GATE`, a node kind with a data port and a sync
# predecessor, so it holds no URI and has no family here. `fold_keeps_arm_effect` and
# `branch_keeps_outer_effect` still draw one each, and the arm that waits for the chain place a
# dissolved branch held is measured by `inline_reduce_in_folded_arm` below.
[[tests]]
name = "pass_written.inventory"
desc = "The operators the passes write, counted by case and pinned by name: `:enum/tag` and `:enum/field` (six and four of the defun cases), and `:enum/make` pinned to zero with the writer it would have."
kind = "behavior"
tool = "node"
case = "../../../cases/opt/pass_written/check.mjs"
args = ["${case}"]
# One run: the check runs the binary itself over the cases it names.
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["[FAMILY] :enum/tag cases=6 nodes=6", "[FAMILY] :enum/field cases=4 nodes=5", "[FAMILY] :enum/make cases=0 nodes=0", "[FAMILY] ok"]
expect_output_not_contains = ["[FAMILY] RED"]
timeout_ms = 300000


# The other shape, and the reason the fix is not one-case-deep: a graph that names no exit at all
# happens (the empty tuple and the field access of a static expansion), `std::nvm` runs it, and the
# two dumps have to say the same thing about it -- `null` in the document, a comment over the EXIT
# node in the drawing, no invented edge in either.
[[tests]]
name = "no_exit.dot"
desc = "A graph that names no exit at all: `std::gir` draws it, says so over the EXIT node, and draws no EXIT edge."
case = "../../../cases/compile/static_expansion/fields_and_access.cml"
args = ["${case}", "std::gir"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["// exit: none -- this graph names no result", "label=\"EXIT\", type=\"EXIT\""]
expect_output_not_contains = ["Runtime graph exit node is missing"]

[[tests]]
name = "no_exit.json"
desc = "The same graph in `std::jgir`: the field is `null`, which is what the drawing's comment says in words."
case = "../../../cases/compile/static_expansion/fields_and_access.cml"
args = ["${case}", "std::jgir"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["\"exit\": null"]
# An effect whose place in the chain was the GATE inlined in front of it (2026-11-01, lane-fold2).
#
# `std::opt::inline` splices an inlined body's tail as a GATE, and `std::opt::fold` prunes the branch
# whose chain entered that arm. The gate was left with no wait, and the commit dissolved it as "plain
# forwarding" -- but a gate with no data user forwards nothing: it was the last reader of the
# `reduce`, and dissolving it took the effect's only place in the chain with it:
#
#     graph 'main' has effect node 36 (':mark/reduce_arr') with neither a read of its value nor a
#     place in its chain
#
# The gate still goes; the place it held goes to what it read, so the code that used to wait on the
# gate waits on the effect (src/runtime/draft.cpp, dissolveUnorderedGates).
[[tests]]
name = "inline_reduce_in_folded_arm.reference"
desc = "No pass: the `reduce` in the taken arm runs, and `main` returns 0 without reading it."
case = "../../../cases/opt/effects/inline_reduce_in_folded_arm.cml"
args = ["${case}", "${backend}"]
expect_exit = 0
expect_stdout_exact = ""

[[tests]]
name = "inline_reduce_in_folded_arm.inline_fold"
desc = "`std::opt::fold` prunes the branch the inlined body's chain was entered from; the `reduce` keeps the place the gate it read held."
case = "../../../cases/opt/effects/inline_reduce_in_folded_arm.cml"
args = ["${case}", "std::opt::inline", "std::opt::fold", "${backend}"]
expect_exit = 0
expect_stdout_exact = ""

[[tests]]
name = "inline_reduce_in_folded_arm.opt"
desc = "The same program through the whole optimizer."
case = "../../../cases/opt/effects/inline_reduce_in_folded_arm.cml"
args = ["${case}", "std::opt", "${backend}"]
expect_exit = 0
expect_stdout_exact = ""

# A write of the program's own state is judged on the graph the pass returns, not on the set of
# writes the program was given: when a rewrite leaves the variable no longer held by anything the
# program keeps, its last write is a write nobody can read -- no root of the graph holds it and no
# port reads it -- and a pass may leave it behind. What is checked is that a deleted write is no
# root in the result and no port reads it, not that the set of final writes is the same before and
# after (design principles 9.7).
#
#   dead_write_dropped_closure  the closure that captured the cell reaches nothing the program keeps
#                               (`p.0` reads the tuple's first member alone), and `x * 0 => 0` folds
#                               away the write's only reader: the write may go
#   dead_write_rooted_closure   the same write, with the closure called in the same `sync` block: the
#                               value is still read, so it must run, and the program prints the 41
#                               it wrote
#
# The judgement itself has its own reading below (`test::deadwrite`), which prints the answer for
# each write without a pipeline around it.
[[tests]]
name = "dead_write_dropped_closure.reference"
desc = "No pass: `h` is never called, so the program prints the 1 that `p.0` gives."
case = "../../../cases/opt/effects/dead_write_dropped_closure.cml"
args = ["${case}", "${backend}"]
expect_exit = 0
expect_stdout_exact = "1\n"

[[tests]]
name = "dead_write_dropped_closure.opt"
desc = "`std::opt` folds `w * 0` and leaves the write with no reader and no root: the graph it returns is one a pass may hand back."
case = "../../../cases/opt/effects/dead_write_dropped_closure.cml"
args = ["${case}", "std::opt", "${backend}"]
expect_exit = 0
expect_stdout_exact = "1\n"

[[tests]]
name = "dead_write_rooted_closure.reference"
desc = "No pass: the closure is called in the same `sync` block and reads the 41 the write left."
case = "../../../cases/opt/effects/dead_write_rooted_closure.cml"
args = ["${case}", "${backend}"]
expect_exit = 0
expect_stdout_exact = "41\n41\n"

[[tests]]
name = "dead_write_rooted_closure.opt"
desc = "The write is read by the call of the closure: it is no dead write, it must run, and the same 41 is printed."
case = "../../../cases/opt/effects/dead_write_rooted_closure.cml"
args = ["${case}", "std::opt", "${backend}"]
expect_exit = 0
expect_stdout_exact = "41\n41\n"

[[tests]]
name = "dead_write.judgement_dropped"
desc = "`test::deadwrite` prints what `camel::runtime::deadWrite` answers for each write, so the judgement is read on its own: after the fold, the write nothing reads and no root holds is a dead write."
kind = "behavior"
case = "../../../cases/opt/effects/dead_write_dropped_closure.cml"
args = ["${case}", "std::opt", "test::deadwrite"]
expect_exit = 0
expect_stdout_contains = ["oper=:op/assn_l", "rooted=0 read=0 dead=1"]

[[tests]]
name = "dead_write.judgement_rooted"
desc = "The same judgement where the place the write writes into is one the graph names: the module's cell is a root, so the write is no dead write, and the answer names the half that says so."
kind = "behavior"
case = "../../../cases/opt/effects/dead_write_held_by_program.cml"
args = ["${case}", "std::opt", "test::deadwrite"]
expect_exit = 0
expect_stdout_contains = ["oper=:op/assn_l", "rooted=1 read=0 dead=0"]

[[tests]]
name = "dead_write_held_by_program.reference"
desc = "No pass: the write's only reader is folded nowhere, and the program prints the 41 it wrote, twice."
case = "../../../cases/opt/effects/dead_write_held_by_program.cml"
args = ["${case}", "${backend}"]
expect_exit = 0
expect_stdout_exact = "41\n41\n"

[[tests]]
name = "dead_write_held_by_program.opt"
desc = "The module's cell is a place the graph names, so the write stays: the same 41 is printed after the fold."
case = "../../../cases/opt/effects/dead_write_held_by_program.cml"
args = ["${case}", "std::opt", "${backend}"]
expect_exit = 0
expect_stdout_exact = "41\n41\n"
