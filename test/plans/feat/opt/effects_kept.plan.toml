desc = "The aggregate reading: the arity, the member nodes and the verdict for every aggregate left after opt, so a refusal names its guard. Read on the two-member aggregate case, whose write stands before the closure since 2026-11-16 (written after it the program is refused: design principles 3.5, 198)."
kind = "behavior"
