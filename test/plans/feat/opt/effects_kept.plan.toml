# holds is not one (`isObservedRun` asks `camel::runtime::deadWriteOnceUnread`). The reading is the
# judgement's own: after the fold no graph carries a write it calls dead.
[[tests]]
name = "dead_write.opt.still_there"
desc = "The general engine still keeps the write the judgement calls dead: its sweep does not ask the write question yet, which is what the author's third decision covers. Its program is read on `dead_write_held_by_program` since 2026-11-16 -- the dropped shape this entry used is refused (design principles 3.5, 198, the write after the tuple that holds the closure) -- and the reading is the judgement's own, after the whole pipeline."
kind = "behavior"
case = "../../../cases/opt/effects/dead_write_held_by_program.cml"
args = ["${case}", "std::opt", "test::deadwrite", "${backend}"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["oper=:op/assn_l", "rooted=1 read=0 dead=0"]
[[tests]]
name = "dead_write.aggregate_two_members_reading"
