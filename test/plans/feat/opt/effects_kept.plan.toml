id = "opt.effects_kept"
order = 335
tier = "fast"
tags = ["feat", "opt", "effects", "inline", "dce", "fold"]
desc = "A pass never changes which effects run: an effect inside a statement, in an argument the callee never reads, and outside a branch whose other arm is taken"

# The effects a program has are decided by the program, not by a pass (design principles 9.7): what
# the program's statements, arguments and branch arms read, runs -- on every back end, and through
# the whole optimizer as well as through the one pass that used to drop it.
#
#   dce_effect_under_pure_arithmetic  the effect inside a statement stays when the statement's value
#                                     is unread (3.4)
#   inline_argument_effect            an argument's effect stays when the callee never reads the
#                                     parameter (3.4)
#   fold_keeps_arm_effect             a value the dropped arm read from outside keeps running: the
#                                     branch is used as a whole (3.1)
#   branch_keeps_outer_effect         the same, with the branch's value read by an arithmetic whose
#                                     other operand is an effect
#
# Each entry compares the pass against the same program with no pass at all, on all four back ends.

[defaults]
kind = "behavior"
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "dce_effect_under_pure_arithmetic.reference"
desc = "No pass: the statement of the `sync` block prints `5`, and the function returns 7."
case = "../../../cases/opt/effects/dce_effect_under_pure_arithmetic.cml"
args = ["${case}", "${backend}"]
expect_exit = 7
expect_stdout_exact = "5\n"

[[tests]]
name = "dce_effect_under_pure_arithmetic.dce"
desc = "`std::opt::dce` drops the unread subtraction: the print it holds stays."
case = "../../../cases/opt/effects/dce_effect_under_pure_arithmetic.cml"
args = ["${case}", "std::opt::dce", "${backend}"]
expect_exit = 7
expect_stdout_exact = "5\n"

[[tests]]
name = "dce_effect_under_pure_arithmetic.opt"
desc = "The same program through the whole optimizer."
case = "../../../cases/opt/effects/dce_effect_under_pure_arithmetic.cml"
args = ["${case}", "std::opt", "${backend}"]
expect_exit = 7
expect_stdout_exact = "5\n"

[[tests]]
name = "inline_argument_effect.reference"
desc = "No pass: `first` returns the 5 it reads, and the argument's `9` is printed before it."
case = "../../../cases/opt/effects/inline_argument_effect.cml"
args = ["${case}", "${backend}"]
expect_exit = 5
expect_stdout_exact = "9\n"

[[tests]]
name = "inline_argument_effect.inline"
desc = "`std::opt::inline` binds no use to the parameter the callee never reads; the argument's effect stays."
case = "../../../cases/opt/effects/inline_argument_effect.cml"
args = ["${case}", "std::opt::inline", "${backend}"]
expect_exit = 5
expect_stdout_exact = "9\n"

[[tests]]
name = "inline_argument_effect.opt"
desc = "The same program through the whole optimizer."
case = "../../../cases/opt/effects/inline_argument_effect.cml"
args = ["${case}", "std::opt", "${backend}"]
expect_exit = 5
expect_stdout_exact = "9\n"

[[tests]]
name = "fold_keeps_arm_effect.reference"
desc = "No pass: `println(1)` runs because the branch uses it as a whole, then the taken arm prints `2`."
case = "../../../cases/opt/effects/fold_keeps_arm_effect.cml"
args = ["${case}", "${backend}"]
expect_exit = 0
expect_stdout_exact = "1\n2\n1\n"

[[tests]]
name = "fold_keeps_arm_effect.fold_after_inline"
desc = "Inlining makes the condition constant and the fold takes the other arm; the print the dropped arm read stays."
case = "../../../cases/opt/effects/fold_keeps_arm_effect.cml"
args = ["${case}", "std::opt::inline", "std::opt::fold", "${backend}"]
expect_exit = 0
expect_stdout_exact = "1\n2\n1\n"

[[tests]]
name = "fold_keeps_arm_effect.opt"
desc = "The same program through the whole optimizer."
case = "../../../cases/opt/effects/fold_keeps_arm_effect.cml"
args = ["${case}", "std::opt", "${backend}"]
expect_exit = 0
expect_stdout_exact = "1\n2\n1\n"

[[tests]]
name = "branch_keeps_outer_effect.reference"
desc = "No pass: both calls print `1` before the `3` written after the branch."
case = "../../../cases/opt/effects/branch_keeps_outer_effect.cml"
args = ["${case}", "${backend}"]
expect_exit = 0
expect_stdout_exact = "1\n3\n4\n1\n3\n3\n"

[[tests]]
name = "branch_keeps_outer_effect.fold_after_inline"
desc = "The second call's condition is constant after inlining; the effect the dropped arm read still runs."
case = "../../../cases/opt/effects/branch_keeps_outer_effect.cml"
args = ["${case}", "std::opt::inline", "std::opt::fold", "${backend}"]
expect_exit = 0
expect_stdout_exact = "1\n3\n4\n1\n3\n3\n"

[[tests]]
name = "branch_keeps_outer_effect.opt"
desc = "The same program through the whole optimizer."
case = "../../../cases/opt/effects/branch_keeps_outer_effect.cml"
args = ["${case}", "std::opt", "${backend}"]
expect_exit = 0
expect_stdout_exact = "1\n3\n4\n1\n3\n3\n"

# The assertion the rest of this plan cannot make: the output itself. Every entry above compares a
# pass against the same program with no pass, on four back ends -- but each of them names the bytes it
# expects, so an effect that goes missing shows up as a wrong line. A program whose effect is left in
# no chain of its graph has no wrong line to show: it exits 0, its diagnostics are empty, and the
# lines it no longer prints are simply not there. `nn.mnist` did exactly that -- `std::opt` dropped
# `Iteration 0` -- and no plan noticed, because `nn.mnist` is run with `std::null` and compared with
# nothing.
#
# So this one compares the two runs with each other instead of with a golden: same binary, same host,
# so the numbers cancel out and the check stays true whatever the floats print as. It is a `tool =
# "node"` test because a plan entry runs one command with one `expect_stdout_*`; comparing two runs
# byte for byte and naming the line that went missing needs both in one process (see
# `cases/opt/effects/opt_matches_interpreter/check.mjs`).
[[tests]]
name = "opt_matches_interpreter.mnist"
desc = "`std::opt` prints what the interpreter prints, byte for byte, on `nn.mnist` -- the program where a dissolved branch left its `:io/println` in no chain and the pass silently lost output."
kind = "behavior"
tool = "node"
# One backend, because the check runs the interpreter and the optimizer itself and compares them: the
# `${backend}` of the other entries would only make it repeat that comparison four times.
backends = ["nvm"]
case = "../../../cases/opt/effects/opt_matches_interpreter/check.mjs"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["[EFFECTS] ok std::opt std::nvm", "[EFFECTS] ok the optimizer prints what the interpreter prints"]
expect_output_not_contains = ["[EFFECTS] RED", "[EFFECTS]   lost:"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 120000

# The one shape `:op/keep` exists for, written at graph level because no compiler pass makes it
# today: an effect a pass takes the last read of is a statement of a `sync` block in the graphs the
# builder writes, and the block's chain keeps it (design principles 3.3's current guarantee -- the
# chain, not this operator). `test::keepshape` takes the shape from the source: `keep_shape.cml`
# writes the print in a function that is no `sync` block, so nothing in its graph has a sync edge,
# and the pass removes the node that reads the print, which is what takes the print's last read.
#
# Three readings, and only one of them needs the operator: `keep=1 uri=:op/keep data_user=1
# standing=alive` is the rewrite's own answer (the operator stands in the value and the print is
# kept by a data use), `wait_edge=0 waited_on=0` says the print has no order edge to lean on, and
# the output does the rest -- `1` is the print running and the exit code `99` is the value the
# removal stands for.
[[tests]]
name = "keep_shape.replace"
desc = "The shape `:op/keep` is for: the effect is read by one node that a pass removes, no `sync` edge stands under it, and the rewrite keeps it through the operator -- the print still runs, and the value is the replacement."
case = "../../../cases/opt/effects/keep_shape.cml"
args = ["${case}", "test::keepshape", "${backend}"]
expect_exit = 99
expect_stdout_exact = "KEEPSHAPE keep=1 uri=:op/keep data_user=1 sync_statement=0 wait_edge=0 waited_on=0 standing=alive\n1\n"

# `std::jgir` and not `std::gir`: the dot dump asserts `graph->exitNode() != nullptr`
# (src/passes/trans/dot/graphviz.cpp#dumpGraph, "Runtime graph exit node is missing") and a graph that a
# pass committed with a node removed trips it, while the same graph runs (`keep_shape.replace`
# above exits 99) and `std::jgir` draws it. That is a defect of the dump, not of this rewrite, and
# the plan reads the operator out of the JSON until the dump is looked at.
[[tests]]
name = "keep_shape.in_graph"
desc = "The same rewrite, drawn: the graph holds an OPER node whose operator is `:op/keep`."
case = "../../../cases/opt/effects/keep_shape.cml"
args = ["${case}", "test::keepshape", "std::jgir"]
# One backend: the graph is the same one on each, and the test reads the drawing, not a run.
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["KEEPSHAPE keep=1 uri=:op/keep", "\"label\": \":op/keep\"", "\"exit\": \"g2n3\""]
# Two shapes of the same operator, side by side, because one alone would say the wrong thing about
# where it lives. `keep_shapes.real_pipeline` is the operator as `std::opt` writes it over an
# existing case -- two nodes, and the output `5` unchanged. `keep_shapes.no_order_edge` is the
# rewound one: one node, no order edge anywhere (`waited_on=0`), and the line it prints is the
# effect the operator is holding up.
#
# Note what the two have in common, measured rather than assumed: `in_chain=0` in both. The
# operator is only written when the node it keeps has no sync user (`replaceNode`:
# `syncUsers.empty() ? keepThroughValue(...) : replacement`), so a kept node never stands in a
# `sync` block's chain -- what separates the two shapes is who wrote the operator and whether an
# order edge is left to lean on, not a chain place.
[[tests]]
name = "keep_shapes.real_pipeline"
desc = "The optimizer's own rewrite: the pure subtraction leaves the chain, while the print it contains stays reached through the block's GATE. No redundant `:op/keep` is needed, and the program still prints what it printed."
case = "../../../cases/opt/effects/dce_effect_under_pure_arithmetic.cml"
args = ["${case}", "std::opt", "test::keepinspect", "${backend}"]
expect_exit = 7
expect_stdout_exact = "KEEPSPOTS keeps=0 in_chain=0 out_of_chain=0 waited=0\n5\n"

[[tests]]
name = "keep_shapes.no_order_edge"
desc = "The same operator on the shape with nothing else to hold the effect up: one node, no sync place and no order edge, and the print runs because the operator reads it."
case = "../../../cases/opt/effects/keep_shape.cml"
args = ["${case}", "test::keepshape", "test::keepinspect", "${backend}"]
expect_exit = 99
expect_stdout_exact = "KEEPSHAPE keep=1 uri=:op/keep data_user=1 sync_statement=0 wait_edge=0 waited_on=0 standing=alive\nKEEPSPOTS keeps=1 in_chain=0 out_of_chain=1 waited=0\n1\n"

# "Is an operator the passes write still reachable?" is a number pinned by name: `:op/keep` over
# `test/cases/opt/effects` (two cases, two nodes each), `:enum/tag` and `:enum/field` over
# `test/cases/opt/defun`, and `:enum/make` pinned to zero. A case whose effects the statement chain
# already reaches needs no redundant keeper; that is not the same as losing an effect credential.
# One more case means a rule started writing the operator, one fewer means a rule stopped.
# The denominator is the whole corpus and may grow; the finding is what may not move.
[[tests]]
name = "pass_written.inventory"
desc = "The operators the passes write, counted by case and pinned by name: `:op/keep` (two of the effect cases), `:enum/tag` and `:enum/field` (six and four of the defun cases), and `:enum/make` pinned to zero with the writer it would have."
kind = "behavior"
tool = "node"
case = "../../../cases/opt/pass_written/check.mjs"
args = ["${case}"]
# One run: the check runs the binary itself over the cases it names.
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["[FAMILY] :op/keep cases=2 nodes=4", "[FAMILY] :enum/tag cases=6 nodes=6", "[FAMILY] :enum/field cases=4 nodes=5", "[FAMILY] :enum/make cases=0 nodes=0", "[FAMILY] ok"]
expect_output_not_contains = ["[FAMILY] RED"]
timeout_ms = 300000
# The three dumps of the same graph, read for content and not for "it did not crash". Before the
# fix in `replaceNode` (src/passes/opt/generic/rewrite.cpp) the rewritten graph named no exit at
# all: `std::nvm` ran it (exit 99, printing `1`), `std::jgir` printed `"exit": "g2n4294967295"` --
# a name for a node the document did not hold -- and `std::gir` stopped at `Runtime graph exit node
# is missing` (src/passes/trans/dot/graphviz.cpp#dumpGraph). Now the node that stands for the
# removed value takes the graph's name, and the three dumps read the same graph:
#   * gir/rgir draw the exchange: the `:op/keep` node feeds the graph's EXIT;
#   * jgir names that same node (`g2n3`).
[[tests]]
name = "keep_shape.dot"
desc = "The graph drawn by `std::gir` after the rewrite: the `:op/keep` node is there and it is what the graph's EXIT edge leaves from."
case = "../../../cases/opt/effects/keep_shape.cml"
args = ["${case}", "test::keepshape", "std::gir"]
# One backend: the drawing is the graph, not a run.
backends = ["nvm"]
expect_exit = 0
# The node identifiers are the dump's own; they move if the graph changes, and that is a red
# someone should read rather than a number to keep green.
expect_stdout_contains = ["KEEPSHAPE keep=1 uri=:op/keep", "N04 [label=\":op/keep\", type=\"OPER\"", "N04 -> O02 [label=\"0\", type=\"EXIT\"]"]

[[tests]]
name = "keep_shape.rdot"
desc = "The same graph drawn by `std::rgir`: the same operator, the same EXIT edge, in the styled form."
case = "../../../cases/opt/effects/keep_shape.cml"
args = ["${case}", "test::keepshape", "std::rgir"]
backends = ["nvm"]
expect_exit = 0
# The rich dump wraps a label at its own width, so the operator reads `:op/\nkeep` there; the
# edge into the EXIT node is the part that says what the drawing claims. Both are asserted.
expect_stdout_contains = ["KEEPSHAPE keep=1 uri=:op/keep", "label=\":op/\\nkeep\", type=\"OPER\"", "N04 -> O02 [label=\"0\", type=\"EXIT\", style=solid]"]

# The other shape, and the reason the fix is not one-case-deep: a graph that names no exit at all
# happens (the empty tuple and the field access of a static expansion), `std::nvm` runs it, and the
# two dumps have to say the same thing about it -- `null` in the document, a comment over the EXIT
# node in the drawing, no invented edge in either.
[[tests]]
name = "no_exit.dot"
desc = "A graph that names no exit at all: `std::gir` draws it, says so over the EXIT node, and draws no EXIT edge."
case = "../../../cases/compile/static_expansion/fields_and_access.cml"
args = ["${case}", "std::gir"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["// exit: none -- this graph names no result", "label=\"EXIT\", type=\"EXIT\""]
expect_output_not_contains = ["Runtime graph exit node is missing"]

[[tests]]
name = "no_exit.json"
desc = "The same graph in `std::jgir`: the field is `null`, which is what the drawing's comment says in words."
case = "../../../cases/compile/static_expansion/fields_and_access.cml"
args = ["${case}", "std::jgir"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["\"exit\": null"]
# An effect whose place in the chain was the GATE inlined in front of it (2026-11-01, lane-fold2).
#
# `std::opt::inline` splices an inlined body's tail as a GATE, and `std::opt::fold` prunes the branch
# whose chain entered that arm. The gate was left with no wait, and the commit dissolved it as "plain
# forwarding" -- but a gate with no data user forwards nothing: it was the last reader of the
# `reduce`, and dissolving it took the effect's only place in the chain with it:
#
#     graph 'main' has effect node 36 (':mark/reduce_arr') with neither a read of its value nor a
#     place in its chain
#
# The gate still goes; the place it held goes to what it read, so the code that used to wait on the
# gate waits on the effect (src/runtime/draft.cpp, dissolveUnorderedGates).
[[tests]]
name = "inline_reduce_in_folded_arm.reference"
desc = "No pass: the `reduce` in the taken arm runs, and `main` returns 0 without reading it."
case = "../../../cases/opt/effects/inline_reduce_in_folded_arm.cml"
args = ["${case}", "${backend}"]
expect_exit = 0
expect_stdout_exact = ""

[[tests]]
name = "inline_reduce_in_folded_arm.inline_fold"
desc = "`std::opt::fold` prunes the branch the inlined body's chain was entered from; the `reduce` keeps the place the gate it read held."
case = "../../../cases/opt/effects/inline_reduce_in_folded_arm.cml"
args = ["${case}", "std::opt::inline", "std::opt::fold", "${backend}"]
expect_exit = 0
expect_stdout_exact = ""

[[tests]]
name = "inline_reduce_in_folded_arm.opt"
desc = "The same program through the whole optimizer."
case = "../../../cases/opt/effects/inline_reduce_in_folded_arm.cml"
args = ["${case}", "std::opt", "${backend}"]
expect_exit = 0
expect_stdout_exact = ""