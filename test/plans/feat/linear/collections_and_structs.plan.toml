id = "linear.collections_and_structs"
order = 341
tier = "feat"
tags = ["feat", "linear", "collections", "structs"]

[[tests]]
name = "duplicate_inputs.nvm"
desc = "Checks repeated use of one input value survives tuples, arrays, and calls without aliasing mistakes."
kind = "behavior"
case = "../../../cases/linear/nvm/duplicate_inputs.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
verify_script = """
({ input, assert, match }) => {
    assert(input.exit_code === 0, `camel exited ${input.exit_code}`)
    const found = match(/duplicate_inputs a=([0-9]+) b=([0-9]+) arr0=([0-9]+) arr1=([0-9]+) y=([0-9]+)/, input.normalized.stdout)
    assert(Number(found[1]) === 7, `expected a=7, got ${found[1]}`)
    assert(Number(found[2]) === 7, `expected b=7, got ${found[2]}`)
    assert(Number(found[3]) === 7, `expected arr0=7, got ${found[3]}`)
    assert(Number(found[4]) === 7, `expected arr1=7, got ${found[4]}`)
    assert(Number(found[5]) === 14, `expected y=14, got ${found[5]}`)
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

