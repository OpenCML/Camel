[[tests]]
name = "duplicate_inputs.nvm"
desc = "Checks repeated use of one input value survives tuples, arrays, and calls without aliasing mistakes."
kind = "behavior"
case = "../../../cases/linear/nvm/duplicate_inputs.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

