[[tests]]
name = "list_transform.jit"
desc = "Checks JIT preserves chained map, slice, and concat list transforms end to end."
kind = "behavior"
case = "../../../cases/linear/jit/list_transform.cml"
args = ["${case}", "${run_jit}"]
expect_exit = 0
verify_script = """
({ input, assert, match }) => {
    assert(input.exit_code === 0, `camel exited ${input.exit_code}`)
    const found = match(/list_transform ys_len=([0-9]+) ys3=([0-9]+) ys7=([0-9]+) zs_len=([0-9]+) zs0=([0-9]+) zs4=([0-9]+)/, input.normalized.stdout)
    assert(Number(found[1]) === 8, `expected ys_len=8, got ${found[1]}`)
    assert(Number(found[2]) === 9, `expected ys3=9, got ${found[2]}`)
    assert(Number(found[3]) === 49, `expected ys7=49, got ${found[3]}`)
    assert(Number(found[4]) === 5, `expected zs_len=5, got ${found[4]}`)
    assert(Number(found[5]) === 100, `expected zs0=100, got ${found[5]}`)
    assert(Number(found[6]) === 25, `expected zs4=25, got ${found[6]}`)
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

