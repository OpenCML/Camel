id = "linear.var_in_sync"
order = 346
tier = "fast"
tags = ["feat", "linear", "sync", "var"]

[[tests]]
name = "var_between_statements.default"
desc = "A var declared and read in a sync body is not a statement of the chain: the println statements around it all run, in written order (one before, after and between reads and writes, three in a row, a nested sync block, a read nothing uses). Pipeline: default."
kind = "behavior"
case = "../../../cases/linear/runtime/var_between_statements.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim().split('\n').join(' | ')
assert(out === '1 | 2 | 1 | 2 | 1 | 1 | 2 | 6 | 1 | 2 | 3 | 1 | 2 | 3 | 2', `unexpected output: ${out}`)
}
"""
timeout_ms = 20000

