normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "partial_application_written_var.opt_specialize"
desc = "The same call after the one pass that broke it, alone: std::opt::specialize binds the declared with parameter away, and the node VM then reads the version the call hands on -- the value, that version and the single run of the body. Pipeline: opt_specialize."
kind = "behavior"
case = "../../../cases/linear/runtime/partial_application_written_var.cml"
args = ["${case}", "std::opt::specialize", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "f body runs\n9.0\n1\n"
expect_output_not_contains = ["internal error", "Camel Debug Assertion"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000