[[tests]]
name = "partial_application_written_var.default"
desc = "A sync function that writes a module-level var is called through a partial application that binds its declared with parameter away, and the var is read afterwards: the call hands on the value (9.0) and the new version of the var (1) beside it, so the read after the call sees the version the call wrote and the body ran once. The callee's type must state no declared with parameter once it is bound, or the call's version is placed one port too late and a scheduler reads past the end of its with arguments. Pipeline: default."
kind = "behavior"
case = "../../../cases/linear/runtime/partial_application_written_var.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout_exact = "f body runs\n9.0\n1\n"
expect_output_not_contains = ["internal error", "Camel Debug Assertion"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

