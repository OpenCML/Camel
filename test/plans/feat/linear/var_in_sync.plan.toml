[[tests]]
name = "partial_application_written_var.opt"
desc = "The partial application of a sync function that writes a module-level var, after the optimizer: std::opt::specialize binds the with parameter and rewrites the call, and it used to leave the callee's type stating that parameter -- the call's value lost the version, and the four schedulers segfaulted after the body printed its line. Pipeline: opt."
kind = "behavior"
