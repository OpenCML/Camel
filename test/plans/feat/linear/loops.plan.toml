[[tests]]
name = "loops.state_in_place"
desc = "The old value of a loop state is not visible once the next round begins (design principles 10.5): a body whose only use of its single state is `xs->append<v>` starts from a private copy of the literal and appends in place, so 199 rounds take one block (`std::mem::blocks()` read between the operations), while the copying append of an array the loop does not own takes 199; the `for` shape of the same rewrite takes one block for five rounds; the literal is not edited, a second call of the same loop sees its first value again. The decision is per state: with an array and a counter, whichever order they are written in, only the array takes a copy (1 block each), two appended arrays take two, an array starting from a parameter takes 199, a body that also reads the state (`len(xs)`) takes 199, and a state whose next value is the constant `0` leaves the appended state's one copy alone."
kind = "behavior"
case = "../../../cases/loops/state_in_place.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "200 200 1 199\n0 7 0 7 3 0 7\n6 1 0 5\n200 0 7 199 200 0 7 199\n200 0 7 200 10 8\n200 0 7 199 200 7 199\n1 1 2 199 199\n200 0 7 0 1\n200 0 7 199 1\n200 0 7 199 1\n200 0 7 199 199\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
[[tests]]
name = "loops.state_in_place.multi"
desc = "The per-state decision on these shapes, 200 rounds, values hand-computed: four states of four types (an appended int array, a counter, a bool, a float) where the appended value is another state's old value; two appended arrays of different element types; a struct state whose array field is appended (the struct's fields are the loop's state components, design principles 10.5 read for a struct, so the array is one private state: one block at entry and none per round) and an array of structs (compact aggregate elements, one block in place); a state that starts from an array element the loop does not own; a body that reads the previous state's length while writing the next (the read sees the old length, and the copy form runs); the loop's state read after the loop; a constant component between two appended arrays; the appended array as the third state after two constants; and two states from the same literal, each privately copied. `std::mem::blocks()` between the operations shows one block for each appended array and one per round for a state that copies."
kind = "behavior"
case = "../../../cases/loops/state_in_place_multi.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "200 0 0 198 199 false 199\n200 0 1 200 2 1\n200 199\n200 1\n200 9 7\n4 3\n397\n200 1 0 200 2\n0 0 200 7\n200 1 200 2\n1 2 1 1 199 3 1 2 1 2\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
