id = "linear.loops"
order = 348
tier = "fast"
debug_tier = true # also selected by --tier debug (Debug build)
tags = ["feat", "linear", "loops"]
desc = "The structured loop (design principles 3.10): the `do` form compiled to a LOOP node with its condition and body regions, run by every back end (nvm, fvm, jit and prl in the frame of the function, each reading the same regions), the elements a string, a map and a tensor give it (11.1, 11.3), its diagnostics, and the refusals of the consumers that do not handle it yet."

[[tests]]
name = "loops.native_callback"
desc = "A native graph-reading callback invokes original For/While closures with fresh captures, including concurrent calls to the same graph under moving GC."
kind = "behavior"
case = "../../../cases/loops/native_callback.cml"
args = ["--gc", "generational", "${case}", "test::native_callback", "std::prl"]
envs = ["CAMEL_GC_VERIFY=both", "CAMEL_GC_STRESS_SAFEPOINT=1", "CAMEL_GC_STRESS_MODE=minor"]
expect_exit = 0
expect_stdout_exact = "30 42 30\n24\n3744\n"
timeout_ms = 20000

