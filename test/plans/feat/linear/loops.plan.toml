[[tests]]
name = "loops.constant_is_not_a_capture"
desc = "A constant is not a capture (design principles 3.10): test::loop_inputs shows with_runtime with one capture (the parameter `n`, which its condition reads) and one constant left out (the body's `k`), and constants_only with no capture and the same one constant. The LOOP node's With inputs stay the results of its regions and the round port, so no constant is bound to the node. The same pipeline runs on std::nvm and prints 21 70: the shape and the values are checked together."
kind = "behavior"
case = "../../../cases/loops/captures_constants.cml"
args = ["${case}", "test::loop_inputs", "std::nvm"]
expect_exit = 0
expect_output_contains = ["graph=with_runtime loop=", "kind=for-while state=1 with=3 captures=1 constants=1", "graph=constants_only loop=", "kind=for state=1 with=2 captures=0 constants=1", "input PORT constant=0 type=int", "constant DATA constant=1 type=int", "21 70"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

