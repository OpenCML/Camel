[[tests]]
name = "loops.shapes"
desc = "The four shapes of 3.10 on the four back ends: one state over an array (14), two states under a condition whose value is their tuple (5 10), a struct as the state and as the body (11), `for ... while` with an `if` body that stops at the first element above 9 (12) or runs out of elements (-1)."
kind = "behavior"
case = "../../../cases/loops/shapes.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["14 5 10 11 12 -1"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "loops.struct_state"
desc = "A struct is the loop's state : both fields change every round (6 8), only one does (0 7), and a named state's body may write the fields in another order (3 106) or nest a named field in another order (3 16 3), because an unnamed struct value enters the named type by name with a field-by-field copy (design principles 5.2). Also a `sync` body whose last value is the next struct (round 1, round 2, then 2 3), an `if` body whose arms are structs (12 4), an `if` body with one named arm and one unnamed arm in another order (2 4), and a `sync` function returning a struct in another order (2 1). The four back ends agree on the values and on the (empty) diagnostics."
kind = "behavior"
case = "../../../cases/loops/struct_state.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "diagnostics", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "6 8\n0 7\n3 106\n3 16 3\nround 1\nround 2\n2 3\n12 4\n2 4\n2 1\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "loops.struct_state.opt_jit"
desc = "The same struct loop states after `std::opt` and on the JIT: the optimizer keeps the struct the state and must give the same values as the interpreters."
kind = "behavior"
case = "../../../cases/loops/struct_state.cml"
args = ["${case}", "std::opt", "std::jit"]
expect_exit = 0
expect_stdout_exact = "6 8\n0 7\n3 106\n3 16 3\nround 1\nround 2\n2 3\n12 4\n2 4\n2 1\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "loops.zero_leaf_state"
desc = "A loop's state may be a struct with no leaves, the zero-leaf case of the split that makes a struct's fields the state's components (design principles 3.10). The rule allows it — 「(a) 允许空结构体状态：它是「按叶子拆成分量」的零叶子情形，不加规则、不加诊断。」 — so nothing refuses it and nothing diagnoses it: the state carries nothing, the loop runs one round per element (round 7, round 8, which only the body's effects can show), its value is still that zero-leaf struct ({} {}, and equal to a fresh one), and the four back ends agree."
kind = "behavior"
case = "../../../cases/loops/zero_leaf_state.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "diagnostics", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "round 7\nround 8\n{} {}\ntrue\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "loops.zero_leaf_state.opt_jit"
desc = "The zero-leaf struct state after `std::opt` and on the JIT: the optimizer keeps the empty struct the loop's state and gives the interpreters' values."
kind = "behavior"
case = "../../../cases/loops/zero_leaf_state.cml"
args = ["${case}", "std::opt", "std::jit"]
expect_exit = 0
expect_stdout_exact = "round 7\nround 8\n{} {}\ntrue\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "loops.zero_leaf_state.dump"
desc = "On the graph the zero-leaf state stays the loop's one state, not a list of components: the LOOP node's value_type is the empty struct '{  }', and its value enters the named type `Nothing` by a CAST, so what the program sees is still a zero-leaf struct of the type it declared."
kind = "behavior"
case = "../../../cases/loops/zero_leaf_state.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const lines = input.normalized.stdout.split(String.fromCharCode(10))
const loops = lines.filter((l) => l.includes('type="LOOP"'))
assert(loops.length > 0, 'the dump has no LOOP node to read the state shape from: ' + input.normalized.stdout)
assert(loops.every((l) => l.includes('value_type="{  }"')), 'a zero-leaf loop state is not the empty struct: ' + loops.join(' | '))
assert(lines.some((l) => l.includes('type="CAST"') && l.includes('value_type="Nothing"')), 'the empty struct does not enter the named type: ' + input.normalized.stdout)
}
"""
timeout_ms = 20000

