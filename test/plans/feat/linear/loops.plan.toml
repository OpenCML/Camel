[[tests]]
name = "loops.state_in_place"
desc = "The old value of a loop state is not visible once the next round begins (design principles 10.5): a body whose only use of its single state is `xs->append<v>` starts from a private copy of the literal and appends in place, so 199 rounds take one block (`std::mem::blocks()` read between the operations), while the copying append of an array the loop does not own takes 199; the `for` shape of the same rewrite takes one block for five rounds; the literal is not edited, a second call of the same loop sees its first value again. The decision is per state: with an array and a counter, whichever order they are written in, only the array takes a copy (1 block each), two appended arrays take two, an array starting from a parameter takes 199, a body that also reads the state (`len(xs)`) takes 199, and a state whose next value is the constant `0` leaves the appended state's one copy alone."
kind = "behavior"
case = "../../../cases/loops/state_in_place.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "200 200 1 199\n0 7 0 7 3 0 7\n6 1 0 5\n200 0 7 199 200 0 7 199\n200 0 7 200 10 8\n200 0 7 199 200 7 199\n1 1 2 199 199\n200 0 7 0 1\n200 0 7 199 1\n200 0 7 199 1\n200 0 7 199 199\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
[[tests]]
name = "loops.hof_compact_element_view"
desc = "A compact tuple array is consumed by map, filter, reduce and foreach without materialising an element: over 10,000 (int, int) elements the only blocks are the map and filter output arrays (one each), and reduce/foreach allocate none (std::mem::blocks() read between the operations)."
kind = "behavior"
case = "../../../cases/loops/hof_block_alloc.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "10000 1 5000 1\n100000000 0 0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000
[[tests]]
name = "loops.reduce_element_view"
desc = "A value reduce keeps across rounds is a value, not a compact-element view (H29): a callback that returns its element gives the same result on every backend for a slot-shaped `(int, int)` array (one reused view cell), a slot-shaped struct, a non-slot-shaped struct (the view ring), a nested aggregate, a loop-written left fold with a tuple state, the same accumulator after filter/map, an identity map whose callback result is the view that was read, and 200 elements whose kept element is older than the 128-cell ring."
kind = "behavior"
case = "../../../cases/loops/reduce_view.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_exact = "(1, 30)\n(0, 5)\n(6, 56)\n(3, 20)\n(1, 30)\n{ x: 1, y: 30 }\n{ ok: true, y: 30 }\n((0, 0), 5)\n(1, 30)\n(1, 30)\n(1, 60)\n(200, 0)\n(200, 0)\n{ ok: true, y: 200 }\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000

[[tests]]
name = "loops.grad_loop_collect"
desc = "A loop state that starts as `[]` and is only appended to is a collection output (design principles 3.10): the element type comes from the appended value (5.1, 5.2), the driver builds the array in one pass, and the state stays the program's value and gradient channel. The gradient reads the appended values back through the state, and 1000 rounds cost 3 blocks, not one copy per round (`std::mem::blocks()`, 10.5)."
kind = "behavior"
case = "../../../cases/loops/grad_loop_collect.cml"
args = ["${case}", "std::macro"]
expect_exit = 0
expect_stdout_exact = "6.0\n3.0\n1998.0\n3\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "loops.refuse_struct_data"
desc = "A differentiable value read through a struct and converted to data (`float(p.n)`, where `n` is an `int` field computed from the parameter) is refused at the read: the conversion has no gradient channel, so the contribution would vanish without a sign (design principles 9.9)."
kind = "negative"
case = "../../../cases/loops/refuse_struct_data.cml"
args = ["-E", "short", "${case}", "std::nvm"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::RuntimeError"
expect_diagnostic_line = 12
expect_output_contains = ["has no gradient channel", "refuse_struct_data.cml:12:18"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "loops.refuse_effectful_data"
desc = "A value produced by an effectful call (`side` returns an `int` from the parameter) and converted to data is refused at the conversion: the call boundary hides the dependency, so the gradient would be dropped silently (design principles 9.9)."
kind = "negative"
case = "../../../cases/loops/refuse_effectful_data.cml"
args = ["-E", "short", "${case}", "std::nvm"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::RuntimeError"
expect_diagnostic_line = 15
expect_output_contains = ["has no gradient channel", "refuse_effectful_data.cml:15:16"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

