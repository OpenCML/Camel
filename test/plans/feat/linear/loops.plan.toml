[[tests]]
name = "loops.shapes"
desc = "The four shapes of 3.10 on the four back ends: one state over an array (14), two states under a condition whose value is their tuple (5 10), a struct as the state and as the body (11), `for ... while` with an `if` body that stops at the first element above 9 (12) or runs out of elements (-1)."
kind = "behavior"
case = "../../../cases/loops/shapes.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["14 5 10 11 12 -1"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "loops.effects"
desc = "A body that is a sync block runs its effects every round, in order, and its last value is the next state; a loop in a sync function returns its last state (countdown 0)."
kind = "behavior"
case = "../../../cases/loops/effects.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout_contains = ["0 a\n1 b\n2 c\nrounds 3\ntick 3\ntick 2\ntick 1\ncountdown 0"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "loops.captures"
desc = "One capture table for the condition and the body (3.10): the condition captures `limit`, the body `step` and `scale`; a `var` read in the body; nested loops whose inner graphs capture the outer state, in a `for` and in a two-state `while` (24 306 42 25 4)."
kind = "behavior"
case = "../../../cases/loops/captures.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
