[[tests]]
name = "loops.grad_refused_lowered"
desc = "grad run by std::fvm without std::macro: the back end lowered the loop in its private copy, but grad reads the program's own graph (OperatorTraits::inspectsGraphs) and refuses the loop at line 7 as std::nvm does."
kind = "negative"
case = "../../../cases/loops/grad_refused.cml"
args = ["-E", "short", "${case}", "std::fvm"]
