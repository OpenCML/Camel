normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "loops.refuse_loop_iter_array"
desc = "A loop iterating over an array computed from the parameter is refused at the loop: each round's element carries part of the contribution, but the reverse pass has no scatter for an iterated array, so before H22 the gradient was silently 0 (design principles 9.9)."
