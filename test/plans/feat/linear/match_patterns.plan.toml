id = "linear.match_patterns"
order = 343
tier = "feat"
tags = ["feat", "linear", "match"]

[[tests]]
name = "multi_pattern.nvm"
desc = "`case a | b => body` enters the body when any pattern matches (only the first used to be read); a wildcard among the alternatives makes the case the default (nvm)."
kind = "behavior"
case = "../../../cases/linear/match/multi_pattern.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
    const out = input.normalized.stdout.trim()
    assert(out === 'vowel\nvowel\nvowel\nboth\nrare\nrare\nother\n10\n20\n30\n-1\n-1', `unexpected output: ${out}`)
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

