[[tests]]
name = "wildcard_first.nvm"
desc = "Nothing after the wildcard case is reachable: the case after it used to be entered for every value that matched no pattern (nvm)."
kind = "behavior"
case = "../../../cases/linear/match/wildcard_first.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
    const out = input.normalized.stdout.trim()
    assert(out === '0\n0\n7\n7', `unexpected output: ${out}`)
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 8000

