id = "linear.order_edges_regions"
order = 347
tier = "fast"
tags = ["feat", "linear", "runtime", "effects", "gir"]

# An order edge never enters a control region (docs/design/effects/edges.cn.md 4.6): an arm and a
# part of a loop run as a whole with the node that owns the region, so the order such a region has
# with the code around it is written on that node -- the `BRCH` or the `LOOP` -- and never on a node
# inside the region. An edge inside the region would tie the two regions' execution together, which
# is what "dependencies are counted by region" (design principles 3.1) forbids.
#
# `order_edges_regions.cml` has the three shapes that used to write the edge in the wrong place:
#
#   1. two arms of one `if`, each writing the same variable and each effecting the same resource,
#      with two writes inside the first arm -- the read before the branch feeds the condition, so
#      the data path already orders the `BRCH` and no order edge is needed at all;
#   2. a read the condition does not feed: the order edge it needs is written on the `BRCH`;
#   3. a read before a loop whose body writes the same variable: the `LOOP` carries it.
#
# The graph test reads those clauses off `std::jgir`, which names each node's region and each
# region's kind and owner: no order edge may cross a control region's border, one must hang on the
# `BRCH`, one on the `LOOP`, and the two writes inside an arm must still be ordered -- so the fix
# cannot be met by writing no order edge at all. The behavior tests say the four backends and the
# interpreter agree on what the program prints and returns, since an edge written in the wrong place
# would show up as a different order of the effects.

[defaults]
kind = "behavior"
case = "../../../cases/linear/runtime/order_edges_regions.cml"
expect_exit = 56
timeout_ms = 20000
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]

[[tests]]
name = "order_edges_regions.interp"
desc = "The three shapes print `9`, then the two lines of the arm the branch takes, then the loop's rounds, and return 56, with no pass (the interpreter, which counts dependencies by region)."
args = ["${case}"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim().split('\n').join(' | ')
assert(out === '9 | 1 | 2 | 0 | 1', `unexpected output: ${out}`)
assert(input.exit_code === 56, `unexpected exit ${input.exit_code}`)
}
"""

[[tests]]
name = "order_edges_regions.nvm"
desc = "The three shapes print `9`, then the two lines of the arm the branch takes, then the loop's rounds, and return 56 (stdio pipeline: std::nvm)."
