[[tests]]
name = "order_edges_regions.gir"
desc = "No order edge crosses the border of a control region: the read before the branch that does not feed its condition is ordered by an edge on the BRCH, the read before the loop by one on the LOOP, and the two writes inside an arm are still ordered by an edge inside that arm (docs/design/effects/edges.cn.md 4.6)."
case = "../../../cases/linear/runtime/order_edges_regions.cml"
args = ["${case}", "std::jgir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const document = JSON.parse(input.normalized.stdout)
const CONTROL = new Set(['arm', 'loop_cond', 'loop_body'])
const edges = []
for (const graph of document.graphs) {
const nodes = new Map(graph.nodes.map((node) => [node.id, node]))
const regions = new Map((graph.regions || []).map((region) => [region.id, region]))
// The control region a node runs with: the innermost region that is an arm or a part of a loop.
// A region that only records where code came from -- an inlined body, a tagged block -- holds no
// execution of its own, so the walk goes through it (docs/design/effects/edges.cn.md 5.8).
const controlRegionOf = (id) => {
const node = nodes.get(id)
let region = node && node.region ? regions.get(node.region) : null
while (region) {
if (CONTROL.has(region.kind)) return region.id
region = regions.get(region.parent)
}
return null
}
const crosses = []
for (const edge of graph.edges || []) {
if (edge.kind !== 'order') continue
const from = nodes.get(edge.source)
const to = nodes.get(edge.target)
assert(from && to, `order edge names a node the graph does not have: ${edge.source} -> ${edge.target}`)
if (controlRegionOf(edge.source) !== controlRegionOf(edge.target)) {
crosses.push(`${edge.source} (${from.label}) -> ${edge.target} (${to.label})`)
}
edges.push({ from: from.label, toKind: to.kind, to: to.label })
}
assert(
crosses.length === 0,
`${crosses.length} order edge(s) cross a control region: ${crosses.join(', ')} -- an arm and a part of a loop run as a whole, so the edge belongs on the node that owns the region`)
}
const onBrch = edges.filter((edge) => edge.toKind === 'BRCH')
const onLoop = edges.filter((edge) => edge.toKind === 'LOOP')
assert(onBrch.length === 1, `expected one order edge on a BRCH, got ${onBrch.length}`)
assert(onLoop.length === 1, `expected one order edge on a LOOP, got ${onLoop.length}`)
assert(onBrch[0].from === ':var/get', `the order edge on the BRCH is from ${onBrch[0].from}, not from the read before the branch`)
assert(onLoop[0].from === ':var/get', `the order edge on the LOOP is from ${onLoop[0].from}, not from the read before the loop`)
// The two writes inside the first arm are what the fix must not take away: an order edge whose
// two ends are in the same arm is the one such an edge is for.
const inside = edges.filter((edge) => edge.to === ':op/assn_l')
assert(inside.length === 1, `expected the two writes inside the arm to stay ordered, got ${inside.length} order edge(s) into a write`)
}
"""