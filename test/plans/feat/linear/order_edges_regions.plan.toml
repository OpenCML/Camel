[[tests]]
name = "order_edges_regions.gir"
desc = "No order edge crosses the border of a control region: the read before the branch that does not feed its condition is ordered by an edge on the BRCH, no edge hangs on the LOOP (a `var` write is not a resource and orders nothing), and the statements inside an arm are still ordered among themselves by an edge inside that arm (docs/design/effects/edges.cn.md 4.6; design principles 3.1). The edge inside the first arm changed with the rule on a branch written as a statement: that branch joins no value, so its two writes are the cell's two versions and the pair that still carries the arm's order is its two prints (design principles 3.5, F3)."
case = "../../../cases/linear/runtime/order_edges_regions.cml"
args = ["${case}", "std::jgir", "std::nop"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const document = JSON.parse(input.normalized.stdout)
const CONTROL = new Set(['arm', 'loop_cond', 'loop_body'])
const edges = []
for (const graph of document.graphs) {
const nodes = new Map(graph.nodes.map((node) => [node.id, node]))
const regions = new Map((graph.regions || []).map((region) => [region.id, region]))
// The control region a node runs with: the innermost region that is an arm or a part of a loop.
// A region that only records where code came from -- an inlined body, a tagged block -- holds no
// execution of its own, so the walk goes through it (docs/design/effects/edges.cn.md 5.8).
const controlRegionOf = (id) => {
const node = nodes.get(id)
let region = node && node.region ? regions.get(node.region) : null
while (region) {
if (CONTROL.has(region.kind)) return region.id
region = regions.get(region.parent)
}
return null
}
const crosses = []
for (const edge of graph.edges || []) {
if (edge.kind !== 'order') continue
const from = nodes.get(edge.source)
const to = nodes.get(edge.target)
assert(from && to, `order edge names a node the graph does not have: ${edge.source} -> ${edge.target}`)
const fromRegion = controlRegionOf(edge.source)
const toRegion = controlRegionOf(edge.target)
if (fromRegion !== toRegion) {
crosses.push(`${edge.source} (${from.label}) -> ${edge.target} (${to.label})`)
}
edges.push({ from: from.label, toKind: to.kind, to: to.label, inControl: fromRegion !== null && toRegion !== null, sameControl: fromRegion === toRegion })
}
assert(
crosses.length === 0,
`${crosses.length} order edge(s) cross a control region: ${crosses.join(', ')} -- an arm and a part of a loop run as a whole, so the edge belongs on the node that owns the region`)
}
const onBrch = edges.filter((edge) => edge.toKind === 'BRCH')
const onLoop = edges.filter((edge) => edge.toKind === 'LOOP')
assert(onBrch.length === 1, `expected one order edge on a BRCH, got ${onBrch.length}`)
assert(onLoop.length === 0, `expected no order edge on a LOOP, got ${onLoop.length}: a write to a var is not a resource (design principles 3.1, the ruling of 2026-11-16), so the loop orders nothing`)
// The read before the branch is gone from this graph: the fold gave its user the value the write
// produced, and the node that carries that value now is the copy -- a call of `:op/copy`, since a
// copy is an operator and no longer a kind of its own (plan 2.3, step 1). An order edge belongs to
// the node that holds the value and runs with it, so the edge the read used to carry is the
// copy's. Both ends are named, so the assertion says which node the edge hangs on and not merely
// that one exists.
assert(onBrch[0].from === ':op/copy' && onBrch[0].to === 'BRCH', `the order edge the branch waits on is ${onBrch[0].from} -> ${onBrch[0].to}, not :op/copy -> BRCH: the copy carries the value of the read before the branch, and the edge went with the value`)
// What an order edge inside a control region is for: the statements an arm runs keep their order
// among themselves. The pair of writes in the first arm (`x = 3; x = 4`) is no longer two
// `:op/assn_l` nodes to hang such an edge on -- the branch there is written as a statement, so it
// joins no value (design principles 3.7), and the two writes are
// the cell's two versions with the value `4` handed to the join; a write nothing reads is not kept
// alive by an order edge either (design principles 3.5, F3). The pair the arm still has is its two
// prints, and the edge inside the arm is the one they carry. What must not change is that an arm's
// own statements stay ordered with each other, and that no edge of that kind crosses a border.
const inside = edges.filter((edge) => edge.inControl && edge.sameControl)
assert(inside.length === 1, `expected the statements inside a control region to stay ordered, got ${inside.length} order edge(s) inside one: ${inside.map((edge) => edge.from + ' -> ' + edge.to).join(', ')}`)
assert(inside[0].from === ':io/println' && inside[0].to === ':io/println', `the order edge inside the arm is ${inside[0].from} -> ${inside[0].to}, not the two prints of the arm`)
}
"""