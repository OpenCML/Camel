[[tests]]
name = "order_direct_user.graph"
desc = "`before(i + 1); modify(i)` in a sync body: the body orders its statements, so the graph has the control edge `before` -> `modify` even though `before` never touches `i`, and the read written after `modify` follows it. (The retired `wait` ordered the direct user of `i` instead: `+` -> `modify` and no `before` -> `modify`.)"
kind = "behavior"
case = "../../../cases/linear/byref/order_direct_user.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const text = input.normalized.stdout
const edge = (from, to, type) =>
    new RegExp(from + ' -> ' + to + ' \\[label="[^"]*", type="' + type + '"').test(text)
const call = (label) => {
    const m = text.match(new RegExp('(N[0-9A-F]+) \\[label="' + label + '", type="FUNC"'))
    assert(m, `no call of ${label}`)
    return m[1]
}
const a = call('before'), modify = call('modify')
assert(edge(a, modify, 'CTRL'), 'missing control edge `before` -> `modify`: a sync body orders its statements')
// The `+` of `i + 1` still feeds the call: the value does not depend on which statement runs first.
const adds = [...text.matchAll(/(N[0-9A-F]+) \[label=":op\/add[^"]*", type="OPER"/g)].map(m => m[1])
assert(adds.some(n => edge(n, a, 'NORM')), 'no `+` feeding `before`')
// The read written after modify follows it.
const reads = [...text.matchAll(/(N[0-9A-F]+) \[label=":var\/(?:get|peek)", type="OPER"/g)].map(m => m[1])
assert(reads.some(r => edge(modify, r, 'CTRL')), 'missing control edge modify -> later read of i')
}
"""
timeout_ms = 10000

[[tests]]
name = "captured_write_graph.warnings"
desc = "IgnoredSideEffect for captured writes: reported for the call of a function that writes a captured variable outside a sync block and for such a branch outside one; not for a call written inside a sync body, and not for a recursive function that only reads the variable it captured (inside its open body its writes are an upper bound, the warning is decided once all bodies are built). The same function is not reported as an undeclared writer either."
kind = "behavior"
case = "../../../cases/linear/byref/captured_write_graph.cml"
args = ["--output-format", "json", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const diags = JSON.parse(input.stderr)
const at = d => (d.range.start.line + 1) + ':' + (d.range.start.character + 1)
const ignored = diags.filter(d => d.data.name === 'SemanticDiag::IgnoredSideEffect').map(d => at(d) + ' ' + d.message)
const want = [
    "39:20 The call of 'write_a: () => int' is not in a sync block, and it writes the captured variable 'a'.",
    "58:13 The branch is not in a sync block, and an arm writes the captured variable 'c'.",
]
assert(JSON.stringify(ignored) === JSON.stringify(want), 'IgnoredSideEffect: ' + ignored.join(' | '))
assert(!diags.some(d => d.message.includes("'look'") || d.message.includes("'limit'")), 'the read-only recursive function is not reported')
}
"""
timeout_ms = 10000

