[[tests]]
name = "captured_write_value.shape"
desc = "The shape of the value of a call that writes captured variables, on the graph dump: two_writes() is (int, var int, var int) with the return value first and the versions in capture order; bump_void() is var int alone, unwrapped; plain() is int with no access node; unused() is (int, var int) with an access node for the version only. No control edge stands in for the version."
kind = "behavior"
case = "../../../cases/linear/byref/captured_write_value.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const text = input.normalized.stdout
const funcNode = (label) => {
    const m = text.match(new RegExp('(N[0-9A-F]+) \\[label="' + label + '", type="FUNC", [^\\]]*value_type="([^"]+)"'))
    assert(m, `no call of ${label}`)
    return { node: m[1], type: m[2] }
}
const accsType = (node) => {
    const m = text.match(new RegExp(node + ' \\[label="\\.(\\d+)", type="ACCS", value_type="([^"]+)"'))
    return m ? { part: Number(m[1]), type: m[2] } : null
}
// The parts of a call's value that are read through an access node.
const accessParts = (node) =>
    [...text.matchAll(new RegExp(node + ' -> (N[0-9A-F]+) \\[label="(\\d+)\\|0", type="NORM"', 'g'))]
        .map(m => accsType(m[1]))
        .filter(a => a !== null)
        .sort((a, b) => a.part - b.part)
// two_writes() writes both `p` and `q` and returns int: the return value, then the versions.
const two = funcNode('two_writes')
assert(two.type === '(int, var int, var int)', `two_writes is a ${two.type}`)
const twoParts = accessParts(two.node)
assert(twoParts.length === 3, `two_writes reads ${twoParts.length} parts through an access node`)
assert(twoParts.map(p => p.part).join(',') === '0,1,2', 'the parts are the return value and then the versions in capture order')
assert(twoParts.map(p => p.type).join(',') === 'int,var int,var int', 'the parts are typed return value first')
// bump_void() writes one variable and returns nothing: that version itself, not a tuple.
const bump = funcNode('bump_void')
assert(bump.type === 'var int', `bump_void is a ${bump.type}`)
assert(accessParts(bump.node).length === 0, 'a void writer hands its one version on unwrapped')
// plain() writes no captured variable: its value is its return value, with no access node.
const plain = funcNode('plain')
assert(plain.type === 'int', `plain is a ${plain.type}`)
assert(accessParts(plain.node).length === 0, 'a call that writes no captured variable has no parts')
// unused() writes `m` and its return value is dropped: only the version has an access node.
const unused = funcNode('unused')
assert(unused.type === '(int, var int)', `unused is a ${unused.type}`)
const unusedParts = accessParts(unused.node)
assert(unusedParts.length === 1 && unusedParts[0].part === 1 && unusedParts[0].type === 'var int',
    `unused reads ${JSON.stringify(unusedParts)} through an access node, wanted the version of m alone`)
// The reads written after two_writes() take the version's access node, not a control edge.
const section = text.slice(text.indexOf('label="two_case"'), text.indexOf('label="void_case"'))
assert(section.length > 0, 'no graph for two_case')
const reads = [...section.matchAll(/(N[0-9A-F]+) \[label=":var\/(?:get|peek)", type="OPER"/g)].map(m => m[1])
assert(reads.length > 0, 'no read of a captured variable after the call in two_case')
for (const r of reads)
    assert(!new RegExp(two.node + ' -> ' + r + ' \\[label="[^"]*", type="CTRL"').test(section),
        `the call must not order the read ${r} with a control edge`)
}
"""
timeout_ms = 10000
