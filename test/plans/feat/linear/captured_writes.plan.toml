id = "linear.captured_writes"
order = 346
tier = "feat"
tags = ["feat", "linear", "var", "capture", "wait"]

[[tests]]
name = "captured_write_order.default"
desc = "A call of a function, or a branch, that writes a captured variable is a write of it: reads written after it see the new value, a waited one comes after the earlier uses. Pipeline: default (no pass)."
kind = "behavior"
case = "../../../cases/linear/byref/captured_write_order.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim().split('\n').join(' | ')
assert(out === '10 | 10 | 100 | 10 | 111 | 1011 | 12 | 611 | 40 | 2508 | 21', `unexpected output: ${out}`)
}
"""
timeout_ms = 20000

