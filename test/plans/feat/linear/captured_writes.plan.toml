[[tests]]
name = "wait_direct_user.graph"
desc = "A(i + 1); wait modify(i): `wait` orders by the use of the variable. The direct user of i is `+`, so the graph has the control edge `+` -> modify and none from A to modify (design principles 2.6)."
kind = "behavior"
case = "../../../cases/linear/byref/wait_direct_user.cml"
args = ["${case}", "std::rgir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const text = input.normalized.stdout
const edge = (from, to, type) =>
    new RegExp(from + ' -> ' + to + ' \\[label="[^"]*", type="' + type + '"').test(text)
const call = (label) => {
    const m = text.match(new RegExp('(N[0-9A-F]+) \\[label="' + label + '", type="FUNC"'))
    assert(m, `no call of ${label}`)
    return m[1]
}
const a = call('before'), modify = call('modify')
// The `+` of `i + 1` is the :op/add node whose result is A's argument.
const adds = [...text.matchAll(/(N[0-9A-F]+) \[label=":op\/add[^"]*", type="OPER"/g)].map(m => m[1])
const plus = adds.find(n => edge(n, a, 'NORM'))
assert(plus, 'no `+` feeding A')
assert(edge(plus, modify, 'CTRL'), 'missing control edge `+` -> modify')
assert(!edge(a, modify, 'CTRL'), 'A must not be ordered before modify: it does not use i')
// The read written after the wait follows modify.
const reads = [...text.matchAll(/(N[0-9A-F]+) \[label=":var\/get", type="OPER"/g)].map(m => m[1])
assert(reads.some(r => edge(modify, r, 'CTRL')), 'missing control edge modify -> later read of i')
}
"""
timeout_ms = 4000

[[tests]]
name = "captured_write_graph.warnings"
desc = "IgnoredSideEffect for captured writes: reported for the unwaited call of a function that writes a captured variable and for the unwaited branch whose arm does; not for the waited call, and not for a recursive function that only reads the variable it captured (inside its open body its writes are an upper bound, the warning is decided once all bodies are built). The same function is not reported as an undeclared writer either."
kind = "behavior"
case = "../../../cases/linear/byref/captured_write_graph.cml"
args = ["--output-format", "json", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const diags = JSON.parse(input.stderr)
const at = d => (d.range.start.line + 1) + ':' + (d.range.start.character + 1)
const ignored = diags.filter(d => d.data.name === 'SemanticDiag::IgnoredSideEffect').map(d => at(d) + ' ' + d.message)
const want = [
    "40:20 The call of 'write_a: () => i64' is neither waited nor in a sync block, and it writes the captured variable 'a'.",
    "59:13 The branch is neither waited nor in a sync block, and an arm writes the captured variable 'c'.",
]
assert(JSON.stringify(ignored) === JSON.stringify(want), 'IgnoredSideEffect: ' + ignored.join(' | '))
const undeclared = diags.filter(d => d.data.name === 'SemanticDiag::CapturedWriteInAsyncFunction').map(d => d.message.split(' writes ')[0])
assert(JSON.stringify(undeclared) === JSON.stringify(["Function 'write_a'", "Function 'write_b'", "Function 'writes'", "Function 'waits'", "Function 'main'"]), 'undeclared writers: ' + undeclared.join(' | '))
assert(!diags.some(d => d.message.includes("'look'") || d.message.includes("'limit'")), 'the read-only recursive function is not reported')
}
"""
timeout_ms = 4000
