[[tests]]
name = "captured_write_graph.edges"
desc = "How a captured variable written by a call reaches its later readers in the compiled graph: the call's value carries the new version, the reader takes that version as a `with` argument, and no control edge stands in for it. A writer still waits for its earlier readers; a read-only recursive function orders nothing; the JOIN of a branch whose arm writes precedes the later read."
kind = "behavior"
case = "../../../cases/linear/byref/captured_write_graph.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const text = input.normalized.stdout
const nodes = (label, type) =>
    [...text.matchAll(new RegExp('(N[0-9A-F]+) \\[label="' + label + '", type="' + type + '"', 'g'))].map(m => m[1])
const one = (label, type) => {
    const found = nodes(label, type)
    assert(found.length === 1, `expected one ${type} node labelled ${label}, got ${found.length}`)
    return found[0]
}
const edge = (from, to, type) =>
    new RegExp(from + ' -> ' + to + ' \\[label="[^"]*", type="' + type + '"').test(text)
// The call hands the new version of `a` on as the second part of its value, and the later read
// takes that version. Nothing stands in for it with a control edge any more.
const writeA = one('write_a', 'FUNC')
const readA = one('read_a', 'FUNC')
const version = text.match(new RegExp(writeA + ' -> (N[0-9A-F]+) \\[label="1\\|0", type="NORM"'))
assert(version, 'missing the access node of the second part of the value of write_a')
assert(edge(version[1], readA, 'WITH'), 'missing the version of a -> read_a')
assert(!edge(writeA, readA, 'CTRL'), 'the substituted control edge must be gone')
// A writer still waits for the reader that comes before it.
assert(edge(one('use_b', 'FUNC'), one('write_b', 'FUNC'), 'CTRL'), 'missing use_b -> write_b')
assert(!edge(one('write_b', 'FUNC'), one('use_b', 'FUNC'), 'CTRL'), 'write_b must not precede use_b')
// look: one call inside its own arm, two in reads(). The two outer calls are unordered.
const looks = nodes('look', 'FUNC')
assert(looks.length === 3, `expected three calls of look, got ${looks.length}`)
for (const x of looks) for (const y of looks)
    assert(!edge(x, y, 'CTRL'), `a read-only recursive function was ordered as a writer: ${x} -> ${y}`)
// arms(): the JOIN of the branch in the graph that holds the variable (:var/new) precedes the
// read of c written after the branch.
const section = text.slice(text.indexOf('label="arms"'))
const join = section.match(/(N[0-9A-F]+) \[label="JOIN", type="JOIN"[^\n]*span="58:/)
assert(join, 'no JOIN for the branch of arms()')
const reads = [...section.matchAll(/(N[0-9A-F]+) \[label=":var\/get", type="OPER"/g)].map(m => m[1])
assert(reads.some(r => edge(join[1], r, 'CTRL')), 'missing JOIN -> read of c after the branch')
}
"""
timeout_ms = 10000

