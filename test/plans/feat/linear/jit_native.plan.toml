id = "linear.jit_native"
order = 352
tier = "feat"
tags = ["feat", "linear", "jit", "codegen"]

[[tests]]
name = "native_registers.nvm"
desc = "Arithmetic and comparisons with more live values in one block than the JIT has registers, in every operand position of every register: the same values on every back end (nvm)."
kind = "behavior"
case = "../../../cases/linear/jit/native_registers.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
expect_output_contains = ["mix 78 29 267 28", "cmp 101011 100111 1011 10110", "fmix 12.625 -2.125 23", "fcmp 101011 100111 1011 10110"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

