[[tests]]
name = "native_division.nvm"
desc = "Integer and float divisions by values that are not constants, operands and quotient in every register, a divisor of -1: the same values on every back end (nvm)."
kind = "behavior"
case = "../../../cases/linear/jit/native_division.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
expect_output_contains = ["q 92 111 -18 45", "fq 3.0416666666666665 2.408333333333333"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

