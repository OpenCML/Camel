# Asserts that the function was compiled to native code: only where the JIT generates code
# (x86-64; elsewhere std::jit runs the bytecode interpreter, see test/tools/have-native-jit.mjs).
[[tests]]
name = "native_registers.inline_jit.compiled"
skip_unless = ["node", "test/tools/have-native-jit.mjs"]
desc = "Arithmetic and comparisons with more live values in one block than the JIT has registers, in every operand position of every register: the functions are compiled by the JIT, not left to the interpreter (the -vv log names them), and the values are the same."
kind = "behavior"
case = "../../../cases/linear/jit/native_registers.cml"
args = ["-vv", "${case}", "${run_inline_jit}"]
expect_exit = 0
expect_output_contains = ["mix 78 29 267 28", "cmp 101011 100111 1011 10110", "fmix 12.625 -2.125 23", "fcmp 101011 100111 1011 10110", "compiled & cached graph 'mix'", "compiled & cached graph 'cmp'", "compiled & cached graph 'fmix'", "compiled & cached graph 'fcmp'", "graph 'mix' is lowered again without values kept in registers"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "native_calls.nvm"
desc = "Self calls with six arguments and a constant argument, self tail calls that exchange and rotate their parameters, tail calls inside natively called activations: the same values on every back end (nvm)."
kind = "behavior"
case = "../../../cases/linear/jit/native_calls.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
expect_output_contains = ["wide 55 280 6308", "swap 12 21 12", "rot 654321 216543 321654", "nested 9 30 50"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

