[[tests]]
name = "fib_recursive.jit"
desc = "Checks classic recursive execution on JIT across several Fibonacci depths and return joins."
kind = "behavior"
case = "../../../cases/linear/jit/fib_recursive.cml"
args = ["${case}", "${run_jit}"]
expect_exit = 0
verify_script = """
({ input, assert, match }) => {
    assert(input.exit_code === 0, `camel exited ${input.exit_code}`)
    const found = match(/fib_recursive f0=([0-9]+) f1=([0-9]+) f10=([0-9]+) f15=([0-9]+)/, input.normalized.stdout)
    assert(Number(found[1]) === 0, `expected f0=0, got ${found[1]}`)
    assert(Number(found[2]) === 1, `expected f1=1, got ${found[2]}`)
    assert(Number(found[3]) === 55, `expected f10=55, got ${found[3]}`)
    assert(Number(found[4]) === 610, `expected f15=610, got ${found[4]}`)
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

