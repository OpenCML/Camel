[[tests]]
name = "sync_block_order.default"
desc = "A sync block runs its expressions in written order: as an arm ending in a value, nested in a sync block, with a multi-name let, as a lambda body. Pipeline: default (no pass)."
kind = "behavior"
case = "../../../cases/linear/runtime/sync_block_order.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim().split('\n').join(' | ')
assert(out === 'A1 | A2 | 2 | B1 | 3 | n1 | n2 | 33 | 1 pair | 2 after | 15 | L1 | 5', `unexpected output: ${out}`)
}
"""
timeout_ms = 20000

