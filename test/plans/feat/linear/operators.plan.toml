[[tests]]
name = "compound_assign.nvm"
desc = "Every compound assignment on every type that has one; %= ^= &= |= used to fail when run (progen F29) (nvm)"
kind = "behavior"
case = "../../../cases/linear/operators/compound_assign.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
const want = [
  "22",
  "20",
  "60",
  "8",
  "3",
  "81",
  "-2 -2",
  "1.75",
  "1.25",
  "5",
  "2.5",
  "6.25",
  "false",
  "true",
  "true",
  "true",
  "10",
  "9",
  "18",
  "4",
  "16",
  "1",
  "2",
  "1.75",
  "3.5",
  "7",
  "49",
].join('\n')
assert(out === want, `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

