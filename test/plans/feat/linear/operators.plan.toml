[[tests]]
name = "mod_assign_by_zero.nvm"
desc = "%= by zero is DivisionByZero at the operator, as % by zero is (nvm)"
kind = "negative"
case = "../../../cases/linear/operators/mod_assign_by_zero.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::DivisionByZero"
expect_diagnostic_code = "0x04000001"
expect_diagnostic_line = 11
expect_diagnostic_column = 7
expect_output_contains = ["2", "Attempted division by zero."]
expect_output_not_contains = ["not reached", "Floating point exception"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

