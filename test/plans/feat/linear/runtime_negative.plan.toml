[[tests]]
name = "sync_literal_operands.reference"
desc = "Effects reached through the operands of struct, tuple and array literals in a sync block run in written order, between the statements around the literal. Under: no pass (printed one, four, nine first: the operands were outside the block's ordering)."
kind = "behavior"
case = "../../../cases/linear/runtime/sync_literal_operands.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim().split(String.fromCharCode(10)).join(' | ')
assert(out === 'one | two | three | four | five | six | seven | eight | nine | twothreefivesixseveneight', `unexpected output: ${out}`)
}
"""
timeout_ms = 6000

