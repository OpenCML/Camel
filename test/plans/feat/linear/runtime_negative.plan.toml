id = "linear.runtime_negative"
order = 345
tier = "fast"
tags = ["feat", "linear", "runtime", "negative"]

[[tests]]
name = "divide_by_zero.nvm"
desc = "Checks runtime diagnostics report division by zero at the division expression (line and column)."
kind = "negative"
case = "../../../cases/linear/runtime/divide_by_zero.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::DivisionByZero"
expect_diagnostic_code = "0x04000001"
expect_diagnostic_line = 7
expect_diagnostic_column = 16
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000


[[tests]]
name = "recursion_depth_limit.nvm"
desc = "Non-tail recursion past the default limit of 1000 open calls stops with MaxRecursionDepthExceeded at the recursive call expression, the same position on every back end (NodeVM); depth(200) printed before it, nothing after."
kind = "negative"
case = "../../../cases/linear/runtime/recursion_depth_limit.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::MaxRecursionDepthExceeded"
expect_diagnostic_code = "0x04000004"
expect_diagnostic_line = 4
expect_diagnostic_column = 38
expect_stdout_contains = ["200"]
expect_stderr_contains = ["Maximum recursion depth (1000) exceeded"]
expect_output_not_contains = ["not reached"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

