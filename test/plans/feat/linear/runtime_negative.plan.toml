[[tests]]
name = "effects_outside_sync.nvm"
desc = "Every print of this case runs, whatever the body is: a write to a resource outside the program is used by the region it is written in (design principles 3.1), so an effectful call whose result is unused runs in a plain body too, and a nested sync block no longer drops its tail. Same output on every scheduler (nvm)."
kind = "behavior"
case = "../../../cases/linear/runtime/effects_outside_sync.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
expect_output_not_contains = ["never runs"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
assert(out === 'main start\nplain\nnested 1\nnested 2\nsuffix\nreturned first\nreturned\n6\nmain end', `unexpected output: ${out}`)
}
"""
timeout_ms = 10000

