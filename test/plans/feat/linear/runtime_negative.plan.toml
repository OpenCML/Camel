[[tests]]
name = "effects_outside_sync.nvm"
desc = "An effectful call whose result is unused runs only when the function body is a sync block (suffix spelling); in a plain body and in a prefix `sync func` it is absent from the graph (design principles 3.1, log 2.3). `wait` on it changes nothing, by design: the expression involves no `var`, so `wait` has nothing to order by, and that is not an error (2.6). The nested sync block is the one case still open (docs/technical/18_sync_control_semantics.md section 2.5): its current behaviour is locked, not endorsed. Same output on every scheduler (nvm)."
kind = "behavior"
case = "../../../cases/linear/runtime/effects_outside_sync.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
expect_output_not_contains = ["DROPPED"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim()
assert(out === 'KEPT main start\nKEPT suffix\nKEPT returned\n10\nKEPT main end', `unexpected output: ${out}`)
}
"""
timeout_ms = 10000

