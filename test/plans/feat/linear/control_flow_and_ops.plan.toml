[[tests]]
name = "float_arith.jit"
desc = "Checks JIT floating-point arithmetic stays within the expected numeric range."
kind = "behavior"
case = "../../../cases/linear/jit/float_arith.cml"
args = ["${case}", "${run_jit}"]
expect_exit = 0
verify_script = """
({ input, assert, match, approx }) => {
    assert(input.exit_code === 0, `camel exited ${input.exit_code}`)
    const found = match(/float_arith y=([0-9]+\.[0-9]+)/, input.normalized.stdout)
    assert(approx(Number(found[1]), 1.75, 1e-6), `expected y~=1.75, got ${found[1]}`)
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

