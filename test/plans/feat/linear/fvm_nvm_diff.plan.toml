# --- linear/faults: 2 cases ---

[[tests]]
name = "linear.faults.divide_min_by_minus_one"
desc = "The smallest integer divided by -1: the quotient does not fit, and the machine's division traps on it. Every back end gives the negation with wraparound (the smallest integer again) and 0 for the remainder, not SIGFPE;"
case = "../../../cases/linear/faults/divide_min_by_minus_one.cml"

[[tests]]
name = "linear.faults.subscript_step"
desc = "A subscript slice with a step other than 1 takes every step-th element. Until the strided views the result is a copy, but the elements are the same on every back end (design principles 5.4). A negative step runs backwards;"
case = "../../../cases/linear/faults/subscript_step.cml"

