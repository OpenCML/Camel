case = "../../../cases/linear/nvm/mutual_tail.cml"

[[tests]]
name = "linear.nvm.nested_array_type"
desc = "The type expression 'T[][]' is an array of arrays of T (and 'T[][][]' one level more), in a parameter, a return type, a 'var' and a lambda. It used to be taken as 'T[]', so that 'u[1]' had the element type and 'first(u[1])' found no overload."
case = "../../../cases/linear/nvm/nested_array_type.cml"

[[tests]]
name = "linear.nvm.neuro"
desc = "Verifies a small numeric pipeline combining arrays, zip/map/reduce, and floating-point math for neural-style computation."
case = "../../../cases/linear/nvm/neuro.cml"

[[tests]]
name = "linear.nvm.var"
desc = "Verifies mutable variables passed by reference through sync calls are updated in place and observed by the caller."
case = "../../../cases/linear/nvm/var.cml"

[[tests]]
name = "linear.nvm.var_params"
desc = "'var' parameters are passed by reference: what the callee assigns to one is what the caller reads from the variable it passed, after the call (docs/language/04_execution_model.md 4.4.2, docs/technical/18_sync_control_semantics.md)."
case = "../../../cases/linear/nvm/var_params.cml"

[[tests]]
name = "linear.nvm.zen"
desc = "Verifies the builtin this module can be imported and executed through a trivial standard-library call."
case = "../../../cases/linear/nvm/zen.cml"

# --- linear/byref: 10 cases ---

[[tests]]
name = "linear.byref.captured_write_order"
desc = "A function, or a branch arm, that writes a captured variable (a module-level one included) is a write of that variable where it is called or entered, exactly like a call with a 'var' argument (docs/design-principles.cn.md 3.5): reads written after it see the..."
case = "../../../cases/linear/byref/captured_write_order.cml"

[[tests]]
name = "linear.byref.captured_write_value"
desc = "The value a call hands on when it writes captured variables (docs/design/effects/edges.cn.md 5.6;"
case = "../../../cases/linear/byref/captured_write_value.cml"

[[tests]]
name = "linear.byref.lambda_capture_ignored"
desc = "The same lambda with nothing reading the 'Ref' after the call: the write runs anyway."
case = "../../../cases/linear/byref/lambda_capture_ignored.cml"

[[tests]]
name = "linear.byref.lambda_capture_write"
desc = "A lambda bound to a name in the same function: the call site can see its body, so 'f()' is recorded as a write of the reference 'c', and the read written after it sees the new content."
case = "../../../cases/linear/byref/lambda_capture_write.cml"

[[tests]]
name = "linear.byref.order_before_after"
desc = "'A(i); modify(i); B(i)' in a sync body (docs/language/04_execution_model.md 4.4): the compiler orders A -> modify -> B by the writing order of the body. A observes the old value of i, B the new one, and A has completed before modify starts."
case = "../../../cases/linear/byref/order_before_after.cml"

[[tests]]
name = "linear.byref.order_direct_user"
desc = "A sync body orders its statements: in 'before(i + 1); modify(i)' the call of 'before' is ordered before 'modify', even though 'before' never touches 'i'."
case = "../../../cases/linear/byref/order_direct_user.cml"

[[tests]]
name = "linear.byref.path_assigned_allocs"
desc = "A path assignment on a 'var' array does not copy (design principles 3.5, 10.5). 'std::mem::blocks()' counts the numeric array blocks allocated, so the writes can be asked instead of argued: the array is 40 ints (320 bytes), past the 256 bytes an array may..."
case = "../../../cases/linear/byref/path_assigned_allocs.cml"

[[tests]]
name = "linear.byref.var_param_reference"
desc = "A 'var' parameter is 'passed in by value, passed back by value' (docs/design-principles.cn.md 3.5): the argument's value enters the callee's own name, a write in the callee rebinds that name, and the value is written back to the caller's name when the call..."
case = "../../../cases/linear/byref/var_param_reference.cml"

[[tests]]
name = "linear.byref.var_param_slot_array"
desc = "Writing an element of a string array through a 'var' parameter changes that variable only: another name that holds the same array keeps its value (design principles 3.5, values)."
case = "../../../cases/linear/byref/var_param_slot_array.cml"

[[tests]]
name = "linear.byref.var_rule_subpasses"
desc = "One rule for every rewriting pass: a read of a variable is not moved across a write to it, and a write is not merged or dropped while a later read is reachable. One function per rewriting sub-pass, each built to tempt that sub-pass."
case = "../../../cases/linear/byref/var_rule_subpasses.cml"

