# --- linear/toplevel_var: 5 cases ---

[[tests]]
name = "linear.toplevel_var.argument_order"
desc = "Two uses of one resource in one expression happen in written order, arguments and operands from left to right (design principles 3.3): a read of the variable written before a call that writes it sees the value from before the call, whatever the variable is."
case = "../../../cases/linear/toplevel_var/argument_order.cml"

[[tests]]
name = "linear.toplevel_var.counter"
desc = "A top-level 'var' as a counter: the functions that touch it are not pure, the module's functions capture it so no clause names it, and in a sync body the calls run in written order. 1 2 3 three calls 3 the variable after them"
case = "../../../cases/linear/toplevel_var/counter.cml"

[[tests]]
name = "linear.toplevel_var.exported"
desc = "An exported top-level 'var' is one resource of the module that declares it: the importing module reads and writes the same variable the module's own function does."
case = "../../../cases/linear/toplevel_var/exported.cml"

[[tests]]
name = "linear.toplevel_var.initial_value"
