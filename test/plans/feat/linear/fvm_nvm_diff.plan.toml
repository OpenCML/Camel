[[tests]]
name = "loops.arm_loops_edges"
desc = "The edges of a loop written in a branch arm: a loop that runs no round, 'for... while', a loop in an arm inside a loop's body, a loop of a loop inside an arm, a loop and another 'if' in one arm (a region three deep), the same in a macro function's arm, four..."
case = "../../../cases/loops/arm_loops_edges.cml"

[[tests]]
name = "loops.captures"
desc = "The condition and the body read what they use where they are (design principles 3.10): the constants 'limit' (condition) and 'step', 'scale' (body) are evaluated in place and are not captures."
case = "../../../cases/loops/captures.cml"

[[tests]]
name = "loops.compiled"
desc = "Loops of regions run by compiled code (docs/technical/39_loops.md, section 4): main calls these functions through the interpreter's direct call, which compiles each of them at its first call under 'std::jit hot_threshold=0'."
case = "../../../cases/loops/compiled.cml"

[[tests]]
name = "loops.discrete_effectful_value"
desc = "A value produced by an effectful call whose type is discrete: 'side' returns an 'int' computed from 'x', and 'float(n)' reads it as a number."
case = "../../../cases/loops/discrete_effectful_value.cml"

[[tests]]
name = "loops.discrete_loop_iterable"
desc = "A 'loop' iterating over an 'int[]' computed from the differentiated parameter. The elements are discrete, so their derivative is zero by definition (design principles 9.9): the sum of the elements is a constant of the call, 6 at w = 2, and the gradient is 0..."
case = "../../../cases/loops/discrete_loop_iterable.cml"

[[tests]]
name = "loops.discrete_loop_state"
desc = "A 'loop' state whose elements are discrete ('int[]') and whose next value is computed from the differentiated parameter."
case = "../../../cases/loops/discrete_loop_state.cml"

[[tests]]
name = "loops.discrete_struct_field"
desc = "A differentiable value read through a struct and turned into data: 'n' is an 'int' field computed from 'x', and 'float(n)' reads it as a number."
case = "../../../cases/loops/discrete_struct_field.cml"

[[tests]]
name = "loops.edges"
desc = "Edges: a 'for' over an empty array and a 'while' whose condition is false at once leave the first state; three values of state; a loop at the top level of the module; a loop whose state is an array built round by round;"
case = "../../../cases/loops/edges.cml"

[[tests]]
name = "loops.effects"
desc = "A loop body that is a sync block runs its effects every round, in order; the value after the last statement is the next state. A body that is not a sync block runs only what its value needs. The condition sees the state, the body the state and the element."
case = "../../../cases/loops/effects.cml"

[[tests]]
name = "loops.grad_array_loop"
desc = "Gradients of arrays through 'loop' (design principles 9.9, 3.10): - an array captured by a loop and read by index accumulates each round's element gradient (the reverse of the read is a scatter-add);"
case = "../../../cases/loops/grad_array_loop.cml"

[[tests]]
name = "loops.grad_through_loop"
desc = "Differentiating through a 'loop' (design principles 9.9): the forward loop keeps each round's residuals in its collection slots and the reverse pass is a loop of its own over them, so the gradient of f(x) = x⁴ at 2 is 4·x³ = 32."
case = "../../../cases/loops/grad_through_loop.cml"

[[tests]]
name = "loops.hof_block_alloc"
desc = "hof_block_alloc"
case = "../../../cases/loops/hof_block_alloc.cml"

[[tests]]
name = "loops.iterate_empty"
desc = "A loop with no round keeps its first state: an empty string, an empty map, a tensor whose first extent is 0, an empty array; and 'for ... while' whose condition is false at once takes no element."
case = "../../../cases/loops/iterate_empty.cml"

[[tests]]
name = "loops.iterate_map"
desc = "'for' over a map takes its (key, value) pairs in key order (design principles 11.3), not in insertion order: the literal below is written out of order and the keys still come out ascending."
case = "../../../cases/loops/iterate_map.cml"

[[tests]]
name = "loops.iterate_string"
desc = "'for' over a string takes its code points, each a one-character string, as 's[i]' gives them (design principles 11.1): an ASCII text and a text of multi-byte characters have one round per code point, the characters are the same values 's[i]' gives, an empty..."
case = "../../../cases/loops/iterate_string.cml"

[[tests]]
name = "loops.iterate_tensor"
desc = "'for' over a tensor takes its elements along the first dimension: a rank-2 tensor gives the rank-1 sub-tensor of each row (a view of the same data), and a rank-1 tensor gives its elements, which are values of the element type — a value with no dimension is..."
case = "../../../cases/loops/iterate_tensor.cml"

[[tests]]
name = "loops.let_loop_then_statement"
desc = "'let n = loop ...' with a statement after it, in functions that are not 'sync'. The loop's condition and body are regions;"
case = "../../../cases/loops/let_loop_then_statement.cml"

[[tests]]
name = "loops.loop_collect_multi"
desc = "A collection output in a loop with several states: the body returns the next values of the states and then the appended element, and the loop's value is the states followed by the collection arrays."
case = "../../../cases/loops/loop_collect_multi.cml"

[[tests]]
name = "loops.open_rank_round_rank1"
desc = "What a round of a 'for' hands over is the type its port declares (design principles 5.4, ArrayType::firstDimensionElement): the element itself for a rank-1 array, the row one dimension shorter above it, and the same open-rank array when the rank is open."
case = "../../../cases/loops/open_rank_round_rank1.cml"

[[tests]]
name = "loops.open_rank_round_rank2"
desc = "The same rule with a rank-2 value: 'x' is passed to a parameter of open rank ('f32[...]' is 'f32[...]'), so the round is declared as the open-rank array one dimension fewer (design principles 5.4);"
case = "../../../cases/loops/open_rank_round_rank2.cml"

[[tests]]
name = "loops.outer_ref"
desc = "A loop body reads a 'Ref' the loop did not make (design principles 3.10 with 10.5). The reference a counted value is born with comes back at its last use, and a loop's execution order is not linear: a round runs its range again."
case = "../../../cases/loops/outer_ref.cml"

[[tests]]
name = "loops.recursion"
desc = "A loop is not a recursion: running many rounds takes no depth, and a loop inside a deep (non- tail) recursion still runs. The recursion limit counts the recursion only."
case = "../../../cases/loops/recursion.cml"

[[tests]]
name = "loops.reduce_view"
desc = "a value that survives an element is never a compact-element view. 'reduce' keeps its accumulator across rounds."
case = "../../../cases/loops/reduce_view.cml"

[[tests]]
name = "loops.shapes"
desc = "The four shapes of the 'do' form (design principles 3.10): one state over an array, two states under a condition (the loop's value is their tuple), a struct as the state, and 'for ... while' with an 'if' as the body."
case = "../../../cases/loops/shapes.cml"

[[tests]]
name = "loops.state_in_place"
desc = "item 4: the old value of a loop state is not visible once the next round begins, so a body that only ever appends to its state may write the state's array in place (design principles 10.5), the same criterion as 't = t->relu'."
case = "../../../cases/loops/state_in_place.cml"

[[tests]]
name = "loops.state_in_place_block"
desc = "The in-place append of a loop state does not depend on how the body is written (design principles 10.5): a body that is a block, binds names with 'let' and hands the next state back with 'return' appends to the state's own array exactly as the body that is..."
case = "../../../cases/loops/state_in_place_block.cml"

[[tests]]
name = "loops.state_in_place_multi"
desc = "second item: the in-place write of a loop state, proved for several states at once. The decision is per state (Builder::markLoopStateInPlace): a state whose first value is a literal and whose only use in the body is 'state->append<v>' is appended to in place;"
case = "../../../cases/loops/state_in_place_multi.cml"

[[tests]]
name = "loops.struct_state"
desc = "A struct as a loop's state (item 3): the state is one value, the struct, and each round gives the next struct instead of assigning its fields."
case = "../../../cases/loops/struct_state.cml"

[[tests]]
name = "loops.tuple_destructure"
desc = "Several values of state: the body gives a tuple of them, the loop's value is that tuple, and 'let (a, b) = loop ...' takes it apart. The state names are seen by the condition and the body only."
case = "../../../cases/loops/tuple_destructure.cml"

[[tests]]
name = "loops.zero_leaf_state"
desc = "A loop whose state is a struct with no leaves, the zero-leaf case of 'a struct's fields are the loop's state components' (design principles 3.10, the split of)."
case = "../../../cases/loops/zero_leaf_state.cml"

