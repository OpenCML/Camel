id = "linear.fvm_nvm_diff"
order = 362
tier = "slow"
tags = ["feat", "linear", "fvm", "nvm", "differential"]

# The differential plan of design principle 9.2 (`internal/plans/2026-11-24-default-is-fvm.cn.md`,
# "the differential test"): `std::nvm` is the reference semantics, so one program is run on both
# interpreters and the second is read against the first -- exit code, standard output and the
# position of every diagnostic it reported, byte for byte. `linear.fvm_nvm_agree` does that on
# seven cases chosen by hand; this plan does it on a batch chosen by a rule and named here.
#
# **The rule, as it was applied.** A case is in this plan when some entry of a
# `test/plans/feat/linear/*.plan.toml` is
#
#   1. `kind = "behavior"` with `expect_exit = 0`, and its `args` is exactly
#      `["${case}", <one scheduling pass>]` -- `${backend}`, `${run_nvm}`, `${run_fvm}`,
#      `${run_jit}`, `${run_prl}`, or the same four spelled out (`std::nvm`, `std::fvm`,
#      `std::jit`, `std::prl`). Not any `std::` pass: a translation pass in front of the run
#      (`std::opt`, `std::macro`) is part of that case's program, and dropping it changes the
#      program. Six cases are out for that alone: `linear/byref/{var_writes_through_recursion,
#      var_read_before_callee_write}.cml` and `loops/grad_{array_index,loop_collect}.cml` (a
#      translation pass and no bare run), `linear/jit/{framed_loops,framed_faults}.cml` (`envs`,
#      which sets the size of the program the case runs).
#   2. an entry with no `envs`, no `tool`, no `skip_unless` and no `sweep` -- nothing that
#      makes its run differ from `camel <case> <pass>`, which is what this plan runs.
#
# That is: the plan already runs the case as a whole program with nothing but the scheduling pass,
# so the program needs no back-end-specific setup, which is what "both back ends should be able to
# run it" means; and the entry that runs it already exists, so this plan adds no case to the tree.
# 120 cases match; the three the curated plan owns (`linear/backend_agree/{sort4,sort5,
# ordered_effects}`) stay there.
#
# **Two more conditions, and they are measurements, not taste.** A batch of comparisons is only a
# comparison of the two back ends if the program's own output does not change between two runs of
# the same back end, and if the program comes up at all:
#
#   3. the program's output is the program's, not the clock's. Five matching cases print a duration
#      read from the clock and are out: `linear/nvm/{acc,fib,fib1,fib2}.cml` (`from time`) and
#      `linear/jit/perf_fib_smoke.cml` (`from perf`). The two readings made before this line was
#      written ran them against each other and went red exactly as they must, on the field that
#      carries the number: the first (123 cases) on `differs from linear.nvm.acc.nvm:
#      stdout_normalized` with `computed in 0.003371 seconds` on one side, the second (110 cases --
#      the `from perf` shape was found there, because the first filter looked for `time` and
#      missed it) on `differs from linear.jit.perf_fib_smoke.nvm: stdout_normalized` with
#      `2.3479 +/- 0.1754 ms`. That is not a back-end difference; it is the wall clock, and a case
#      whose output carries one cannot agree with itself, let alone with its twin.
#   4. the case comes up. Measured with the rule above, three cases do not compile
#      at that tip -- `linear/nvm/lambda.cml` (`NoMatchingFunction` for `(y: int) => string` over a
#      `Range`), `linear/nvm/render.cml` (the same shape), `linear/runtime/var_read_before_region.cml`
#      (a loop-state type error at its first loop) -- and they are out. Their own entries
#      (`closures_and_state.lambda_filter.{nvm}`, `collections_and_structs.render_grid.nvm`,
#      `var_read_before_region.nvm`) are red with them, so this plan must not become a second owner
#      of that red. A case that never started cannot agree with its twin about anything, which is
#      why the first reading reported it red and why it is gone from the batch rather than silenced.
#
# **This plan has 109 cases**, by family:
#   linear/nvm (17)
#   linear/byref (10)
#   linear/jit (19)
#   linear/runtime (10)
#   linear/faults (2)
#   linear/match (3)
#   linear/operators (4)
#   linear/subscript (3)
#   linear/toplevel_var (5)
#   linear/fvm (1)
#   loops (31)
#   macro (1)
#   parse/syntax (1)
#   modules/tensor (1)
#   modules/autodiff (1)
#
# **Both back ends must start.** `expect_exit = 0` holds for each half, so a case that does not
# compile (exit 1) or does not start is red on its own entry rather than agreeing with its twin
# about nothing. A twin whose reference never ran is reported as "reference back end did not run",
# never as a match.
#
# **A red here is a defect, not a difference.** Design principle 9.2 and the rule
# (backlog): there is no class of legal fvm/nvm difference -- execution semantics are one,
# nvm is the reference, so a case whose halves disagree is fvm's defect (or a case that pins nvm-only
# non-semantic output, which is then written with `std::nvm` explicitly, not absorbed here).
# Nothing in this file is pinned to fvm, and nothing here normalises a difference away.
#
# **Why slow.** The batch is 109 programs run twice; it reads in well under a minute on a
# quiet host but it is not part of the developer loop. It is a named target, `--tier slow` runs it,
# and this file is named in `SLOW_PLANS` (`scripts/plan-inventory.mjs`) so the inventory reaches it.

[defaults]
kind = "behavior"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized", "diagnostics"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

