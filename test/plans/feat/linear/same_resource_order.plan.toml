[[tests]]
name = "same_resource_order_call.nvm"
desc = "A call whose callee prints is ordered with the `println` calls beside it: `1`, `2`, `3` (nvm)."
kind = "behavior"
case = "../../../cases/linear/runtime/same_resource_order_call.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 123
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const lines = input.normalized.stdout.trim().split('\n')
assert(lines.length === 3, `expected 3 lines, got ${lines.length}: ${lines.join(',')}`)
assert(lines.join(',') === '1,2,3', `expected 1,2,3, got ${lines.join(',')}`)
}
"""
timeout_ms = 10000

