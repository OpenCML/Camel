// two answers are opposite for the ordinary `a = a + 1` of a counter. With the old answer this file
// did not compile under `-Werror`.
const unused = input.normalized.stderr.split('\n').filter((l) => l.includes('name=SemanticDiag::UnusedAssignedValue')).map((l) => (l.match(/cml:(\d+:\d+):/) || [])[1])
assert(unused.length === 0, `every write in this file has its value read, so none is reported: ${unused.join(', ')}: ${input.normalized.stderr}`)
}
"""
timeout_ms = 20000