# The reason this file was changed, as a run rather than as a sentence: under `-Werror` the case
# compiles and runs. Before the criterion was fixed the same command exited 1 with three
# UnusedAssignedValue errors on the writes at 52:7, 85:7 and 87:7 -- each of them a write whose
# value the `let` below it reads -- and the program never ran. A warning that is true here is still
# an error (`camel -Werror` means that, and this entry does not change it); what it pins is that no
# true one is left in this file to refuse it.
[[tests]]
name = "var_read_before_write.werror"
desc = "The counter-and-read shapes this case is made of are legal programs, so `camel -Werror` compiles and runs it: exit 0, the same seven lines of output, and no `SemanticDiag::UnusedAssignedValue` in the report -- before the criterion was fixed the same command exited 1 on the three writes at 52:7, 85:7 and 87:7, whose values the `let` under each of them reads, and the program did not run at all. Pipeline: default (interpreter), with `-Werror`."
kind = "behavior"
case = "../../../cases/linear/runtime/var_read_before_write.cml"
args = ["-Werror", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const want = ['int 2 1', 'int 2 1', 'array [7, 7] [1, 1]', 'arm 0 5 1', 'loop 0 2', 'steps 2 3', 'after 2 2']
const out = input.normalized.stdout.trim().split('\n')
assert(JSON.stringify(out) === JSON.stringify(want), `the program runs under -Werror and prints what it printed without it: ${out.join(' | ')}`)
const unused = input.normalized.stderr.split('\n').filter((l) => l.includes('name=SemanticDiag::UnusedAssignedValue')).map((l) => (l.match(/cml:(\d+:\d+):/) || [])[1])
assert(unused.length === 0, `no write here has an unread value, so -Werror has nothing to refuse: ${unused.join(', ')}: ${input.normalized.stderr}`)
}
"""
timeout_ms = 20000

