id = "linear.var_read_before_write"
order = 346
tier = "fast"
tags = ["feat", "linear", "var", "effects"]

# Design principles 3.5 and docs/design/effects/edges.cn.md 5.6: a read of a `var` takes the value
# of the write written before it -- before the first write, the cell `:var/new` made -- and the
# writes written after it are ordered after it. That is a property of where the read is written,
# not of whether the body is a `sync` block: a read outside one used to reach the value a later
# write left in the cell (`var a = 1; let b = a; modify(a)` printed `a=2 b=2`).
#
# What a `sync` block adds is the other direction (3.5, F3): a statement of it runs whether or not
# the variable is read afterwards. This file used to read that as "every write here is reported by
# SemanticDiag::IgnoredSideEffect", one warning per write outside a sync block -- eight of them.
# the rule (design principles 3.1, 3.5) retired that reading for `var`, and the
# the rule retired the last two branches of it: a write to one of the program's own
# variables is a value, so no `var` argument, assignment, arm or loop body is reported by that
# diagnostic. A write whose value nobody reads is reported as a value
# (SemanticDiag::UnusedAssignedValue). The six entries below were changed on those rulings, not to
# make anything pass: they asserted the retired rule.
#
# Each function below is written outside a sync block; `main` is a `sync` block so that they run.
# Every value is asserted on both sides: the read before the write keeps the old value, and the
# read after it takes the new one.
#
# The entries also asserted, until this lane, that three writes here -- 52:7, 85:7 and 87:7 -- have
# values nobody reads. They do not: each of the three is read by the `let` written right after it.
# The expectation was true of the diagnostic's implementation and false of its text: the warning
# asked whether the write's own node had a consumer, and a read of a `var` in a body that is not a
# `sync` block takes the value the write stores and not the write (the builder folds such a read to
# the write's second operand), so the three writes were reported while their values were being read.
# That made `camel -Werror` refuse this file, which is why the expectation is withdrawn here rather
# than kept: it locked a false report in place, and the report is what changed.

[[tests]]
name = "var_read_before_write.default"
desc = "In a body that is not a sync block, a read of a `var` made before a write (a var argument, an assignment, a branch arm, a loop body) is the value the variable had at that point, and a read made after the write takes the new one. Eight SemanticDiag::IgnoredSideEffect were expected for the writes outside a sync block; the rule (design principles 3.1 and 3.5) makes a write to a `var` a value and not an effect, so a `var` argument and an assignment are no longer reported by it, and neither is the arm at 66:13 or the loop body at 76:5 -- the rule retires both remaining `var` branches -- with the three writes whose value nobody reads reported as SemanticDiag::UnusedAssignedValue at 52:7, 85:7 and 87:7 -- and no SemanticDiag::UnusedAssignedValue at all now: those three writes each have their value read by the `let` written right after them, so naming them as writes whose value nobody reads was a false report, and the diagnostic asks the question its own text asks (whether any read takes the value this write stores) instead of whether the write's own node has a consumer. Pipeline: default (interpreter)."
kind = "behavior"
case = "../../../cases/linear/runtime/var_read_before_write.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const want = ['int 2 1', 'int 2 1', 'array [7, 7] [1, 1]', 'arm 0 5 1', 'loop 0 2', 'steps 2 3', 'after 2 2']
const out = input.normalized.stdout.trim().split('\n')
assert(JSON.stringify(out) === JSON.stringify(want), `unexpected output: ${out.join(' | ')}`)
// The rule this case was written for is retired: it required a diagnostic for every write outside
// a sync block, and expected eight SemanticDiag::IgnoredSideEffect -- one per `var` argument, per
// assignment, per branch arm and per loop body. the rule (design principles 3.1,
// 3.5) makes a write to a `var` a value and not an effect: the write a `var` argument takes is
// handed back where the call stands, and an assignment is that same shape, so neither is reported
// by IgnoredSideEffect any more, and neither is an arm's write or a loop body's: the 2026-11-16
// ruling retires both remaining `var` branches of that warning, because a write to the program's
// own variable is a value whatever block it is written in. Asserted as none at all: a warning
// here is the retired reading coming back.
const ignored = input.normalized.stderr.split('\n').filter((l) => l.includes('name=SemanticDiag::IgnoredSideEffect')).map((l) => (l.match(/cml:(\d+:\d+):/) || [])[1])
assert(ignored.length === 0, `no write outside a sync block is reported for a var: ${ignored.join(', ')}: ${input.normalized.stderr}`)
// A write is reported by SemanticDiag::UnusedAssignedValue only when the value it stores is read by
// nobody, and every write in this file is read: the three the case used to name -- 52:7, 85:7 and
// 87:7 -- are each read by the `let` written right after them, the `x = v` of `swap` by the caller
// that reads the `var` back, and the write in the loop body by the read after the loop. Asserted as
// none, and it is the assertion this case got wrong: it named those three as "writes whose value
// nobody reads" and so locked a false report in place. What the diagnostic asked then was whether
// the write's own node had a consumer; what it asks now is whether the value has a reader, and the
// two answers are opposite for the ordinary `a = a + 1` of a counter. With the old answer this file
// did not compile under `-Werror`.
const unused = input.normalized.stderr.split('\n').filter((l) => l.includes('name=SemanticDiag::UnusedAssignedValue')).map((l) => (l.match(/cml:(\d+:\d+):/) || [])[1])
assert(unused.length === 0, `every write in this file has its value read, so none is reported: ${unused.join(', ')}: ${input.normalized.stderr}`)
}
"""
timeout_ms = 20000

