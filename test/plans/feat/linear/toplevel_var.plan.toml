[[tests]]
name = "err_uses_other"
desc = "Reading a top-level var is a use of it: a clause that names another resource does not keep its promise, and the report names the variable."
kind = "negative"
case = "../../../cases/linear/toplevel_var/err_uses_other.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::UsesPromiseViolated"
expect_output_contains = ["err_uses_other::cnt"]

[[tests]]
name = "err_pure_read"
desc = "A function that reads a top-level var is not pure: pure promises the empty set."
kind = "negative"
case = "../../../cases/linear/toplevel_var/err_pure_read.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::UsesPromiseViolated"
expect_output_contains = ["err_pure_read::cnt"]

[[tests]]
name = "err_pure_parameter"
desc = "A function that writes a top-level var says so in its type, and a pure parameter refuses it."
kind = "negative"
case = "../../../cases/linear/toplevel_var/err_pure_parameter.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::NoMatchingFunction"
expect_output_contains = ["uses err_pure_parameter::cnt"]

[[tests]]
name = "grad_refused"
desc = "Gradients do not flow through a top-level var either: the pass refuses, as it does for any var."
kind = "negative"
case = "../../../cases/linear/toplevel_var/grad_refused.cml"
args = ["${case}", "std::macro"]
expect_exit = 1
expect_output_contains = ["Gradients do not flow through variables"]
