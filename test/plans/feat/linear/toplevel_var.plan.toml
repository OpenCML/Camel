id = "linear.toplevel_var"
order = 347
tier = "fast"
tags = ["feat", "linear", "var", "resources", "modules"]
desc = "A var at the top level of a module is a resource of the module (design principles 3.5): read and written by functions, exported, named in uses, inferred, ordered like any effect"

[defaults]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 20000

[[tests]]
name = "exported.default"
desc = "An exported top-level var is one resource: the importing module reads it and assigns it, and the module's own function sees the same variable. Pipeline: default."
kind = "behavior"
case = "../../../cases/linear/toplevel_var/exported.cml"
args = ["${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim().split('\n').join(' | ')
assert(out === '1 2 2 | 11 11', `unexpected output: ${out}`)
}
"""

