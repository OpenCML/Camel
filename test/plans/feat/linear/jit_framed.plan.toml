id = "linear.jit_framed"
order = 356
tier = "fast"
tags = ["feat", "linear", "jit", "codegen"]
desc = "Graphs that need the runtime, compiled by std::jit as framed code (docs/technical/07_jit_architecture.md, section 17): operators, casts, struct and tuple access, match, calls of other graphs, calls through function values and higher-order operators"

# Framed code calls C++ helpers for operators and leaves to its driver for calls of Camel
# functions. Every test runs the same program on the four back ends and under std::opt::inline
# std::jit, which must agree; the `.compiled` tests then check in the -vv log that the functions
# were compiled, and as which kind of code, so that an agreement reached because everything fell
# back to the interpreter does not pass.

[defaults]
kind = "behavior"
case = "../../../cases/linear/jit/framed_operators.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl", "inline_jit"]
backends_agree = ["exit_code", "stdout_normalized", "diagnostics"]
expect_output_not_contains = ["Segmentation fault", "dumped core", "GC invariant violated"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 30000

# --- values -----------------------------------------------------------------------------------

[[tests]]
name = "framed.operators"
desc = "Operators in tail loops, match on int and string, struct and tuple values, mutual recursion, a call through a function value, map and reduce in a loop: the same values on every back end."
expect_exit = 0
expect_stdout_starts_with = "collatz 111 118\nrepeat >ababababab\nsum_at 31\nmean 3.875\nweigh 3210\nwalk 5050 -100\nswap_sum 1\nparity true false\nfib 6765\ntwice 284626\ntotals 14415\n"

[[tests]]
name = "framed.operators.compiled"
desc = "Under std::jit those functions are compiled as framed code (fib, whose branch arms are part of it, as frameless code), and the values are the same."
backends = false
skip_unless = ["node", "test/tools/have-native-jit.mjs"]
sweep = false
args = ["--gc", "mark-sweep", "-vv", "${case}", "std::jit"]
envs = ["CAMEL_GC_ENABLE_YOUNG_COPYING=0", "CAMEL_GC_POISON=0"]
expect_exit = 0
expect_output_contains = ["compiled & cached graph 'collatz' as framed code", "compiled & cached graph 'repeat' as framed code", "compiled & cached graph 'sum_at' as framed code", "compiled & cached graph 'mean' as framed code", "compiled & cached graph 'name_of' as framed code", "compiled & cached graph 'weight' as framed code", "compiled & cached graph 'weigh' as framed code", "compiled & cached graph 'walk' as framed code", "compiled & cached graph 'swap_sum' as framed code", "compiled & cached graph 'is_even' as framed code", "compiled & cached graph 'is_odd' as framed code", "compiled & cached graph 'fib' as frameless code", "compiled & cached graph 'twice' as framed code", "compiled & cached graph 'scaled_total' as framed code", "compiled & cached graph 'totals' as framed code", "collatz 111 118", "weigh 3210", "twice 284626", "totals 14415"]
expect_output_not_contains = ["compile skipped", "Segmentation fault", "dumped core"]

[[tests]]
name = "framed.operators.inline.compiled"
desc = "The same after std::opt::inline, where the branch arms are part of the functions: nothing is left to the interpreter for a construct of the bytecode."
backends = false
skip_unless = ["node", "test/tools/have-native-jit.mjs"]
sweep = false
args = ["--gc", "mark-sweep", "-vv", "${case}", "std::opt::inline", "std::jit"]
envs = ["CAMEL_GC_ENABLE_YOUNG_COPYING=0", "CAMEL_GC_POISON=0"]
expect_exit = 0
expect_output_contains = ["compiled & cached graph 'collatz' as framed code", "compiled & cached graph 'weigh' as framed code", "compiled & cached graph 'fib' as frameless code", "collatz 111 118", "weigh 3210", "totals 14415"]
expect_output_not_contains = ["compile skipped", "Segmentation fault", "dumped core"]

[[tests]]
name = "framed.operators.gc_stress"
# Slow layer: measured 14.5 s in the full serial run.
tier = "milestone"
desc = "The same with a collection at every seventh safepoint and the heap verified before and after: framed code keeps every reference in its pool frame, where the collector finds it."
backends = ["fvm", "jit", "inline_jit"]
envs = ["CAMEL_GC_STRESS_SAFEPOINT=7", "CAMEL_GC_VERIFY=1"]
sweep = false
timeout_ms = 240000
expect_exit = 0
expect_stdout_starts_with = "collatz 111 118\nrepeat >ababababab\nsum_at 31\nmean 3.875\nweigh 3210\nwalk 5050 -100\nswap_sum 1\nparity true false\nfib 6765\ntwice 284626\ntotals 14415\n"

[[tests]]
name = "framed.operators.moving"
desc = "The same with the generational collector and safepoint poisoning: every safepoint moves every young object and poisons where it was, so a reference that compiled code kept in a register or baked into its code across a safepoint would fault."
backends = ["fvm", "jit_hot_threshold0", "inline_jit_hot_threshold0"]
envs = ["CAMEL_GC_POISON=1"]
sweep = false
timeout_ms = 240000
expect_exit = 0
expect_stdout_starts_with = "collatz 111 118\nrepeat >ababababab\nsum_at 31\nmean 3.875\nweigh 3210\nwalk 5050 -100\nswap_sum 1\nparity true false\nfib 6765\ntwice 284626\ntotals 14415\n"

[[tests]]
name = "framed.operators.moving.compiled"
desc = "With the generational collector every function is still compiled, as the same kind of code as with mark-sweep: compiled code reads object constants from the static area instead of containing their addresses."
backends = false
skip_unless = ["node", "test/tools/have-native-jit.mjs"]
sweep = false
args = ["--gc", "generational", "-vv", "${case}", "std::opt::inline", "std::jit"]
expect_exit = 0
expect_output_contains = ["compiled & cached graph 'collatz' as framed code", "compiled & cached graph 'repeat' as framed code", "compiled & cached graph 'fib' as frameless code", "weigh 3210", "totals 14415"]
expect_output_not_contains = ["compile skipped", "Segmentation fault", "dumped core", "GC invariant violated"]

# --- faults -----------------------------------------------------------------------------------

[[tests]]
name = "framed.faults.isolated"
desc = "An index out of range, a remainder by zero, a division by zero and a recursion past the limit, raised from compiled functions inside `attempt`: each is an error value at the boundary, and the functions run again afterwards."
case = "../../../cases/linear/jit/framed_faults.cml"
envs = ["FAULT=none"]
expect_exit = 0
expect_stdout_starts_with = "62\n14\n14\n58\nIndexOutOfRange\nDivisionByZero\nDivisionByZero\nMaxRecursionDepthExceeded\n62\n58\nisolated\ndone\n"

[[tests]]
name = "framed.faults.index"
desc = "An operator's fault (index out of range) raised from a helper of compiled code: the located diagnostic of the interpreters."
case = "../../../cases/linear/jit/framed_faults.cml"
envs = ["FAULT=index"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::IndexOutOfRange"
expect_diagnostic_line = 15
expect_diagnostic_column = 14
expect_output_not_contains = ["done", "Segmentation fault", "dumped core"]

[[tests]]
name = "framed.faults.rem"
desc = "A remainder by zero (an operator) in compiled code."
case = "../../../cases/linear/jit/framed_faults.cml"
envs = ["FAULT=rem"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::DivisionByZero"
expect_diagnostic_line = 23
expect_diagnostic_column = 14
expect_output_not_contains = ["done", "Segmentation fault", "dumped core"]

[[tests]]
name = "framed.faults.div"
desc = "A division by zero, which compiled code checks itself, in a graph that also calls an operator."
case = "../../../cases/linear/jit/framed_faults.cml"
envs = ["FAULT=div"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::DivisionByZero"
expect_diagnostic_line = 31
expect_diagnostic_column = 20
expect_output_not_contains = ["done", "Segmentation fault", "dumped core"]

[[tests]]
name = "framed.faults.depth"
desc = "A non-tail recursion of framed code past the limit: refused at the same call as in the interpreter (its calls are counted on the interpreter's stack)."
case = "../../../cases/linear/jit/framed_faults.cml"
envs = ["FAULT=depth"]
backends = ["nvm", "fvm", "jit", "prl"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::MaxRecursionDepthExceeded"
expect_diagnostic_line = 39
expect_diagnostic_column = 44
expect_output_not_contains = ["done", "Segmentation fault", "dumped core"]

[[tests]]
name = "framed.faults.compiled"
desc = "The faulting functions were compiled before they faulted."
case = "../../../cases/linear/jit/framed_faults.cml"
backends = false
skip_unless = ["node", "test/tools/have-native-jit.mjs"]
sweep = false
args = ["--gc", "mark-sweep", "-vv", "${case}", "std::jit"]
envs = ["CAMEL_GC_ENABLE_YOUNG_COPYING=0", "CAMEL_GC_POISON=0", "FAULT=none"]
expect_exit = 0
expect_output_contains = ["compiled & cached graph 'pick' as framed code", "compiled & cached graph 'picks' as framed code", "compiled & cached graph 'rem' as framed code", "compiled & cached graph 'quot' as framed code", "compiled & cached graph 'depth' as framed code", "isolated", "done"]

# --- loops ------------------------------------------------------------------------------------

[[tests]]
name = "framed.loops"
desc = "Tail loops of 300000 rounds in framed code (allocating, mutually recursive, with a call in the body): neither the machine stack nor the recursion limit is used per round."
case = "../../../cases/linear/jit/framed_loops.cml"
envs = ["N=300000"]
timeout_ms = 60000
expect_exit = 0
expect_stdout_starts_with = "1988895\n600001\n13500\n1688895\ndone\n"

[[tests]]
name = "framed.loops.gc_stress"
# Slow layer: measured 5.8 s in the full serial run.
tier = "milestone"
desc = "The allocating loops with a collection at every safepoint and the heap verified: the self tail call of compiled code polls the collector as the interpreter's does."
case = "../../../cases/linear/jit/framed_loops.cml"
backends = ["fvm", "jit", "inline_jit"]
envs = ["N=20000", "CAMEL_GC_STRESS_SAFEPOINT=1", "CAMEL_GC_VERIFY=1"]
sweep = false
timeout_ms = 240000
expect_exit = 0
expect_stdout_starts_with = "108894\n40001\n900\n88894\ndone\n"

[[tests]]
name = "framed.loops.compiled"
desc = "The loops were compiled, and ran as compiled code although each is entered only once and then tail-calls itself: the interpreter hands a tail call of compiled code over to the code."
case = "../../../cases/linear/jit/framed_loops.cml"
backends = false
skip_unless = ["node", "test/tools/have-native-jit.mjs"]
sweep = false
args = ["--gc", "mark-sweep", "-vv", "${case}", "std::jit"]
envs = ["CAMEL_GC_ENABLE_YOUNG_COPYING=0", "CAMEL_GC_POISON=0", "N=5000"]
expect_exit = 0
expect_output_contains = ["compiled & cached graph 'churn' as framed code", "compiled & cached graph 'ping' as framed code", "compiled & cached graph 'pong' as framed code", "compiled & cached graph 'build' as framed code", "compiled & cached graph 'total' as framed code", "compiled & cached graph 'digit_sum' as framed code", "done"]

[[tests]]
name = "framed.loops.regions.compiled"
desc = "A loop of regions (LBEG/LTST/LEND) runs as framed code now instead of leaving the graph to the interpreter: the functions of this program (one state over an array, two states under a condition, `for ... while`, an empty array, a nested loop, a collecting loop, a loop in a called function, a body that calls a function, a `sync` body whose effects run every round, a block whose `return` ends it) are compiled, and each of them executes no bytecode in the interpreter; `std::jit stats=...` reports them `compiled`/`framed` with `executed` 0 and the LOOP runtime construct."
case = "../../../cases/loops/compiled.cml"
backends = false
skip_unless = ["node", "test/tools/have-native-jit.mjs"]
sweep = false
args = ["-vv", "${case}", "std::jit hot_threshold=0"]
expect_exit = 0
expect_output_contains = ["compiled & cached graph 'main' as framed code", "compiled & cached graph 'sum_squares' as framed code", "compiled & cached graph 'countdown' as framed code", "compiled & cached graph 'until_above' as framed code", "compiled & cached graph 'over_empty' as framed code", "compiled & cached graph 'nested' as framed code", "compiled & cached graph 'collects' as framed code", "compiled & cached graph 'rows_total' as framed code", "compiled & cached graph 'row_sum' as framed code", "compiled & cached graph 'through_call' as framed code", "compiled & cached graph 'square' as framed code", "compiled & cached graph 'ticks' as framed code", "compiled & cached graph 'sum_to' as framed code", "30", "21", "29"]
expect_output_not_contains = ["compile skipped", "Segmentation fault", "dumped core", "GC invariant violated"]

[[tests]]
name = "framed.loops.regions.lowered"
desc = "Which rounds of a compiled loop are native code and which go through the loop helpers (H55), from the compile line of `-vv`, which reports the lowering of every loop of the graph: a `while` loop whose state is several components the body writes in place is native (the test a compare and branch, the back edge a jump, no round count kept), and every shape that cannot be lowered says so and why. No loop of this program that takes the helpers is reported native."
case = "../../../cases/loops/compiled.cml"
backends = false
skip_unless = ["node", "test/tools/have-native-jit.mjs"]
sweep = false
args = ["--gc", "mark-sweep", "-vv", "${case}", "std::jit hot_threshold=0"]
envs = ["CAMEL_GC_ENABLE_YOUNG_COPYING=0", "CAMEL_GC_POISON=0"]
expect_exit = 0
expect_output_contains = ["compiled & cached graph 'countdown' as framed code; loop rounds: native rounds", "compiled & cached graph 'sum_to' as framed code; loop rounds: native rounds", "compiled & cached graph 'sum_squares' as framed code; loop rounds: helper: the round takes the next element of a sequence", "compiled & cached graph 'until_above' as framed code; loop rounds: helper: the round takes the next element of a sequence", "compiled & cached graph 'nested' as framed code; loop rounds: helper: the round takes the next element of a sequence (2 loops)", "compiled & cached graph 'collects' as framed code; loop rounds: helper: the round collects the values it produces", "compiled & cached graph 'ticks' as framed code; loop rounds: helper: the round makes the state tuple anew every round"]
expect_output_not_contains = ["'countdown' as framed code; loop rounds: helper", "'sum_to' as framed code; loop rounds: helper", "'sum_squares' as framed code; loop rounds: native", "'until_above' as framed code; loop rounds: native", "'nested' as framed code; loop rounds: native", "'collects' as framed code; loop rounds: native", "'ticks' as framed code; loop rounds: native", "compile skipped", "Segmentation fault", "dumped core"]

[[tests]]
name = "framed.loops.regions.compiled.inline"
desc = "The same program after std::opt::inline: every function is inlined into main, so the graph compiled as framed code is main, with all the loops of the program in it."
case = "../../../cases/loops/compiled.cml"
backends = false
skip_unless = ["node", "test/tools/have-native-jit.mjs"]
sweep = false
args = ["-vv", "${case}", "std::opt::inline", "std::jit hot_threshold=0"]
expect_exit = 0
expect_output_contains = ["compiled & cached graph 'main' as framed code", "'main' as framed code; loop rounds:", "native rounds (2 loops)", "30", "21", "29"]
expect_output_not_contains = ["compile skipped", "Segmentation fault", "dumped core", "GC invariant violated"]

[[tests]]
name = "framed.loops.moving"
desc = "The loops with safepoint poisoning: the allocating loop and the loop that builds an array run across thousands of collections that move what they hold."
case = "../../../cases/linear/jit/framed_loops.cml"
backends = ["fvm", "jit_hot_threshold0", "inline_jit_hot_threshold0"]
envs = ["N=20000", "CAMEL_GC_POISON=1"]
sweep = false
timeout_ms = 240000
expect_exit = 0
expect_stdout_starts_with = "108894\n40001\n900\n88894\ndone\n"

[[tests]]
name = "framed.faults.moving"
desc = "The isolated faults with safepoint poisoning."
case = "../../../cases/linear/jit/framed_faults.cml"
backends = ["fvm", "jit_hot_threshold0", "inline_jit_hot_threshold0"]
envs = ["FAULT=none", "CAMEL_GC_POISON=1"]
sweep = false
expect_exit = 0
expect_stdout_starts_with = "62\n14\n14\n58\nIndexOutOfRange\nDivisionByZero\nDivisionByZero\nMaxRecursionDepthExceeded\n62\n58\nisolated\ndone\n"
