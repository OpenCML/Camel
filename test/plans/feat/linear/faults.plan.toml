id = "linear.faults"
order = 345
tier = "feat"
tags = ["feat", "linear", "runtime", "negative"]

[[tests]]
name = "modulo_by_zero.nvm"
desc = "Modulo by zero is DivisionByZero at the operator (it used to be the catch-all RuntimeError), the same position on every back end (nvm)."
kind = "negative"
case = "../../../cases/linear/faults/modulo_by_zero.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::DivisionByZero"
expect_diagnostic_code = "0x04000001"
expect_diagnostic_line = 8
expect_diagnostic_column = 28
expect_output_contains = ["87", "Attempted division by zero."]
expect_output_not_contains = ["not reached", "Floating point exception"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "array_index_out_of_range.nvm"
desc = "An array index past the end is IndexOutOfRange at the bracket, with the index and the length; it used to be the catch-all RuntimeError at the start of the function (nvm)."
kind = "negative"
case = "../../../cases/linear/faults/array_index_out_of_range.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::IndexOutOfRange"
expect_diagnostic_code = "0x04000002"
expect_diagnostic_line = 7
expect_diagnostic_column = 44
expect_output_contains = ["Index 5 is out of range for an array of length 3."]
expect_output_not_contains = ["not reached"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "array_index_negative.nvm"
desc = "A negative array index is IndexOutOfRange with the index as written (nvm)."
kind = "negative"
case = "../../../cases/linear/faults/array_index_negative.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::IndexOutOfRange"
expect_diagnostic_code = "0x04000002"
expect_diagnostic_line = 7
expect_diagnostic_column = 44
expect_output_contains = ["Index -1 is out of range for an array of length 3."]
expect_output_not_contains = ["not reached"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

