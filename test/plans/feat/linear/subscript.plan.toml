id = "linear.subscript"
order = 346
tier = "fast"
tags = ["feat", "linear", "subscript", "slice"]

[[tests]]
name = "subscript.forms"
desc = "Every form of a subscript on an array of rank 1 (design principles 5.4): `xs[a:b]`, `xs[a:]`, `xs[:b]`, `xs[:]`, a step of 1, an int-array index (take) and `last(xs)`. The slice shares the block of the source; the element values are the ones of the first dimension, on every back end."
kind = "behavior"
case = "../../../cases/parse/syntax/subscript_forms.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
expect_exit = 0
expect_stdout_exact = "part [2, 3]\nafter [3, 4]\ntill [1, 2]\nwhole [1, 2, 3, 4]\nstepped [1, 2, 3, 4]\nrows [3, 1]\nend 4\n"
timeout_ms = 10000

[[tests]]
name = "subscript.slice_negative.nvm"
desc = "A negative bound of a subscript slice is SliceOutOfRange at the bracket, not a count from the end (design principles 3.9, 5.4), with both bounds and the length (nvm)."
kind = "negative"
case = "../../../cases/linear/faults/subscript_slice_negative.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::SliceOutOfRange"
expect_diagnostic_code = "0x04000052"
expect_diagnostic_line = 8
expect_diagnostic_column = 14
expect_output_contains = ["The range -1 to 3 is out of range for an array of length 5."]
expect_output_not_contains = ["not reached"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "subscript.slice_negative.fvm"
desc = "A negative bound of a subscript slice is SliceOutOfRange at the bracket on the bytecode VM too, at the same position (fvm)."
kind = "negative"
case = "../../../cases/linear/faults/subscript_slice_negative.cml"
args = ["${case}", "${run_fvm}"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::SliceOutOfRange"
expect_diagnostic_code = "0x04000052"
expect_diagnostic_line = 8
expect_diagnostic_column = 14
expect_output_contains = ["The range -1 to 3 is out of range for an array of length 5."]
expect_output_not_contains = ["not reached"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "subscript.slice_out_of_range.nvm"
desc = "A bound equal to the length is the end of the array and is in range; one past it is SliceOutOfRange with both bounds and the length (nvm)."
kind = "negative"
case = "../../../cases/linear/faults/subscript_slice_out_of_range.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::SliceOutOfRange"
expect_diagnostic_code = "0x04000052"
expect_diagnostic_line = 9
expect_diagnostic_column = 14
expect_output_contains = ["[2, 3, 4, 5]", "The range 3 to 9 is out of range for an array of length 5."]
expect_output_not_contains = ["not reached"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "subscript.step"
desc = "A subscript slice with a step other than 1 takes every step-th element, a negative step runs backwards, and an omitted start with a negative step is the last element. Until H17's strided views the result is a copy, with the same elements on every back end (design principles 5.4)."
kind = "behavior"
case = "../../../cases/linear/faults/subscript_step.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
expect_exit = 0
expect_stdout_exact = "[1, 3, 5]\n[5, 3]\n[5, 4, 3, 2, 1]\n"
timeout_ms = 10000

[[tests]]
name = "subscript.step_zero"
desc = "A step of 0 is InvalidArgument at the bracket (design principles 5.4)."
kind = "negative"
case = "../../../cases/linear/faults/subscript_step_zero.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::InvalidArgument"
expect_diagnostic_code = "0x04000034"
expect_diagnostic_line = 7
expect_diagnostic_column = 14
expect_output_contains = ["a slice step must not be 0"]
expect_output_not_contains = ["not reached"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "subscript.take_rows"
desc = "An int-array subscript is take: the rows the indices name along the first dimension, in that order, a repeated index repeating its row (design principles 5.4). The result's shape is `[len(idx)] + shape(t)[1:]` -- a function returning `f32[3]` from an `f32[5]` under an `int[3]`, and `f32[3, 3]` from an `f32[2, 3]`, states it at the declaration -- and every back end agrees."
kind = "behavior"
case = "../../../cases/linear/subscript/take_rows.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm"]
expect_exit = 0
expect_stdout_exact = "[5.0, 1.0, 5.0]\n3\n1.0\n"
timeout_ms = 10000

[[tests]]
name = "subscript.step_zero_const"
desc = "A subscript slice whose step is the constant 0 takes no element at all: refused where the step is written (design principles 5.4), as the step of a range is (4.2). A step that is not constant stays a fault of the run (subscript.step_zero)."
kind = "negative"
case = "../../../cases/linear/faults/subscript_step_zero_const.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::SliceStepZero"
expect_diagnostic_code = "0x030001E9"
expect_diagnostic_line = 9
expect_diagnostic_column = 20
expect_output_contains = ["The slice 't[a:b:s]' has a step of 0"]
expect_output_not_contains = ["not reached"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "subscript.take_index"
desc = "An int-array subscript is take: an index outside the array is IndexOutOfRange with the index as written, and the first call (with a repeated index) prints its elements in the order given."
kind = "negative"
case = "../../../cases/linear/faults/subscript_take_index.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::IndexOutOfRange"
expect_diagnostic_code = "0x04000002"
expect_diagnostic_line = 8
expect_diagnostic_column = 14
expect_output_contains = ["[5, 1, 5]", "Index 7 is out of range for an array of length 5."]
expect_output_not_contains = ["not reached"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000

[[tests]]
name = "subscript.last_empty"
desc = "`last` of an empty array is IndexOutOfRange, as `xs[0]` of an empty array is: an array with no last element has no value to give."
kind = "negative"
case = "../../../cases/linear/faults/subscript_last_empty.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::IndexOutOfRange"
expect_diagnostic_code = "0x04000002"
expect_output_contains = ["Index -1 is out of range for an array of length 0."]
expect_output_not_contains = ["not reached"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 8000
