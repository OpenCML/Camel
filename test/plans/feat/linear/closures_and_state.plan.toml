[[tests]]
name = "var_params.nvm"
desc = "var parameters are passed by reference through direct, nested and indirect calls, tuple replacement and a hot loop, on: NodeVM."
kind = "behavior"
case = "../../../cases/linear/nvm/var_params.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim().split('\n').join(' ')
assert(out === '1 3 13 6 15 8 113 20001', `unexpected output: ${out}`)
}
"""
timeout_ms = 10000

