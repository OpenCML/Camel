[[tests]]
name = "lambda_points.jit"
desc = "Checks JIT execution of lambda-based filtering over struct arrays with captured bounds."
kind = "behavior"
case = "../../../cases/linear/jit/lambda_points.cml"
args = ["${case}", "${run_jit}"]
expect_exit = 0
verify_script = """
({ input, assert, match }) => {
    assert(input.exit_code === 0, `camel exited ${input.exit_code}`)
    const found = match(/lambda_points len=([0-9]+) p0x=(-?[0-9]+) p1y=(-?[0-9]+) p2x=(-?[0-9]+)/, input.normalized.stdout)
    assert(Number(found[1]) === 3, `expected len=3, got ${found[1]}`)
    assert(Number(found[2]) === 1, `expected p0x=1, got ${found[2]}`)
    assert(Number(found[3]) === 9, `expected p1y=9, got ${found[3]}`)
    assert(Number(found[4]) === 5, `expected p2x=5, got ${found[4]}`)
}
"""
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 10000

[[tests]]
name = "mutable_reference.nvm"
desc = "A write to a var parameter is read by the caller after the call (0 before, 1 after), on: NodeVM."
kind = "behavior"
case = "../../../cases/linear/nvm/var.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim().split('\n').join(' ')
assert(out === '0 1', `unexpected output: ${out}`)
}
"""
timeout_ms = 10000

