id = "linear.var_reference"
order = 344
tier = "feat"
tags = ["feat", "linear", "var", "reference"]

[[tests]]
name = "let_to_var_param"
desc = "A `let` name passed to a `var` parameter of a function. It is a compile-time error located at the argument."
kind = "negative"
case = "../../../cases/linear/byref/let_to_var_param.cml"
args = ["${case}"]
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ImmutablePassedToVarParam"
expect_diagnostic_line = 14
expect_diagnostic_column = 15
expect_output_contains = ["'k' is immutable"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 4000

