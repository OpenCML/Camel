[[tests]]
name = "var_pipelines"
# Slow layer: measured 34.8 s in the full serial run.
tier = "slow"
desc = "Generated programs that write variables (fixed seed): recursions writing a var on the way down and up at depths 0 to 7, and straight-line functions with snapshots of the variable interleaved with writes, a snapshot feeding an argument the callee ignores while the callee writes, and a branch whose arms write; and, in 8 more programs, nested branches on a run-time integer (depth 1 to 3) whose innermost arm calls a self-tail-recursive function with literal or run-time bounds, where the arm ending the recursion, the sibling arms and the calling arm print and / or write the variable. Each of 16 programs runs on 11 pipelines (every scheduler also after std::opt) and is compared with a reference computed by simulation (not only with the default run). Three silent defects are in this class: two of std::opt (a dropped write; a read moved behind later writes) and one of the execution order (an arm of a branch ran into its sibling arm after an inner branch was removed)."
kind = "behavior"
tool = "python"
case = "../../../cases/linear/byref/var_pipelines.py"
# `${camel}` is the compiler of the build under test, named as an argument.
args = ["${case}", "--camel", "${camel}"]
expect_exit = 0
expect_stdout_contains = ["176 program-pipeline cells, 0 wrong", "PASS"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 300000

[[tests]]
name = "var_rule_subpasses.default"
desc = "The rule every rewriting pass must keep for variables: a read is not moved across a write to the same variable, and a write is not merged or dropped while a later read is reachable. One function per sub-pass built to tempt it (constant-foldable reads around writes, identical reads and identical writes, writes whose value is unused, a writer called with constants, a writer called through a function value, a write in one branch arm); the expected values were computed by hand."
kind = "behavior"
case = "../../../cases/linear/byref/var_rule_subpasses.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim().split(String.fromCharCode(10)).join(' | ')
assert(out === 'fold 30510 | cse 20304 3 | dce 2 112 | call 10203 8 | value 10305 5 | branch 10801 80802 8', `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

