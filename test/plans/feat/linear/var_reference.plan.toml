[[tests]]
name = "order_graph.before_after"
desc = "`A(i); modify(i); B(i)` in a sync body: the body orders its statements, so the graph has the control dependencies A -> modify and modify -> the read of i that B uses."
kind = "behavior"
case = "../../../cases/linear/byref/order_before_after.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const text = input.normalized.stdout
const node = (label, type) => {
    const m = text.match(new RegExp('(N[0-9A-F]+) \\[label="' + label + '", type="' + type + '"'))
    assert(m, `no ${type} node labelled ${label}`)
    return m[1]
}
const edge = (from, to, type) => text.includes(`${from} -> ${to} [`) &&
    new RegExp(from + ' -> ' + to + ' \\[label="[^"]*", type="' + type + '"').test(text)
const a = node('before', 'FUNC'), m = node('modify', 'FUNC'), b = node('after', 'FUNC')
assert(edge(a, m, 'CTRL'), 'missing control dependency A -> modify')
const reads = [...text.matchAll(/(N[0-9A-F]+) \[label=":var\/get", type="OPER"/g)].map(x => x[1])
const readOfB = reads.find(r => edge(r, b, 'NORM'))
assert(readOfB, 'B does not read the variable through :var/get')
assert(edge(m, readOfB, 'CTRL'), 'missing control dependency modify -> read used by B')
}
"""
timeout_ms = 10000

