# A path assignment on a `var` array keeps the shape of a rebinding in place: the store is
# `:op/assn_owned(arr, :op/set_index_in_place(:var/take(arr), 0, 9))`, the shape
# `src/builtin/operators/ops.cpp` documents for `xs = xs->sort`, and the copying form
# (`:op/set_index`) is nowhere in the graph. Whether the update copies is decided for the update
# node, once, when the execution plan is built (docs/design/arrays-memory/README.cn.md 4.3.1),
# and the back end runs the operator the plan names: the plan marks the node to reuse the storage
# of the value it is given when it proves that value is the variable's own and nothing has read it
# since; to ask the array's own count when the cell is one this graph does not declare (a `var`
# parameter, a captured cell) and every use the graph can see leaves the value alone; and to copy
# otherwise -- after a read that may keep the value, on a value another party made, and for a
# captured cell this graph reads, whose count the runtime decides. The count counts the names of
# the value: the operators that hand out a name make the storage counted
# (Array::shareForSecondName, docs/technical/18_sync_control_semantics.md), so what the runtime
# answers is what the plan would have answered had it seen the name.
# `element_assigned_copy` and `path_assigned.allocs` show the copy that follows a read, counted
# with `std::mem::blocks()`.

[[tests]]
name = "element_assigned.in_place_form"
desc = "The lowering of `arr[0] = 9` on a `var` array is the in-place rebinding: :op/set_index_in_place takes its array from :var/take of the cell, and :op/assn_owned stores the result in that cell. The copying form :op/set_index is not in the graph."
kind = "behavior"
case = "../../../cases/linear/byref/element_assigned.cml"
args = ["${case}", "std::jgir", "std::nop"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const gir = JSON.parse(input.stdout)
const graph = gir.graphs.find((g) => g.name === 'main')
assert(graph, 'the main graph is in the dump')
const labels = new Map(graph.nodes.map((n) => [n.id, n.label]))
const inputEdge = (id, index) =>
  graph.edges.find((e) => e.target === id && e.kind === 'normal' && e.targetIndex === index)
const out = graph.nodes.find((n) => n.label === ':op/set_index_in_place')
assert(out, 'the in-place form is in the graph')
const first = inputEdge(out.id, 0)
assert(first, 'the in-place form has a first operand')
assert(labels.get(first.source) === ':var/take', 'the array comes from :var/take, got ' + labels.get(first.source))
assert(!graph.nodes.some((n) => n.label === ':op/set_index'), 'no copying form is in the graph')
const stored = graph.edges
  .filter((e) => e.source === out.id && e.kind === 'normal' && e.sourceIndex === 0)
  .map((e) => labels.get(e.target))
assert(stored.includes(':op/assn_owned'), 'the new array is stored by :op/assn_owned, got ' + stored)
const take = inputEdge(first.source, 0)
assert(take && labels.get(take.source) === ':var/new', 'take reads the variable cell itself')
}
"""

# The differential `test/cases/linear/byref/element_assigned_append.cml` used to state: `v =
# v->append<4>` reaches the same three positions `arr[0] = 9` does -- take the array out of the
# cell, run the in-place operator, store it back -- with `:struct/append_arr_in_place` where the
# path write has `:op/set_index_in_place`, neither of them copying.
#
# That is no longer what this program builds, and it is no longer what the guarantee is read from.
# `v` is a same-region local `var`, so since stage S1 of the direct-SSA plan it is built as the
# value it was given and there is no cell at all (`internal/plans/
# 2026-11-16-direct-ssa-construction.cn.md`): no `:var/new`, no `:var/take`, no
# `:op/assn_owned`, and `Builder::inPlaceRebindingOf` (src/compile/gir/builder_operators.cpp)
# declines for want of a cell.
#
# Stage S3b is where the guarantee comes back, and it comes back as the *plan's* decision and not
# as a graph shape (the rule: in-place is the execution plan's reuse
# decision, not the front end claiming a statement by its shape). The reading, on this tree:
#
#   camel inspect --copies test/cases/linear/byref/element_assigned_append.cml
#     COPIES element_assigned_append.cml:11:18 append in-place
#     COPIES main updates 1 in-place 1 by-count 0 declared 0 copied 0
#
# The node still names the copying form (`:struct/append_arr`); the plan hands it the storage of
# the value it was given -- nothing else reads that value, which is the `var`'s whole remaining
# life -- and every back end runs the in-place form instead (`ExecPlan::operatorUriFor`). The
# entry below therefore asks the ruler, not the dump: the shape it used to assert is the cell
# era's and the mechanism that replaced it is a decision, so a dump assertion would pin the loss
# of the cell rather than the guarantee. `element_assigned` keeps its `:var/take` shape (it is
# still a cell) and reads the same verdict, which is why the pair is still the differential.

[[tests]]
name = "element_assigned_append.in_place_form"
desc = "The append `v = v->append<4>` at the value's last use runs the in-place form, read the way stage S3b says to read it: `camel inspect --copies` answers `append in-place` for it, and the plan's summary counts one in-place update and no copy. Not a graph shape, because there is no cell left to take the array out of: `v` is a same-region local `var`, so it is a value (stage S1), and the decision is the plan's (`ExecPlan::storageReuseAt`, `ExecPlan::operatorUriFor`) -- design principles 10.5 that in-place is the execution plan's reuse decision and not the front end claiming a statement by its shape."
kind = "behavior"
tool = "camel"
case = "../../../cases/linear/byref/element_assigned_append.cml"
args = ["inspect", "--copies", "${case}"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
  const lines = input.normalized.stdout.split('\n').filter((l) => l.startsWith('COPIES '))
  assert(lines.length > 0, 'the ruler printed no reading: ' + input.normalized.output)
  // The row for this program's one update: named the way the program writes it, at its own place,
  // and the verdict is the plan's -- the copying form it names is not the form it runs.
  const rows = lines.filter((l) => /^COPIES element_assigned_append\.cml:\d+:\d+ append (in-place|by-count|declared|copied)$/.test(l))
  assert(rows.length === 1, 'one append row: ' + lines.join(' | '))
  assert(rows[0].endsWith(' in-place'), 'the plan chose the in-place form for the append: ' + rows[0])
  // The counts agree with the rows: one update, decided in place, nothing copied. A reading and a
  // number that disagree is the thing this entry exists to catch.
  const summary = 'COPIES main updates 1 in-place 1 by-count 0 declared 0 copied 0'
  assert(lines.includes(summary), 'the main graph counts the in-place append: ' + lines.join(' | '))
  assert(!lines.some((l) => /^COPIES main updates .* copied [1-9]/.test(l)), 'nothing in main copies: ' + lines.join(' | '))
}
"""
timeout_ms = 30000

