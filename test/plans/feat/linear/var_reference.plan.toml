# A path assignment on a `var` array keeps the shape of a rebinding in place: the store is
# `:op/assn_owned(arr, :op/set_index_in_place(:var/take(arr), 0, 9))`, the shape
# `src/builtin/operators/ops.cpp` documents for `xs = xs->sort`, and the copying form
# (`:op/set_index`) is nowhere in the graph. Whether the update copies is decided for the update
# node, once, when the execution plan is built (docs/design/arrays-memory/README.cn.md 4.3.1),
# and the back end runs the operator the plan names: the plan marks the node to reuse the storage
# of the value it is given when it proves that value is the variable's own and nothing has read it
# since; to ask the array's own count when the cell is one this graph does not declare (a `var`
# parameter, a captured cell) and every use the graph can see leaves the value alone; and to copy
# otherwise -- after a read that may keep the value, on a value another party made, and for a
# captured cell this graph reads, whose count the runtime decides. The count counts the names of
# the value: the operators that hand out a name make the storage counted
# (Array::shareForSecondName, docs/technical/18_sync_control_semantics.md), so what the runtime
# answers is what the plan would have answered had it seen the name.
# `element_assigned_copy` and `path_assigned.allocs` show the copy that follows a read, counted
# with `std::mem::blocks()`.
[[tests]]
name = "element_assigned.in_place_form"
desc = "The lowering of `arr[0] = 9` on a `var` array is the in-place rebinding: :op/set_index_in_place takes its array from :var/take of the cell, and :op/assn_owned stores the result in that cell. The copying form :op/set_index is not in the graph."
kind = "behavior"
case = "../../../cases/linear/byref/element_assigned.cml"
args = ["${case}", "std::jgir"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const gir = JSON.parse(input.stdout)
const graph = gir.graphs.find((g) => g.name === 'main')
assert(graph, 'the main graph is in the dump')
const labels = new Map(graph.nodes.map((n) => [n.id, n.label]))
const inputEdge = (id, index) =>
  graph.edges.find((e) => e.target === id && e.kind === 'normal' && e.targetIndex === index)
const out = graph.nodes.find((n) => n.label === ':op/set_index_in_place')
assert(out, 'the in-place form is in the graph')
const first = inputEdge(out.id, 0)
assert(first, 'the in-place form has a first operand')
assert(labels.get(first.source) === ':var/take', 'the array comes from :var/take, got ' + labels.get(first.source))
assert(!graph.nodes.some((n) => n.label === ':op/set_index'), 'no copying form is in the graph')
const stored = graph.edges
  .filter((e) => e.source === out.id && e.kind === 'normal' && e.sourceIndex === 0)
  .map((e) => labels.get(e.target))
assert(stored.includes(':op/assn_owned'), 'the new array is stored by :op/assn_owned, got ' + stored)
const take = inputEdge(first.source, 0)
assert(take && labels.get(take.source) === ':var/new', 'take reads the variable cell itself')
}
"""

# The differential `test/cases/linear/byref/element_assigned_append.cml` states: `v = v->append<4>`
# reaches the same three positions this lowering does -- take the array out of the cell, run the
# in-place operator, store it back -- with `:struct/append_arr_in_place` where `arr[0] = 9` has
# `:op/set_index_in_place`. The criterion is the same in both: the cell's "not shared" mark decides
# whether the array is copied, and neither program copies.
[[tests]]
name = "element_assigned_append.in_place_form"
desc = "`v = v->append<4>` on a `var` array is the in-place rebinding: the graph takes the array out of the cell (`:var/take` of `:var/new`), appends through `:struct/append_arr_in_place`, and `:op/assn_owned` stores the result into that same cell -- the cell is its first operand, the appended array its second, and the take is its control dependency. The copying form `:struct/append_arr` is not in the graph, and the cell is not read (`:var/peek`) first."
kind = "behavior"
case = "../../../cases/linear/byref/element_assigned_append.cml"
args = ["${case}", "std::jgir"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const gir = JSON.parse(input.stdout)
const graph = gir.graphs.find((g) => g.name === 'main')
assert(graph, 'the main graph is in the dump')
const labels = new Map(graph.nodes.map((n) => [n.id, n.label]))
const inputEdge = (id, index) =>
  graph.edges.find((e) => e.target === id && e.kind === 'normal' && e.targetIndex === index)
const only = (label) => graph.nodes.filter((n) => n.label === label)
const take = only(':var/take')
assert(take.length === 1, `one :var/take, got ${take.length}`)
const cell = inputEdge(take[0].id, 0)
assert(cell && labels.get(cell.source) === ':var/new', 'take reads the variable cell itself')
const append = only(':struct/append_arr_in_place')
assert(append.length === 1, `one in-place append, got ${append.length}`)
const from = inputEdge(append[0].id, 0)
assert(from && from.source === take[0].id, 'the in-place append takes the array from :var/take')
const store = only(':op/assn_owned')
assert(store.length === 1, `one :op/assn_owned, got ${store.length}`)
const into = inputEdge(store[0].id, 0)
assert(into && labels.get(into.source) === ':var/new', 'the store writes the variable cell itself')
const value = inputEdge(store[0].id, 1)
assert(value && value.source === append[0].id, 'the appended array is the value it stores')
assert(
  graph.edges.some((e) => e.source === take[0].id && e.target === store[0].id && e.kind === 'control'),
  'the take is the control dependency of the store, which is where the cell is read',
)
assert(only(':struct/append_arr').length === 0, 'the copying form is not in the graph')
assert(only(':var/peek').length === 0, 'the cell is not read before the write')
}
"""

