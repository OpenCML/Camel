desc = "A read of a var stays before later writes made by a callee, also when the only thing ordering the call after the read was an argument the callee does not use. After inlining, the callee's write used to be free to run before the read under std::opt (a snapshot came out as the variable's final value; silent)."
kind = "behavior"
case = "../../../cases/linear/byref/var_read_before_callee_write.cml"
args = ["${case}", "std::opt", "std::cxx::fold"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim().split(String.fromCharCode(10)).join(' | ')
assert(out === 'f: 101 counter 6 | g: 101.0 counter 4', `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

