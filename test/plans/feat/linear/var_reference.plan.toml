# The same claim, counted rather than argued from the graph: `std::mem::blocks()` reads the
# numeric array block counters (the pattern of `loops.state_in_place`), so the writes can be
# asked what they allocate. The array is 40 ints — past the 256 bytes an array may keep in its
# value — so a copy really does take a block.
[[tests]]
