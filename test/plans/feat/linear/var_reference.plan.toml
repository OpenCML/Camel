args = ["${case}", "std::opt::simplify"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim().split(String.fromCharCode(10)).join(' | ')
assert(out === 'fold 30510 | cse 20304 3 | dce 2 112 | call 10203 8 | value 10305 5 | branch 10801 80802 8', `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

[[tests]]
name = "var_rule_subpasses.simplify_twice"
desc = "The rule every rewriting pass must keep for variables: a read is not moved across a write to the same variable, and a write is not merged or dropped while a later read is reachable. One function per sub-pass built to tempt it (constant-foldable reads around writes, identical reads and identical writes, writes whose value is unused, a writer called with constants, a writer called through a function value, a write in one branch arm); the expected values were computed by hand."
kind = "behavior"
case = "../../../cases/linear/byref/var_rule_subpasses.cml"
args = ["${case}", "std::opt::simplify", "std::opt::simplify"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim().split(String.fromCharCode(10)).join(' | ')
assert(out === 'fold 30510 | cse 20304 3 | dce 2 112 | call 10203 8 | value 10305 5 | branch 10801 80802 8', `unexpected output: ${out}`)
}
"""
timeout_ms = 8000

