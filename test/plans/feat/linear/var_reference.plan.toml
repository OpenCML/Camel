[[tests]]
name = "var_param_reference.an_escaping_var_keeps_its_cell"
desc = "A `var` handed to a function as a `var` argument escapes: it is a resource shared with the callee, so it keeps its cell and its reads stay cell reads -- the graph has :var/get and :var/new nodes. A `var` that only its own graph reads and writes becomes SSA instead: its reads take the value of the write that made them and no :var/get is left (test/cases/opt/generic/specialization_survives_the_round.cml, where the graph has none)."
kind = "behavior"
case = "../../../cases/linear/byref/var_param_reference.cml"
args = ["${case}", "std::gir", "std::nop"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const reads = (out.match(/:var\/get/g) || []).length
assert(reads > 0, `a var handed out as a var argument keeps its cell and its reads, found ${reads} :var/get nodes`)
const cells = (out.match(/:var\/new/g) || []).length
assert(cells > 0, `an escaping var keeps its cell, found ${cells} :var/new nodes`)
}
"""
timeout_ms = 8000

[[tests]]
name = "var_argument_reads_the_nearest_write"
desc = "A `var` handed to a function is read before the callee writes it, and the port carries the version the variable's nearest write made as a data edge: the write that made it is a direct input of the call and no control input stands in for it (the placeholder an order edge would leave the read behind a write with). The version is the same cell the write stored into, so the callee writes the one cell and the value read back is 2."
kind = "behavior"
case = "../../../cases/linear/byref/var_argument_reads_the_nearest_write.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout = "2\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]

[[tests]]
name = "var_argument_reads_the_nearest_write.the_edge_is_data"
desc = "The graph of the same case: the `var` argument's port is a data edge from the version the nearest write made. The call also follows that write on the statement chain; its control input, when present, mirrors that chain rather than standing in for a missing data edge (docs/design/effects/edges.cn.md 4.6, 5.6)."
kind = "behavior"
case = "../../../cases/linear/byref/var_argument_reads_the_nearest_write.cml"
args = ["${case}", "std::gir", "std::nop"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const lines = out.split(String.fromCharCode(10))
const callLine = lines.find((l) => l.includes(' [label="bump", type="FUNC"'))
assert(callLine !== undefined, 'the call of bump is in the graph')
const call = callLine.trim().split(' ')[0]
const link = (l) => {
  const parts = l.split(' -> ')
  if (parts.length !== 2) return null
  const kind = parts[1].includes('type="NORM"') ? 'NORM'
             : parts[1].includes('type="CTRL"') ? 'CTRL' : 'other'
  return { from: parts[0].trim(), to: parts[1].split(' ')[0], kind }
}
const into = lines.map(link).filter((e) => e !== null && e.to === call)
const port = into.find((e) => e.kind === 'NORM')
assert(port !== undefined, `the call takes the variable's port as a data edge: ${JSON.stringify(into)}`)
const write = lines.find((l) => l.trim().startsWith(port.from + ' [') && l.includes('label=":op/assn_l"'))
assert(write !== undefined, `the port carries the version the nearest write made, an assignment node: ${port.from}`)
assert(into.some((e) => e.from === port.from && e.kind === 'other'), `and the call follows that write on the statement chain: ${JSON.stringify(into)}`)
assert(!into.some((e) => e.from === port.from && e.kind === 'CTRL' &&
  !into.some((sync) => sync.from === e.from && sync.kind === 'other')),
  `and there is no data-dependency placeholder beside that chain: ${JSON.stringify(into)}`)
}
"""
timeout_ms = 8000

