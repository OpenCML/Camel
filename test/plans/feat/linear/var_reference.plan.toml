[[tests]]
name = "var_argument_statement_place.the_statement_is_on_the_chain"
desc = "The graph of the same case: the effectful statement that reads the `var` parameter occupies the chain place, while the read itself is a value input. The statement follows the preceding statement; it does not borrow a chain place from the read (docs/design/effects/edges.cn.md 4.6, 5.6)."
kind = "behavior"
case = "../../../cases/linear/byref/var_argument_statement_place.cml"
args = ["${case}", "std::gir", "std::nop"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const lines = input.normalized.stdout.split(String.fromCharCode(10))
const link = (l) => {
  const parts = l.split(' -> ')
  if (parts.length !== 2) return null
  const kind = parts[1].includes('type="NORM"') ? 'NORM'
             : parts[1].includes('type="SYNC"') ? 'SYNC'
             : parts[1].includes('type="CTRL"') ? 'CTRL' : 'other'
  return { from: parts[0].trim(), to: parts[1].split(' ')[0], kind }
}
const edges = lines.map(link).filter((e) => e !== null)
const isOf = (node, label) => lines.some((l) => l.trim().startsWith(node + ' [') && l.includes(`label="${label}"`))
const value = edges.find((e) => e.kind === 'NORM' && isOf(e.from, ':var/get') && isOf(e.to, ':io/println') &&
  edges.some((other) => other.kind === 'SYNC' && other.to === e.to))
assert(value !== undefined, `a chained statement takes the read of the variable as its value: ${JSON.stringify(edges)}`)
assert(!edges.some((e) => e.kind === 'SYNC' && e.from === value.from && e.to === value.to), `the read is not the statement's chain place: ${JSON.stringify(edges)}`)
}
"""
timeout_ms = 8000

# A value with two names is one storage both names can write: what a write in place may touch is
# decided by the array's own count, so the count has to count the names. A name that appears for
# a value -- a store into a `var` cell, a read that lets the value out of a variable -- makes the
# storage counted, and a write through any of the names then needs the only one and copies
# (docs/design-principles.cn.md 3.5, 6.11; docs/technical/18_sync_control_semantics.md).

[[tests]]
name = "var_alias_through_param"
desc = "`var v = big` gives the array `big` is a second name, in the cell of `v`. A write through a `var` parameter of a callee (`xs[0] = 9`) reaches the cell of `v`, and the array's count sees the two names, so the write copies: `big` keeps the value it was read as."
kind = "behavior"
case = "../../../cases/linear/byref/var_alias_through_param.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout = "big[0] = 1  v[0] = 9\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "var_alias_captured"
desc = "A closure over the value `v` held when it was made, and a `let` name of the same array: the closure holds that value, so `f()` reads what the name held then, and the write to `v[0]` copies because the cell of `v` is a second name of the array `big` is, so `big` keeps its value. The closure names `v0`, the `let` binding of the value (a closure may not name a `var` assigned after it is made, design principles 3.5)."
kind = "behavior"
case = "../../../cases/linear/byref/var_alias_captured.cml"
