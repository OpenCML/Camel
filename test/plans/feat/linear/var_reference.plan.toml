name = "var_tensor_local.macro"
desc = "The same value and the same true gradient as `var_tensor_local.run` through the compile-time path of std::macro: a variable of a differentiable type declared inside the differentiated function is a same-region local and so a value (stage S1), not the cell whose read the old refusal was about."
kind = "behavior"
