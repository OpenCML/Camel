[[tests]]
name = "var_tensor.default"
desc = "A tensor variable passed to a `var` parameter is one object: the callee replaces the tensor the caller's variable holds, and a closure that mentions the variable holds its value and returns the new tensor, which the caller binds. Pipeline: default (no pass)."
kind = "behavior"
case = "../../../cases/modules/tensor/var_tensor_reference.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout.trim().split('\n').join(' | ')
assert(out === '2.0 | 10.0 10.0 | 20.0 20.0', `unexpected output: ${out}`)
}
"""
timeout_ms = 20000

