[[tests]]
name = "var_param_jit"
skip_unless = ["node", "test/tools/have-native-jit.mjs"]
desc = "std::inline std::jit compiles a function that passes its var parameter on (200000-deep tail recursion) as frameless code, and a function that reads the variable as framed code: :var/get is a generic operator, called through a helper."
