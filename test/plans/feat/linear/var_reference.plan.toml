[[tests]]
name = "var_param_reference.an_escaping_var_keeps_its_cell"
desc = "A `var` handed to a function as a `var` argument escapes: it is a resource shared with the callee, so it keeps its cell and its reads stay cell reads -- the graph has :var/get and :var/new nodes. A `var` that only its own graph reads and writes becomes SSA instead: its reads take the value of the write that made them and no :var/get is left (test/cases/opt/generic/specialization_survives_the_round.cml, where the graph has none)."
kind = "behavior"
case = "../../../cases/linear/byref/var_param_reference.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const out = input.normalized.stdout
const reads = (out.match(/:var\/get/g) || []).length
assert(reads > 0, `a var handed out as a var argument keeps its cell and its reads, found ${reads} :var/get nodes`)
const cells = (out.match(/:var\/new/g) || []).length
assert(cells > 0, `an escaping var keeps its cell, found ${cells} :var/new nodes`)
}
"""
timeout_ms = 8000

# A value with two names is one storage both names can write: what a write in place may touch is
# decided by the array's own count, so the count has to count the names. A name that appears for
# a value -- a store into a `var` cell, a read that lets the value out of a variable -- makes the
# storage counted, and a write through any of the names then needs the only one and copies
# (docs/design-principles.cn.md 3.5, 6.11; docs/technical/18_sync_control_semantics.md).
[[tests]]
name = "var_alias_through_param"
desc = "`var v = big` gives the array `big` is a second name, in the cell of `v`. A write through a `var` parameter of a callee (`xs[0] = 9`) reaches the cell of `v`, and the array's count sees the two names, so the write copies: `big` keeps the value it was read as."
kind = "behavior"
case = "../../../cases/linear/byref/var_alias_through_param.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout = "big[0] = 1  v[0] = 9\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "var_alias_captured"
desc = "A closure that reads the cell of `v`, and a `let` name of the same array: the closure reads whatever the cell holds at the call, and the write to `v[0]` copies because the cell is a second name of the array `big` is, so `big` keeps its value while the closure sees the write."
kind = "behavior"
case = "../../../cases/linear/byref/var_alias_captured.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout = "big[0] = 1  v[0] = 9  f() = 9\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 10000

[[tests]]
name = "var_alias_two_cells"
desc = "One array in two `var` cells and a `let` name: three names for one storage, so the write to `a[0]` copies and `src` and `b` keep what they were read as."
kind = "behavior"
case = "../../../cases/linear/byref/var_alias_two_cells.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout = "src[0] = 1  a[0] = 9  b[0] = 1\n"
