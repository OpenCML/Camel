[[tests]]
name = "var_array_append.macro"
desc = "A differentiated function that grows an array variable with `acc = acc->append<v>` (the in-place `:op/assn_append`, design principles 2.12) and reads its length (`:var/peek`): no gradient flows through the array; value and gradient are those of the plain call, under std::macro on the node VM and the bytecode VM."
kind = "behavior"
case = "../../../cases/modules/autodiff/var_array_append.cml"
args = ["${case}", "std::macro", "${backend}"]
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_exit = 0
expect_stdout = "plain call: value 3.0\nvalue_and_grad: value 3.0 grad 3.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
