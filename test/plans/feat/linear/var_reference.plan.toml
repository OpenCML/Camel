}
"""
timeout_ms = 20000

# These two entries pinned a refusal whose premise is gone: they required exit 1 with 'a variable
# of a differentiable type that is declared inside the differentiated function is read there'.
# The read that rule is about is a read of a CELL taken as a constant, and since stage S1 a
# same-region local `var` of a body is built as the value it was given -- there is no cell for
# this program to read (internal/plans/2026-11-16-direct-ssa-construction.cn.md). What the
# rule protected against is a gradient that would be silently wrong, and the repair it names --
# bind the value with `let` -- is what the compiler now builds, so the gradient flows and is the
# true one: t = (p0 * x) * 2, sum(t) = 2, d sum(t) / d p0 = 2 * x = [2, 4], sum = 6. The rule
# itself still stands where a cell really is read, and the four entries around this one
# (`var_tensor_read_after_write`, `var_tensor_read_after_call`, `var_tensor_read_in_callee`) keep
# it on the wire. What these two pin now is the other direction: if this local ever went back to
# being a cell, the run would be refused again and the entry would say so.

[[tests]]
name = "var_tensor_local.run"
desc = "Runs, and the gradient is the true one: a variable of a differentiable type declared inside the differentiated function is a same-region local, so it is built as the value it was given and not as a cell (stage S1), and the read carries the gradient instead of being a variable read taken as a constant. This was refused until the local became a value; the diagnostic's own repair was to bind it with `let`. sum(t) is 2 and d sum(t) / d p0 is 2 * x = [2, 4], summed 6."
kind = "behavior"
case = "../../../cases/modules/autodiff/var_tensor_local.cml"
args = ["${case}"]
expect_exit = 0
expect_stdout = "value 2.0 grad 6.0\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

