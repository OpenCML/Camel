[[tests]]
name = "var_tensor_read_after_write.run"
desc = "Refused with a clear diagnostic instead of a silently wrong gradient: the variable is read after the function assigned it a value that depends on a differentiated parameter (run-time error at the gradient call)."
kind = "behavior"
case = "../../../cases/modules/autodiff/var_tensor_read_after_write.cml"
args = ["${case}"]
expect_exit = 1
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const text = input.normalized.stdout + (input.stderr || '')
assert(text.includes('Gradients do not flow through variables'), 'the diagnostic states the rule: ' + text)
assert(text.includes('is not ordered before that assignment'), 'the diagnostic names the case: ' + text)
assert(!text.includes('grad '), 'no gradient is printed')
}
"""
timeout_ms = 20000

