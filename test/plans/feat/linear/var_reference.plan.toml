desc = "A path assignment on an unshared `var` array does not copy: 30 writes in a loop allocate nothing (the delta of `std::mem::blocks().allocs`), while the control of 10 rounds that read the variable in between allocates 10 (one copy each). The first write after `var v = [...]` allocates one, since `:var/new` does not mark the cell as owning its array; after `let kept = v` a write allocates one and `kept` is unchanged."
