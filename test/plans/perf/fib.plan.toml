id = "perf.fib"
tier = "benchmark"
tags = ["perf", "fib"]

[[tests]]
name = "nvm_timeit"
kind = "benchmark"
case = "../../cases/perf/fib_recursive.cml"
args = ["${timeit_nvm_10}", "${case}", "${run_nvm}"]
expect_exit = 0
snapshot_stream = "stdout"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 15000
perf_budget_platform = "local.sample"
perf_budget_mean_ms = 250
perf_budget_tolerance_pct = 200

