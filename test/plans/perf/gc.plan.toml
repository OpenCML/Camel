id = "perf.gc"
order = 420
tier = "slow"
tags = ["perf", "gc", "soak"]
desc = """
Minute-long soak and gigabyte-scale runs of both collectors; not part of the default set.

gc_soak with 2,000,000 steps allocates 13.7 GB around a live table of 20,000 rows. Measured on
the development machine (18 threads, busy with other work): generational 81 s, 5,236 minor
collections, 0.2 s stopped in all, longest stop 5.6 ms, 20,372 objects promoted (the table),
elder space 32 MB; mark-sweep 105 s, 412 major collections, 39 s stopped, longest stop 363 ms,
elder space 64 MB. gc_live_large with mb=1024 keeps 1.5 GB of small objects alive (1,707 blocks
of 4,096 rows): generational 6 s, mark-sweep 8 s, peak resident size 1.7 GB with either.

The assertions are on what must not depend on the length of the run: the size of the old
spaces and the number of promoted objects. The comparison itself is made with
`python3 test/tools/gcbench/gcbench.py`.

The two `gc_timeit_cycles` tests run the command that was seen to end in an access violation
(docs/handover/reports/H9.md, section 2) once per collector: `--timeit std::nvm/10` rebuilds and
destroys the module, the graph and the Context ten times in one process, which is the cycle the
crash was in. They expect exit 0 and check from the allocator's statistics that the collector of
the test really collected during those ten iterations (10 minor collections for the generational
collector, 10 major ones for mark-sweep), so a run that somehow skipped collection does not pass
silently. The longer hunt, thousands of processes with the frequency written down, is
`python3 test/tools/timeitloop/timeitloop.py`.
"""

[[tests]]
name = "gc_timeit_cycles.generational"
desc = "Ten --timeit cycles of alloc_small on the generational collector: every cycle runs and the moving collector collects and moves."
kind = "behavior"
case = "../../cases/perf/gc/alloc_small.cml"
args = ["--passes", "std::profile(gc_stats=1,report=false,hints=false),std::nvm", "--gc", "generational", "--timeit", "std::nvm/10", "${case}", "--arg", "reps=200000", "--output-format", "json"]

expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
assert(input.stdout.includes('"kind": "timeit"'), `no timeit summary on stdout: ${input.stdout}`)
assert(/"iterations": 10/.test(input.stdout), `not every cycle ran: ${input.stdout}`)
const line = /.camel. gc: major=.*/.exec(input.normalized.stderr)
assert(line !== null, `no statistics line of the allocator in stderr: ${input.normalized.stderr}`)
const field = (name) => {
    const m = new RegExp(name + '=([0-9.]+)').exec(line[0])
    assert(m !== null, `no ${name} in: ${line[0]}`)
    return Number(m[1])
}
assert(field('minor') >= 10, `the young generation was collected in every cycle: ${line[0]}`)
assert(field('moved') > 0, `the moving collector moved nothing: ${line[0]}`)
}
"""
timeout_ms = 300000

[[tests]]
name = "gc_timeit_cycles.mark_sweep"
desc = "Ten --timeit cycles of alloc_small on mark-sweep: every cycle runs and the collector sweeps."
kind = "behavior"
case = "../../cases/perf/gc/alloc_small.cml"
args = ["--passes", "std::profile(gc_stats=1,report=false,hints=false),std::nvm", "--gc", "mark-sweep", "--timeit", "std::nvm/10", "${case}", "--arg", "reps=200000", "--output-format", "json"]

expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
assert(input.stdout.includes('"kind": "timeit"'), `no timeit summary on stdout: ${input.stdout}`)
assert(/"iterations": 10/.test(input.stdout), `not every cycle ran: ${input.stdout}`)
const line = /.camel. gc: major=.*/.exec(input.normalized.stderr)
assert(line !== null, `no statistics line of the allocator in stderr: ${input.normalized.stderr}`)
const field = (name) => {
    const m = new RegExp(name + '=([0-9.]+)').exec(line[0])
    assert(m !== null, `no ${name} in: ${line[0]}`)
    return Number(m[1])
}
assert(field('major') >= 10, `mark-sweep did not collect in every cycle: ${line[0]}`)
}
"""
timeout_ms = 300000

[[tests]]
name = "gc_soak_long.generational"
desc = "2,000,000 steps, generational collector: the old spaces and the number of promoted objects are those of a run of 3,000 steps."
kind = "behavior"
case = "../../cases/feat/mm/gc/gc_soak.cml"
args = ["--gc", "generational", "${case}", "std::profile(gc_stats=1,report=false,hints=false)", "--arg", "rows=20000", "--arg", "reps=2000000", "${run_fvm}"]

expect_exit = 0
expect_stdout_contains = ["gc_soak total=9576131"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const line = /.camel. gc: major=.*/.exec(input.normalized.stderr)
assert(line !== null, `no statistics line of the allocator in stderr: ${input.normalized.stderr}`)
const field = (name) => {
    const m = new RegExp(name + '=([0-9.]+)').exec(line[0])
    assert(m !== null, `no ${name} in: ${line[0]}`)
    return Number(m[1])
}
assert(field('elder_reserved_mb') <= 32 && field('elder_live_mb') <= 8, `the elder space did not grow: ${line[0]}`)
assert(field('promoted') <= 60000, `only the live table is promoted: ${line[0]}`)
assert(field('minor') >= 3000, `minor collections ran throughout: ${line[0]}`)
assert(field('minor_pause_max_ms') <= 200, `no long stop: ${line[0]}`)
}
"""
timeout_ms = 900000

[[tests]]
name = "gc_soak_long.mark_sweep"
desc = "2,000,000 steps, default collector: the elder space stays at two segments."
kind = "behavior"
case = "../../cases/feat/mm/gc/gc_soak.cml"
args = ["--gc", "mark-sweep", "${case}", "std::profile(gc_stats=1,report=false,hints=false)", "--arg", "rows=20000", "--arg", "reps=2000000", "${run_fvm}"]

expect_exit = 0
expect_stdout_contains = ["gc_soak total=9576131"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const line = /.camel. gc: major=.*/.exec(input.normalized.stderr)
assert(line !== null, `no statistics line of the allocator in stderr: ${input.normalized.stderr}`)
const field = (name) => {
    const m = new RegExp(name + '=([0-9.]+)').exec(line[0])
    assert(m !== null, `no ${name} in: ${line[0]}`)
    return Number(m[1])
}
assert(field('elder_reserved_mb') <= 64, `the elder space is bounded: ${line[0]}`)
assert(field('major') >= 200, `major collections ran throughout: ${line[0]}`)
}
"""
timeout_ms = 900000

[[tests]]
name = "gc_live_gb.generational"
desc = "1.5 GB of small objects alive (generational): the elder space grows to ten segments and is marked and swept."
kind = "behavior"
case = "../../cases/feat/mm/gc/gc_live_large.cml"
args = ["--gc", "generational", "${case}", "std::profile(gc_stats=1,report=false,hints=false)", "--arg", "mb=1024", "--arg", "reps=20", "${run_fvm}"]

expect_exit = 0
expect_stdout_contains = ["gc_live_large blocks=1707 total=8454636"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const line = /.camel. gc: major=.*/.exec(input.normalized.stderr)
assert(line !== null, `no statistics line of the allocator in stderr: ${input.normalized.stderr}`)
const field = (name) => {
    const m = new RegExp(name + '=([0-9.]+)').exec(line[0])
    assert(m !== null, `no ${name} in: ${line[0]}`)
    return Number(m[1])
}
// The generational collector keeps the newest part of the live set young: the statistics line
// reports elder_live_mb=1271.2 with promoted=6992852 and moved=8542283, and the rest of the 1.5 GB
// is still in the young spaces when the program ends. The mark-sweep variant allocates directly
// into the elder space and keeps all of it there (elder_live_mb=2070.4), so only this variant asks
// for most of the live set -- with the space still bounded by its ten segments.
assert(field('elder_live_mb') >= 1200 && field('elder_reserved_mb') <= 2304, `elder space: ${line[0]}`)
}
"""
timeout_ms = 900000

