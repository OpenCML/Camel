id = "perf.reduce_layout"
order = 425
tier = "slow"
tags = ["perf", "training", "reduction", "layout"]

# One operator of the d=256 step, measured on its own.  The step budget
# (perf.step_budget) cannot resolve a two-millisecond row on the reference host, so a change to a
# reduction or a layout kernel is priced here instead: `test/cases/perf/reduce_layout.py` generates
# one program per shape the step issues (sum_to leading, sum_to trailing, sum_to identity,
# expand_axis, permute/permute_inverse, transpose, sum_axis), each running a single expression's
# forward and backward, and reads the operator's own row of `std::profile`.
#
#   reduce_layout.count   The guard, and it pins properties rather than durations: the operator
#                         calls of a round are the pinned ones; `sum_to` allocates exactly one
#                         block per call (its output), so the fast path may not add a temporary;
#                         the printed checksum is the pinned one, so a change to the order or the
#                         accumulation type of a reduction fails here instead of passing behind a
#                         rounding bound; and the same program one round longer prints it too.
#   reduce_layout.ops     The measurement.  Each shape is profiled `SAMPLES` times and the least
#                         contended round of those runs gives every row of that shape its numbers,
#                         so a row's time and the round it is divided by come from one run; every
#                         row is also read against a reference kernel of the same shape in the same
#                         run, which is what survives this host's load and what a change is compared
#                         by.  The whole procedure runs a second time at another round count as the
#                         null control, so each row carries two independent estimates of one number
#                         and their ratio is the instrument's own resolution.  The table is printed
#                         and no duration is asserted.

[[tests]]
name = "reduce_layout.count"
desc = "The reductions and layout operators the d=256 step issues, one program per shape: each round issues the pinned number of calls (one sum_to, one expand_axis, two permute, two transpose, one sum_axis), sum_to allocates one block per call and nothing for the identity case, and the reduction's pinned checksum does not move with the round count."
kind = "behavior"
tool = "python"
case = "../../cases/perf/reduce_layout.py"
args = ["${case}", "count"]
expect_exit = 0
expect_stdout_contains = ["reduce layout counts: PASS"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 600000

[[tests]]
name = "reduce_layout.ops"
desc = "Per-operator cost of those kernels at the step's shapes: each shape profiled until a least-contended round gives every row of it its time, each row also read against a reference kernel of the same shape in the same run, and the whole procedure repeated at another round count as the null control; the table is printed and no duration is asserted."
kind = "behavior"
tool = "python"
case = "../../cases/perf/reduce_layout.py"
args = ["${case}", "ops"]
expect_exit = 0
expect_stdout_contains = ["reduce layout ops: PASS", "sum_to", "ns/call"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 1800000