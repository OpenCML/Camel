# The cost of everything `camel` does before a program runs.
#
# A declaration module (`stdlib/<module>.cml`) is parsed and compiled like a library when it is
# imported. The tool derives their set and their declaration count from the tree, so a new module is
# measured the day its `.cml` lands; the printed count is the tool's, never a pinned one. This plan
# pins four commands that run before any program code does: the process itself (`--version`), a
# one-line program with no imports, `inspect --ops` on a program that imports every standard library
# module, and that same program run through `std::nvm`.
#
# The unit is CPU time (user + system), not the wall clock --
# that gate reads the compiler's own CPU time for one reason:
#
#   "改量 CPU 时间，不量墙钟。共享主机上的墙钟随负载漂移，这正是 40/45/100/90 ms 在负载 106–130
#     下报红的原因；进程的 CPU 时间（用户态 + 内核态）基本不随负载变（该判定已经用 CPU 中位数）。
#    四条命令的天花板改为按 CPU 时间、取安静主机中位数加余量；"负载下红不算回归"的口径因此不需要。"
#
# So a crossed ceiling is a regression and never "the host was busy": the 1/5/15-minute load average
# is printed beside the numbers as provenance, not as an excuse, and the wall clock is not gated at
# all. Each ceiling is about two and a half times the quiet median of its command. Measured on the
# Linux host (AMD EPYC 7343, 32 threads) on 2026-10-23 -- sixty fresh processes per command (five
# samples of twelve) in each of four windows, at load 92.9, 75.2, 72.6 and 68.7 -- with the window
# at load 21.4, which read the same CPU time, as the quiet column:
#
#   version          median 4.2-5.0 ms (samples 4.2-5.8)     quiet 4.89   ceiling 12
#   imports_nothing  median 7.5-10.0 ms (samples 7.5-10.8)    quiet 7.01   ceiling 18
#   inspect_ops      median 39.2-44.2 ms (samples 38.3-45.0)  quiet 37.97  ceiling 95
#   imports_all      median 40.8-42.5 ms (samples 37.5-43.3)  quiet 36.19  ceiling 90
#
# They are a smoke alarm for "the standard library is now loaded before the program runs", not a
# percentage budget: the small commands' cost jumping to the full-import cost, +30 ms, crosses the
# first two on the first sample. The wall-clock ceilings they replace were 40/45/100/90 ms and read
# 13.0 ms for `--version`, which compiles nothing, at load 106-130 on 2026-10-23 -- the reading the
# rule answered. The older numbers and their spread, the wall-clock ceilings and the 30%
# share this rule replaced, stand together as the record of that unit -- the note that kept
# them states the unit they belong to.
#
# `declarations=` is how many declarations the run compiles; it is printed for the record and moves
# whenever a module is migrated. It is not asserted: the per-declaration ceiling and the absolute
# total are.
#
# `declaration.cost` is the same idea one level down: the compiler's own
# `--time-phases` report of the declaration modules, added up and divided by their declarations, read
# in the CPU time that report writes per phase. The process clock cannot resolve that work (the four
# ceilings above are tens of milliseconds), so this is the measurement that moves when the declaration
# path changes. Its two readings and its structural assertion are the two the author chose on
# 2026-10-23 ("declaration-cost-gate" (b)):
#
#   "选 3 + 2：结构断言"每个（阶段, 模块）每轮恰好出现一次"管重复编译；绝对的 CPU 总量管整体变慢；
#    30% 共享率这条线退休。"
#
# Every round of the measurement asserts that each (phase, module) among parse, GCT and declare
# appears exactly once -- a module compiled twice names itself, which no ratio and no total can -- and
# the round's parse + GCT + declare CPU is read against an absolute total (12 ms: 's
# candidate, sized for the 4.6 ms regression the per-declaration ceiling cannot see, and 1.2 times the
# busiest median measured here). The 30% share of the compile work is deleted, not commented out: it
# was the load-invariant half of a pair whose other half was the wall clock, and with CPU time there
# is nothing left for it to excuse. Its numbers stay in
# docs/technical/50_pyplot_cpython_init.md §4.3 as the record of the unit and rule it belonged to.
#
# That measurement is CPU for the same reason as the four ceilings: the wall clock of those same
# phases read 21 us per declaration on the quiet host and 75-104 us at load 106-112 on 2026-10-23,
# while the CPU reading of the same rounds is 27.5-28.5 us in every window measured at load 68-112.
# The compiler henceforth writes `cpu_ns` beside `wall_ns` per phase (src/utils/phase_timer.cpp), and
# a platform with no process CPU clock makes the line report an error instead of reading the wall
# clock.
#
# The test prints one `startup.cost` line per command (cpu median, min, max, n, runs per sample,
# ceiling, `result=PASS|FAIL`) and one `declaration.cost` line (declarations, CPU per declaration and
# total, rounds, duplicates, both ceilings, result), and fails only when a median crosses its ceiling.
# A failure names the measurement, the value and the ceiling on standard output
# (`startup-cost: FAILED ...`), which is the stream the plan keeps, so a red log carries the reason
# rather than a bare exit 1.
#
# It is `parallel = false`: the gate is an absolute millisecond bound, and this runner gives a
# benchmark the machine alone for the same reason. Beside five other tests (the full layer at
# `-Jobs 6`) the number measures the scheduler, not startup. Alone it does not measure a quiet host
# either: the other worktrees on this machine are outside this runner's slots, which is why the load
# average is printed beside the medians rather than assumed away, and why the unit is CPU time.
id = "perf.startup"
order = 401
tier = "slow"
tags = ["perf", "startup"]

[[tests]]
name = "startup.cost"
desc = "The whole-process CPU cost of --version, a one-line program, inspect --ops over the whole standard library and the same program on the run path, plus the declaration modules' own CPU work."
kind = "behavior"
parallel = false
tool = "node"
case = "../../tools/startup-cost.mjs"
# `${camel}` is the compiler of the build under test, named as an argument.
args = ["${case}", "--camel", "${camel}"]
expect_exit = 0
expect_stdout_contains = ["startup.cost metric=cpu_user_plus_system", "startup.cost version", "startup.cost imports_nothing", "startup.cost inspect_ops", "startup.cost imports_all", "declaration.cost declarations=", "per_declaration_us=", "total_ms=", "duplicates=0"]
# The runner judges this entry on its own CPU time for the same reason the tool inside it
# already reads its four ceilings that way (see the header above), by the rule of
# 2026-10-23 (docs/handover/reviews/questions-2026-10-23.md, "declaration-cost-gate" (a)):
#
#   "改量 CPU 时间，不量墙钟。共享主机上的墙钟随负载漂移 ... 进程的 CPU 时间（用户态 + 内核态）基本
#    不随负载变"
#
# Measured on the Linux host (32 threads; the 1-minute load read 76.41/76.92/80.97 and
# 85.69/91.25/84.56), the entry at two run lengths:
#
#   7.58 s of CPU / 14.77 s wall   (2026-10-24, nine perf plans in one run at -Jobs 8)
#   7.40 s of CPU / 17.59 s wall   (2026-10-24, those plans beside feat/mm/gc and two gpu plans)
#
# The 248 processes of the measurement are the entry's work, and it is fixed, so a reading is the
# slope of its own CPU against that work. The CPU figure spreads 2.4 % between the windows where
# the wall clock spreads 19 %. The budget is 13 s: 1.63x the higher reading rounded up to the
# next 1000 ms -- the headroom the four resnet referees of feat/modules/autodiff.plan.toml took
# -- and 1.72x the busiest reading seen. The timeout below stays and is now only what it says:
# 120 s is 6.8x the busiest wall of 17.59 s, so it catches a hang, not a busy host.
cpu_budget_ms = 13000
# Four commands (two warm-ups plus five samples of twelve runs each: 248 processes) and 21 rounds of
# `inspect --ops` took 18.6-18.9 s on this host at load 92.9, so 120 s catches a hang, not a slow run.
timeout_ms = 120000