[[tests]]
name = "grow.stage8_causal_attn"
desc = "Stage 7 with the causal mask added and nothing else changed.  The reading that matters first is the attention weights before any training: row 0 is [1.0, 0.0], so position 0 sees only itself and the mask really is in force; row 1 is [0.578, 0.422], so position 1 still mixes.  Then the loss: 2.600174800352 to 1.281279765502, which crosses the abstention floor 1.386294 and puts both argmax back at [1, 0], but does not beat stage s six 0.949558422 -- the mask recovers the position signal and adds nothing on top of it.  The twenty step lines are pinned at twelve decimals from `grow.py --stage 8`."
