id = "perf.showcase_d5_tree_lstm"
order = 903
tier = "milestone"
tags = ["showcase", "slow", "d5", "tree-lstm", "recursion"]

# The small configuration of showcase/d5-tree-lstm: 256 four-leaf trees, a recursive
# Tree-LSTM, 200 Adam steps, one sentence per step.  It runs in seconds and fails when the
# losses or the validation accuracy disagree beyond the tolerances.  The data and the report
# go under ${test_tmp}, this run's own scratch directory: a literal `tmp/...` is one place two
# runs would write.

[[tests]]
name = "small"
desc = "D5 small configuration: compare.py runs the recursive Camel Tree-LSTM and its PyTorch counterpart on the same trees and checks every logged training loss and the initial and final validation accuracy; it exits non-zero when a bound is exceeded."
kind = "behavior"
tool = "python"
case = "../../../showcase/d5-tree-lstm/compare.py"
args = ["${case}", "--profile", "small", "--data", "${test_tmp}/d5-showcase-small", "--results", "${test_tmp}/d5-showcase-small/RESULTS.md"]
skip_unless = ["${python}", "-c", "import numpy, torch, psutil"]
expect_exit = 0
expect_stdout_contains = ["d5 compare: PASS"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
# The cost bound is this test's own CPU time (user + system), and the timeout below is its liveness
# bound, by the rule:
#
#   "改量 CPU 时间，不量墙钟。共享主机上的墙钟随负载漂移 ... 进程的 CPU 时间（用户态 + 内核态）基本
#    不随负载变"
#
# This entry is the small profile of showcase/d5-tree-lstm (256 four-leaf trees, a recursive Tree-LSTM, 200 Adam steps, both implementations), run against its PyTorch counterpart: its cost is
# arithmetic on both sides and the profile is fixed, so a reading is its own CPU against that work.
# Measured on the Linux host (32 threads, shared with other worktrees and engines; the 1-minute load
# read 76.41/76.92/80.97 in the first window and 85.69/91.25/84.56 in the second).
#
#   10.38 s of CPU / 21.08 s wall   (2026-10-24, the eleven slow plans of this sweep, 186 tests)
#   9.50 s of CPU / 12.46 s wall   (2026-10-24, the same entry beside the collection fuzz runs)
#
# The CPU figure spreads 9.3 % between the windows where the wall clock spreads more. The budget is
# 17 s: 1.63x the higher reading rounded up to the next 1000 ms -- the headroom the four resnet
# referees of feat/modules/autodiff.plan.toml took -- and 1.64x the busiest reading seen.
# The wall clock used to decide this test through the runner's 4x margin, 30 s of this
# timeout, and the busiest run read 21.08 s of that: 30 % of room.
# The timeout below stays; it is only the liveness bound.
cpu_budget_ms = 17000
timeout_ms = 120000