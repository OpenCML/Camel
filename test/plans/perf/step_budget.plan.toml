id = "perf.step_budget"
order = 424
tier = "slow"
tags = ["perf", "training", "budget"]

# The measured half of the plan.  The 2026-10-25 ruling on the eight perf plans that no layer
# reached split the plan in two: the guards (`step.count` and `step.elementwise`, which assert
# counts and properties and no duration) are `perf.step_counts`, in the release gate's slow layer,
# and this file keeps the budget and is in that gate's FORBIDDEN list -- it runs before a release.
#
# Where one d=256 Camel training step's time goes: `examples/models/naive-in-expert-out/train_step.cml`
# at the sweep's d=256 cell (batch 16 x sequence 32, d_model 256, 16 heads of width 16, FFN 512,
# vocabulary 32, two blocks), generated by substituting exactly those extents the way measure.py
# does.  The case lives in perf/ rather than in feat/ because it measures the reference host.
#
#   step.budget   the budget itself.  It records the step's CPU time, profiles the step and its two
#                 phases, and prints one row per measured quantity with its share and the residual.
#                 The assertions are structural: every phase's rows account for its round mean, the
#                 residual is small, and the element-wise forward/backward split covers each row.
#                 The absolute numbers are recorded, not asserted: the host is shared, and the same
#                 step measured 62-64 ms of CPU time across a morning while its wall time moved
#                 between 65 and 159 ms.
[[tests]]
name = "step.budget"
desc = "The per-step budget of the same program: the step's CPU time from two run lengths, the round mean and its rows for the forward, forward+backward and full phases, the allocation row net of the operator rows, the element-wise split, and a residual that stays under 15 % of the step."
# No wall-clock budget: the case records the step's CPU time and prints the table, and what it
# asserts is that the rows account for the round and that the residual stays small.  On a shared
# host a mean over rounds would measure the neighbours.
kind = "behavior"
tool = "python"
case = "../../cases/perf/step_budget.py"
args = ["${case}", "budget", "--camel", "${camel}"]
expect_exit = 0
expect_stdout_contains = ["step budget: PASS", "matmul", "residual"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
# The cost bound is this test's own CPU time (user + system), and the timeout below is its liveness
# bound, by the author's ruling of 2026-10-23 (docs/handover/reviews/questions-2026-10-23.md,
# "declaration-cost-gate" (a)):
#
#   "改量 CPU 时间，不量墙钟。共享主机上的墙钟随负载漂移 ... 进程的 CPU 时间（用户态 + 内核态）基本
#    不随负载变"
#
#
# The case records the step's own CPU time and asserts the table's structure, not a duration
# (see the header above), so the runner bounds the cost of this entry, which is a fixed
# amount of profiled work. Measured on the Linux host (32 threads; the 1-minute load read
# 76.41/76.92/80.97 and 85.69/91.25/84.56), the entry at two run lengths:
#
#   36.53 s of CPU / 81.03 s wall   (2026-10-24, nine perf plans in one run at -Jobs 8)
#   35.91 s of CPU / 69.50 s wall   (2026-10-24, those plans beside feat/mm/gc and two gpu)
#   37.40 s of CPU / 86.05 s wall   (2026-10-24, the gate run of this sweep, 109 tests)
#
# The CPU figure spreads 1.7-4.0 % across the three windows where the wall clock spreads 17-24 %.
# The budget is 61 s: 1.63x the highest reading rounded up to the next 1000 ms -- the headroom the
# four resnet referees of feat/modules/autodiff.plan.toml took -- and 1.63x the busiest reading
# seen. The timeout below stays; by the ruling above it is the liveness bound only.
cpu_budget_ms = 61000
timeout_ms = 1800000