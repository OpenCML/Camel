id = "perf.step_budget"
order = 424
tier = "slow"
tags = ["perf", "training", "budget"]

# Where one d=256 Camel training step's time goes: `examples/models/naive-in-expert-out/train_step.cml`
# at the sweep's d=256 cell (batch 16 x sequence 32, d_model 256, 16 heads of width 16, FFN 512,
# vocabulary 32, two blocks), generated by substituting exactly those extents the way measure.py
# does.  The case lives in perf/ rather than in feat/ because it measures the reference host; the
# count test below asserts counts and no duration, and runs in about two seconds.
#
#   step.count    the guard on the graph, not on the clock.  One profiled round of the step must
#                 issue exactly the operator calls CALLS_PER_STEP lists: 17 matmuls, 17 left and 17
#                 right argument gradients, 53 multiplies, 31 divides, 34 adds, 60 sum_to, and so on,
#                 and the forward-only build must issue no gradient operator at all.  A change that
#                 doubles a product, adds a pass over the parameters or breaks the backward pass
#                 fails here; a slow host cannot.  The element-wise shape tables (which the per
#                 operator probe measures) are checked against the same counts.
#   step.elementwise
#                 the guard on the kernels, also a count: every element-wise operator of the step
#                 allocates exactly one allocator block per call, its output.  A kernel that
#                 materializes a polynomial or a tangent in a temporary allocates more, and this is
#                 where that shows up; no duration is asserted.
#   step.budget   the budget itself.  It records the step's CPU time, profiles the step and its two
#                 phases, and prints one row per measured quantity with its share and the residual.
#                 The assertions are structural: every phase's rows account for its round mean, the
#                 residual is small, and the element-wise forward/backward split covers each row.
#                 The absolute numbers are recorded, not asserted: the host is shared, and the same
#                 step measured 62-64 ms of CPU time across a morning while its wall time moved
#                 between 65 and 159 ms.
#
# Neither test needs the GEMM probe: the shapes of the products are checked against the program's
# own extents (PRODUCT_COUNTS versus expected_products), and `measure` mode, which runs
# test/tools/gemmprobe and writes the committed JSON, is a developer command because it needs a
# compiler on the build host.

[[tests]]
name = "step.count"
desc = "One profiled round of the d=256 step issues the pinned number of operator calls (17 matmuls, 34 matmul gradients, 53 multiplies, 31 divides, 60 sum_to, ...) and the forward-only build issues no gradient operator: the graph's work is pinned by count, not by duration."
kind = "behavior"
tool = "python"
case = "../../cases/perf/step_budget.py"
args = ["${case}", "count"]
expect_exit = 0
expect_stdout_contains = ["step operator counts: PASS"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 300000

[[tests]]
name = "step.elementwise"
desc = "Every element-wise operator of the d=256 step allocates exactly one allocator block per call (its output): a gradient kernel that materializes an intermediate scores more, which is a count of blocks and not a duration."
kind = "behavior"
tool = "python"
case = "../../cases/perf/step_budget.py"
args = ["${case}", "elementwise"]
expect_exit = 0
expect_stdout_contains = ["step elementwise: PASS"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 300000

[[tests]]
name = "step.budget"
desc = "The per-step budget of the same program: the step's CPU time from two run lengths, the round mean and its rows for the forward, forward+backward and full phases, the allocation row net of the operator rows, the element-wise split, and a residual that stays under 15 % of the step."
# No wall-clock budget: the case records the step's CPU time and prints the table, and what it
# asserts is that the rows account for the round and that the residual stays small.  On a shared
# host a mean over rounds would measure the neighbours.
kind = "behavior"
tool = "python"
case = "../../cases/perf/step_budget.py"
args = ["${case}", "budget"]
expect_exit = 0
expect_stdout_contains = ["step budget: PASS", "matmul", "residual"]
expect_output_not_contains = ["FAIL"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 1800000