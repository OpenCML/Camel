id = "perf.showcase_d4_mcts"
order = 904
tier = "milestone"
tags = ["showcase", "slow", "d4", "mcts", "search"]

# The small configuration of showcase/d4-mcts: the Camel search and its Python counterpart
# on seven cases -- four positions and the three guards -- at 2000 playouts, 5000 on the empty
# board.  compare.py diffs the two outputs line for line, so a single differing line fails the
# test, and it writes its report under ${test_tmp}, this run's own scratch directory: a literal
# `tmp/...` is one place two runs would write.  The Python counterpart is the standard library
# alone, so nothing here needs torch or NumPy.

[[tests]]
name = "small"
desc = "D4 small configuration: compare.py runs the Camel Monte-Carlo tree search and its Python counterpart on four positions and the three guards and requires the same exit code and the same output, line for line; it also checks the four back ends build the same tree, and it exits non-zero on the first difference."
kind = "behavior"
tool = "python"
case = "../../../showcase/d4-mcts/compare.py"
args = ["${case}", "--profile", "small", "--results", "${test_tmp}/d4-showcase-small/RESULTS.md"]
skip_unless = ["${python}", "-c", "import sys"]
expect_exit = 0
expect_stdout_contains = ["d4 compare: PASS"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
# The cost bound is this test's own CPU time (user + system), and the timeout below is its liveness
# bound, by the rule:
#
#   "改量 CPU 时间，不量墙钟。共享主机上的墙钟随负载漂移 ... 进程的 CPU 时间（用户态 + 内核态）基本
#    不随负载变"
#
# This entry is the small profile of showcase/d4-mcts (four positions and three guards at 2000 playouts, both implementations), run against its PyTorch counterpart: its cost is
# arithmetic on both sides and the profile is fixed, so a reading is its own CPU against that work.
# Measured on the Linux host (32 threads, shared with other worktrees and engines; the 1-minute load
# read 76.41/76.92/80.97 in the first window and 85.69/91.25/84.56 in the second).
#
#   3.57 s of CPU / 6.80 s wall   (2026-10-24, the eleven slow plans of this sweep, 186 tests)
#   3.22 s of CPU / 4.67 s wall   (2026-10-24, the same entry beside the collection fuzz runs)
#
# The CPU figure spreads 10.9 % between the windows where the wall clock spreads more. The budget is
# 6 s: 1.63x the higher reading rounded up to the next 1000 ms -- the headroom the four resnet
# referees of feat/modules/autodiff.plan.toml took -- and 1.68x the busiest reading seen.
# The timeout below stays; it is only the liveness bound.
cpu_budget_ms = 6000
timeout_ms = 120000