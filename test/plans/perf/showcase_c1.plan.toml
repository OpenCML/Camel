id = "perf.showcase_c1_linear_logistic"
order = 901
tier = "slow"
tags = ["showcase", "slow", "c1", "linear", "logistic"]

# The small configuration of showcase/c1-linear-logistic: deterministic synthetic data,
# 200 steps of SGD for linear regression and 200 for logistic regression, both implementations
# of each.  It runs in seconds and fails when the two disagree beyond the tolerances, so the
# example cannot rot silently.  The data and the report go under ${test_tmp}, this run's own
# scratch directory: a literal `tmp/...` is one place two runs (or two plans, side by side)
# would write, and a run would read what the other one left.

[[tests]]
name = "small"
desc = "C1 small configuration: compare.py runs the Camel program and its PyTorch counterpart for linear and logistic regression on the same data and checks the initial loss, every logged training loss, the final validation loss and the final metric; it exits non-zero when a bound is exceeded."
kind = "behavior"
tool = "python"
case = "../../../showcase/c1-linear-logistic/compare.py"
args = ["${case}", "--profile", "small", "--data", "${test_tmp}/c1-showcase-small", "--results", "${test_tmp}/c1-showcase-small/RESULTS.md"]
skip_unless = ["${python}", "-c", "import numpy, torch, psutil"]
expect_exit = 0
expect_stdout_contains = ["c1 compare: PASS"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
# The cost bound is this test's own CPU time (user + system), and the timeout below is its liveness
# bound, by the rule (docs/handover/reviews/questions-2026-10-23.md,
# "declaration-cost-gate" (a)):
#
#   "改量 CPU 时间，不量墙钟。共享主机上的墙钟随负载漂移 ... 进程的 CPU 时间（用户态 + 内核态）基本
#    不随负载变"
#
# This entry is the small profile of showcase/c1-linear-logistic (200 SGD steps for linear and logistic regression, both implementations), run against its PyTorch counterpart: its cost is
# arithmetic on both sides and the profile is fixed, so a reading is its own CPU against that work.
# Measured on the Linux host (32 threads, shared with other worktrees and engines; the 1-minute load
# read 76.41/76.92/80.97 in the first window and 85.69/91.25/84.56 in the second).
#
#   14.09 s of CPU / 25.29 s wall   (2026-10-24, the eleven slow plans of this sweep, 186 tests)
#   13.99 s of CPU / 19.05 s wall   (2026-10-24, the same entry beside the collection fuzz runs)
#
# The CPU figure spreads 0.7 % between the windows where the wall clock spreads more. The budget is
# 23 s: 1.63x the higher reading rounded up to the next 1000 ms -- the headroom the four resnet
# referees of feat/modules/autodiff.plan.toml took -- and 1.63x the busiest reading seen.
# The wall clock used to decide this test through the runner's 4x margin, 30 s of this
# timeout, and the busiest run read 25.29 s of that: 16 % of room, on a host whose load is
# other people's work.
# The timeout below stays; it is only the liveness bound.
cpu_budget_ms = 23000
timeout_ms = 120000