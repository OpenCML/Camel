id = "perf.showcase_c1_linear_logistic"
order = 901
tier = "slow"
tags = ["showcase", "slow", "c1", "linear", "logistic"]

# The small configuration of showcase/c1-linear-logistic (H13): deterministic synthetic data,
# 200 steps of SGD for linear regression and 200 for logistic regression, both implementations
# of each.  It runs in seconds and fails when the two disagree beyond the tolerances, so the
# example cannot rot silently.

[[tests]]
name = "small"
desc = "C1 small configuration: compare.py runs the Camel program and its PyTorch counterpart for linear and logistic regression on the same data and checks the initial loss, every logged training loss, the final validation loss and the final metric; it exits non-zero when a bound is exceeded."
kind = "behavior"
tool = "python"
case = "../../../showcase/c1-linear-logistic/compare.py"
args = ["${case}", "--profile", "small", "--data", "tmp/c1-showcase-small", "--results", "tmp/c1-showcase-small/RESULTS.md"]
skip_unless = ["${python}", "-c", "import numpy, torch, psutil"]
expect_exit = 0
expect_stdout_contains = ["c1 compare: PASS"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 120000