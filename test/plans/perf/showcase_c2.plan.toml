id = "perf.showcase_c2_mlp_mnist"
order = 900
tier = "milestone"
tags = ["showcase", "slow", "c2", "mlp", "mnist"]

# The small configuration of showcase/c2-mlp-mnist: a deterministic synthetic
# stand-in for MNIST (no dataset download), 1000 training samples, 200 steps of Adam,
# a 200-row validation set.  It runs both implementations of the showcase (the Camel
# program and the PyTorch baseline) and fails when they disagree beyond the numeric
# tolerances, so the example cannot rot silently.  The full numbers in
# showcase/c2-mlp-mnist/RESULTS.md come from `--profile standard`, which uses MNIST when
# the repository cache holds it and regenerates the synthetic stand-in otherwise.
#
# The plan runs in the slow tier: `npm run test` skips it and `--tier all` runs it;
# the small profile takes seconds, not minutes.

[[tests]]
name = "small"
desc = "C2 small configuration: compare.py runs the Camel MLP and its PyTorch counterpart on the same deterministic synthetic data and checks the initial loss, every logged training loss, the final validation loss and accuracy, and the checkpoint round trip; it exits non-zero when one bound is exceeded."
kind = "behavior"
tool = "python"
case = "../../../showcase/c2-mlp-mnist/compare.py"
args = ["${case}", "--profile", "small", "--data", "${test_tmp}/c2-showcase-small", "--results", "${test_tmp}/c2-showcase-small/RESULTS.md"]
skip_unless = ["${python}", "-c", "import numpy, torch, psutil"]
expect_exit = 0
expect_stdout_contains = ["c2 compare: PASS"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
# The cost bound is this test's own CPU time (user + system), and the timeout below is its liveness
# bound, by the rule (docs/handover/reviews/questions-2026-10-23.md,
# "declaration-cost-gate" (a)):
#
#   "改量 CPU 时间，不量墙钟。共享主机上的墙钟随负载漂移 ... 进程的 CPU 时间（用户态 + 内核态）基本
#    不随负载变"
#
# This entry is the small profile of showcase/c2-mlp-mnist (1000 synthetic samples, 200 Adam steps, both implementations), run against its PyTorch counterpart: its cost is
# arithmetic on both sides and the profile is fixed, so a reading is its own CPU against that work.
# Measured on the Linux host (32 threads, shared with other worktrees and engines; the 1-minute load
# read 76.41/76.92/80.97 in the first window and 85.69/91.25/84.56 in the second).
#
#   7.17 s of CPU / 11.73 s wall   (2026-10-24, the eleven slow plans of this sweep, 186 tests)
#   7.24 s of CPU /  8.90 s wall   (2026-10-24, the same entry beside the collection fuzz runs)
#   7.88 s of CPU / 12.07 s wall   (2026-10-24, the gate run of this sweep, 109 tests)
#
# The CPU figure spreads 1.0-9.9 % across the three windows where the wall clock spreads more. The
# budget is 13 s: 1.63x the highest reading rounded up to the next 1000 ms -- the headroom the four
# resnet referees of feat/modules/autodiff.plan.toml took -- and 1.65x the busiest reading seen.
# The timeout below stays; it is only the liveness bound.
cpu_budget_ms = 13000
timeout_ms = 180000
