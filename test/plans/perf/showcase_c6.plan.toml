id = "perf.showcase_c6_vae"
order = 902
tier = "milestone"
tags = ["showcase", "slow", "c6", "vae", "autoencoder"]

# The small configuration of showcase/c6-vae: four Gaussian clusters in the plane, a
# 2-16-2 VAE, 200 Adam steps, and a fixed epsilon file shared by both implementations.  It
# runs in seconds and fails when the losses disagree beyond the tolerances.  The data and the
# report go under ${test_tmp}, this run's own scratch directory: a literal `tmp/...` is one
# place two runs would write.

[[tests]]
name = "small"
desc = "C6 small configuration: compare.py runs the Camel VAE and its PyTorch counterpart on the same data and epsilons and checks the initial loss, every logged training loss, the final validation loss and the reconstruction error; it exits non-zero when a bound is exceeded."
kind = "behavior"
tool = "python"
case = "../../../showcase/c6-vae/compare.py"
args = ["${case}", "--profile", "small", "--data", "${test_tmp}/c6-showcase-small", "--results", "${test_tmp}/c6-showcase-small/RESULTS.md"]
skip_unless = ["${python}", "-c", "import numpy, torch, psutil"]
expect_exit = 0
expect_stdout_contains = ["c6 compare: PASS"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
# The cost bound is this test's own CPU time (user + system), and the timeout below is its liveness
# bound, by the rule (docs/handover/reviews/questions-2026-10-23.md,
# "declaration-cost-gate" (a)):
#
#   "改量 CPU 时间，不量墙钟。共享主机上的墙钟随负载漂移 ... 进程的 CPU 时间（用户态 + 内核态）基本
#    不随负载变"
#
# This entry is the small profile of showcase/c6-vae (four Gaussian clusters, a 2-16-2 VAE, 200 Adam steps, both implementations), run against its PyTorch counterpart: its cost is
# arithmetic on both sides and the profile is fixed, so a reading is its own CPU against that work.
# Measured on the Linux host (32 threads, shared with other worktrees and engines; the 1-minute load
# read 76.41/76.92/80.97 in the first window and 85.69/91.25/84.56 in the second).
#
#   8.13 s of CPU / 14.00 s wall   (2026-10-24, the eleven slow plans of this sweep, 186 tests)
#   9.10 s of CPU / 11.32 s wall   (2026-10-24, the same entry beside the collection fuzz runs)
#
# The CPU figure spreads 11.9 % between the windows where the wall clock spreads more. The budget is
# 15 s: 1.63x the higher reading rounded up to the next 1000 ms -- the headroom the four resnet
# referees of feat/modules/autodiff.plan.toml took -- and 1.65x the busiest reading seen.
# The timeout below stays; it is only the liveness bound.
cpu_budget_ms = 15000
timeout_ms = 120000