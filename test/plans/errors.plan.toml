id = "errors.all"
tier = "regression"
tags = ["errors"]

[[tests]]
name = "runtime.divide_by_zero"
kind = "negative"
case = "../cases/errors/runtime/divide_by_zero.cml"
args = ["${case}"]
expect_exit = 1
expect_stdout_contains = ["division by zero"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 4000

