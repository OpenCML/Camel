id = "gpu.tiles_decorator"
order = 903
tier = "slow"
tags = ["gpu", "modules", "tiles"]

[[tests]]
name = "static_regions"
kind = "behavior"
# gpu_regions.cml decorates the function explicitly with gpu() and inspects that value:
# regions<f> reports the outlined graph (no regions, one context argument per outlined call).
# A @gpu name is rewritten by std::macro to the plain function it wraps, so the case must not
# inspect the decorated name.
tool = "python"
case = "../../cases/modules/tiles/gpu_regions.py"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["GPU decorator regions: mixed execution, captures, macro and CPU fallback PASS"]
# Ten subprocess runs with GC stress; 12 s alone, and under a loaded full sweep the 60 s budget
# is not enough.
timeout_ms = 180000

[[tests]]
name = "direct_and_nested"
kind = "behavior"
case = "../../cases/modules/tiles/gpu_decorator.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
expect_exit = 0
expect_stdout_exact = "66.0\n14.0\n28.0\n66.0\n12.0 14.0\ntrue\ntrue\ntrue\n66.0\n66.0\n"
timeout_ms = 60000

[[tests]]
name = "macro_and_nested"
kind = "behavior"
case = "../../cases/modules/tiles/gpu_decorator.cml"
args = ["${case}", "std::macro", "std::nvm"]
expect_exit = 0
expect_stdout_exact = "66.0\n14.0\n28.0\n66.0\n12.0 14.0\ntrue\ntrue\ntrue\n66.0\n66.0\n"
timeout_ms = 60000

[[tests]]
name = "missing_device"
kind = "negative"
case = "../../cases/modules/tiles/gpu_decorator.cml"
# A device named by --devices must be there, whatever this machine has: 63 is not, and the
# diagnostic names it (the devices the machine does have are in the reason). The first use
# here is a `@gpu` call, and that report has no source position yet (`(add):?:?:` in the short
# format; H105 report, section 7 question 6), so this asserts the message rather than a parsed
# located diagnostic.
args = ["--devices", "63", "${case}", "std::nvm"]
envs = ["CUDA_VISIBLE_DEVICES=-1"]
expect_exit = 1
expect_output_contains = ["CUDA device 63 was named by --devices but is not available"]
timeout_ms = 10000

[[tests]]
name = "unsupported_computation_fallback"
kind = "behavior"
case = "../../cases/modules/tiles/gpu_fallback.cml"
args = ["${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
expect_exit = 0
expect_stdout_exact = "true\n5.0\ncpu effect\n8.0\n10.0\n10.0\n5.0 6.0\n"
timeout_ms = 60000
