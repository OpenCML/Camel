# --- No host fallback inside `#gpu` (GPU design 6.1) -------------
# A `#gpu` scope promises the device runs everything written in it and in the functions it
# calls. An operator without a device program at this use is a compile-time error, never a host
# run; the cases below pin the promise, the refusal, the host behaviour outside a scope
# (temporary), and the shape retry that must keep working.

[[tests]]
name = "nofallback.supported_runs_on_device"
kind = "behavior"
case = "../../cases/gpu/nofallback/supported.cml"
# Every operator in the scope has a device program for its static shapes: the pass accepts it and
# the region runs on the device (one kernel), not on the host.
args = ["${case}", 'std::profile json="${test_tmp}/profile.json"', "tiles::compile", "std::nvm"]
skip_unless = ["node", "test/tools/have-cuda-device.mjs", "0"]
expect_exit = 0
verify_script = """
async ({ input, assert }) => {
const fs = await import('node:fs')
const report = JSON.parse(fs.readFileSync(input.test_tmp + '/profile.json', 'utf8'))
assert(input.stdout.includes('14.0'), input.stdout)
assert(report.device_work.kernels >= 1, JSON.stringify(report.device_work))
}
"""
timeout_ms = 60000

