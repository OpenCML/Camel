[[tests]]
name = "consistency.nvm"
kind = "behavior"
case = "../../cases/modules/tiles/consistency.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const values = input.normalized.stdout.trim().split(/\s+/).map(Number)
assert(values.length === 5 && values.every(Number.isFinite), 'expected five finite error measurements')
assert(values[0] < 0.005, 'odd-size tiled matmul differs from CPU')
assert(values[1] < 0.0001, 'softmax differs from CPU')
assert(values.slice(2).every(x => x === 0), 'broadcast, cache refresh, or reshape mismatch')
}
"""
timeout_ms = 60000

