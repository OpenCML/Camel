[[tests]]
name = "nofallback.branch_arms_are_segments"
kind = "behavior"
case = "../../cases/gpu/nofallback/branch.cml"
# `regions<choose>()` before the rewrite: what the compiler would take for the whole program. An
# operator in an arm is not excluded for its control edge (GPU design 2.5) — an arm is where it
# runs, so each arm is a segment of its own. No pass rewrites the graph here, so the table is the
# analysis of the program as written.
args = ["--devices", "cpu", "${case}", "std::nvm"]
envs = ["CUDA_VISIBLE_DEVICES=-1"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const text = input.normalized.stdout
const at = text.indexOf('{"schema":1')
assert(at >= 0, `no region table in: ${text}`)
let depth = 0, end = -1
for (let i = at; i < text.length; i++) {
    if (text[i] === '{') depth++
    else if (text[i] === '}' && --depth === 0) { end = i + 1; break }
}
const report = JSON.parse(text.slice(at, end))
assert(report.regions.length === 2, JSON.stringify(report))
const counts = report.regions.map((r) => r.members.length).sort().join(',')
assert(counts === '1,1', `one operator per arm: ${JSON.stringify(report.regions)}`)
const reasons = report.excluded.map((e) => e.reason)
assert(!reasons.includes('control_edge'), JSON.stringify(report.excluded))
}
"""
timeout_ms = 30000

[[tests]]
name = "nofallback.branch_segment_is_written_in_the_arm"
kind = "behavior"
case = "../../cases/gpu/nofallback/branch.cml"
# Where the pass writes the arm's call: inside the arm region. Writing it in the body instead
# would lift the arm's computation out of the branch and run the arm that is not taken, which is
# the defect the design's 2.5 names. `std::jgir` reads the graph the pass produced, so this is a
# structural guard and needs no device.
args = ["--devices", "cpu", "${case}", "tiles::compile", "std::jgir"]
envs = ["CUDA_VISIBLE_DEVICES=-1"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const NL = String.fromCharCode(10)
const text = input.normalized.stdout
// The pass prints its placement report before the dump, and the dump is the JSON document the
// graph is read from.
const at = text.indexOf(NL + '{')
assert(at >= 0, `no jgir document in: ${text.slice(0, 400)}`)
const dump = JSON.parse(text.slice(at + 1))
const names = dump.graphs.map((g) => g.name).join(', ')
const choose = dump.graphs.find((g) => g.name === 'choose')
assert(choose, `no graph choose in ${names}`)
const arms = (choose.regions || []).filter((r) => r.kind === 'arm')
assert(arms.length === 2, JSON.stringify(choose.regions))
const ids = new Set(dump.graphs.filter((g) => g.name.startsWith('choose/tiles.region/')).map((g) => g.id))
assert(ids.size === 2, `expected two extracted regions in ${names}`)
// A segment is reached through the function constant the pass holds for its region graph: the
// constant is a value in the body, and the node that reads it is the call, which must not be.
const constants = new Set(choose.nodes.filter((n) => n.kind === 'DATA' && ids.has(n.callee)).map((n) => n.id))
assert(constants.size === 2, `expected two function constants, got ${constants.size} in ${names}`)
const calls = choose.nodes.filter((n) => choose.edges.some((e) => e.kind === 'context' && constants.has(e.source) && e.target === n.id))
assert(calls.length === 2, `expected two segment calls, got ${calls.length}`)
for (const call of calls)
    assert(arms.some((r) => r.id === call.region), `segment ${call.id} runs in ${call.region || 'body'}, not in an arm; arms ${JSON.stringify(arms.map((r) => r.id))}; nodes ${choose.nodes.map((n) => `${n.id}:${n.kind}:${n.region || 'body'}`).join(' ')}`)
}
"""
timeout_ms = 30000

