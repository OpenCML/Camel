[[tests]]
name = "graph_facts.nvm"
kind = "behavior"
case = "../../cases/modules/tiles/graph_facts.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
timeout_ms = 30000
verify_script = """
({ input, assert }) => {
const lines = input.stdout.trim().split(/\r?\n/)
assert(lines.length === 12, 'expected seven plans and five comparisons')
const plans = lines.slice(0,7).map(JSON.parse)
for (const p of plans.slice(0,2)) {
  assert(p.graph_fact_instances === 2 && p.specialized_instances === 0, 'static graph facts not reused')
}
for (const p of plans.slice(2)) {
  assert(p.graph_fact_instances === 0 && p.specialized_instances === 2, 'call specialization leaked into shared graph')
}
assert(plans[2].logical_bytes === plans[4].logical_bytes && plans[2].logical_bytes !== plans[3].logical_bytes, 'shape specialization not isolated')
assert(plans[5].logical_bytes !== plans[6].logical_bytes, 'captured axis did not specialize')
for (const line of lines.slice(7)) assert(Number(line) === 0, 'fact-backed execution differs')
}
"""

