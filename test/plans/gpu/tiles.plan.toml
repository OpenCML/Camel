id = "gpu.tiles"
order = 900
tier = "gpu"
tags = ["gpu", "modules", "tiles"]

[[tests]]
name = "boundaries.nvm"
kind = "behavior"
case = "../../cases/modules/tiles/boundaries.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const values = input.normalized.stdout.trim().split(/\s+/).map(Number)
assert(values.length === 5 && values.every(x => x === 0), 'capture, call, reduction, or empty dimension mismatch')
}
"""
timeout_ms = 60000

