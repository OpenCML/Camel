[[tests]]
name = "benchmark_protocol"
kind = "behavior"
case = "../../cases/modules/tiles/benchmark.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const records = input.normalized.stdout.trim().split(String.fromCharCode(10)).map(JSON.parse)
assert(records.length === 4, 'expected four benchmark workloads')
for (const r of records) {
  assert(r.schema === 1 && r.repetitions === 21 && r.warmups === 5, 'unexpected measurement protocol')
  assert(r.device && r.driver_version > 0 && r.nvrtc_version, 'missing hardware/compiler provenance')
  assert(JSON.stringify(r.compile_options) === JSON.stringify([r.target, '--std=c++14', '--fmad=false', '--prec-div=true', '--prec-sqrt=true', '--ftz=false']), 'unexpected numerical compiler policy')
  assert(r.correctness_before.mismatches === 0 && r.correctness_after.mismatches === 0, 'correctness gate failed')
  for (const c of [r.correctness_before, r.correctness_after]) {
    assert(c.bitwise_elements > 0 && c.relaxed_elements === 0, 'strict benchmark must compare output bits')
    assert(c.reference === 'same-device unfused execution', 'benchmark reference must be explicit')
  }
  for (const name of ['optimized', 'unfused']) {
    const v = r[name]
    assert(v.device_ms.length === 21 && v.upload_host_ms.length === 21, 'missing raw samples')
    assert(v.device_ms.every(t => Number.isFinite(t) && t >= 0), 'invalid device timing')
    assert(v.upload_host_ms.every(t => Number.isFinite(t) && t >= 0), 'invalid upload timing')
    assert(v.device_min_ms <= v.device_median_ms && v.device_median_ms <= v.device_p90_ms, 'invalid quantiles')
  }
}
assert(records[0].optimized.plan.kernels === 1 && records[0].unfused.plan.kernels === 5, 'missing unfused control')
assert(records[2].identical_device_code === true, 'matmul must be the same-code noise control')
assert(records[3].optimized.plan.stages[0].implementation === 'parallel_max', 'missing parallel reduction')
assert(records[3].unfused.plan.stages[0].implementation === 'standard', 'missing serial reduction control')
}
"""
timeout_ms = 60000

[[tests]]
name = "fusion.nvm"
kind = "behavior"
case = "../../cases/modules/tiles/fusion.cml"
args = ["${case}", "std::nvm"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
verify_script = """
({ input, assert }) => {
const lines = input.normalized.stdout.trim().split(String.fromCharCode(10))
assert(lines.length === 4, 'expected two plans and two errors')
const chain = JSON.parse(lines[0]), fork = JSON.parse(lines[2])
assert(chain.kernels === 1 && chain.stages[0].members.length === 5, 'chain was not fused')
assert(fork.kernels === 2 && fork.allocations < fork.materialized_values, 'shared result or storage reuse incorrect')
assert(chain.allocated_bytes < chain.logical_bytes / 2, 'fusion did not remove intermediate storage')
assert(Number(lines[1]) < 0.0002 && Number(lines[3]) < 0.0002, 'GPU fusion differs from CPU')
}
"""
timeout_ms = 60000

