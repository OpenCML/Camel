[[tests]]
name = "grad_expand.untagged_graph_unchanged"
kind = "behavior"
case = "../../cases/gpu/nofallback/grad_expand_plain.cml"
# A grad call site no scope covers: `tiles::compile` leaves the operator alone (it is the
# consumer of a derived graph, not its author), and the program is dumped as a whole (`std::jgir`)
# so that every node, edge, attribute and reference is read. The reading is that the runtime
# operator is still there and that no pass expanded it outside a scope.
args = ["--devices", "cpu", "${case}", "tiles::compile", "std::jgir"]
envs = ["CUDA_VISIBLE_DEVICES=-1"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const NL = String.fromCharCode(10)
const text = input.normalized.stdout
// The pass prints one report line per graph before the dump, so the document starts after it.
const at = text.startsWith('{') ? 0 : text.indexOf(NL + '{') + 1
assert(at > 0 || text.startsWith('{'), `no jgir document in: ${text.slice(0, 400)}`)
const dump = JSON.parse(text.slice(at))
const step = dump.graphs.find((g) => g.name === 'step')
assert(step, JSON.stringify(dump.graphs.map((g) => g.name)))
assert(step.nodes.some((n) => n.label === 'autodiff:with_grad'), JSON.stringify(step.nodes))
assert(!dump.graphs.some((g) => g.name.startsWith('grad(')), 'a graph was expanded outside a scope')
assert(!text.includes('macro operator no pass has expanded'), 'an untagged program was refused as a missing prerequisite')
}
"""
timeout_ms = 30000

[[tests]]
name = "grad_expand.untagged_graph_keeps_the_runtime_operator"
kind = "negative"
case = "../../cases/gpu/nofallback/grad_expand_plain.cml"
# The same program without the dump: the reading is that the pass is silent where no scope covers
# the call site -- it neither expands the operator nor refuses it, so neither of its two messages
# may appear -- and that the run then reaches the runtime operator, whose refusal is its own. The
# value it names is the one the compiled region hands back: `tiles::compile` cut `loss` into a
# region and the region's result is an f32 scalar, so the resident value that reaches
# `tiles:download` and carries no gradient channel is `Device<f32>` (a resident tensor keeps its
# extents in the name: the same dump prints the parameters as `(Device<f32[2, 3]>, Device<f32[3]>)`).
args = ["--devices", "cpu", "${case}", "tiles::compile", "std::nvm"]
envs = ["CUDA_VISIBLE_DEVICES=-1"]
expect_exit = 1
expect_output_contains = ["RuntimeDiag::RuntimeError", "depends on a differentiated parameter", "Device<f32>"]
expect_output_not_contains = ["macro operator no pass has expanded", "cannot run on the device", "has no device program"]
timeout_ms = 30000

# --- Residency is derived from the graph (GPU design 3.2) --------------------------------------
# `TILES_RESIDENCY` prints the conclusion the transfer-inserting half of M5 reads: a value's block
# is decided by its producer, a call's parameters follow their arguments' blocks, a loop's state
# stays where it was made. The test compares the conclusion with the outlines the same run leaves,
# so the number it pins is the disagreement M5's second half removes, not a number copied here.
# The driver is a node script: it starts camel with `--devices cpu`, so it names no card, and a
# Python test here would join the device layer's pinned census
# (test/tools/check-cuda-visibility.mjs) for no reading it could not take in node.

[[tests]]
name = "resident_loop_declares_its_blocks"
kind = "behavior"
tool = "node"
case = "../../cases/modules/tiles/resident_loop.mjs"
args = ["${case}", "--camel", "${camel}"]
envs = ["CUDA_VISIBLE_DEVICES=-1"]
tier = "fast"
expect_exit = 0
expect_stdout_contains = ["Resident loop: PASS"]
timeout_ms = 60000
