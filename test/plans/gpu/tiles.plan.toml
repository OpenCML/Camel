# --- Compile-time derived graphs inside a scope (GPU design 2.6) ---------------------------
# `grad`/`with_grad` are runtime operators: they build the derived graph while they run, after
# every pass has finished, so a `#gpu` scope that asks for a gradient would hold an operator no
# pass sees and the device has no program for. `tiles::compile` applies `autodiff::expand` to the
# scope graphs first (docs/design/gpu/plan-modules.cn.md 5, decision 2), and the cases below pin the expansion, the
# placement the derived graph inherits, the value it must not change, and the refusal of a
# function only the run knows.

[[tests]]
name = "grad_expand.runtime_operator_values"
kind = "behavior"
case = "../../cases/gpu/nofallback/grad_expand.cml"
# No expansion pass: `with_grad` builds `grad(loss)` at run time, as it always has. The last two
# lines are the distances of the two paths' gradients from each other and from the hand-written
# `[5, 7, 9]` (the column sum of `x`); this run is the reference the next entry compares against.
args = ["--devices", "cpu", "${case}", "std::nvm"]
envs = ["CUDA_VISIBLE_DEVICES=-1"]
expect_exit = 0
verify_script = """
({ input, assert }) => {
const NL = String.fromCharCode(10)
const tails = input.normalized.stdout.trimEnd().split(NL).slice(-2).join(',')
assert(tails === 'moved 0.0,wrong 0.0', JSON.stringify(tails))
}
"""
timeout_ms = 30000

[[tests]]
name = "grad_expand.expanded_values_are_identical"
kind = "differential"
case = "../../cases/gpu/nofallback/grad_expand.cml"
# The same program with the expansion in the pipeline: `std::macro` is what expands a macro
# operator (design principles 8), so `step`'s gradient is the derived graph built while compiling.
# The whole normalized stdout — both gradients, both distances and anything else the program
# printed — must be what the run without the pass printed.
args = ["--devices", "cpu", "${case}", "std::macro", "std::nvm"]
envs = ["CUDA_VISIBLE_DEVICES=-1"]
expect_exit = 0
compare_to = "grad_expand.runtime_operator_values"
compare_fields = ["stdout_normalized"]
timeout_ms = 30000

[[tests]]
name = "grad_expand.missing_prerequisite_is_named"
kind = "negative"
case = "../../cases/gpu/nofallback/grad_expand.cml"
# `tiles::compile` is the consumer of the derived graph, not its author: a scope that still holds
# a macro operator is a pipeline defect, and the report says which pass carries the expansion.
# Before the retraction the pass applied `autodiff::expand` itself, so this reading did not exist.
args = ["--devices", "cpu", "${case}", "tiles::compile", "std::nvm"]
envs = ["CUDA_VISIBLE_DEVICES=-1"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::GpuScopeMacroNotExpanded"
expect_diagnostic_code = "0x040001A9"
expect_output_contains = ["`#gpu` scope 'step'", "operator 'autodiff:with_grad'", "is a macro operator no pass has expanded", "put the pass 'std::macro' before this one"]
timeout_ms = 30000

[[tests]]
name = "grad_expand.scope_sees_the_derived_graph"
kind = "negative"
case = "../../cases/gpu/nofallback/grad_expand.cml"
# What the expansion moves: with `std::macro` before the pass the scope no longer holds
# `autodiff:with_grad`, and it is refused for an operator of the derived graph instead. The
# refusal can only name `tensor:broadcast_like` if the derived graph was analysed as part of the
# scope, so it is the proof that the expansion published it. The report shows `grad(loss)` as a
# `#gpu` body: the derived graph inherits the primal's placement, and the primal `loss` carries
# the tag (plan 2.3).
args = ["--devices", "cpu", "${case}", "std::macro", "tiles::compile", "std::nvm"]
envs = ["CUDA_VISIBLE_DEVICES=-1"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::UnhandledError"
verify_script = """
({ input, assert }) => {
const NL = String.fromCharCode(10)
const lines = (input.normalized.stdout + input.normalized.stderr).split(NL).filter(Boolean)
const row = lines.find((l) => l.startsWith('TILES_PLACEMENT') && l.includes('"graph":"grad(loss)"'))
assert(row, `no placement row for grad(loss): ${JSON.stringify(lines.filter((l) => l.startsWith('TILES_PLACEMENT')).map((l) => l.slice(0, 80)))}`)
const report = JSON.parse(row.slice('TILES_PLACEMENT '.length))
assert(report.body === 'gpu-required' && report.body_fact === 'gpu', row)
assert(report.gpu_required === report.nodes, row)
const refusal = lines.find((l) => l.includes("scope 'grad(loss)'"))
assert(refusal, JSON.stringify(lines.filter((l) => l.includes('scope '))))
assert(refusal.includes("operator 'tensor:"), refusal)
assert(refusal.includes('cannot run on the device'), refusal)
assert(!lines.some((l) => l.includes('autodiff:with_grad')), 'the scope still holds the runtime operator')
}
"""
timeout_ms = 30000

