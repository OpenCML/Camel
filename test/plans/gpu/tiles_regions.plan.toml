[[tests]]
name = "resident_graph_transfers"
kind = "behavior"
tool = "python"
case = "../../cases/modules/tiles/resident_graph.py"
# `${camel}` is the compiler of the build under test, named as an argument.
args = ["${case}", "--camel", "${camel}"]
expect_exit = 0
expect_stdout_contains = ["Resident graph transfers: PASS"]
timeout_ms = 20000

[[tests]]
name = "requires_device"
kind = "negative"
case = "../../cases/modules/tiles/region_execution.cml"
# The pass needs a device, and the run was told to use the host only: the diagnostic names the
# configuration and the program location of the first operation that cannot run there.
args = ["--devices", "cpu", "${case}", "tiles::test_outline_gpu", "std::nvm"]
expect_exit = 1
expect_output_contains = ["the run selected the host only (--devices cpu)", "region_execution.cml:6:14"]
timeout_ms = 10000

