[[tests]]
name = "resident_graph_transfers"
kind = "behavior"
tool = "python"
case = "../../cases/modules/tiles/resident_graph.py"
args = ["${case}"]
expect_exit = 0
expect_stdout_contains = ["Resident graph transfers: PASS"]
timeout_ms = 20000

[[tests]]
name = "requires_device"
kind = "negative"
case = "../../cases/modules/tiles/region_execution.cml"
args = ["${case}", "tiles::test_outline_gpu", "std::nvm"]
envs = ["CAMEL_TILES_DEVICE=invalid"]
expect_exit = 1
expect_output_contains = ["CAMEL_TILES_DEVICE must be a nonnegative device ordinal", "region_execution.cml:6:14"]
timeout_ms = 10000

