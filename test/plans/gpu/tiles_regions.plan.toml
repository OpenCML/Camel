id = "gpu.tiles_regions"
order = 904
tier = "slow"
tags = ["gpu", "modules", "tiles"]

# This layer runs against the cards: the Python test here drives camel on a device, and the
# runner's Python default (docs/test-plans.md, "CUDA visibility") would otherwise hide the devices
# from it and let it measure the CPU.
[defaults]
cuda_devices = true

[[tests]]
name = "compiled_region_fresh_inputs_and_captures"
kind = "behavior"
case = "../../cases/modules/tiles/compiled_region.cml"
args = ["--gc", "generational", "${case}", "tiles::compile", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
envs = ["CAMEL_GC_VERIFY=both", "CAMEL_GC_STRESS_SAFEPOINT=1", "CAMEL_GC_STRESS_MODE=minor"]
expect_exit = 0
expect_stdout_exact = "tensor([      4.,      16.,      36.], dtype=float32)\ntensor([      2.,       4.,       6.], dtype=float32)\ntensor([      8.,      10.,      12.], dtype=float32)\ntensor([     64.,     100.,     144.], dtype=float32)\ntensor([      4.,      16.,      36.], dtype=float32)\n"
timeout_ms = 60000

[[tests]]
name = "resident_cpu_gpu_chain"
kind = "behavior"
case = "../../cases/modules/tiles/resident_fallback.cml"
args = ["--gc", "generational", "${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
envs = ["CAMEL_GC_VERIFY=both", "CAMEL_GC_STRESS_SAFEPOINT=1", "CAMEL_GC_STRESS_MODE=minor"]
expect_exit = 0
expect_stdout_exact = "cpu region once\n42.0\n364.0\n21.0\n"
timeout_ms = 60000

[[tests]]
name = "resident_fallback_fault"
kind = "negative"
case = "../../cases/modules/tiles/resident_fallback_fault.cml"
args = ["--gc", "generational", "${case}", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
envs = ["CAMEL_GC_VERIFY=both", "CAMEL_GC_STRESS_SAFEPOINT=1", "CAMEL_GC_STRESS_MODE=minor"]
expect_exit = 1
# A run-time fault is printed on standard output after the program's own output (docs/cli.md,
# "Output and diagnostics"): the CPU fallback runs once and the fault is not swallowed, so the
# program's line is the first line of stdout and the diagnostic follows it.
expect_stdout_starts_with = "cpu fault once"
expect_output_contains = ["RuntimeDiag::DivisionByZero", "resident_fallback_fault.cml:5:16"]
verify_script = """
({ input, assert }) => {
const stdout = input.normalized.stdout
const line = 'cpu fault once'
assert(stdout.startsWith(line), stdout)
const rest = stdout.slice(line.length)
assert(rest.indexOf(line) < 0, rest)
assert(rest.includes('RuntimeDiag::DivisionByZero'), rest)
}
"""
timeout_ms = 60000

[[tests]]
name = "outlined_execution"
kind = "behavior"
case = "../../cases/modules/tiles/region_execution.cml"
args = ["--gc", "generational", "${case}", "tiles::test_outline_gpu", "${backend}"]
backends = ["nvm", "fvm", "jit", "prl"]
envs = ["CAMEL_GC_VERIFY=both", "CAMEL_GC_STRESS_SAFEPOINT=1", "CAMEL_GC_STRESS_MODE=minor"]
expect_exit = 0
expect_stdout_exact = "TILES_OUTLINED 10\n364.0\n84.0\n42.0 364.0\n21.0\n84.0\n"
timeout_ms = 60000

