id = "gpu.reading"
order = 907
tier = "fast"
tags = ["gpu", "tiles"]

# One device run read as numbers, so that "it ran on the card" is a reading and not a claim: the
# description of the device `device()` answers, the kernel whose source the run generated, the
# bytes each way (the element count times four), and the gap between the device's result and the
# host's result on the same values. The card is named by the run, so the layer runs against the
# machines that have one -- and the runner names which card, so a shared host cannot turn this into
# a red about someone else's process.

[[tests]]
name = "device_reading"
desc = "A 256-element function on the device, under `std::profile`: the description `device()` answers is the card's, the kernel the run generated is in the source, 1024 bytes cross each way (256 f32 elements), the device compiles once, and the device's answer is the host's answer element by element."
kind = "behavior"
case = "../../cases/gpu/reading/device_reading.cml"
# The card is the runner's to pick rather than device 0: `--devices 0` names the one card the child
# can see, whichever ordinal the host gave it. A host whose cards are all occupied skips this test
# with their numbers named, instead of failing it as if the code had broken.
cuda_free_device = true
args = ["--devices", "0", "${case}", 'std::profile json="${test_tmp}/profile.json"', "std::nvm"]
# The precondition asks the same question through the surface that existed before `--devices`, with
# the chosen card in its environment: a build without the CUDA back end, or a machine with no card,
# skips here; a build with both runs the test.
skip_unless = ["node", "test/tools/have-cuda-device.mjs", "0"]
expect_exit = 0
verify_script = """
async ({ input, assert }) => {
    const fs = await import('node:fs')
    const report = JSON.parse(fs.readFileSync(input.test_tmp + '/profile.json', 'utf8'))

    // The device the run used, as the report names it: `cuda:<ordinal>`.
    assert(/^cuda:\d+$/.test(String(report.device)), 'the report names the device the run used')

    const work = report.device_work
    assert(work && work.kernels >= 1, 'the device ran at least one kernel')
    assert(work.compiles >= 1, 'the device compiled the kernel it ran')
    // 256 f32 elements each way: the reading says how many elements the run carried. The arguments
    // cost 1032 bytes -- the 1024 of the array plus the 8 the segment passes beside it -- and the
    // result is the array alone.
    assert(work.to_device_bytes === 1032, 'the arguments are 256 f32 elements, 1024 bytes, plus 8')
    assert(work.to_host_bytes === 1024, 'the result is 256 f32 elements, 1024 bytes')
    assert(work.transfers >= 2, 'the value crossed to the device and back')
    assert(work.syncs >= 1, 'the host waited for the device')

    // The program's own lines: the device's description, the gap against the host, and the source
    // of the kernel that ran.
    const lines = input.stdout.split('\n')
    assert(!/no device/.test(lines[0]), `device() answered a device, not the no-device value: ${lines[0]}`)
    assert(/sm_\d+/.test(lines[0]), `device() names the compute capability: ${lines[0]}`)
    assert(Number(lines[1]) === 0, `the device and the host agree element by element (gap ${lines[1]})`)
    assert(/extern "C" __global__ void \w+\(/.test(input.stdout), 'the source names the kernel that ran')
}
"""
timeout_ms = 180000