id = "linear.nvm"
tier = "functional"
tags = ["functional", "linear", "nvm"]

[[tests]]
name = "acc"
desc = "Checks deep tail-recursive accumulation on NVM so self recursion does not collapse under a long linear run."
kind = "behavior"
case = "../../../cases/linear/nvm/acc.cml"
args = ["${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

