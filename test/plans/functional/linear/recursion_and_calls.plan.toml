id = "linear.recursion_and_calls"
order = 344
tier = "functional"
tags = ["functional", "linear", "recursion", "calls"]

[[tests]]
name = "tail_accumulator.nvm"
desc = "Checks deep tail-recursive accumulation on NVM so self recursion does not collapse under a long linear run."
kind = "behavior"
case = "../../../cases/linear/nvm/acc.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

