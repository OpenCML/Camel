id = "linear.jit"
tier = "functional"
tags = ["functional", "linear", "jit"]

[[tests]]
name = "branch_join"
desc = "Checks JIT branch lowering on nested joins so each control-flow arm returns the expected value."
kind = "behavior"
case = "../../../cases/linear/jit/branch_join.cml"
args = ["${case}", "${run_jit}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

