id = "linear.closures_and_state"
order = 342
tier = "functional"
tags = ["functional", "linear", "closures", "state"]

[[tests]]
name = "decorator_single.nvm"
desc = "Checks a single decorator can wrap a function and adjust its result through a captured value."
kind = "behavior"
case = "../../../cases/linear/nvm/decorator_single.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

