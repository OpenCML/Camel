id = "trans.cpp"
tier = "functional"
tags = ["functional", "trans", "cpp"]

[[tests]]
name = "exec_mod_scalar"
desc = "Checks the C++ translation path lowers scalar modulo logic and executes the generated program."
kind = "behavior"
case = "../../../cases/trans/cpp/exec_mod_scalar.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

[[tests]]
name = "main_io"
desc = "Checks the C++ translation path preserves imports, formatting, timing calls, and stdout side effects."
kind = "behavior"
case = "../../../cases/trans/cpp/main_io.cml"
args = ["${case}", "std::cpp"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000
