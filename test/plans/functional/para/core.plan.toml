id = "para.core"
order = 350
tier = "functional"
tags = ["functional", "para"]

[[tests]]
name = "asian_option_mc"
desc = "Stresses the parallel scheduler with many independent Monte Carlo option-pricing workers."
kind = "behavior"
case = "../../../cases/para/core/asian_option_mc.cml"
args = ["${case}"]
expect_exit = 0
failure_note = "This workload is intentionally heavy and exceeds the default local full-suite time budget on typical developer machines."
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 30000

