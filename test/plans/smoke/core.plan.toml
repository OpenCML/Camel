[[tests]]
name = "runtime.gc_verify_stress_nvm"
desc = "Checks GC verification and deterministic stress requests can run at pass safepoints."
kind = "behavior"
case = "../../cases/smoke/core/fib10_pipeline.cml"
args = ["${case}", "std::gc::verify", "${run_nvm}"]
