[[tests]]
name = "runtime.nvm_runtime"
kind = "behavior"
case = "../../cases/smoke/core/fib10_pipeline.cml"
args = ["${case}", "${run_nvm}"]
expect_exit = 0
expect_stdout_contains = ["Fibonacci(10) = 55"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_duration_seconds"]
timeout_ms = 4000

[[tests]]
name = "runtime.fvm_runtime"
kind = "differential"
case = "../../cases/smoke/core/fib10_pipeline.cml"
args = ["${case}", "${run_fvm}"]
expect_exit = 0
compare_to = "runtime.nvm_runtime"
compare_fields = ["exit_code", "stdout_normalized"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_duration_seconds"]
timeout_ms = 4000

[[tests]]
name = "runtime.inline_fvm_runtime"
