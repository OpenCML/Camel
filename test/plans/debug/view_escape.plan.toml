id = "debug.view_escape"
order = 900
tier = "debug"
tags = ["debug", "view", "guard", "accumulator"]
desc = """
A deliberate escape, and a positive test that the guard catches it.

`std::gc::views_escape` reads a compact `(int, int)` element through the reused thread-local view
cell and hands it to the store that keeps a reduce's accumulator (`storeReduceAccumulator`, the
store the node VM's reduce operator calls). That is the escape the guard catches: the accumulator is read again
in a later round, so a view there names the element the round just visited.

In a Debug build `CAMEL_ASSERT_NOT_VIEW` aborts with "A compact element view escaped into the
reduce accumulator", and this plan requires that abort: a non-zero exit and the assertion text.
The test is positive because it fails in every other way -- if the assertion is missing (a Release
binary, or a Debug build where the guard was compiled out) the pass prints `VIEW_ESCAPE
not-caught`, the exit code is 0 and the test fails. The plan is `tier = "debug"`, which no
ordinary layer selects; it runs only under `--tier debug` on the Debug build.
"""

[[tests]]
name = "debug.view_escape_aborts"
desc = "The view reaches the accumulator store and the process aborts with the guard's message, instead of keeping a view into the compact element. A release build has no guard: it prints VIEW_ESCAPE not-caught and exits 0, which this test rejects."
kind = "behavior"
case = "../../cases/feat/mm/blocks.cml"
args = ["${case}", "std::gc::views_escape", "std::nvm"]
expect_exit = 3
expect_stderr_contains = ["Camel Debug Assertion Failed:", "A compact element view escaped into the reduce accumulator"]
expect_output_not_contains = ["VIEW_ESCAPE not-caught"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000

[[tests]]
name = "debug.view_escape_aborts_alias"
desc = "The same escape through the short alias of the pass."
kind = "behavior"
case = "../../cases/feat/mm/blocks.cml"
args = ["${case}", "std::gcviews_escape", "std::nvm"]
expect_exit = 3
expect_stderr_contains = ["Camel Debug Assertion Failed:", "A compact element view escaped into the reduce accumulator"]
expect_output_not_contains = ["VIEW_ESCAPE not-caught"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 60000