id = "probe.foreach_lambda_family"
tier = "fast"
tags = ["probe"]
desc = "The same reading one name further: `map` over a range, whose `with <f: (item: int) => U>` leaves its RESULT type open. The lambda's parameters are known (`int`), the result is what the body gives, and the deferred typing refuses the position until every variable in it has a type. This plan is the measurement, not the acceptance: the card it was written beside asks about `foreach`, whose `with` parameter is complete."

[[tests]]
name = "foreach_lambda_family.array_map"
desc = "The array form, green: `T` comes from the receiver, so the whole `with` parameter is typed before the lambda is built."
kind = "behavior"
case = "../../cases/probe/foreach_lambda/array_map.cml"
args = ["check", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "foreach_lambda_family.range_map"
desc = "The range form, red today: `with <f: (item: int) => U>` -- the parameter types are concrete, the result type is not, and the position is refused as a whole."
kind = "behavior"
case = "../../cases/probe/foreach_lambda/range_map.cml"
args = ["check", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000