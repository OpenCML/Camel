id = "probe.console_order"
order = 9013
tier = "fast"
tags = ["probe"]
desc = "The order of two channels of the console, and of a console write against a file write."

[[tests]]
name = "probe.console_order.gir"
desc = "The order edges the graph carries between the console writes, and the absence of one against the file write."
kind = "behavior"
case = "../../cases/probe/console_order.cml"
args = ["${case}", "std::gir", "std::nop"]
expect_exit = 0
expect_stdout_contains = ["console"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
