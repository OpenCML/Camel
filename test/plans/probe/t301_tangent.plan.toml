id = "probe.t301"
order = 999
tier = "fast"
tags = ["probe"]
desc = "D-1127-217: a discrete result is the user's gradient (design principles 9.9), so jvp lifts it with the zero of its own type; a string result still has none."

[defaults]
kind = "behavior"
args = ["${case}"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space", "normalize_paths"]
timeout_ms = 60000

[[tests]]
name = "a_bool_result_keeps_its_zero"
case = "../../cases/probe/t301/bool.cml"
expect_exit = 0
expect_stdout = "true\nfalse\n"

[[tests]]
name = "an_int_result_keeps_its_zero"
case = "../../cases/probe/t301/int.cml"
expect_exit = 0
expect_stdout = "2\n0\n"

# The reverse half is not pinned here yet, and the reason is a type law rather than this transform:
# `Pullback<F>` names its cotangent `ct: Tangent<ResultOf<F>>`, and `Tangent<T>` is the machinery's
# answer (`tangentSpaceOf`, `src/kernel/core/type/typecall.cpp:178`), which is `()` for a `bool`.
# The forward lift now answers `(value, zero-of-its-own-type)` -- `Lift<bool>` built by `jvp`'s own
# signature law -- so the two statements about one value disagree at the type level, and that is a
# decision about `Tangent<T>` (and about the checked example `is_same::<Lift<int>, (int, ())>` in
# `stdlib/rulesets/jvp.cml`), not something a case here can settle. The case that would pin the
# reverse reading is `test/cases/probe/t301/vjp_bool.cml` (and, for the gradient as a value,
# `test/cases/probe/t301/grad_bool.cml`); both come back with that decision, and neither is an entry
# here until it does.

[[tests]]
name = "a_string_result_still_has_no_tangent"
kind = "negative"
case = "../../cases/probe/t301/string.cml"
expect_exit = 1
expect_diagnostic_name = "SemanticDiag::ArgumentsRejected"
expect_output_contains = ["`jvp` takes a function whose result has a tangent space", "which has none"]
