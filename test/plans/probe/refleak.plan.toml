[[tests]]
name = "probe.box_of_a_round.released"
desc = "Four boxes a CALL makes -- one before the loop and one in each of its three rounds -- the cell keeping the newest and the read after the loop taking it. This entry is RED on purpose, and the red is the measurement: the plan has one node where the run makes three boxes, so the reading is `released=2` for four boxes made, the two superseded boxes stay counted, and the read after the loop is `state::get` on a box the count already released (`created=4 released=2 live=2`, nvm/fvm/jit/prl alike). Asserted here are the numbers the shape should read -- 4 created, 4 released, 0 live, program prints `2` -- so the red names exactly what is missing: a row that can name the value the node made in the *previous* round, which is a per-round version of the value in the representation and not a rule in the plan (src/execute/exec_plan.cpp, `loopRepeatingOver`)."
kind = "behavior"
case = "../../probe/refleak/box_of_a_round.cml"
backends = ["nvm", "fvm", "jit", "prl"]
args = ["--gc-check", "foreign", "${case}", "${backend}"]
expect_exit = 0
backends_agree = ["stdout_normalized", "exit_code"]
verify_script = '''
({ input, assert }) => {
  const said = input.normalized.stdout.split('\n').map(l => l.trim()).filter(Boolean)
    .filter(l => !l.startsWith('FOREIGN_RESOURCES '))
  assert(said.join(' | ') === '2', 'the read after the loop finds the last round box: ' + said.join(' | '))
  const line = input.normalized.output.split('\n').find(l => l.startsWith('FOREIGN_RESOURCES '))
  assert(line !== undefined, 'the run asked for the counted resources and reported none')
  assert(/ created=4 /.test(line), 'four boxes were made: ' + line)
  assert(/ released=4 /.test(line), 'and every one of them gave its count back: ' + line)
  assert(/ live=0 /.test(line), 'nothing is still counted when the program ends: ' + line)
  assert(/ missing=0 /.test(line), 'the plan claims every box the anchor saw: ' + line)
}
'''