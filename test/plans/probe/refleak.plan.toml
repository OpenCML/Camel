[[tests]]
name = "probe.fill_carries.released"
desc = "A `Ref` is carried by a closure a FILL builds (`let f = (): int => state::get(r)`) and read at the call: the box is made by an operator and packed into the closure by the FILL, and the row that gives its producing reference back lands where the closure's last use is. Before item 5 that row was written at a position no back end applies rows at, so the box stayed counted (`live` 1) for the life of the program. Now: `created` 1, `released` 1, `live` 0, and the program still prints `5 5`."
kind = "behavior"
case = "../../probe/refleak/fill_carries.cml"
backends = ["nvm", "fvm", "jit", "prl"]
args = ["--gc-check", "foreign", "${case}", "${backend}"]
