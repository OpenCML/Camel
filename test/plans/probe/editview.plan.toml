id = "probe.editview"
tier = "fast"
tags = ["probe"]
desc = "Probe for the `edit`/`view` front end: the examples the graph-editing design writes are compiled as written, and the reading says what the compiler makes of each one."

[[tests]]
name = "editview.syntax_only"
desc = "`return edit d = f { f }` — the smallest edit block, with a body that needs nothing resolved. Syntax only: what the parser makes of the head. The block's value is the function the commit produces (`G!`), not the last expression of the body, so the enclosing return type is what pins it."
kind = "behavior"
case = "../../cases/probe/editview/syntax_only.cml"
args = ["check", "-s", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.syntax_only_semantic"
desc = "The same file through the semantic check: what the names and types of an edit block make of it."
kind = "behavior"
case = "../../cases/probe/editview/syntax_only.cml"
args = ["check", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.edit_value_is_the_function"
desc = "`edit d = f { 42 }` where a function is expected: the block hands over the function, not the last expression its body writes (design 6, 15.1)."
kind = "behavior"
case = "../../cases/probe/editview/edit_value.cml"
args = ["check", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.edit_value_is_not_the_body"
desc = "The counter-proof: the same block where an `int` is expected is refused, so the body's last expression is not what decides the block's value."
kind = "behavior"
case = "../../cases/probe/editview/edit_value_is_not_the_body.cml"
args = ["check", "${case}"]
expect_exit = 1
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.view_value_is_the_body"
desc = "`view d = f { f }` where the function type is expected: a view block's value is its body's value, so this passes."
kind = "behavior"
case = "../../cases/probe/editview/view_value.cml"
args = ["check", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.view_value_is_not_an_int"
desc = "The other side: the same view block where an `int` is expected is refused, so the body's value is what is pinned."
kind = "behavior"
case = "../../cases/probe/editview/view_value_is_not_an_int.cml"
args = ["check", "${case}"]
expect_exit = 1
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.view_semantic"
desc = "`view d = f { f }` through the semantic check: a view block's value is the body's value, so this is the smallest block whose type is decided."
kind = "behavior"
case = "../../cases/probe/editview/view_only.cml"
args = ["check", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.sec2_fold"
desc = "Design section 2, example 1 (`fold_zero_adds`): an edit block over `nodes`, `filter`, `foreach` and `replace`."
kind = "behavior"
case = "../../cases/probe/editview/sec2_fold.cml"
args = ["check", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.sec2_log"
desc = "Design section 2, example 2 (`log_result`): the block head writes the new function type, and the body reads the exit, inlines a writing function and replaces the exit."
kind = "behavior"
case = "../../cases/probe/editview/sec2_log.cml"
args = ["check", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.sec2_count"
desc = "Design section 2, example 3 (`count_muls`): a view block whose value is the body's value."
kind = "behavior"
case = "../../cases/probe/editview/sec2_count.cml"
args = ["check", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.sec12_step"
desc = "Design section 12, first example: the two edit steps, the second of which the document says is refused at once."
kind = "behavior"
case = "../../cases/probe/editview/sec12_step.cml"
args = ["check", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.sec12_escape"
desc = "Design section 12, second example: the handle leaving its view block and the `replace` written outside any edit block. **Unverified so far**: while no `edit`/`view` block is accepted by `check`, every case here exits 1, so an expectation of exit 1 is met whatever the reason — it says nothing about the escape rule until the blocks compile."
kind = "behavior"
case = "../../cases/probe/editview/sec12_escape.cml"
args = ["check", "${case}"]
expect_exit = 1
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000