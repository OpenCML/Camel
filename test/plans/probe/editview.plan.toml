id = "probe.editview"
tier = "fast"
tags = ["probe"]
desc = "Probe for the `edit`/`view` front end: the examples the graph-editing design writes are compiled as written, and the reading says what the compiler makes of each one."

[[tests]]
name = "editview.syntax_only"
desc = "`return edit d = f { f }` — the smallest edit block, with a body that needs nothing resolved. Syntax only: what the parser makes of the head. The block's value is the function the commit produces (`G!`), not the last expression of the body, so the enclosing return type is what pins it."
kind = "behavior"
case = "../../cases/probe/editview/syntax_only.cml"
args = ["check", "-s", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.syntax_only_semantic"
desc = "The same file through the semantic check: what the names and types of an edit block make of it."
kind = "behavior"
case = "../../cases/probe/editview/syntax_only.cml"
args = ["check", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.edit_value_is_the_function"
desc = "`edit d = f { 42 }` where a function is expected: the block hands over the function, not the last expression its body writes (design 6, 15.1)."
kind = "behavior"
case = "../../cases/probe/editview/edit_value.cml"
args = ["check", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.edit_value_is_not_the_body"
desc = "The counter-proof, first half: the body's last expression is `report(42)`, which runs and says so, and the block's value is still the function. Its twin writes `report(43)` in that place; the answer is the function's in both, only the body's own line differs."
kind = "behavior"
case = "../../cases/probe/editview/body_last_expression_42.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["body last expression= 42", "answer= 6"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.edit_value_is_not_the_body_twin"
desc = "The counter-proof, second half: the same block with `report(43)` as the body's last expression. Read beside its twin: what the body's tail changes is the body's own line, and what it does not change is the answer, so the block's value is the function and not that tail."
kind = "behavior"
case = "../../cases/probe/editview/body_last_expression_43.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["body last expression= 43", "answer= 6"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.body_fault_keeps_function"
desc = "An edit block whose body faults: the block's value is the error the fault became, and the function the head was given answers as it did before -- the changes of an edit block are all in or not at all (design 6, 15.1). The body was rewritten for the block's new reading: `d` is the draft's root, so the body no longer calls it as a function."
kind = "behavior"
case = "../../cases/probe/editview/body_fault_keeps_function.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["block= -1", "old= 6"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.body_return"
desc = "A `return` in an edit block's body ends the body, not the function the block stands in, and the block still commits (design 15.1). The statement after the block runs, and the answer is the function's, not the value the body returned. The body was rewritten for the block's new reading: `d` is the draft's root, so the body no longer calls it as a function, and the `return` it keeps is what pins the panel."
kind = "behavior"
case = "../../cases/probe/editview/body_return.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_contains = ["after the block", "answer= 6"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.head_evaluated_once"
desc = "An edit block's head expression is evaluated once, though the lowering reads the function it gives twice: `open(f)` opens the draft of it, and the commit is given the same function as the witness its result type is read from (design 2, 5). The function is bound to a name once and read by that name twice, so a head whose evaluation can be seen prints once. The whole output is compared, so a lowering that evaluated the head twice would fail this case; the block still commits, and the answer is the committed function's."
kind = "behavior"
case = "../../cases/probe/editview/head_evaluated_once.cml"
args = ["${case}", "std::nvm"]
backends = ["nvm"]
expect_exit = 0
expect_stdout_exact = "head called\nblock= 10\n"
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.view_value_is_the_body"
desc = "`view d = f { f }` where the function type is expected: a view block's value is its body's value, so this passes."
kind = "behavior"
case = "../../cases/probe/editview/view_value.cml"
args = ["check", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.view_value_is_not_an_int"
desc = "The other side: the same view block where an `int` is expected is refused, so the body's value is what is pinned."
kind = "behavior"
case = "../../cases/probe/editview/view_value_is_not_an_int.cml"
args = ["check", "${case}"]
expect_exit = 1
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.view_semantic"
desc = "`view d = f { f }` through the semantic check: a view block's value is the body's value, so this is the smallest block whose type is decided."
kind = "behavior"
case = "../../cases/probe/editview/view_only.cml"
args = ["check", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.sec2_fold"
desc = "Design section 2, example 1 (`fold_zero_adds`): an edit block over `nodes`, `filter`, `foreach` and `replace`."
kind = "behavior"
case = "../../cases/probe/editview/sec2_fold.cml"
args = ["check", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.sec2_log"
desc = "Design section 2, example 2 (`log_result`): the block head writes the new function type, and the body reads the exit, inlines a writing function and replaces the exit."
kind = "behavior"
case = "../../cases/probe/editview/sec2_log.cml"
args = ["check", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.sec2_count"
desc = "Design section 2, example 3 (`count_muls`): a view block whose value is the body's value."
kind = "behavior"
case = "../../cases/probe/editview/sec2_count.cml"
args = ["check", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.sec12_step"
desc = "Design section 12, first example: the two edit steps, the second of which the document says is refused at once."
kind = "behavior"
case = "../../cases/probe/editview/sec12_step.cml"
args = ["check", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.sec12_escape"
desc = "Design section 12, second example: the handle leaving its view block and the `replace` written outside any edit block. **Unverified so far**: while no `edit`/`view` block is accepted by `check`, every case here exits 1, so an expectation of exit 1 is met whatever the reason — it says nothing about the escape rule until the blocks compile."
kind = "behavior"
case = "../../cases/probe/editview/sec12_escape.cml"
args = ["check", "${case}"]
expect_exit = 1
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.view_value_is_a_plain_value"
desc = "A `view` block whose body ends in a plain value stands for that value (design 15.1, 4.5): the block is an `int` where it is written, not the closure its body was put in. The position is written as `let n: int` so the reading is the declared one."
kind = "behavior"
case = "../../cases/probe/editview/view_value_is_a_plain_value.cml"
args = ["check", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
[[tests]]
name = "editview.root_observable_as_graph"
desc = "`view d = inc { nodes(d) }`: the name a view block's head binds is the block's root, the graph its body reads (design 15.1), so `nodes` -- which takes a `Graph` -- reads it. The name is not the function the block is over."
kind = "behavior"
case = "../../cases/probe/editview/root_observable_as_graph.cml"
args = ["check", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.root_observable_as_function"
desc = "The counter-proof: the head's name is a `Graph` handle and a handle is not callable, so `view d = inc { d(2.0) }` is refused. A compiler that accepts it is reading the head's name as the function, which is the value the name must not have. The wording of the refusal is the product's own now that the name is a value of the body's scope (the head's name is the closure's parameter): `Invalid call to 'd' with argument types <> (float): the value this call stands on has type 'Graph', and that is not a function`. Same refusal, its wording updated -- not a loosened assertion."
kind = "behavior"
case = "../../cases/probe/editview/root_observable_as_function.cml"
args = ["check", "${case}"]
expect_exit = 1
expect_output_contains = ["Invalid call to 'd' with argument types"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.root_handle_in_gir"
desc = "The root handle the compiler emits is `graph_of`'s call: the block's `d` is `graph_of(f)`, so the GIR of a program with a headed block holds a node of that operator, and the reading can name it. What pins it is the operator's name in the printed graph -- the same operator a program reaches by writing `graph::graph_of`. The case is the one `view_value_is_a_plain_value` uses, whose `main` gives `std::gir` an entry to compile."
kind = "behavior"
case = "../../cases/probe/editview/view_value_is_a_plain_value.cml"
args = ["${case}", "std::gir"]
expect_exit = 0
expect_stdout_contains = ["graph_of"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000
