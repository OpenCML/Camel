id = "probe.editview_draft_type"
tier = "fast"
tags = ["probe"]
desc = "What a draft's type does: it carries the type of the function its commit makes, so committing a draft opened on one function type as another is a type error (graph-editing design 5, 6). The commit of the right type is the control, and it is read as a successful check."

[[tests]]
name = "editview.draft_of_one_type_is_not_another"
desc = "`open(f)` of a `(x: int) => int` committed as `(x: float) => float`: the draft is not of that function type, so the call names no instance and the compiler says so."
kind = "behavior"
case = "../../cases/probe/editview_b/draft_of_one_type_is_not_another.cml"
args = ["check", "${case}"]
expect_exit = 1
expect_output_contains = ["No matching function"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.a_graph_is_not_a_draft"
desc = "The other direction: `commit(graph_of(f))` and `commit::<F>(graph_of(f))` are refused, and so is committing the handle a `view` block reads. A draft is a graph, but a graph is not a draft, so no published graph reaches a commit."
kind = "behavior"
case = "../../cases/probe/editview_b/graph_is_not_a_draft.cml"
args = ["check", "${case}"]
expect_exit = 1
expect_output_contains = ["No matching function"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "editview.a_draft_commits_as_its_own_type"
desc = "The control: the same draft committed as the type it was opened with, which the compiler accepts, and with no type written at the call -- `commit(d)` reads `F` off the draft."
kind = "behavior"
case = "../../cases/probe/editview_b/draft_commits_as_its_own_type.cml"
args = ["check", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000