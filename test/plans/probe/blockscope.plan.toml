id = "probe.blockscope"
tier = "fast"
tags = ["probe"]
desc = "Where a type name imported by name is visible: in a top-level signature, in the body of a headed block, and what the compiler says when the file does not import it at all. Three readings of one question, so that a red one says which side is missing."

[[tests]]
name = "blockscope.imported_type_at_top_level"
desc = "The control: `import { Node } from graph` and a top-level function whose parameter is `Node`. If this one is red, the import itself is the question and the block's body is not."
kind = "behavior"
case = "../../cases/probe/blockscope/imported_type_at_top_level.cml"
args = ["check", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "blockscope.imported_type_in_body"
desc = "The same import, and `Node` written inside the body of an `edit` block. The body is where the name is written; nothing outside the block names a type of `graph`."
kind = "behavior"
case = "../../cases/probe/blockscope/imported_type_in_body.cml"
args = ["check", "${case}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000

[[tests]]
name = "blockscope.unimported_type_in_body"
desc = "The counter-proof: the same body, and no import. The name stays unresolved, which is what says the visibility the case above asks for is the file's import, not every module the compiler knows."
kind = "behavior"
case = "../../cases/probe/blockscope/unimported_type_in_body.cml"
args = ["check", "${case}"]
expect_exit = 1
expect_output_contains = ["Unresolved type reference: 'Node'"]
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 20000