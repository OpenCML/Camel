id = "run.jit"
tier = "regression"
tags = ["run", "jit"]

[[tests]]
name = "branch_join"
kind = "behavior"
case = "../../cases/run/jit/branch_join.cml"
args = ["${case}", "${run_jit}"]
expect_exit = 0
normalizers = ["strip_ansi", "normalize_newlines", "trim_trailing_space"]
timeout_ms = 4000

