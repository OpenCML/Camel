inspect_tok = ["inspect", "--tok"]
inspect_cst = ["inspect", "--cst"]
inspect_ast = ["inspect", "--ast"]
inspect_gir = ["inspect", "--gir"]

run_nvm = ["std::nvm"]
run_fvm = ["std::fvm"]
run_jit = ["std::jit"]
# A dump pass hands the graph on, so a run that names only one ends without an empty graph and the
# fallback `std::nvm` executes the program after the dump. `std::nop` is the step that ends the
# pipeline: it returns the empty graph, so the run prints the dump and nothing else.
run_gir = ["std::gir", "std::nop"]
run_rgir = ["std::rgir", "std::nop"]
run_prl = ["std::prl"]
run_inline_nvm = ["std::cxx::inline", "std::nvm"]
run_inline_fvm = ["std::cxx::inline", "std::fvm"]
run_inline_jit = ["std::cxx::inline", "std::jit"]
# `std::gir` / `std::rgir` hand the graph on, so an inline dump entry that ends there leaves a
# non-empty graph and the fallback `std::nvm` runs the program after the dump. `std::nop` returns the
# empty graph, so the run prints the dump and nothing else.
run_inline_gir = ["std::cxx::inline", "std::gir", "std::nop"]
run_inline_rgir = ["std::cxx::inline", "std::rgir", "std::nop"]

timeit_json = ["--output-format", "json"]
timeit_nvm_10 = ["--timeit", "std::nvm/10", "--output-format", "json"]
timeit_fvm_10 = ["--timeit", "std::fvm/10", "--output-format", "json"]
timeit_jit_10 = ["--timeit", "std::jit/10", "--output-format", "json"]
timeit_inline_nvm_10 = ["--timeit", "std::nvm/10", "--output-format", "json"]
timeit_inline_fvm_10 = ["--timeit", "std::fvm/10", "--output-format", "json"]
timeit_inline_jit_10 = ["--timeit", "std::jit/10", "--output-format", "json"]

# Pass-parameter variants (design principles 9.2): the settings that were environment variables.
run_jit_hot_threshold0 = ["std::jit hot_threshold=0"]
run_prl_fanout_all = ["std::prl fanout_all=true"]
run_prl_gc_stats1 = ["std::prl gc_stats=1"]
run_prl_gc_stats1_fanout_all = ["std::prl gc_stats=1 fanout_all=true"]
run_prl_gc_stats1_no_bytecode = ["std::prl gc_stats=1 bytecode=false"]
run_prl_no_bytecode = ["std::prl bytecode=false"]
run_prl_segments = ["std::prl segments=true"]
run_inline_jit_hot_threshold0 = ["std::cxx::inline", "std::jit hot_threshold=0"]

# The bytecode VM's own settings, printed on standard error before the program runs: one line,
# `[fastvm] config jit=<mode> hot_threshold=<n> trace_mir=<on|off> stats=<path|(none)>`. The two
# passes print the same keys, so their two lines can be read side by side.
run_fvm_config = ["std::fvm config=true"]
run_jit_config = ["std::jit config=true"]
