# Fixture of test/tools/selftest/load-class/run.mjs. It is not under test/plans.
#
# 600 ms of CPU work against a 300 ms CPU budget: the runner's CPU judgement must name the figure
# and the budget. burn.mjs spends its figure as CPU time and not as a wall-clock window, so the
# crossing does not depend on the host's load; the timeout is 30 s and is nowhere near firing (the
# work is ~0.6 s of CPU, which a loaded host turns into a couple of seconds of wall), so this is the
# CPU judgement and not the liveness bound.
id = "selftest.cpu_budget.over"
order = 1
tier = "fast"

[[tests]]
name = "cpu_budget_exceeded"
desc = "600 ms of CPU work against a 300 ms CPU budget: the budget is crossed and the run must say so."
kind = "behavior"
tool = "node"
case = "burn.mjs"
args = ["${case}", "600"]
expect_exit = 0
timeout_ms = 30000
cpu_budget_ms = 300