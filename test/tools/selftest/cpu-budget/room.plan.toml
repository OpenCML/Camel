# Fixture of test/tools/selftest/load-class/run.mjs. It is not under test/plans.
#
# The same kind of waiting as margin/tight.plan.toml, which the wall-clock margin rule fails. This
# one declares its bound as its own CPU time instead, so it must pass: the wait costs the process no
# CPU, and the wall clock is not what this test is judged on. 2 s of waiting against a 6 s timeout
# is over the runner's 4x margin by the wait alone (4 x 2 s > 6 s, whatever the host's startup
# costs), and 4 s of slack is more than node startup needs even on a busy host, so the run is not
# killed either -- the fixture is red for neither leg at any load.
id = "selftest.cpu_budget.room"
order = 1
tier = "fast"

[[tests]]
name = "cpu_budget_load_room"
desc = "2 s of waiting against a 6 s timeout and a 20 s CPU budget: the wall clock is over the 4x margin, the CPU is not, and the CPU is the bound."
kind = "behavior"
tool = "node"
case = "../load-class/sleep.mjs"
args = ["${case}", "2000"]
expect_exit = 0
timeout_ms = 6000
cpu_budget_ms = 20000