# Fixture of test/tools/selftest/run.mjs: a mark with an owner and a wall but no sentence. The owner
# says who ends the mark and the reason says where the case is stuck; neither says what the case
# prints today, so the runner would count any failure as the expected one and a different defect
# could wear this mark's name. This entry is complete in every other field on purpose: the plan must
# be refused where it is loaded, naming this file, this case and `known_fail_msg`, so the refusal is
# the field's and not an earlier one's.
id = "selftest.knownfail.no_msg"
order = 6
tier = "fast"

[[tests]]
name = "no_msg"
desc = "A marked case with an owner and a wall and no sentence: refused at load."
tool = "node"
kind = "behavior"
case = "fails.mjs"
args = ["${case}"]
expect_exit = 0
known_fail = true
known_fail_owner = "the runner self-test"
known_fail_reason = "the fixture stops at `WALL fixture=knownfail`, so the run is red on purpose"