# Fixture of test/tools/selftest/run.mjs: the same ruling from the other side. This entry names an
# owner and says nothing about where the case is stuck, so the plan must be refused where it is
# loaded, naming this file, this case and `known_fail_reason`.
id = "selftest.knownfail.no_reason"
order = 2
tier = "fast"

[[tests]]
name = "no_reason"
desc = "A marked case with an owner and no reason: refused at load."
tool = "node"
kind = "behavior"
case = "fails.mjs"
args = ["${case}"]
expect_exit = 0
known_fail = true
known_fail_owner = "the runner self-test"