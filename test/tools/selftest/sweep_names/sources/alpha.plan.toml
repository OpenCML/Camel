# Fixture of test/tools/selftest/run.mjs: one of the two plans swept by collision.plan.toml. Its
# `shapes` prints a different word from beta's, so a copy that compared against the other plan's
# back end would fail on `stdout_normalized` instead of passing by accident.
id = "selftest.sweep.collision.alpha"
order = 23
tier = "fast"

[defaults]
kind = "behavior"
args = ["${case}", "${backend}"]
normalizers = ["normalize_newlines"]
expect_exit = 0

[[tests]]
name = "shapes"
case = "alpha.cml"
backends = ["nvm", "fvm"]
backends_agree = ["exit_code", "stdout_normalized"]
expect_stdout_contains = ["alpha"]