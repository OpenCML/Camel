# Fixture of test/tools/selftest/run.mjs. It is not under test/plans: several of its tests fail on
# purpose. What each must give is asserted in run.mjs.
#
# A failure this plan asks for is written as a `known_fail` mark with the wall it is stuck on, so it
# is reported `[XFAIL]` and counted as a known failure -- the runner vocabulary for "expected to fail",
# not a second word invented here. One entry stays red on purpose and cannot be marked:
# `known_but_passes` is the fixture for "a mark that has healed is reported and must be removed", and
# marking it would be the same mistake in the other direction.
id = "selftest.matrix"
order = 1
tier = "fast"

[defaults]
tool = "node"
kind = "behavior"
case = "backend_echo.mjs"
backends = ["nvm", "fvm", "jit", "prl"]
backends_agree = ["exit_code", "stdout_normalized", "diagnostics"]
normalizers = ["normalize_newlines"]

[[tests]]
name = "agree"
args = ["${case}", "same", "${backend}"]
expect_exit = 0
expect_stdout_contains = ["42"]

[[tests]]
name = "stdout_differs"
args = ["${case}", "stdout_differs_on_jit", "${backend}"]
known_fail = ["jit"]
known_fail_owner = "the runner self-test"
known_fail_reason = "the fixture's `jit` prints 41 and the other three print 42: this entry exists to prove a per-back-end disagreement is reported (`differs from stdout_differs.nvm: stdout_normalized`)"
known_fail_msg = "differs from stdout_differs.nvm: stdout_normalized"
known_fail_note = "the fixture's jit prints 41 on purpose"

[[tests]]
name = "stdout_differs_known"
args = ["${case}", "stdout_differs_on_jit", "${backend}"]
known_fail = ["jit"]
known_fail_owner = "the runner self-test"
known_fail_reason = "the fixture's `jit` prints 41 instead of 42, which is exactly the difference this case exists to be marked for"
known_fail_msg = "differs from stdout_differs_known.nvm: stdout_normalized"
known_fail_note = "the fixture's jit prints 41"

[[tests]]
name = "known_but_passes"
args = ["${case}", "same", "${backend}"]
known_fail = ["prl"]
known_fail_owner = "the runner self-test"
known_fail_reason = "the case passes and is marked on purpose: it is the fixture for `marked known_fail on 'prl' but passes: remove the mark`"
known_fail_msg = "marked known_fail on 'prl' but passes: remove the mark"

[[tests]]
name = "column_differs"
args = ["${case}", "column_differs_on_fvm", "${backend}"]
expect_exit = 1
expect_diagnostic_name = "RuntimeDiag::DivisionByZero"
known_fail = ["fvm"]
known_fail_owner = "the runner self-test"
known_fail_reason = "the fixture's `fvm` puts the division by zero at another column: this entry exists to prove a diagnostic difference is reported (`differs from column_differs.nvm: diagnostics`), which the exit code alone would hide"
known_fail_msg = "differs from column_differs.nvm: diagnostics"
known_fail_note = "the fixture's fvm reports the same diagnostic at another column"

[[tests]]
name = "exit_differs"
args = ["${case}", "exit_differs_on_prl", "${backend}"]
known_fail = ["prl"]
known_fail_owner = "the runner self-test"
known_fail_reason = "the fixture's `prl` exits differently while printing the same text: this entry exists to prove the exit code is compared (`differs from exit_differs.nvm: exit_code`)"
known_fail_msg = "differs from exit_differs.nvm: exit_code"
known_fail_note = "the fixture's prl exits 0 where nvm exits 1"

[[tests]]
name = "fields_not_listed"
desc = "Only the listed fields are compared."
args = ["${case}", "stdout_differs_on_jit", "${backend}"]
backends_agree = ["exit_code"]

[[tests]]
name = "starts_with"
desc = "expect_stdout_starts_with: the text must come first, not merely appear."
backends = false
args = ["${case}", "same", "std::nvm"]
expect_stdout_starts_with = "42\n"

[[tests]]
name = "starts_with_fails"
backends = false
args = ["${case}", "same", "std::nvm"]
expect_stdout_starts_with = "2\n"
known_fail = true
known_fail_owner = "the runner self-test"
known_fail_reason = "this entry exists to prove `expect_stdout_starts_with` is not a substring test: the program prints forty-two and the assertion asks that the output start with a two"
known_fail_msg = 'stdout does not start with "2\n"'

[[tests]]
name = "exact"
desc = "expect_stdout_exact compares the whole normalized stdout, not a substring of it."
backends = false
args = ["${case}", "same", "std::nvm"]
expect_stdout_exact = "42\n"

[[tests]]
name = "exact_fails"
desc = "A trailing space is a difference: the whole output is compared, byte for byte after normalizers."
backends = false
args = ["${case}", "same", "std::nvm"]
expect_stdout_exact = "42 \n"
known_fail = true
known_fail_owner = "the runner self-test"
known_fail_reason = "this entry exists to prove `expect_stdout_exact` compares the whole output: the program prints `42` and the assertion asks for a trailing space as well"
known_fail_msg = "expect_stdout_exact differs: first difference at offset 2 (expected 4 chars, got 3 chars)"

[[tests]]
name = "exact_legacy"
desc = "expect_stdout is the legacy name of the same exact comparison, not a substring check."
backends = false
args = ["${case}", "same", "std::nvm"]
expect_stdout = "42\n"

[[tests]]
name = "plain"
desc = "An entry without backends is one test, as before; the defaults table still applies."
backends = false
args = ["${case}", "same", "std::nvm"]
expect_exit = 0

[[tests]]
name = "not_contains"
desc = "expect_stdout_not_contains: the text must be absent; a run that says nothing about something passes."
backends = false
args = ["${case}", "same", "std::nvm"]
expect_stdout_not_contains = ["PROFILE", "41"]

[[tests]]
name = "not_contains_fails"
desc = "The same assertion fails when the text is there: 42 is printed, so it is not absent."
backends = false
args = ["${case}", "same", "std::nvm"]
expect_stdout_not_contains = ["42"]
known_fail = true
known_fail_owner = "the runner self-test"
known_fail_reason = "this entry exists to prove `expect_stdout_not_contains` fails when the text is there: the program prints `42` and the assertion says it must be absent"
known_fail_msg = "stdout contains '42'"