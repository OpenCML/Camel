# Fixture of test/tools/selftest/run.mjs: a case whose own bound took it gets one more attempt, at
# the end of the run, alone, with twice the bound.
#
# The three entries are one claim each: `timeout.normal` is printed where it ran and never
# re-runs; `timeout.then_passes` runs past its bound, and the doubled bound lets the second attempt
# finish (3000 ms against a 2000 ms bound, then against 4000 ms) -- so `expect_stdout_contains`
# proves the second attempt really executed the case rather than being reported green; and
# `timeout.twice` runs past both bounds, so it stays red. The plan is not under test/plans: this
# self-test starts it by name.
id = "selftest.timeout"
order = 5
tier = "fast"

[defaults]
tool = "node"
kind = "behavior"
case = "sleep_ms.mjs"
normalizers = ["normalize_newlines"]

[[tests]]
name = "timeout.normal"
desc = "An ordinary case: it finishes well inside its bound, and its line is printed where it ran."
args = ["${case}", "0"]
timeout_ms = 2000
expect_exit = 0
expect_stdout_contains = ["waited 0 ms"]

[[tests]]
name = "timeout.then_passes"
desc = "The bound takes the first attempt; with twice the bound the second attempt finishes."
args = ["${case}", "3000"]
timeout_ms = 2000
expect_exit = 0
expect_stdout_contains = ["waited 3000 ms"]

[[tests]]
name = "timeout.twice"
desc = "It runs past both bounds: the case stays red, and its line says both attempts timed out."
args = ["${case}", "6000"]
timeout_ms = 2000
expect_exit = 0