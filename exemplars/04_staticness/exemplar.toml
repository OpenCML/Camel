title = "Staticness"
summary = "Recursion whose depth follows from the input's shape unrolls at export; tail recursion whose depth depends on input values exports as a Loop; such a recursion that is not in tail position stops the export at the recursive call."

[[runs]]
name = "run"
args = ["std::nvm"]
exit = 0
stdout = "expected/run.txt"

[[runs]]
name = "static-export"
env = ["MODE=static", "ONNX_OUT={tmp}/forward.onnx"]
exit = 0
output_contains = ["exported forward"]
onnx = "{tmp}/forward.onnx"
onnx_ops = "Slice,Reshape,Add,Slice,Reshape,Add,Slice,Reshape,Add,Identity"

[[runs]]
name = "dynamic-export"
env = ["MODE=dynamic", "ONNX_OUT={tmp}/shrink.onnx"]
exit = 0
output_contains = ["exported shrink"]
onnx = "{tmp}/shrink.onnx"
onnx_ops = "ReduceSum,Greater,If,Identity"

[[runs]]
name = "nontail-export"
env = ["MODE=nontail", "ONNX_OUT={tmp}/pile.onnx"]
exit = 1
diagnostic = "RuntimeDiag::RuntimeError"
output_contains = ["is not the last action of the function", "04_staticness/program.cml:33:37)"]
