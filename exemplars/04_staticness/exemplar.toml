title = "Staticness"
summary = "Recursion whose depth follows from the input's shape unrolls at export; tail recursion whose depth depends on input values exports as a Loop; a linear recursion (one recursive call whose result is used afterwards) exports as paired Loops; a recursion that two branches decide stops the export with a diagnostic at the recursion. Tree recursion is refused."

[[runs]]
name = "run"
args = ["std::nvm"]
exit = 0
stdout = "expected/run.txt"

[[runs]]
name = "static-export"
env = ["MODE=static", "ONNX_OUT={tmp}/forward.onnx"]
exit = 0
output_contains = ["exported forward"]
onnx = "{tmp}/forward.onnx"
onnx_ops = "Slice,Reshape,Add,Slice,Reshape,Add,Slice,Reshape,Add,Identity"

[[runs]]
name = "dynamic-export"
env = ["MODE=dynamic", "ONNX_OUT={tmp}/shrink.onnx"]
exit = 0
output_contains = ["exported shrink"]
onnx = "{tmp}/shrink.onnx"
onnx_ops = "Cast,ReduceSum,Greater,If,Identity"

[[runs]]
name = "linear-export"
env = ["MODE=linear", "ONNX_OUT={tmp}/pile.onnx"]
exit = 0
output_contains = ["exported pile"]
onnx = "{tmp}/pile.onnx"
onnx_ops = "Cast,ReduceSum,Greater,If,Identity"

[[runs]]
name = "nontail-export"
env = ["MODE=nontail", "ONNX_OUT={tmp}/settle.onnx"]
exit = 1
diagnostic = "RuntimeDiag::RuntimeError"
output_contains = ["several branches decide whether a function calls itself outside tail position", "04_staticness/program.cml:43:73)"]
