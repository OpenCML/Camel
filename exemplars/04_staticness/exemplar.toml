title = "Staticness"
summary = "Recursion whose depth follows from the input's shape unrolls at export; recursion whose depth depends on input values stops the export at the recursive call."

[[runs]]
name = "run"
args = ["std::nvm"]
exit = 0
stdout = "expected/run.txt"

[[runs]]
name = "static-export"
env = ["MODE=static", "ONNX_OUT={tmp}/forward.onnx"]
exit = 0
output_contains = ["exported forward"]
onnx = "{tmp}/forward.onnx"
onnx_ops = "Slice,Reshape,Add,Slice,Reshape,Add,Slice,Reshape,Add,Identity"

[[runs]]
name = "dynamic-export"
env = ["MODE=dynamic", "ONNX_OUT={tmp}/shrink.onnx"]
exit = 1
diagnostic = "RuntimeDiag::RuntimeError"
output_contains = ["recursion whose depth depends on the model input cannot be exported", "04_staticness/program.cml:26:33)"]
